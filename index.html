/p>\n\u003c/blockquote>\n\u003cp>第11条说明共同维护国家主权、统一和领土完整的总体责任，但不能仅根据这一表述，就直接推导所有内地国家安全法律、行政权限和程序在香港、澳门以完全相同方式适用。\n对于台湾同胞，同样应区分本条关于共同义务的规范表述，与某一具体法律的效力范围、管辖依据和执行机制。具体法律适用问题仍须依据相应法律规范判断。\u003c/p>\n\u003chr>\n\u003ch4>第六，后续条文将抽象共同义务转化为具体行为义务\u003c/h4>\n\u003cp>第11条采用高度概括的表达，而第六章进一步将其具体化。\u003c/p>\n\u003cp>第77条规定公民和组织应当履行的维护国家安全义务，包括：\u003c/p>\n\u003cul>\n\u003cli>遵守国家安全法律法规；\u003c/li>\n\u003cli>及时报告危害国家安全活动的线索；\u003c/li>\n\u003cli>如实提供所知悉的有关证据；\u003c/li>\n\u003cli>为国家安全工作提供便利条件或者其他协助；\u003c/li>\n\u003cli>向国家安全机关、公安机关和有关军事机关提供必要支持和协助；\u003c/li>\n\u003cli>保守所知悉的国家秘密；\u003c/li>\n\u003cli>履行法律、行政法规规定的其他义务。\u003c/li>\n\u003c/ul>\n\u003cp>第78条规定机关、人民团体、企业事业组织和其他社会组织承担本单位人员的国家安全教育和组织动员义务；第79条则规定企业事业组织根据国家安全工作要求配合有关部门采取相关安全措施。\u003c/p>\n\u003cp>因此：&gt; \u003cstrong>判断某一具体主体“到底应当做什么”，应当从第11条继续寻找第77—79条以及有关专门法律，而不能停留在“人人有责”的抽象表述。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 一般义务与具体行为义务必须区分〔笔记分析〕\u003c/h4>\n\u003cp>第11条属于较高程度概括的义务条款。\n它能够回答：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>哪些主体原则上具有维护国家安全的责任？\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>但通常不能单独回答：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>某个人在某一具体情况下究竟必须实施什么行为？\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>要认定某人没有履行具体国家安全义务，至少还需要判断：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>具体义务来源是什么？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>义务由谁承担？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>在什么事实条件下触发？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>要求履行什么具体行为？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>义务人客观上是否具有履行可能？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>有关机关提出要求是否具有法定职权和程序依据？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>违反义务后法律规定什么责任？\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>一般性的“维护国家安全义务”不能自行扩张为内容无限的行为要求。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>2. “支持、协助”义务也存在法律边界〔笔记分析〕\u003c/h4>\n\u003cp>第77条明确规定公民和组织应当为国家安全工作提供便利条件或者其他协助，并向有关国家安全机关、公安机关和军事机关提供必要支持和协助。\u003c/p>\n\u003cp>但这不能解释为：\u003c/p>\n\u003cblockquote>\n\u003cp>任何机关只要以“国家安全”为由提出要求，个人或者组织就当然负有无限制配合义务。\u003c/p>\n\u003c/blockquote>\n\u003cp>还应继续判断：\u003c/p>\n\u003cp>\u003cstrong>提出要求的主体是否具有权限\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>要求是否属于其法定职责范围\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>具体协助是否具有法律依据\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>范围和程度是否超过实际需要\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>是否依法保护相关权利和秘密\u003c/strong>\u003c/p>\n\u003cp>这一点应与第7条依法维护国家安全、第43条禁止越权和滥权以及第83条限制权利特别措施应以实际需要为限共同理解。\u003c/p>\n\u003chr>\n\u003ch4>3. 维护国家安全的义务与公民、组织的权利保障应当同时理解\u003c/h4>\n\u003cp>第11条强调责任和义务，但《国家安全法》并未只规定单向度的配合义务。\u003c/p>\n\u003cp>第80条规定公民和组织支持、协助国家安全工作的行为受法律保护；因本人或者近亲属的人身安全面临危险的，可以请求有关机关采取保护措施。\u003c/p>\n\u003cp>第81条规定，因支持、协助国家安全工作导致财产损失的，按照规定给予补偿；造成人身伤害或者死亡的，依法给予相应抚恤优待。\u003c/p>\n\u003cp>第82条进一步规定公民和组织有提出批评建议，以及针对国家机关及工作人员违法失职行为进行申诉、控告和检举的权利。\u003c/p>\n\u003cp>因此，本法所形成的并非单向结构，而是：\u003c/p>\n\u003cp>\u003cstrong>维护国家安全义务\u003c/strong>\u003cbr>↕\u003cbr>\u003cstrong>支持协助者保护\u003c/strong>\u003cbr>↕\u003cbr>\u003cstrong>财产补偿与人身保障\u003c/strong>\u003cbr>↕\u003cbr>\u003cstrong>监督和救济权利\u003c/strong>\u003c/p>\n\u003cp>可以概括为：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>承担维护国家安全的义务，并不意味着放弃自身依法享有的权利。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>4. 国家机关的“责任”与公民的“义务”具有不同规范结构〔笔记分析〕\u003c/h4>\n\u003cp>虽然第11条将国家机关与公民共同列入责任主体，但二者的法律关系明显不同。\u003c/p>\n\u003cp>对于公民而言，法律通常以：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“应当做什么”“不得做什么”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>规定具体义务。\u003c/p>\n\u003cp>对于国家机关而言，则首先受到职权法定原则约束：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>既有履行国家安全职责的义务，也只能在法定权限范围内采取措施。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，国家机关不能根据“维护国家安全人人有责”扩大自身职权。\u003c/p>\n\u003cp>这一点与第三章具有直接联系：\u003c/p>\n\u003cp>\u003cstrong>第11条：国家机关具有维护国家安全责任\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第35—42条：具体机关分别具有什么国家安全职权\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第43条：必须严格依法履职，不得越权、滥权\u003c/strong>\u003c/p>\n\u003cp>由此可见：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>对公民而言，义务需要法律具体化；对国家机关而言，职责同样需要法定职权具体化。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>5. 普遍义务并不意味着义务负担必须完全相同〔笔记分析〕\u003c/h4>\n\u003cp>现代国家安全风险具有高度专业性，不同主体掌握的信息、资源和能力明显不同。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cul>\n\u003cli>普通公民可能主要承担报告线索和依法协助义务；\u003c/li>\n\u003cli>企业可能需要根据其业务特点采取特定安全措施；\u003c/li>\n\u003cli>国家机关则依照职权承担管理、审查、执法等职责。\u003c/li>\n\u003c/ul>\n\u003cp>因此，“普遍义务”强调的是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>所有相关主体都进入维护国家安全的法律责任体系。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>它并不要求：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>所有主体承担完全相同的行为义务和风险负担。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这也意味着，对某项义务是否合理以及是否已经履行，应当结合主体身份、法定义务内容和具体事实条件判断。\u003c/p>\n\u003chr>\n\u003ch4>6. 港澳特别行政区的共同责任与具体法律适用机制需要区分\u003c/h4>\n\u003cp>以香港为例，《香港特别行政区基本法》第18条规定，在香港特别行政区实施的全国性法律原则上限于列入基本法附件三的法律，并由特别行政区通过公布或者立法方式实施；第23条则规定香港特别行政区应自行立法处理其中规定的维护国家安全事项。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第11条第二款确认港澳同胞共同维护国家主权、统一和领土完整的义务，并不意味着所有全国性国家安全法律当然以与内地完全相同的方式在港澳直接实施。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>具体规范如何适用，仍须结合特别行政区基本法、全国性法律列入附件三的机制以及特别行政区本地立法等制度判断。\u003c/p>\n\u003cp>这一点也与本法第40条第三款“香港特别行政区、澳门特别行政区应当履行维护国家安全的责任”相互衔接。\u003c/p>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）本条可以形成“宪法义务—一般责任—具体义务—法律责任”的完整链条\u003c/h4>\n\u003cp>理解第11条时，可以把相关规范串联起来：\u003c/p>\n\u003cp>\u003cstrong>《宪法》第52、54、55条\u003c/strong>\u003cbr>公民维护国家统一、安全以及保卫祖国的基本义务\u003cbr>↓\u003cbr>\u003cstrong>第11条\u003c/strong>\u003cbr>确立公民、国家机关和各类组织维护国家安全的普遍责任和义务\u003cbr>↓\u003cbr>\u003cstrong>第35—43条、第77—79条\u003c/strong>\u003cbr>根据不同主体具体配置国家安全职责和义务\u003cbr>↓\u003cbr>\u003cstrong>第80—82条\u003c/strong>\u003cbr>保护支持协助者并规定监督救济权利\u003cbr>↓\u003cbr>\u003cstrong>第13条及有关专门法律\u003c/strong>\u003cbr>对违反具体义务的行为依法追究法律责任\u003c/p>\n\u003chr>\n\u003ch4>（二）不同主体的规范位置可以进一步区分\u003c/h4>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>主体\u003c/th>\n\u003cth>第11条中的地位\u003c/th>\n\u003cth>后续主要规范\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>公民\u003c/strong>\u003c/td>\n\u003ctd>普遍维护国家安全义务主体\u003c/td>\n\u003ctd>第77条及有关专门法律\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>国家机关\u003c/strong>\u003c/td>\n\u003ctd>国家安全责任主体\u003c/td>\n\u003ctd>第35—43条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>武装力量\u003c/strong>\u003c/td>\n\u003ctd>国家安全责任主体\u003c/td>\n\u003ctd>第38条及相关法律\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>机关、人民团体和社会组织\u003c/strong>\u003c/td>\n\u003ctd>国家安全责任主体\u003c/td>\n\u003ctd>第78条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>企业事业组织\u003c/strong>\u003c/td>\n\u003ctd>国家安全责任主体\u003c/td>\n\u003ctd>第77—79条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>支持、协助国家安全工作的主体\u003c/strong>\u003c/td>\n\u003ctd>既承担义务又享有保护\u003c/td>\n\u003ctd>第80—82条\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>因此，阅读第11条时最重要的方法是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>先确定主体，再寻找对应的具体职责、义务和保障规范。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（三）第9条与第11条的关系\u003c/h4>\n\u003cp>第9条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>广泛动员公民和组织维护国家安全。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第11条则进一步规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>这些主体依法负有维护国家安全的责任和义务。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第9条：力量组织和工作方法\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第11条：责任和义务基础\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第77—82条：具体义务和权利\u003c/strong>\u003c/p>\n\u003cp>二者共同构成国家安全工作中“专群结合”和全民参与的规范基础。\u003c/p>\n\u003chr>\n\u003ch4>（四）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：维护国家安全主要是国家安全机关的职责。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第11条明确将公民、国家机关、武装力量、政党、人民团体、企业事业组织和其他社会组织都纳入维护国家安全的责任和义务主体范围。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：既然所有主体都有维护国家安全的义务，那么所有主体承担的义务内容相同。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第11条规定共同责任基础，具体义务依主体身份而不同。国家机关、公民、一般社会组织和企业事业组织应分别适用有关职责、义务规范。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：第11条本身可以直接要求个人提供任何信息、财产或者劳务。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第11条属于一般义务条款。具体要求仍须具有法律依据，符合相应职权、触发条件、范围和程序。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：不履行第11条所称“共同义务”，即可直接依据本条处罚。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 具体法律责任必须具有责任规范。第13条只作原则性责任衔接，具体处罚或者刑事责任仍应依据相应法律规定。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：承担国家安全义务意味着公民和组织只能配合，不能主张权利。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第80—82条同时规定保护、补偿、批评建议以及申诉、控告、检举等制度。义务与权利保障应当合并理解。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：第11条提到港澳同胞，就意味着《国家安全法》的所有条文当然直接在港澳以相同方式实施。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 共同义务与具体法律适用机制必须区分。以香港为例，全国性法律的适用还须结合基本法第18条及附件三机制、本地立法等具体制度判断。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>一般性的国家安全义务如何实现法律具体化？\u003c/strong>\u003cbr>从第11条的“人人有责”到第77—79条的具体义务，中间应满足何种明确性要求，才能使不同主体能够预见自己何时应当采取何种行动？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>公民和组织的协助义务应当如何确定边界？\u003c/strong>\u003cbr>有关机关提出信息、技术、场所或者其他协助要求时，应如何审查机关权限、义务范围、必要性以及权利保障？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家机关的国家安全责任如何与职权法定原则协调？\u003c/strong>\u003cbr>国家机关负有积极维护国家安全的职责，但又不得超越法定权限。应如何评价“未充分履职”与“越权履职”两种相反风险？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>企业的国家安全义务应如何具体化？\u003c/strong>\u003cbr>第79条要求企业事业组织配合采取相关安全措施。对于数据、网络、关键基础设施、供应链等不同领域，具体义务应如何通过专门法律进一步明确？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全义务与补偿机制如何衔接？\u003c/strong>\u003cbr>当个人或者企业履行支持、协助义务产生较大财产成本或者经营损失时，第81条及其他法律中的补偿制度应如何适用？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>特别行政区的共同国家安全责任与具体法律适用之间如何建立体系解释？\u003c/strong>\u003cbr>应如何同时理解《国家安全法》第11条、第40条以及香港、澳门基本法关于全国性法律适用和本地维护国家安全立法的不同制度安排？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何区分政治共同体意义上的“共同义务”与司法可执行的具体法律义务？\u003c/strong>\u003cbr>第二款具有高度原则性。何种义务能够直接进入具体案件中的权利义务判断，何种内容仍需通过专门法律进一步具体化？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>普遍国家安全义务如何避免责任泛化？\u003c/strong>\u003cbr>在强调社会共同参与的同时，应如何通过主体、行为、事实条件、程序和责任规范保持法律义务的明确性和可预见性？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定维护国家安全的\u003cstrong>普遍责任与共同义务\u003c/strong>。第一款从主体范围入手，明确维护国家安全并非少数专门机关的职责，而是由公民、国家机关、武装力量、政党、人民团体以及各类组织共同承担；第二款则将国家主权、统一和领土完整单独提出，规定其为包括港澳同胞和台湾同胞在内的全中国人民的共同义务。\u003c/p>\n\u003cp>理解本条，需要特别区分两个层次：\u003cstrong>普遍负有维护国家安全的责任和义务 ≠ 不同主体承担完全相同的具体法律义务。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 宪法上的公民义务构成本条的重要规范基础\u003c/h4>\n\u003cp>宪法依据包括：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>《宪法》第52条：\u003c/strong> 公民有维护国家统一和全国各民族团结的义务；\u003c/li>\n\u003cli>\u003cstrong>《宪法》第54条：\u003c/strong> 公民有维护祖国安全、荣誉和利益的义务；\u003c/li>\n\u003cli>\u003cstrong>《宪法》第55条：\u003c/strong> 保卫祖国、抵抗侵略是每一个公民的神圣职责。\u003c/li>\n\u003c/ul>\n\u003cp>因此，《国家安全法》第11条是在综合性国家安全法律框架中进一步确认、展开宪法上的国家统一、祖国安全和保卫祖国等义务。\u003c/p>\n\u003cp>但第11条同时具有明显的扩展：&gt; \u003cstrong>宪法相关条款主要从“公民”角度规定基本义务，第11条则进一步明确国家机关、武装力量、政党、人民团体、企业事业组织和其他社会组织同样承担维护国家安全的责任和义务。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>2. 2014年12月草案阶段已经确立“国家安全人人有责”的基本结构\u003c/h4>\n\u003cp>乔晓阳主编《中华人民共和国国家安全法释义》附录二第377页所载2014年12月22日国家安全法草案说明，在“关于公民、组织的权利义务”部分已经明确提出：\u003c/p>\n\u003cul>\n\u003cli>公民和组织负有维护国家安全的义务；\u003c/li>\n\u003cli>强调“国家安全人人有责”；\u003c/li>\n\u003cli>中国的主权和领土完整不容分割；\u003c/li>\n\u003cli>维护国家主权、统一和领土完整是包括港澳同胞和台湾同胞在内的全体中国人民的共同义务；\u003c/li>\n\u003cli>草案还进一步规定公民和组织的一般义务、机关和单位的教育动员义务以及企业事业组织的相关义务。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，维护国家安全的义务主体具有广泛性\u003c/h4>\n\u003cp>第一款首先从主体范围确立维护国家安全的普遍责任。条文列举：\u003c/p>\n\u003cul>\n\u003cli>中华人民共和国公民；\u003c/li>\n\u003cli>一切国家机关；\u003c/li>\n\u003cli>武装力量；\u003c/li>\n\u003cli>各政党；\u003c/li>\n\u003cli>各人民团体；\u003c/li>\n\u003cli>企业事业组织；\u003c/li>\n\u003cli>其他社会组织。\n这一规定最直接的制度意义是：\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>维护国家安全并非国家安全机关或者公安机关的专属事务。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第9条已经要求“充分发挥专门机关和其他有关机关维护国家安全的职能作用，广泛动员公民和组织”，第11条则进一步从责任和义务角度确定广泛主体基础。\n因此可以形成：\n\u003cstrong>第9条：如何组织国家安全力量\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第11条：哪些主体负有维护国家安全的责任和义务\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>第二，“共同责任”并不意味着所有主体承担相同的具体义务\u003c/h4>\n\u003cp>这是理解第11条最重要的解释边界。\n虽然第一款将不同主体共同纳入维护国家安全的责任体系，但各主体的法律地位、能力和职责明显不同，因此具体义务不能简单等同。\n例如：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>主体\u003c/th>\n\u003cth>主要规范形态\u003c/th>\n\u003cth>关联规定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>国家机关\u003c/strong>\u003c/td>\n\u003ctd>依照法定职权履行国家安全职责\u003c/td>\n\u003ctd>第35—43条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>公民和组织\u003c/strong>\u003c/td>\n\u003ctd>报告线索、提供证据、支持协助、保守秘密等\u003c/td>\n\u003ctd>第77条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>机关、人民团体、企业事业组织等单位\u003c/strong>\u003c/td>\n\u003ctd>对本单位人员开展国家安全教育，组织防范和制止危害国家安全行为\u003c/td>\n\u003ctd>第78条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>企业事业组织\u003c/strong>\u003c/td>\n\u003ctd>根据国家安全工作要求配合有关部门采取相关安全措施\u003c/td>\n\u003ctd>第79条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>支持、协助国家安全工作的公民和组织\u003c/strong>\u003c/td>\n\u003ctd>同时享有保护、补偿以及监督救济等权利\u003c/td>\n\u003ctd>第80—82条\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>现行《国家安全法》第77—82条明确规定了上述义务、保护和监督救济机制。\n因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第11条提供共同的责任基础，后续条文再根据主体类型将这一责任具体化。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三，应当区分“维护国家安全的责任”与“不履行义务后的法律责任”\u003c/h4>\n\u003cp>第11条使用的是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“责任和义务”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>而第13条规定的是违反法律或者不履行维护国家安全义务以后：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“依法追究法律责任”。\u003c/strong>\n二者不能混为一谈。\n第11条中的“责任”主要用于表达不同主体在国家安全体系中承担维护国家安全的规范责任；第13条中的“法律责任”则指违反法定义务以后可能产生的不利法律后果。\n因此可以区分为：\n\u003cstrong>第11条：应当承担什么责任和义务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第77—79条等：义务的具体内容是什么\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第13条及有关法律：违反义务后承担何种法律责任\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第13条明确规定，个人和组织违反本法和有关法律、不履行维护国家安全义务或者从事危害国家安全活动的，依法追究法律责任。\n但第13条本身同样属于原则性的责任衔接规范。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>究竟承担行政责任、刑事责任、民事责任或者其他法律后果，仍须依据相应的具体责任规范判断。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第四，第二款特别强调国家主权、统一和领土完整\u003c/h4>\n\u003cp>第一款规定一般性的国家安全责任和义务，第二款则从国家安全的各种保护利益中，特别提出：\n\u003cstrong>主权 + 统一 + 领土完整\u003c/strong>\n这一结构与第2条国家安全定义存在直接联系。第2条将国家政权、主权、统一和领土完整列于国家安全保护利益之中，第11条进一步从全体人民共同义务的角度强调其中的主权、统一和领土完整。\n这种专门强调也与《宪法》第52条维护国家统一义务、第54条维护祖国安全利益义务和第55条保卫祖国职责形成体系联系。\n因此，本条内部可以区分：\u003c/p>\n\u003cp>\u003cstrong>第一款：一般国家安全责任\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第二款：主权、统一和领土完整领域的共同义务\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>第五，第二款明确将港澳同胞和台湾同胞纳入共同义务的表述\u003c/h4>\n\u003cp>第二款明确规定：\u003c/p>\n\u003cblockquote>\n\u003cp>维护国家主权、统一和领土完整，是包括港澳同胞和台湾同胞在内的全中国人民的共同义务。\u003c/p>\n\u003c/blockquote>\n\u003cp>第11条说明共同维护国家主权、统一和领土完整的总体责任，但不能仅根据这一表述，就直接推导所有内地国家安全法律、行政权限和程序在香港、澳门以完全相同方式适用。\n对于台湾同胞，同样应区分本条关于共同义务的规范表述，与某一具体法律的效力范围、管辖依据和执行机制。具体法律适用问题仍须依据相应法律规范判断。\u003c/p>\n\u003chr>\n\u003ch4>第六，后续条文将抽象共同义务转化为具体行为义务\u003c/h4>\n\u003cp>第11条采用高度概括的表达，而第六章进一步将其具体化。\u003c/p>\n\u003cp>第77条规定公民和组织应当履行的维护国家安全义务，包括：\u003c/p>\n\u003cul>\n\u003cli>遵守国家安全法律法规；\u003c/li>\n\u003cli>及时报告危害国家安全活动的线索；\u003c/li>\n\u003cli>如实提供所知悉的有关证据；\u003c/li>\n\u003cli>为国家安全工作提供便利条件或者其他协助；\u003c/li>\n\u003cli>向国家安全机关、公安机关和有关军事机关提供必要支持和协助；\u003c/li>\n\u003cli>保守所知悉的国家秘密；\u003c/li>\n\u003cli>履行法律、行政法规规定的其他义务。\u003c/li>\n\u003c/ul>\n\u003cp>第78条规定机关、人民团体、企业事业组织和其他社会组织承担本单位人员的国家安全教育和组织动员义务；第79条则规定企业事业组织根据国家安全工作要求配合有关部门采取相关安全措施。\u003c/p>\n\u003cp>因此：&gt; \u003cstrong>判断某一具体主体“到底应当做什么”，应当从第11条继续寻找第77—79条以及有关专门法律，而不能停留在“人人有责”的抽象表述。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 一般义务与具体行为义务必须区分〔笔记分析〕\u003c/h4>\n\u003cp>第11条属于较高程度概括的义务条款。\n它能够回答：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>哪些主体原则上具有维护国家安全的责任？\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>但通常不能单独回答：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>某个人在某一具体情况下究竟必须实施什么行为？\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>要认定某人没有履行具体国家安全义务，至少还需要判断：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>具体义务来源是什么？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>义务由谁承担？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>在什么事实条件下触发？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>要求履行什么具体行为？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>义务人客观上是否具有履行可能？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>有关机关提出要求是否具有法定职权和程序依据？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>违反义务后法律规定什么责任？\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>一般性的“维护国家安全义务”不能自行扩张为内容无限的行为要求。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>2. “支持、协助”义务也存在法律边界〔笔记分析〕\u003c/h4>\n\u003cp>第77条明确规定公民和组织应当为国家安全工作提供便利条件或者其他协助，并向有关国家安全机关、公安机关和军事机关提供必要支持和协助。\u003c/p>\n\u003cp>但这不能解释为：\u003c/p>\n\u003cblockquote>\n\u003cp>任何机关只要以“国家安全”为由提出要求，个人或者组织就当然负有无限制配合义务。\u003c/p>\n\u003c/blockquote>\n\u003cp>还应继续判断：\u003c/p>\n\u003cp>\u003cstrong>提出要求的主体是否具有权限\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>要求是否属于其法定职责范围\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>具体协助是否具有法律依据\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>范围和程度是否超过实际需要\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>是否依法保护相关权利和秘密\u003c/strong>\u003c/p>\n\u003cp>这一点应与第7条依法维护国家安全、第43条禁止越权和滥权以及第83条限制权利特别措施应以实际需要为限共同理解。\u003c/p>\n\u003chr>\n\u003ch4>3. 维护国家安全的义务与公民、组织的权利保障应当同时理解\u003c/h4>\n\u003cp>第11条强调责任和义务，但《国家安全法》并未只规定单向度的配合义务。\u003c/p>\n\u003cp>第80条规定公民和组织支持、协助国家安全工作的行为受法律保护；因本人或者近亲属的人身安全面临危险的，可以请求有关机关采取保护措施。\u003c/p>\n\u003cp>第81条规定，因支持、协助国家安全工作导致财产损失的，按照规定给予补偿；造成人身伤害或者死亡的，依法给予相应抚恤优待。\u003c/p>\n\u003cp>第82条进一步规定公民和组织有提出批评建议，以及针对国家机关及工作人员违法失职行为进行申诉、控告和检举的权利。\u003c/p>\n\u003cp>因此，本法所形成的并非单向结构，而是：\u003c/p>\n\u003cp>\u003cstrong>维护国家安全义务\u003c/strong>\u003cbr>↕\u003cbr>\u003cstrong>支持协助者保护\u003c/strong>\u003cbr>↕\u003cbr>\u003cstrong>财产补偿与人身保障\u003c/strong>\u003cbr>↕\u003cbr>\u003cstrong>监督和救济权利\u003c/strong>\u003c/p>\n\u003cp>可以概括为：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>承担维护国家安全的义务，并不意味着放弃自身依法享有的权利。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>4. 国家机关的“责任”与公民的“义务”具有不同规范结构〔笔记分析〕\u003c/h4>\n\u003cp>虽然第11条将国家机关与公民共同列入责任主体，但二者的法律关系明显不同。\u003c/p>\n\u003cp>对于公民而言，法律通常以：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“应当做什么”“不得做什么”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>规定具体义务。\u003c/p>\n\u003cp>对于国家机关而言，则首先受到职权法定原则约束：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>既有履行国家安全职责的义务，也只能在法定权限范围内采取措施。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，国家机关不能根据“维护国家安全人人有责”扩大自身职权。\u003c/p>\n\u003cp>这一点与第三章具有直接联系：\u003c/p>\n\u003cp>\u003cstrong>第11条：国家机关具有维护国家安全责任\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第35—42条：具体机关分别具有什么国家安全职权\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第43条：必须严格依法履职，不得越权、滥权\u003c/strong>\u003c/p>\n\u003cp>由此可见：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>对公民而言，义务需要法律具体化；对国家机关而言，职责同样需要法定职权具体化。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>5. 普遍义务并不意味着义务负担必须完全相同〔笔记分析〕\u003c/h4>\n\u003cp>现代国家安全风险具有高度专业性，不同主体掌握的信息、资源和能力明显不同。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cul>\n\u003cli>普通公民可能主要承担报告线索和依法协助义务；\u003c/li>\n\u003cli>企业可能需要根据其业务特点采取特定安全措施；\u003c/li>\n\u003cli>国家机关则依照职权承担管理、审查、执法等职责。\u003c/li>\n\u003c/ul>\n\u003cp>因此，“普遍义务”强调的是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>所有相关主体都进入维护国家安全的法律责任体系。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>它并不要求：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>所有主体承担完全相同的行为义务和风险负担。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这也意味着，对某项义务是否合理以及是否已经履行，应当结合主体身份、法定义务内容和具体事实条件判断。\u003c/p>\n\u003chr>\n\u003ch4>6. 港澳特别行政区的共同责任与具体法律适用机制需要区分\u003c/h4>\n\u003cp>以香港为例，《香港特别行政区基本法》第18条规定，在香港特别行政区实施的全国性法律原则上限于列入基本法附件三的法律，并由特别行政区通过公布或者立法方式实施；第23条则规定香港特别行政区应自行立法处理其中规定的维护国家安全事项。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第11条第二款确认港澳同胞共同维护国家主权、统一和领土完整的义务，并不意味着所有全国性国家安全法律当然以与内地完全相同的方式在港澳直接实施。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>具体规范如何适用，仍须结合特别行政区基本法、全国性法律列入附件三的机制以及特别行政区本地立法等制度判断。\u003c/p>\n\u003cp>这一点也与本法第40条第三款“香港特别行政区、澳门特别行政区应当履行维护国家安全的责任”相互衔接。\u003c/p>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）本条可以形成“宪法义务—一般责任—具体义务—法律责任”的完整链条\u003c/h4>\n\u003cp>理解第11条时，可以把相关规范串联起来：\u003c/p>\n\u003cp>\u003cstrong>《宪法》第52、54、55条\u003c/strong>\u003cbr>公民维护国家统一、安全以及保卫祖国的基本义务\u003cbr>↓\u003cbr>\u003cstrong>第11条\u003c/strong>\u003cbr>确立公民、国家机关和各类组织维护国家安全的普遍责任和义务\u003cbr>↓\u003cbr>\u003cstrong>第35—43条、第77—79条\u003c/strong>\u003cbr>根据不同主体具体配置国家安全职责和义务\u003cbr>↓\u003cbr>\u003cstrong>第80—82条\u003c/strong>\u003cbr>保护支持协助者并规定监督救济权利\u003cbr>↓\u003cbr>\u003cstrong>第13条及有关专门法律\u003c/strong>\u003cbr>对违反具体义务的行为依法追究法律责任\u003c/p>\n\u003chr>\n\u003ch4>（二）不同主体的规范位置可以进一步区分\u003c/h4>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>主体\u003c/th>\n\u003cth>第11条中的地位\u003c/th>\n\u003cth>后续主要规范\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>公民\u003c/strong>\u003c/td>\n\u003ctd>普遍维护国家安全义务主体\u003c/td>\n\u003ctd>第77条及有关专门法律\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>国家机关\u003c/strong>\u003c/td>\n\u003ctd>国家安全责任主体\u003c/td>\n\u003ctd>第35—43条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>武装力量\u003c/strong>\u003c/td>\n\u003ctd>国家安全责任主体\u003c/td>\n\u003ctd>第38条及相关法律\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>机关、人民团体和社会组织\u003c/strong>\u003c/td>\n\u003ctd>国家安全责任主体\u003c/td>\n\u003ctd>第78条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>企业事业组织\u003c/strong>\u003c/td>\n\u003ctd>国家安全责任主体\u003c/td>\n\u003ctd>第77—79条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>支持、协助国家安全工作的主体\u003c/strong>\u003c/td>\n\u003ctd>既承担义务又享有保护\u003c/td>\n\u003ctd>第80—82条\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>因此，阅读第11条时最重要的方法是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>先确定主体，再寻找对应的具体职责、义务和保障规范。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（三）第9条与第11条的关系\u003c/h4>\n\u003cp>第9条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>广泛动员公民和组织维护国家安全。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第11条则进一步规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>这些主体依法负有维护国家安全的责任和义务。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第9条：力量组织和工作方法\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第11条：责任和义务基础\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第77—82条：具体义务和权利\u003c/strong>\u003c/p>\n\u003cp>二者共同构成国家安全工作中“专群结合”和全民参与的规范基础。\u003c/p>\n\u003chr>\n\u003ch4>（四）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：维护国家安全主要是国家安全机关的职责。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第11条明确将公民、国家机关、武装力量、政党、人民团体、企业事业组织和其他社会组织都纳入维护国家安全的责任和义务主体范围。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：既然所有主体都有维护国家安全的义务，那么所有主体承担的义务内容相同。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第11条规定共同责任基础，具体义务依主体身份而不同。国家机关、公民、一般社会组织和企业事业组织应分别适用有关职责、义务规范。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：第11条本身可以直接要求个人提供任何信息、财产或者劳务。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第11条属于一般义务条款。具体要求仍须具有法律依据，符合相应职权、触发条件、范围和程序。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：不履行第11条所称“共同义务”，即可直接依据本条处罚。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 具体法律责任必须具有责任规范。第13条只作原则性责任衔接，具体处罚或者刑事责任仍应依据相应法律规定。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：承担国家安全义务意味着公民和组织只能配合，不能主张权利。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第80—82条同时规定保护、补偿、批评建议以及申诉、控告、检举等制度。义务与权利保障应当合并理解。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：第11条提到港澳同胞，就意味着《国家安全法》的所有条文当然直接在港澳以相同方式实施。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 共同义务与具体法律适用机制必须区分。以香港为例，全国性法律的适用还须结合基本法第18条及附件三机制、本地立法等具体制度判断。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>一般性的国家安全义务如何实现法律具体化？\u003c/strong>\u003cbr>从第11条的“人人有责”到第77—79条的具体义务，中间应满足何种明确性要求，才能使不同主体能够预见自己何时应当采取何种行动？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>公民和组织的协助义务应当如何确定边界？\u003c/strong>\u003cbr>有关机关提出信息、技术、场所或者其他协助要求时，应如何审查机关权限、义务范围、必要性以及权利保障？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家机关的国家安全责任如何与职权法定原则协调？\u003c/strong>\u003cbr>国家机关负有积极维护国家安全的职责，但又不得超越法定权限。应如何评价“未充分履职”与“越权履职”两种相反风险？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>企业的国家安全义务应如何具体化？\u003c/strong>\u003cbr>第79条要求企业事业组织配合采取相关安全措施。对于数据、网络、关键基础设施、供应链等不同领域，具体义务应如何通过专门法律进一步明确？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全义务与补偿机制如何衔接？\u003c/strong>\u003cbr>当个人或者企业履行支持、协助义务产生较大财产成本或者经营损失时，第81条及其他法律中的补偿制度应如何适用？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>特别行政区的共同国家安全责任与具体法律适用之间如何建立体系解释？\u003c/strong>\u003cbr>应如何同时理解《国家安全法》第11条、第40条以及香港、澳门基本法关于全国性法律适用和本地维护国家安全立法的不同制度安排？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何区分政治共同体意义上的“共同义务”与司法可执行的具体法律义务？\u003c/strong>\u003cbr>第二款具有高度原则性。何种义务能够直接进入具体案件中的权利义务判断，何种内容仍需通过专门法律进一步具体化？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>普遍国家安全义务如何避免责任泛化？\u003c/strong>\u003cbr>在强调社会共同参与的同时，应如何通过主体、行为、事实条件、程序和责任规范保持法律义务的明确性和可预见性？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":12,"label":"第十二条","title":"表彰和奖励","lawText":"国家对在维护国家安全工作中作出突出贡献的个人和组织给予表彰和奖励。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>规范性质：\u003c/strong> 本条属于激励性规范，通过正向利益促进个人和组织积极参与维护国家安全，与义务规范、责任规范共同构成国家安全法的行为引导机制。\u003c/li>\n\u003cli>\u003cstrong>实施主体：\u003c/strong> 表彰和奖励由“国家”实施；具体由哪个机关作出、按照何种权限和程序进行，需要依据相应奖励制度进一步确定。\u003c/li>\n\u003cli>\u003cstrong>奖励条件：\u003c/strong> 并非只要参与国家安全工作即可获得奖励，法条要求达到“\u003cstrong>突出贡献\u003c/strong>”程度，需要评价行为对发现、防范、制止或者处置国家安全风险所发挥的实际作用。\u003c/li>\n\u003cli>\u003cstrong>奖励对象：\u003c/strong> 既包括个人，也包括组织，并不限于国家安全机关工作人员，也可以包括普通公民、企业事业组织和其他社会组织。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 第12条只作原则规定，并未统一规定奖励等级、金额、程序或者请求条件；具体奖励权利能否成立，应继续查找相应的专门奖励规范。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家对在维护国家安全工作中作出突出贡献的个人和组织给予表彰和奖励。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>规范性质：\u003c/strong> 本条属于激励性规范，通过正向利益促进个人和组织积极参与维护国家安全，与义务规范、责任规范共同构成国家安全法的行为引导机制。\u003c/li>\n\u003cli>\u003cstrong>实施主体：\u003c/strong> 表彰和奖励由“国家”实施；具体由哪个机关作出、按照何种权限和程序进行，需要依据相应奖励制度进一步确定。\u003c/li>\n\u003cli>\u003cstrong>奖励条件：\u003c/strong> 并非只要参与国家安全工作即可获得奖励，法条要求达到“\u003cstrong>突出贡献\u003c/strong>”程度，需要评价行为对发现、防范、制止或者处置国家安全风险所发挥的实际作用。\u003c/li>\n\u003cli>\u003cstrong>奖励对象：\u003c/strong> 既包括个人，也包括组织，并不限于国家安全机关工作人员，也可以包括普通公民、企业事业组织和其他社会组织。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 第12条只作原则规定，并未统一规定奖励等级、金额、程序或者请求条件；具体奖励权利能否成立，应继续查找相应的专门奖励规范。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家对在维护国家安全工作中作出突出贡献的个人和组织给予表彰和奖励。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">表彰和奖励 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定维护国家安全工作的\u003cstrong>正向激励机制\u003c/strong>。与第11条规定普遍性的责任和义务、第13条规定违法失职后的法律责任不同，第12条从激励角度，通过表彰和奖励鼓励个人、组织积极参与维护国家安全。\u003c/p>\n\u003cp>从条文结构看，可以概括为：\u003cstrong>实施主体 → 奖励对象 → 法定条件 → 激励方式\u003c/strong>\n即：\n\u003cstrong>国家 → 个人和组织 → 作出突出贡献 → 表彰和奖励\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 本条体现法律规范的正向激励功能\u003c/h4>\n\u003cp>乔晓阳主编《中华人民共和国国家安全法释义》将第12条置于法律的\u003cstrong>激励功能\u003c/strong>中加以解释。\u003c/p>\n\u003cp>法律调整社会行为并不只有禁止、命令和责任追究等方式，也可以通过赋予荣誉、物质利益或者其他积极后果，引导个人和组织实施法律所鼓励的行为。\u003c/p>\n\u003cp>从国家安全工作的制度结构看：\u003c/p>\n\u003cp>\u003cstrong>第9条：广泛动员公民和组织参与\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第11条：规定维护国家安全的责任和义务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第12条：对突出贡献给予表彰和奖励\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第13条：对违法失职依法追究法律责任\u003c/strong>\u003c/p>\n\u003cp>由此形成：\u003cstrong>义务约束 + 正向激励 + 责任追究\u003c/strong>三种不同的行为调整机制。\u003c/p>\n\u003cp>合理设置和运用激励措施，有助于调动个人和组织参与维护国家安全工作的积极性、主动性和创造性，并增强法律实施的社会效果。\u003c/p>\n\u003chr>\n\u003ch4>2. 国家安全奖励制度与既有国家奖励制度相衔接\u003c/h4>\n\u003cp>第12条本身仅作原则性规定，没有建立一套独立、完整的奖励程序。\u003c/p>\n\u003cp>乔晓阳主编《中华人民共和国国家安全法释义》在解释本条时特别联系《公务员法》奖励制度，说明表彰奖励通常还涉及：\u003c/p>\n\u003cul>\n\u003cli>奖励条件；\u003c/li>\n\u003cli>奖励种类；\u003c/li>\n\u003cli>决定或者审批权限；\u003c/li>\n\u003cli>奖励程序；\u003c/li>\n\u003cli>奖励的撤销等。\u003c/li>\n\u003c/ul>\n\u003cp>2018年修订后的现行《公务员法》已经调整条文序号：现行第51条规定公务员奖励的一般原则，第53条规定嘉奖、记三等功、记二等功、记一等功、授予称号等形式，第54条明确奖励应按照规定权限和程序决定或者审批。现行法仍然坚持精神奖励与物质奖励相结合、以精神奖励为主。\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，表彰和奖励的实施主体是“国家”\u003c/h4>\n\u003cp>本条明确规定：\u003cstrong>“国家对……个人和组织给予表彰和奖励。”\u003c/strong>\u003c/p>\n\u003cp>这意味着本条规定的是一种具有公法性质的国家奖励制度，与企业、协会、媒体或者其他社会主体自行实施的表扬、奖励有所区别。\u003c/p>\n\u003cp>但是，“国家”属于总体性的主体表述，并没有回答：\u003c/p>\n\u003cblockquote>\n\u003cp>具体由哪个国家机关作出奖励决定？\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，在具体制度中还需要继续确定：\u003c/p>\n\u003cul>\n\u003cli>哪个机关具有奖励权限；\u003c/li>\n\u003cli>哪一级机关可以决定何种奖励；\u003c/li>\n\u003cli>是否需要申报、审核或者审批；\u003c/li>\n\u003cli>奖励经费从何种渠道列支；\u003c/li>\n\u003cli>对奖励决定如何进行监督。\u003c/li>\n\u003c/ul>\n\u003cp>所以：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第12条确立国家奖励原则，具体奖励权限仍须由专门规范进一步配置。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二，奖励对象包括“个人”和“组织”\u003c/h4>\n\u003cp>本条的奖励对象具有广泛性。\u003c/p>\n\u003cp>所谓“个人”，既可能是承担国家安全职责的国家机关工作人员，也可能是普通公民或者其他依法参与国家安全工作的人员。\u003c/p>\n\u003cp>所谓“组织”，则可能包括：\u003c/p>\n\u003cul>\n\u003cli>国家机关中的有关集体；\u003c/li>\n\u003cli>企业事业组织；\u003c/li>\n\u003cli>人民团体；\u003c/li>\n\u003cli>其他社会组织等。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第三，获得表彰奖励的法定条件是“突出贡献”\u003c/h4>\n\u003cp>第12条设置：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“作出突出贡献”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这一限定具有重要意义。\u003c/p>\n\u003cp>它表明：\u003c/p>\n\u003cp>\u003cstrong>履行一般义务 ≠ 当然获得国家奖励\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>普通参与 ≠ 当然构成突出贡献\u003c/strong>\u003c/p>\n\u003cp>奖励需要以行为实际产生的贡献程度为基础进行评价。\u003c/p>\n\u003cp>可以将“突出贡献”的评价重点理解为：\u003c/p>\n\u003cul>\n\u003cli>是否帮助发现重要国家安全风险；\u003c/li>\n\u003cli>是否对防范危害发挥明显作用；\u003c/li>\n\u003cli>是否有效制止危害国家安全行为；\u003c/li>\n\u003cli>是否在重大国家安全工作中作出重要贡献；\u003c/li>\n\u003cli>是否产生较为显著的实际效果或者示范意义。\u003c/li>\n\u003c/ul>\n\u003cp>但这里需要特别注意：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“突出贡献”的判断应以实际贡献为核心，而不能自行增加法条没有规定的形式条件。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>例如，国家安全工作本身可能涉及保密要求，因此不能将：\u003c/p>\n\u003cblockquote>\n\u003cp>“事迹已经公开并产生广泛社会影响”\u003c/p>\n\u003c/blockquote>\n\u003cp>自行设定为获得第12条奖励的必要条件。\u003c/p>\n\u003chr>\n\u003ch4>第四，“突出贡献”意味着奖励具有一定程度的评价判断〔笔记分析〕\u003c/h4>\n\u003cp>“突出”本身属于具有评价性的法律用语。\u003c/p>\n\u003cp>同样是提供国家安全线索，不同情形的贡献程度可能明显不同。例如：\u003c/p>\n\u003cul>\n\u003cli>信息是否真实准确；\u003c/li>\n\u003cli>是否为有关机关原先没有掌握的重要信息；\u003c/li>\n\u003cli>对发现风险是否发挥关键作用；\u003c/li>\n\u003cli>是否实际防止或者减少重大损害；\u003c/li>\n\u003cli>行为与最终国家安全效果之间的关联程度如何。\u003c/li>\n\u003c/ul>\n\u003cp>因此，国家奖励制度通常需要建立一定的分级评价机制。\u003c/p>\n\u003cp>但行政机关在评价“突出贡献”时并非完全自由决定。\u003c/p>\n\u003cp>仍然需要受到：\u003cstrong>法律和规章规定的条件 + 奖励标准 + 权限程序 + 客观事实\u003c/strong>的约束。\u003c/p>\n\u003chr>\n\u003ch4>第五，“表彰”和“奖励”体现精神激励与物质激励的结合\u003c/h4>\n\u003cp>甲书将奖励方式概括为精神奖励与物质奖励两个方面。\u003c/p>\n\u003cp>\u003cstrong>精神激励\u003c/strong>可能表现为：\u003c/p>\n\u003cul>\n\u003cli>表彰；\u003c/li>\n\u003cli>嘉奖；\u003c/li>\n\u003cli>授予称号；\u003c/li>\n\u003cli>颁发证书等。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>物质激励\u003c/strong>则可能表现为：\u003c/p>\n\u003cul>\n\u003cli>奖金；\u003c/li>\n\u003cli>其他物质待遇等。\u003c/li>\n\u003c/ul>\n\u003cp>“表彰和奖励”体现制度层面对不同激励形式的结合，具体案件采取何种奖励方式，应依据适用的专门规则确定。\u003c/p>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 第12条体现法律的正向激励功能\u003c/h4>\n\u003cp>法律规范常见的行为调整结构包括：\u003c/p>\n\u003cp>\u003cstrong>命令：要求实施特定行为\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>禁止：要求不得实施特定行为\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>制裁：违法后承担不利法律后果\u003c/strong>\u003c/p>\n\u003cp>第12条则体现另一种调整方式：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>通过有利法律后果鼓励法律所期待的行为。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，可以将第11—13条理解为三种规范机制相互配合：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>条文\u003c/th>\n\u003cth>主要功能\u003c/th>\n\u003cth>行为机制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>第11条\u003c/strong>\u003c/td>\n\u003ctd>确立责任和义务\u003c/td>\n\u003ctd>义务规范\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>第12条\u003c/strong>\u003c/td>\n\u003ctd>鼓励突出贡献\u003c/td>\n\u003ctd>激励规范\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>第13条\u003c/strong>\u003c/td>\n\u003ctd>追究违法失职责任\u003c/td>\n\u003ctd>制裁规范\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>这种“义务—激励—责任”结构，使国家安全法不仅通过强制方式实现规范目的，也通过正向利益促进自愿参与和积极履行。\u003c/p>\n\u003chr>\n\u003ch4>2. 奖励与履行法定义务之间不能简单画等号〔笔记分析〕\u003c/h4>\n\u003cp>公民和组织根据第11条、第77条等规定，本身可能负有报告、支持、协助等维护国家安全的法定义务。\u003c/p>\n\u003cp>如果某人仅完成一般法律义务，并不因此当然满足第12条“突出贡献”的条件。\u003c/p>\n\u003cp>可以区分：\u003c/p>\n\u003cp>\u003cstrong>一般义务的正常履行\u003c/strong>\u003cbr>→ 属于法律要求的行为；\u003c/p>\n\u003cp>\u003cstrong>超过一般程度、产生显著实际作用的行为\u003c/strong>\u003cbr>→ 才可能进一步进入“突出贡献”的奖励评价。\u003c/p>\n\u003cp>但具体制度也可以根据法律和规章设置更具体的奖励条件。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>奖励制度是在一般义务基础上的积极激励机制，而不是所有法定义务履行行为的自动对价。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>3. 奖励、保护、补偿和抚恤属于不同制度\u003c/h4>\n\u003cp>这是第12条非常容易混淆的一组关系。\u003c/p>\n\u003cp>\u003cstrong>奖励\u003c/strong>主要针对：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>行为人作出了突出贡献。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>其功能是肯定和激励。\u003c/p>\n\u003cp>\u003cstrong>保护\u003c/strong>主要针对：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>行为人因支持、协助国家安全工作而面临人身安全风险。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第80条规定有关机关应依法采取保护措施。\u003c/p>\n\u003cp>\u003cstrong>补偿\u003c/strong>主要针对：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>支持、协助国家安全工作造成财产损失。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第81条规定按照国家有关规定给予补偿。\u003c/p>\n\u003cp>\u003cstrong>抚恤优待\u003c/strong>主要针对：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>因支持、协助国家安全工作造成人身伤害或者死亡。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>其功能在于处理由国家安全工作产生的损失或者特别牺牲。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>奖励：针对贡献\u003c/strong>\u003cbr>\u003cstrong>保护：针对危险\u003c/strong>\u003cbr>\u003cstrong>补偿：针对财产损失\u003c/strong>\u003cbr>\u003cstrong>抚恤：针对人身伤亡\u003c/strong>\u003c/p>\n\u003cp>四者的规范目的不同。\u003c/p>\n\u003cp>所以：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>给予奖金并不意味着保护义务、补偿义务或者抚恤义务已经履行。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>同一主体在满足不同条件时，也可能分别适用不同制度。\u003c/p>\n\u003chr>\n\u003ch4>4. 奖励决定仍应遵守权限和程序〔笔记分析〕\u003c/h4>\n\u003cp>第12条虽然是有利于个人或者组织的激励性规定，但国家作出奖励决定仍属于制度化的公权力活动，需要遵守相应权限和程序。\u003c/p>\n\u003cp>以公务员奖励制度说明：\u003c/p>\n\u003cul>\n\u003cli>奖励主体需要具有权限；\u003c/li>\n\u003cli>不同等级奖励可能具有不同审批主体；\u003c/li>\n\u003cli>奖励需要按照规定程序实施。\u003c/li>\n\u003c/ul>\n\u003cp>现行《公务员法》第54条仍明确规定，给予公务员或者公务员集体奖励，应按照规定权限和程序决定或者审批。\u003c/p>\n\u003chr>\n\u003ch4>5. 第12条原则上不能单独产生具体金额的奖励请求权〔笔记分析〕\u003c/h4>\n\u003cp>本条只规定国家“给予表彰和奖励”，没有规定：\u003c/p>\n\u003cul>\n\u003cli>具体奖金金额；\u003c/li>\n\u003cli>奖励等级；\u003c/li>\n\u003cli>奖励认定程序；\u003c/li>\n\u003cli>奖励申请方式；\u003c/li>\n\u003cli>作出决定的期限。\u003c/li>\n\u003c/ul>\n\u003cp>因此，仅依据第12条通常无法直接推出：&gt; “某个人已经当然享有请求国家支付某一数额奖金的具体请求权。”\u003c/p>\n\u003cp>具体争议应继续判断是否存在适用于该行为的专门奖励办法，以及行为是否符合其奖励条件。\u003c/p>\n\u003cp>因此分析路径应当是：\u003c/p>\n\u003cp>\u003cstrong>第12条：有无原则性奖励依据\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>专门规范：奖励对象和条件是什么\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>具体事实：是否符合条件\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>权限程序：由谁认定和决定\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>奖励标准：可以获得何种奖励\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>6. 奖励制度不能反向鼓励违法参与〔笔记分析〕\u003c/h4>\n\u003cp>国家安全奖励旨在鼓励维护国家安全的合法行为，而不是鼓励个人为了获得奖励自行实施法律没有授权的调查或者侵犯他人权益。\u003c/p>\n\u003cp>例如，公民可以依法报告危害国家安全的线索，但不能因为期待奖励就当然获得：\u003c/p>\n\u003cul>\n\u003cli>非法侵入他人住所的权力；\u003c/li>\n\u003cli>非法获取个人信息的权力；\u003c/li>\n\u003cli>非法监听、偷拍的权力；\u003c/li>\n\u003cli>扣押他人财物或者限制他人人身自由的权力。\u003c/li>\n\u003c/ul>\n\u003cp>因此，奖励制度必须与第7条法治和人权保障原则、第9条公众参与的法定边界共同理解。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>只有合法的国家安全参与行为才能得到法律激励；奖励目的不能使违法取证或者侵权行为当然正当化。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第9、11、12条形成“参与—义务—激励”的连续结构\u003c/h4>\n\u003cp>三个条文可以连续理解：\u003c/p>\n\u003cp>\u003cstrong>第9条：广泛动员公民和组织\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第11条：个人和组织负有维护国家安全的责任和义务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第12条：对其中作出突出贡献者给予表彰和奖励\u003c/strong>\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第9条解决为什么以及如何发动社会力量，第11条解决参与主体的责任基础，第12条进一步解决对突出贡献如何形成正向激励。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（二）第12条与第80、81条应严格区分\u003c/h4>\n\u003cp>可以用一张表快速记忆：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>制度\u003c/th>\n\u003cth>条件\u003c/th>\n\u003cth>主要功能\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>第12条表彰奖励\u003c/strong>\u003c/td>\n\u003ctd>作出突出贡献\u003c/td>\n\u003ctd>正向激励\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>第80条保护\u003c/strong>\u003c/td>\n\u003ctd>因支持、协助国家安全工作面临人身危险\u003c/td>\n\u003ctd>防止损害\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>第81条补偿\u003c/strong>\u003c/td>\n\u003ctd>因支持、协助国家安全工作造成财产损失\u003c/td>\n\u003ctd>填补财产损失\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>第81条抚恤优待\u003c/strong>\u003c/td>\n\u003ctd>因支持、协助造成人身伤害或者死亡\u003c/td>\n\u003ctd>对特别损害给予保障\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>贡献、风险、损失是不同的制度触发条件。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（三）现行《公民举报危害国家安全行为奖励办法》是第12条具体化的重要实例\u003c/h4>\n\u003cp>〔后续制度发展〕\u003c/p>\n\u003cp>2022年6月6日，国家安全部公布《公民举报危害国家安全行为奖励办法》，自公布之日起施行。该办法依据《国家安全法》《反间谍法》等，对国家安全机关实施的公民举报奖励进一步规定了奖励条件、方式、标准和程序。\n该办法要求举报奖励同时满足若干具体条件，例如：\u003c/p>\n\u003cul>\n\u003cli>有明确举报对象或者具体危害国家安全行为线索、情况；\u003c/li>\n\u003cli>有关事项原则上属于国家安全机关此前未掌握或者举报人提供了更加具体详实的信息；\u003c/li>\n\u003cli>举报内容经查证属实，并对防范、制止和惩治危害国家安全行为发挥作用、作出贡献。\u003c/li>\n\u003c/ul>\n\u003cp>在奖励方式上，办法规定国家安全机关根据线索查证结果、违法行为危害程度和举报发挥作用等因素综合评估奖励等级，可以给予\u003cstrong>精神奖励或者物质奖励\u003c/strong>；精神奖励表现为颁发奖励证书，物质奖励主要表现为奖金。奖金根据贡献程度设置不同档次，特别重大贡献可以给予10万元以上奖励。\u003c/p>\n\u003cp>同时，办法还规定了奖励启动、决定、告知、领取、经费和监督等程序。例如，符合条件的举报在查证属实并依法处理后，由设区的市级以上国家安全机关按照规定启动奖励程序。:chatgpt-content-reference{index=&quot;5&quot;}\u003c/p>\n\u003cp>这一制度能够很好地说明：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第12条只是原则性激励条款，具体奖励的条件、等级、金额和程序需要通过专门规则进一步细化。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>但其适用范围也必须准确把握：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>《公民举报危害国家安全行为奖励办法》主要调整国家安全机关对公民举报危害国家安全行为实施奖励，并不等于穷尽第12条所称一切“个人和组织”“突出贡献”的奖励情形。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（四）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：只要履行了维护国家安全义务，就应当获得奖励。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第12条要求达到“突出贡献”程度。一般义务的正常履行与获得国家表彰奖励属于不同层次。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：只有国家安全机关工作人员才能成为奖励对象。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 本条明确规定奖励对象为“个人和组织”，并未限定职业身份。普通公民、有关单位和社会组织符合条件时也可能进入奖励范围。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：第12条规定了奖励，就意味着可以直接请求特定数额的奖金。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 本条没有规定具体数额、等级和程序。具体请求能否成立，应继续查找适用的奖励办法和相应事实条件。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：“表彰和奖励”意味着每一个受奖者都必须同时取得精神奖励和奖金。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 本条规定两种激励方式，甲书强调精神与物质激励相结合，但不能据此推出每一奖励个案必须同时采取两种方式。现行举报奖励办法也明确可以给予精神奖励或者物质奖励。:chatgpt-content-reference{index=&quot;7&quot;}\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：支付奖金以后，就不需要再对参与者进行保护或者补偿。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 奖励、保护、补偿和抚恤具有不同规范目的和触发条件，应当分别判断。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：为了获得国家安全奖励，可以自行采取调查和取证措施。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 奖励制度不能扩大普通个人的法定权限。参与国家安全工作的行为仍须遵守法律，不得侵犯他人合法权益。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点7：《公民举报危害国家安全行为奖励办法》就是第12条全部奖励制度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 该办法只是第12条在公民举报危害国家安全行为这一特定场景中的具体化。第12条的对象还包括“组织”，贡献形式也不限于举报。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>“突出贡献”的法律判断标准应如何形成？\u003c/strong>\u003cbr>应主要考察行为结果、风险降低程度、信息价值，还是还应考虑行为人的投入、风险承担以及不可替代性？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>第12条能否在特定条件下形成具体奖励请求权？\u003c/strong>\u003cbr>当专门奖励规章已经明确奖励条件、标准和程序，而个人完全符合条件时，其法律地位是否从一般激励对象转化为具有更具体请求基础的主体？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>奖励裁量应受到何种程序控制？\u003c/strong>\u003cbr>在贡献程度具有评价空间的情况下，是否应建立统一的事实认定、分级标准、理由说明以及异议处理机制？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全工作的保密性如何与奖励制度的公开、公平相协调？\u003c/strong>\u003cbr>某些突出贡献无法公开具体事实时，如何既保护国家秘密和受奖者安全，又保证奖励程序具有必要的公正性和可监督性？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何协调物质激励与公共义务之间的关系？\u003c/strong>\u003cbr>奖励能够提高公众参与积极性，但过度依赖奖金是否可能改变公民履行国家安全义务的行为动机？制度应如何平衡荣誉激励和物质激励？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何防止奖励机制诱发虚假或者过度举报？\u003c/strong>\u003cbr>在降低真实线索举报成本的同时，应如何通过查证机制、恶意举报责任和奖励条件防止为获取奖金而虚构或者夸大事实？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>奖励、补偿与抚恤之间发生竞合时如何处理？\u003c/strong>\u003cbr>同一主体既作出突出贡献，又因支持国家安全工作遭受财产损失或者人身损害时，能否同时适用多项制度，其计算和程序关系如何安排？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何评价国家安全奖励制度的实际效果？\u003c/strong>\u003cbr>除奖励数量和奖金规模外，是否更应考察真实有效线索比例、重大风险防范效果、公众参与质量以及权利保障状况？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定维护国家安全工作的\u003cstrong>正向激励机制\u003c/strong>。与第11条规定普遍性的责任和义务、第13条规定违法失职后的法律责任不同，第12条从激励角度，通过表彰和奖励鼓励个人、组织积极参与维护国家安全。\u003c/p>\n\u003cp>从条文结构看，可以概括为：\u003cstrong>实施主体 → 奖励对象 → 法定条件 → 激励方式\u003c/strong>\n即：\n\u003cstrong>国家 → 个人和组织 → 作出突出贡献 → 表彰和奖励\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 本条体现法律规范的正向激励功能\u003c/h4>\n\u003cp>乔晓阳主编《中华人民共和国国家安全法释义》将第12条置于法律的\u003cstrong>激励功能\u003c/strong>中加以解释。\u003c/p>\n\u003cp>法律调整社会行为并不只有禁止、命令和责任追究等方式，也可以通过赋予荣誉、物质利益或者其他积极后果，引导个人和组织实施法律所鼓励的行为。\u003c/p>\n\u003cp>从国家安全工作的制度结构看：\u003c/p>\n\u003cp>\u003cstrong>第9条：广泛动员公民和组织参与\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第11条：规定维护国家安全的责任和义务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第12条：对突出贡献给予表彰和奖励\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第13条：对违法失职依法追究法律责任\u003c/strong>\u003c/p>\n\u003cp>由此形成：\u003cstrong>义务约束 + 正向激励 + 责任追究\u003c/strong>三种不同的行为调整机制。\u003c/p>\n\u003cp>合理设置和运用激励措施，有助于调动个人和组织参与维护国家安全工作的积极性、主动性和创造性，并增强法律实施的社会效果。\u003c/p>\n\u003chr>\n\u003ch4>2. 国家安全奖励制度与既有国家奖励制度相衔接\u003c/h4>\n\u003cp>第12条本身仅作原则性规定，没有建立一套独立、完整的奖励程序。\u003c/p>\n\u003cp>乔晓阳主编《中华人民共和国国家安全法释义》在解释本条时特别联系《公务员法》奖励制度，说明表彰奖励通常还涉及：\u003c/p>\n\u003cul>\n\u003cli>奖励条件；\u003c/li>\n\u003cli>奖励种类；\u003c/li>\n\u003cli>决定或者审批权限；\u003c/li>\n\u003cli>奖励程序；\u003c/li>\n\u003cli>奖励的撤销等。\u003c/li>\n\u003c/ul>\n\u003cp>2018年修订后的现行《公务员法》已经调整条文序号：现行第51条规定公务员奖励的一般原则，第53条规定嘉奖、记三等功、记二等功、记一等功、授予称号等形式，第54条明确奖励应按照规定权限和程序决定或者审批。现行法仍然坚持精神奖励与物质奖励相结合、以精神奖励为主。\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，表彰和奖励的实施主体是“国家”\u003c/h4>\n\u003cp>本条明确规定：\u003cstrong>“国家对……个人和组织给予表彰和奖励。”\u003c/strong>\u003c/p>\n\u003cp>这意味着本条规定的是一种具有公法性质的国家奖励制度，与企业、协会、媒体或者其他社会主体自行实施的表扬、奖励有所区别。\u003c/p>\n\u003cp>但是，“国家”属于总体性的主体表述，并没有回答：\u003c/p>\n\u003cblockquote>\n\u003cp>具体由哪个国家机关作出奖励决定？\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，在具体制度中还需要继续确定：\u003c/p>\n\u003cul>\n\u003cli>哪个机关具有奖励权限；\u003c/li>\n\u003cli>哪一级机关可以决定何种奖励；\u003c/li>\n\u003cli>是否需要申报、审核或者审批；\u003c/li>\n\u003cli>奖励经费从何种渠道列支；\u003c/li>\n\u003cli>对奖励决定如何进行监督。\u003c/li>\n\u003c/ul>\n\u003cp>所以：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第12条确立国家奖励原则，具体奖励权限仍须由专门规范进一步配置。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二，奖励对象包括“个人”和“组织”\u003c/h4>\n\u003cp>本条的奖励对象具有广泛性。\u003c/p>\n\u003cp>所谓“个人”，既可能是承担国家安全职责的国家机关工作人员，也可能是普通公民或者其他依法参与国家安全工作的人员。\u003c/p>\n\u003cp>所谓“组织”，则可能包括：\u003c/p>\n\u003cul>\n\u003cli>国家机关中的有关集体；\u003c/li>\n\u003cli>企业事业组织；\u003c/li>\n\u003cli>人民团体；\u003c/li>\n\u003cli>其他社会组织等。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第三，获得表彰奖励的法定条件是“突出贡献”\u003c/h4>\n\u003cp>第12条设置：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“作出突出贡献”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这一限定具有重要意义。\u003c/p>\n\u003cp>它表明：\u003c/p>\n\u003cp>\u003cstrong>履行一般义务 ≠ 当然获得国家奖励\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>普通参与 ≠ 当然构成突出贡献\u003c/strong>\u003c/p>\n\u003cp>奖励需要以行为实际产生的贡献程度为基础进行评价。\u003c/p>\n\u003cp>可以将“突出贡献”的评价重点理解为：\u003c/p>\n\u003cul>\n\u003cli>是否帮助发现重要国家安全风险；\u003c/li>\n\u003cli>是否对防范危害发挥明显作用；\u003c/li>\n\u003cli>是否有效制止危害国家安全行为；\u003c/li>\n\u003cli>是否在重大国家安全工作中作出重要贡献；\u003c/li>\n\u003cli>是否产生较为显著的实际效果或者示范意义。\u003c/li>\n\u003c/ul>\n\u003cp>但这里需要特别注意：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“突出贡献”的判断应以实际贡献为核心，而不能自行增加法条没有规定的形式条件。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>例如，国家安全工作本身可能涉及保密要求，因此不能将：\u003c/p>\n\u003cblockquote>\n\u003cp>“事迹已经公开并产生广泛社会影响”\u003c/p>\n\u003c/blockquote>\n\u003cp>自行设定为获得第12条奖励的必要条件。\u003c/p>\n\u003chr>\n\u003ch4>第四，“突出贡献”意味着奖励具有一定程度的评价判断〔笔记分析〕\u003c/h4>\n\u003cp>“突出”本身属于具有评价性的法律用语。\u003c/p>\n\u003cp>同样是提供国家安全线索，不同情形的贡献程度可能明显不同。例如：\u003c/p>\n\u003cul>\n\u003cli>信息是否真实准确；\u003c/li>\n\u003cli>是否为有关机关原先没有掌握的重要信息；\u003c/li>\n\u003cli>对发现风险是否发挥关键作用；\u003c/li>\n\u003cli>是否实际防止或者减少重大损害；\u003c/li>\n\u003cli>行为与最终国家安全效果之间的关联程度如何。\u003c/li>\n\u003c/ul>\n\u003cp>因此，国家奖励制度通常需要建立一定的分级评价机制。\u003c/p>\n\u003cp>但行政机关在评价“突出贡献”时并非完全自由决定。\u003c/p>\n\u003cp>仍然需要受到：\u003cstrong>法律和规章规定的条件 + 奖励标准 + 权限程序 + 客观事实\u003c/strong>的约束。\u003c/p>\n\u003chr>\n\u003ch4>第五，“表彰”和“奖励”体现精神激励与物质激励的结合\u003c/h4>\n\u003cp>甲书将奖励方式概括为精神奖励与物质奖励两个方面。\u003c/p>\n\u003cp>\u003cstrong>精神激励\u003c/strong>可能表现为：\u003c/p>\n\u003cul>\n\u003cli>表彰；\u003c/li>\n\u003cli>嘉奖；\u003c/li>\n\u003cli>授予称号；\u003c/li>\n\u003cli>颁发证书等。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>物质激励\u003c/strong>则可能表现为：\u003c/p>\n\u003cul>\n\u003cli>奖金；\u003c/li>\n\u003cli>其他物质待遇等。\u003c/li>\n\u003c/ul>\n\u003cp>“表彰和奖励”体现制度层面对不同激励形式的结合，具体案件采取何种奖励方式，应依据适用的专门规则确定。\u003c/p>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 第12条体现法律的正向激励功能\u003c/h4>\n\u003cp>法律规范常见的行为调整结构包括：\u003c/p>\n\u003cp>\u003cstrong>命令：要求实施特定行为\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>禁止：要求不得实施特定行为\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>制裁：违法后承担不利法律后果\u003c/strong>\u003c/p>\n\u003cp>第12条则体现另一种调整方式：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>通过有利法律后果鼓励法律所期待的行为。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，可以将第11—13条理解为三种规范机制相互配合：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>条文\u003c/th>\n\u003cth>主要功能\u003c/th>\n\u003cth>行为机制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>第11条\u003c/strong>\u003c/td>\n\u003ctd>确立责任和义务\u003c/td>\n\u003ctd>义务规范\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>第12条\u003c/strong>\u003c/td>\n\u003ctd>鼓励突出贡献\u003c/td>\n\u003ctd>激励规范\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>第13条\u003c/strong>\u003c/td>\n\u003ctd>追究违法失职责任\u003c/td>\n\u003ctd>制裁规范\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>这种“义务—激励—责任”结构，使国家安全法不仅通过强制方式实现规范目的，也通过正向利益促进自愿参与和积极履行。\u003c/p>\n\u003chr>\n\u003ch4>2. 奖励与履行法定义务之间不能简单画等号〔笔记分析〕\u003c/h4>\n\u003cp>公民和组织根据第11条、第77条等规定，本身可能负有报告、支持、协助等维护国家安全的法定义务。\u003c/p>\n\u003cp>如果某人仅完成一般法律义务，并不因此当然满足第12条“突出贡献”的条件。\u003c/p>\n\u003cp>可以区分：\u003c/p>\n\u003cp>\u003cstrong>一般义务的正常履行\u003c/strong>\u003cbr>→ 属于法律要求的行为；\u003c/p>\n\u003cp>\u003cstrong>超过一般程度、产生显著实际作用的行为\u003c/strong>\u003cbr>→ 才可能进一步进入“突出贡献”的奖励评价。\u003c/p>\n\u003cp>但具体制度也可以根据法律和规章设置更具体的奖励条件。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>奖励制度是在一般义务基础上的积极激励机制，而不是所有法定义务履行行为的自动对价。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>3. 奖励、保护、补偿和抚恤属于不同制度\u003c/h4>\n\u003cp>这是第12条非常容易混淆的一组关系。\u003c/p>\n\u003cp>\u003cstrong>奖励\u003c/strong>主要针对：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>行为人作出了突出贡献。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>其功能是肯定和激励。\u003c/p>\n\u003cp>\u003cstrong>保护\u003c/strong>主要针对：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>行为人因支持、协助国家安全工作而面临人身安全风险。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第80条规定有关机关应依法采取保护措施。\u003c/p>\n\u003cp>\u003cstrong>补偿\u003c/strong>主要针对：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>支持、协助国家安全工作造成财产损失。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第81条规定按照国家有关规定给予补偿。\u003c/p>\n\u003cp>\u003cstrong>抚恤优待\u003c/strong>主要针对：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>因支持、协助国家安全工作造成人身伤害或者死亡。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>其功能在于处理由国家安全工作产生的损失或者特别牺牲。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>奖励：针对贡献\u003c/strong>\u003cbr>\u003cstrong>保护：针对危险\u003c/strong>\u003cbr>\u003cstrong>补偿：针对财产损失\u003c/strong>\u003cbr>\u003cstrong>抚恤：针对人身伤亡\u003c/strong>\u003c/p>\n\u003cp>四者的规范目的不同。\u003c/p>\n\u003cp>所以：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>给予奖金并不意味着保护义务、补偿义务或者抚恤义务已经履行。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>同一主体在满足不同条件时，也可能分别适用不同制度。\u003c/p>\n\u003chr>\n\u003ch4>4. 奖励决定仍应遵守权限和程序〔笔记分析〕\u003c/h4>\n\u003cp>第12条虽然是有利于个人或者组织的激励性规定，但国家作出奖励决定仍属于制度化的公权力活动，需要遵守相应权限和程序。\u003c/p>\n\u003cp>以公务员奖励制度说明：\u003c/p>\n\u003cul>\n\u003cli>奖励主体需要具有权限；\u003c/li>\n\u003cli>不同等级奖励可能具有不同审批主体；\u003c/li>\n\u003cli>奖励需要按照规定程序实施。\u003c/li>\n\u003c/ul>\n\u003cp>现行《公务员法》第54条仍明确规定，给予公务员或者公务员集体奖励，应按照规定权限和程序决定或者审批。\u003c/p>\n\u003chr>\n\u003ch4>5. 第12条原则上不能单独产生具体金额的奖励请求权〔笔记分析〕\u003c/h4>\n\u003cp>本条只规定国家“给予表彰和奖励”，没有规定：\u003c/p>\n\u003cul>\n\u003cli>具体奖金金额；\u003c/li>\n\u003cli>奖励等级；\u003c/li>\n\u003cli>奖励认定程序；\u003c/li>\n\u003cli>奖励申请方式；\u003c/li>\n\u003cli>作出决定的期限。\u003c/li>\n\u003c/ul>\n\u003cp>因此，仅依据第12条通常无法直接推出：&gt; “某个人已经当然享有请求国家支付某一数额奖金的具体请求权。”\u003c/p>\n\u003cp>具体争议应继续判断是否存在适用于该行为的专门奖励办法，以及行为是否符合其奖励条件。\u003c/p>\n\u003cp>因此分析路径应当是：\u003c/p>\n\u003cp>\u003cstrong>第12条：有无原则性奖励依据\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>专门规范：奖励对象和条件是什么\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>具体事实：是否符合条件\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>权限程序：由谁认定和决定\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>奖励标准：可以获得何种奖励\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>6. 奖励制度不能反向鼓励违法参与〔笔记分析〕\u003c/h4>\n\u003cp>国家安全奖励旨在鼓励维护国家安全的合法行为，而不是鼓励个人为了获得奖励自行实施法律没有授权的调查或者侵犯他人权益。\u003c/p>\n\u003cp>例如，公民可以依法报告危害国家安全的线索，但不能因为期待奖励就当然获得：\u003c/p>\n\u003cul>\n\u003cli>非法侵入他人住所的权力；\u003c/li>\n\u003cli>非法获取个人信息的权力；\u003c/li>\n\u003cli>非法监听、偷拍的权力；\u003c/li>\n\u003cli>扣押他人财物或者限制他人人身自由的权力。\u003c/li>\n\u003c/ul>\n\u003cp>因此，奖励制度必须与第7条法治和人权保障原则、第9条公众参与的法定边界共同理解。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>只有合法的国家安全参与行为才能得到法律激励；奖励目的不能使违法取证或者侵权行为当然正当化。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第9、11、12条形成“参与—义务—激励”的连续结构\u003c/h4>\n\u003cp>三个条文可以连续理解：\u003c/p>\n\u003cp>\u003cstrong>第9条：广泛动员公民和组织\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第11条：个人和组织负有维护国家安全的责任和义务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第12条：对其中作出突出贡献者给予表彰和奖励\u003c/strong>\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第9条解决为什么以及如何发动社会力量，第11条解决参与主体的责任基础，第12条进一步解决对突出贡献如何形成正向激励。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（二）第12条与第80、81条应严格区分\u003c/h4>\n\u003cp>可以用一张表快速记忆：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>制度\u003c/th>\n\u003cth>条件\u003c/th>\n\u003cth>主要功能\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>第12条表彰奖励\u003c/strong>\u003c/td>\n\u003ctd>作出突出贡献\u003c/td>\n\u003ctd>正向激励\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>第80条保护\u003c/strong>\u003c/td>\n\u003ctd>因支持、协助国家安全工作面临人身危险\u003c/td>\n\u003ctd>防止损害\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>第81条补偿\u003c/strong>\u003c/td>\n\u003ctd>因支持、协助国家安全工作造成财产损失\u003c/td>\n\u003ctd>填补财产损失\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>第81条抚恤优待\u003c/strong>\u003c/td>\n\u003ctd>因支持、协助造成人身伤害或者死亡\u003c/td>\n\u003ctd>对特别损害给予保障\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>贡献、风险、损失是不同的制度触发条件。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（三）现行《公民举报危害国家安全行为奖励办法》是第12条具体化的重要实例\u003c/h4>\n\u003cp>〔后续制度发展〕\u003c/p>\n\u003cp>2022年6月6日，国家安全部公布《公民举报危害国家安全行为奖励办法》，自公布之日起施行。该办法依据《国家安全法》《反间谍法》等，对国家安全机关实施的公民举报奖励进一步规定了奖励条件、方式、标准和程序。\n该办法要求举报奖励同时满足若干具体条件，例如：\u003c/p>\n\u003cul>\n\u003cli>有明确举报对象或者具体危害国家安全行为线索、情况；\u003c/li>\n\u003cli>有关事项原则上属于国家安全机关此前未掌握或者举报人提供了更加具体详实的信息；\u003c/li>\n\u003cli>举报内容经查证属实，并对防范、制止和惩治危害国家安全行为发挥作用、作出贡献。\u003c/li>\n\u003c/ul>\n\u003cp>在奖励方式上，办法规定国家安全机关根据线索查证结果、违法行为危害程度和举报发挥作用等因素综合评估奖励等级，可以给予\u003cstrong>精神奖励或者物质奖励\u003c/strong>；精神奖励表现为颁发奖励证书，物质奖励主要表现为奖金。奖金根据贡献程度设置不同档次，特别重大贡献可以给予10万元以上奖励。\u003c/p>\n\u003cp>同时，办法还规定了奖励启动、决定、告知、领取、经费和监督等程序。例如，符合条件的举报在查证属实并依法处理后，由设区的市级以上国家安全机关按照规定启动奖励程序。:chatgpt-content-reference{index=&quot;5&quot;}\u003c/p>\n\u003cp>这一制度能够很好地说明：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第12条只是原则性激励条款，具体奖励的条件、等级、金额和程序需要通过专门规则进一步细化。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>但其适用范围也必须准确把握：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>《公民举报危害国家安全行为奖励办法》主要调整国家安全机关对公民举报危害国家安全行为实施奖励，并不等于穷尽第12条所称一切“个人和组织”“突出贡献”的奖励情形。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（四）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：只要履行了维护国家安全义务，就应当获得奖励。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第12条要求达到“突出贡献”程度。一般义务的正常履行与获得国家表彰奖励属于不同层次。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：只有国家安全机关工作人员才能成为奖励对象。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 本条明确规定奖励对象为“个人和组织”，并未限定职业身份。普通公民、有关单位和社会组织符合条件时也可能进入奖励范围。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：第12条规定了奖励，就意味着可以直接请求特定数额的奖金。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 本条没有规定具体数额、等级和程序。具体请求能否成立，应继续查找适用的奖励办法和相应事实条件。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：“表彰和奖励”意味着每一个受奖者都必须同时取得精神奖励和奖金。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 本条规定两种激励方式，甲书强调精神与物质激励相结合，但不能据此推出每一奖励个案必须同时采取两种方式。现行举报奖励办法也明确可以给予精神奖励或者物质奖励。:chatgpt-content-reference{index=&quot;7&quot;}\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：支付奖金以后，就不需要再对参与者进行保护或者补偿。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 奖励、保护、补偿和抚恤具有不同规范目的和触发条件，应当分别判断。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：为了获得国家安全奖励，可以自行采取调查和取证措施。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 奖励制度不能扩大普通个人的法定权限。参与国家安全工作的行为仍须遵守法律，不得侵犯他人合法权益。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点7：《公民举报危害国家安全行为奖励办法》就是第12条全部奖励制度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 该办法只是第12条在公民举报危害国家安全行为这一特定场景中的具体化。第12条的对象还包括“组织”，贡献形式也不限于举报。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>“突出贡献”的法律判断标准应如何形成？\u003c/strong>\u003cbr>应主要考察行为结果、风险降低程度、信息价值，还是还应考虑行为人的投入、风险承担以及不可替代性？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>第12条能否在特定条件下形成具体奖励请求权？\u003c/strong>\u003cbr>当专门奖励规章已经明确奖励条件、标准和程序，而个人完全符合条件时，其法律地位是否从一般激励对象转化为具有更具体请求基础的主体？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>奖励裁量应受到何种程序控制？\u003c/strong>\u003cbr>在贡献程度具有评价空间的情况下，是否应建立统一的事实认定、分级标准、理由说明以及异议处理机制？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全工作的保密性如何与奖励制度的公开、公平相协调？\u003c/strong>\u003cbr>某些突出贡献无法公开具体事实时，如何既保护国家秘密和受奖者安全，又保证奖励程序具有必要的公正性和可监督性？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何协调物质激励与公共义务之间的关系？\u003c/strong>\u003cbr>奖励能够提高公众参与积极性，但过度依赖奖金是否可能改变公民履行国家安全义务的行为动机？制度应如何平衡荣誉激励和物质激励？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何防止奖励机制诱发虚假或者过度举报？\u003c/strong>\u003cbr>在降低真实线索举报成本的同时，应如何通过查证机制、恶意举报责任和奖励条件防止为获取奖金而虚构或者夸大事实？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>奖励、补偿与抚恤之间发生竞合时如何处理？\u003c/strong>\u003cbr>同一主体既作出突出贡献，又因支持国家安全工作遭受财产损失或者人身损害时，能否同时适用多项制度，其计算和程序关系如何安排？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何评价国家安全奖励制度的实际效果？\u003c/strong>\u003cbr>除奖励数量和奖金规模外，是否更应考察真实有效线索比例、重大风险防范效果、公众参与质量以及权利保障状况？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":13,"label":"第十三条","title":"法律责任","lawText":"国家机关工作人员在国家安全工作和涉及国家安全活动中，滥用职权、玩忽职守、徇私舞弊的，依法追究法律责任。\n\n任何个人和组织违反本法和有关法律，不履行维护国家安全义务或者从事危害国家安全活动的，依法追究法律责任。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>双向责任结构：\u003c/strong> 第一款约束行使国家安全职权的国家机关工作人员，第二款约束负有国家安全义务的个人和组织，体现国家安全法既规范社会主体，也约束公权力。\u003c/li>\n\u003cli>\u003cstrong>三类职务违法：\u003c/strong> 滥用职权侧重违法或不当行使权力，玩忽职守侧重应当履职而未正确履职，徇私舞弊侧重因私情、私利违背职责要求；是否构成犯罪仍须依据具体犯罪构成判断。\u003c/li>\n\u003cli>\u003cstrong>作为与不作为并重：\u003c/strong> 个人和组织既可能因“不履行维护国家安全义务”承担责任，也可能因积极实施“危害国家安全活动”承担责任。\u003c/li>\n\u003cli>\u003cstrong>责任法定：\u003c/strong> “依法追究”要求继续寻找具体的责任依据，不能仅凭第13条直接决定罚款、拘留、处分或者刑罚。\u003c/li>\n\u003cli>\u003cstrong>规范性质：\u003c/strong> 本条主要是一项总则性的责任衔接条款，其功能在于确立责任原则并连接专门法律，而非设置一个包罗所有国家安全违法行为的统一处罚制度。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家机关工作人员在国家安全工作和涉及国家安全活动中，滥用职权、玩忽职守、徇私舞弊的，依法追究法律责任。\u003c/p>\n\u003cp>任何个人和组织违反本法和有关法律，不履行维护国家安全义务或者从事危害国家安全活动的，依法追究法律责任。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>双向责任结构：\u003c/strong> 第一款约束行使国家安全职权的国家机关工作人员，第二款约束负有国家安全义务的个人和组织，体现国家安全法既规范社会主体，也约束公权力。\u003c/li>\n\u003cli>\u003cstrong>三类职务违法：\u003c/strong> 滥用职权侧重违法或不当行使权力，玩忽职守侧重应当履职而未正确履职，徇私舞弊侧重因私情、私利违背职责要求；是否构成犯罪仍须依据具体犯罪构成判断。\u003c/li>\n\u003cli>\u003cstrong>作为与不作为并重：\u003c/strong> 个人和组织既可能因“不履行维护国家安全义务”承担责任，也可能因积极实施“危害国家安全活动”承担责任。\u003c/li>\n\u003cli>\u003cstrong>责任法定：\u003c/strong> “依法追究”要求继续寻找具体的责任依据，不能仅凭第13条直接决定罚款、拘留、处分或者刑罚。\u003c/li>\n\u003cli>\u003cstrong>规范性质：\u003c/strong> 本条主要是一项总则性的责任衔接条款，其功能在于确立责任原则并连接专门法律，而非设置一个包罗所有国家安全违法行为的统一处罚制度。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家机关工作人员在国家安全工作和涉及国家安全活动中，滥用职权、玩忽职守、徇私舞弊的，依法追究法律责任。\u003c/p>\n\u003cp>任何个人和组织违反本法和有关法律，不履行维护国家安全义务或者从事危害国家安全活动的，依法追究法律责任。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">法律责任 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定违反国家安全法定义务的\u003cstrong>原则性法律责任\u003c/strong>。第一款面向国家机关工作人员，强调国家安全权力违法运行时的责任；第二款面向任何个人和组织，处理不履行国家安全义务以及从事危害国家安全活动的责任。\u003c/p>\n\u003cp>本条并未自行规定具体罚款数额、拘留期限或者刑罚，而是通过“\u003cstrong>依法追究法律责任\u003c/strong>”将违法行为与刑法、反间谍法以及其他具体责任规范连接起来。因此，理解本条的关键在于区分：\u003c/p>\n\u003cp>\u003cstrong>责任原则 → 具体违法行为 → 具体责任规范 → 法定处理程序\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 本条具有较为明确的审议修改记录\u003c/h4>\n\u003cp>与前面部分原则条款相比，第13条的形成具有较明确的立法审议材料。\u003c/p>\n\u003cp>根据甲书附录四所载2015年6月24日关于《中华人民共和国国家安全法（草案）》审议结果的报告，在审议过程中曾出现两类相关意见：\u003c/p>\n\u003cul>\n\u003cli>有意见认为，草案关于法律责任的规定较为原则、笼统，建议单独设置“法律责任”一章，对违法行为及其法律后果作系统规定；\u003c/li>\n\u003cli>另有意见提出，应当对国家机关工作人员在国家安全工作中不履行职责以及实施违法行为规定相应法律责任。\u003c/li>\n\u003c/ul>\n\u003cp>因此，本条并非单纯重复一般“违法必究”原则，而是直接回应了立法审议中关于\u003cstrong>国家安全责任体系如何设置\u003c/strong>以及\u003cstrong>国家工作人员违法履职如何追责\u003c/strong>的问题。\u003c/p>\n\u003chr>\n\u003ch4>2. 立法最终选择“总则原则规定＋专门法律具体规定”\u003c/h4>\n\u003cp>全国人大法律委员会在审议中没有采纳单独设置完整“法律责任章”的方案。\u003c/p>\n\u003cp>甲书所载审议结果报告说明，主要考虑到《国家安全法》具有\u003cstrong>综合性、全局性、基础性\u003c/strong>，涉及领域十分广泛，各领域违法行为的性质、主体和责任形式差异较大，因此参照有关立法做法，在总则中作原则性责任规定，而将具体法律责任交由刑法、反间谍法以及其他有关法律规定。\u003c/p>\n\u003cp>因此，第13条最终形成两款结构：\u003c/p>\n\u003cp>\u003cstrong>第一款：国家机关工作人员违法履职的责任\u003c/strong>\u003cbr>＋\u003cbr>\u003cstrong>第二款：个人和组织违反国家安全义务或者从事危害国家安全活动的责任\u003c/strong>\u003c/p>\n\u003cp>这一立法选择直接解释了一个重要问题：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>为什么《国家安全法》第13条只规定“依法追究法律责任”，却没有逐项规定罚款、拘留或者刑罚。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>答案并非立法遗漏，而是综合性、基础性法律与具体部门法之间有意形成的责任分工。\u003c/p>\n\u003chr>\n\u003ch4>3. 本条体现综合性国家安全立法与专门立法之间的分工\u003c/h4>\n\u003cp>第13条所采用的责任模式可以概括为：\u003c/p>\n\u003cp>\u003cstrong>《国家安全法》确定一般责任原则\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>专门法律具体规定违法构成和责任形式\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>相应执法、监察和司法程序负责认定与追究\u003c/strong>\u003c/p>\n\u003cp>例如，反间谍、反恐怖主义、网络安全、数据安全等不同领域具有不同的违法行为、主管机关和责任制度。\u003c/p>\n\u003cp>因此，第13条在体系中的作用主要是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>确认国家安全领域不存在责任豁免，同时将具体责任判断导向相应的实体法和程序法。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，第一款的责任主体是参与国家安全工作的国家机关工作人员\u003c/h4>\n\u003cp>第一款规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“国家机关工作人员在国家安全工作和涉及国家安全活动中……”\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，本款主体不能仅理解为国家安全机关工作人员。\u003c/p>\n\u003cp>甲、乙两书均指出，只要国家机关工作人员是在“国家安全工作”或者“涉及国家安全活动”中依法履行有关职责，都可能进入本款的规范范围。\u003c/p>\n\u003cp>这与本法第三章的职责体系相对应。国家安全工作涉及多个机关和领域，因此责任约束也必须覆盖相关国家机关工作人员，而不能仅覆盖专门国家安全机关。\u003c/p>\n\u003cp>可以形成：\u003c/p>\n\u003cp>\u003cstrong>国家安全职责广泛分布\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>有关工作人员依法获得相应职权\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>违法或者失职行使职权时依法承担责任\u003c/strong>\u003c/p>\n\u003cp>这也体现了“有权必有责、用权受监督”的基本法治逻辑。\u003c/p>\n\u003chr>\n\u003ch4>第二，“滥用职权”主要针对权力的不当行使\u003c/h4>\n\u003cp>甲书将“滥用职权”解释为国家机关工作人员违法或者不当地行使职权，包括超越职权范围、不按照法定程序行使职权，或者利用职权实施法律所不允许的行为等情形。\u003c/p>\n\u003cp>在国家安全领域尤其需要注意：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>承担维护国家安全职责，并不意味着国家机关工作人员取得无限权限。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>例如：\u003c/p>\n\u003cul>\n\u003cli>超越法定权限采取措施；\u003c/li>\n\u003cli>在不具备法定条件时行使权力；\u003c/li>\n\u003cli>将国家安全职权用于与法定目的无关的事项；\u003c/li>\n\u003cli>违反法定程序采取限制个人、组织权利的措施；\u003c/li>\n\u003c/ul>\n\u003cp>都可能进入职权违法的评价范围。\u003c/p>\n\u003cp>本款因此与第43条具有直接联系。第43条明确要求国家机关及其工作人员严格依法履行职责，不得超越职权、滥用职权，不得侵犯个人和组织的合法权益。\u003c/p>\n\u003cp>可以概括为：\u003c/p>\n\u003cp>\u003cstrong>第43条：规定如何依法行使国家安全职权\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第13条：违法行使职权时依法追究责任\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>第三，“玩忽职守”主要针对应当履职而未正确履职\u003c/h4>\n\u003cp>“玩忽职守”与滥用职权的基本区别，在于其重点不在于积极违法使用权力，而在于对法定职责的不认真履行、不正确履行或者怠于履行。\u003c/p>\n\u003cp>甲、乙两书所举类型包括：\u003c/p>\n\u003cul>\n\u003cli>对依法应当处理的国家安全事项不予处理；\u003c/li>\n\u003cli>接到有关线索或者举报后无正当理由不履行职责；\u003c/li>\n\u003cli>对本应认真审查、调查或者处置的事项严重疏忽；\u003c/li>\n\u003cli>因严重不负责任造成相应危害后果。\u003c/li>\n\u003c/ul>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>滥用职权主要解决“权力如何被错误使用”；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>玩忽职守主要解决“法定职责为何没有得到正确履行”。\u003c/strong>\u003c/p>\n\u003cp>但无论哪一种情形，是否进一步构成刑法上的具体职务犯罪，仍须根据主体身份、行为方式、危害后果、因果关系、主观要件等犯罪构成逐项判断。\u003c/p>\n\u003chr>\n\u003ch4>第四，“徇私舞弊”强调因私情、私利背离法定职责\u003c/h4>\n\u003cp>“徇私舞弊”通常具有更加明显的主观不正当因素。\u003c/p>\n\u003cp>甲书将其概括为国家机关工作人员在履行职责过程中因私情、私利而故意违背事实和法律，通过欺骗、隐瞒或者其他不正当方式作出处理。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cstrong>因私人利益或者关系\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>违背依法履职要求\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>故意作出不公正或者违法处理\u003c/strong>\u003c/p>\n\u003cp>其核心不只是“工作失误”，而是私情、私利与职权运行发生不当结合。\u003c/p>\n\u003cp>但是，“徇私舞弊”在不同具体法律和犯罪中的构成要求可能不同。因此，第13条中的概括性表述仍不能直接代替刑法分则中具体犯罪的构成判断。\u003c/p>\n\u003chr>\n\u003ch4>第五，第二款同时规范“不履行义务”与“从事危害国家安全活动”\u003c/h4>\n\u003cp>第二款规定两类基本行为：\u003c/p>\n\u003cp>\u003cstrong>第一类：不履行维护国家安全义务\u003c/strong>\u003c/p>\n\u003cp>这是典型的不作为责任问题。\u003c/p>\n\u003cp>例如，第77—79条进一步规定公民、组织报告线索、提供证据、给予必要支持协助、保守国家秘密以及单位开展国家安全教育等具体义务。\u003c/p>\n\u003cp>如果法律已经明确规定某主体负有具体义务，而该主体在法定条件下无正当理由不履行，可能依据有关法律承担相应责任。\u003c/p>\n\u003cp>\u003cstrong>第二类：从事危害国家安全活动\u003c/strong>\u003c/p>\n\u003cp>这是积极实施危害国家安全行为的情形。\u003c/p>\n\u003cp>具体可能涉及间谍、恐怖活动以及其他有关专门法律规定的违法犯罪行为。\u003c/p>\n\u003cp>因此，本款同时覆盖：\u003c/p>\n\u003cp>\u003cstrong>违法不作为 + 违法作为\u003c/strong>\u003c/p>\n\u003cp>但责任轻重不能仅根据“作为”或者“不作为”的形式机械判断。\u003c/p>\n\u003cp>最终仍须考察：\u003c/p>\n\u003cul>\n\u003cli>行为违反了哪一具体法律规范；\u003c/li>\n\u003cli>是否具有相应法定主体身份；\u003c/li>\n\u003cli>主观上具有何种过错；\u003c/li>\n\u003cli>造成何种后果或者风险；\u003c/li>\n\u003cli>是否达到行政违法或者犯罪的法定门槛。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第六，“依法追究法律责任”要求寻找具体责任规范\u003c/h4>\n\u003cp>这是理解本条最重要的一句话。\u003c/p>\n\u003cp>第13条没有规定：\u003c/p>\n\u003cul>\n\u003cli>行政拘留多少日；\u003c/li>\n\u003cli>罚款多少元；\u003c/li>\n\u003cli>应给予何种处分；\u003c/li>\n\u003cli>应判处何种刑罚。\u003c/li>\n\u003c/ul>\n\u003cp>因此，本条不能独立完成具体法律责任的确定。\u003c/p>\n\u003cp>分析时至少需要继续寻找：\u003c/p>\n\u003cp>\u003cstrong>第一步：义务规范或者禁止规范\u003c/strong>\u003c/p>\n\u003cp>行为人到底违反了什么具体法律义务？\u003c/p>\n\u003cp>↓  \u003c/p>\n\u003cp>\u003cstrong>第二步：责任规范\u003c/strong>\u003c/p>\n\u003cp>相应法律对这种行为规定了什么法律后果？\u003c/p>\n\u003cp>↓  \u003c/p>\n\u003cp>\u003cstrong>第三步：责任要件\u003c/strong>\u003c/p>\n\u003cp>主体、行为、主观状态、后果、情节等是否满足法定条件？\u003c/p>\n\u003cp>↓  \u003c/p>\n\u003cp>\u003cstrong>第四步：权限与程序\u003c/strong>\u003c/p>\n\u003cp>哪个机关有权调查、处理或者追诉？应当经过什么程序？\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第13条提供责任连接，但具体制裁必须具有明确法律依据。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 第13条属于原则性的“责任衔接条款”\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>从法律规范结构看，第13条并不是典型的完整处罚条款。\u003c/p>\n\u003cp>完整的制裁规范通常至少需要较明确地回答：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>什么行为 → 由谁实施 → 在什么条件下 → 承担什么法律后果\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>而第13条主要回答：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>违反国家安全法律义务或者违法履职，应当依法承担责任。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>至于责任的种类和程度，则需要由其他法律完成。\u003c/p>\n\u003cp>因此可以概括为：\u003c/p>\n\u003cp>\u003cstrong>第13条：责任原则和转介规范\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>刑法、专门国家安全法律等：具体责任构成和法律后果\u003c/strong>\u003c/p>\n\u003cp>这种立法方式尤其适合综合性基础法律，因为本法涉及的安全领域十分广泛，不可能在总则中穷尽每一种违法行为及其处罚。\u003c/p>\n\u003chr>\n\u003ch4>2. 责任衔接条款不能成为绕开处罚法定要求的“万能条款”\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>第13条明确规定“依法追究”，其核心恰恰是强调责任追究必须具有具体法律依据。\u003c/p>\n\u003cp>因此，不能采取如下推理：\u003c/p>\n\u003cblockquote>\n\u003cp>某行为不利于国家安全\u003cbr>↓\u003cbr>第13条规定危害国家安全应当追责\u003cbr>↓\u003cbr>因而可以直接处罚\u003c/p>\n\u003c/blockquote>\n\u003cp>正确的分析路径应当是：\u003c/p>\n\u003cblockquote>\n\u003cp>某行为是否违反具体法律规范\u003cbr>↓\u003cbr>该规范或者相关责任规范是否规定法律责任\u003cbr>↓\u003cbr>是否满足相应责任构成\u003cbr>↓\u003cbr>有权机关依法定程序作出处理\u003c/p>\n\u003c/blockquote>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“危害国家安全”这一概括性评价不能取代具体违法构成和责任依据。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这也是第13条与第7条法治原则之间的重要体系联系。\u003c/p>\n\u003chr>\n\u003ch4>3. 第13条体现国家安全法中的“双向责任约束”\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>本法并非只要求个人和组织承担国家安全义务。\u003c/p>\n\u003cp>第13条第一款首先规定国家机关工作人员违法履职的法律责任，第二款才进一步规定个人和组织的责任。\u003c/p>\n\u003cp>结合第7条和第43条，可以形成：\u003c/p>\n\u003cp>\u003cstrong>对公民和组织：依法履行维护国家安全义务\u003c/strong>\u003cbr>↕\u003cbr>\u003cstrong>对国家机关：依法履行国家安全职责，不得越权滥权\u003c/strong>\u003cbr>↕\u003cbr>\u003cstrong>任何一方违反相应法律规范：依法承担责任\u003c/strong>\u003c/p>\n\u003cp>这说明国家安全法治同时包含：\u003c/p>\n\u003cp>\u003cstrong>维护国家安全秩序\u003c/strong>\u003cbr>和\u003cbr>\u003cstrong>规范国家安全权力运行\u003c/strong>\u003c/p>\n\u003cp>两个方面。\u003c/p>\n\u003chr>\n\u003ch4>4. 国家机关工作人员的责任应区分处分、政务处分与刑事责任\u003c/h4>\n\u003cp>现行法背景下，对国家机关工作人员违法履职的责任不能简单概括为只有一种“行政责任”。\u003c/p>\n\u003cp>应根据行为人身份、违法性质和严重程度分别考察。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cul>\n\u003cli>公职人员违反职务要求但尚未构成犯罪的，可能依法受到\u003cstrong>处分或者政务处分\u003c/strong>；\u003c/li>\n\u003cli>符合刑法规定的职务犯罪构成的，应依法追究\u003cstrong>刑事责任\u003c/strong>；\u003c/li>\n\u003cli>违法行使职权侵害个人、组织合法权益并造成损害的，还可能进一步产生\u003cstrong>国家赔偿等法律后果\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003cp>因此，不同责任制度需要分别适用相应实体和程序规则。\u003c/p>\n\u003cp>尤其不能认为：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>内部处分或者政务处分可以当然替代刑事追责。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>反过来，也不能仅凭存在工作失误就认定构成犯罪；刑事责任必须严格满足犯罪构成和证明要求。\u003c/p>\n\u003chr>\n\u003ch4>5. 行政处罚、处分、政务处分与刑罚必须区分\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>这几个概念容易在学习中混用。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类型\u003c/th>\n\u003cth>主要对象\u003c/th>\n\u003cth>主要性质\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>处分\u003c/strong>\u003c/td>\n\u003ctd>依法受到任免机关、单位管理的公职人员等\u003c/td>\n\u003ctd>内部管理和职务责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>政务处分\u003c/strong>\u003c/td>\n\u003ctd>《公职人员政务处分法》规定的公职人员\u003c/td>\n\u003ctd>公职人员违法责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>行政处罚\u003c/strong>\u003c/td>\n\u003ctd>实施行政违法行为的个人、法人或其他组织\u003c/td>\n\u003ctd>行政机关依法实施的外部行政制裁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>刑罚\u003c/strong>\u003c/td>\n\u003ctd>构成犯罪的自然人或依法承担刑事责任的单位\u003c/td>\n\u003ctd>国家最严厉的法律制裁\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>主体相同或者事实相同，并不意味着责任类型和程序相同。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>一项行为是否同时涉及多个责任体系，还需要依据具体法律判断其竞合和衔接方式。\u003c/p>\n\u003chr>\n\u003ch4>6. 不作为责任必须首先存在具体法定义务\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>第二款明确将“不履行维护国家安全义务”纳入责任范围。\u003c/p>\n\u003cp>但是，认定违法不作为不能只证明：\u003c/p>\n\u003cblockquote>\n\u003cp>“这个人本可以做一些有利于国家安全的事情，但没有做。”\u003c/p>\n\u003c/blockquote>\n\u003cp>法律上的不作为责任首先要求存在一项\u003cstrong>具体、可识别的法定义务\u003c/strong>。\u003c/p>\n\u003cp>分析时通常需要依次判断：\u003c/p>\n\u003col>\n\u003cli>行为人是否属于该义务的法定主体；\u003c/li>\n\u003cli>法律是否明确要求其实施特定行为；\u003c/li>\n\u003cli>义务是否已经因具体事实而触发；\u003c/li>\n\u003cli>行为人是否具有现实履行可能；\u003c/li>\n\u003cli>是否存在正当的不履行理由；\u003c/li>\n\u003cli>法律是否对违反该义务规定相应责任。\u003c/li>\n\u003c/ol>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第11条的一般国家安全责任，不能未经具体化就直接转化为任意不作为的处罚依据。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>7. 同一行为可能涉及不同责任，但不同责任不能相互替代\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>某一国家安全违法行为可能同时触及不同法律关系。\u003c/p>\n\u003cp>例如，一个国家机关工作人员违法泄露国家秘密，可能同时涉及：\u003c/p>\n\u003cul>\n\u003cli>职务管理责任；\u003c/li>\n\u003cli>政务处分；\u003c/li>\n\u003cli>刑事责任；\u003c/li>\n\u003cli>因违法行为造成损害而产生的其他责任。\u003c/li>\n\u003c/ul>\n\u003cp>具体能否并行适用，应根据有关法律分别判断。\u003c/p>\n\u003cp>这里需要把握两个原则：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>不能因已经给予较轻处理，就当然免除法律要求追究的更严重责任；\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>同时：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>也不能为了追求更严厉后果，而跳过相应责任构成和程序。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这体现责任法定和程序法定的共同要求。\u003c/p>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第7条、第11条、第13条与第43条形成完整的责任结构\u003c/h4>\n\u003cp>可以将几条规定连起来理解：\u003c/p>\n\u003cp>\u003cstrong>第7条：遵守宪法和法律，坚持法治原则\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第11条：公民、机关和组织负有国家安全责任和义务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第35—43条、第77—79条：具体配置职责和义务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第13条：违反职责和义务依法追究责任\u003c/strong>\u003c/p>\n\u003cp>对于国家机关工作人员，还可以进一步形成：\u003c/p>\n\u003cp>\u003cstrong>法定职权\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>依法履职\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>禁止越权、滥权\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>违法履职依法追责\u003c/strong>\u003c/p>\n\u003cp>因此，第13条不是孤立的责任规定，而是前面职责、义务和法治原则最终进入法律后果的重要连接点。\u003c/p>\n\u003chr>\n\u003ch4>（二）第13条与专门国家安全法律的关系\u003c/h4>\n\u003cp>《国家安全法》具有综合性和基础性，因此第13条只作原则规定。\u003c/p>\n\u003cp>在具体案件中，需要继续查找相应专门法律。例如：\u003c/p>\n\u003cul>\n\u003cli>反间谍行为 → 查《反间谍法》及刑法；\u003c/li>\n\u003cli>恐怖活动 → 查《反恐怖主义法》及刑法；\u003c/li>\n\u003cli>网络安全违法 → 查《网络安全法》等；\u003c/li>\n\u003cli>数据安全违法 → 查《数据安全法》等；\u003c/li>\n\u003cli>涉及国家秘密 → 查《保守国家秘密法》及刑法等。\u003c/li>\n\u003c/ul>\n\u003cp>因此可以记忆为：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全法提供责任入口，专门法律确定责任内容。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（三）乙书刑罚分类存在明显错误\u003c/h4>\n\u003cp>乙书第33页在解释国家机关工作人员可能承担的刑事责任时，将危害国家安全相关刑罚概括为“自由刑、财产刑和生命刑”，并将“财产刑”置于“主刑”的表述体系中。\u003c/p>\n\u003cp>这一说法与我国《刑法》的\u003cstrong>法定刑罚分类\u003c/strong>不符。\u003c/p>\n\u003cp>《刑法》第32条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>刑罚分为主刑和附加刑。\u003c/p>\n\u003c/blockquote>\n\u003cp>第33条规定的主刑包括：\u003c/p>\n\u003col>\n\u003cli>管制；\u003c/li>\n\u003cli>拘役；\u003c/li>\n\u003cli>有期徒刑；\u003c/li>\n\u003cli>无期徒刑；\u003c/li>\n\u003cli>死刑。\u003c/li>\n\u003c/ol>\n\u003cp>第34条规定的附加刑包括：\u003c/p>\n\u003col>\n\u003cli>罚金；\u003c/li>\n\u003cli>剥夺政治权利；\u003c/li>\n\u003cli>没收财产。\u003c/li>\n\u003c/ol>\n\u003cp>其中，罚金和没收财产属于附加刑，而不是我国刑法法定分类中的主刑。\u003c/p>\n\u003cp>因此更准确的笔记应当写为：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“自由刑、财产刑、生命刑”可以作为刑罚理论上的某种分类方式讨论，但不能替代《刑法》第32—34条关于主刑和附加刑的法定分类；尤其不能将财产刑列入法定主刑。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（四）乙书2014年案例不能作为第13条的适用判例\u003c/h4>\n\u003cp>乙书第34页援引一宗2014年的危害国家安全刑事案件，主要用于说明危害国家安全行为可能受到刑事追究。\u003c/p>\n\u003cp>这一案例可以作为：\u003c/p>\n\u003cul>\n\u003cli>相关犯罪制度的历史案例；\u003c/li>\n\u003cli>2015年《国家安全法》制定以前国家安全刑事保护实践的背景材料。\u003c/li>\n\u003c/ul>\n\u003cp>但需要严格区分时间：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>《国家安全法》于2015年7月1日起施行，2014年发生并处理的案件不可能以现行第13条作为行为时的法律依据。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，不应将其表述为：\u003c/p>\n\u003cblockquote>\n\u003cp>“第13条实施后的典型适用案件”。\u003c/p>\n\u003c/blockquote>\n\u003cp>更准确的用法是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>将其作为本条所衔接的既有刑事责任制度之背景实例。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（五）甲书引用的部分法律已经发生重要变化\u003c/h4>\n\u003cp>甲书出版于2016年，其中为解释法律责任所引用的一些法律反映的是当时法制状态。\u003c/p>\n\u003ch5>1. 《行政监察法》已经废止\u003c/h5>\n\u003cp>2018年《监察法》施行时，《行政监察法》同时废止。\u003c/p>\n\u003cp>现行《监察法》根据2024年12月25日全国人大常委会修改决定修正，自2025年6月1日起施行。当前研究公职人员职务违法、职务犯罪监督和监察责任，应以现行《监察法》为基础，并结合《公职人员政务处分法》等现行规范。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>甲书关于《行政监察法》的引用应保留为2016年的历史法背景，不宜继续直接套用其条号和制度。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>2. 《物权法》已经被《民法典》取代\u003c/h5>\n\u003cp>《民法典》自2021年1月1日起施行，《物权法》同时废止。\u003c/p>\n\u003cp>因此，如果甲书通过《物权法》讨论财产权、损害救济或者其他民事法律关系，应当根据具体问题转查现行《民法典》相应规范。\u003c/p>\n\u003cp>这类更新体现一个基本的读书方法：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>释义书对2015年立法原意的说明具有重要价值，但其中援引的外围法律应根据研究时点重新核对现行法。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（六）“行政责任和刑事责任”的旧式概括需要结合现行责任体系理解\u003c/h4>\n\u003cp>甲书在解释本条时，较多按照当时常见表述将相关责任概括为行政责任和刑事责任，并进一步讨论行政处分与刑事追责。\u003c/p>\n\u003cp>这一框架具有历史解释价值，但在现行法研究中可以进一步细化为：\u003c/p>\n\u003cp>\u003cstrong>国家机关工作人员：\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>处分；\u003c/li>\n\u003cli>政务处分；\u003c/li>\n\u003cli>符合犯罪构成时的刑事责任；\u003c/li>\n\u003cli>特定情况下的国家赔偿等其他法律后果。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>个人和组织：\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>行政处罚；\u003c/li>\n\u003cli>刑事责任；\u003c/li>\n\u003cli>根据具体法律可能承担的其他法律责任。\u003c/li>\n\u003c/ul>\n\u003cp>这样能够避免将性质和程序明显不同的法律后果全部笼统纳入“行政责任”。\u003c/p>\n\u003chr>\n\u003ch4>（七）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：第13条本身就是一个处罚条款，可以直接据此罚款或者拘留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 本条主要是责任原则和衔接条款。具体处罚必须继续寻找专门法律规定的违法构成、责任形式和处罚权限。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：只要某种行为被评价为“危害国家安全”，就能够直接追究刑事责任。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 刑事责任必须符合刑法规定的具体犯罪构成，并经过法定刑事程序。国家安全的一般性评价不能代替罪刑法定要求。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：第13条第一款只适用于国家安全机关工作人员。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 条文使用的是“国家机关工作人员”，只要其在国家安全工作或者涉及国家安全活动中履行有关职责，都可能进入本款规范范围。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：滥用职权、玩忽职守、徇私舞弊一旦出现，就当然构成刑事犯罪。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第13条规定的是依法追究“法律责任”。是否构成犯罪仍须符合刑法有关具体犯罪的主体、行为、后果、主观要件等要求。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：个人没有积极实施危害行为，就不存在第13条责任。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第二款同时规定“不履行维护国家安全义务”的不作为责任。但责任成立的前提是存在具体法定义务及其违反。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：给予国家机关工作人员处分或者政务处分以后，就一定不再追究刑事责任。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 不同责任制度具有不同构成和程序。行为依法构成犯罪的，应当依照刑事法律处理，不能以内部或者政务处理当然替代刑事责任。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点7：罚金、没收财产属于我国刑法规定的主刑。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 《刑法》第33条规定主刑为管制、拘役、有期徒刑、无期徒刑和死刑；罚金、剥夺政治权利、没收财产属于第34条规定的附加刑。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>原则性责任衔接条款应满足何种明确性要求？\u003c/strong>\u003cbr>当《国家安全法》本身不规定具体处罚时，专门法律对行为构成、责任形式和处罚权限的规定是否足够清晰，直接关系到责任法定原则能否得到落实。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何判断“不履行维护国家安全义务”的责任边界？\u003c/strong>\u003cbr>一般性的国家安全责任应经过何种程度的具体化，才能成为行政处罚、政务处分或者刑事责任的前提？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全领域的不作为责任应具有何种事实和主观要件？\u003c/strong>\u003cbr>对负有报告、协助或者管理义务的主体，应如何判断其是否知道或者应当知道风险，以及是否具有实际履行能力？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家机关工作人员的失职责任如何与正常裁量失误区分？\u003c/strong>\u003cbr>国家安全决策具有信息不完全和风险不确定性。如何区分依法作出的合理但事后效果不佳的判断，与真正的玩忽职守或者滥用职权？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>不同法律责任之间如何衔接？\u003c/strong>\u003cbr>同一行为同时涉及处分、政务处分、行政处罚或者刑事责任时，应如何处理责任竞合、程序衔接以及证据移送？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>第13条能否发挥对公权力的实质约束功能？\u003c/strong>\u003cbr>除刑事追责外，国家安全领域是否已经形成充分的内部监督、监察、行政救济、司法救济和国家赔偿机制？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>综合性国家安全立法采取“原则责任＋专门法具体化”的模式是否存在规范空隙？\u003c/strong>\u003cbr>当新型国家安全风险已经出现，而专门责任规范尚未及时建立时，应如何在坚持责任法定的同时弥补制度不足？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何建立国家安全责任规范的体系化检索方法？\u003c/strong>\u003cbr>对一个具体案件，是否可以形成“义务规范—责任规范—主体要件—行为要件—程序权限—救济渠道”的固定分析框架，以避免仅凭第13条作概括性追责？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定违反国家安全法定义务的\u003cstrong>原则性法律责任\u003c/strong>。第一款面向国家机关工作人员，强调国家安全权力违法运行时的责任；第二款面向任何个人和组织，处理不履行国家安全义务以及从事危害国家安全活动的责任。\u003c/p>\n\u003cp>本条并未自行规定具体罚款数额、拘留期限或者刑罚，而是通过“\u003cstrong>依法追究法律责任\u003c/strong>”将违法行为与刑法、反间谍法以及其他具体责任规范连接起来。因此，理解本条的关键在于区分：\u003c/p>\n\u003cp>\u003cstrong>责任原则 → 具体违法行为 → 具体责任规范 → 法定处理程序\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 本条具有较为明确的审议修改记录\u003c/h4>\n\u003cp>与前面部分原则条款相比，第13条的形成具有较明确的立法审议材料。\u003c/p>\n\u003cp>根据甲书附录四所载2015年6月24日关于《中华人民共和国国家安全法（草案）》审议结果的报告，在审议过程中曾出现两类相关意见：\u003c/p>\n\u003cul>\n\u003cli>有意见认为，草案关于法律责任的规定较为原则、笼统，建议单独设置“法律责任”一章，对违法行为及其法律后果作系统规定；\u003c/li>\n\u003cli>另有意见提出，应当对国家机关工作人员在国家安全工作中不履行职责以及实施违法行为规定相应法律责任。\u003c/li>\n\u003c/ul>\n\u003cp>因此，本条并非单纯重复一般“违法必究”原则，而是直接回应了立法审议中关于\u003cstrong>国家安全责任体系如何设置\u003c/strong>以及\u003cstrong>国家工作人员违法履职如何追责\u003c/strong>的问题。\u003c/p>\n\u003chr>\n\u003ch4>2. 立法最终选择“总则原则规定＋专门法律具体规定”\u003c/h4>\n\u003cp>全国人大法律委员会在审议中没有采纳单独设置完整“法律责任章”的方案。\u003c/p>\n\u003cp>甲书所载审议结果报告说明，主要考虑到《国家安全法》具有\u003cstrong>综合性、全局性、基础性\u003c/strong>，涉及领域十分广泛，各领域违法行为的性质、主体和责任形式差异较大，因此参照有关立法做法，在总则中作原则性责任规定，而将具体法律责任交由刑法、反间谍法以及其他有关法律规定。\u003c/p>\n\u003cp>因此，第13条最终形成两款结构：\u003c/p>\n\u003cp>\u003cstrong>第一款：国家机关工作人员违法履职的责任\u003c/strong>\u003cbr>＋\u003cbr>\u003cstrong>第二款：个人和组织违反国家安全义务或者从事危害国家安全活动的责任\u003c/strong>\u003c/p>\n\u003cp>这一立法选择直接解释了一个重要问题：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>为什么《国家安全法》第13条只规定“依法追究法律责任”，却没有逐项规定罚款、拘留或者刑罚。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>答案并非立法遗漏，而是综合性、基础性法律与具体部门法之间有意形成的责任分工。\u003c/p>\n\u003chr>\n\u003ch4>3. 本条体现综合性国家安全立法与专门立法之间的分工\u003c/h4>\n\u003cp>第13条所采用的责任模式可以概括为：\u003c/p>\n\u003cp>\u003cstrong>《国家安全法》确定一般责任原则\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>专门法律具体规定违法构成和责任形式\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>相应执法、监察和司法程序负责认定与追究\u003c/strong>\u003c/p>\n\u003cp>例如，反间谍、反恐怖主义、网络安全、数据安全等不同领域具有不同的违法行为、主管机关和责任制度。\u003c/p>\n\u003cp>因此，第13条在体系中的作用主要是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>确认国家安全领域不存在责任豁免，同时将具体责任判断导向相应的实体法和程序法。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，第一款的责任主体是参与国家安全工作的国家机关工作人员\u003c/h4>\n\u003cp>第一款规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“国家机关工作人员在国家安全工作和涉及国家安全活动中……”\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，本款主体不能仅理解为国家安全机关工作人员。\u003c/p>\n\u003cp>甲、乙两书均指出，只要国家机关工作人员是在“国家安全工作”或者“涉及国家安全活动”中依法履行有关职责，都可能进入本款的规范范围。\u003c/p>\n\u003cp>这与本法第三章的职责体系相对应。国家安全工作涉及多个机关和领域，因此责任约束也必须覆盖相关国家机关工作人员，而不能仅覆盖专门国家安全机关。\u003c/p>\n\u003cp>可以形成：\u003c/p>\n\u003cp>\u003cstrong>国家安全职责广泛分布\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>有关工作人员依法获得相应职权\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>违法或者失职行使职权时依法承担责任\u003c/strong>\u003c/p>\n\u003cp>这也体现了“有权必有责、用权受监督”的基本法治逻辑。\u003c/p>\n\u003chr>\n\u003ch4>第二，“滥用职权”主要针对权力的不当行使\u003c/h4>\n\u003cp>甲书将“滥用职权”解释为国家机关工作人员违法或者不当地行使职权，包括超越职权范围、不按照法定程序行使职权，或者利用职权实施法律所不允许的行为等情形。\u003c/p>\n\u003cp>在国家安全领域尤其需要注意：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>承担维护国家安全职责，并不意味着国家机关工作人员取得无限权限。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>例如：\u003c/p>\n\u003cul>\n\u003cli>超越法定权限采取措施；\u003c/li>\n\u003cli>在不具备法定条件时行使权力；\u003c/li>\n\u003cli>将国家安全职权用于与法定目的
