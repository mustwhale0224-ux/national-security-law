003cp>第43条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>国家机关及其工作人员在国家安全工作和涉及国家安全活动中，应当严格依法履行职责，不得超越职权、滥用职权，不得侵犯个人和组织的合法权益。\u003c/p>\n\u003c/blockquote>\n\u003cp>第7条与第43条的关系可以理解为：\n\u003cstrong>第7条：一般法治和人权原则\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第43条：国家机关依法履职的具体要求\u003c/strong>\n因此，在具体国家安全案件中，第7条可以提供原则性解释，第43条则更加直接地提出职权边界和合法权益保护要求。\u003c/p>\n\u003chr>\n\u003ch4>3. 第66条体现危机管控场景下较为明确的适当性和权益保护要求\u003c/h4>\n\u003cp>第66条规定，履行国家安全危机管控职责的有关机关依法采取管控措施时：\u003c/p>\n\u003cul>\n\u003cli>措施应当与国家安全危机可能造成危害的\u003cstrong>性质、程度和范围相适应\u003c/strong>；\u003c/li>\n\u003cli>存在多种措施可供选择时，应当选择有利于\u003cstrong>最大程度保护公民、组织权益\u003c/strong>的措施。\n这一规定具有较明显的比例控制特征，可以帮助理解第7条的人权保障原则如何落实到具体措施选择。\u003c/li>\n\u003c/ul>\n\u003cp>但必须注意适用范围：&gt; \u003cstrong>第66条位于第四章第五节“危机管控”，其直接规范对象是国家安全危机管控措施。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>4. 第83条对限制公民权利和自由的特别措施设置一般性的法律边界\u003c/h4>\n\u003cp>第83条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“在国家安全工作中，需要采取限制公民权利和自由的特别措施时，应当依法进行，并以维护国家安全的实际需要为限度。”\n与第66条相比，第83条使用的是更一般的“在国家安全工作中”，并直接针对“限制公民权利和自由的特别措施”。\n因此，它可以与第7条共同形成较为明确的解释结构：\u003cstrong>必须依法采取措施 + 限制程度以实际安全需要为限\u003c/strong>\n这一规定对于理解国家安全措施的必要性边界尤其重要。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>5. 采取国家安全措施的分析顺序〔笔记分析〕\u003c/h4>\n\u003cp>结合第7、43、66、82、83条，可以形成如下研究思路：\n\u003cstrong>第一步：审查职权。\u003c/strong>\u003cbr>谁采取措施？是否具有明确的法律职责和权限？\n\u003cstrong>第二步：审查事实基础。\u003c/strong>\u003cbr>存在什么现实或者潜在的国家安全风险？涉及第2条中的何种国家重大利益？\n\u003cstrong>第三步：审查目的。\u003c/strong>\u003cbr>具体措施是否真正服务于相应的国家安全目的？\n\u003cstrong>第四步：审查手段。\u003c/strong>\u003cbr>该措施是否能够促进安全目的实现？是否存在同样有效而对权利影响较小的方式？\n\u003cstrong>第五步：审查负担。\u003c/strong>\u003cbr>措施对公民、组织权益造成的限制是否超过应对风险实际需要？\n\u003cstrong>第六步：审查程序与救济。\u003c/strong>\u003cbr>审批、告知、陈述申辩、监督、申诉、控告、检举或者其他救济机制是否依法落实？\n可以简化为：\u003cstrong>职权依据 → 风险事实 → 目的 → 手段 → 限制程度 → 程序与救济\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>这一顺序是依据《国家安全法》多个条文归纳形成的\u003cstrong>分析框架\u003c/strong>，并不是第7条明文规定的一套统一六阶段审查程序。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>6. 比较法：普通权利限制与紧急状态下的权利削减应当区分\u003c/h4>\n\u003cp>《公民权利和政治权利国际公约》提供了一个有意义的比较视角。以表达自由为例，公约第19条第3款允许在法律规定且具有必要性的条件下，为保护国家安全、公共秩序等目的对表达自由作一定限制；第22条关于结社自由也设置了类似的“依法规定—合法目的—必要性”结构。\n与此不同，公约第4条处理的是威胁国家生存并经正式宣布的公共紧急状态。在这种情况下，缔约国可以在“情势严格需要”的范围内对部分公约义务采取克减措施，同时还受到不可克减权利等限制。\n因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>普通情形下的权利限制（restriction）与紧急状态下的义务削减（derogation）是两种不同的法律制度。\u003c/strong>\n比较研究中不能因两者都涉及“国家安全”而将其混同。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第7条在总则中的位置\u003c/h4>\n\u003cp>前六条主要解决：\u003cstrong>为什么立法 → 什么是国家安全 → 按照什么理念维护 → 谁来领导 → 中央领导机构做什么 → 如何制定国家安全战略\u003c/strong>\u003c/p>\n\u003cp>第7条开始进一步回答：&gt; \u003cstrong>国家安全工作应当受到什么法律边界约束？\u003c/strong>\u003c/p>\n\u003cp>因此，前七条可以形成一条非常清晰的逻辑链：\u003c/p>\n\u003cp>\u003cstrong>第1条：立法目的\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第2条：国家安全定义\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第3条：总体国家安全观\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第4—5条：领导体制与领导机构职责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：国家安全战略\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第7条：法治与人权边界\u003c/strong>\u003c/p>\n\u003cp>第7条由此具有明显的“限权”和“保障”功能。\u003c/p>\n\u003chr>\n\u003ch4>（二）核心关联条文\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>《宪法》第5条：\u003c/strong> 依法治国以及一切国家机关、组织遵守宪法和法律。\u003c/li>\n\u003cli>\u003cstrong>《宪法》第33条：\u003c/strong> 国家尊重和保障人权。\u003c/li>\n\u003cli>\u003cstrong>第13条：\u003c/strong> 国家机关工作人员滥用职权、玩忽职守、徇私舞弊的法律责任。\u003c/li>\n\u003cli>\u003cstrong>第43条：\u003c/strong> 严格依法履行职责，禁止越权、滥权和侵犯合法权益。\u003c/li>\n\u003cli>\u003cstrong>第66条：\u003c/strong> 国家安全危机管控措施的适当性与权益保护。\u003c/li>\n\u003cli>\u003cstrong>第82条：\u003c/strong> 批评建议以及申诉、控告、检举权。\u003c/li>\n\u003cli>\u003cstrong>第83条：\u003c/strong> 限制公民权利和自由的特别措施必须依法进行，并以实际需要为限。\u003c/li>\n\u003c/ul>\n\u003cp>可以概括为：\u003c/p>\n\u003cp>\u003cstrong>第7条：原则性人权和法治保障\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第43条：权力依法运行\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第66、83条：具体措施限度\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第82条：监督和救济\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（三）2014年《反间谍法》与现行《反间谍法》的对应关系\u003c/h4>\n\u003cp>学习时可以特别注意条文位置的变化：\n\u003cstrong>2014年《反间谍法》第5条：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>反间谍工作依法进行 + 尊重和保障人权 + 保障公民和组织合法权益。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2023年修订《反间谍法》第3条：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>反间谍工作依法进行 + 尊重和保障人权 + 保障个人和组织合法权益。\n基本原则得到延续，同时条文位置由第5条前移至第3条。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（四）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：只要措施是为了维护国家安全，就可以推定合法。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 国家安全目的与措施合法性属于两个层次。具体措施仍须符合职权、实体条件、程序和权利保障要求。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：国家安全属于特殊领域，因此可以不完全遵守一般法治原则。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第7条恰恰明确规定维护国家安全必须遵守宪法和法律，并尊重和保障人权。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：“尊重和保障人权”只是宣示性规定，没有具体制度意义。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第43、66、82、83条分别通过职权控制、措施控制、监督救济和权利限制边界对该原则进行具体展开。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：第66条的比例控制规则直接适用于所有国家安全措施。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第66条直接适用于国家安全危机管控措施。可以据此理解本法的权益保护理念，但向其他场景延伸时需要说明其体系解释性质。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：国家安全领域只需要讨论国家能否限制权利。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第7条同时规定“尊重和保障人权”“依法保护公民的权利和自由”。国家安全法还规定保护、补偿、监督和救济等积极保障制度。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>第7条能够在多大程度上成为具体国家安全措施的审查依据？\u003c/strong>\u003cbr>在专门法律没有明确规定比例控制标准时，能否依据第7条结合第43、83条形成更具体的合法性审查要求？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全领域的比例原则应当如何构造？\u003c/strong>\u003cbr>第66条已经明确规定危机管控中的适当性和较小权益损害要求，这种规范理念能否通过体系解释影响其他国家安全措施？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“实际需要为限度”如何具体判断？\u003c/strong>\u003cbr>第83条中的“实际需要”应当依据风险发生概率、危害程度、措施有效性还是其他因素进行评价？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何将“尊重和保障人权”转化为可操作的程序要求？\u003c/strong>\u003cbr>除职权和实体条件之外，国家安全行政活动是否应更加明确告知、陈述申辩、理由说明、记录留存和救济等程序要求？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全信息保密与有效救济之间如何协调？\u003c/strong>\u003cbr>当具体决定涉及国家秘密或者敏感安全信息时，如何既保护必要的国家安全信息，又使受影响主体能够有效了解决定依据并提出救济？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全措施的监督结构应当如何完善？\u003c/strong>\u003cbr>第82条赋予公民和组织批评建议、申诉、控告和检举权后，这些监督方式如何与行政复议、行政诉讼、监察监督以及内部监督机制形成衔接？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全与人权保障应当如何理解其规范关系？\u003c/strong>\u003cbr>是否应从简单的“安全与权利冲突”框架，进一步转向“安全目的—法定权限—措施必要性—权利保障—监督救济”的完整法治结构？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":8,"label":"第八条","title":"发展与安全、统筹兼顾","lawText":"维护国家安全，应当与经济社会发展相协调。\n\n国家安全工作应当统筹内部安全和外部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>发展与安全：\u003c/strong> 安全为发展提供稳定条件，发展又为安全提供物质基础和能力支撑，二者需要协调推进。\u003c/li>\n\u003cli>\u003cstrong>四组统筹关系：\u003c/strong> 内部与外部、国土与国民、传统与非传统、自身与共同安全，强调不同安全维度之间存在联系和风险传导。\u003c/li>\n\u003cli>\u003cstrong>统筹不等于平均：\u003c/strong> 不同阶段、领域和风险情境可以具有不同工作重点，关键是从整体国家安全出发确定轻重缓急。\u003c/li>\n\u003cli>\u003cstrong>防止风险转移：\u003c/strong> 一项措施降低某一领域风险的同时，可能增加其他领域、其他群体或者未来时期的风险，需要观察其综合效果。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 本条提供协调和统筹的法律原则，但不会单独产生审批、限制、处罚等具体职权；具体措施仍须具有相应的法律依据。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>维护国家安全，应当与经济社会发展相协调。\u003c/p>\n\u003cp>国家安全工作应当统筹内部安全和外部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>发展与安全：\u003c/strong> 安全为发展提供稳定条件，发展又为安全提供物质基础和能力支撑，二者需要协调推进。\u003c/li>\n\u003cli>\u003cstrong>四组统筹关系：\u003c/strong> 内部与外部、国土与国民、传统与非传统、自身与共同安全，强调不同安全维度之间存在联系和风险传导。\u003c/li>\n\u003cli>\u003cstrong>统筹不等于平均：\u003c/strong> 不同阶段、领域和风险情境可以具有不同工作重点，关键是从整体国家安全出发确定轻重缓急。\u003c/li>\n\u003cli>\u003cstrong>防止风险转移：\u003c/strong> 一项措施降低某一领域风险的同时，可能增加其他领域、其他群体或者未来时期的风险，需要观察其综合效果。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 本条提供协调和统筹的法律原则，但不会单独产生审批、限制、处罚等具体职权；具体措施仍须具有相应的法律依据。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>维护国家安全，应当与经济社会发展相协调。\u003c/p>\n\u003cp>国家安全工作应当统筹内部安全和外部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">发展与安全、统筹兼顾 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条确立国家安全工作的\u003cstrong>协调与统筹原则\u003c/strong>。第一款处理国家安全与经济社会发展的关系，第二款进一步规定四组需要统筹处理的安全关系。结合总体国家安全观提出时关于“发展问题与安全问题”的表述，可以将本条概括为\u003cstrong>一项协调原则与四组统筹关系，共五组关系\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>避免单一安全目标 → 识别不同利益和风险之间的联系 → 统筹判断 → 形成整体安全。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 2014年总体国家安全观提出“五对关系”\u003c/h4>\n\u003cp>2014年4月15日总体国家安全观提出时，明确要求处理好五组关系：\u003c/p>\n\u003cul>\n\u003cli>外部安全与内部安全；\u003c/li>\n\u003cli>国土安全与国民安全；\u003c/li>\n\u003cli>传统安全与非传统安全；\u003c/li>\n\u003cli>发展问题与安全问题；\u003c/li>\n\u003cli>自身安全与共同安全。\u003c/li>\n\u003c/ul>\n\u003cp>需要注意的是，2014年的理论表述是“\u003cstrong>既重视发展问题，又重视安全问题\u003c/strong>”，而现行第8条第一款将这种思想转换为法律语言：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“维护国家安全，应当与经济社会发展相协调。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，本条对五对关系进行了法律规范化表达。\u003c/p>\n\u003chr>\n\u003ch4>2. 2014年12月草案已经确立协调与统筹原则\u003c/h4>\n\u003cp>人大法工委释义书书附录二第375页所载2014年12月22日国家安全法草案说明，在介绍维护国家安全工作的基本原则时，已经明确列举：\u003c/p>\n\u003cblockquote>\n\u003cp>“坚持维护国家安全与经济社会发展相协调和统筹各领域安全原则。”\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，本条所体现的基本思路在草案初次审议阶段已经存在。草案说明的结构看，立法机关已经将其与法治和保障人权、预防为主和标本兼治等原则并列，作为维护国家安全工作的基本原则加以处理。\u003c/p>\n\u003chr>\n\u003ch4>3. 现行条文将“五对关系”转化为“一项协调＋四组统筹”\u003c/h4>\n\u003cp>最终通过的第8条采取两款结构：\u003c/p>\n\u003cp>\u003cstrong>第一款：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>国家安全与经济社会发展相协调。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>第二款：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>统筹内部安全与外部安全、国土安全与国民安全、传统安全与非传统安全、自身安全与共同安全。\u003c/p>\n\u003c/blockquote>\n\u003cp>这一结构具有一定的规范意义。\n“发展与安全”不仅属于不同安全问题之间的关系，还涉及国家安全目标与整个经济社会发展目标之间的协调，因此单列第一款。\u003c/p>\n\u003cp>其余四组则更直接属于国家安全体系内部不同维度之间的统筹关系，因此集中规定于第二款。\u003c/p>\n\u003cp>可以概括为：\u003c/p>\n\u003cp>\u003cstrong>第一款：安全与发展的外部协调\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第二款：国家安全体系内部的统筹协调\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>4. 后续“统筹发展和安全”的理论发展有助于理解本条，但不能倒置立法时间\u003c/h4>\n\u003cp>2015年以后，“统筹发展和安全”的理论与政策表述不断发展，对安全与发展的关系作出了更加系统的阐述。\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，国家安全应当与经济社会发展相协调\u003c/h4>\n\u003cp>第一款明确规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“维护国家安全，应当与经济社会发展相协调。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这是本条最重要的原则之一。发展与安全具有相互依存关系：\u003c/p>\n\u003cp>\u003cstrong>发展为安全提供物质基础和能力条件；安全为发展提供稳定环境和基本保障。\u003c/strong>\u003c/p>\n\u003cp>如果长期忽视安全问题，风险可能不断累积，最终反过来破坏经济社会发展；如果只追求降低特定安全风险，而完全不考虑有关措施对投资、创新、就业、技术发展和社会运行的影响，也可能削弱长期发展能力，并进一步影响国家持续维护安全的能力。\u003c/p>\n\u003chr>\n\u003ch4>第二，统筹内部安全和外部安全\u003c/h4>\n\u003cp>内部安全与外部安全主要从\u003cstrong>风险来源和作用空间\u003c/strong>观察国家安全。\u003c/p>\n\u003cp>内部安全关注发生或者作用于国内政治、经济、社会等领域的安全问题；外部安全则更多关注国际环境以及境外因素对国家安全产生的影响。\u003c/p>\n\u003cp>但二者并不能完全分开。在全球经济、信息网络、人员流动和产业链高度联系的条件下：\u003c/p>\n\u003cp>\u003cstrong>外部风险可能向国内传导，国内问题也可能产生跨境影响。\u003c/strong>\u003c/p>\n\u003cp>例如，国际经济变化可能通过供应链影响国内产业；网络攻击可能跨越国境实施；国内重大公共风险也可能经人员、商品或者信息流动产生跨境影响。\u003c/p>\n\u003cp>因此，本条要求的“统筹”首先意味着：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>不能简单以风险发生在境内还是境外，决定其国家安全性质和应对方式，而应当分析风险的来源、传播路径以及最终影响。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这一要求与第2条“不受内外威胁”的国家安全定义相互呼应。\u003c/p>\n\u003chr>\n\u003ch4>第三，统筹国土安全和国民安全\u003c/h4>\n\u003cp>国土安全主要涉及国家主权、统一和领土完整等国家存在的基本空间条件；国民安全则强调国家安全最终与人的生命、利益和生活状态密切相关。\u003c/p>\n\u003cp>二者在总体国家安全观中被同时提出，体现了国家与人民两个安全维度的结合。\u003c/p>\n\u003cp>可以简化为：\u003c/p>\n\u003cp>\u003cstrong>国土安全：国家的空间和主权基础\u003c/strong>\u003cbr>\u003cstrong>国民安全：人的安全与利益\u003c/strong>\u003c/p>\n\u003cp>两者不能割裂。维护国土安全最终服务于人民安全；保障国民安全也需要国家主权、领土和稳定政治秩序作为基本条件。\u003c/p>\n\u003cp>需要特别注意周尚君书第21页关于“国民安全”的表述。该书将国民安全概括为“\u003cstrong>领土内国民的安全\u003c/strong>”，这一表达作为简化说明可以帮助理解其与国土安全的区别，但如果将其理解为严格的法律范围，则容易过窄。\u003c/p>\n\u003cp>《国家安全法》第33条明确规定：\u003c/p>\n\u003cblockquote>\n\u003cp>国家依法采取必要措施，保护海外中国公民、组织和机构的安全和正当权益，保护国家的海外利益不受威胁和侵害。\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，至少不能从第8条中的“国民安全”进一步推导出：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全法对人的安全和利益的保护一律以中国领土范围为界。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>对于海外中国公民安全的具体保护范围、国家可以采取何种措施以及有关措施受到何种国际法和国内法约束，则需要结合第33条以及其他具体法律制度分别判断。\u003c/p>\n\u003chr>\n\u003ch4>第四，统筹传统安全和非传统安全\u003c/h4>\n\u003cp>传统安全通常较多涉及政治、国土、军事等经典国家安全领域；非传统安全则随着现代经济社会和科技发展不断扩展至经济、金融、科技、网络、生态、资源、公共卫生等领域。\u003c/p>\n\u003cp>总体国家安全观的重要变化之一，就是强调不能只从军事冲突、领土防卫等传统问题理解国家安全。\u003c/p>\n\u003cp>但传统安全与非传统安全也并非两个彼此封闭的领域。例如：\u003c/p>\n\u003cp>\u003cstrong>网络攻击 → 关键基础设施风险 → 经济运行风险 → 社会安全风险\u003c/strong>\u003c/p>\n\u003cp>又如：\u003c/p>\n\u003cp>\u003cstrong>资源能源风险 → 产业运行风险 → 经济安全 → 国家战略能力\u003c/strong>\u003c/p>\n\u003cp>因此，第8条要求“统筹”二者，核心并不是给每项风险贴上“传统”或“非传统”的标签，而是理解不同类型风险之间可能形成的\u003cstrong>交织、传导和叠加关系\u003c/strong>。\u003c/p>\n\u003cp>第二章对政治、国土、军事、经济、科技、网络与信息、生态、资源、核等领域国家安全任务的规定，可以视为这种综合安全理念的进一步展开。\u003c/p>\n\u003chr>\n\u003ch4>第五，统筹自身安全和共同安全\u003c/h4>\n\u003cp>自身安全首先要求维护本国的国家主权、安全和发展利益。但现代安全风险越来越具有跨国性质，一些风险仅依靠单一国家难以有效应对。因此，本条同时要求统筹“共同安全”。\u003c/p>\n\u003cp>第10条进一步规定：\u003c/p>\n\u003cblockquote>\n\u003cp>维护国家安全，应当坚持互信、互利、平等、协作，积极同外国政府和国际组织开展安全交流合作，履行国际安全义务，促进共同安全，维护世界和平。\u003c/p>\n\u003c/blockquote>\n\u003cp>由此可以看到：\u003c/p>\n\u003cp>\u003cstrong>第8条提出统筹自身安全与共同安全的原则；\u003c/strong>\u003cbr>\u003cstrong>第10条进一步规定通过国际安全合作促进共同安全。\u003c/strong>\u003c/p>\n\u003cp>因此，“共同安全”并不意味着放弃本国正当安全利益，而是要求认识到不同国家在某些安全领域存在相互依赖关系，一国的安全环境也可能受到地区和国际安全环境影响。\u003c/p>\n\u003chr>\n\u003ch4>第六，五组关系的核心不是“平均”，而是“统筹”\u003c/h4>\n\u003cp>本条最容易产生的误解，是把“协调”“统筹”理解为对不同安全利益进行机械平均。实际上，不同安全利益在具体时期的重要程度可能明显不同。\n发生重大公共安全事件时，某项风险可能成为短期工作的重点；在长期发展阶段，科技、产业或者资源安全能力又可能成为优先建设对象。\n因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>统筹兼顾不意味着任何时候所有安全目标都取得相同权重。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>其核心要求是，在确定重点之前充分识别不同领域之间的联系，并考虑某项决定可能对其他国家安全利益和经济社会发展产生的影响。\u003c/p>\n\u003cp>可以形成如下判断结构：\u003c/p>\n\u003cp>\u003cstrong>识别主要风险\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>分析与其他安全领域的联系\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>判断风险轻重缓急\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>考察措施的跨领域影响\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>确定当前工作重点\u003c/strong>\u003c/p>\n\u003cp>因此，统筹本身是一种\u003cstrong>整体判断方法\u003c/strong>，而不是固定的利益排序公式。\u003c/p>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 第8条体现一种“关系型”的国家安全原则\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>第2条主要界定国家安全保护什么，第3条规定按照何种总体理念维护安全，而第8条进一步处理不同目标和不同安全领域\u003cstrong>彼此之间的关系\u003c/strong>。\u003c/p>\n\u003cp>因此，本条的特殊之处在于：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它并不主要规定一种新的国家安全利益，而是规定国家如何处理多个安全和发展目标之间的关系。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这种关系型规范特别适合用于分析跨领域问题。\u003c/p>\n\u003cp>当一项国家安全政策同时涉及经济、科技、社会或者国际合作时，第8条要求决策者不能只观察某一部门的局部效果，而需要考察其整体影响。\u003c/p>\n\u003chr>\n\u003ch4>2. 国家安全措施可能产生“风险转移”\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>一项措施可能有效降低某一种安全风险，却同时增加另一种风险。\u003c/p>\n\u003cp>例如，从纯粹分析模型看：\u003c/p>\n\u003cp>\u003cstrong>严格限制某项活动\u003c/strong>\u003cbr>→ 可能降低短期直接安全风险；\u003c/p>\n\u003cp>但同时也可能：\u003c/p>\n\u003cp>→ 增加供应不足、创新受阻、信息不畅或者成本上升等风险。\u003c/p>\n\u003cp>反过来，完全追求经济效率或者开放便利，也可能增加某些安全脆弱性。\u003c/p>\n\u003cp>因此，第8条提供了一个重要研究视角：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>评价国家安全政策不能只问“它降低了什么风险”，还要问“它是否把风险转移到了其他领域、其他主体或者未来时期”。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这也是“总体安全”与单项风险控制之间的重要区别。\u003c/p>\n\u003chr>\n\u003ch4>3. 统筹分析至少应注意领域、群体和时间三个维度\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>依据本条，可以进一步把国家安全措施的综合影响分为三个维度观察。\u003c/p>\n\u003cp>\u003cstrong>第一，领域维度。\u003c/strong>\u003c/p>\n\u003cp>某一领域风险下降，是否导致经济、科技、社会或者其他领域产生新的风险？\u003c/p>\n\u003cp>\u003cstrong>第二，群体维度。\u003c/strong>\u003c/p>\n\u003cp>总体安全收益是否建立在特定行业、企业或者个人承担高度集中负担的基础上？\u003c/p>\n\u003cp>\u003cstrong>第三，时间维度。\u003c/strong>\u003c/p>\n\u003cp>短期风险降低是否可能以长期能力下降为代价？短期经济成本是否可能换来必要的长期安全能力？\u003c/p>\n\u003cp>因此，可以形成一个较实用的分析框架：\u003c/p>\n\u003cp>\u003cstrong>直接安全效果 + 跨领域影响 + 负担分布 + 长期影响\u003c/strong>\u003c/p>\n\u003cp>这一框架属于基于第8条形成的研究工具，并不是法条明确列举的四项法定审查步骤。\u003c/p>\n\u003chr>\n\u003ch4>4. “与经济社会发展相协调”提供法律论证方向，但不是统一的成本收益公式\u003c/h4>\n\u003cp>本条明确要求国家安全与经济社会发展相协调，因此，在分析具体国家安全制度时，可以合理追问：\u003c/p>\n\u003cul>\n\u003cli>安全风险究竟是什么；\u003c/li>\n\u003cli>措施能够带来什么安全收益；\u003c/li>\n\u003cli>对经济社会发展产生什么影响；\u003c/li>\n\u003cli>是否存在能够同时降低风险和减少发展成本的替代方式；\u003c/li>\n\u003cli>长期安全能力是否因此增强或者削弱。\u003c/li>\n\u003c/ul>\n\u003cp>但本条并没有规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“安全收益必须超过经济成本达到某一比例”；\u003c/p>\n\u003c/blockquote>\n\u003cp>也没有建立统一的成本收益计算方法。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“相协调”是一项法律原则和论证要求，不是一套已经量化的计算公式。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>具体行业和制度仍需结合相应专门法律确定安全标准、监管程序和措施条件。\u003c/p>\n\u003chr>\n\u003ch4>5. 第8条不能单独成为具体限制措施的授权依据\u003c/h4>\n\u003cp>〔体系解释〕\u003c/p>\n\u003cp>本条规定国家安全工作的协调和统筹原则，并没有直接规定国家机关可以实施何种审批、调查、审查、限制或者处罚措施。\u003c/p>\n\u003cp>因此，即使某项监管措施能够被解释为有利于协调安全与发展，也仍然必须进一步查明：\u003c/p>\n\u003cp>\u003cstrong>谁有权采取措施\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>法律依据是什么\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>适用条件是什么\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>程序如何进行\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>权利如何得到保障\u003c/strong>\u003c/p>\n\u003cp>这一点与第7条、第43条关于依法履职的要求一致。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第8条可以参与解释具体制度为什么这样设计，但不能自行创设具体公权力。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>6. 国民安全不能机械地理解为“境内居民安全”\u003c/h4>\n\u003cp>〔体系解释〕\u003c/p>\n\u003cp>乙书将“国民安全”解释为“领土内国民的安全”，其目的主要是与“国土安全”形成对照。\u003c/p>\n\u003cp>但从整部《国家安全法》的体系来看，这一表述不宜被绝对化。\u003c/p>\n\u003cp>一方面，第3条将人民安全规定为国家安全工作的宗旨；另一方面，第33条明确要求国家保护海外中国公民、组织和机构的安全和正当权益。\u003c/p>\n\u003cp>因此，更稳妥的理解是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“国土—国民”这组关系强调国家安全既要关注领土和主权，也要关注人的安全；至于国家对境内、境外不同主体承担何种具体保护义务，应继续结合有关条文判断。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这样既保留总体国家安全观中“国土安全—国民安全”的理论意义，也避免把第8条中的概念解释得过窄。\u003c/p>\n\u003chr>\n\u003ch3>五、实例、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）数据跨境流动：安全与发展的典型协调场景\u003c/h4>\n\u003cp>乙书第21—22页以CPTPP数据跨境议题以及2022年《数据出境安全评估办法》为例，说明数据领域同时存在两种需求：\u003c/p>\n\u003cp>\u003cstrong>数据流动和利用\u003c/strong>\u003cbr>↕\u003cbr>\u003cstrong>数据安全与个人信息保护\u003c/strong>\u003c/p>\n\u003cp>这一例子适合用于理解第8条第一款。\u003c/p>\n\u003cp>数据作为经济和技术活动的重要要素，跨境流动可能服务国际贸易、科研合作和企业经营；与此同时，重要数据和个人信息出境又可能产生数据安全和个人权益风险。\u003c/p>\n\u003cp>因此，问题并不是简单选择“允许数据流动”或者“禁止数据流动”，而是如何通过具体制度区分不同风险水平并配置相应监管措施。\u003c/p>\n\u003chr>\n\u003ch4>（二）2024年数据出境规则进一步体现分类协调思路\u003c/h4>\n\u003cp>2024年公布的《促进和规范数据跨境流动规定》进一步调整数据出境制度。\u003c/p>\n\u003cp>该规定对部分国际贸易、跨境运输、学术合作、跨国生产制造等场景，以及符合特定条件的个人信息出境活动，规定可以免予申报数据出境安全评估、订立个人信息出境标准合同或者通过个人信息保护认证；与此同时，数据处理者仍需依法履行个人信息保护和数据安全保护义务。\u003c/p>\n\u003cp>因此，它可以作为观察“安全与发展协调”的一个后续制度实例：\u003c/p>\n\u003cp>\u003cstrong>根据风险进行分类 → 对部分低风险活动减少程序负担 → 对较高风险活动继续实施监管 → 数据安全义务持续存在\u003c/strong>\u003c/p>\n\u003cp>需要严格区分其法律依据：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>上述具体豁免条件和数据安全义务来源于网络安全、数据安全、个人信息保护等专门法律法规及《促进和规范数据跨境流动规定》本身，并非直接由《国家安全法》第8条创设。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第8条在这里主要提供的是理解制度目标的总体原则，而不是具体数据出境监管措施的授权规范。\u003c/p>\n\u003chr>\n\u003ch4>（三）核心关联条文\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>第2条：国家安全定义。\u003c/strong> 将人民福祉、经济社会可持续发展纳入国家安全保护对象。\u003c/li>\n\u003cli>\u003cstrong>第3条：总体国家安全观。\u003c/strong> 为本条的五组统筹关系提供总体框架。\u003c/li>\n\u003cli>\u003cstrong>第7条：法治和人权保障。\u003c/strong> 要求统筹安全时仍遵守法定权限和权利保障要求。\u003c/li>\n\u003cli>\u003cstrong>第10条：共同安全。\u003c/strong> 进一步展开自身安全与共同安全之间的关系。\u003c/li>\n\u003cli>\u003cstrong>第二章：各领域国家安全任务。\u003c/strong> 将传统与非传统安全具体展开到不同领域。\u003c/li>\n\u003cli>\u003cstrong>第33条：海外利益安全。\u003c/strong> 对海外中国公民、组织和机构安全与正当权益作出规定。\u003c/li>\n\u003cli>\u003cstrong>第34条：动态完善国家安全任务。\u003c/strong> 根据经济社会发展和国家发展利益需要不断完善维护国家安全的任务。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>（四）第3条与第8条的关系\u003c/h4>\n\u003cp>两条均与总体国家安全观密切相关，但规范功能不同。\u003c/p>\n\u003cp>\u003cstrong>第3条回答：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>国家安全工作的总体指导思想和基本结构是什么？\u003c/p>\n\u003c/blockquote>\n\u003cp>主要规定：\u003c/p>\n\u003cp>\u003cstrong>人民安全—政治安全—经济安全—各领域安全—国际安全\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第8条回答：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>当不同安全和发展目标同时存在时，应如何处理它们之间的关系？\u003c/p>\n\u003c/blockquote>\n\u003cp>主要规定：\u003c/p>\n\u003cp>\u003cstrong>协调 + 统筹\u003c/strong>\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第3条：总体结构\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第8条：统筹方法\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（五）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：第8条第二款规定了五组统筹关系。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第二款直接规定四组关系。将第一款“发展与安全”计入后，可以在总体国家安全观意义上概括为五组关系。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：统筹不同安全意味着各种安全在任何情况下都具有相同重要性。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 统筹强调综合判断，不是机械平均。不同安全风险在不同时间和情境下可以具有不同优先程度。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：安全与发展相协调意味着任何安全措施都必须通过经济成本收益计算。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 本条没有规定统一量化公式。“相协调”提供法律论证方向，具体评价方法仍需结合相关制度和事实确定。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：“国民安全”只包括中国领土内人员的安全。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 国土安全与国民安全的区分强调国家空间安全和人的安全两个维度。《国家安全法》第33条同时明确保护海外中国公民等主体的安全和正当权益，因此不能将国家安全法上的人的安全保护机械限定于境内。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：非传统安全已经取代传统安全。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第8条明确要求统筹传统安全与非传统安全，二者同时存在且可能相互作用。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：维护自身安全与促进共同安全相互冲突。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 本条要求统筹二者，第10条进一步规定通过互信、互利、平等、协作以及国际安全合作促进共同安全。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点7：第8条可以直接作为数据出境限制或者其他监管措施的法律授权。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第8条属于协调与统筹原则。数据出境安全评估、豁免或者其他具体监管措施仍须依据数据安全、个人信息保护等专门法律规范确定。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>如何判断安全与发展已经实现“相协调”？\u003c/strong>\u003cbr>评价时应重点观察短期安全收益、经济社会成本，还是还应考虑长期安全能力、技术发展和社会韧性？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何识别国家安全措施造成的风险转移？\u003c/strong>\u003cbr>一项措施降低某一领域风险，却增加其他领域、其他群体或者未来时期风险时，应如何进行整体评价？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>统筹原则是否能够形成较具体的法律审查标准？\u003c/strong>\u003cbr>第8条能否要求国家机关在重大安全决策中说明对经济社会发展以及其他安全领域的影响，还是主要发挥政策和体系解释功能？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“国民安全”的法律范围应当如何解释？\u003c/strong>\u003cbr>在第8条、第16条和第33条共同构成的规范体系中，境内人民安全与海外中国公民安全之间应如何建立体系联系？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>传统安全与非传统安全发生交叉时如何确定法律适用？\u003c/strong>\u003cbr>当网络风险进一步影响军事、经济或者社会安全时，是根据最初风险领域确定适用规范，还是根据最终受到影响的国家重大利益进行判断？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何理解自身安全与共同安全之间的边界？\u003c/strong>\u003cbr>当不同国家对同一安全措施的利益评价存在明显差异时，如何在维护本国正当安全利益与促进共同安全之间进行法律和政策协调？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>数据跨境制度能否形成“统筹安全与发展”的可检验样本？\u003c/strong>\u003cbr>可以进一步比较2022年与2024年数据出境规则在风险分类、程序负担和安全保护方面的变化，分析制度调整是否体现了更加精细的风险治理。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>第8条能否发展出“整体安全效果”的评价方法？\u003c/strong>\u003cbr>相较于仅考察单一领域风险是否下降，是否可以建立包含直接效果、跨领域影响、负担分布和长期后果的综合评价框架？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条确立国家安全工作的\u003cstrong>协调与统筹原则\u003c/strong>。第一款处理国家安全与经济社会发展的关系，第二款进一步规定四组需要统筹处理的安全关系。结合总体国家安全观提出时关于“发展问题与安全问题”的表述，可以将本条概括为\u003cstrong>一项协调原则与四组统筹关系，共五组关系\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>避免单一安全目标 → 识别不同利益和风险之间的联系 → 统筹判断 → 形成整体安全。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 2014年总体国家安全观提出“五对关系”\u003c/h4>\n\u003cp>2014年4月15日总体国家安全观提出时，明确要求处理好五组关系：\u003c/p>\n\u003cul>\n\u003cli>外部安全与内部安全；\u003c/li>\n\u003cli>国土安全与国民安全；\u003c/li>\n\u003cli>传统安全与非传统安全；\u003c/li>\n\u003cli>发展问题与安全问题；\u003c/li>\n\u003cli>自身安全与共同安全。\u003c/li>\n\u003c/ul>\n\u003cp>需要注意的是，2014年的理论表述是“\u003cstrong>既重视发展问题，又重视安全问题\u003c/strong>”，而现行第8条第一款将这种思想转换为法律语言：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“维护国家安全，应当与经济社会发展相协调。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，本条对五对关系进行了法律规范化表达。\u003c/p>\n\u003chr>\n\u003ch4>2. 2014年12月草案已经确立协调与统筹原则\u003c/h4>\n\u003cp>人大法工委释义书书附录二第375页所载2014年12月22日国家安全法草案说明，在介绍维护国家安全工作的基本原则时，已经明确列举：\u003c/p>\n\u003cblockquote>\n\u003cp>“坚持维护国家安全与经济社会发展相协调和统筹各领域安全原则。”\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，本条所体现的基本思路在草案初次审议阶段已经存在。草案说明的结构看，立法机关已经将其与法治和保障人权、预防为主和标本兼治等原则并列，作为维护国家安全工作的基本原则加以处理。\u003c/p>\n\u003chr>\n\u003ch4>3. 现行条文将“五对关系”转化为“一项协调＋四组统筹”\u003c/h4>\n\u003cp>最终通过的第8条采取两款结构：\u003c/p>\n\u003cp>\u003cstrong>第一款：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>国家安全与经济社会发展相协调。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>第二款：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>统筹内部安全与外部安全、国土安全与国民安全、传统安全与非传统安全、自身安全与共同安全。\u003c/p>\n\u003c/blockquote>\n\u003cp>这一结构具有一定的规范意义。\n“发展与安全”不仅属于不同安全问题之间的关系，还涉及国家安全目标与整个经济社会发展目标之间的协调，因此单列第一款。\u003c/p>\n\u003cp>其余四组则更直接属于国家安全体系内部不同维度之间的统筹关系，因此集中规定于第二款。\u003c/p>\n\u003cp>可以概括为：\u003c/p>\n\u003cp>\u003cstrong>第一款：安全与发展的外部协调\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第二款：国家安全体系内部的统筹协调\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>4. 后续“统筹发展和安全”的理论发展有助于理解本条，但不能倒置立法时间\u003c/h4>\n\u003cp>2015年以后，“统筹发展和安全”的理论与政策表述不断发展，对安全与发展的关系作出了更加系统的阐述。\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，国家安全应当与经济社会发展相协调\u003c/h4>\n\u003cp>第一款明确规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“维护国家安全，应当与经济社会发展相协调。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这是本条最重要的原则之一。发展与安全具有相互依存关系：\u003c/p>\n\u003cp>\u003cstrong>发展为安全提供物质基础和能力条件；安全为发展提供稳定环境和基本保障。\u003c/strong>\u003c/p>\n\u003cp>如果长期忽视安全问题，风险可能不断累积，最终反过来破坏经济社会发展；如果只追求降低特定安全风险，而完全不考虑有关措施对投资、创新、就业、技术发展和社会运行的影响，也可能削弱长期发展能力，并进一步影响国家持续维护安全的能力。\u003c/p>\n\u003chr>\n\u003ch4>第二，统筹内部安全和外部安全\u003c/h4>\n\u003cp>内部安全与外部安全主要从\u003cstrong>风险来源和作用空间\u003c/strong>观察国家安全。\u003c/p>\n\u003cp>内部安全关注发生或者作用于国内政治、经济、社会等领域的安全问题；外部安全则更多关注国际环境以及境外因素对国家安全产生的影响。\u003c/p>\n\u003cp>但二者并不能完全分开。在全球经济、信息网络、人员流动和产业链高度联系的条件下：\u003c/p>\n\u003cp>\u003cstrong>外部风险可能向国内传导，国内问题也可能产生跨境影响。\u003c/strong>\u003c/p>\n\u003cp>例如，国际经济变化可能通过供应链影响国内产业；网络攻击可能跨越国境实施；国内重大公共风险也可能经人员、商品或者信息流动产生跨境影响。\u003c/p>\n\u003cp>因此，本条要求的“统筹”首先意味着：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>不能简单以风险发生在境内还是境外，决定其国家安全性质和应对方式，而应当分析风险的来源、传播路径以及最终影响。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这一要求与第2条“不受内外威胁”的国家安全定义相互呼应。\u003c/p>\n\u003chr>\n\u003ch4>第三，统筹国土安全和国民安全\u003c/h4>\n\u003cp>国土安全主要涉及国家主权、统一和领土完整等国家存在的基本空间条件；国民安全则强调国家安全最终与人的生命、利益和生活状态密切相关。\u003c/p>\n\u003cp>二者在总体国家安全观中被同时提出，体现了国家与人民两个安全维度的结合。\u003c/p>\n\u003cp>可以简化为：\u003c/p>\n\u003cp>\u003cstrong>国土安全：国家的空间和主权基础\u003c/strong>\u003cbr>\u003cstrong>国民安全：人的安全与利益\u003c/strong>\u003c/p>\n\u003cp>两者不能割裂。维护国土安全最终服务于人民安全；保障国民安全也需要国家主权、领土和稳定政治秩序作为基本条件。\u003c/p>\n\u003cp>需要特别注意周尚君书第21页关于“国民安全”的表述。该书将国民安全概括为“\u003cstrong>领土内国民的安全\u003c/strong>”，这一表达作为简化说明可以帮助理解其与国土安全的区别，但如果将其理解为严格的法律范围，则容易过窄。\u003c/p>\n\u003cp>《国家安全法》第33条明确规定：\u003c/p>\n\u003cblockquote>\n\u003cp>国家依法采取必要措施，保护海外中国公民、组织和机构的安全和正当权益，保护国家的海外利益不受威胁和侵害。\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，至少不能从第8条中的“国民安全”进一步推导出：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全法对人的安全和利益的保护一律以中国领土范围为界。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>对于海外中国公民安全的具体保护范围、国家可以采取何种措施以及有关措施受到何种国际法和国内法约束，则需要结合第33条以及其他具体法律制度分别判断。\u003c/p>\n\u003chr>\n\u003ch4>第四，统筹传统安全和非传统安全\u003c/h4>\n\u003cp>传统安全通常较多涉及政治、国土、军事等经典国家安全领域；非传统安全则随着现代经济社会和科技发展不断扩展至经济、金融、科技、网络、生态、资源、公共卫生等领域。\u003c/p>\n\u003cp>总体国家安全观的重要变化之一，就是强调不能只从军事冲突、领土防卫等传统问题理解国家安全。\u003c/p>\n\u003cp>但传统安全与非传统安全也并非两个彼此封闭的领域。例如：\u003c/p>\n\u003cp>\u003cstrong>网络攻击 → 关键基础设施风险 → 经济运行风险 → 社会安全风险\u003c/strong>\u003c/p>\n\u003cp>又如：\u003c/p>\n\u003cp>\u003cstrong>资源能源风险 → 产业运行风险 → 经济安全 → 国家战略能力\u003c/strong>\u003c/p>\n\u003cp>因此，第8条要求“统筹”二者，核心并不是给每项风险贴上“传统”或“非传统”的标签，而是理解不同类型风险之间可能形成的\u003cstrong>交织、传导和叠加关系\u003c/strong>。\u003c/p>\n\u003cp>第二章对政治、国土、军事、经济、科技、网络与信息、生态、资源、核等领域国家安全任务的规定，可以视为这种综合安全理念的进一步展开。\u003c/p>\n\u003chr>\n\u003ch4>第五，统筹自身安全和共同安全\u003c/h4>\n\u003cp>自身安全首先要求维护本国的国家主权、安全和发展利益。但现代安全风险越来越具有跨国性质，一些风险仅依靠单一国家难以有效应对。因此，本条同时要求统筹“共同安全”。\u003c/p>\n\u003cp>第10条进一步规定：\u003c/p>\n\u003cblockquote>\n\u003cp>维护国家安全，应当坚持互信、互利、平等、协作，积极同外国政府和国际组织开展安全交流合作，履行国际安全义务，促进共同安全，维护世界和平。\u003c/p>\n\u003c/blockquote>\n\u003cp>由此可以看到：\u003c/p>\n\u003cp>\u003cstrong>第8条提出统筹自身安全与共同安全的原则；\u003c/strong>\u003cbr>\u003cstrong>第10条进一步规定通过国际安全合作促进共同安全。\u003c/strong>\u003c/p>\n\u003cp>因此，“共同安全”并不意味着放弃本国正当安全利益，而是要求认识到不同国家在某些安全领域存在相互依赖关系，一国的安全环境也可能受到地区和国际安全环境影响。\u003c/p>\n\u003chr>\n\u003ch4>第六，五组关系的核心不是“平均”，而是“统筹”\u003c/h4>\n\u003cp>本条最容易产生的误解，是把“协调”“统筹”理解为对不同安全利益进行机械平均。实际上，不同安全利益在具体时期的重要程度可能明显不同。\n发生重大公共安全事件时，某项风险可能成为短期工作的重点；在长期发展阶段，科技、产业或者资源安全能力又可能成为优先建设对象。\n因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>统筹兼顾不意味着任何时候所有安全目标都取得相同权重。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>其核心要求是，在确定重点之前充分识别不同领域之间的联系，并考虑某项决定可能对其他国家安全利益和经济社会发展产生的影响。\u003c/p>\n\u003cp>可以形成如下判断结构：\u003c/p>\n\u003cp>\u003cstrong>识别主要风险\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>分析与其他安全领域的联系\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>判断风险轻重缓急\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>考察措施的跨领域影响\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>确定当前工作重点\u003c/strong>\u003c/p>\n\u003cp>因此，统筹本身是一种\u003cstrong>整体判断方法\u003c/strong>，而不是固定的利益排序公式。\u003c/p>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 第8条体现一种“关系型”的国家安全原则\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>第2条主要界定国家安全保护什么，第3条规定按照何种总体理念维护安全，而第8条进一步处理不同目标和不同安全领域\u003cstrong>彼此之间的关系\u003c/strong>。\u003c/p>\n\u003cp>因此，本条的特殊之处在于：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它并不主要规定一种新的国家安全利益，而是规定国家如何处理多个安全和发展目标之间的关系。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这种关系型规范特别适合用于分析跨领域问题。\u003c/p>\n\u003cp>当一项国家安全政策同时涉及经济、科技、社会或者国际合作时，第8条要求决策者不能只观察某一部门的局部效果，而需要考察其整体影响。\u003c/p>\n\u003chr>\n\u003ch4>2. 国家安全措施可能产生“风险转移”\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>一项措施可能有效降低某一种安全风险，却同时增加另一种风险。\u003c/p>\n\u003cp>例如，从纯粹分析模型看：\u003c/p>\n\u003cp>\u003cstrong>严格限制某项活动\u003c/strong>\u003cbr>→ 可能降低短期直接安全风险；\u003c/p>\n\u003cp>但同时也可能：\u003c/p>\n\u003cp>→ 增加供应不足、创新受阻、信息不畅或者成本上升等风险。\u003c/p>\n\u003cp>反过来，完全追求经济效率或者开放便利，也可能增加某些安全脆弱性。\u003c/p>\n\u003cp>因此，第8条提供了一个重要研究视角：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>评价国家安全政策不能只问“它降低了什么风险”，还要问“它是否把风险转移到了其他领域、其他主体或者未来时期”。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这也是“总体安全”与单项风险控制之间的重要区别。\u003c/p>\n\u003chr>\n\u003ch4>3. 统筹分析至少应注意领域、群体和时间三个维度\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>依据本条，可以进一步把国家安全措施的综合影响分为三个维度观察。\u003c/p>\n\u003cp>\u003cstrong>第一，领域维度。\u003c/strong>\u003c/p>\n\u003cp>某一领域风险下降，是否导致经济、科技、社会或者其他领域产生新的风险？\u003c/p>\n\u003cp>\u003cstrong>第二，群体维度。\u003c/strong>\u003c/p>\n\u003cp>总体安全收益是否建立在特定行业、企业或者个人承担高度集中负担的基础上？\u003c/p>\n\u003cp>\u003cstrong>第三，时间维度。\u003c/strong>\u003c/p>\n\u003cp>短期风险降低是否可能以长期能力下降为代价？短期经济成本是否可能换来必要的长期安全能力？\u003c/p>\n\u003cp>因此，可以形成一个较实用的分析框架：\u003c/p>\n\u003cp>\u003cstrong>直接安全效果 + 跨领域影响 + 负担分布 + 长期影响\u003c/strong>\u003c/p>\n\u003cp>这一框架属于基于第8条形成的研究工具，并不是法条明确列举的四项法定审查步骤。\u003c/p>\n\u003chr>\n\u003ch4>4. “与经济社会发展相协调”提供法律论证方向，但不是统一的成本收益公式\u003c/h4>\n\u003cp>本条明确要求国家安全与经济社会发展相协调，因此，在分析具体国家安全制度时，可以合理追问：\u003c/p>\n\u003cul>\n\u003cli>安全风险究竟是什么；\u003c/li>\n\u003cli>措施能够带来什么安全收益；\u003c/li>\n\u003cli>对经济社会发展产生什么影响；\u003c/li>\n\u003cli>是否存在能够同时降低风险和减少发展成本的替代方式；\u003c/li>\n\u003cli>长期安全能力是否因此增强或者削弱。\u003c/li>\n\u003c/ul>\n\u003cp>但本条并没有规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“安全收益必须超过经济成本达到某一比例”；\u003c/p>\n\u003c/blockquote>\n\u003cp>也没有建立统一的成本收益计算方法。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“相协调”是一项法律原则和论证要求，不是一套已经量化的计算公式。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>具体行业和制度仍需结合相应专门法律确定安全标准、监管程序和措施条件。\u003c/p>\n\u003chr>\n\u003ch4>5. 第8条不能单独成为具体限制措施的授权依据\u003c/h4>\n\u003cp>〔体系解释〕\u003c/p>\n\u003cp>本条规定国家安全工作的协调和统筹原则，并没有直接规定国家机关可以实施何种审批、调查、审查、限制或者处罚措施。\u003c/p>\n\u003cp>因此，即使某项监管措施能够被解释为有利于协调安全与发展，也仍然必须进一步查明：\u003c/p>\n\u003cp>\u003cstrong>谁有权采取措施\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>法律依据是什么\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>适用条件是什么\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>程序如何进行\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>权利如何得到保障\u003c/strong>\u003c/p>\n\u003cp>这一点与第7条、第43条关于依法履职的要求一致。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第8条可以参与解释具体制度为什么这样设计，但不能自行创设具体公权力。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>6. 国民安全不能机械地理解为“境内居民安全”\u003c/h4>\n\u003cp>〔体系解释〕\u003c/p>\n\u003cp>乙书将“国民安全”解释为“领土内国民的安全”，其目的主要是与“国土安全”形成对照。\u003c/p>\n\u003cp>但从整部《国家安全法》的体系来看，这一表述不宜被绝对化。\u003c/p>\n\u003cp>一方面，第3条将人民安全规定为国家安全工作的宗旨；另一方面，第33条明确要求国家保护海外中国公民、组织和机构的安全和正当权益。\u003c/p>\n\u003cp>因此，更稳妥的理解是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“国土—国民”这组关系强调国家安全既要关注领土和主权，也要关注人的安全；至于国家对境内、境外不同主体承担何种具体保护义务，应继续结合有关条文判断。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这样既保留总体国家安全观中“国土安全—国民安全”的理论意义，也避免把第8条中的概念解释得过窄。\u003c/p>\n\u003chr>\n\u003ch3>五、实例、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）数据跨境流动：安全与发展的典型协调场景\u003c/h4>\n\u003cp>乙书第21—22页以CPTPP数据跨境议题以及2022年《数据出境安全评估办法》为例，说明数据领域同时存在两种需求：\u003c/p>\n\u003cp>\u003cstrong>数据流动和利用\u003c/strong>\u003cbr>↕\u003cbr>\u003cstrong>数据安全与个人信息保护\u003c/strong>\u003c/p>\n\u003cp>这一例子适合用于理解第8条第一款。\u003c/p>\n\u003cp>数据作为经济和技术活动的重要要素，跨境流动可能服务国际贸易、科研合作和企业经营；与此同时，重要数据和个人信息出境又可能产生数据安全和个人权益风险。\u003c/p>\n\u003cp>因此，问题并不是简单选择“允许数据流动”或者“禁止数据流动”，而是如何通过具体制度区分不同风险水平并配置相应监管措施。\u003c/p>\n\u003chr>\n\u003ch4>（二）2024年数据出境规则进一步体现分类协调思路\u003c/h4>\n\u003cp>2024年公布的《促进和规范数据跨境流动规定》进一步调整数据出境制度。\u003c/p>\n\u003cp>该规定对部分国际贸易、跨境运输、学术合作、跨国生产制造等场景，以及符合特定条件的个人信息出境活动，规定可以免予申报数据出境安全评估、订立个人信息出境标准合同或者通过个人信息保护认证；与此同时，数据处理者仍需依法履行个人信息保护和数据安全保护义务。\u003c/p>\n\u003cp>因此，它可以作为观察“安全与发展协调”的一个后续制度实例：\u003c/p>\n\u003cp>\u003cstrong>根据风险进行分类 → 对部分低风险活动减少程序负担 → 对较高风险活动继续实施监管 → 数据安全义务持续存在\u003c/strong>\u003c/p>\n\u003cp>需要严格区分其法律依据：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>上述具体豁免条件和数据安全义务来源于网络安全、数据安全、个人信息保护等专门法律法规及《促进和规范数据跨境流动规定》本身，并非直接由《国家安全法》第8条创设。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第8条在这里主要提供的是理解制度目标的总体原则，而不是具体数据出境监管措施的授权规范。\u003c/p>\n\u003chr>\n\u003ch4>（三）核心关联条文\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>第2条：国家安全定义。\u003c/strong> 将人民福祉、经济社会可持续发展纳入国家安全保护对象。\u003c/li>\n\u003cli>\u003cstrong>第3条：总体国家安全观。\u003c/strong> 为本条的五组统筹关系提供总体框架。\u003c/li>\n\u003cli>\u003cstrong>第7条：法治和人权保障。\u003c/strong> 要求统筹安全时仍遵守法定权限和权利保障要求。\u003c/li>\n\u003cli>\u003cstrong>第10条：共同安全。\u003c/strong> 进一步展开自身安全与共同安全之间的关系。\u003c/li>\n\u003cli>\u003cstrong>第二章：各领域国家安全任务。\u003c/strong> 将传统与非传统安全具体展开到不同领域。\u003c/li>\n\u003cli>\u003cstrong>第33条：海外利益安全。\u003c/strong> 对海外中国公民、组织和机构安全与正当权益作出规定。\u003c/li>\n\u003cli>\u003cstrong>第34条：动态完善国家安全任务。\u003c/strong> 根据经济社会发展和国家发展利益需要不断完善维护国家安全的任务。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>（四）第3条与第8条的关系\u003c/h4>\n\u003cp>两条均与总体国家安全观密切相关，但规范功能不同。\u003c/p>\n\u003cp>\u003cstrong>第3条回答：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>国家安全工作的总体指导思想和基本结构是什么？\u003c/p>\n\u003c/blockquote>\n\u003cp>主要规定：\u003c/p>\n\u003cp>\u003cstrong>人民安全—政治安全—经济安全—各领域安全—国际安全\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第8条回答：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>当不同安全和发展目标同时存在时，应如何处理它们之间的关系？\u003c/p>\n\u003c/blockquote>\n\u003cp>主要规定：\u003c/p>\n\u003cp>\u003cstrong>协调 + 统筹\u003c/strong>\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第3条：总体结构\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第8条：统筹方法\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（五）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：第8条第二款规定了五组统筹关系。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第二款直接规定四组关系。将第一款“发展与安全”计入后，可以在总体国家安全观意义上概括为五组关系。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：统筹不同安全意味着各种安全在任何情况下都具有相同重要性。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 统筹强调综合判断，不是机械平均。不同安全风险在不同时间和情境下可以具有不同优先程度。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：安全与发展相协调意味着任何安全措施都必须通过经济成本收益计算。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 本条没有规定统一量化公式。“相协调”提供法律论证方向，具体评价方法仍需结合相关制度和事实确定。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：“国民安全”只包括中国领土内人员的安全。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 国土安全与国民安全的区分强调国家空间安全和人的安全两个维度。《国家安全法》第33条同时明确保护海外中国公民等主体的安全和正当权益，因此不能将国家安全法上的人的安全保护机械限定于境内。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：非传统安全已经取代传统安全。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第8条明确要求统筹传统安全与非传统安全，二者同时存在且可能相互作用。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：维护自身安全与促进共同安全相互冲突。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 本条要求统筹二者，第10条进一步规定通过互信、互利、平等、协作以及国际安全合作促进共同安全。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点7：第8条可以直接作为数据出境限制或者其他监管措施的法律授权。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第8条属于协调与统筹原则。数据出境安全评估、豁免或者其他具体监管措施仍须依据数据安全、个人信息保护等专门法律规范确定。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>如何判断安全与发展已经实现“相协调”？\u003c/strong>\u003cbr>评价时应重点观察短期安全收益、经济社会成本，还是还应考虑长期安全能力、技术发展和社会韧性？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何识别国家安全措施造成的风险转移？\u003c/strong>\u003cbr>一项措施降低某一领域风险，却增加其他领域、其他群体或者未来时期风险时，应如何进行整体评价？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>统筹原则是否能够形成较具体的法律审查标准？\u003c/strong>\u003cbr>第8条能否要求国家机关在重大安全决策中说明对经济社会发展以及其他安全领域的影响，还是主要发挥政策和体系解释功能？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“国民安全”的法律范围应当如何解释？\u003c/strong>\u003cbr>在第8条、第16条和第33条共同构成的规范体系中，境内人民安全与海外中国公民安全之间应如何建立体系联系？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>传统安全与非传统安全发生交叉时如何确定法律适用？\u003c/strong>\u003cbr>当网络风险进一步影响军事、经济或者社会安全时，是根据最初风险领域确定适用规范，还是根据最终受到影响的国家重大利益进行判断？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何理解自身安全与共同安全之间的边界？\u003c/strong>\u003cbr>当不同国家对同一安全措施的利益评价存在明显差异时，如何在维护本国正当安全利益与促进共同安全之间进行法律和政策协调？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>数据跨境制度能否形成“统筹安全与发展”的可检验样本？\u003c/strong>\u003cbr>可以进一步比较2022年与2024年数据出境规则在风险分类、程序负担和安全保护方面的变化，分析制度调整是否体现了更加精细的风险治理。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>第8条能否发展出“整体安全效果”的评价方法？\u003c/strong>\u003cbr>相较于仅考察单一领域风险是否下降，是否可以建立包含直接效果、跨领域影响、负担分布和长期后果的综合评价框架？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":9,"label":"第九条","title":"预防为主、标本兼治、专群结合","lawText":"维护国家安全，应当坚持预防为主、标本兼治，专门工作与群众路线相结合，充分发挥专门机关和其他有关机关维护国家安全的职能作用，广泛动员公民和组织，防范、制止和依法惩治危害国家安全的行为。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>维护国家安全，应当坚持预防为主、标本兼治，专门工作与群众路线相结合，充分发挥专门机关和其他有关机关维护国家安全的职能作用，广泛动员公民和组织，防范、制止和依法惩治危害国家安全的行为。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>维护国家安全，应当坚持预防为主、标本兼治，专门工作与群众路线相结合，充分发挥专门机关和其他有关机关维护国家安全的职能作用，广泛动员公民和组织，防范、制止和依法惩治危害国家安全的行为。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">预防为主、标本兼治、专群结合 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条包含两个主要层次：以何种方式应对风险，以及组织哪些力量共同维护安全。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>专群结合具有制度延续。\u003c/strong> 1993年国家安全立法已有国家安全工作与群众支持相联系的内容；2014年《反间谍法》第2条明确专门工作与群众路线相结合，第3条第2款规定有关机关、部门之间的配合，第4条强调依靠人民支持、动员和组织人民防范制止间谍行为。这一工作方式在2015年法中被放到更广泛的国家安全框架内理解。\u003ca href=\"https://www.xiongan.gov.cn/2020-11/01/c_1210867136.htm\">2014年法律文本\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>初稿阶段已经确立基本思路。\u003c/strong> 2014年12月草案说明已列预防为主、标本兼治以及专门工作与群众路线相结合原则，见甲书附录二第375页（PDF388页）。现有材料足以说明原则的早期存在，不能据此还原未核实的每一版文字。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>预防为主。\u003c/strong> 将工作前移到风险识别、防范和能力建设，减少重大危害发生的可能性。它与风险评估、监测预警、预案等制度具有联系。\u003c/li>\n\u003cli>\u003cstrong>标本兼治。\u003c/strong> 既处理已经表现出来的危害和问题，也研究其产生的深层原因、条件和制度薄弱环节。不能把“治本”简单等同于加重惩罚。\u003c/li>\n\u003cli>\u003cstrong>专门工作与群众路线相结合。\u003c/strong> 专门机关承担依法开展的专业工作，公民和组织通过依法报告、配合、提供支持等方式参与。\u003c/li>\n\u003cli>\u003cstrong>专门机关与其他机关相配合。\u003c/strong> 甲、乙两书都强调，专群结合不能只理解为机关与个人之间的关系，还应关注有关部门依法履行职责、互相支持。\u003c/li>\n\u003cli>\u003cstrong>防范、制止、惩治相衔接。\u003c/strong> 分别面向风险形成、危害发生和责任追究等环节。条文对惩治明确要求“依法”，整条工作也受第7条约束。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>预防与惩罚的证明要求不能混同〔笔记分析〕。\u003c/strong> 预警信息可以触发依法评估或核查，但不当然证明某人已经违法犯罪。追究行政或刑事责任仍需满足相应实体和程序条件。“风险存在”与“个人应受处罚”是不同法律判断。\u003c/p>\n\u003cp>\u003cstrong>公众参与不等于执法权转移〔笔记分析〕。\u003c/strong> 公民和组织参与维护安全，不能由此自行取得搜查、扣押、拘禁或调查他人隐私的权力。应将线索提供、专业核查、依法处理区分开来，避免群众动员替代法定程序。\u003c/p>\n\u003cp>\u003cstrong>支持义务与权益保障相衔接。\u003c/strong> 维护安全的参与者也需要保护。第六章有关公民、组织的权利义务，可用于研究协助范围、人身保护、补偿抚恤和救济。参与机制越广泛，越需要明确合法边界和保障措施。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>乙书实例\u003c/strong>：举报渠道及基层参与事例说明公众线索能够辅助专业工作；但举报数量、社会动员规模不直接等于国家安全工作的实际效果。\u003c/li>\n\u003cli>\u003cstrong>甲书补充\u003c/strong>：本条的预防与标本兼治不限于反间谍活动，还可从其他安全领域的风险源、制度漏洞和防范措施理解。具体措施仍须分别适用有关法律。\u003c/li>\n\u003cli>\u003cstrong>关联条文\u003c/strong>：第11—14条、第四章风险预防评估预警制度、第75条专门工作支持配合、第六章权利义务。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：怎样建立能够鼓励真实报告、保护参与者并减少误报、诬告和权利侵害的公众参与机制？\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条包含两个主要层次：以何种方式应对风险，以及组织哪些力量共同维护安全。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>专群结合具有制度延续。\u003c/strong> 1993年国家安全立法已有国家安全工作与群众支持相联系的内容；2014年《反间谍法》第2条明确专门工作与群众路线相结合，第3条第2款规定有关机关、部门之间的配合，第4条强调依靠人民支持、动员和组织人民防范制止间谍行为。这一工作方式在2015年法中被放到更广泛的国家安全框架内理解。\u003ca href=\"https://www.xiongan.gov.cn/2020-11/01/c_1210867136.htm\">2014年法律文本\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>初稿阶段已经确立基本思路。\u003c/strong> 2014年12月草案说明已列预防为主、标本兼治以及专门工作与群众路线相结合原则，见甲书附录二第375页（PDF388页）。现有材料足以说明原则的早期存在，不能据此还原未核实的每一版文字。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>预防为主。\u003c/strong> 将工作前移到风险识别、防范和能力建设，减少重大危害发生的可能性。它与风险评估、监测预警、预案等制度具有联系。\u003c/li>\n\u003cli>\u003cstrong>标本兼治。\u003c/strong> 既处理已经表现出来的危害和问题，也研究其产生的深层原因、条件和制度薄弱环节。不能把“治本”简单等同于加重惩罚。\u003c/li>\n\u003cli>\u003cstrong>专门工作与群众路线相结合。\u003c/strong> 专门机关承担依法开展的专业工作，公民和组织通过依法报告、配合、提供支持等方式参与。\u003c/li>\n\u003cli>\u003cstrong>专门机关与其他机关相配合。\u003c/strong> 甲、乙两书都强调，专群结合不能只理解为机关与个人之间的关系，还应关注有关部门依法履行职责、互相支持。\u003c/li>\n\u003cli>\u003cstrong>防范、制止、惩治相衔接。\u003c/strong> 分别面向风险形成、危害发生和责任追究等环节。条文对惩治明确要求“依法”，整条工作也受第7条约束。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>预防与惩罚的证明要求不能混同〔笔记分析〕。\u003c/strong> 预警信息可以触发依法评估或核查，但不当然证明某人已经违法犯罪。追究行政或刑事责任仍需满足相应实体和程序条件。“风险存在”与“个人应受处罚”是不同法律判断。\u003c/p>\n\u003cp>\u003cstrong>公众参与不等于执法权转移〔笔记分析〕。\u003c/strong> 公民和组织参与维护安全，不能由此自行取得搜查、扣押、拘禁或调查他人隐私的权力。应将线索提供、专业核查、依法处理区分开来，避免群众动员替代法定程序。\u003c/p>\n\u003cp>\u003cstrong>支持义务与权益保障相衔接。\u003c/strong> 维护安全的参与者也需要保护。第六章有关公民、组织的权利义务，可用于研究协助范围、人身保护、补偿抚恤和救济。参与机制越广泛，越需要明确合法边界和保障措施。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>乙书实例\u003c/strong>：举报渠道及基层参与事例说明公众线索能够辅助专业工作；但举报数量、社会动员规模不直接等于国家安全工作的实际效果。\u003c/li>\n\u003cli>\u003cstrong>甲书补充\u003c/strong>：本条的预防与标本兼治不限于反间谍活动，还可从其他安全领域的风险源、制度漏洞和防范措施理解。具体措施仍须分别适用有关法律。\u003c/li>\n\u003cli>\u003cstrong>关联条文\u003c/strong>：第11—14条、第四章风险预防评估预警制度、第75条专门工作支持配合、第六章权利义务。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：怎样建立能够鼓励真实报告、保护参与者并减少误报、诬告和权利侵害的公众参与机制？\u003c/li>\n\u003c/ul>\n"},{"num":10,"label":"第十条","title":"国际安全合作与共同安全","lawText":"维护国家安全，应当坚持互信、互利、平等、协作，积极同外国政府和国际组织开展安全交流合作，履行国际安全义务，促进共同安全，维护世界和平。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>四项原则：\u003c/strong> 国家安全国际合作应坚持\u003cstrong>互信、互利、平等、协作\u003c/strong>，分别强调信任基础、利益协调、主体平等和共同应对。\u003c/li>\n\u003cli>\u003cstrong>合作对象：\u003c/strong> 条文明确外国政府和国际组织两类主要合作对象，并以“安全交流合作”概括多种合作形式。\u003c/li>\n\u003cli>\u003cstrong>国际义务：\u003c/strong> “履行国际安全义务”意味着国家安全工作还应考虑已经依法承担的国际法义务；具体义务的来源、范围和法律效果须依据相应国际法规范判断。\u003c/li>\n\u003cli>\u003cstrong>共同安全：\u003c/strong> 本条与第8条“自身安全和共同安全”相衔接，强调本国安全与地区、国际安全环境之间的相互联系。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 本条提供国际安全合作的原则方向，但不能单独作为跨境提供情报、数据、采取司法措施或者限制权利的具体授权依据。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>维护国家安全，应当坚持互信、互利、平等、协作，积极同外国政府和国际组织开展安全交流合作，履行国际安全义务，促进共同安全，维护世界和平。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>四项原则：\u003c/strong> 国家安全国际合作应坚持\u003cstrong>互信、互利、平等、协作\u003c/strong>，分别强调信任基础、利益协调、主体平等和共同应对。\u003c/li>\n\u003cli>\u003cstrong>合作对象：\u003c/strong> 条文明确外国政府和国际组织两类主要合作对象，并以“安全交流合作”概括多种合作形式。\u003c/li>\n\u003cli>\u003cstrong>国际义务：\u003c/strong> “履行国际安全义务”意味着国家安全工作还应考虑已经依法承担的国际法义务；具体义务的来源、范围和法律效果须依据相应国际法规范判断。\u003c/li>\n\u003cli>\u003cstrong>共同安全：\u003c/strong> 本条与第8条“自身安全和共同安全”相衔接，强调本国安全与地区、国际安全环境之间的相互联系。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 本条提供国际安全合作的原则方向，但不能单独作为跨境提供情报、数据、采取司法措施或者限制权利的具体授权依据。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>维护国家安全，应当坚持互信、互利、平等、协作，积极同外国政府和国际组织开展安全交流合作，履行国际安全义务，促进共同安全，维护世界和平。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国际安全合作与共同安全 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定维护国家安全的\u003cstrong>对外合作原则及其基本目标\u003c/strong>。它首先以“互信、互利、平等、协作”确立国际安全合作的基本原则，继而规定同外国政府和国际组织开展安全交流合作、履行国际安全义务，最终指向促进共同安全和维护世界和平。\u003c/p>\n\u003cp>本条与第3条“\u003cstrong>以促进国际安全为依托\u003c/strong>”以及第8条“\u003cstrong>统筹自身安全和共同安全\u003c/strong>”形成直接的体系联系。\u003c/p>\n\u003cp>基本结构：\u003cstrong>合作原则 → 合作对象与方式 → 国际义务 → 共同安全 → 世界和平\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. “互信、互利、平等、协作”的安全理念构成本条的重要思想背景\u003c/h4>\n\u003cp>这一理念强调，在安全问题上不宜仅依靠对抗或者单方面追求自身安全，而应通过增进信任、协调利益、平等交往和国际合作改善整体安全环境。\n这与总体国家安全观具有直接联系。第3条规定国家安全工作“以促进国际安全为依托”，第8条进一步要求统筹“自身安全和共同安全”，第10条则将这一思想进一步落实为国际安全合作原则。\u003c/p>\n\u003cp>因此，可以形成：\u003c/p>\n\u003cp>\u003cstrong>第3条：国际安全是国家安全的重要外部依托\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第8条：统筹自身安全与共同安全\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第10条：规定国际安全合作的基本原则和方向\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>2. 2014年12月草案阶段已经形成较完整的条文结构\u003c/h4>\n\u003cp>乔晓阳主编：《中华人民共和国国家安全法释义》第376页所载国家安全法草案条文已经包括：\u003c/p>\n\u003cul>\n\u003cli>互信；\u003c/li>\n\u003cli>互利；\u003c/li>\n\u003cli>平等；\u003c/li>\n\u003cli>协作；\u003c/li>\n\u003cli>同外国政府和国际组织开展安全交流合作；\u003c/li>\n\u003cli>国际安全义务；\u003c/li>\n\u003cli>促进共同安全；\u003c/li>\n\u003cli>维护世界和平。\n因此，本条的基本结构在草案初次审议阶段已经形成。\n比较有意思的是，草案材料使用的是：&gt; **“有效履行国际安全义务”**而最终通过的法律文本为：&gt; \u003cstrong>“履行国际安全义务”\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>3. 从国家安全的国内治理进一步延伸至国际合作\u003c/h4>\n\u003cp>第10条置于总则之中，说明国际安全合作并非某一特定安全领域的附属制度，而是维护总体国家安全的一项基本工作原则。\n现代国家安全风险中的恐怖主义、跨国犯罪、网络安全、公共卫生、核安全、气候与生态、海上安全等问题往往具有明显的跨境特征，单一国家可能难以完全独立应对。\n因此，本条将：\u003cstrong>维护本国国家安全\u003c/strong>与\u003cstrong>国际安全合作、共同安全和世界和平\u003c/strong>放在同一规范结构之中。这也进一步说明，第8条要求统筹自身安全和共同安全，并非抽象价值表述，而在第10条中取得了具体的合作方向。\u003c/p>\n\u003chr>\n\u003ch4>4. 后续国际安全理念的发展应与2015年立法文本区分\u003c/h4>\n\u003cp>周尚君主编《国家安全法释义与适用》进一步介绍了2022年提出的全球安全倡议等。2022年提出全球安全倡议，2023年发布的《全球安全倡议概念文件》进一步提出重视各国合理安全关切、坚持通过对话协商和平解决争端以及统筹传统与非传统安全等内容。\n第10条所体现安全合作理念的后续在2015年之后也在不断发展。\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，“互信”是国际安全合作的认识和沟通基础\u003c/h4>\n\u003cp> 安全问题往往高度敏感，各国对风险、利益和他国行为的判断可能存在明显差异。“互信”强调通过交流、沟通和持续互动增加政策透明度和相互理解，减少由于信息不足、错误判断或者意图误读造成的安全风险。从这一角度看，互信的基本功能可以概括为：\n\u003cstrong>增加信息沟通 → 减少误判 → 提高行为可预期性 → 为安全合作创造条件\u003c/strong>同时互信并不意味着国家放弃必要的安全判断和风险防范。\u003c/p>\n\u003chr>\n\u003ch4>第二，“互利”要求安全合作兼顾有关各方的正当利益\u003c/h4>\n\u003cp> 安全合作通常需要多个国家或者国际组织共同投入资源、承担义务并调整行为。“互利”意味着国际安全合作不宜仅从单方面利益出发，而应当寻找各方能够共同接受的合作基础。其核心并不是要求所有合作收益完全相等，而是强调：\u003c/p>\n\u003cul>\n\u003cli>合作应当考虑有关各方的正当安全利益；\u003c/li>\n\u003cli>不宜将一方安全简单建立在另一方承担全部安全成本的基础上；\u003c/li>\n\u003cli>应当通过合作形成共同收益或者减少共同风险。\n因此，“互利”可以联系第8条“自身安全和共同安全”的统筹。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第三，“平等”强调安全合作主体之间的平等和相互尊重\u003c/h4>\n\u003cpre>\u003ccode>  “平等”要求国际安全合作建立在平等交往和相互尊重的基础之上。这一原则与《联合国宪章》第2条确立的会员国主权平等原则具有可以相互参照的规范背景。《联合国宪章》第2条同时规定会员国应善意履行宪章义务，以和平方法解决国际争端，并不得违反宪章宗旨以武力相威胁或者使用武力。因此，本条的“平等”可以理解为国际安全合作不应仅按照力量强弱决定合作主体的安全地位，而应尊重有关国家的主权以及依法享有的权利。\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch4>第四，“协作”强调通过共同机制应对跨境和共同安全风险\u003c/h4>\n\u003cp> “协作”是四项原则中最直接指向行动的一项。许多现代安全风险具有明显的跨境性。例如：\u003c/p>\n\u003cul>\n\u003cli>恐怖主义；\u003c/li>\n\u003cli>跨国有组织犯罪；\u003c/li>\n\u003cli>网络攻击；\u003c/li>\n\u003cli>核扩散风险；\u003c/li>\n\u003cli>公共卫生风险；\u003c/li>\n\u003cli>海上安全；\u003c/li>\n\u003cli>灾害和人道救援等。\u003c/li>\n\u003c/ul>\n\u003cp>   这些问题可能需要国家之间或者国家与国际组织之间进行信息交流、政策协调、能力建设乃至具体联合行动。因此：\n   \u003cstrong>互信提供合作基础\u003c/strong>\u003cbr>   \u003cstrong>互利提供利益条件\u003c/strong>\u003cbr>   \u003cstrong>平等确定交往方式\u003c/strong>\u003cbr>   \u003cstrong>协作推动共同采取行动\u003c/strong>\u003c/p>\n\u003cp>   四项原则由此形成一定的内部联系。\u003c/p>\n\u003chr>\n\u003ch4>第五，“积极同外国政府和国际组织开展安全交流合作”明确合作对象和基本方式\u003c/h4>\n\u003cp>   本条明确列举两类合作对象：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>外国政府；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>国际组织。\u003c/strong>\n   “安全交流合作”则属于概括性表述，本条并未将具体合作方式作封闭列举。从整部《国家安全法》看，不同安全领域已经进一步出现相应的国际合作规定。例如，第18条明确规定开展\u003cstrong>国际军事安全合作\u003c/strong>，包括实施联合国维和、国际救援、海上护航等活动；第21条规定加强国际资源能源合作；第31条规定核安全领域加强国际合作；第32条也涉及外层空间、国际海底区域和极地领域的国际合作。\n   因此可以理解为：&gt; \u003cstrong>第10条规定一般国际安全合作原则，第二章不同领域的条文进一步规定具体国际合作任务。\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch4>第六，“履行国际安全义务”表明国际合作不仅属于政策选择\u003c/h4>\n\u003cp>   本条不仅规定“开展安全交流合作”，还明确规定：&gt; **“履行国际安全义务。”**这一表述说明，国家安全领域的国际行为不仅涉及外交和安全政策，也可能涉及已经依法承担的国际法义务。但“国际安全义务”本身不是一个能够脱离具体法源独立确定内容的概念。判断某项具体国际义务时，需要进一步追问：\n   \u003cstrong>义务来源是什么？\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>中国是否受该规范拘束？\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>义务的主体和内容是什么？\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>是否附有条件或者例外？\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>在国内如何实施？\u003c/strong>\u003c/p>\n\u003cp>   可能涉及的法源包括：\u003c/p>\n\u003cul>\n\u003cli>中国参加的国际条约；\u003c/li>\n\u003cli>《联合国宪章》等国际法规范；\u003c/li>\n\u003cli>依法具有约束力的国际组织决定；\u003c/li>\n\u003cli>其他适用的国际法规则。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第七，“促进共同安全”是国际安全合作的重要目标\u003c/h4>\n\u003cp>   “共同安全”强调不同国家的安全状态具有一定关联。一些跨境安全风险无法单纯通过单边措施消除；一国采取的安全措施也可能对其他国家的安全环境产生影响。因此，“共同安全”要求在维护自身正当安全利益的同时，认识不同国家之间的安全相互依存，并通过合作减少共同风险。这与第8条的关系可以概括为：\n   \u003cstrong>第8条：统筹自身安全和共同安全\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>第10条：通过互信、互利、平等、协作和国际合作促进共同安全\u003c/strong>\u003c/p>\n\u003cp>   需要避免一种误解：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>促进共同安全并不等于要求国家放弃自身正当安全利益。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>   本法采取的结构恰恰是“统筹自身安全和共同安全”，而不是以其中一方完全取代另一方。\u003c/p>\n\u003chr>\n\u003ch4>第八，“维护世界和平”构成本条最终的国际安全目标\u003c/h4>\n\u003cp>   本条最后以“维护世界和平”作为落脚点。\u003c/p>\n\u003cp>   这一目标与《联合国宪章》第1条“维持国际和平及安全”的宗旨具有可以相互参照的规范背景。《联合国宪章》同时强调国际合作、和平解决国际争端以及协调各国行动。\u003c/p>\n\u003cp>   从本条内部结构看，可以形成：\u003c/p>\n\u003cp>   \u003cstrong>互信、互利、平等、协作\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>安全交流合作\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>履行国际安全义务\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>促进共同安全\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>维护世界和平\u003c/strong>\u003c/p>\n\u003cp>   因此，本条并不仅规定国际合作“怎么做”，还同时规定其最终价值目标。\u003c/p>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 国际安全合作原则与具体合作权限必须区分〔笔记分析〕\u003c/h4>\n\u003cp>第10条明确支持国际安全交流合作，但并没有规定所有跨境安全合作的具体权限和程序。\n例如，国际安全合作可能涉及：\u003c/p>\n\u003cul>\n\u003cli>情报信息交流；\u003c/li>\n\u003cli>数据或者个人信息提供；\u003c/li>\n\u003cli>刑事司法协助；\u003c/li>\n\u003cli>引渡；\u003c/li>\n\u003cli>联合执法；\u003c/li>\n\u003cli>军事合作；\u003c/li>\n\u003cli>跨境调查取证。\n不同事项可能涉及不同法律规范，也可能影响个人和组织的权利。\n因此：&gt; \u003cstrong>第10条能够说明国际安全合作的原则方向，但不能直接作为一切跨境资料提供或者执法合作的完整法律授权。\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>具体合作仍然需要查明：\n\u003cstrong>国内法权限\u003c/strong>  ＋  \u003cstrong>国内法程序\u003c/strong>  ＋  \u003cstrong>适用的国际法或者国际协议依据\u003c/strong>  ＋  \u003cstrong>权利和数据保护要求\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>2. “国际安全义务”需要回到具体国际法法源判断〔笔记分析〕\u003c/h4>\n\u003cp>分析时可以依次判断：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>文件的法律性质是什么？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>属于条约、国际组织具有约束力的决定，还是政治宣言、倡议或者政策文件？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>中国是否依法受其拘束？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>具体义务针对谁、要求什么行为？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>是否需要通过国内法进一步实施？\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cp>由此需要特别区分：\u003cstrong>政治倡议 ≠ 国际条约\u003c/strong>\n\u003cstrong>一般国际组织文件 ≠ 当然具有法律拘束力的国际组织决定\u003c/strong>\n\u003cstrong>国际义务 ≠ 自动产生国内具体行政权限\u003c/strong>\n这一区分对于理解“履行国际安全义务”尤其重要。\u003c/p>\n\u003chr>\n\u003ch4>3. 共同安全与集体安全不是同一个概念〔比较法／国际法〕\u003c/h4>\n\u003cp>“共同安全”与“集体安全”在中文表达上容易混淆，但制度含义不同。\n\u003cstrong>共同安全\u003c/strong>主要是一种安全理念和合作思路，强调不同国家安全之间具有相互联系，应当通过沟通、协调和合作减少共同风险。\n而《联合国宪章》框架下通常讨论的\u003cstrong>集体安全机制\u003c/strong>，则具有更加明确的制度结构。\n例如，《联合国宪章》第1条规定联合国采取有效集体办法防止和消除对和平的威胁；宪章还通过安全理事会等机构及有关章节规定维护国际和平与安全的具体权限和程序。\n因此：&gt; \u003cstrong>共同安全是一种更广泛的安全理念；集体安全通常涉及特定国际组织、法定职权和程序安排。\u003c/strong>\n不能因为某项倡议主张“共同安全”，就将其等同于联合国集体安全机制中的安理会决定或者其他特定法律行为。\u003c/p>\n\u003chr>\n\u003ch4>4. “共同安全”不能自动转化为对其他国家采取措施的权力依据〔笔记分析〕\u003c/h4>\n\u003cp>本条规定促进共同安全、维护世界和平，但不能据此推导：&gt; 只要声称为了共同安全，即可对其他国家或者境外主体采取任何必要行动。\n国家在国际关系中的具体行为仍受到适用国际法的约束。\n《联合国宪章》第2条明确规定主权平等、善意履行义务、和平解决国际争端以及禁止违反宪章宗旨使用武力或者以武力相威胁等原则。\n因此：&gt; \u003cstrong>共同安全提供合作目标，并不取消行为权限和国际法约束。\u003c/strong>\n这一点与国内法上“国家安全目的不能替代具体法律授权”的逻辑具有一定相似性。\u003c/p>\n\u003chr>\n\u003ch4>5. 国际合作与国内法治要求需要同时满足〔笔记分析〕\u003c/h4>\n\u003cp>国际安全合作往往处于国内法与国际法交汇处。即使某项合作具有国际法或者国际协议依据，如果具体执行需要国内机关采取调查、限制、数据提供或者其他措施，仍需回答该机关在国内法上是否具有相应权限。\n因此，可以形成一个双层分析方法：\n\u003cstrong>第一层：国际法层面\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>有无条约或者其他国际法依据？\u003c/li>\n\u003cli>中国承担何种国际义务？\u003c/li>\n\u003cli>国际合作具有什么条件和范围？\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>第二层：国内法层面\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cp>哪个机关负责实施？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>是否具有相应职权？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>适用何种程序？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>如何保护相关个人和组织的合法权益？\u003c/p>\n\u003cp> 因此：&gt; \u003cstrong>国际义务回答“国家在国际法上应当做什么”，国内权限则回答“由哪个机关、通过什么法律程序具体实施”。\u003c/strong>\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第3条、第8条与第10条形成完整的国际安全逻辑\u003c/h4>\n\u003cp>三条均涉及国际安全，但功能不同。\u003c/p>\n\u003cp>\u003cstrong>第3条：\u003c/strong> \u003c/p>\n\u003cblockquote>\n\u003cp>“以促进国际安全为依托”\n回答：\u003cstrong>国际安全在总体国家安全观中处于什么位置？\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003cp>\u003cstrong>第8条：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>“统筹……自身安全和共同安全”\u003c/p>\n\u003c/blockquote>\n\u003cp>回答：\u003cstrong>本国安全与共同安全之间是什么关系？\u003c/strong>\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>第10条：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>“互信、互利、平等、协作……促进共同安全，维护世界和平”\u003c/p>\n\u003c/blockquote>\n\u003cp>回答：\u003cstrong>通过什么基本原则和合作方式实现共同安全？\u003c/strong>\u003c/p>\n\u003cp>因此可以记忆为：\u003c/p>\n\u003cp>\u003cstrong>第3条：国际安全的体系定位\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第8条：自身安全与共同安全的统筹\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第10条：国际安全合作原则和行动方向\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（二）第10条与第18条的关系\u003c/h4>\n\u003cp>第10条属于总则，规定一般性的国际安全合作原则。第18条位于第二章军事安全任务部分，明确规定开展国际军事安全合作，并列举联合国维和、国际救援、海上护航以及维护国家海外利益的军事行动等事项。\n因此：\n\u003cstrong>第10条：国际安全合作的一般原则\u003c/strong>\n\u003cstrong>第18条：军事安全领域的具体国际合作任务\u003c/strong>\n不能反过来将第18条规定的特定军事活动直接扩大解释为所有国家安全国际合作的一般形式。\u003c/p>\n\u003chr>\n\u003ch4>（三）区分四类容易混淆的国际文件和法律行为\u003c/h4>\n\u003ch5>1. 国际条约\u003c/h5>\n\u003cp>国家通过签署、批准、加入等相应程序承担国际法上的条约义务。\u003c/p>\n\u003cp>具体法律效果应依据有关条约及国内法律判断。\u003c/p>\n\u003ch5>2. 国际组织决定\u003c/h5>\n\u003cp>不同国际组织、不同机关作出的决定具有不同法律效力。\u003c/p>\n\u003cp>不能仅凭“国际组织发布”就推定一项文件对成员国当然具有相同的法律拘束力。\u003c/p>\n\u003ch5>3. 政治倡议和宣言\u003c/h5>\n\u003cp>例如某些国际安全倡议主要体现政策立场、合作理念和行动方向。\u003c/p>\n\u003cp>是否进一步产生法律义务，需要观察是否形成条约、具有约束力的国际组织决定或者其他国际法依据。\u003c/p>\n\u003ch5>4. 国内执行措施\u003c/h5>\n\u003cp>即使国家已经承担国际义务，具体由哪个国内机关实施、能够采取何种措施，仍需依据国内法律确定。\u003c/p>\n\u003cp>因此可以形成：\u003c/p>\n\u003cp>\u003cstrong>政治倡议\u003c/strong>\u003cbr>≠\u003cbr>\u003cstrong>国际法律义务\u003c/strong>\u003cbr>≠\u003cbr>\u003cstrong>国际组织具有拘束力的决定\u003c/strong>\u003cbr>≠\u003cbr>\u003cstrong>国内具体执行权限\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（四）四大倡议属于后续发展\u003c/h4>\n\u003cp>2022年提出的全球安全倡议以及2023年发布的《全球安全倡议概念文件》，可以作为第10条立法以后我国国际安全理念和实践发展的研究材料。\n其中关于共同安全、尊重各国合理安全关切、和平解决争端和统筹传统与非传统安全等内容，与第8条、第10条存在明显的议题联系。\u003c/p>\n\u003chr>\n\u003ch4>（五）《联合国宪章》的比较和规范意义\u003c/h4>\n\u003cp>《联合国宪章》第1条规定联合国维护国际和平与安全、发展国际友好关系并促进国际合作；第2条进一步规定主权平等、善意履行义务、和平解决争端以及禁止非法武力威胁或者使用武力等基本原则。\n因此，可以将《联合国宪章》作为理解第10条国际安全合作的重要国际法背景。但二者仍应保持法源上的区分：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>《国家安全法》第10条是中国国内法规范；《联合国宪章》是具有独立国际法地位的国际条约。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>解释具体国际义务时，应直接依据相应国际法规范，而不能仅通过第10条进行间接推导。\u003c/p>\n\u003chr>\n\u003ch4>（六）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：开展国际安全合作意味着国家必须无条件向外国提供国家安全信息。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第10条只是规定国际安全合作原则。具体情报、数据或者其他信息能否提供，需要依据有关国内法、保密制度和适用国际合作规范判断。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：“履行国际安全义务”意味着所有国际安全倡议都属于中国承担的法律义务。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 是否构成法律义务必须判断具体文件的法律性质以及中国是否依法受其约束。政治倡议不能当然等同于条约义务。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：“共同安全”就是联合国意义上的“集体安全”。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 共同安全是一种较广泛的安全理念；集体安全通常涉及特定国际组织、职权和程序安排，两者不能直接等同。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：促进共同安全意味着本国利益必须让位于其他国家的安全利益。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第8条明确要求“统筹自身安全和共同安全”。共同安全并不意味着放弃本国正当的主权、安全和发展利益。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：维护本国国家安全可以根据第10条采取任何必要的对外措施。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第10条强调安全合作、国际义务和世界和平，并没有授权国家超越适用国际法采取行动。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：国际安全合作有国际法依据后，就不再需要国内法授权。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 国际法义务与国内机关的实施权限属于不同问题。具体机关采取行政、执法或者数据提供等措施时，仍应依据国内法确定其权限和程序。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点7：全球安全倡议属于第10条的原始立法依据。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第10条制定于2015年，全球安全倡议提出于2022年。后者可以用于研究本条理念的后续发展，不能倒置时间关系。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>“国际安全义务”的法源范围如何确定？\u003c/strong>\u003cbr>应如何区分条约义务、习惯国际法义务、国际组织具有拘束力的决定以及一般政治承诺？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国际安全义务如何转化为国内执行权限？\u003c/strong>\u003cbr>国家承担国际法义务以后，是否仍需依据国内法确定具体执行机关、实施程序和措施范围？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>共同安全与自身安全发生现实张力时如何协调？\u003c/strong>\u003cbr>第8条要求统筹自身安全和共同安全，第10条进一步要求促进共同安全。具体判断中应当考虑哪些因素？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何区分共同安全与集体安全？\u003c/strong>\u003cbr>二者在理论目标、组织结构、法律依据和实施机制上分别具有哪些差异？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国际安全合作中的信息共享边界如何确定？\u003c/strong>\u003cbr>当安全合作涉及情报、数据、个人信息或者商业秘密时，应如何协调国际合作需要、国家秘密保护、数据安全和个人权益？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>政治倡议如何发展为具有法律效力的国际合作机制？\u003c/strong>\u003cbr>从政策倡议、联合声明、谅解备忘录到国际条约或者国际组织正式机制，不同阶段的法律效力如何变化？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何评价国际安全合作的实际效果？\u003c/strong>\u003cbr>除合作数量和参与范围外，是否还应考察风险降低、危机沟通、履约情况、长期稳定性以及对其他国家安全利益的影响？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>第10条在具体国际合作案件中具有何种规范功能？\u003c/strong>\u003cbr>它主要属于政策和体系解释原则，还是能够对具体国家机关理解国际合作权限、合作目的和实施方式产生更直接的法律约束？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定维护国家安全的\u003cstrong>对外合作原则及其基本目标\u003c/strong>。它首先以“互信、互利、平等、协作”确立国际安全合作的基本原则，继而规定同外国政府和国际组织开展安全交流合作、履行国际安全义务，最终指向促进共同安全和维护世界和平。\u003c/p>\n\u003cp>本条与第3条“\u003cstrong>以促进国际安全为依托\u003c/strong>”以及第8条“\u003cstrong>统筹自身安全和共同安全\u003c/strong>”形成直接的体系联系。\u003c/p>\n\u003cp>基本结构：\u003cstrong>合作原则 → 合作对象与方式 → 国际义务 → 共同安全 → 世界和平\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. “互信、互利、平等、协作”的安全理念构成本条的重要思想背景\u003c/h4>\n\u003cp>这一理念强调，在安全问题上不宜仅依靠对抗或者单方面追求自身安全，而应通过增进信任、协调利益、平等交往和国际合作改善整体安全环境。\n这与总体国家安全观具有直接联系。第3条规定国家安全工作“以促进国际安全为依托”，第8条进一步要求统筹“自身安全和共同安全”，第10条则将这一思想进一步落实为国际安全合作原则。\u003c/p>\n\u003cp>因此，可以形成：\u003c/p>\n\u003cp>\u003cstrong>第3条：国际安全是国家安全的重要外部依托\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第8条：统筹自身安全与共同安全\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第10条：规定国际安全合作的基本原则和方向\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>2. 2014年12月草案阶段已经形成较完整的条文结构\u003c/h4>\n\u003cp>乔晓阳主编：《中华人民共和国国家安全法释义》第376页所载国家安全法草案条文已经包括：\u003c/p>\n\u003cul>\n\u003cli>互信；\u003c/li>\n\u003cli>互利；\u003c/li>\n\u003cli>平等；\u003c/li>\n\u003cli>协作；\u003c/li>\n\u003cli>同外国政府和国际组织开展安全交流合作；\u003c/li>\n\u003cli>国际安全义务；\u003c/li>\n\u003cli>促进共同安全；\u003c/li>\n\u003cli>维护世界和平。\n因此，本条的基本结构在草案初次审议阶段已经形成。\n比较有意思的是，草案材料使用的是：&gt; **“有效履行国际安全义务”**而最终通过的法律文本为：&gt; \u003cstrong>“履行国际安全义务”\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>3. 从国家安全的国内治理进一步延伸至国际合作\u003c/h4>\n\u003cp>第10条置于总则之中，说明国际安全合作并非某一特定安全领域的附属制度，而是维护总体国家安全的一项基本工作原则。\n现代国家安全风险中的恐怖主义、跨国犯罪、网络安全、公共卫生、核安全、气候与生态、海上安全等问题往往具有明显的跨境特征，单一国家可能难以完全独立应对。\n因此，本条将：\u003cstrong>维护本国国家安全\u003c/strong>与\u003cstrong>国际安全合作、共同安全和世界和平\u003c/strong>放在同一规范结构之中。这也进一步说明，第8条要求统筹自身安全和共同安全，并非抽象价值表述，而在第10条中取得了具体的合作方向。\u003c/p>\n\u003chr>\n\u003ch4>4. 后续国际安全理念的发展应与2015年立法文本区分\u003c/h4>\n\u003cp>周尚君主编《国家安全法释义与适用》进一步介绍了2022年提出的全球安全倡议等。2022年提出全球安全倡议，2023年发布的《全球安全倡议概念文件》进一步提出重视各国合理安全关切、坚持通过对话协商和平解决争端以及统筹传统与非传统安全等内容。\n第10条所体现安全合作理念的后续在2015年之后也在不断发展。\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，“互信”是国际安全合作的认识和沟通基础\u003c/h4>\n\u003cp> 安全问题往往高度敏感，各国对风险、利益和他国行为的判断可能存在明显差异。“互信”强调通过交流、沟通和持续互动增加政策透明度和相互理解，减少由于信息不足、错误判断或者意图误读造成的安全风险。从这一角度看，互信的基本功能可以概括为：\n\u003cstrong>增加信息沟通 → 减少误判 → 提高行为可预期性 → 为安全合作创造条件\u003c/strong>同时互信并不意味着国家放弃必要的安全判断和风险防范。\u003c/p>\n\u003chr>\n\u003ch4>第二，“互利”要求安全合作兼顾有关各方的正当利益\u003c/h4>\n\u003cp> 安全合作通常需要多个国家或者国际组织共同投入资源、承担义务并调整行为。“互利”意味着国际安全合作不宜仅从单方面利益出发，而应当寻找各方能够共同接受的合作基础。其核心并不是要求所有合作收益完全相等，而是强调：\u003c/p>\n\u003cul>\n\u003cli>合作应当考虑有关各方的正当安全利益；\u003c/li>\n\u003cli>不宜将一方安全简单建立在另一方承担全部安全成本的基础上；\u003c/li>\n\u003cli>应当通过合作形成共同收益或者减少共同风险。\n因此，“互利”可以联系第8条“自身安全和共同安全”的统筹。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第三，“平等”强调安全合作主体之间的平等和相互尊重\u003c/h4>\n\u003cpre>\u003ccode>  “平等”要求国际安全合作建立在平等交往和相互尊重的基础之上。这一原则与《联合国宪章》第2条确立的会员国主权平等原则具有可以相互参照的规范背景。《联合国宪章》第2条同时规定会员国应善意履行宪章义务，以和平方法解决国际争端，并不得违反宪章宗旨以武力相威胁或者使用武力。因此，本条的“平等”可以理解为国际安全合作不应仅按照力量强弱决定合作主体的安全地位，而应尊重有关国家的主权以及依法享有的权利。\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch4>第四，“协作”强调通过共同机制应对跨境和共同安全风险\u003c/h4>\n\u003cp> “协作”是四项原则中最直接指向行动的一项。许多现代安全风险具有明显的跨境性。例如：\u003c/p>\n\u003cul>\n\u003cli>恐怖主义；\u003c/li>\n\u003cli>跨国有组织犯罪；\u003c/li>\n\u003cli>网络攻击；\u003c/li>\n\u003cli>核扩散风险；\u003c/li>\n\u003cli>公共卫生风险；\u003c/li>\n\u003cli>海上安全；\u003c/li>\n\u003cli>灾害和人道救援等。\u003c/li>\n\u003c/ul>\n\u003cp>   这些问题可能需要国家之间或者国家与国际组织之间进行信息交流、政策协调、能力建设乃至具体联合行动。因此：\n   \u003cstrong>互信提供合作基础\u003c/strong>\u003cbr>   \u003cstrong>互利提供利益条件\u003c/strong>\u003cbr>   \u003cstrong>平等确定交往方式\u003c/strong>\u003cbr>   \u003cstrong>协作推动共同采取行动\u003c/strong>\u003c/p>\n\u003cp>   四项原则由此形成一定的内部联系。\u003c/p>\n\u003chr>\n\u003ch4>第五，“积极同外国政府和国际组织开展安全交流合作”明确合作对象和基本方式\u003c/h4>\n\u003cp>   本条明确列举两类合作对象：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>外国政府；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>国际组织。\u003c/strong>\n   “安全交流合作”则属于概括性表述，本条并未将具体合作方式作封闭列举。从整部《国家安全法》看，不同安全领域已经进一步出现相应的国际合作规定。例如，第18条明确规定开展\u003cstrong>国际军事安全合作\u003c/strong>，包括实施联合国维和、国际救援、海上护航等活动；第21条规定加强国际资源能源合作；第31条规定核安全领域加强国际合作；第32条也涉及外层空间、国际海底区域和极地领域的国际合作。\n   因此可以理解为：&gt; \u003cstrong>第10条规定一般国际安全合作原则，第二章不同领域的条文进一步规定具体国际合作任务。\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch4>第六，“履行国际安全义务”表明国际合作不仅属于政策选择\u003c/h4>\n\u003cp>   本条不仅规定“开展安全交流合作”，还明确规定：&gt; **“履行国际安全义务。”**这一表述说明，国家安全领域的国际行为不仅涉及外交和安全政策，也可能涉及已经依法承担的国际法义务。但“国际安全义务”本身不是一个能够脱离具体法源独立确定内容的概念。判断某项具体国际义务时，需要进一步追问：\n   \u003cstrong>义务来源是什么？\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>中国是否受该规范拘束？\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>义务的主体和内容是什么？\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>是否附有条件或者例外？\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>在国内如何实施？\u003c/strong>\u003c/p>\n\u003cp>   可能涉及的法源包括：\u003c/p>\n\u003cul>\n\u003cli>中国参加的国际条约；\u003c/li>\n\u003cli>《联合国宪章》等国际法规范；\u003c/li>\n\u003cli>依法具有约束力的国际组织决定；\u003c/li>\n\u003cli>其他适用的国际法规则。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第七，“促进共同安全”是国际安全合作的重要目标\u003c/h4>\n\u003cp>   “共同安全”强调不同国家的安全状态具有一定关联。一些跨境安全风险无法单纯通过单边措施消除；一国采取的安全措施也可能对其他国家的安全环境产生影响。因此，“共同安全”要求在维护自身正当安全利益的同时，认识不同国家之间的安全相互依存，并通过合作减少共同风险。这与第8条的关系可以概括为：\n   \u003cstrong>第8条：统筹自身安全和共同安全\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>第10条：通过互信、互利、平等、协作和国际合作促进共同安全\u003c/strong>\u003c/p>\n\u003cp>   需要避免一种误解：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>促进共同安全并不等于要求国家放弃自身正当安全利益。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>   本法采取的结构恰恰是“统筹自身安全和共同安全”，而不是以其中一方完全取代另一方。\u003c/p>\n\u003chr>\n\u003ch4>第八，“维护世界和平”构成本条最终的国际安全目标\u003c/h4>\n\u003cp>   本条最后以“维护世界和平”作为落脚点。\u003c/p>\n\u003cp>   这一目标与《联合国宪章》第1条“维持国际和平及安全”的宗旨具有可以相互参照的规范背景。《联合国宪章》同时强调国际合作、和平解决国际争端以及协调各国行动。\u003c/p>\n\u003cp>   从本条内部结构看，可以形成：\u003c/p>\n\u003cp>   \u003cstrong>互信、互利、平等、协作\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>安全交流合作\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>履行国际安全义务\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>促进共同安全\u003c/strong>\u003cbr>   ↓\u003cbr>   \u003cstrong>维护世界和平\u003c/strong>\u003c/p>\n\u003cp>   因此，本条并不仅规定国际合作“怎么做”，还同时规定其最终价值目标。\u003c/p>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 国际安全合作原则与具体合作权限必须区分〔笔记分析〕\u003c/h4>\n\u003cp>第10条明确支持国际安全交流合作，但并没有规定所有跨境安全合作的具体权限和程序。\n例如，国际安全合作可能涉及：\u003c/p>\n\u003cul>\n\u003cli>情报信息交流；\u003c/li>\n\u003cli>数据或者个人信息提供；\u003c/li>\n\u003cli>刑事司法协助；\u003c/li>\n\u003cli>引渡；\u003c/li>\n\u003cli>联合执法；\u003c/li>\n\u003cli>军事合作；\u003c/li>\n\u003cli>跨境调查取证。\n不同事项可能涉及不同法律规范，也可能影响个人和组织的权利。\n因此：&gt; \u003cstrong>第10条能够说明国际安全合作的原则方向，但不能直接作为一切跨境资料提供或者执法合作的完整法律授权。\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>具体合作仍然需要查明：\n\u003cstrong>国内法权限\u003c/strong>  ＋  \u003cstrong>国内法程序\u003c/strong>  ＋  \u003cstrong>适用的国际法或者国际协议依据\u003c/strong>  ＋  \u003cstrong>权利和数据保护要求\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>2. “国际安全义务”需要回到具体国际法法源判断〔笔记分析〕\u003c/h4>\n\u003cp>分析时可以依次判断：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>文件的法律性质是什么？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>属于条约、国际组织具有约束力的决定，还是政治宣言、倡议或者政策文件？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>中国是否依法受其拘束？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>具体义务针对谁、要求什么行为？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>是否需要通过国内法进一步实施？\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cp>由此需要特别区分：\u003cstrong>政治倡议 ≠ 国际条约\u003c/strong>\n\u003cstrong>一般国际组织文件 ≠ 当然具有法律拘束力的国际组织决定\u003c/strong>\n\u003cstrong>国际义务 ≠ 自动产生国内具体行政权限\u003c/strong>\n这一区分对于理解“履行国际安全义务”尤其重要。\u003c/p>\n\u003chr>\n\u003ch4>3. 共同安全与集体安全不是同一个概念〔比较法／国际法〕\u003c/h4>\n\u003cp>“共同安全”与“集体安全”在中文表达上容易混淆，但制度含义不同。\n\u003cstrong>共同安全\u003c/strong>主要是一种安全理念和合作思路，强调不同国家安全之间具有相互联系，应当通过沟通、协调和合作减少共同风险。\n而《联合国宪章》框架下通常讨论的\u003cstrong>集体安全机制\u003c/strong>，则具有更加明确的制度结构。\n例如，《联合国宪章》第1条规定联合国采取有效集体办法防止和消除对和平的威胁；宪章还通过安全理事会等机构及有关章节规定维护国际和平与安全的具体权限和程序。\n因此：&gt; \u003cstrong>共同安全是一种更广泛的安全理念；集体安全通常涉及特定国际组织、法定职权和程序安排。\u003c/strong>\n不能因为某项倡议主张“共同安全”，就将其等同于联合国集体安全机制中的安理会决定或者其他特定法律行为。\u003c/p>\n\u003chr>\n\u003ch4>4. “共同安全”不能自动转化为对其他国家采取措施的权力依据〔笔记分析〕\u003c/h4>\n\u003cp>本条规定促进共同安全、维护世界和平，但不能据此推导：&gt; 只要声称为了共同安全，即可对其他国家或者境外主体采取任何必要行动。\n国家在国际关系中的具体行为仍受到适用国际法的约束。\n《联合国宪章》第2条明确规定主权平等、善意履行义务、和平解决国际争端以及禁止违反宪章宗旨使用武力或者以武力相威胁等原则。\n因此：&gt; \u003cstrong>共同安全提供合作目标，并不取消行为权限和国际法约束。\u003c/strong>\n这一点与国内法上“国家安全目的不能替代具体法律授权”的逻辑具有一定相似性。\u003c/p>\n\u003chr>\n\u003ch4>5. 国际合作与国内法治要求需要同时满足〔笔记分析〕\u003c/h4>\n\u003cp>国际安全合作往往处于国内法与国际法交汇处。即使某项合作具有国际法或者国际协议依据，如果具体执行需要国内机关采取调查、限制、数据提供或者其他措施，仍需回答该机关在国内法上是否具有相应权限。\n因此，可以形成一个双层分析方法：\n\u003cstrong>第一层：国际法层面\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>有无条约或者其他国际法依据？\u003c/li>\n\u003cli>中国承担何种国际义务？\u003c/li>\n\u003cli>国际合作具有什么条件和范围？\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>第二层：国内法层面\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cp>哪个机关负责实施？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>是否具有相应职权？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>适用何种程序？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>如何保护相关个人和组织的合法权益？\u003c/p>\n\u003cp> 因此：&gt; \u003cstrong>国际义务回答“国家在国际法上应当做什么”，国内权限则回答“由哪个机关、通过什么法律程序具体实施”。\u003c/strong>\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第3条、第8条与第10条形成完整的国际安全逻辑\u003c/h4>\n\u003cp>三条均涉及国际安全，但功能不同。\u003c/p>\n\u003cp>\u003cstrong>第3条：\u003c/strong> \u003c/p>\n\u003cblockquote>\n\u003cp>“以促进国际安全为依托”\n回答：\u003cstrong>国际安全在总体国家安全观中处于什么位置？\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003cp>\u003cstrong>第8条：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>“统筹……自身安全和共同安全”\u003c/p>\n\u003c/blockquote>\n\u003cp>回答：\u003cstrong>本国安全与共同安全之间是什么关系？\u003c/strong>\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>第10条：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>“互信、互利、平等、协作……促进共同安全，维护世界和平”\u003c/p>\n\u003c/blockquote>\n\u003cp>回答：\u003cstrong>通过什么基本原则和合作方式实现共同安全？\u003c/strong>\u003c/p>\n\u003cp>因此可以记忆为：\u003c/p>\n\u003cp>\u003cstrong>第3条：国际安全的体系定位\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第8条：自身安全与共同安全的统筹\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第10条：国际安全合作原则和行动方向\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（二）第10条与第18条的关系\u003c/h4>\n\u003cp>第10条属于总则，规定一般性的国际安全合作原则。第18条位于第二章军事安全任务部分，明确规定开展国际军事安全合作，并列举联合国维和、国际救援、海上护航以及维护国家海外利益的军事行动等事项。\n因此：\n\u003cstrong>第10条：国际安全合作的一般原则\u003c/strong>\n\u003cstrong>第18条：军事安全领域的具体国际合作任务\u003c/strong>\n不能反过来将第18条规定的特定军事活动直接扩大解释为所有国家安全国际合作的一般形式。\u003c/p>\n\u003chr>\n\u003ch4>（三）区分四类容易混淆的国际文件和法律行为\u003c/h4>\n\u003ch5>1. 国际条约\u003c/h5>\n\u003cp>国家通过签署、批准、加入等相应程序承担国际法上的条约义务。\u003c/p>\n\u003cp>具体法律效果应依据有关条约及国内法律判断。\u003c/p>\n\u003ch5>2. 国际组织决定\u003c/h5>\n\u003cp>不同国际组织、不同机关作出的决定具有不同法律效力。\u003c/p>\n\u003cp>不能仅凭“国际组织发布”就推定一项文件对成员国当然具有相同的法律拘束力。\u003c/p>\n\u003ch5>3. 政治倡议和宣言\u003c/h5>\n\u003cp>例如某些国际安全倡议主要体现政策立场、合作理念和行动方向。\u003c/p>\n\u003cp>是否进一步产生法律义务，需要观察是否形成条约、具有约束力的国际组织决定或者其他国际法依据。\u003c/p>\n\u003ch5>4. 国内执行措施\u003c/h5>\n\u003cp>即使国家已经承担国际义务，具体由哪个国内机关实施、能够采取何种措施，仍需依据国内法律确定。\u003c/p>\n\u003cp>因此可以形成：\u003c/p>\n\u003cp>\u003cstrong>政治倡议\u003c/strong>\u003cbr>≠\u003cbr>\u003cstrong>国际法律义务\u003c/strong>\u003cbr>≠\u003cbr>\u003cstrong>国际组织具有拘束力的决定\u003c/strong>\u003cbr>≠\u003cbr>\u003cstrong>国内具体执行权限\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（四）四大倡议属于后续发展\u003c/h4>\n\u003cp>2022年提出的全球安全倡议以及2023年发布的《全球安全倡议概念文件》，可以作为第10条立法以后我国国际安全理念和实践发展的研究材料。\n其中关于共同安全、尊重各国合理安全关切、和平解决争端和统筹传统与非传统安全等内容，与第8条、第10条存在明显的议题联系。\u003c/p>\n\u003chr>\n\u003ch4>（五）《联合国宪章》的比较和规范意义\u003c/h4>\n\u003cp>《联合国宪章》第1条规定联合国维护国际和平与安全、发展国际友好关系并促进国际合作；第2条进一步规定主权平等、善意履行义务、和平解决争端以及禁止非法武力威胁或者使用武力等基本原则。\n因此，可以将《联合国宪章》作为理解第10条国际安全合作的重要国际法背景。但二者仍应保持法源上的区分：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>《国家安全法》第10条是中国国内法规范；《联合国宪章》是具有独立国际法地位的国际条约。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>解释具体国际义务时，应直接依据相应国际法规范，而不能仅通过第10条进行间接推导。\u003c/p>\n\u003chr>\n\u003ch4>（六）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：开展国际安全合作意味着国家必须无条件向外国提供国家安全信息。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第10条只是规定国际安全合作原则。具体情报、数据或者其他信息能否提供，需要依据有关国内法、保密制度和适用国际合作规范判断。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：“履行国际安全义务”意味着所有国际安全倡议都属于中国承担的法律义务。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 是否构成法律义务必须判断具体文件的法律性质以及中国是否依法受其约束。政治倡议不能当然等同于条约义务。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：“共同安全”就是联合国意义上的“集体安全”。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 共同安全是一种较广泛的安全理念；集体安全通常涉及特定国际组织、职权和程序安排，两者不能直接等同。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：促进共同安全意味着本国利益必须让位于其他国家的安全利益。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第8条明确要求“统筹自身安全和共同安全”。共同安全并不意味着放弃本国正当的主权、安全和发展利益。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：维护本国国家安全可以根据第10条采取任何必要的对外措施。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第10条强调安全合作、国际义务和世界和平，并没有授权国家超越适用国际法采取行动。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：国际安全合作有国际法依据后，就不再需要国内法授权。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 国际法义务与国内机关的实施权限属于不同问题。具体机关采取行政、执法或者数据提供等措施时，仍应依据国内法确定其权限和程序。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点7：全球安全倡议属于第10条的原始立法依据。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第10条制定于2015年，全球安全倡议提出于2022年。后者可以用于研究本条理念的后续发展，不能倒置时间关系。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>“国际安全义务”的法源范围如何确定？\u003c/strong>\u003cbr>应如何区分条约义务、习惯国际法义务、国际组织具有拘束力的决定以及一般政治承诺？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国际安全义务如何转化为国内执行权限？\u003c/strong>\u003cbr>国家承担国际法义务以后，是否仍需依据国内法确定具体执行机关、实施程序和措施范围？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>共同安全与自身安全发生现实张力时如何协调？\u003c/strong>\u003cbr>第8条要求统筹自身安全和共同安全，第10条进一步要求促进共同安全。具体判断中应当考虑哪些因素？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何区分共同安全与集体安全？\u003c/strong>\u003cbr>二者在理论目标、组织结构、法律依据和实施机制上分别具有哪些差异？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国际安全合作中的信息共享边界如何确定？\u003c/strong>\u003cbr>当安全合作涉及情报、数据、个人信息或者商业秘密时，应如何协调国际合作需要、国家秘密保护、数据安全和个人权益？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>政治倡议如何发展为具有法律效力的国际合作机制？\u003c/strong>\u003cbr>从政策倡议、联合声明、谅解备忘录到国际条约或者国际组织正式机制，不同阶段的法律效力如何变化？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何评价国际安全合作的实际效果？\u003c/strong>\u003cbr>除合作数量和参与范围外，是否还应考察风险降低、危机沟通、履约情况、长期稳定性以及对其他国家安全利益的影响？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>第10条在具体国际合作案件中具有何种规范功能？\u003c/strong>\u003cbr>它主要属于政策和体系解释原则，还是能够对具体国家机关理解国际合作权限、合作目的和实施方式产生更直接的法律约束？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":11,"label":"第十一条","title":"维护国家安全的责任与义务","lawText":"中华人民共和国公民、一切国家机关和武装力量、各政党和各人民团体、企业事业组织和其他社会组织，都有维护国家安全的责任和义务。\n\n中国的主权和领土完整不容侵犯和分割。维护国家主权、统一和领土完整是包括港澳同胞和台湾同胞在内的全中国人民的共同义务。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>主体广泛：\u003c/strong> 维护国家安全的责任主体不仅包括公民，也包括国家机关、武装力量、政党、人民团体、企业事业组织和其他社会组织。\u003c/li>\n\u003cli>\u003cstrong>义务分化：\u003c/strong> “人人有责”并不意味着“人人责任相同”。国家机关依法履职、公民报告协助、单位教育管理、企业配合安全措施，均有各自具体规范依据。\u003c/li>\n\u003cli>\u003cstrong>特定共同义务：\u003c/strong> 第二款特别强调维护国家主权、统一和领土完整，并明确将港澳同胞和台湾同胞纳入共同义务的表述。\u003c/li>\n\u003cli>\u003cstrong>后续具体化：\u003c/strong> 第77—79条进一步规定公民和组织的具体义务，第80—82条规定保护、补偿和监督救济，第13条则建立违反义务时依法追究法律责任的原则性连接。\u003c/li>\n\u003cli>\u003cstrong>适用边界：\u003c/strong> 第11条确立总体责任方向，本身不能直接推导任意主体负有无限制提供信息、财产、劳动或者接受强制措施的义务；具体义务仍须查明法律依据、触发条件、责任主体和程序。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中华人民共和国公民、一切国家机关和武装力量、各政党和各人民团体、企业事业组织和其他社会组织，都有维护国家安全的责任和义务。\u003c/p>\n\u003cp>中国的主权和领土完整不容侵犯和分割。维护国家主权、统一和领土完整是包括港澳同胞和台湾同胞在内的全中国人民的共同义务。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>主体广泛：\u003c/strong> 维护国家安全的责任主体不仅包括公民，也包括国家机关、武装力量、政党、人民团体、企业事业组织和其他社会组织。\u003c/li>\n\u003cli>\u003cstrong>义务分化：\u003c/strong> “人人有责”并不意味着“人人责任相同”。国家机关依法履职、公民报告协助、单位教育管理、企业配合安全措施，均有各自具体规范依据。\u003c/li>\n\u003cli>\u003cstrong>特定共同义务：\u003c/strong> 第二款特别强调维护国家主权、统一和领土完整，并明确将港澳同胞和台湾同胞纳入共同义务的表述。\u003c/li>\n\u003cli>\u003cstrong>后续具体化：\u003c/strong> 第77—79条进一步规定公民和组织的具体义务，第80—82条规定保护、补偿和监督救济，第13条则建立违反义务时依法追究法律责任的原则性连接。\u003c/li>\n\u003cli>\u003cstrong>适用边界：\u003c/strong> 第11条确立总体责任方向，本身不能直接推导任意主体负有无限制提供信息、财产、劳动或者接受强制措施的义务；具体义务仍须查明法律依据、触发条件、责任主体和程序。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中华人民共和国公民、一切国家机关和武装力量、各政党和各人民团体、企业事业组织和其他社会组织，都有维护国家安全的责任和义务。\u003c/p>\n\u003cp>中国的主权和领土完整不容侵犯和分割。维护国家主权、统一和领土完整是包括港澳同胞和台湾同胞在内的全中国人民的共同义务。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">维护国家安全的责任与义务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定维护国家安全的\u003cstrong>普遍责任与共同义务\u003c/strong>。第一款从主体范围入手，明确维护国家安全并非少数专门机关的职责，而是由公民、国家机关、武装力量、政党、人民团体以及各类组织共同承担；第二款则将国家主权、统一和领土完整单独提出，规定其为包括港澳同胞和台湾同胞在内的全中国人民的共同义务。\u003c/p>\n\u003cp>理解本条，需要特别区分两个层次：\u003cstrong>普遍负有维护国家安全的责任和义务 ≠ 不同主体承担完全相同的具体法律义务。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 宪法上的公民义务构成本条的重要规范基础\u003c/h4>\n\u003cp>宪法依据包括：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>《宪法》第52条：\u003c/strong> 公民有维护国家统一和全国各民族团结的义务；\u003c/li>\n\u003cli>\u003cstrong>《宪法》第54条：\u003c/strong> 公民有维护祖国安全、荣誉和利益的义务；\u003c/li>\n\u003cli>\u003cstrong>《宪法》第55条：\u003c/strong> 保卫祖国、抵抗侵略是每一个公民的神圣职责。\u003c/li>\n\u003c/ul>\n\u003cp>因此，《国家安全法》第11条是在综合性国家安全法律框架中进一步确认、展开宪法上的国家统一、祖国安全和保卫祖国等义务。\u003c/p>\n\u003cp>但第11条同时具有明显的扩展：&gt; \u003cstrong>宪法相关条款主要从“公民”角度规定基本义务，第11条则进一步明确国家机关、武装力量、政党、人民团体、企业事业组织和其他社会组织同样承担维护国家安全的责任和义务。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>2. 2014年12月草案阶段已经确立“国家安全人人有责”的基本结构\u003c/h4>\n\u003cp>乔晓阳主编《中华人民共和国国家安全法释义》附录二第377页所载2014年12月22日国家安全法草案说明，在“关于公民、组织的权利义务”部分已经明确提出：\u003c/p>\n\u003cul>\n\u003cli>公民和组织负有维护国家安全的义务；\u003c/li>\n\u003cli>强调“国家安全人人有责”；\u003c/li>\n\u003cli>中国的主权和领土完整不容分割；\u003c/li>\n\u003cli>维护国家主权、统一和领土完整是包括港澳同胞和台湾同胞在内的全体中国人民的共同义务；\u003c/li>\n\u003cli>草案还进一步规定公民和组织的一般义务、机关和单位的教育动员义务以及企业事业组织的相关义务。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，维护国家安全的义务主体具有广泛性\u003c/h4>\n\u003cp>第一款首先从主体范围确立维护国家安全的普遍责任。条文列举：\u003c/p>\n\u003cul>\n\u003cli>中华人民共和国公民；\u003c/li>\n\u003cli>一切国家机关；\u003c/li>\n\u003cli>武装力量；\u003c/li>\n\u003cli>各政党；\u003c/li>\n\u003cli>各人民团体；\u003c/li>\n\u003cli>企业事业组织；\u003c/li>\n\u003cli>其他社会组织。\n这一规定最直接的制度意义是：\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>维护国家安全并非国家安全机关或者公安机关的专属事务。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第9条已经要求“充分发挥专门机关和其他有关机关维护国家安全的职能作用，广泛动员公民和组织”，第11条则进一步从责任和义务角度确定广泛主体基础。\n因此可以形成：\n\u003cstrong>第9条：如何组织国家安全力量\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第11条：哪些主体负有维护国家安全的责任和义务\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>第二，“共同责任”并不意味着所有主体承担相同的具体义务\u003c/h4>\n\u003cp>这是理解第11条最重要的解释边界。\n虽然第一款将不同主体共同纳入维护国家安全的责任体系，但各主体的法律地位、能力和职责明显不同，因此具体义务不能简单等同。\n例如：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>主体\u003c/th>\n\u003cth>主要规范形态\u003c/th>\n\u003cth>关联规定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>国家机关\u003c/strong>\u003c/td>\n\u003ctd>依照法定职权履行国家安全职责\u003c/td>\n\u003ctd>第35—43条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>公民和组织\u003c/strong>\u003c/td>\n\u003ctd>报告线索、提供证据、支持协助、保守秘密等\u003c/td>\n\u003ctd>第77条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>机关、人民团体、企业事业组织等单位\u003c/strong>\u003c/td>\n\u003ctd>对本单位人员开展国家安全教育，组织防范和制止危害国家安全行为\u003c/td>\n\u003ctd>第78条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>企业事业组织\u003c/strong>\u003c/td>\n\u003ctd>根据国家安全工作要求配合有关部门采取相关安全措施\u003c/td>\n\u003ctd>第79条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>支持、协助国家安全工作的公民和组织\u003c/strong>\u003c/td>\n\u003ctd>同时享有保护、补偿以及监督救济等权利\u003c/td>\n\u003ctd>第80—82条\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>现行《国家安全法》第77—82条明确规定了上述义务、保护和监督救济机制。\n因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第11条提供共同的责任基础，后续条文再根据主体类型将这一责任具体化。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三，应当区分“维护国家安全的责任”与“不履行义务后的法律责任”\u003c/h4>\n\u003cp>第11条使用的是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“责任和义务”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>而第13条规定的是违反法律或者不履行维护国家安全义务以后：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“依法追究法律责任”。\u003c/strong>\n二者不能混为一谈。\n第11条中的“责任”主要用于表达不同主体在国家安全体系中承担维护国家安全的规范责任；第13条中的“法律责任”则指违反法定义务以后可能产生的不利法律后果。\n因此可以区分为：\n\u003cstrong>第11条：应当承担什么责任和义务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第77—79条等：义务的具体内容是什么\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第13条及有关法律：违反义务后承担何种法律责任\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第13条明确规定，个人和组织违反本法和有关法律、不履行维护国家安全义务或者从事危害国家安全活动的，依法追究法律责任。\n但第13条本身同样属于原则性的责任衔接规范。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>究竟承担行政责任、刑事责任、民事责任或者其他法律后果，仍须依据相应的具体责任规范判断。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第四，第二款特别强调国家主权、统一和领土完整\u003c/h4>\n\u003cp>第一款规定一般性的国家安全责任和义务，第二款则从国家安全的各种保护利益中，特别提出：\n\u003cstrong>主权 + 统一 + 领土完整\u003c/strong>\n这一结构与第2条国家安全定义存在直接联系。第2条将国家政权、主权、统一和领土完整列于国家安全保护利益之中，第11条进一步从全体人民共同义务的角度强调其中的主权、统一和领土完整。\n这种专门强调也与《宪法》第52条维护国家统一义务、第54条维护祖国安全利益义务和第55条保卫祖国职责形成体系联系。\n因此，本条内部可以区分：\u003c/p>\n\u003cp>\u003cstrong>第一款：一般国家安全责任\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第二款：主权、统一和领土完整领域的共同义务\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>第五，第二款明确将港澳同胞和台湾同胞纳入共同义务的表述\u003c/h4>\n\u003cp>第二款明确规定：\u003c/p>\n\u003cblockquote>\n\u003cp>维护国家主权、统一和领土完整，是包括港澳同胞和台湾同胞在内的全中国人民的共同义务。\u003c
