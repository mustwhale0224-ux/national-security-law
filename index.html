体国家安全观，具有重要意义，故选择该日。</li>\n<li><strong>初稿已有教育日。</strong> 2014年12月草案说明已记载每年4月15日为全民国家安全教育日，见甲书附录二第377页（PDF390页）。</li>\n<li><strong>最终审议时拆分内容。</strong> 2015年6月30日修改意见报告提出，国家安全教育是经常性工作，不能局限在教育日；因而将草案第14条有关通过多种形式开展宣传教育的内容移入第76条。见甲书附录五第387—388页（PDF400—401页）。</li>\n</ol>\n<p>因此，现行第14条的简短文字，是与第76条分工后的结果，不代表教育任务仅限一天。</p>\n<h3>三、主要内容</h3>\n<p><strong>全民性。</strong> 教育面向社会公众，同时需要结合机关、学校、企业和不同群体的实际，提供适当内容。</p>\n<p><strong>法定日期。</strong> 法律直接规定每年的活动日，具有持续性，不须每年重新设立。年度活动主题和实施安排属于具体落实层面，不是第14条本身的组成部分。</p>\n<p><strong>集中宣传与经常教育相结合。</strong> 第14条提供集中活动的时间节点；第76条规定国民教育体系、公务员教育培训体系以及媒体宣传等经常性安排；第78条涉及单位对本单位人员的教育动员。</p>\n<p><strong>教育具有能力建设意义。</strong> 两书均强调提高安全意识；结合第2条能力维度和第9条预防原则，还应理解为帮助公众识别风险、知道合法应对和报告方式。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>法律实施不只依赖处罚。</strong> 宣传教育可降低公众理解法律的成本，使抽象义务转化为能够识别的行为规则。它与第12条激励、第13条责任追究共同构成不同的实施方式。</p>\n<p><strong>法定教育任务与任意设定义务不同〔笔记分析〕。</strong> 本条并未直接创设对每个公民的统一考试、签到或处罚机制。具体机关、学校、单位的培训安排是否具有相应依据，应分别查明，不能只凭教育日的设立推出一切强制要求。</p>\n<p><strong>教育内容的完整性〔笔记分析〕。</strong> 按整部法律理解，教育既应讲安全风险与义务，也应讲法治原则、权利保障、举报边界和合法救济，帮助公众避免把一般分歧、正常交往或未经核实的怀疑直接等同于违法犯罪。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>两书对读</strong>：甲书说明活动日的立法形式、日期选择；乙书列举主题公园、图书馆宣讲和高校课程等场景，有助于理解教育形式。</li>\n<li><strong>条文定位</strong>：将国家安全教育纳入国民教育和公务员培训体系的直接条文是第76条，不能只将第14条当作这部分完整文本的来源。</li>\n<li><strong>研究问题</strong>：如何评价教育实际提升了公众的法律理解和应对能力，而不只是增加活动次数或宣传数量？</li>\n</ul></div></div>","notesHtml":"<p>本条直接设立全国性的国家安全教育活动日，并确定具体日期。</p>\n<h3>二、立法沿革</h3>\n<ol>\n<li><strong>日期的由来。</strong> 甲书第66页说明，2014年4月15日中央国家安全委员会第一次会议提出总体国家安全观，具有重要意义，故选择该日。</li>\n<li><strong>初稿已有教育日。</strong> 2014年12月草案说明已记载每年4月15日为全民国家安全教育日，见甲书附录二第377页（PDF390页）。</li>\n<li><strong>最终审议时拆分内容。</strong> 2015年6月30日修改意见报告提出，国家安全教育是经常性工作，不能局限在教育日；因而将草案第14条有关通过多种形式开展宣传教育的内容移入第76条。见甲书附录五第387—388页（PDF400—401页）。</li>\n</ol>\n<p>因此，现行第14条的简短文字，是与第76条分工后的结果，不代表教育任务仅限一天。</p>\n<h3>三、主要内容</h3>\n<p><strong>全民性。</strong> 教育面向社会公众，同时需要结合机关、学校、企业和不同群体的实际，提供适当内容。</p>\n<p><strong>法定日期。</strong> 法律直接规定每年的活动日，具有持续性，不须每年重新设立。年度活动主题和实施安排属于具体落实层面，不是第14条本身的组成部分。</p>\n<p><strong>集中宣传与经常教育相结合。</strong> 第14条提供集中活动的时间节点；第76条规定国民教育体系、公务员教育培训体系以及媒体宣传等经常性安排；第78条涉及单位对本单位人员的教育动员。</p>\n<p><strong>教育具有能力建设意义。</strong> 两书均强调提高安全意识；结合第2条能力维度和第9条预防原则，还应理解为帮助公众识别风险、知道合法应对和报告方式。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>法律实施不只依赖处罚。</strong> 宣传教育可降低公众理解法律的成本，使抽象义务转化为能够识别的行为规则。它与第12条激励、第13条责任追究共同构成不同的实施方式。</p>\n<p><strong>法定教育任务与任意设定义务不同〔笔记分析〕。</strong> 本条并未直接创设对每个公民的统一考试、签到或处罚机制。具体机关、学校、单位的培训安排是否具有相应依据，应分别查明，不能只凭教育日的设立推出一切强制要求。</p>\n<p><strong>教育内容的完整性〔笔记分析〕。</strong> 按整部法律理解，教育既应讲安全风险与义务，也应讲法治原则、权利保障、举报边界和合法救济，帮助公众避免把一般分歧、正常交往或未经核实的怀疑直接等同于违法犯罪。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>两书对读</strong>：甲书说明活动日的立法形式、日期选择；乙书列举主题公园、图书馆宣讲和高校课程等场景，有助于理解教育形式。</li>\n<li><strong>条文定位</strong>：将国家安全教育纳入国民教育和公务员培训体系的直接条文是第76条，不能只将第14条当作这部分完整文本的来源。</li>\n<li><strong>研究问题</strong>：如何评价教育实际提升了公众的法律理解和应对能力，而不只是增加活动次数或宣传数量？</li>\n</ul>"},{"num":15,"label":"第十五条","title":"政治安全任务","lawText":"国家坚持中国共产党的领导，维护中国特色社会主义制度，发展社会主义民主政治，健全社会主义法治，强化权力运行制约和监督机制，保障人民当家作主的各项权利。 国家防范、制止和依法惩治任何叛国、分裂国家、煽动叛乱、颠覆或者煽动颠覆人民民主专政政权的行为；防范、制止和依法惩治窃取、泄露国家秘密等危害国家安全的行为；防范、制止和依法惩治境外势力的渗透、破坏、颠覆、分裂活动。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第十五条</div><p class=\"article-law-text\">国家坚持中国共产党的领导，维护中国特色社会主义制度，发展社会主义民主政治，健全社会主义法治，强化权力运行制约和监督机制，保障人民当家作主的各项权利。 国家防范、制止和依法惩治任何叛国、分裂国家、煽动叛乱、颠覆或者煽动颠覆人民民主专政政权的行为；防范、制止和依法惩治窃取、泄露国家秘密等危害国家安全的行为；防范、制止和依法惩治境外势力的渗透、破坏、颠覆、分裂活动。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第十五条</div><p class=\"article-law-text\">国家坚持中国共产党的领导，维护中国特色社会主义制度，发展社会主义民主政治，健全社会主义法治，强化权力运行制约和监督机制，保障人民当家作主的各项权利。 国家防范、制止和依法惩治任何叛国、分裂国家、煽动叛乱、颠覆或者煽动颠覆人民民主专政政权的行为；防范、制止和依法惩治窃取、泄露国家秘密等危害国家安全的行为；防范、制止和依法惩治境外势力的渗透、破坏、颠覆、分裂活动。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>从本条开始进入第二章。第一款规定政治制度建设和保障任务，第二款规定防范、制止和惩治有关危害行为的任务。</p>\n<h3>二、立法沿革</h3>\n<p><strong>二审有明显的内容与结构调整。</strong> 2015年4月20日修改情况汇报，针对原草案第14条，将原第二款禁止性规定之后有关巩固党的执政地位的内容前移至第一款，并建议以党的领导、制度、民主、人民权利、权力制约和法治等内容展开。见甲书附录三第379—380页（PDF392—393页）。</p>\n<p><strong>比较时注意版本区别。</strong> 二审报告中第一款的排列顺序与定稿不完全一致，并有“维护宪法法律权威”等文字。笔记引用现行原文必须依定稿，不能把审议建议稿直接替代现行第15条。</p>\n<p><strong>制度意义〔笔记分析〕。</strong> 将制度建设、民主法治和权利保障放到首款，使政治安全不仅呈现为对危害行为的防御，也表现为对政治秩序自身建设的要求。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>政治领导与制度维护。</strong> 坚持党的领导、维护中国特色社会主义制度，承接第1、3、4条的总体安排。</li>\n<li><strong>民主法治与权力监督。</strong> 发展民主政治、健全法治、强化权力运行制约监督，是本条明文列出的安全任务，不能在摘要中省略。</li>\n<li><strong>人民权利保障。</strong> 第一款以保障人民当家作主的权利收束，体现政治安全与公民政治参与、权利保障的联系。</li>\n<li><strong>三组危害行为的应对。</strong> 第二款分别涉及叛国分裂颠覆等行为，窃取泄露国家秘密等行为，以及境外势力的有关活动。各组均要求防范、制止和依法惩治。</li>\n</ol>\n<p>甲书逐项解释第一款的六方面内容，并联系具体制度；乙书强调透明、参与、监督和政府公信力，同时补充案件说明。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>维护政治安全与完善制度〔笔记分析〕。</strong> 两款应整体理解：既处理外部侵害和违法活动，也通过法治、监督与权利保障减少内部治理问题。仅把本条缩减为惩治性任务，会遗漏其明确的建设性内容。</p>\n<p><strong>任务条款与犯罪构成不同。</strong> 本条没有独立规定每个罪名的行为要件、主观要件、入罪门槛和刑罚。具体案件仍须依据刑法、保密法、反间谍法等相应规范，不能从概括性的“渗透”等描述直接得出个人有罪的结论。</p>\n<p><strong>不得把批评监督与危害行为混同〔体系解释〕。</strong> 应与第7条权利自由保障、第82条批评建议及申诉控告检举规定联读。判断具体行为，须查明事实和法定界限，不以是否表达不同意见直接替代法律评价。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书案例的用途</strong>：其提供的为境外刺探、非法提供国家秘密案件，可用于观察第二款与刑事法律的联系。完整定罪依据应以相关刑法规范及裁判材料为准，不能概括为仅依本条判刑。</li>\n<li><strong>注意论述层次</strong>：乙书的一些概括性表述，如有关“司法独立”的讨论，属于作者解释。研究我国司法职权与组织制度时，应回到宪法关于人民法院、人民检察院依法独立行使职权等具体规定，不能用学术概念替代制度文本。</li>\n<li><strong>关联条文</strong>：第3、4、7、13、43、82条。</li>\n<li><strong>研究问题</strong>：如何把权力监督和公民权利保障作为政治安全制度成效的组成部分，而不是只统计查处行为的数量？</li>\n</ul></div></div>","notesHtml":"<p>从本条开始进入第二章。第一款规定政治制度建设和保障任务，第二款规定防范、制止和惩治有关危害行为的任务。</p>\n<h3>二、立法沿革</h3>\n<p><strong>二审有明显的内容与结构调整。</strong> 2015年4月20日修改情况汇报，针对原草案第14条，将原第二款禁止性规定之后有关巩固党的执政地位的内容前移至第一款，并建议以党的领导、制度、民主、人民权利、权力制约和法治等内容展开。见甲书附录三第379—380页（PDF392—393页）。</p>\n<p><strong>比较时注意版本区别。</strong> 二审报告中第一款的排列顺序与定稿不完全一致，并有“维护宪法法律权威”等文字。笔记引用现行原文必须依定稿，不能把审议建议稿直接替代现行第15条。</p>\n<p><strong>制度意义〔笔记分析〕。</strong> 将制度建设、民主法治和权利保障放到首款，使政治安全不仅呈现为对危害行为的防御，也表现为对政治秩序自身建设的要求。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>政治领导与制度维护。</strong> 坚持党的领导、维护中国特色社会主义制度，承接第1、3、4条的总体安排。</li>\n<li><strong>民主法治与权力监督。</strong> 发展民主政治、健全法治、强化权力运行制约监督，是本条明文列出的安全任务，不能在摘要中省略。</li>\n<li><strong>人民权利保障。</strong> 第一款以保障人民当家作主的权利收束，体现政治安全与公民政治参与、权利保障的联系。</li>\n<li><strong>三组危害行为的应对。</strong> 第二款分别涉及叛国分裂颠覆等行为，窃取泄露国家秘密等行为，以及境外势力的有关活动。各组均要求防范、制止和依法惩治。</li>\n</ol>\n<p>甲书逐项解释第一款的六方面内容，并联系具体制度；乙书强调透明、参与、监督和政府公信力，同时补充案件说明。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>维护政治安全与完善制度〔笔记分析〕。</strong> 两款应整体理解：既处理外部侵害和违法活动，也通过法治、监督与权利保障减少内部治理问题。仅把本条缩减为惩治性任务，会遗漏其明确的建设性内容。</p>\n<p><strong>任务条款与犯罪构成不同。</strong> 本条没有独立规定每个罪名的行为要件、主观要件、入罪门槛和刑罚。具体案件仍须依据刑法、保密法、反间谍法等相应规范，不能从概括性的“渗透”等描述直接得出个人有罪的结论。</p>\n<p><strong>不得把批评监督与危害行为混同〔体系解释〕。</strong> 应与第7条权利自由保障、第82条批评建议及申诉控告检举规定联读。判断具体行为，须查明事实和法定界限，不以是否表达不同意见直接替代法律评价。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书案例的用途</strong>：其提供的为境外刺探、非法提供国家秘密案件，可用于观察第二款与刑事法律的联系。完整定罪依据应以相关刑法规范及裁判材料为准，不能概括为仅依本条判刑。</li>\n<li><strong>注意论述层次</strong>：乙书的一些概括性表述，如有关“司法独立”的讨论，属于作者解释。研究我国司法职权与组织制度时，应回到宪法关于人民法院、人民检察院依法独立行使职权等具体规定，不能用学术概念替代制度文本。</li>\n<li><strong>关联条文</strong>：第3、4、7、13、43、82条。</li>\n<li><strong>研究问题</strong>：如何把权力监督和公民权利保障作为政治安全制度成效的组成部分，而不是只统计查处行为的数量？</li>\n</ul>"},{"num":16,"label":"第十六条","title":"人民安全任务","lawText":"国家维护和发展最广大人民的根本利益，保卫人民安全，创造良好生存发展条件和安定工作生活环境，保障公民的生命财产安全和其他合法权益。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第十六条</div><p class=\"article-law-text\">国家维护和发展最广大人民的根本利益，保卫人民安全，创造良好生存发展条件和安定工作生活环境，保障公民的生命财产安全和其他合法权益。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第十六条</div><p class=\"article-law-text\">国家维护和发展最广大人民的根本利益，保卫人民安全，创造良好生存发展条件和安定工作生活环境，保障公民的生命财产安全和其他合法权益。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>本条把第1条人民根本利益和第3条人民安全宗旨，转化为第二章中的具体国家任务。</p>\n<h3>二、立法沿革</h3>\n<p><strong>人民安全在初稿中已经存在。</strong> 2014年12月草案说明介绍，草案将确保人民安全纳入维护国家安全的任务。它不是后来才出现的保护对象。</p>\n<p><strong>二审时显著前移。</strong> 2015年4月20日修改情况汇报明确提出，将原草案第29条有关人民安全的规定移到第二章第二条，突出维护国家安全以人民安全为宗旨。见甲书附录三第380页（PDF393页）。</p>\n<p><strong>位置变化的意义〔笔记分析〕。</strong> 从较后的条文前移到政治安全之后，强化了人民安全对其他任务的价值指引。不过，条文排列本身不意味着在每种冲突中已经给出自动适用的优先公式。</p>\n<h3>三、主要内容</h3>\n<p><strong>维护和发展利益。</strong> “维护”侧重防止既有利益受侵害，“发展”意味着改善人民生活和发展条件，两者共同说明安全保护并不限于被动消除危险。</p>\n<p><strong>保卫人民安全。</strong> 甲书通过事故、灾害、暴力犯罪、海外人员遇险等情形说明风险来源的多样性，并强调生命安全和安全保障能力。</p>\n<p><strong>创造生存发展与工作生活条件。</strong> 两书都把这一要求与公共服务、环境、民生、社会治理联系起来，表明安全具有日常和持续的面向。</p>\n<p><strong>生命财产与其他合法权益。</strong> 条文不是只保护人身免受伤害，也明确财产与其他合法权益，阅读时应与第7条人权和自由保障相衔接。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>国家的积极保护任务〔笔记分析〕。</strong> 本条要求国家建立保护能力、减少重大危险、提供必要制度条件。它可作为理解国家安全制度目的的依据，但具体主体能否主张何种给付、补偿或救济，仍取决于相关实体与程序规则。</p>\n<p><strong>人的安全与国家安全的联系。</strong> 从法理比较上，可以讨论保护对象从国家领土、政权扩展到人的生存、发展和尊严所产生的制度变化。这里并非认定本条与某种外国“人的安全”理论完全相同，而是提供研究维度。</p>\n<p><strong>避免概念无限泛化。</strong> 乙书列出交通、食品、环境等公共安全事项，适合说明人民安全的广度；但本条并未将每一起普通民事纠纷或日常事故都转化为国家安全案件。应分别识别治理层面的国家任务与个案适用的部门法依据。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>两书实例</strong>：甲书用海外撤离等例子说明保护可以具有跨境面向；乙书用天津港“8·12”特别重大火灾爆炸事故说明生命财产与生活环境保护。笔记关注预防、救援、恢复与责任，不重复未经必要核验的统计数字。</li>\n<li><strong>案例评价的边界</strong>：事故发生后采取救助，不足以单独证明全部国家保护义务已经履行；还应分别分析事前预防、日常监管、应急处置和事后救济。</li>\n<li><strong>关联条文</strong>：第1、3、7、8、29、33条及有关安全生产、应急管理、民事权益保护制度。</li>\n<li><strong>研究问题</strong>：如何将“人民安全”转化为既覆盖重大风险、又能衡量具体人群实际处境的制度指标？</li>\n</ul></div></div>","notesHtml":"<p>本条把第1条人民根本利益和第3条人民安全宗旨，转化为第二章中的具体国家任务。</p>\n<h3>二、立法沿革</h3>\n<p><strong>人民安全在初稿中已经存在。</strong> 2014年12月草案说明介绍，草案将确保人民安全纳入维护国家安全的任务。它不是后来才出现的保护对象。</p>\n<p><strong>二审时显著前移。</strong> 2015年4月20日修改情况汇报明确提出，将原草案第29条有关人民安全的规定移到第二章第二条，突出维护国家安全以人民安全为宗旨。见甲书附录三第380页（PDF393页）。</p>\n<p><strong>位置变化的意义〔笔记分析〕。</strong> 从较后的条文前移到政治安全之后，强化了人民安全对其他任务的价值指引。不过，条文排列本身不意味着在每种冲突中已经给出自动适用的优先公式。</p>\n<h3>三、主要内容</h3>\n<p><strong>维护和发展利益。</strong> “维护”侧重防止既有利益受侵害，“发展”意味着改善人民生活和发展条件，两者共同说明安全保护并不限于被动消除危险。</p>\n<p><strong>保卫人民安全。</strong> 甲书通过事故、灾害、暴力犯罪、海外人员遇险等情形说明风险来源的多样性，并强调生命安全和安全保障能力。</p>\n<p><strong>创造生存发展与工作生活条件。</strong> 两书都把这一要求与公共服务、环境、民生、社会治理联系起来，表明安全具有日常和持续的面向。</p>\n<p><strong>生命财产与其他合法权益。</strong> 条文不是只保护人身免受伤害，也明确财产与其他合法权益，阅读时应与第7条人权和自由保障相衔接。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>国家的积极保护任务〔笔记分析〕。</strong> 本条要求国家建立保护能力、减少重大危险、提供必要制度条件。它可作为理解国家安全制度目的的依据，但具体主体能否主张何种给付、补偿或救济，仍取决于相关实体与程序规则。</p>\n<p><strong>人的安全与国家安全的联系。</strong> 从法理比较上，可以讨论保护对象从国家领土、政权扩展到人的生存、发展和尊严所产生的制度变化。这里并非认定本条与某种外国“人的安全”理论完全相同，而是提供研究维度。</p>\n<p><strong>避免概念无限泛化。</strong> 乙书列出交通、食品、环境等公共安全事项，适合说明人民安全的广度；但本条并未将每一起普通民事纠纷或日常事故都转化为国家安全案件。应分别识别治理层面的国家任务与个案适用的部门法依据。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>两书实例</strong>：甲书用海外撤离等例子说明保护可以具有跨境面向；乙书用天津港“8·12”特别重大火灾爆炸事故说明生命财产与生活环境保护。笔记关注预防、救援、恢复与责任，不重复未经必要核验的统计数字。</li>\n<li><strong>案例评价的边界</strong>：事故发生后采取救助，不足以单独证明全部国家保护义务已经履行；还应分别分析事前预防、日常监管、应急处置和事后救济。</li>\n<li><strong>关联条文</strong>：第1、3、7、8、29、33条及有关安全生产、应急管理、民事权益保护制度。</li>\n<li><strong>研究问题</strong>：如何将“人民安全”转化为既覆盖重大风险、又能衡量具体人群实际处境的制度指标？</li>\n</ul>"},{"num":17,"label":"第十七条","title":"国土安全任务","lawText":"国家加强边防、海防和空防建设，采取一切必要的防卫和管控措施，保卫领陆、内水、领海和领空安全，维护国家领土主权和海洋权益。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第十七条</div><p class=\"article-law-text\">国家加强边防、海防和空防建设，采取一切必要的防卫和管控措施，保卫领陆、内水、领海和领空安全，维护国家领土主权和海洋权益。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第十七条</div><p class=\"article-law-text\">国家加强边防、海防和空防建设，采取一切必要的防卫和管控措施，保卫领陆、内水、领海和领空安全，维护国家领土主权和海洋权益。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>本条依次规定能力建设、保护措施、空间对象与保护目标。其中“领土主权”和“海洋权益”不能混为同一范围的权利。</p>\n<h3>二、立法沿革</h3>\n<p><strong>既有制度基础。</strong> 两书将本条联系于国防、领海及毗连区、专属经济区和大陆架、出入境管理、民用航空等制度。2015年法将这些分散领域置于维护国土安全的共同任务下。</p>\n<p><strong>从单一军事防卫到多种手段。</strong> 甲书除国防建设外，还讨论边境管理、海上执法和空域管理，说明国土安全同时涉及防卫和日常管控，并由不同机关依法分工。</p>\n<p>本批立法附录未发现本条逐次修改的明确记录，不据此推断其审议过程中完全没有变化。乙书引用的《陆地国界法》等后续法律，应作为2015年之后的制度发展阅读。</p>\n<h3>三、主要内容</h3>\n<p><strong>建设任务。</strong> 边防、海防、空防建设包括相应设施、人员、技术、装备、组织与协同能力。乙书主要从基础设施和专业能力角度展开。</p>\n<p><strong>防卫与管控。</strong> 甲书区分抵御武装侵犯的防卫工作和边境、出入境、海上及空中活动的日常管理。两者可能联系，但职权和程序不能直接互相替代。</p>\n<p><strong>领土范围与海洋利益。</strong> 领陆、内水、领海、领空是本条列出的保护对象；海洋权益还可能涉及不同海域的资源、管辖和其他合法权益，须按各自法律制度分析。</p>\n<p><strong>必要措施。</strong> “一切”说明可使用多方面手段，“必要”则对手段与保护目的之间的关系提出要求。理解本条还须结合第7条及相应专门法律。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>海洋法上的权利层次。</strong> 甲书第76—78页已经区分领海、毗连区、专属经济区和大陆架。可与《联合国海洋法公约》作如下对照：</p>\n<table>\n<thead>\n<tr>\n  <th>空间或海域</th>\n  <th>主要法律关系</th>\n  <th>研读提醒</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>领海</td>\n  <td>沿海国享有主权，行使受公约及其他国际法规则约束</td>\n  <td>不宜把主权写成完全不受规则限制</td>\n</tr>\n<tr>\n  <td>毗连区</td>\n  <td>在相应事项上具有特定管制权</td>\n  <td>不等于将领海边界外推</td>\n</tr>\n<tr>\n  <td>专属经济区</td>\n  <td>特定资源开发、养护、管理的主权权利及有关事项管辖权</td>\n  <td>不等于对整个海域享有领土主权</td>\n</tr>\n<tr>\n  <td>大陆架</td>\n  <td>对海床及底土自然资源具有相关主权权利</td>\n  <td>不当然改变上覆水域和上空的法律地位</td>\n</tr>\n</tbody>\n</table>\n<p>比较依据：<a href=\"https://www.un.org/depts/los/convention_agreements/texts/unclos/part2.htm\">公约第二部分</a>、<a href=\"https://www.un.org/depts/los/convention_agreements/texts/unclos/part5.htm\">第五部分</a>、<a href=\"https://www.un.org/depts/los/convention_agreements/texts/unclos/part6.htm\">第六部分</a>。具体海域范围、划界和争议仍须单独研究，不能用此表替代对具体主张的合法性判断。</p>\n<p><strong>任务与权限〔笔记分析〕。</strong> 本条不能单独回答哪个机关可以对哪种船舶、人员或航空器采取何种措施。应继续查明空间管辖、机关职权、措施条件与程序；“必要”也不是脱离法律的自由裁量许可证。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>两书对读</strong>：甲书对海域法律性质与具体制度解释更细；乙书着重设施、装备和管理能力，适合补充治理场景。</li>\n<li><strong>旧机构和旧条号</strong>：甲书关于边防力量、部门分工及旧《国防法》条号的叙述具有出版时点，不能直接当作今天的机构清单。</li>\n<li><strong>关联条文</strong>：第8条国土与国民安全统筹、第18条军事安全、第33条海外利益保护。</li>\n<li><strong>研究问题</strong>：怎样在陆、海、空不同空间中，同时准确识别保护利益、权利性质与措施权限？</li>\n</ul></div></div>","notesHtml":"<p>本条依次规定能力建设、保护措施、空间对象与保护目标。其中“领土主权”和“海洋权益”不能混为同一范围的权利。</p>\n<h3>二、立法沿革</h3>\n<p><strong>既有制度基础。</strong> 两书将本条联系于国防、领海及毗连区、专属经济区和大陆架、出入境管理、民用航空等制度。2015年法将这些分散领域置于维护国土安全的共同任务下。</p>\n<p><strong>从单一军事防卫到多种手段。</strong> 甲书除国防建设外，还讨论边境管理、海上执法和空域管理，说明国土安全同时涉及防卫和日常管控，并由不同机关依法分工。</p>\n<p>本批立法附录未发现本条逐次修改的明确记录，不据此推断其审议过程中完全没有变化。乙书引用的《陆地国界法》等后续法律，应作为2015年之后的制度发展阅读。</p>\n<h3>三、主要内容</h3>\n<p><strong>建设任务。</strong> 边防、海防、空防建设包括相应设施、人员、技术、装备、组织与协同能力。乙书主要从基础设施和专业能力角度展开。</p>\n<p><strong>防卫与管控。</strong> 甲书区分抵御武装侵犯的防卫工作和边境、出入境、海上及空中活动的日常管理。两者可能联系，但职权和程序不能直接互相替代。</p>\n<p><strong>领土范围与海洋利益。</strong> 领陆、内水、领海、领空是本条列出的保护对象；海洋权益还可能涉及不同海域的资源、管辖和其他合法权益，须按各自法律制度分析。</p>\n<p><strong>必要措施。</strong> “一切”说明可使用多方面手段，“必要”则对手段与保护目的之间的关系提出要求。理解本条还须结合第7条及相应专门法律。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>海洋法上的权利层次。</strong> 甲书第76—78页已经区分领海、毗连区、专属经济区和大陆架。可与《联合国海洋法公约》作如下对照：</p>\n<table>\n<thead>\n<tr>\n  <th>空间或海域</th>\n  <th>主要法律关系</th>\n  <th>研读提醒</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>领海</td>\n  <td>沿海国享有主权，行使受公约及其他国际法规则约束</td>\n  <td>不宜把主权写成完全不受规则限制</td>\n</tr>\n<tr>\n  <td>毗连区</td>\n  <td>在相应事项上具有特定管制权</td>\n  <td>不等于将领海边界外推</td>\n</tr>\n<tr>\n  <td>专属经济区</td>\n  <td>特定资源开发、养护、管理的主权权利及有关事项管辖权</td>\n  <td>不等于对整个海域享有领土主权</td>\n</tr>\n<tr>\n  <td>大陆架</td>\n  <td>对海床及底土自然资源具有相关主权权利</td>\n  <td>不当然改变上覆水域和上空的法律地位</td>\n</tr>\n</tbody>\n</table>\n<p>比较依据：<a href=\"https://www.un.org/depts/los/convention_agreements/texts/unclos/part2.htm\">公约第二部分</a>、<a href=\"https://www.un.org/depts/los/convention_agreements/texts/unclos/part5.htm\">第五部分</a>、<a href=\"https://www.un.org/depts/los/convention_agreements/texts/unclos/part6.htm\">第六部分</a>。具体海域范围、划界和争议仍须单独研究，不能用此表替代对具体主张的合法性判断。</p>\n<p><strong>任务与权限〔笔记分析〕。</strong> 本条不能单独回答哪个机关可以对哪种船舶、人员或航空器采取何种措施。应继续查明空间管辖、机关职权、措施条件与程序；“必要”也不是脱离法律的自由裁量许可证。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>两书对读</strong>：甲书对海域法律性质与具体制度解释更细；乙书着重设施、装备和管理能力，适合补充治理场景。</li>\n<li><strong>旧机构和旧条号</strong>：甲书关于边防力量、部门分工及旧《国防法》条号的叙述具有出版时点，不能直接当作今天的机构清单。</li>\n<li><strong>关联条文</strong>：第8条国土与国民安全统筹、第18条军事安全、第33条海外利益保护。</li>\n<li><strong>研究问题</strong>：怎样在陆、海、空不同空间中，同时准确识别保护利益、权利性质与措施权限？</li>\n</ul>"},{"num":18,"label":"第十八条","title":"军事安全任务","lawText":"国家加强武装力量革命化、现代化、正规化建设，建设与保卫国家安全和发展利益需要相适应的武装力量；实施积极防御军事战略方针，防备和抵御侵略，制止武装颠覆和分裂；开展国际军事安全合作，实施联合国维和、国际救援、海上护航和维护国家海外利益的军事行动，维护国家主权、安全、领土完整、发展利益和世界和平。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第十八条</div><p class=\"article-law-text\">国家加强武装力量革命化、现代化、正规化建设，建设与保卫国家安全和发展利益需要相适应的武装力量；实施积极防御军事战略方针，防备和抵御侵略，制止武装颠覆和分裂；开展国际军事安全合作，实施联合国维和、国际救援、海上护航和维护国家海外利益的军事行动，维护国家主权、安全、领土完整、发展利益和世界和平。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第十八条</div><p class=\"article-law-text\">国家加强武装力量革命化、现代化、正规化建设，建设与保卫国家安全和发展利益需要相适应的武装力量；实施积极防御军事战略方针，防备和抵御侵略，制止武装颠覆和分裂；开展国际军事安全合作，实施联合国维和、国际救援、海上护航和维护国家海外利益的军事行动，维护国家主权、安全、领土完整、发展利益和世界和平。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>条文用分号划分三个主要层次：武装力量建设、积极防御任务、国际军事合作与行动。</p>\n<h3>二、立法沿革</h3>\n<p><strong>宪法和国防制度的延续。</strong> 甲书将本条与宪法关于武装力量任务和建设的规定、国防法律制度相联系，说明本条是在综合国家安全框架中重申并展开军事安全任务。</p>\n<p><strong>最终审议时细化海外行动。</strong> 2015年6月30日修改意见报告记载，草案三次审议稿原称“实施维护国家安全的海外军事行动”；经审议建议，修改为列举联合国维和、国际救援、海上护航及维护国家海外利益的军事行动。见甲书附录五第388页（PDF401页）。</p>\n<p>这一变化使相关行动类型更明确。它并不意味着所有海外利益受损都能直接触发军事行动，具体决策和行动仍有相应条件。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>革命化、现代化、正规化建设。</strong> 两书分别从政治属性与领导、军事能力和技术发展、组织纪律与依法运行等方面解释。三者不能缩减为单纯增加装备。</li>\n<li><strong>能力与需要相适应。</strong> 条文同时提到国家安全和发展利益，体现任务范围与保障能力之间的匹配要求。</li>\n<li><strong>积极防御。</strong> 其任务表述是防备抵御侵略、制止武装颠覆和分裂。甲书强调战略防御与战役战斗层面主动性的关系，不能简单等同于消极等待。</li>\n<li><strong>国际军事安全合作。</strong> 包括条文明确列出的维和、救援、护航和维护海外利益行动；最终目标同时涵盖国家主权、安全、发展利益与世界和平。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>两书差异需要校核。</strong> 乙书第48页（PDF57页）解释积极防御时使用“先发制人的能力”。甲书第84页以及2015年《中国的军事战略》白皮书则明确强调防御、自卫、后发制人的原则。笔记应以法律文本和正式政策文件为准，并区分战略原则与行动层面的主动性，不能直接用“先发制人”概括本条。<a href=\"https://eu.china-mission.gov.cn/documents/201505/t20150526_8313991.htm\">2015年白皮书第三部分</a>。</p>\n<p><strong>国内任务依据与国际法合法性〔笔记分析〕。</strong> 国内法列明行动任务，不自动解决在他国境内或有关海域行动的国际法依据。具体情形仍需分别考察适用的国际法、有关同意或授权、行动范围等条件。《联合国宪章》关于禁止非法使用武力、集体安全和自卫的规定，不能由本条排除。<a href=\"https://www.un.org/zh/about-us/un-charter/full-text\">《联合国宪章》全文</a>。</p>\n<p><strong>维和与战争、救援不能混同。</strong> 条文将不同任务并列，不代表它们共享完全相同的目的、权限或行动规则。分析时应按任务分别确认。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书事例</strong>：其维和待命部队、人员培训等数据来自特定年份的材料，可以说明能力建设和国际合作，不应当作2026年的实时统计。</li>\n<li><strong>证据边界</strong>：维和参与数量可以支持参与程度的描述，不能单凭该数量证明已经在某个具体事件中防止侵略或制止分裂。</li>\n<li><strong>关联条文</strong>：第3条军事安全保障、第10条国际合作、第17条国土安全、第33条海外权益、第38条中央军委有关职责。</li>\n<li><strong>研究问题</strong>：在海外利益保护中，外交、领事保护、民事救援与军事行动如何衔接，并分别满足其法律条件？</li>\n</ul></div></div>","notesHtml":"<p>条文用分号划分三个主要层次：武装力量建设、积极防御任务、国际军事合作与行动。</p>\n<h3>二、立法沿革</h3>\n<p><strong>宪法和国防制度的延续。</strong> 甲书将本条与宪法关于武装力量任务和建设的规定、国防法律制度相联系，说明本条是在综合国家安全框架中重申并展开军事安全任务。</p>\n<p><strong>最终审议时细化海外行动。</strong> 2015年6月30日修改意见报告记载，草案三次审议稿原称“实施维护国家安全的海外军事行动”；经审议建议，修改为列举联合国维和、国际救援、海上护航及维护国家海外利益的军事行动。见甲书附录五第388页（PDF401页）。</p>\n<p>这一变化使相关行动类型更明确。它并不意味着所有海外利益受损都能直接触发军事行动，具体决策和行动仍有相应条件。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>革命化、现代化、正规化建设。</strong> 两书分别从政治属性与领导、军事能力和技术发展、组织纪律与依法运行等方面解释。三者不能缩减为单纯增加装备。</li>\n<li><strong>能力与需要相适应。</strong> 条文同时提到国家安全和发展利益，体现任务范围与保障能力之间的匹配要求。</li>\n<li><strong>积极防御。</strong> 其任务表述是防备抵御侵略、制止武装颠覆和分裂。甲书强调战略防御与战役战斗层面主动性的关系，不能简单等同于消极等待。</li>\n<li><strong>国际军事安全合作。</strong> 包括条文明确列出的维和、救援、护航和维护海外利益行动；最终目标同时涵盖国家主权、安全、发展利益与世界和平。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>两书差异需要校核。</strong> 乙书第48页（PDF57页）解释积极防御时使用“先发制人的能力”。甲书第84页以及2015年《中国的军事战略》白皮书则明确强调防御、自卫、后发制人的原则。笔记应以法律文本和正式政策文件为准，并区分战略原则与行动层面的主动性，不能直接用“先发制人”概括本条。<a href=\"https://eu.china-mission.gov.cn/documents/201505/t20150526_8313991.htm\">2015年白皮书第三部分</a>。</p>\n<p><strong>国内任务依据与国际法合法性〔笔记分析〕。</strong> 国内法列明行动任务，不自动解决在他国境内或有关海域行动的国际法依据。具体情形仍需分别考察适用的国际法、有关同意或授权、行动范围等条件。《联合国宪章》关于禁止非法使用武力、集体安全和自卫的规定，不能由本条排除。<a href=\"https://www.un.org/zh/about-us/un-charter/full-text\">《联合国宪章》全文</a>。</p>\n<p><strong>维和与战争、救援不能混同。</strong> 条文将不同任务并列，不代表它们共享完全相同的目的、权限或行动规则。分析时应按任务分别确认。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书事例</strong>：其维和待命部队、人员培训等数据来自特定年份的材料，可以说明能力建设和国际合作，不应当作2026年的实时统计。</li>\n<li><strong>证据边界</strong>：维和参与数量可以支持参与程度的描述，不能单凭该数量证明已经在某个具体事件中防止侵略或制止分裂。</li>\n<li><strong>关联条文</strong>：第3条军事安全保障、第10条国际合作、第17条国土安全、第33条海外权益、第38条中央军委有关职责。</li>\n<li><strong>研究问题</strong>：在海外利益保护中，外交、领事保护、民事救援与军事行动如何衔接，并分别满足其法律条件？</li>\n</ul>"},{"num":19,"label":"第十九条","title":"经济安全任务","lawText":"国家维护国家基本经济制度和社会主义市场经济秩序，健全预防和化解经济安全风险的制度机制，保障关系国民经济命脉的重要行业和关键领域、重点产业、重大基础设施和重大建设项目以及其他重大经济利益安全。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第十九条</div><p class=\"article-law-text\">国家维护国家基本经济制度和社会主义市场经济秩序，健全预防和化解经济安全风险的制度机制，保障关系国民经济命脉的重要行业和关键领域、重点产业、重大基础设施和重大建设项目以及其他重大经济利益安全。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第十九条</div><p class=\"article-law-text\">国家维护国家基本经济制度和社会主义市场经济秩序，健全预防和化解经济安全风险的制度机制，保障关系国民经济命脉的重要行业和关键领域、重点产业、重大基础设施和重大建设项目以及其他重大经济利益安全。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>本条包括经济制度与市场秩序、风险治理机制、重点经济利益保护三方面任务。</p>\n<h3>二、立法沿革</h3>\n<p><strong>既有经济法律制度的综合。</strong> 甲书联系宪法有关基本经济制度、国有和非公有制经济、社会主义市场经济的规定，以及金融、贸易、产业等专门制度，说明经济安全已有多种法律支撑，本法则作综合安排。</p>\n<p><strong>二审扩大和明确重点对象。</strong> 2015年4月20日修改情况汇报，建议在经济安全规定中增加关系国民经济命脉的重要行业和关键领域、重大基础设施的安全保障。见甲书附录三第380页（PDF393页）；同期官方报道亦有记载。<a href=\"https://www.cac.gov.cn/2015-04/21/c_1115041073.htm\">国家网信办转载的二审信息</a>。</p>\n<p><strong>与后续条文形成分工。</strong> 金融、资源能源和粮食安全分别在第20—22条规定。因此，第19条应作为经济安全的综合任务来把握，不宜忽略其制度和市场秩序面向，只摘取行业保护。</p>\n<h3>三、主要内容</h3>\n<p><strong>维护基本经济制度。</strong> 按两书论述，既涉及公有制和国有经济的地位，也涉及多种所有制共同发展。不能把国家经济安全只理解成某一种所有制企业的商业安全。</p>\n<p><strong>维护市场经济秩序。</strong> 稳定、可预期的交易规则、公平竞争和依法保护经济活动，是经济持续运行的条件。甲书联系经济立法、宏观调控和违法行为治理说明这一点。</p>\n<p><strong>健全风险机制。</strong> 风险识别、预警、评估、应对和化解需要制度化安排，既包括外部冲击，也包括内部结构、治理和运行问题。</p>\n<p><strong>保护重点经济利益。</strong> 重要行业和关键领域、重点产业、重大基础设施与建设项目，关系系统运行或国家重大利益。甲书说明关键行业、产业与基础设施，乙书进一步涉及技术、网络和供应链联系。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>企业风险与国家风险〔笔记分析〕。</strong> 企业可以是重要利益的承载者，但一家企业发生损失，并不当然等于国家经济安全受损。应论证其与关键功能、基础供给、重大技术或系统性影响的关系，区分普通市场竞争和国家安全风险。</p>\n<p><strong>安全与市场开放的协调。</strong> 本条保护市场经济秩序，并须与第8条协调发展和安全的要求联读。必要的风险治理不应被直接等同于排除全部外部联系；具体外资审查、贸易措施等须有相应法律依据和适用条件。</p>\n<p><strong>比较研究方向。</strong> 甲书介绍外国投资安全审查对关键基础设施、关键技术和资源供给的关注。可据此比较各制度如何界定关键利益、触发审查、分配举证责任及设置救济；其2016年前的外国法介绍不能代替现行制度核查。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>表述更新</strong>：甲书第88页、乙书第51页仍使用市场配置资源的“基础性作用”表述。2013年党的十八届三中全会《决定》已提出市场在资源配置中起决定性作用和更好发挥政府作用。研究制度背景时应区分旧提法与这一正式表述；两者都不是第19条逐字内容。<a href=\"https://www.moe.gov.cn/jyb_xxgk/moe_1777/moe_1778/201311/t20131115_159502.html\">《决定》官方文本</a>。</li>\n<li><strong>乙书案例</strong>：孟晚舟事件可作为讨论企业、人员、技术产业和国家利益联系的材料；其复杂的外国司法与外交过程，不宜仅凭作者概述认定为第19条的直接适用案例。</li>\n<li><strong>关联条文</strong>：第2、3、8、20—22、24、25、33条，以及第59条有关国家安全审查和监管制度。</li>\n<li><strong>研究问题</strong>：认定某个企业、项目或行业具有国家经济安全重要性，需要哪些可核验的事实和标准？</li>\n</ul></div></div>","notesHtml":"<p>本条包括经济制度与市场秩序、风险治理机制、重点经济利益保护三方面任务。</p>\n<h3>二、立法沿革</h3>\n<p><strong>既有经济法律制度的综合。</strong> 甲书联系宪法有关基本经济制度、国有和非公有制经济、社会主义市场经济的规定，以及金融、贸易、产业等专门制度，说明经济安全已有多种法律支撑，本法则作综合安排。</p>\n<p><strong>二审扩大和明确重点对象。</strong> 2015年4月20日修改情况汇报，建议在经济安全规定中增加关系国民经济命脉的重要行业和关键领域、重大基础设施的安全保障。见甲书附录三第380页（PDF393页）；同期官方报道亦有记载。<a href=\"https://www.cac.gov.cn/2015-04/21/c_1115041073.htm\">国家网信办转载的二审信息</a>。</p>\n<p><strong>与后续条文形成分工。</strong> 金融、资源能源和粮食安全分别在第20—22条规定。因此，第19条应作为经济安全的综合任务来把握，不宜忽略其制度和市场秩序面向，只摘取行业保护。</p>\n<h3>三、主要内容</h3>\n<p><strong>维护基本经济制度。</strong> 按两书论述，既涉及公有制和国有经济的地位，也涉及多种所有制共同发展。不能把国家经济安全只理解成某一种所有制企业的商业安全。</p>\n<p><strong>维护市场经济秩序。</strong> 稳定、可预期的交易规则、公平竞争和依法保护经济活动，是经济持续运行的条件。甲书联系经济立法、宏观调控和违法行为治理说明这一点。</p>\n<p><strong>健全风险机制。</strong> 风险识别、预警、评估、应对和化解需要制度化安排，既包括外部冲击，也包括内部结构、治理和运行问题。</p>\n<p><strong>保护重点经济利益。</strong> 重要行业和关键领域、重点产业、重大基础设施与建设项目，关系系统运行或国家重大利益。甲书说明关键行业、产业与基础设施，乙书进一步涉及技术、网络和供应链联系。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>企业风险与国家风险〔笔记分析〕。</strong> 企业可以是重要利益的承载者，但一家企业发生损失，并不当然等于国家经济安全受损。应论证其与关键功能、基础供给、重大技术或系统性影响的关系，区分普通市场竞争和国家安全风险。</p>\n<p><strong>安全与市场开放的协调。</strong> 本条保护市场经济秩序，并须与第8条协调发展和安全的要求联读。必要的风险治理不应被直接等同于排除全部外部联系；具体外资审查、贸易措施等须有相应法律依据和适用条件。</p>\n<p><strong>比较研究方向。</strong> 甲书介绍外国投资安全审查对关键基础设施、关键技术和资源供给的关注。可据此比较各制度如何界定关键利益、触发审查、分配举证责任及设置救济；其2016年前的外国法介绍不能代替现行制度核查。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>表述更新</strong>：甲书第88页、乙书第51页仍使用市场配置资源的“基础性作用”表述。2013年党的十八届三中全会《决定》已提出市场在资源配置中起决定性作用和更好发挥政府作用。研究制度背景时应区分旧提法与这一正式表述；两者都不是第19条逐字内容。<a href=\"https://www.moe.gov.cn/jyb_xxgk/moe_1777/moe_1778/201311/t20131115_159502.html\">《决定》官方文本</a>。</li>\n<li><strong>乙书案例</strong>：孟晚舟事件可作为讨论企业、人员、技术产业和国家利益联系的材料；其复杂的外国司法与外交过程，不宜仅凭作者概述认定为第19条的直接适用案例。</li>\n<li><strong>关联条文</strong>：第2、3、8、20—22、24、25、33条，以及第59条有关国家安全审查和监管制度。</li>\n<li><strong>研究问题</strong>：认定某个企业、项目或行业具有国家经济安全重要性，需要哪些可核验的事实和标准？</li>\n</ul>"},{"num":20,"label":"第二十条","title":"金融安全任务","lawText":"国家健全金融宏观审慎管理和金融风险防范、处置机制，加强金融基础设施和基础能力建设，防范和化解系统性、区域性金融风险，防范和抵御外部金融风险的冲击。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第二十条</div><p class=\"article-law-text\">国家健全金融宏观审慎管理和金融风险防范、处置机制，加强金融基础设施和基础能力建设，防范和化解系统性、区域性金融风险，防范和抵御外部金融风险的冲击。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第二十条</div><p class=\"article-law-text\">国家健全金融宏观审慎管理和金融风险防范、处置机制，加强金融基础设施和基础能力建设，防范和化解系统性、区域性金融风险，防范和抵御外部金融风险的冲击。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>本条把金融安全从一般经济安全中单列，重点关注金融体系的整体稳定和风险传导。</p>\n<h3>二、立法沿革</h3>\n<p><strong>二审新增整条。</strong> 2015年4月20日修改情况汇报明确建议增加金融安全一条，涉及宏观审慎管理、风险防范处置、金融基础设施及系统性和区域性风险。见甲书附录三第380页（PDF393页）。</p>\n<p><strong>最终文本与二审建议有差异。</strong> 二审材料使用“防范发生系统性、区域性金融风险”“国际金融风险”；定稿为“防范和化解”“外部金融风险”。可以确认文本差异，但现有附录未说明这两处分别在何时改变，不能据此编造修改过程。</p>\n<p><strong>制度背景。</strong> 甲书将本条置于金融危机经验和宏观审慎框架发展的背景下，尤其指出只关注单个金融机构的健康，未必能够防止整个体系的风险。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>宏观审慎管理。</strong> 从金融体系整体识别跨机构、跨市场、跨周期的风险，关注相互关联及共同暴露，弥补只看单个机构的不足。</li>\n<li><strong>风险防范和处置。</strong> 既需要事前监测、预警、治理和准备，也需要风险出现后的处置权限、资源和程序安排。风险已经发生时，仍有“化解”的任务。</li>\n<li><strong>基础设施和基础能力。</strong> 甲书联系支付、清算、结算、征信、信息系统、灾备和制度环境等因素，说明金融安全不仅是资本是否充足，也涉及关键功能能否持续。</li>\n<li><strong>系统性与区域性风险。</strong> 关注风险能否扩散、是否影响多个机构、市场和实体经济，以及是否在特定区域集中暴露。区域性风险与系统性风险可能相互转化。</li>\n<li><strong>外部风险冲击。</strong> 外部金融变化可通过资本流动、市场价格、信用联系等渠道影响国内。维护安全不等于否认一切正常市场波动，而是提高吸收和处置冲击的能力。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>宏观与微观审慎的区别。</strong> 甲书的核心提示是：每个机构分别采取看似稳妥的行动，可能因同时收缩、相互关联或市场反馈而放大整体风险。因此，机构层面合规与体系层面稳定都需要关注。</p>\n<p><strong>制度补充</strong>：人民银行2021年发布《宏观审慎政策指引（试行）》，就宏观审慎框架与系统性风险防范化解作出进一步安排，可作为本条后续实施的研究资料，不能写成2015年已经存在的配套文件。<a href=\"https://www.pbc.gov.cn/zhengcehuobisi/125207/125227/125963/dd1c12d33cab49bd8895c7a5d100aa4f/index.html\">人民银行《2021年中国货币政策大事记》12月31日事项</a>。</p>\n<p><strong>稳定体系不等于保证所有主体无损失〔笔记分析〕。</strong> 本条没有承诺所有金融机构、股东、债权人或投资者都不会遭受损失，也没有设立一般性的国家兜底义务。研究风险处置应分别分析关键功能保护、各类权益顺位、责任承担及有关保障制度。</p>\n<p><strong>防风险与促发展的关系。</strong> 结合第8、19条，应评价监管能否降低整体脆弱性、维持合理金融服务，避免将“完全消灭风险”当作唯一标准。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书实例</strong>：包商银行风险处置用于说明股权结构、关联交易、内部治理和外部监督可能共同影响金融风险。它能支持治理与处置机制的讨论，但不能只凭本条判断具体接管权限或不同债权人的受偿安排。</li>\n<li><strong>旧材料更新</strong>：甲书列举的金融监管机构名称和部门分工属于2016年背景，具体引用时应查现行规定；本笔记不把旧架构照录为当前情况。</li>\n<li><strong>术语辨析</strong>：乙书将“黑天鹅”和“灰犀牛”并称为不可预测事件的表述不够严谨。研读本条可直接使用风险概率、影响程度、可识别性等维度，避免比喻掩盖具体风险判断。</li>\n<li><strong>研究问题</strong>：在允许正常市场出清的同时，如何确保支付结算、信用供给等关键功能不中断，并限制风险向社会和实体经济扩散？</li>\n</ul></div></div>","notesHtml":"<p>本条把金融安全从一般经济安全中单列，重点关注金融体系的整体稳定和风险传导。</p>\n<h3>二、立法沿革</h3>\n<p><strong>二审新增整条。</strong> 2015年4月20日修改情况汇报明确建议增加金融安全一条，涉及宏观审慎管理、风险防范处置、金融基础设施及系统性和区域性风险。见甲书附录三第380页（PDF393页）。</p>\n<p><strong>最终文本与二审建议有差异。</strong> 二审材料使用“防范发生系统性、区域性金融风险”“国际金融风险”；定稿为“防范和化解”“外部金融风险”。可以确认文本差异，但现有附录未说明这两处分别在何时改变，不能据此编造修改过程。</p>\n<p><strong>制度背景。</strong> 甲书将本条置于金融危机经验和宏观审慎框架发展的背景下，尤其指出只关注单个金融机构的健康，未必能够防止整个体系的风险。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>宏观审慎管理。</strong> 从金融体系整体识别跨机构、跨市场、跨周期的风险，关注相互关联及共同暴露，弥补只看单个机构的不足。</li>\n<li><strong>风险防范和处置。</strong> 既需要事前监测、预警、治理和准备，也需要风险出现后的处置权限、资源和程序安排。风险已经发生时，仍有“化解”的任务。</li>\n<li><strong>基础设施和基础能力。</strong> 甲书联系支付、清算、结算、征信、信息系统、灾备和制度环境等因素，说明金融安全不仅是资本是否充足，也涉及关键功能能否持续。</li>\n<li><strong>系统性与区域性风险。</strong> 关注风险能否扩散、是否影响多个机构、市场和实体经济，以及是否在特定区域集中暴露。区域性风险与系统性风险可能相互转化。</li>\n<li><strong>外部风险冲击。</strong> 外部金融变化可通过资本流动、市场价格、信用联系等渠道影响国内。维护安全不等于否认一切正常市场波动，而是提高吸收和处置冲击的能力。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>宏观与微观审慎的区别。</strong> 甲书的核心提示是：每个机构分别采取看似稳妥的行动，可能因同时收缩、相互关联或市场反馈而放大整体风险。因此，机构层面合规与体系层面稳定都需要关注。</p>\n<p><strong>制度补充</strong>：人民银行2021年发布《宏观审慎政策指引（试行）》，就宏观审慎框架与系统性风险防范化解作出进一步安排，可作为本条后续实施的研究资料，不能写成2015年已经存在的配套文件。<a href=\"https://www.pbc.gov.cn/zhengcehuobisi/125207/125227/125963/dd1c12d33cab49bd8895c7a5d100aa4f/index.html\">人民银行《2021年中国货币政策大事记》12月31日事项</a>。</p>\n<p><strong>稳定体系不等于保证所有主体无损失〔笔记分析〕。</strong> 本条没有承诺所有金融机构、股东、债权人或投资者都不会遭受损失，也没有设立一般性的国家兜底义务。研究风险处置应分别分析关键功能保护、各类权益顺位、责任承担及有关保障制度。</p>\n<p><strong>防风险与促发展的关系。</strong> 结合第8、19条，应评价监管能否降低整体脆弱性、维持合理金融服务，避免将“完全消灭风险”当作唯一标准。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书实例</strong>：包商银行风险处置用于说明股权结构、关联交易、内部治理和外部监督可能共同影响金融风险。它能支持治理与处置机制的讨论，但不能只凭本条判断具体接管权限或不同债权人的受偿安排。</li>\n<li><strong>旧材料更新</strong>：甲书列举的金融监管机构名称和部门分工属于2016年背景，具体引用时应查现行规定；本笔记不把旧架构照录为当前情况。</li>\n<li><strong>术语辨析</strong>：乙书将“黑天鹅”和“灰犀牛”并称为不可预测事件的表述不够严谨。研读本条可直接使用风险概率、影响程度、可识别性等维度，避免比喻掩盖具体风险判断。</li>\n<li><strong>研究问题</strong>：在允许正常市场出清的同时，如何确保支付结算、信用供给等关键功能不中断，并限制风险向社会和实体经济扩散？</li>\n</ul>"}];

const theories={elements:{title:'五大要素',subtitle:'把握总体国家安全观的基本构成',items:[['人民安全为宗旨','从人民的根本利益出发理解国家安全工作。'],['政治安全为根本','把政治安全放在国家安全工作的根本位置。'],['经济安全为基础','关注经济发展与国家安全的相互支撑。'],['军事、科技、文化、社会安全为保障','从不同领域理解国家安全的保障条件。'],['促进国际安全为依托','联系国际安全环境理解本国安全。']],note:'版本提示：《国家安全法》第3条原文的“保障”表述为“军事、文化、社会安全”。本页五大要素采用总体国家安全观学习材料中的表述，二者应区分记忆。'},coordination:{title:'五个统筹',subtitle:'在相互联系中理解和维护安全',items:[['统筹外部安全和内部安全','联系国际环境与国内条件分析风险。'],['统筹国土安全和国民安全','同时关注国家疆域与人民的安全。'],['统筹传统安全和非传统安全','把传统领域与新兴风险放在整体框架中考察。'],['统筹自身安全和共同安全','在维护自身安全时关注各国安全的关联。'],['统筹维护和塑造国家安全','结合风险应对与安全环境建设理解国家安全工作。']]},principles:{title:'十个坚持',subtitle:'总体国家安全观的核心要义',items:[['坚持党对国家安全工作的绝对领导','把握国家安全工作的领导原则。'],['坚持中国特色国家安全道路','结合中国的制度和实际理解安全道路。'],['坚持以人民安全为宗旨','关注国家安全工作的人民立场。'],['坚持统筹发展和安全','联系发展条件和安全保障分析制度。'],['坚持把政治安全放在首要位置','理解各领域安全中的重点要求。'],['坚持统筹推进各领域安全','关注不同领域风险的相互传导。'],['坚持把防范化解国家安全风险摆在突出位置','从预防、识别和处置理解风险治理。'],['坚持推进国际共同安全','关注国际合作与共同安全。'],['坚持推进国家安全体系和能力现代化','同时关注制度建设和履职能力。'],['坚持加强国家安全干部队伍建设','关注履职人员的政治素养与专业能力。']]}};
const fields=[
['政治安全','政权、制度与政治秩序','国家安全法第15条','如何理解政治安全在国家安全中的根本地位？'],
['军事安全','国防建设与军事防卫','国家安全法第18条','军事安全保障与国家机关职责如何衔接？'],

['人工智能安全','技术应用与安全治理','总体国家安全观重点领域学习材料','如何识别人工智能应用引发的跨领域安全风险？'],

const app=document.querySelector('#app');
let tab='overview',cardIndex=0,flipped=false,activeLaw='intro';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=(n,t,m='')=>`<div class="section-title"><span class="num">${n}</span><h2>${t}</h2><span class="meta">${m}</span></div>`;
const lawCards=()=>`<div class="cards">${Object.entries(laws).map(([id,l],i)=>`<a class="law-card" href="#/law/${id}"><div class="card-art"><strong>0${i+1}</strong><span>${['INTRODUCTION','FOUNDATIONS','SPECIAL TOPIC'][i]}</span></div><div class="card-body"><h3>${l.title}</h3><p>${l.desc}</p><div class="card-bottom"><span>概说 · 导图 · ${l.cards.length} 张知识卡片</span><span aria-hidden="true">↗</span></div></div></a>`).join('')}</div>`;
const theoryCards=()=>`<div class="theory-grid">${Object.entries(theories).map(([id,t],i)=>`<a href="#/theory/${id}" class="theory-card"><small>0${i+1} / 理论框架</small><h3>${t.title} ↗</h3><p>${t.subtitle}</p></a>`).join('')}</div>`;
const fieldGrid=()=>`<div class="fields-head" id="fields"><h3>国家安全的重点领域</h3><small>依官方学习材料列示 · 20 个领域</small></div><div class="fields">${fields.map((f,i)=>`<a class="field-link" href="#/field/${i}"><span>${String(i+1).padStart(2,'0')}</span>${f[0]}<b aria-hidden="true">↗</b></a>`).join('')}</div>`;
const head=(t,sub,parent='/')=>`<div class="page-head"><a class="back" href="#${parent}">← 返回${parent==='/'?'首页':parent==='/laws'?'法律集合':'总体国家安全观'}</a><h1>${t}</h1><p>${sub}</p></div>`;
const sourceBlock=l=>`<div class="source"><a href="${sources[l.ref]}" target="_blank" rel="noopener">查阅官方法律原文 ↗</a><p>${l.reading}</p></div>`;
function home(){app.innerHTML=`<section class="cover"><div class="eyebrow">NATIONAL SECURITY LAW</div><h1>国家安全法学</h1><p>以法律文本为起点，建立清晰的知识体系。</p><div class="cover-tag">概念 · 制度 · 规范 · 实践</div></section><div class="content"><div class="intro-line">先读概说，再看导图，用知识卡片完成一次主动回忆。</div>${title('01','法律集合','3 个学习专题')}${lawCards()}${title('02','总体国家安全观','理论框架与重点领域')}${theoryCards()}${fieldGrid()}</div>`}
function lawPage(id){const l=laws[id];app.innerHTML=head(l.title,l.label+' ｜ '+l.desc,'/laws')+`<div class="tabs" role="tablist" aria-label="学习方式">${[['overview','概说'],['map','思维导图'],['cards','Anki 知识点']].map(([k,v])=>`<button class="tab ${tab===k?'active':''}" role="tab" aria-selected="${tab===k}" aria-controls="panel" id="tab-${k}" data-tab="${k}">${v}</button>`).join('')}</div><div class="content" id="panel" role="tabpanel" aria-labelledby="tab-${tab}"></div>`;renderPanel();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;lawPage(id);document.querySelector(`#tab-${tab}`).focus()})}
function renderPanel(){const l=laws[activeLaw],panel=document.querySelector('#panel');if(tab==='overview')panel.innerHTML=`<article class="reading">${l.overview.map(([h,p])=>`<h3>${h}</h3><p>${p}</p>`).join('')}${sourceBlock(l)}</article>`;else if(tab==='map'){const articleIndex=activeLaw==='national'?`<div class="article-map-head"><h3>第1—20条 · 逐条研读索引</h3><small>点击条文进入对应 Anki 卡片</small></div><div class="article-map-grid">${nationalArticles.map((a,i)=>`<button class="article-node" data-article-card="${i}"><b>${esc(a.label)}</b><span>${esc(a.title)}</span></button>`).join('')}</div>`:'';panel.innerHTML=`<h2 style="font-size:20px;margin:0">${l.title} · 知识结构</h2><p class="study-tip">按制度层次梳理，回到条文理解各分支的联系。</p><div class="tree"><div class="tree-root">${l.title}</div><div class="branches">${l.map.map(([h,p])=>`<div class="branch"><h3>${h}</h3><p>${p}</p></div>`).join('')}</div></div>${articleIndex}${sourceBlock(l)}`;if(activeLaw==='national')document.querySelectorAll('[data-article-card]').forEach(b=>b.onclick=()=>{cardIndex=+b.dataset.articleCard;flipped=false;tab='cards';lawPage('national');setTimeout(()=>document.querySelector('#flip')?.focus(),0)})}else renderCard()}
function renderCard(){const l=laws[activeLaw],c=l.cards[cardIndex];if(activeLaw==='national'){document.querySelector('#panel').innerHTML=`<div class="reading"><div class="study-top"><span>逐条 Anki / <b>${String(cardIndex+1).padStart(2,'0')}</b> · ${l.cards.length} 张</span><button class="btn" id="export">↓ 导出 Anki 卡片</button></div><div class="article-card-index" aria-label="条文索引">${nationalArticles.map((a,i)=>`<button data-jump-card="${i}" class="${i===cardIndex?'active':''}" aria-label="跳到${esc(a.label)}">${i+1}</button>`).join('')}</div><div class="article-flashcard" id="flip" tabindex="0" role="button" aria-label="${flipped?'返回正面':'显示背面'}">${flipped?c.backHtml:c.frontHtml}</div><div class="study-controls"><button class="btn" id="prev" ${cardIndex===0?'disabled':''}>← 上一条</button><span class="study-tip" aria-live="polite">${esc(c.label)} · ${cardIndex+1} / ${l.cards.length}</span><button class="btn dark" id="next">${cardIndex===l.cards.length-1?'回到第一条 ↻':'下一条 →'}</button></div><p class="study-tip">正面仅显示条号与条文正文；背面显示同一条文正文及 Markdown 中对应研读笔记。点击卡片翻面。</p>${sourceBlock(l)}</div>`;const flip=()=>{flipped=!flipped;renderCard();document.querySelector('#flip')?.focus()};const fc=document.querySelector('#flip');fc.onclick=e=>{if(e.target.closest('a'))return;flip()};fc.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('a')){e.preventDefault();flip()}};document.querySelectorAll('[data-jump-card]').forEach(b=>b.onclick=e=>{e.stopPropagation();cardIndex=+b.dataset.jumpCard;flipped=false;renderCard()});document.querySelector('#prev').onclick=()=>{cardIndex=Math.max(0,cardIndex-1);flipped=false;renderCard()};document.querySelector('#next').onclick=()=>{cardIndex=(cardIndex+1)%l.cards.length;flipped=false;renderCard()};document.querySelector('#export').onclick=()=>{const clean=s=>s.replace(/[\t\r\n]+/g,' ').replace(/\s{2,}/g,' ').trim();const tsv='#separator:Tab\n#html:true\n'+nationalArticles.map(a=>[clean(a.frontHtml),clean(a.backHtml)].join('\t')).join('\n');const url=URL.createObjectURL(new Blob([tsv],{type:'text/tab-separated-values;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='国家安全法-第1-20条-逐条Anki.tsv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};return}document.querySelector('#panel').innerHTML=`<div class="reading"><div class="study-top"><span>主动回忆 / <b>${String(cardIndex+1).padStart(2,'0')}</b> · ${l.cards.length} 张</span><button class="btn" id="export">↓ 导出 Anki 卡片</button></div><button class="flashcard" id="flip" aria-label="${flipped?'显示问题':'显示答案'}"><small>${flipped?'ANSWER / 答案':'QUESTION / 问题'}</small><div class="question ${flipped?'answer':''}">${esc(c[flipped?1:0])}</div>${flipped?`<span class="badge">${esc(c[2])}</span>`:''}<span class="hint">${flipped?'点击卡片返回问题':'先尝试作答，再点击查看答案'}</span></button><div class="study-controls"><button class="btn" id="prev" ${cardIndex===0?'disabled':''}>← 上一张</button><span class="study-tip" aria-live="polite">${cardIndex+1} / ${l.cards.length}</span><button class="btn dark" id="next">${cardIndex===l.cards.length-1?'再学一轮 ↻':'下一张 →'}</button></div><p class="study-tip">导出的 TSV 文件可导入 Anki：选择“基础”笔记类型，第1列为正面，第2列为背面。此处为翻卡复习，不含间隔重复排程。</p><div class="details-list"><details><summary>查看全部 ${l.cards.length} 个知识点</summary>${l.cards.map(c=>`<h3>${esc(c[0])}</h3><p>${esc(c[1])} <span class="badge">${esc(c[2])}</span></p>`).join('')}</details></div>${sourceBlock(l)}</div>`;document.querySelector('#flip').onclick=()=>{flipped=!flipped;renderCard();document.querySelector('#flip').focus()};document.querySelector('#prev').onclick=()=>{cardIndex=Math.max(0,cardIndex-1);flipped=false;renderCard()};document.querySelector('#next').onclick=()=>{cardIndex=(cardIndex+1)%l.cards.length;flipped=false;renderCard()};document.querySelector('#export').onclick=()=>{const tsv='#separator:Tab\n#html:false\n'+l.cards.map(c=>[c[0],c[1]+'（'+c[2]+'）'].map(v=>v.replace(/[\t\r\n]/g,' ')).join('\t')).join('\n');const url=URL.createObjectURL(new Blob([tsv],{type:'text/tab-separated-values;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=l.title+'-Anki.tsv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function theoryPage(id){const t=theories[id];app.innerHTML=head(t.title,t.subtitle,'/outlook')+`<div class="content reading"><div class="details-list">${t.items.map(([h,p],i)=>`<div class="pillar"><span class="index">${String(i+1).padStart(2,'0')}</span><div><h3>${h}</h3><p>${p}</p></div></div>`).join('')}</div>${t.note?`<div class="note">${t.note}</div>`:''}<div class="source"><a href="${sources.outlook}" target="_blank" rel="noopener">来源：驻港国家安全公署 · 认识总体国家安全观 ↗</a><p>条目下的文字为学习提示。</p></div></div>`}
function fieldPage(id){const f=fields[id];app.innerHTML=head(f[0],f[1],'/outlook')+`<div class="content reading"><span class="badge">重点领域 ${String(+id+1).padStart(2,'0')} / 20</span><h2 style="margin-top:26px">学习切入点</h2><p>${f[1]}是本专题的学习切入点。可从保护对象、相关主体、风险防范和权利保障四个方面梳理制度。</p><div class="note">相关规范线索：${f[2]}。此处提供入门索引，具体适用须结合相关专门法律。</div><h3>带着问题阅读</h3><div class="field-question">${f[3]}</div><details class="note"><summary>展开学习思路</summary><p style="margin:14px 0 0">先查找相关条文的保护对象和制度目的，再辨认履职主体、措施条件及程序，最后说明它与其他领域安全的联系。尝试用一项具体制度回答上述问题。</p></details><div class="source"><a href="${sources.outlook}" target="_blank" rel="noopener">查看总体国家安全观官方学习材料 ↗</a><p><a href="${sources.national}" target="_blank" rel="noopener">对照《国家安全法》全文 ↗</a></p><p>本页为学习导引，问题与阅读思路为整理内容。</p></div><div class="study-controls">${+id>0?`<a class="btn" href="#/field/${+id-1}">← ${fields[+id-1][0]}</a>`:'<span></span>'}${+id<19?`<a class="btn" href="#/field/${+id+1}">${fields[+id+1][0]} →</a>`:'<a class="btn" href="#/outlook">返回总览</a>'}</div></div>`}
function route(){const path=location.hash.slice(1)||'/',parts=path.split('/');tab='overview';cardIndex=0;flipped=false;let label='首页';if(path==='/')home();else if(path==='/laws'){label='法律集合';app.innerHTML=head('法律集合','以概说把握全貌，以导图建立联系，以卡片巩固记忆。')+`<div class="content">${lawCards()}</div>`}else if(parts[1]==='law'&&laws[parts[2]]){activeLaw=parts[2];label='法律集合 / '+laws[activeLaw].title;lawPage(activeLaw)}else if(parts[1]==='outlook'){label='总体国家安全观';app.innerHTML=head('总体国家安全观','从基本构成、统筹方法与重点领域理解整体框架。')+`<div class="content">${theoryCards()}${fieldGrid()}<div class="source"><a href="${sources.outlook}" target="_blank" rel="noopener">官方学习材料 ↗</a><p>重点领域按所引官方学习材料列示，国家安全的内涵与外延持续发展。</p></div></div>`}else if(parts[1]==='theory'&&theories[parts[2]]){label='总体国家安全观 / '+theories[parts[2]].title;theoryPage(parts[2])}else if(parts[1]==='field'&&/^\d+$/.test(parts[2])&&fields[+parts[2]]){label='总体国家安全观 / '+fields[+parts[2]][0];fieldPage(parts[2])}else{app.innerHTML=head('页面未找到','请返回首页选择学习专题。')}document.querySelector('#breadcrumb').textContent='学习空间 / '+label;document.title=label==='首页'?'国家安全法学 · 学习空间':label.split(' / ').pop()+' · 国家安全法学';document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active',a.hash===`#${path}`||(a.hash==='#/laws'&&parts[1]==='law')||(a.hash==='#/outlook'&&['theory','field'].includes(parts[1]))));window.scrollTo(0,0);if(path==='/outlook/fields')document.querySelector('#fields').scrollIntoView()}
window.addEventListener('hashchange',route);route();

</script></body></html>
