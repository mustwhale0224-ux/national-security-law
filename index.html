n\u003cli>在其他国家领海；\u003c/li>\n\u003cli>根据联合国安理会有关授权执行特定反海盗任务；\u003c/li>\n\u003c/ul>\n\u003cp>可能分别涉及不同法律依据。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“海上护航”这一任务名称本身不能回答所有行动权限问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>分析时仍应采用第17条已经形成的方法：\u003c/p>\n\u003cp>\u003cstrong>先判断空间法律性质 → 再判断国际法权利 → 再判断国内机关权限和具体任务授权。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>7. “维护海外利益的军事行动”与一般海外利益保护应当区分\u003c/h4>\n\u003cp>第33条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>国家依法采取必要措施，保护海外中国公民、组织和机构的安全和正当权益，保护国家的海外利益不受威胁和侵害。\u003c/p>\n\u003c/blockquote>\n\u003cp>第18条则进一步规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>维护国家海外利益的军事行动。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，二者不能理解为：\u003c/p>\n\u003cblockquote>\n\u003cp>所有海外利益保护都属于军事行动。\u003c/p>\n\u003c/blockquote>\n\u003cp>海外利益保护可以包括：\u003c/p>\n\u003cul>\n\u003cli>外交交涉；\u003c/li>\n\u003cli>领事保护；\u003c/li>\n\u003cli>风险预警；\u003c/li>\n\u003cli>国际执法合作；\u003c/li>\n\u003cli>撤离协助；\u003c/li>\n\u003cli>民事救援；\u003c/li>\n\u003cli>在特定条件下的军事行动等。\u003c/li>\n\u003c/ul>\n\u003cp>军事手段只是整个海外利益保护工具体系中的一种特定方式。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第33条：海外利益保护的一般国家任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第18条：其中军事安全领域的特定行动类型\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第3条、第17条与第18条的关系\u003c/h4>\n\u003cp>第3条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>以军事安全为保障。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第17条规定国土安全：\u003c/p>\n\u003cblockquote>\n\u003cp>边防、海防、空防以及领土主权和海洋权益。\u003c/p>\n\u003c/blockquote>\n\u003cp>第18条规定军事安全：\u003c/p>\n\u003cblockquote>\n\u003cp>武装力量建设、积极防御和国际军事行动。\u003c/p>\n\u003c/blockquote>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>国土安全回答“保护什么空间和权益”\u003c/strong>\u003cbr>\u003cstrong>军事安全回答“如何建设和运用军事力量维护安全”\u003c/strong>\u003c/p>\n\u003cp>二者紧密联系，但不能混为一个概念。\u003c/p>\n\u003chr>\n\u003ch4>（二）第10条与第18条形成一般合作原则和军事领域合作任务的关系\u003c/h4>\n\u003cp>\u003cstrong>第10条：\u003c/strong>\u003c/p>\n\u003cp>互信、互利、平等、协作，开展国际安全交流合作。\u003c/p>\n\u003cp>\u003cstrong>第18条：\u003c/strong>\u003c/p>\n\u003cp>开展国际军事安全合作，并列举有关军事行动。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第10条：一般国际安全合作原则\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第18条：军事领域具体化\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（三）第18条与第33条共同构成海外利益保护体系\u003c/h4>\n\u003cp>可以形成：\u003c/p>\n\u003cp>\u003cstrong>第33条：\u003c/strong>\u003c/p>\n\u003cp>保护海外中国公民、组织、机构的安全和正当权益，保护国家海外利益。\u003c/p>\n\u003cp>↓  \u003c/p>\n\u003cp>\u003cstrong>第18条：\u003c/strong>\u003c/p>\n\u003cp>规定维护国家海外利益的军事行动。\u003c/p>\n\u003cp>↓  \u003c/p>\n\u003cp>\u003cstrong>现行《国防法》：\u003c/strong>\u003c/p>\n\u003cp>进一步规定依法运用武装力量保护海外中国公民、组织、机构和设施安全，并开展维和、救援、护航等活动。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>海外利益保护具有多种法律工具，军事行动只是其中一个层次。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（四）第18条与第38条形成“任务—权限”关系\u003c/h4>\n\u003cp>\u003cstrong>第18条解决：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>国家在军事安全领域承担哪些任务？\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>第38条解决：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>谁领导全国武装力量并统一指挥维护国家安全的军事行动？\u003c/p>\n\u003c/blockquote>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第18条：任务规范\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第38条：组织与指挥职权规范\u003c/strong>\u003c/p>\n\u003cp>这是第二章与第三章之间非常典型的体系关系。\u003c/p>\n\u003chr>\n\u003ch4>（五）两书对读\u003c/h4>\n\u003cp>\u003cstrong>甲书\u003c/strong>的优势主要在规范解释和制度背景：\u003c/p>\n\u003cul>\n\u003cli>联系宪法和国防法解释“三化”建设；\u003c/li>\n\u003cli>说明军事能力与国家安全和发展利益需要相适应；\u003c/li>\n\u003cli>较准确地解释积极防御的战略属性；\u003c/li>\n\u003cli>明确使用“防御、自卫、后发制人”表述；\u003c/li>\n\u003cli>结合当时海外军事行动实践解释维和、救援、护航等任务；\u003c/li>\n\u003cli>保存最终审议阶段关于海外军事行动文字修改的重要立法材料。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>乙书\u003c/strong>则更加重视现实军事能力、国际合作和维和实践，并通过维和待命部队、人员培训等数据说明军事能力建设和国际军事合作。\u003c/p>\n\u003cp>但乙书存在一个需要明确校正之处：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>其第48页关于积极防御具有“先发制人的能力”的表述，不宜作为本条的规范解释。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>正式政策文件强调的是：\u003c/p>\n\u003cp>\u003cstrong>战略上防御 + 战役战斗上的主动行动 + 防御、自卫、后发制人\u003c/strong>\u003c/p>\n\u003cp>因此，乙书这一表述宜作为作者解释保留出处，同时在笔记中注明与正式政策文本之间的差异。\u003c/p>\n\u003chr>\n\u003ch4>（六）乙书维和数据应保留时间标签\u003c/h4>\n\u003cp>乙书列举：\u003c/p>\n\u003cul>\n\u003cli>2015年以来派遣维和保障力量的人次；\u003c/li>\n\u003cli>维和待命部队建设；\u003c/li>\n\u003cli>维和人员培训；\u003c/li>\n\u003cli>在联合国维和体系中的参与情况等。\u003c/li>\n\u003c/ul>\n\u003cp>这些数据能够说明特定时期我国参与联合国维和以及能力建设的情况。\u003c/p>\n\u003cp>但应注意：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>这些数字均对应具体资料年份，不能直接作为2026年的实时统计。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，引用时最好写明：\u003c/p>\n\u003cblockquote>\n\u003cp>“据乙书所引截至××年的材料……”\u003c/p>\n\u003c/blockquote>\n\u003cp>而不写：\u003c/p>\n\u003cblockquote>\n\u003cp>“目前中国共有……”\u003c/p>\n\u003c/blockquote>\n\u003cp>这样可以避免将历史数据错误当作实时事实。\u003c/p>\n\u003chr>\n\u003ch4>（七）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：军事安全就是武器装备现代化。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第18条同时规定革命化、现代化和正规化建设，涉及政治、技术能力、组织制度和依法运行等多个维度。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：“积极防御”就是被攻击以后才可以做任何准备。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 积极防御强调战略上的防御，同时允许积极进行军事准备、塑造态势和在战役战斗层面采取主动行动。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：“积极防御”可以直接概括为“先发制人”。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 正式政策文件强调“防御、自卫、后发制人”，并强调战略上防御与战役战斗上进攻相统一。战略主动不等于先发制人。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：第18条列举维护海外利益的军事行动，因此海外利益受损时当然可以使用军事力量。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第18条规定国家任务。具体军事行动还须满足国内法上的决策权限和程序要求，并符合适用国际法。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：联合国维和就是联合国授权参加战争。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 联合国维和具有自身的任务授权和基本原则，通常强调当事方同意、公正性以及除自卫和保卫任务授权外不使用武力，应与和平强制和一般战争区分。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：国际救援、海上护航和维护海外利益的军事行动适用完全相同的法律规则。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 三者任务目的、行动空间、权限基础和国际法条件可能明显不同，需要逐项分析。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点7：国内法规定某项海外军事任务，就已经同时解决了国际法合法性。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 国内法任务依据和国际法行动依据属于两个不同法律层次。跨境军事行动还须独立判断《联合国宪章》及其他适用国际法规则。\u003c/p>\n\u003chr>\n\u003ch3>六、深度研究\u003c/h3>\n\u003ch4>1. “积极防御”应建立“战略性质—军事主动—法律边界”的三层分析框架\u003c/h4>\n\u003cp>第18条中最容易概念混乱的部分是“积极防御”。\u003c/p>\n\u003cp>可以将其拆分为三个层次：\u003c/p>\n\u003cp>\u003cstrong>第一层：战略性质\u003c/strong>\u003c/p>\n\u003cp>正式政策文本将其定位为防御性军事战略，强调：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>防御、自卫、后发制人。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>第二层：行动方式\u003c/strong>\u003c/p>\n\u003cp>防御并不等于消极等待。\u003c/p>\n\u003cp>军事力量仍需要：\u003c/p>\n\u003cul>\n\u003cli>提前建设能力；\u003c/li>\n\u003cli>做好战争准备；\u003c/li>\n\u003cli>获取预警；\u003c/li>\n\u003cli>控制危机；\u003c/li>\n\u003cli>争取战略主动；\u003c/li>\n\u003cli>在战役和战斗层面根据军事需要采取主动行动。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>第三层：法律边界\u003c/strong>\u003c/p>\n\u003cp>军事上的“主动”并不能自行改变使用武力的国内法权限和国际法条件。\u003c/p>\n\u003cp>因此，可以用一句话概括：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>积极防御的“积极”解决如何有效防御，不能用来取消“防御”本身的战略和法律属性。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这也解释了为什么乙书“先发制人的能力”这一表述容易产生误导。\u003c/p>\n\u003chr>\n\u003ch4>2. 海外利益保护军事行动具有“国内法＋国际法”的双重合法性结构\u003c/h4>\n\u003cp>这是第18条最值得深入研究的法律问题之一。\u003c/p>\n\u003cp>一个具体海外军事行动至少存在两层不同的合法性判断。\u003c/p>\n\u003ch5>第一层：国内法合法性\u003c/h5>\n\u003cp>需要判断：\u003c/p>\n\u003cul>\n\u003cli>第18条是否将该事项纳入军事安全任务；\u003c/li>\n\u003cli>哪个国家机关拥有决策权；\u003c/li>\n\u003cli>中央军事委员会具有何种指挥权限；\u003c/li>\n\u003cli>是否涉及战争状态、动员等特殊制度；\u003c/li>\n\u003cli>是否符合国防法和其他军事法律。\u003c/li>\n\u003c/ul>\n\u003ch5>第二层：国际法合法性\u003c/h5>\n\u003cp>还需要判断：\u003c/p>\n\u003cul>\n\u003cli>行动发生在哪里；\u003c/li>\n\u003cli>是否进入外国领土、领海或者领空；\u003c/li>\n\u003cli>是否取得东道国同意；\u003c/li>\n\u003cli>是否具有联合国安理会授权；\u003c/li>\n\u003cli>是否涉及《联合国宪章》第51条意义上的自卫；\u003c/li>\n\u003cli>是否符合其他适用的国际条约和国际法规则。\u003c/li>\n\u003c/ul>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>国内任务依据成立\u003c/strong>\u003cbr>≠\u003cbr>\u003cstrong>国际法依据当然成立\u003c/strong>\u003c/p>\n\u003cp>反之亦然。\u003c/p>\n\u003cp>这一双层分析框架对于研究撤侨、海外设施保护、护航以及其他海外军事行动尤其重要。\u003c/p>\n\u003chr>\n\u003ch4>3. “海外利益”不能直接转化为无限制使用军事力量的法益\u003c/h4>\n\u003cp>第18条明确将“发展利益”和“海外利益”纳入军事安全任务，反映国家利益范围与军事任务之间的联系。\u003c/p>\n\u003cp>但从法律解释上仍需要保持门槛。\u003c/p>\n\u003cp>如果仅依据：\u003c/p>\n\u003cblockquote>\n\u003cp>“某项海外经济利益受到影响”\u003c/p>\n\u003c/blockquote>\n\u003cp>就直接推导：\u003c/p>\n\u003cblockquote>\n\u003cp>“可以使用军事力量”，\u003c/p>\n\u003c/blockquote>\n\u003cp>那么“海外利益”概念可能过度扩张。\u003c/p>\n\u003cp>因此，深入研究至少应进一步判断：\u003c/p>\n\u003cul>\n\u003cli>海外利益的重要程度；\u003c/li>\n\u003cli>威胁的性质和严重程度；\u003c/li>\n\u003cli>是否涉及人员生命安全；\u003c/li>\n\u003cli>外交、领事、警务、民事救援等非军事措施是否可用；\u003c/li>\n\u003cli>使用军事力量是否具有明确国内决策依据；\u003c/li>\n\u003cli>国际法是否允许有关行动。\u003c/li>\n\u003c/ul>\n\u003cp>由此可以形成：\u003c/p>\n\u003cp>\u003cstrong>海外利益受威胁\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>风险性质和严重程度判断\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>非军事保护手段评估\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>是否达到使用军事力量的条件\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>国内法与国际法双重审查\u003c/strong>\u003c/p>\n\u003cp>这比简单依据“维护海外利益”作判断更符合法律分析要求。\u003c/p>\n\u003chr>\n\u003ch4>4. 联合国维和应与和平强制、集体安全行动严格区分\u003c/h4>\n\u003cp>联合国维和并没有因为使用军队就自动成为战争。\u003c/p>\n\u003cp>分析时至少应区分：\u003c/p>\n\u003ch5>联合国维和\u003c/h5>\n\u003cp>通常依据具体联合国任务授权展开，并以：\u003c/p>\n\u003cul>\n\u003cli>当事方同意；\u003c/li>\n\u003cli>公正；\u003c/li>\n\u003cli>除自卫和保卫任务授权外不使用武力；\u003c/li>\n\u003c/ul>\n\u003cp>作为基本原则。\u003c/p>\n\u003ch5>强有力维和\u003c/h5>\n\u003cp>部分任务在安理会授权下，可以在战术层面使用必要武力保护平民或者执行任务，但仍不能简单等同于和平强制。\u003c/p>\n\u003ch5>和平强制\u003c/h5>\n\u003cp>通常涉及《联合国宪章》第七章框架下更具有强制性的措施，并不以有关冲突方同意为当然前提。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“维和—强有力维和—和平强制”应当作为不同制度层次分析。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第18条只写“实施联合国维和”，不能用这一表述概括联合国全部军事安全机制。\u003c/p>\n\u003chr>\n\u003ch4>5. “军事任务”与“使用武力”需要进一步区分\u003c/h4>\n\u003cp>第18条所列四类活动都可能由军事力量承担，但：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>军队参与某项活动 ≠ 该活动必然属于国际法意义上的使用武力。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>例如：\u003c/p>\n\u003cul>\n\u003cli>国际灾害救援主要可能是运输、搜救、医疗和工程保障；\u003c/li>\n\u003cli>海上护航可能以警戒、伴随航行为主；\u003c/li>\n\u003cli>联合国维和中大量任务具有观察、警戒、工程、医疗和后勤性质。\u003c/li>\n\u003c/ul>\n\u003cp>因此，可以建立：\u003c/p>\n\u003cp>\u003cstrong>主体是不是军队\u003c/strong>\u003c/p>\n\u003cp>与\u003c/p>\n\u003cp>\u003cstrong>行为是否构成使用武力\u003c/strong>\u003c/p>\n\u003cp>两个不同判断。\u003c/p>\n\u003cp>这一点对于国际法分析尤其重要，因为《联合国宪章》第2条第4款所控制的是国际关系中的武力威胁或者使用，而不是一切军队跨境活动。\u003c/p>\n\u003chr>\n\u003ch4>6. 军事能力“与需要相适应”可以形成军事安全领域的能力—任务分析框架\u003c/h4>\n\u003cp>本条中的“相适应”具有较强的研究价值。\u003c/p>\n\u003cp>它可以转化为：\u003c/p>\n\u003cp>\u003cstrong>保护利益\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>识别安全威胁\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>确定军事任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>判断所需能力\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>建设和配置武装力量\u003c/strong>\u003c/p>\n\u003cp>这一框架可以避免单纯以：\u003c/p>\n\u003cul>\n\u003cli>军费增长；\u003c/li>\n\u003cli>装备数量；\u003c/li>\n\u003cli>人员规模；\u003c/li>\n\u003c/ul>\n\u003cp>衡量军事安全能力。\u003c/p>\n\u003cp>更合理的评价应当关注：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>具体能力是否能够完成法律所规定的军事安全任务。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>例如，可以分别研究：\u003c/p>\n\u003cul>\n\u003cli>国土防卫能力；\u003c/li>\n\u003cli>海上护航能力；\u003c/li>\n\u003cli>国际救援能力；\u003c/li>\n\u003cli>维和保障能力；\u003c/li>\n\u003cli>海外人员撤离和保护能力。\u003c/li>\n\u003c/ul>\n\u003cp>这样能够将抽象“强军”目标转换为更具体的法律和政策评价问题。\u003c/p>\n\u003chr>\n\u003ch4>7. 军事安全、国土安全和海外利益安全形成三个不同空间层次\u003c/h4>\n\u003cp>可以进一步将第17、18、33条组合为一个空间结构：\u003c/p>\n\u003cp>\u003cstrong>第一层：本国领土范围\u003c/strong>\u003c/p>\n\u003cp>第17条重点保护：\u003c/p>\n\u003cul>\n\u003cli>领陆；\u003c/li>\n\u003cli>内水；\u003c/li>\n\u003cli>领海；\u003c/li>\n\u003cli>领空。\u003c/li>\n\u003c/ul>\n\u003cp>核心是国土主权和安全。\u003c/p>\n\u003cp>\u003cstrong>第二层：国际空间中的军事安全活动\u003c/strong>\u003c/p>\n\u003cp>第18条涉及：\u003c/p>\n\u003cul>\n\u003cli>国际军事合作；\u003c/li>\n\u003cli>联合国维和；\u003c/li>\n\u003cli>国际救援；\u003c/li>\n\u003cli>海上护航。\u003c/li>\n\u003c/ul>\n\u003cp>这些活动可能发生在本国领土之外。\u003c/p>\n\u003cp>\u003cstrong>第三层：海外中国公民、组织、机构和利益\u003c/strong>\u003c/p>\n\u003cp>第33条建立一般性的海外利益保护任务，第18条则承认军事行动可以成为特定条件下的保护手段。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全法已经从传统领土防卫延伸至跨境安全和海外利益保护，但不同空间中的国家权限性质并不相同。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>空间越向境外延伸，越需要同时处理国内法与国际法的衔接。\u003c/p>\n\u003chr>\n\u003ch4>8. 可进一步形成六个研究问题\u003c/h4>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>“积极防御”的法律含义能否与军事战略概念进行严格区分？\u003c/strong>\u003cbr>当战略层面坚持防御、自卫和后发制人，而战役战斗层面强调争取主动时，法律解释应如何准确表述二者关系？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“国家海外利益”达到何种重要程度时可以进入军事安全任务？\u003c/strong>\u003cbr>是否需要区分公民生命安全、重大国家战略利益、普通商业利益等不同层次？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>保护海外公民和海外利益时，军事手段与外交、领事、警务和民事救援手段之间应如何形成顺序和衔接机制？\u003c/strong>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>第18条与第38条之间是否形成充分明确的“任务—决策—指挥”法律结构？\u003c/strong>\u003cbr>不同类型海外军事行动是否还需要进一步细化国内决策和程序规则？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何在国内法上区分联合国维和、国际救援、海上护航和其他海外军事行动？\u003c/strong>\u003cbr>四类行动是否应分别建立不同的授权、指挥、人员地位和责任制度？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何评价军事安全能力建设的有效性？\u003c/strong>\u003cbr>相较于单纯统计装备、人员和投入，应否围绕第18条规定的具体任务，建立“任务完成能力—合法行动能力—国际合作能力—危机响应能力”的综合评价框架？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":19,"label":"第十九条","title":"经济安全任务","lawText":"国家维护国家基本经济制度和社会主义市场经济秩序，健全预防和化解经济安全风险的制度机制，保障关系国民经济命脉的重要行业和关键领域、重点产业、重大基础设施和重大建设项目以及其他重大经济利益安全。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家维护国家基本经济制度和社会主义市场经济秩序，健全预防和化解经济安全风险的制度机制，保障关系国民经济命脉的重要行业和关键领域、重点产业、重大基础设施和重大建设项目以及其他重大经济利益安全。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家维护国家基本经济制度和社会主义市场经济秩序，健全预防和化解经济安全风险的制度机制，保障关系国民经济命脉的重要行业和关键领域、重点产业、重大基础设施和重大建设项目以及其他重大经济利益安全。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">经济安全任务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条包括经济制度与市场秩序、风险治理机制、重点经济利益保护三方面任务。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>既有经济法律制度的综合。\u003c/strong> 甲书联系宪法有关基本经济制度、国有和非公有制经济、社会主义市场经济的规定，以及金融、贸易、产业等专门制度，说明经济安全已有多种法律支撑，本法则作综合安排。\u003c/p>\n\u003cp>\u003cstrong>二审扩大和明确重点对象。\u003c/strong> 2015年4月20日修改情况汇报，建议在经济安全规定中增加关系国民经济命脉的重要行业和关键领域、重大基础设施的安全保障。见甲书附录三第380页（PDF393页）；同期官方报道亦有记载。\u003ca href=\"https://www.cac.gov.cn/2015-04/21/c_1115041073.htm\">国家网信办转载的二审信息\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>与后续条文形成分工。\u003c/strong> 金融、资源能源和粮食安全分别在第20—22条规定。因此，第19条应作为经济安全的综合任务来把握，不宜忽略其制度和市场秩序面向，只摘取行业保护。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>维护基本经济制度。\u003c/strong> 按两书论述，既涉及公有制和国有经济的地位，也涉及多种所有制共同发展。不能把国家经济安全只理解成某一种所有制企业的商业安全。\u003c/p>\n\u003cp>\u003cstrong>维护市场经济秩序。\u003c/strong> 稳定、可预期的交易规则、公平竞争和依法保护经济活动，是经济持续运行的条件。甲书联系经济立法、宏观调控和违法行为治理说明这一点。\u003c/p>\n\u003cp>\u003cstrong>健全风险机制。\u003c/strong> 风险识别、预警、评估、应对和化解需要制度化安排，既包括外部冲击，也包括内部结构、治理和运行问题。\u003c/p>\n\u003cp>\u003cstrong>保护重点经济利益。\u003c/strong> 重要行业和关键领域、重点产业、重大基础设施与建设项目，关系系统运行或国家重大利益。甲书说明关键行业、产业与基础设施，乙书进一步涉及技术、网络和供应链联系。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>企业风险与国家风险〔笔记分析〕。\u003c/strong> 企业可以是重要利益的承载者，但一家企业发生损失，并不当然等于国家经济安全受损。应论证其与关键功能、基础供给、重大技术或系统性影响的关系，区分普通市场竞争和国家安全风险。\u003c/p>\n\u003cp>\u003cstrong>安全与市场开放的协调。\u003c/strong> 本条保护市场经济秩序，并须与第8条协调发展和安全的要求联读。必要的风险治理不应被直接等同于排除全部外部联系；具体外资审查、贸易措施等须有相应法律依据和适用条件。\u003c/p>\n\u003cp>\u003cstrong>比较研究方向。\u003c/strong> 甲书介绍外国投资安全审查对关键基础设施、关键技术和资源供给的关注。可据此比较各制度如何界定关键利益、触发审查、分配举证责任及设置救济；其2016年前的外国法介绍不能代替现行制度核查。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>表述更新\u003c/strong>：甲书第88页、乙书第51页仍使用市场配置资源的“基础性作用”表述。2013年党的十八届三中全会《决定》已提出市场在资源配置中起决定性作用和更好发挥政府作用。研究制度背景时应区分旧提法与这一正式表述；两者都不是第19条逐字内容。\u003ca href=\"https://www.moe.gov.cn/jyb_xxgk/moe_1777/moe_1778/201311/t20131115_159502.html\">《决定》官方文本\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>乙书案例\u003c/strong>：孟晚舟事件可作为讨论企业、人员、技术产业和国家利益联系的材料；其复杂的外国司法与外交过程，不宜仅凭作者概述认定为第19条的直接适用案例。\u003c/li>\n\u003cli>\u003cstrong>关联条文\u003c/strong>：第2、3、8、20—22、24、25、33条，以及第59条有关国家安全审查和监管制度。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：认定某个企业、项目或行业具有国家经济安全重要性，需要哪些可核验的事实和标准？\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条包括经济制度与市场秩序、风险治理机制、重点经济利益保护三方面任务。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>既有经济法律制度的综合。\u003c/strong> 甲书联系宪法有关基本经济制度、国有和非公有制经济、社会主义市场经济的规定，以及金融、贸易、产业等专门制度，说明经济安全已有多种法律支撑，本法则作综合安排。\u003c/p>\n\u003cp>\u003cstrong>二审扩大和明确重点对象。\u003c/strong> 2015年4月20日修改情况汇报，建议在经济安全规定中增加关系国民经济命脉的重要行业和关键领域、重大基础设施的安全保障。见甲书附录三第380页（PDF393页）；同期官方报道亦有记载。\u003ca href=\"https://www.cac.gov.cn/2015-04/21/c_1115041073.htm\">国家网信办转载的二审信息\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>与后续条文形成分工。\u003c/strong> 金融、资源能源和粮食安全分别在第20—22条规定。因此，第19条应作为经济安全的综合任务来把握，不宜忽略其制度和市场秩序面向，只摘取行业保护。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>维护基本经济制度。\u003c/strong> 按两书论述，既涉及公有制和国有经济的地位，也涉及多种所有制共同发展。不能把国家经济安全只理解成某一种所有制企业的商业安全。\u003c/p>\n\u003cp>\u003cstrong>维护市场经济秩序。\u003c/strong> 稳定、可预期的交易规则、公平竞争和依法保护经济活动，是经济持续运行的条件。甲书联系经济立法、宏观调控和违法行为治理说明这一点。\u003c/p>\n\u003cp>\u003cstrong>健全风险机制。\u003c/strong> 风险识别、预警、评估、应对和化解需要制度化安排，既包括外部冲击，也包括内部结构、治理和运行问题。\u003c/p>\n\u003cp>\u003cstrong>保护重点经济利益。\u003c/strong> 重要行业和关键领域、重点产业、重大基础设施与建设项目，关系系统运行或国家重大利益。甲书说明关键行业、产业与基础设施，乙书进一步涉及技术、网络和供应链联系。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>企业风险与国家风险〔笔记分析〕。\u003c/strong> 企业可以是重要利益的承载者，但一家企业发生损失，并不当然等于国家经济安全受损。应论证其与关键功能、基础供给、重大技术或系统性影响的关系，区分普通市场竞争和国家安全风险。\u003c/p>\n\u003cp>\u003cstrong>安全与市场开放的协调。\u003c/strong> 本条保护市场经济秩序，并须与第8条协调发展和安全的要求联读。必要的风险治理不应被直接等同于排除全部外部联系；具体外资审查、贸易措施等须有相应法律依据和适用条件。\u003c/p>\n\u003cp>\u003cstrong>比较研究方向。\u003c/strong> 甲书介绍外国投资安全审查对关键基础设施、关键技术和资源供给的关注。可据此比较各制度如何界定关键利益、触发审查、分配举证责任及设置救济；其2016年前的外国法介绍不能代替现行制度核查。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>表述更新\u003c/strong>：甲书第88页、乙书第51页仍使用市场配置资源的“基础性作用”表述。2013年党的十八届三中全会《决定》已提出市场在资源配置中起决定性作用和更好发挥政府作用。研究制度背景时应区分旧提法与这一正式表述；两者都不是第19条逐字内容。\u003ca href=\"https://www.moe.gov.cn/jyb_xxgk/moe_1777/moe_1778/201311/t20131115_159502.html\">《决定》官方文本\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>乙书案例\u003c/strong>：孟晚舟事件可作为讨论企业、人员、技术产业和国家利益联系的材料；其复杂的外国司法与外交过程，不宜仅凭作者概述认定为第19条的直接适用案例。\u003c/li>\n\u003cli>\u003cstrong>关联条文\u003c/strong>：第2、3、8、20—22、24、25、33条，以及第59条有关国家安全审查和监管制度。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：认定某个企业、项目或行业具有国家经济安全重要性，需要哪些可核验的事实和标准？\u003c/li>\n\u003c/ul>\n"},{"num":20,"label":"第二十条","title":"金融安全任务","lawText":"国家健全金融宏观审慎管理和金融风险防范、处置机制，加强金融基础设施和基础能力建设，防范和化解系统性、区域性金融风险，防范和抵御外部金融风险的冲击。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第二十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全金融宏观审慎管理和金融风险防范、处置机制，加强金融基础设施和基础能力建设，防范和化解系统性、区域性金融风险，防范和抵御外部金融风险的冲击。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第二十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全金融宏观审慎管理和金融风险防范、处置机制，加强金融基础设施和基础能力建设，防范和化解系统性、区域性金融风险，防范和抵御外部金融风险的冲击。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">金融安全任务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条把金融安全从一般经济安全中单列，重点关注金融体系的整体稳定和风险传导。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>二审新增整条。\u003c/strong> 2015年4月20日修改情况汇报明确建议增加金融安全一条，涉及宏观审慎管理、风险防范处置、金融基础设施及系统性和区域性风险。见甲书附录三第380页（PDF393页）。\u003c/p>\n\u003cp>\u003cstrong>最终文本与二审建议有差异。\u003c/strong> 二审材料使用“防范发生系统性、区域性金融风险”“国际金融风险”；定稿为“防范和化解”“外部金融风险”。可以确认文本差异，但现有附录未说明这两处分别在何时改变，不能据此编造修改过程。\u003c/p>\n\u003cp>\u003cstrong>制度背景。\u003c/strong> 甲书将本条置于金融危机经验和宏观审慎框架发展的背景下，尤其指出只关注单个金融机构的健康，未必能够防止整个体系的风险。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>宏观审慎管理。\u003c/strong> 从金融体系整体识别跨机构、跨市场、跨周期的风险，关注相互关联及共同暴露，弥补只看单个机构的不足。\u003c/li>\n\u003cli>\u003cstrong>风险防范和处置。\u003c/strong> 既需要事前监测、预警、治理和准备，也需要风险出现后的处置权限、资源和程序安排。风险已经发生时，仍有“化解”的任务。\u003c/li>\n\u003cli>\u003cstrong>基础设施和基础能力。\u003c/strong> 甲书联系支付、清算、结算、征信、信息系统、灾备和制度环境等因素，说明金融安全不仅是资本是否充足，也涉及关键功能能否持续。\u003c/li>\n\u003cli>\u003cstrong>系统性与区域性风险。\u003c/strong> 关注风险能否扩散、是否影响多个机构、市场和实体经济，以及是否在特定区域集中暴露。区域性风险与系统性风险可能相互转化。\u003c/li>\n\u003cli>\u003cstrong>外部风险冲击。\u003c/strong> 外部金融变化可通过资本流动、市场价格、信用联系等渠道影响国内。维护安全不等于否认一切正常市场波动，而是提高吸收和处置冲击的能力。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>宏观与微观审慎的区别。\u003c/strong> 甲书的核心提示是：每个机构分别采取看似稳妥的行动，可能因同时收缩、相互关联或市场反馈而放大整体风险。因此，机构层面合规与体系层面稳定都需要关注。\u003c/p>\n\u003cp>\u003cstrong>制度补充\u003c/strong>：人民银行2021年发布《宏观审慎政策指引（试行）》，就宏观审慎框架与系统性风险防范化解作出进一步安排，可作为本条后续实施的研究资料，不能写成2015年已经存在的配套文件。\u003ca href=\"https://www.pbc.gov.cn/zhengcehuobisi/125207/125227/125963/dd1c12d33cab49bd8895c7a5d100aa4f/index.html\">人民银行《2021年中国货币政策大事记》12月31日事项\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>稳定体系不等于保证所有主体无损失〔笔记分析〕。\u003c/strong> 本条没有承诺所有金融机构、股东、债权人或投资者都不会遭受损失，也没有设立一般性的国家兜底义务。研究风险处置应分别分析关键功能保护、各类权益顺位、责任承担及有关保障制度。\u003c/p>\n\u003cp>\u003cstrong>防风险与促发展的关系。\u003c/strong> 结合第8、19条，应评价监管能否降低整体脆弱性、维持合理金融服务，避免将“完全消灭风险”当作唯一标准。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>乙书实例\u003c/strong>：包商银行风险处置用于说明股权结构、关联交易、内部治理和外部监督可能共同影响金融风险。它能支持治理与处置机制的讨论，但不能只凭本条判断具体接管权限或不同债权人的受偿安排。\u003c/li>\n\u003cli>\u003cstrong>旧材料更新\u003c/strong>：甲书列举的金融监管机构名称和部门分工属于2016年背景，具体引用时应查现行规定；本笔记不把旧架构照录为当前情况。\u003c/li>\n\u003cli>\u003cstrong>术语辨析\u003c/strong>：乙书将“黑天鹅”和“灰犀牛”并称为不可预测事件的表述不够严谨。研读本条可直接使用风险概率、影响程度、可识别性等维度，避免比喻掩盖具体风险判断。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：在允许正常市场出清的同时，如何确保支付结算、信用供给等关键功能不中断，并限制风险向社会和实体经济扩散？\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条把金融安全从一般经济安全中单列，重点关注金融体系的整体稳定和风险传导。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>二审新增整条。\u003c/strong> 2015年4月20日修改情况汇报明确建议增加金融安全一条，涉及宏观审慎管理、风险防范处置、金融基础设施及系统性和区域性风险。见甲书附录三第380页（PDF393页）。\u003c/p>\n\u003cp>\u003cstrong>最终文本与二审建议有差异。\u003c/strong> 二审材料使用“防范发生系统性、区域性金融风险”“国际金融风险”；定稿为“防范和化解”“外部金融风险”。可以确认文本差异，但现有附录未说明这两处分别在何时改变，不能据此编造修改过程。\u003c/p>\n\u003cp>\u003cstrong>制度背景。\u003c/strong> 甲书将本条置于金融危机经验和宏观审慎框架发展的背景下，尤其指出只关注单个金融机构的健康，未必能够防止整个体系的风险。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>宏观审慎管理。\u003c/strong> 从金融体系整体识别跨机构、跨市场、跨周期的风险，关注相互关联及共同暴露，弥补只看单个机构的不足。\u003c/li>\n\u003cli>\u003cstrong>风险防范和处置。\u003c/strong> 既需要事前监测、预警、治理和准备，也需要风险出现后的处置权限、资源和程序安排。风险已经发生时，仍有“化解”的任务。\u003c/li>\n\u003cli>\u003cstrong>基础设施和基础能力。\u003c/strong> 甲书联系支付、清算、结算、征信、信息系统、灾备和制度环境等因素，说明金融安全不仅是资本是否充足，也涉及关键功能能否持续。\u003c/li>\n\u003cli>\u003cstrong>系统性与区域性风险。\u003c/strong> 关注风险能否扩散、是否影响多个机构、市场和实体经济，以及是否在特定区域集中暴露。区域性风险与系统性风险可能相互转化。\u003c/li>\n\u003cli>\u003cstrong>外部风险冲击。\u003c/strong> 外部金融变化可通过资本流动、市场价格、信用联系等渠道影响国内。维护安全不等于否认一切正常市场波动，而是提高吸收和处置冲击的能力。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>宏观与微观审慎的区别。\u003c/strong> 甲书的核心提示是：每个机构分别采取看似稳妥的行动，可能因同时收缩、相互关联或市场反馈而放大整体风险。因此，机构层面合规与体系层面稳定都需要关注。\u003c/p>\n\u003cp>\u003cstrong>制度补充\u003c/strong>：人民银行2021年发布《宏观审慎政策指引（试行）》，就宏观审慎框架与系统性风险防范化解作出进一步安排，可作为本条后续实施的研究资料，不能写成2015年已经存在的配套文件。\u003ca href=\"https://www.pbc.gov.cn/zhengcehuobisi/125207/125227/125963/dd1c12d33cab49bd8895c7a5d100aa4f/index.html\">人民银行《2021年中国货币政策大事记》12月31日事项\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>稳定体系不等于保证所有主体无损失〔笔记分析〕。\u003c/strong> 本条没有承诺所有金融机构、股东、债权人或投资者都不会遭受损失，也没有设立一般性的国家兜底义务。研究风险处置应分别分析关键功能保护、各类权益顺位、责任承担及有关保障制度。\u003c/p>\n\u003cp>\u003cstrong>防风险与促发展的关系。\u003c/strong> 结合第8、19条，应评价监管能否降低整体脆弱性、维持合理金融服务，避免将“完全消灭风险”当作唯一标准。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>乙书实例\u003c/strong>：包商银行风险处置用于说明股权结构、关联交易、内部治理和外部监督可能共同影响金融风险。它能支持治理与处置机制的讨论，但不能只凭本条判断具体接管权限或不同债权人的受偿安排。\u003c/li>\n\u003cli>\u003cstrong>旧材料更新\u003c/strong>：甲书列举的金融监管机构名称和部门分工属于2016年背景，具体引用时应查现行规定；本笔记不把旧架构照录为当前情况。\u003c/li>\n\u003cli>\u003cstrong>术语辨析\u003c/strong>：乙书将“黑天鹅”和“灰犀牛”并称为不可预测事件的表述不够严谨。研读本条可直接使用风险概率、影响程度、可识别性等维度，避免比喻掩盖具体风险判断。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：在允许正常市场出清的同时，如何确保支付结算、信用供给等关键功能不中断，并限制风险向社会和实体经济扩散？\u003c/li>\n\u003c/ul>\n"},{"num":21,"label":"第二十一条","title":"资源能源安全任务","lawText":"国家合理利用和保护资源能源，有效管控战略资源能源的开发，加强战略资源能源储备，完善资源能源运输战略通道建设和安全保护措施，加强国际资源能源合作，全面提升应急保障能力，保障经济社会发展所需的资源能源持续、可靠和有效供给。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第二十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家合理利用和保护资源能源，有效管控战略资源能源的开发，加强战略资源能源储备，完善资源能源运输战略通道建设和安全保护措施，加强国际资源能源合作，全面提升应急保障能力，保障经济社会发展所需的资源能源持续、可靠和有效供给。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第二十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家合理利用和保护资源能源，有效管控战略资源能源的开发，加强战略资源能源储备，完善资源能源运输战略通道建设和安全保护措施，加强国际资源能源合作，全面提升应急保障能力，保障经济社会发展所需的资源能源持续、可靠和有效供给。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">资源能源安全任务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条以合理利用和保护为总要求，列举开发、储备、运输、国际合作、应急保障五方面任务，最终指向持续、可靠和有效供给。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>制度基础。\u003c/strong> 宪法关于自然资源合理利用的规定，以及煤炭、森林、可再生能源、石油天然气管道保护等法律，为本条提供了分领域的制度基础。2015年本法将这些制度放入国家安全的整体框架。\u003c/p>\n\u003cp>\u003cstrong>政策背景。\u003c/strong> 《能源发展“十二五”规划》等政策材料强调立足国内、提高供给能力、完善储备和运输通道、发展多元能源与国际合作。它们有助于理解2015年前后的问题意识，其项目规模和规划目标不能直接作为今天的情况。\u003c/p>\n\u003cp>\u003cstrong>改稿证据的限度。\u003c/strong> 本批核读的草案说明及修改报告未单独交代本条逐句修改过程，因此不将一般能源政策发展写成某轮审议新增的理由。\u003c/p>\n\u003cp>\u003cstrong>后续立法。\u003c/strong> 《能源法》于2024年11月8日通过、2025年1月1日起施行，进一步规定能源规划、开发利用、市场体系、储备应急及科技创新。本条确定的综合任务，应与这些具体制度衔接理解。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_feade8b820274803aee1c4a5ecb31bc7.html\">《能源法》正式文本\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>合理利用与保护并重。\u003c/strong> 广义资源安全包含能源安全，本条因能源的重要性将二者并列。合理利用包括提高效率、循环利用与避免过度消耗；保护则着眼于资源条件不被破坏。安全目标既涉及获得资源，也涉及维持今后供给的能力。\u003c/li>\n\u003cli>\u003cstrong>开发管控关注战略性与长期性。\u003c/strong> 勘探开发、规划布局、开采限额和能源结构调整，是不同类型的管控手段。战略资源并非“越快采完越安全”，应兼顾当前需要、生态条件及未来储备；具体哪些资源实行何种管控，须依相应法律和目录判断。\u003c/li>\n\u003cli>\u003cstrong>储备不限于已经开采的库存。\u003c/strong> 储备可区分为实物储备与资源地、能源地储备，国家储备也可以与企业商业储备相结合。实物储备侧重需要时可及时调用；资源地储备侧重保留潜在开发能力。二者的可用时间、成本和保障功能不同。\u003c/li>\n\u003cli>\u003cstrong>运输是独立的安全环节。\u003c/strong> 战略通道既包括进口通道，也包括国内地区间调配网络。油气管线、输电网络、码头和铁路都涉及通道安全；管道巡护、检测维修、保护距离及有关作业审批，则分别承担运行维护和外部风险控制功能。资源“有储量”与需求地“能获得”是两个问题。\u003c/li>\n\u003cli>\u003cstrong>国际合作有多种方式。\u003c/strong> 境外开发、引入投资技术、贸易多元化和合作支持机制，可以扩大来源、促进技术进步并分散供应风险。立足国内与国际合作在本条中同时存在，应结合第8、10条理解。\u003c/li>\n\u003cli>\u003cstrong>应急保障连接平时准备与危机处置。\u003c/strong> 应明确责任、制定预案、组织演练，并依法实施生产运输调度、储备动用等措施。是否拥有足够库存、能否及时动用以及能否送达，应分别评估。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>供给安全的全过程理解〔笔记分析〕。\u003c/strong> 可按“开发与生产—储备—运输调配—需求端获得—中断后的恢复”审视风险。单一环节充足并不保证全链条安全，例如储备集中却缺乏替代通道，仍可能无法及时保障某个区域。\u003c/p>\n\u003cp>\u003cstrong>安全与效率的协调。\u003c/strong> 储备、备用运输能力和来源多元化需要成本，但可以降低重大中断的损失。法理问题是如何配置平时成本与危机风险，而不是预设储备越多或进口越少就必然越安全。条文中的“有效供给”应与经济社会的实际需要联系起来。\u003c/p>\n\u003cp>\u003cstrong>代际保护与领域协同。\u003c/strong> 将“合理利用和保护”同第30条生态安全联读，意味着资源开发的安全收益还应与生态损害、修复成本及未来可用性一起评价。第21条不能被解释为排除环境保护要求的概括性豁免。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>案例\u003c/strong>：乙书第59—60页所载山西某能源投资集团、陈某志等非法采煤案，可说明开采秩序、资源保护和犯罪收益治理的联系。法院公布材料将企业表述为陈某志控制的企业，并认定有关主体构成非法采矿罪；不宜把企业与黑社会性质组织直接画等号。\u003ca href=\"https://www.sdcourt.gov.cn/dykfqfy/397053/397093/9034384/index.html\">法院公布的案例\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>引注校核\u003c/strong>：乙书第59页脚注链接实际指向最高法2022年惩处盗采矿产资源犯罪的《意见》，并非该案的完整案例文本；本笔记已另补案例来源。\u003ca href=\"https://www.court.gov.cn/fabu/xiangqing/364911.html\">该《意见》\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：对同一种战略资源，如何选择实物储备、资源地储备、来源多元化和运输备用能力的组合，并明确政府与企业各自承担的责任？\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条以合理利用和保护为总要求，列举开发、储备、运输、国际合作、应急保障五方面任务，最终指向持续、可靠和有效供给。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>制度基础。\u003c/strong> 宪法关于自然资源合理利用的规定，以及煤炭、森林、可再生能源、石油天然气管道保护等法律，为本条提供了分领域的制度基础。2015年本法将这些制度放入国家安全的整体框架。\u003c/p>\n\u003cp>\u003cstrong>政策背景。\u003c/strong> 《能源发展“十二五”规划》等政策材料强调立足国内、提高供给能力、完善储备和运输通道、发展多元能源与国际合作。它们有助于理解2015年前后的问题意识，其项目规模和规划目标不能直接作为今天的情况。\u003c/p>\n\u003cp>\u003cstrong>改稿证据的限度。\u003c/strong> 本批核读的草案说明及修改报告未单独交代本条逐句修改过程，因此不将一般能源政策发展写成某轮审议新增的理由。\u003c/p>\n\u003cp>\u003cstrong>后续立法。\u003c/strong> 《能源法》于2024年11月8日通过、2025年1月1日起施行，进一步规定能源规划、开发利用、市场体系、储备应急及科技创新。本条确定的综合任务，应与这些具体制度衔接理解。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_feade8b820274803aee1c4a5ecb31bc7.html\">《能源法》正式文本\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>合理利用与保护并重。\u003c/strong> 广义资源安全包含能源安全，本条因能源的重要性将二者并列。合理利用包括提高效率、循环利用与避免过度消耗；保护则着眼于资源条件不被破坏。安全目标既涉及获得资源，也涉及维持今后供给的能力。\u003c/li>\n\u003cli>\u003cstrong>开发管控关注战略性与长期性。\u003c/strong> 勘探开发、规划布局、开采限额和能源结构调整，是不同类型的管控手段。战略资源并非“越快采完越安全”，应兼顾当前需要、生态条件及未来储备；具体哪些资源实行何种管控，须依相应法律和目录判断。\u003c/li>\n\u003cli>\u003cstrong>储备不限于已经开采的库存。\u003c/strong> 储备可区分为实物储备与资源地、能源地储备，国家储备也可以与企业商业储备相结合。实物储备侧重需要时可及时调用；资源地储备侧重保留潜在开发能力。二者的可用时间、成本和保障功能不同。\u003c/li>\n\u003cli>\u003cstrong>运输是独立的安全环节。\u003c/strong> 战略通道既包括进口通道，也包括国内地区间调配网络。油气管线、输电网络、码头和铁路都涉及通道安全；管道巡护、检测维修、保护距离及有关作业审批，则分别承担运行维护和外部风险控制功能。资源“有储量”与需求地“能获得”是两个问题。\u003c/li>\n\u003cli>\u003cstrong>国际合作有多种方式。\u003c/strong> 境外开发、引入投资技术、贸易多元化和合作支持机制，可以扩大来源、促进技术进步并分散供应风险。立足国内与国际合作在本条中同时存在，应结合第8、10条理解。\u003c/li>\n\u003cli>\u003cstrong>应急保障连接平时准备与危机处置。\u003c/strong> 应明确责任、制定预案、组织演练，并依法实施生产运输调度、储备动用等措施。是否拥有足够库存、能否及时动用以及能否送达，应分别评估。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>供给安全的全过程理解〔笔记分析〕。\u003c/strong> 可按“开发与生产—储备—运输调配—需求端获得—中断后的恢复”审视风险。单一环节充足并不保证全链条安全，例如储备集中却缺乏替代通道，仍可能无法及时保障某个区域。\u003c/p>\n\u003cp>\u003cstrong>安全与效率的协调。\u003c/strong> 储备、备用运输能力和来源多元化需要成本，但可以降低重大中断的损失。法理问题是如何配置平时成本与危机风险，而不是预设储备越多或进口越少就必然越安全。条文中的“有效供给”应与经济社会的实际需要联系起来。\u003c/p>\n\u003cp>\u003cstrong>代际保护与领域协同。\u003c/strong> 将“合理利用和保护”同第30条生态安全联读，意味着资源开发的安全收益还应与生态损害、修复成本及未来可用性一起评价。第21条不能被解释为排除环境保护要求的概括性豁免。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>案例\u003c/strong>：乙书第59—60页所载山西某能源投资集团、陈某志等非法采煤案，可说明开采秩序、资源保护和犯罪收益治理的联系。法院公布材料将企业表述为陈某志控制的企业，并认定有关主体构成非法采矿罪；不宜把企业与黑社会性质组织直接画等号。\u003ca href=\"https://www.sdcourt.gov.cn/dykfqfy/397053/397093/9034384/index.html\">法院公布的案例\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>引注校核\u003c/strong>：乙书第59页脚注链接实际指向最高法2022年惩处盗采矿产资源犯罪的《意见》，并非该案的完整案例文本；本笔记已另补案例来源。\u003ca href=\"https://www.court.gov.cn/fabu/xiangqing/364911.html\">该《意见》\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：对同一种战略资源，如何选择实物储备、资源地储备、来源多元化和运输备用能力的组合，并明确政府与企业各自承担的责任？\u003c/li>\n\u003c/ul>\n"},{"num":22,"label":"第二十二条","title":"粮食安全任务","lawText":"国家健全粮食安全保障体系，保护和提高粮食综合生产能力，完善粮食储备制度、流通体系和市场调控机制，健全粮食安全预警制度，保障粮食供给和质量安全。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第二十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全粮食安全保障体系，保护和提高粮食综合生产能力，完善粮食储备制度、流通体系和市场调控机制，健全粮食安全预警制度，保障粮食供给和质量安全。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第二十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全粮食安全保障体系，保护和提高粮食综合生产能力，完善粮食储备制度、流通体系和市场调控机制，健全粮食安全预警制度，保障粮食供给和质量安全。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">粮食安全任务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定一个保障体系、生产与储备流通等制度环节，以及供给和质量两个安全目标。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>二审新增专条。\u003c/strong> 2015年4月20日修改情况汇报提出增加粮食安全一条，内容包括保障体系、预警、储备责任、流通和市场调控、粮食供给。见甲书附录三第380页（PDF393页）。这说明粮食安全在审议中从相关领域进一步单列。\u003c/p>\n\u003cp>\u003cstrong>三审补充产能与质量。\u003c/strong> 2015年6月24日审议结果报告，对草案二次审议稿第19条提出增加“保护和提高粮食综合生产能力”及“和质量安全”。理由是保障供给须立足国内、提高产能，且相关战略和农业法已有要求。见甲书附录四第383页（PDF396页）。\u003c/p>\n\u003cp>\u003cstrong>理解修改的意义。\u003c/strong> 定稿同时强调基础生产能力和质量，避免把粮食安全仅理解为库存、调运或短期数量保障。草案条号曾变化，不能将“草案第19条”误记为现行第19条经济安全规定。\u003c/p>\n\u003cp>\u003cstrong>后续专门立法。\u003c/strong> 《粮食安全保障法》于2023年12月29日通过、2024年6月1日起施行，从耕地保护、生产、储备、流通、加工、应急、节约及责任等方面细化保障体系。它是本条之后的重要制度发展。\u003ca href=\"https://lswz.gov.cn/html/zcfb/2023-12/30/content_278749.shtml\">《粮食安全保障法》正式文本\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>综合生产能力是长期基础。\u003c/strong> 这一能力包括耕地数量与质量、农田水利、农业科技、防灾减灾、生产经营组织和扶持政策等条件。产能是可持续生产的条件集合，不只是某一年的产量；保护农民种粮积极性也是其中一环。\u003c/li>\n\u003cli>\u003cstrong>储备承担保供和调节功能。\u003c/strong> 中央与地方储备、政府与社会储备各有功能，还须在数量、质量、布局、轮换和调用方面相互衔接。关键不是账面上“有粮”，而是粮食真实存在、质量可用、布局合理且能够调运。\u003c/li>\n\u003cli>\u003cstrong>流通将产区和销区连接起来。\u003c/strong> 仓储、运输、加工与交易网络共同决定粮食能否从生产者到达消费者。生产、储备、流通、消费各环节相互依赖，任何一处长期薄弱都可能影响整体供给。\u003c/li>\n\u003cli>\u003cstrong>市场调控兼顾生产者与消费者。\u003c/strong> 粮价过低会影响种粮收益，过高会加重居民负担；储备吞吐、收购支持和应急干预等制度，需要回应这一矛盾。具体措施有各自权限和启动条件，不能只凭安全目标任意改变交易规则。\u003c/li>\n\u003cli>\u003cstrong>监测预警不同于事后应急。\u003c/strong> 预警须以生产、消费、库存、价格和进出口等信息为基础；风险显现后还要有相应预案与调度能力。发出预警本身并未完成保障任务。\u003c/li>\n\u003cli>\u003cstrong>质量安全贯穿全过程。\u003c/strong> 监管涉及产地环境、农业投入品、检验检测、加工储运和不合格粮食处置等环节。粮食有数量但不宜食用，并不满足本条的安全要求。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>总体供给与具体人的获得〔笔记分析〕。\u003c/strong> 全国粮食供给充足，并不能直接证明每个地区、家庭都能稳定获得所需食物；还应考察运输、价格、收入与救助等条件。本条与第16条人民安全联读，可以把宏观供给与实际生活处境联系起来。\u003c/p>\n\u003cp>\u003cstrong>国际比较。\u003c/strong> 联合国粮农组织的入门框架区分食物供给、经济与物理可获得性、食物利用、时间上的稳定性四个维度。这提示研究者同时观察“有多少”“能否获得”“能否满足营养需要”及“能否持续”。该框架的食物范围与我国法律中“粮食”的范围并不完全相同。\u003ca href=\"https://www.fao.org/4/al936e/al936e00.pdf\">FAO《粮食安全基本概念导论》\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>粮食安全与食品安全既相关又有区别。\u003c/strong> 本条同时处理粮食生产能力、库存流通及质量问题；食品安全研究还涉及更广的食品种类和健康风险。因此，“粮食安全”不能缩减为食品卫生，也不能排除质量监管。\u003c/p>\n\u003cp>\u003cstrong>公共保障与市场机制。\u003c/strong> 粮食同时具有商品属性和基本生活保障意义。研究制度时，应同时考察价格信号、种粮收益、消费者负担和应急保障，不能简单以单一的低价格或高自给率评价全部制度成效。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>案例\u003c/strong>：乙书使用响水县周某某粮库职务犯罪案。最高检发布材料涉及贪污、受贿和非法经营同类营业；研究重点可放在收储资质、利益冲突、财务管理与监督。它说明粮食安全也有组织治理层面的风险，具体定罪依据仍在刑法。\u003ca href=\"https://www.spp.gov.cn/xwfbh/dxal/202312/t20231209_636352.shtml\">最高检典型案例之周某某案\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>旧资料使用\u003c/strong>：甲书中的规划期、耕地目标、部门称谓和价格政策属于出版时的材料。理解制度原理可以参照，引用当期具体标准则应查相应现行文件。\u003c/li>\n\u003cli>\u003cstrong>关联条文\u003c/strong>：第16条人民安全、第19条经济安全、第21条资源能源、第24条科技、第30条生态，以及第55—58条风险治理规定。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：如何把产能、储备、价格可负担性、质量与应急运输放进同一评价框架，识别“全国总量充足、局部仍然紧张”的风险？\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定一个保障体系、生产与储备流通等制度环节，以及供给和质量两个安全目标。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>二审新增专条。\u003c/strong> 2015年4月20日修改情况汇报提出增加粮食安全一条，内容包括保障体系、预警、储备责任、流通和市场调控、粮食供给。见甲书附录三第380页（PDF393页）。这说明粮食安全在审议中从相关领域进一步单列。\u003c/p>\n\u003cp>\u003cstrong>三审补充产能与质量。\u003c/strong> 2015年6月24日审议结果报告，对草案二次审议稿第19条提出增加“保护和提高粮食综合生产能力”及“和质量安全”。理由是保障供给须立足国内、提高产能，且相关战略和农业法已有要求。见甲书附录四第383页（PDF396页）。\u003c/p>\n\u003cp>\u003cstrong>理解修改的意义。\u003c/strong> 定稿同时强调基础生产能力和质量，避免把粮食安全仅理解为库存、调运或短期数量保障。草案条号曾变化，不能将“草案第19条”误记为现行第19条经济安全规定。\u003c/p>\n\u003cp>\u003cstrong>后续专门立法。\u003c/strong> 《粮食安全保障法》于2023年12月29日通过、2024年6月1日起施行，从耕地保护、生产、储备、流通、加工、应急、节约及责任等方面细化保障体系。它是本条之后的重要制度发展。\u003ca href=\"https://lswz.gov.cn/html/zcfb/2023-12/30/content_278749.shtml\">《粮食安全保障法》正式文本\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>综合生产能力是长期基础。\u003c/strong> 这一能力包括耕地数量与质量、农田水利、农业科技、防灾减灾、生产经营组织和扶持政策等条件。产能是可持续生产的条件集合，不只是某一年的产量；保护农民种粮积极性也是其中一环。\u003c/li>\n\u003cli>\u003cstrong>储备承担保供和调节功能。\u003c/strong> 中央与地方储备、政府与社会储备各有功能，还须在数量、质量、布局、轮换和调用方面相互衔接。关键不是账面上“有粮”，而是粮食真实存在、质量可用、布局合理且能够调运。\u003c/li>\n\u003cli>\u003cstrong>流通将产区和销区连接起来。\u003c/strong> 仓储、运输、加工与交易网络共同决定粮食能否从生产者到达消费者。生产、储备、流通、消费各环节相互依赖，任何一处长期薄弱都可能影响整体供给。\u003c/li>\n\u003cli>\u003cstrong>市场调控兼顾生产者与消费者。\u003c/strong> 粮价过低会影响种粮收益，过高会加重居民负担；储备吞吐、收购支持和应急干预等制度，需要回应这一矛盾。具体措施有各自权限和启动条件，不能只凭安全目标任意改变交易规则。\u003c/li>\n\u003cli>\u003cstrong>监测预警不同于事后应急。\u003c/strong> 预警须以生产、消费、库存、价格和进出口等信息为基础；风险显现后还要有相应预案与调度能力。发出预警本身并未完成保障任务。\u003c/li>\n\u003cli>\u003cstrong>质量安全贯穿全过程。\u003c/strong> 监管涉及产地环境、农业投入品、检验检测、加工储运和不合格粮食处置等环节。粮食有数量但不宜食用，并不满足本条的安全要求。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>总体供给与具体人的获得〔笔记分析〕。\u003c/strong> 全国粮食供给充足，并不能直接证明每个地区、家庭都能稳定获得所需食物；还应考察运输、价格、收入与救助等条件。本条与第16条人民安全联读，可以把宏观供给与实际生活处境联系起来。\u003c/p>\n\u003cp>\u003cstrong>国际比较。\u003c/strong> 联合国粮农组织的入门框架区分食物供给、经济与物理可获得性、食物利用、时间上的稳定性四个维度。这提示研究者同时观察“有多少”“能否获得”“能否满足营养需要”及“能否持续”。该框架的食物范围与我国法律中“粮食”的范围并不完全相同。\u003ca href=\"https://www.fao.org/4/al936e/al936e00.pdf\">FAO《粮食安全基本概念导论》\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>粮食安全与食品安全既相关又有区别。\u003c/strong> 本条同时处理粮食生产能力、库存流通及质量问题；食品安全研究还涉及更广的食品种类和健康风险。因此，“粮食安全”不能缩减为食品卫生，也不能排除质量监管。\u003c/p>\n\u003cp>\u003cstrong>公共保障与市场机制。\u003c/strong> 粮食同时具有商品属性和基本生活保障意义。研究制度时，应同时考察价格信号、种粮收益、消费者负担和应急保障，不能简单以单一的低价格或高自给率评价全部制度成效。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>案例\u003c/strong>：乙书使用响水县周某某粮库职务犯罪案。最高检发布材料涉及贪污、受贿和非法经营同类营业；研究重点可放在收储资质、利益冲突、财务管理与监督。它说明粮食安全也有组织治理层面的风险，具体定罪依据仍在刑法。\u003ca href=\"https://www.spp.gov.cn/xwfbh/dxal/202312/t20231209_636352.shtml\">最高检典型案例之周某某案\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>旧资料使用\u003c/strong>：甲书中的规划期、耕地目标、部门称谓和价格政策属于出版时的材料。理解制度原理可以参照，引用当期具体标准则应查相应现行文件。\u003c/li>\n\u003cli>\u003cstrong>关联条文\u003c/strong>：第16条人民安全、第19条经济安全、第21条资源能源、第24条科技、第30条生态，以及第55—58条风险治理规定。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：如何把产能、储备、价格可负担性、质量与应急运输放进同一评价框架，识别“全国总量充足、局部仍然紧张”的风险？\u003c/li>\n\u003c/ul>\n"},{"num":23,"label":"第二十三条","title":"文化安全任务","lawText":"国家坚持社会主义先进文化前进方向，继承和弘扬中华民族优秀传统文化，培育和践行社会主义核心价值观，防范和抵制不良文化的影响，掌握意识形态领域主导权，增强文化整体实力和竞争力。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第二十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家坚持社会主义先进文化前进方向，继承和弘扬中华民族优秀传统文化，培育和践行社会主义核心价值观，防范和抵制不良文化的影响，掌握意识形态领域主导权，增强文化整体实力和竞争力。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第二十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家坚持社会主义先进文化前进方向，继承和弘扬中华民族优秀传统文化，培育和践行社会主义核心价值观，防范和抵制不良文化的影响，掌握意识形态领域主导权，增强文化整体实力和竞争力。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">文化安全任务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条兼有文化方向、传统传承、价值建设、风险防范、意识形态与文化能力建设等内容。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>二审扩充。\u003c/strong> 2015年4月20日修改情况汇报，在文化安全中增加社会主义核心价值观教育宣传及防范抵御不良文化渗透的内容。见甲书附录三第380页（PDF393页）。\u003c/p>\n\u003cp>\u003cstrong>最后审议强调实践。\u003c/strong> 2015年6月30日修改意见报告认为，只讲核心价值观教育宣传还不够，应强调积极践行，使之进入实际行动；报告据此提出本条最终表述。见甲书附录五第388页（PDF401页）。\u003c/p>\n\u003cp>\u003cstrong>文字变化须分开记录。\u003c/strong> 二审建议使用“防范和抵御不良文化的渗透”，定稿为“防范和抵制不良文化的影响”。可以确认措辞有变化，但报告只概括说明另有表述调整，不能虚构这一处变化的独立理由。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>文化发展的方向与目的。\u003c/strong> 本条要求文化发展服务人民、满足精神文化需求，并将继承与创新相结合。文化建设、公共文化服务与文化创造都是积极任务，禁限管理只是其中一个方面。\u003c/li>\n\u003cli>\u003cstrong>优秀传统文化的保护与传承。\u003c/strong> 实现途径包括典籍整理和数字化、文物与非物质文化遗产保护、教育普及、民族语言文化保护等。这里的传承包含选择、研究和创新，不能等同于原样保留全部传统做法。\u003c/li>\n\u003cli>\u003cstrong>核心价值观的培育与践行。\u003c/strong> 可以区分国家层面的富强、民主、文明、和谐，社会层面的自由、平等、公正、法治，个人层面的爱国、敬业、诚信、友善；进一步联系教育、治理、制度与社会实践。立法沿革说明“践行”本身是有意强调的任务。\u003c/li>\n\u003cli>\u003cstrong>防范不良文化影响。\u003c/strong> 与本条相关的文化管理规范涉及暴力、恐怖、色情等内容。需要区分一般价值评价与法定禁止事项：“不良文化”不是所有具体禁止行为的统一构成要件，个案仍须查相应规则及其适用条件。\u003c/li>\n\u003cli>\u003cstrong>意识形态领域主导权。\u003c/strong> 这一要求涉及政治制度、共同思想基础和传播秩序，通过理论建设、公共传播及相关制度落实。它应与同条的文化发展任务及第7条法治和权利保障一并理解。\u003c/li>\n\u003cli>\u003cstrong>提高文化实力与竞争力。\u003c/strong> 文化创作、机构与人才建设、产品服务、对外交流和传播能力，共同影响文化质量、创新水平和国际影响。文化安全因此也需要积极的文化供给和交流能力。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>文化保护与文化交流。\u003c/strong> 文化发展包含平等、多元的文化对话，以及对各国优秀文明成果的吸收。结合本条增强文化实力的任务，不能仅凭作品的国外来源，就直接推定其属于本条所称不良文化。\u003c/p>\n\u003cp>\u003cstrong>国际比较补充。\u003c/strong> 联合国教科文组织2005年《保护和促进文化表现形式多样性公约》第2条，将文化政策主权与人权、表达及信息自由、各文化的平等尊严并列。可据此比较文化保护措施如何兼顾多样性和个人权利，不能把该公约当成本条全部概念的同义解释。\u003ca href=\"https://www.unesco.org/en/legal-affairs/convention-protection-and-promotion-diversity-cultural-expressions\">公约正式文本\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>价值目标与可处罚行为的区别〔笔记分析〕。\u003c/strong> 价值倡导可以通过教育、公共服务、资助和榜样实践实现；采取限制、处罚措施，则还需明确法律依据与程序。不能把“不符合某种价值评价”直接等同于构成违法犯罪。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>案例材料的边界\u003c/strong>：乙书第65—66页引用张某非法出版图书、传播有害信息案。对应公安通报记载刑期，但未列具体定罪罪名和裁判条款，不能把书后列出的数个刑法条文全部写成实际定罪依据，也不能据此把一般文化争议一概犯罪化。\u003ca href=\"https://gat.sc.gov.cn/scgat/c103399/2023/4/14/53b7429e2268426d84ddca8e6b900136.shtml\">四川省公安厅2023年通报案例1\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>关联条文\u003c/strong>：第3条文化安全保障、第7条权利自由、第15条政治安全、第25条网络信息安全、第26条民族文化相关制度。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：如何区分文化发展目标、行业管理义务与违法责任，并评价文化保护措施对文化创造、交流和公众选择的实际影响？\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条兼有文化方向、传统传承、价值建设、风险防范、意识形态与文化能力建设等内容。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>二审扩充。\u003c/strong> 2015年4月20日修改情况汇报，在文化安全中增加社会主义核心价值观教育宣传及防范抵御不良文化渗透的内容。见甲书附录三第380页（PDF393页）。\u003c/p>\n\u003cp>\u003cstrong>最后审议强调实践。\u003c/strong> 2015年6月30日修改意见报告认为，只讲核心价值观教育宣传还不够，应强调积极践行，使之进入实际行动；报告据此提出本条最终表述。见甲书附录五第388页（PDF401页）。\u003c/p>\n\u003cp>\u003cstrong>文字变化须分开记录。\u003c/strong> 二审建议使用“防范和抵御不良文化的渗透”，定稿为“防范和抵制不良文化的影响”。可以确认措辞有变化，但报告只概括说明另有表述调整，不能虚构这一处变化的独立理由。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>文化发展的方向与目的。\u003c/strong> 本条要求文化发展服务人民、满足精神文化需求，并将继承与创新相结合。文化建设、公共文化服务与文化创造都是积极任务，禁限管理只是其中一个方面。\u003c/li>\n\u003cli>\u003cstrong>优秀传统文化的保护与传承。\u003c/strong> 实现途径包括典籍整理和数字化、文物与非物质文化遗产保护、教育普及、民族语言文化保护等。这里的传承包含选择、研究和创新，不能等同于原样保留全部传统做法。\u003c/li>\n\u003cli>\u003cstrong>核心价值观的培育与践行。\u003c/strong> 可以区分国家层面的富强、民主、文明、和谐，社会层面的自由、平等、公正、法治，个人层面的爱国、敬业、诚信、友善；进一步联系教育、治理、制度与社会实践。立法沿革说明“践行”本身是有意强调的任务。\u003c/li>\n\u003cli>\u003cstrong>防范不良文化影响。\u003c/strong> 与本条相关的文化管理规范涉及暴力、恐怖、色情等内容。需要区分一般价值评价与法定禁止事项：“不良文化”不是所有具体禁止行为的统一构成要件，个案仍须查相应规则及其适用条件。\u003c/li>\n\u003cli>\u003cstrong>意识形态领域主导权。\u003c/strong> 这一要求涉及政治制度、共同思想基础和传播秩序，通过理论建设、公共传播及相关制度落实。它应与同条的文化发展任务及第7条法治和权利保障一并理解。\u003c/li>\n\u003cli>\u003cstrong>提高文化实力与竞争力。\u003c/strong> 文化创作、机构与人才建设、产品服务、对外交流和传播能力，共同影响文化质量、创新水平和国际影响。文化安全因此也需要积极的文化供给和交流能力。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>文化保护与文化交流。\u003c/strong> 文化发展包含平等、多元的文化对话，以及对各国优秀文明成果的吸收。结合本条增强文化实力的任务，不能仅凭作品的国外来源，就直接推定其属于本条所称不良文化。\u003c/p>\n\u003cp>\u003cstrong>国际比较补充。\u003c/strong> 联合国教科文组织2005年《保护和促进文化表现形式多样性公约》第2条，将文化政策主权与人权、表达及信息自由、各文化的平等尊严并列。可据此比较文化保护措施如何兼顾多样性和个人权利，不能把该公约当成本条全部概念的同义解释。\u003ca href=\"https://www.unesco.org/en/legal-affairs/convention-protection-and-promotion-diversity-cultural-expressions\">公约正式文本\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>价值目标与可处罚行为的区别〔笔记分析〕。\u003c/strong> 价值倡导可以通过教育、公共服务、资助和榜样实践实现；采取限制、处罚措施，则还需明确法律依据与程序。不能把“不符合某种价值评价”直接等同于构成违法犯罪。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>案例材料的边界\u003c/strong>：乙书第65—66页引用张某非法出版图书、传播有害信息案。对应公安通报记载刑期，但未列具体定罪罪名和裁判条款，不能把书后列出的数个刑法条文全部写成实际定罪依据，也不能据此把一般文化争议一概犯罪化。\u003ca href=\"https://gat.sc.gov.cn/scgat/c103399/2023/4/14/53b7429e2268426d84ddca8e6b900136.shtml\">四川省公安厅2023年通报案例1\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>关联条文\u003c/strong>：第3条文化安全保障、第7条权利自由、第15条政治安全、第25条网络信息安全、第26条民族文化相关制度。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：如何区分文化发展目标、行业管理义务与违法责任，并评价文化保护措施对文化创造、交流和公众选择的实际影响？\u003c/li>\n\u003c/ul>\n"},{"num":24,"label":"第二十四条","title":"科技安全任务","lawText":"国家加强自主创新能力建设，加快发展自主可控的战略高新技术和重要领域核心关键技术，加强知识产权的运用、保护和科技保密能力建设，保障重大技术和工程的安全。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第二十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家加强自主创新能力建设，加快发展自主可控的战略高新技术和重要领域核心关键技术，加强知识产权的运用、保护和科技保密能力建设，保障重大技术和工程的安全。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第二十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家加强自主创新能力建设，加快发展自主可控的战略高新技术和重要领域核心关键技术，加强知识产权的运用、保护和科技保密能力建设，保障重大技术和工程的安全。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">科技安全任务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条把能力建设、核心技术、成果保护与重大技术和工程安全相连。主体是国家，规定的是科技领域的国家安全任务，不能只读成科研人员的保密义务条款。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>既有科技立法提供制度基础。\u003c/strong> 2006年科技发展规划、2007年修订的《科学技术进步法》以及创新驱动发展战略，构成本条的重要制度背景。本条从一般科技发展政策进一步提出国家安全要求：重要技术不仅要发展，还要形成持续掌握、使用和发展它的能力。\u003c/p>\n\u003cp>\u003cstrong>保密制度的延续与细化。\u003c/strong> 1995年《科学技术保密规定》已对科技保密作出专门安排，2015年11月又作修订。后一次修订发生在本法通过之后，属于配套制度的发展。\u003c/p>\n\u003cp>现有草案说明与审议附录没有提供本条明确的逐稿改写记录，上述内容属于制度背景。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>科技安全兼有防御、发展和技术风险控制三方面。\u003c/strong> 它既包括防范外部技术优势造成的威胁、科技成果被侵害或泄露，也包括控制科技发展自身的不利影响，以及运用科技维护安全的能力。重大技术和工程的安全管理应贯穿研发、制造、使用、维护全过程。\u003c/li>\n\u003cli>\u003cstrong>自主创新是能力要求。\u003c/strong> 建设路径包括发挥企业的创新主体作用、促进企业与科研机构和高校合作、增加研发投入，以及运用财政、税收、采购等支持措施。吸收引进技术并再创新也是能力积累的重要方式，自主创新可以与外部知识交流和合作并行。\u003c/li>\n\u003cli>\u003cstrong>自主可控聚焦战略高新技术和重要领域的核心关键技术。\u003c/strong> 它包括知识产权、能力和发展等层面的可控。取得一份许可、购买一套设备，未必就有独立维护、持续供给和后续发展的能力。信息通信、航空航天、新能源、新材料、生物医药等领域可以说明这一问题，但法条没有规定封闭的技术目录。\u003c/li>\n\u003cli>\u003cstrong>知识产权同时需要运用与保护。\u003c/strong> 运用侧重成果转化、产业应用和创新激励；保护侧重防止侵害。技术中介、合作转化和职务成果管理等环节，还需落实相应保密责任，使合法转化与成果保护相衔接。\u003c/li>\n\u003cli>\u003cstrong>科技保密须依法分类、定密和管理。\u003c/strong> 应区分涉及国家安全利益的科学技术秘密与单位的其他技术秘密，并遵守定密、变更、解密及涉密人员、项目、成果和国际交流的管理程序。2015年《科学技术保密规定》已明确，已经公开、难以有效控制知悉范围等特定技术事项不得确定为国家科学技术秘密。具体适用须以现行保密法律与专门规定为准。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>知识产权与保密保护并非同一制度。\u003c/strong> 知识产权侧重确认和保护法定专有权，国家秘密制度侧重国家安全利益，商业或技术秘密保护又有自身条件。三者可能交叉，但某项科研成果具有商业价值或被单位称为“机密”，不自动成为国家秘密；应查法定要件、定密权限和程序。\u003c/p>\n\u003cp>\u003cstrong>开放创新与安全控制需要衔接。\u003c/strong> 协同创新、开放创新和国际合作可以提升自主能力。相应制度需要识别核心利益、划定涉密范围、安排成果权属和风险评估，使科研合作与安全保护都有具体规则。\u003c/p>\n\u003cp>\u003cstrong>技术对象与风险后果应分别判断〔笔记分析〕。\u003c/strong> 技术先进、项目重大可以提示较高保护需求，但不能只凭这些标签就推定一切信息交换违法。相反，一项普通部件、数据或维护服务也可能成为重大工程的关键风险环节，安全判断需关注它在系统中的实际作用。\u003c/p>\n\u003cp>进一步作比较法研究，可分别考察知识产权安排、政府采购、技术转移与出口管制，区分各类制度对自主能力和技术安全的不同影响。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>赵某军间谍案。\u003c/strong> 一名航天科研人员赴境外访学后被间谍情报人员策反，回国后继续提供涉密资料并收受经费；据相关报道，2022年被以间谍罪判刑。案例说明科研人员、合作接触、专用存储介质和信息传递渠道可能成为科技保密管理中的关键环节，定罪依据则是刑法。案例来源：杜洋、董凡超《增强国家安全意识 筑牢国家安全防线》，《法治日报》2023年4月15日第3版；乙书第68—69页转引。\u003c/li>\n\u003cli>\u003cstrong>勿把案例概括成科研交流本身具有违法性。\u003c/strong> 案例所述风险来自接受间谍任务、提供涉密资料等具体行为，访学、咨询和国际交流本身并不等同于这些行为。\u003c/li>\n\u003cli>\u003cstrong>版本提醒\u003c/strong>：2007年科技进步法和当时保密法条号属于历史材料，制作现行法索引应核对后续修订。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：评价“自主可控”时，应以专利权属、替代供给、源代码或技术资料掌握、维护能力还是持续研发能力为重点？不同技术领域能否采用同一尺度？\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条把能力建设、核心技术、成果保护与重大技术和工程安全相连。主体是国家，规定的是科技领域的国家安全任务，不能只读成科研人员的保密义务条款。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>既有科技立法提供制度基础。\u003c/strong> 2006年科技发展规划、2007年修订的《科学技术进步法》以及创新驱动发展战略，构成本条的重要制度背景。本条从一般科技发展政策进一步提出国家安全要求：重要技术不仅要发展，还要形成持续掌握、使用和发展它的能力。\u003c/p>\n\u003cp>\u003cstrong>保密制度的延续与细化。\u003c/strong> 1995年《科学技术保密规定》已对科技保密作出专门安排，2015年11月又作修订。后一次修订发生在本法通过之后，属于配套制度的发展。\u003c/p>\n\u003cp>现有草案说明与审议附录没有提供本条明确的逐稿改写记录，上述内容属于制度背景。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>科技安全兼有防御、发展和技术风险控制三方面。\u003c/strong> 它既包括防范外部技术优势造成的威胁、科技成果被侵害或泄露，也包括控制科技发展自身的不利影响，以及运用科技维护安全的能力。重大技术和工程的安全管理应贯穿研发、制造、使用、维护全过程。\u003c/li>\n\u003cli>\u003cstrong>自主创新是能力要求。\u003c/strong> 建设路径包括发挥企业的创新主体作用、促进企业与科研机构和高校合作、增加研发投入，以及运用财政、税收、采购等支持措施。吸收引进技术并再创新也是能力积累的重要方式，自主创新可以与外部知识交流和合作并行。\u003c/li>\n\u003cli>\u003cstrong>自主可控聚焦战略高新技术和重要领域的核心关键技术。\u003c/strong> 它包括知识产权、能力和发展等层面的可控。取得一份许可、购买一套设备，未必就有独立维护、持续供给和后续发展的能力。信息通信、航空航天、新能源、新材料、生物医药等领域可以说明这一问题，但法条没有规定封闭的技术目录。\u003c/li>\n\u003cli>\u003cstrong>知识产权同时需要运用与保护。\u003c/strong> 运用侧重成果转化、产业应用和创新激励；保护侧重防止侵害。技术中介、合作转化和职务成果管理等环节，还需落实相应保密责任，使合法转化与成果保护相衔接。\u003c/li>\n\u003cli>\u003cstrong>科技保密须依法分类、定密和管理。\u003c/strong> 应区分涉及国家安全利益的科学技术秘密与单位的其他技术秘密，并遵守定密、变更、解密及涉密人员、项目、成果和国际交流的管理程序。2015年《科学技术保密规定》已明确，已经公开、难以有效控制知悉范围等特定技术事项不得确定为国家科学技术秘密。具体适用须以现行保密法律与专门规定为准。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>知识产权与保密保护并非同一制度。\u003c/strong> 知识产权侧重确认和保护法定专有权，国家秘密制度侧重国家安全利益，商业或技术秘密保护又有自身条件。三者可能交叉，但某项科研成果具有商业价值或被单位称为“机密”，不自动成为国家秘密；应查法定要件、定密权限和程序。\u003c/p>\n\u003cp>\u003cstrong>开放创新与安全控制需要衔接。\u003c/strong> 协同创新、开放创新和国际合作可以提升自主能力。相应制度需要识别核心利益、划定涉密范围、安排成果权属和风险评估，使科研合作与安全保护都有具体规则。\u003c/p>\n\u003cp>\u003cstrong>技术对象与风险后果应分别判断〔笔记分析〕。\u003c/strong> 技术先进、项目重大可以提示较高保护需求，但不能只凭这些标签就推定一切信息交换违法。相反，一项普通部件、数据或维护服务也可能成为重大工程的关键风险环节，安全判断需关注它在系统中的实际作用。\u003c/p>\n\u003cp>进一步作比较法研究，可分别考察知识产权安排、政府采购、技术转移与出口管制，区分各类制度对自主能力和技术安全的不同影响。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>赵某军间谍案。\u003c/strong> 一名航天科研人员赴境外访学后被间谍情报人员策反，回国后继续提供涉密资料并收受经费；据相关报道，2022年被以间谍罪判刑。案例说明科研人员、合作接触、专用存储介质和信息传递渠道可能成为科技保密管理中的关键环节，定罪依据则是刑法。案例来源：杜洋、董凡超《增强国家安全意识 筑牢国家安全防线》，《法治日报》2023年4月15日第3版；乙书第68—69页转引。\u003c/li>\n\u003cli>\u003cstrong>勿把案例概括成科研交流本身具有违法性。\u003c/strong> 案例所述风险来自接受间谍任务、提供涉密资料等具体行为，访学、咨询和国际交流本身并不等同于这些行为。\u003c/li>\n\u003cli>\u003cstrong>版本提醒\u003c/strong>：2007年科技进步法和当时保密法条号属于历史材料，制作现行法索引应核对后续修订。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：评价“自主可控”时，应以专利权属、替代供给、源代码或技术资料掌握、维护能力还是持续研发能力为重点？不同技术领域能否采用同一尺度？\u003c/li>\n\u003c/ul>\n"},{"num":25,"label":"第二十五条","title":"网络与信息安全任务","lawText":"国家建设网络与信息安全保障体系，提升网络与信息安全保护能力，加强网络和信息技术的创新研究和开发应用，实现网络和信息核心技术、关键基础设施和重要领域信息系统及数据的安全可控；加强网络管理，防范、制止和依法惩治网络攻击、网络入侵、网络窃密、散布违法有害信息等网络违法犯罪行为，维护国家网络空间主权、安全和发展利益。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第二十五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建设网络与信息安全保障体系，提升网络与信息安全保护能力，加强网络和信息技术的创新研究和开发应用，实现网络和信息核心技术、关键基础设施和重要领域信息系统及数据的安全可控；加强网络管理，防范、制止和依法惩治网络攻击、网络入侵、网络窃密、散布违法有害信息等网络违法犯罪行为，维护国家网络空间主权、安全和发展利益。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第二十五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建设网络与信息安全保障体系，提升网络与信息安全保护能力，加强网络和信息技术的创新研究和开发应用，实现网络和信息核心技术、关键基础设施和重要领域信息系统及数据的安全可控；加强网络管理，防范、制止和依法惩治网络攻击、网络入侵、网络窃密、散布违法有害信息等网络违法犯罪行为，维护国家网络空间主权、安全和发展利益。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">网络与信息安全任务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>分号前侧重技术、制度与能力建设，分号后侧重依法治理和危害行为防治；整体目标是维护网络空间主权、安全和发展利益。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>有明确的审议增补记录。\u003c/strong> 2015年4月20日《修改情况的汇报》提出，在网络与信息安全规定中增加“建设国家网络与信息安全保障体系，提升网络与信息安全保护能力”和“维护国家网络空间主权”。见甲书附录三第380页（PDF393页）。这说明本条并非只在原有网络违法行为清单上累加禁令，而是明确了体系建设与主权层面的任务。\u003c/p>\n\u003cp>\u003cstrong>从分散规范走向综合框架。\u003c/strong> 早期规范包括维护互联网安全的决定、加强网络信息保护的决定、电信条例和互联网信息服务规范等，分别回应网络发展中的不同问题。其间逐渐显现规则效力层次不一、部门规范分散，以及发展和权利保护不足等制度问题，推动了综合性网络安全立法。《释义》第134页“正在抓紧制定网络安全法”的表述反映的是2016年出版时的情况。\u003c/p>\n\u003cp>本条在2015年确立基本任务；之后网络安全、数据安全和个人信息保护等专门法律的发展，应作为后续制度具体化另记，不应回填为2015年已经存在的内容。\u003c/p>\n\u003cp>\u003cstrong>后续立法与2025年修改。\u003c/strong> 《网络安全法》于2016年11月7日通过；2025年10月28日的修改决定自2026年1月1日起施行，并调整条文顺序。修改后的第20条专门涉及人工智能研发、伦理、风险监测评估和安全监管，可与本法第24、25条的技术发展和风险防控任务联读。\u003ca href=\"https://www.npc.gov.cn/npc/c1773/c1848/c21114/wlaqfxz/wlaqfxz002/202511/t20251103_449242.html\">2025年修改决定\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2025-12/29/c_1768735112911946.htm\">修正后的法律全文\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>保护对象是多层次的。\u003c/strong> 它包括网络基础设施、运行和存储的数据、依赖信息技术连接和控制的系统。由此可以理解，为何法条同时列核心技术、关键基础设施、重要领域信息系统和数据。信息内容治理只是其中一个方面。\u003c/li>\n\u003cli>\u003cstrong>体系建设包含技术以外的制度与组织。\u003c/strong> 等级保护、密码技术、电子认证与信任体系、风险评估、监测和应急处置，需要政策法规、技术手段与组织管理共同支撑。\u003c/li>\n\u003cli>\u003cstrong>保护能力既包括防御，也包括恢复。\u003c/strong> 漏洞和后门研究、关键设备保障、人才培养、灾难备份、抗毁能力及灾难恢复，构成持续保护的重要环节。即使无法完全杜绝事件，也应减少破坏、维持重要服务并恢复运行。\u003c/li>\n\u003cli>\u003cstrong>技术创新服务于安全可控。\u003c/strong> 集成电路、软件、关键电子元器件等领域的技术突破，有助于减少对外部技术的依赖，并增强系统和数据保护能力。法条的“安全可控”应结合具体系统的可验证安全能力理解，而非仅凭某一产地或名称判断。\u003c/li>\n\u003cli>\u003cstrong>网络既可能是被攻击对象，也可能是违法行为的工具。\u003c/strong> 侵入、攻击、破坏网络本身，与利用网络从事窃密、诈骗、侵权等行为，保护法益、行为结构和责任依据可能不同。构成犯罪、行政违法或民事侵权，均应分别依据有关法律判断。\u003c/li>\n\u003cli>\u003cstrong>网络空间主权兼有国内治理与国际合作面向。\u003c/strong> 它是国家主权在网络空间的体现和延伸，包括自主选择发展道路、管理模式与公共政策，以及平等参与国际治理的权利，同时要求尊重别国主权、不干涉内政和开展合作。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>国家安全与个人信息、通信权利可以相互支持。\u003c/strong> 数据泄露、非法监听或系统破坏，可能同时损害国家安全和个人权益。网络安全治理本身也须遵守法治和权利保障原则；下位规范不得超越权限削减上位法所保障的权利，监管措施应具有明确的法律依据。\u003c/p>\n\u003cp>\u003cstrong>治理任务不能直接替代处罚构成〔笔记分析〕。\u003c/strong> “散布违法有害信息”等表述给出任务方向，但认定特定行为应受何种处理，仍须查清适用法律、违法要件、证明标准和处理权限。不能把不受欢迎的观点、一般信息错误与法定违法犯罪混为一谈。\u003c/p>\n\u003cp>\u003cstrong>网络主权不消除跨境协调问题〔笔记分析〕。\u003c/strong> 网络设施所在地、数据存储地、使用者所在地及行为后果地可能分离。国内法提出维护网络空间主权，不等于所有涉外管辖、跨境取证和国际责任问题已由本条解决，仍需结合专门法与适用的国际规则。\u003c/p>\n\u003cp>\u003cstrong>比较法上的共同问题。\u003c/strong> 网络治理需要协调安全、创新发展、权利保障与监管权限。具体比较可考察网络事件报告、关键信息基础设施保护、数据处理规则和执法监督；不同制度的适用对象与触发条件需要分别辨明。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>数据泄露案例补充。\u003c/strong> 四川省公安厅2023年通报记载，某单位违规向第三方提供数据，后因第三方服务器被入侵发生泄露，并存在网络安全管理问题。它提示本条的技术防护任务还涉及数据交付、外包管理与内部责任，而不只针对发布信息的个人。\u003ca href=\"https://gat.sc.gov.cn/scgat/c103399/2023/4/14/53b7429e2268426d84ddca8e6b900136.shtml\">公安厅通报案例5\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>程序阶段辨析。\u003c/strong> 《国家安全法释义与适用》第71页所引张某社交平台案只记载被采取强制措施，未说明最终裁判；可作风险讨论材料，不能当作已定罪判例。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：如何在网络安全审查、重要系统运行、数据流动和个人信息保护之间建立清楚分工，并避免不同监管目标相互替代？\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>分号前侧重技术、制度与能力建设，分号后侧重依法治理和危害行为防治；整体目标是维护网络空间主权、安全和发展利益。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>有明确的审议增补记录。\u003c/strong> 2015年4月20日《修改情况的汇报》提出，在网络与信息安全规定中增加“建设国家网络与信息安全保障体系，提升网络与信息安全保护能力”和“维护国家网络空间主权”。见甲书附录三第380页（PDF393页）。这说明本条并非只在原有网络违法行为清单上累加禁令，而是明确了体系建设与主权层面的任务。\u003c/p>\n\u003cp>\u003cstrong>从分散规范走向综合框架。\u003c/strong> 早期规范包括维护互联网安全的决定、加强网络信息保护的决定、电信条例和互联网信息服务规范等，分别回应网络发展中的不同问题。其间逐渐显现规则效力层次不一、部门规范分散，以及发展和权利保护不足等制度问题，推动了综合性网络安全立法。《释义》第134页“正在抓紧制定网络安全法”的表述反映的是2016年出版时的情况。\u003c/p>\n\u003cp>本条在2015年确立基本任务；之后网络安全、数据安全和个人信息保护等专门法律的发展，应作为后续制度具体化另记，不应回填为2015年已经存在的内容。\u003c/p>\n\u003cp>\u003cstrong>后续立法与2025年修改。\u003c/strong> 《网络安全法》于2016年11月7日通过；2025年10月28日的修改决定自2026年1月1日起施行，并调整条文顺序。修改后的第20条专门涉及人工智能研发、伦理、风险监测评估和安全监管，可与本法第24、25条的技术发展和风险防控任务联读。\u003ca href=\"https://www.npc.gov.cn/npc/c1773/c1848/c21114/wlaqfxz/wlaqfxz002/202511/t20251103_449242.html\">2025年修改决定\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2025-12/29/c_1768735112911946.htm\">修正后的法律全文\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>保护对象是多层次的。\u003c/strong> 它包括网络基础设施、运行和存储的数据、依赖信息技术连接和控制的系统。由此可以理解，为何法条同时列核心技术、关键基础设施、重要领域信息系统和数据。信息内容治理只是其中一个方面。\u003c/li>\n\u003cli>\u003cstrong>体系建设包含技术以外的制度与组织。\u003c/strong> 等级保护、密码技术、电子认证与信任体系、风险评估、监测和应急处置，需要政策法规、技术手段与组织管理共同支撑。\u003c/li>\n\u003cli>\u003cstrong>保护能力既包括防御，也包括恢复。\u003c/strong> 漏洞和后门研究、关键设备保障、人才培养、灾难备份、抗毁能力及灾难恢复，构成持续保护的重要环节。即使无法完全杜绝事件，也应减少破坏、维持重要服务并恢复运行。\u003c/li>\n\u003cli>\u003cstrong>技术创新服务于安全可控。\u003c/strong> 集成电路、软件、关键电子元器件等领域的技术突破，有助于减少对外部技术的依赖，并增强系统和数据保护能力。法条的“安全可控”应结合具体系统的可验证安全能力理解，而非仅凭某一产地或名称判断。\u003c/li>\n\u003cli>\u003cstrong>网络既可能是被攻击对象，也可能是违法行为的工具。\u003c/strong> 侵入、攻击、破坏网络本身，与利用网络从事窃密、诈骗、侵权等行为，保护法益、行为结构和责任依据可能不同。构成犯罪、行政违法或民事侵权，均应分别依据有关法律判断。\u003c/li>\n\u003cli>\u003cstrong>网络空间主权兼有国内治理与国际合作面向。\u003c/strong> 它是国家主权在网络空间的体现和延伸，包括自主选择发展道路、管理模式与公共政策，以及平等参与国际治理的权利，同时要求尊重别国主权、不干涉内政和开展合作。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>国家安全与个人信息、通信权利可以相互支持。\u003c/strong> 数据泄露、非法监听或系统破坏，可能同时损害国家安全和个人权益。网络安全治理本身也须遵守法治和权利保障原则；下位规范不得超越权限削减上位法所保障的权利，监管措施应具有明确的法律依据。\u003c/p>\n\u003cp>\u003cstrong>治理任务不能直接替代处罚构成〔笔记分析〕。\u003c/strong> “散布违法有害信息”等表述给出任务方向，但认定特定行为应受何种处理，仍须查清适用法律、违法要件、证明标准和处理权限。不能把不受欢迎的观点、一般信息错误与法定违法犯罪混为一谈。\u003c/p>\n\u003cp>\u003cstrong>网络主权不消除跨境协调问题〔笔记分析〕。\u003c/strong> 网络设施所在地、数据存储地、使用者所在地及行为后果地可能分离。国内法提出维护网络空间主权，不等于所有涉外管辖、跨境取证和国际责任问题已由本条解决，仍需结合专门法与适用的国际规则。\u003c/p>\n\u003cp>\u003cstrong>比较法上的共同问题。\u003c/strong> 网络治理需要协调安全、创新发展、权利保障与监管权限。具体比较可考察网络事件报告、关键信息基础设施保护、数据处理规则和执法监督；不同制度的适用对象与触发条件需要分别辨明。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>数据泄露案例补充。\u003c/strong> 四川省公安厅2023年通报记载，某单位违规向第三方提供数据，后因第三方服务器被入侵发生泄露，并存在网络安全管理问题。它提示本条的技术防护任务还涉及数据交付、外包管理与内部责任，而不只针对发布信息的个人。\u003ca href=\"https://gat.sc.gov.cn/scgat/c103399/2023/4/14/53b7429e2268426d84ddca8e6b900136.shtml\">公安厅通报案例5\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>程序阶段辨析。\u003c/strong> 《国家安全法释义与适用》第71页所引张某社交平台案只记载被采取强制措施，未说明最终裁判；可作风险讨论材料，不能当作已定罪判例。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：如何在网络安全审查、重要系统运行、数据流动和个人信息保护之间建立清楚分工，并避免不同监管目标相互替代？\u003c/li>\n\u003c/ul>\n"},{"num":26,"label":"第二十六条","title":"民族领域的国家安全任务","lawText":"国家坚持和完善民族区域自治制度，巩固和发展平等团结互助和谐的社会主义民族关系。坚持各民族一律平等，加强民族交往、交流、交融，防范、制止和依法惩治民族分裂活动，维护国家统一、民族团结和社会和谐，实现各民族共同团结奋斗、共同繁荣发展。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第二十六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家坚持和完善民族区域自治制度，巩固和发展平等团结互助和谐的社会主义民族关系。坚持各民族一律平等，加强民族交往、交流、交融，防范、制止和依法惩治民族分裂活动，维护国家统一、民族团结和社会和谐，实现各民族共同团结奋斗、共同繁荣发展。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第二十六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家坚持和完善民族区域自治制度，巩固和发展平等团结互助和谐的社会主义民族关系。坚持各民族一律平等，加强民族交往、交流、交融，防范、制止和依法惩治民族分裂活动，维护国家统一、民族团结和社会和谐，实现各民族共同团结奋斗、共同繁荣发展。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">民族领域的国家安全任务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条把制度保障、平等原则、民族交往、依法防治分裂活动和共同发展相衔接。不可只取其中惩治性内容而省略平等、自治与发展要求。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>宪法与民族区域自治制度是制度基础。\u003c/strong> 各民族一律平等、在国家统一领导下实行民族区域自治，是本条的制度前提。国家统一领导与自治地方依法行使自治权应当同时落实，并通过法治保障民族事务治理。\u003c/p>\n\u003cp>\u003cstrong>三审前有明确范围调整。\u003c/strong> 2015年6月24日《审议结果的报告》记载，二次审议稿第21条使用“维护民族地区社会安定和祖国统一”的表述。有委员指出，促进民族团结、防范和依法惩治民族分裂活动，是对全国各地的要求，不只针对民族地区；法律委员会建议改为“维护国家统一、民族团结和社会安定”。见甲书附录四第383页（PDF396页）。\u003c/p>\n\u003cp>\u003cstrong>审议建议与最后定稿不能混同。\u003c/strong> 最终第26条使用“社会和谐”，而上述报告建议文本为“社会安定”。现有附录没有解释这后一处措辞变化的具体理由，应如实保留差异，不虚构修改动机。\u003c/p>\n\u003cp>\u003cstrong>2026年专门立法。\u003c/strong> 《民族团结进步促进法》于2026年3月12日通过、7月1日起施行。其共有精神家园、交往交流交融、共同繁荣发展及保障监督等规定，是研究本条后续制度发展的重要材料；不应将新法内容倒写为2015年本条原有文字。\u003ca href=\"https://www.neac.gov.cn/seac/xwzx/202603/1187637.shtml\">国家民委公布的法律全文\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>民族区域自治是制度保障。\u003c/strong> 在国家统一领导下，少数民族聚居地方实行区域自治，设立自治机关并行使自治权。国家应依法保障自治机关与自治权，并在政策制定中考虑少数民族和自治地方实际。\u003c/li>\n\u003cli>\u003cstrong>各民族一律平等是根本原则。\u003c/strong> 各民族不分人口规模和经济文化发展状况，享有平等的政治、法律地位。国家应反对民族歧视和压迫、保障各族群众合法权益，不能以维护安全为由给某一民族成员预设违法嫌疑。\u003c/li>\n\u003cli>\u003cstrong>平等团结互助和谐是关系目标。\u003c/strong> 对涉及民族因素的矛盾纠纷，应依法处理具体纠纷，维护各族群众合法权益，并辨别普通社会矛盾与民族分裂活动。\u003c/li>\n\u003cli>\u003cstrong>交往、交流、交融是实践途径。\u003c/strong> 尊重民族差异、风俗和群众选择，完善基层服务、流动人口服务和相互嵌入的社区环境，可以增进相互了解、减少误解，促进文化、经济和社会互动。其落实涉及具体公共服务与社会参与机会。\u003c/li>\n\u003cli>\u003cstrong>防范、制止、依法惩治民族分裂活动。\u003c/strong> 这是本条的安全防卫面向。主体、行为、主观要件和责任形式仍须由有关法律具体确定，不能仅从民族身份、文化活动或一般纠纷推导出分裂行为。\u003c/li>\n\u003cli>\u003cstrong>共同繁荣发展具有安全基础意义。\u003c/strong> 缩小地区发展差距、增强基本公共服务能力、增进群众福祉和推进兴边富民，可以改善共同发展的社会条件，为长期安全提供基础。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>制度保障与危害防治并重。\u003c/strong> 本条同时有建设性义务与禁止性任务。自治权、平等参与、公共服务和共同发展构成其正面内容；惩治分裂活动服务于共同生活秩序。把整条缩写成“打击民族分裂”，会遗漏多数规范内容。\u003c/p>\n\u003cp>\u003cstrong>形式平等与发展支持〔笔记分析〕。\u003c/strong> 各民族享有平等法律地位，与对发展条件薄弱地区给予必要支持，并不当然矛盾。具体措施应结合真实差距、法定目的和实施效果评价，既防止歧视，也关注实质参与机会。\u003c/p>\n\u003cp>\u003cstrong>依法辨别行为，避免身份替代证明〔体系解释〕。\u003c/strong> 本条与第7条人权保障、第13条依法追责合读，应区分民族文化表达、普通社会纠纷与法定违法犯罪。某案涉及少数民族地区或民族因素，不足以证明该案必然属于“民族分裂活动”。\u003c/p>\n\u003cp>比较法研究可以自治权安排、平等保障与国家统一的关系为维度。联邦制、地方自治与我国民族区域自治在制度基础、权力来源和权限结构上存在差别，需要逐项比较。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>供应链审核咨询案。\u003c/strong> 据报道，一家咨询公司在涉疆调查项目中产生国家安全风险，负责人受到国家安全机关处罚，公司被责令整改，处理依据为反间谍相关法律规范。案例来源：杜洋、董凡超《增强国家安全意识 筑牢国家安全防线》，《法治日报》2023年4月15日第3版；乙书第73—74页转引。\u003c/li>\n\u003cli>\u003cstrong>案例关联程度有限。\u003c/strong> 该材料可说明跨境咨询与涉民族问题的信息活动可能发生国家安全争议；它没有给出完整处罚决定、具体条款和证据，也没有说明负责人被认定实施民族分裂犯罪。因此，不宜称其为第26条“民族分裂罪判例”，更不能由此推导所有供应链审核或相关调查一概违法。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：在处理具有民族因素的纠纷时，如何使法律评价针对具体行为和证据，同时兑现平等保护、自治保障与共同发展的要求？\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条把制度保障、平等原则、民族交往、依法防治分裂活动和共同发展相衔接。不可只取其中惩治性内容而省略平等、自治与发展要求。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>宪法与民族区域自治制度是制度基础。\u003c/strong> 各民族一律平等、在国家统一领导下实行民族区域自治，是本条的制度前提。国家统一领导与自治地方依法行使自治权应当同时落实，并通过法治保障民族事务治理。\u003c/p>\n\u003cp>\u003cstrong>三审前有明确范围调整。\u003c/strong> 2015年6月24日《审议结果的报告》记载，二次审议稿第21条使用“维护民族地区社会安定和祖国统一”的表述。有委员指出，促进民族团结、防范和依法惩治民族分裂活动，是对全国各地的要求，不只针对民族地区；法律委员会建议改为“维护国家统一、民族团结和社会安定”。见甲书附录四第383页（PDF396页）。\u003c/p>\n\u003cp>\u003cstrong>审议建议与最后定稿不能混同。\u003c/strong> 最终第26条使用“社会和谐”，而上述报告建议文本为“社会安定”。现有附录没有解释这后一处措辞变化的具体理由，应如实保留差异，不虚构修改动机。\u003c/p>\n\u003cp>\u003cstrong>2026年专门立法。\u003c/strong> 《民族团结进步促进法》于2026年3月12日通过、7月1日起施行。其共有精神家园、交往交流交融、共同繁荣发展及保障监督等规定，是研究本条后续制度发展的重要材料；不应将新法内容倒写为2015年本条原有文字。\u003ca href=\"https://www.neac.gov.cn/seac/xwzx/202603/1187637.shtml\">国家民委公布的法律全文\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>民族区域自治是制度保障。\u003c/strong> 在国家统一领导下，少数民族聚居地方实行区域自治，设立自治机关并行使自治权。国家应依法保障自治机关与自治权，并在政策制定中考虑少数民族和自治地方实际。\u003c/li>\n\u003cli>\u003cstrong>各民族一律平等是根本原则。\u003c/strong> 各民族不分人口规模和经济文化发展状况，享有平等的政治、法律地位。国家应反对民族歧视和压迫、保障各族群众合法权益，不能以维护安全为由给某一民族成员预设违法嫌疑。\u003c/li>\n\u003cli>\u003cstrong>平等团结互助和谐是关系目标。\u003c/strong> 对涉及民族因素的矛盾纠纷，应依法处理具体纠纷，维护各族群众合法权益，并辨别普通社会矛盾与民族分裂活动。\u003c/li>\n\u003cli>\u003cstrong>交往、交流、交融是实践途径。\u003c/strong> 尊重民族差异、风俗和群众选择，完善基层服务、流动人口服务和相互嵌入的社区环境，可以增进相互了解、减少误解，促进文化、经济和社会互动。其落实涉及具体公共服务与社会参与机会。\u003c/li>\n\u003cli>\u003cstrong>防范、制止、依法惩治民族分裂活动。\u003c/strong> 这是本条的安全防卫面向。主体、行为、主观要件和责任形式仍须由有关法律具体确定，不能仅从民族身份、文化活动或一般纠纷推导出分裂行为。\u003c/li>\n\u003cli>\u003cstrong>共同繁荣发展具有安全基础意义。\u003c/strong> 缩小地区发展差距、增强基本公共服务能力、增进群众福祉和推进兴边富民，可以改善共同发展的社会条件，为长期安全提供基础。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>制度保障与危害防治并重。\u003c/strong> 本条同时有建设性义务与禁止性任务。自治权、平等参与、公共服务和共同发展构成其正面内容；惩治分裂活动服务于共同生活秩序。把整条缩写成“打击民族分裂”，会遗漏多数规范内容。\u003c/p>\n\u003cp>\u003cstrong>形式平等与发展支持〔笔记分析〕。\u003c/strong> 各民族享有平等法律地位，与对发展条件薄弱地区给予必要支持，并不当然矛盾。具体措施应结合真实差距、法定目的和实施效果评价，既防止歧视，也关注实质参与机会。\u003c/p>\n\u003cp>\u003cstrong>依法辨别行为，避免身份替代证明〔体系解释〕。\u003c/strong> 本条与第7条人权保障、第13条依法追责合读，应区分民族文化表达、普通社会纠纷与法定违法犯罪。某案涉及少数民族地区或民族因素，不足以证明该案必然属于“民族分裂活动”。\u003c/p>\n\u003cp>比较法研究可以自治权安排、平等保障与国家统一的关系为维度。联邦制、地方自治与我国民族区域自治在制度基础、权力来源和权限结构上存在差别，需要逐项比较。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>供应链审核咨询案。\u003c/strong> 据报道，一家咨询公司在涉疆调查项目中产生国家安全风险，负责人受到国家安全机关处罚，公司被责令整改，处理依据为反间谍相关法律规范。案例来源：杜洋、董凡超《增强国家安全意识 筑牢国家安全防线》，《法治日报》2023年4月15日第3版；乙书第73—74页转引。\u003c/li>\n\u003cli>\u003cstrong>案例关联程度有限。\u003c/strong> 该材料可说明跨境咨询与涉民族问题的信息活动可能发生国家安全争议；它没有给出完整处罚决定、具体条款和证据，也没有说明负责人被认定实施民族分裂犯罪。因此，不宜称其为第26条“民族分裂罪判例”，更不能由此推导所有供应链审核或相关调查一概违法。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：在处理具有民族因素的纠纷时，如何使法律评价针对具体行为和证据，同时兑现平等保护、自治保障与共同发展的要求？\u003c/li>\n\u003c/ul>\n"},{"num":27,"label":"第二十七条","title":"宗教信仰保护与宗教领域的国家安全任务","lawText":"国家依法保护公民宗教信仰自由和正常宗教活动，坚持宗教独立自主自办的原则，防范、制止和依法惩治利用宗教名义进行危害国家安全的违法犯罪活动，反对境外势力干涉境内宗教事务，维护正常宗教活动秩序。\n\n国家依法取缔邪教组织，防范、制止和依法惩治邪教违法犯罪活动。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第二十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家依法保护公民宗教信仰自由和正常宗教活动，坚持宗教独立自主自办的原则，防范、制止和依法惩治利用宗教名义进行危害国家安全的违法犯罪活动，反对境外势力干涉境内宗教事务，维护正常宗教活动秩序。\u003c/p>\n\u003cp>国家依法取缔邪教组织，防范、制止和依法惩治邪教违法犯罪活动。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第二十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家依法保护公民宗教信仰自由和正常宗教活动，坚持宗教独立自主自办的原则，防范、制止和依法惩治利用宗教名义进行危害国家安全的违法犯罪活动，反对境外势力干涉境内宗教事务，维护正常宗教活动秩序。\u003c/p>\n\u003cp>国家依法取缔邪教组织，防范、制止和依法惩治邪教违法犯罪活动。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">宗教信仰保护与宗教领域的国家安全任务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>第一款包含宗教信仰与正常宗教活动保护、独立自主自办、依法防治危害行为和秩序维护；第二款专门规定依法取缔邪教组织及防治相关违法犯罪。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>宪法上的自由与边界。\u003c/strong> 《宪法》第36条规定，公民享有宗教信仰自由，不得强制信教或不信教、不得歧视；国家保护正常宗教活动，同时禁止利用宗教实施破坏社会秩序、损害身体健康、妨碍国家教育制度的活动，宗教团体和宗教事务不受外国势力支配。本条是在国家安全任务中具体承接这些规范要求。\u003c/p>\n\u003cp>\u003cstrong>既有宗教事务和反邪教规范。\u003c/strong> 当时《宗教事务条例》与全国人大常委会《关于取缔邪教组织、防范和惩治邪教活动的决定》，已规定相关管理任务和行为要求。本条在综合性安全法中予以归纳，并与专门制度衔接。\u003c/p>\n\u003cp>现有立法附录没有交代本条具体的逐稿修改。历史条例的条号和管理规则，应与后续修订区分。\u003c/p>\n\u003cp>\u003cstrong>后续条例修订。\u003c/strong> 《宗教事务条例》于2017年6月14日修订通过，自2018年2月1日起施行。研读宗教团体、活动场所、教职人员及权利救济等具体制度，应使用修订文本对应条款。\u003ca href=\"https://app.www.gov.cn/govdata/gov/201709/07/411212/article.html\">国务院公布的修订条例\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>保护宗教信仰自由是首要任务。\u003c/strong> 国家应制止非法干涉信仰自由、保护信教群众正常宗教生活，促进信教和不信教群众团结。本条的安全目的须与基本权利保护义务一起理解。\u003c/li>\n\u003cli>\u003cstrong>保护涵盖信教与不信教双方。\u003c/strong> 宗教信仰自由不仅是选择宗教，也包括不信仰宗教；国家机关、社会团体和个人均不得强制或歧视。这一点使本条与一般的秩序维护条文有所不同。\u003c/li>\n\u003cli>\u003cstrong>独立自主自办防止外部支配。\u003c/strong> 这一原则维护我国宗教事务的自主性，同时可以与宗教界正常对外交往、增进相互了解和友谊相容。\u003c/li>\n\u003cli>\u003cstrong>防治对象是利用宗教名义实施的危害国家安全违法犯罪。\u003c/strong> 例如，借宗教名义实施分裂或暴力恐怖活动。评价时应辨别实际行为，不能把宗教信仰本身或一般宗教活动直接视为危害行为。\u003c/li>\n\u003cli>\u003cstrong>维护正常活动秩序要求依法管理。\u003c/strong> 宗教团体、教职人员、场所和活动的规范管理，以及涉宗教纠纷处理，均须依照法定权限、措施和程序进行。\u003c/li>\n\u003cli>\u003cstrong>第二款规定依法取缔与依法追责。\u003c/strong> 对组织者、策划者、指挥者及构成犯罪的骨干人员，应依法追究责任；对被蒙骗者，可采取教育、劝解和救助等方法。组织的认定、取缔与个人刑事责任是相关但不同的问题，仍应分别依法处理。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>信仰、活动与违法行为需要分层评价〔笔记分析〕。\u003c/strong> 内心信仰、外部宗教活动、借宗教名义实施的违法行为，并非同一层次。研究限制措施时，应先明确对象、具体行为和法律依据，再判断其是否满足维护安全的实际需要，避免因对某种信仰不认同而替代违法性判断。\u003c/p>\n\u003cp>\u003cstrong>“正常宗教活动”的解释具有权利保障意义。\u003c/strong> 本条没有给出这一概念的完整定义。应结合宪法保护宗教自由的目的、相关专门规范及具体事实解释，不能仅把未经充分说明的管理偏好当成判断标准。具体措施还应与第7条法治和人权原则、第83条依法及实际需要限度相衔接。\u003c/p>\n\u003cp>\u003cstrong>宗教独立与国际交流并存。\u003c/strong> 文化、学术和信仰交流，与境外力量控制、支配、干涉宗教事务，具有不同性质。二者区别应由实际行为与法律关系确定，不能只看是否有境外联系。\u003c/p>\n\u003cp>\u003cstrong>反邪教与宗教自由保护应区分对象。\u003c/strong> 第二款不能被理解为授权任意把不熟悉的宗教、非主流信仰或普通信徒等同于邪教违法犯罪。是否属于依法认定的组织、个人实施何种行为、是否符合相应责任要件，应分别查明。此为结合两款结构与第7条所作的笔记分析。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>餐厅故意杀人案。\u003c/strong> “全能神”有关人员在餐厅索要联系方式遭拒后伤害并杀死被害人，部分被告人被以故意杀人罪、利用邪教组织破坏法律实施罪数罪并罚。它显示宗教或组织名义不能成为实施暴力侵害的免责理由，也说明生命保护和依法追究刑事责任是具体评价重点。案例来源为\u003ca href=\"https://www.court.gov.cn/zixun/xiangqing/339541.html\">最高法公布的平安中国建设第一批典型案例\u003c/a>，乙书第76页转引。\u003c/li>\n\u003cli>\u003cstrong>归责依据与时点\u003c/strong>：官方材料记载案发于2014年5月28日，早于本法施行。其法律评价依据是故意杀人等具体罪名；放在本条下研读，是说明生命保护、组织治理与刑事责任的关系。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：在维护正常宗教活动秩序时，如何让信教与不信教者都能预见自身权利、义务和可获得的救济，并清楚区分依法保护与依法限制的条件？\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>第一款包含宗教信仰与正常宗教活动保护、独立自主自办、依法防治危害行为和秩序维护；第二款专门规定依法取缔邪教组织及防治相关违法犯罪。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>宪法上的自由与边界。\u003c/strong> 《宪法》第36条规定，公民享有宗教信仰自由，不得强制信教或不信教、不得歧视；国家保护正常宗教活动，同时禁止利用宗教实施破坏社会秩序、损害身体健康、妨碍国家教育制度的活动，宗教团体和宗教事务不受外国势力支配。本条是在国家安全任务中具体承接这些规范要求。\u003c/p>\n\u003cp>\u003cstrong>既有宗教事务和反邪教规范。\u003c/strong> 当时《宗教事务条例》与全国人大常委会《关于取缔邪教组织、防范和惩治邪教活动的决定》，已规定相关管理任务和行为要求。本条在综合性安全法中予以归纳，并与专门制度衔接。\u003c/p>\n\u003cp>现有立法附录没有交代本条具体的逐稿修改。历史条例的条号和管理规则，应与后续修订区分。\u003c/p>\n\u003cp>\u003cstrong>后续条例修订。\u003c/strong> 《宗教事务条例》于2017年6月14日修订通过，自2018年2月1日起施行。研读宗教团体、活动场所、教职人员及权利救济等具体制度，应使用修订文本对应条款。\u003ca href=\"https://app.www.gov.cn/govdata/gov/201709/07/411212/article.html\">国务院公布的修订条例\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>保护宗教信仰自由是首要任务。\u003c/strong> 国家应制止非法干涉信仰自由、保护信教群众正常宗教生活，促进信教和不信教群众团结。本条的安全目的须与基本权利保护义务一起理解。\u003c/li>\n\u003cli>\u003cstrong>保护涵盖信教与不信教双方。\u003c/strong> 宗教信仰自由不仅是选择宗教，也包括不信仰宗教；国家机关、社会团体和个人均不得强制或歧视。这一点使本条与一般的秩序维护条文有所不同。\u003c/li>\n\u003cli>\u003cstrong>独立自主自办防止外部支配。\u003c/strong> 这一原则维护我国宗教事务的自主性，同时可以与宗教界正常对外交往、增进相互了解和友谊相容。\u003c/li>\n\u003cli>\u003cstrong>防治对象是利用宗教名义实施的危害国家安全违法犯罪。\u003c/strong> 例如，借宗教名义实施分裂或暴力恐怖活动。评价时应辨别实际行为，不能把宗教信仰本身或一般宗教活动直接视为危害行为。\u003c/li>\n\u003cli>\u003cstrong>维护正常活动秩序要求依法管理。\u003c/strong> 宗教团体、教职人员、场所和活动的规范管理，以及涉宗教纠纷处理，均须依照法定权限、措施和程序进行。\u003c/li>\n\u003cli>\u003cstrong>第二款规定依法取缔与依法追责。\u003c/strong> 对组织者、策划者、指挥者及构成犯罪的骨干人员，应依法追究责任；对被蒙骗者，可采取教育、劝解和救助等方法。组织的认定、取缔与个人刑事责任是相关但不同的问题，仍应分别依法处理。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>信仰、活动与违法行为需要分层评价〔笔记分析〕。\u003c/strong> 内心信仰、外部宗教活动、借宗教名义实施的违法行为，并非同一层次。研究限制措施时，应先明确对象、具体行为和法律依据，再判断其是否满足维护安全的实际需要，避免因对某种信仰不认同而替代违法性判断。\u003c/p>\n\u003cp>\u003cstrong>“正常宗教活动”的解释具有权利保障意义。\u003c/strong> 本条没有给出这一概念的完整定义。应结合宪法保护宗教自由的目的、相关专门规范及具体事实解释，不能仅把未经充分说明的管理偏好当成判断标准。具体措施还应与第7条法治和人权原则、第83条依法及实际需要限度相衔接。\u003c/p>\n\u003cp>\u003cstrong>宗教独立与国际交流并存。\u003c/strong> 文化、学术和信仰交流，与境外力量控制、支配、干涉宗教事务，具有不同性质。二者区别应由实际行为与法律关系确定，不能只看是否有境外联系。\u003c/p>\n\u003cp>\u003cstrong>反邪教与宗教自由保护应区分对象。\u003c/strong> 第二款不能被理解为授权任意把不熟悉的宗教、非主流信仰或普通信徒等同于邪教违法犯罪。是否属于依法认定的组织、个人实施何种行为、是否符合相应责任要件，应分别查明。此为结合两款结构与第7条所作的笔记分析。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>餐厅故意杀人案。\u003c/strong> “全能神”有关人员在餐厅索要联系方式遭拒后伤害并杀死被害人，部分被告人被以故意杀人罪、利用邪教组织破坏法律实施罪数罪并罚。它显示宗教或组织名义不能成为实施暴力侵害的免责理由，也说明生命保护和依法追究刑事责任是具体评价重点。案例来源为\u003ca href=\"https://www.court.gov.cn/zixun/xiangqing/339541.html\">最高法公布的平安中国建设第一批典型案例\u003c/a>，乙书第76页转引。\u003c/li>\n\u003cli>\u003cstrong>归责依据与时点\u003c/strong>：官方材料记载案发于2014年5月28日，早于本法施行。其法律评价依据是故意杀人等具体罪名；放在本条下研读，是说明生命保护、组织治理与刑事责任的关系。\u003c/li>\n\u003cli>\u003cstrong>研究问题\u003c/strong>：在维护正常宗教活动秩序时，如何让信教与不信教者都能预见自身权利、义务和可获得的救济，并清楚区分依法保护与依法限制的条件？\u003c/li>\n\u003c/ul>\n"},{"num":28,"label":"第二十八条","title":"反恐怖主义、反极端主义与能力建设","lawText":"国家反对一切形式的恐怖主义和极端主义，加强防范和处置恐怖主义的能力建设，依法开展情报、调查、防范、处置以及资金监管等工作，依法取缔恐怖活动组织和严厉惩治暴力恐怖活动。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第二十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家反对一切形式的恐怖主义和极端主义，加强防范和处置恐怖主义的能力建设，依法开展情报、调查、防范、处置以及资金监管等工作，依法取缔恐怖活动组织和严厉惩治暴力恐怖活动。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第二十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家反对一切形式的恐怖主义和极端主义，加强防范和处置恐怖主义的能力建设，依法开展情报、调查、防范、处置以及资金监管等工作，依法取缔恐怖活动组织和严厉惩治暴力恐怖活动。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">反恐怖主义、反极端主义与能力建设 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定的任务具有三层结构：反对恐怖主义、极端主义的基本立场；建立预防与处置能力；依法开展具体工作、取缔组织并追究违法犯罪责任。条文中的两处“依法”约束具体措施及组织处理、责任追究，不能省略。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>先于本法的制度背景。\u003c/strong> 反恐制度从国际合作和国内立法两方面发展：2001年《打击恐怖主义、分裂主义和极端主义上海公约》体现跨国反恐合作；2011年全国人大常委会《关于加强反恐怖工作有关问题的决定》规定恐怖活动概念、反恐工作机构、组织和人员认定、相关资产冻结及国际合作。这些构成2015年《国家安全法》制定前的制度基础。\u003c/p>\n\u003cp>\u003cstrong>本法通过后的配套展开。\u003c/strong> 2015年8月通过的《刑法修正案（九）》进一步完善相关犯罪规定；2015年12月通过、2016年1月1日起施行的《反恐怖主义法》系统规定反恐工作机制、防范、情报、调查、处置、保障及责任，并替代2011年有关决定。这些专门制度进一步落实本条任务，时间上晚于2015年7月《国家安全法》的通过。\u003c/p>\n\u003cp>\u003cstrong>后续修正。\u003c/strong> 《反恐怖主义法》于2018年4月27日修正。研读本条的具体措施时，应将其作为主要专门法之一，并注意本法的总体任务与专门法的措施条件、程序和责任之间的分工。\u003ca href=\"https://www.miit.gov.cn/jgsj/zfs/fl/art/2022/art_2c79fa5f17834377afffd4cc359392bf.html\">2018年修正文本\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>立法风险背景。\u003c/strong> 2014年昆明火车站暴力恐怖案件暴露了人员密集公共场所和公众生命安全面临的风险，凸显加强防范、情报协作和协同处置的必要性。该案发生及主要裁判均先于本法，应作为立法背景和实践材料理解。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>正确区分概念及责任层次。\u003c/strong> 按照《反恐怖主义法》的定义，恐怖主义是以政治、意识形态等目的为指向，通过暴力、破坏、恐吓等手段制造社会恐慌、危害公共安全、侵害人身财产或者胁迫国家机关、国际组织的主张和行为。具体法律上还要区分恐怖活动、恐怖活动组织和恐怖活动人员。组织、策划、准备、宣传、煽动、资助等可能分别进入法律规制，不能把恐怖活动缩减为已经发生的袭击。是否构成犯罪以及构成何罪，仍取决于刑法规定和案件事实；不是任何被称为“极端”的言行都已满足犯罪构成。\u003c/li>\n\u003cli>\u003cstrong>能力建设贯穿预防和处置全过程。\u003c/strong> 能力建设包括工作机制、专业队伍、技术设施、预案和国际合作，具体落实于宣传教育、服务行业安全查验、危险物品管理、重点目标保护、边境与出入境防范、境外机构及人员保护等。人员、信息、设施和跨部门协调必须在平时准备，不能等到事件发生后才建立。\u003c/li>\n\u003cli>\u003cstrong>情报、防范、调查相互衔接，法律性质各有区别。\u003c/strong> 跨部门、跨地区的信息报送、研判和紧急通报有助于提前发现风险；但“获取线索—行政调查—刑事立案侦查”并非同一程序。采用技术手段、采集信息、查询或冻结财产、限制活动等具体措施，应分别查明法定机关、适用条件、批准手续、期限和退出规则。技术侦察资料有用途限制，国家秘密、商业秘密和个人信息亦受保密规则约束。\u003c/li>\n\u003cli>\u003cstrong>应对处置以统一指挥和保护人员为重点。\u003c/strong> 恐怖事件应对包括预案启动、组织指挥、现场控制与救援、信息发布、恢复重建等环节。应区分危险控制措施与人员救助措施，并优先保护直接受威胁人员的人身安全；事件后还要查明情况、恢复生产生活、补偿援助、总结评估。具体警械武器使用、交通通信管制等权限和程序由专门法律规定，本条只确立总体任务。\u003c/li>\n\u003cli>\u003cstrong>资金监管是预防链条的一部分。\u003c/strong> 涉嫌恐怖融资调查、资产冻结、金融与特定非金融机构协作，使监管延伸到支持恐怖活动的资金和财产。资产冻结具有控制财产处分的功能，不能与刑事没收、最终财产权剥夺混同；应分别确认认定依据、冻结决定、解除及救济机制。\u003c/li>\n\u003cli>\u003cstrong>取缔组织与惩治犯罪须由具体规范实施。\u003c/strong> 实施本条须衔接刑法中的组织、领导、参加恐怖组织及资助、准备、宣传煽动等犯罪规定，刑事诉讼中的管辖、侦查和证人保护，以及反洗钱、武警任务等制度。各项程序特别规则有各自的前提，本条既不新增独立罪名，也不直接决定具体刑罚。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>预防型治理与依法限制权力〔笔记分析〕。\u003c/strong> 本条把情报、防范、调查放在严重损害之前，体现国家安全法的预防功能。但风险线索不等于有罪证明；越是前移到准备行为和风险阶段，越需要区分危险判断、行政措施条件和刑事证明要求。应同第7条权利保障、第9条预防原则、第83条特别措施的实际需要限度合读。\u003c/p>\n\u003cp>\u003cstrong>恐怖主义与民族、宗教身份的区分。\u003c/strong> 法律识别和处置的对象是符合法定条件的行为和组织，民族身份或正常宗教信仰本身不是认定恐怖活动的依据。不能从个案推导整个民族或宗教群体具有危险性，案件涉及的地域信息也不能充当个体责任证据。保护正常宗教需求、区分具体违法活动与信教群众，是准确实施本条的必要前提。\u003c/p>\n\u003cp>\u003cstrong>跨境合作仍须有法律机制。\u003c/strong> 国际公约、情报协作、境外利益保护和赴境外处置，为应对跨境恐怖活动提供合作途径。国际合作并不使国内机关自动取得在外国境内执法的权限；应另行判断条约、国际法、相关国家同意以及国内授权等条件。这是第10条共同安全与第28条专门任务的联系。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>案例：2014年昆明火车站暴力恐怖案。\u003c/strong> 最高人民法院发布材料记载，对组织、领导或参加恐怖组织并实施故意杀人的被告分别定罪并罚。学习重点是组织行为与杀人行为的法律评价，及公共场所预防、救助的重要性。案例发生和主要裁判均先于本法，发布材料的“法律链接”不能当成原案判决全部适用法源。\u003ca href=\"https://www.court.gov.cn/zixun/xiangqing/90482.html\">最高人民法院《三起涉国家安全典型案例》\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>研究问题。\u003c/strong> 反恐情报用于一般行政执法或者其他刑事案件时，有何用途限制？风险预防措施何时应当解除？跨部门共享信息时如何落实责任和救济？\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定的任务具有三层结构：反对恐怖主义、极端主义的基本立场；建立预防与处置能力；依法开展具体工作、取缔组织并追究违法犯罪责任。条文中的两处“依法”约束具体措施及组织处理、责任追究，不能省略。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>先于本法的制度背景。\u003c/strong> 反恐制度从国际合作和国内立法两方面发展：2001年《打击恐怖主义、分裂主义和极端主义上海公约》体现跨国反恐合作；2011年全国人大常委会《关于加强反恐怖工作有关问题的决定》规定恐怖活动概念、反恐工作机构、组织和人员认定、相关资产冻结及国际合作。这些构成2015年《国家安全法》制定前的制度基础。\u003c/p>\n\u003cp>\u003cstrong>本法通过后的配套展开。\u003c/strong> 2015年8月通过的《刑法修正案（九）》进一步完善相关犯罪规定；2015年12月通过、2016年1月1日起施行的《反恐怖主义法》系统规定反恐工作机制、防范、情报、调查、处置、保障及责任，并替代2011年有关决定。这些专门制度进一步落实本条任务，时间上晚于2015年7月《国家安全法》的通过。\u003c/p>\n\u003cp>\u003cstrong>后续修正。\u003c/strong> 《反恐怖主义法》于2018年4月27日修正。研读本条的具体措施时，应将其作为主要专门法之一，并注意本法的总体任务与专门法的措施条件、程序和责任之间的分工。\u003ca href=\"https://www.miit.gov.cn/jgsj/zfs/fl/art/2022/art_2c79fa5f17834377afffd4cc359392bf.html\">2018年修正文本\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>立法风险背景。\u003c/strong> 2014年昆明火车站暴力恐怖案件暴露了人员密集公共场所和公众生命安全面临的风险，凸显加强防范、情报协作和协同处置的必要性。该案发生及主要裁判均先于本法，应作为立法背景和实践材料理解。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>正确区分概念及责任层次。\u003c/strong> 按照《反恐怖主义法》的定义，恐怖主义是以政治、意识形态等目的为指向，通过暴力、破坏、恐吓等手段制造社会恐慌、危害公共安全、侵害人身财产或者胁迫国家机关、国际组织的主张和行为。具体法律上还要区分恐怖活动、恐怖活动组织和恐怖活动人员。组织、策划、准备、宣传、煽动、资助等可能分别进入法律规制，不能把恐怖活动缩减为已经发生的袭击。是否构成犯罪以及构成何罪，仍取决于刑法规定和案件事实；不是任何被称为“极端”的言行都已满足犯罪构成。\u003c/li>\n\u003cli>\u003cstrong>能力建设贯穿预防和处置全过程。\u003c/strong> 能力建设包括工作机制、专业队伍、技术设施、预案和国际合作，具体落实于宣传教育、服务行业安全查验、危险物品管理、重点目标保护、边境与出入境防范、境外机构及人员保护等。人员、信息、设施和跨部门协调必须在平时准备，不能等到事件发生后才建立。\u003c/li>\n\u003cli>\u003cstrong>情报、防范、调查相互衔接，法律性质各有区别。\u003c/strong> 跨部门、跨地区的信息报送、研判和紧急通报有助于提前发现风险；但“获取线索—行政调查—刑事立案侦查”并非同一程序。采用技术手段、采集信息、查询或冻结财产、限制活动等具体措施，应分别查明法定机关、适用条件、批准手续、期限和退出规则。技术侦察资料有用途限制，国家秘密、商业秘密和个人信息亦受保密规则约束。\u003c/li>\n\u003cli>\u003cstrong>应对处置以统一指挥和保护人员为重点。\u003c/strong> 恐怖事件应对包括预案启动、组织指挥、现场控制与救援、信息发布、恢复重建等环节。应区分危险控制措施与人员救助措施，并优先保护直接受威胁人员的人身安全；事件后还要查明情况、恢复生产生活、补偿援助、总结评估。具体警械武器使用、交通通信管制等权限和程序由专门法律规定，本条只确立总体任务。\u003c/li>\n\u003cli>\u003cstrong>资金监管是预防链条的一部分。\u003c/strong> 涉嫌恐怖融资调查、资产冻结、金融与特定非金融机构协作，使监管延伸到支持恐怖活动的资金和财产。资产冻结具有控制财产处分的功能，不能与刑事没收、最终财产权剥夺混同；应分别确认认定依据、冻结决定、解除及救济机制。\u003c/li>\n\u003cli>\u003cstrong>取缔组织与惩治犯罪须由具体规范实施。\u003c/strong> 实施本条须衔接刑法中的组织、领导、参加恐怖组织及资助、准备、宣传煽动等犯罪规定，刑事诉讼中的管辖、侦查和证人保护，以及反洗钱、武警任务等制度。各项程序特别规则有各自的前提，本条既不新增独立罪名，也不直接决定具体刑罚。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>预防型治理与依法限制权力〔笔记分析〕。\u003c/strong> 本条把情报、防范、调查放在严重损害之前，体现国家安全法的预防功能。但风险线索不等于有罪证明；越是前移到准备行为和风险阶段，越需要区分危险判断、行政措施条件和刑事证明要求。应同第7条权利保障、第9条预防原则、第83条特别措施的实际需要限度合读。\u003c/p>\n\u003cp>\u003cstrong>恐怖主义与民族、宗教身份的区分。\u003c/strong> 法律识别和处置的对象是符合法定条件的行为和组织，民族身份或正常宗教信仰本身不是认定恐怖活动的依据。不能从个案推导整个民族或宗教群体具有危险性，案件涉及的地域信息也不能充当个体责任证据。保护正常宗教需求、区分具体违法活动与信教群众，是准确实施本条的必要前提。\u003c/p>\n\u003cp>\u003cstrong>跨境合作仍须有法律机制。\u003c/strong> 国际公约、情报协作、境外利益保护和赴境外处置，为应对跨境恐怖活动提供合作途径。国际合作并不使国内机关自动取得在外国境内执法的权限；应另行判断条约、国际法、相关国家同意以及国内授权等条件。这是第10条共同安全与第28条专门任务的联系。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>案例：2014年昆明火车站暴力恐怖案。\u003c/strong> 最高人民法院发布材料记载，对组织、领导或参加恐怖组织并实施故意杀人的被告分别定罪并罚。学习重点是组织行为与杀人行为的法律评价，及公共场所预防、救助的重要性。案例发生和主要裁判均先于本法，发布材料的“法律链接”不能当成原案判决全部适用法源。\u003ca href=\"https://www.court.gov.cn/zixun/xiangqing/90482.html\">最高人民法院《三起涉国家安全典型案例》\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>研究问题。\u003c/strong> 反恐情报用于一般行政执法或者其他刑事案件时，有何用途限制？风险预防措施何时应当解除？跨部门共享信息时如何落实责任和救济？\u003c/p>\n"},{"num":29,"label":"第二十九条","title":"社会矛盾化解、公共安全体系与突发事件应对","lawText":"国家健全有效预防和化解社会矛盾的体制机制，健全公共安全体系，积极预防、减少和化解社会矛盾，妥善处置公共卫生、社会安全等影响国家安全和社会稳定的突发事件，促进社会和谐，维护公共安全和社会安定。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第二十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全有效预防和化解社会矛盾的体制机制，健全公共安全体系，积极预防、减少和化解社会矛盾，妥善处置公共卫生、社会安全等影响国家安全和社会稳定的突发事件，促进社会和谐，维护公共安全和社会安定。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第二十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全有效预防和化解社会矛盾的体制机制，健全公共安全体系，积极预防、减少和化解社会矛盾，妥善处置公共卫生、社会安全等影响国家安全和社会稳定的突发事件，促进社会和谐，维护公共安全和社会安定。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">社会矛盾化解、公共安全体系与突发事件应对 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条同时规定日常制度建设和突发事件应对：前者着重预防、疏导与权益保障，后者着重依法采取应急措施。社会矛盾、公共安全、社会安全事件和国家安全不是可以不加区别地互换的概念。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>可以查证的定稿修改。\u003c/strong> 2015年6月30日法律委员会《关于〈中华人民共和国国家安全法（草案三次审议稿）〉修改意见的报告》记载，部分常委会组成人员认为，包括重大传染病疫情在内的公共卫生安全问题已经成为威胁国家安全的重要因素，建议明确规定。法律委员会据此建议将“妥善处置各类影响国家安全和社会稳定的突发事件”改为“妥善处置公共卫生、社会安全等影响国家安全和社会稳定的突发事件”。这是对公共卫生问题的有意突出，并非后来疫情发生后才添加。（甲书附录五第388—389页，PDF401—
