intro:{title:'国家安全法学概说',label:'学科入门',desc:'从法学角度出发，理解国家安全法治的整体结构。',overview:[['研究什么','国家安全法学关注维护国家安全过程中形成的法律关系。学习时，可以围绕保护利益、国家机关职责、公民与组织的义务和权利、风险预防制度及法律责任展开。'],['如何阅读法律体系','以宪法为根本依据，以《国家安全法》把握总体框架，再进入反间谍等专门领域。理解一般规定与特别规定的关系，是阅读相关法律的起点。'],['如何分析具体问题','先识别涉及的国家安全利益，再确定适用规范和实施主体，进而审查措施的条件、程序及限度，最后分析救济和责任。此处为学习方法归纳。']],map:[['规范基础','宪法依据 → 国家安全法 → 相关专门法律'],['基本问题','保护何种利益 · 谁承担职责 · 如何履行义务'],['制度运行','风险预防 · 调查处置 · 监督与救济'],['法治要求','依法履职 · 保障权利 · 遵守措施限度']],cards:[['国家安全法学可以围绕哪些问题展开？','保护利益、机关职责、公民与组织的义务和权利、风险预防制度及法律责任。','学习框架归纳'],['《国家安全法》与反间谍法如何衔接？','前者提供国家安全的一般制度框架，后者具体规范反间谍工作。分析问题时应结合一般规定与专门规定。','学习框架归纳'],['维护国家安全与保障权利如何联系？','维护国家安全应遵守宪法和法律，尊重和保障人权，依法保护公民权利和自由。','国家安全法第7条'],['分析国家安全措施时应注意哪些环节？','法律依据、实施主体、适用条件、实施程序、措施限度与救济途径。','学习方法归纳']],ref:'national',reading:'参考阅读：《国家安全法释义》《国家安全法释义与适用》。'},

const nationalArticles=[{"num":1,"label":"第一条","title":"立法目的与宪法依据","lawText":"为了维护国家安全，保卫人民民主专政的政权和中国特色社会主义制度，保护人民的根本利益，保障改革开放和社会主义现代化建设的顺利进行，实现中华民族伟大复兴，根据宪法，制定本法。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第一条</div><p class=\"article-law-text\">为了维护国家安全，保卫人民民主专政的政权和中国特色社会主义制度，保护人民的根本利益，保障改革开放和社会主义现代化建设的顺利进行，实现中华民族伟大复兴，根据宪法，制定本法。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第一条</div><p class=\"article-law-text\">为了维护国家安全，保卫人民民主专政的政权和中国特色社会主义制度，保护人民的根本利益，保障改革开放和社会主义现代化建设的顺利进行，实现中华民族伟大复兴，根据宪法，制定本法。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><h3>第一，维护国家安全是本法的总目标</h3>\n<p>第一条首先以“维护国家安全”概括整部法律的总目标。这里的“国家安全”不能仅按照传统的政治安全、军事安全理解，而应当结合第2条的法定定义加以把握。</p>\n<p>第2条将国家安全界定为国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展以及国家其他重大利益处于相对没有危险、不受内外威胁的状态，同时包括保障持续安全状态的能力。\n因此，第一条中的“维护国家安全”具有高度概括性，其具体内容需要通过第2条的概念规定以及第二章关于各领域国家安全任务的规定进一步展开。</p>\n<h3>第二，立法目的形成了多层次的保护结构</h3>\n<p>第一条在“维护国家安全”的总目标之下进一步列举四项具体目的，分别对应不同层次的国家安全利益。</p>\n<p><strong>其一，保卫人民民主专政的政权和中国特色社会主义制度。</strong><br />\n这一目的体现国家安全的政治基础，与第3条所规定的“以政治安全为根本”以及第15条关于政治安全任务的规定形成体系联系。</p>\n<p><strong>其二，保护人民的根本利益。</strong><br />\n人民利益不仅是国家安全的保护对象，也是国家安全工作的价值指向。第3条明确规定国家安全工作“以人民安全为宗旨”，第16条进一步要求国家维护和发展最广大人民的根本利益，保障公民生命财产安全和其他合法权益。</p>\n<p><strong>其三，保障改革开放和社会主义现代化建设顺利进行。</strong><br />\n国家安全与国家发展并非彼此独立。第8条明确要求维护国家安全与经济社会发展相协调。因此，国家安全制度既具有风险防范功能，也承担保障国家正常发展秩序和发展条件的功能。</p>\n<p><strong>其四，实现中华民族伟大复兴。</strong><br />\n这一表述将国家安全置于国家长期发展目标中，表明国家安全既关注现实风险，也关注国家长远发展的安全条件。</p>\n<p>由此，本条所形成的保护结构可以概括为：\n<strong>政治秩序 → 人民利益 → 发展条件 → 国家长远发展目标。</strong></p>\n<h3>第三，“根据宪法”不仅说明立法形式依据，也确立了国家安全法治的宪法边界</h3>\n<p>第一条明确规定“根据宪法，制定本法”。这一规定首先表明《国家安全法》的制定具有宪法依据。</p>\n<p>宪法中与国家安全直接相关的规范包括：公民维护国家统一的义务、遵守宪法和法律并保守国家秘密的义务，以及维护祖国安全、荣誉和利益的义务；同时，宪法也规定和保障公民的基本权利和自由。</p>\n<p>因此，“根据宪法”同时具有两方面意义：</p>\n<p>一方面，宪法为国家履行维护国家安全职责以及公民承担相应国家安全义务提供规范基础；</p>\n<p>另一方面，国家安全权力本身也必须在宪法和法律框架内运行。国家安全并不构成脱离法定权限和程序采取措施的独立理由。</p>\n<p>这一点在第7条中得到进一步确认。第7条要求维护国家安全必须遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。</p>\n<h3>第四，本法具有综合性和基础性的体系功能</h3>\n<p>2015年《国家安全法》并不试图以一部法律穷尽所有国家安全事项，而是从总体层面规定国家安全工作的基本原则、主要任务、职责体系、制度机制、保障措施以及公民和组织的权利义务。</p>\n<p>因此，本法与《反间谍法》《反恐怖主义法》《网络安全法》《数据安全法》《生物安全法》等专门领域立法之间形成“<strong>综合性基本规范＋专门领域规范</strong>”的制度结构。</p>\n<p>从这一意义上说，第一条不仅是目的条款，也提示了本法的体系定位：<strong>通过综合性国家安全立法确立共同的价值目标和基本制度框架，再由不同领域的专门法律具体化。</strong></p>\n<hr />\n<h2>四、法理与解释要点</h2>\n<h3>1. 目的解释：第一条是解释依据，但不是独立的权力授予规范</h3>\n<p>第一条具有重要的目的解释功能。当其他条文存在不同可能解释时，可以结合第一条判断某项制度所保护的国家安全利益，以及有关规范应当实现的制度目标。</p>\n<p>但应当区分<strong>立法目的规范</strong>与<strong>具体授权规范</strong>。</p>\n<p>第一条说明“为什么维护国家安全”，并不直接回答国家机关“可以采取什么措施”“在什么条件下可以采取措施”以及“应当遵循什么程序”。</p>\n<p>因此，查封、扣押、搜查、限制人身自由、行政处罚或者其他限制权利的措施，均应当具有相应的具体法律依据，并符合权限、条件和程序要求。不能仅以第一条所规定的“维护国家安全”为由推导出具体公权力。</p>\n<blockquote>\n<p><strong>解释规则：</strong></p>\n<p>目的条款可以帮助解释权力，但不能代替权力依据。</p>\n</blockquote>\n<h3>2. 国家保护义务与国家安全权力的法治约束</h3>\n<p>从法理上看，国家安全规范同时包含两个方向：</p>\n<p>一方面，国家负有维护国家安全、保护人民生命财产和其他重大利益的积极职责；</p>\n<p>另一方面，国家在履行安全保护职责时仍须遵守法治原则，并保护公民和组织的合法权益。</p>\n<p>这一结构在本法内部具有明确的体系依据。第一条规定“保护人民的根本利益”，第7条规定尊重和保障人权，第16条要求保障公民生命财产安全和其他合法权益，第66条进一步规定，国家安全危机管控措施应当与危害的性质、程度和范围相适应；存在多种措施时，应选择有利于最大程度保护公民、组织权益的措施。</p>\n<p>因此，维护国家安全与保护公民权利并非两个相互隔离的规范目标。<strong>国家安全措施的合法性判断，本身就应当包含对权限依据、必要程度和权益保护的审查。</strong></p>\n<h3>3. 比例原则在国家安全领域具有特殊意义</h3>\n<p>第66条体现了较为明确的比例控制思路：国家安全危机处置措施首先应当与风险的性质、程度和范围相适应；当存在多种可以实现目的的手段时，还应当优先选择对公民和组织权益保护程度更高的措施。</p>\n<p>据此，可以将国家安全措施的审查思路概括为：</p>\n<p><strong>目的正当 → 具有法定依据 → 手段与风险程度相适应 → 多种有效手段中选择权益损害较小者。</strong></p>\n<p>第一条所规定的国家安全目的因此不能单独完成合法性论证。即使某项措施确实有助于维护国家安全，也仍然需要进一步判断其权限依据、适用条件、程序要求以及对权利限制的程度。</p>\n<hr />\n<h2>五、关联条文与学习提示</h2>\n<h3>（一）核心关联条文</h3>\n<ul>\n<li><strong>第2条：国家安全的概念。</strong> 回答“什么是国家安全”。</li>\n<li><strong>第3条：总体国家安全观。</strong> 回答国家安全工作的基本指导思想和总体结构。</li>\n<li><strong>第7条：法治与人权保障。</strong> 确立国家安全措施的基本法治边界。</li>\n<li><strong>第8条：安全与发展的协调。</strong> 说明维护国家安全同时需要考虑经济社会发展。</li>\n<li><strong>第15条：政治安全。</strong> 具体展开第一条关于政权和制度安全的要求。</li>\n<li><strong>第16条：人民安全。</strong> 具体展开第一条关于保护人民根本利益的要求。</li>\n<li><strong>第66条：危机管控中的比例控制。</strong> 对限制公民、组织权益的国家安全危机措施提出适度性和权益保护要求。</li>\n</ul>\n<h3>（二）案例使用</h3>\n<p>第一条属于<strong>立法目的条款</strong>，本身通常不是具体案件中认定违法、定罪或者处罚的直接规范依据。</p>\n<p>学习本条时，可以结合危害国家安全犯罪、反间谍执法、国家安全审查或者国家安全危机管控等公开案例，观察第一条所列举的国家安全利益如何在具体制度中展开。</p>\n<p>但在分析具体案件时，应继续查找：</p>\n<p><strong>具体行为规范 → 权限依据 → 构成要件 → 程序规范 → 法律责任。</strong></p>\n<p>不能仅依据“维护国家安全”这一抽象目的完成法律评价。</p>\n<h3>（三）易错点</h3>\n<p><strong>易错点1：</strong> 2015年《国家安全法》是1993年《国家安全法》的修订版。<br />\n<strong>纠正：</strong> 1993年《国家安全法》在2014年制定《反间谍法》时已经废止；2015年另行制定现行《国家安全法》。</p>\n<p><strong>易错点2：</strong> 第一条可以直接作为国家机关采取国家安全措施的授权依据。<br />\n<strong>纠正：</strong> 第一条主要规定立法目的和立法依据。具体限制权利或者实施强制措施仍须具有具体法律授权。</p>\n<p><strong>易错点3：</strong> 国家安全与公民权利属于简单的对立关系。<br />\n<strong>纠正：</strong> 本法同时规定维护国家安全、保护人民利益、尊重保障人权以及危机处置中的权益保护要求，应当进行体系解释。</p>\n<hr />\n<h2>六、研究问题</h2>\n<ol>\n<li><p><strong>目的条款的规范效力边界。</strong> 第一条能够在多大程度上参与具体国家安全规范的解释？何时会发生从“目的解释”向“扩大公权力”的越界？</p>\n</li>\n<li><p><strong>多重立法目的之间的协调。</strong> 当某项国家安全措施能够促进特定安全利益，却同时对经济社会发展或者个人权利产生限制时，应如何协调第一条中的安全、人民利益和发展目标？</p>\n</li>\n<li><p><strong>安全目的与比例原则的关系。</strong> 第66条关于危机管控措施的规定能否反映国家安全法领域的一般比例控制要求？其适用范围是否能够通过体系解释扩展至危机管控以外的国家安全措施？</p>\n</li>\n<li><p><strong>综合性国家安全法与专门立法的关系。</strong> 当《国家安全法》与《反间谍法》《数据安全法》《生物安全法》等专门法律同时涉及某一事项时，应如何处理一般规范与专门规范之间的解释和适用关系？</p>\n</li>\n</ol></div></div>","notesHtml":"<h3>第一，维护国家安全是本法的总目标</h3>\n<p>第一条首先以“维护国家安全”概括整部法律的总目标。这里的“国家安全”不能仅按照传统的政治安全、军事安全理解，而应当结合第2条的法定定义加以把握。</p>\n<p>第2条将国家安全界定为国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展以及国家其他重大利益处于相对没有危险、不受内外威胁的状态，同时包括保障持续安全状态的能力。\n因此，第一条中的“维护国家安全”具有高度概括性，其具体内容需要通过第2条的概念规定以及第二章关于各领域国家安全任务的规定进一步展开。</p>\n<h3>第二，立法目的形成了多层次的保护结构</h3>\n<p>第一条在“维护国家安全”的总目标之下进一步列举四项具体目的，分别对应不同层次的国家安全利益。</p>\n<p><strong>其一，保卫人民民主专政的政权和中国特色社会主义制度。</strong><br />\n这一目的体现国家安全的政治基础，与第3条所规定的“以政治安全为根本”以及第15条关于政治安全任务的规定形成体系联系。</p>\n<p><strong>其二，保护人民的根本利益。</strong><br />\n人民利益不仅是国家安全的保护对象，也是国家安全工作的价值指向。第3条明确规定国家安全工作“以人民安全为宗旨”，第16条进一步要求国家维护和发展最广大人民的根本利益，保障公民生命财产安全和其他合法权益。</p>\n<p><strong>其三，保障改革开放和社会主义现代化建设顺利进行。</strong><br />\n国家安全与国家发展并非彼此独立。第8条明确要求维护国家安全与经济社会发展相协调。因此，国家安全制度既具有风险防范功能，也承担保障国家正常发展秩序和发展条件的功能。</p>\n<p><strong>其四，实现中华民族伟大复兴。</strong><br />\n这一表述将国家安全置于国家长期发展目标中，表明国家安全既关注现实风险，也关注国家长远发展的安全条件。</p>\n<p>由此，本条所形成的保护结构可以概括为：\n<strong>政治秩序 → 人民利益 → 发展条件 → 国家长远发展目标。</strong></p>\n<h3>第三，“根据宪法”不仅说明立法形式依据，也确立了国家安全法治的宪法边界</h3>\n<p>第一条明确规定“根据宪法，制定本法”。这一规定首先表明《国家安全法》的制定具有宪法依据。</p>\n<p>宪法中与国家安全直接相关的规范包括：公民维护国家统一的义务、遵守宪法和法律并保守国家秘密的义务，以及维护祖国安全、荣誉和利益的义务；同时，宪法也规定和保障公民的基本权利和自由。</p>\n<p>因此，“根据宪法”同时具有两方面意义：</p>\n<p>一方面，宪法为国家履行维护国家安全职责以及公民承担相应国家安全义务提供规范基础；</p>\n<p>另一方面，国家安全权力本身也必须在宪法和法律框架内运行。国家安全并不构成脱离法定权限和程序采取措施的独立理由。</p>\n<p>这一点在第7条中得到进一步确认。第7条要求维护国家安全必须遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。</p>\n<h3>第四，本法具有综合性和基础性的体系功能</h3>\n<p>2015年《国家安全法》并不试图以一部法律穷尽所有国家安全事项，而是从总体层面规定国家安全工作的基本原则、主要任务、职责体系、制度机制、保障措施以及公民和组织的权利义务。</p>\n<p>因此，本法与《反间谍法》《反恐怖主义法》《网络安全法》《数据安全法》《生物安全法》等专门领域立法之间形成“<strong>综合性基本规范＋专门领域规范</strong>”的制度结构。</p>\n<p>从这一意义上说，第一条不仅是目的条款，也提示了本法的体系定位：<strong>通过综合性国家安全立法确立共同的价值目标和基本制度框架，再由不同领域的专门法律具体化。</strong></p>\n<hr />\n<h2>四、法理与解释要点</h2>\n<h3>1. 目的解释：第一条是解释依据，但不是独立的权力授予规范</h3>\n<p>第一条具有重要的目的解释功能。当其他条文存在不同可能解释时，可以结合第一条判断某项制度所保护的国家安全利益，以及有关规范应当实现的制度目标。</p>\n<p>但应当区分<strong>立法目的规范</strong>与<strong>具体授权规范</strong>。</p>\n<p>第一条说明“为什么维护国家安全”，并不直接回答国家机关“可以采取什么措施”“在什么条件下可以采取措施”以及“应当遵循什么程序”。</p>\n<p>因此，查封、扣押、搜查、限制人身自由、行政处罚或者其他限制权利的措施，均应当具有相应的具体法律依据，并符合权限、条件和程序要求。不能仅以第一条所规定的“维护国家安全”为由推导出具体公权力。</p>\n<blockquote>\n<p><strong>解释规则：</strong></p>\n<p>目的条款可以帮助解释权力，但不能代替权力依据。</p>\n</blockquote>\n<h3>2. 国家保护义务与国家安全权力的法治约束</h3>\n<p>从法理上看，国家安全规范同时包含两个方向：</p>\n<p>一方面，国家负有维护国家安全、保护人民生命财产和其他重大利益的积极职责；</p>\n<p>另一方面，国家在履行安全保护职责时仍须遵守法治原则，并保护公民和组织的合法权益。</p>\n<p>这一结构在本法内部具有明确的体系依据。第一条规定“保护人民的根本利益”，第7条规定尊重和保障人权，第16条要求保障公民生命财产安全和其他合法权益，第66条进一步规定，国家安全危机管控措施应当与危害的性质、程度和范围相适应；存在多种措施时，应选择有利于最大程度保护公民、组织权益的措施。</p>\n<p>因此，维护国家安全与保护公民权利并非两个相互隔离的规范目标。<strong>国家安全措施的合法性判断，本身就应当包含对权限依据、必要程度和权益保护的审查。</strong></p>\n<h3>3. 比例原则在国家安全领域具有特殊意义</h3>\n<p>第66条体现了较为明确的比例控制思路：国家安全危机处置措施首先应当与风险的性质、程度和范围相适应；当存在多种可以实现目的的手段时，还应当优先选择对公民和组织权益保护程度更高的措施。</p>\n<p>据此，可以将国家安全措施的审查思路概括为：</p>\n<p><strong>目的正当 → 具有法定依据 → 手段与风险程度相适应 → 多种有效手段中选择权益损害较小者。</strong></p>\n<p>第一条所规定的国家安全目的因此不能单独完成合法性论证。即使某项措施确实有助于维护国家安全，也仍然需要进一步判断其权限依据、适用条件、程序要求以及对权利限制的程度。</p>\n<hr />\n<h2>五、关联条文与学习提示</h2>\n<h3>（一）核心关联条文</h3>\n<ul>\n<li><strong>第2条：国家安全的概念。</strong> 回答“什么是国家安全”。</li>\n<li><strong>第3条：总体国家安全观。</strong> 回答国家安全工作的基本指导思想和总体结构。</li>\n<li><strong>第7条：法治与人权保障。</strong> 确立国家安全措施的基本法治边界。</li>\n<li><strong>第8条：安全与发展的协调。</strong> 说明维护国家安全同时需要考虑经济社会发展。</li>\n<li><strong>第15条：政治安全。</strong> 具体展开第一条关于政权和制度安全的要求。</li>\n<li><strong>第16条：人民安全。</strong> 具体展开第一条关于保护人民根本利益的要求。</li>\n<li><strong>第66条：危机管控中的比例控制。</strong> 对限制公民、组织权益的国家安全危机措施提出适度性和权益保护要求。</li>\n</ul>\n<h3>（二）案例使用</h3>\n<p>第一条属于<strong>立法目的条款</strong>，本身通常不是具体案件中认定违法、定罪或者处罚的直接规范依据。</p>\n<p>学习本条时，可以结合危害国家安全犯罪、反间谍执法、国家安全审查或者国家安全危机管控等公开案例，观察第一条所列举的国家安全利益如何在具体制度中展开。</p>\n<p>但在分析具体案件时，应继续查找：</p>\n<p><strong>具体行为规范 → 权限依据 → 构成要件 → 程序规范 → 法律责任。</strong></p>\n<p>不能仅依据“维护国家安全”这一抽象目的完成法律评价。</p>\n<h3>（三）易错点</h3>\n<p><strong>易错点1：</strong> 2015年《国家安全法》是1993年《国家安全法》的修订版。<br />\n<strong>纠正：</strong> 1993年《国家安全法》在2014年制定《反间谍法》时已经废止；2015年另行制定现行《国家安全法》。</p>\n<p><strong>易错点2：</strong> 第一条可以直接作为国家机关采取国家安全措施的授权依据。<br />\n<strong>纠正：</strong> 第一条主要规定立法目的和立法依据。具体限制权利或者实施强制措施仍须具有具体法律授权。</p>\n<p><strong>易错点3：</strong> 国家安全与公民权利属于简单的对立关系。<br />\n<strong>纠正：</strong> 本法同时规定维护国家安全、保护人民利益、尊重保障人权以及危机处置中的权益保护要求，应当进行体系解释。</p>\n<hr />\n<h2>六、研究问题</h2>\n<ol>\n<li><p><strong>目的条款的规范效力边界。</strong> 第一条能够在多大程度上参与具体国家安全规范的解释？何时会发生从“目的解释”向“扩大公权力”的越界？</p>\n</li>\n<li><p><strong>多重立法目的之间的协调。</strong> 当某项国家安全措施能够促进特定安全利益，却同时对经济社会发展或者个人权利产生限制时，应如何协调第一条中的安全、人民利益和发展目标？</p>\n</li>\n<li><p><strong>安全目的与比例原则的关系。</strong> 第66条关于危机管控措施的规定能否反映国家安全法领域的一般比例控制要求？其适用范围是否能够通过体系解释扩展至危机管控以外的国家安全措施？</p>\n</li>\n<li><p><strong>综合性国家安全法与专门立法的关系。</strong> 当《国家安全法》与《反间谍法》《数据安全法》《生物安全法》等专门法律同时涉及某一事项时，应如何处理一般规范与专门规范之间的解释和适用关系？</p>\n</li>\n</ol>"},{"num":2,"label":"第二条","title":"国家安全的定义","lawText":"国家安全是指国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展和国家其他重大利益相对处于没有危险和不受内外威胁的状态，以及保障持续安全状态的能力。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第二条</div><p class=\"article-law-text\">国家安全是指国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展和国家其他重大利益相对处于没有危险和不受内外威胁的状态，以及保障持续安全状态的能力。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第二条</div><p class=\"article-law-text\">国家安全是指国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展和国家其他重大利益相对处于没有危险和不受内外威胁的状态，以及保障持续安全状态的能力。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>理解本条可抓住四个要素：<strong>受保护利益、危险与威胁、相对安全状态、维持安全的能力</strong>。</p>\n<h3>二、立法沿革</h3>\n<p><strong>从专门工作到总体安全。</strong> 应当本条放在总体国家安全观的背景下理解。2015年通过定义条款，为跨领域的安全任务提供共同概念，不再仅从反间谍工作认识国家安全。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>保护的是核心利益和其他重大利益。</strong> 政权、主权、统一和领土完整指向国家的存在与政治秩序；人民福祉和可持续发展表明国家安全也关乎人民生活和长期发展。“其他重大利益”提供开放空间，但“国家”“重大”同时构成解释上的限定。</li>\n<li><strong>威胁既来自内部，也来自外部。</strong> 不能以行为发生地或主体国籍，直接判断其是否涉及国家安全。内部风险可能产生外部影响，外部变化也可能通过经济、技术和社会联系传导到国内。</li>\n<li><strong>安全是相对的。</strong> 不安全因素不可能彻底根除。本条要求持续防范和克服风险，不以消灭一切不确定性为判断标准。</li>\n<li><strong>状态与能力并列。</strong> 当前未发生重大危害，只说明某种状态；是否具有预警、应对、保障和恢复能力，决定这种状态能否持续。第五章“国家安全保障”是能力维度的制度展开。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>国家利益的重大性门槛〔笔记分析〕。</strong> 本条不是“凡有风险即属于国家安全”的定义。研究具体事项时，至少应说明：涉及何种国家重大利益、风险怎样影响该利益、影响范围和程度如何。普通经营困难、一般治安问题与国家安全风险之间，需要具体论证其关联。</p>\n<p><strong>状态、感受与能力须分开。</strong> 现实威胁是否存在、社会如何感知威胁、国家是否具有应对能力。</p>\n<p><strong>历史比较的启发。</strong> 通过美国、俄罗斯不同时期的安全概念，说明各国对安全对象和领域的理解会随环境变化。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>实例</strong>：以北斗卫星导航系统建设为例，关键基础设施的稳定、自主保障和替代能力能够减少重大利益受外部冲击的脆弱性。但不能进一步推成“某项技术能够排除全部安全威胁”。</li>\n<li><strong>关联条文</strong>：第3条总体国家安全观、第8条统筹关系、第二章各领域任务、第五章保障能力。</li>\n<li><strong>研究问题</strong>：“国家其他重大利益”的开放性，如何与权限明确、权利保障和具体风险证明相协调？</li>\n</ul></div></div>","notesHtml":"<p>理解本条可抓住四个要素：<strong>受保护利益、危险与威胁、相对安全状态、维持安全的能力</strong>。</p>\n<h3>二、立法沿革</h3>\n<p><strong>从专门工作到总体安全。</strong> 应当本条放在总体国家安全观的背景下理解。2015年通过定义条款，为跨领域的安全任务提供共同概念，不再仅从反间谍工作认识国家安全。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>保护的是核心利益和其他重大利益。</strong> 政权、主权、统一和领土完整指向国家的存在与政治秩序；人民福祉和可持续发展表明国家安全也关乎人民生活和长期发展。“其他重大利益”提供开放空间，但“国家”“重大”同时构成解释上的限定。</li>\n<li><strong>威胁既来自内部，也来自外部。</strong> 不能以行为发生地或主体国籍，直接判断其是否涉及国家安全。内部风险可能产生外部影响，外部变化也可能通过经济、技术和社会联系传导到国内。</li>\n<li><strong>安全是相对的。</strong> 不安全因素不可能彻底根除。本条要求持续防范和克服风险，不以消灭一切不确定性为判断标准。</li>\n<li><strong>状态与能力并列。</strong> 当前未发生重大危害，只说明某种状态；是否具有预警、应对、保障和恢复能力，决定这种状态能否持续。第五章“国家安全保障”是能力维度的制度展开。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>国家利益的重大性门槛〔笔记分析〕。</strong> 本条不是“凡有风险即属于国家安全”的定义。研究具体事项时，至少应说明：涉及何种国家重大利益、风险怎样影响该利益、影响范围和程度如何。普通经营困难、一般治安问题与国家安全风险之间，需要具体论证其关联。</p>\n<p><strong>状态、感受与能力须分开。</strong> 现实威胁是否存在、社会如何感知威胁、国家是否具有应对能力。</p>\n<p><strong>历史比较的启发。</strong> 通过美国、俄罗斯不同时期的安全概念，说明各国对安全对象和领域的理解会随环境变化。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>实例</strong>：以北斗卫星导航系统建设为例，关键基础设施的稳定、自主保障和替代能力能够减少重大利益受外部冲击的脆弱性。但不能进一步推成“某项技术能够排除全部安全威胁”。</li>\n<li><strong>关联条文</strong>：第3条总体国家安全观、第8条统筹关系、第二章各领域任务、第五章保障能力。</li>\n<li><strong>研究问题</strong>：“国家其他重大利益”的开放性，如何与权限明确、权利保障和具体风险证明相协调？</li>\n</ul>"},{"num":3,"label":"第三条","title":"总体国家安全观","lawText":"国家安全工作应当坚持总体国家安全观，以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、文化、社会安全为保障，以促进国际安全为依托，维护各领域国家安全，构建国家安全体系，走中国特色国家安全道路。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第三条</div><p class=\"article-law-text\">国家安全工作应当坚持总体国家安全观，以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、文化、社会安全为保障，以促进国际安全为依托，维护各领域国家安全，构建国家安全体系，走中国特色国家安全道路。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第三条</div><p class=\"article-law-text\">国家安全工作应当坚持总体国家安全观，以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、文化、社会安全为保障，以促进国际安全为依托，维护各领域国家安全，构建国家安全体系，走中国特色国家安全道路。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>本条规定国家安全工作的指导思想，既说明价值取向，也说明各类安全的结构关系。</p>\n<h3>二、立法沿革</h3>\n<ol>\n<li><strong>2014年4月15日的思想背景。</strong> 中央国家安全委员会第一次会议提出总体国家安全观，成为2015年综合立法的重要指导。</li>\n<li><strong>初稿较为概括。</strong> 甲书附录三第378—379页（PDF391—392页）记载，草案原文为“国家安全工作应当坚持总体国家安全观，走中国特色国家安全道路”。</li>\n<li><strong>二审中予以充实。</strong> 2015年4月20日的修改情况汇报根据审议意见，为使指导思想具体、明确，建议补充人民安全、政治安全、经济安全、军事文化社会安全以及促进国际安全的五组关系，同时加入维护各领域国家安全、构建国家安全体系的内容。</li>\n<li><strong>意义</strong>：本条将总体国家安全观的具体内容写入法律，使其对整部法律的解释和实施具有明确的文本依据。</li>\n</ol>\n<h3>三、主要内容</h3>\n<p>| 以人民安全为宗旨 | 国家安全工作服务于人民安全和根本利益，说明“为了谁” |\n| 以政治安全为根本 | 国家政权与制度安全具有基础性的政治意义 |\n| 以经济安全为基础 | 持续发展、经济运行及物质条件支撑安全能力 |\n| 以军事、文化、社会安全为保障 | 不同领域从防卫、文化认同与社会运行等方面提供保障 |\n| 以促进国际安全为依托 | 本国安全与国际环境相关，需要通过国际安全合作创造条件 |</p>\n<p><strong>“总体”强调系统联系。</strong> 甲书指出，国家安全涉及多个领域，领域本身也会随国家利益和安全形势变化而拓展；第二章以具体任务承接这一要求。</p>\n<p><strong>“总体”也要求统筹方法。</strong> 各领域安全不是互不相干的。第8条把这种方法展开为发展与安全、内部与外部等关系的协调。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>价值、条件与手段的不同层次〔笔记分析〕。</strong> “宗旨、根本、基础、保障、依托”分别描述目的、根本条件、物质基础、支撑方式和国际环境。</p>\n<p><strong>系统安全与领域边界〔笔记分析〕。</strong> 系统思维要求关注风险传导，例如技术依赖可能影响经济运行，经济冲击又可能影响社会秩序；但某事项是否进入国家安全法律调整，仍应结合第2条重大利益和有关专门条款判断。</p>\n<p><strong>与“人的安全”的比较方向。</strong> 可以围绕人的生存、生活与尊严，讨论本条人民安全宗旨与国际安全研究的相通问题；两者的概念来源、制度结构不同，不宜直接认定为同一理论。此处作为后续研究方向，不作已经完成的学说同一性判断。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>体系联系</strong>：第4—6条处理领导和战略，第7—10条处理工作原则，第二章处理各领域任务，后续章节配置职责、制度、保障和公民组织的权利义务。</li>\n<li><strong>研究问题</strong>：如何把“以人民安全为宗旨”转化为可以检验具体制度和措施的评价标准？</li>\n</ul></div></div>","notesHtml":"<p>本条规定国家安全工作的指导思想，既说明价值取向，也说明各类安全的结构关系。</p>\n<h3>二、立法沿革</h3>\n<ol>\n<li><strong>2014年4月15日的思想背景。</strong> 中央国家安全委员会第一次会议提出总体国家安全观，成为2015年综合立法的重要指导。</li>\n<li><strong>初稿较为概括。</strong> 甲书附录三第378—379页（PDF391—392页）记载，草案原文为“国家安全工作应当坚持总体国家安全观，走中国特色国家安全道路”。</li>\n<li><strong>二审中予以充实。</strong> 2015年4月20日的修改情况汇报根据审议意见，为使指导思想具体、明确，建议补充人民安全、政治安全、经济安全、军事文化社会安全以及促进国际安全的五组关系，同时加入维护各领域国家安全、构建国家安全体系的内容。</li>\n<li><strong>意义</strong>：本条将总体国家安全观的具体内容写入法律，使其对整部法律的解释和实施具有明确的文本依据。</li>\n</ol>\n<h3>三、主要内容</h3>\n<p>| 以人民安全为宗旨 | 国家安全工作服务于人民安全和根本利益，说明“为了谁” |\n| 以政治安全为根本 | 国家政权与制度安全具有基础性的政治意义 |\n| 以经济安全为基础 | 持续发展、经济运行及物质条件支撑安全能力 |\n| 以军事、文化、社会安全为保障 | 不同领域从防卫、文化认同与社会运行等方面提供保障 |\n| 以促进国际安全为依托 | 本国安全与国际环境相关，需要通过国际安全合作创造条件 |</p>\n<p><strong>“总体”强调系统联系。</strong> 甲书指出，国家安全涉及多个领域，领域本身也会随国家利益和安全形势变化而拓展；第二章以具体任务承接这一要求。</p>\n<p><strong>“总体”也要求统筹方法。</strong> 各领域安全不是互不相干的。第8条把这种方法展开为发展与安全、内部与外部等关系的协调。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>价值、条件与手段的不同层次〔笔记分析〕。</strong> “宗旨、根本、基础、保障、依托”分别描述目的、根本条件、物质基础、支撑方式和国际环境。</p>\n<p><strong>系统安全与领域边界〔笔记分析〕。</strong> 系统思维要求关注风险传导，例如技术依赖可能影响经济运行，经济冲击又可能影响社会秩序；但某事项是否进入国家安全法律调整，仍应结合第2条重大利益和有关专门条款判断。</p>\n<p><strong>与“人的安全”的比较方向。</strong> 可以围绕人的生存、生活与尊严，讨论本条人民安全宗旨与国际安全研究的相通问题；两者的概念来源、制度结构不同，不宜直接认定为同一理论。此处作为后续研究方向，不作已经完成的学说同一性判断。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>体系联系</strong>：第4—6条处理领导和战略，第7—10条处理工作原则，第二章处理各领域任务，后续章节配置职责、制度、保障和公民组织的权利义务。</li>\n<li><strong>研究问题</strong>：如何把“以人民安全为宗旨”转化为可以检验具体制度和措施的评价标准？</li>\n</ul>"},{"num":4,"label":"第四条","title":"国家安全领导体制","lawText":"坚持中国共产党对国家安全工作的领导，建立集中统一、高效权威的国家安全领导体制。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第四条</div><p class=\"article-law-text\">坚持中国共产党对国家安全工作的领导，建立集中统一、高效权威的国家安全领导体制。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第四条</div><p class=\"article-law-text\">坚持中国共产党对国家安全工作的领导，建立集中统一、高效权威的国家安全领导体制。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>本条回答国家安全工作由谁领导，以及领导体制应具有什么特征。</p>\n<h3>二、立法沿革</h3>\n<p><strong>制度背景</strong>：2013年党的十八届三中全会提出设立国家安全委员会、完善国家安全体制和国家安全战略。2014年1月24日中央政治局会议就中央国家安全委员会作出决定。2015年本法将党的领导和国家安全领导体制的基本要求纳入法律。</p>\n<p><strong>问题背景</strong>：之前存在安全资源分散、跨部门协调不足、信息沟通不畅等问题。随着安全事务跨越军事、外交、内政、经济、科技等领域，需要有能够统筹各方的领导体制。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>党的领导是明确的规范要求。</strong> 它构成国家安全工作整体组织安排的前提，与第5条中央国家安全领导机构的职责相衔接。</li>\n<li><strong>集中统一。</strong> 对跨领域、跨地区和跨部门的安全事务，需要统一方向、重大部署和协调机制，避免各自决策产生冲突。</li>\n<li><strong>高效。</strong> 通过信息汇集、任务分工和协同机制，提高风险识别、决策和行动的衔接效率。</li>\n<li><strong>权威。</strong> 国家安全重大决策应具有组织执行保障，并通过责任机制落实到相应主体。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>组织规范与行为规范的关系〔笔记分析〕。</strong> 本条规定领导体制，第7条规定依法运行的要求，第三章规定有关机关的职责。领导体制上的集中统一，与具体行政、司法活动依法定权限和程序进行，应放在同一法律结构中理解。</p>\n<p><strong>比较法的共同问题。</strong> 美国《国家安全法》现行汇编第101节也设置国家安全委员会，其职能包括向总统就国内、外交、军事政策的整合提出建议。它说明跨部门安全协调具有可比较性；但机构的政治地位、职权来源和责任关系必须分别研究，不能因名称近似就认为制度等同。<a href=\"https://www.govinfo.gov/content/pkg/COMPS-1493/pdf/COMPS-1493.pdf\">美国法第101节，汇编第7—8页</a>。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>区分三个概念</strong>：“国家安全领导体制”是整体安排；“中央国家安全领导机构”是第5条的职责主体；“国家安全机关”是在有关法律规定下执行专门任务的机关。三者不能混用。</li>\n<li><strong>关联条文</strong>：第5条、第7条、第三章职责规定、第44—47条有关工作机制与战略实施规定。</li>\n<li><strong>研究问题</strong>：如何在集中统一的前提下实现职责清楚、专业分工与责任可追溯？</li>\n</ul></div></div>","notesHtml":"<p>本条回答国家安全工作由谁领导，以及领导体制应具有什么特征。</p>\n<h3>二、立法沿革</h3>\n<p><strong>制度背景</strong>：2013年党的十八届三中全会提出设立国家安全委员会、完善国家安全体制和国家安全战略。2014年1月24日中央政治局会议就中央国家安全委员会作出决定。2015年本法将党的领导和国家安全领导体制的基本要求纳入法律。</p>\n<p><strong>问题背景</strong>：之前存在安全资源分散、跨部门协调不足、信息沟通不畅等问题。随着安全事务跨越军事、外交、内政、经济、科技等领域，需要有能够统筹各方的领导体制。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>党的领导是明确的规范要求。</strong> 它构成国家安全工作整体组织安排的前提，与第5条中央国家安全领导机构的职责相衔接。</li>\n<li><strong>集中统一。</strong> 对跨领域、跨地区和跨部门的安全事务，需要统一方向、重大部署和协调机制，避免各自决策产生冲突。</li>\n<li><strong>高效。</strong> 通过信息汇集、任务分工和协同机制，提高风险识别、决策和行动的衔接效率。</li>\n<li><strong>权威。</strong> 国家安全重大决策应具有组织执行保障，并通过责任机制落实到相应主体。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>组织规范与行为规范的关系〔笔记分析〕。</strong> 本条规定领导体制，第7条规定依法运行的要求，第三章规定有关机关的职责。领导体制上的集中统一，与具体行政、司法活动依法定权限和程序进行，应放在同一法律结构中理解。</p>\n<p><strong>比较法的共同问题。</strong> 美国《国家安全法》现行汇编第101节也设置国家安全委员会，其职能包括向总统就国内、外交、军事政策的整合提出建议。它说明跨部门安全协调具有可比较性；但机构的政治地位、职权来源和责任关系必须分别研究，不能因名称近似就认为制度等同。<a href=\"https://www.govinfo.gov/content/pkg/COMPS-1493/pdf/COMPS-1493.pdf\">美国法第101节，汇编第7—8页</a>。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>区分三个概念</strong>：“国家安全领导体制”是整体安排；“中央国家安全领导机构”是第5条的职责主体；“国家安全机关”是在有关法律规定下执行专门任务的机关。三者不能混用。</li>\n<li><strong>关联条文</strong>：第5条、第7条、第三章职责规定、第44—47条有关工作机制与战略实施规定。</li>\n<li><strong>研究问题</strong>：如何在集中统一的前提下实现职责清楚、专业分工与责任可追溯？</li>\n</ul>"},{"num":5,"label":"第五条","title":"中央国家安全领导机构职责","lawText":"中央国家安全领导机构负责国家安全工作的决策和议事协调，研究制定、指导实施国家安全战略和有关重大方针政策，统筹协调国家安全重大事项和重要工作，推动国家安全法治建设。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第五条</div><p class=\"article-law-text\">中央国家安全领导机构负责国家安全工作的决策和议事协调，研究制定、指导实施国家安全战略和有关重大方针政策，统筹协调国家安全重大事项和重要工作，推动国家安全法治建设。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第五条</div><p class=\"article-law-text\">中央国家安全领导机构负责国家安全工作的决策和议事协调，研究制定、指导实施国家安全战略和有关重大方针政策，统筹协调国家安全重大事项和重要工作，推动国家安全法治建设。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>本条以职责列举的方式，具体化第4条的领导体制。</p>\n<h3>二、立法沿革</h3>\n<p>甲书把2013年设立国家安全委员会的部署、2014年中央有关决定与2015年法律规定相衔接，说明中央国家安全委员会作为党中央有关国家安全工作的决策和议事协调机构的制度背景。</p>\n<h3>三、主要内容</h3>\n<p><strong>一是决策与议事协调。</strong> 对安全工作的方向、重大安排及需要跨部门处理的问题进行研究、决策和协调。</p>\n<p><strong>二是战略与重大方针政策。</strong> 包括研究制定，也包括指导实施。与第6条战略完善、第46—47条落实机制衔接。</p>\n<p><strong>三是统筹重大事项和重要工作。</strong> 与重点领域协调、跨部门会商、中央地方及军地联动等制度联系起来，“统筹”的对象是具有综合性、跨界性的安全事务。</p>\n<p><strong>四是推动法治建设。</strong> 联系第70条强调健全国家安全法律制度体系。由此可见，领导机构的职责不仅指向安全事务处置，也指向制度建设。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>职责规范兼具授权和责任意义〔笔记分析〕。</strong> 本条一方面指明中央领导机构负责什么，另一方面为考察重大事项有无组织协调、战略有无实施安排提供制度依据。不过，具体责任追究仍须依据相应的责任规范，不能从职责文字直接推导一种未经规定的制裁。</p>\n<p><strong>“推动法治建设”与国家立法权不同。</strong> 按照《宪法》第58、62、67条规定的立法权限，国家法律的制定、修改和解释有法定主体、权限与程序。本条中的推动、研究和协调不能替代这些程序。<a href=\"https://www.npc.gov.cn/zgrdw/npc/xinwen/2018-03/22/content_2052489.htm\">《宪法》国家机构章</a>。</p>\n<p><strong>比较的重点。</strong> 甲书将外国相关机构概括为咨询、协调、决策等不同功能类型，并指出它们可能交叉。研究中可比较“提出建议—形成决定—组织实施—承担责任”分别由谁完成，不宜只比较机构名称。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>与第4条区别</strong>：第4条规定领导原则和体制特征，第5条规定中央层面的职责任务。</li>\n<li><strong>与第6条区别</strong>：第5条着重负责战略工作的主体和职责，第6条着重战略的制定、评估、内容与完善要求。</li>\n<li><strong>与执行机关区别</strong>：本条没有完整列举具体调查、强制或处罚措施；实施这些措施必须查明有关机关的具体法定职权。</li>\n<li><strong>两书对读</strong>：乙书第13—15页与甲书基本框架一致，分为机构职能定位与三组主要职责，并以第6、46、47条说明战略从制定到实施的联系。两书在此可相互印证，但相同表述并不等于两份独立的立法证据。</li>\n<li><strong>研究问题</strong>：在跨部门安全事务中，议事协调结论如何转化为各机关依法作出的具体决定，并形成清晰的执行责任？</li>\n</ul></div></div>","notesHtml":"<p>本条以职责列举的方式，具体化第4条的领导体制。</p>\n<h3>二、立法沿革</h3>\n<p>甲书把2013年设立国家安全委员会的部署、2014年中央有关决定与2015年法律规定相衔接，说明中央国家安全委员会作为党中央有关国家安全工作的决策和议事协调机构的制度背景。</p>\n<h3>三、主要内容</h3>\n<p><strong>一是决策与议事协调。</strong> 对安全工作的方向、重大安排及需要跨部门处理的问题进行研究、决策和协调。</p>\n<p><strong>二是战略与重大方针政策。</strong> 包括研究制定，也包 案第四章第二节。2015年4月20日修改情况汇报提出，战略关乎一个时期的方针政策、目标任务和全局安排，宜将其制定要求前移至总则。</li>\n<li><strong>同步细化战略内容。</strong> 前移时进一步明确形势评估、指导方针、中长期目标、重点领域政策、任务和措施，形成现行第6条的基本表述。</li>\n</ol>\n<p>依据：甲书第28—30页；附录三第379页（PDF392页）。这里的条文位置变化，体现战略从一项具体制度上升为总则层面的共同要求。</p>\n<h3>三、主要内容</h3>\n<p><strong>“制定并不断完善”意味着持续性义务。</strong> 制定文件只是起点，还须随安全环境、国家能力和利益变化进行调整。不能把战略看成一经制定就长期不变的静态文本。</p>\n<p><strong>“全面评估”是战略的认识基础。</strong> 国际与国内形势都须纳入判断；既要识别威胁，也要评估自身能力、资源条件和发展需要。</p>\n<p><strong>战略应连接目标和行动。</strong> 指导方针回答基本取向，中长期目标回答希望达到何种安全状态，重点领域政策回答优先部署在哪里，工作任务和措施回答由何种行动实现。</p>\n<p><strong>落实需要后续制度。</strong> 第5条明确中央领导机构有关职责，第46条规定督促检查和责任追究机制，第47条要求各地区、各部门采取有效措施贯彻实施。甲书正是通过这些条文说明战略的执行保障。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>战略的制度地位〔笔记分析〕。</strong> 战略能够确定优先方向、引导资源配置和统筹行动，但不能仅凭“战略需要”产生法律没有规定的强制权力。对公民和组织采取具体措施，仍须衔接相应的法律授权。</p>\n<p><strong>比较法：制定战略与报告义务。</strong> 美国《国家安全法》现行汇编第108节规定，总统向国会提交年度国家安全战略报告，并规定报告内容。这提示可以比较：战略由谁制定、向谁说明、多久评估一次、如何将能力与目标匹配。我国本条没有规定同样的年度提交期限，不能将美国程序直接读入本条。<a href=\"https://www.govinfo.gov/content/pkg/COMPS-1493/pdf/COMPS-1493.pdf\">美国法第108节，汇编第67—68页</a>。</p>\n<p><strong>动态完善的评价框架〔笔记分析〕。</strong> 可考察“形势识别—目标选择—资源配置—实施反馈—战略调整”是否形成连续过程。这是依据本条与实施条款归纳的分析框架，不是法条逐字列出的五项程序。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>公开范围</strong>：甲书指出各国战略有不同表现形式和公开程度。仅凭第6条，不能推出战略全文一律公开，也不能推出战略有关信息一律保密；须分别查明信息公开和保密依据。</li>\n<li><strong>历史材料的使用</strong>：甲书有关美、俄、日战略的介绍主要截止于其出版前，适合作为安全战略演变史材料。引用时注明年份，不作为当前战略清单。</li>\n<li><strong>两书对读</strong>：甲书比较资料较多；乙书更适合快速掌握战略的基本概念、必要性和国内发展。</li>\n<li><strong>乙书的时间延伸</strong>：第16页还介绍2021年审议《国家安全战略（2021—2025年）》等后续材料，可说明“不断完善”的实践含义。该五年战略按书中时间范围记录，不把它写成2026年仍覆盖当前时期的战略。</li>\n<li><strong>研究问题</strong>：在中长期目标相对稳定而风险快速变化时，如何识别应调整战略、还是只需改变执行措施？</li>\n</ul></div></div>","notesHtml":"<p>本条规定制定、完善国家安全战略的国家义务，以及战略形成所需的评估和内容要求。</p>\n<h3>二、立法沿革</h3>\n<ol>\n<li><strong>战略制度的形成。</strong> 甲书梳理了国家安全战略从有关政策部署、总体国家安全观到系统性战略安排的过程，并记载2015年1月23日中央政治局会议审议通过《国家安全战略纲要》。这早于本法通过，说明战略实践与立法相互衔接。</li>\n<li><strong>草案结构发生实质调整。</strong> 国家安全战略原安排在草案第四章第二节。2015年4月20日修改情况汇报提出，战略关乎一个时期的方针政策、目标任务和全局安排，宜将其制定要求前移至总则。</li>\n<li><strong>同步细化战略内容。</strong> 前移时进一步明确形势评估、指导方针、中长期目标、重点领域政策、任务和措施，形成现行第6条的基本表述。</li>\n</ol>\n<p>依据：甲书第28—30页；附录三第379页（PDF392页）。这里的条文位置变化，体现战略从一项具体制度上升为总则层面的共同要求。</p>\n<h3>三、主要内容</h3>\n<p><strong>“制定并不断完善”意味着持续性义务。</strong> 制定文件只是起点，还须随安全环境、国家能力和利益变化进行调整。不能把战略看成一经制定就长期不变的静态文本。</p>\n<p><strong>“全面评估”是战略的认识基础。</strong> 国际与国内形势都须纳入判断；既要识别威胁，也要评估自身能力、资源条件和发展需要。</p>\n<p><strong>战略应连接目标和行动。</strong> 指导方针回答基本取向，中长期目标回答希望达到何种安全状态，重点领域政策回答优先部署在哪里，工作任务和措施回答由何种行动实现。</p>\n<p><strong>落实需要后续制度。</strong> 第5条明确中央领导机构有关职责，第46条规定督促检查和责任追究机制，第47条要求各地区、各部门采取有效措施贯彻实施。甲书正是通过这些条文说明战略的执行保障。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>战略的制度地位〔笔记分析〕。</strong> 战略能够确定优先方向、引导资源配置和统筹行动，但不能仅凭“战略需要”产生法律没有规定的强制权力。对公民和组织采取具体措施，仍须衔接相应的法律授权。</p>\n<p><strong>比较法：制定战略与报告义务。</strong> 美国《国家安全法》现行汇编第108节规定，总统向国会提交年度国家安全战略报告，并规定报告内容。这提示可以比较：战略由谁制定、向谁说明、多久评估一次、如何将能力与目标匹配。我国本条没有规定同样的年度提交期限，不能将美国程序直接读入本条。<a href=\"https://www.govinfo.gov/content/pkg/COMPS-1493/pdf/COMPS-1493.pdf\">美国法第108节，汇编第67—68页</a>。</p>\n<p><strong>动态完善的评价框架〔笔记分析〕。</strong> 可考察“形势识别—目标选择—资源配置—实施反馈—战略调整”是否形成连续过程。这是依据本条与实施条款归纳的分析框架，不是法条逐字列出的五项程序。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>公开范围</strong>：甲书指出各国战略有不同表现形式和公开程度。仅凭第6条，不能推出战略全文一律公开，也不能推出战略有关信息一律保密；须分别查明信息公开和保密依据。</li>\n<li><strong>历史材料的使用</strong>：甲书有关美、俄、日战略的介绍主要截止于其出版前，适合作为安全战略演变史材料。引用时注明年份，不作为当前战略清单。</li>\n<li><strong>两书对读</strong>：甲书比较资料较多；乙书更适合快速掌握战略的基本概念、必要性和国内发展。</li>\n<li><strong>乙书的时间延伸</strong>：第16页还介绍2021年审议《国家安全战略（2021—2025年）》等后续材料，可说明“不断完善”的实践含义。该五年战略按书中时间范围记录，不把它写成2026年仍覆盖当前时期的战略。</li>\n<li><strong>研究问题</strong>：在中长期目标相对稳定而风险快速变化时，如何识别应调整战略、还是只需改变执行措施？</li>\n</ul>"},{"num":7,"label":"第七条","title":"法治原则与人权保障","lawText":"维护国家安全，应当遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第七条</div><p class=\"article-law-text\">维护国家安全，应当遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第七条</div><p class=\"article-law-text\">维护国家安全，应当遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>本条把依法维护国家安全与尊重、保障人权写在同一规定中，构成解释国家安全职权和措施的重要约束。</p>\n<h3>二、立法沿革</h3>\n<p><strong>宪法基础。</strong> 两书均将本条联系于宪法上的依法治国、人权保障和公民基本权利。直接相关的是《宪法》第5条与第33条，其中第33条第3款规定国家尊重和保障人权。</p>\n<p><strong>专门法律的先例。</strong> 2014年《反间谍法》第5条已经规定反间谍工作依法进行，并要求尊重和保障人权、保障公民和组织的合法权益。因此，本条的人权保障要求有相应制度延续。<a href=\"https://www.xiongan.gov.cn/2020-11/01/c_1210867136.htm\">2014年法律文本</a>。</p>\n<p><strong>2015年立法过程。</strong> 2014年12月22日的草案说明已明确列举法治和保障人权原则，并提到保护公民权利和自由。甲书附录二第375—376页（PDF388—389页）可核，不能把这一原则误写成二审或三审时才加入。现有材料不足以还原每处字词的修改时间。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>遵守宪法和法律。</strong> 安全事务的敏感性和特殊性，不构成超越宪法、法律的依据。甲书强调国家机关、组织和个人都没有超越宪法和法律的特权。</li>\n<li><strong>依法行使权力。</strong> 维护国家安全的工作既要有法定职权依据，也要遵守相应程序；不能只因目的正当，就认定手段当然合法。</li>\n<li><strong>尊重与保障具有不同侧重。</strong> 作为笔记上的分析区分，“尊重”要求避免不当侵害，“保障”要求通过制度和行动保护权利。国家安全工作不能只注意限制的一面而忽略保护的一面。</li>\n<li><strong>权利保护进入具体措施。</strong> 甲书以第66条说明，在国家安全危机管控中，选择措施应考虑对公民、组织权益的保护；人权原则不仅是抽象宣示。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>比例与必要性〔体系解释〕。</strong> 可将本条与第43条禁止越权、滥权和侵犯合法权益，第66条危机处置措施适当性、权益保护要求，第83条特别措施的实际需要限制合读。但应保留各条的适用场景，尤其不能把第66条的危机管控规则不加说明地写成所有工作的原文规定。<a href=\"https://www.12339.gov.cn/article/h5_law_con/2\">本法全文</a>。</p>\n<p><strong>可采用的分析顺序〔笔记分析〕</strong>：先查职权与法律依据，再查真实风险和措施目的，继而考察措施能否实现目的、有无侵害较小的有效选择、负担是否适度，以及程序和救济是否落实。这个顺序是研究工具，不是本条明文规定的一套完整审查程序。</p>\n<p><strong>比较法：限制与克减不同。</strong> 《公民权利和政治权利国际公约》第19、22条对表达和结社自由的限制设定法律依据、合法目的及必要性要求；第4条则另行处理紧急状态下的克减，不能将二者混同。可用来比较国家安全理由如何受到条件约束。<a href=\"https://2covenants.ohchr.org/About-ICCPR.html\">联合国人权高专办公约全文</a>。中国已签署、尚未批准该公约，此处作为比较资料，不据此主张其在中国内地一般执法案件中可以直接适用；港澳适用安排须另论。<a href=\"https://treaties.un.org/Pages/ShowMTDSGDetails.aspx?chapter=4&amp;lang=en&amp;mtdsg_no=IV-4&amp;src=UNTSONLINE&amp;tabid=3\">联合国条约库</a>。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>重要勘误一</strong>：乙书第19页（PDF28页）案例所引“2009年《反间谍法》第54条”，与中国《反间谍法》的公布时间及条文数量均不符。2014年法只有40条；2023年修订法也不能直接用于说明2021年的处罚。本笔记不据该错引确定处罚依据。</li>\n<li><strong>重要勘误二</strong>：同页关联法规列“《宪法》第5、23条”。若指人权保障，直接依据应是第33条；第23条主要涉及人才培养，不是人权条款。</li>\n<li><strong>案例证据界限</strong>：书中对程序权利获得保障的评价，属于作者分析。没有完整处罚决定、程序记录或裁判资料，不宜仅据简短报道认定各项程序均已履行。</li>\n<li><strong>关联条文</strong>：第13、43、66、82、83条。其中第82条关于批评建议及申诉、控告、检举的规定，为权利保护提供了进一步制度联系。</li>\n<li><strong>研究问题</strong>：如何使本条在人权保护和权力运行中形成可说明、可评价的法律标准？</li>\n</ul></div></div>","notesHtml":"<p>本条把依法维护国家安全与尊重、保障人权写在同一规定中，构成解释国家安全职权和措施的重要约束。</p>\n<h3>二、立法沿革</h3>\n<p><strong>宪法基础。</strong> 两书均将本条联系于宪法上的依法治国、人权保障和公民基本权利。直接相关的是《宪法》第5条与第33条，其中第33条第3款规定国家尊重和保障人权。</p>\n<p><strong>专门法律的先例。</strong> 2014年《反间谍法》第5条已经规定反间谍工作依法进行，并要求尊重和保障人权、保障公民和组织的合法权益。因此，本条的人权保障要求有相应制度延续。<a href=\"https://www.xiongan.gov.cn/2020-11/01/c_1210867136.htm\">2014年法律文本</a>。</p>\n<p><strong>2015年立法过程。</strong> 2014年12月22日的草案说明已明确列举法治和保障人权原则，并提到保护公民权利和自由。甲书附录二第375—376页（PDF388—389页）可核，不能把这一原则误写成二审或三审时才加入。现有材料不足以还原每处字词的修改时间。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>遵守宪法和法律。</strong> 安全事务的敏感性和特殊性，不构成超越宪法、法律的依据。甲书强调国家机关、组织和个人都没有超越宪法和法律的特权。</li>\n<li><strong>依法行使权力。</strong> 维护国家安全的工作既要有法定职权依据，也要遵守相应程序；不能只因目的正当，就认定手段当然合法。</li>\n<li><strong>尊重与保障具有不同侧重。</strong> 作为笔记上的分析区分，“尊重”要求避免不当侵害，“保障”要求通过制度和行动保护权利。国家安全工作不能只注意限制的一面而忽略保护的一面。</li>\n<li><strong>权利保护进入具体措施。</strong> 甲书以第66条说明，在国家安全危机管控中，选择措施应考虑对公民、组织权益的保护；人权原则不仅是抽象宣示。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>比例与必要性〔体系解释〕。</strong> 可将本条与第43条禁止越权、滥权和侵犯合法权益，第66条危机处置措施适当性、权益保护要求，第83条特别措施的实际需要限制合读。但应保留各条的适用场景，尤其不能把第66条的危机管控规则不加说明地写成所有工作的原文规定。<a href=\"https://www.12339.gov.cn/article/h5_law_con/2\">本法全文</a>。</p>\n<p><strong>可采用的分析顺序〔笔记分析〕</strong>：先查职权与法律依据，再查真实风险和措施目的，继而考察措施能否实现目的、有无侵害较小的有效选择、负担是否适度，以及程序和救济是否落实。这个顺序是研究工具，不是本条明文规定的一套完整审查程序。</p>\n<p><strong>比较法：限制与克减不同。</strong> 《公民权利和政治权利国际公约》第19、22条对表达和结社自由的限制设定法律依据、合法目的及必要性要求；第4条则另行处理紧急状态下的克减，不能将二者混同。可用来比较国家安全理由如何受到条件约束。<a href=\"https://2covenants.ohchr.org/About-ICCPR.html\">联合国人权高专办公约全文</a>。中国已签署、尚未批准该公约，此处作为比较资料，不据此主张其在中国内地一般执法案件中可以直接适用；港澳适用安排须另论。<a href=\"https://treaties.un.org/Pages/ShowMTDSGDetails.aspx?chapter=4&amp;lang=en&amp;mtdsg_no=IV-4&amp;src=UNTSONLINE&amp;tabid=3\">联合国条约库</a>。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>重要勘误一</strong>：乙书第19页（PDF28页）案例所引“2009年《反间谍法》第54条”，与中国《反间谍法》的公布时间及条文数量均不符。2014年法只有40条；2023年修订法也不能直接用于说明2021年的处罚。本笔记不据该错引确定处罚依据。</li>\n<li><strong>重要勘误二</strong>：同页关联法规列“《宪法》第5、23条”。若指人权保障，直接依据应是第33条；第23条主要涉及人才培养，不是人权条款。</li>\n<li><strong>案例证据界限</strong>：书中对程序权利获得保障的评价，属于作者分析。没有完整处罚决定、程序记录或裁判资料，不宜仅据简短报道认定各项程序均已履行。</li>\n<li><strong>关联条文</strong>：第13、43、66、82、83条。其中第82条关于批评建议及申诉、控告、检举的规定，为权利保护提供了进一步制度联系。</li>\n<li><strong>研究问题</strong>：如何使本条在人权保护和权力运行中形成可说明、可评价的法律标准？</li>\n</ul>"},{"num":8,"label":"第八条","title":"发展与安全、统筹兼顾","lawText":"维护国家安全，应当与经济社会发展相协调。 国家安全工作应当统筹内部安全和外部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第八条</div><p class=\"article-law-text\">维护国家安全，应当与经济社会发展相协调。 国家安全工作应当统筹内部安全和外部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第八条</div><p class=\"article-law-text\">维护国家安全，应当与经济社会发展相协调。 国家安全工作应当统筹内部安全和外部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>本条有两款：第一款规定发展与安全的协调；第二款列出四组需要统筹的关系。合起来可以把握为五组关系。</p>\n<h3>二、立法沿革</h3>\n<p><strong>思想来源。</strong> 甲书第34页将本条与2014年4月15日提出的总体国家安全观及五组关系相联系，强调全面理解安全、发展及不同领域间的联系。</p>\n<p><strong>初稿已有基本原则。</strong> 2014年12月草案说明已经明确维护国家安全与经济社会发展相协调、统筹各领域安全的原则，见甲书附录二第375页（PDF388页）。因此，基本思路并非最后审议阶段才形成。</p>\n<p><strong>证据界限。</strong> 对第二款四组关系在每一轮审议中是否调整、如何调整，本批未掌握足够的逐稿资料；不作无据的变动叙述。2015年后的“统筹发展和安全”政策发展，可补充理解，不能当作2015年文本后来被修正的证据。</p>\n<h3>三、主要内容</h3>\n<p><strong>发展与安全相协调。</strong> 两书均强调，发展为安全提供物质和社会条件，安全又为发展提供必要环境。不能长期忽视安全积累风险，也不能只计算安全收益而完全忽略发展成本。</p>\n<table>\n<thead>\n<tr>\n  <th>统筹关系</th>\n  <th>理解重点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>内部安全与外部安全</td>\n  <td>既识别各自风险，也关注内外风险相互传导、叠加</td>\n</tr>\n<tr>\n  <td>国土安全与国民安全</td>\n  <td>既维护主权、统一和领土完整，也保护人的安全和利益</td>\n</tr>\n<tr>\n  <td>传统安全与非传统安全</td>\n  <td>既关注军事、政治等传统问题，也关注经济、科技、生态等领域，注意二者交织</td>\n</tr>\n<tr>\n  <td>自身安全与共同安全</td>\n  <td>在维护本国正当安全利益时，兼顾其他国家与国际社会的安全联系</td>\n</tr>\n</tbody>\n</table>\n<p><strong>统筹不是机械平均。</strong> 不同时间、地区和领域可以有不同重点；关键是以整体联系判断重点，避免单一部门目标与整体安全、发展利益脱节。此项属于对两书论述的综合归纳。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>风险的相互影响〔笔记分析〕。</strong> 一项措施可能降低某类短期风险，却增加创新受阻、供给减少、信息不畅等长期风险。依据本条，研究应同时考察直接效果、间接影响和时间尺度，而不是只用某一领域的单个指标评价整体安全。</p>\n<p><strong>国民安全具有跨境面向〔体系解释〕。</strong> 乙书第21页把国民安全表述为“领土内国民的安全”，范围过窄。本法第33条明确保护海外中国公民、组织和机构的安全及正当权益，说明不能把国民安全一律限于境内。相关保护如何实施，仍需结合具体法律、国际法和实际条件。</p>\n<p><strong>“相协调”提供法律论证方向。</strong> 将国家安全与经济社会发展协调起来，是法条明确要求；但本条没有给出统一的成本收益公式。可据此要求说明安全措施与发展目标怎样衔接，不宜凭本条自行设定法无明文的审批、豁免或处罚规则。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书实例</strong>：第21—22页以CPTPP相关数据流动议题及2022年《数据出境安全评估办法》，说明数据利用和安全保护的协调问题。这是制度场景，不能概括为全部数据跨境流动均应适用同一限制。</li>\n<li><strong>补充材料</strong>：2024年《促进和规范数据跨境流动规定》调整数据出境制度，规定符合条件的活动可以免予特定出境程序，同时保留数据保护义务。这可以作为本条协调思路的研究例子；该规章有其专门法律依据，并非仅凭本条作出的授权。<a href=\"https://www.cac.gov.cn/2024-03/22/c_1712776611775634.htm\">国家网信办规定第1、3—5、10—13条</a>。</li>\n<li><strong>关联条文</strong>：第2、3、10、33条及第二章各领域任务。</li>\n<li><strong>研究问题</strong>：如何判断一种措施实现了较高水平的整体安全，而不是把某一类风险转移到其他领域、其他人群或未来？</li>\n</ul></div></div>","notesHtml":"<p>本条有两款：第一款规定发展与安全的协调；第二款列出四组需要统筹的关系。合起来可以把握为五组关系。</p>\n<h3>二、立法沿革</h3>\n<p><strong>思想来源。</strong> 甲书第34页将本条与2014年4月15日提出的总体国家安全观及五组关系相联系，强调全面理解安全、发展及不同领域间的联系。</p>\n<p><strong>初稿已有基本原则。</strong> 2014年12月草案说明已经明确维护国家安全与经济社会发展相协调、统筹各领域安全的原则，见甲书附录二第375页（PDF388页）。因此，基本思路并非最后审议阶段才形成。</p>\n<p><strong>证据界限。</strong> 对第二款四组关系在每一轮审议中是否调整、如何调整，本批未掌握足够的逐稿资料；不作无据的变动叙述。2015年后的“统筹发展和安全”政策发展，可补充理解，不能当作2015年文本后来被修正的证据。</p>\n<h3>三、主要内容</h3>\n<p><strong>发展与安全相协调。</strong> 两书均强调，发展为安全提供物质和社会条件，安全又为发展提供必要环境。不能长期忽视安全积累风险，也不能只计算安全收益而完全忽略发展成本。</p>\n<table>\n<thead>\n<tr>\n  <th>统筹关系</th>\n  <th>理解重点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>内部安全与外部安全</td>\n  <td>既识别各自风险，也关注内外风险相互传导、叠加</td>\n</tr>\n<tr>\n  <td>国土安全与国民安全</td>\n  <td>既维护主权、统一和领土完整，也保护人的安全和利益</td>\n</tr>\n<tr>\n  <td>传统安全与非传统安全</td>\n  <td>既关注军事、政治等传统问题，也关注经济、科技、生态等领域，注意二者交织</td>\n</tr>\n<tr>\n  <td>自身安全与共同安全</td>\n  <td>在维护本国正当安全利益时，兼顾其他国家与国际社会的安全联系</td>\n</tr>\n</tbody>\n</table>\n<p><strong>统筹不是机械平均。</strong> 不同时间、地区和领域可以有不同重点；关键是以整体联系判断重点，避免单一部门目标与整体安全、发展利益脱节。此项属于对两书论述的综合归纳。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>风险的相互影响〔笔记分析〕。</strong> 一项措施可能降低某类短期风险，却增加创新受阻、供给减少、信息不畅等长期风险。依据本条，研究应同时考察直接效果、间接影响和时间尺度，而不是只用某一领域的单个指标评价整体安全。</p>\n<p><strong>国民安全具有跨境面向〔体系解释〕。</strong> 乙书第21页把国民安全表述为“领土内国民的安全”，范围过窄。本法第33条明确保护海外中国公民、组织和机构的安全及正当权益，说明不能把国民安全一律限于境内。相关保护如何实施，仍需结合具体法律、国际法和实际条件。</p>\n<p><strong>“相协调”提供法律论证方向。</strong> 将国家安全与经济社会发展协调起来，是法条明确要求；但本条没有给出统一的成本收益公式。可据此要求说明安全措施与发展目标怎样衔接，不宜凭本条自行设定法无明文的审批、豁免或处罚规则。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书实例</strong>：第21—22页以CPTPP相关数据流动议题及2022年《数据出境安全评估办法》，说明数据利用和安全保护的协调问题。这是制度场景，不能概括为全部数据跨境流动均应适用同一限制。</li>\n<li><strong>补充材料</strong>：2024年《促进和规范数据跨境流动规定》调整数据出境制度，规定符合条件的活动可以免予特定出境程序，同时保留数据保护义务。这可以作为本条协调思路的研究例子；该规章有其专门法律依据，并非仅凭本条作出的授权。<a href=\"https://www.cac.gov.cn/2024-03/22/c_1712776611775634.htm\">国家网信办规定第1、3—5、10—13条</a>。</li>\n<li><strong>关联条文</strong>：第2、3、10、33条及第二章各领域任务。</li>\n<li><strong>研究问题</strong>：如何判断一种措施实现了较高水平的整体安全，而不是把某一类风险转移到其他领域、其他人群或未来？</li>\n</ul>"},{"num":9,"label":"第九条","title":"预防为主、标本兼治、专群结合","lawText":"维护国家安全，应当坚持预防为主、标本兼治，专门工作与群众路线相结合，充分发挥专门机关和其他有关机关维护国家安全的职能作用，广泛动员公民和组织，防范、制止和依法惩治危害国家安全的行为。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第九条</div><p class=\"article-law-text\">维护国家安全，应当坚持预防为主、标本兼治，专门工作与群众路线相结合，充分发挥专门机关和其他有关机关维护国家安全的职能作用，广泛动员公民和组织，防范、制止和依法惩治危害国家安全的行为。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第九条</div><p class=\"article-law-text\">维护国家安全，应当坚持预防为主、标本兼治，专门工作与群众路线相结合，充分发挥专门机关和其他有关机关维护国家安全的职能作用，广泛动员公民和组织，防范、制止和依法惩治危害国家安全的行为。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>本条包含两个主要层次：以何种方式应对风险，以及组织哪些力量共同维护安全。</p>\n<h3>二、立法沿革</h3>\n<p><strong>专群结合具有制度延续。</strong> 1993年国家安全立法已有国家安全工作与群众支持相联系的内容；2014年《反间谍法》第2条明确专门工作与群众路线相结合，第3条第2款规定有关机关、部门之间的配合，第4条强调依靠人民支持、动员和组织人民防范制止间谍行为。这一工作方式在2015年法中被放到更广泛的国家安全框架内理解。<a href=\"https://www.xiongan.gov.cn/2020-11/01/c_1210867136.htm\">2014年法律文本</a>。</p>\n<p><strong>初稿阶段已经确立基本思路。</strong> 2014年12月草案说明已列预防为主、标本兼治以及专门工作与群众路线相结合原则，见甲书附录二第375页（PDF388页）。现有材料足以说明原则的早期存在，不能据此还原未核实的每一版文字。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>预防为主。</strong> 将工作前移到风险识别、防范和能力建设，减少重大危害发生的可能性。它与风险评估、监测预警、预案等制度具有联系。</li>\n<li><strong>标本兼治。</strong> 既处理已经表现出来的危害和问题，也研究其产生的深层原因、条件和制度薄弱环节。不能把“治本”简单等同于加重惩罚。</li>\n<li><strong>专门工作与群众路线相结合。</strong> 专门机关承担依法开展的专业工作，公民和组织通过依法报告、配合、提供支持等方式参与。</li>\n<li><strong>专门机关与其他机关相配合。</strong> 甲、乙两书都强调，专群结合不能只理解为机关与个人之间的关系，还应关注有关部门依法履行职责、互相支持。</li>\n<li><strong>防范、制止、惩治相衔接。</strong> 分别面向风险形成、危害发生和责任追究等环节。条文对惩治明确要求“依法”，整条工作也受第7条约束。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>预防与惩罚的证明要求不能混同〔笔记分析〕。</strong> 预警信息可以触发依法评估或核查，但不当然证明某人已经违法犯罪。追究行政或刑事责任仍需满足相应实体和程序条件。“风险存在”与“个人应受处罚”是不同法律判断。</p>\n<p><strong>公众参与不等于执法权转移〔笔记分析〕。</strong> 公民和组织参与维护安全，不能由此自行取得搜查、扣押、拘禁或调查他人隐私的权力。应将线索提供、专业核查、依法处理区分开来，避免群众动员替代法定程序。</p>\n<p><strong>支持义务与权益保障相衔接。</strong> 维护安全的参与者也需要保护。第六章有关公民、组织的权利义务，可用于研究协助范围、人身保护、补偿抚恤和救济。参与机制越广泛，越需要明确合法边界和保障措施。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书实例</strong>：举报渠道及基层参与事例说明公众线索能够辅助专业工作；但举报数量、社会动员规模不直接等于国家安全工作的实际效果。</li>\n<li><strong>甲书补充</strong>：本条的预防与标本兼治不限于反间谍活动，还可从其他安全领域的风险源、制度漏洞和防范措施理解。具体措施仍须分别适用有关法律。</li>\n<li><strong>关联条文</strong>：第11—14条、第四章风险预防评估预警制度、第75条专门工作支持配合、第六章权利义务。</li>\n<li><strong>研究问题</strong>：怎样建立能够鼓励真实报告、保护参与者并减少误报、诬告和权利侵害的公众参与机制？</li>\n</ul></div></div>","notesHtml":"<p>本条包含两个主要层次：以何种方式应对风险，以及组织哪些力量共同维护安全。</p>\n<h3>二、立法沿革</h3>\n<p><strong>专群结合具有制度延续。</strong> 1993年国家安全立法已有国家安全工作与群众支持相联系的内容；2014年《反间谍法》第2条明确专门工作与群众路线相结合，第3条第2款规定有关机关、部门之间的配合，第4条强调依靠人民支持、动员和组织人民防范制止间谍行为。这一工作方式在2015年法中被放到更广泛的国家安全框架内理解。<a href=\"https://www.xiongan.gov.cn/2020-11/01/c_1210867136.htm\">2014年法律文本</a>。</p>\n<p><strong>初稿阶段已经确立基本思路。</strong> 2014年12月草案说明已列预防为主、标本兼治以及专门工作与群众路线相结合原则，见甲书附录二第375页（PDF388页）。现有材料足以说明原则的早期存在，不能据此还原未核实的每一版文字。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>预防为主。</strong> 将工作前移到风险识别、防范和能力建设，减少重大危害发生的可能性。它与风险评估、监测预警、预案等制度具有联系。</li>\n<li><strong>标本兼治。</strong> 既处理已经表现出来的危害和问题，也研究其产生的深层原因、条件和制度薄弱环节。不能把“治本”简单等同于加重惩罚。</li>\n<li><strong>专门工作与群众路线相结合。</strong> 专门机关承担依法开展的专业工作，公民和组织通过依法报告、配合、提供支持等方式参与。</li>\n<li><strong>专门机关与其他机关相配合。</strong> 甲、乙两书都强调，专群结合不能只理解为机关与个人之间的关系，还应关注有关部门依法履行职责、互相支持。</li>\n<li><strong>防范、制止、惩治相衔接。</strong> 分别面向风险形成、危害发生和责任追究等环节。条文对惩治明确要求“依法”，整条工作也受第7条约束。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>预防与惩罚的证明要求不能混同〔笔记分析〕。</strong> 预警信息可以触发依法评估或核查，但不当然证明某人已经违法犯罪。追究行政或刑事责任仍需满足相应实体和程序条件。“风险存在”与“个人应受处罚”是不同法律判断。</p>\n<p><strong>公众参与不等于执法权转移〔笔记分析〕。</strong> 公民和组织参与维护安全，不能由此自行取得搜查、扣押、拘禁或调查他人隐私的权力。应将线索提供、专业核查、依法处理区分开来，避免群众动员替代法定程序。</p>\n<p><strong>支持义务与权益保障相衔接。</strong> 维护安全的参与者也需要保护。第六章有关公民、组织的权利义务，可用于研究协助范围、人身保护、补偿抚恤和救济。参与机制越广泛，越需要明确合法边界和保障措施。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书实例</strong>：举报渠道及基层参与事例说明公众线索能够辅助专业工作；但举报数量、社会动员规模不直接等于国家安全工作的实际效果。</li>\n<li><strong>甲书补充</strong>：本条的预防与标本兼治不限于反间谍活动，还可从其他安全领域的风险源、制度漏洞和防范措施理解。具体措施仍须分别适用有关法律。</li>\n<li><strong>关联条文</strong>：第11—14条、第四章风险预防评估预警制度、第75条专门工作支持配合、第六章权利义务。</li>\n<li><strong>研究问题</strong>：怎样建立能够鼓励真实报告、保护参与者并减少误报、诬告和权利侵害的公众参与机制？</li>\n</ul>"},{"num":10,"label":"第十条","title":"国际安全合作与共同安全","lawText":"维护国家安全，应当坚持互信、互利、平等、协作，积极同外国政府和国际组织开展安全交流合作，履行国际安全义务，促进共同安全，维护世界和平。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第十条</div><p class=\"article-law-text\">维护国家安全，应当坚持互信、互利、平等、协作，积极同外国政府和国际组织开展安全交流合作，履行国际安全义务，促进共同安全，维护世界和平。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第十条</div><p class=\"article-law-text\">维护国家安全，应当坚持互信、互利、平等、协作，积极同外国政府和国际组织开展安全交流合作，履行国际安全义务，促进共同安全，维护世界和平。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>本条规定维护国家安全的对外合作原则，与第3条“以促进国际安全为依托”、第8条自身安全和共同安全的统筹相衔接。</p>\n<h3>二、立法沿革</h3>\n<p><strong>理念发展。</strong> 两书均联系我国关于互信、互利、平等、协作的新安全观和共同安全的论述，说明安全合作在国家安全体系中的位置。甲书偏重这一原则的制度意义；乙书还介绍共同安全概念的思想背景及后续实践。</p>\n<p><strong>初稿已经规定。</strong> 甲书附录二第376页（PDF389页）引述的草案条款已经包括四项合作原则、外国政府和国际组织、安全交流合作、国际义务、共同安全和世界和平。其表述含“有效履行国际安全义务”，最终文本为“履行国际安全义务”。能够确认的是两份材料的文字差异；修改时点和专门理由未核，不据此推导义务强度的实质变化。</p>\n<p><strong>后续发展另行标注。</strong> 乙书以2022年全球安全倡议等材料说明本条理念在实践中的展开。这些是通过后的发展，不是本条文字于2022年发生修改。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>互信。</strong> 增进沟通和理解，减少误判，形成可预期的合作条件。</li>\n<li><strong>互利。</strong> 合作应考虑相关各方的正当利益和安全关切，寻求共同收益。</li>\n<li><strong>平等。</strong> 以平等交往和相互尊重为基础开展合作，而非仅按力量强弱决定对方的安全地位。</li>\n<li><strong>协作。</strong> 通过交流、协调和具体行动，应对单一国家难以独立处理的安全问题。</li>\n<li><strong>国际义务与共同安全。</strong> 合作不仅是政策选择，还涉及已承担国际义务的履行。具体义务的主体、范围和内容，应查相应国际法和国内实施依据。</li>\n</ol>\n<p>上述四项原则的简要解释，是对两书相关论述的归纳；本条没有逐项规定独立的程序或责任形式。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>国际法框架。</strong> 《联合国宪章》第1条关于维护国际和平与安全及国际合作，第2条关于主权平等、善意履行义务、和平解决争端和禁止非法武力威胁或使用武力的原则，为理解安全合作提供规范背景。<a href=\"https://www.un.org/zh/about-us/un-charter/full-text\">《联合国宪章》中文全文</a>。</p>\n<p><strong>共同安全与集体安全须区分〔笔记分析〕。</strong> “共同安全”重视各方安全相互联系、通过合作减少威胁；宪章框架下的“集体安全”还涉及特定机构、职权和程序。不能把一般共同安全倡议等同于安理会决定，也不能把一般政治倡议直接认定为条约义务。</p>\n<p><strong>国内法与国际合作的衔接〔笔记分析〕。</strong> 本条为安全合作提供原则方向，但情报或数据交流、司法协助等具体合作，仍须分别符合适用的国内权限和程序、国际协议等条件。本条本身没有给予无条件的跨境资料提供权。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>两书对读</strong>：甲书强调国家安全不能脱离地区和世界安全环境；乙书以全球安全倡议、参与国际合作等事例说明这一联系。引用事例时保留其时间范围，不把作者评价当作对合作效果的独立证明。</li>\n<li><strong>常见误解</strong>：促进共同安全不等于放弃本国正当权益；维护本国安全也不能单凭本条推导超越国际法的行动权力。</li>\n<li><strong>关联条文</strong>：第3条、第8条、第18条有关国际军事安全合作及参与国际安全事务的规定。</li>\n<li><strong>研究问题</strong>：国际安全承诺如何区分政治倡议、条约义务、国际组织决定和国内法上的执行权限？</li>\n</ul>\n<h2>本批复习线索</h2>\n<p>前十条可以串联为：<strong>为何维护安全（第1条）—何为国家安全（第2条）—以何种观念指导（第3条）—由谁领导并承担哪些职责（第4—5条）—怎样形成长期安排（第6条）—遵循哪些工作原则（第7—10条）</strong>。</p>\n<p>阅读时尤其保留以下区分：</p>\n<table>\n<thead>\n<tr>\n  <th>容易混淆的概念</th>\n  <th>应当怎样区分</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>2015年法与1993年法</td>\n  <td>原法先由2014年反间谍立法承接，2015年另行制定综合性法律</td>\n</tr>\n<tr>\n  <td>国家安全与一般风险</td>\n  <td>说明其与国家核心、重大利益的具体关联</td>\n</tr>\n<tr>\n  <td>安全状态与安全能力</td>\n  <td>当前状况与维持、恢复安全的能力分别评价</td>\n</tr>\n<tr>\n  <td>总体安全与无限扩张</td>\n  <td>跨领域统筹仍需有法律依据和适用边界</td>\n</tr>\n<tr>\n  <td>领导协调与具体执法</td>\n  <td>组织安排与措施的法定权限、程序分别查明</td>\n</tr>\n<tr>\n  <td>战略、政策与法律授权</td>\n  <td>战略指导不能代替具体职权依据</td>\n</tr>\n<tr>\n  <td>预防与处罚</td>\n  <td>风险判断不自动满足违法犯罪的成立条件</td>\n</tr>\n<tr>\n  <td>共同安全与具体国际义务</td>\n  <td>合作理念与条约、国际组织决定的法律效力分别判断</td>\n</tr>\n</tbody>\n</table>\n<h2>书中疑点与勘误记录</h2>\n<p>以下相关文字已核对扫描页，并非仅由文字识别产生。纠正以法条和已核资料为限，不据此否定两书其他内容。</p>\n<table>\n<thead>\n<tr>\n  <th>位置</th>\n  <th>书中表述或问题</th>\n  <th>本笔记处理</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>乙书第5页（PDF14页）</td>\n  <td>“安全不是一个状态而是一个过程”</td>\n  <td>理解为强调动态性；法条本身同时包含状态和能力</td>\n</tr>\n<tr>\n  <td>乙书第9页（PDF18页）</td>\n  <td>“以国家安全为依托”</td>\n  <td>按第3条记为“以促进国际安全为依托”</td>\n</tr>\n<tr>\n  <td>乙书第13页（PDF22页）</td>\n  <td>十八届三中全会时间写为2013年10月</td>\n  <td>改记2013年11月；甲书相关制度脉络亦可对照</td>\n</tr>\n<tr>\n  <td>乙书第19页（PDF28页）</td>\n  <td>“2009年《反间谍法》第54条”</td>\n  <td>年份与条次有误，暂不据该案概要认定具体处罚依据</td>\n</tr>\n<tr>\n  <td>乙书第19页（PDF28页）</td>\n  <td>人权关联条文列《宪法》第23条</td>\n  <td>人权保障的直接条文应查第33条，第5条也相关</td>\n</tr>\n<tr>\n  <td>乙书第21页（PDF30页）</td>\n  <td>国民安全限于领土内国民</td>\n  <td>与本法第33条海外权益保护联读，不作境内限定</td>\n</tr>\n</tbody>\n</table>\n<p>反间谍法错引的核查依据：<a href=\"https://www.xiongan.gov.cn/2020-11/01/c_1210867136.htm\">2014年全文</a>、<a href=\"https://www.gjbmj.gov.cn/n1/2023/0802/c409088-40049143.html\">2023年修订全文及施行日期</a>。宪法人权条款依据：<a href=\"https://www.npc.gov.cn/zgrdw/npc/xinwen/2018-03/22/content_2052489.htm\">2018年修正的《宪法》</a>。</p>\n<h2>继续研读的材料定位</h2>\n<p>本批除各条正文外，重点使用了甲书以下立法资料：</p>\n<ul>\n<li>附录二《〈中华人民共和国国家安全法（草案）〉的说明》，2014年12月22日，书内第371—377页（PDF384—390页）。其中第375—376页可核初稿定义、领导体制、人权保障、统筹原则与国际合作。</li>\n<li>附录三《全国人民代表大会法律委员会关于〈中华人民共和国国家安全法（草案）〉修改情况的汇报》，2015年4月20日，书内第378页起（PDF391页起）。其中第379页是第3条扩充和第6条位置调整的直接证据。</li>\n</ul>\n<p>后续批次沿用本笔记的五个栏目，依次整理第11—20条、第21—30条，直至第84条。每批均应将书中解释、立法沿革证据和新增分析分别标明。</p></div></div>","notesHtml":"<p>本条规定维护国家安全的对外合作原则，与第3条“以促进国际安全为依托”、第8条自身安全和共同安全的统筹相衔接。</p>\n<h3>二、立法沿革</h3>\n<p><strong>理念发展。</strong> 两书均联系我国关于互信、互利、平等、协作的新安全观和共同安全的论述，说明安全合作在国家安全体系中的位置。甲书偏重这一原则的制度意义；乙书还介绍共同安全概念的思想背景及后续实践。</p>\n<p><strong>初稿已经规定。</strong> 甲书附录二第376页（PDF389页）引述的草案条款已经包括四项合作原则、外国政府和国际组织、安全交流合作、国际义务、共同安全和世界和平。其表述含“有效履行国际安全义务”，最终文本为“履行国际安全义务”。能够确认的是两份材料的文字差异；修改时点和专门理由未核，不据此推导义务强度的实质变化。</p>\n<p><strong>后续发展另行标注。</strong> 乙书以2022年全球安全倡议等材料说明本条理念在实践中的展开。这些是通过后的发展，不是本条文字于2022年发生修改。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>互信。</strong> 增进沟通和理解，减少误判，形成可预期的合作条件。</li>\n<li><strong>互利。</strong> 合作应考虑相关各方的正当利益和安全关切，寻求共同收益。</li>\n<li><strong>平等。</strong> 以平等交往和相互尊重为基础开展合作，而非仅按力量强弱决定对方的安全地位。</li>\n<li><strong>协作。</strong> 通过交流、协调和具体行动，应对单一国家难以独立处理的安全问题。</li>\n<li><strong>国际义务与共同安全。</strong> 合作不仅是政策选择，还涉及已承担国际义务的履行。具体义务的主体、范围和内容，应查相应国际法和国内实施依据。</li>\n</ol>\n<p>上述四项原则的简要解释，是对两书相关论述的归纳；本条没有逐项规定独立的程序或责任形式。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>国际法框架。</strong> 《联合国宪章》第1条关于维护国际和平与安全及国际合作，第2条关于主权平等、善意履行义务、和平解决争端和禁止非法武力威胁或使用武力的原则，为理解安全合作提供规范背景。<a href=\"https://www.un.org/zh/about-us/un-charter/full-text\">《联合国宪章》中文全文</a>。</p>\n<p><strong>共同安全与集体安全须区分〔笔记分析〕。</strong> “共同安全”重视各方安全相互联系、通过合作减少威胁；宪章框架下的“集体安全”还涉及特定机构、职权和程序。不能把一般共同安全倡议等同于安理会决定，也不能把一般政治倡议直接认定为条约义务。</p>\n<p><strong>国内法与国际合作的衔接〔笔记分析〕。</strong> 本条为安全合作提供原则方向，但情报或数据交流、司法协助等具体合作，仍须分别符合适用的国内权限和程序、国际协议等条件。本条本身没有给予无条件的跨境资料提供权。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>两书对读</strong>：甲书强调国家安全不能脱离地区和世界安全环境；乙书以全球安全倡议、参与国际合作等事例说明这一联系。引用事例时保留其时间范围，不把作者评价当作对合作效果的独立证明。</li>\n<li><strong>常见误解</strong>：促进共同安全不等于放弃本国正当权益；维护本国安全也不能单凭本条推导超越国际法的行动权力。</li>\n<li><strong>关联条文</strong>：第3条、第8条、第18条有关国际军事安全合作及参与国际安全事务的规定。</li>\n<li><strong>研究问题</strong>：国际安全承诺如何区分政治倡议、条约义务、国际组织决定和国内法上的执行权限？</li>\n</ul>\n<h2>本批复习线索</h2>\n<p>前十条可以串联为：<strong>为何维护安全（第1条）—何为国家安全（第2条）—以何种观念指导（第3条）—由谁领导并承担哪些职责（第4—5条）—怎样形成长期安排（第6条）—遵循哪些工作原则（第7—10条）</strong>。</p>\n<p>阅读时尤其保留以下区分：</p>\n<table>\n<thead>\n<tr>\n  <th>容易混淆的概念</th>\n  <th>应当怎样区分</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>2015年法与1993年法</td>\n  <td>原法先由2014年反间谍立法承接，2015年另行制定综合性法律</td>\n</tr>\n<tr>\n  <td>国家安全与一般风险</td>\n  <td>说明其与国家核心、重大利益的具体关联</td>\n</tr>\n<tr>\n  <td>安全状态与安全能力</td>\n  <td>当前状况与维持、恢复安全的能力分别评价</td>\n</tr>\n<tr>\n  <td>总体安全与无限扩张</td>\n  <td>跨领域统筹仍需有法律依据和适用边界</td>\n</tr>\n<tr>\n  <td>领导协调与具体执法</td>\n  <td>组织安排与措施的法定权限、程序分别查明</td>\n</tr>\n<tr>\n  <td>战略、政策与法律授权</td>\n  <td>战略指导不能代替具体职权依据</td>\n</tr>\n<tr>\n  <td>预防与处罚</td>\n  <td>风险判断不自动满足违法犯罪的成立条件</td>\n</tr>\n<tr>\n  <td>共同安全与具体国际义务</td>\n  <td>合作理念与条约、国际组织决定的法律效力分别判断</td>\n</tr>\n</tbody>\n</table>\n<h2>书中疑点与勘误记录</h2>\n<p>以下相关文字已核对扫描页，并非仅由文字识别产生。纠正以法条和已核资料为限，不据此否定两书其他内容。</p>\n<table>\n<thead>\n<tr>\n  <th>位置</th>\n  <th>书中表述或问题</th>\n  <th>本笔记处理</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>乙书第5页（PDF14页）</td>\n  <td>“安全不是一个状态而是一个过程”</td>\n  <td>理解为强调动态性；法条本身同时包含状态和能力</td>\n</tr>\n<tr>\n  <td>乙书第9页（PDF18页）</td>\n  <td>“以国家安全为依托”</td>\n  <td>按第3条记为“以促进国际安全为依托”</td>\n</tr>\n<tr>\n  <td>乙书第13页（PDF22页）</td>\n  <td>十八届三中全会时间写为2013年10月</td>\n  <td>改记2013年11月；甲书相关制度脉络亦可对照</td>\n</tr>\n<tr>\n  <td>乙书第19页（PDF28页）</td>\n  <td>“2009年《反间谍法》第54条”</td>\n  <td>年份与条次有误，暂不据该案概要认定具体处罚依据</td>\n</tr>\n<tr>\n  <td>乙书第19页（PDF28页）</td>\n  <td>人权关联条文列《宪法》第23条</td>\n  <td>人权保障的直接条文应查第33条，第5条也相关</td>\n</tr>\n<tr>\n  <td>乙书第21页（PDF30页）</td>\n  <td>国民安全限于领土内国民</td>\n  <td>与本法第33条海外权益保护联读，不作境内限定</td>\n</tr>\n</tbody>\n</table>\n<p>反间谍法错引的核查依据：<a href=\"https://www.xiongan.gov.cn/2020-11/01/c_1210867136.htm\">2014年全文</a>、<a href=\"https://www.gjbmj.gov.cn/n1/2023/0802/c409088-40049143.html\">2023年修订全文及施行日期</a>。宪法人权条款依据：<a href=\"https://www.npc.gov.cn/zgrdw/npc/xinwen/2018-03/22/content_2052489.htm\">2018年修正的《宪法》</a>。</p>\n<h2>继续研读的材料定位</h2>\n<p>本批除各条正文外，重点使用了甲书以下立法资料：</p>\n<ul>\n<li>附录二《〈中华人民共和国国家安全法（草案）〉的说明》，2014年12月22日，书内第371—377页（PDF384—390页）。其中第375—376页可核初稿定义、领导体制、人权保障、统筹原则与国际合作。</li>\n<li>附录三《全国人民代表大会法律委员会关于〈中华人民共和国国家安全法（草案）〉修改情况的汇报》，2015年4月20日，书内第378页起（PDF391页起）。其中第379页是第3条扩充和第6条位置调整的直接证据。</li>\n</ul>\n<p>后续批次沿用本笔记的五个栏目，依次整理第11—20条、第21—30条，直至第84条。每批均应将书中解释、立法沿革证据和新增分析分别标明。</p>"},{"num":11,"label":"第十一条","title":"维护国家安全的责任与义务","lawText":"中华人民共和国公民、一切国家机关和武装力量、各政党和各人民团体、企业事业组织和其他社会组织，都有维护国家安全的责任和义务。 中国的主权和领土完整不容侵犯和分割。维护国家主权、统一和领土完整是包括港澳同胞和台湾同胞在内的全中国人民的共同义务。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第十一条</div><p class=\"article-law-text\">中华人民共和国公民、一切国家机关和武装力量、各政党和各人民团体、企业事业组织和其他社会组织，都有维护国家安全的责任和义务。 中国的主权和领土完整不容侵犯和分割。维护国家主权、统一和领土完整是包括港澳同胞和台湾同胞在内的全中国人民的共同义务。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第十一条</div><p class=\"article-law-text\">中华人民共和国公民、一切国家机关和武装力量、各政党和各人民团体、企业事业组织和其他社会组织，都有维护国家安全的责任和义务。 中国的主权和领土完整不容侵犯和分割。维护国家主权、统一和领土完整是包括港澳同胞和台湾同胞在内的全中国人民的共同义务。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>第一款规定维护国家安全的广泛主体范围；第二款专门规定维护国家主权、统一和领土完整的共同义务。</p>\n<h3>二、立法沿革</h3>\n<p><strong>宪法上的义务基础。</strong> 两书主要联系《宪法》第52条维护国家统一和民族团结义务、第54条维护祖国安全荣誉利益义务、第55条保卫祖国和抵抗侵略职责。本条将相关义务放入综合性国家安全法律框架，并明确机关、组织等主体。</p>\n<p><strong>初稿已有港澳台相关表述。</strong> 2014年12月22日草案说明已强调国家安全人人有责，并说明包括港澳同胞和台湾同胞在内的共同义务，见甲书附录二第377页（PDF390页）。不能误记为三审时才增加。</p>\n<p><strong>注意说明与完整草案的差别。</strong> 草案说明中相关表述与定稿有少量文字差异，但说明可能包含概述；仅据它不能还原每一处字词的修改过程。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>义务主体广泛。</strong> 本条既包括公民，也包括国家机关、武装力量、政党、人民团体和各类组织。维护国家安全并非只由国家安全机关承担。</li>\n<li><strong>共同责任不等于相同责任。</strong> 国家机关的职权与职责、企业的配合和内部管理义务、公民的报告和协助义务，应分别查明，不能把所有主体的义务内容简单等同。</li>\n<li><strong>第二款突出特定保护利益。</strong> 主权、统一和领土完整在本条中被专门强调。这是本法关于共同义务的规范表达；具体法律适用与执行仍应分别依据有关制度。</li>\n<li><strong>后续条文将原则具体化。</strong> 第77条规定报告线索、提供证据、支持协助、保守秘密等义务，第78条规定单位教育动员职责，第79条涉及企业事业组织配合采取安全措施，第13条连接法律责任。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>一般义务与具体行为义务〔笔记分析〕。</strong> 本条确定总体责任方向；判断某人是否违反一项具体义务，还要确定其法定内容、触发条件、履行能力及有关程序。抽象的共同义务不当然意味着可以要求任意个人无限提供财产、信息或劳动。</p>\n<p><strong>义务与权利相互联系。</strong> 本条应同第7条以及第六章保护、补偿和救济规定合读。承担维护安全的义务，不等于放弃自身的法定权利。</p>\n<p><strong>共同义务与地域适用〔体系解释〕。</strong> 甲书第56页特别讨论港澳基本法第18、23条。第二款的共同义务表述，不能直接推出内地所有国家安全法律、职权和程序自动在港澳以相同方式实施。应区分全国性法律适用机制、特别行政区自行立法义务及有关具体制度。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>版本更新</strong>：甲书第56页“香港尚未就基本法第二十三条立法”是2016年的历史描述。香港《维护国家安全条例》已于2024年3月23日刊宪生效；应将此作为后续发展另记。<a href=\"https://www.news.gov.hk/chi/2024/03/20240323/20240323_170428_609.html\">香港特区政府公布的生效信息</a>。</li>\n<li><strong>两书对读</strong>：甲书重在宪法、基本法和具体义务的联系；乙书补充后续政治与实践背景。乙书有关南海仲裁的评价是其叙述立场，若作国际法专题研究，应另行对照裁决、管辖权规则和各方正式立场，不以读书概述替代争议分析。</li>\n<li><strong>研究问题</strong>：在普遍义务的前提下，怎样使不同主体明确知道何时应当做什么、由谁提出要求、可以获得何种保障？</li>\n</ul></div></div>","notesHtml":"<p>第一款规定维护国家安全的广泛主体范围；第二款专门规定维护国家主权、统一和领土完整的共同义务。</p>\n<h3>二、立法沿革</h3>\n<p><strong>宪法上的义务基础。</strong> 两书主要联系《宪法》第52条维护国家统一和民族团结义务、第54条维护祖国安全荣誉利益义务、第55条保卫祖国和抵抗侵略职责。本条将相关义务放入综合性国家安全法律框架，并明确机关、组织等主体。</p>\n<p><strong>初稿已有港澳台相关表述。</strong> 2014年12月22日草案说明已强调国家安全人人有责，并说明包括港澳同胞和台湾同胞在内的共同义务，见甲书附录二第377页（PDF390页）。不能误记为三审时才增加。</p>\n<p><strong>注意说明与完整草案的差别。</strong> 草案说明中相关表述与定稿有少量文字差异，但说明可能包含概述；仅据它不能还原每一处字词的修改过程。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>义务主体广泛。</strong> 本条既包括公民，也包括国家机关、武装力量、政党、人民团体和各类组织。维护国家安全并非只由国家安全机关承担。</li>\n<li><strong>共同责任不等于相同责任。</strong> 国家机关的职权与职责、企业的配合和内部管理义务、公民的报告和协助义务，应分别查明，不能把所有主体的义务内容简单等同。</li>\n<li><strong>第二款突出特定保护利益。</strong> 主权、统一和领土完整在本条中被专门强调。这是本法关于共同义务的规范表达；具体法律适用与执行仍应分别依据有关制度。</li>\n<li><strong>后续条文将原则具体化。</strong> 第77条规定报告线索、提供证据、支持协助、保守秘密等义务，第78条规定单位教育动员职责，第79条涉及企业事业组织配合采取安全措施，第13条连接法律责任。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>一般义务与具体行为义务〔笔记分析〕。</strong> 本条确定总体责任方向；判断某人是否违反一项具体义务，还要确定其法定内容、触发条件、履行能力及有关程序。抽象的共同义务不当然意味着可以要求任意个人无限提供财产、信息或劳动。</p>\n<p><strong>义务与权利相互联系。</strong> 本条应同第7条以及第六章保护、补偿和救济规定合读。承担维护安全的义务，不等于放弃自身的法定权利。</p>\n<p><strong>共同义务与地域适用〔体系解释〕。</strong> 甲书第56页特别讨论港澳基本法第18、23条。第二款的共同义务表述，不能直接推出内地所有国家安全法律、职权和程序自动在港澳以相同方式实施。应区分全国性法律适用机制、特别行政区自行立法义务及有关具体制度。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>版本更新</strong>：甲书第56页“香港尚未就基本法第二十三条立法”是2016年的历史描述。香港《维护国家安全条例》已于2024年3月23日刊宪生效；应将此作为后续发展另记。<a href=\"https://www.news.gov.hk/chi/2024/03/20240323/20240323_170428_609.html\">香港特区政府公布的生效信息</a>。</li>\n<li><strong>两书对读</strong>：甲书重在宪法、基本法和具体义务的联系；乙书补充后续政治与实践背景。乙书有关南海仲裁的评价是其叙述立场，若作国际法专题研究，应另行对照裁决、管辖权规则和各方正式立场，不以读书概述替代争议分析。</li>\n<li><strong>研究问题</strong>：在普遍义务的前提下，怎样使不同主体明确知道何时应当做什么、由谁提出要求、可以获得何种保障？</li>\n</ul>"},{"num":12,"label":"第十二条","title":"表彰和奖励","lawText":"国家对在维护国家安全工作中作出突出贡献的个人和组织给予表彰和奖励。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第十二条</div><p class=\"article-law-text\">国家对在维护国家安全工作中作出突出贡献的个人和组织给予表彰和奖励。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第十二条</div><p class=\"article-law-text\">国家对在维护国家安全工作中作出突出贡献的个人和组织给予表彰和奖励。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>本条是激励性规范，基本结构为“实施主体—受奖对象—贡献条件—激励方式”。</p>\n<h3>二、立法沿革</h3>\n<p><strong>制度背景。</strong> 甲书将奖励置于法律的激励功能中解释：国家安全维护除职责、义务与责任追究外，还需要通过荣誉和物质激励，鼓励个人、组织作出积极贡献。本条与第9条公众参与、第11条共同责任相衔接。</p>\n<p><strong>与既有奖励制度的衔接。</strong> 甲书联系公务员奖励制度说明，本条作原则规定，具体奖励权限、形式和程序仍要依有关制度实施。不能因本条文字简短，就认为奖励可以脱离程序任意作出。</p>\n<p>本批所读立法附录未提供本条具体的逐稿修改记录；这里记载的是制度背景，不推断它在某轮审议被新增或改写。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>主体是国家。</strong> 甲书强调，本条规定的是国家实施的表彰奖励，与社会组织自行开展的民间表扬有区别。具体由哪个机关实施，要看相应权限规定。</li>\n<li><strong>对象包括个人与组织。</strong> 既可能是国家机关工作人员或集体，也可能是普通公民、企业事业组织等，不能限于国家安全机关及其人员。</li>\n<li><strong>条件是突出贡献。</strong> 法条使用“突出”，意味着应当根据贡献的实质作出评价，而不是凡参与或凡举报必然得到同等程度的奖励。</li>\n<li><strong>方式包括表彰和奖励。</strong> 两书均从精神激励与物质激励理解，但本条没有规定每一种贡献对应何种荣誉、金额或待遇，也未要求所有受奖者都必须同时获得两种形式。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>法律的激励功能。</strong> 甲书将本条与制裁性规范对比，说明法律不仅通过不利后果约束行为，也能通过正向激励引导参与。两者共同服务于制度的实施。</p>\n<p><strong>突出贡献的认定〔笔记分析〕。</strong> 评价宜关注帮助发现、防范、制止或处置危害的实际作用。两书都提到贡献的示范和社会影响，但国家安全工作可能需要保密，不能据此把“事迹必须公开并获得广泛关注”另加为法定受奖条件。</p>\n<p><strong>奖励与保护、补偿不同。</strong> 奖励着眼于积极贡献；保护着眼于避免参与者遭受危险；补偿、抚恤着眼于依法处理履行相关义务所受损失。不能因为给了奖金，就认为保护和补偿义务已经履行。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>行政裁量问题</strong>：本条并未规定统一数额，也不宜从本条直接推导某个具体金额的请求权。研究具体争议，要查有关奖励办法和认定程序。</li>\n<li><strong>参与边界</strong>：贡献评价不应鼓励虚构事实、侵害他人或违法取证。公众参与仍受第7条法治原则和有关法律约束。</li>\n<li><strong>两书对读</strong>：甲书对激励原理、精神与物质奖励、程序衔接论述更详细；乙书适合归纳国家、个人组织、突出贡献、激励方式四个要素。</li>\n<li><strong>研究问题</strong>：怎样兼顾真实贡献、保密需要、程序公正与公众对奖励制度的可预期性？</li>\n</ul></div></div>","notesHtml":"<p>本条是激励性规范，基本结构为“实施主体—受奖对象—贡献条件—激励方式”。</p>\n<h3>二、立法沿革</h3>\n<p><strong>制度背景。</strong> 甲书将奖励置于法律的激励功能中解释：国家安全维护除职责、义务与责任追究外，还需要通过荣誉和物质激励，鼓励个人、组织作出积极贡献。本条与第9条公众参与、第11条共同责任相衔接。</p>\n<p><strong>与既有奖励制度的衔接。</strong> 甲书联系公务员奖励制度说明，本条作原则规定，具体奖励权限、形式和程序仍要依有关制度实施。不能因本条文字简短，就认为奖励可以脱离程序任意作出。</p>\n<p>本批所读立法附录未提供本条具体的逐稿修改记录；这里记载的是制度背景，不推断它在某轮审议被新增或改写。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>主体是国家。</strong> 甲书强调，本条规定的是国家实施的表彰奖励，与社会组织自行开展的民间表扬有区别。具体由哪个机关实施，要看相应权限规定。</li>\n<li><strong>对象包括个人与组织。</strong> 既可能是国家机关工作人员或集体，也可能是普通公民、企业事业组织等，不能限于国家安全机关及其人员。</li>\n<li><strong>条件是突出贡献。</strong> 法条使用“突出”，意味着应当根据贡献的实质作出评价，而不是凡参与或凡举报必然得到同等程度的奖励。</li>\n<li><strong>方式包括表彰和奖励。</strong> 两书均从精神激励与物质激励理解，但本条没有规定每一种贡献对应何种荣誉、金额或待遇，也未要求所有受奖者都必须同时获得两种形式。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>法律的激励功能。</strong> 甲书将本条与制裁性规范对比，说明法律不仅通过不利后果约束行为，也能通过正向激励引导参与。两者共同服务于制度的实施。</p>\n<p><strong>突出贡献的认定〔笔记分析〕。</strong> 评价宜关注帮助发现、防范、制止或处置危害的实际作用。两书都提到贡献的示范和社会影响，但国家安全工作可能需要保密，不能据此把“事迹必须公开并获得广泛关注”另加为法定受奖条件。</p>\n<p><strong>奖励与保护、补偿不同。</strong> 奖励着眼于积极贡献；保护着眼于避免参与者遭受危险；补偿、抚恤着眼于依法处理履行相关义务所受损失。不能因为给了奖金，就认为保护和补偿义务已经履行。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>行政裁量问题</strong>：本条并未规定统一数额，也不宜从本条直接推导某个具体金额的请求权。研究具体争议，要查有关奖励办法和认定程序。</li>\n<li><strong>参与边界</strong>：贡献评价不应鼓励虚构事实、侵害他人或违法取证。公众参与仍受第7条法治原则和有关法律约束。</li>\n<li><strong>两书对读</strong>：甲书对激励原理、精神与物质奖励、程序衔接论述更详细；乙书适合归纳国家、个人组织、突出贡献、激励方式四个要素。</li>\n<li><strong>研究问题</strong>：怎样兼顾真实贡献、保密需要、程序公正与公众对奖励制度的可预期性？</li>\n</ul>"},{"num":13,"label":"第十三条","title":"法律责任","lawText":"国家机关工作人员在国家安全工作和涉及国家安全活动中，滥用职权、玩忽职守、徇私舞弊的，依法追究法律责任。 任何个人和组织违反本法和有关法律，不履行维护国家安全义务或者从事危害国家安全活动的，依法追究法律责任。","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第十三条</div><p class=\"article-law-text\">国家机关工作人员在国家安全工作和涉及国家安全活动中，滥用职权、玩忽职守、徇私舞弊的，依法追究法律责任。 任何个人和组织违反本法和有关法律，不履行维护国家安全义务或者从事危害国家安全活动的，依法追究法律责任。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第十三条</div><p class=\"article-law-text\">国家机关工作人员在国家安全工作和涉及国家安全活动中，滥用职权、玩忽职守、徇私舞弊的，依法追究法律责任。 任何个人和组织违反本法和有关法律，不履行维护国家安全义务或者从事危害国家安全活动的，依法追究法律责任。</p><div class=\"article-note-divider\">MD 研读笔记</div><div class=\"article-notes\"><p>第一款针对国家机关工作人员的违法履职，第二款规定任何个人和组织违反义务或实施危害行为的法律责任。</p>\n<h3>二、立法沿革</h3>\n<p><strong>这是有明确审议记录的一条。</strong> 2015年6月24日审议结果报告记载，有意见认为草案责任规定笼统，建议单列法律责任章；另有意见要求规定国家机关工作人员不履责和违法行为的责任。</p>\n<p><strong>立法选择是总则原则规定、专门法律具体规定。</strong> 法律委员会考虑本法的综合性、全局性、基础性和涉及领域广泛，建议参照有关立法做法，在总则设置这两款责任要求，具体责任由刑法、反间谍法等有关法律明确。见甲书附录四第385页（PDF398页）。</p>\n<p>这段材料直接解释了本条为何没有列出具体罚款、拘留或刑期，理解其性质时应优先使用。</p>\n<h3>三、主要内容</h3>\n<p><strong>第一款的主体不限于国家安全机关人员。</strong> 两书都指出，应包括在国家安全工作或涉及国家安全活动中履职的相关国家机关工作人员。</p>\n<p><strong>三类行为具有不同侧重。</strong> 滥用职权侧重超越权限、违背目的或不当行使权力；玩忽职守侧重应当并能够履职而未尽责；徇私舞弊侧重因私情私利违背事实和法律。它们是理解行为的基本分类，是否构成特定犯罪仍须依法逐项判断。</p>\n<p><strong>第二款兼顾不作为与作为。</strong> 不履行法定安全义务是一类情形，实施危害安全活动是另一类情形。两类行为的责任轻重不能只按“作为／不作为”机械决定。</p>\n<p><strong>“依法”要求寻找具体责任依据。</strong> 本条没有单独创设一种包罗全部安全问题的罪名或处罚。适用责任须查明主体、行为、过错、后果等相应法定要件，以及负责处理的机关和程序。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>责任衔接条款〔笔记分析〕。</strong> 本条具有原则性责任宣示和衔接作用。它可以与具体责任规范共同适用，但不能被当成绕开明确处罚依据的通用条款。</p>\n<p><strong>权力与义务的双向约束。</strong> 第11条要求公民、组织承担安全义务，第13条第一款同时要求国家工作人员承担违法履职责任。两者连同第7、43条，使安全法治兼有维护秩序和约束公权力的面向。</p>\n<p><strong>责任类型不能混淆。</strong> 对工作人员的处分、对违法行为的行政处罚以及对犯罪的刑罚有不同对象、要件和程序。构成犯罪时不能以较轻的内部处理代替刑事追责；但也不能仅凭“危害安全”这一概括就跳过犯罪构成判断。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>刑罚分类勘误</strong>：乙书第33页（PDF42页）将“财产刑”列入“主刑”，不符合我国刑法分类。《刑法》第33条列主刑，第34条列附加刑；罚金、没收财产属于附加刑。<a href=\"https://www.npc.gov.cn/zgrdw/npc/lfzt/rlys/2008-08/21/content_1882895.htm\">中国人大网刑法第33—34条</a>。</li>\n<li><strong>案例时点</strong>：乙书第34页援引2014年的刑事案件。该案可以说明相关危害行为与刑事追责的背景，但2015年本法当时尚未施行，不能把它写成本条的实际适用判例。</li>\n<li><strong>旧法更新</strong>：甲书引用的行政监察法、物权法等，应保留历史身份；研究今天的具体责任和权益救济须核对现行相应法律，不能原样照抄旧条号。</li>\n<li><strong>研究问题</strong>：在本法只作原则规定的领域，具体责任规范是否充分、清楚，并与程序保障相匹配？</li>\n</ul></div></div>","notesHtml":"<p>第一款针对国家机关工作人员的违法履职，第二款规定任何个人和组织违反义务或实施危害行为的法律责任。</p>\n<h3>二、立法沿革</h3>\n<p><strong>这是有明确审议记录的一条。</strong> 2015年6月24日审议结果报告记载，有意见认为草案责任规定笼统，建议单列法律责任章；另有意见要求规定国家机关工作人员不履责和违法行为的责任。</p>\n<p><strong>立法选择是总则原则规定、专门法律具体规定。</strong> 法律委员会考虑本法的综
