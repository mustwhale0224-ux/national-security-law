402页）\u003c/p>\n\u003cp>\u003cstrong>既有制度背景。\u003c/strong> 制定本法时，《突发事件应对法》及有关治安、信访制度已对风险预防和事件应对作出规定。党的十八届三中全会有关创新矛盾化解机制、健全公共安全体系的部署，以及2015年政府工作报告，进一步强调诉求表达、矛盾调处、权益保障、行政复议和人民调解、行政调解、司法调解的衔接。预防社会风险因而包含日常纠纷解决、行政纠错与公共服务，不只是事件发生后的控制。\u003c/p>\n\u003cp>\u003cstrong>2024年修订。\u003c/strong> 《突发事件应对法》于2024年6月28日修订，自同年11月1日起施行。今天研究预防与应急准备、监测预警、处置救援和事后恢复，应衔接该修订文本；2015年本条突出公共卫生的沿革，与2024年专门法的制度更新属于两个时间层次。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">修订后的《突发事件应对法》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>“社会安全”在不同语境中有宽窄之别。\u003c/strong> 广义的社会安全涉及公众生命、健康和财产安全；“社会安全事件”在突发事件分类中则与自然灾害、事故灾难、公共卫生事件并列。本条任务范围较广，既包括社会矛盾预防，也包括公共卫生等其他类型突发事件的影响，不能将其全部划为狭义社会安全事件。\u003c/li>\n\u003cli>\u003cstrong>把化解矛盾放在前端。\u003c/strong> 社会矛盾通常经历积累、激化过程；征地拆迁、环境污染、工资福利等争议需要畅通表达、及时处理和权益保障。政府、基层组织和相关单位分别承担发现、调解、报告和内部管理职责。重大决策社会稳定风险评估不能只计算事件发生概率，还应与决策合法性、合理诉求的解决结合理解。诉求表达、心理干预、调解联动和行政复议纠错，可以从不同环节避免矛盾长期积累。\u003c/li>\n\u003cli>\u003cstrong>公共安全体系具有跨领域属性。\u003c/strong> 食品药品监管、生产安全、隐患排查、防灾减灾、社会治安和网络信息安全均与公共安全体系有关。监测、预案、队伍、物资、教育以及常态监管共同支持事前预防和事后救援，应急框架和区域救援能力也须与这些机制衔接，不能将其理解为某一个机关的单项治安工作。\u003c/li>\n\u003cli>\u003cstrong>按事件性质适用具体处置制度。\u003c/strong> 社会安全事件处置可能涉及现场冲突控制、警戒及秩序恢复；自然灾害、事故灾难、公共卫生事件处置则强调救助、危险源控制、基本生活供应、医疗防疫与防止次生灾害。两类机制既可能协同，也有不同的法定条件，不能因为都影响稳定就互相套用全部措施。\u003c/li>\n\u003cli>\u003cstrong>控制危害与恢复秩序应同时保障人的基本需要。\u003c/strong> 疏散、安置、救治、供水、食品等措施体现人民安全要求。应急治理还须避免信息不畅、生活保障不足、二次伤害等造成新的风险。认定风险“影响国家安全和社会稳定”，要说明其具体关联，不能只使用抽象标签。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>矛盾治理与权利救济〔笔记分析〕。\u003c/strong> 本条使用“预防、减少、化解”而不只是“惩治”，为纠纷解决、诉求回应和公共服务留下重要位置。合法表达诉求、提起诉讼、申请复议本身不等于危害国家安全；应当区分纠纷原因、权利主张、表达方式以及是否存在具体违法行为。第7条和第82条的权利保障、批评建议及救济条款是本条的体系限制。\u003c/p>\n\u003cp>\u003cstrong>公共风险升级并非自动发生〔笔记分析〕。\u003c/strong> 公共卫生事件或局部事故可能通过社会恐慌、基础服务中断、风险扩散影响整体安全，但“可能关联”不意味着每起普通纠纷、事故都应直接进入国家安全特殊程序。应当结合第2条重大利益标准与第8条协调原则，说明风险程度、影响范围和措施必要性。\u003c/p>\n\u003cp>\u003cstrong>预防、应急、恢复是连续过程。\u003c/strong> 基层调解与隐患排查着眼于损害前发现和化解问题，现场处置与救助着眼于依法协调响应，生活保障、服务恢复及后续纠纷解决则着眼于消除事件影响和原有矛盾。评价本条任务是否完成，须贯通这些阶段；只关注现场控制速度，无法判断风险是否得到持续化解。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>乙书案例的真实编号与适用位置。\u003c/strong> 乙书第81页（PDF90页）脚注确实印作“最高人民法院指导性案例202号”，不是OCR错误；所述朱某良、朱某涛非法采砂后修复果园土壤的案件，实际对应\u003cstrong>指导性案例206号\u003c/strong>。最高法院规则重点在于整体生态修复、修复效果评估，以及符合条件的代他人修复支出与生态服务功能损失赔偿折抵。\u003ca href=\"https://www.court.gov.cn/zixun/xiangqing/386171.html\">最高人民法院指导性案例206号\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>案例评析。\u003c/strong> 该案体现生态公共利益保护和纠纷解决，但并非突发社会安全事件应急处置的直接案例。将其放在本条，可讨论通过司法救济维护社会公共利益；要研究其裁判规则，更宜与第30条生态安全合读。不能由“侵害不特定多数人的利益”直接得出“构成国家安全事件”。\u003c/p>\n\u003cp>\u003cstrong>研究问题。\u003c/strong> 国家安全、公共安全与日常纠纷解决之间，怎样建立分层响应标准？重大决策风险评估如何纳入利益相关者的意见及权利救济，而不只是预测公众反应？\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条同时规定日常制度建设和突发事件应对：前者着重预防、疏导与权益保障，后者着重依法采取应急措施。社会矛盾、公共安全、社会安全事件和国家安全不是可以不加区别地互换的概念。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>可以查证的定稿修改。\u003c/strong> 2015年6月30日法律委员会《关于〈中华人民共和国国家安全法（草案三次审议稿）〉修改意见的报告》记载，部分常委会组成人员认为，包括重大传染病疫情在内的公共卫生安全问题已经成为威胁国家安全的重要因素，建议明确规定。法律委员会据此建议将“妥善处置各类影响国家安全和社会稳定的突发事件”改为“妥善处置公共卫生、社会安全等影响国家安全和社会稳定的突发事件”。这是对公共卫生问题的有意突出，并非后来疫情发生后才添加。（甲书附录五第388—389页，PDF401—402页）\u003c/p>\n\u003cp>\u003cstrong>既有制度背景。\u003c/strong> 制定本法时，《突发事件应对法》及有关治安、信访制度已对风险预防和事件应对作出规定。党的十八届三中全会有关创新矛盾化解机制、健全公共安全体系的部署，以及2015年政府工作报告，进一步强调诉求表达、矛盾调处、权益保障、行政复议和人民调解、行政调解、司法调解的衔接。预防社会风险因而包含日常纠纷解决、行政纠错与公共服务，不只是事件发生后的控制。\u003c/p>\n\u003cp>\u003cstrong>2024年修订。\u003c/strong> 《突发事件应对法》于2024年6月28日修订，自同年11月1日起施行。今天研究预防与应急准备、监测预警、处置救援和事后恢复，应衔接该修订文本；2015年本条突出公共卫生的沿革，与2024年专门法的制度更新属于两个时间层次。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">修订后的《突发事件应对法》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>“社会安全”在不同语境中有宽窄之别。\u003c/strong> 广义的社会安全涉及公众生命、健康和财产安全；“社会安全事件”在突发事件分类中则与自然灾害、事故灾难、公共卫生事件并列。本条任务范围较广，既包括社会矛盾预防，也包括公共卫生等其他类型突发事件的影响，不能将其全部划为狭义社会安全事件。\u003c/li>\n\u003cli>\u003cstrong>把化解矛盾放在前端。\u003c/strong> 社会矛盾通常经历积累、激化过程；征地拆迁、环境污染、工资福利等争议需要畅通表达、及时处理和权益保障。政府、基层组织和相关单位分别承担发现、调解、报告和内部管理职责。重大决策社会稳定风险评估不能只计算事件发生概率，还应与决策合法性、合理诉求的解决结合理解。诉求表达、心理干预、调解联动和行政复议纠错，可以从不同环节避免矛盾长期积累。\u003c/li>\n\u003cli>\u003cstrong>公共安全体系具有跨领域属性。\u003c/strong> 食品药品监管、生产安全、隐患排查、防灾减灾、社会治安和网络信息安全均与公共安全体系有关。监测、预案、队伍、物资、教育以及常态监管共同支持事前预防和事后救援，应急框架和区域救援能力也须与这些机制衔接，不能将其理解为某一个机关的单项治安工作。\u003c/li>\n\u003cli>\u003cstrong>按事件性质适用具体处置制度。\u003c/strong> 社会安全事件处置可能涉及现场冲突控制、警戒及秩序恢复；自然灾害、事故灾难、公共卫生事件处置则强调救助、危险源控制、基本生活供应、医疗防疫与防止次生灾害。两类机制既可能协同，也有不同的法定条件，不能因为都影响稳定就互相套用全部措施。\u003c/li>\n\u003cli>\u003cstrong>控制危害与恢复秩序应同时保障人的基本需要。\u003c/strong> 疏散、安置、救治、供水、食品等措施体现人民安全要求。应急治理还须避免信息不畅、生活保障不足、二次伤害等造成新的风险。认定风险“影响国家安全和社会稳定”，要说明其具体关联，不能只使用抽象标签。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>矛盾治理与权利救济〔笔记分析〕。\u003c/strong> 本条使用“预防、减少、化解”而不只是“惩治”，为纠纷解决、诉求回应和公共服务留下重要位置。合法表达诉求、提起诉讼、申请复议本身不等于危害国家安全；应当区分纠纷原因、权利主张、表达方式以及是否存在具体违法行为。第7条和第82条的权利保障、批评建议及救济条款是本条的体系限制。\u003c/p>\n\u003cp>\u003cstrong>公共风险升级并非自动发生〔笔记分析〕。\u003c/strong> 公共卫生事件或局部事故可能通过社会恐慌、基础服务中断、风险扩散影响整体安全，但“可能关联”不意味着每起普通纠纷、事故都应直接进入国家安全特殊程序。应当结合第2条重大利益标准与第8条协调原则，说明风险程度、影响范围和措施必要性。\u003c/p>\n\u003cp>\u003cstrong>预防、应急、恢复是连续过程。\u003c/strong> 基层调解与隐患排查着眼于损害前发现和化解问题，现场处置与救助着眼于依法协调响应，生活保障、服务恢复及后续纠纷解决则着眼于消除事件影响和原有矛盾。评价本条任务是否完成，须贯通这些阶段；只关注现场控制速度，无法判断风险是否得到持续化解。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>乙书案例的真实编号与适用位置。\u003c/strong> 乙书第81页（PDF90页）脚注确实印作“最高人民法院指导性案例202号”，不是OCR错误；所述朱某良、朱某涛非法采砂后修复果园土壤的案件，实际对应\u003cstrong>指导性案例206号\u003c/strong>。最高法院规则重点在于整体生态修复、修复效果评估，以及符合条件的代他人修复支出与生态服务功能损失赔偿折抵。\u003ca href=\"https://www.court.gov.cn/zixun/xiangqing/386171.html\">最高人民法院指导性案例206号\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>案例评析。\u003c/strong> 该案体现生态公共利益保护和纠纷解决，但并非突发社会安全事件应急处置的直接案例。将其放在本条，可讨论通过司法救济维护社会公共利益；要研究其裁判规则，更宜与第30条生态安全合读。不能由“侵害不特定多数人的利益”直接得出“构成国家安全事件”。\u003c/p>\n\u003cp>\u003cstrong>研究问题。\u003c/strong> 国家安全、公共安全与日常纠纷解决之间，怎样建立分层响应标准？重大决策风险评估如何纳入利益相关者的意见及权利救济，而不只是预测公众反应？\u003c/p>\n"},{"num":30,"label":"第三十条","title":"生态安全、保护红线与环境风险防控","lawText":"国家完善生态环境保护制度体系，加大生态建设和环境保护力度，划定生态保护红线，强化生态风险的预警和防控，妥善处置突发环境事件，保障人民赖以生存发展的大气、水、土壤等自然环境和条件不受威胁和破坏，促进人与自然和谐发展。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第三十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家完善生态环境保护制度体系，加大生态建设和环境保护力度，划定生态保护红线，强化生态风险的预警和防控，妥善处置突发环境事件，保障人民赖以生存发展的大气、水、土壤等自然环境和条件不受威胁和破坏，促进人与自然和谐发展。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第三十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家完善生态环境保护制度体系，加大生态建设和环境保护力度，划定生态保护红线，强化生态风险的预警和防控，妥善处置突发环境事件，保障人民赖以生存发展的大气、水、土壤等自然环境和条件不受威胁和破坏，促进人与自然和谐发展。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">生态安全、保护红线与环境风险防控 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条以人类生存发展的自然条件为保护对象，规定“制度建设—生态保护与修复—空间红线—风险防控—应急处置”的连续任务。维护生态安全不仅是事故后的污染治理，也包括对长期、累积和跨区域损害的预防。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>既有法制及政策背景。\u003c/strong> 本条制定前，环境保护、土地、水、森林、草原、防沙治沙、污染防治、环境影响评价等领域已有相关法律制度。2011年国务院环境保护重点工作文件对预防为主的环境风险管理、分级动态管理和应急能力建设提出要求；2015年4月《关于加快推进生态文明建设的意见》进一步部署产权和用途管制、环境监管、资源环境红线、补偿、考核和责任追究。\u003c/p>\n\u003cp>\u003cstrong>本条的制度作用。\u003c/strong> 本条将分散的环境治理事项纳入综合性国家安全任务体系，强化保护人民生存发展条件、系统防范生态风险的地位。其意义在于统合已有制度、明确国家任务并促进制度完善，不能将各项环境保护制度都理解为2015年由本条首次创设。\u003c/p>\n\u003cp>\u003cstrong>后续制度发展。\u003c/strong> 2018年有关生态环境风险常态化管理、全过程多层级防范的部署，以及此后生态修复公益诉讼实践，进一步发展了本条的风险防控和损害恢复要求。\u003c/p>\n\u003cp>\u003cstrong>2026年法典化。\u003c/strong> 《生态环境法典》于2026年3月12日通过、8月15日起施行，已成为本条的重要后续制度依据。法典以总则、污染防治、生态保护、绿色低碳发展、法律责任和附则五编组织规范，并在立法目的中明确维护生态安全。第1242条规定，《环境保护法》《环境影响评价法》等十部法律同时废止；相关旧法条号应保留为历史出处，现行制度则须对应法典及其他专门法律。\u003ca href=\"https://www.mee.gov.cn/ywgz/fgbz/fl/202603/t20260313_1146496.shtml\">《生态环境法典》正式文本，见第1、1242条及目录\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>生态安全是系统的健康、完整与持续供给能力。\u003c/strong> 土壤、水、大气、植被、生物等相互联系，构成人类生产、生活和健康的自然基础。既要看某一环境要素的质量，也要看生态系统能否持续提供水源涵养、气候调节、生物栖息等功能。\u003c/li>\n\u003cli>\u003cstrong>保护对象不限于已经显现的局部污染。\u003c/strong> 生态安全具有整体性、长期性和跨境性，部分损害还具有不可逆性：局部破坏可能产生系统影响，部分损害可能难以或无法恢复，修复和风险影响常跨越较长时间、行政边界乃至国境。这些特点使前端保护和长期监测尤其重要。\u003c/li>\n\u003cli>\u003cstrong>制度体系包括预防、激励、监督与责任。\u003c/strong> 法律法规和标准、产权与用途管制、环境影响评价、信息公开、经济政策与市场机制、生态保护补偿、考核问责等，共同构成生态环境保护制度体系。国家任务不只针对排污者，也涉及规划决策、自然资源管理、跨区域协作和监管机关责任。\u003c/li>\n\u003cli>\u003cstrong>生态建设与环境保护并行。\u003c/strong> 修复生态系统、建设生态安全屏障、保护生物多样性和防范外来物种风险，与大气、水、土壤污染防治以及气候变化减缓和适应共同服务于生态安全。具体任务既包括保护仍完整的系统、修复已受损系统，也包括监测预警、国门生物安全查验以及控制新的污染和破坏。\u003c/li>\n\u003cli>\u003cstrong>生态保护红线应作为独立制度理解。\u003c/strong> 条文单列“划定生态保护红线”，说明其具有空间保护和底线约束意义。资源消耗上限、环境质量底线与生态保护红线，分别着眼资源利用强度、环境质量与重要生态空间保护，不能混为一个指标。红线须落实到国土空间管理，具体划定、调整与管控则依专门制度进行。\u003c/li>\n\u003cli>\u003cstrong>环境风险管理贯穿监测、预警、预防与应急。\u003c/strong> 承载能力监测、跨区域和流域联防、应急预案、救援物资队伍、培训演练、准确发布信息及企业和地方政府责任，需要纳入全过程、多层级风险防范体系。既要处理突发污染事故，也要识别缓慢累积的生态破坏，不能把风险治理只等同于事故救援。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>预防原则与修复责任〔笔记分析〕。\u003c/strong> 生态损害可能具有累积、延迟显现和难以完全修复的特点，因此责任追究和金钱赔偿不能替代前端保护。预警、规划限制、环境影响评价与红线制度承担预防功能；生态修复、赔偿和公益诉讼承担损害后的恢复与责任功能，二者衔接而不能互相抵销。\u003c/p>\n\u003cp>\u003cstrong>自然资源的经济价值与生态价值。\u003c/strong> 资源既可供利用，又具有维系生态系统的作用；支付资源价款或者返还违法所得不当然弥补生态服务功能损失。国家资源所有权受到侵害与社会公共生态利益受到损害，可以需要不同的责任评价。这也是第21条资源能源安全与本条生态安全的交叉处。\u003c/p>\n\u003cp>\u003cstrong>整体保护与具体责任〔笔记分析〕。\u003c/strong> 生态系统是整体，并不意味着可以不区分因果关系、行为参与程度和法律责任。司法与行政处理仍要查明污染或破坏行为、损害范围、合理修复方案、履行效果及各主体责任；“系统治理”不能取代个案证据。\u003c/p>\n\u003cp>\u003cstrong>跨区域、代际和国际维度。\u003c/strong> 生态系统的连通性使地方短期开发可能把环境成本转移给下游地区、未来世代或境外主体。第8条发展安全协调、第10条国际合作与本条共同提示，需要跨行政边界协调和长时期评估。具体责任和国际义务仍须依据有关条款、条约及适用条件确定。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>案例与书内勘误。\u003c/strong> 乙书第83—84页（PDF92—93页）讨论夏某安等人洞庭湖非法采砂，却在脚注印作“指导案例172号”；核对原图与最高法院材料，实际为\u003cstrong>指导案例176号\u003c/strong>。该案要求从水环境、河床结构、水源涵养和水生生物资源等方面评估损害，并强调刑事责任与生态损害民事责任分别承担，其他共同侵权人的连带范围仍依据参与行为确定。\u003ca href=\"https://www.court.gov.cn/shenpan/xiangqing/334721.html\">最高人民法院指导案例176号\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>案例学习重点。\u003c/strong> 该案体现完整识别生态损害、科学评估和落实修复责任的要求。夏顺安承担相应生态修复费用，其他14名被告依据其具体侵权行为，在不同范围内承担连带责任。生态保护的整体性并不取消对各被告行为和责任范围的分别判断。\u003c/p>\n\u003cp>\u003cstrong>生态修复的履行与效果。\u003c/strong> 指导性案例206号进一步说明：工程完成与生态功能恢复需要区分；修复效果应受评估；生态服务功能损失赔偿与履行修复义务之间的关系，应依据具体案件条件处理，不能任意冲抵。该案对法条的列举还注明其原案适用的是原《侵权责任法》，不应因今天与《民法典》条款对应而倒置原案适用法的时间。\u003ca href=\"https://www.court.gov.cn/zixun/xiangqing/386171.html\">最高人民法院指导性案例206号\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>研究问题。\u003c/strong> 长期生态损害怎样进入预警和国家安全风险评估？怎样证明生态功能已经恢复，而不只是工程验收合格？跨区域生态补偿、污染者修复责任和公共财政投入应如何分工？\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条以人类生存发展的自然条件为保护对象，规定“制度建设—生态保护与修复—空间红线—风险防控—应急处置”的连续任务。维护生态安全不仅是事故后的污染治理，也包括对长期、累积和跨区域损害的预防。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>既有法制及政策背景。\u003c/strong> 本条制定前，环境保护、土地、水、森林、草原、防沙治沙、污染防治、环境影响评价等领域已有相关法律制度。2011年国务院环境保护重点工作文件对预防为主的环境风险管理、分级动态管理和应急能力建设提出要求；2015年4月《关于加快推进生态文明建设的意见》进一步部署产权和用途管制、环境监管、资源环境红线、补偿、考核和责任追究。\u003c/p>\n\u003cp>\u003cstrong>本条的制度作用。\u003c/strong> 本条将分散的环境治理事项纳入综合性国家安全任务体系，强化保护人民生存发展条件、系统防范生态风险的地位。其意义在于统合已有制度、明确国家任务并促进制度完善，不能将各项环境保护制度都理解为2015年由本条首次创设。\u003c/p>\n\u003cp>\u003cstrong>后续制度发展。\u003c/strong> 2018年有关生态环境风险常态化管理、全过程多层级防范的部署，以及此后生态修复公益诉讼实践，进一步发展了本条的风险防控和损害恢复要求。\u003c/p>\n\u003cp>\u003cstrong>2026年法典化。\u003c/strong> 《生态环境法典》于2026年3月12日通过、8月15日起施行，已成为本条的重要后续制度依据。法典以总则、污染防治、生态保护、绿色低碳发展、法律责任和附则五编组织规范，并在立法目的中明确维护生态安全。第1242条规定，《环境保护法》《环境影响评价法》等十部法律同时废止；相关旧法条号应保留为历史出处，现行制度则须对应法典及其他专门法律。\u003ca href=\"https://www.mee.gov.cn/ywgz/fgbz/fl/202603/t20260313_1146496.shtml\">《生态环境法典》正式文本，见第1、1242条及目录\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>生态安全是系统的健康、完整与持续供给能力。\u003c/strong> 土壤、水、大气、植被、生物等相互联系，构成人类生产、生活和健康的自然基础。既要看某一环境要素的质量，也要看生态系统能否持续提供水源涵养、气候调节、生物栖息等功能。\u003c/li>\n\u003cli>\u003cstrong>保护对象不限于已经显现的局部污染。\u003c/strong> 生态安全具有整体性、长期性和跨境性，部分损害还具有不可逆性：局部破坏可能产生系统影响，部分损害可能难以或无法恢复，修复和风险影响常跨越较长时间、行政边界乃至国境。这些特点使前端保护和长期监测尤其重要。\u003c/li>\n\u003cli>\u003cstrong>制度体系包括预防、激励、监督与责任。\u003c/strong> 法律法规和标准、产权与用途管制、环境影响评价、信息公开、经济政策与市场机制、生态保护补偿、考核问责等，共同构成生态环境保护制度体系。国家任务不只针对排污者，也涉及规划决策、自然资源管理、跨区域协作和监管机关责任。\u003c/li>\n\u003cli>\u003cstrong>生态建设与环境保护并行。\u003c/strong> 修复生态系统、建设生态安全屏障、保护生物多样性和防范外来物种风险，与大气、水、土壤污染防治以及气候变化减缓和适应共同服务于生态安全。具体任务既包括保护仍完整的系统、修复已受损系统，也包括监测预警、国门生物安全查验以及控制新的污染和破坏。\u003c/li>\n\u003cli>\u003cstrong>生态保护红线应作为独立制度理解。\u003c/strong> 条文单列“划定生态保护红线”，说明其具有空间保护和底线约束意义。资源消耗上限、环境质量底线与生态保护红线，分别着眼资源利用强度、环境质量与重要生态空间保护，不能混为一个指标。红线须落实到国土空间管理，具体划定、调整与管控则依专门制度进行。\u003c/li>\n\u003cli>\u003cstrong>环境风险管理贯穿监测、预警、预防与应急。\u003c/strong> 承载能力监测、跨区域和流域联防、应急预案、救援物资队伍、培训演练、准确发布信息及企业和地方政府责任，需要纳入全过程、多层级风险防范体系。既要处理突发污染事故，也要识别缓慢累积的生态破坏，不能把风险治理只等同于事故救援。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>预防原则与修复责任〔笔记分析〕。\u003c/strong> 生态损害可能具有累积、延迟显现和难以完全修复的特点，因此责任追究和金钱赔偿不能替代前端保护。预警、规划限制、环境影响评价与红线制度承担预防功能；生态修复、赔偿和公益诉讼承担损害后的恢复与责任功能，二者衔接而不能互相抵销。\u003c/p>\n\u003cp>\u003cstrong>自然资源的经济价值与生态价值。\u003c/strong> 资源既可供利用，又具有维系生态系统的作用；支付资源价款或者返还违法所得不当然弥补生态服务功能损失。国家资源所有权受到侵害与社会公共生态利益受到损害，可以需要不同的责任评价。这也是第21条资源能源安全与本条生态安全的交叉处。\u003c/p>\n\u003cp>\u003cstrong>整体保护与具体责任〔笔记分析〕。\u003c/strong> 生态系统是整体，并不意味着可以不区分因果关系、行为参与程度和法律责任。司法与行政处理仍要查明污染或破坏行为、损害范围、合理修复方案、履行效果及各主体责任；“系统治理”不能取代个案证据。\u003c/p>\n\u003cp>\u003cstrong>跨区域、代际和国际维度。\u003c/strong> 生态系统的连通性使地方短期开发可能把环境成本转移给下游地区、未来世代或境外主体。第8条发展安全协调、第10条国际合作与本条共同提示，需要跨行政边界协调和长时期评估。具体责任和国际义务仍须依据有关条款、条约及适用条件确定。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>案例与书内勘误。\u003c/strong> 乙书第83—84页（PDF92—93页）讨论夏某安等人洞庭湖非法采砂，却在脚注印作“指导案例172号”；核对原图与最高法院材料，实际为\u003cstrong>指导案例176号\u003c/strong>。该案要求从水环境、河床结构、水源涵养和水生生物资源等方面评估损害，并强调刑事责任与生态损害民事责任分别承担，其他共同侵权人的连带范围仍依据参与行为确定。\u003ca href=\"https://www.court.gov.cn/shenpan/xiangqing/334721.html\">最高人民法院指导案例176号\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>案例学习重点。\u003c/strong> 该案体现完整识别生态损害、科学评估和落实修复责任的要求。夏顺安承担相应生态修复费用，其他14名被告依据其具体侵权行为，在不同范围内承担连带责任。生态保护的整体性并不取消对各被告行为和责任范围的分别判断。\u003c/p>\n\u003cp>\u003cstrong>生态修复的履行与效果。\u003c/strong> 指导性案例206号进一步说明：工程完成与生态功能恢复需要区分；修复效果应受评估；生态服务功能损失赔偿与履行修复义务之间的关系，应依据具体案件条件处理，不能任意冲抵。该案对法条的列举还注明其原案适用的是原《侵权责任法》，不应因今天与《民法典》条款对应而倒置原案适用法的时间。\u003ca href=\"https://www.court.gov.cn/zixun/xiangqing/386171.html\">最高人民法院指导性案例206号\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>研究问题。\u003c/strong> 长期生态损害怎样进入预警和国家安全风险评估？怎样证明生态功能已经恢复，而不只是工程验收合格？跨区域生态补偿、污染者修复责任和公共财政投入应如何分工？\u003c/p>\n"},{"num":31,"label":"第三十一条","title":"核安全","lawText":"国家坚持和平利用核能和核技术，加强国际合作，防止核扩散，完善防扩散机制，加强对核设施、核材料、核活动和核废料处置的安全管理、监管和保护，加强核事故应急体系和应急能力建设，防止、控制和消除核事故对公民生命健康和生态环境的危害，不断增强有效应对和防范核威胁、核攻击的能力。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第三十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家坚持和平利用核能和核技术，加强国际合作，防止核扩散，完善防扩散机制，加强对核设施、核材料、核活动和核废料处置的安全管理、监管和保护，加强核事故应急体系和应急能力建设，防止、控制和消除核事故对公民生命健康和生态环境的危害，不断增强有效应对和防范核威胁、核攻击的能力。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第三十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家坚持和平利用核能和核技术，加强国际合作，防止核扩散，完善防扩散机制，加强对核设施、核材料、核活动和核废料处置的安全管理、监管和保护，加强核事故应急体系和应急能力建设，防止、控制和消除核事故对公民生命健康和生态环境的危害，不断增强有效应对和防范核威胁、核攻击的能力。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">核安全 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条把核能利用、防扩散、日常安全监管、事故应急和核威胁防范纳入同一任务条款。“核安全”在这里具有较宽的国家安全含义，不能仅理解为核电厂不发生事故。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>制定背景。\u003c/strong> 核能兼具能源、科技与军事属性。既有行政法规已分别调整民用核设施、核材料、核出口和事故应急，2015年国家安全法将分散任务提升为整体的国家安全要求。\u003c/p>\n\u003cp>\u003cstrong>审议中的明确修改。\u003c/strong> 2015年6月24日法律委员会审议结果报告指出，核安全既涉及民用领域，也涉及军事领域，建议对二审稿第二十九条进一步界定和充实。其建议文本已经形成“和平利用—防扩散—管理监管—事故应急—防范核威胁”的完整结构；最终第三十一条还载有“加强国际合作”。不能将最终全文直接当作该日建议稿原文。〔《释义》附录四，印刷383—384页／PDF396—397页〕\u003c/p>\n\u003cp>\u003cstrong>后续制度展开。\u003c/strong> 2017年制定、2018年1月1日起施行的《核安全法》，进一步规定核设施、核材料和相关放射性废物安全、核事故应急、信息公开等制度。2025年9月12日通过、2026年1月15日起施行的《原子能法》，则从研究、开发与和平利用方面补充制度。两法属于本条之后的具体立法发展，应与2015年的原始立法背景分开理解。\u003ca href=\"https://www.caea.gov.cn/n6760401/n6760402/c6827752/content.html\">《核安全法》\u003c/a>；\u003ca href=\"https://www.caea.gov.cn/n6760338/n6760344/n10763762/n10763767/c10704020/content.html\">《原子能法》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 和平利用与防扩散相互配合。\u003c/strong> 国家支持核能和核技术的和平利用，同时控制相关材料、技术和设备流转中的扩散风险。加强国际合作既包括研究、技术与安全经验交流，也包括履行有关防扩散义务；不能把“安全”理解成一概停止核技术交流。\u003c/p>\n\u003cp>\u003cstrong>2. 管理对象覆盖设施、材料、活动和废料处置。\u003c/strong> 这意味着监管贯穿建设、运行、运输、贮存、退役和处置等环节。营运单位的内部管理、主管部门的行政管理和监管机关的监督，承担不同职责，不能以其中一个环节替代其他环节。\u003c/p>\n\u003cp>\u003cstrong>3. 应急建设必须先于事故。\u003c/strong> 本条同时要求“体系”和“能力”：前者涉及预案、指挥、协调、信息与责任安排，后者涉及监测、救援、防护和应急保障。核安全的目标不仅是防止事故，还包括事故发生后控制后果、减轻公众健康和生态损害。\u003c/p>\n\u003cp>\u003cstrong>4. 防范核威胁具有独立地位。\u003c/strong> 条文末句处理的是外部核威胁、核攻击风险，与前文事故预防有所不同。和平利用核技术和防御核威胁可以并存，不能把民用监管制度直接当作核军事行动的完整权限依据。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>〔笔记分析〕从风险规制角度，可以分别观察技术故障和自然灾害造成的事故、针对核材料或设施的恶意行为、扩散风险及国家间核威胁。它们彼此联系，但防范对象、责任主体和法律工具并不完全相同。\u003c/p>\n\u003cp>核风险具有低概率、高后果和可能跨境传播的特征，因此需要在损害发生前设置许可、标准、监测和报告等制度。安全管理也不能以“绝对零风险”作为唯一表述，应把可检验的预防措施、独立监督和事故缓解能力纳入评价。\u003c/p>\n\u003cp>比较国际规则时，应逐项核对条约的签署、批准及生效状态。例如，中国于1996年9月24日签署《全面禁止核试验条约》，截至本次核验仍未批准；不能笼统表述为已经加入并受全部生效条约义务约束。\u003ca href=\"https://www.ctbto.org/our-mission/states-signatories\">CTBTO签署与批准状态表\u003c/a>。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中所举海阳核电厂2020年3月6日两起运行事件，均被界定为0级事件，未造成放射性后果、人员照射和环境污染。它们说明：报告、调查和整改可以在未产生实际损害时启动；“无安全意义”的事件等级不等于无需报告或改进管理。\u003ca href=\"https://nnsa.mee.gov.cn/ywdt/hyzx/202303/t20230320_1020154.html\">国家核安全局公布的事件说明\u003c/a>。\u003c/p>\n\u003cp>理解本条可抓住一句话：\u003cstrong>以和平利用为方向，以全过程安全管理为基础，以应急和防御能力应对不同类型的核风险。\u003c/strong>\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条把核能利用、防扩散、日常安全监管、事故应急和核威胁防范纳入同一任务条款。“核安全”在这里具有较宽的国家安全含义，不能仅理解为核电厂不发生事故。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>制定背景。\u003c/strong> 核能兼具能源、科技与军事属性。既有行政法规已分别调整民用核设施、核材料、核出口和事故应急，2015年国家安全法将分散任务提升为整体的国家安全要求。\u003c/p>\n\u003cp>\u003cstrong>审议中的明确修改。\u003c/strong> 2015年6月24日法律委员会审议结果报告指出，核安全既涉及民用领域，也涉及军事领域，建议对二审稿第二十九条进一步界定和充实。其建议文本已经形成“和平利用—防扩散—管理监管—事故应急—防范核威胁”的完整结构；最终第三十一条还载有“加强国际合作”。不能将最终全文直接当作该日建议稿原文。〔《释义》附录四，印刷383—384页／PDF396—397页〕\u003c/p>\n\u003cp>\u003cstrong>后续制度展开。\u003c/strong> 2017年制定、2018年1月1日起施行的《核安全法》，进一步规定核设施、核材料和相关放射性废物安全、核事故应急、信息公开等制度。2025年9月12日通过、2026年1月15日起施行的《原子能法》，则从研究、开发与和平利用方面补充制度。两法属于本条之后的具体立法发展，应与2015年的原始立法背景分开理解。\u003ca href=\"https://www.caea.gov.cn/n6760401/n6760402/c6827752/content.html\">《核安全法》\u003c/a>；\u003ca href=\"https://www.caea.gov.cn/n6760338/n6760344/n10763762/n10763767/c10704020/content.html\">《原子能法》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 和平利用与防扩散相互配合。\u003c/strong> 国家支持核能和核技术的和平利用，同时控制相关材料、技术和设备流转中的扩散风险。加强国际合作既包括研究、技术与安全经验交流，也包括履行有关防扩散义务；不能把“安全”理解成一概停止核技术交流。\u003c/p>\n\u003cp>\u003cstrong>2. 管理对象覆盖设施、材料、活动和废料处置。\u003c/strong> 这意味着监管贯穿建设、运行、运输、贮存、退役和处置等环节。营运单位的内部管理、主管部门的行政管理和监管机关的监督，承担不同职责，不能以其中一个环节替代其他环节。\u003c/p>\n\u003cp>\u003cstrong>3. 应急建设必须先于事故。\u003c/strong> 本条同时要求“体系”和“能力”：前者涉及预案、指挥、协调、信息与责任安排，后者涉及监测、救援、防护和应急保障。核安全的目标不仅是防止事故，还包括事故发生后控制后果、减轻公众健康和生态损害。\u003c/p>\n\u003cp>\u003cstrong>4. 防范核威胁具有独立地位。\u003c/strong> 条文末句处理的是外部核威胁、核攻击风险，与前文事故预防有所不同。和平利用核技术和防御核威胁可以并存，不能把民用监管制度直接当作核军事行动的完整权限依据。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>〔笔记分析〕从风险规制角度，可以分别观察技术故障和自然灾害造成的事故、针对核材料或设施的恶意行为、扩散风险及国家间核威胁。它们彼此联系，但防范对象、责任主体和法律工具并不完全相同。\u003c/p>\n\u003cp>核风险具有低概率、高后果和可能跨境传播的特征，因此需要在损害发生前设置许可、标准、监测和报告等制度。安全管理也不能以“绝对零风险”作为唯一表述，应把可检验的预防措施、独立监督和事故缓解能力纳入评价。\u003c/p>\n\u003cp>比较国际规则时，应逐项核对条约的签署、批准及生效状态。例如，中国于1996年9月24日签署《全面禁止核试验条约》，截至本次核验仍未批准；不能笼统表述为已经加入并受全部生效条约义务约束。\u003ca href=\"https://www.ctbto.org/our-mission/states-signatories\">CTBTO签署与批准状态表\u003c/a>。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中所举海阳核电厂2020年3月6日两起运行事件，均被界定为0级事件，未造成放射性后果、人员照射和环境污染。它们说明：报告、调查和整改可以在未产生实际损害时启动；“无安全意义”的事件等级不等于无需报告或改进管理。\u003ca href=\"https://nnsa.mee.gov.cn/ywdt/hyzx/202303/t20230320_1020154.html\">国家核安全局公布的事件说明\u003c/a>。\u003c/p>\n\u003cp>理解本条可抓住一句话：\u003cstrong>以和平利用为方向，以全过程安全管理为基础，以应急和防御能力应对不同类型的核风险。\u003c/strong>\u003c/p>\n"},{"num":32,"label":"第三十二条","title":"外层空间、国际海底区域与极地安全","lawText":"国家坚持和平探索和利用外层空间、国际海底区域和极地，增强安全进出、科学考察、开发利用的能力，加强国际合作，维护我国在外层空间、国际海底区域和极地的活动、资产和其他利益的安全。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第三十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家坚持和平探索和利用外层空间、国际海底区域和极地，增强安全进出、科学考察、开发利用的能力，加强国际合作，维护我国在外层空间、国际海底区域和极地的活动、资产和其他利益的安全。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第三十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家坚持和平探索和利用外层空间、国际海底区域和极地，增强安全进出、科学考察、开发利用的能力，加强国际合作，维护我国在外层空间、国际海底区域和极地的活动、资产和其他利益的安全。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">外层空间、国际海底区域与极地安全 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条将国家安全任务延伸到外层空间、国际海底区域和极地。保护在这些领域开展活动形成的利益，不等于对有关空间主张国家主权。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>三审阶段新增。\u003c/strong> 2015年6月24日审议结果报告明确提出，外层空间、国际海底区域和极地涉及现实与潜在的重大国家利益，也存在安全威胁与挑战，应增加相应任务条款。报告建议文字与最终第三十二条相同。〔《释义》附录四，印刷384页／PDF397页〕\u003c/p>\n\u003cp>\u003cstrong>从原则任务到具体制度。\u003c/strong> 本条制定时，我国已经参加有关国际条约，并形成部分空间物体登记、航天发射许可和极地考察管理制度。2016年制定、同年5月1日起施行的《深海海底区域资源勘探开发法》，进一步规定国内许可、与国际海底管理局签订合同、环境保护和监督检查等事项，体现了本条任务的具体展开。\u003ca href=\"https://www.mee.gov.cn/ywgz/fgbz/fl/202303/t20230314_1019565.shtml\">《深海海底区域资源勘探开发法》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 以和平探索和利用为原则。\u003c/strong> 科学研究、资源利用和基础设施活动，应同时服从适用的国际规则。条文不能被读成在三个领域均可不受限制地开展任何开发活动。\u003c/p>\n\u003cp>\u003cstrong>2. 能力建设贯穿活动全过程。\u003c/strong> “安全进出”涉及进入、离开及必要保障；“科学考察”强调获得知识与开展研究；“开发利用”强调依法利用有关资源和成果。技术装备、人员训练、环境保护和应急救援共同支撑这些能力。\u003c/p>\n\u003cp>\u003cstrong>3. 保护对象不限于物质财产。\u003c/strong> “活动、资产和其他利益”既涵盖航天器、科考设施等，也包括依法开展研究、参与国际规则制定和实现有关合作安排的利益。具体权利须由相应法律、条约和合同确定，不能仅凭“其他利益”推导排他的管辖权。\u003c/p>\n\u003cp>\u003cstrong>4. 国际合作是履行任务的组成部分。\u003c/strong> 此类活动常涉及跨国技术协作、环境影响和共同规则，安全保障因而不能只依靠国内管理，还需要信息交流、事故协助与争端处理机制。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>三类空间不能笼统理解为法律地位完全相同的“无主空间”。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>领域\u003c/th>\n\u003cth>核心法律规则\u003c/th>\n\u003cth>理解本条时的界限\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>外层空间\u003c/td>\n\u003ctd>《外空条约》第1—2条确立共同利益、平等自由探索利用和不得据为己有原则\u003c/td>\n\u003ctd>“全人类共同所有”易造成物权概念误解，应使用条约的准确规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>国际海底区域\u003c/td>\n\u003ctd>《海洋法公约》第136—137条规定区域及其资源为人类共同继承财产，排除国家主权主张\u003c/td>\n\u003ctd>特定区域资源制度不能直接套用于整个海洋或所有外空资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>南极\u003c/td>\n\u003ctd>《南极条约》保留各方既有主权立场，禁止提出新的或扩大原有主权要求，并保障和平科学考察\u003c/td>\n\u003ctd>“冻结争议”不等于永久消灭一切主权主张\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>北极\u003c/td>\n\u003ctd>涉及沿岸国领土、不同海域及其各自法律制度\u003c/td>\n\u003ctd>不能将北极整体视为国家管辖范围之外的区域\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>对应依据：\u003ca href=\"https://www.unoosa.org/oosa/en/ourwork/spacelaw/treaties/outerspacetreaty.html\">联合国外空事务厅《外空条约》\u003c/a>；\u003ca href=\"https://www.un.org/Depts/los/convention_agreements/texts/unclos/part11-2.htm\">联合国《海洋法公约》第十一部分\u003c/a>；\u003ca href=\"https://www.ats.aq/e/antarctictreaty.html\">南极条约秘书处条约说明\u003c/a>。\u003c/p>\n\u003cp>〔笔记分析〕本条保护的不是对这些空间的无限支配，而是中国在相应制度内依法活动的能力和利益。国内法提供组织、监管与保障依据，国际法决定许多活动对外可主张的权利及其界限。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>两处容易混淆的边界。\u003c/strong> 第一，领海以外并非全部都是公海；《海洋法公约》第86条将专属经济区排除在公海部分的适用范围之外。第二，南极“开发利用”受到特别限制，环境保护议定书第7条禁止科学研究以外的矿产资源活动，不能由本条一般任务反向推出开采许可。\u003ca href=\"https://www.un.org/depts/los/convention_agreements/texts/unclos/part7.htm\">《海洋法公约》第七部分\u003c/a>；\u003ca href=\"https://www.ats.aq/e/protocol.html\">南极环境保护议定书说明\u003c/a>。\u003c/p>\n\u003cp>本条与第三十三条的区别在于：前者以特定活动领域为中心，后者以海外主体及国家整体海外利益为中心；同一项海外科考活动可能同时涉及二者。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条将国家安全任务延伸到外层空间、国际海底区域和极地。保护在这些领域开展活动形成的利益，不等于对有关空间主张国家主权。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>三审阶段新增。\u003c/strong> 2015年6月24日审议结果报告明确提出，外层空间、国际海底区域和极地涉及现实与潜在的重大国家利益，也存在安全威胁与挑战，应增加相应任务条款。报告建议文字与最终第三十二条相同。〔《释义》附录四，印刷384页／PDF397页〕\u003c/p>\n\u003cp>\u003cstrong>从原则任务到具体制度。\u003c/strong> 本条制定时，我国已经参加有关国际条约，并形成部分空间物体登记、航天发射许可和极地考察管理制度。2016年制定、同年5月1日起施行的《深海海底区域资源勘探开发法》，进一步规定国内许可、与国际海底管理局签订合同、环境保护和监督检查等事项，体现了本条任务的具体展开。\u003ca href=\"https://www.mee.gov.cn/ywgz/fgbz/fl/202303/t20230314_1019565.shtml\">《深海海底区域资源勘探开发法》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 以和平探索和利用为原则。\u003c/strong> 科学研究、资源利用和基础设施活动，应同时服从适用的国际规则。条文不能被读成在三个领域均可不受限制地开展任何开发活动。\u003c/p>\n\u003cp>\u003cstrong>2. 能力建设贯穿活动全过程。\u003c/strong> “安全进出”涉及进入、离开及必要保障；“科学考察”强调获得知识与开展研究；“开发利用”强调依法利用有关资源和成果。技术装备、人员训练、环境保护和应急救援共同支撑这些能力。\u003c/p>\n\u003cp>\u003cstrong>3. 保护对象不限于物质财产。\u003c/strong> “活动、资产和其他利益”既涵盖航天器、科考设施等，也包括依法开展研究、参与国际规则制定和实现有关合作安排的利益。具体权利须由相应法律、条约和合同确定，不能仅凭“其他利益”推导排他的管辖权。\u003c/p>\n\u003cp>\u003cstrong>4. 国际合作是履行任务的组成部分。\u003c/strong> 此类活动常涉及跨国技术协作、环境影响和共同规则，安全保障因而不能只依靠国内管理，还需要信息交流、事故协助与争端处理机制。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>三类空间不能笼统理解为法律地位完全相同的“无主空间”。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>领域\u003c/th>\n\u003cth>核心法律规则\u003c/th>\n\u003cth>理解本条时的界限\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>外层空间\u003c/td>\n\u003ctd>《外空条约》第1—2条确立共同利益、平等自由探索利用和不得据为己有原则\u003c/td>\n\u003ctd>“全人类共同所有”易造成物权概念误解，应使用条约的准确规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>国际海底区域\u003c/td>\n\u003ctd>《海洋法公约》第136—137条规定区域及其资源为人类共同继承财产，排除国家主权主张\u003c/td>\n\u003ctd>特定区域资源制度不能直接套用于整个海洋或所有外空资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>南极\u003c/td>\n\u003ctd>《南极条约》保留各方既有主权立场，禁止提出新的或扩大原有主权要求，并保障和平科学考察\u003c/td>\n\u003ctd>“冻结争议”不等于永久消灭一切主权主张\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>北极\u003c/td>\n\u003ctd>涉及沿岸国领土、不同海域及其各自法律制度\u003c/td>\n\u003ctd>不能将北极整体视为国家管辖范围之外的区域\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>对应依据：\u003ca href=\"https://www.unoosa.org/oosa/en/ourwork/spacelaw/treaties/outerspacetreaty.html\">联合国外空事务厅《外空条约》\u003c/a>；\u003ca href=\"https://www.un.org/Depts/los/convention_agreements/texts/unclos/part11-2.htm\">联合国《海洋法公约》第十一部分\u003c/a>；\u003ca href=\"https://www.ats.aq/e/antarctictreaty.html\">南极条约秘书处条约说明\u003c/a>。\u003c/p>\n\u003cp>〔笔记分析〕本条保护的不是对这些空间的无限支配，而是中国在相应制度内依法活动的能力和利益。国内法提供组织、监管与保障依据，国际法决定许多活动对外可主张的权利及其界限。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>两处容易混淆的边界。\u003c/strong> 第一，领海以外并非全部都是公海；《海洋法公约》第86条将专属经济区排除在公海部分的适用范围之外。第二，南极“开发利用”受到特别限制，环境保护议定书第7条禁止科学研究以外的矿产资源活动，不能由本条一般任务反向推出开采许可。\u003ca href=\"https://www.un.org/depts/los/convention_agreements/texts/unclos/part7.htm\">《海洋法公约》第七部分\u003c/a>；\u003ca href=\"https://www.ats.aq/e/protocol.html\">南极环境保护议定书说明\u003c/a>。\u003c/p>\n\u003cp>本条与第三十三条的区别在于：前者以特定活动领域为中心，后者以海外主体及国家整体海外利益为中心；同一项海外科考活动可能同时涉及二者。\u003c/p>\n"},{"num":33,"label":"第三十三条","title":"海外利益保护","lawText":"国家依法采取必要措施，保护海外中国公民、组织和机构的安全和正当权益，保护国家的海外利益不受威胁和侵害。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第三十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家依法采取必要措施，保护海外中国公民、组织和机构的安全和正当权益，保护国家的海外利益不受威胁和侵害。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第三十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家依法采取必要措施，保护海外中国公民、组织和机构的安全和正当权益，保护国家的海外利益不受威胁和侵害。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">海外利益保护 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条确立国家保护海外利益的任务，兼顾具体主体的安全、正当权益和国家整体的海外利益。“依法”规定行动依据，“必要”限定措施范围，“正当”限定所保护利益的性质。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>既有保护制度的综合化。\u003c/strong> 宪法第五十条规定保护华侨的正当权利和利益；驻外外交人员法也将维护中国公民和法人在国外的正当权益列入职责。随着人员往来、海外经营和投资增加，2015年国家安全法将海外利益保护明确纳入国家安全任务，而非仅作为个别外交事务处理。\u003c/p>\n\u003cp>现有书内立法报告未提供本条从各审稿到定稿的逐句修改记录，不能据此推定其文字始终未变。\u003c/p>\n\u003cp>\u003cstrong>后续规则更加具体。\u003c/strong> 2023年《对外关系法》第三十七条再次规定海外安全、正当权益及国家海外利益保护，并要求加强保护体系、工作机制和能力建设。同年9月1日起施行的《领事保护与协助条例》进一步明确主管机关、求助方式、协助事项及安全预防职责。\u003ca href=\"https://www.mfa.gov.cn/wjb_673085/zfxxgk_674865/zcfg/fl/202306/t20230628_11105189.shtml\">《对外关系法》\u003c/a>；\u003ca href=\"https://www.mfa.gov.cn/wjbzwfwpt/kzx/tzgg/202307/t20230717_11114236.html\">《领事保护与协助条例》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 保护对象具有两个层次。\u003c/strong> 一是海外中国公民、组织和机构，包括其人员安全、财产及其他正当权益；二是国家作为整体在海外形成的利益。自然人的身份首先涉及国籍认定，不能只按族裔判断；组织与机构则应结合其设立、法律地位和适用规则判断，不能一概收窄为具有法人资格的公司。\u003c/p>\n\u003cp>\u003cstrong>2. “正当权益”具有涉外语境。\u003c/strong> 当事人通常处于另一国家的属地管辖之下，中国法与当地法也可能存在差异。因此，判断权益应结合当地法、有关国际法规则及公正待遇等要求。保护不意味着纵容违法，更不意味着被拘留或被追诉的人就丧失获得人道待遇、程序保障和必要协助的资格。\u003c/p>\n\u003cp>\u003cstrong>3. “依法”同时要求遵守国内和国际规则。\u003c/strong> 国内职责、程序和权限是国家采取措施的依据；在海外实施保护还涉及尊重所在国主权、当地司法程序及有关条约。国内任务条款本身并不当然赋予我国机关在他国境内直接执法的权限。\u003c/p>\n\u003cp>\u003cstrong>4. “必要措施”应与具体风险相适应。\u003c/strong> 措施可以包括发布提醒、提供维权信息、联系当地机关、领事探视、外交交涉、开展国际执法合作和组织撤离等。风险性质、紧迫程度与可行条件决定措施选择，不能把每一次海外商业损失都直接转化为国家承担赔偿或采取强制行动的义务。〔笔记分析〕\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>领事保护与狭义外交保护需要区分。\u003c/strong> 《维也纳领事关系公约》第5条规定保护、帮助本国国民等领事职务，第36条涉及被拘禁国民的通知、联络和探视。此类保护与协助可以在困难或风险出现时开展，并不以先证明接受国实施国际不法行为为通常前提。\u003ca href=\"https://cs.mfa.gov.cn/zlbg/tyxy_660627/201107/t20110726_961616.shtml\">《维也纳领事关系公约》\u003c/a>。\u003c/p>\n\u003cp>国际责任法意义上的外交保护，则涉及国家就另一国家侵害其国民的国际不法行为提出责任请求，通常涉及国籍联系和用尽当地救济等条件及例外。国际法委员会2006年《外交保护条款草案》可用于研究这些规则，但它本身不是已经生效的普遍性外交保护公约。不能将其全部条件机械套用于日常领事协助。\u003ca href=\"https://legal.un.org/ilc/texts/instruments/english/draft_articles/9_8_2006.pdf\">联合国国际法委员会条款草案，第1、3、14—15条\u003c/a>。\u003c/p>\n\u003cp>〔笔记分析〕本条的国内法意义，在于把国家保护任务与机关履职联系起来；其国际法实现方式，仍取决于具体规则和国家间合作。两者相互衔接，却不能互相替代。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>也门撤离案例应注意时间。\u003c/strong> 2015年3月29日至4月6日，我国有关部门和驻外机构协作，以军舰接运等方式撤离613名中国公民。行动发生在本法7月1日公布施行之前，适合用于理解立法背景和保护需求，不宜称为依照本条实施的事后执法案例。\u003ca href=\"https://cs.mfa.gov.cn/gyls/lsgz/ztzl/zgjnhj/201504/t20150417_932696.shtml\">外交部领事司撤离行动记录\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>保护也包括预防和主体自我保障。\u003c/strong> 领事保护制度要求相关单位开展安全教育、建立应急机制，当事人亦应遵守有关法律并做好安全防范。国家保护不替代企业安全管理、当事人依法维权以及保险等社会保障安排。\u003ca href=\"https://www.mfa.gov.cn/web/wjb_673085/zfxxgk_674865/zcfg/xzfg/202307/t20230718_11114529.shtml\">《领事保护与协助条例》第4、18条\u003c/a>。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条确立国家保护海外利益的任务，兼顾具体主体的安全、正当权益和国家整体的海外利益。“依法”规定行动依据，“必要”限定措施范围，“正当”限定所保护利益的性质。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>既有保护制度的综合化。\u003c/strong> 宪法第五十条规定保护华侨的正当权利和利益；驻外外交人员法也将维护中国公民和法人在国外的正当权益列入职责。随着人员往来、海外经营和投资增加，2015年国家安全法将海外利益保护明确纳入国家安全任务，而非仅作为个别外交事务处理。\u003c/p>\n\u003cp>现有书内立法报告未提供本条从各审稿到定稿的逐句修改记录，不能据此推定其文字始终未变。\u003c/p>\n\u003cp>\u003cstrong>后续规则更加具体。\u003c/strong> 2023年《对外关系法》第三十七条再次规定海外安全、正当权益及国家海外利益保护，并要求加强保护体系、工作机制和能力建设。同年9月1日起施行的《领事保护与协助条例》进一步明确主管机关、求助方式、协助事项及安全预防职责。\u003ca href=\"https://www.mfa.gov.cn/wjb_673085/zfxxgk_674865/zcfg/fl/202306/t20230628_11105189.shtml\">《对外关系法》\u003c/a>；\u003ca href=\"https://www.mfa.gov.cn/wjbzwfwpt/kzx/tzgg/202307/t20230717_11114236.html\">《领事保护与协助条例》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 保护对象具有两个层次。\u003c/strong> 一是海外中国公民、组织和机构，包括其人员安全、财产及其他正当权益；二是国家作为整体在海外形成的利益。自然人的身份首先涉及国籍认定，不能只按族裔判断；组织与机构则应结合其设立、法律地位和适用规则判断，不能一概收窄为具有法人资格的公司。\u003c/p>\n\u003cp>\u003cstrong>2. “正当权益”具有涉外语境。\u003c/strong> 当事人通常处于另一国家的属地管辖之下，中国法与当地法也可能存在差异。因此，判断权益应结合当地法、有关国际法规则及公正待遇等要求。保护不意味着纵容违法，更不意味着被拘留或被追诉的人就丧失获得人道待遇、程序保障和必要协助的资格。\u003c/p>\n\u003cp>\u003cstrong>3. “依法”同时要求遵守国内和国际规则。\u003c/strong> 国内职责、程序和权限是国家采取措施的依据；在海外实施保护还涉及尊重所在国主权、当地司法程序及有关条约。国内任务条款本身并不当然赋予我国机关在他国境内直接执法的权限。\u003c/p>\n\u003cp>\u003cstrong>4. “必要措施”应与具体风险相适应。\u003c/strong> 措施可以包括发布提醒、提供维权信息、联系当地机关、领事探视、外交交涉、开展国际执法合作和组织撤离等。风险性质、紧迫程度与可行条件决定措施选择，不能把每一次海外商业损失都直接转化为国家承担赔偿或采取强制行动的义务。〔笔记分析〕\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>领事保护与狭义外交保护需要区分。\u003c/strong> 《维也纳领事关系公约》第5条规定保护、帮助本国国民等领事职务，第36条涉及被拘禁国民的通知、联络和探视。此类保护与协助可以在困难或风险出现时开展，并不以先证明接受国实施国际不法行为为通常前提。\u003ca href=\"https://cs.mfa.gov.cn/zlbg/tyxy_660627/201107/t20110726_961616.shtml\">《维也纳领事关系公约》\u003c/a>。\u003c/p>\n\u003cp>国际责任法意义上的外交保护，则涉及国家就另一国家侵害其国民的国际不法行为提出责任请求，通常涉及国籍联系和用尽当地救济等条件及例外。国际法委员会2006年《外交保护条款草案》可用于研究这些规则，但它本身不是已经生效的普遍性外交保护公约。不能将其全部条件机械套用于日常领事协助。\u003ca href=\"https://legal.un.org/ilc/texts/instruments/english/draft_articles/9_8_2006.pdf\">联合国国际法委员会条款草案，第1、3、14—15条\u003c/a>。\u003c/p>\n\u003cp>〔笔记分析〕本条的国内法意义，在于把国家保护任务与机关履职联系起来；其国际法实现方式，仍取决于具体规则和国家间合作。两者相互衔接，却不能互相替代。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>也门撤离案例应注意时间。\u003c/strong> 2015年3月29日至4月6日，我国有关部门和驻外机构协作，以军舰接运等方式撤离613名中国公民。行动发生在本法7月1日公布施行之前，适合用于理解立法背景和保护需求，不宜称为依照本条实施的事后执法案例。\u003ca href=\"https://cs.mfa.gov.cn/gyls/lsgz/ztzl/zgjnhj/201504/t20150417_932696.shtml\">外交部领事司撤离行动记录\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>保护也包括预防和主体自我保障。\u003c/strong> 领事保护制度要求相关单位开展安全教育、建立应急机制，当事人亦应遵守有关法律并做好安全防范。国家保护不替代企业安全管理、当事人依法维权以及保险等社会保障安排。\u003ca href=\"https://www.mfa.gov.cn/web/wjb_673085/zfxxgk_674865/zcfg/xzfg/202307/t20230718_11114529.shtml\">《领事保护与协助条例》第4、18条\u003c/a>。\u003c/p>\n"},{"num":34,"label":"第三十四条","title":"国家安全任务的动态完善","lawText":"国家根据经济社会发展和国家发展利益的需要，不断完善维护国家安全的任务。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第三十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家根据经济社会发展和国家发展利益的需要，不断完善维护国家安全的任务。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第三十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家根据经济社会发展和国家发展利益的需要，不断完善维护国家安全的任务。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全任务的动态完善 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条是第二章的兜底规定：前面各条列明重点任务，本条为根据形势变化补充、调整任务保留空间。“不断完善”既包括关注新的风险领域，也包括改进已有领域的工作目标与制度安排。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>三审阶段增加兜底条款。\u003c/strong> 2015年6月24日的审议结果报告指出，为适应不断发展变化的情况，应在第二章增加兜底规定，建议文字与现行本条一致。见甲书附录四第384页（PDF397页）。因此，本条的开放性具有明确的审议依据，并非仅由解释者从“总体国家安全观”推导而来。\u003c/p>\n\u003cp>\u003cstrong>当时的制度考虑。\u003c/strong> 两书以生物安全、基因信息与物种安全、新发突发传染病、外来生物入侵等为例，说明列举不可能穷尽未来风险。这些例子展示了2015年立法时的预见，不宜写成当时已有完整的专门法律制度。\u003c/p>\n\u003cp>\u003cstrong>后续具体化。\u003c/strong> 《生物安全法》于2020年10月17日通过，2021年4月15日起施行，后于2024年4月26日修正，形成有关风险防控、生物技术、生物资源等方面的专门规则。这可以作为安全任务获得进一步立法落实的例子；该法的制定仍须履行立法程序，不能理解为第34条已直接授权实施其中的一切管制。\u003ca href=\"https://www.nsfc.gov.cn/p1/2871/2872/69476.html\">原始公布文本\u003c/a>、\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_072313e1142c4ca193b8dc80d9c0e904.html\">2024年修正文本\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>完善的依据有两个方面。\u003c/strong> 一是经济社会发展引起技术、产业、人员流动和风险结构的变化；二是国家发展利益产生新的保护需要。两者相联系，但不能仅因某项事务具有经济价值，就认定它当然属于需要特殊管制的国家安全事项。\u003c/li>\n\u003cli>\u003cstrong>列举任务保持开放。\u003c/strong> 第二章共20条，其中第15—33条具体规定各方面任务，第34条作兜底。这个条文数量不是对安全领域作永久、互不重叠的分类；网络、科技、经济和生物安全之间可以交叉。\u003c/li>\n\u003cli>\u003cstrong>完善不限于增加领域名称。\u003c/strong> 对已有任务，可以补充监测预警、明确部门责任、完善技术标准、改进应急能力，也可以根据风险变化调整工作重点。法律关注的是保护能力和制度安排是否充分。\u003c/li>\n\u003cli>\u003cstrong>国家任务需要转化为具体职责。\u003c/strong> 将某类风险纳入国家安全工作之后，还要明确谁负责、依据何种规范、可以采取何种措施以及如何监督。这与第三章的职责分配、第四章的风险评估和协调机制相衔接。\u003c/li>\n\u003cli>\u003cstrong>兜底规定不直接创设处罚。\u003c/strong> 本条没有规定犯罪构成、处罚种类或强制程序。对个人、企业采取处罚、许可限制或强制措施，仍须查明相应法律依据，不能仅以“新的国家安全任务”为理由实施。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>开放任务与确定权限〔笔记分析〕。\u003c/strong> 综合性安全立法需要预见未来的不确定性，而行政法和刑法又要求权力行使具有明确依据。两者可以通过“任务保持开放、权限由具体规范确定”的结构协调。本条应与第7条依法维护国家安全、第43条禁止越权滥权及第83条特别措施的限制联读。\u003c/p>\n\u003cp>\u003cstrong>风险进入国家安全议程应有论证。\u003c/strong> 可以依次考察：受影响的国家重要利益是什么，损害可能达到何种程度，现有制度为何不足，拟采取的措施与风险是否相称。这是从第2条的安全定义及风险评估制度引出的研究框架，不是本条明文规定的四项法定要件。\u003c/p>\n\u003cp>\u003cstrong>发展和安全相互联系。\u003c/strong> 新技术可能同时增进公共福祉并产生风险。任务完善既包括风险防范，也包括为合理开发利用提供可预期的规则，不能简单等同于不断增加禁止事项。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>案例的适当位置。\u003c/strong> 书中所附李某某资助危害国家安全犯罪活动案，适合说明国家安全保护需要刑法等具体制度落实，但不能用它证明第34条本身提供了定罪依据。行为是否构成犯罪，应依刑法第107条等规定判断。\u003ca href=\"https://www.court.gov.cn/zixun/xiangqing/339541.html\">最高人民法院公布的案例\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>章节衔接。\u003c/strong> 第34条回答“任务能否继续完善”；第35条起转向“由哪些机关、依什么权限履行任务”。阅读时应保留这一区别。\u003c/li>\n\u003cli>\u003cstrong>研究问题。\u003c/strong> 如何通过风险评估、立法说明和定期检视，使新增任务具有可说明、可执行和可监督的依据？\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条是第二章的兜底规定：前面各条列明重点任务，本条为根据形势变化补充、调整任务保留空间。“不断完善”既包括关注新的风险领域，也包括改进已有领域的工作目标与制度安排。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>三审阶段增加兜底条款。\u003c/strong> 2015年6月24日的审议结果报告指出，为适应不断发展变化的情况，应在第二章增加兜底规定，建议文字与现行本条一致。见甲书附录四第384页（PDF397页）。因此，本条的开放性具有明确的审议依据，并非仅由解释者从“总体国家安全观”推导而来。\u003c/p>\n\u003cp>\u003cstrong>当时的制度考虑。\u003c/strong> 两书以生物安全、基因信息与物种安全、新发突发传染病、外来生物入侵等为例，说明列举不可能穷尽未来风险。这些例子展示了2015年立法时的预见，不宜写成当时已有完整的专门法律制度。\u003c/p>\n\u003cp>\u003cstrong>后续具体化。\u003c/strong> 《生物安全法》于2020年10月17日通过，2021年4月15日起施行，后于2024年4月26日修正，形成有关风险防控、生物技术、生物资源等方面的专门规则。这可以作为安全任务获得进一步立法 abel":"第三十五条","title":"全国人大及其常委会的国家安全职责","lawText":"全国人民代表大会依照宪法规定，决定战争和和平的问题，行使宪法规定的涉及国家安全的其他职权。\n\n全国人民代表大会常务委员会依照宪法规定，决定战争状态的宣布，决定全国总动员或者局部动员，决定全国或者个别省、自治区、直辖市进入紧急状态，行使宪法规定的和全国人民代表大会授予的涉及国家安全的其他职权。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第三十五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>全国人民代表大会依照宪法规定，决定战争和和平的问题，行使宪法规定的涉及国家安全的其他职权。\u003c/p>\n\u003cp>全国人民代表大会常务委员会依照宪法规定，决定战争状态的宣布，决定全国总动员或者局部动员，决定全国或者个别省、自治区、直辖市进入紧急状态，行使宪法规定的和全国人民代表大会授予的涉及国家安全的其他职权。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第三十五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>全国人民代表大会依照宪法规定，决定战争和和平的问题，行使宪法规定的涉及国家安全的其他职权。\u003c/p>\n\u003cp>全国人民代表大会常务委员会依照宪法规定，决定战争状态的宣布，决定全国总动员或者局部动员，决定全国或者个别省、自治区、直辖市进入紧急状态，行使宪法规定的和全国人民代表大会授予的涉及国家安全的其他职权。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">全国人大及其常委会的国家安全职责 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条进入第三章“维护国家安全的职责”，将前一章的安全任务转化为国家机关的职权分工。核心是最高国家权力机关对重大安全事项的决定权，同时保留立法、监督等日常职责。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条以宪法规定为直接依据，将全国人大及其常委会原有职权集中表述于国家安全法，而非在2015年新创战争决定权。两书所引正式审议报告未提供本条逐稿修改的完整记录，不能据此断言历次草案没有变化。\u003c/p>\n\u003cp>一个重要前史是2004年修宪：将全国人大常委会职权中的“决定……戒严”修改为决定相应范围“进入紧急状态”，使宪法表述不局限于戒严这一措施。参见\u003ca href=\"https://www.gov.mo/zh-hans/content/laws/constitutional-documents/constitution-of-prc-amendment-2004/\">2004年宪法修正案\u003c/a>。2018年修宪增列监察机关相关内容后，部分列举项次顺延；现应引用宪法第62条第15项、第67条第19—21项，不能照抄较早版本的项次。参见\u003ca href=\"https://gxt.hunan.gov.cn/gxt/syzt/fzxcxx/fzxcflfg/202203/t20220321_22719616.html\">现行宪法\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>全国人大决定战争和和平的问题。\u003c/strong> 这关乎国家生存发展及全国性的政治、经济、社会安排。该项决定权与军事机关决定作战方针、指挥行动属于不同层次。\u003c/p>\n\u003cp>\u003cstrong>常委会决定战争状态的宣布，受宪法条件限制。\u003c/strong> 必须同时具备：全国人大处于闭会期间；发生国家遭受武装侵犯，或者必须履行国际间共同防止侵略条约的情况。国家安全法虽未重述全部条件，但“依照宪法规定”已将其纳入，不能将条文简称解释为无条件授权。\u003c/p>\n\u003cp>\u003cstrong>常委会决定全国总动员或者局部动员。\u003c/strong> 作出动员决定、国家主席发布动员令、国务院和中央军委组织实施，是相互衔接而各有主体的环节。平时动员准备与正式实施总动员、局部动员，也应区分。参见\u003ca href=\"https://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190522_66075.html\">国防动员法第8—9条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>常委会决定全国或者个别省级行政区域进入紧急状态。\u003c/strong> “个别省”指以整个省级区域为范围；省级区域内部部分地区的决定权见第37条。一次灾害发生、启动高级别应急响应，不当然等于进入宪法意义上的紧急状态。\u003c/p>\n\u003cp>\u003cstrong>其他职责贯穿常态治理。\u003c/strong> 全国人大及其常委会依照各自权限立法、决定人事和重大事项、开展监督；常委会还依法解释法律、决定重要条约的批准和废除。国家安全职责因此不能缩减为危机发生后的少数决定。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现的是人民代表大会制度中的职权配置。分析外国制度时，可以比较战争决定、紧急状态决定与军事指挥如何分配，但不能将中国全国人大、国家主席、中央军委直接对应成外国的议会、总统和内阁。\u003c/p>\n\u003cp>从法理看，越可能深刻改变社会运行和权利保障状态的决定，越需要明确其主体、事由与程序。紧急性是制度设计的原因，不能成为绕过制度的理由。对国家安全措施的监督，也不因涉及安全而当然消失。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>本条最易混淆的三个动词是：人大及其常委会依法\u003cstrong>决定\u003c/strong>，国家主席依法\u003cstrong>宣布或者发布\u003c/strong>，有关机关依法\u003cstrong>执行\u003c/strong>。学习时应连读第36—38条，避免把重大事项决定权、对外公布行为与行动指挥权合并。\u003c/p>\n\u003cp>还应注意，常委会“闭会期间＋特定事由”的双重限制针对战争状态宣布决定；不能不加区分地将这两个条件套用于本条所有职权。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条进入第三章“维护国家安全的职责”，将前一章的安全任务转化为国家机关的职权分工。核心是最高国家权力机关对重大安全事项的决定权，同时保留立法、监督等日常职责。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条以宪法规定为直接依据，将全国人大及其常委会原有职权集中表述于国家安全法，而非在2015年新创战争决定权。两书所引正式审议报告未提供本条逐稿修改的完整记录，不能据此断言历次草案没有变化。\u003c/p>\n\u003cp>一个重要前史是2004年修宪：将全国人大常委会职权中的“决定……戒严”修改为决定相应范围“进入紧急状态”，使宪法表述不局限于戒严这一措施。参见\u003ca href=\"https://www.gov.mo/zh-hans/content/laws/constitutional-documents/constitution-of-prc-amendment-2004/\">2004年宪法修正案\u003c/a>。2018年修宪增列监察机关相关内容后，部分列举项次顺延；现应引用宪法第62条第15项、第67条第19—21项，不能照抄较早版本的项次。参见\u003ca href=\"https://gxt.hunan.gov.cn/gxt/syzt/fzxcxx/fzxcflfg/202203/t20220321_22719616.html\">现行宪法\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>全国人大决定战争和和平的问题。\u003c/strong> 这关乎国家生存发展及全国性的政治、经济、社会安排。该项决定权与军事机关决定作战方针、指挥行动属于不同层次。\u003c/p>\n\u003cp>\u003cstrong>常委会决定战争状态的宣布，受宪法条件限制。\u003c/strong> 必须同时具备：全国人大处于闭会期间；发生国家遭受武装侵犯，或者必须履行国际间共同防止侵略条约的情况。国家安全法虽未重述全部条件，但“依照宪法规定”已将其纳入，不能将条文简称解释为无条件授权。\u003c/p>\n\u003cp>\u003cstrong>常委会决定全国总动员或者局部动员。\u003c/strong> 作出动员决定、国家主席发布动员令、国务院和中央军委组织实施，是相互衔接而各有主体的环节。平时动员准备与正式实施总动员、局部动员，也应区分。参见\u003ca href=\"https://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190522_66075.html\">国防动员法第8—9条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>常委会决定全国或者个别省级行政区域进入紧急状态。\u003c/strong> “个别省”指以整个省级区域为范围；省级区域内部部分地区的决定权见第37条。一次灾害发生、启动高级别应急响应，不当然等于进入宪法意义上的紧急状态。\u003c/p>\n\u003cp>\u003cstrong>其他职责贯穿常态治理。\u003c/strong> 全国人大及其常委会依照各自权限立法、决定人事和重大事项、开展监督；常委会还依法解释法律、决定重要条约的批准和废除。国家安全职责因此不能缩减为危机发生后的少数决定。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现的是人民代表大会制度中的职权配置。分析外国制度时，可以比较战争决定、紧急状态决定与军事指挥如何分配，但不能将中国全国人大、国家主席、中央军委直接对应成外国的议会、总统和内阁。\u003c/p>\n\u003cp>从法理看，越可能深刻改变社会运行和权利保障状态的决定，越需要明确其主体、事由与程序。紧急性是制度设计的原因，不能成为绕过制度的理由。对国家安全措施的监督，也不因涉及安全而当然消失。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>本条最易混淆的三个动词是：人大及其常委会依法\u003cstrong>决定\u003c/strong>，国家主席依法\u003cstrong>宣布或者发布\u003c/strong>，有关机关依法\u003cstrong>执行\u003c/strong>。学习时应连读第36—38条，避免把重大事项决定权、对外公布行为与行动指挥权合并。\u003c/p>\n\u003cp>还应注意，常委会“闭会期间＋特定事由”的双重限制针对战争状态宣布决定；不能不加区分地将这两个条件套用于本条所有职权。\u003c/p>\n"},{"num":36,"label":"第三十六条","title":"国家主席的国家安全职责","lawText":"中华人民共和国主席根据全国人民代表大会的决定和全国人民代表大会常务委员会的决定，宣布进入紧急状态，宣布战争状态，发布动员令，行使宪法规定的涉及国家安全的其他职权。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第三十六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中华人民共和国主席根据全国人民代表大会的决定和全国人民代表大会常务委员会的决定，宣布进入紧急状态，宣布战争状态，发布动员令，行使宪法规定的涉及国家安全的其他职权。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第三十六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中华人民共和国主席根据全国人民代表大会的决定和全国人民代表大会常务委员会的决定，宣布进入紧急状态，宣布战争状态，发布动员令，行使宪法规定的涉及国家安全的其他职权。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家主席的国家安全职责 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条的关键词是“根据……决定”。它规定国家主席在重大安全事项中的宣布、发布等职权，并不授予其独立决定战争、动员或者本条所涉紧急状态的权力。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条主要承接宪法第80条，并通过“其他职权”与第81条相衔接。2004年修宪将国家主席“发布戒严令”的表述改为“宣布进入紧急状态”，2015年国家安全法沿用了这一制度表述。参见\u003ca href=\"https://www.gov.mo/zh-hans/content/laws/constitutional-documents/constitution-of-prc-amendment-2004/\">2004年宪法修正案\u003c/a>。其沿革重点是宪法上决定与宣布的分工，以及从戒严措施到紧急状态的规范表达变化。参见\u003ca href=\"https://gxt.hunan.gov.cn/gxt/syzt/fzxcxx/fzxcflfg/202203/t20220321_22719616.html\">宪法第80—81条\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>宣布、发布以有权机关的决定为前提。\u003c/strong> 战争、紧急状态、动员分别适用宪法确定的决策程序。条文中的“和”是对不同决定来源的概括，不意味着每一事项都必须先由全国人大和常委会各作一次相同决定。应先确定事项性质，再寻找相应决定机关。\u003c/p>\n\u003cp>\u003cstrong>公布具有规范上的作用。\u003c/strong> 重大安全决定可能影响国家机关的运行、公民和组织的义务以及对外关系，需要依法通过正式形式向社会明确。不能只把宣布理解成新闻发布，也不能反过来认为宣布行为可以补足上游决定机关欠缺的权限或法定条件。\u003c/p>\n\u003cp>\u003cstrong>其他职权应逐项确认依据。\u003c/strong> 涉及国家安全的法律通过后，由国家主席依法公布；国务院有关组成人员的任免、国家勋章和荣誉称号的授予等，依宪法第80条及有关法律进行。外交方面，国家主席代表国家进行国事活动、接受外国使节；派遣和召回驻外全权代表、批准和废除同外国缔结的条约和重要协定，则依宪法第81条以常委会决定为根据。\u003c/p>\n\u003cp>\u003cstrong>与第37条形成范围衔接。\u003c/strong> 对全国或者整个个别省级区域进入紧急状态，应把常委会决定与主席宣布联系起来。省级区域内部部分地区进入紧急状态的职权另由宪法第89条第16项及本法第37条规定，不能将本条概括成所有紧急状态均须走同一宣布程序，更不能把普通应急响应也纳入该程序。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条展示了实体决定和正式公布的区分：前者回答国家是否采取某项重大措施，后者依法将决定以国家行为的形式表达出来。分工并不意味着宣布毫无意义，也不意味着宣布者取得了原本属于决定机关的判断权。\u003c/p>\n\u003cp>同时，应区分国家主席这一国家机关与中央军委主席这一职务。军事指挥职权依据宪法及军事法律配置；不能仅凭“国家主席”身份，从本条推导出军队最高指挥权。比较国家元首制度时，尤其不能直接移用外国总统兼任武装力量统帅的制度设定。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>记忆本条可以采用“\u003cstrong>先决定，再依法宣布；宣布主体不替代决定主体\u003c/strong>”的顺序。分析文书时，可依次核对决定来源、法定职权、公布形式和实施安排。\u003c/p>\n\u003cp>外交案例也要区分法律行为：会见外国元首、签署联合声明、缔结条约、批准重要条约可能属于不同类型。不能仅因文件重要或者由元首签署，就断定它已完成宪法上的条约批准程序；文件的法律性质和适用程序仍须具体核实。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条的关键词是“根据……决定”。它规定国家主席在重大安全事项中的宣布、发布等职权，并不授予其独立决定战争、动员或者本条所涉紧急状态的权力。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条主要承接宪法第80条，并通过“其他职权”与第81条相衔接。2004年修宪将国家主席“发布戒严令”的表述改为“宣布进入紧急状态”，2015年国家安全法沿用了这一制度表述。参见\u003ca href=\"https://www.gov.mo/zh-hans/content/laws/constitutional-documents/constitution-of-prc-amendment-2004/\">2004年宪法修正案\u003c/a>。其沿革重点是宪法上决定与宣布的分工，以及从戒严措施到紧急状态的规范表达变化。参见\u003ca href=\"https://gxt.hunan.gov.cn/gxt/syzt/fzxcxx/fzxcflfg/202203/t20220321_22719616.html\">宪法第80—81条\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>宣布、发布以有权机关的决定为前提。\u003c/strong> 战争、紧急状态、动员分别适用宪法确定的决策程序。条文中的“和”是对不同决定来源的概括，不意味着每一事项都必须先由全国人大和常委会各作一次相同决定。应先确定事项性质，再寻找相应决定机关。\u003c/p>\n\u003cp>\u003cstrong>公布具有规范上的作用。\u003c/strong> 重大安全决定可能影响国家机关的运行、公民和组织的义务以及对外关系，需要依法通过正式形式向社会明确。不能只把宣布理解成新闻发布，也不能反过来认为宣布行为可以补足上游决定机关欠缺的权限或法定条件。\u003c/p>\n\u003cp>\u003cstrong>其他职权应逐项确认依据。\u003c/strong> 涉及国家安全的法律通过后，由国家主席依法公布；国务院有关组成人员的任免、国家勋章和荣誉称号的授予等，依宪法第80条及有关法律进行。外交方面，国家主席代表国家进行国事活动、接受外国使节；派遣和召回驻外全权代表、批准和废除同外国缔结的条约和重要协定，则依宪法第81条以常委会决定为根据。\u003c/p>\n\u003cp>\u003cstrong>与第37条形成范围衔接。\u003c/strong> 对全国或者整个个别省级区域进入紧急状态，应把常委会决定与主席宣布联系起来。省级区域内部部分地区进入紧急状态的职权另由宪法第89条第16项及本法第37条规定，不能将本条概括成所有紧急状态均须走同一宣布程序，更不能把普通应急响应也纳入该程序。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条展示了实体决定和正式公布的区分：前者回答国家是否采取某项重大措施，后者依法将决定以国家行为的形式表达出来。分工并不意味着宣布毫无意义，也不意味着宣布者取得了原本属于决定机关的判断权。\u003c/p>\n\u003cp>同时，应区分国家主席这一国家机关与中央军委主席这一职务。军事指挥职权依据宪法及军事法律配置；不能仅凭“国家主席”身份，从本条推导出军队最高指挥权。比较国家元首制度时，尤其不能直接移用外国总统兼任武装力量统帅的制度设定。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>记忆本条可以采用“\u003cstrong>先决定，再依法宣布；宣布主体不替代决定主体\u003c/strong>”的顺序。分析文书时，可依次核对决定来源、法定职权、公布形式和实施安排。\u003c/p>\n\u003cp>外交案例也要区分法律行为：会见外国元首、签署联合声明、缔结条约、批准重要条约可能属于不同类型。不能仅因文件重要或者由元首签署，就断定它已完成宪法上的条约批准程序；文件的法律性质和适用程序仍须具体核实。\u003c/p>\n"},{"num":37,"label":"第三十七条","title":"国务院的国家安全职责","lawText":"国务院根据宪法和法律，制定涉及国家安全的行政法规，规定有关行政措施，发布有关决定和命令；实施国家安全法律法规和政策；依照法律规定决定省、自治区、直辖市的范围内部分地区进入紧急状态；行使宪法法律规定的和全国人民代表大会及其常务委员会授予的涉及国家安全的其他职权。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第三十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国务院根据宪法和法律，制定涉及国家安全的行政法规，规定有关行政措施，发布有关决定和命令；实施国家安全法律法规和政策；依照法律规定决定省、自治区、直辖市的范围内部分地区进入紧急状态；行使宪法法律规定的和全国人民代表大会及其常务委员会授予的涉及国家安全的其他职权。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第三十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国务院根据宪法和法律，制定涉及国家安全的行政法规，规定有关行政措施，发布有关决定和命令；实施国家安全法律法规和政策；依照法律规定决定省、自治区、直辖市的范围内部分地区进入紧急状态；行使宪法法律规定的和全国人民代表大会及其常务委员会授予的涉及国家安全的其他职权。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国务院的国家安全职责 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条将国务院的职责概括为行政立法与措施制定、组织实施、特定范围的紧急状态决定以及其他法定或授予职权。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>制度基础是宪法第85条关于国务院地位的规定，以及第89条关于其职权的规定。2004年修宪在调整紧急状态表述时，还明确国务院须“依照法律规定”作出相应决定。参见\u003ca href=\"https://www.gov.mo/zh-hans/content/laws/constitutional-documents/constitution-of-prc-amendment-2004/\">2004年宪法修正案\u003c/a>。\u003c/p>\n\u003cp>后续关联制度包括2024年3月11日修订并施行的国务院组织法。该法进一步规定依法行政、重大事项集体讨论、行政决策程序和监督制度，为理解本条如何实施提供组织法依据；这是关联立法的完善，不是国家安全法第37条的文字修改。参见\u003ca href=\"https://www.mee.gov.cn/zcwj/gwywj/202403/t20240312_1068167.shtml\">国务院组织法第3—9、16—17条\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>制定行政法规及有关行政措施。\u003c/strong> 国务院可以为执行法律及履行宪法规定的行政管理职权制定行政法规，也可以在全国人大及其常委会合法授权范围内先行立法。行政法规、部门规章、一般行政决定属于不同规范或行为类型，不能因为都涉及国家安全，就混称为“国家安全法律”。\u003c/p>\n\u003cp>\u003cstrong>实施法律法规和政策。\u003c/strong> 实施包括在具体管理中执行法律、组织落实配套制度、协调部门和地方、安排必要资源。制定实施性规范只是其中一部分，不能以“已发文件”代替实际履职。政策可以指导行政工作，但涉及限制权利、增加义务时，仍须检查法定权限和法律依据。\u003c/p>\n\u003cp>\u003cstrong>依法决定省级区域内部部分地区进入紧急状态。\u003c/strong> 宪法把这一范围的决定权赋予国务院；全国或者整个个别省级区域进入紧急状态由全国人大常委会决定。地方政府不能仅凭管理本行政区域的职责，取得宪法意义上的紧急状态决定权。参见\u003ca href=\"https://gxt.hunan.gov.cn/gxt/syzt/fzxcxx/fzxcflfg/202203/t20220321_22719616.html\">宪法第67、89条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>其他职权须有依据。\u003c/strong> “其他”承接宪法、法律和有权机关的授权决定，不是国务院可以自行认定并取得任何安全职权。授权立法必须核对授权事项、目的、范围及期限；立法法第12条还排除了犯罪和刑罚、剥夺公民政治权利、限制人身自由的强制措施和处罚、司法制度等事项的此种授权。参见\u003ca href=\"https://fgw.sh.gov.cn/cmsres/17/178b6e73e5684d1db5662b7aa7efc161/a7bd995c7df73639a986a41bc08e5395.pdf\">2023年修正的立法法\u003c/a>。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现行政权的执行能力与法律约束相结合。行政机关掌握专业人员、预算和全国性管理网络，适于承担持续防范、跨部门协调及应急处置；这些能力同时需要通过权限、程序、公开和监督形成可检验的责任。\u003c/p>\n\u003cp>紧急状态在地域上的分工，反映危机处理效率与重大事项慎重决策之间的制度安排。它并不意味着范围较小的紧急状态可以不受法律约束，也不意味着一旦进入紧急状态，所有普通法律自动停止适用。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>一个清晰实例是国务院修订《保守国家秘密法实施条例》，自2024年9月1日起施行：全国人大常委会制定、修改法律，国务院据此完善实施制度，具体机关再依职责执行，呈现“法律—行政法规—实施”的层次。参见\u003ca href=\"https://www.gjbmj.gov.cn/n1/2024/0722/c409080-40282902.html\">国家保密局公布的条例全文\u003c/a>。\u003c/p>\n\u003cp>阅读本条还应区分国务院领导和管理国防建设事业，与中央军委领导武装力量、统一指挥军事行动。军地事务可以依法共同办理、协调处理，但不能由“行政管理”直接推出对军队作战的指挥权。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条将国务院的职责概括为行政立法与措施制定、组织实施、特定范围的紧急状态决定以及其他法定或授予职权。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>制度基础是宪法第85条关于国务院地位的规定，以及第89条关于其职权的规定。2004年修宪在调整紧急状态表述时，还明确国务院须“依照法律规定”作出相应决定。参见\u003ca href=\"https://www.gov.mo/zh-hans/content/laws/constitutional-documents/constitution-of-prc-amendment-2004/\">2004年宪法修正案\u003c/a>。\u003c/p>\n\u003cp>后续关联制度包括2024年3月11日修订并施行的国务院组织法。该法进一步规定依法行政、重大事项集体讨论、行政决策程序和监督制度，为理解本条如何实施提供组织法依据；这是关联立法的完善，不是国家安全法第37条的文字修改。参见\u003ca href=\"https://www.mee.gov.cn/zcwj/gwywj/202403/t20240312_1068167.shtml\">国务院组织法第3—9、16—17条\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>制定行政法规及有关行政措施。\u003c/strong> 国务院可以为执行法律及履行宪法规定的行政管理职权制定行政法规，也可以在全国人大及其常委会合法授权范围内先行立法。行政法规、部门规章、一般行政决定属于不同规范或行为类型，不能因为都涉及国家安全，就混称为“国家安全法律”。\u003c/p>\n\u003cp>\u003cstrong>实施法律法规和政策。\u003c/strong> 实施包括在具体管理中执行法律、组织落实配套制度、协调部门和地方、安排必要资源。制定实施性规范只是其中一部分，不能以“已发文件”代替实际履职。政策可以指导行政工作，但涉及限制权利、增加义务时，仍须检查法定权限和法律依据。\u003c/p>\n\u003cp>\u003cstrong>依法决定省级区域内部部分地区进入紧急状态。\u003c/strong> 宪法把这一范围的决定权赋予国务院；全国或者整个个别省级区域进入紧急状态由全国人大常委会决定。地方政府不能仅凭管理本行政区域的职责，取得宪法意义上的紧急状态决定权。参见\u003ca href=\"https://gxt.hunan.gov.cn/gxt/syzt/fzxcxx/fzxcflfg/202203/t20220321_22719616.html\">宪法第67、89条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>其他职权须有依据。\u003c/strong> “其他”承接宪法、法律和有权机关的授权决定，不是国务院可以自行认定并取得任何安全职权。授权立法必须核对授权事项、目的、范围及期限；立法法第12条还排除了犯罪和刑罚、剥夺公民政治权利、限制人身自由的强制措施和处罚、司法制度等事项的此种授权。参见\u003ca href=\"https://fgw.sh.gov.cn/cmsres/17/178b6e73e5684d1db5662b7aa7efc161/a7bd995c7df73639a986a41bc08e5395.pdf\">2023年修正的立法法\u003c/a>。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现行政权的执行能力与法律约束相结合。行政机关掌握专业人员、预算和全国性管理网络，适于承担持续防范、跨部门协调及应急处置；这些能力同时需要通过权限、程序、公开和监督形成可检验的责任。\u003c/p>\n\u003cp>紧急状态在地域上的分工，反映危机处理效率与重大事项慎重决策之间的制度安排。它并不意味着范围较小的紧急状态可以不受法律约束，也不意味着一旦进入紧急状态，所有普通法律自动停止适用。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>一个清晰实例是国务院修订《保守国家秘密法实施条例》，自2024年9月1日起施行：全国人大常委会制定、修改法律，国务院据此完善实施制度，具体机关再依职责执行，呈现“法律—行政法规—实施”的层次。参见\u003ca href=\"https://www.gjbmj.gov.cn/n1/2024/0722/c409080-40282902.html\">国家保密局公布的条例全文\u003c/a>。\u003c/p>\n\u003cp>阅读本条还应区分国务院领导和管理国防建设事业，与中央军委领导武装力量、统一指挥军事行动。军地事务可以依法共同办理、协调处理，但不能由“行政管理”直接推出对军队作战的指挥权。\u003c/p>\n"},{"num":38,"label":"第三十八条","title":"中央军事委员会的国家安全职责","lawText":"中央军事委员会领导全国武装力量，决定军事战略和武装力量的作战方针，统一指挥维护国家安全的军事行动，制定涉及国家安全的军事法规，发布有关决定和命令。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第三十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中央军事委员会领导全国武装力量，决定军事战略和武装力量的作战方针，统一指挥维护国家安全的军事行动，制定涉及国家安全的军事法规，发布有关决定和命令。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第三十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中央军事委员会领导全国武装力量，决定军事战略和武装力量的作战方针，统一指挥维护国家安全的军事行动，制定涉及国家安全的军事法规，发布有关决定和命令。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">中央军事委员会的国家安全职责 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定国家安全体系中的军事领导、战略决策、行动指挥和军事立法职责。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条以宪法第93—94条为基础：中央军委领导全国武装力量，实行主席负责制；中央军委主席对全国人大及其常委会负责。2015年立法将这些组织原则与维护国家安全的具体军事职责联系起来。参见\u003ca href=\"https://gxt.hunan.gov.cn/gxt/syzt/fzxcxx/fzxcflfg/202203/t20220321_22719616.html\">现行宪法\u003c/a>。\u003c/p>\n\u003cp>阅读较早释义，应结合军队改革后的法律更新。2020年修订的国防法第15条已使用中央军委机关部门、战区、军兵种等表述，并将武警建设等职责纳入；2023年修改立法法后，军事立法依据为第117条；新修订的《军事立法工作条例》自2024年3月1日起施行。不能继续把改革前的总部、军区以及武警领导体制说明当作现行制度。\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202405/t20240529_3698466.html\">国防法\u003c/a>、\u003ca href=\"https://www.npc.gov.cn/c2/kgfb/202303/t20230314_424439.html\">立法法修改决定\u003c/a>、\u003ca href=\"https://www.mod.gov.cn/gfbw/gc/xjp/2024_246930/16282301.html\">军事立法工作条例发布消息\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>领导全国武装力量。\u003c/strong> 这里的武装力量包括中国人民解放军、中国人民武装警察部队和民兵，范围大于日常狭义使用的“军队”。依现行人民武装警察法，武警部队由党中央、中央军委集中统一领导。领导职责包括依法确定组织建设、人员管理、装备发展等事项，不限于战时发布命令。\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202405/t20240529_3698466.html\">国防法第22条\u003c/a>、\u003ca href=\"https://gat.hunan.gov.cn/gat/ztzl2/fzyd/flfg/202006/t20200622_14732452.html\">人民武装警察法第2条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>决定军事战略和作战方针。\u003c/strong> 军事战略从整体上筹划武装力量的建设和运用，作战方针指导军事行动。它们与第35条的战争、和平问题决定权有区别；依法拥有军事战略和指挥权，不等于替代全国人大及其常委会的宪法职权。\u003c/p>\n\u003cp>\u003cstrong>统一指挥维护国家安全的军事行动。\u003c/strong> 行动既可能服务于抵御侵略、保卫主权，也可能依任务和法律承担撤离人员、救援、护航等职责。是否属于本条的适用事例，要看武装力量是否实际参与以及相应军事指挥关系，不能把所有安全工作都称为军事行动。\u003c/p>\n\u003cp>\u003cstrong>制定军事法规，发布决定和命令。\u003c/strong> 军事法规与国务院行政法规的制定主体和适用机制不同；中央军委制定军事法规，与有关军事单位在权限内制定军事规章，也属于不同层级。立法法第117条明确军事法规、军事规章在武装力量内部实施，不能据本条将其解释为面向全社会的无限立法授权。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_4e6af5cd28844e98b847ac2d7c0487a4.html\">立法法第117条\u003c/a>。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>理解本条可以区分三个层次：国家的战争与和平决定，军事战略与指挥，具体军事行动。不同层次分别需要适当的权限与程序依据，不能用行动效率消解上位的宪法分工。\u003c/p>\n\u003cp>军地协作同样遵循分工。国务院承担国防建设方面的行政职责，中央军委领导、指挥武装力量；国防法第17条规定双方建立协调机制。涉及境外行动时，还须区分国内机关权限与国际法上的行动依据：本条解决国内职责配置，不能单独回答在外国领土行动是否合法。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>可用2023年苏丹撤离行动理解本条：国防部确认，经批准，海军南宁舰、微山湖舰执行撤离任务，并在使领馆协助下完成接运。这一事例能说明军事力量与外交保障如何协作。\u003ca href=\"https://www.mod.gov.cn/gfbw/qwfb/16221004.html\">国防部关于任务批准的报道\u003c/a>、\u003ca href=\"https://www.mod.gov.cn/gfbw/sy/rt/16221115.html\">任务完成情况\u003c/a>。\u003c/p>\n\u003cp>与此相比，公民或企业员工搭乘商业航班回国，可以说明海外安全保障，但仅凭这一事实，不能证明中央军委实施了军事指挥。案例与条文之间应有对应的主体、职权和行为事实。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定国家安全体系中的军事领导、战略决策、行动指挥和军事立法职责。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条以宪法第93—94条为基础：中央军委领导全国武装力量，实行主席负责制；中央军委主席对全国人大及其常委会负责。2015年立法将这些组织原则与维护国家安全的具体军事职责联系起来。参见\u003ca href=\"https://gxt.hunan.gov.cn/gxt/syzt/fzxcxx/fzxcflfg/202203/t20220321_22719616.html\">现行宪法\u003c/a>。\u003c/p>\n\u003cp>阅读较早释义，应结合军队改革后的法律更新。2020年修订的国防法第15条已使用中央军委机关部门、战区、军兵种等表述，并将武警建设等职责纳入；2023年修改立法法后，军事立法依据为第117条；新修订的《军事立法工作条例》自2024年3月1日起施行。不能继续把改革前的总部、军区以及武警领导体制说明当作现行制度。\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202405/t20240529_3698466.html\">国防法\u003c/a>、\u003ca href=\"https://www.npc.gov.cn/c2/kgfb/202303/t20230314_424439.html\">立法法修改决定\u003c/a>、\u003ca href=\"https://www.mod.gov.cn/gfbw/gc/xjp/2024_246930/16282301.html\">军事立法工作条例发布消息\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>领导全国武装力量。\u003c/strong> 这里的武装力量包括中国人民解放军、中国人民武装警察部队和民兵，范围大于日常狭义使用的“军队”。依现行人民武装警察法，武警部队由党中央、中央军委集中统一领导。领导职责包括依法确定组织建设、人员管理、装备发展等事项，不限于战时发布命令。\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202405/t20240529_3698466.html\">国防法第22条\u003c/a>、\u003ca href=\"https://gat.hunan.gov.cn/gat/ztzl2/fzyd/flfg/202006/t20200622_14732452.html\">人民武装警察法第2条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>决定军事战略和作战方针。\u003c/strong> 军事战略从整体上筹划武装力量的建设和运用，作战方针指导军事行动。它们与第35条的战争、和平问题决定权有区别；依法拥有军事战略和指挥权，不等于替代全国人大及其常委会的宪法职权。\u003c/p>\n\u003cp>\u003cstrong>统一指挥维护国家安全的军事行动。\u003c/strong> 行动既可能服务于抵御侵略、保卫主权，也可能依任务和法律承担撤离人员、救援、护航等职责。是否属于本条的适用事例，要看武装力量是否实际参与以及相应军事指挥关系，不能把所有安全工作都称为军事行动。\u003c/p>\n\u003cp>\u003cstrong>制定军事法规，发布决定和命令。\u003c/strong> 军事法规与国务院行政法规的制定主体和适用机制不同；中央军委制定军事法规，与有关军事单位在权限内制定军事规章，也属于不同层级。立法法第117条明确军事法规、军事规章在武装力量内部实施，不能据本条将其解释为面向全社会的无限立法授权。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_4e6af5cd28844e98b847ac2d7c0487a4.html\">立法法第117条\u003c/a>。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>理解本条可以区分三个层次：国家的战争与和平决定，军事战略与指挥，具体军事行动。不同层次分别需要适当的权限与程序依据，不能用行动效率消解上位的宪法分工。\u003c/p>\n\u003cp>军地协作同样遵循分工。国务院承担国防建设方面的行政职责，中央军委领导、指挥武装力量；国防法第17条规定双方建立协调机制。涉及境外行动时，还须区分国内机关权限与国际法上的行动依据：本条解决国内职责配置，不能单独回答在外国领土行动是否合法。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>可用2023年苏丹撤离行动理解本条：国防部确认，经批准，海军南宁舰、微山湖舰执行撤离任务，并在使领馆协助下完成接运。这一事例能说明军事力量与外交保障如何协作。\u003ca href=\"https://www.mod.gov.cn/gfbw/qwfb/16221004.html\">国防部关于任务批准的报道\u003c/a>、\u003ca href=\"https://www.mod.gov.cn/gfbw/sy/rt/16221115.html\">任务完成情况\u003c/a>。\u003c/p>\n\u003cp>与此相比，公民或企业员工搭乘商业航班回国，可以说明海外安全保障，但仅凭这一事实，不能证明中央军委实施了军事指挥。案例与条文之间应有对应的主体、职权和行为事实。\u003c/p>\n"},{"num":39,"label":"第三十九条","title":"中央国家机关各部门的职责","lawText":"中央国家机关各部门按照职责分工，贯彻执行国家安全方针政策和法律法规，管理指导本系统、本领域国家安全工作。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第三十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中央国家机关各部门按照职责分工，贯彻执行国家安全方针政策和法律法规，管理指导本系统、本领域国家安全工作。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第三十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中央国家机关各部门按照职责分工，贯彻执行国家安全方针政策和法律法规，管理指导本系统、本领域国家安全工作。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">中央国家机关各部门的职责 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条以“按照职责分工”为前提，规定两项相联系的任务：本机关贯彻执行国家安全要求，以及管理指导本系统、本领域的国家安全工作。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>组织法上的基础。\u003c/strong> 宪法第90条规定国务院各部、各委员会依法律和国务院的行政法规、决定、命令，在本部门权限内开展工作、发布相应规范。有关组织法与领域法律又规定上下级主管部门的关系及具体职责。本条把分散在不同制度中的国家安全责任作综合表达，并未将各种机关改造为具有同样权限的执法机关。\u003c/p>\n\u003cp>\u003cstrong>从专门工作到各领域共同履职。\u003c/strong> 国家安全机关承担法定专门职责，经济、科技、教育、文化等部门也须在各自工作中落实安全要求。2015年本法的综合性，体现为把这种贯穿各领域的责任写入职责章。\u003c/p>\n\u003cp>\u003cstrong>改稿证据。\u003c/strong> 本批核读的2015年修改情况汇报、审议结果报告和三审稿修改意见报告，未见本条逐句修改的说明，因此不推定某个语句为特定审次新增。现行机关职能和组织关系，应按后续组织立法及相关领域法律核对。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>“按照职责分工”限定工作的范围。\u003c/strong> 部门应在法定职能内主动承担责任；发现超出自身权限的问题，应依法报告、移送或协调处理。不能因为事项涉及国家安全，就认为任何部门都能实施侦查或采取强制措施。\u003c/li>\n\u003cli>\u003cstrong>贯彻执行首先落实于本机关。\u003c/strong> 两书归纳的工作包括学习法律政策、开展人员教育、把安全要求纳入日常履职，以及支持专门机关依法开展工作。这些既有内部管理内容，也有依法对外履职的内容。\u003c/li>\n\u003cli>\u003cstrong>支持专门工作须兼顾保密与合法程序。\u003c/strong> 机关及工作人员应依法提供必要支持，保护工作中知悉的国家秘密。要求相关组织提供信息或采取安全措施时，还须核对请求主体、事项、程序和适用规范。\u003c/li>\n\u003cli>\u003cstrong>管理指导的范围超出机关内部。\u003c/strong> “本系统”侧重组织和业务联系，“本领域”侧重主管事项覆盖的行业或活动。例如主管部门履行行业管理职责时，需要发现和处理与本领域有关的安全风险，不能仅做好机关自身保密便认为履职完毕。\u003c/li>\n\u003cli>\u003cstrong>上下级关系须依组织法判断。\u003c/strong> 地方政府工作部门受本级政府统一领导，并依法律或者行政法规的规定，受国务院或上级人民政府主管部门的业务指导或者领导。“业务指导”与“领导”不是可以随意替换的概念；本条不能成为中央部门包办地方政府全部事务的依据。此处行政部门的组织关系，参见\u003ca href=\"https://www.njrd.gov.cn/gfxwjbasc_0/flfgzd_66723/202203/t20220330_3330499.html\">2022年修正的地方组织法第83条\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>跨部门事务需要协调机制。\u003c/strong> 一项跨境数据业务可能同时涉及商务、网络信息、行业监管等职责，应与第45、48、49条的协调、会商和联动机制衔接。共同参与不会消除各自承担的法定责任。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>专业分工与综合安全〔笔记分析〕。\u003c/strong> 专业部门掌握行业知识，能够较早识别风险；但风险往往跨越行业，单个部门难以掌握全貌。因此，制度上既要保留专业分工，也要建立信息汇集和共同研判的渠道。这是解释本条与协调条款关系的关键。\u003c/p>\n\u003cp>\u003cstrong>职责、权限和责任应对应。\u003c/strong> “负有安全责任”并不意味着“拥有一切安全手段”。判断某项行动是否合法，要同时查明部门是否有管理责任、措施是否在其权限内，以及失职或越权由谁监督处理。第43条对依法履职的要求适用于本条全过程。\u003c/p>\n\u003cp>\u003cstrong>政策沟通也是履职方式。\u003c/strong> 管理指导并非只表现为禁止、检查和处罚。说明规则、回应疑问、提高可预期性，可以减少误解和合规成本，并帮助经营主体在开展正常业务时落实安全要求。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>实践例子。\u003c/strong> 2023年7月21日，商务部召开外资商协会政策解读沟通圆桌会，相关部门及专家就跨境数据流动、出口管制、反间谍法等问题进行解读和交流。它可以说明部门协同、政策沟通与经济安全之间的联系；一次会议本身不足以证明有关投资顾虑已全部消除。\u003ca href=\"https://dcj.mofcom.gov.cn/article/xwfb/xwbldhd/202307/20230703423168.shtml\">商务部原始通报\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>用语校准。\u003c/strong> 上述背景中的2023年7月1日，是修订后的反间谍法施行时间，不是我国第一次制定反间谍法的时间。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/202304/t20230426_429064.html\">2023年修订文本\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>阅读方法。\u003c/strong> 遇到具体部门的国家安全措施，可依次查职责依据、措施依据、协同程序和监督救济，避免仅据本条进行笼统归责。\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条以“按照职责分工”为前提，规定两项相联系的任务：本机关贯彻执行国家安全要求，以及管理指导本系统、本领域的国家安全工作。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>组织法上的基础。\u003c/strong> 宪法第90条规定国务院各部、各委员会依法律和国务院的行政法规、决定、命令，在本部门权限内开展工作、发布相应规范。有关组织法与领域法律又规定上下级主管部门的关系及具体职责。本条把分散在不同制度中的国家安全责任作综合表达，并未将各种机关改造为具有同样权限的执法机关。\u003c/p>\n\u003cp>\u003cstrong>从专门工作到各领域共同履职。\u003c/strong> 国家安全机关承担法定专门职责，经济、科技、教育、文化等部门也须在各自工作中落实安全要求。2015年本法的综合性，体现为把这种贯穿各领域的责任写入职责章。\u003c/p>\n\u003cp>\u003cstrong>改稿证据。\u003c/strong> 本批核读的2015年修改情况汇报、审议结果报告和三审稿修改意见报告，未见本条逐句修改的说明，因此不推定某个语句为特定审次新增。现行机关职能和组织关系，应按后续组织立法及相关领域法律核对。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>“按照职责分工”限定工作的范围。\u003c/strong> 部门应在法定职能内主动承担责任；发现超出自身权限的问题，应依法报告、移送或协调处理。不能因为事项涉及国家安全，就认为任何部门都能实施侦查或采取强制措施。\u003c/li>\n\u003cli>\u003cstrong>贯彻执行首先落实于本机关。\u003c/strong> 两书归纳的工作包括学习法律政策、开展人员教育、把安全要求纳入日常履职，以及支持专门机关依法开展工作。这些既有内部管理内容，也有依法对外履职的内容。\u003c/li>\n\u003cli>\u003cstrong>支持专门工作须兼顾保密与合法程序。\u003c/strong> 机关及工作人员应依法提供必要支持，保护工作中知悉的国家秘密。要求相关组织提供信息或采取安全措施时，还须核对请求主体、事项、程序和适用规范。\u003c/li>\n\u003cli>\u003cstrong>管理指导的范围超出机关内部。\u003c/strong> “本系统”侧重组织和业务联系，“本领域”侧重主管事项覆盖的行业或活动。例如主管部门履行行业管理职责时，需要发现和处理与本领域有关的安全风险，不能仅做好机关自身保密便认为履职完毕。\u003c/li>\n\u003cli>\u003cstrong>上下级关系须依组织法判断。\u003c/strong> 地方政府工作部门受本级政府统一领导，并依法律或者行政法规的规定，受国务院或上级人民政府主管部门的业务指导或者领导。“业务指导”与“领导”不是可以随意替换的概念；本条不能成为中央部门包办地方政府全部事务的依据。此处行政部门的组织关系，参见\u003ca href=\"https://www.njrd.gov.cn/gfxwjbasc_0/flfgzd_66723/202203/t20220330_3330499.html\">2022年修正的地方组织法第83条\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>跨部门事务需要协调机制。\u003c/strong> 一项跨境数据业务可能同时涉及商务、网络信息、行业监管等职责，应与第45、48、49条的协调、会商和联动机制衔接。共同参与不会消除各自承担的法定责任。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>专业分工与综合安全〔笔记分析〕。\u003c/strong> 专业部门掌握行业知识，能够较早识别风险；但风险往往跨越行业，单个部门难以掌握全貌。因此，制度上既要保留专业分工，也要建立信息汇集和共同研判的渠道。这是解释本条与协调条款关系的关键。\u003c/p>\n\u003cp>\u003cstrong>职责、权限和责任应对应。\u003c/strong> “负有安全责任”并不意味着“拥有一切安全手段”。判断某项行动是否合法，要同时查明部门是否有管理责任、措施是否在其权限内，以及失职或越权由谁监督处理。第43条对依法履职的要求适用于本条全过程。\u003c/p>\n\u003cp>\u003cstrong>政策沟通也是履职方式。\u003c/strong> 管理指导并非只表现为禁止、检查和处罚。说明规则、回应疑问、提高可预期性，可以减少误解和合规成本，并帮助经营主体在开展正常业务时落实安全要求。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>实践例子。\u003c/strong> 2023年7月21日，商务部召开外资商协会政策解读沟通圆桌会，相关部门及专家就跨境数据流动、出口管制、反间谍法等问题进行解读和交流。它可以说明部门协同、政策沟通与经济安全之间的联系；一次会议本身不足以证明有关投资顾虑已全部消除。\u003ca href=\"https://dcj.mofcom.gov.cn/article/xwfb/xwbldhd/202307/20230703423168.shtml\">商务部原始通报\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>用语校准。\u003c/strong> 上述背景中的2023年7月1日，是修订后的反间谍法施行时间，不是我国第一次制定反间谍法的时间。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/202304/t20230426_429064.html\">2023年修订文本\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>阅读方法。\u003c/strong> 遇到具体部门的国家安全措施，可依次查职责依据、措施依据、协同程序和监督救济，避免仅据本条进行笼统归责。\u003c/li>\n\u003c/ul>\n"},{"num":40,"label":"第四十条","title":"地方及特别行政区维护国家安全的责任","lawText":"地方各级人民代表大会和县级以上地方各级人民代表大会常务委员会在本行政区域内，保证国家安全法律法规的遵守和执行。\n\n地方各级人民政府依照法律法规规定管理本行政区域内的国家安全工作。\n\n香港特别行政区、澳门特别行政区应当履行维护国家安全的责任。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第四十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>地方各级人民代表大会和县级以上地方各级人民代表大会常务委员会在本行政区域内，保证国家安全法律法规的遵守和执行。\u003c/p>\n\u003cp>地方各级人民政府依照法律法规规定管理本行政区域内的国家安全工作。\u003c/p>\n\u003cp>香港特别行政区、澳门特别行政区应当履行维护国家安全的责任。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第四十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>地方各级人民代表大会和县级以上地方各级人民代表大会常务委员会在本行政区域内，保证国家安全法律法规的遵守和执行。\u003c/p>\n\u003cp>地方各级人民政府依照法律法规规定管理本行政区域内的国家安全工作。\u003c/p>\n\u003cp>香港特别行政区、澳门特别行政区应当履行维护国家安全的责任。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">地方及特别行政区维护国家安全的责任 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条分三款，分别规定地方人大及其常委会、地方人民政府和两个特别行政区的责任。三款的共同主题是地方责任，其具体组织基础和履职方式有所不同。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>宪法与基本法基础。\u003c/strong> 宪法第3条规定，在中央统一领导下发挥地方的主动性、积极性；第99条等规定地方人大保证宪法、法律、行政法规在本行政区域内遵守和执行的职责。两个特别行政区的国家安全责任，则应结合各自基本法第18、23条及相关规定理解。本条对这些制度基础作国家安全领域的综合确认。\u003c/p>\n\u003cp>\u003cstrong>2015年立法的定位。\u003c/strong> 本条既明确一般地方机关的国家安全职责，也单列香港、澳门的责任。所核审议材料未提供本条逐句改稿经过，不将其表述为某轮审议始新增的制度。\u003c/p>\n\u003cp>\u003cstrong>组织与监督制度更新。\u003c/strong> 地方组织法于2022年修正；人大常委会监督法的2024年修改决定于11月8日公布并施行。理解地方履职方式，应采用更新后的职权和程序规定，不能将早期释义所列旧条号作为现行条号使用。\u003ca href=\"https://www.njrd.gov.cn/gfxwjbasc_0/flfgzd_66723/202203/t20220330_3330499.html\">2022年地方组织法\u003c/a>、\u003ca href=\"https://qspfw.moe.gov.cn/html/hotnews/20241114/22434.html\">2024年监督法修改决定\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>港澳后续立法。\u003c/strong> 香港国安法于2020年6月30日在香港公布并生效；香港《维护国家安全条例》于2024年3月19日通过、3月23日刊宪生效。澳门第2/2009号法律《维护国家安全法》自2009年3月3日起生效，2023年的第8/2023号法律对其作出修改，自2023年5月30日起生效。阅读2016年的释义时，应把这些后来发展补入；澳门2009年立法则属于本法制定前的制度基础。\u003ca href=\"https://www.info.gov.hk/gia/general/202006/30/P2020063000961p.htm\">香港国安法公布通报\u003c/a>、\u003ca href=\"https://www.info.gov.hk/gia/general/202406/26/P2024062600195.htm\">香港条例施行说明\u003c/a>、\u003ca href=\"https://www.fsm.gov.mo/psp/cht/law_security.html\">澳门2009年法律介绍\u003c/a>、\u003ca href=\"https://www.fsm.gov.mo/psp/cht/SaU230615.html\">澳门2023年修法说明\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>地方人大的责任是保证法律实施。\u003c/strong> 根据各自权限，可以通过地方立法、重大事项决定、计划预算审查、听取报告和监督等方式履职。县级以上地方人大常委会还可依法开展执法检查、备案审查、询问质询等工作。不能把这些方式理解为每一级地方人大及其常委会均具有全部权限。\u003c/li>\n\u003cli>\u003cstrong>注意机关层级与立法权限。\u003c/strong> 乡、民族乡、镇设人民代表大会，没有人大常委会。地方性法规制定权也须依据立法法等判断，不能因本条使用“地方各级”便推导出县、乡均可制定地方性法规。\u003c/li>\n\u003cli>\u003cstrong>地方政府承担区域管理职责。\u003c/strong> 各级政府在其法定职责范围内，组织落实国防动员、公共安全、应急准备以及相关领域的安全工作。这里的“法规”包括相应适用的行政法规、地方性法规；政府制定规章的权限仍由组织法、立法法等确定。\u003c/li>\n\u003cli>\u003cstrong>具体行政措施仍须逐项有据。\u003c/strong> 行政许可、检查、强制、处罚、征收征用以及补偿等措施，分别受相应法律制度约束。本条的综合管理责任不能替代采取具体措施所需的实体和程序依据。\u003c/li>\n\u003cli>\u003cstrong>区域责任与上下协同并行。\u003c/strong> 风险可能跨越行政边界，地方机关应依法报告并组织协作，需要上级统筹的依相应规定处理。地方政府启动应急响应，与宪法意义上决定进入紧急状态不是一回事；后者须遵守第35、37、64条等关于机关权限和程序的规定。\u003c/li>\n\u003cli>\u003cstrong>港澳的责任在各自宪制秩序中落实。\u003c/strong> 基本法第23条规定自行立法的责任，第18条规定全国性法律在特别行政区适用的机制。第三款不能被读作所有内地安全法律和刑法条款当然直接适用于港澳，也不能由高度自治推导出特别行政区不承担国家安全责任。2020年香港国安法经附件三机制实施，2024年条例属于本地立法，二者的法源与制定路径应分别识别。\u003ca href=\"https://www.basiclaw.gov.hk/sc/basiclaw/chapter2.html\">香港基本法第二章\u003c/a>、\u003ca href=\"https://al.gov.mo/zh/basic-law\">澳门基本法\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>防务与当地治安有职责区分。\u003c/strong> 依基本法及驻军法，中央人民政府负责特别行政区的防务，特区政府负责维持当地社会治安。特区政府在必要时可向中央人民政府请求驻军协助维持社会治安和救助灾害；这一请求机制不等于特区政府取得对驻军的军事指挥权。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>统一国家中的地方履责〔笔记分析〕。\u003c/strong> 国家安全具有整体性，地方又最接近实际风险、资源和居民需要。本条把全国法律的统一实施与地方依法管理结合起来。应当讨论的是如何明确责任层级与协调程序，而非认为一切安全事项均由中央机关直接办理。\u003c/p>\n\u003cp>\u003cstrong>保证实施与具体执行的分工。\u003c/strong> 地方人大及其常委会通过法律规定的决定、监督等方式保证实施；政府承担行政管理和组织执行职责。监督机关不能代替行政机关作所有日常决定，行政机关也不能以专业性、紧迫性为由免除依法接受监督的责任。\u003c/p>\n\u003cp>\u003cstrong>特别行政区责任与法律适用必须分别判断。\u003c/strong> 第三款确定责任原则；具体行为适用什么法律，由基本法、在当地实施的全国性法律以及当地法律共同确定。对于个案，要查明行为时间、罪名、法条和有权机关，不能只凭“涉及国家安全”的标签跨越法律适用规则。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>书中案例校核。\u003c/strong> 乙书第114—115页所载香港网络电台主持人尹某某案，应与官方公布的 \u003cem>香港特别行政区诉尹耀昇\u003c/em>［2022］HKDC 958相核对。官方摘要记载判刑日期为2022年10月7日、总刑期32个月；定罪涉及当时《刑事罪行条例》第10(1)(a)条的串谋煽动罪，以及《有组织及严重罪行条例》第25条的三项洗黑钱罪。书中写作10月22日，并以香港国安法第21条解释本案定罪，均需校正。刑事判刑由法院作出，也不应写成国家安全机关对其“进行了刑事处罚”。法院在量刑中讨论行为与香港国安法的关系，不等于被告即按该法的分裂国家罪获罪。\u003ca href=\"https://www.hknslannot.gov.hk/tc/home/pdf/DCCC_615_2021_HKDC_958_tc.pdf\">香港律政司官方案例摘要\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>与下一条衔接。\u003c/strong> 第40条说明区域和组织层面的责任，第41条将专门规定法院、检察院依法行使审判权、检察权。维护国家安全的共同目标，并不消除侦查、起诉、审判等职能的区别。\u003c/p>\n\u003cp>\u003cstrong>研究问题。\u003c/strong> 在跨地区风险事件中，地方管理、部门管理和上级统筹如何确定主责机关？在特别行政区个案中，如何分别识别责任原则、具体实体法与程序法依据？\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条分三款，分别规定地方人大及其常委会、地方人民政府和两个特别行政区的责任。三款的共同主题是地方责任，其具体组织基础和履职方式有所不同。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>宪法与基本法基础。\u003c/strong> 宪法第3条规定，在中央统一领导下发挥地方的主动性、积极性；第99条等规定地方人大保证宪法、法律、行政法规在本行政区域内遵守和执行的职责。两个特别行政区的国家安全责任，则应结合各自基本法第18、23条及相关规定理解。本条对这些制度基础作国家安全领域的综合确认。\u003c/p>\n\u003cp>\u003cstrong>2015年立法的定位。\u003c/strong> 本条既明确一般地方机关的国家安全职责，也单列香港、澳门的责任。所核审议材料未提供本条逐句改稿经过，不将其表述为某轮审议始新增的制度。\u003c/p>\n\u003cp>\u003cstrong>组织与监督制度更新。\u003c/strong> 地方组织法于2022年修正；人大常委会监督法的2024年修改决定于11月8日公布并施行。理解地方履职方式，应采用更新后的职权和程序规定，不能将早期释义所列旧条号作为现行条号使用。\u003ca href=\"https://www.njrd.gov.cn/gfxwjbasc_0/flfgzd_66723/202203/t20220330_3330499.html\">2022年地方组织法\u003c/a>、\u003ca href=\"https://qspfw.moe.gov.cn/html/hotnews/20241114/22434.html\">2024年监督法修改决定\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>港澳后续立法。\u003c/strong> 香港国安法于2020年6月30日在香港公布并生效；香港《维护国家安全条例》于2024年3月19日通过、3月23日刊宪生效。澳门第2/2009号法律《维护国家安全法》自2009年3月3日起生效，2023年的第8/2023号法律对其作出修改，自2023年5月30日起生效。阅读2016年的释义时，应把这些后来发展补入；澳门2009年立法则属于本法制定前的制度基础。\u003ca href=\"https://www.info.gov.hk/gia/general/202006/30/P2020063000961p.htm\">香港国安法公布通报\u003c/a>、\u003ca href=\"https://www.info.gov.hk/gia/general/202406/26/P2024062600195.htm\">香港条例施行说明\u003c/a>、\u003ca href=\"https://www.fsm.gov.mo/psp/cht/law_security.html\">澳门2009年法律介绍\u003c/a>、\u003ca href=\"https://www.fsm.gov.mo/psp/cht/SaU230615.html\">澳门2023年修法说明\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>地方人大的责任是保证法律实施。\u003c/strong> 根据各自权限，可以通过地方立法、重大事项决定、计划预算审查、听取报告和监督等方式履职。县级以上地方人大常委会还可依法开展执法检查、备案审查、询问质询等工作。不能把这些方式理解为每一级地方人大及其常委会均具有全部权限。\u003c/li>\n\u003cli>\u003cstrong>注意机关层级与立法权限。\u003c/strong> 乡、民族乡、镇设人民代表大会，没有人大常委会。地方性法规制定权也须依据立法法等判断，不能因本条使用“地方各级”便推导出县、乡均可制定地方性法规。\u003c/li>\n\u003cli>\u003cstrong>地方政府承担区域管理职责。\u003c/strong> 各级政府在其法定职责范围内，组织落实国防动员、公共安全、应急准备以及相关领域的安全工作。这里的“法规”包括相应适用的行政法规、地方性法规；政府制定规章的权限仍由组织法、立法法等确定。\u003c/li>\n\u003cli>\u003cstrong>具体行政措施仍须逐项有据。\u003c/strong> 行政许可、检查、强制、处罚、征收征用以及补偿等措施，分别受相应法律制度约束。本条的综合管理责任不能替代采取具体措施所需的实体和程序依据。\u003c/li>\n\u003cli>\u003cstrong>区域责任与上下协同并行。\u003c/strong> 风险可能跨越行政边界，地方机关应依法报告并组织协作，需要上级统筹的依相应规定处理。地方政府启动应急响应，与宪法意义上决定进入紧急状态不是一回事；后者须遵守第35、37、64条等关于机关权限和程序的规定。\u003c/li>\n\u003cli>\u003cstrong>港澳的责任在各自宪制秩序中落实。\u003c/strong> 基本法第23条规定自行立法的责任，第18条规定全国性法律在特别行政区适用的机制。第三款不能被读作所有内地安全法律和刑法条款当然直接适用于港澳，也不能由高度自治推导出特别行政区不承担国家安全责任。2020年香港国安法经附件三机制实施，2024年条例属于本地立法，二者的法源与制定路径应分别识别。\u003ca href=\"https://www.basiclaw.gov.hk/sc/basiclaw/chapter2.html\">香港基本法第二章\u003c/a>、\u003ca href=\"https://al.gov.mo/zh/basic-law\">澳门基本法\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>防务与当地治安有职责区分。\u003c/strong> 依基本法及驻军法，中央人民政府负责特别行政区的防务，特区政府负责维持当地社会治安。特区政府在必要时可向中央人民政府请求驻军协助维持社会治安和救助灾害；这一请求机制不等于特区政府取得对驻军的军事指挥权。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>统一国家中的地方履责〔笔记分析〕。\u003c/strong> 国家安全具有整体性，地方又最接近实际风险、资源和居民需要。本条把全国法律的统一实施与地方依法管理结合起来。应当讨论的是如何明确责任层级与协调程序，而非认为一切安全事项均由中央机关直接办理。\u003c/p>\n\u003cp>\u003cstrong>保证实施与具体执行的分工。\u003c/strong> 地方人大及其常委会通过法律规定的决定、监督等方式保证实施；政府承担行政管理和组织执行职责。监督机关不能代替行政机关作所有日常决定，行政机关也不能以专业性、紧迫性为由免除依法接受监督的责任。\u003c/p>\n\u003cp>\u003cstrong>特别行政区责任与法律适用必须分别判断。\u003c/strong> 第三款确定责任原则；具体行为适用什么法律，由基本法、在当地实施的全国性法律以及当地法律共同确定。对于个案，要查明行为时间、罪名、法条和有权机关，不能只凭“涉及国家安全”的标签跨越法律适用规则。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>书中案例校核。\u003c/strong> 乙书第114—115页所载香港网络电台主持人尹某某案，应与官方公布的 \u003cem>香港特别行政区诉尹耀昇\u003c/em>［2022］HKDC 958相核对。官方摘要记载判刑日期为2022年10月7日、总刑期32个月；定罪涉及当时《刑事罪行条例》第10(1)(a)条的串谋煽动罪，以及《有组织及严重罪行条例》第25条的三项洗黑钱罪。书中写作10月22日，并以香港国安法第21条解释本案定罪，均需校正。刑事判刑由法院作出，也不应写成国家安全机关对其“进行了刑事处罚”。法院在量刑中讨论行为与香港国安法的关系，不等于被告即按该法的分裂国家罪获罪。\u003ca href=\"https://www.hknslannot.gov.hk/tc/home/pdf/DCCC_615_2021_HKDC_958_tc.pdf\">香港律政司官方案例摘要\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>与下一条衔接。\u003c/strong> 第40条说明区域和组织层面的责任，第41条将专门规定法院、检察院依法行使审判权、检察权。维护国家安全的共同目标，并不消除侦查、起诉、审判等职能的区别。\u003c/p>\n\u003cp>\u003cstrong>研究问题。\u003c/strong> 在跨地区风险事件中，地方管理、部门管理和上级统筹如何确定主责机关？在特别行政区个案中，如何分别识别责任原则、具体实体法与程序法依据？\u003c/p>\n"},{"num":41,"label":"第四十一条","title":"人民法院、人民检察院的职责","lawText":"人民法院依照法律规定行使审判权，人民检察院依照法律规定行使检察权，惩治危害国家安全的犯罪。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第四十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>人民法院依照法律规定行使审判权，人民检察院依照法律规定行使检察权，惩治危害国家安全的犯罪。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第四十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>人民法院依照法律规定行使审判权，人民检察院依照法律规定行使检察权，惩治危害国家安全的犯罪。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">人民法院、人民检察院的职责 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定国家安全领域的审判与检察职责。两个“依照法律规定”意味着，惩治犯罪必须通过各自法定职权和诉讼程序实现，不能把共同的安全任务理解为侦查、起诉和裁判职能可以相互替代。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>承接宪法与诉讼法的既有分工。\u003c/strong> 2015年本条把法院、检察院的法定职能纳入国家安全职责体系，未另行创设一种脱离普通刑事诉讼规则的“国家安全裁判权”。现行宪法第128、131条规定人民法院的地位与依法独立行使审判权，第134、136条规定人民检察院的地位与依法独立行使检察权；第140条同时规定刑事案件办理中的分工、配合与制约。\u003ca href=\"https://www.npc.gov.cn/zgrdw/pc/13_2/2018-03/22/content_2071091.htm\">现行《宪法》\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>后续制度更新。\u003c/strong> 2018年宪法修正后，上述条号与2016年释义使用的旧条号不同。两院组织法于2018年修订、2019年1月1日起施行，刑事诉讼法也于2018年修正，阅读本条应结合这些后续制度；不能把书中摘录的旧组织法职责清单直接视为现行规则。\u003ca href=\"https://gongbao.court.gov.cn/Details/9cb05785bb151f791c1634ed0d1b0b.html\">《人民法院组织法》\u003c/a>；\u003ca href=\"https://www.spp.gov.cn/spp/fl/201810/t20181026_396824.shtml\">《人民检察院组织法》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 法院通过刑事审判判断是否构成犯罪及如何处罚。\u003c/strong> 审判权包括依法审查事实、证据和法律适用，作出有罪或者无罪等裁判。本条不能被读成“既然案件涉及国家安全，就只能作有罪判决”。刑事诉讼法第12条确立未经人民法院依法判决不得确定有罪的规则；保护无罪者不受追究，同样属于司法职责。\u003ca href=\"https://www.spp.gov.cn/spp/zdgz/201810/t20181027_396818.shtml\">《刑事诉讼法》第2、12条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>2. 检察院承担追诉与法律监督职责。\u003c/strong> 在危害国家安全刑事案件中，主要包括审查批准逮捕、审查是否起诉、提起和支持公诉，并监督相关诉讼及执行活动。依法不批准逮捕、不起诉、纠正违法侦查，也属于履职结果。检察权不等于定罪权，检察机关自行侦查案件也须另有法律依据，不能仅凭本条任意扩大直接侦查范围。\u003c/p>\n\u003cp>\u003cstrong>3. “危害国家安全的犯罪”须回到具体刑法规范。\u003c/strong> 刑法分则第一章集中规定危害国家安全罪；其他章节的犯罪也可能侵害总体国家安全观所涵盖的利益。但政策意义上的安全风险与刑法上的犯罪构成不能混同，本条本身没有创设罪名，也不能用宽泛的安全概念填补犯罪构成要件。\u003c/p>\n\u003cp>\u003cstrong>4. 两院的国家安全职责并不限于本条所强调的刑事领域。\u003c/strong> 民事、行政审判和依法开展的检察监督也可能保护有关国家安全利益，但这些工作须分别依据相应组织法与程序法，不能把本条中的“惩治犯罪”扩张为对一切纠纷采用刑事手段。〔笔记分析〕\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>〔笔记分析〕理解本条宜从“控诉与裁判分离”“权力相互制约”“权利保障”三个方面展开。侦查机关形成的判断需要经过检察审查；起诉意见需要经过法院依法审理。各环节的独立判断，是降低误判风险、保证刑法正确实施的制度条件。\u003c/p>\n\u003cp>“互相配合”与“互相制约”应当同时理解，不能只保留配合。案件专业化和跨机关沟通可以提高办案能力，但不能预先决定裁判结果，也不能替代辩护、证据审查和法定救济。此处的“依法独立行使”应按我国宪法规定的机关制度理解，不宜直接套入其他国家的检察机关组织模式。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>旧术语需要更新。\u003c/strong> 《释义》印刷211页仍摘录“免予起诉”。该制度已在1996年刑事诉讼法修改时取消，不能继续列为现行检察职权；现应依法律区分不同的不起诉情形。“免予起诉”与法院依法认定有罪后免予刑事处罚，也不是同一事项。\u003ca href=\"https://www.spp.gov.cn/spp/zhuanlan/201807/t20180710_384346.shtml\">最高检关于制度沿革的说明\u003c/a>。\u003c/p>\n\u003cp>书中北京检察机关设置专业办案机构的事例，可用于理解专业化分工。仅凭办案数量和机构设置，尚不足以证明某类犯罪发生率因此下降；应把制度介绍与需要独立证据支持的效果评价分开。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定国家安全领域的审判与检察职责。两个“依照法律规定”意味着，惩治犯罪必须通过各自法定职权和诉讼程序实现，不能把共同的安全任务理解为侦查、起诉和裁判职能可以相互替代。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>承接宪法与诉讼法的既有分工。\u003c/strong> 2015年本条把法院、检察院的法定职能纳入国家安全职责体系，未另行创设一种脱离普通刑事诉讼规则的“国家安全裁判权”。现行宪法第128、131条规定人民法院的地位与依法独立行使审判权，第134、136条规定人民检察院的地位与依法独立行使检察权；第140条同时规定刑事案件办理中的分工、配合与制约。\u003ca href=\"https://www.npc.gov.cn/zgrdw/pc/13_2/2018-03/22/content_2071091.htm\">现行《宪法》\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>后续制度更新。\u003c/strong> 2018年宪法修正后，上述条号与2016年释义使用的旧条号不同。两院组织法于2018年修订、2019年1月1日起施行，刑事诉讼法也于2018年修正，阅读本条应结合这些后续制度；不能把书中摘录的旧组织法职责清单直接视为现行规则。\u003ca href=\"https://gongbao.court.gov.cn/Details/9cb05785bb151f791c1634ed0d1b0b.html\">《人民法院组织法》\u003c/a>；\u003ca href=\"https://www.spp.gov.cn/spp/fl/201810/t20181026_396824.shtml\">《人民检察院组织法》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 法院通过刑事审判判断是否构成犯罪及如何处罚。\u003c/strong> 审判权包括依法审查事实、证据和法律适用，作出有罪或者无罪等裁判。本条不能被读成“既然案件涉及国家安全，就只能作有罪判决”。刑事诉讼法第12条确立未经人民法院依法判决不得确定有罪的规则；保护无罪者不受追究，同样属于司法职责。\u003ca href=\"https://www.spp.gov.cn/spp/zdgz/201810/t20181027_396818.shtml\">《刑事诉讼法》第2、12条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>2. 检察院承担追诉与法律监督职责。\u003c/strong> 在危害国家安全刑事案件中，主要包括审查批准逮捕、审查是否起诉、提起和支持公诉，并监督相关诉讼及执行活动。依法不批准逮捕、不起诉、纠正违法侦查，也属于履职结果。检察权不等于定罪权，检察机关自行侦查案件也须另有法律依据，不能仅凭本条任意扩大直接侦查范围。\u003c/p>\n\u003cp>\u003cstrong>3. “危害国家安全的犯罪”须回到具体刑法规范。\u003c/strong> 刑法分则第一章集中规定危害国家安全罪；其他章节的犯罪也可能侵害总体国家安全观所涵盖的利益。但政策意义上的安全风险与刑法上的犯罪构成不能混同，本条本身没有创设罪名，也不能用宽泛的安全概念填补犯罪构成要件。\u003c/p>\n\u003cp>\u003cstrong>4. 两院的国家安全职责并不限于本条所强调的刑事领域。\u003c/strong> 民事、行政审判和依法开展的检察监督也可能保护有关国家安全利益，但这些工作须分别依据相应组织法与程序法，不能把本条中的“惩治犯罪”扩张为对一切纠纷采用刑事手段。〔笔记分析〕\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003
