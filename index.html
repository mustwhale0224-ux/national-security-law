c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年草案说明把加快国家安全法治建设、构建法律制度体系作为制定综合性国家安全法的背景。当时1993年国家安全法主要规范专门机关特别是反间谍工作；2014年反间谍法制定并废止旧国家安全法，2015年新法再承担综合性、全局性的制度任务。见甲书附录二，印刷第372—374页（PDF第385—387页）。这属于制度形成背景，所核审议材料未提供本条逐句修改记录。\u003c/p>\n\u003cp>书中“正在制定”“争取到2020年”等表述具有特定写作时间，阅读时应更新。例如，早期释义所列粮食和能源领域的立法任务，后来分别落实为2023年通过、2024年6月1日施行的粮食安全保障法，以及2024年通过、2025年1月1日施行的能源法。\u003ca href=\"https://fgs.moa.gov.cn/flfg/202401/t20240118_6446125.htm\">粮食安全保障法第74条\u003c/a>、\u003ca href=\"https://www.nea.gov.cn/2024-12/03/c_1212408329.htm\">国家能源局关于能源法的说明\u003c/a>。\u003c/p>\n\u003cp>本批还涉及刚生效的修法：国防动员法于2026年8月28日修订，自2026年10月1日起施行。前述第64—65条所引动员决定、特别措施等配套规定，须采用这次修订后的文本。这也是本条“健全法律制度体系”在持续修法层面的具体体现。\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">2026年国防动员法\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 法律制度体系既有层级，也有领域分工。\u003c/strong> 宪法居于根本地位；国家安全法规定总体原则、任务和制度；反间谍、情报、反恐怖、保密、网络、数据、生物等专门法律予以具体化；刑法、诉讼法及其他法律处理相关行为、程序和责任。行政法规、地方性法规、规章在各自法定权限内作出配套规定，须符合上位法。\u003c/p>\n\u003cp>\u003cstrong>2. 综合性规定与专门规则应协调适用。\u003c/strong> 判断一项措施时，应明确具体机关、行为、对象、触发条件和程序，结合适用的专门法解释国家安全法的原则要求。不能仅以“涉及国家安全”代替具体授权，也不能只读一般条文而忽略专门法已设定的条件。\u003c/p>\n\u003cp>\u003cstrong>3. 立法需要覆盖权力、责任与权利保障。\u003c/strong> 既要解决何种风险由谁防范、采取什么措施，也要规定权限边界、事实依据、程序、保密及信息使用要求、监督与责任。立法法第11条对犯罪和刑罚、限制人身自由的强制措施和处罚等设有法律保留要求；部门文件不能自行替代应由法律规定的事项。\u003ca href=\"https://fgw.sh.gov.cn/cmsres/17/178b6e73e5684d1db5662b7aa7efc161/a7bd995c7df73639a986a41bc08e5395.pdf\">立法法第10—12条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>4. 法治建设贯穿法律实施。\u003c/strong> 执法须依法调查、说明依据并遵守程序；司法须审查构成要件、证据及法律适用；机关和社会主体须理解并履行法定义务；监督则应发现和纠正违法、失职及规范冲突。上述环节共同决定制度的实际效果。\u003c/p>\n\u003cp>\u003cstrong>5. “健全”要求持续更新与清理。\u003c/strong> 新风险可能需要新增规范，现有制度也可能需要修改、解释或协调。法律数量增加本身不足以证明体系完备，还须考察规范是否明确、彼此衔接、能够实施。书中法律数量统计只能按其统计时点、范围理解。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>国家安全法治同时具有保障履职和规范权力的功能。明确授权能够帮助机关及时行动，明确程序与责任能够降低任意处置和误判风险；对权利的保护属于制度本身的组成部分。这也与本法第7条的法治原则、第66条的处置措施选择要求相衔接。\u003c/p>\n\u003cp>比较各国制度时，宜比较具体权限、触发条件、程序和监督，而不宜仅按是否有一部名为“国家安全法”的法律判断法治化程度。综合立法与多部专门法可以形成不同的制度结构，关键在于规范如何相互配合、如何适用于具体行动。\u003c/p>\n\u003cp>术语上，称本法具有“基础性”作用，是对其制度地位的描述；不应据此直接认定它就是立法法第10条所称由全国人民代表大会制定的“基本法律”，更不能据此主张它当然高于所有其他法律。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>案例应回到具体法律。\u003c/strong> 书中唐英杰案涉及香港国安法中的犯罪构成、证据及量刑，不能作为直接依据本条定罪的案例。律政司公布的判刑摘要还明确：该案恐怖活动罪量刑适用未造成严重身体伤害的“其他情形”档次。应区分控方指控、定罪事实和量刑认定，避免只依据新闻转述作结论。\u003ca href=\"https://www.doj.gov.hk/en/publications/national_security/pdf/HCCC_280_2020_HKCFI_2239_en.pdf\">香港律政司判刑摘要：HKSAR v Tong Ying Kit，2021 HKCFI 2239\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>更新法律名称和版本。\u003c/strong> 个人信息保护的正式法律名称为《中华人民共和国个人信息保护法》。保守国家秘密法已于2024年修订，网络安全法已于2025年修改；查找书中关联条文时，应同时核对现行版本、条号和生效日期。\u003ca href=\"https://gdca.miit.gov.cn/zwgk/zcwj/flfg/art/2024/art_4870c40a6f8249389684d03786d41639.html\">2024年保守国家秘密法\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2025-12/29/c_1768735112911946.htm\">2025年修改后的网络安全法\u003c/a>。\u003c/p>\n"},{"num":71,"label":"第七十一条","title":"国家安全建设的经费与装备保障","lawText":"国家加大对国家安全各项建设的投入，保障国家安全工作所需经费和装备。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第七十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家加大对国家安全各项建设的投入，保障国家安全工作所需经费和装备。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第七十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家加大对国家安全各项建设的投入，保障国家安全工作所需经费和装备。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全建设的经费与装备保障 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条要求国家为安全职责提供相应物质条件。关键词是“各项建设”“所需”和“保障”：投入覆盖多种安全领域，以履行具体职责的实际需要为依据，并须形成可以持续使用的工作能力。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已经将财政保障列入第五章国家安全保障的主要内容，显示立法者有意把工作任务与履职条件一并规定。所读后续三份审议报告未披露本条的具体文字修改，不能据此断言本条未经修改。（甲书印刷页376—377，PDF第389—390页。）\u003c/p>\n\u003cp>制度上，本条将不同领域分散存在的经费保障要求提升为国家安全的一般原则。预算安排仍应与预算法衔接：第12条规定统筹、节约、量力而行和绩效等原则，第13条确立预算对支出的约束，第57条要求依法拨款、按预算执行及开展绩效评价。\u003ca href=\"https://jdjc.mof.gov.cn/fgzd/202111/t20211111_3765227.htm\">《预算法》现行文本\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 投入对象包括设施、技术、人才和制度运行。\u003c/strong> 经费既用于装备和基础设施，也用于技术研发、人才培养、设施维护、信息研判及风险防范等工作。“各项建设”不能收缩为购置设备，更不能等同于某一个部门的建设。\u003c/p>\n\u003cp>\u003cstrong>2. 财政保障须与职责分工相匹配。\u003c/strong> 财政保障由中央和地方依分工共同承担。理解这一点，应结合国家与地方各自承担的任务、财政事权和支出责任，分别纳入相应预算；本条没有规定统一分担比例，也没有授权部门向企业或个人摊派经费。\u003c/p>\n\u003cp>\u003cstrong>3. “加大投入”兼顾需要与承受能力。\u003c/strong> 应在国家安全形势、任务变化和经济社会发展条件之间作出综合判断。条文没有设定逐年增长的固定比例，更不意味着每个项目、每个部门都取得无条件增加预算的权利。保障的目标是弥补能力短板，尤其是重点领域、重要地区和关键环节的实际需要。\u003c/p>\n\u003cp>\u003cstrong>4. 装备保障包含配备后的维护与使用。\u003c/strong> 能否维修、升级、补充配件和保持人员操作能力，都会影响装备的实际效能。因此，编制预算时宜考虑全寿命周期成本，避免购置时投入充足、运行维护时失去保障。这是从本条保障目的作出的解释。\u003c/p>\n\u003cp>\u003cstrong>5. 投入必须接受相应监督。\u003c/strong> 特殊性可以使经费管理采取符合法律规定的特殊安排，但不能由此推导出自行改变预算用途、虚列支出或者排除法定监督的权力。涉密事项的公开例外与有权机关依法开展监督，应分别处理。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>财政保障是国家履行安全保护义务的必要条件。\u003c/strong> 如果只规定机关必须预防风险，却不给予必要人员、装备和运行经费，职责就容易停留在纸面。本条使国家安全法不仅调整对外采取的措施，也调整国家自身的能力建设。\u003c/p>\n\u003cp>\u003cstrong>经费充足与经费节约具有共同目标。\u003c/strong> 安全收益常表现为风险没有发生，不能简单按经营收入衡量；但仍可评价设备可用率、应急响应能力、维护质量、重复建设程度等。财政绩效不能机械追求当期可见产出，也不能因为安全收益难以量化而放弃论证和核查。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中科研经费被侵占的案例可用于理解资金管理的重要性，但不能据此把所有科研资金一概认定为财政资金，或把任何经费管理差错直接认定为贪污。具体责任仍须查明资金来源、用途限制、行为人身份、行为方式和主观要件。\u003c/p>\n\u003cp>阅读本条可以依次追问：由谁承担任务、需要什么能力、预算如何安排、装备能否持续使用、资金使用如何核查。本条解决“有经费、有装备”；第72—74条进一步展开物资、科技和人才保障。\u003c/p>\n\u003chr>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条要求国家为安全职责提供相应物质条件。关键词是“各项建设”“所需”和“保障”：投入覆盖多种安全领域，以履行具体职责的实际需要为依据，并须形成可以持续使用的工作能力。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已经将财政保障列入第五章国家安全保障的主要内容，显示立法者有意把工作任务与履职条件一并规定。所读后续三份审议报告未披露本条的具体文字修改，不能据此断言本条未经修改。（甲书印刷页376—377，PDF第389—390页。）\u003c/p>\n\u003cp>制度上，本条将不同领域分散存在的经费保障要求提升为国家安全的一般原则。预算安排仍应与预算法衔接：第12条规定统筹、节约、量力而行和绩效等原则，第13条确立预算对支出的约束，第57条要求依法拨款、按预算执行及开展绩效评价。\u003ca href=\"https://jdjc.mof.gov.cn/fgzd/202111/t20211111_3765227.htm\">《预算法》现行文本\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 投入对象包括设施、技术、人才和制度运行。\u003c/strong> 经费既用于装备和基础设施，也用于技术研发、人才培养、设施维护、信息研判及风险防范等工作。“各项建设”不能收缩为购置设备，更不能等同于某一个部门的建设。\u003c/p>\n\u003cp>\u003cstrong>2. 财政保障须与职责分工相匹配。\u003c/strong> 财政保障由中央和地方依分工共同承担。理解这一点，应结合国家与地方各自承担的任务、财政事权和支出责任，分别纳入相应预算；本条没有规定统一分担比例，也没有授权部门向企业或个人摊派经费。\u003c/p>\n\u003cp>\u003cstrong>3. “加大投入”兼顾需要与承受能力。\u003c/strong> 应在国家安全形势、任务变化和经济社会发展条件之间作出综合判断。条文没有设定逐年增长的固定比例，更不意味着每个项目、每个部门都取得无条件增加预算的权利。保障的目标是弥补能力短板，尤其是重点领域、重要地区和关键环节的实际需要。\u003c/p>\n\u003cp>\u003cstrong>4. 装备保障包含配备后的维护与使用。\u003c/strong> 能否维修、升级、补充配件和保持人员操作能力，都会影响装备的实际效能。因此，编制预算时宜考虑全寿命周期成本，避免购置时投入充足、运行维护时失去保障。这是从本条保障目的作出的解释。\u003c/p>\n\u003cp>\u003cstrong>5. 投入必须接受相应监督。\u003c/strong> 特殊性可以使经费管理采取符合法律规定的特殊安排，但不能由此推导出自行改变预算用途、虚列支出或者排除法定监督的权力。涉密事项的公开例外与有权机关依法开展监督，应分别处理。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>财政保障是国家履行安全保护义务的必要条件。\u003c/strong> 如果只规定机关必须预防风险，却不给予必要人员、装备和运行经费，职责就容易停留在纸面。本条使国家安全法不仅调整对外采取的措施，也调整国家自身的能力建设。\u003c/p>\n\u003cp>\u003cstrong>经费充足与经费节约具有共同目标。\u003c/strong> 安全收益常表现为风险没有发生，不能简单按经营收入衡量；但仍可评价设备可用率、应急响应能力、维护质量、重复建设程度等。财政绩效不能机械追求当期可见产出，也不能因为安全收益难以量化而放弃论证和核查。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中科研经费被侵占的案例可用于理解资金管理的重要性，但不能据此把所有科研资金一概认定为财政资金，或把任何经费管理差错直接认定为贪污。具体责任仍须查明资金来源、用途限制、行为人身份、行为方式和主观要件。\u003c/p>\n\u003cp>阅读本条可以依次追问：由谁承担任务、需要什么能力、预算如何安排、装备能否持续使用、资金使用如何核查。本条解决“有经费、有装备”；第72—74条进一步展开物资、科技和人才保障。\u003c/p>\n\u003chr>\n"},{"num":72,"label":"第七十二条","title":"战略物资的收储、维护与轮换","lawText":"承担国家安全战略物资储备任务的单位，应当按照国家有关规定和标准对国家安全物资进行收储、保管和维护，定期调整更换，保证储备物资的使用效能和安全。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第七十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>承担国家安全战略物资储备任务的单位，应当按照国家有关规定和标准对国家安全物资进行收储、保管和维护，定期调整更换，保证储备物资的使用效能和安全。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第七十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>承担国家安全战略物资储备任务的单位，应当按照国家有关规定和标准对国家安全物资进行收储、保管和维护，定期调整更换，保证储备物资的使用效能和安全。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">战略物资的收储、维护与轮换 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条的直接规范对象是承担储备任务的单位，核心义务是使储备物资始终具备可用性与安全性。账面上“有储备”还不够，调用时能否正常使用才是检验保障效果的重要方面。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年草案说明已经将物资保障列入国家安全保障制度。2015年立法并非从零建立所有储备体系，而是将国防动员、应急保障以及粮食、能源等领域既有储备安排纳入国家安全的共同要求。所读审议报告未提供本条逐字修改的证据。\u003c/p>\n\u003cp>\u003cstrong>适用时须更新书中旧法条号。\u003c/strong> 2026年8月28日修订、同年10月1日起施行的《国防动员法》，现以第40条规定战略物资储备和调用制度，第41条规定承储单位的保管维护和定期调整轮换，第42条规定调用及实施国防动员后的批准要求。书中引用的旧第33条不能继续作为现行对应条号。\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">2026年修订《国防动员法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 义务来自依法承担的储备任务。\u003c/strong> 主体可以包括国有企业、事业单位和依法承担有关任务的其他所有制单位。判断重点在于是否依据相关制度实际承担任务，不能仅凭企业从事粮食、药品或能源经营，就认定其全部库存都是国家战略储备。\u003c/p>\n\u003cp>\u003cstrong>2. 收储应符合品种、数量和质量要求。\u003c/strong> 储备规划确定需要储存什么以及储存规模，承担任务的单位依规定执行。收购验收、质量检测、入库登记和账实核对，是使任务落实到具体物资的环节；承储单位不能自行改变任务、以低质物资替代合格物资。\u003c/p>\n\u003cp>\u003cstrong>3. 保管和维护是持续性义务。\u003c/strong> 不同物资需要不同环境、设施和管理方式。防火、防潮、防腐、设备维护以及相应安全管理，都服务于条文所要求的使用效能和安全。主管部门的规划、指导和监督责任，与承储单位的日常管理责任应加以区分。\u003c/p>\n\u003cp>\u003cstrong>4. 调整更换兼顾损耗和技术变化。\u003c/strong> 粮食、药品可能过期变质，装备、零部件也可能因技术更新而无法继续配套。轮换的目的，是在保持必要储备能力的前提下更新物资；具体周期、数量和程序依类别规定，不能将某类粮食或储备棉的轮换比例推广为所有战略物资的统一标准。\u003c/p>\n\u003cp>\u003cstrong>5. 承储权责不等于自由调用权。\u003c/strong> 承储单位负有妥善保管和按规定轮换的义务，不能因此自行将储备用于经营、出借或者处置。储备何时调用、由谁批准，应依相应专项制度判断；本条本身没有授予任何单位直接调拨全部战略储备的权限。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>战略储备处理的是常态市场供应难以独立承担的重大风险。储存成本在平时发生，保障收益往往在战争、灾害或供应中断时才显现，因此不能完全按一般企业库存的周转效率评价。\u003c/p>\n\u003cp>与此同时，储备也应讲求成本、布局和品类合理性。数量并非唯一指标，物资是否适用、能否安全储存、能否及时到达需要地点同样关键。对“避免重复建设、兼顾效益”的要求，可理解为统筹既有储备体系的要求，不宜推导为任何领域都只允许单一储备方式。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>应区分三种行为：\u003cstrong>轮换\u003c/strong>是保持储备质量和适用性的管理行为；\u003cstrong>调用\u003c/strong>是按权限将储备用于指定目的；\u003cstrong>征收、征用\u003c/strong>则涉及对其他主体财产采取措施，各有法律依据与程序。不能因为承担国家安全保障任务，就将三者混同。\u003c/p>\n\u003cp>例如，账面储存的应急设备数量达标，但关键部件失效、没有完成必要维护，仍可能没有履行本条保障使用效能的义务。是否进一步承担行政、民事或刑事责任，应依有关专门规定及具体事实判断，本条并未直接设定独立罚则。\u003c/p>\n\u003chr>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条的直接规范对象是承担储备任务的单位，核心义务是使储备物资始终具备可用性与安全性。账面上“有储备”还不够，调用时能否正常使用才是检验保障效果的重要方面。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年草案说明已经将物资保障列入国家安全保障制度。2015年立法并非从零建立所有储备体系，而是将国防动员、应急保障以及粮食、能源等领域既有储备安排纳入国家安全的共同要求。所读审议报告未提供本条逐字修改的证据。\u003c/p>\n\u003cp>\u003cstrong>适用时须更新书中旧法条号。\u003c/strong> 2026年8月28日修订、同年10月1日起施行的《国防动员法》，现以第40条规定战略物资储备和调用制度，第41条规定承储单位的保管维护和定期调整轮换，第42条规定调用及实施国防动员后的批准要求。书中引用的旧第33条不能继续作为现行对应条号。\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">2026年修订《国防动员法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 义务来自依法承担的储备任务。\u003c/strong> 主体可以包括国有企业、事业单位和依法承担有关任务的其他所有制单位。判断重点在于是否依据相关制度实际承担任务，不能仅凭企业从事粮食、药品或能源经营，就认定其全部库存都是国家战略储备。\u003c/p>\n\u003cp>\u003cstrong>2. 收储应符合品种、数量和质量要求。\u003c/strong> 储备规划确定需要储存什么以及储存规模，承担任务的单位依规定执行。收购验收、质量检测、入库登记和账实核对，是使任务落实到具体物资的环节；承储单位不能自行改变任务、以低质物资替代合格物资。\u003c/p>\n\u003cp>\u003cstrong>3. 保管和维护是持续性义务。\u003c/strong> 不同物资需要不同环境、设施和管理方式。防火、防潮、防腐、设备维护以及相应安全管理，都服务于条文所要求的使用效能和安全。主管部门的规划、指导和监督责任，与承储单位的日常管理责任应加以区分。\u003c/p>\n\u003cp>\u003cstrong>4. 调整更换兼顾损耗和技术变化。\u003c/strong> 粮食、药品可能过期变质，装备、零部件也可能因技术更新而无法继续配套。轮换的目的，是在保持必要储备能力的前提下更新物资；具体周期、数量和程序依类别规定，不能将某类粮食或储备棉的轮换比例推广为所有战略物资的统一标准。\u003c/p>\n\u003cp>\u003cstrong>5. 承储权责不等于自由调用权。\u003c/strong> 承储单位负有妥善保管和按规定轮换的义务，不能因此自行将储备用于经营、出借或者处置。储备何时调用、由谁批准，应依相应专项制度判断；本条本身没有授予任何单位直接调拨全部战略储备的权限。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>战略储备处理的是常态市场供应难以独立承担的重大风险。储存成本在平时发生，保障收益往往在战争、灾害或供应中断时才显现，因此不能完全按一般企业库存的周转效率评价。\u003c/p>\n\u003cp>与此同时，储备也应讲求成本、布局和品类合理性。数量并非唯一指标，物资是否适用、能否安全储存、能否及时到达需要地点同样关键。对“避免重复建设、兼顾效益”的要求，可理解为统筹既有储备体系的要求，不宜推导为任何领域都只允许单一储备方式。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>应区分三种行为：\u003cstrong>轮换\u003c/strong>是保持储备质量和适用性的管理行为；\u003cstrong>调用\u003c/strong>是按权限将储备用于指定目的；\u003cstrong>征收、征用\u003c/strong>则涉及对其他主体财产采取措施，各有法律依据与程序。不能因为承担国家安全保障任务，就将三者混同。\u003c/p>\n\u003cp>例如，账面储存的应急设备数量达标，但关键部件失效、没有完成必要维护，仍可能没有履行本条保障使用效能的义务。是否进一步承担行政、民事或刑事责任，应依有关专门规定及具体事实判断，本条并未直接设定独立罚则。\u003c/p>\n\u003chr>\n"},{"num":73,"label":"第七十三条","title":"以科技创新支撑国家安全","lawText":"鼓励国家安全领域科技创新，发挥科技在维护国家安全中的作用。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第七十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>鼓励国家安全领域科技创新，发挥科技在维护国家安全中的作用。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第七十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>鼓励国家安全领域科技创新，发挥科技在维护国家安全中的作用。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">以科技创新支撑国家安全 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条确立国家安全保障中的科技支持原则，着眼于通过科研、技术进步和成果应用提升维护安全的能力。它与第24条侧重维护科技本身及其关键成果安全的规定相互联系，但规范重心有所不同。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年草案说明已经将科技保障作为第五章的专门内容。此前，国防科研生产、农业科技、节能技术、环境保护和应急救援等领域已有科技支持制度；本条从国家安全整体需要出发，对这些制度提出共同方向。所读审议材料没有披露本条独立的文字修改过程。\u003c/p>\n\u003cp>后续法律进一步丰富了实施方式。例如，2024年修订《突发事件应对法》第56条已经综合规定应急管理基础研究、关键技术、现代技术应用以及人才培养，书中旧第36条应据此更新；2025年修改、2026年施行的《网络安全法》第20条，将人工智能研发支持与伦理、风险监测评估、安全监管相结合，并支持运用新技术提升网络安全保护水平。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">《突发事件应对法》第56条\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2025-12/29/c_1768735112911946.htm\">现行《网络安全法》第20条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 科技保障面向全部相关安全领域。\u003c/strong> 国防、能源资源、粮食、应急、生态和核安全等工作均存在科技保障需求。其共同点是用技术提高发现风险、预防损害、处置事件和恢复运行的能力。因此，本条不能仅理解为国家安全机关内部使用的侦查技术。\u003c/p>\n\u003cp>\u003cstrong>2. 鼓励对象包括科研与应用主体。\u003c/strong> 政府可以通过规划、研发投入、科研项目和相应政策组织引导；高校、科研机构、企业等则可以开展研究、成果转化和技术服务。具体补助、采购、税收待遇或项目资格，仍须根据相应法律政策确定，不能仅凭本条主张特定数额的财政支持。\u003c/p>\n\u003cp>\u003cstrong>3. 创新应与具体安全需求结合。\u003c/strong> 基础研究和关键核心技术攻关具有长期意义，工程应用、系统适配、检测验证和维护保障同样影响成效。从实验成果到可稳定使用的工具，还需要验证其可靠性、适用条件和可能失效的情形。\u003c/p>\n\u003cp>\u003cstrong>4. 技术部署仍需合法权限。\u003c/strong> “鼓励创新”是能力建设要求，不是直接扩大调查、监控、数据处理或者限制权利权限的条款。某种技术可以实现某种功能，不等于机关当然有权使用这一功能；具体措施须依据相应法律、履行程序，并落实适用的保密和信息保护要求。\u003c/p>\n\u003cp>\u003cstrong>5. 研发过程本身也要防范风险。\u003c/strong> 技术可能提升防护能力，也可能产生误判、数据泄露或新的依赖。科研诚信、科技伦理和安全要求应贯穿研发与应用。《科学技术进步法》第103、106、107条分别涉及科技伦理、科技保密及有关禁止性要求。\u003ca href=\"https://www.most.gov.cn/xxgk/xinxifenlei/fdzdgknr/fgzc/flfg/202201/t20220118_179043.html\">《科学技术进步法》\u003c/a>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>科技具有工具性，也具有风险性。\u003c/strong> 因此，评价科技保障不仅看效率提升，还要看可靠性、可验证性和对合法权益的影响。将技术输出直接视为无须审查的事实结论，反而可能放大原有数据或模型的偏差。\u003c/p>\n\u003cp>\u003cstrong>技术能力应与制度能力共同发展。\u003c/strong> 例如，监测系统提高了发现异常的能力，还需要明确由谁复核、向谁报告、谁能采取措施，以及错误信息如何纠正。第73条与前述情报信息、风险预防和危机管控制度结合，才能把技术成果转化为合法、有效的安全保障。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>研读时可将科技事项分为三个问题：所研究的技术是否有助于维护安全；研发、试验和部署是否符合相应规范；最终应用是否在有权主体的法定权限内。前一问题得到肯定回答，不能替代后两个问题的判断。\u003c/p>\n\u003cp>第71条提供投入基础，第74条保障人才，第73条则强调二者如何形成技术能力。书中列举的行业规定是具体例证，不能把本条的适用范围封闭为列举的几个行业，也不宜将与科技保障联系有限的犯罪案例当作本条的直接适用案例。\u003c/p>\n\u003chr>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条确立国家安全保障中的科技支持原则，着眼于通过科研、技术进步和成果应用提升维护安全的能力。它与第24条侧重维护科技本身及其关键成果安全的规定相互联系，但规范重心有所不同。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年草案说明已经将科技保障作为第五章的专门内容。此前，国防科研生产、农业科技、节能技术、环境保护和应急救援等领域已有科技支持制度；本条从国家安全整体需要出发，对这些制度提出共同方向。所读审议材料没有披露本条独立的文字修改过程。\u003c/p>\n\u003cp>后续法律进一步丰富了实施方式。例如，2024年修订《突发事件应对法》第56条已经综合规定应急管理基础研究、关键技术、现代技术应用以及人才培养，书中旧第36条应据此更新；2025年修改、2026年施行的《网络安全法》第20条，将人工智能研发支持与伦理、风险监测评估、安全监管相结合，并支持运用新技术提升网络安全保护水平。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">《突发事件应对法》第56条\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2025-12/29/c_1768735112911946.htm\">现行《网络安全法》第20条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 科技保障面向全部相关安全领域。\u003c/strong> 国防、能源资源、粮食、应急、生态和核安全等工作均存在科技保障需求。其共同点是用技术提高发现风险、预防损害、处置事件和恢复运行的能力。因此，本条不能仅理解为国家安全机关内部使用的侦查技术。\u003c/p>\n\u003cp>\u003cstrong>2. 鼓励对象包括科研与应用主体。\u003c/strong> 政府可以通过规划、研发投入、科研项目和相应政策组织引导；高校、科研机构、企业等则可以开展研究、成果转化和技术服务。具体补助、采购、税收待遇或项目资格，仍须根据相应法律政策确定，不能仅凭本条主张特定数额的财政支持。\u003c/p>\n\u003cp>\u003cstrong>3. 创新应与具体安全需求结合。\u003c/strong> 基础研究和关键核心技术攻关具有长期意义，工程应用、系统适配、检测验证和维护保障同样影响成效。从实验成果到可稳定使用的工具，还需要验证其可靠性、适用条件和可能失效的情形。\u003c/p>\n\u003cp>\u003cstrong>4. 技术部署仍需合法权限。\u003c/strong> “鼓励创新”是能力建设要求，不是直接扩大调查、监控、数据处理或者限制权利权限的条款。某种技术可以实现某种功能，不等于机关当然有权使用这一功能；具体措施须依据相应法律、履行程序，并落实适用的保密和信息保护要求。\u003c/p>\n\u003cp>\u003cstrong>5. 研发过程本身也要防范风险。\u003c/strong> 技术可能提升防护能力，也可能产生误判、数据泄露或新的依赖。科研诚信、科技伦理和安全要求应贯穿研发与应用。《科学技术进步法》第103、106、107条分别涉及科技伦理、科技保密及有关禁止性要求。\u003ca href=\"https://www.most.gov.cn/xxgk/xinxifenlei/fdzdgknr/fgzc/flfg/202201/t20220118_179043.html\">《科学技术进步法》\u003c/a>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>科技具有工具性，也具有风险性。\u003c/strong> 因此，评价科技保障不仅看效率提升，还要看可靠性、可验证性和对合法权益的影响。将技术输出直接视为无须审查的事实结论，反而可能放大原有数据或模型的偏差。\u003c/p>\n\u003cp>\u003cstrong>技术能力应与制度能力共同发展。\u003c/strong> 例如，监测系统提高了发现异常的能力，还需要明确由谁复核、向谁报告、谁能采取措施，以及错误信息如何纠正。第73条与前述情报信息、风险预防和危机管控制度结合，才能把技术成果转化为合法、有效的安全保障。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>研读时可将科技事项分为三个问题：所研究的技术是否有助于维护安全；研发、试验和部署是否符合相应规范；最终应用是否在有权主体的法定权限内。前一问题得到肯定回答，不能替代后两个问题的判断。\u003c/p>\n\u003cp>第71条提供投入基础，第74条保障人才，第73条则强调二者如何形成技术能力。书中列举的行业规定是具体例证，不能把本条的适用范围封闭为列举的几个行业，也不宜将与科技保障联系有限的犯罪案例当作本条的直接适用案例。\u003c/p>\n\u003chr>\n"},{"num":74,"label":"第七十四条","title":"专门人才、特殊人才与工作人员保护","lawText":"国家采取必要措施，招录、培养和管理国家安全工作专门人才和特殊人才。\n\n根据维护国家安全工作的需要，国家依法保护有关机关专门从事国家安全工作人员的身份和合法权益，加大人身保护和安置保障力度。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第七十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家采取必要措施，招录、培养和管理国家安全工作专门人才和特殊人才。\u003c/p>\n\u003cp>根据维护国家安全工作的需要，国家依法保护有关机关专门从事国家安全工作人员的身份和合法权益，加大人身保护和安置保障力度。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第七十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家采取必要措施，招录、培养和管理国家安全工作专门人才和特殊人才。\u003c/p>\n\u003cp>根据维护国家安全工作的需要，国家依法保护有关机关专门从事国家安全工作人员的身份和合法权益，加大人身保护和安置保障力度。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">专门人才、特殊人才与工作人员保护 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>第一款要求建立适应安全工作需要的人才队伍；第二款保护有关机关专门从事国家安全工作的人员。两款分别侧重队伍建设与职业保障，适用对象和具体措施应分别判断。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年草案说明已将专门人才保障纳入国家安全保障。制度背景在于安全工作具有不同程度的专业性、保密性和职业风险，普通人才培养及人事管理安排有时不足以满足履职需要。所读审议报告未披露本条具体文字的修改。\u003c/p>\n\u003cp>2017年制定、2018年修正的《国家情报法》进一步具体化有关机制：第21条规定情报机构的特殊管理保障和人员管理制度，第23、24条规定执行或协助任务时的人身保护、营救和有关人员安置。这些规定可以帮助理解本条如何在专门领域落实，但其适用范围仍应依专门法确定。\u003ca href=\"https://qhca.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_a97c92189dea4940bf0ec7739d89026c.html\">《国家情报法》第21—24条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. “专门人才”与“特殊人才”按工作需要理解。\u003c/strong> 前者侧重履行某类国家安全专门工作所需的职业素养和专业能力；后者侧重具有适合特殊任务的能力、技能或经验。条文没有列出封闭的专业目录，也不能将“特殊”简单理解为学历更高或行政级别更高。\u003c/p>\n\u003cp>\u003cstrong>2. 招录、培养、管理构成完整过程。\u003c/strong> 招录包括依法进行考试录用、遴选或相应选用；培养包括教育体系中的专业培养与在职培训；管理则包括岗位安排、考核、晋升、待遇和退出等。符合国家安全工作特点的特别安排仍须有相应制度依据，本条不能被理解为允许任何部门任意免除录用条件或程序。\u003c/p>\n\u003cp>\u003cstrong>3. 人才保障不限于侦查与情报。\u003c/strong> 科技、网络、能源、应急等安全工作也需要专业队伍。应根据具体职责和人才类型采用相应培养、使用方式，而不是将所有参与国家安全工作的人一律纳入同一种特殊人事管理制度。\u003c/p>\n\u003cp>\u003cstrong>4. 身份保护服从任务需要并依法实施。\u003c/strong> 第二款明确针对有关机关专门从事国家安全工作的人员。对于依法需要保护的身份，防止不当披露有助于保护人员及任务；但不能据此认定所有相关人员的一切履职活动当然秘密，也不能将身份保护等同于排除对违法行为的追责。\u003c/p>\n\u003cp>\u003cstrong>5. 人身保护和安置处理职业风险。\u003c/strong> 应结合具体制度建立风险防范、遇险保护营救及后续安置安排。由任务造成的工作、生活困难应得到适当解决。国家情报法对特定情形下本人及近亲属的保护作了规定，但不能仅凭本条无限扩大享受特殊待遇的人员范围。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>特殊职业风险应有相应保障。\u003c/strong> 国家要求工作人员承担高保密要求和特殊风险，就应提供与职责相适应的培养、保护及职业后续安排。保障既维护个人合法权益，也有助于稳定队伍和保持工作连续性。\u003c/p>\n\u003cp>\u003cstrong>专业化与法治化相互支撑。\u003c/strong> 专业能力不仅包括技术、语言或分析技能，也包括对权限、程序和权利边界的理解。人才管理不能只强调任务结果；遵法守纪、保密要求和职业操守同样影响能否胜任岗位。特殊保障与严格责任可以同时存在。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>应区分本条的\u003cstrong>工作人员职业保障\u003c/strong>与第80条的\u003cstrong>公民、组织因支持协助工作而受保护的权利\u003c/strong>。一般人员提供一次协助，并不因此自动取得专门工作人员身份；相反，未取得这种身份，也不影响依法享有协助者保护。\u003c/p>\n\u003cp>书中科研人员被策反的案例可用于说明保密教育与人员管理的重要性，但不宜据此把正常出国研修或学术交流本身视为违法。判断具体行为仍须审查实际活动、信息性质、主观认识及有关法律构成要件，人才培养与风险防范应同时落实。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>第一款要求建立适应安全工作需要的人才队伍；第二款保护有关机关专门从事国家安全工作的人员。两款分别侧重队伍建设与职业保障，适用对象和具体措施应分别判断。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年草案说明已将专门人才保障纳入国家安全保障。制度背景在于安全工作具有不同程度的专业性、保密性和职业风险，普通人才培养及人事管理安排有时不足以满足履职需要。所读审议报告未披露本条具体文字的修改。\u003c/p>\n\u003cp>2017年制定、2018年修正的《国家情报法》进一步具体化有关机制：第21条规定情报机构的特殊管理保障和人员管理制度，第23、24条规定执行或协助任务时的人身保护、营救和有关人员安置。这些规定可以帮助理解本条如何在专门领域落实，但其适用范围仍应依专门法确定。\u003ca href=\"https://qhca.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_a97c92189dea4940bf0ec7739d89026c.html\">《国家情报法》第21—24条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. “专门人才”与“特殊人才”按工作需要理解。\u003c/strong> 前者侧重履行某类国家安全专门工作所需的职业素养和专业能力；后者侧重具有适合特殊任务的能力、技能或经验。条文没有列出封闭的专业目录，也不能将“特殊”简单理解为学历更高或行政级别更高。\u003c/p>\n\u003cp>\u003cstrong>2. 招录、培养、管理构成完整过程。\u003c/strong> 招录包括依法进行考试录用、遴选或相应选用；培养包括教育体系中的专业培养与在职培训；管理则包括岗位安排、考核、晋升、待遇和退出等。符合国家安全工作特点的特别安排仍须有相应制度依据，本条不能被理解为允许任何部门任意免除录用条件或程序。\u003c/p>\n\u003cp>\u003cstrong>3. 人才保障不限于侦查与情报。\u003c/strong> 科技、网络、能源、应急等安全工作也需要专业队伍。应根据具体职责和人才类型采用相应培养、使用方式，而不是将所有参与国家安全工作的人一律纳入同一种特殊人事管理制度。\u003c/p>\n\u003cp>\u003cstrong>4. 身份保护服从任务需要并依法实施。\u003c/strong> 第二款明确针对有关机关专门从事国家安全工作的人员。对于依法需要保护的身份，防止不当披露有助于保护人员及任务；但不能据此认定所有相关人员的一切履职活动当然秘密，也不能将身份保护等同于排除对违法行为的追责。\u003c/p>\n\u003cp>\u003cstrong>5. 人身保护和安置处理职业风险。\u003c/strong> 应结合具体制度建立风险防范、遇险保护营救及后续安置安排。由任务造成的工作、生活困难应得到适当解决。国家情报法对特定情形下本人及近亲属的保护作了规定，但不能仅凭本条无限扩大享受特殊待遇的人员范围。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>特殊职业风险应有相应保障。\u003c/strong> 国家要求工作人员承担高保密要求和特殊风险，就应提供与职责相适应的培养、保护及职业后续安排。保障既维护个人合法权益，也有助于稳定队伍和保持工作连续性。\u003c/p>\n\u003cp>\u003cstrong>专业化与法治化相互支撑。\u003c/strong> 专业能力不仅包括技术、语言或分析技能，也包括对权限、程序和权利边界的理解。人才管理不能只强调任务结果；遵法守纪、保密要求和职业操守同样影响能否胜任岗位。特殊保障与严格责任可以同时存在。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>应区分本条的\u003cstrong>工作人员职业保障\u003c/strong>与第80条的\u003cstrong>公民、组织因支持协助工作而受保护的权利\u003c/strong>。一般人员提供一次协助，并不因此自动取得专门工作人员身份；相反，未取得这种身份，也不影响依法享有协助者保护。\u003c/p>\n\u003cp>书中科研人员被策反的案例可用于说明保密教育与人员管理的重要性，但不宜据此把正常出国研修或学术交流本身视为违法。判断具体行为仍须审查实际活动、信息性质、主观认识及有关法律构成要件，人才培养与风险防范应同时落实。\u003c/p>\n"},{"num":75,"label":"第七十五条","title":"专门工作手段与协同保障","lawText":"国家安全机关、公安机关、有关军事机关开展国家安全专门工作，可以依法采取必要手段和方式，有关部门和地方应当在职责范围内提供支持和配合。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第七十五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家安全机关、公安机关、有关军事机关开展国家安全专门工作，可以依法采取必要手段和方式，有关部门和地方应当在职责范围内提供支持和配合。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第七十五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家安全机关、公安机关、有关军事机关开展国家安全专门工作，可以依法采取必要手段和方式，有关部门和地方应当在职责范围内提供支持和配合。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">专门工作手段与协同保障 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条连接第42条的专门机关职责与第五章的国家安全保障，规定专门工作可以使用哪些性质的手段，以及其他部门、地方怎样协助。理解时应把握“专门工作”“依法”“必要”“职责范围内”四项限制。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>制度基础。\u003c/strong> 2015年以前，刑事诉讼法、人民警察法及当时的反间谍法等，已经分别规定执法、侦查及有关协助措施。本条将分散的手段保障置于总体国家安全框架之内，但没有将各法的职权统一授予所有安全工作机关。\u003c/p>\n\u003cp>\u003cstrong>后续发展。\u003c/strong> 2023年修订《反间谍法》进一步明确调查处置、技术侦察与身份保护、通行和场所保障等制度，并同时规定批准、出示证件、使用范围和监督要求。研读本条时，应以这些具体规定确定可采取措施的主体、条件与程序。\u003ca href=\"https://www.gjbmj.gov.cn/n1/2023/0802/c409088-40049143.html\">现行《反间谍法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 特定机关履行特定职责。\u003c/strong> 主体为国家安全机关、公安机关和有关军事机关；行为必须属于依法开展的国家安全专门工作。某项事务具有安全意义，并不当然使一般行政机关取得专门侦查权限。\u003c/p>\n\u003cp>\u003cstrong>2. “必要手段和方式”包括一般措施与特别措施。\u003c/strong> 可以从通常执法活动与适应国家安全特殊需要的工作措施两个方面理解。此种分类便于理解，实际适用仍须逐一查明法律依据。搜查、查封、拘留、技术侦察的对象、审批层级和程序不同，不能因为统称“必要手段”而互相替代。\u003c/p>\n\u003cp>\u003cstrong>3. 依法与必要构成双重要求。\u003c/strong> 依法解决有没有权、由谁决定、怎样实施；必要解决措施与具体任务是否相关、范围和强度是否适当。已有具体授权，也不意味着可以把与任务无关的人、财产和信息一并纳入。例如现行《反间谍法》第26条对查阅、调取的任务范围和限度作了明文限制。\u003c/p>\n\u003cp>\u003cstrong>4. 协助义务受职责范围限定。\u003c/strong> 部门和地方可依法提供履职中掌握的资料、协调场所和设施、落实人员保护等。协助机关须有相应职责，不能以协助为名自行扩大调查范围；专门机关也不能借协调机制将其无权采取的措施转交他人实施。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>本条体现保障职权与约束职权的统一。\u003c/strong> 安全工作的专业性、隐蔽性和风险，能够说明设置特别措施的必要，却不能替代具体法律授权。法理上的审查顺序应为：法定职权与任务关联、法定条件和程序、必要范围、持续监督及救济。\u003c/p>\n\u003cp>\u003cstrong>协同并不改变责任归属。\u003c/strong> 作出决定的机关对决定合法性负责，执行和协助主体对各自行为负责；依法保密与接受有权机关监督也应并行。将工作秘密解释为免受监督，会使本条与第43条的依法履职要求发生冲突。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>与第77条区别。\u003c/strong> 本条重点是部门、地方对专门工作的组织保障；第77条规定公民和组织的普遍支持协助义务。两者均应与第80—82条的保护、补偿和监督救济合读。\u003c/p>\n\u003cp>\u003cstrong>阅读校正。\u003c/strong> 乙书印214页标引《反间谍法》第37条时仍用了旧法“因侦察间谍行为的需要”的措辞。现行条文以反间谍工作需要为条件，并列规定技术侦察措施和身份保护措施，且均须经过严格批准。教材列举的特别手段只能作为制度提示，不可替代现行法的适用条件。\u003c/p>\n\u003chr>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条连接第42条的专门机关职责与第五章的国家安全保障，规定专门工作可以使用哪些性质的手段，以及其他部门、地方怎样协助。理解时应把握“专门工作”“依法”“必要”“职责范围内”四项限制。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>制度基础。\u003c/strong> 2015年以前，刑事诉讼法、人民警察法及当时的反间谍法等，已经分别规定执法、侦查及有关协助措施。本条将分散的手段保障置于总体国家安全框架之内，但没有将各法的职权统一授予所有安全工作机关。\u003c/p>\n\u003cp>\u003cstrong>后续发展。\u003c/strong> 2023年修订《反间谍法》进一步明确调查处置、技术侦察与身份保护、通行和场所保障等制度，并同时规定批准、出示证件、使用范围和监督要求。研读本条时，应以这些具体规定确定可采取措施的主体、条件与程序。\u003ca href=\"https://www.gjbmj.gov.cn/n1/2023/0802/c409088-40049143.html\">现行《反间谍法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 特定机关履行特定职责。\u003c/strong> 主体为国家安全机关、公安机关和有关军事机关；行为必须属于依法开展的国家安全专门工作。某项事务具有安全意义，并不当然使一般行政机关取得专门侦查权限。\u003c/p>\n\u003cp>\u003cstrong>2. “必要手段和方式”包括一般措施与特别措施。\u003c/strong> 可以从通常执法活动与适应国家安全特殊需要的工作措施两个方面理解。此种分类便于理解，实际适用仍须逐一查明法律依据。搜查、查封、拘留、技术侦察的对象、审批层级和程序不同，不能因为统称“必要手段”而互相替代。\u003c/p>\n\u003cp>\u003cstrong>3. 依法与必要构成双重要求。\u003c/strong> 依法解决有没有权、由谁决定、怎样实施；必要解决措施与具体任务是否相关、范围和强度是否适当。已有具体授权，也不意味着可以把与任务无关的人、财产和信息一并纳入。例如现行《反间谍法》第26条对查阅、调取的任务范围和限度作了明文限制。\u003c/p>\n\u003cp>\u003cstrong>4. 协助义务受职责范围限定。\u003c/strong> 部门和地方可依法提供履职中掌握的资料、协调场所和设施、落实人员保护等。协助机关须有相应职责，不能以协助为名自行扩大调查范围；专门机关也不能借协调机制将其无权采取的措施转交他人实施。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>本条体现保障职权与约束职权的统一。\u003c/strong> 安全工作的专业性、隐蔽性和风险，能够说明设置特别措施的必要，却不能替代具体法律授权。法理上的审查顺序应为：法定职权与任务关联、法定条件和程序、必要范围、持续监督及救济。\u003c/p>\n\u003cp>\u003cstrong>协同并不改变责任归属。\u003c/strong> 作出决定的机关对决定合法性负责，执行和协助主体对各自行为负责；依法保密与接受有权机关监督也应并行。将工作秘密解释为免受监督，会使本条与第43条的依法履职要求发生冲突。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>与第77条区别。\u003c/strong> 本条重点是部门、地方对专门工作的组织保障；第77条规定公民和组织的普遍支持协助义务。两者均应与第80—82条的保护、补偿和监督救济合读。\u003c/p>\n\u003cp>\u003cstrong>阅读校正。\u003c/strong> 乙书印214页标引《反间谍法》第37条时仍用了旧法“因侦察间谍行为的需要”的措辞。现行条文以反间谍工作需要为条件，并列规定技术侦察措施和身份保护措施，且均须经过严格批准。教材列举的特别手段只能作为制度提示，不可替代现行法的适用条件。\u003c/p>\n\u003chr>\n"},{"num":76,"label":"第七十六条","title":"国家安全宣传教育的常态化与制度化","lawText":"国家加强国家安全新闻宣传和舆论引导，通过多种形式开展国家安全宣传教育活动，将国家安全教育纳入国民教育体系和公务员教育培训体系，增强全民国家安全意识。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第七十六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家加强国家安全新闻宣传和舆论引导，通过多种形式开展国家安全宣传教育活动，将国家安全教育纳入国民教育体系和公务员教育培训体系，增强全民国家安全意识。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第七十六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家加强国家安全新闻宣传和舆论引导，通过多种形式开展国家安全宣传教育活动，将国家安全教育纳入国民教育体系和公务员教育培训体系，增强全民国家安全意识。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全宣传教育的常态化与制度化 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条是第五章最后一条，以社会认知和人员能力支撑国家安全制度实施。其结构为新闻宣传和舆论引导、多种形式的宣传教育、纳入两类教育培训体系，最终目标是增强全民国家安全意识。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>2015年的修改直接涉及常态教育。\u003c/strong> 2015年6月30日《关于〈中华人民共和国国家安全法（草案三次审议稿）〉修改意见的报告》第一项记载：原在草案第14条规定的多种形式宣传教育活动，被建议移入第76条；理由是教育应当经常开展，不能局限于全民国家安全教育日。这一修改说明，第14条的特定纪念日与本条的经常性义务各有功能。（甲书印387—388页，PDF400—401页。）\u003c/p>\n\u003cp>\u003cstrong>后续教育制度逐步具体化。\u003c/strong> 教育部于2020年印发《大中小学国家安全教育指导纲要》，明确各学段的教育目标和实施要求；2024年出版《国家安全教育大学生读本》，作为高校国家安全教育公共基础课用书。两项发展均是教育体系中的落实措施，不是对本条文字的修改。\u003ca href=\"https://www.moe.gov.cn/srcsite/A26/s8001/202010/t20201027_496805.html\">教育部通知\u003c/a>、\u003ca href=\"https://qspfw.moe.gov.cn/html/hotnews/20240830/22060.html\">读本出版信息\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 新闻宣传和舆论引导。\u003c/strong> 应准确介绍国家安全形势、法律制度和典型风险，及时回应社会关切。应重视公信力、透明度以及公众知情、参与、表达、监督，使宣传教育具备可靠的事实与制度基础。涉及案件和突发事件的信息，还应遵守发布权限、保密与事实核实要求。\u003c/p>\n\u003cp>\u003cstrong>2. 多种形式的社会教育。\u003c/strong> 教育可进入学校、企业、机关、乡村、社区，结合案例、课程、媒体和实践活动展开。“多种形式”给予组织方式弹性，实质要求是内容准确、针对受众、能够改善认知和行动能力。\u003c/p>\n\u003cp>\u003cstrong>3. 纳入国民教育体系。\u003c/strong> 意味着进入育人目标、课程教材、师资与评价安排，形成不同学段的连续学习。内容应与学生理解能力相适应，既讲国家安全利益，也讲公民义务、权利和合法求助途径，避免单凭恐惧感或记忆口号衡量教育效果。\u003c/p>\n\u003cp>\u003cstrong>4. 纳入公务员教育培训体系。\u003c/strong> 公务员除了认识风险，更须理解本岗位职责、法定权限、协同程序及权利保障。国家安全意识不能等同于扩大职权的意愿；依法识别问题、依法采取措施，同属本条的能力目标。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>教育属于事前预防的制度条件。\u003c/strong> 专门机关无法独自发现全部风险，公众的知识和判断能力能够降低制度实施成本。但风险认知必须与证据意识相结合，正常的国际交往、学术交流、商业合作不能仅凭涉外因素被推定为违法。\u003c/p>\n\u003cp>\u003cstrong>普遍性与差异性应当同时存在。\u003c/strong> 全社会需要共同的法律基础，不同岗位则有不同知识需求。例如普通公民应懂得识别线索和报告途径，涉密岗位还需掌握材料流转要求，公务员须理解履职程序。后者的专门义务不能无条件扩张至所有公众。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>第14、76、78条形成三层安排。\u003c/strong> 第14条提供集中宣传节点；本条确立国家层面的经常性教育体系；第78条把教育和组织防范落实到具体单位。教育日活动完成，并不意味着全年教育义务已经履行。\u003c/p>\n\u003cp>\u003cstrong>内容和评价需要更新。\u003c/strong> 书中反间谍案例可说明防范诱惑与保密的重要性，但国家安全教育还应覆盖相关经济、科技、生态、网络等领域。考查重点可放在受教育者能否说明风险、识别法律边界并作出合法应对；旧版教材列出的干部培训天数也不宜直接作为本条设定的统一时限。\u003c/p>\n\u003chr>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条是第五章最后一条，以社会认知和人员能力支撑国家安全制度实施。其结构为新闻宣传和舆论引导、多种形式的宣传教育、纳入两类教育培训体系，最终目标是增强全民国家安全意识。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>2015年的修改直接涉及常态教育。\u003c/strong> 2015年6月30日《关于〈中华人民共和国国家安全法（草案三次审议稿）〉修改意见的报告》第一项记载：原在草案第14条规定的多种形式宣传教育活动，被建议移入第76条；理由是教育应当经常开展，不能局限于全民国家安全教育日。这一修改说明，第14条的特定纪念日与本条的经常性义务各有功能。（甲书印387—388页，PDF400—401页。）\u003c/p>\n\u003cp>\u003cstrong>后续教育制度逐步具体化。\u003c/strong> 教育部于2020年印发《大中小学国家安全教育指导纲要》，明确各学段的教育目标和实施要求；2024年出版《国家安全教育大学生读本》，作为高校国家安全教育公共基础课用书。两项发展均是教育体系中的落实措施，不是对本条文字的修改。\u003ca href=\"https://www.moe.gov.cn/srcsite/A26/s8001/202010/t20201027_496805.html\">教育部通知\u003c/a>、\u003ca href=\"https://qspfw.moe.gov.cn/html/hotnews/20240830/22060.html\">读本出版信息\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 新闻宣传和舆论引导。\u003c/strong> 应准确介绍国家安全形势、法律制度和典型风险，及时回应社会关切。应重视公信力、透明度以及公众知情、参与、表达、监督，使宣传教育具备可靠的事实与制度基础。涉及案件和突发事件的信息，还应遵守发布权限、保密与事实核实要求。\u003c/p>\n\u003cp>\u003cstrong>2. 多种形式的社会教育。\u003c/strong> 教育可进入学校、企业、机关、乡村、社区，结合案例、课程、媒体和实践活动展开。“多种形式”给予组织方式弹性，实质要求是内容准确、针对受众、能够改善认知和行动能力。\u003c/p>\n\u003cp>\u003cstrong>3. 纳入国民教育体系。\u003c/strong> 意味着进入育人目标、课程教材、师资与评价安排，形成不同学段的连续学习。内容应与学生理解能力相适应，既讲国家安全利益，也讲公民义务、权利和合法求助途径，避免单凭恐惧感或记忆口号衡量教育效果。\u003c/p>\n\u003cp>\u003cstrong>4. 纳入公务员教育培训体系。\u003c/strong> 公务员除了认识风险，更须理解本岗位职责、法定权限、协同程序及权利保障。国家安全意识不能等同于扩大职权的意愿；依法识别问题、依法采取措施，同属本条的能力目标。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>教育属于事前预防的制度条件。\u003c/strong> 专门机关无法独自发现全部风险，公众的知识和判断能力能够降低制度实施成本。但风险认知必须与证据意识相结合，正常的国际交往、学术交流、商业合作不能仅凭涉外因素被推定为违法。\u003c/p>\n\u003cp>\u003cstrong>普遍性与差异性应当同时存在。\u003c/strong> 全社会需要共同的法律基础，不同岗位则有不同知识需求。例如普通公民应懂得识别线索和报告途径，涉密岗位还需掌握材料流转要求，公务员须理解履职程序。后者的专门义务不能无条件扩张至所有公众。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>第14、76、78条形成三层安排。\u003c/strong> 第14条提供集中宣传节点；本条确立国家层面的经常性教育体系；第78条把教育和组织防范落实到具体单位。教育日活动完成，并不意味着全年教育义务已经履行。\u003c/p>\n\u003cp>\u003cstrong>内容和评价需要更新。\u003c/strong> 书中反间谍案例可说明防范诱惑与保密的重要性，但国家安全教育还应覆盖相关经济、科技、生态、网络等领域。考查重点可放在受教育者能否说明风险、识别法律边界并作出合法应对；旧版教材列出的干部培训天数也不宜直接作为本条设定的统一时限。\u003c/p>\n\u003chr>\n"},{"num":77,"label":"第七十七条","title":"公民和组织维护国家安全的一般义务","lawText":"公民和组织应当履行下列维护国家安全的义务：\n\n（一）遵守宪法、法律法规关于国家安全的有关规定；\n\n（二）及时报告危害国家安全活动的线索；\n\n（三）如实提供所知悉的涉及危害国家安全活动的证据；\n\n（四）为国家安全工作提供便利条件或者其他协助；\n\n（五）向国家安全机关、公安机关和有关军事机关提供必要的支持和协助；\n\n（六）保守所知悉的国家秘密；\n\n（七）法律、行政法规规定的其他义务。\n\n任何个人和组织不得有危害国家安全的行为，不得向危害国家安全的个人或者组织提供任何资助或者协助。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第七十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>公民和组织应当履行下列维护国家安全的义务：\u003c/p>\n\u003cp>（一）遵守宪法、法律法规关于国家安全的有关规定；\u003c/p>\n\u003cp>（二）及时报告危害国家安全活动的线索；\u003c/p>\n\u003cp>（三）如实提供所知悉的涉及危害国家安全活动的证据；\u003c/p>\n\u003cp>（四）为国家安全工作提供便利条件或者其他协助；\u003c/p>\n\u003cp>（五）向国家安全机关、公安机关和有关军事机关提供必要的支持和协助；\u003c/p>\n\u003cp>（六）保守所知悉的国家秘密；\u003c/p>\n\u003cp>（七）法律、行政法规规定的其他义务。\u003c/p>\n\u003cp>任何个人和组织不得有危害国家安全的行为，不得向危害国家安全的个人或者组织提供任何资助或者协助。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第七十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>公民和组织应当履行下列维护国家安全的义务：\u003c/p>\n\u003cp>（一）遵守宪法、法律法规关于国家安全的有关规定；\u003c/p>\n\u003cp>（二）及时报告危害国家安全活动的线索；\u003c/p>\n\u003cp>（三）如实提供所知悉的涉及危害国家安全活动的证据；\u003c/p>\n\u003cp>（四）为国家安全工作提供便利条件或者其他协助；\u003c/p>\n\u003cp>（五）向国家安全机关、公安机关和有关军事机关提供必要的支持和协助；\u003c/p>\n\u003cp>（六）保守所知悉的国家秘密；\u003c/p>\n\u003cp>（七）法律、行政法规规定的其他义务。\u003c/p>\n\u003cp>任何个人和组织不得有危害国家安全的行为，不得向危害国家安全的个人或者组织提供任何资助或者协助。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">公民和组织维护国家安全的一般义务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条开启第六章，第一款列举七项义务，第二款规定两项禁止。它将第11条的一般责任转化为守法、报告、举证、协助和保密等行为要求。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>宪法与既有法律基础。\u003c/strong> 宪法第53、54条分别规定保守国家秘密及维护祖国安全、荣誉和利益的义务。1993年国家安全法与2014年反间谍法也已规定相关支持、报告和提供证据义务，2015年本条作了综合规定。\u003c/p>\n\u003cp>\u003cstrong>2015年调整。\u003c/strong> 4月20日草案修改情况汇报第五项建议将原草案第79—81条的义务规定移至权利规定之前，并增加遵守国家安全法律法规和不得危害国家安全的要求。这里的条号属于草案，不能与现行第79—81条对应。（甲书印381页，PDF394页。）\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 报告线索与提供证据不同。\u003c/strong> 线索能够指向待核查的活动，不要求举报人先证明犯罪成立；证据义务则要求如实提供自己知悉的有关材料。应区分亲历事实、转述信息和个人推测，说明来源及不确定之处。报告时应认真区分信息的可靠程度，但不能把所有尚未经核实的信息排除在线索报告之外。\u003c/p>\n\u003cp>\u003cstrong>2. 一般协助与向专门机关协助相互衔接。\u003c/strong> 第四项面向国家安全工作整体，第五项突出向三类专门机关提供必要支持。具体调取材料、使用财物、进入场所，仍应适用有关法律规定的主体、批准和程序条件；不能仅凭概括义务要求任何组织无条件交出全部数据或财产。\u003c/p>\n\u003cp>\u003cstrong>3. 国家秘密具有法定范围。\u003c/strong> 保密义务不限于专门工作人员，但履行义务的对象必须依法识别。2024年修订《保守国家秘密法》第2、4、5条分别涉及国家秘密定义、依法公开事项与普遍保密义务；不能把任何工作信息都视为国家秘密，也不能把国家秘密与依法另受保护的工作秘密、商业秘密混同。\u003ca href=\"https://gdca.miit.gov.cn/zwgk/zcwj/flfg/art/2024/art_4870c40a6f8249389684d03786d41639.html\">2024年修订《保守国家秘密法》\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>4. 兜底义务具有明确法源。\u003c/strong> 第七项指定法律、行政法规，意味着应继续查找具体依据，不能由任意机关或单位凭一句“国家安全需要”无限增设公众义务。\u003c/p>\n\u003cp>\u003cstrong>5. 禁止危害与禁止资助协助。\u003c/strong> 第二款既禁止直接实施危害行为，也禁止为其提供资助、协助。但本条没有直接规定刑罚或处罚幅度，追责须适用相应责任规范并审查主观状态等构成要件。不能将一切交往、交易或不知情帮助自动认定为犯罪。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>义务与权利形成制度配套。\u003c/strong> 公民承担协助义务，国家同时须依法保护其人身安全、补偿依法协助造成的财产损失，并提供监督救济。本条不能脱离第80—82条单独理解。\u003c/p>\n\u003cp>\u003cstrong>参与防范不等于取得执法权。\u003c/strong> 公众发现风险，可以依法报告、保存自己合法持有的相关材料并配合调查；本条没有授权公众搜查他人、强制扣押财物或者公开给他人定罪。专门机关仍负责核查线索、认定事实并依法处理。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>现行法对照。\u003c/strong> 书中引用的旧《反间谍法》第21、22条所涉报告与提供情况义务，在2023年修订后应分别查第16、32条；其中第16条还规定受理举报渠道与举报人保密。\u003ca href=\"https://www.gjbmj.gov.cn/n1/2023/0802/c409088-40049143.html\">现行《反间谍法》\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>事实不成立与恶意举报应当区别。\u003c/strong> 2022年《公民举报危害国家安全行为奖励办法》分别处理奖励条件与故意捏造、诬告等行为。真实表达所知和合理疑点，与故意编造事实不同；核查后未认定违法，并不当然证明举报人违法。\u003ca href=\"https://www.12339.gov.cn/article/h5_law_con/9\">《奖励办法》\u003c/a>\u003c/p>\n\u003chr>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条开启第六章，第一款列举七项义务，第二款规定两项禁止。它将第11条的一般责任转化为守法、报告、举证、协助和保密等行为要求。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>宪法与既有法律基础。\u003c/strong> 宪法第53、54条分别规定保守国家秘密及维护祖国安全、荣誉和利益的义务。1993年国家安全法与2014年反间谍法也已规定相关支持、报告和提供证据义务，2015年本条作了综合规定。\u003c/p>\n\u003cp>\u003cstrong>2015年调整。\u003c/strong> 4月20日草案修改情况汇报第五项建议将原草案第79—81条的义务规定移至权利规定之前，并增加遵守国家安全法律法规和不得危害国家安全的要求。这里的条号属于草案，不能与现行第79—81条对应。（甲书印381页，PDF394页。）\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 报告线索与提供证据不同。\u003c/strong> 线索能够指向待核查的活动，不要求举报人先证明犯罪成立；证据义务则要求如实提供自己知悉的有关材料。应区分亲历事实、转述信息和个人推测，说明来源及不确定之处。报告时应认真区分信息的可靠程度，但不能把所有尚未经核实的信息排除在线索报告之外。\u003c/p>\n\u003cp>\u003cstrong>2. 一般协助与向专门机关协助相互衔接。\u003c/strong> 第四项面向国家安全工作整体，第五项突出向三类专门机关提供必要支持。具体调取材料、使用财物、进入场所，仍应适用有关法律规定的主体、批准和程序条件；不能仅凭概括义务要求任何组织无条件交出全部数据或财产。\u003c/p>\n\u003cp>\u003cstrong>3. 国家秘密具有法定范围。\u003c/strong> 保密义务不限于专门工作人员，但履行义务的对象必须依法识别。2024年修订《保守国家秘密法》第2、4、5条分别涉及国家秘密定义、依法公开事项与普遍保密义务；不能把任何工作信息都视为国家秘密，也不能把国家秘密与依法另受保护的工作秘密、商业秘密混同。\u003ca href=\"https://gdca.miit.gov.cn/zwgk/zcwj/flfg/art/2024/art_4870c40a6f8249389684d03786d41639.html\">2024年修订《保守国家秘密法》\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>4. 兜底义务具有明确法源。\u003c/strong> 第七项指定法律、行政法规，意味着应继续查找具体依据，不能由任意机关或单位凭一句“国家安全需要”无限增设公众义务。\u003c/p>\n\u003cp>\u003cstrong>5. 禁止危害与禁止资助协助。\u003c/strong> 第二款既禁止直接实施危害行为，也禁止为其提供资助、协助。但本条没有直接规定刑罚或处罚幅度，追责须适用相应责任规范并审查主观状态等构成要件。不能将一切交往、交易或不知情帮助自动认定为犯罪。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>义务与权利形成制度配套。\u003c/strong> 公民承担协助义务，国家同时须依法保护其人身安全、补偿依法协助造成的财产损失，并提供监督救济。本条不能脱离第80—82条单独理解。\u003c/p>\n\u003cp>\u003cstrong>参与防范不等于取得执法权。\u003c/strong> 公众发现风险，可以依法报告、保存自己合法持有的相关材料并配合调查；本条没有授权公众搜查他人、强制扣押财物或者公开给他人定罪。专门机关仍负责核查线索、认定事实并依法处理。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>现行法对照。\u003c/strong> 书中引用的旧《反间谍法》第21、22条所涉报告与提供情况义务，在2023年修订后应分别查第16、32条；其中第16条还规定受理举报渠道与举报人保密。\u003ca href=\"https://www.gjbmj.gov.cn/n1/2023/0802/c409088-40049143.html\">现行《反间谍法》\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>事实不成立与恶意举报应当区别。\u003c/strong> 2022年《公民举报危害国家安全行为奖励办法》分别处理奖励条件与故意捏造、诬告等行为。真实表达所知和合理疑点，与故意编造事实不同；核查后未认定违法，并不当然证明举报人违法。\u003ca href=\"https://www.12339.gov.cn/article/h5_law_con/9\">《奖励办法》\u003c/a>\u003c/p>\n\u003chr>\n"},{"num":78,"label":"第七十八条","title":"单位教育、动员与组织防范义务","lawText":"机关、人民团体、企业事业组织和其他社会组织应当对本单位的人员进行维护国家安全的教育，动员、组织本单位的人员防范、制止危害国家安全的行为。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第七十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>机关、人民团体、企业事业组织和其他社会组织应当对本单位的人员进行维护国家安全的教育，动员、组织本单位的人员防范、制止危害国家安全的行为。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第七十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>机关、人民团体、企业事业组织和其他社会组织应当对本单位的人员进行维护国家安全的教育，动员、组织本单位的人员防范、制止危害国家安全的行为。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">单位教育、动员与组织防范义务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条把国家安全教育与防范责任落实到单位这一组织层级，包含教育人员和组织行动两项任务。单位不能仅将维护国家安全视为个人的自觉行为，也不能以举办一次宣传活动代替持续防范。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>存在直接承继关系。\u003c/strong> 1993年《国家安全法》第15条已规定机关、团体和其他组织对本单位人员进行教育、动员和组织防范；2014年《反间谍法》第19条承继其组织方式，并以防范、制止间谍行为为对象。2015年本条面向更广泛的国家安全活动，明确列出人民团体、企业事业组织和其他社会组织。该调整使主体表达更清楚，不宜理解为企业此前一律没有这类义务。\u003ca href=\"https://www.abazhou.gov.cn/abazhou/c109474/202103/dca0b1d4ac144103a0a94345e03f918b.shtml\">1993年国家安全法\u003c/a>、\u003ca href=\"https://gzw.xinjiang.gov.cn/gzw/zcwj/201604/ad0124e234bd4241a230cada5bca14ed.shtml\">2014年反间谍法\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>2023年进一步具体化。\u003c/strong> 修订《反间谍法》第12条明确单位承担反间谍安全防范主体责任，第17—20条规定重点单位的专门防范要求，第56条规定不履行义务的相应处理。这是特定领域的制度发展，不意味着本条的全部内容限于反间谍工作。\u003ca href=\"https://www.gjbmj.gov.cn/n1/2023/0802/c409088-40049143.html\">现行《反间谍法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 义务主体为各类单位。\u003c/strong> 本条直接要求单位履责，包括机关、团体、企事业组织及其他社会组织。单位的负责人、相关职能部门和工作人员承担何种具体责任，还应结合专门法律、岗位职责与合法内部制度确定。\u003c/p>\n\u003cp>\u003cstrong>2. 教育对象是本单位人员。\u003c/strong> 相较第76条面向全民的国家教育安排，本条依托具体组织关系开展教育。工作内容、接触信息、技术条件和业务范围不同，教育重点也应不同；涉密科研岗位与一般服务岗位不宜采用完全相同的风险要求。\u003c/p>\n\u003cp>\u003cstrong>3. 动员与组织强调实施能力。\u003c/strong> 动员着重使人员理解任务、形成参与准备，组织着重明确由谁负责、如何报告、怎样配合及发生问题如何处置。作为落实本条的建议，单位可明确责任岗位、报告渠道、资料管理要求和人员培训安排，并定期检查实际效果；这些建议的具体强度应与行业规范和风险相适应。\u003c/p>\n\u003cp>\u003cstrong>4. 防范与制止覆盖不同阶段。\u003c/strong> 防范着重消除隐患；制止针对已出现的危害行为。单位可在合法管理权限内采取保护资料、停止不当操作、及时报告等措施，但不因此取得侦查、搜查、拘留等公权力。涉及危险或违法犯罪情形，应依法联系有权机关处理。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>组织责任弥补个人能力的局限。\u003c/strong> 单位掌握岗位配置、业务流程和资源条件，更能把分散的个人义务转化为可执行制度。研究重点因此不仅是员工是否接受教育，也包括单位是否提供有效的规则、渠道和必要支持。\u003c/p>\n\u003cp>\u003cstrong>应区分一般单位与重点单位。\u003c/strong> 本条确立广泛基础义务，特别法再按风险和业务性质提高要求。例如反间谍安全防范重点单位承担专门制度、人员和技术防范责任，不能不经法定识别便把全部强化义务普遍套用于所有组织。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>与相邻条文的关系。\u003c/strong> 第77条规定个人和组织的一般义务，本条突出单位对内部人员的教育和组织责任，第79条进一步规定企业事业组织根据国家安全工作要求，配合有关部门采取相关安全措施。三条分别侧重一般义务、内部教育与组织防范、对有关部门的工作配合。\u003c/p>\n\u003cp>\u003cstrong>考核应有合法依据。\u003c/strong> 书中提出将教育与防范纳入考核，属于实施思路。本条没有直接规定单位可任意罚款、处分或解除劳动关系，也未要求工作人员不顾人身安全参与危险处置。制定内部规则仍须遵守劳动、人事等法律制度，避免把本条的教育义务扩张为没有边界的管理权。\u003c/p>\n\u003chr>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条把国家安全教育与防范责任落实到单位这一组织层级，包含教育人员和组织行动两项任务。单位不能仅将维护国家安全视为个人的自觉行为，也不能以举办一次宣传活动代替持续防范。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>存在直接承继关系。\u003c/strong> 1993年《国家安全法》第15条已规定机关、团体和其他组织对本单位人员进行教育、动员和组织防范；2014年《反间谍法》第19条承继其组织方式，并以防范、制止间谍行为为对象。2015年本条面向更广泛的国家安全活动，明确列出人民团体、企业事业组织和其他社会组织。该调整使主体表达更清楚，不宜理解为企业此前一律没有这类义务。\u003ca href=\"https://www.abazhou.gov.cn/abazhou/c109474/202103/dca0b1d4ac144103a0a94345e03f918b.shtml\">1993年国家安全法\u003c/a>、\u003ca href=\"https://gzw.xinjiang.gov.cn/gzw/zcwj/201604/ad0124e234bd4241a230cada5bca14ed.shtml\">2014年反间谍法\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>2023年进一步具体化。\u003c/strong> 修订《反间谍法》第12条明确单位承担反间谍安全防范主体责任，第17—20条规定重点单位的专门防范要求，第56条规定不履行义务的相应处理。这是特定领域的制度发展，不意味着本条的全部内容限于反间谍工作。\u003ca href=\"https://www.gjbmj.gov.cn/n1/2023/0802/c409088-40049143.html\">现行《反间谍法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 义务主体为各类单位。\u003c/strong> 本条直接要求单位履责，包括机关、团体、企事业组织及其他社会组织。单位的负责人、相关职能部门和工作人员承担何种具体责任，还应结合专门法律、岗位职责与合法内部制度确定。\u003c/p>\n\u003cp>\u003cstrong>2. 教育对象是本单位人员。\u003c/strong> 相较第76条面向全民的国家教育安排，本条依托具体组织关系开展教育。工作内容、接触信息、技术条件和业务范围不同，教育重点也应不同；涉密科研岗位与一般服务岗位不宜采用完全相同的风险要求。\u003c/p>\n\u003cp>\u003cstrong>3. 动员与组织强调实施能力。\u003c/strong> 动员着重使人员理解任务、形成参与准备，组织着重明确由谁负责、如何报告、怎样配合及发生问题如何处置。作为落实本条的建议，单位可明确责任岗位、报告渠道、资料管理要求和人员培训安排，并定期检查实际效果；这些建议的具体强度应与行业规范和风险相适应。\u003c/p>\n\u003cp>\u003cstrong>4. 防范与制止覆盖不同阶段。\u003c/strong> 防范着重消除隐患；制止针对已出现的危害行为。单位可在合法管理权限内采取保护资料、停止不当操作、及时报告等措施，但不因此取得侦查、搜查、拘留等公权力。涉及危险或违法犯罪情形，应依法联系有权机关处理。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>组织责任弥补个人能力的局限。\u003c/strong> 单位掌握岗位配置、业务流程和资源条件，更能把分散的个人义务转化为可执行制度。研究重点因此不仅是员工是否接受教育，也包括单位是否提供有效的规则、渠道和必要支持。\u003c/p>\n\u003cp>\u003cstrong>应区分一般单位与重点单位。\u003c/strong> 本条确立广泛基础义务，特别法再按风险和业务性质提高要求。例如反间谍安全防范重点单位承担专门制度、人员和技术防范责任，不能不经法定识别便把全部强化义务普遍套用于所有组织。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>与相邻条文的关系。\u003c/strong> 第77条规定个人和组织的一般义务，本条突出单位对内部人员的教育和组织责任，第79条进一步规定企业事业组织根据国家安全工作要求，配合有关部门采取相关安全措施。三条分别侧重一般义务、内部教育与组织防范、对有关部门的工作配合。\u003c/p>\n\u003cp>\u003cstrong>考核应有合法依据。\u003c/strong> 书中提出将教育与防范纳入考核，属于实施思路。本条没有直接规定单位可任意罚款、处分或解除劳动关系，也未要求工作人员不顾人身安全参与危险处置。制定内部规则仍须遵守劳动、人事等法律制度，避免把本条的教育义务扩张为没有边界的管理权。\u003c/p>\n\u003chr>\n"},{"num":79,"label":"第七十九条","title":"企业事业组织配合采取安全措施的义务","lawText":"企业事业组织根据国家安全工作的要求，应当配合有关部门采取相关安全措施。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第七十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>企业事业组织根据国家安全工作的要求，应当配合有关部门采取相关安全措施。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第七十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>企业事业组织根据国家安全工作的要求，应当配合有关部门采取相关安全措施。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">企业事业组织配合采取安全措施的义务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条针对企业事业组织的业务、设施、技术和管理能力，规定其配合实施安全措施的义务。第78条主要处理单位对内部人员的教育与组织，本条则着重单位与有关部门之间的工作配合。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2015年立法将企业事业组织的配合义务单列，有助于把第11条的一般责任落实到具体工作。其制度背景是网络、基础设施、科研和公共服务等资源广泛分布于企事业单位，维护国家安全需要这些单位参与，不能仅靠机关自身掌握的资源。\u003c/p>\n\u003cp>2015年4月20日草案修改情况汇报提出，将第六章有关公民和组织义务的规定移至权利规定之前；这一调整说明本条的编排背景，但报告没有披露本条逐字修改的完整过程。（甲书印381页，PDF394页。）此后，网络安全、数据安全、反间谍等立法进一步规定特定主体在特定情形下的配合方式。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 主体范围广，具体任务随业务而异。\u003c/strong> 企业的所有制、规模或者事业单位的业务类型，不改变其依法配合的一般要求；但通信企业、高校、物流单位与一般生产企业掌握的资源不同，适用的具体义务也不同。不能把面向某类经营者的特别要求直接推广到全部企业事业组织。\u003c/p>\n\u003cp>\u003cstrong>2. “有关部门”依法定职责确定。\u003c/strong> 既可能涉及国家安全机关、公安机关，也可能涉及依法承担本行业、本领域安全职责的主管部门。判断重点在于请求事项与部门职权的关系，而不是部门名称中是否带有“安全”。提出要求、组织实施和参与协助的主体，应各自承担相应责任。\u003c/p>\n\u003cp>\u003cstrong>3. 配合措施涵盖预防、检查和事件处置。\u003c/strong> 例如依法接受安全监督检查、协助排查系统风险、落实整改、提供与任务有关的资料及技术支持。这些是本条在不同制度中的具体表现；采取何种措施，应继续查找相应领域的法律依据和适用条件。\u003c/p>\n\u003cp>\u003cstrong>4. 技术协助已有更具体的法律规定。\u003c/strong> 现行《网络安全法》第30条规定网络运营者对公安机关、国家安全机关依法维护国家安全和侦查犯罪活动提供技术支持和协助，第51条第二款规定配合依法开展的监督检查。书中所引旧第47—49条，现应分别对照第49—51条；这些条文分别处理违法信息管理、电子信息发送及应用软件提供、投诉举报与监督检查配合，不能混为同一种义务。\u003ca href=\"https://www.cac.gov.cn/2025-12/29/c_1768735112911946.htm\">现行《网络安全法》\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>5. 数据提供须同时落实授权与安全要求。\u003c/strong> 《数据安全法》第35条将公安机关、国家安全机关调取数据与严格批准、依法进行相联系，并规定有关组织、个人应予配合。企业可通过明确负责人员、核对依法应当出示的材料、准确确定交付范围和保密传输等方式履行义务；这些内部安排应服务于及时合法配合。接收机关也负有法定的数据安全与保密责任。\u003ca href=\"https://www.cac.gov.cn/2021-06/11/c_1624994566919140.htm\">《数据安全法》第35、38、39条\u003c/a>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>本条体现公共安全职责与社会专业能力的结合。\u003c/strong> 国家承担组织、决策和依法处置的职责，企事业单位提供其所掌握的专业知识、设施和业务支持。配合可以提高工作能力，但并不把行政强制或侦查权转交给企业，也不消除有关机关的法律责任。\u003c/p>\n\u003cp>\u003cstrong>义务的强制性与履行的合法性应同时把握。\u003c/strong> 书中强调积极配合，意在说明法定义务不能任意推辞。将这一点放回第7、43、83条的体系中理解，配合仍须针对合法职责、合法措施和必要范围；“必须配合”不能用来替代具体措施的授权与程序。相应地，企业自身的数据、个人信息等保护义务，也应与依法协助的要求协调落实。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中以2022年西北工业大学网络攻击事件为例。国家计算机病毒应急处理中心发布的调查报告记载，该中心与360公司组成技术团队参与技术分析。对本条而言，其研读价值在于说明学校、专业机构和企业可以通过各自能力共同支持调查与防护；技术协作本身不能替代对具体措施权限、证据和程序的审查。\u003ca href=\"https://www.cverc.org.cn/head/zhaiyao/news20220905-NPU.htm\">调查报告原文\u003c/a>\u003c/p>\n\u003cp>第12条的表彰奖励可以激励突出贡献，但依法配合的义务并不以先行获得奖励为条件。协助中出现人员安全危险或者财产损失，则分别与第80、81条衔接；拒不履行义务的责任，应结合第13条及相关专门法判断，本条没有独立规定罚款或刑罚。\u003c/p>\n\u003chr>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条针对企业事业组织的业务、设施、技术和管理能力，规定其配合实施安全措施的义务。第78条主要处理单位对内部人员的教育与组织，本条则着重单位与有关部门之间的工作配合。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2015年立法将企业事业组织的配合义务单列，有助于把第11条的一般责任落实到具体工作。其制度背景是网络、基础设施、科研和公共服务等资源广泛分布于企事业单位，维护国家安全需要这些单位参与，不能仅靠机关自身掌握的资源。\u003c/p>\n\u003cp>2015年4月20日草案修改情况汇报提出，将第六章有关公民和组织义务的规定移至权利规定之前；这一调整说明本条的编排背景，但报告没有披露本条逐字修改的完整过程。（甲书印381页，PDF394页。）此后，网络安全、数据安全、反间谍等立法进一步规定特定主体在特定情形下的配合方式。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 主体范围广，具体任务随业务而异。\u003c/strong> 企业的所有制、规模或者事业单位的业务类型，不改变其依法配合的一般要求；但通信企业、高校、物流单位与一般生产企业掌握的资源不同，适用的具体义务也不同。不能把面向某类经营者的特别要求直接推广到全部企业事业组织。\u003c/p>\n\u003cp>\u003cstrong>2. “有关部门”依法定职责确定。\u003c/strong> 既可能涉及国家安全机关、公安机关，也可能涉及依法承担本行业、本领域安全职责的主管部门。判断重点在于请求事项与部门职权的关系，而不是部门名称中是否带有“安全”。提出要求、组织实施和参与协助的主体，应各自承担相应责任。\u003c/p>\n\u003cp>\u003cstrong>3. 配合措施涵盖预防、检查和事件处置。\u003c/strong> 例如依法接受安全监督检查、协助排查系统风险、落实整改、提供与任务有关的资料及技术支持。这些是本条在不同制度中的具体表现；采取何种措施，应继续查找相应领域的法律依据和适用条件。\u003c/p>\n\u003cp>\u003cstrong>4. 技术协助已有更具体的法律规定。\u003c/strong> 现行《网络安全法》第30条规定网络运营者对公安机关、国家安全机关依法维护国家安全和侦查犯罪活动提供技术支持和协助，第51条第二款规定配合依法开展的监督检查。书中所引旧第47—49条，现应分别对照第49—51条；这些条文分别处理违法信息管理、电子信息发送及应用软件提供、投诉举报与监督检查配合，不能混为同一种义务。\u003ca href=\"https://www.cac.gov.cn/2025-12/29/c_1768735112911946.htm\">现行《网络安全法》\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>5. 数据提供须同时落实授权与安全要求。\u003c/strong> 《数据安全法》第35条将公安机关、国家安全机关调取数据与严格批准、依法进行相联系，并规定有关组织、个人应予配合。企业可通过明确负责人员、核对依法应当出示的材料、准确确定交付范围和保密传输等方式履行义务；这些内部安排应服务于及时合法配合。接收机关也负有法定的数据安全与保密责任。\u003ca href=\"https://www.cac.gov.cn/2021-06/11/c_1624994566919140.htm\">《数据安全法》第35、38、39条\u003c/a>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>本条体现公共安全职责与社会专业能力的结合。\u003c/strong> 国家承担组织、决策和依法处置的职责，企事业单位提供其所掌握的专业知识、设施和业务支持。配合可以提高工作能力，但并不把行政强制或侦查权转交给企业，也不消除有关机关的法律责任。\u003c/p>\n\u003cp>\u003cstrong>义务的强制性与履行的合法性应同时把握。\u003c/strong> 书中强调积极配合，意在说明法定义务不能任意推辞。将这一点放回第7、43、83条的体系中理解，配合仍须针对合法职责、合法措施和必要范围；“必须配合”不能用来替代具体措施的授权与程序。相应地，企业自身的数据、个人信息等保护义务，也应与依法协助的要求协调落实。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中以2022年西北工业大学网络攻击事件为例。国家计算机病毒应急处理中心发布的调查报告记载，该中心与360公司组成技术团队参与技术分析。对本条而言，其研读价值在于说明学校、专业机构和企业可以通过各自能力共同支持调查与防护；技术协作本身不能替代对具体措施权限、证据和程序的审查。\u003ca href=\"https://www.cverc.org.cn/head/zhaiyao/news20220905-NPU.htm\">调查报告原文\u003c/a>\u003c/p>\n\u003cp>第12条的表彰奖励可以激励突出贡献，但依法配合的义务并不以先行获得奖励为条件。协助中出现人员安全危险或者财产损失，则分别与第80、81条衔接；拒不履行义务的责任，应结合第13条及相关专门法判断，本条没有独立规定罚款或刑罚。\u003c/p>\n\u003chr>\n"},{"num":80,"label":"第八十条","title":"支持协助行为的法律保护与人身安全保护","lawText":"公民和组织支持、协助国家安全工作的行为受法律保护。\n\n因支持、协助国家安全工作，本人或者其近亲属的人身安全面临危险的，可以向公安机关、国家安全机关请求予以保护。公安机关、国家安全机关应当会同有关部门依法采取保护措施。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第八十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>公民和组织支持、协助国家安全工作的行为受法律保护。\u003c/p>\n\u003cp>因支持、协助国家安全工作，本人或者其近亲属的人身安全面临危险的，可以向公安机关、国家安全机关请求予以保护。公安机关、国家安全机关应当会同有关部门依法采取保护措施。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第八十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>公民和组织支持、协助国家安全工作的行为受法律保护。\u003c/p>\n\u003cp>因支持、协助国家安全工作，本人或者其近亲属的人身安全面临危险的，可以向公安机关、国家安全机关请求予以保护。公安机关、国家安全机关应当会同有关部门依法采取保护措施。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">支持协助行为的法律保护与人身安全保护 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>第一款确立支持、协助行为受法律保护的一般原则；第二款围绕协助所引发的人身危险，规定请求保护的权利和有关机关采取措施的义务。其核心是让依法参与维护国家安全的人得到实际保护。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>既有制度已经包含保护协助者的要求。1993年《国家安全法》第5条规定国家给予保护，第22条第二款禁止对协助或者依法检举、控告的公民和组织压制、打击报复。2014年《反间谍法》第7条保留支持协助者保护，第20条第二款进一步规定本人或近亲属面临危险时请求保护的机制。\u003ca href=\"https://www.abazhou.gov.cn/abazhou/c109474/202103/dca0b1d4ac144103a0a94345e03f918b.shtml\">1993年国家安全法文本\u003c/a>、\u003ca href=\"https://qspfw.moe.gov.cn/html/aqjyr19/chapters_fjd_secrets.html\">2014年反间谍法文本\u003c/a>\u003c/p>\n\u003cp>2015年本条将保护安排纳入总体国家安全框架，并列公安机关、国家安全机关作为请求保护的对象。2023年修订《反间谍法》第46条又对依法执行或协助执行反间谍任务的有关人员及近亲属规定保护、营救等要求。后法发展是特定领域的具体化，不能把本条的一般保护范围缩小为仅限反间谍工作。\u003ca href=\"https://paper.people.com.cn/rmrb/html/2023-04/27/nw.D110000renmrb_20230427_1-15.htm\">2023年《反间谍法》第46条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 受保护的支持协助行为具有多种形式。\u003c/strong> 包括依法报告线索、提供证据、给予技术支持、提供便利以及配合依法采取措施。既包括依本法履行义务，也包括依据其他相关法律给予支持。保护并不以先获得表彰、奖励或者有关案件最终定罪为一般前提。\u003c/p>\n\u003cp>\u003cstrong>2. 危险须与支持协助存在联系。\u003c/strong> 第二款要求“因支持、协助”而面临危险，主要涉及威胁、胁迫、报复等现实风险。应结合所承担任务、威胁内容和相关事实进行判断；保护具有预防功能，无须等待伤害实际发生后才启动。\u003c/p>\n\u003cp>\u003cstrong>3. 保护范围延伸至近亲属。\u003c/strong> 对亲属施压可能直接妨碍公民履行协助义务，因而只保护协助者本人并不充分。本法没有单独定义近亲属；书中借用刑事诉讼法说明其范围，是理解上的参照。进入刑事诉讼程序时，应按现行第108条第六项理解，即夫、妻、父、母、子、女、同胞兄弟姊妹；书中旧第106条的条号须更新。不能未经分析，就把一个部门法的定义当成所有保护制度的统一定义。\u003ca href=\"https://www.spp.gov.cn/spp/zdgz/201810/t20181027_396818.shtml\">现行《刑事诉讼法》\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>4. 请求权对应机关的保护义务。\u003c/strong> “可以请求”表示权利人可以提出保护要求，“应当”则要求有关机关依法处理、判断风险并落实措施。会同有关部门，旨在协调住所、工作、医疗等可能涉及的支持事项，而不是以参与部门较多为由搁置保护。本条未设统一办理期限，办理时应结合危险的紧迫程度及适用程序，及时落实必要保护。\u003c/p>\n\u003cp>\u003cstrong>5. 措施应与风险、程序阶段相适应。\u003c/strong> 身份信息保密、避免暴露作证者外貌与声音、限制特定人员接触、专门人身与住所保护等，在有关法律中已有安排。具体采用哪一种或哪几种，应适用相应制度；涉及变更身份、重新安置等特别措施，更须查明专门依据。现行《刑事诉讼法》第63条规定证人及近亲属的一般安全保障，第64条规定特定案件中的具体保护措施，二者应结合阅读。\u003ca href=\"https://www.spp.gov.cn/spp/zdgz/201810/t20181027_396818.shtml\">《刑事诉讼法》第63、64条\u003c/a>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>国家保护义务是社会参与机制的必要组成。\u003c/strong> 当公民为公共安全提供协助而承受特殊危险，国家应以组织和资源能力回应这种风险。有效保护既维护个人权利，也使报告线索、提供证据和配合调查的制度能够持续运行。\u003c/p>\n\u003cp>\u003cstrong>人身保护与程序公正需要共同实现。\u003c/strong> 对证人隐藏外貌、声音，可以降低被识别、报复的风险；证言是否真实可靠，仍需依证据规则审查。保护身份不等于免除质证，更不能把受到保护本身作为证言必然可信的理由。书中“隐身”作证室的实例，宜用于理解这种技术保护与诉讼程序的衔接。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>申请保护并非唯一启动方式。\u003c/strong> 2022年《公民举报危害国家安全行为奖励办法》第6条不仅要求对举报人身份保密、依法处理保护请求，还要求国家安全机关在认为必要时依职权及时、主动采取保护措施。因此，不能把本条理解为任何情况下都须等待本人先申请。\u003ca href=\"https://www.12339.gov.cn/article/h5_law_con/9\">《奖励办法》第6条\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>保护、补偿、奖励各有条件。\u003c/strong> 本条着重保护合法支持协助行为及应对人身危险；第81条处理由协助导致的财产损失、人身伤亡，第12条处理突出贡献奖励。保护机制不使恶意诬告或其他违法行为取得豁免，但举报经核查未能证实，也不当然等于恶意诬告。是否采取保护措施，应围绕行为性质和实际危险依法判断。\u003c/p>\n\u003chr>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>第一款确立支持、协助行为受法律保护的一般原则；第二款围绕协助所引发的人身危险，规定请求保护的权利和有关机关采取措施的义务。其核心是让依法参与维护国家安全的人得到实际保护。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>既有制度已经包含保护协助者的要求。1993年《国家安全法》第5条规定国家给予保护，第22条第二款禁止对协助或者依法检举、控告的公民和组织压制、打击报复。2014年《反间谍法》第7条保留支持协助者保护，第20条第二款进一步规定本人或近亲属面临危险时请求保护的机制。\u003ca href=\"https://www.abazhou.gov.cn/abazhou/c109474/202103/dca0b1d4ac144103a0a94345e03f918b.shtml\">1993年国家安全法文本\u003c/a>、\u003ca href=\"https://qspfw.moe.gov.cn/html/aqjyr19/chapters_fjd_secrets.html\">2014年反间谍法文本\u003c/a>\u003c/p>\n\u003cp>2015年本条将保护安排纳入总体国家安全框架，并列公安机关、国家安全机关作为请求保护的对象。2023年修订《反间谍法》第46条又对依法执行或协助执行反间谍任务的有关人员及近亲属规定保护、营救等要求。后法发展是特定领域的具体化，不能把本条的一般保护范围缩小为仅限反间谍工作。\u003ca href=\"https://paper.people.com.cn/rmrb/html/2023-04/27/nw.D110000renmrb_20230427_1-15.htm\">2023年《反间谍法》第46条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 受保护的支持协助行为具有多种形式。\u003c/strong> 包括依法报告线索、提供证据、给予技术支持、提供便利以及配合依法采取措施。既包括依本法履行义务，也包括依据其他相关法律给予支持。保护并不以先获得表彰、奖励或者有关案件最终定罪为一般前提。\u003c/p>\n\u003cp>\u003cstrong>2. 危险须与支持协助存在联系。\u003c/strong> 第二款要求“因支持、协助”而面临危险，主要涉及威胁、胁迫、报复等现实风险。应结合所承担任务、威胁内容和相关事实进行判断；保护具有预防功能，无须等待伤害实际发生后才启动。\u003c/p>\n\u003cp>\u003cstrong>3. 保护范围延伸至近亲属。\u003c/strong> 对亲属施压可能直接妨碍公民履行协助义务，因而只保护协助者本人并不充分。本法没有单独定义近亲属；书中借用刑事诉讼法说明其范围，是理解上的参照。进入刑事诉讼程序时，应按现行第108条第六项理解，即夫、妻、父、母、子、女、同胞兄弟姊妹；书中旧第106条的条号须更新。不能未经分析，就把一个部门法的定义当成所有保护制度的统一定义。\u003ca href=\"https://www.spp.gov.cn/spp/zdgz/201810/t20181027_396818.shtml\">现行《刑事诉讼法》\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>4. 请求权对应机关的保护义务。\u003c/strong> “可以请求”表示权利人可以提出保护要求，“应当”则要求有关机关依法处理、判断风险并落实措施。会同有关部门，旨在协调住所、工作、医疗等可能涉及的支持事项，而不是以参与部门较多为由搁置保护。本条未设统一办理期限，办理时应结合危险的紧迫程度及适用程序，及时落实必要保护。\u003c/p>\n\u003cp>\u003cstrong>5. 措施应与风险、程序阶段相适应。\u003c/strong> 身份信息保密、避免暴露作证者外貌与声音、限制特定人员接触、专门人身与住所保护等，在有关法律中已有安排。具体采用哪一种或哪几种，应适用相应制度；涉及变更身份、重新安置等特别措施，更须查明专门依据。现行《刑事诉讼法》第63条规定证人及近亲属的一般安全保障，第64条规定特定案件中的具体保护措施，二者应结合阅读。\u003ca href=\"https://www.spp.gov.cn/spp/zdgz/201810/t20181027_396818.shtml\">《刑事诉讼法》第63、64条\u003c/a>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>国家保护义务是社会参与机制的必要组成。\u003c/strong> 当公民为公共安全提供协助而承受特殊危险，国家应以组织和资源能力回应这种风险。有效保护既维护个人权利，也使报告线索、提供证据和配合调查的制度能够持续运行。\u003c/p>\n\u003cp>\u003cstrong>人身保护与程序公正需要共同实现。\u003c/strong> 对证人隐藏外貌、声音，可以降低被识别、报复的风险；证言是否真实可靠，仍需依证据规则审查。保护身份不等于免除质证，更不能把受到保护本身作为证言必然可信的理由。书中“隐身”作证室的实例，宜用于理解这种技术保护与诉讼程序的衔接。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>申请保护并非唯一启动方式。\u003c/strong> 2022年《公民举报危害国家安全行为奖励办法》第6条不仅要求对举报人身份保密、依法处理保护请求，还要求国家安全机关在认为必要时依职权及时、主动采取保护措施。因此，不能把本条理解为任何情况下都须等待本人先申请。\u003ca href=\"https://www.12339.gov.cn/article/h5_law_con/9\">《奖励办法》第6条\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>保护、补偿、奖励各有条件。\u003c/strong> 本条着重保护合法支持协助行为及应对人身危险；第81条处理由协助导致的财产损失、人身伤亡，第12条处理突出贡献奖励。保护机制不使恶意诬告或其他违法行为取得豁免，但举报经核查未能证实，也不当然等于恶意诬告。是否采取保护措施，应围绕行为性质和实际危险依法判断。\u003c/p>\n\u003chr>\n"},{"num":81,"label":"第八十一条","title":"支持协助工作所致损失的补偿与抚恤优待","lawText":"公民和组织因支持、协助国家安全工作导致财产损失的，按照国家有关规定给予补偿；造成人身伤害或者死亡的，按照国家有关规定给予抚恤优待。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第八十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>公民和组织因支持、协助国家安全工作导致财产损失的，按照国家有关规定给予补偿；造成人身伤害或者死亡的，按照国家有关规定给予抚恤优待。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第八十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>公民和组织因支持、协助国家安全工作导致财产损失的，按照国家有关规定给予补偿；造成人身伤害或者死亡的，按照国家有关规定给予抚恤优待。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">支持协助工作所致损失的补偿与抚恤优待 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条承接第80条，处理支持、协助国家安全工作已经产生损失或伤亡时的保障问题。前半句对应财产损失，后半句对应人身伤害、死亡；两者都以“按照国家有关规定”为衔接，需要结合具体领域的制度确定办理机关、条件、项目和标准。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条立法前，警察履职协助、国防动员、反间谍以及应急救援等制度中，已经存在返还财物、补偿损失和抚恤伤亡人员的规定。2015年立法将分散安排概括为国家安全领域的一般保障，明确普通公民和组织也可以因支持协助而获得相应保障，并不限于专门机关工作人员。2014年12月22日草案说明第六项已明确提出协助所致财产损失和人身伤亡的补偿、抚恤权利。（甲书印377页，PDF390页。）\u003c/p>\n\u003cp>其后，2017年制定、2018年修正的《国家情报法》第25条，对支持、协助和配合情报工作造成的财产损失、伤残及牺牲死亡作出对应规定；2023年修订《反间谍法》第44、46、48条分别处理财物使用或征用、协助所致财产损失以及有关人员的抚恤优待。它们是本条在特定领域的落实，适用条件须依各法分别判断。\u003ca href=\"https://qhca.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_a97c92189dea4940bf0ec7739d89026c.html\">《国家情报法》第25条\u003c/a>、\u003ca href=\"https://paper.people.com.cn/rmrb/html/2023-04/27/nw.D110000renmrb_20230427_1-15.htm\">《反间谍法》第44、46、48条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 支持协助与损害之间须有相应因果联系。\u003c/strong> 本条要求损失或伤亡因支持、协助国家安全工作而发生。认定时应查明实际协助行为、任务经过、受损财物或受伤情况及其联系；仅仅与安全工作发生在同一时间、地点，并不足以说明损失属于本条范围。支持协助可以表现为提供资料、技术、场所、交通工具或其他依法参与的活动。\u003c/p>\n\u003cp>\u003cstrong>2. 财产保障不以发生征收、征用为唯一前提。\u003c/strong> 依法征用财产是典型情形，但本条表述还涵盖其他支持协助所致财产损失。财物原有状态、实际使用情况、损坏原因和修复支出等，是判断损失的相关事实。具体补偿是否包括停用期间的损失、按何种价格计算，应查相应规定；本条没有统一确定所有项目和计算公式。\u003c/p>\n\u003cp>\u003cstrong>3. 返还、恢复原状、支付费用与损失补偿应分别核算。\u003c/strong> 例如《反间谍法》第44条要求任务完成后及时归还或者恢复原状，并按规定支付相应费用，造成损失的还应补偿。财物可以返还，不代表已经弥补使用期间发生的全部法定损失；支付了使用费用，也不当然等于已处理额外损坏。但同一损失项目是否可以重复领取，应依适用制度核定。\u003c/p>\n\u003cp>\u003cstrong>4. 抚恤与优待兼顾本人和符合条件的遗属。\u003c/strong> 抚恤主要回应伤残、牺牲或死亡造成的生活保障需要；优待还可能涉及医疗、教育、就业、住房等安排。人身伤害、伤残等级、死亡性质及遗属资格，需要根据具体制度认定。本条不把“先被评定为烈士”作为一切抚恤优待的前提；烈士评定是另有条件和程序的制度。\u003c/p>\n\u003cp>\u003cstrong>5. 一般保障通过具体制度办理。\u003c/strong> 2025年修订、同年10月1日起施行的《伤残抚恤管理办法》，已采用退役军人工作主管部门的职责安排，并对适用人员、评残程序和待遇发放作出规定。其第2条还处理部分社会人员伤残抚恤与工伤认定的衔接。书中2013年版本关于主管部门和发放起算的表述，不能直接作为现行办理依据。\u003ca href=\"https://www.mva.gov.cn/gongkai/zfxxgkpt/zhengce/guizhang/202507/t20250724_504742.html\">现行《伤残抚恤管理办法》\u003c/a>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>本条体现公共负担的合理分担。\u003c/strong> 公民和组织为维护共同安全承担协助义务，如果由少数参与者独自承受由此产生的特殊损失，义务与保障就会失衡。补偿和抚恤使相应公共成本依制度分担，也为持续参与提供保障。因此，它们具有权利保障性质，不能仅当作事后慰问或自愿救助。\u003c/p>\n\u003cp>\u003cstrong>补偿与国家赔偿应作具体区分。\u003c/strong> 补偿通常回应依法开展公共事务或提供协助造成的特别损失，不以先认定机关违法为前提；国家赔偿则按《国家赔偿法》规定的侵权情形、范围和程序成立。该法第2条没有将“工作人员有主观过错”作为一切赔偿请求的统一要件，刑事赔偿也有专门构成。因而不宜把两者简单化为“无过错给补偿、有过错给赔偿”，或把依法应赔偿的侵权损害改称补偿。\u003ca href=\"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5211800/content.html\">《国家赔偿法》第2、3、4、17条\u003c/a>\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>补偿、抚恤和奖励的目的不同。\u003c/strong> 第12条奖励突出贡献，本条保障因协助受到损害的人；未达到奖励条件，不等于没有补偿、抚恤权利。第80条的人身保护则着重防止危险转化为现实损害，不能以以后可以抚恤为由替代当下必要的保护。\u003c/p>\n\u003cp>书中董某烈属住房案例，实质是已经落实的住房优待如何得到民事司法保护：安置房被他人占用后，当事人通过排除妨害纠纷处理居住权益。它说明优待还需要后续权利保护，不宜将其当作法院直接依据本条核定国家安全协助损失的案例。\u003ca href=\"https://www.court.gov.cn/zixun/xiangqing/382301.html\">最高人民法院典型案例十\u003c/a>\u003c/p>\n\u003cp>落实本条时，可按“协助事实—损害及因果关系—适用制度—受理机关与证明材料—项目和标准—异议救济”整理材料。这是阅读和办理的分析顺序，不是本条自行设立的一套统一申请程序。\u003c/p>\n\u003chr>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条承接第80条，处理支持、协助国家安全工作已经产生损失或伤亡时的保障问题。前半句对应财产损失，后半句对应人身伤害、死亡；两者都以“按照国家有关规定”为衔接，需要结合具体领域的制度确定办理机关、条件、项目和标准。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条立法前，警察履职协助、国防动员、反间谍以及应急救援等制度中，已经存在返还财物、补偿损失和抚恤伤亡人员的规定。2015年立法将分散安排概括为国家安全领域的一般保障，明确普通公民和组织也可以因支持协助而获得相应保障，并不限于专门机关工作人员。2014年12月22日草案说明第六项已明确提出协助所致财产损失和人身伤亡的补偿、抚恤权利。（甲书印377页，PDF390页。）\u003c/p>\n\u003cp>其后，2017年制定、2018年修正的《国家情报法》第25条，对支持、协助和配合情报工作造成的财产损失、伤残及牺牲死亡作出对应规定；2023年修订《反间谍法》第44、46、48条分别处理财物使用或征用、协助所致财产损失以及有关人员的抚恤优待。它们是本条在特定领域的落实，适用条件须依各法分别判断。\u003ca href=\"https://qhca.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_a97c92189dea4940bf0ec7739d89026c.html\">《国家情报法》第25条\u003c/a>、\u003ca href=\"https://paper.people.com.cn/rmrb/html/2023-04/27/nw.D110000renmrb_20230427_1-15.htm\">《反间谍法》第44、46、48条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 支持协助与损害之间须有相应因果联系。\u003c/strong> 本条要求损失或伤亡因支持、协助国家安全工作而发生。认定时应查明实际协助行为、任务经过、受损财物或受伤情况及其联系；仅仅与安全工作发生在同一时间、地点，并不足以说明损失属于本条范围。支持协助可以表现为提供资料、技术、场所、交通工具或其他依法参与的活动。\u003c/p>\n\u003cp>\u003cstrong>2. 财产保障不以发生征收、征用为唯一前提。\u003c/strong> 依法征用财产是典型情形，但本条表述还涵盖其他支持协助所致财产损失。财物原有状态、实际使用情况、损坏原因和修复支出等，是判断损失的相关事实。具体补偿是否包括停用期间的损失、按何种价格计算，应查相应规定；本条没有统一确定所有项目和计算公式。\u003c/p>\n\u003cp>\u003cstrong>3. 返还、恢复原状、支付费用与损失补偿应分别核算。\u003c/strong> 例如《反间谍法》第44条要求任务完成后及时归还或者恢复原状，并按规定支付相应费用，造成损失的还应补偿。财物可以返还，不代表已经弥补使用期间发生的全部法定损失；支付了使用费用，也不当然等于已处理额外损坏。但同一损失项目是否可以重复领取，应依适用制度核定。\u003c/p>\n\u003cp>\u003cstrong>4. 抚恤与优待兼顾本人和符合条件的遗属。\u003c/strong> 抚恤主要回应伤残、牺牲或死亡造成的生活保障需要；优待还可能涉及医疗、教育、就业、住房等安排。人身伤害、伤残等级、死亡性质及遗属资格，需要根据具体制度认定。本条不把“先被评定为烈士”作为一切抚恤优待的前提；烈士评定是另有条件和程序的制度。\u003c/p>\n\u003cp>\u003cstrong>5. 一般保障通过具体制度办理。\u003c/strong> 2025年修订、同年10月1日起施行的《伤残抚恤管理办法》，已采用退役军人工作主管部门的职责安排，并对适用人员、评残程序和待遇发放作出规定。其第2条还处理部分社会人员伤残抚恤与工伤认定的衔接。书中2013年版本关于主管部门和发放起算的表述，不能直接作为现行办理依据。\u003ca href=\"https://www.mva.gov.cn/gongkai/zfxxgkpt/zhengce/guizhang/202507/t20250724_504742.html\">现行《伤残抚恤管理办法》\u003c/a>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>本条体现公共负担的合理分担。\u003c/strong> 公民和组织为维护共同安全承担协助义务，如果由少数参与者独自承受由此产生的特殊损失，义务与保障就会失衡。补偿和抚恤使相应公共成本依制度分担，也为持续参与提供保障。因此，它们具有权利保障性质，不能仅当作事后慰问或自愿救助。\u003c/p>\n\u003cp>\u003cstrong>补偿与国家赔偿应作具体区分。\u003c/strong> 补偿通常回应依法开展公共事务或提供协助造成的特别损失，不以先认定机关违法为前提；国家赔偿则按《国家赔偿法》规定的侵权情形、范围和程序成立。该法第2条没有将“工作人员有主观过错”作为一切赔偿请求的统一要件，刑事赔偿也有专门构成。因而不宜把两者简单化为“无过错给补偿、有过错给赔偿”，或把依法应赔偿的侵权损害改称补偿。\u003ca href=\"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5211800/content.html\">《国家赔偿法》第2、3、4、17条\u003c/a>\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>补偿、抚恤和奖励的目的不同。\u003c/strong> 第12条奖励突出贡献，本条保障因协助受到损害的人；未达到奖励条件，不等于没有补偿、抚恤权利。第80条的人身保护则着重防止危险转化为现实损害，不能以以后可以抚恤为由替代当下必要的保护。\u003c/p>\n\u003cp>书中董某烈属住房案例，实质是已经落实的住房优待如何得到民事司法保护：安置房被他人占用后，当事人通过排除妨害纠纷处理居住权益。它说明优待还需要后续权利保护，不宜将其当作法院直接依据本条核定国家安全协助损失的案例。\u003ca href=\"https://www.court.gov.cn/zixun/xiangqing/382301.html\">最高人民法院典型案例十\u003c/a>\u003c/p>\n\u003cp>落实本条时，可按“协助事实—损害及因果关系—适用制度—受理机关与证明材料—项目和标准—异议救济”整理材料。这是阅读和办理的分析顺序，不是本条自行设立的一套统一申请程序。\u003c/p>\n\u003chr>\n"},{"num":82,"label":"第八十二条","title":"批评建议与申诉、控告、检举的权利","lawText":"公民和组织对国家安全工作有向国家机关提出批评建议的权利，对国家机关及其工作人员在国家安全工作中的违法失职行为有提出申诉、控告和检举的权利。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第八十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>公民和组织对国家安全工作有向国家机关提出批评建议的权利，对国家机关及其工作人员在国家安全工作中的违法失职行为有提出申诉、控告和检举的权利。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第八十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>公民和组织对国家安全工作有向国家机关提出批评建议的权利，对国家机关及其工作人员在国家安全工作中的违法失职行为有提出申诉、控告和检举的权利。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">批评建议与申诉、控告、检举的权利 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条保障公民和组织参与监督国家安全工作。前一层是对工作的批评和建议，后一层是针对违法失职行为的申诉、控告和检举。二者对象和功能不同，不能把所有意见都要求为已经查明的违法事实。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>宪法第41条是本条的重要依据，规定公民提出批评建议、申诉控告检举的权利，要求有关国家机关查清事实、负责处理，并禁止压制和打击报复。2014年12月22日草案说明已列出这些监督权利，2015年本条将其落实到国家安全工作领域，并明确“公民和组织”均为权利主体。（甲书印377页，PDF390页。）\u003ca href=\"https://zygjjg.12388.gov.cn/html/law/1.html\">《宪法》第41条\u003c/a>\u003c/p>\n\u003cp>1993年《国家安全法》第22条、2014年《反间谍法》第26条已规定对国家安全机关及其工作人员的监督和反报复保护。2015年本条面向国家安全工作中的国家机关及其工作人员，范围并不限于国家安全机关本身。2023年修订《反间谍法》第52条继续具体规定受理、处理结果告知和禁止报复，并明确列出上级国家安全机关、监察机关、人民检察院等有关部门。\u003ca href=\"https://paper.people.com.cn/rmrb/html/2023-04/27/nw.D110000renmrb_20230427_1-15.htm\">现行《反间谍法》第52条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 批评建议不以违法失职为前提。\u003c/strong> 工作方式不够妥当、效率偏低、协同不足、告知不清等，都可以成为提出意见的内容。批评侧重指出缺点和问题，建议侧重提出改进办法。即使有关措施尚不能认定违法，公众也可以对其实施效果和改进方向提出意见。\u003c/p>\n\u003cp>\u003cstrong>2. 申诉、控告和检举各有侧重。\u003c/strong> 申诉通常表达对涉及自身权益的处理、裁判或有关不公正待遇的不服，并依适用程序请求复查、纠正；控告侧重指明侵权或其他违法失职行为，请求有权机关处理；检举侧重揭发所知悉的违法失职线索，不限于直接受害人。具体名称、资格和受理条件须结合相应程序法，不能仅凭材料标题决定其性质。\u003c/p>\n\u003cp>\u003cstrong>3. “违法失职”是提出问题的对象，而非要求先有认定结论。\u003c/strong> 申诉人、控告人或检举人应说明事实、理由和相关线索；是否构成违法失职，由有权机关依法审查。若要求公众提交生效的违法认定后才能检举，监督机制就难以启动。\u003c/p>\n\u003cp>\u003cstrong>4. 受理机关须依法查处并履行相应反馈义务。\u003c/strong> 反间谍法第52条规定及时查清事实、依法处理并告知结果；《国家情报法》第27条还要求提供便利渠道、为检举人和控告人保密。这些规定使监督权不止于“可以寄送一份材料”，而与受理、处理、告知及保护相联系。\u003ca href=\"https://qhca.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_a97c92189dea4940bf0ec7739d89026c.html\">《国家情报法》第27条\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>5. 行使权利应如实反映情况，反报复保护也应落实。\u003c/strong> 宪法禁止捏造或歪曲事实进行诬告陷害，同时禁止压制和打击报复。核查后意见未被采纳、线索未被证实，与故意编造事实存在区别。有关人员不能仅因受到批评或检举，就对提出者施加不利待遇；是否构成具体违法犯罪，应依相应构成要件判断。\u003c/p>\n\u003cp>\u003cstrong>6. 监督权与各类法定救济程序相衔接。\u003c/strong> 如果目的在于撤销某项行政处理、纠正生效裁判、获得赔偿，仍须识别适用的复议、诉讼、申诉或赔偿程序。一般监督举报与这些程序并不自动互相替代，提出监督意见也不能当然推定有关申请期限停止计算。本条本身没有规定统一受理机关或统一期限。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>社会监督是依法履职的重要条件。\u003c/strong> 国家安全工作具有专业性，有些事项需要保密，外部人员可能难以掌握完整材料。正因如此，便利反映问题、独立审查线索和防止报复就具有现实意义。保密要求与依法监督可以通过适当渠道、知悉范围和材料保护措施协调实现。\u003c/p>\n\u003cp>\u003cstrong>支持国家安全工作与监督国家安全工作具有一致的法治目标。\u003c/strong> 第77—79条要求公民和组织履行相应义务，本条则保障其指出问题和寻求纠正。依法提出批评建议本身，是法律明确保护的行为；不能仅因意见涉及国家安全工作，就将其等同于危害国家安全。\u003c/p>\n\u003cp>\u003cstrong>监督与实体救济既相互联系，也各有功能。\u003c/strong> 监督可以发现责任和制度问题，个案救济则还要处理撤销、变更、重新审查、恢复权益或赔偿等具体请求。研究本条时，应同时关注问题有没有被查处，以及受影响者的权利有没有通过适当程序得到恢复。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中介绍监督举报平台，体现了权利实现需要可用渠道。实践中可先区分事项：报告外部危害国家安全活动线索，与检举机关工作人员违法失职，属于不同工作对象；申请撤销、变更具体处理又涉及相应救济程序。渠道和联系方式应以受理机关最新公开信息为准，不宜把教材记载的某一个号码理解为全部事项的唯一入口。\u003c/p>\n\u003cp>本条与第13、43、83条形成联系：第13条确立违法失职的责任，第43条要求机关严格依法履职，第83条控制特别措施的权限与必要限度，本条则为公众提出批评、揭示问题和寻求纠正提供权利依据。分析个案时，可以把“机关负有什么义务”与“当事人可以提出什么请求”对应起来。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条保障公民和组织参与监督国家安全工作。前一层是对工作的批评和建议，后一层是针对违法失职行为的申诉、控告和检举。二者对象和功能不同，不能把所有意见都要求为已经查明的违法事实。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>宪法第41条是本条的重要依据，规定公民提出批评建议、申诉控告检举的权利，要求有关国家机关查清事实、负责处理，并禁止压制和打击报复。2014年12月22日草案说明已列出这些监督权利，2015年本条将其落实到国家安全工作领域，并明确“公民和组织”均为权利主体。（甲书印377页，PDF390页。）\u003ca href=\"https://zygjjg.12388.gov.cn/html/law/1.html\">《宪法》第41条\u003c/a>\u003c/p>\n\u003cp>1993年《国家安全法》第22条、2014年《反间谍法》第26条已规定对国家安全机关及其工作人员的监督和反报复保护。2015年本条面向国家安全工作中的国家机关及其工作人员，范围并不限于国家安全机关本身。2023年修订《反间谍法》第52条继续具体规定受理、处理结果告知和禁止报复，并明确列出上级国家安全机关、监察机关、人民检察院等有关部门。\u003ca href=\"https://paper.people.com.cn/rmrb/html/2023-04/27/nw.D110000renmrb_20230427_1-15.htm\">现行《反间谍法》第52条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 批评建议不以违法失职为前提。\u003c/strong> 工作方式不够妥当、效率偏低、协同不足、告知不清等，都可以成为提出意见的内容。批评侧重指出缺点和问题，建议侧重提出改进办法。即使有关措施尚不能认定违法，公众也可以对其实施效果和改进方向提出意见。\u003c/p>\n\u003cp>\u003cstrong>2. 申诉、控告和检举各有侧重。\u003c/strong> 申诉通常表达对涉及自身权益的处理、裁判或有关不公正待遇的不服，并依适用程序请求复查、纠正；控告侧重指明侵权或其他违法失职行为，请求有权机关处理；检举侧重揭发所知悉的违法失职线索，不限于直接受害人。具体名称、资格和受理条件须结合相应程序法，不能仅凭材料标题决定其性质。\u003c/p>\n\u003cp>\u003cstrong>3. “违法失职”是提出问题的对象，而非要求先有认定结论。\u003c/strong> 申诉人、控告人或检举人应说明事实、理由和相关线索；是否构成违法失职，由有权机关依法审查。若要求公众提交生效的违法认定后才能检举，监督机制就难以启动。\u003c/p>\n\u003cp>\u003cstrong>4. 受理机关须依法查处并履行相应反馈义务。\u003c/strong> 反间谍法第52条规定及时查清事实、依法处理并告知结果；《国家情报法》第27条还要求提供便利渠道、为检举人和控告人保密。这些规定使监督权不止于“可以寄送一份材料”，而与受理、处理、告知及保护相联系。\u003ca href=\"https://qhca.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_a97c92189dea4940bf0ec7739d89026c.html\">《国家情报法》第27条\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>5. 行使权利应如实反映情况，反报复保护也应落实。\u003c/strong> 宪法禁止捏造或歪曲事实进行诬告陷害，同时禁止压制和打击报复。核查后意见未被采纳、线索未被证实，与故意编造事实存在区别。有关人员不能仅因受到批评或检举，就对提出者施加不利待遇；是否构成具体违法犯罪，应依相应构成要件判断。\u003c/p>\n\u003cp>\u003cstrong>6. 监督权与各类法定救济程序相衔接。\u003c/strong> 如果目的在于撤销某项行政处理、纠正生效裁判、获得赔偿，仍须识别适用的复议、诉讼、申诉或赔偿程序。一般监督举报与这些程序并不自动互相替代，提出监督意见也不能当然推定有关申请期限停止计算。本条本身没有规定统一受理机关或统一期限。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>社会监督是依法履职的重要条件。\u003c/strong> 国家安全工作具有专业性，有些事项需要保密，外部人员可能难以掌握完整材料。正因如此，便利反映问题、独立审查线索和防止报复就具有现实意义。保密要求与依法监督可以通过适当渠道、知悉范围和材料保护措施协调实现。\u003c/p>\n\u003cp>\u003cstrong>支持国家安全工作与监督国家安全工作具有一致的法治目标。\u003c/strong> 第77—79条要求公民和组织履行相应义务，本条则保障其指出问题和寻求纠正。依法提出批评建议本身，是法律明确保护的行为；不能仅因意见涉及国家安全工作，就将其等同于危害国家安全。\u003c/p>\n\u003cp>\u003cstrong>监督与实体救济既相互联系，也各有功能。\u003c/strong> 监督可以发现责任和制度问题，个案救济则还要处理撤销、变更、重新审查、恢复权益或赔偿等具体请求。研究本条时，应同时关注问题有没有被查处，以及受影响者的权利有没有通过适当程序得到恢复。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中介绍监督举报平台，体现了权利实现需要可用渠道。实践中可先区分事项：报告外部危害国家安全活动线索，与检举机关工作人员违法失职，属于不同工作对象；申请撤销、变更具体处理又涉及相应救济程序。渠道和联系方式应以受理机关最新公开信息为准，不宜把教材记载的某一个号码理解为全部事项的唯一入口。\u003c/p>\n\u003cp>本条与第13、43、83条形成联系：第13条确立违法失职的责任，第43条要求机关严格依法履职，第83条控制特别措施的权限与必要限度，本条则为公众提出批评、揭示问题和寻求纠正提供权利依据。分析个案时，可以把“机关负有什么义务”与“当事人可以提出什么请求”对应起来。\u003c/p>\n"},{"num":83,"label":"第八十三条","title":"限制权利与自由的特别措施及其边界","lawText":"在国家安全工作中，需要采取限制公民权利和自由的特别措施时，应当依法进行，并以维护国家安全的实际需要为限度。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第八十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>在国家安全工作中，需要采取限制公民权利和自由的特别措施时，应当依法进行，并以维护国家安全的实际需要为限度。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第八十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>在国家安全工作中，需要采取限制公民权利和自由的特别措施时，应当依法进行，并以维护国家安全的实际需要为限度。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">限制权利与自由的特别措施及其边界 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条位于第六章末尾，对限制公民权利和自由的特别措施提出两项累积要求：\u003cstrong>依法进行\u003c/strong>与\u003cstrong>以实际需要为限\u003c/strong>。前者约束权限、范围、条件和程序，后者控制措施的对象、强度与持续时间，共同落实第7条的法治原则和人权保障要求。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条的制度基础，是宪法对公民基本权利的保障以及有关法律对特别措施的授权和约束。例如，宪法第37条保障人身自由，第40条在保护通信自由和通信秘密的同时，规定特定需要下依法进行通信检查的例外。国家安全立法需要把这种“保障权利并限定例外”的结构贯彻到具体工作中。\u003ca href=\"https://zygjjg.12388.gov.cn/html/law/1.html\">《宪法》第40条\u003c/a>\u003c/p>\n\u003cp>2014年12月22日草案说明强调尊重和保障人权，并将危机管控中的权益保护与公民、组织的各项权利联系起来。2015年法律将本条置于第六章末尾，进一步体现履行义务与保障权利相统一的结构。所读审议报告未单独说明本条具体措辞的修改过程。（甲书印376页，PDF389页；相关审议报告见附录三至五。）\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 本条规范的是权力行使的边界。\u003c/strong> 它没有列出具体措施，也没有授予所有国家机关一项通用的限制权利权限。审查某项措施时，应先查其专门法律依据，再判断是否符合本条要求；维护国家安全的任务本身，不能代替对搜查、拘留、通信检查等措施的具体授权。\u003c/p>\n\u003cp>\u003cstrong>2. “依法进行”包含四个相互关联的问题。\u003c/strong> 权限解决哪个机关有权决定与实施；范围解决可以针对哪些事项和对象；条件解决何种事实、风险或状态出现时才能启动；程序解决批准、告知、实施、记录、监督和终止等应遵循的要求。不同措施适用的程序不同，不能将其中一项措施的批准视为其他措施一并获准。\u003c/p>\n\u003cp>\u003cstrong>3. “实际需要”要求措施具有具体事实基础。\u003c/strong> 应说明所防范的风险、所保护的利益与拟采取措施之间的联系。安全工作常需事前判断，实际需要不以危害已经发生为前提，但须有足以支持该判断的事实和理由，不能只重复抽象的安全目标。\u003c/p>\n\u003cp>\u003cstrong>4. 必要性须落实到对象、地域、强度和期限。\u003c/strong> 能以针对特定对象的措施达到目的时，原则上不应无差别扩大到无关人员；能够在较小地域、较短期间内处理的，不应不加说明地扩大空间和时间范围。在合法而同样有效的方案之间，应优先选择对权益影响较小的措施。\u003c/p>\n\u003cp>\u003cstrong>5. 采取以后仍须持续判断。\u003c/strong> 启动时必要，不表示此后可以无限延续。风险降低、对象变化或替代办法已经可用时，应依法调整；本法第68条对危机威胁和危害得到控制或者消除后的及时解除措施，作了明确规定。必要限度贯穿措施的决定、实施、延长和终止。\u003c/p>\n\u003cp>\u003cstrong>6. 第65、66、83条的适用侧重不同。\u003c/strong> 第65条以国家决定进入紧急状态、战争状态或者实施国防动员为前提；第66条直接规范国家安全危机管控措施的相适应性与权益保护；本条则以“在国家安全工作中”为表述，侧重限制公民权利和自由的特别措施。不能将第65条的非常状态前提机械套用于所有法律已经明确授权的日常措施。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>合法性与比例控制相互补充。\u003c/strong> 机关有法定权限，仍可能在实施中选择过广、过强或过久的措施。可以用三个问题展开本条的法理分析：措施能否促进法定目的；是否存在同样有效而影响更小的方案；措施造成的权益负担是否与所防范的具体危害相称。这是解释“实际需要”的分析方法，不是本条另外明列的三项程序。\u003c/p>\n\u003cp>\u003cstrong>程序有助于检验必要性。\u003c/strong> 对事实依据、方案选择和持续期限作出可以核查的说明，才能使监督机关判断措施是否越界。依法保密可以影响材料公开的范围和方式，但不等于免除记录、内部审核或有权机关监督。\u003c/p>\n\u003cp>\u003cstrong>一般法与特别法需要分别判断。\u003c/strong> 《行政强制法》第4、5条分别规定法定权限、范围、条件、程序和适当性要求，可用于理解本条。该法第3条同时对突发事件中的应急、临时措施等作出适用衔接规定。因此，不能把行政强制的一般程序直接套用于一切刑事侦查、国防动员或应急措施，仍须查明措施性质和特别规范。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_c5b6bfc45a5e45ca91b4a1ad2a1d2d93.html\">《行政强制法》第3—5条\u003c/a>\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>两处引文应按法条校正。\u003c/strong> 乙书印238页转述宪法第40条时写作“监察机关”，宪法原文为“检察机关”；印239页所引“行政强制的设定和实施，应当依照法定的权限、范围、条件和程序”，实际对应《行政强制法》第4条，并非第3条。这里涉及具体机关和规范依据，应依原条文校正。\u003ca href=\"https://zygjjg.12388.gov.cn/html/law/1.html\">《宪法》第40条\u003c/a>、\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_c5b6bfc45a5e45ca91b4a1ad2a1d2d93.html\">《行政强制法》第4条\u003c/a>\u003c/p>\n\u003cp>书中成某案件涉及刑事强制措施、法院判处刑罚和驱逐出境的执行。研读重点应放在这些行为各自的法律性质、权限与程序，不宜仅凭简短案情介绍推断每个环节都已满足本条的必要性要求，也不能将本条当作上述措施的独立授权依据。\u003c/p>\n\u003cp>可将本条与第80—82条连读：事前和事中限制措施须守法、适度，协助者依法获得保护，发生损失后依规定补偿、抚恤，违法失职行为则接受监督和相应救济。这些制度共同构成第六章的权利保障安排。\u003c/p>\n\u003chr>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条位于第六章末尾，对限制公民权利和自由的特别措施提出两项累积要求：\u003cstrong>依法进行\u003c/strong>与\u003cstrong>以实际需要为限\u003c/strong>。前者约束权限、范围、条件和程序，后者控制措施的对象、强度与持续时间，共同落实第7条的法治原则和人权保障要求。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条的制度基础，是宪法对公民基本权利的保障以及有关法律对特别措施的授权和约束。例如，宪法第37条保障人身自由，第40条在保护通信自由和通信秘密的同时，规定特定需要下依法进行通信检查的例外。国家安全立法需要把这种“保障权利并限定例外”的结构贯彻到具体工作中。\u003ca href=\"https://zygjjg.12388.gov.cn/html/law/1.html\">《宪法》第40条\u003c/a>\u003c/p>\n\u003cp>2014年12月22日草案说明强调尊重和保障人权，并将危机管控中的权益保护与公民、组织的各项权利联系起来。2015年法律将本条置于第六章末尾，进一步体现履行义务与保障权利相统一的结构。所读审议报告未单独说明本条具体措辞的修改过程。（甲书印376页，PDF389页；相关审议报告见附录三至五。）\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 本条规范的是权力行使的边界。\u003c/strong> 它没有列出具体措施，也没有授予所有国家机关一项通用的限制权利权限。审查某项措施时，应先查其专门法律依据，再判断是否符合本条要求；维护国家安全的任务本身，不能代替对搜查、拘留、通信检查等措施的具体授权。\u003c/p>\n\u003cp>\u003cstrong>2. “依法进行”包含四个相互关联的问题。\u003c/strong> 权限解决哪个机关有权决定与实施；范围解决可以针对哪些事项和对象；条件解决何种事实、风险或状态出现时才能启动；程序解决批准、告知、实施、记录、监督和终止等应遵循的要求。不同措施适用的程序不同，不能将其中一项措施的批准视为其他措施一并获准。\u003c/p>\n\u003cp>\u003cstrong>3. “实际需要”要求措施具有具体事实基础。\u003c/strong> 应说明所防范的风险、所保护的利益与拟采取措施之间的联系。安全工作常需事前判断，实际需要不以危害已经发生为前提，但须有足以支持该判断的事实和理由，不能只重复抽象的安全目标。\u003c/p>\n\u003cp>\u003cstrong>4. 必要性须落实到对象、地域、强度和期限。\u003c/strong> 能以针对特定对象的措施达到目的时，原则上不应无差别扩大到无关人员；能够在较小地域、较短期间内处理的，不应不加说明地扩大空间和时间范围。在合法而同样有效的方案之间，应优先选择对权益影响较小的措施。\u003c/p>\n\u003cp>\u003cstrong>5. 采取以后仍须持续判断。\u003c/strong> 启动时必要，不表示此后可以无限延续。风险降低、对象变化或替代办法已经可用时，应依法调整；本法第68条对危机威胁和危害得到控制或者消除后的及时解除措施，作了明确规定。必要限度贯穿措施的决定、实施、延长和终止。\u003c/p>\n\u003cp>\u003cstrong>6. 第65、66、83条的适用侧重不同。\u003c/strong> 第65条以国家决定进入紧急状态、战争状态或者实施国防动员为前提；第66条直接规范国家安全危机管控措施的相适应性与权益保护；本条则以“在国家安全工作中”为表述，侧重限制公民权利和自由的特别措施。不能将第65条的非常状态前提机械套用于所有法律已经明确授权的日常措施。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>合法性与比例控制相互补充。\u003c/strong> 机关有法定权限，仍可能在实施中选择过广、过强或过久的措施。可以用三个问题展开本条的法理分析：措施能否促进法定目的；是否存在同样有效而影响更小的方案；措施造成的权益负担是否与所防范的具体危害相称。这是解释“实际需要”的分析方法，不是本条另外明列的三项程序。\u003c/p>\n\u003cp>\u003cstrong>程序有助于检验必要性。\u003c/strong> 对事实依据、方案选择和持续期限作出可以核查的说明，才能使监督机关判断措施是否越界。依法保密可以影响材料公开的范围和方式，但不等于免除记录、内部审核或有权机关监督。\u003c/p>\n\u003cp>\u003cstrong>一般法与特别法需要分别判断。\u003c/strong> 《行政强制法》第4、5条分别规定法定权限、范围、条件、程序和适当性要求，可用于理解本条。该法第3条同时对突发事件中的应急、临时措施等作出适用衔接规定。因此，不能把行政强制的一般程序直接套用于一切刑事侦查、国防动员或应急措施，仍须查明措施性质和特别规范。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_c5b6bfc45a5e45ca91b4a1ad2a1d2d93.html\">《行政强制法》第3—5条\u003c/a>\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>两处引文应按法条校正。\u003c/strong> 乙书印238页转述宪法第40条时写作“监察机关”，宪法原文为“检察机关”；印239页所引“行政强制的设定和实施，应当依照法定的权限、范围、条件和程序”，实际对应《行政强制法》第4条，并非第3条。这里涉及具体机关和规范依据，应依原条文校正。\u003ca href=\"https://zygjjg.12388.gov.cn/html/law/1.html\">《宪法》第40条\u003c/a>、\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_c5b6bfc45a5e45ca91b4a1ad2a1d2d93.html\">《行政强制法》第4条\u003c/a>\u003c/p>\n\u003cp>书中成某案件涉及刑事强制措施、法院判处刑罚和驱逐出境的执行。研读重点应放在这些行为各自的法律性质、权限与程序，不宜仅凭简短案情介绍推断每个环节都已满足本条的必要性要求，也不能将本条当作上述措施的独立授权依据。\u003c/p>\n\u003cp>可将本条与第80—82条连读：事前和事中限制措施须守法、适度，协助者依法获得保护，发生损失后依规定补偿、抚恤，违法失职行为则接受监督和相应救济。这些制度共同构成第六章的权利保障安排。\u003c/p>\n\u003chr>\n"},{"num":84,"label":"第八十四条","title":"公布即施行与法律的时间效力","lawText":"本法自公布之日起施行。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第八十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>本法自公布之日起施行。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第八十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>本法自公布之日起施行。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">公布即施行与法律的时间效力 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条是第七章“附则”的唯一条文，也是全法最后一条。它确定本法的生效起点：\u003cstrong>2015年7月1日\u003c/strong>。\u003ca href=\"https://www.gjbmj.gov.cn/n1/2018/0601/c409088-30029401.html\">国家安全法及主席令第二十九号\u003c/a>\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2015年7月1日，第十二届全国人民代表大会常务委员会第十五次会议通过本法；同日，国家主席签署第二十九号主席令予以公布，并自公布之日起施行。因此，本法的通过日、公布日和施行日在事实上为同一天，但三个概念分别对应立法表决、正式公布和开始发生法律效力。\u003c/p>\n\u003cp>书中援引当时《立法法》第57条说明法律应明确规定施行日期。2023年修改后，这一要求对应现行第61条，第62条另规定主席令载明制定机关、通过和施行日期等事项。条号更新不改变本法已经确定的施行日期。\u003ca href=\"https://commerce.suzhou.gov.cn/szsswj/fgyjd/202311/3ed461f6adc740b8a8dcf0d18a9d7b6a.shtml\">现行《立法法》第61、62条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. “公布之日”指法定公布日期。\u003c/strong> 应结合主席令识别，而非根据读者看到法律的时间、某个网站转载的日期、教材出版时间或地方宣传活动日期确定。官方网站后来转载本法，不会使其重新生效。\u003c/p>\n\u003cp>\u003cstrong>2. 本法没有另外设置施行准备期。\u003c/strong> 法律可以规定公布即施行，也可以另定一个将来的施行日期；本法采用前者。各机关后续完善工作机制、制定配套规定、开展教育培训，属于法律实施过程，不构成全法须待配套齐备才生效的条件。\u003c/p>\n\u003cp>\u003cstrong>3. 附则具有法律效力。\u003c/strong> 附则是法律的组成部分，本条虽短，仍直接影响适用的时间界限。不能因为它位于正文最后，就把它当成不具规范效力的说明文字。\u003c/p>\n\u003cp>\u003cstrong>4. 施行日期与溯及力分别判断。\u003c/strong> 本条确定从何时开始施行，没有单独规定对先前行为一律追溯适用。现行《立法法》第104条规定不溯及既往的一般原则及保护权利利益的特别例外。具体案件涉及过去行为、持续行为或者之后新生的法律事实，应结合相应实体法、程序法和过渡规定分别判断。\u003ca href=\"https://commerce.suzhou.gov.cn/szsswj/fgyjd/202311/3ed461f6adc740b8a8dcf0d18a9d7b6a.shtml\">《立法法》第104条\u003c/a>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>施行日期服务于法律确定性。\u003c/strong> 公民和组织需要知道从何时起受新规范约束，国家机关也需要明确履职和判断行为的时间依据。公布即施行能够使法律立即进入实施状态；另设施行日期则可为制度衔接和行为调整提供准备时间。两种方式应依法律内容与实施需要选择，不能把其中一种理解为所有法律的固定规则。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>本条没有规定废止1993年《国家安全法》，原因是该法已由2014年《反间谍法》第40条明确同时废止。2015年本法建立总体国家安全的综合法律框架，与专门反间谍立法并行，不能仅凭名称相同把它理解为1993年法一直连续适用的版本。\u003ca href=\"https://qspfw.moe.gov.cn/html/aqjyr19/chapters_fjd_secrets.html\">2014年《反间谍法》第40条\u003c/a>\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。
