\u003cp>第4条首先规定“坚持中国共产党对国家安全工作的领导”，由此确定国家安全工作的总体领导原则。\n这一规定与第3条总体国家安全观之间具有内在联系。国家安全已经涉及政治、经济、军事、文化、社会、科技、网络等多个领域，单一部门难以独立处理涉及国家整体安全的重大问题，需要在总体层面形成统一的战略判断和重大决策。\n从本法结构看，第4条规定的是\u003cstrong>领导原则\u003c/strong>，第5条进一步规定中央国家安全领导机构的决策和议事协调职责，第三章则规定全国人大常委会、国务院、中央军事委员会、中央国家机关以及地方国家机关等主体维护国家安全的具体职责。\n因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>党的领导解决国家安全工作的总体方向和统筹问题，各国家机关则依照宪法和法律承担相应的国家安全职责。\u003c/strong>\n两者属于不同层次的规范安排。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二，“集中统一”强调重大国家安全事项的整体统筹\u003c/h4>\n\u003cp>“集中统一”主要针对国家安全事务的整体性和跨领域特征。\n现代国家安全问题往往同时涉及多个部门、地区和专业领域。例如，一项重大网络安全风险可能同时影响通信基础设施、金融运行、公共服务乃至军事安全。如果不同部门分别判断、分别行动而缺乏整体协调，就可能出现信息分散、政策目标不一致或者措施衔接不足的问题。\n因此，“集中统一”的核心功能在于：\u003c/p>\n\u003cul>\n\u003cli>统一国家安全工作的重大方向；\u003c/li>\n\u003cli>统筹重大国家安全战略和政策；\u003c/li>\n\u003cli>协调跨部门、跨地区、跨领域的重大事项；\u003c/li>\n\u003cli>形成不同国家安全力量之间的整体配合。\n第5条所规定的“统筹协调国家安全重大事项和重要工作”，正是“集中统一”要求在具体职责层面的体现。\u003c/li>\n\u003c/ul>\n\u003cp>需要注意：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>集中统一主要解决国家安全工作的总体决策和协调问题，并不意味着取消不同国家机关之间依法形成的职责分工。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三，“高效”强调国家安全决策和执行之间的有效衔接\u003c/h4>\n\u003cp>国家安全风险往往具有突发性、扩散性和高度不确定性。\n如果风险信息需要经过过长的传递链条，或者不同部门之间缺乏必要的协调机制，就可能影响风险识别、判断和应对的及时性。\n因此，“高效”要求国家安全领导体制能够使：\n\u003cstrong>信息及时汇集 → 风险综合研判 → 重大事项决策 → 任务分工 → 协同实施\u003c/strong>\n形成较为顺畅的工作链条。\u003c/p>\n\u003cp>从法律制度上看，“高效”并不是简单追求决策速度，而是要求减少不必要的协调成本，使不同主体能够按照既定职责及时形成行动。\n这一点尤其需要与第7条结合理解。第7条明确规定，维护国家安全应当遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。\n因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>高效是国家安全工作的组织要求，并不意味着可以通过省略法定程序换取效率。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第四，“权威”强调重大国家安全决策具有统一贯彻和组织执行的保障\u003c/h4>\n\u003cp>国家安全事项通常跨越多个部门和领域，因此，仅有协调机制还不足以保证重大决策真正实施。\n“权威”主要体现为，国家安全重大决策和总体部署应当能够在相关领域得到贯彻落实，不因部门、地区或者事项分割而失去执行力。\n从这一角度看：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>集中统一\u003c/strong>解决“能否形成统一决策”；\u003c/li>\n\u003cli>\u003cstrong>高效\u003c/strong>解决“能否及时形成并实施决策”；\u003c/li>\n\u003cli>\u003cstrong>权威\u003c/strong>解决“重大决策能否得到有效贯彻”。\n三者共同构成国家安全领导体制的基本要求。\n但“权威”同样不能理解为具体机关可以超越法律行使权力。\n在法治结构中，重大决策形成之后，具体国家机关仍然需要按照法定职责和法定程序实施。第4条与第7条、第三章职责规定应当结合理解。\n因此：\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>领导体制的权威性体现为决策和协调的组织效力，不等于对具体国家机关法定权限边界的取消。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 领导规范、组织规范与行为规范应当区分\u003c/h4>\n\u003cp>从规范性质来看，第4条主要属于\u003cstrong>领导原则和组织体制规范\u003c/strong>。\n它解决的是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全工作如何形成统一领导和整体协调。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第5条进一步规定中央国家安全领导机构的职责，第三章规定有关国家机关承担的国家安全职责，而涉及检查、调查、审查、管控或者其他具体措施时，还需要依据相应的实体法和程序法规范。\n由此可以形成三个层次：\n\u003cstrong>领导规范：谁进行总体领导和统筹\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>职责规范：哪些机关承担哪些国家安全职责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>行为规范：具体机关在何种条件下可以采取什么措施\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>2. “集中统一”与“依法分工”具有不同功能\u003c/h4>\n\u003cp>国家安全事务具有整体性，因此需要集中统一的领导体制；国家治理又具有高度专业化特征，因此不同机关仍然需要依据法律进行专业分工。\n二者解决的是不同问题：\n\u003cstrong>集中统一解决国家安全工作的整体方向和重大事项协调；\u003c/strong>\n\u003cstrong>依法分工解决具体事务由谁负责以及如何承担责任。\u003c/strong>\n例如，第5条规定中央国家安全领导机构负责决策和议事协调，而第三章继续规定有关国家机关各自承担维护国家安全的职责。\n因此，国家安全领导体制可以概括为：&gt; \u003cstrong>集中统一领导 + 专业职责分工 + 跨部门协同。\u003c/strong>\n三者并不矛盾，而是现代综合性国家安全治理中不同层面的组织要求。\u003c/p>\n\u003chr>\n\u003ch4>3. “高效”与“依法运行”应当同时成立\u003c/h4>\n\u003cp>国家安全领域尤其容易出现“效率与程序”之间的张力。\n安全风险可能要求迅速反应，但现代法治同样要求公权力受到权限和程序约束。\n第4条强调“高效”，第7条紧接着强调依法维护国家安全以及人权保障。这种条文安排本身提示：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全工作的效率要求必须通过法治化的组织和程序机制实现。\u003c/strong>\n因此，提高效率的主要方向应当是：\u003c/p>\n\u003c/blockquote>\n\u003cul>\n\u003cli>完善信息共享；\u003c/li>\n\u003cli>明确职责界限；\u003c/li>\n\u003cli>优化协调程序；\u003c/li>\n\u003cli>建立紧急情况下的法定处置机制；\u003c/li>\n\u003cli>减少不同机关之间不必要的重复工作。\n而不能简单将“高效”理解为降低程序要求。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>4. 2018年宪法第1条与本条形成现行法上的体系联系\u003c/h4>\n\u003cp>现行宪法第1条规定“中国共产党领导是中国特色社会主义最本质的特征”。《国家安全法》第4条则在国家安全这一具体领域明确规定党的领导。\n从现行法律体系看，可以将二者理解为：\n\u003cstrong>宪法第1条：一般性的宪法原则\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>《国家安全法》第4条：在国家安全领域的具体化\u003c/strong>\n但需要继续区分国家安全工作的总体领导与具体国家机关依法行使职权两个层次。宪法同时规定国家机关的组织体系和职权结构，《国家安全法》第7条亦明确要求国家安全工作遵守宪法和法律。\n因此，对第4条进行体系解释时，应同时看到：\n\u003cstrong>党的领导原则 + 国家机关法定职责 + 公权力依法运行\u003c/strong>\n共同构成现行国家安全法治的组织结构。\u003c/p>\n\u003chr>\n\u003ch4>5. 比较法：跨部门协调是共同问题，但组织结构不可简单类比\u003c/h4>\n\u003cp>跨部门协调并非我国国家安全制度所独有的问题。\n美国现行《美国法典》第50编第3021节规定国家安全委员会（National Security Council）。其职能包括在总统领导下，就涉及国家安全的国内、外交和军事政策整合向总统提供建议，以促进武装力量及其他政府部门和机构更加有效地协作；同时还承担评估风险以及就共同安全事项提出政策建议等职能。\n这一制度可以说明一个具有比较意义的共同问题：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>现代国家安全事务具有跨部门特征，因此不同国家都需要建立某种高层级的安全政策协调机制。\u003c/strong>\n但比较时必须注意制度差异。美国国家安全委员会设置于总统行政体系，其法定职能以向总统提供建议、政策协调等为核心；我国第4、5条所形成的国家安全领导体制具有不同的宪制基础、政治结构和职责安排。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）区分三个容易混淆的概念\u003c/h4>\n\u003ch5>1. 国家安全领导体制\u003c/h5>\n\u003cp>这是第4条规定的\u003cstrong>整体制度安排\u003c/strong>。\n关键词是：\u003cstrong>集中统一、高效权威。\u003c/strong>\n它描述的是国家安全工作总体如何领导和组织。\u003c/p>\n\u003ch5>2. 中央国家安全领导机构\u003c/h5>\n\u003cp>这是第5条规定的\u003cstrong>具体职责主体\u003c/strong>。\n第5条明确其主要职责包括：\u003c/p>\n\u003cul>\n\u003cli>国家安全工作的决策和议事协调；\u003c/li>\n\u003cli>研究制定、指导实施国家安全战略；\u003c/li>\n\u003cli>研究有关重大方针政策；\u003c/li>\n\u003cli>统筹协调国家安全重大事项和重要工作；\u003c/li>\n\u003cli>推动国家安全法治建设。\u003c/li>\n\u003c/ul>\n\u003ch5>3. 国家安全机关\u003c/h5>\n\u003cp>“国家安全机关”是有关法律中承担特定国家安全职责的\u003cstrong>专门国家机关\u003c/strong>，例如《反间谍法》所规定的国家安全机关。\u003c/p>\n\u003cp>因此三者不能混用：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全领导体制 ≠ 中央国家安全领导机构 ≠ 国家安全机关\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（二）核心关联条文\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>第3条：总体国家安全观。\u003c/strong> 说明国家安全工作的总体指导思想。\u003c/li>\n\u003cli>\u003cstrong>第4条：国家安全领导体制。\u003c/strong> 规定谁领导以及领导体制的基本要求。\u003c/li>\n\u003cli>\u003cstrong>第5条：中央国家安全领导机构。\u003c/strong> 规定中央层面的决策和议事协调职责。\u003c/li>\n\u003cli>\u003cstrong>第6条：国家安全战略。\u003c/strong> 将国家安全总体领导转化为战略安排。\u003c/li>\n\u003cli>\u003cstrong>第7条：法治与人权保障。\u003c/strong> 明确国家安全工作运行的法律边界。\u003c/li>\n\u003cli>\u003cstrong>第三章：维护国家安全的职责。\u003c/strong> 对不同国家机关的具体职责进行分工。\u003c/li>\n\u003cli>\u003cstrong>第44—47条等：国家安全制度的实施机制。\u003c/strong> 进一步体现不同机关和地区之间的协调配合。\u003c/li>\n\u003c/ul>\n\u003cp>可以概括为：\u003c/p>\n\u003cp>\u003cstrong>第3条：指导思想\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第4条：领导体制\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第5条：中央领导机构职责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：国家安全战略\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第三章：国家机关职责分工\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第四章：具体制度运行\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（三）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：第4条和第5条规定的是同一个问题。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第4条规定党的领导原则以及国家安全领导体制的总体要求，第5条进一步规定中央国家安全领导机构的具体职责。二者是“原则—职责”的关系。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：“集中统一”意味着所有国家安全事务都由中央国家安全领导机构直接办理。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 集中统一主要体现重大事项的决策和统筹协调。具体事务仍由有关国家机关按照法定职责办理。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：“高效”意味着紧急情况下可以不遵守法定程序。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第7条明确要求维护国家安全遵守宪法和法律。“高效”主要要求通过完善组织、信息和协调机制提升效率，不能作为排除法定程序的依据。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：“权威”意味着国家安全领导体制可以取代具体法律授权。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> “权威”主要体现重大国家安全决策和部署的组织执行保障。涉及公民、组织权利义务的具体措施，仍须具有相应法律依据。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：“国家安全领导机构”和“国家安全机关”是同一个概念。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 中央国家安全领导机构主要承担决策和议事协调职责；“国家安全机关”则是在有关法律框架下履行专门国家安全职责的国家机关，两者的性质和职能不同。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>集中统一领导与专业分工如何协调？\u003c/strong>\u003cbr>国家安全问题日益专业化，既需要总体统筹，也需要外交、军事、经济、科技、网络等不同领域的专业判断。如何形成既统一又具有专业性的决策结构？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全领导机构的决策如何转化为具体国家机关的法律行为？\u003c/strong>\u003cbr>从国家安全重大决策到行政机关、司法机关或者其他主体具体实施，中间需要经过怎样的法定职责和程序机制？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何理解国家安全工作中的“高效”？\u003c/strong>\u003cbr>应当主要通过信息共享、联合研判、职责明确和程序优化提高效率，还是需要针对紧急国家安全风险建立特殊程序？特殊程序的法律边界如何确定？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何实现国家安全责任的可追溯性？\u003c/strong>\u003cbr>跨部门协同容易形成多个主体共同参与的决策结构。如何在集中统一和协同工作条件下明确不同主体的职责范围，并形成相应的责任机制？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全决策协调机构的比较法研究应选择何种比较单位？\u003c/strong>\u003cbr>与其单纯比较各国是否设有“国家安全委员会”，是否更应比较其组织地位、成员构成、决策权限、咨询功能、执行关系和法律责任？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>第4条与第7条应如何进行体系解释？\u003c/strong>\u003cbr>“集中统一、高效权威”的领导体制要求，与“遵守宪法和法律、尊重和保障人权”的法治要求，应如何共同构成对国家安全治理的制度评价标准？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":5,"label":"第五条","title":"中央国家安全领导机构职责","lawText":"中央国家安全领导机构负责国家安全工作的决策和议事协调，研究制定、指导实施国家安全战略和有关重大方针政策，统筹协调国家安全重大事项和重要工作，推动国家安全法治建设。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>机构定位：\u003c/strong> 中央国家安全领导机构承担国家安全工作的决策和议事协调职责，其核心功能是总体决策、统筹协调，而非直接承办所有具体国家安全事务。\u003c/li>\n\u003cli>\u003cstrong>四项职责：\u003c/strong> 可以概括为\u003cstrong>决策协调、战略政策、重大事项统筹、法治建设\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>战略闭环：\u003c/strong> 第5条规定战略工作的领导职责，第6条规定国家安全战略的内容，第46—47条进一步规定督促落实和部门、地区实施责任。\u003c/li>\n\u003cli>\u003cstrong>法治建设：\u003c/strong> “推动国家安全法治建设”不仅涉及具体安全事务处置，也包括国家安全法律制度体系的持续完善，与第70条直接衔接。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 本条规定中央领导机构的组织职责，并未授予调查、拘留、搜查、处罚等具体执法权；具体措施仍须依据有关机关的法定职权。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中央国家安全领导机构负责国家安全工作的决策和议事协调，研究制定、指导实施国家安全战略和有关重大方针政策，统筹协调国家安全重大事项和重要工作，推动国家安全法治建设。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>机构定位：\u003c/strong> 中央国家安全领导机构承担国家安全工作的决策和议事协调职责，其核心功能是总体决策、统筹协调，而非直接承办所有具体国家安全事务。\u003c/li>\n\u003cli>\u003cstrong>四项职责：\u003c/strong> 可以概括为\u003cstrong>决策协调、战略政策、重大事项统筹、法治建设\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>战略闭环：\u003c/strong> 第5条规定战略工作的领导职责，第6条规定国家安全战略的内容，第46—47条进一步规定督促落实和部门、地区实施责任。\u003c/li>\n\u003cli>\u003cstrong>法治建设：\u003c/strong> “推动国家安全法治建设”不仅涉及具体安全事务处置，也包括国家安全法律制度体系的持续完善，与第70条直接衔接。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 本条规定中央领导机构的组织职责，并未授予调查、拘留、搜查、处罚等具体执法权；具体措施仍须依据有关机关的法定职权。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中央国家安全领导机构负责国家安全工作的决策和议事协调，研究制定、指导实施国家安全战略和有关重大方针政策，统筹协调国家安全重大事项和重要工作，推动国家安全法治建设。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">中央国家安全领导机构职责 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条承接第4条关于国家安全领导体制的规定，以职责列举的方式明确中央国家安全领导机构的主要职能。第4条回答“\u003cstrong>按照什么领导体制开展国家安全工作\u003c/strong>”，第5条则进一步回答“\u003cstrong>中央国家安全领导机构具体负责什么\u003c/strong>”。现行《国家安全法》第5条仍保持上述规定。\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 2013年：设立国家安全委员会的制度部署\u003c/h4>\n\u003cp>2013年党的十八届三中全会提出设立国家安全委员会，完善国家安全体制和国家安全战略。\n这一制度安排与国家安全事务日益呈现综合性、跨领域和跨部门特征密切相关。政治、军事、外交、经济、科技、社会等领域的安全问题可能相互影响，需要在中央层面形成能够统筹重大国家安全事务的决策和协调机制。\n因此，设立国家安全委员会，其制度重点在于建立\u003cstrong>国家安全重大事项的中央决策和统筹协调机制\u003c/strong>。\u003c/p>\n\u003ch4>2. 2014年：中央国家安全委员会的机构定位进一步明确\u003c/h4>\n\u003cp>2014年1月24日，中共中央政治局会议研究决定中央国家安全委员会设置，并明确中央国家安全委员会是\u003cstrong>中共中央关于国家安全工作的决策和议事协调机构\u003c/strong>，向中央政治局、中央政治局常务委员会负责，统筹协调涉及国家安全的重大事项和重要工作。\n这一机构定位已经体现出后来《国家安全法》第5条的两个核心概念：\n\u003cstrong>决策和议事协调 + 统筹重大事项和重要工作。\u003c/strong>\n2014年总体国家安全观提出以后，国家安全工作的领域进一步扩展，建立跨领域统筹机制的重要性也更加突出。\u003c/p>\n\u003ch4>3. 2015年：中央国家安全领导机构职责进入法律文本\u003c/h4>\n\u003cp>2015年《国家安全法》在第4条确立国家安全领导原则和领导体制后，第5条进一步以法律形式规定中央国家安全领导机构的主要职责，包括：\u003c/p>\n\u003col>\n\u003cli>国家安全工作的决策和议事协调；\u003c/li>\n\u003cli>研究制定、指导实施国家安全战略和有关重大方针政策；\u003c/li>\n\u003cli>统筹协调国家安全重大事项和重要工作；\u003c/li>\n\u003cli>推动国家安全法治建设。\n由此形成：\u003cstrong>领导体制 → 中央领导机构 → 具体职责\u003c/strong>这一组织规范结构。\u003c/li>\n\u003c/ol>\n\u003ch4>4. 制度意义：国家安全领导由原则要求进一步转化为具体职责\u003c/h4>\n\u003cp>第4条所规定的“集中统一、高效权威”仍然属于领导体制层面的总体要求。第5条则进一步明确中央国家安全领导机构需要承担哪些工作，使领导体制具有较为具体的组织法内容。\n因此，第4条与第5条可以简化为：\n\u003cstrong>第4条：建立什么样的国家安全领导体制\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第5条：中央国家安全领导机构具体负责什么\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，负责国家安全工作的“决策和议事协调”\u003c/h4>\n\u003cp>“决策和议事协调”是本条首先规定的职责，也是理解中央国家安全领导机构性质的关键。\n其中，“决策”主要指向国家安全领域具有全局性、战略性和重大性的事项；“议事协调”则强调对涉及多个部门、领域或者地区的国家安全事务进行研究、协调和统筹。\n现代国家安全问题往往具有明显的跨领域特征。例如，一个重大科技安全问题可能同时涉及产业、经济、军事、网络和数据安全。如果完全由单一部门独立处理，可能难以形成整体判断。\n因此，中央国家安全领导机构的重要功能在于将分散于不同领域的信息、判断和政策需求纳入统一的决策协调框架。\n这里需要注意：&gt; \u003cstrong>决策和议事协调并不意味着中央国家安全领导机构直接办理所有国家安全事务。\u003c/strong>\n具体国家安全工作仍由有关国家机关和部门依照法律规定的职责实施。\u003c/p>\n\u003chr>\n\u003ch4>第二，研究制定并指导实施国家安全战略和有关重大方针政策\u003c/h4>\n\u003cp>第二项职责涉及国家安全工作的\u003cstrong>战略层面\u003c/strong>。\n条文使用了两个不同的动词：&gt; \u003cstrong>研究制定 + 指导实施\u003c/strong>\n这说明中央国家安全领导机构的职责不仅包括国家安全战略和重大方针政策的形成，也包括推动其进入实施阶段。\n这一职责与第6条具有直接联系。\n第6条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>国家制定并不断完善国家安全战略，全面评估国际、国内安全形势，明确国家安全战略的指导方针、中长期目标、重点领域的国家安全政策、工作任务和措施。\n因此：\u003c/p>\n\u003c/blockquote>\n\u003cul>\n\u003cli>\u003cstrong>第5条主要解决“由谁负责国家安全战略工作”；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第6条主要解决“国家安全战略应当包含什么以及如何完善”。\u003c/strong>\n战略形成后，还需要进一步进入执行阶段。\n第46条规定建立国家安全工作督促检查和责任追究机制，以确保国家安全战略和重大部署贯彻落实；第47条规定各部门、各地区应当采取有效措施贯彻实施国家安全战略。\n由此可以形成较完整的战略运行链条：\n\u003cstrong>研究制定战略\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>明确战略内容\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>指导实施战略\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>部门和地区具体贯彻\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>督促检查与责任落实\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>这一链条说明，《国家安全法》中的国家安全战略能够通过后续制度与具体国家机关的职责相连接。\u003c/p>\n\u003chr>\n\u003ch4>第三，统筹协调国家安全重大事项和重要工作\u003c/h4>\n\u003cp>“统筹协调”与第4条规定的“集中统一”直接衔接。国家安全事项并非都需要由中央国家安全领导机构协调。本条特别使用“\u003cstrong>重大事项和重要工作\u003c/strong>”作为限定，说明中央层面的统筹具有重点性。\n通常而言，越是具有以下特点的国家安全事务，越具有中央统筹的现实必要性：\u003c/p>\n\u003cul>\n\u003cli>涉及多个安全领域；\u003c/li>\n\u003cli>涉及多个中央部门；\u003c/li>\n\u003cli>涉及中央和地方之间的协调；\u003c/li>\n\u003cli>涉及军地关系；\u003c/li>\n\u003cli>具有全局性或者战略性影响。\u003c/li>\n\u003c/ul>\n\u003cp>这一职责在第四章得到进一步制度化。\n第45条规定国家建立国家安全重点领域工作协调机制；第48条规定跨部门会商工作机制；第49条规定中央与地方之间、部门之间、军地之间以及地区之间的协同联动机制。\n因此，可以将第5条的“统筹协调”理解为一种上位的组织要求，而第四章进一步建立不同类型的工作协调机制。\u003c/p>\n\u003cp>可以简化为：\u003c/p>\n\u003cp>\u003cstrong>中央总体统筹\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>重点领域协调\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>跨部门会商\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>中央地方、部门、军地和地区协同联动\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>第四，“推动国家安全法治建设”将制度建设纳入领导机构职责\u003c/h4>\n\u003cp>本条最后规定“推动国家安全法治建设”。\n这一职责具有重要意义，因为它说明中央国家安全领导机构的工作并不局限于应对具体风险或者处理重大安全事件，还包括国家安全制度本身的建设和完善。\n第70条进一步规定：\u003c/p>\n\u003cblockquote>\n\u003cp>国家健全国家安全法律制度体系，推动国家安全法治建设。\n因此，第5条与第70条形成明显的体系联系：\u003c/p>\n\u003c/blockquote>\n\u003cul>\n\u003cli>\u003cstrong>第5条：\u003c/strong> 从中央国家安全领导机构的职责角度规定“推动国家安全法治建设”；\u003c/li>\n\u003cli>\u003cstrong>第70条：\u003c/strong> 从国家安全保障体系角度规定健全国家安全法律制度体系。\n两条共同说明，国家安全能力不仅表现为情报、资源、技术和应急处置能力，也包括建立和完善国家安全法律制度的能力。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 本条首先属于组织职责规范，兼具授权与责任指向\u003c/h4>\n\u003cp>第5条首先是一项\u003cstrong>组织法意义上的职责规范\u003c/strong>。它明确中央国家安全领导机构可以并应当在哪些事项上发挥作用，因此具有双重意义：\n一方面，它确定该机构开展国家安全决策、协调、战略和法治建设工作的职责依据；\n另一方面，它也明确这些重大国家安全事项在制度上应当有相应的决策、协调和推进主体。\n因此，在研究国家安全制度运行时，可以根据第5条进一步追问：\u003c/p>\n\u003cul>\n\u003cli>重大国家安全事项是否进入相应的决策协调机制；\u003c/li>\n\u003cli>国家安全战略是否形成相应实施安排；\u003c/li>\n\u003cli>跨领域事务是否建立必要的统筹机制；\u003c/li>\n\u003cli>国家安全法治建设是否形成制度性推进。\n但需要注意：\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>职责规范并不当然等于责任追究规范。\u003c/strong>\n第5条规定“负责什么”，并不能单独推导出违反职责以后承担何种具体法律责任。责任主体、构成条件和责任方式仍需要依据第46条等责任机制以及其他具体法律规范判断。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>2. 领导机构的组织职责与具体国家机关的法定职权应当区分\u003c/h4>\n\u003cp>第5条规定的是中央国家安全领导机构的决策、协调和统筹职责，并未规定完整的行政执法、刑事侦查或者强制措施权限。\n与之相比，《国家安全法》第42条明确规定国家安全机关、公安机关依法搜集涉及国家安全的情报信息，并依法行使侦查、拘留、预审、执行逮捕以及法律规定的其他职权；第43条又明确要求国家机关及其工作人员严格依法履行职责，不得超越、滥用职权。\n因此，应当区分：\n\u003cstrong>中央领导机构：决策、议事、战略、统筹协调\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>有关国家机关：依照法律承担具体国家安全职责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>执法和强制措施：必须具有具体法律授权\u003c/strong>\n由此可以形成一个重要解释规则：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>议事协调权限不能直接转化为行政执法或者强制措施权限。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>3. “推动国家安全法治建设”与行使国家立法权不是同一概念\u003c/h4>\n\u003cp>第5条使用的是“\u003cstrong>推动\u003c/strong>国家安全法治建设”，而不是赋予中央国家安全领导机构制定国家法律的权力。\n现行宪法第58条明确规定，全国人民代表大会和全国人民代表大会常务委员会行使国家立法权；第62条、第67条进一步分别规定全国人大和全国人大常委会的有关立法权限。\n因此，“推动国家安全法治建设”可以包括：\u003c/p>\n\u003cul>\n\u003cli>研究国家安全法治建设中的重大问题；\u003c/li>\n\u003cli>推动国家安全法律制度不断健全；\u003c/li>\n\u003cli>协调国家安全领域的制度建设；\u003c/li>\n\u003cli>推动有关制度需求进入法定立法和规范制定程序。\u003c/li>\n\u003c/ul>\n\u003cp>但这些研究、推动和协调活动不能替代宪法和法律规定的正式立法主体与立法程序。可以简化为：&gt; \u003cstrong>推动立法和法治建设 ≠ 直接行使国家立法权。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>4. “统筹协调”需要通过法定职责完成向具体行政行为的转化\u003c/h4>\n\u003cp>第5条尤其值得研究的问题，是中央层面的决策协调如何进入具体执行阶段。\n国家安全领导机构可以进行重大事项决策、战略指导和跨部门协调，但最终涉及具体行政管理、执法、司法或者其他国家行为时，仍需要由具有相应法定职责的机关依法作出。\n这一过程可以概括为：\u003c/p>\n\u003cp>\u003cstrong>中央决策和协调\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>战略、政策和重大部署\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>按照法定职责分解任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>有关机关依法形成具体决定\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>实施、监督与责任追究\u003c/strong>\u003c/p>\n\u003cp>这一结构非常重要，因为它把第4条的“集中统一”与第43条的“严格依法履行职责”连接起来。换言之：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>集中统一解决重大事项如何形成整体决策，法定职权解决具体决定由谁依法作出。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>5. 比较法的重点应当放在“功能链条”，而不只是机构名称\u003c/h4>\n\u003cp>〔比较法〕《国家安全法释义》外国相关国家安全机构概括为咨询、协调、决策等不同功能类型，并指出不同功能之间可能存在交叉。这一比较思路具有启发意义。\n不同国家可能都设有名称类似“国家安全委员会”的机构，但机构名称相同并不意味着其法律地位、职权范围和运行方式相同。更有意义的比较是：\n\u003cstrong>谁提供信息和专业意见\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>谁提出政策建议\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>谁作出最终决定\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>谁负责组织协调\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>谁依法具体实施\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>谁承担相应责任\u003c/strong>\u003c/p>\n\u003cp>例如，美国国家安全委员会主要围绕总统形成国家安全政策咨询和跨部门协调机制。比较研究应进一步考察其宪制地位、与总统及行政部门之间的关系，而不宜仅因中美均存在“国家安全委员会”而进行制度等同。\n因此：&gt; \u003cstrong>比较国家安全组织制度，应当比较功能、权限和责任结构，而不应只比较机构名称。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第4条、第5条和第6条的关系\u003c/h4>\n\u003cp>这三条连续规定，但功能明显不同。\u003c/p>\n\u003ch4>第4条：领导体制\u003c/h4>\n\u003cp>回答：&gt; \u003cstrong>国家安全工作由谁领导，应建立什么样的领导体制？\u003c/strong>\n核心词：\u003cstrong>党的领导 + 集中统一、高效权威\u003c/strong>\u003c/p>\n\u003ch5>第5条：领导机构职责\u003c/h5>\n\u003cp>回答：&gt; \u003cstrong>中央国家安全领导机构具体负责什么？\u003c/strong>\n核心词：\u003cstrong>决策协调 + 战略政策 + 重大事项统筹 + 法治建设\u003c/strong>\u003c/p>\n\u003ch5>第6条：国家安全战略\u003c/h5>\n\u003cp>回答：&gt; \u003cstrong>国家安全战略本身应当如何制定和完善，主要包括什么内容？\u003c/strong>\n核心词：\u003cstrong>形势评估 + 指导方针 + 中长期目标 + 重点领域政策 + 工作任务和措施\u003c/strong>\u003c/p>\n\u003cp>因此可以记忆为：\n\u003cstrong>第4条：体制\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第5条：主体与职责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：战略\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（二）国家安全战略的制度闭环\u003c/h4>\n\u003cp>第5条与第6条、第46条、第47条共同形成较为完整的战略机制：\n\u003cstrong>第5条：研究制定、指导实施战略\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：规定战略内容并不断完善\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第47条：部门、地区采取有效措施贯彻实施\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第46条：督促检查和责任追究\u003c/strong>\u003c/p>\n\u003cp>因此，在学习时不宜孤立理解第5条中的“指导实施”。\u003c/p>\n\u003cp>其真正含义需要放在后续制度中理解：&gt; \u003cstrong>战略制定之后，还存在任务落实、贯彻实施、监督检查和责任机制。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（三）国家安全法治建设的制度闭环\u003c/h4>\n\u003cp>本条“推动国家安全法治建设”与第五章也形成体系联系：\u003c/p>\n\u003cp>\u003cstrong>第5条：中央国家安全领导机构推动法治建设\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第70条：国家健全国家安全法律制度体系\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>具体立法：按照宪法和《立法法》等规定的权限和程序制定、修改\u003c/strong>\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全法治建设本身也必须通过法治方式推进。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（四）区分四个容易混淆的概念\u003c/h4>\n\u003ch5>1. 中央国家安全领导机构\u003c/h5>\n\u003cp>本条中的职责主体。主要承担：\u003cstrong>决策、议事协调、战略、重大事项统筹、法治建设推动。\u003c/strong>\u003c/p>\n\u003ch5>2. 国家安全领导体制\u003c/h5>\n\u003cp>第4条规定的国家安全工作整体组织结构。核心特征：\u003cstrong>集中统一、高效权威。\u003c/strong>\u003c/p>\n\u003ch5>3. 国家安全机关\u003c/h5>\n\u003cp>依法承担特定国家安全专门职责的国家机关，具有有关法律明确规定的具体职权。\u003c/p>\n\u003ch5>4. 国家安全工作协调机制\u003c/h5>\n\u003cp>第45、48、49条等规定的重点领域协调、跨部门会商以及中央地方、部门、军地、地区之间的协同联动机制。\n因此：&gt; \u003cstrong>领导体制 ≠ 中央领导机构 ≠ 国家安全机关 ≠ 工作协调机制\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（五）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：中央国家安全领导机构就是一个具体国家安全执法机关。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第5条主要规定其决策、议事协调、战略、统筹和法治建设职责。具体执法职权需要依据有关机关的专门法律规定。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：“负责国家安全工作的决策”意味着所有国家安全事项都由中央国家安全领导机构直接作出决定。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 本条应结合“重大事项”“重要工作”以及第三章国家机关职责规定理解。中央层面承担总体和重大事项决策协调，具体事项仍由有关机关依法处理。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：“研究制定国家安全战略”与“国家制定国家安全战略”相互矛盾。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第5条从中央国家安全领导机构职责角度规定“研究制定、指导实施”，第6条则从国家安全制度角度规定战略的制定、评估、内容和完善要求。二者属于不同规范层次。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：“推动国家安全法治建设”等于中央国家安全领导机构可以直接制定法律。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> “推动”属于研究、协调和制度建设职责。国家立法权以及法律的制定、修改和解释仍须按照宪法规定的主体、权限和程序进行。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：第5条已经规定了国家安全战略的全部实施机制。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第5条只规定“指导实施”。战略的具体落实还需要结合第46条的督促检查和责任追究机制、第47条的部门和地区贯彻实施义务以及其他工作机制理解。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>议事协调结论如何转化为具有法律意义的具体决定？\u003c/strong>\u003cbr>中央层面的重大国家安全决策和协调意见进入具体执行后，应如何通过各国家机关的法定职责和程序实现？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“决策”和“议事协调”之间应如何区分？\u003c/strong>\u003cbr>哪些事项属于中央层面的最终决策，哪些事项主要体现跨部门协调？二者在制度运行中如何衔接？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全战略的法律性质是什么？\u003c/strong>\u003cbr>国家安全战略如何影响有关机关的行政决策和具体行为？其与法律、行政法规、部门规章以及政策文件之间是什么关系？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何评价国家安全战略的实施情况？\u003c/strong>\u003cbr>第46条建立督促检查和责任追究机制后，应当以何种标准判断有关部门和地区是否充分履行贯彻实施国家安全战略的职责？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“推动国家安全法治建设”应当包括哪些具体制度活动？\u003c/strong>\u003cbr>除推动法律制定和修改外，是否还包括规范协调、执法机制建设、程序完善、权利保障以及法律实施评估等内容？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>跨部门国家安全事务如何实现责任可追溯？\u003c/strong>\u003cbr>当一个重大事项经过多个部门共同研判和协调后，最终具体决定由谁作出、事实依据由谁审查、执行责任由谁承担，应如何形成清晰的责任链条？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全机构比较法研究应选择什么比较单位？\u003c/strong>\u003cbr>是否应当从“机构名称比较”转向“信息—咨询—决策—协调—执行—监督—责任”的完整功能链条比较？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条承接第4条关于国家安全领导体制的规定，以职责列举的方式明确中央国家安全领导机构的主要职能。第4条回答“\u003cstrong>按照什么领导体制开展国家安全工作\u003c/strong>”，第5条则进一步回答“\u003cstrong>中央国家安全领导机构具体负责什么\u003c/strong>”。现行《国家安全法》第5条仍保持上述规定。\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 2013年：设立国家安全委员会的制度部署\u003c/h4>\n\u003cp>2013年党的十八届三中全会提出设立国家安全委员会，完善国家安全体制和国家安全战略。\n这一制度安排与国家安全事务日益呈现综合性、跨领域和跨部门特征密切相关。政治、军事、外交、经济、科技、社会等领域的安全问题可能相互影响，需要在中央层面形成能够统筹重大国家安全事务的决策和协调机制。\n因此，设立国家安全委员会，其制度重点在于建立\u003cstrong>国家安全重大事项的中央决策和统筹协调机制\u003c/strong>。\u003c/p>\n\u003ch4>2. 2014年：中央国家安全委员会的机构定位进一步明确\u003c/h4>\n\u003cp>2014年1月24日，中共中央政治局会议研究决定中央国家安全委员会设置，并明确中央国家安全委员会是\u003cstrong>中共中央关于国家安全工作的决策和议事协调机构\u003c/strong>，向中央政治局、中央政治局常务委员会负责，统筹协调涉及国家安全的重大事项和重要工作。\n这一机构定位已经体现出后来《国家安全法》第5条的两个核心概念：\n\u003cstrong>决策和议事协调 + 统筹重大事项和重要工作。\u003c/strong>\n2014年总体国家安全观提出以后，国家安全工作的领域进一步扩展，建立跨领域统筹机制的重要性也更加突出。\u003c/p>\n\u003ch4>3. 2015年：中央国家安全领导机构职责进入法律文本\u003c/h4>\n\u003cp>2015年《国家安全法》在第4条确立国家安全领导原则和领导体制后，第5条进一步以法律形式规定中央国家安全领导机构的主要职责，包括：\u003c/p>\n\u003col>\n\u003cli>国家安全工作的决策和议事协调；\u003c/li>\n\u003cli>研究制定、指导实施国家安全战略和有关重大方针政策；\u003c/li>\n\u003cli>统筹协调国家安全重大事项和重要工作；\u003c/li>\n\u003cli>推动国家安全法治建设。\n由此形成：\u003cstrong>领导体制 → 中央领导机构 → 具体职责\u003c/strong>这一组织规范结构。\u003c/li>\n\u003c/ol>\n\u003ch4>4. 制度意义：国家安全领导由原则要求进一步转化为具体职责\u003c/h4>\n\u003cp>第4条所规定的“集中统一、高效权威”仍然属于领导体制层面的总体要求。第5条则进一步明确中央国家安全领导机构需要承担哪些工作，使领导体制具有较为具体的组织法内容。\n因此，第4条与第5条可以简化为：\n\u003cstrong>第4条：建立什么样的国家安全领导体制\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第5条：中央国家安全领导机构具体负责什么\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，负责国家安全工作的“决策和议事协调”\u003c/h4>\n\u003cp>“决策和议事协调”是本条首先规定的职责，也是理解中央国家安全领导机构性质的关键。\n其中，“决策”主要指向国家安全领域具有全局性、战略性和重大性的事项；“议事协调”则强调对涉及多个部门、领域或者地区的国家安全事务进行研究、协调和统筹。\n现代国家安全问题往往具有明显的跨领域特征。例如，一个重大科技安全问题可能同时涉及产业、经济、军事、网络和数据安全。如果完全由单一部门独立处理，可能难以形成整体判断。\n因此，中央国家安全领导机构的重要功能在于将分散于不同领域的信息、判断和政策需求纳入统一的决策协调框架。\n这里需要注意：&gt; \u003cstrong>决策和议事协调并不意味着中央国家安全领导机构直接办理所有国家安全事务。\u003c/strong>\n具体国家安全工作仍由有关国家机关和部门依照法律规定的职责实施。\u003c/p>\n\u003chr>\n\u003ch4>第二，研究制定并指导实施国家安全战略和有关重大方针政策\u003c/h4>\n\u003cp>第二项职责涉及国家安全工作的\u003cstrong>战略层面\u003c/strong>。\n条文使用了两个不同的动词：&gt; \u003cstrong>研究制定 + 指导实施\u003c/strong>\n这说明中央国家安全领导机构的职责不仅包括国家安全战略和重大方针政策的形成，也包括推动其进入实施阶段。\n这一职责与第6条具有直接联系。\n第6条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>国家制定并不断完善国家安全战略，全面评估国际、国内安全形势，明确国家安全战略的指导方针、中长期目标、重点领域的国家安全政策、工作任务和措施。\n因此：\u003c/p>\n\u003c/blockquote>\n\u003cul>\n\u003cli>\u003cstrong>第5条主要解决“由谁负责国家安全战略工作”；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第6条主要解决“国家安全战略应当包含什么以及如何完善”。\u003c/strong>\n战略形成后，还需要进一步进入执行阶段。\n第46条规定建立国家安全工作督促检查和责任追究机制，以确保国家安全战略和重大部署贯彻落实；第47条规定各部门、各地区应当采取有效措施贯彻实施国家安全战略。\n由此可以形成较完整的战略运行链条：\n\u003cstrong>研究制定战略\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>明确战略内容\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>指导实施战略\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>部门和地区具体贯彻\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>督促检查与责任落实\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>这一链条说明，《国家安全法》中的国家安全战略能够通过后续制度与具体国家机关的职责相连接。\u003c/p>\n\u003chr>\n\u003ch4>第三，统筹协调国家安全重大事项和重要工作\u003c/h4>\n\u003cp>“统筹协调”与第4条规定的“集中统一”直接衔接。国家安全事项并非都需要由中央国家安全领导机构协调。本条特别使用“\u003cstrong>重大事项和重要工作\u003c/strong>”作为限定，说明中央层面的统筹具有重点性。\n通常而言，越是具有以下特点的国家安全事务，越具有中央统筹的现实必要性：\u003c/p>\n\u003cul>\n\u003cli>涉及多个安全领域；\u003c/li>\n\u003cli>涉及多个中央部门；\u003c/li>\n\u003cli>涉及中央和地方之间的协调；\u003c/li>\n\u003cli>涉及军地关系；\u003c/li>\n\u003cli>具有全局性或者战略性影响。\u003c/li>\n\u003c/ul>\n\u003cp>这一职责在第四章得到进一步制度化。\n第45条规定国家建立国家安全重点领域工作协调机制；第48条规定跨部门会商工作机制；第49条规定中央与地方之间、部门之间、军地之间以及地区之间的协同联动机制。\n因此，可以将第5条的“统筹协调”理解为一种上位的组织要求，而第四章进一步建立不同类型的工作协调机制。\u003c/p>\n\u003cp>可以简化为：\u003c/p>\n\u003cp>\u003cstrong>中央总体统筹\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>重点领域协调\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>跨部门会商\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>中央地方、部门、军地和地区协同联动\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>第四，“推动国家安全法治建设”将制度建设纳入领导机构职责\u003c/h4>\n\u003cp>本条最后规定“推动国家安全法治建设”。\n这一职责具有重要意义，因为它说明中央国家安全领导机构的工作并不局限于应对具体风险或者处理重大安全事件，还包括国家安全制度本身的建设和完善。\n第70条进一步规定：\u003c/p>\n\u003cblockquote>\n\u003cp>国家健全国家安全法律制度体系，推动国家安全法治建设。\n因此，第5条与第70条形成明显的体系联系：\u003c/p>\n\u003c/blockquote>\n\u003cul>\n\u003cli>\u003cstrong>第5条：\u003c/strong> 从中央国家安全领导机构的职责角度规定“推动国家安全法治建设”；\u003c/li>\n\u003cli>\u003cstrong>第70条：\u003c/strong> 从国家安全保障体系角度规定健全国家安全法律制度体系。\n两条共同说明，国家安全能力不仅表现为情报、资源、技术和应急处置能力，也包括建立和完善国家安全法律制度的能力。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 本条首先属于组织职责规范，兼具授权与责任指向\u003c/h4>\n\u003cp>第5条首先是一项\u003cstrong>组织法意义上的职责规范\u003c/strong>。它明确中央国家安全领导机构可以并应当在哪些事项上发挥作用，因此具有双重意义：\n一方面，它确定该机构开展国家安全决策、协调、战略和法治建设工作的职责依据；\n另一方面，它也明确这些重大国家安全事项在制度上应当有相应的决策、协调和推进主体。\n因此，在研究国家安全制度运行时，可以根据第5条进一步追问：\u003c/p>\n\u003cul>\n\u003cli>重大国家安全事项是否进入相应的决策协调机制；\u003c/li>\n\u003cli>国家安全战略是否形成相应实施安排；\u003c/li>\n\u003cli>跨领域事务是否建立必要的统筹机制；\u003c/li>\n\u003cli>国家安全法治建设是否形成制度性推进。\n但需要注意：\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>职责规范并不当然等于责任追究规范。\u003c/strong>\n第5条规定“负责什么”，并不能单独推导出违反职责以后承担何种具体法律责任。责任主体、构成条件和责任方式仍需要依据第46条等责任机制以及其他具体法律规范判断。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>2. 领导机构的组织职责与具体国家机关的法定职权应当区分\u003c/h4>\n\u003cp>第5条规定的是中央国家安全领导机构的决策、协调和统筹职责，并未规定完整的行政执法、刑事侦查或者强制措施权限。\n与之相比，《国家安全法》第42条明确规定国家安全机关、公安机关依法搜集涉及国家安全的情报信息，并依法行使侦查、拘留、预审、执行逮捕以及法律规定的其他职权；第43条又明确要求国家机关及其工作人员严格依法履行职责，不得超越、滥用职权。\n因此，应当区分：\n\u003cstrong>中央领导机构：决策、议事、战略、统筹协调\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>有关国家机关：依照法律承担具体国家安全职责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>执法和强制措施：必须具有具体法律授权\u003c/strong>\n由此可以形成一个重要解释规则：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>议事协调权限不能直接转化为行政执法或者强制措施权限。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>3. “推动国家安全法治建设”与行使国家立法权不是同一概念\u003c/h4>\n\u003cp>第5条使用的是“\u003cstrong>推动\u003c/strong>国家安全法治建设”，而不是赋予中央国家安全领导机构制定国家法律的权力。\n现行宪法第58条明确规定，全国人民代表大会和全国人民代表大会常务委员会行使国家立法权；第62条、第67条进一步分别规定全国人大和全国人大常委会的有关立法权限。\n因此，“推动国家安全法治建设”可以包括：\u003c/p>\n\u003cul>\n\u003cli>研究国家安全法治建设中的重大问题；\u003c/li>\n\u003cli>推动国家安全法律制度不断健全；\u003c/li>\n\u003cli>协调国家安全领域的制度建设；\u003c/li>\n\u003cli>推动有关制度需求进入法定立法和规范制定程序。\u003c/li>\n\u003c/ul>\n\u003cp>但这些研究、推动和协调活动不能替代宪法和法律规定的正式立法主体与立法程序。可以简化为：&gt; \u003cstrong>推动立法和法治建设 ≠ 直接行使国家立法权。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>4. “统筹协调”需要通过法定职责完成向具体行政行为的转化\u003c/h4>\n\u003cp>第5条尤其值得研究的问题，是中央层面的决策协调如何进入具体执行阶段。\n国家安全领导机构可以进行重大事项决策、战略指导和跨部门协调，但最终涉及具体行政管理、执法、司法或者其他国家行为时，仍需要由具有相应法定职责的机关依法作出。\n这一过程可以概括为：\u003c/p>\n\u003cp>\u003cstrong>中央决策和协调\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>战略、政策和重大部署\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>按照法定职责分解任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>有关机关依法形成具体决定\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>实施、监督与责任追究\u003c/strong>\u003c/p>\n\u003cp>这一结构非常重要，因为它把第4条的“集中统一”与第43条的“严格依法履行职责”连接起来。换言之：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>集中统一解决重大事项如何形成整体决策，法定职权解决具体决定由谁依法作出。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>5. 比较法的重点应当放在“功能链条”，而不只是机构名称\u003c/h4>\n\u003cp>〔比较法〕《国家安全法释义》外国相关国家安全机构概括为咨询、协调、决策等不同功能类型，并指出不同功能之间可能存在交叉。这一比较思路具有启发意义。\n不同国家可能都设有名称类似“国家安全委员会”的机构，但机构名称相同并不意味着其法律地位、职权范围和运行方式相同。更有意义的比较是：\n\u003cstrong>谁提供信息和专业意见\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>谁提出政策建议\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>谁作出最终决定\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>谁负责组织协调\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>谁依法具体实施\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>谁承担相应责任\u003c/strong>\u003c/p>\n\u003cp>例如，美国国家安全委员会主要围绕总统形成国家安全政策咨询和跨部门协调机制。比较研究应进一步考察其宪制地位、与总统及行政部门之间的关系，而不宜仅因中美均存在“国家安全委员会”而进行制度等同。\n因此：&gt; \u003cstrong>比较国家安全组织制度，应当比较功能、权限和责任结构，而不应只比较机构名称。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第4条、第5条和第6条的关系\u003c/h4>\n\u003cp>这三条连续规定，但功能明显不同。\u003c/p>\n\u003ch4>第4条：领导体制\u003c/h4>\n\u003cp>回答：&gt; \u003cstrong>国家安全工作由谁领导，应建立什么样的领导体制？\u003c/strong>\n核心词：\u003cstrong>党的领导 + 集中统一、高效权威\u003c/strong>\u003c/p>\n\u003ch5>第5条：领导机构职责\u003c/h5>\n\u003cp>回答：&gt; \u003cstrong>中央国家安全领导机构具体负责什么？\u003c/strong>\n核心词：\u003cstrong>决策协调 + 战略政策 + 重大事项统筹 + 法治建设\u003c/strong>\u003c/p>\n\u003ch5>第6条：国家安全战略\u003c/h5>\n\u003cp>回答：&gt; \u003cstrong>国家安全战略本身应当如何制定和完善，主要包括什么内容？\u003c/strong>\n核心词：\u003cstrong>形势评估 + 指导方针 + 中长期目标 + 重点领域政策 + 工作任务和措施\u003c/strong>\u003c/p>\n\u003cp>因此可以记忆为：\n\u003cstrong>第4条：体制\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第5条：主体与职责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：战略\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（二）国家安全战略的制度闭环\u003c/h4>\n\u003cp>第5条与第6条、第46条、第47条共同形成较为完整的战略机制：\n\u003cstrong>第5条：研究制定、指导实施战略\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：规定战略内容并不断完善\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第47条：部门、地区采取有效措施贯彻实施\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第46条：督促检查和责任追究\u003c/strong>\u003c/p>\n\u003cp>因此，在学习时不宜孤立理解第5条中的“指导实施”。\u003c/p>\n\u003cp>其真正含义需要放在后续制度中理解：&gt; \u003cstrong>战略制定之后，还存在任务落实、贯彻实施、监督检查和责任机制。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（三）国家安全法治建设的制度闭环\u003c/h4>\n\u003cp>本条“推动国家安全法治建设”与第五章也形成体系联系：\u003c/p>\n\u003cp>\u003cstrong>第5条：中央国家安全领导机构推动法治建设\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第70条：国家健全国家安全法律制度体系\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>具体立法：按照宪法和《立法法》等规定的权限和程序制定、修改\u003c/strong>\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全法治建设本身也必须通过法治方式推进。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（四）区分四个容易混淆的概念\u003c/h4>\n\u003ch5>1. 中央国家安全领导机构\u003c/h5>\n\u003cp>本条中的职责主体。主要承担：\u003cstrong>决策、议事协调、战略、重大事项统筹、法治建设推动。\u003c/strong>\u003c/p>\n\u003ch5>2. 国家安全领导体制\u003c/h5>\n\u003cp>第4条规定的国家安全工作整体组织结构。核心特征：\u003cstrong>集中统一、高效权威。\u003c/strong>\u003c/p>\n\u003ch5>3. 国家安全机关\u003c/h5>\n\u003cp>依法承担特定国家安全专门职责的国家机关，具有有关法律明确规定的具体职权。\u003c/p>\n\u003ch5>4. 国家安全工作协调机制\u003c/h5>\n\u003cp>第45、48、49条等规定的重点领域协调、跨部门会商以及中央地方、部门、军地、地区之间的协同联动机制。\n因此：&gt; \u003cstrong>领导体制 ≠ 中央领导机构 ≠ 国家安全机关 ≠ 工作协调机制\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（五）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：中央国家安全领导机构就是一个具体国家安全执法机关。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第5条主要规定其决策、议事协调、战略、统筹和法治建设职责。具体执法职权需要依据有关机关的专门法律规定。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：“负责国家安全工作的决策”意味着所有国家安全事项都由中央国家安全领导机构直接作出决定。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 本条应结合“重大事项”“重要工作”以及第三章国家机关职责规定理解。中央层面承担总体和重大事项决策协调，具体事项仍由有关机关依法处理。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：“研究制定国家安全战略”与“国家制定国家安全战略”相互矛盾。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第5条从中央国家安全领导机构职责角度规定“研究制定、指导实施”，第6条则从国家安全制度角度规定战略的制定、评估、内容和完善要求。二者属于不同规范层次。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：“推动国家安全法治建设”等于中央国家安全领导机构可以直接制定法律。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> “推动”属于研究、协调和制度建设职责。国家立法权以及法律的制定、修改和解释仍须按照宪法规定的主体、权限和程序进行。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：第5条已经规定了国家安全战略的全部实施机制。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第5条只规定“指导实施”。战略的具体落实还需要结合第46条的督促检查和责任追究机制、第47条的部门和地区贯彻实施义务以及其他工作机制理解。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>议事协调结论如何转化为具有法律意义的具体决定？\u003c/strong>\u003cbr>中央层面的重大国家安全决策和协调意见进入具体执行后，应如何通过各国家机关的法定职责和程序实现？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“决策”和“议事协调”之间应如何区分？\u003c/strong>\u003cbr>哪些事项属于中央层面的最终决策，哪些事项主要体现跨部门协调？二者在制度运行中如何衔接？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全战略的法律性质是什么？\u003c/strong>\u003cbr>国家安全战略如何影响有关机关的行政决策和具体行为？其与法律、行政法规、部门规章以及政策文件之间是什么关系？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何评价国家安全战略的实施情况？\u003c/strong>\u003cbr>第46条建立督促检查和责任追究机制后，应当以何种标准判断有关部门和地区是否充分履行贯彻实施国家安全战略的职责？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“推动国家安全法治建设”应当包括哪些具体制度活动？\u003c/strong>\u003cbr>除推动法律制定和修改外，是否还包括规范协调、执法机制建设、程序完善、权利保障以及法律实施评估等内容？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>跨部门国家安全事务如何实现责任可追溯？\u003c/strong>\u003cbr>当一个重大事项经过多个部门共同研判和协调后，最终具体决定由谁作出、事实依据由谁审查、执行责任由谁承担，应如何形成清晰的责任链条？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全机构比较法研究应选择什么比较单位？\u003c/strong>\u003cbr>是否应当从“机构名称比较”转向“信息—咨询—决策—协调—执行—监督—责任”的完整功能链条比较？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":6,"label":"第六条","title":"国家安全战略","lawText":"国家制定并不断完善国家安全战略，全面评估国际、国内安全形势，明确国家安全战略的指导方针、中长期目标、重点领域的国家安全政策、工作任务和措施。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>持续义务：\u003c/strong> 国家不仅要制定国家安全战略，还应“不断完善”，说明战略具有持续调整和动态更新的特征。\u003c/li>\n\u003cli>\u003cstrong>认识基础：\u003c/strong> 战略制定以“全面评估国际、国内安全形势”为前提，要求同时观察外部环境和内部安全条件。\u003c/li>\n\u003cli>\u003cstrong>五项内容：\u003c/strong> 战略应明确\u003cstrong>指导方针、中长期目标、重点领域国家安全政策、工作任务和措施\u003c/strong>，形成从总体方向到具体行动的层次结构。\u003c/li>\n\u003cli>\u003cstrong>制度闭环：\u003c/strong> 第5条规定战略工作的领导职责，第6条规定战略形成与内容，第46—47条进一步建立督促落实和部门、地区贯彻实施机制。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 国家安全战略能够确定优先方向并指导行动，但战略本身不能替代法律授权；涉及限制公民、组织权利的具体措施，仍须具有相应的法律依据。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家制定并不断完善国家安全战略，全面评估国际、国内安全形势，明确国家安全战略的指导方针、中长期目标、重点领域的国家安全政策、工作任务和措施。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>持续义务：\u003c/strong> 国家不仅要制定国家安全战略，还应“不断完善”，说明战略具有持续调整和动态更新的特征。\u003c/li>\n\u003cli>\u003cstrong>认识基础：\u003c/strong> 战略制定以“全面评估国际、国内安全形势”为前提，要求同时观察外部环境和内部安全条件。\u003c/li>\n\u003cli>\u003cstrong>五项内容：\u003c/strong> 战略应明确\u003cstrong>指导方针、中长期目标、重点领域国家安全政策、工作任务和措施\u003c/strong>，形成从总体方向到具体行动的层次结构。\u003c/li>\n\u003cli>\u003cstrong>制度闭环：\u003c/strong> 第5条规定战略工作的领导职责，第6条规定战略形成与内容，第46—47条进一步建立督促落实和部门、地区贯彻实施机制。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 国家安全战略能够确定优先方向并指导行动，但战略本身不能替代法律授权；涉及限制公民、组织权利的具体措施，仍须具有相应的法律依据。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家制定并不断完善国家安全战略，全面评估国际、国内安全形势，明确国家安全战略的指导方针、中长期目标、重点领域的国家安全政策、工作任务和措施。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全战略 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定国家安全战略的\u003cstrong>制定与完善、形势评估以及基本内容\u003c/strong>。与第5条侧重中央国家安全领导机构“研究制定、指导实施”国家安全战略不同，第6条从国家安全制度本身出发，确立国家制定和持续完善国家安全战略的要求，并规定战略形成应当建立在国际、国内安全形势评估基础之上。现行《国家安全法》第6条仍保持这一规定。\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 2015年《国家安全战略纲要》先于本法通过\u003c/h4>\n\u003cp>国家安全战略制度在《国家安全法》制定前已经进入实践层面。\n2015年1月23日，中共中央政治局会议审议通过《国家安全战略纲要》。会议指出，面对国际形势变化、国内改革发展以及各类安全风险，制定和实施国家安全战略纲要具有现实必要性。该战略纲要的形成早于2015年7月《国家安全法》的通过，说明国家安全战略实践与综合性国家安全立法是在相互衔接的过程中逐步形成的。\u003c/p>\n\u003ch4>2. 草案原将国家安全战略置于具体制度章节\u003c/h4>\n\u003cp>国家安全法草案原在\u003cstrong>第四章第二节\u003c/strong>规定“国家安全战略”。\n2015年4月20日关于草案修改情况的汇报提出，国家安全战略涉及一个时期维护国家安全的方针政策和目标任务，属于维护国家安全的\u003cstrong>顶层设计和管全局的安排\u003c/strong>，因此建议将制定国家安全战略的规定从第四章移至总则。这一调整具有明显的体系意义：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全战略由一项具体国家安全制度，上升为统摄整部法律实施的总则性制度。\u003c/strong>\n换言之，战略并不只是第四章众多工作机制中的一种，而是国家安全任务、国家机关职责和具体国家安全制度运行的重要总体依据。\u003c/p>\n\u003c/blockquote>\n\u003ch4>3. 前移总则的同时进一步明确战略内容\u003c/h4>\n\u003cp>草案修改并非只是改变条文位置。根据立法释义书记载，在将国家安全战略前移至总则的同时，还进一步明确了战略的主要内容，包括：\u003c/p>\n\u003cul>\n\u003cli>指导方针；\u003c/li>\n\u003cli>中长期目标；\u003c/li>\n\u003cli>重点领域的国家安全政策；\u003c/li>\n\u003cli>工作任务；\u003c/li>\n\u003cli>措施。\n同时增加“全面评估国际、国内安全形势”的要求，最终形成现行第6条的基本结构。\n因此，本条的形成过程可以概括为：\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>战略实践先行\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>草案设置专节\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>认识到其顶层设计性质\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>前移总则\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>细化形势评估和战略内容\u003c/strong>\u003c/p>\n\u003ch4>4. 后续实践进一步体现“不断完善”的动态要求\u003c/h4>\n\u003cp>2021年11月18日，中共中央政治局会议审议《国家安全战略（2021—2025年）》。公开材料显示，该战略进一步对相应时期国家安全工作作出总体部署。\n这一材料可以作为理解第6条“不断完善国家安全战略”的后续实践例证。\n但需要注意时间限定：&gt; \u003cstrong>《国家安全战略（2021—2025年）》是具有明确期间范围的历史材料。\u003c/strong>\n因此，在2026年的学习和研究中，可以用它说明国家安全战略持续制定、调整和完善的实践，但不宜将其表述为仍然覆盖当前时期的现行五年战略。\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，“制定并不断完善”表明国家安全战略具有动态性\u003c/h4>\n\u003cp>第6条并非只规定国家“制定”国家安全战略，而是在其后特别增加“\u003cstrong>不断完善\u003c/strong>”。\n这意味着，国家安全战略不是制定完成后长期保持不变的静态文本。\n国家安全环境本身处于持续变化之中：\u003c/p>\n\u003cul>\n\u003cli>国际安全格局可能变化；\u003c/li>\n\u003cli>新技术可能产生新的风险和能力；\u003c/li>\n\u003cli>国家利益和发展阶段可能发生变化；\u003c/li>\n\u003cli>原有安全政策实施后可能产生新的经验和问题。\n因此，国家安全战略需要根据安全环境和国家实际情况不断调整。\u003c/li>\n\u003c/ul>\n\u003cp>从规范结构看，可以将其理解为：\u003cstrong>战略制定 → 战略实施 → 环境和效果变化 → 重新评估 → 战略完善\u003c/strong>\u003c/p>\n\u003cp>但需要注意：&gt; \u003cstrong>“不断完善”不等于法律规定必须每隔固定期限重新制定一次国家安全战略。\u003c/strong>\n第6条本身并未规定年度、五年或者其他固定的战略更新周期。因此，应当区分“持续完善的法律要求”与“具体战略文件自行确定的时间范围”。\u003c/p>\n\u003chr>\n\u003ch4>第二，“全面评估国际、国内安全形势”是战略形成的认识基础\u003c/h4>\n\u003cp>国家安全战略首先建立在对安全形势的判断之上。第6条明确要求同时评估：\n\u003cstrong>国际安全形势 + 国内安全形势\u003c/strong>\n这一规定与第8条统筹内部安全和外部安全的要求具有体系上的联系。\n国际环境可能影响国家主权、经济运行、能源资源、产业链、科技发展以及海外利益；国内经济社会发展、技术能力、资源条件和社会运行状况同样构成国家安全战略形成的重要背景。\n因此，国家安全战略不能只根据外部威胁制定，也不能只从国内问题出发，而需要进行综合判断。\n〔笔记分析〕进一步而言，战略评估至少可以关注两个方向：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>风险和威胁：\u003c/strong> 面临哪些现实或者潜在的安全风险；\u003c/li>\n\u003cli>\u003cstrong>自身条件：\u003c/strong> 国家具有何种应对能力、资源条件和发展需求。\n前者回答“面临什么问题”，后者回答“具备什么条件解决问题”。\n需要说明的是，“风险—能力”属于根据本条进行的分析性归纳，并非第6条逐字列明的两项法定评估程序。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第三，国家安全战略具有从总体方向到具体行动的层次结构\u003c/h4>\n\u003cp>第6条列举了国家安全战略应当明确的基本内容。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>战略内容\u003c/th>\n\u003cth>基本功能\u003c/th>\n\u003cth>主要回答的问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>指导方针\u003c/strong>\u003c/td>\n\u003ctd>确定国家安全战略的总体方向和基本取向\u003c/td>\n\u003ctd>按照什么原则行动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>中长期目标\u003c/strong>\u003c/td>\n\u003ctd>确定一定时期希望实现的国家安全状态\u003c/td>\n\u003ctd>希望达到什么目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>重点领域国家安全政策\u003c/strong>\u003c/td>\n\u003ctd>确定重点领域中的政策安排和优先事项\u003c/td>\n\u003ctd>重点在哪里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>工作任务\u003c/strong>\u003c/td>\n\u003ctd>将战略目标转化为需要完成的工作\u003c/td>\n\u003ctd>具体做什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>措施\u003c/strong>\u003c/td>\n\u003ctd>为完成战略任务配置相应行动方式\u003c/td>\n\u003ctd>如何实现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>因此，本条并非只要求战略提出抽象目标，而是要求战略形成从总体方向到实际行动的完整结构：\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>指导方针\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>中长期目标\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>重点领域政策\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>工作任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>具体措施\u003c/strong>\u003c/p>\n\u003cp>这一结构使国家安全战略具有连接总体国家安全观与具体国家安全工作的功能。\u003c/p>\n\u003chr>\n\u003ch4>第四，“中长期目标”体现战略与日常安全工作的区别\u003c/h4>\n\u003cp>“中长期目标”是国家安全战略区别于一般工作部署的重要特征。\n国家安全战略并不只是针对某一次风险或者某一项短期任务作出安排，而需要从较长时间尺度判断：\u003c/p>\n\u003cul>\n\u003cli>国家面临什么样的战略安全环境；\u003c/li>\n\u003cli>哪些国家安全能力需要持续建设；\u003c/li>\n\u003cli>哪些重点领域需要提前布局；\u003c/li>\n\u003cli>希望形成何种稳定、持续的国家安全状态。\n因此，国家安全战略具有较强的\u003cstrong>前瞻性和统筹性\u003c/strong>。\n而具体风险预案、应急处置或者阶段性工作方案，则更直接面对具体风险和现实任务。\n这也有助于理解第6条与第四章有关风险制度之间的区别。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第五，战略实施需要后续法律制度形成执行闭环\u003c/h4>\n\u003cp>第6条主要规定战略本身，并没有穷尽战略如何实施。《国家安全法》通过其他条文建立相应的实施机制。\n第5条规定中央国家安全领导机构\u003cstrong>研究制定、指导实施国家安全战略\u003c/strong>；第46条规定建立国家安全工作督促检查和责任追究机制，以确保国家安全战略和重大部署贯彻落实；第47条进一步要求各部门、各地区采取有效措施贯彻实施国家安全战略。\n因此，可以形成一条较为清晰的战略运行链条：\u003c/p>\n\u003cp>\u003cstrong>第5条：研究制定、指导实施\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：评估形势、确定战略内容\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第47条：各部门、各地区贯彻实施\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第46条：督促检查与责任追究\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>重新评估并不断完善战略\u003c/strong>\u003c/p>\n\u003cp>这使国家安全战略从规划性文本进一步进入实际国家安全工作。\u003c/p>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 国家安全战略具有重要指导作用，但不是具体强制权力的独立来源〔笔记分析〕\u003c/h4>\n\u003cp>国家安全战略能够：\u003c/p>\n\u003cul>\n\u003cli>确定国家安全工作的优先方向；\u003c/li>\n\u003cli>引导重点领域政策；\u003c/li>\n\u003cli>协调不同部门行动；\u003c/li>\n\u003cli>影响资源和能力建设；\u003c/li>\n\u003cli>为具体国家安全制度的实施提供战略背景。\n但应当区分\u003cstrong>战略依据\u003c/strong>与\u003cstrong>法律依据\u003c/strong>。\n国家安全战略可以说明国家为什么优先处理某一风险，也可以指导有关国家机关确定工作重点，但如果国家机关进一步采取搜查、扣押、限制活动、行政处罚或者其他影响公民和组织权利的具体措施，仍须查明相应的法律授权、实体条件和程序要求。\n因此：&gt; \u003cstrong>战略可以指导权力行使，但不能自行创设法律未规定的公权力。\u003c/strong>\n这一解释也与第43条要求国家机关及其工作人员严格依法履行职责、不得超越和滥用职权相一致。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>2. 国家安全战略与国家安全风险评估属于不同层次\u003c/h4>\n\u003cp>第6条要求“全面评估国际、国内安全形势”，第四章第56条则另外规定国家建立国家安全风险评估机制，定期开展各领域国家安全风险调查评估，并要求有关部门定期向中央国家安全领导机构提交风险评估报告。\n二者存在联系，但不能简单等同。可以初步区分：\n\u003cstrong>第6条的形势评估：\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>服务于国家安全战略；\u003c/li>\n\u003cli>具有总体性和宏观性；\u003c/li>\n\u003cli>同时考察国际、国内安全形势。\n\u003cstrong>第56条的风险评估：\u003c/strong>\u003c/li>\n\u003cli>属于第四章具体国家安全制度；\u003c/li>\n\u003cli>具有常态化、制度化特征；\u003c/li>\n\u003cli>重点围绕各领域国家安全风险展开。\n二者可以形成互动：\n\u003cstrong>具体风险评估提供信息\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>综合形成国家安全形势判断\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>影响国家安全战略制定和调整\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>3. “不断完善”可以形成一个动态战略分析框架〔笔记分析〕\u003c/h4>\n\u003cp>结合第6条与第46、47、56条，可以将国家安全战略的运行归纳为：\n\u003cstrong>形势识别 → 目标选择 → 政策和任务安排 → 实施 → 反馈评估 → 战略调整\u003c/strong>\n这一框架能够帮助分析一个国家安全战略是否真正形成动态治理过程。\n其中：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>形势识别\u003c/strong>对应国际、国内安全形势评估；\u003c/li>\n\u003cli>\u003cstrong>目标选择\u003c/strong>对应指导方针和中长期目标；\u003c/li>\n\u003cli>\u003cstrong>政策安排\u003c/strong>对应重点领域国家安全政策、任务和措施；\u003c/li>\n\u003cli>\u003cstrong>实施\u003c/strong>对应各部门、各地区贯彻战略；\u003c/li>\n\u003cli>\u003cstrong>反馈\u003c/strong>来自风险评估、督促检查以及现实安全形势变化；\u003c/li>\n\u003cli>\u003cstrong>调整\u003c/strong>则体现“不断完善”。\n需要注意：\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>这是依据多个条文归纳形成的分析模型，不是法律规定\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>4. 战略调整与执行措施调整需要区分〔笔记分析〕\u003c/h4>\n\u003cp>并非每一次安全环境变化都需要重新制定国家安全战略。国家安全战略通常确定较长时期的基本判断、总体方向和中长期目标，而具体政策和执行措施可以根据短期变化进行调整。\n因此，在判断国家安全战略是否需要改变时，可以区分两个层次：\n\u003cstrong>如果总体安全环境、重大国家利益或者中长期目标发生明显变化\u003c/strong>\u003cbr>→ 可能需要调整战略本身。\u003c/p>\n\u003cp>\u003cstrong>如果总体目标基本稳定，只是具体风险、技术条件或者实施环境发生变化\u003c/strong>\u003cbr>→ 可以主要调整政策、工作任务或者具体措施。\u003c/p>\n\u003cp>这一分析有助于解释为什么第6条既规定相对稳定的“中长期目标”，又要求“不断完善”战略。\u003c/p>\n\u003chr>\n\u003ch4>5. 比较法：美国国家安全战略报告强调制定主体、报告周期与国会说明\u003c/h4>\n\u003cp>美国现行《美国法典》第50编第3043节源自《1947年国家安全法》第108节，规定总统向国会提交国家安全战略报告，并规定报告应当说明国家安全利益和目标、实现战略所需要的外交与国防能力、国家力量的短期和长期运用以及现有能力能否支撑战略等内容；该条同时规定有关报告具有机密和非机密形式。\n这一制度与我国第6条可以围绕以下问题进行功能比较：\u003c/p>\n\u003cul>\n\u003cli>战略由谁制定；\u003c/li>\n\u003cli>战略包含什么内容；\u003c/li>\n\u003cli>是否具有明确的评估和更新周期；\u003c/li>\n\u003cli>战略向谁进行说明或者报告；\u003c/li>\n\u003cli>如何判断目标与国家能力是否匹配；\u003c/li>\n\u003cli>如何处理战略信息的公开与保密。\n但两种制度的规范结构并不相同。\u003c/li>\n\u003c/ul>\n\u003cp>尤其需要注意：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>我国《国家安全法》第6条没有规定美国法意义上的年度向立法机关提交国家安全战略报告的义务。\u003c/strong>\n因此，美国有关年度报告、提交时间和报告形式的规定可以作为比较法材料，但不能作为解释我国第6条程序要求的直接依据。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第5条与第6条的区别\u003c/h4>\n\u003cp>两条都出现“国家安全战略”，但规范重点不同。\u003c/p>\n\u003ch5>第5条：谁负责战略工作\u003c/h5>\n\u003cp>核心表述：\u003c/p>\n\u003cblockquote>\n\u003cp>“研究制定、指导实施国家安全战略”\n回答的是：\u003cstrong>谁在中央层面承担战略工作的领导和协调职责。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>第6条：战略如何形成、包括什么\u003c/h5>\n\u003cp>核心表述：\u003c/p>\n\u003cblockquote>\n\u003cp>“制定并不断完善”“全面评估”“明确……”\n回答的是：\u003cstrong>国家安全战略应当建立在什么基础上，以及战略应包含哪些主要内容。\u003c/strong>\n因此：\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>第5条：主体和职责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：战略形成和内容\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（二）区分四个相关概念\u003c/h4>\n\u003ch5>1. 国家安全战略\u003c/h5>\n\u003cp>第6条规定。主要解决国家安全工作的：\u003cstrong>总体方向 + 中长期目标 + 重点政策 + 工作任务和措施\u003c/strong>\u003c/p>\n\u003ch5>2. 国家安全重大方针政策\u003c/h5>\n\u003cp>第5条与国家安全战略并列规定。政策通常比总体战略更加具体，是将战略要求转化为国家安全工作安排的重要方式。\u003c/p>\n\u003ch5>3. 国家安全风险评估\u003c/h5>\n\u003cp>第56条规定。主要通过定期调查评估具体国家安全风险，为国家安全决策和风险治理提供信息基础。\u003c/p>\n\u003ch5>4. 国家安全风险预案\u003c/h5>\n\u003cp>第55条规定国家制定完善应对各领域国家安全风险预案。预案更直接面向具体风险发生后的预防、应对和处置准备。\n因此，可以简单记忆为：\u003c/p>\n\u003cp>\u003cstrong>战略：确定总体方向\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>政策：落实战略安排\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>风险评估：识别和判断具体风险\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>预案：准备如何应对风险\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（三）国家安全战略的实施闭环\u003c/h4>\n\u003cp>可以将相关条文串联起来：\n\u003cstrong>第5条：研究制定、指导实施战略\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：评估形势，明确战略内容\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第56条：持续提供风险评估信息\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第47条：部门和地区贯彻实施\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第46条：督促检查和责任追究\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：根据形势不断完善\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（四）关于战略公开范围\u003c/h4>\n\u003cp>第6条本身没有规定国家安全战略应当以何种形式公开，也没有规定国家安全战略全部属于保密信息。因此，不能从本条推出：\u003c/p>\n\u003cblockquote>\n\u003cp>“国家安全战略全文必须公开”\u003c/p>\n\u003c/blockquote>\n\u003cp>也不能反向推出：\u003c/p>\n\u003cblockquote>\n\u003cp>“国家安全战略及其全部信息当然保密”。\u003c/p>\n\u003c/blockquote>\n\u003cp>具体战略信息能否公开、公开至何种程度，应根据相关国家秘密、政府信息公开以及具体文件的性质分别判断。\n比较而言，美国第50编第3043节明确要求国家安全战略报告具有机密和非机密形式，这恰好说明战略公开程度本身可以由具体制度另外规定。\u003c/p>\n\u003chr>\n\u003ch4>（五）历史比较材料\u003c/h4>\n\u003cp>法工委版本《中华人民共和国国家安全法释义》对美国、俄罗斯、日本等国家安全战略进行了较多介绍。\u003c/p>\n\u003chr>\n\u003ch4>（六）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：国家制定一次国家安全战略以后即可长期不变。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第6条明确规定“制定并不断完善”，说明战略具有动态调整要求。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：“不断完善”意味着国家必须每年重新制定国家安全战略。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第6条没有规定固定更新周期。“不断完善”是一项持续性要求，不等于法定年度更新义务。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：国家安全战略就是对国家安全风险的预测。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 形势评估只是战略形成的基础。国家安全战略还必须明确指导方针、中长期目标、重点领域政策、工作任务和措施。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：战略规定某项工作重要，就当然可以采取必要的强制措施。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 战略确定工作方向，并不能代替具体法律授权。国家机关采取影响公民、组织权利的措施仍须具有明确法律依据。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：第6条已经完整规定了国家安全战略的实施机制。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第6条主要规定战略形成和内容，实施还需要结合第5条、第46条、第47条以及其他国家安全工作机制理解。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：《国家安全战略（2021—2025年）》仍是2026年当前五年战略。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 该文件标题本身限定为2021—2025年。在没有新的可靠材料支持时，应当将其作为此前战略实践材料，而不能延伸其时间效力。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>国家安全战略的法律性质如何界定？\u003c/strong>\u003cbr>它与法律法规、国家安全政策以及具体行政决定之间分别是什么关系？战略能够对具体国家机关产生何种规范性影响？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“不断完善”应当以什么作为战略调整标准？\u003c/strong>\u003cbr>国际环境变化、国家利益变化、风险程度变化以及国家能力变化达到何种程度时，需要调整国家安全战略本身？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>战略调整与执行措施调整如何区分？\u003c/strong>\u003cbr>在中长期目标保持稳定而短期风险快速变化时，应当修改战略，还是主要通过调整重点政策、任务和具体措施予以应对？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何评价国家安全战略的实施效果？\u003c/strong>\u003cbr>除是否完成既定工作任务之外，是否还应评价风险是否降低、安全能力是否提高以及战略目标与资源配置是否匹配？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全风险评估如何进入战略制定过程？\u003c/strong>\u003cbr>第56条形成的各领域风险评估信息，如何汇总并转化为第6条意义上的国际、国内安全形势综合判断？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全战略的公开与保密边界如何确定？\u003c/strong>\u003cbr>战略需要发挥政策引导和社会动员功能，同时又可能涉及敏感安全信息。哪些内容适合公开、哪些内容需要保护，应依据何种规范进行区分？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何建立国家安全战略的比较法分析框架？\u003c/strong>\u003cbr>与其只比较各国战略文件内容，是否更适合围绕“\u003cstrong>制定主体—形势评估—目标设定—能力配置—实施机制—监督反馈—更新机制\u003c/strong>”进行制度比较？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定国家安全战略的\u003cstrong>制定与完善、形势评估以及基本内容\u003c/strong>。与第5条侧重中央国家安全领导机构“研究制定、指导实施”国家安全战略不同，第6条从国家安全制度本身出发，确立国家制定和持续完善国家安全战略的要求，并规定战略形成应当建立在国际、国内安全形势评估基础之上。现行《国家安全法》第6条仍保持这一规定。\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 2015年《国家安全战略纲要》先于本法通过\u003c/h4>\n\u003cp>国家安全战略制度在《国家安全法》制定前已经进入实践层面。\n2015年1月23日，中共中央政治局会议审议通过《国家安全战略纲要》。会议指出，面对国际形势变化、国内改革发展以及各类安全风险，制定和实施国家安全战略纲要具有现实必要性。该战略纲要的形成早于2015年7月《国家安全法》的通过，说明国家安全战略实践与综合性国家安全立法是在相互衔接的过程中逐步形成的。\u003c/p>\n\u003ch4>2. 草案原将国家安全战略置于具体制度章节\u003c/h4>\n\u003cp>国家安全法草案原在\u003cstrong>第四章第二节\u003c/strong>规定“国家安全战略”。\n2015年4月20日关于草案修改情况的汇报提出，国家安全战略涉及一个时期维护国家安全的方针政策和目标任务，属于维护国家安全的\u003cstrong>顶层设计和管全局的安排\u003c/strong>，因此建议将制定国家安全战略的规定从第四章移至总则。这一调整具有明显的体系意义：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全战略由一项具体国家安全制度，上升为统摄整部法律实施的总则性制度。\u003c/strong>\n换言之，战略并不只是第四章众多工作机制中的一种，而是国家安全任务、国家机关职责和具体国家安全制度运行的重要总体依据。\u003c/p>\n\u003c/blockquote>\n\u003ch4>3. 前移总则的同时进一步明确战略内容\u003c/h4>\n\u003cp>草案修改并非只是改变条文位置。根据立法释义书记载，在将国家安全战略前移至总则的同时，还进一步明确了战略的主要内容，包括：\u003c/p>\n\u003cul>\n\u003cli>指导方针；\u003c/li>\n\u003cli>中长期目标；\u003c/li>\n\u003cli>重点领域的国家安全政策；\u003c/li>\n\u003cli>工作任务；\u003c/li>\n\u003cli>措施。\n同时增加“全面评估国际、国内安全形势”的要求，最终形成现行第6条的基本结构。\n因此，本条的形成过程可以概括为：\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>战略实践先行\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>草案设置专节\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>认识到其顶层设计性质\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>前移总则\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>细化形势评估和战略内容\u003c/strong>\u003c/p>\n\u003ch4>4. 后续实践进一步体现“不断完善”的动态要求\u003c/h4>\n\u003cp>2021年11月18日，中共中央政治局会议审议《国家安全战略（2021—2025年）》。公开材料显示，该战略进一步对相应时期国家安全工作作出总体部署。\n这一材料可以作为理解第6条“不断完善国家安全战略”的后续实践例证。\n但需要注意时间限定：&gt; \u003cstrong>《国家安全战略（2021—2025年）》是具有明确期间范围的历史材料。\u003c/strong>\n因此，在2026年的学习和研究中，可以用它说明国家安全战略持续制定、调整和完善的实践，但不宜将其表述为仍然覆盖当前时期的现行五年战略。\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，“制定并不断完善”表明国家安全战略具有动态性\u003c/h4>\n\u003cp>第6条并非只规定国家“制定”国家安全战略，而是在其后特别增加“\u003cstrong>不断完善\u003c/strong>”。\n这意味着，国家安全战略不是制定完成后长期保持不变的静态文本。\n国家安全环境本身处于持续变化之中：\u003c/p>\n\u003cul>\n\u003cli>国际安全格局可能变化；\u003c/li>\n\u003cli>新技术可能产生新的风险和能力；\u003c/li>\n\u003cli>国家利益和发展阶段可能发生变化；\u003c/li>\n\u003cli>原有安全政策实施后可能产生新的经验和问题。\n因此，国家安全战略需要根据安全环境和国家实际情况不断调整。\u003c/li>\n\u003c/ul>\n\u003cp>从规范结构看，可以将其理解为：\u003cstrong>战略制定 → 战略实施 → 环境和效果变化 → 重新评估 → 战略完善\u003c/strong>\u003c/p>\n\u003cp>但需要注意：&gt; \u003cstrong>“不断完善”不等于法律规定必须每隔固定期限重新制定一次国家安全战略。\u003c/strong>\n第6条本身并未规定年度、五年或者其他固定的战略更新周期。因此，应当区分“持续完善的法律要求”与“具体战略文件自行确定的时间范围”。\u003c/p>\n\u003chr>\n\u003ch4>第二，“全面评估国际、国内安全形势”是战略形成的认识基础\u003c/h4>\n\u003cp>国家安全战略首先建立在对安全形势的判断之上。第6条明确要求同时评估：\n\u003cstrong>国际安全形势 + 国内安全形势\u003c/strong>\n这一规定与第8条统筹内部安全和外部安全的要求具有体系上的联系。\n国际环境可能影响国家主权、经济运行、能源资源、产业链、科技发展以及海外利益；国内经济社会发展、技术能力、资源条件和社会运行状况同样构成国家安全战略形成的重要背景。\n因此，国家安全战略不能只根据外部威胁制定，也不能只从国内问题出发，而需要进行综合判断。\n〔笔记分析〕进一步而言，战略评估至少可以关注两个方向：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>风险和威胁：\u003c/strong> 面临哪些现实或者潜在的安全风险；\u003c/li>\n\u003cli>\u003cstrong>自身条件：\u003c/strong> 国家具有何种应对能力、资源条件和发展需求。\n前者回答“面临什么问题”，后者回答“具备什么条件解决问题”。\n需要说明的是，“风险—能力”属于根据本条进行的分析性归纳，并非第6条逐字列明的两项法定评估程序。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第三，国家安全战略具有从总体方向到具体行动的层次结构\u003c/h4>\n\u003cp>第6条列举了国家安全战略应当明确的基本内容。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>战略内容\u003c/th>\n\u003cth>基本功能\u003c/th>\n\u003cth>主要回答的问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>指导方针\u003c/strong>\u003c/td>\n\u003ctd>确定国家安全战略的总体方向和基本取向\u003c/td>\n\u003ctd>按照什么原则行动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>中长期目标\u003c/strong>\u003c/td>\n\u003ctd>确定一定时期希望实现的国家安全状态\u003c/td>\n\u003ctd>希望达到什么目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>重点领域国家安全政策\u003c/strong>\u003c/td>\n\u003ctd>确定重点领域中的政策安排和优先事项\u003c/td>\n\u003ctd>重点在哪里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>工作任务\u003c/strong>\u003c/td>\n\u003ctd>将战略目标转化为需要完成的工作\u003c/td>\n\u003ctd>具体做什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>措施\u003c/strong>\u003c/td>\n\u003ctd>为完成战略任务配置相应行动方式\u003c/td>\n\u003ctd>如何实现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>因此，本条并非只要求战略提出抽象目标，而是要求战略形成从总体方向到实际行动的完整结构：\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>指导方针\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>中长期目标\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>重点领域政策\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>工作任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>具体措施\u003c/strong>\u003c/p>\n\u003cp>这一结构使国家安全战略具有连接总体国家安全观与具体国家安全工作的功能。\u003c/p>\n\u003chr>\n\u003ch4>第四，“中长期目标”体现战略与日常安全工作的区别\u003c/h4>\n\u003cp>“中长期目标”是国家安全战略区别于一般工作部署的重要特征。\n国家安全战略并不只是针对某一次风险或者某一项短期任务作出安排，而需要从较长时间尺度判断：\u003c/p>\n\u003cul>\n\u003cli>国家面临什么样的战略安全环境；\u003c/li>\n\u003cli>哪些国家安全能力需要持续建设；\u003c/li>\n\u003cli>哪些重点领域需要提前布局；\u003c/li>\n\u003cli>希望形成何种稳定、持续的国家安全状态。\n因此，国家安全战略具有较强的\u003cstrong>前瞻性和统筹性\u003c/strong>。\n而具体风险预案、应急处置或者阶段性工作方案，则更直接面对具体风险和现实任务。\n这也有助于理解第6条与第四章有关风险制度之间的区别。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第五，战略实施需要后续法律制度形成执行闭环\u003c/h4>\n\u003cp>第6条主要规定战略本身，并没有穷尽战略如何实施。《国家安全法》通过其他条文建立相应的实施机制。\n第5条规定中央国家安全领导机构\u003cstrong>研究制定、指导实施国家安全战略\u003c/strong>；第46条规定建立国家安全工作督促检查和责任追究机制，以确保国家安全战略和重大部署贯彻落实；第47条进一步要求各部门、各地区采取有效措施贯彻实施国家安全战略。\n因此，可以形成一条较为清晰的战略运行链条：\u003c/p>\n\u003cp>\u003cstrong>第5条：研究制定、指导实施\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：评估形势、确定战略内容\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第47条：各部门、各地区贯彻实施\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第46条：督促检查与责任追究\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>重新评估并不断完善战略\u003c/strong>\u003c/p>\n\u003cp>这使国家安全战略从规划性文本进一步进入实际国家安全工作。\u003c/p>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 国家安全战略具有重要指导作用，但不是具体强制权力的独立来源〔笔记分析〕\u003c/h4>\n\u003cp>国家安全战略能够：\u003c/p>\n\u003cul>\n\u003cli>确定国家安全工作的优先方向；\u003c/li>\n\u003cli>引导重点领域政策；\u003c/li>\n\u003cli>协调不同部门行动；\u003c/li>\n\u003cli>影响资源和能力建设；\u003c/li>\n\u003cli>为具体国家安全制度的实施提供战略背景。\n但应当区分\u003cstrong>战略依据\u003c/strong>与\u003cstrong>法律依据\u003c/strong>。\n国家安全战略可以说明国家为什么优先处理某一风险，也可以指导有关国家机关确定工作重点，但如果国家机关进一步采取搜查、扣押、限制活动、行政处罚或者其他影响公民和组织权利的具体措施，仍须查明相应的法律授权、实体条件和程序要求。\n因此：&gt; \u003cstrong>战略可以指导权力行使，但不能自行创设法律未规定的公权力。\u003c/strong>\n这一解释也与第43条要求国家机关及其工作人员严格依法履行职责、不得超越和滥用职权相一致。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>2. 国家安全战略与国家安全风险评估属于不同层次\u003c/h4>\n\u003cp>第6条要求“全面评估国际、国内安全形势”，第四章第56条则另外规定国家建立国家安全风险评估机制，定期开展各领域国家安全风险调查评估，并要求有关部门定期向中央国家安全领导机构提交风险评估报告。\n二者存在联系，但不能简单等同。可以初步区分：\n\u003cstrong>第6条的形势评估：\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>服务于国家安全战略；\u003c/li>\n\u003cli>具有总体性和宏观性；\u003c/li>\n\u003cli>同时考察国际、国内安全形势。\n\u003cstrong>第56条的风险评估：\u003c/strong>\u003c/li>\n\u003cli>属于第四章具体国家安全制度；\u003c/li>\n\u003cli>具有常态化、制度化特征；\u003c/li>\n\u003cli>重点围绕各领域国家安全风险展开。\n二者可以形成互动：\n\u003cstrong>具体风险评估提供信息\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>综合形成国家安全形势判断\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>影响国家安全战略制定和调整\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>3. “不断完善”可以形成一个动态战略分析框架〔笔记分析〕\u003c/h4>\n\u003cp>结合第6条与第46、47、56条，可以将国家安全战略的运行归纳为：\n\u003cstrong>形势识别 → 目标选择 → 政策和任务安排 → 实施 → 反馈评估 → 战略调整\u003c/strong>\n这一框架能够帮助分析一个国家安全战略是否真正形成动态治理过程。\n其中：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>形势识别\u003c/strong>对应国际、国内安全形势评估；\u003c/li>\n\u003cli>\u003cstrong>目标选择\u003c/strong>对应指导方针和中长期目标；\u003c/li>\n\u003cli>\u003cstrong>政策安排\u003c/strong>对应重点领域国家安全政策、任务和措施；\u003c/li>\n\u003cli>\u003cstrong>实施\u003c/strong>对应各部门、各地区贯彻战略；\u003c/li>\n\u003cli>\u003cstrong>反馈\u003c/strong>来自风险评估、督促检查以及现实安全形势变化；\u003c/li>\n\u003cli>\u003cstrong>调整\u003c/strong>则体现“不断完善”。\n需要注意：\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>这是依据多个条文归纳形成的分析模型，不是法律规定\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>4. 战略调整与执行措施调整需要区分〔笔记分析〕\u003c/h4>\n\u003cp>并非每一次安全环境变化都需要重新制定国家安全战略。国家安全战略通常确定较长时期的基本判断、总体方向和中长期目标，而具体政策和执行措施可以根据短期变化进行调整。\n因此，在判断国家安全战略是否需要改变时，可以区分两个层次：\n\u003cstrong>如果总体安全环境、重大国家利益或者中长期目标发生明显变化\u003c/strong>\u003cbr>→ 可能需要调整战略本身。\u003c/p>\n\u003cp>\u003cstrong>如果总体目标基本稳定，只是具体风险、技术条件或者实施环境发生变化\u003c/strong>\u003cbr>→ 可以主要调整政策、工作任务或者具体措施。\u003c/p>\n\u003cp>这一分析有助于解释为什么第6条既规定相对稳定的“中长期目标”，又要求“不断完善”战略。\u003c/p>\n\u003chr>\n\u003ch4>5. 比较法：美国国家安全战略报告强调制定主体、报告周期与国会说明\u003c/h4>\n\u003cp>美国现行《美国法典》第50编第3043节源自《1947年国家安全法》第108节，规定总统向国会提交国家安全战略报告，并规定报告应当说明国家安全利益和目标、实现战略所需要的外交与国防能力、国家力量的短期和长期运用以及现有能力能否支撑战略等内容；该条同时规定有关报告具有机密和非机密形式。\n这一制度与我国第6条可以围绕以下问题进行功能比较：\u003c/p>\n\u003cul>\n\u003cli>战略由谁制定；\u003c/li>\n\u003cli>战略包含什么内容；\u003c/li>\n\u003cli>是否具有明确的评估和更新周期；\u003c/li>\n\u003cli>战略向谁进行说明或者报告；\u003c/li>\n\u003cli>如何判断目标与国家能力是否匹配；\u003c/li>\n\u003cli>如何处理战略信息的公开与保密。\n但两种制度的规范结构并不相同。\u003c/li>\n\u003c/ul>\n\u003cp>尤其需要注意：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>我国《国家安全法》第6条没有规定美国法意义上的年度向立法机关提交国家安全战略报告的义务。\u003c/strong>\n因此，美国有关年度报告、提交时间和报告形式的规定可以作为比较法材料，但不能作为解释我国第6条程序要求的直接依据。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第5条与第6条的区别\u003c/h4>\n\u003cp>两条都出现“国家安全战略”，但规范重点不同。\u003c/p>\n\u003ch5>第5条：谁负责战略工作\u003c/h5>\n\u003cp>核心表述：\u003c/p>\n\u003cblockquote>\n\u003cp>“研究制定、指导实施国家安全战略”\n回答的是：\u003cstrong>谁在中央层面承担战略工作的领导和协调职责。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>第6条：战略如何形成、包括什么\u003c/h5>\n\u003cp>核心表述：\u003c/p>\n\u003cblockquote>\n\u003cp>“制定并不断完善”“全面评估”“明确……”\n回答的是：\u003cstrong>国家安全战略应当建立在什么基础上，以及战略应包含哪些主要内容。\u003c/strong>\n因此：\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>第5条：主体和职责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：战略形成和内容\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（二）区分四个相关概念\u003c/h4>\n\u003ch5>1. 国家安全战略\u003c/h5>\n\u003cp>第6条规定。主要解决国家安全工作的：\u003cstrong>总体方向 + 中长期目标 + 重点政策 + 工作任务和措施\u003c/strong>\u003c/p>\n\u003ch5>2. 国家安全重大方针政策\u003c/h5>\n\u003cp>第5条与国家安全战略并列规定。政策通常比总体战略更加具体，是将战略要求转化为国家安全工作安排的重要方式。\u003c/p>\n\u003ch5>3. 国家安全风险评估\u003c/h5>\n\u003cp>第56条规定。主要通过定期调查评估具体国家安全风险，为国家安全决策和风险治理提供信息基础。\u003c/p>\n\u003ch5>4. 国家安全风险预案\u003c/h5>\n\u003cp>第55条规定国家制定完善应对各领域国家安全风险预案。预案更直接面向具体风险发生后的预防、应对和处置准备。\n因此，可以简单记忆为：\u003c/p>\n\u003cp>\u003cstrong>战略：确定总体方向\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>政策：落实战略安排\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>风险评估：识别和判断具体风险\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>预案：准备如何应对风险\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（三）国家安全战略的实施闭环\u003c/h4>\n\u003cp>可以将相关条文串联起来：\n\u003cstrong>第5条：研究制定、指导实施战略\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：评估形势，明确战略内容\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第56条：持续提供风险评估信息\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第47条：部门和地区贯彻实施\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第46条：督促检查和责任追究\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：根据形势不断完善\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（四）关于战略公开范围\u003c/h4>\n\u003cp>第6条本身没有规定国家安全战略应当以何种形式公开，也没有规定国家安全战略全部属于保密信息。因此，不能从本条推出：\u003c/p>\n\u003cblockquote>\n\u003cp>“国家安全战略全文必须公开”\u003c/p>\n\u003c/blockquote>\n\u003cp>也不能反向推出：\u003c/p>\n\u003cblockquote>\n\u003cp>“国家安全战略及其全部信息当然保密”。\u003c/p>\n\u003c/blockquote>\n\u003cp>具体战略信息能否公开、公开至何种程度，应根据相关国家秘密、政府信息公开以及具体文件的性质分别判断。\n比较而言，美国第50编第3043节明确要求国家安全战略报告具有机密和非机密形式，这恰好说明战略公开程度本身可以由具体制度另外规定。\u003c/p>\n\u003chr>\n\u003ch4>（五）历史比较材料\u003c/h4>\n\u003cp>法工委版本《中华人民共和国国家安全法释义》对美国、俄罗斯、日本等国家安全战略进行了较多介绍。\u003c/p>\n\u003chr>\n\u003ch4>（六）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：国家制定一次国家安全战略以后即可长期不变。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第6条明确规定“制定并不断完善”，说明战略具有动态调整要求。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：“不断完善”意味着国家必须每年重新制定国家安全战略。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第6条没有规定固定更新周期。“不断完善”是一项持续性要求，不等于法定年度更新义务。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：国家安全战略就是对国家安全风险的预测。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 形势评估只是战略形成的基础。国家安全战略还必须明确指导方针、中长期目标、重点领域政策、工作任务和措施。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：战略规定某项工作重要，就当然可以采取必要的强制措施。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 战略确定工作方向，并不能代替具体法律授权。国家机关采取影响公民、组织权利的措施仍须具有明确法律依据。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：第6条已经完整规定了国家安全战略的实施机制。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第6条主要规定战略形成和内容，实施还需要结合第5条、第46条、第47条以及其他国家安全工作机制理解。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：《国家安全战略（2021—2025年）》仍是2026年当前五年战略。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 该文件标题本身限定为2021—2025年。在没有新的可靠材料支持时，应当将其作为此前战略实践材料，而不能延伸其时间效力。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>国家安全战略的法律性质如何界定？\u003c/strong>\u003cbr>它与法律法规、国家安全政策以及具体行政决定之间分别是什么关系？战略能够对具体国家机关产生何种规范性影响？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“不断完善”应当以什么作为战略调整标准？\u003c/strong>\u003cbr>国际环境变化、国家利益变化、风险程度变化以及国家能力变化达到何种程度时，需要调整国家安全战略本身？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>战略调整与执行措施调整如何区分？\u003c/strong>\u003cbr>在中长期目标保持稳定而短期风险快速变化时，应当修改战略，还是主要通过调整重点政策、任务和具体措施予以应对？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何评价国家安全战略的实施效果？\u003c/strong>\u003cbr>除是否完成既定工作任务之外，是否还应评价风险是否降低、安全能力是否提高以及战略目标与资源配置是否匹配？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全风险评估如何进入战略制定过程？\u003c/strong>\u003cbr>第56条形成的各领域风险评估信息，如何汇总并转化为第6条意义上的国际、国内安全形势综合判断？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全战略的公开与保密边界如何确定？\u003c/strong>\u003cbr>战略需要发挥政策引导和社会动员功能，同时又可能涉及敏感安全信息。哪些内容适合公开、哪些内容需要保护，应依据何种规范进行区分？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何建立国家安全战略的比较法分析框架？\u003c/strong>\u003cbr>与其只比较各国战略文件内容，是否更适合围绕“\u003cstrong>制定主体—形势评估—目标设定—能力配置—实施机制—监督反馈—更新机制\u003c/strong>”进行制度比较？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":7,"label":"第七条","title":"法治原则与人权保障","lawText":"维护国家安全，应当遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>法治底线：\u003c/strong> 国家安全工作的特殊性不构成脱离宪法和法律运行的理由，国家机关采取具体措施必须具有相应的职权和法律依据。\u003c/li>\n\u003cli>\u003cstrong>人权原则：\u003c/strong> “尊重和保障人权”既包含防止公权力不当侵害，也要求通过制度安排积极保护公民合法权益。\u003c/li>\n\u003cli>\u003cstrong>目的与手段分开审查：\u003c/strong> 某项措施具有维护国家安全的目的，并不当然意味着该措施合法；仍需审查权限、条件、程序和限制程度。\u003c/li>\n\u003cli>\u003cstrong>体系展开：\u003c/strong> 第43条禁止越权、滥权和侵犯合法权益，第66条对危机管控措施规定适当性和权益保护要求，第82—83条进一步规定监督救济和限制权利特别措施的法律边界。\u003c/li>\n\u003cli>\u003cstrong>适用方法：\u003c/strong> 可以将本条作为解释具体国家安全权限和措施的重要原则性依据，但具体合法性结论仍须回到相应的授权规范和程序规范。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>维护国家安全，应当遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>法治底线：\u003c/strong> 国家安全工作的特殊性不构成脱离宪法和法律运行的理由，国家机关采取具体措施必须具有相应的职权和法律依据。\u003c/li>\n\u003cli>\u003cstrong>人权原则：\u003c/strong> “尊重和保障人权”既包含防止公权力不当侵害，也要求通过制度安排积极保护公民合法权益。\u003c/li>\n\u003cli>\u003cstrong>目的与手段分开审查：\u003c/strong> 某项措施具有维护国家安全的目的，并不当然意味着该措施合法；仍需审查权限、条件、程序和限制程度。\u003c/li>\n\u003cli>\u003cstrong>体系展开：\u003c/strong> 第43条禁止越权、滥权和侵犯合法权益，第66条对危机管控措施规定适当性和权益保护要求，第82—83条进一步规定监督救济和限制权利特别措施的法律边界。\u003c/li>\n\u003cli>\u003cstrong>适用方法：\u003c/strong> 可以将本条作为解释具体国家安全权限和措施的重要原则性依据，但具体合法性结论仍须回到相应的授权规范和程序规范。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>维护国家安全，应当遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">法治原则与人权保障 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条确立维护国家安全工作的\u003cstrong>法治原则和人权保障原则\u003c/strong>。它将“维护国家安全”与“遵守宪法和法律、尊重和保障人权、保护公民权利和自由”置于同一规范结构中，表明国家安全工作的目的正当性并不能替代具体措施的合法性要求。\u003c/p>\n\u003cp>理解本条，可以抓住一条基本逻辑：\u003cstrong>维护国家安全 → 依法行使职权 → 尊重和保障人权 → 依法保护权利和自由。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 宪法基础：依法治国、人权保障与基本权利共同构成本条的规范基础\u003c/h4>\n\u003cp>本条具有明确的宪法基础。《宪法》第5条规定中华人民共和国实行依法治国，建设社会主义法治国家，并进一步规定一切国家机关、武装力量、政党、社会团体、企业事业组织都必须遵守宪法和法律，任何组织或者个人都不得有超越宪法和法律的特权。\u003c/p>\n\u003cp>《宪法》第33条第3款则明确规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“国家尊重和保障人权。”\u003c/strong>\n第33条同时规定，公民享有宪法和法律规定的权利，并履行相应义务。此后第35条以下进一步规定言论、出版、集会、结社、宗教信仰、人身自由等基本权利。\n因此，第7条可以理解为将宪法上的两个基本要求进一步落实到国家安全领域：\u003cstrong>国家权力依法运行 + 公民权利受到保障\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>2. 2014年《反间谍法》已经确立类似的人权保障要求\u003c/h4>\n\u003cp>2014年《反间谍法》第5条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“反间谍工作应当依法进行，尊重和保障人权，保障公民和组织的合法权益。”\n因此，2015年《国家安全法》第7条关于依法开展国家安全工作和尊重保障人权的规定，并非首次出现于国家安全相关专门立法，而是在综合性国家安全法中进一步上升为适用于国家安全工作的基本原则。2014年《反间谍法》共有40条，其中第40条为施行条款。\n2023年修订《反间谍法》继续保留这一原则，并将其前移至第3条，表述为“反间谍工作应当依法进行，尊重和保障人权，保障个人和组织的合法权益”。这说明依法开展国家安全专门工作并保护个人、组织合法权益的要求具有明显的制度延续性。\u003c/p>\n\u003c/blockquote>\n\u003ch4>3. 2014年12月的国家安全法草案说明已经明确提出法治和保障人权原则\u003c/h4>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，“遵守宪法和法律”构成国家安全工作的基本合法性要求\u003c/h4>\n\u003cp>国家安全事项可能具有高度敏感性、紧迫性和特殊性，但这些特点并不使国家安全活动脱离一般法治要求。\n《宪法》第5条已经明确要求一切国家机关和组织遵守宪法和法律，并禁止任何组织或者个人享有超越宪法和法律的特权。\n因此，第7条中的“遵守宪法和法律”首先意味着：\u003c/p>\n\u003cul>\n\u003cli>国家机关必须在法定职责范围内维护国家安全；\u003c/li>\n\u003cli>采取调查、审查、强制、处罚等措施必须具有相应法律依据；\u003c/li>\n\u003cli>权力行使必须符合实体条件和法定程序；\u003c/li>\n\u003cli>对公民权利的限制不得脱离法律规定。\n这与第43条形成直接呼应。第43条明确要求国家机关及其工作人员严格依法履行职责，不得超越职权、滥用职权，不得侵犯个人和组织的合法权益。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第二，“坚持社会主义法治原则”要求以法治方式维护国家安全\u003c/h4>\n\u003cp>“遵守宪法和法律”侧重对具体权力运行的合法性要求，“坚持社会主义法治原则”则具有更为总体的制度意义。\n国家安全治理既需要形成维护安全的能力，也需要通过法律明确：\u003c/p>\n\u003cul>\n\u003cli>国家安全权力由谁行使；\u003c/li>\n\u003cli>在什么条件下行使；\u003c/li>\n\u003cli>可以采取何种措施；\u003c/li>\n\u003cli>应遵守什么程序；\u003c/li>\n\u003cli>公民和组织享有哪些权利；\u003c/li>\n\u003cli>权力违法运行时如何监督和救济。\n因此，法治原则贯穿的不只是具体执法阶段，而包括国家安全的\u003cstrong>立法、职责配置、制度运行、监督和责任追究\u003c/strong>。\n其他规定也体现了这种结构。例如，第42条规定有关机关的法定职权，第43条限制越权和滥权，第66条控制危机处置措施，第82条规定申诉、控告、检举权，第83条要求限制公民权利和自由的特别措施依法实施。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第三，“尊重”和“保障”可以理解为人权义务的两个侧面\u003c/h4>\n\u003cp>本条并列使用“尊重”和“保障”人权。\n在学习中，可以作如下功能性区分：\n\u003cstrong>尊重人权\u003c/strong>主要体现为公权力避免违法或者不必要地干预个人权利；\n\u003cstrong>保障人权\u003c/strong>则进一步要求国家通过法律、制度和具体行动，为公民权利的实现提供保护条件。\n这种区分有助于理解国家安全领域的人权问题并不仅发生在“是否限制权利”这一环节。例如：\u003c/p>\n\u003cul>\n\u003cli>国家机关不得超越职权侵犯合法权益，是“尊重”的典型要求；\u003c/li>\n\u003cli>对协助国家安全工作而面临危险的人员提供保护，则具有积极保障色彩；\u003c/li>\n\u003cli>为公民提供申诉、控告和检举渠道，也属于权利保障制度的一部分。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第四，“依法保护公民的权利和自由”使权利保护成为国家安全工作的组成部分\u003c/h4>\n\u003cp>本条最后明确规定“依法保护公民的权利和自由”。\n这一表述具有重要意义，因为它表明在《国家安全法》的规范结构中：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>维护国家安全与保护公民权利并非简单的对立关系。\u003c/strong>\n国家安全本身包含对人民安全和人民根本利益的保护；国家采取安全措施时，同时又必须尊重和保护公民权利。这种关系在本法多个条文中得到展开：\u003c/p>\n\u003c/blockquote>\n\u003cul>\n\u003cli>第16条规定保障公民生命财产安全和其他合法权益；\u003c/li>\n\u003cli>第43条禁止国家机关超越、滥用职权以及侵犯个人和组织合法权益；\u003c/li>\n\u003cli>第66条要求国家安全危机管控措施与危害的性质、程度和范围相适应，并在存在多种措施时选择有利于最大程度保护公民、组织权益的措施；\u003c/li>\n\u003cli>第82条赋予公民和组织提出批评建议以及申诉、控告、检举的权利；\u003c/li>\n\u003cli>第83条规定限制公民权利和自由的特别措施必须依法进行，并以维护国家安全的实际需要为限度。\n因此，人权保障原则并非停留于总则中的抽象宣示，而是通过具体权限限制、措施控制和权利救济制度进一步展开。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. “目的合法”与“手段合法”必须分别判断〔笔记分析〕\u003c/h4>\n\u003cp>国家安全措施通常具有维护国家安全这一公共目的。\n但在法律分析中，应当把两个问题分开：\n\u003cstrong>第一，措施追求的目的是否属于法定国家安全目的；\u003c/strong>\n\u003cstrong>第二，为实现这一目的而采取的具体手段是否合法。\u003c/strong>\n即使某项措施确实有助于国家安全，也仍然需要判断：\u003c/p>\n\u003cul>\n\u003cli>采取措施的主体是否具有法定职权；\u003c/li>\n\u003cli>是否满足相应的实体条件；\u003c/li>\n\u003cli>是否履行法定批准或者其他程序；\u003c/li>\n\u003cli>是否超过实现安全目的所必要的范围；\u003c/li>\n\u003cli>是否对相关人员提供应有的程序保障和救济。\n因此：&gt; \u003cstrong>安全目的的正当性不能自动转化为手段的合法性。\u003c/strong>\n这一点是第7条作为原则条款参与具体法律解释时最重要的功能之一。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>2. 第43条进一步具体化了依法履职和禁止滥权要求\u003c/h4>\n\u003cp>第43条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>国家机关及其工作人员在国家安全工作和涉及国家安全活动中，应当严格依法履行职责，不得超越职权、滥用职权，不得侵犯个人和组织的合法权益。\u003c/p>\n\u003c/blockquote>\n\u003cp>第7条与第43条的关系可以理解为：\n\u003cstrong>第7条：一般法治和人权原则\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第43条：国家机关依法履职的具体要求\u003c/strong>\n因此，在具体国家安全案件中，第7条可以提供原则性解释，第43条则更加直接地提出职权边界和合法权益保护要求。\u003c/p>\n\u003chr>\n\u003ch4>3. 第66条体现危机管控场景下较为明确的适当性和权益保护要求\u003c/h4>\n\u003cp>第66条规定，履行国家安全危机管控职责的有关机关依法采取管控措施时：\u003c/p>\n\u003cul>\n\u003cli>措施应当与国家安全危机可能造成危害的\u003cstrong>性质、程度和范围相适应\u003c/strong>；\u003c/li>\n\u003cli>存在多种措施可供选择时，应当选择有利于\u003cstrong>最大程度保护公民、组织权益\u003c/strong>的措施。\n这一规定具有较明显的比例控制特征，可以帮助理解第7条的人权保障原则如何落实到具体措施选择。\u003c/li>\n\u003c/ul>\n\u003cp>但必须注意适用范围：&gt; \u003cstrong>第66条位于第四章第五节“危机管控”，其直接规范对象是国家安全危机管控措施。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>4. 第83条对限制公民权利和自由的特别措施设置一般性的法律边界\u003c/h4>\n\u003cp>第83条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“在国家安全工作中，需要采取限制公民权利和自由的特别措施时，应当依法进行，并以维护国家安全的实际需要为限度。”\n与第66条相比，第83条使用的是更一般的“在国家安全工作中”，并直接针对“限制公民权利和自由的特别措施”。\n因此，它可以与第7条共同形成较为明确的解释结构：\u003cstrong>必须依法采取措施 + 限制程度以实际安全需要为限\u003c/strong>\n这一规定对于理解国家安全措施的必要性边界尤其重要。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>5. 采取国家安全措施的分析顺序〔笔记分析〕\u003c/h4>\n\u003cp>结合第7、43、66、82、83条，可以形成如下研究思路：\n\u003cstrong>第一步：审查职权。\u003c/strong>\u003cbr>谁采取措施？是否具有明确的法律职责和权限？\n\u003cstrong>第二步：审查事实基础。\u003c/strong>\u003cbr>存在什么现实或者潜在的国家安全风险？涉及第2条中的何种国家重大利益？\n\u003cstrong>第三步：审查目的。\u003c/strong>\u003cbr>具体措施是否真正服务于相应的国家安全目的？\n\u003cstrong>第四步：审查手段。\u003c/strong>\u003cbr>该措施是否能够促进安全目的实现？是否存在同样有效而对权利影响较小的方式？\n\u003cstrong>第五步：审查负担。\u003c/strong>\u003cbr>措施对公民、组织权益造成的限制是否超过应对风险实际需要？\n\u003cstrong>第六步：审查程序与救济。\u003c/strong>\u003cbr>审批、告知、陈述申辩、监督、申诉、控告、检举或者其他救济机制是否依法落实？\n可以简化为：\u003cstrong>职权依据 → 风险事实 → 目的 → 手段 → 限制程度 → 程序与救济\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>这一顺序是依据《国家安全法》多个条文归纳形成的\u003cstrong>分析框架\u003c/strong>，并不是第7条明文规定的一套统一六阶段审查程序。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>6. 比较法：普通权利限制与紧急状态下的权利削减应当区分\u003c/h4>\n\u003cp>《公民权利和政治权利国际公约》提供了一个有意义的比较视角。以表达自由为例，公约第19条第3款允许在法律规定且具有必要性的条件下，为保护国家安全、公共秩序等目的对表达自由作一定限制；第22条关于结社自由也设置了类似的“依法规定—合法目的—必要性”结构。\n与此不同，公约第4条处理的是威胁国家生存并经正式宣布的公共紧急状态。在这种情况下，缔约国可以在“情势严格需要”的范围内对部分公约义务采取克减措施，同时还受到不可克减权利等限制。\n因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>普通情形下的权利限制（restriction）与紧急状态下的义务削减（derogation）是两种不同的法律制度。\u003c/strong>\n比较研究中不能因两者都涉及“国家安全”而将其混同。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第7条在总则中的位置\u003c/h4>\n\u003cp>前六条主要解决：\u003cstrong>为什么立法 → 什么是国家安全 → 按照什么理念维护 → 谁来领导 → 中央领导机构做什么 → 如何制定国家安全战略\u003c/strong>\u003c/p>\n\u003cp>第7条开始进一步回答：&gt; \u003cstrong>国家安全工作应当受到什么法律边界约束？\u003c/strong>\u003c/p>\n\u003cp>因此，前七条可以形成一条非常清晰的逻辑链：\u003c/p>\n\u003cp>\u003cstrong>第1条：立法目的\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第2条：国家安全定义\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第3条：总体国家安全观\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第4—5条：领导体制与领导机构职责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：国家安全战略\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第7条：法治与人权边界\u003c/strong>\u003c/p>\n\u003cp>第7条由此具有明显的“限权”和“保障”功能。\u003c/p>\n\u003chr>\n\u003ch4>（二）核心关联条文\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>《宪法》第5条：\u003c/strong> 依法治国以及一切国家机关、组织遵守宪法和法律。\u003c/li>\n\u003cli>\u003cstrong>《宪法》第33条：\u003c/strong> 国家尊重和保障人权。\u003c/li>\n\u003cli>\u003cstrong>第13条：\u003c/strong> 国家机关工作人员滥用职权、玩忽职守、徇私舞弊的法律责任。\u003c/li>\n\u003cli>\u003cstrong>第43条：\u003c/strong> 严格依法履行职责，禁止越权、滥权和侵犯合法权益。\u003c/li>\n\u003cli>\u003cstrong>第66条：\u003c/strong> 国家安全危机管控措施的适当性与权益保护。\u003c/li>\n\u003cli>\u003cstrong>第82条：\u003c/strong> 批评建议以及申诉、控告、检举权。\u003c/li>\n\u003cli>\u003cstrong>第83条：\u003c/strong> 限制公民权利和自由的特别措施必须依法进行，并以实际需要为限。\u003c/li>\n\u003c/ul>\n\u003cp>可以概括为：\u003c/p>\n\u003cp>\u003cstrong>第7条：原则性人权和法治保障\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第43条：权力依法运行\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第66、83条：具体措施限度\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第82条：监督和救济\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（三）2014年《反间谍法》与现行《反间谍法》的对应关系\u003c/h4>\n\u003cp>学习时可以特别注意条文位置的变化：\n\u003cstrong>2014年《反间谍法》第5条：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>反间谍工作依法进行 + 尊重和保障人权 + 保障公民和组织合法权益。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>2023年修订《反间谍法》第3条：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>反间谍工作依法进行 + 尊重和保障人权 + 保障个人和组织合法权益。\n基本原则得到延续，同时条文位置由第5条前移至第3条。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（四）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：只要措施是为了维护国家安全，就可以推定合法。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 国家安全目的与措施合法性属于两个层次。具体措施仍须符合职权、实体条件、程序和权利保障要求。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：国家安全属于特殊领域，因此可以不完全遵守一般法治原则。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第7条恰恰明确规定维护国家安全必须遵守宪法和法律，并尊重和保障人权。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：“尊重和保障人权”只是宣示性规定，没有具体制度意义。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第43、66、82、83条分别通过职权控制、措施控制、监督救济和权利限制边界对该原则进行具体展开。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：第66条的比例控制规则直接适用于所有国家安全措施。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第66条直接适用于国家安全危机管控措施。可以据此理解本法的权益保护理念，但向其他场景延伸时需要说明其体系解释性质。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：国家安全领域只需要讨论国家能否限制权利。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第7条同时规定“尊重和保障人权”“依法保护公民的权利和自由”。国家安全法还规定保护、补偿、监督和救济等积极保障制度。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>第7条能够在多大程度上成为具体国家安全措施的审查依据？\u003c/strong>\u003cbr>在专门法律没有明确规定比例控制标准时，能否依据第7条结合第43、83条形成更具体的合法性审查要求？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全领域的比例原则应当如何构造？\u003c/strong>\u003cbr>第66条已经明确规定危机管控中的适当性和较小权益损害要求，这种规范理念能否通过体系解释影响其他国家安全措施？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“实际需要为限度”如何具体判断？\u003c/strong>\u003cbr>第83条中的“实际需要”应当依据风险发生概率、危害程度、措施有效性还是其他因素进行评价？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何将“尊重和保障人权”转化为可操作的程序要求？\u003c/strong>\u003cbr>除职权和实体条件之外，国家安全行政活动是否应更加明确告知、陈述申辩、理由说明、记录留存和救济等程序要求？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全信息保密与有效救济之间如何协调？\u003c/strong>\u003cbr>当具体决定涉及国家秘密或者敏感安全信息时，如何既保护必要的国家安全信息，又使受影响主体能够有效了解决定依据并提出救济？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全措施的监督结构应当如何完善？\u003c/strong>\u003cbr>第82条赋予公民和组织批评建议、申诉、控告和检举权后，这些监督方式如何与行政复议、行政诉讼、监察监督以及内部监督机制形成衔接？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全与人权保障应当如何理解其规范关系？\u003c/strong>\u003cbr>是否应从简单的“安全与权利冲突”框架，进一步转向“安全目的—法定权限—措施必要性—权利保障—监督救济”的完整法治结构？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条确立维护国家安全工作的\u003cstrong>法治原则和人权保障原则\u003c/strong>。它将“维护国家安全”与“遵守宪法和法律、尊重和保障人权、保护公民权利和自由”置于同一规范结构中，表明国家安全工作的目的正当性并不能替代具体措施的合法性要求。\u003c/p>\n\u003cp>理解本条，可以抓住一条基本逻辑：\u003cstrong>维护国家安全 → 依法行使职权 → 尊重和保障人权 → 依法保护权利和自由。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 宪法基础：依法治国、人权保障与基本权利共同构成本条的规范基础\u003c/h4>\n\u003cp>本条具有明确的宪法基础。《宪法》第5条规定中华人民共和国实行依法治国，建设社会主义法治国家，并进一步规定一切国家机关、武装力量、政党、社会团体、企业事业组织都必须遵守宪法和法律，任何组织或者个人都不得有超越宪法和法律的特权。\u003c/p>\n\u003cp>《宪法》第33条第3款则明确规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“国家尊重和保障人权。”\u003c/strong>\n第33条同时规定，公民享有宪法和法律规定的权利，并履行相应义务。此后第35条以下进一步规定言论、出版、集会、结社、宗教信仰、人身自由等基本权利。\n因此，第7条可以理解为将宪法上的两个基本要求进一步落实到国家安全领域：\u003cstrong>国家权力依法运行 + 公民权利受到保障\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>2. 2014年《反间谍法》已经确立类似的人权保障要求\u003c/h4>\n\u003cp>2014年《反间谍法》第5条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“反间谍工作应当依法进行，尊重和保障人权，保障公民和组织的合法权益。”\n因此，2015年《国家安全法》第7条关于依法开展国家安全工作和尊重保障人权的规定，并非首次出现于国家安全相关专门立法，而是在综合性国家安全法中进一步上升为适用于国家安全工作的基本原则。2014年《反间谍法》共有40条，其中第40条为施行条款。\n2023年修订《反间谍法》继续保留这一原则，并将其前移至第3条，表述为“反间谍工作应当依法进行，尊重和保障人权，保障个人和组织的合法权益”。这说明依法开展国家安全专门工作并保护个人、组织合法权益的要求具有明显的制度延续性。\u003c/p>\n\u003c/blockquote>\n\u003ch4>3. 2014年12月的国家安全法草案说明已经明确提出法治和保障人权原则\u003c/h4>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，“遵守宪法和法律”构成国家安全工作的基本合法性要求\u003c/h4>\n\u003cp>国家安全事项可能具有高度敏感性、紧迫性和特殊性，但这些特点并不使国家安全活动脱离一般法治要求。\n《宪法》第5条已经明确要求一切国家机关和组织遵守宪法和法律，并禁止任何组织或者个人享有超越宪法和法律的特权。\n因此，第7条中的“遵守宪法和法律”首先意味着：\u003c/p>\n\u003cul>\n\u003cli>国家机关必须在法定职责范围内维护国家安全；\u003c/li>\n\u003cli>采取调查、审查、强制、处罚等措施必须具有相应法律依据；\u003c/li>\n\u003cli>权力行使必须符合实体条件和法定程序；\u003c/li>\n\u003cli>对公民权利的限制不得脱离法律规定。\n这与第43条形成直接呼应。第43条明确要求国家机关及其工作人员严格依法履行职责，不得超越职权、滥用职权，不得侵犯个人和组织的合法权益。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第二，“坚持社会主义法治原则”要求以法治方式维护国家安全\u003c/h4>\n\u003cp>“遵守宪法和法律”侧重对具体权力运行的合法性要求，“坚持社会主义法治原则”则具有更为总体的制度意义。\n国家安全治理既需要形成维护安全的能力，也需要通过法律明确：\u003c/p>\n\u003cul>\n\u003cli>国家安全权力由谁行使；\u003c/li>\n\u003cli>在什么条件下行使；\u003c/li>\n\u003cli>可以采取何种措施；\u003c/li>\n\u003cli>应遵守什么程序；\u003c/li>\n\u003cli>公民和组织享有哪些权利；\u003c/li>\n\u003cli>权力违法运行时如何监督和救济。\n因此，法治原则贯穿的不只是具体执法阶段，而包括国家安全的\u003cstrong>立法、职责配置、制度运行、监督和责任追究\u003c/strong>。\n其他规定也体现了这种结构。例如，第42条规定有关机关的法定职权，第43条限制越权和滥权，第66条控制危机处置措施，第82条规定申诉、控告、检举权，第83条要求限制公民权利和自由的特别措施依法实施。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第三，“尊重”和“保障”可以理解为人权义务的两个侧面\u003c/h4>\n\u003cp>本条并列使用“尊重”和“保障”人权。\n在学习中，可以作如下功能性区分：\n\u003cstrong>尊重人权\u003c/strong>主要体现为公权力避免违法或者不必要地干预个人权利；\n\u003cstrong>保障人权\u003c/strong>则进一步要求国家通过法律、制度和具体行动，为公民权利的实现提供保护条件。\n这种区分有助于理解国家安全领域的人权问题并不仅发生在“是否限制权利”这一环节。例如：\u003c/p>\n\u003cul>\n\u003cli>国家机关不得超越职权侵犯合法权益，是“尊重”的典型要求；\u003c/li>\n\u003cli>对协助国家安全工作而面临危险的人员提供保护，则具有积极保障色彩；\u003c/li>\n\u003cli>为公民提供申诉、控告和检举渠道，也属于权利保障制度的一部分。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第四，“依法保护公民的权利和自由”使权利保护成为国家安全工作的组成部分\u003c/h4>\n\u003cp>本条最后明确规定“依法保护公民的权利和自由”。\n这一表述具有重要意义，因为它表明在《国家安全法》的规范结构中：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>维护国家安全与保护公民权利并非简单的对立关系。\u003c/strong>\n国家安全本身包含对人民安全和人民根本利益的保护；国家采取安全措施时，同时又必须尊重和保护公民权利。这种关系在本法多个条文中得到展开：\u003c/p>\n\u003c/blockquote>\n\u003cul>\n\u003cli>第16条规定保障公民生命财产安全和其他合法权益；\u003c/li>\n\u003cli>第43条禁止国家机关超越、滥用职权以及侵犯个人和组织合法权益；\u003c/li>\n\u003cli>第66条要求国家安全危机管控措施与危害的性质、程度和范围相适应，并在存在多种措施时选择有利于最大程度保护公民、组织权益的措施；\u003c/li>\n\u003cli>第82条赋予公民和组织提出批评建议以及申诉、控告、检举的权利；\u003c/li>\n\u003cli>第83条规定限制公民权利和自由的特别措施必须依法进行，并以维护国家安全的实际需要为限度。\n因此，人权保障原则并非停留于总则中的抽象宣示，而是通过具体权限限制、措施控制和权利救济制度进一步展开。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. “目的合法”与“手段合法”必须分别判断〔笔记分析〕\u003c/h4>\n\u003cp>国家安全措施通常具有维护国家安全这一公共目的。\n但在法律分析中，应当把两个问题分开：\n\u003cstrong>第一，措施追求的目的是否属于法定国家安全目的；\u003c/strong>\n\u003cstrong>第二，为实现这一目的而采取的具体手段是否合法。\u003c/strong>\n即使某项措施确实有助于国家安全，也仍然需要判断：\u003c/p>\n\u003cul>\n\u003cli>采取措施的主体是否具有法定职权；\u003c/li>\n\u003cli>是否满足相应的实体条件；\u003c/li>\n\u003cli>是否履行法定批准或者其他程序；\u003c/li>\n\u003cli>是否超过实现安全目的所必要的范围；\u003c/li>\n\u003cli>是否对相关人员提供应有的程序保障和救济。\n因此：&gt; \u003cstrong>安全目的的正当性不能自动转化为手段的合法性。\u003c/strong>\n这一点是第7条作为原则条款参与具体法律解释时最重要的功能之一。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>2. 第43条进一步具体化了依法履职和禁止滥权要求\u003c/h4>\n\u
