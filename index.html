3c/h3>\n\u003cp>风险评估面对的是不确定性，并不要求事先证明损害必然发生。科学评估的价值，在于区分已知事实、合理推断与尚待核实的信息，使决策能够比较不同情形和应对方案。承认不确定性并说明依据，比把预测包装成确定事实更有利于形成可靠决策。\u003c/p>\n\u003cp>评估也不等于批准或者处罚。识别出某项活动存在风险，可以支持采取进一步调查、防范或审查措施，但措施由谁实施、适用何种程序，仍须依据有关法律；不能直接把风险判断等同于违法犯罪认定。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>一份可供研读的评估报告，可按“评估对象和期间—资料及方法—主要风险—现有能力—优先建议—不确定性”理解。这是分析报告质量的参考框架，不是本条规定的统一法定格式。\u003c/p>\n\u003cp>向中央国家安全领导机构报送的评估报告，与面向公众发布的风险提示属于不同信息产品。涉及公众的防范信息可以依法通过适当渠道发布，但不能据本条推定全部内部评估报告都应公开，也不能以报告内部报送为由免除其他法律规定的公开预警义务。\u003c/p>\n"},{"num":57,"label":"第五十七条","title":"国家安全风险监测预警","lawText":"国家健全国家安全风险监测预警制度，根据国家安全风险程度，及时发布相应风险预警。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第五十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全国家安全风险监测预警制度，根据国家安全风险程度，及时发布相应风险预警。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第五十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全国家安全风险监测预警制度，根据国家安全风险程度，及时发布相应风险预警。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全风险监测预警 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条包含持续掌握风险动态的“监测”与提示危险、促使有关主体采取防范行动的“预警”。二者相衔接，但监测信息本身并不等于已经作出的预警。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条有直接的改稿证据。2015年6月30日关于草案三次审议稿修改意见的报告第五项提出，在“预警”前增加“监测”：监测既是及时、准确发布风险预警的前提和基础，本身也是国家安全的一项重要制度。见《中华人民共和国国家安全法释义》附录，印刷第389页／PDF第402页。\u003c/p>\n\u003cp>现行关联规则应结合2024年修订的突发事件应对法第四章，以及2025年总体应急预案第3.2部分阅读。两书引用的旧法章次、条号和其他领域法律，应与现行文本逐项对应，不能将旧条号直接作为当前依据。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">突发事件应对法第四章\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">总体应急预案第3.2部分\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>监测要求持续获得和核对信息。\u003c/strong> 应根据领域特点确定监测对象、区域、指标、网点和责任主体，结合专业设备与有关信息渠道掌握变化，并开展分析研判。监测既要发现局部异常，也要注意风险可能跨区域、跨领域传导。\u003c/p>\n\u003cp>\u003cstrong>预警须根据风险程度及时作出。\u003c/strong> 判断应综合危险的紧迫程度、发展趋势、可能危害和防范需要。预警的对象、内容及发布主体须符合相应领域制度，不能因信息尚非完全确定便一概不发，也不能把未经核实的推测作为确定事实发布。\u003c/p>\n\u003cp>\u003cstrong>本条没有统一规定所有领域的预警等级。\u003c/strong> 突发事件应对法第63条规定的红、橙、黄、蓝四级，适用于可以预警的自然灾害、事故灾难和公共卫生事件。不能由此推定军事、金融、海外利益等所有国家安全风险都必须套用相同颜色和阈值。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">该法第63条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>预警必须与行动相接。\u003c/strong> 信息应能说明何种危险、可能影响谁、何时需要防范以及建议或依法要求采取何种措施。有关部门和单位再根据法定职责、风险程度及预案安排响应。预警级别、事件等级和应急响应级别含义不同，不能只凭数字相同便认定三者自动一一对应。\u003c/p>\n\u003cp>\u003cstrong>预警应动态调整。\u003c/strong> 发布后仍需跟踪情况，风险升高时及时加强防范，危险减弱或者消除时依法调整、解除预警和相关措施。发布一次警报后停止监测，或者危险已经消除仍长期保持原有措施，都不符合动态管理的要求。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>预警是在不确定性尚未消除时争取防范时间的制度。其合理性既取决于信息和判断的可靠程度，也取决于相应措施是否适当。预警不是对未来事件必然发生的保证，而是基于当时证据作出的风险提示。\u003c/p>\n\u003cp>预警过晚可能错过防范窗口，过度、频繁而缺乏依据的预警又可能削弱公众信任。因此，应说明判断依据和适用范围，及时更新信息，并使防范措施与风险相适应。不能以追求“零风险”为由无限扩大限制范围。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>“已经发布”还需要落实为“能够收到、理解并行动”。2025年总体预案要求对特殊人群、特殊场所、偏远地区、警报盲区及夜间等情形采取有针对性的通知措施，说明预警有效性还取决于传播和响应能力。\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">总体应急预案第3.2.2部分\u003c/a>。\u003c/p>\n\u003cp>本条的风险预警、第56条的评估报告和第58条的紧急事件报告，应分别辨明接收对象和程序。向上级报送信息不等于已经履行应当面向有关单位、人员或社会发布预警的义务；公开警报也不能替代内部必要的信息报告。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条包含持续掌握风险动态的“监测”与提示危险、促使有关主体采取防范行动的“预警”。二者相衔接，但监测信息本身并不等于已经作出的预警。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条有直接的改稿证据。2015年6月30日关于草案三次审议稿修改意见的报告第五项提出，在“预警”前增加“监测”：监测既是及时、准确发布风险预警的前提和基础，本身也是国家安全的一项重要制度。见《中华人民共和国国家安全法释义》附录，印刷第389页／PDF第402页。\u003c/p>\n\u003cp>现行关联规则应结合2024年修订的突发事件应对法第四章，以及2025年总体应急预案第3.2部分阅读。两书引用的旧法章次、条号和其他领域法律，应与现行文本逐项对应，不能将旧条号直接作为当前依据。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">突发事件应对法第四章\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">总体应急预案第3.2部分\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>监测要求持续获得和核对信息。\u003c/strong> 应根据领域特点确定监测对象、区域、指标、网点和责任主体，结合专业设备与有关信息渠道掌握变化，并开展分析研判。监测既要发现局部异常，也要注意风险可能跨区域、跨领域传导。\u003c/p>\n\u003cp>\u003cstrong>预警须根据风险程度及时作出。\u003c/strong> 判断应综合危险的紧迫程度、发展趋势、可能危害和防范需要。预警的对象、内容及发布主体须符合相应领域制度，不能因信息尚非完全确定便一概不发，也不能把未经核实的推测作为确定事实发布。\u003c/p>\n\u003cp>\u003cstrong>本条没有统一规定所有领域的预警等级。\u003c/strong> 突发事件应对法第63条规定的红、橙、黄、蓝四级，适用于可以预警的自然灾害、事故灾难和公共卫生事件。不能由此推定军事、金融、海外利益等所有国家安全风险都必须套用相同颜色和阈值。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">该法第63条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>预警必须与行动相接。\u003c/strong> 信息应能说明何种危险、可能影响谁、何时需要防范以及建议或依法要求采取何种措施。有关部门和单位再根据法定职责、风险程度及预案安排响应。预警级别、事件等级和应急响应级别含义不同，不能只凭数字相同便认定三者自动一一对应。\u003c/p>\n\u003cp>\u003cstrong>预警应动态调整。\u003c/strong> 发布后仍需跟踪情况，风险升高时及时加强防范，危险减弱或者消除时依法调整、解除预警和相关措施。发布一次警报后停止监测，或者危险已经消除仍长期保持原有措施，都不符合动态管理的要求。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>预警是在不确定性尚未消除时争取防范时间的制度。其合理性既取决于信息和判断的可靠程度，也取决于相应措施是否适当。预警不是对未来事件必然发生的保证，而是基于当时证据作出的风险提示。\u003c/p>\n\u003cp>预警过晚可能错过防范窗口，过度、频繁而缺乏依据的预警又可能削弱公众信任。因此，应说明判断依据和适用范围，及时更新信息，并使防范措施与风险相适应。不能以追求“零风险”为由无限扩大限制范围。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>“已经发布”还需要落实为“能够收到、理解并行动”。2025年总体预案要求对特殊人群、特殊场所、偏远地区、警报盲区及夜间等情形采取有针对性的通知措施，说明预警有效性还取决于传播和响应能力。\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">总体应急预案第3.2.2部分\u003c/a>。\u003c/p>\n\u003cp>本条的风险预警、第56条的评估报告和第58条的紧急事件报告，应分别辨明接收对象和程序。向上级报送信息不等于已经履行应当面向有关单位、人员或社会发布预警的义务；公开警报也不能替代内部必要的信息报告。\u003c/p>\n"},{"num":58,"label":"第五十八条","title":"危害国家安全事件的即时报告","lawText":"对可能即将发生或者已经发生的危害国家安全的事件，县级以上地方人民政府及其有关主管部门应当立即按照规定向上一级人民政府及其有关主管部门报告，必要时可以越级上报。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第五十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>对可能即将发生或者已经发生的危害国家安全的事件，县级以上地方人民政府及其有关主管部门应当立即按照规定向上一级人民政府及其有关主管部门报告，必要时可以越级上报。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第五十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>对可能即将发生或者已经发生的危害国家安全的事件，县级以上地方人民政府及其有关主管部门应当立即按照规定向上一级人民政府及其有关主管部门报告，必要时可以越级上报。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">危害国家安全事件的即时报告 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定政府及其主管部门的紧急报告义务，重点是使上级及时获得处置所需的信息。它不同于第56条的定期评估报告，也不同于第57条发布风险预警。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已将向上级报告相关事件列入风险预防、评估和预警的制度安排，2015年定稿明确了本条的报告主体、紧迫性要求和必要时越级上报。见《中华人民共和国国家安全法释义》附录，印刷第376—377页／PDF第389—390页。2015年4月关于危机信息报告与统一发布的另一项改稿说明对应后来第67条，不宜误写成本条的修改经过。\u003c/p>\n\u003cp>后续关联制度中，2024年修订的突发事件应对法第17、60—62条，以及2025年总体应急预案第3.3.1部分，进一步规定事件信息的立即报送、核实、续报和禁止迟报瞒报等要求。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">突发事件应对法\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">总体应急预案\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>触发情形包括即将发生和已经发生。\u003c/strong> “可能即将发生”允许在危害成为现实之前报告，不能等实际损失出现才启动。这里又不是泛指任何抽象猜测，应结合已有信息判断事件的现实可能性、迫近程度以及对国家安全的影响。\u003c/p>\n\u003cp>\u003cstrong>义务主体和报告渠道明确。\u003c/strong> 本条直接规定县级以上地方人民政府及其有关主管部门，要求按照规定向上一级人民政府及其有关主管部门报告。政府层级和主管部门渠道应依相应规定衔接，不能因本部门已向某一方面口头反映，就当然视为全部报送要求已经履行。乡镇、基层组织、企业和个人的有关报告义务，另须联系突发事件等法律规定理解。\u003c/p>\n\u003cp>\u003cstrong>“立即”要求及时报告已掌握的重要情况。\u003c/strong> 事件初期信息往往不完整，应区分已核实事实、初步判断和待核实事项，先依规定报告，再及时补充、更正。不能以伤亡数字尚未最终确定、原因尚未全部查清为由拖延，也不能为求报告完整而编造原因或者遗漏不利事实。\u003c/p>\n\u003cp>\u003cstrong>必要时可以越级上报。\u003c/strong> 这为事态特别紧急等情况下的信息传递保留直接通道，以防常规逐级传递延误处置。条文没有规定一切事件都应越级，也没有规定必须先经被越过层级同意才能报告。具体报送方式和衔接要求，应依适用制度执行。\u003c/p>\n\u003cp>\u003cstrong>报告和处置可以同步。\u003c/strong> 已发生的紧急事件应依法先行采取必要措施，并迅速上报、持续反馈。既不能以忙于处置为由长期不报，也不能因正在等待上级指示而放弃本级依法应当采取的先期措施。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条回应的是紧急事件中的信息不对称：基层较早接触事实，上级可能掌握更多资源和跨区域协调能力。及时、真实报告使这两种能力能够衔接；信息被拖延、扭曲或隐瞒，可能使处置措施与实际危险脱节。\u003c/p>\n\u003cp>“及时”与“准确”应通过分阶段报送同时实现。准确并不要求首次报告包含最终调查结论，而是要求如实表达当时掌握的情况，并明确不确定之处。及时补报新事实、纠正初步判断，不能简单等同于首次报告虚假。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>2025年总体预案列出的报告内容包括时间、地点、信息来源、事件性质、影响与损害、人员情况、发展趋势及已采取措施，并要求根据变化续报。事件可能演化为特别重大、重大突发事件的，应立即报告，不受突发事件分级标准限制。\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">总体应急预案第3.3.1部分\u003c/a>。\u003c/p>\n\u003cp>内部报告与对外信息发布分别承担决策支持和公众知情、防范的功能。完成其中一种不能当然替代另一种；本条也未设定所有事件统一的“几小时内”时限。具体时限、公开范围及发布主体，应结合适用法律、预案和有关规定核对。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定政府及其主管部门的紧急报告义务，重点是使上级及时获得处置所需的信息。它不同于第56条的定期评估报告，也不同于第57条发布风险预警。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已将向上级报告相关事件列入风险预防、评估和预警的制度安排，2015年定稿明确了本条的报告主体、紧迫性要求和必要时越级上报。见《中华人民共和国国家安全法释义》附录，印刷第376—377页／PDF第389—390页。2015年4月关于危机信息报告与统一发布的另一项改稿说明对应后来第67条，不宜误写成本条的修改经过。\u003c/p>\n\u003cp>后续关联制度中，2024年修订的突发事件应对法第17、60—62条，以及2025年总体应急预案第3.3.1部分，进一步规定事件信息的立即报送、核实、续报和禁止迟报瞒报等要求。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">突发事件应对法\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">总体应急预案\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>触发情形包括即将发生和已经发生。\u003c/strong> “可能即将发生”允许在危害成为现实之前报告，不能等实际损失出现才启动。这里又不是泛指任何抽象猜测，应结合已有信息判断事件的现实可能性、迫近程度以及对国家安全的影响。\u003c/p>\n\u003cp>\u003cstrong>义务主体和报告渠道明确。\u003c/strong> 本条直接规定县级以上地方人民政府及其有关主管部门，要求按照规定向上一级人民政府及其有关主管部门报告。政府层级和主管部门渠道应依相应规定衔接，不能因本部门已向某一方面口头反映，就当然视为全部报送要求已经履行。乡镇、基层组织、企业和个人的有关报告义务，另须联系突发事件等法律规定理解。\u003c/p>\n\u003cp>\u003cstrong>“立即”要求及时报告已掌握的重要情况。\u003c/strong> 事件初期信息往往不完整，应区分已核实事实、初步判断和待核实事项，先依规定报告，再及时补充、更正。不能以伤亡数字尚未最终确定、原因尚未全部查清为由拖延，也不能为求报告完整而编造原因或者遗漏不利事实。\u003c/p>\n\u003cp>\u003cstrong>必要时可以越级上报。\u003c/strong> 这为事态特别紧急等情况下的信息传递保留直接通道，以防常规逐级传递延误处置。条文没有规定一切事件都应越级，也没有规定必须先经被越过层级同意才能报告。具体报送方式和衔接要求，应依适用制度执行。\u003c/p>\n\u003cp>\u003cstrong>报告和处置可以同步。\u003c/strong> 已发生的紧急事件应依法先行采取必要措施，并迅速上报、持续反馈。既不能以忙于处置为由长期不报，也不能因正在等待上级指示而放弃本级依法应当采取的先期措施。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条回应的是紧急事件中的信息不对称：基层较早接触事实，上级可能掌握更多资源和跨区域协调能力。及时、真实报告使这两种能力能够衔接；信息被拖延、扭曲或隐瞒，可能使处置措施与实际危险脱节。\u003c/p>\n\u003cp>“及时”与“准确”应通过分阶段报送同时实现。准确并不要求首次报告包含最终调查结论，而是要求如实表达当时掌握的情况，并明确不确定之处。及时补报新事实、纠正初步判断，不能简单等同于首次报告虚假。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>2025年总体预案列出的报告内容包括时间、地点、信息来源、事件性质、影响与损害、人员情况、发展趋势及已采取措施，并要求根据变化续报。事件可能演化为特别重大、重大突发事件的，应立即报告，不受突发事件分级标准限制。\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">总体应急预案第3.3.1部分\u003c/a>。\u003c/p>\n\u003cp>内部报告与对外信息发布分别承担决策支持和公众知情、防范的功能。完成其中一种不能当然替代另一种；本条也未设定所有事件统一的“几小时内”时限。具体时限、公开范围及发布主体，应结合适用法律、预案和有关规定核对。\u003c/p>\n"},{"num":59,"label":"第五十九条","title":"国家安全审查和监管的范围","lawText":"国家建立国家安全审查和监管的制度和机制，对影响或者可能影响国家安全的外商投资、特定物项和关键技术、网络信息技术产品和服务、涉及国家安全事项的建设项目，以及其他重大事项和活动，进行国家安全审查，有效预防和化解国家安全风险。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第五十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立国家安全审查和监管的制度和机制，对影响或者可能影响国家安全的外商投资、特定物项和关键技术、网络信息技术产品和服务、涉及国家安全事项的建设项目，以及其他重大事项和活动，进行国家安全审查，有效预防和化解国家安全风险。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第五十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立国家安全审查和监管的制度和机制，对影响或者可能影响国家安全的外商投资、特定物项和关键技术、网络信息技术产品和服务、涉及国家安全事项的建设项目，以及其他重大事项和活动，进行国家安全审查，有效预防和化解国家安全风险。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全审查和监管的范围 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条以“影响或者可能影响国家安全”为风险联系，列举重点审查事项并保留兜底规定。它确立的是预防、化解风险的制度框架；具体事项是否须申报、由谁审查以及适用何种程序，还要依据相关专门规范。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>由原则规定转向列明事项。\u003c/strong> 2015年6月24日审议结果报告认为，二审稿第56条较为原则，建议把已有审查实践的外商投资等事项列入，另设“其他重大事项和活动”的兜底表述。报告中的建议稿写作“特定物项和技术出口”，尚非最终用语。见甲书附录四第384—385页（PDF397—398页）。\u003c/p>\n\u003cp>\u003cstrong>最后审议阶段调整技术范围。\u003c/strong> 2015年6月30日三审稿修改意见报告建议，将“特定物项和技术出口”改为“特定物项和关键技术”：一方面，一些物项和技术的进口也需纳入考虑；另一方面，突出对国家安全有影响的关键技术。见甲书附录五第389页（PDF402页）。因此，本项不能被限缩为技术出口审查，也不能扩张为所有技术活动一律须审查。\u003c/p>\n\u003cp>\u003cstrong>从综合规定到分领域制度。\u003c/strong> 此后，外商投资法及外商投资安全审查办法、出口管制法、网络安全法及网络安全审查办法、数据安全法等分别形成更具体的规则。2024年两用物项出口管制条例、2025年施行的建设项目许可管理规定又有进一步发展。阅读时须把2015年的总体设计与这些后续制度分开，并注意不同审查、许可和评估程序之间的联系与区别。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>审查具有预防性，但并不限于一次事前批准。\u003c/strong> “可能影响”允许在危害实际发生前进行风险判断；“监管”则要求关注后续实施、条件履行和风险变化。违法行为可以引起调查处罚，但没有已经发生的违法行为，也可能依法启动风险审查。\u003c/li>\n\u003cli>\u003cstrong>外商投资关注投资活动及其安全影响。\u003c/strong> 后续办法覆盖新建项目、设立企业、股权或资产并购等直接、间接投资方式。申报范围还须结合行业、地域及相应控制权条件判断；不能把“有外资”本身等同于必须通过全部审查程序。\u003ca href=\"https://zfxxgk.ndrc.gov.cn/web/iteminfo.jsp?id=18525\">外商投资安全审查办法第2—4条\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>特定物项和关键技术涉及流转及使用风险。\u003c/strong> 应结合物项性能、用途、接收对象和适用清单等分析。出口管制是重要具体制度，但并不覆盖本条所有审查事项。2024年两用物项出口管制条例整合相关制度，并规定清单、临时管制、许可及最终用户、最终用途等要求；书中部分旧条例已被替代，不能照旧列作全部现行依据。\u003ca href=\"https://www.mofcom.gov.cn/zcfb/dwmygl/art/2024/art_6ed1d5c0336843c493bd45a1911eab17.html\">两用物项出口管制条例\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>网络信息技术产品和服务须关注系统性风险。\u003c/strong> 除产品功能，还可能涉及供应中断、非法控制、数据被窃取及关键基础设施受影响等风险。现行网络安全法第37条规定关键信息基础设施运营者采购网络产品和服务的相关安全审查；网络安全审查办法还规定网络平台运营者数据处理活动的适用条件。原第35条在2025年修法后顺延为第37条，引用应标明版本。\u003ca href=\"https://www.cac.gov.cn/2025-12/29/c_1768735112911946.htm\">现行网络安全法\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>建设项目须与法定安全事项相联系。\u003c/strong> 2025年3月1日起施行的四部门令第5号，适用于境内重要国家机关、国防军工单位、其他重要涉密单位及重要军事设施周边安全控制区域内的土木、建筑等工程项目；新建、改建、扩建须依法取得许可。安全控制区域须依反间谍法第21条及配套规定划定，并报省级人民政府批准。一般规划、建设审批与此项许可各有依据，项目也不以具有外资为适用前提。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/202304/t20230426_429064.html\">反间谍法第21条\u003c/a>、\u003ca href=\"https://zrzy.pingliang.gov.cn/zfxxgk/fdzdgknr/lzyj/sjzc/art/2025/art_ecb31fd635714b6ea1f1017a02f7750b.html\">建设项目许可管理规定第2—7条\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>兜底规定保持制度适应性。\u003c/strong> “其他重大事项和活动”使法律能够应对未列举的新风险，仍须结合国家重大利益、事项重要程度及具体法律制度解释。它不是任何部门可自行要求任何活动接受无限审查的授权。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>风险审查与违法追究〔笔记分析〕。\u003c/strong> 前者主要回答活动是否带来不可接受的国家安全风险，以及风险能否通过条件消除；后者判断是否违反具体义务、应承担何种责任。二者可能相继发生，但审查发现风险不等于已构成犯罪，行政处罚也须具备相应实体和程序依据。\u003c/p>\n\u003cp>\u003cstrong>开放与安全的协调。\u003c/strong> 外资准入管理、经营者集中审查和国家安全审查分别处理不同问题。符合某项准入条件，不能当然代替其他依法应履行的程序；安全审查也应说明风险联系及措施依据，避免把正常商业竞争或抽象猜测直接等同于国家安全威胁。\u003c/p>\n\u003cp>\u003cstrong>比较美国制度。\u003c/strong> 美国CFIUS在传统控制性交易之外，也依法审查特定非控制性投资和房地产交易；因此，外国安全审查不能简单概括为“只有收购控股才适用”。制度比较宜分别考察管辖范围、风险因素、程序、减缓条件及监督，而不是把各国名称相近的机制视为同一制度。\u003ca href=\"https://home.treasury.gov/faq-item/international-affairs/do-the-firrma-regulations-change-cfiuss-jurisdiction-over-transactions-that-could-result-in-control-of-a-us-business-by-a-foreign-person\">美国财政部关于CFIUS管辖范围的说明\u003c/a>。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>滴滴案例要分清程序与时间。\u003c/strong> 2021年启动网络安全审查后，国家网信办根据审查结论、发现的问题和线索另行立案调查，并于2022年作出行政处罚。它可以说明风险审查与违法调查之间的衔接，不能把罚款说成第59条直接设定的“审查处罚”，也不能倒用2022年才施行的审查办法解释2021年启动时的全部依据。\u003ca href=\"https://www.cac.gov.cn/2021-07/02/c_1626811521011934.htm\">启动审查公告\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2022-07/21/c_1660021534306352.htm\">行政处罚通报\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>数据出境评估另有制度。\u003c/strong> 数据安全法第24条规定的数据安全审查、网络安全审查，以及数据出境安全评估之间可能存在关联，但对象、触发条件和程序并不相同。2024年《促进和规范数据跨境流动规定》又对出境评估范围、豁免及有效期作出调整。研读时应分别查明适用制度。\u003ca href=\"https://www.cac.gov.cn/2021-06/11/c_1624994566919140.htm\">数据安全法第24条\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2022-01/04/c_1642894602182845.htm\">网络安全审查办法\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2024-03/22/c_1712776611775634.htm\">促进和规范数据跨境流动规定\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>研究问题。\u003c/strong> 对某项投资或技术活动，应如何说明它与国家安全的实际联系，并在风险可通过合理条件消除时，选择适当的审查和监管方式？\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条以“影响或者可能影响国家安全”为风险联系，列举重点审查事项并保留兜底规定。它确立的是预防、化解风险的制度框架；具体事项是否须申报、由谁审查以及适用何种程序，还要依据相关专门规范。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>由原则规定转向列明事项。\u003c/strong> 2015年6月24日审议结果报告认为，二审稿第56条较为原则，建议把已有审查实践的外商投资等事项列入，另设“其他重大事项和活动”的兜底表述。报告中的建议稿写作“特定物项和技术出口”，尚非最终用语。见甲书附录四第384—385页（PDF397—398页）。\u003c/p>\n\u003cp>\u003cstrong>最后审议阶段调整技术范围。\u003c/strong> 2015年6月30日三审稿修改意见报告建议，将“特定物项和技术出口”改为“特定物项和关键技术”：一方面，一些物项和技术的进口也需纳入考虑；另一方面，突出对国家安全有影响的关键技术。见甲书附录五第389页（PDF402页）。因此，本项不能被限缩为技术出口审查，也不能扩张为所有技术活动一律须审查。\u003c/p>\n\u003cp>\u003cstrong>从综合规定到分领域制度。\u003c/strong> 此后，外商投资法及外商投资安全审查办法、出口管制法、网络安全法及网络安全审查办法、数据安全法等分别形成更具体的规则。2024年两用物项出口管制条例、2025年施行的建设项目许可管理规定又有进一步发展。阅读时须把2015年的总体设计与这些后续制度分开，并注意不同审查、许可和评估程序之间的联系与区别。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>审查具有预防性，但并不限于一次事前批准。\u003c/strong> “可能影响”允许在危害实际发生前进行风险判断；“监管”则要求关注后续实施、条件履行和风险变化。违法行为可以引起调查处罚，但没有已经发生的违法行为，也可能依法启动风险审查。\u003c/li>\n\u003cli>\u003cstrong>外商投资关注投资活动及其安全影响。\u003c/strong> 后续办法覆盖新建项目、设立企业、股权或资产并购等直接、间接投资方式。申报范围还须结合行业、地域及相应控制权条件判断；不能把“有外资”本身等同于必须通过全部审查程序。\u003ca href=\"https://zfxxgk.ndrc.gov.cn/web/iteminfo.jsp?id=18525\">外商投资安全审查办法第2—4条\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>特定物项和关键技术涉及流转及使用风险。\u003c/strong> 应结合物项性能、用途、接收对象和适用清单等分析。出口管制是重要具体制度，但并不覆盖本条所有审查事项。2024年两用物项出口管制条例整合相关制度，并规定清单、临时管制、许可及最终用户、最终用途等要求；书中部分旧条例已被替代，不能照旧列作全部现行依据。\u003ca href=\"https://www.mofcom.gov.cn/zcfb/dwmygl/art/2024/art_6ed1d5c0336843c493bd45a1911eab17.html\">两用物项出口管制条例\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>网络信息技术产品和服务须关注系统性风险。\u003c/strong> 除产品功能，还可能涉及供应中断、非法控制、数据被窃取及关键基础设施受影响等风险。现行网络安全法第37条规定关键信息基础设施运营者采购网络产品和服务的相关安全审查；网络安全审查办法还规定网络平台运营者数据处理活动的适用条件。原第35条在2025年修法后顺延为第37条，引用应标明版本。\u003ca href=\"https://www.cac.gov.cn/2025-12/29/c_1768735112911946.htm\">现行网络安全法\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>建设项目须与法定安全事项相联系。\u003c/strong> 2025年3月1日起施行的四部门令第5号，适用于境内重要国家机关、国防军工单位、其他重要涉密单位及重要军事设施周边安全控制区域内的土木、建筑等工程项目；新建、改建、扩建须依法取得许可。安全控制区域须依反间谍法第21条及配套规定划定，并报省级人民政府批准。一般规划、建设审批与此项许可各有依据，项目也不以具有外资为适用前提。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/202304/t20230426_429064.html\">反间谍法第21条\u003c/a>、\u003ca href=\"https://zrzy.pingliang.gov.cn/zfxxgk/fdzdgknr/lzyj/sjzc/art/2025/art_ecb31fd635714b6ea1f1017a02f7750b.html\">建设项目许可管理规定第2—7条\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>兜底规定保持制度适应性。\u003c/strong> “其他重大事项和活动”使法律能够应对未列举的新风险，仍须结合国家重大利益、事项重要程度及具体法律制度解释。它不是任何部门可自行要求任何活动接受无限审查的授权。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>风险审查与违法追究〔笔记分析〕。\u003c/strong> 前者主要回答活动是否带来不可接受的国家安全风险，以及风险能否通过条件消除；后者判断是否违反具体义务、应承担何种责任。二者可能相继发生，但审查发现风险不等于已构成犯罪，行政处罚也须具备相应实体和程序依据。\u003c/p>\n\u003cp>\u003cstrong>开放与安全的协调。\u003c/strong> 外资准入管理、经营者集中审查和国家安全审查分别处理不同问题。符合某项准入条件，不能当然代替其他依法应履行的程序；安全审查也应说明风险联系及措施依据，避免把正常商业竞争或抽象猜测直接等同于国家安全威胁。\u003c/p>\n\u003cp>\u003cstrong>比较美国制度。\u003c/strong> 美国CFIUS在传统控制性交易之外，也依法审查特定非控制性投资和房地产交易；因此，外国安全审查不能简单概括为“只有收购控股才适用”。制度比较宜分别考察管辖范围、风险因素、程序、减缓条件及监督，而不是把各国名称相近的机制视为同一制度。\u003ca href=\"https://home.treasury.gov/faq-item/international-affairs/do-the-firrma-regulations-change-cfiuss-jurisdiction-over-transactions-that-could-result-in-control-of-a-us-business-by-a-foreign-person\">美国财政部关于CFIUS管辖范围的说明\u003c/a>。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>滴滴案例要分清程序与时间。\u003c/strong> 2021年启动网络安全审查后，国家网信办根据审查结论、发现的问题和线索另行立案调查，并于2022年作出行政处罚。它可以说明风险审查与违法调查之间的衔接，不能把罚款说成第59条直接设定的“审查处罚”，也不能倒用2022年才施行的审查办法解释2021年启动时的全部依据。\u003ca href=\"https://www.cac.gov.cn/2021-07/02/c_1626811521011934.htm\">启动审查公告\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2022-07/21/c_1660021534306352.htm\">行政处罚通报\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>数据出境评估另有制度。\u003c/strong> 数据安全法第24条规定的数据安全审查、网络安全审查，以及数据出境安全评估之间可能存在关联，但对象、触发条件和程序并不相同。2024年《促进和规范数据跨境流动规定》又对出境评估范围、豁免及有效期作出调整。研读时应分别查明适用制度。\u003ca href=\"https://www.cac.gov.cn/2021-06/11/c_1624994566919140.htm\">数据安全法第24条\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2022-01/04/c_1642894602182845.htm\">网络安全审查办法\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2024-03/22/c_1712776611775634.htm\">促进和规范数据跨境流动规定\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>研究问题。\u003c/strong> 对某项投资或技术活动，应如何说明它与国家安全的实际联系，并在风险可通过合理条件消除时，选择适当的审查和监管方式？\u003c/p>\n"},{"num":60,"label":"第六十条","title":"中央国家机关的安全审查职责及执行监督","lawText":"中央国家机关各部门依照法律、行政法规行使国家安全审查职责，依法作出国家安全审查决定或者提出安全审查意见并监督执行。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第六十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中央国家机关各部门依照法律、行政法规行使国家安全审查职责，依法作出国家安全审查决定或者提出安全审查意见并监督执行。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第六十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中央国家机关各部门依照法律、行政法规行使国家安全审查职责，依法作出国家安全审查决定或者提出安全审查意见并监督执行。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">中央国家机关的安全审查职责及执行监督 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>第59条主要回答审查哪些事项，本条进一步规定中央国家机关如何依法承担审查、提出意见和监督执行的职责。关键是依法律、行政法规确定权限和程序，并把审查结果落实到实际活动中。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>既有审查实践的职责表达。\u003c/strong> 2014年草案说明已将国家安全重大事项审查和监管列入制度安排，见甲书附录二第376—377页（PDF389—390页）。2015年法律作综合规定时，外资并购、物项出口、网络产品和建设项目等已有不同程度的实践；所核审议材料未提供本条逐句改稿经过。\u003c/p>\n\u003cp>\u003cstrong>外资审查程序发生重要发展。\u003c/strong> 2011年外资并购安全审查采用商务部受理、部际联席会议审查的安排。2020年公布、2021年1月18日起施行的外商投资安全审查办法，规定工作机制办公室设在国家发展改革委，由国家发展改革委、商务部牵头承担日常工作。早期释义所载旧流程应作为历史材料，不能与现行办法的工作机制、期限拼接使用。\u003ca href=\"https://zfxxgk.ndrc.gov.cn/web/iteminfo.jsp?id=18525\">现行办法第3、7—10条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>其他领域分别完善。\u003c/strong> 网络安全审查、两用物项出口许可和涉及国家安全事项的建设项目许可，各自发展了主管、协作和程序规则。本条并未把它们合并成一个由同一机关办理、适用相同期日的通用审查程序。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>有安全职责，不等于拥有全部审查权。\u003c/strong> 中央国家机关须在法律、行政法规规定的范围内履职。专门规则可以细化材料、标准和办理程序，但不能只凭一般管理职责或者机关自定文件任意增设审查事项。\u003c/li>\n\u003cli>\u003cstrong>直接审查与系统指导相互衔接。\u003c/strong> 部门可以依法直接承担具体审查，也可以依其职权明确标准、指导本系统工作。地方机关是否有权作出决定，仍须有相应依据；中央机关的业务指导不能自动替代对地方权限的法律规定。\u003c/li>\n\u003cli>\u003cstrong>审查决定与审查意见具有不同作用。\u003c/strong> 决定可能直接形成是否通过、禁止或者附条件通过等结论；意见则可能是向最终决定机关提供的专业判断，也可能按具体制度产生相应效力。应根据作出主体、法律依据和制度规定判断，不能把所有意见都当成可有可无的建议，也不能把每份内部意见都当成最终决定。\u003c/li>\n\u003cli>\u003cstrong>跨部门参加不改变法定决定主体。\u003c/strong> 一个事项可能需要行业、技术、保密或国家安全部门提供意见，但由谁受理、组织审查、通知当事人及作出最终结论，仍应依该领域规则确认。不能把“共同审查”理解为各参加部门均可重复作出同样的决定。\u003c/li>\n\u003cli>\u003cstrong>监督执行是持续职责。\u003c/strong> 对附条件通过的事项，应核实条件是否实际履行；对方案变化、虚假材料或违反条件等情形，按适用规则重新审查或作相应处理。作出书面结论之后，监管责任并未当然结束。\u003c/li>\n\u003c/ol>\n\u003cp>以外商投资安全审查为例，现行办法的主要阶段为：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>办法规定的基本安排\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>是否需要审查\u003c/td>\n\u003ctd>收到符合要求的申报材料之日起15个工作日内作出决定并书面通知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一般审查\u003c/td>\n\u003ctd>决定开展审查之日起30个工作日内完成；认为影响或可能影响国家安全的，启动特别审查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>特别审查\u003c/td>\n\u003ctd>原则上自启动之日起60个工作日内完成；特殊情况下可延长并书面通知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结论及监督\u003c/td>\n\u003ctd>依情况通过、禁止或者附条件通过；工作机制办公室会同有关部门、地方政府监督实施\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>是否需要审查的决定作出前及审查期间，当事人不得实施投资。补充材料的时间不计入审查期限；审查期间修改投资方案的，期限自收到修改后方案之日起重新计算。审查通过后变更方案，符合第14条条件的须重新申报。这些规则意味着，不能简单承诺整个程序固定在“15＋30＋60日”内结束。该表仅说明外资安审。\u003ca href=\"https://zfxxgk.ndrc.gov.cn/web/iteminfo.jsp?id=18525\">办法第7—14条\u003c/a>。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>决定与持续监督〔笔记分析〕。\u003c/strong> 风险可能因股权、经营方式、技术能力或数据处理活动变化而改变。审查与监管相连接，能够避免把某次通过理解为对未来全部活动的无限许可，也使附加条件具有实际意义。\u003c/p>\n\u003cp>\u003cstrong>专业判断与程序约束。\u003c/strong> 安全审查可能涉及专业知识和不宜公开的信息，但其权限、材料使用、办理程序、保密义务及工作人员责任仍应受规范约束。应区分信息公开范围与权力是否依法行使，不能由部分材料保密推导审查不受任何约束。\u003c/p>\n\u003cp>\u003cstrong>救济规则须分领域判断。\u003c/strong> 外商投资法第35条、数据安全法第24条分别规定，依法作出的相应安全审查决定为最终决定；2025年建设项目许可管理规定第20条则明确了复议及后续诉讼的路径。第59—60条本身未将所有领域审查及关联行政处罚一律规定为不可救济的最终决定。\u003ca href=\"https://tfs.mofcom.gov.cn/fl/art/2021/art_6fec75c3a5bf436ba81173c46f9a9782.html\">外商投资法\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2021-06/11/c_1624994566919140.htm\">数据安全法\u003c/a>、\u003ca href=\"https://zrzy.pingliang.gov.cn/zfxxgk/fdzdgknr/lzyj/sjzc/art/2025/art_ecb31fd635714b6ea1f1017a02f7750b.html\">建设项目许可管理规定\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>风险减缓的比较。\u003c/strong> 美国CFIUS可以依法通过协议、条件或命令处理特定交易风险，并由财政部协调有关机关监督执行。这与我国外资审查中的附条件通过，在功能上都提示“审查结果＋持续履行”的联系；具体条件、权限和程序仍须分别依各国制度判断。\u003ca href=\"https://www.cfius.gov/monitoring-enforcement/mitigation/\">CFIUS关于风险减缓及监督的说明\u003c/a>。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>书中程序需要更新。\u003c/strong> 乙书第167页已采用现行外资审查办法的一般审查规定，第168页又引入旧并购联席会议的流程。研读时须拆开这两个时期；不能把工作机制办公室的30个工作日与旧流程中商务部、联席会议之间的期限直接叠加。\u003c/p>\n\u003cp>\u003cstrong>境外案例的适当用途。\u003c/strong> 美格纳与智路资本相关交易当事人于2021年12月13日宣布撤回CFIUS申报并拟终止合并协议，随后向美国证交会提交的文件记载合并协议于12月20日终止。该事例可说明安全审查对交易安排的影响，但属于外国制度的比较材料，不是我国第60条的直接适用案例；也不能仅凭在美国上市这一事实，就概括认定任何交易均受CFIUS管辖。\u003ca href=\"https://investors.magnachip.com/node/12801\">公司联合公告\u003c/a>、\u003ca href=\"https://www.sec.gov/Archives/edgar/data/1325702/000119312521363713/d261583d8k.htm\">向美国证交会提交的8-K文件\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>衔接下一条。\u003c/strong> 第60条规定中央层面，第61条规定省级区域内的相关审查监管。理解二者，应同时核对具体事项的法定权限及中央与地方的分工安排。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>第59条主要回答审查哪些事项，本条进一步规定中央国家机关如何依法承担审查、提出意见和监督执行的职责。关键是依法律、行政法规确定权限和程序，并把审查结果落实到实际活动中。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>既有审查实践的职责表达。\u003c/strong> 2014年草案说明已将国家安全重大事项审查和监管列入制度安排，见甲书附录二第376—377页（PDF389—390页）。2015年法律作综合规定时，外资并购、物项出口、网络产品和建设项目等已有不同程度的实践；所核审议材料未提供本条逐句改稿经过。\u003c/p>\n\u003cp>\u003cstrong>外资审查程序发生重要发展。\u003c/strong> 2011年外资并购安全审查采用商务部受理、部际联席会议审查的安排。2020年公布、2021年1月18日起施行的外商投资安全审查办法，规定工作机制办公室设在国家发展改革委，由国家发展改革委、商务部牵头承担日常工作。早期释义所载旧流程应作为历史材料，不能与现行办法的工作机制、期限拼接使用。\u003ca href=\"https://zfxxgk.ndrc.gov.cn/web/iteminfo.jsp?id=18525\">现行办法第3、7—10条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>其他领域分别完善。\u003c/strong> 网络安全审查、两用物项出口许可和涉及国家安全事项的建设项目许可，各自发展了主管、协作和程序规则。本条并未把它们合并成一个由同一机关办理、适用相同期日的通用审查程序。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>有安全职责，不等于拥有全部审查权。\u003c/strong> 中央国家机关须在法律、行政法规规定的范围内履职。专门规则可以细化材料、标准和办理程序，但不能只凭一般管理职责或者机关自定文件任意增设审查事项。\u003c/li>\n\u003cli>\u003cstrong>直接审查与系统指导相互衔接。\u003c/strong> 部门可以依法直接承担具体审查，也可以依其职权明确标准、指导本系统工作。地方机关是否有权作出决定，仍须有相应依据；中央机关的业务指导不能自动替代对地方权限的法律规定。\u003c/li>\n\u003cli>\u003cstrong>审查决定与审查意见具有不同作用。\u003c/strong> 决定可能直接形成是否通过、禁止或者附条件通过等结论；意见则可能是向最终决定机关提供的专业判断，也可能按具体制度产生相应效力。应根据作出主体、法律依据和制度规定判断，不能把所有意见都当成可有可无的建议，也不能把每份内部意见都当成最终决定。\u003c/li>\n\u003cli>\u003cstrong>跨部门参加不改变法定决定主体。\u003c/strong> 一个事项可能需要行业、技术、保密或国家安全部门提供意见，但由谁受理、组织审查、通知当事人及作出最终结论，仍应依该领域规则确认。不能把“共同审查”理解为各参加部门均可重复作出同样的决定。\u003c/li>\n\u003cli>\u003cstrong>监督执行是持续职责。\u003c/strong> 对附条件通过的事项，应核实条件是否实际履行；对方案变化、虚假材料或违反条件等情形，按适用规则重新审查或作相应处理。作出书面结论之后，监管责任并未当然结束。\u003c/li>\n\u003c/ol>\n\u003cp>以外商投资安全审查为例，现行办法的主要阶段为：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>办法规定的基本安排\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>是否需要审查\u003c/td>\n\u003ctd>收到符合要求的申报材料之日起15个工作日内作出决定并书面通知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一般审查\u003c/td>\n\u003ctd>决定开展审查之日起30个工作日内完成；认为影响或可能影响国家安全的，启动特别审查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>特别审查\u003c/td>\n\u003ctd>原则上自启动之日起60个工作日内完成；特殊情况下可延长并书面通知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结论及监督\u003c/td>\n\u003ctd>依情况通过、禁止或者附条件通过；工作机制办公室会同有关部门、地方政府监督实施\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>是否需要审查的决定作出前及审查期间，当事人不得实施投资。补充材料的时间不计入审查期限；审查期间修改投资方案的，期限自收到修改后方案之日起重新计算。审查通过后变更方案，符合第14条条件的须重新申报。这些规则意味着，不能简单承诺整个程序固定在“15＋30＋60日”内结束。该表仅说明外资安审。\u003ca href=\"https://zfxxgk.ndrc.gov.cn/web/iteminfo.jsp?id=18525\">办法第7—14条\u003c/a>。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>决定与持续监督〔笔记分析〕。\u003c/strong> 风险可能因股权、经营方式、技术能力或数据处理活动变化而改变。审查与监管相连接，能够避免把某次通过理解为对未来全部活动的无限许可，也使附加条件具有实际意义。\u003c/p>\n\u003cp>\u003cstrong>专业判断与程序约束。\u003c/strong> 安全审查可能涉及专业知识和不宜公开的信息，但其权限、材料使用、办理程序、保密义务及工作人员责任仍应受规范约束。应区分信息公开范围与权力是否依法行使，不能由部分材料保密推导审查不受任何约束。\u003c/p>\n\u003cp>\u003cstrong>救济规则须分领域判断。\u003c/strong> 外商投资法第35条、数据安全法第24条分别规定，依法作出的相应安全审查决定为最终决定；2025年建设项目许可管理规定第20条则明确了复议及后续诉讼的路径。第59—60条本身未将所有领域审查及关联行政处罚一律规定为不可救济的最终决定。\u003ca href=\"https://tfs.mofcom.gov.cn/fl/art/2021/art_6fec75c3a5bf436ba81173c46f9a9782.html\">外商投资法\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2021-06/11/c_1624994566919140.htm\">数据安全法\u003c/a>、\u003ca href=\"https://zrzy.pingliang.gov.cn/zfxxgk/fdzdgknr/lzyj/sjzc/art/2025/art_ecb31fd635714b6ea1f1017a02f7750b.html\">建设项目许可管理规定\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>风险减缓的比较。\u003c/strong> 美国CFIUS可以依法通过协议、条件或命令处理特定交易风险，并由财政部协调有关机关监督执行。这与我国外资审查中的附条件通过，在功能上都提示“审查结果＋持续履行”的联系；具体条件、权限和程序仍须分别依各国制度判断。\u003ca href=\"https://www.cfius.gov/monitoring-enforcement/mitigation/\">CFIUS关于风险减缓及监督的说明\u003c/a>。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>书中程序需要更新。\u003c/strong> 乙书第167页已采用现行外资审查办法的一般审查规定，第168页又引入旧并购联席会议的流程。研读时须拆开这两个时期；不能把工作机制办公室的30个工作日与旧流程中商务部、联席会议之间的期限直接叠加。\u003c/p>\n\u003cp>\u003cstrong>境外案例的适当用途。\u003c/strong> 美格纳与智路资本相关交易当事人于2021年12月13日宣布撤回CFIUS申报并拟终止合并协议，随后向美国证交会提交的文件记载合并协议于12月20日终止。该事例可说明安全审查对交易安排的影响，但属于外国制度的比较材料，不是我国第60条的直接适用案例；也不能仅凭在美国上市这一事实，就概括认定任何交易均受CFIUS管辖。\u003ca href=\"https://investors.magnachip.com/node/12801\">公司联合公告\u003c/a>、\u003ca href=\"https://www.sec.gov/Archives/edgar/data/1325702/000119312521363713/d261583d8k.htm\">向美国证交会提交的8-K文件\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>衔接下一条。\u003c/strong> 第60条规定中央层面，第61条规定省级区域内的相关审查监管。理解二者，应同时核对具体事项的法定权限及中央与地方的分工安排。\u003c/p>\n"},{"num":61,"label":"第六十一条","title":"地方的国家安全审查和监管职责","lawText":"省、自治区、直辖市依法负责本行政区域内有关国家安全审查和监管工作。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第六十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>省、自治区、直辖市依法负责本行政区域内有关国家安全审查和监管工作。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第六十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>省、自治区、直辖市依法负责本行政区域内有关国家安全审查和监管工作。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">地方的国家安全审查和监管职责 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条承接第59条的制度范围和第60条的中央部门职责，解决审查、监管工作如何在地方落实的问题。理解本条，应同时抓住“省级”“本行政区域”“有关”和“依法”四个限定，不能从地方维护国家安全的一般责任直接推出对所有事项的独立审查决定权。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条立法前，涉及国家安全事项的建设项目管理、外商投资管理等制度已经存在地方参与的安排。2014年12月的草案说明，将国家安全重大事项审查和监管列入国家安全基本制度；2015年法律进一步以第60、61条明确中央与地方的职责衔接。所核审议材料未展示本条逐字修改过程，不据此推定其从初稿到定稿完全未变。\u003c/p>\n\u003cp>配套制度后来发生变化，尤其外商投资管理已不能继续简单套用旧的企业设立审批模式。现行《外商投资安全审查办法》规定，国家层面的工作机制办公室可以委托省级政府有关部门代收、转送申报材料，并会同有关部门、地方政府监督决定实施。这说明地方参与包括程序协助和执行监督，并不当然包含最终决定权。\u003ca href=\"https://zfxxgk.ndrc.gov.cn/web/iteminfo.jsp?id=18525\">《外商投资安全审查办法》第6、13条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 明确地方责任，具体事项仍须查明具体机关。\u003c/strong> 条文以省、自治区、直辖市为地域和责任层级，实际办理则由依法具有相关职权的机关承担。不能将其理解为省内所有部门均有审查权；市县是否参与、承担何种工作，也须依据具体制度确定。\u003c/p>\n\u003cp>\u003cstrong>2. 审查与监管相互配合。\u003c/strong> 审查侧重依法判断特定事项是否影响国家安全及是否准许实施；监管侧重掌握实施情况、核查附加条件、发现变化和处置问题。审查通过以后仍可能需要地方持续监督，不能把发出决定视为全部职责完成。\u003c/p>\n\u003cp>\u003cstrong>3. 属地范围不替代法定权限。\u003c/strong> 项目位于某省，只能说明其与该省存在地域联系。依法由中央决定的事项，地方不得自行批准或否决；依法交由地方办理的事项，也不能一概推给中央。“有关”应结合各领域事权安排理解。\u003c/p>\n\u003cp>\u003cstrong>4. 地方实施须遵守统一标准。\u003c/strong> 地方可以依法结合实际完善执行办法、发现风险和补充事实材料；但不能以本地招商利益降低国家标准，也不能仅以“国家安全”为由自行增加一套没有依据的前置审批。涉及行政许可的，还须遵守法定权限、范围、条件和程序。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现的是统一国家内部的纵向职责配置。全国层面的安全风险判断需要统一性，地方则具有现场了解和持续监管的优势；制度应使两者互相补充。这里必须区分\u003cstrong>协助实施、接受委托与独立法定职权\u003c/strong>：代收材料不是受让决定权，参与现场核查也不是当然获得处罚权。\u003c/p>\n\u003cp>从行政法看，维护国家安全的任务、具体审查权和强制措施权属于不同层次。任务条款提供职责方向，具体权限仍应落实到授权规范和实施程序；否则容易形成权责不清、重复审批或以职责之名扩张权力。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>以外商投资审查为例：省级有关部门经委托接收材料后，应转送工作机制办公室；工作机制办公室依法作出是否审查及最终审查决定，地方再按规定参与执行监督。不能因材料交到了地方，就将其视为已经取得安全审查批准。\u003c/p>\n\u003cp>研读本条时，可按“\u003cstrong>谁决定—谁协助—谁监督—谁处理违法行为\u003c/strong>”四步核对具体制度。书中列举的旧地方审批文件宜作为制度发展材料；当前是否有效、权限是否调整，应另查现行规则，不能仅据书名或条文引用时间判断。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条承接第59条的制度范围和第60条的中央部门职责，解决审查、监管工作如何在地方落实的问题。理解本条，应同时抓住“省级”“本行政区域”“有关”和“依法”四个限定，不能从地方维护国家安全的一般责任直接推出对所有事项的独立审查决定权。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条立法前，涉及国家安全事项的建设项目管理、外商投资管理等制度已经存在地方参与的安排。2014年12月的草案说明，将国家安全重大事项审查和监管列入国家安全基本制度；2015年法律进一步以第60、61条明确中央与地方的职责衔接。所核审议材料未展示本条逐字修改过程，不据此推定其从初稿到定稿完全未变。\u003c/p>\n\u003cp>配套制度后来发生变化，尤其外商投资管理已不能继续简单套用旧的企业设立审批模式。现行《外商投资安全审查办法》规定，国家层面的工作机制办公室可以委托省级政府有关部门代收、转送申报材料，并会同有关部门、地方政府监督决定实施。这说明地方参与包括程序协助和执行监督，并不当然包含最终决定权。\u003ca href=\"https://zfxxgk.ndrc.gov.cn/web/iteminfo.jsp?id=18525\">《外商投资安全审查办法》第6、13条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 明确地方责任，具体事项仍须查明具体机关。\u003c/strong> 条文以省、自治区、直辖市为地域和责任层级，实际办理则由依法具有相关职权的机关承担。不能将其理解为省内所有部门均有审查权；市县是否参与、承担何种工作，也须依据具体制度确定。\u003c/p>\n\u003cp>\u003cstrong>2. 审查与监管相互配合。\u003c/strong> 审查侧重依法判断特定事项是否影响国家安全及是否准许实施；监管侧重掌握实施情况、核查附加条件、发现变化和处置问题。审查通过以后仍可能需要地方持续监督，不能把发出决定视为全部职责完成。\u003c/p>\n\u003cp>\u003cstrong>3. 属地范围不替代法定权限。\u003c/strong> 项目位于某省，只能说明其与该省存在地域联系。依法由中央决定的事项，地方不得自行批准或否决；依法交由地方办理的事项，也不能一概推给中央。“有关”应结合各领域事权安排理解。\u003c/p>\n\u003cp>\u003cstrong>4. 地方实施须遵守统一标准。\u003c/strong> 地方可以依法结合实际完善执行办法、发现风险和补充事实材料；但不能以本地招商利益降低国家标准，也不能仅以“国家安全”为由自行增加一套没有依据的前置审批。涉及行政许可的，还须遵守法定权限、范围、条件和程序。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现的是统一国家内部的纵向职责配置。全国层面的安全风险判断需要统一性，地方则具有现场了解和持续监管的优势；制度应使两者互相补充。这里必须区分\u003cstrong>协助实施、接受委托与独立法定职权\u003c/strong>：代收材料不是受让决定权，参与现场核查也不是当然获得处罚权。\u003c/p>\n\u003cp>从行政法看，维护国家安全的任务、具体审查权和强制措施权属于不同层次。任务条款提供职责方向，具体权限仍应落实到授权规范和实施程序；否则容易形成权责不清、重复审批或以职责之名扩张权力。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>以外商投资审查为例：省级有关部门经委托接收材料后，应转送工作机制办公室；工作机制办公室依法作出是否审查及最终审查决定，地方再按规定参与执行监督。不能因材料交到了地方，就将其视为已经取得安全审查批准。\u003c/p>\n\u003cp>研读本条时，可按“\u003cstrong>谁决定—谁协助—谁监督—谁处理违法行为\u003c/strong>”四步核对具体制度。书中列举的旧地方审批文件宜作为制度发展材料；当前是否有效、权限是否调整，应另查现行规则，不能仅据书名或条文引用时间判断。\u003c/p>\n"},{"num":62,"label":"第六十二条","title":"国家安全危机管控制度的基本要求","lawText":"国家建立统一领导、协同联动、有序高效的国家安全危机管控制度。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第六十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立统一领导、协同联动、有序高效的国家安全危机管控制度。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第六十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立统一领导、协同联动、有序高效的国家安全危机管控制度。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全危机管控制度的基本要求 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条是第四章第五节“危机管控”的统领条款，规定危机管控体系应如何组织和运行；第63—68条再分别处理预案启动、非常状态决定、特别措施、比例控制、信息发布以及措施解除和善后。其核心在于建立可持续运行的制度，而非只在危机发生后临时协调。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2015年以前，《突发事件应对法》《国防动员法》等已经分别规定应急组织、预案、储备和救助机制，但分属不同领域。2014年草案说明已将危机管控纳入基本制度，2015年本条从总体国家安全层面提出共同要求，旨在解决分散制度之间的统筹和衔接问题。\u003c/p>\n\u003cp>此后制度继续发展。2024年修订、同年11月1日起施行的《突发事件应对法》，在第4条规定领导和治理体系，第16条规定应急管理体制与工作体系；2025年《国家突发事件总体应急预案》进一步安排中央、地方和现场的指挥协调。这些规范是公共应急领域的具体化，不能据此把全部国家安全危机都归入同一套应急响应程序。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">2024年《突发事件应对法》\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">2025年总体应急预案\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 统一领导：形成共同判断和决策方向。\u003c/strong> 危机跨越部门、地区时，必须有权威机制确定目标、统筹资源、协调重大分歧。结合第5、63条，应在中央国家安全领导机构的统一领导、部署下履行职责；各领域具体指挥、实施机关仍依宪法、法律和相应制度确定。\u003c/p>\n\u003cp>\u003cstrong>2. 协同联动：使分工能够转化为共同处置。\u003c/strong> 既包括部门之间的横向协作，也包括中央与地方、相邻地区的纵向和区域联动。信息通报、共同研判、资源调度、行动衔接、反馈纠偏应预先确定，避免各自掌握信息却无法形成行动。\u003c/p>\n\u003cp>\u003cstrong>3. 有序高效：将速度建立在清楚的职责和流程上。\u003c/strong> 有序要求权限明确、指令一致、程序衔接；高效要求及早行动、合理配置力量、及时根据事态调整。统一领导不能被解释为基层事事等待指令，效率也不能成为跳过必要权限、忽视救援人员安全的理由。\u003c/p>\n\u003cp>\u003cstrong>4. 危机管控不以已经宣布非常状态为唯一前提。\u003c/strong> 两书用战争、动员和紧急状态解释最严重的危机场景，但本条并未将危机管控限定在这些情形。第63条的一般重大事件处置，与第64条所规定的非常状态决定，属于不同制度环节；把三种非常状态列作穷尽分类，会遗漏依法使用通常应急权限即可控制的重大危机。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>危机治理存在集中协调与专业分工的共同难题。统筹机构具有全局视角，专业部门和现场人员掌握具体风险，两种能力需要通过清晰的指挥关系结合。统一目标、统一调度，不意味着取消分级负责或专业判断。\u003c/p>\n\u003cp>本条还体现制度准备的价值：预先明确接报、研判、启动、增援和退出程序，可以减少紧急情形下的信息损失和责任推诿。依法建立的程序本身也是提高处置效率的条件。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中所举安阳“11·21”特别重大火灾，可用来观察领导协调、跨部门调查和责任落实。官方调查认定该事故属于生产安全责任事故。不能仅因事故等级为“特别重大”，便认定已经适用第64条的宪法紧急状态，也不能从事后成立调查组，反推事故处置已履行某一未公开的国家安全程序。\u003ca href=\"https://yjglt.henan.gov.cn/2023/08-29/2805419.html\">官方调查情况\u003c/a>\u003c/p>\n\u003cp>学习时宜把危机管控理解为从准备到处置、再到恢复的过程；非常状态只是其中可能启动的更严格法律机制。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条是第四章第五节“危机管控”的统领条款，规定危机管控体系应如何组织和运行；第63—68条再分别处理预案启动、非常状态决定、特别措施、比例控制、信息发布以及措施解除和善后。其核心在于建立可持续运行的制度，而非只在危机发生后临时协调。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2015年以前，《突发事件应对法》《国防动员法》等已经分别规定应急组织、预案、储备和救助机制，但分属不同领域。2014年草案说明已将危机管控纳入基本制度，2015年本条从总体国家安全层面提出共同要求，旨在解决分散制度之间的统筹和衔接问题。\u003c/p>\n\u003cp>此后制度继续发展。2024年修订、同年11月1日起施行的《突发事件应对法》，在第4条规定领导和治理体系，第16条规定应急管理体制与工作体系；2025年《国家突发事件总体应急预案》进一步安排中央、地方和现场的指挥协调。这些规范是公共应急领域的具体化，不能据此把全部国家安全危机都归入同一套应急响应程序。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">2024年《突发事件应对法》\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">2025年总体应急预案\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 统一领导：形成共同判断和决策方向。\u003c/strong> 危机跨越部门、地区时，必须有权威机制确定目标、统筹资源、协调重大分歧。结合第5、63条，应在中央国家安全领导机构的统一领导、部署下履行职责；各领域具体指挥、实施机关仍依宪法、法律和相应制度确定。\u003c/p>\n\u003cp>\u003cstrong>2. 协同联动：使分工能够转化为共同处置。\u003c/strong> 既包括部门之间的横向协作，也包括中央与地方、相邻地区的纵向和区域联动。信息通报、共同研判、资源调度、行动衔接、反馈纠偏应预先确定，避免各自掌握信息却无法形成行动。\u003c/p>\n\u003cp>\u003cstrong>3. 有序高效：将速度建立在清楚的职责和流程上。\u003c/strong> 有序要求权限明确、指令一致、程序衔接；高效要求及早行动、合理配置力量、及时根据事态调整。统一领导不能被解释为基层事事等待指令，效率也不能成为跳过必要权限、忽视救援人员安全的理由。\u003c/p>\n\u003cp>\u003cstrong>4. 危机管控不以已经宣布非常状态为唯一前提。\u003c/strong> 两书用战争、动员和紧急状态解释最严重的危机场景，但本条并未将危机管控限定在这些情形。第63条的一般重大事件处置，与第64条所规定的非常状态决定，属于不同制度环节；把三种非常状态列作穷尽分类，会遗漏依法使用通常应急权限即可控制的重大危机。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>危机治理存在集中协调与专业分工的共同难题。统筹机构具有全局视角，专业部门和现场人员掌握具体风险，两种能力需要通过清晰的指挥关系结合。统一目标、统一调度，不意味着取消分级负责或专业判断。\u003c/p>\n\u003cp>本条还体现制度准备的价值：预先明确接报、研判、启动、增援和退出程序，可以减少紧急情形下的信息损失和责任推诿。依法建立的程序本身也是提高处置效率的条件。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中所举安阳“11·21”特别重大火灾，可用来观察领导协调、跨部门调查和责任落实。官方调查认定该事故属于生产安全责任事故。不能仅因事故等级为“特别重大”，便认定已经适用第64条的宪法紧急状态，也不能从事后成立调查组，反推事故处置已履行某一未公开的国家安全程序。\u003ca href=\"https://yjglt.henan.gov.cn/2023/08-29/2805419.html\">官方调查情况\u003c/a>\u003c/p>\n\u003cp>学习时宜把危机管控理解为从准备到处置、再到恢复的过程；非常状态只是其中可能启动的更严格法律机制。\u003c/p>\n"},{"num":63,"label":"第六十三条","title":"重大事件的预案启动与管控处置","lawText":"发生危及国家安全的重大事件，中央有关部门和有关地方根据中央国家安全领导机构的统一部署，依法启动应急预案，采取管控处置措施。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第六十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>发生危及国家安全的重大事件，中央有关部门和有关地方根据中央国家安全领导机构的统一部署，依法启动应急预案，采取管控处置措施。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第六十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>发生危及国家安全的重大事件，中央有关部门和有关地方根据中央国家安全领导机构的统一部署，依法启动应急预案，采取管控处置措施。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">重大事件的预案启动与管控处置 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条把第62条的组织原则落实为行动链条：发生重大事件、作出统一部署、有关部门和地方启动预案、采取合法措施。它同时包含积极处置义务与依法行使权力的要求。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条承接既有突发事件应对和应急预案制度，将危及国家安全重大事件的处置纳入统一部署。2014年草案说明已提出危机管控制度，但所核立法材料没有单独记录本条的具体文字修改，不宜虚构某一审次增删“统一部署”或“依法”等词语。\u003c/p>\n\u003cp>当前配套规则已更新：2024年《突发事件应对法》第71、72条明确应急响应制度及启动要求，第73、74条分别规定不同事件的处置措施；书中引用的原第49、50条已不宜继续作为现行条号。2025年总体应急预案也重新明确先期处置、响应分级和指挥协调。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">现行应对法\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">现行总体应急预案第3.3部分\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 适用前提是事件已经发生并危及国家安全。\u003c/strong> 应结合事件性质、影响范围及危害程度作实质判断。突发事件分类中的“重大”与本条的“危及国家安全的重大事件”存在联系，却不能不加判断地画等号。\u003c/p>\n\u003cp>\u003cstrong>2. 统一部署与法定职责相结合。\u003c/strong> 中央有关部门、有关地方是具体实施者，应按分工承担指挥、救援、保障、秩序维护等任务。“有关”要求职责与事件相关，不能理解为所有部门均获得处理一切危机的权限。地方依法负有的先期处置和报告义务仍应及时履行，不能机械等待另行指示而放任危害扩大。\u003c/p>\n\u003cp>\u003cstrong>3. 启动预案需要转化为明确的响应安排。\u003c/strong> 应确定启动主体、适用预案、响应事项和等级、资源调集、信息报告、预计期限及处置措施。现行应对法第72条明确要求启动响应时说明有关事项。预案还应随风险、组织和资源条件变化更新，使执行者能够据此行动。\u003c/p>\n\u003cp>\u003cstrong>4. 管控处置须分别寻找措施依据。\u003c/strong> 对危险区域进行封控、疏散转移人员、征用财产、限制有关活动等措施，其实施主体、条件和范围并不相同。应根据事件类型适用具体法律，不能把一种事故中的措施无条件移用于另一类事件。\u003c/p>\n\u003cp>\u003cstrong>5. 启动应急预案不等于进入非常状态。\u003c/strong> 需要进入紧急状态、战争状态或实施动员时，应转入第64条规定的决定程序；不能通过一次预案启动、一次现场会议或地方命令自行实现法律状态转换。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>应急预案的作用是把法定职责组织为可执行流程，通常不因载入预案就使原本不存在的强制权限合法化。合法性审查因此应分为两步：先核查启动和实施主体是否适格，再审查具体措施是否有依据、是否适合实际危险。\u003c/p>\n\u003cp>措施还应遵循比例要求。2024年应对法第10条要求措施与危害性质、程度、范围相适应，并在可选措施中兼顾权益保护、较小损害和动态调整。危机处置的必要性是采取措施的理由，也构成限制措施过度扩张的标准。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中所举西昌“3·30”森林火灾，具有反向检验制度执行的价值。公开调查指出，预案操作性、针对性、科学性不足，责任落实存在空档。由此可见，评价本条执行情况不能只核对“是否宣布启动”，还要核对指挥是否畅通、预案能否执行、现场风险是否得到判断和控制。\u003ca href=\"https://linzhi.gov.cn/zfxxgkpt/c105943/202012/042a0f168895442785c34e848a8f6bb7.shtml\">公开调查结果\u003c/a>\u003c/p>\n\u003cp>个案分析宜依次回答：什么事件、哪个机关、哪份预案、什么法律依据、什么处置措施、何时复核调整。这比单纯罗列采取了多少措施更能反映依法管控的质量。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条把第62条的组织原则落实为行动链条：发生重大事件、作出统一部署、有关部门和地方启动预案、采取合法措施。它同时包含积极处置义务与依法行使权力的要求。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条承接既有突发事件应对和应急预案制度，将危及国家安全重大事件的处置纳入统一部署。2014年草案说明已提出危机管控制度，但所核立法材料没有单独记录本条的具体文字修改，不宜虚构某一审次增删“统一部署”或“依法”等词语。\u003c/p>\n\u003cp>当前配套规则已更新：2024年《突发事件应对法》第71、72条明确应急响应制度及启动要求，第73、74条分别规定不同事件的处置措施；书中引用的原第49、50条已不宜继续作为现行条号。2025年总体应急预案也重新明确先期处置、响应分级和指挥协调。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">现行应对法\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">现行总体应急预案第3.3部分\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 适用前提是事件已经发生并危及国家安全。\u003c/strong> 应结合事件性质、影响范围及危害程度作实质判断。突发事件分类中的“重大”与本条的“危及国家安全的重大事件”存在联系，却不能不加判断地画等号。\u003c/p>\n\u003cp>\u003cstrong>2. 统一部署与法定职责相结合。\u003c/strong> 中央有关部门、有关地方是具体实施者，应按分工承担指挥、救援、保障、秩序维护等任务。“有关”要求职责与事件相关，不能理解为所有部门均获得处理一切危机的权限。地方依法负有的先期处置和报告义务仍应及时履行，不能机械等待另行指示而放任危害扩大。\u003c/p>\n\u003cp>\u003cstrong>3. 启动预案需要转化为明确的响应安排。\u003c/strong> 应确定启动主体、适用预案、响应事项和等级、资源调集、信息报告、预计期限及处置措施。现行应对法第72条明确要求启动响应时说明有关事项。预案还应随风险、组织和资源条件变化更新，使执行者能够据此行动。\u003c/p>\n\u003cp>\u003cstrong>4. 管控处置须分别寻找措施依据。\u003c/strong> 对危险区域进行封控、疏散转移人员、征用财产、限制有关活动等措施，其实施主体、条件和范围并不相同。应根据事件类型适用具体法律，不能把一种事故中的措施无条件移用于另一类事件。\u003c/p>\n\u003cp>\u003cstrong>5. 启动应急预案不等于进入非常状态。\u003c/strong> 需要进入紧急状态、战争状态或实施动员时，应转入第64条规定的决定程序；不能通过一次预案启动、一次现场会议或地方命令自行实现法律状态转换。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>应急预案的作用是把法定职责组织为可执行流程，通常不因载入预案就使原本不存在的强制权限合法化。合法性审查因此应分为两步：先核查启动和实施主体是否适格，再审查具体措施是否有依据、是否适合实际危险。\u003c/p>\n\u003cp>措施还应遵循比例要求。2024年应对法第10条要求措施与危害性质、程度、范围相适应，并在可选措施中兼顾权益保护、较小损害和动态调整。危机处置的必要性是采取措施的理由，也构成限制措施过度扩张的标准。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中所举西昌“3·30”森林火灾，具有反向检验制度执行的价值。公开调查指出，预案操作性、针对性、科学性不足，责任落实存在空档。由此可见，评价本条执行情况不能只核对“是否宣布启动”，还要核对指挥是否畅通、预案能否执行、现场风险是否得到判断和控制。\u003ca href=\"https://linzhi.gov.cn/zfxxgkpt/c105943/202012/042a0f168895442785c34e848a8f6bb7.shtml\">公开调查结果\u003c/a>\u003c/p>\n\u003cp>个案分析宜依次回答：什么事件、哪个机关、哪份预案、什么法律依据、什么处置措施、何时复核调整。这比单纯罗列采取了多少措施更能反映依法管控的质量。\u003c/p>\n"},{"num":64,"label":"第六十四条","title":"非常状态与全国总动员、局部动员的决定","lawText":"发生危及国家安全的特别重大事件，需要进入紧急状态、战争状态或者进行全国总动员、局部动员的，由全国人民代表大会、全国人民代表大会常务委员会或者国务院依照宪法和有关法律规定的权限和程序决定。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第六十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>发生危及国家安全的特别重大事件，需要进入紧急状态、战争状态或者进行全国总动员、局部动员的，由全国人民代表大会、全国人民代表大会常务委员会或者国务院依照宪法和有关法律规定的权限和程序决定。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第六十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>发生危及国家安全的特别重大事件，需要进入紧急状态、战争状态或者进行全国总动员、局部动员的，由全国人民代表大会、全国人民代表大会常务委员会或者国务院依照宪法和有关法律规定的权限和程序决定。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">非常状态与全国总动员、局部动员的决定 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定危机处置向特殊法律机制转换的权限与程序。三个决定机关与几类事项之间有明确分工，不能将“或者”理解为任一机关均可自行选择决定全部事项。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2004年宪法修正将有关国家机关职权中的“戒严”改为“紧急状态”。修宪说明明确，这一概念包括戒严而不限于戒严，能够容纳严重自然灾害、公共卫生事件等多种危机场景。2015年本条在此基础上，将紧急状态、战争状态和动员的宪法权限与国家安全危机管控衔接起来。\u003ca href=\"https://www.npc.gov.cn/zgrdw/npc/xinwen/lfgz/flca/2004-03/15/content_329508.htm\">2004年修宪说明\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>现行条项须随制度更新核对。\u003c/strong> 2018年修宪后，相关职权项目已有顺延；2024年应对法关于进入紧急状态的规定现为第103条。另须特别注意：2026年8月28日修订的《国防动员法》已于2026年10月1日起施行，动员决定和组织实施规则现见第13、14条，不再沿用书中2010年法律的第8、9条。\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">2026年修订《国防动员法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. “特别重大”与“需要”共同构成门槛。\u003c/strong> 事件严重并不自动产生非常状态。现行应对法第103条进一步表明，在相关领域，应先判断现有法定应急措施能否消除或有效控制、减轻严重危害，再判断是否需要进入紧急状态。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">应对法第103条\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>2. 紧急状态按地域范围划分决定权。\u003c/strong> 全国或者个别省、自治区、直辖市进入紧急状态，由全国人大常委会决定；国家主席根据有关决定宣布进入紧急状态。省、自治区、直辖市范围内部分地区进入紧急状态，由国务院依照法律规定决定。省级政府不能因事件只发生在本省便自行作出宪法意义上的紧急状态决定。\u003c/p>\n\u003cp>\u003cstrong>3. 战争与和平事项须区分通常决定权和闭会期间权限。\u003c/strong> 全国人大依宪法第62条第15项决定战争和和平的问题；全国人大常委会依第67条第19项，在全国人大闭会期间，且符合国家遭受武装侵犯或必须履行国际间共同防止侵略条约等规定条件时，决定战争状态的宣布。国家主席依第80条宣布战争状态。\u003c/p>\n\u003cp>\u003cstrong>4. 总动员与局部动员的决定权均属于全国人大常委会。\u003c/strong> 依据宪法第67条第20项、第80条，由全国人大常委会决定、国家主席发布动员令。2026年国防动员法第14条规定，国务院、中央军委提出议案，并依法组织实施；在直接威胁必须立即处置时，两者可以采取法律规定的必要动员措施，同时向全国人大常委会报告。这一紧急处置安排不应混同为地方或部门自行宣布全国总动员的权力。\u003ca href=\"https://www.mfa.gov.cn/ziliao_674904/zt_674979/dnzt_674981/qtzt/twwt/stflgf/202206/t20220606_10698959.html\">现行宪法\u003c/a>、\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">现行国防动员法第13、14条\u003c/a>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>非常状态制度要解决两个问题：国家如何获得应对极端危机所需的特殊能力，以及这种能力如何受法律控制。本条首先通过高层级决定权和特定程序控制启动门槛，第65、66、68条再规范措施依据、比例控制以及解除和善后。\u003c/p>\n\u003cp>紧急状态、战争状态和动员在事实中可能关联，但法律功能不同：紧急状态是应对严重危机的特殊法律状态，战争状态涉及战争与和平的宪法决定，动员重在依国家决定组织调集力量与资源。不能因为紧急抗灾需要集中人力物力，就当然认定已实施宪法意义上的全国总动员。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>区分四组易混概念：\u003c/strong> 事件“特别重大”等级不等于紧急状态；一级应急响应不等于紧急状态；工作中使用“战时机制”等措辞不等于宣布战争状态；一般社会动员不等于全国总动员或局部动员。\u003c/p>\n\u003cp>\u003cstrong>戒严不能作为所有危机的通用处置方案。\u003c/strong> 《戒严法》第2条针对的是严重危及统一、安全或社会公共安全的动乱、暴乱、严重骚乱等法定情形，具有专门适用条件；不能仅因自然灾害严重就直接套用戒严措施。\u003ca href=\"https://jiwei.yantai.gov.cn/art/2015/11/26/art_5733_148141.html\">《戒严法》第2、3条\u003c/a>\u003c/p>\n\u003cp>外国宣布某种“国家紧急状态”的案例，只有结合该国制度才能判断法律效果，不宜据其名称直接类比中国宪法上的紧急状态。研读本条的落点是“谁依法决定何种状态”，而不是罗列各国使用过哪些紧急治理口号。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定危机处置向特殊法律机制转换的权限与程序。三个决定机关与几类事项之间有明确分工，不能将“或者”理解为任一机关均可自行选择决定全部事项。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2004年宪法修正将有关国家机关职权中的“戒严”改为“紧急状态”。修宪说明明确，这一概念包括戒严而不限于戒严，能够容纳严重自然灾害、公共卫生事件等多种危机场景。2015年本条在此基础上，将紧急状态、战争状态和动员的宪法权限与国家安全危机管控衔接起来。\u003ca href=\"https://www.npc.gov.cn/zgrdw/npc/xinwen/lfgz/flca/2004-03/15/content_329508.htm\">2004年修宪说明\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>现行条项须随制度更新核对。\u003c/strong> 2018年修宪后，相关职权项目已有顺延；2024年应对法关于进入紧急状态的规定现为第103条。另须特别注意：2026年8月28日修订的《国防动员法》已于2026年10月1日起施行，动员决定和组织实施规则现见第13、14条，不再沿用书中2010年法律的第8、9条。\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">2026年修订《国防动员法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. “特别重大”与“需要”共同构成门槛。\u003c/strong> 事件严重并不自动产生非常状态。现行应对法第103条进一步表明，在相关领域，应先判断现有法定应急措施能否消除或有效控制、减轻严重危害，再判断是否需要进入紧急状态。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">应对法第103条\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>2. 紧急状态按地域范围划分决定权。\u003c/strong> 全国或者个别省、自治区、直辖市进入紧急状态，由全国人大常委会决定；国家主席根据有关决定宣布进入紧急状态。省、自治区、直辖市范围内部分地区进入紧急状态，由国务院依照法律规定决定。省级政府不能因事件只发生在本省便自行作出宪法意义上的紧急状态决定。\u003c/p>\n\u003cp>\u003cstrong>3. 战争与和平事项须区分通常决定权和闭会期间权限。\u003c/strong> 全国人大依宪法第62条第15项决定战争和和平的问题；全国人大常委会依第67条第19项，在全国人大闭会期间，且符合国家遭受武装侵犯或必须履行国际间共同防止侵略条约等规定条件时，决定战争状态的宣布。国家主席依第80条宣布战争状态。\u003c/p>\n\u003cp>\u003cstrong>4. 总动员与局部动员的决定权均属于全国人大常委会。\u003c/strong> 依据宪法第67条第20项、第80条，由全国人大常委会决定、国家主席发布动员令。2026年国防动员法第14条规定，国务院、中央军委提出议案，并依法组织实施；在直接威胁必须立即处置时，两者可以采取法律规定的必要动员措施，同时向全国人大常委会报告。这一紧急处置安排不应混同为地方或部门自行宣布全国总动员的权力。\u003ca href=\"https://www.mfa.gov.cn/ziliao_674904/zt_674979/dnzt_674981/qtzt/twwt/stflgf/202206/t20220606_10698959.html\">现行宪法\u003c/a>、\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">现行国防动员法第13、14条\u003c/a>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>非常状态制度要解决两个问题：国家如何获得应对极端危机所需的特殊能力，以及这种能力如何受法律控制。本条首先通过高层级决定权和特定程序控制启动门槛，第65、66、68条再规范措施依据、比例控制以及解除和善后。\u003c/p>\n\u003cp>紧急状态、战争状态和动员在事实中可能关联，但法律功能不同：紧急状态是应对严重危机的特殊法律状态，战争状态涉及战争与和平的宪法决定，动员重在依国家决定组织调集力量与资源。不能因为紧急抗灾需要集中人力物力，就当然认定已实施宪法意义上的全国总动员。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>区分四组易混概念：\u003c/strong> 事件“特别重大”等级不等于紧急状态；一级应急响应不等于紧急状态；工作中使用“战时机制”等措辞不等于宣布战争状态；一般社会动员不等于全国总动员或局部动员。\u003c/p>\n\u003cp>\u003cstrong>戒严不能作为所有危机的通用处置方案。\u003c/strong> 《戒严法》第2条针对的是严重危及统一、安全或社会公共安全的动乱、暴乱、严重骚乱等法定情形，具有专门适用条件；不能仅因自然灾害严重就直接套用戒严措施。\u003ca href=\"https://jiwei.yantai.gov.cn/art/2015/11/26/art_5733_148141.html\">《戒严法》第2、3条\u003c/a>\u003c/p>\n\u003cp>外国宣布某种“国家紧急状态”的案例，只有结合该国制度才能判断法律效果，不宜据其名称直接类比中国宪法上的紧急状态。研读本条的落点是“谁依法决定何种状态”，而不是罗列各国使用过哪些紧急治理口号。\u003c/p>\n"},{"num":65,"label":"第六十五条","title":"非常状态下特别措施的法定授权","lawText":"国家决定进入紧急状态、战争状态或者实施国防动员后，履行国家安全危机管控职责的有关机关依照法律规定或者全国人民代表大会常务委员会规定，有权采取限制公民和组织权利、增加公民和组织义务的特别措施。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第六十五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家决定进入紧急状态、战争状态或者实施国防动员后，履行国家安全危机管控职责的有关机关依照法律规定或者全国人民代表大会常务委员会规定，有权采取限制公民和组织权利、增加公民和组织义务的特别措施。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第六十五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家决定进入紧急状态、战争状态或者实施国防动员后，履行国家安全危机管控职责的有关机关依照法律规定或者全国人民代表大会常务委员会规定，有权采取限制公民和组织权利、增加公民和组织义务的特别措施。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">非常状态下特别措施的法定授权 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定非常状态下特别措施的启动条件、行使主体与规范依据。理解重点在于：非常状态使特定特别措施成为可能，但每项措施仍须受到权限、程序和内容限制。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条承接宪法关于战争、动员和紧急状态的权限配置，并综合《戒严法》、2010年《国防动员法》及2007年《突发事件应对法》等制度，将特别措施纳入统一的国家安全危机管控框架。现有两书所收立法材料不足以证明本条曾作何种逐句修改，不宜仅凭最终条文推测审议过程。\u003c/p>\n\u003cp>现行配套法已发生重要变化：2024年修订的《突发事件应对法》将紧急状态及其非常措施规定在第103条；2026年修订的《国防动员法》自2026年10月1日起施行，特别措施集中在第73—77条。原书引用的前者旧第69条、后者旧第63—67条，应按新法对应理解。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">《突发事件应对法》\u003c/a>、\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">2026年修订《国防动员法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 三种法定情形是并列的启动条件。\u003c/strong>“紧急状态”“战争状态”“实施国防动员”各有相应的决定权限和程序，不能在适用时合并成含混的“非常时期”。发生重大事故、启动一级应急响应或者开展社会动员，并不当然意味着已经进入本条所称的紧急状态或国防动员。\u003c/p>\n\u003cp>**2. 特别措施须由依法负有危机管控职责的机关采取。**决定进入某种状态，与决定具体措施、组织实施措施，是不同层次的职权。例如现行《国防动员法》第74条规定，在全国或者部分省级行政区域实施特别措施，由国务院、中央军委决定并组织实施；在省级行政区域内部分地区实施，也由国务院、中央军委决定，再由省级政府和同级军事机关组织实施。地方的组织实施权与决定权应当区分。\u003c/p>\n\u003cp>**3. 权利限制和义务增加必须有法定依据。**本条是综合性国家安全立法中的授权衔接条款，具体措施仍应查明适用法律或者全国人大常委会规定。不能仅以“国家安全需要”创设任何限制，更不能把一般工作通知直接等同于本条列明的规范依据。\u003c/p>\n\u003cp>**4. 措施内容围绕危机处置需要展开。**现行《国防动员法》第73条包括行业管制、限制人员或物资通行、实行特殊工作制度及为武装力量优先提供交通保障等；第75条要求在规定权限、区域和时限内实施。列举中的其他特别措施也须结合该法的适用条件解释，不能脱离国防动员事项任意扩张。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现\u003cstrong>非常状态下的法治连续性\u003c/strong>：越是在权利受到重大影响时，越需要明确谁决定、依据什么决定、措施持续多久。国家保护共同安全的积极义务，与防止紧急权力滥用的限制要求，同时存在。\u003c/p>\n\u003cp>比较不同国家制度时，应分别考察紧急状态宣布、军事行动授权、动员及具体行政措施。两书列举的国外危机处置事例可以说明非常手段的必要性，却不能证明外国某种“反恐行动状态”与我国宪法上的紧急状态具有相同性质，也不能作为国内机关扩大职权的依据。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>本条须与第64条的状态决定、第66条的比例限制、第68条的及时解除及第83条的权利保障合读。一般应急措施可能依据其他法律在法定紧急状态之前实施，因此“本条特别措施有严格前提”也不意味着国家在此前无权依法抢险、疏散或者征用。\u003c/p>\n\u003cp>研读时可依次核对：\u003cstrong>状态是否依法启动—机关是否有权—措施有无法源—对象和时空范围是否必要—退出条件是否明确\u003c/strong>。这是解释适用的分析顺序，不是本条之外另设一套审批程序。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定非常状态下特别措施的启动条件、行使主体与规范依据。理解重点在于：非常状态使特定特别措施成为可能，但每项措施仍须受到权限、程序和内容限制。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条承接宪法关于战争、动员和紧急状态的权限配置，并综合《戒严法》、2010年《国防动员法》及2007年《突发事件应对法》等制度，将特别措施纳入统一的国家安全危机管控框架。现有两书所收立法材料不足以证明本条曾作何种逐句修改，不宜仅凭最终条文推测审议过程。\u003c/p>\n\u003cp>现行配套法已发生重要变化：2024年修订的《突发事件应对法》将紧急状态及其非常措施规定在第103条；2026年修订的《国防动员法》自2026年10月1日起施行，特别措施集中在第73—77条。原书引用的前者旧第69条、后者旧第63—67条，应按新法对应理解。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">《突发事件应对法》\u003c/a>、\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">2026年修订《国防动员法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 三种法定情形是并列的启动条件。\u003c/strong>“紧急状态”“战争状态”“实施国防动员”各有相应的决定权限和程序，不能在适用时合并成含混的“非常时期”。发生重大事故、启动一级应急响应或者开展社会动员，并不当然意味着已经进入本条所称的紧急状态或国防动员。\u003c/p>\n\u003cp>**2. 特别措施须由依法负有危机管控职责的机关采取。**决定进入某种状态，与决定具体措施、组织实施措施，是不同层次的职权。例如现行《国防动员法》第74条规定，在全国或者部分省级行政区域实施特别措施，由国务院、中央军委决定并组织实施；在省级行政区域内部分地区实施，也由国务院、中央军委决定，再由省级政府和同级军事机关组织实施。地方的组织实施权与决定权应当区分。\u003c/p>\n\u003cp>**3. 权利限制和义务增加必须有法定依据。**本条是综合性国家安全立法中的授权衔接条款，具体措施仍应查明适用法律或者全国人大常委会规定。不能仅以“国家安全需要”创设任何限制，更不能把一般工作通知直接等同于本条列明的规范依据。\u003c/p>\n\u003cp>**4. 措施内容围绕危机处置需要展开。**现行《国防动员法》第73条包括行业管制、限制人员或物资通行、实行特殊工作制度及为武装力量优先提供交通保障等；第75条要求在规定权限、区域和时限内实施。列举中的其他特别措施也须结合该法的适用条件解释，不能脱离国防动员事项任意扩张。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现\u003cstrong>非常状态下的法治连续性\u003c/strong>：越是在权利受到重大影响时，越需要明确谁决定、依据什么决定、措施持续多久。国家保护共同安全的积极义务，与防止紧急权力滥用的限制要求，同时存在。\u003c/p>\n\u003cp>比较不同国家制度时，应分别考察紧急状态宣布、军事行动授权、动员及具体行政措施。两书列举的国外危机处置事例可以说明非常手段的必要性，却不能证明外国某种“反恐行动状态”与我国宪法上的紧急状态具有相同性质，也不能作为国内机关扩大职权的依据。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>本条须与第64条的状态决定、第66条的比例限制、第68条的及时解除及第83条的权利保障合读。一般应急措施可能依据其他法律在法定紧急状态之前实施，因此“本条特别措施有严格前提”也不意味着国家在此前无权依法抢险、疏散或者征用。\u003c/p>\n\u003cp>研读时可依次核对：\u003cstrong>状态是否依法启动—机关是否有权—措施有无法源—对象和时空范围是否必要—退出条件是否明确\u003c/strong>。这是解释适用的分析顺序，不是本条之外另设一套审批程序。\u003c/p>\n"},{"num":66,"label":"第六十六条","title":"危机管控的比例原则与权益保护","lawText":"履行国家安全危机管控职责的有关机关依法采取处置国家安全危机的管控措施，应当与国家安全危机可能造成的危害的性质、程度和范围相适应；有多种措施可供选择的，应当选择有利于最大程度保护公民、组织权益的措施。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第六十六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>履行国家安全危机管控职责的有关机关依法采取处置国家安全危机的管控措施，应当与国家安全危机可能造成的危害的性质、程度和范围相适应；有多种措施可供选择的，应当选择有利于最大程度保护公民、组织权益的措施。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第六十六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>履行国家安全危机管控职责的有关机关依法采取处置国家安全危机的管控措施，应当与国家安全危机可能造成的危害的性质、程度和范围相适应；有多种措施可供选择的，应当选择有利于最大程度保护公民、组织权益的措施。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">危机管控的比例原则与权益保护 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条对危机管控裁量设定实质限制，解决“有权采取措施之后，应当选择什么措施、实施到何种程度”的问题。它不能独立代替具体管控权力的法律依据。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已经提出，采取管控措施时，应选择有利于最大程度保护公民、组织权益的措施。这说明权利保障并非危机管控制度之外的附加要求，而是制度设计本身的组成部分。（甲书附录印刷第376页／PDF第389页。）\u003c/p>\n\u003cp>2024年《突发事件应对法》第10条延续相适应与权益保护要求，并明确考虑对他人权益和生态环境的影响、根据情况变化及时调整；2026年《国防动员法》第76条也规定特别措施须必要、合理并动态调整。二者体现了相关领域对本条限权逻辑的进一步具体化。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">《突发事件应对法》\u003c/a>、\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">《国防动员法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>**1. 合法性是首要前提。**条文首先要求“依法采取”。一项措施即使看似有效、负担较轻，如果决定机关没有相应职权，或者违反法定程序，也不能依比例原则获得授权。反之，仅有形式上的授权，也不意味着具体做法必然适当。\u003c/p>\n\u003cp>\u003cstrong>2. 对危害须作具体分析。\u003c/strong>“性质”涉及风险的类型及其所侵害的法益；“程度”涉及危险强度和可能损失；“范围”涉及受影响人群、地域及持续时间。相应措施应有风险事实和研判结论支撑，不能将局部危险直接推定为无限范围的危险。\u003c/p>\n\u003cp>**3. 在能够实现法定管控目的的方案之间择优。**条文要求比较可供选择的措施。较温和措施能够有效控制风险时，应避免更严重的权利负担；不能把“最严格”本身作为优越性的证明。但也不能脱离处置效果，只因一种措施干预较少就认为必然应当采用。\u003c/p>\n\u003cp>**4. 评估的是措施对不同权益的整体影响。**保护生命健康与保护财产、正常生活、生产经营、通信及隐私等权益，往往需要同时考虑。对弱势群体或者急需医疗救助者的影响尤其不能遗漏；现行《突发事件应对法》第11条对此规定特殊、优先保护。\u003c/p>\n\u003cp>**5. 适当性须在实施过程中持续成立。**初始措施合理，不代表风险变化后仍合理。管控范围、强度、频率和期限均应随情势重新评估；已无必要时，则由第68条承接为解除义务。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>法理上，可以用比例原则的三个层次分析：措施是否有助于实现正当目的；是否存在同样有效而侵害较小的替代方案；安全收益与权利负担是否明显失衡。这是对条文的分析工具，不能误写为条文逐项列出的三个法定程序。\u003c/p>\n\u003cp>两书将本条置于合理性原则之下，其意义在于限制过度裁量。国家安全以人民安全为宗旨，危机治理的对象不是被动承受全部成本的抽象“人口”，而是享有具体权利的公民和组织。个别主体依法承担特殊负担时，还须结合相应法律处理生活保障、财产补偿及救济问题。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>假设危险仅集中于某座桥梁，经评估封闭该桥并引导绕行即可保障安全，扩大到所有无关联道路长期封闭，就需要额外的事实和法律理由。这个例子说明的是范围与危险之间的关联，并不预设任何真实事件中应采用何种方案。\u003c/p>\n\u003cp>复习本条可用一句话概括：**依法有权，还须具体适当；危险变化，措施也要变化。**与第65条合读关注特别措施边界，与第68条合读关注必要性何时消失。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条对危机管控裁量设定实质限制，解决“有权采取措施之后，应当选择什么措施、实施到何种程度”的问题。它不能独立代替具体管控权力的法律依据。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已经提出，采取管控措施时，应选择有利于最大程度保护公民、组织权益的措施。这说明权利保障并非危机管控制度之外的附加要求，而是制度设计本身的组成部分。（甲书附录印刷第376页／PDF第389页。）\u003c/p>\n\u003cp>2024年《突发事件应对法》第10条延续相适应与权益保护要求，并明确考虑对他人权益和生态环境的影响、根据情况变化及时调整；2026年《国防动员法》第76条也规定特别措施须必要、合理并动态调整。二者体现了相关领域对本条限权逻辑的进一步具体化。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">《突发事件应对法》\u003c/a>、\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">《国防动员法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>**1. 合法性是首要前提。**条文首先要求“依法采取”。一项措施即使看似有效、负担较轻，如果决定机关没有相应职权，或者违反法定程序，也不能依比例原则获得授权。反之，仅有形式上的授权，也不意味着具体做法必然适当。\u003c/p>\n\u003cp>\u003cstrong>2. 对危害须作具体分析。\u003c/strong>“性质”涉及风险的类型及其所侵害的法益；“程度”涉及危险强度和可能损失；“范围”涉及受影响人群、地域及持续时间。相应措施应有风险事实和研判结论支撑，不能将局部危险直接推定为无限范围的危险。\u003c/p>\n\u003cp>**3. 在能够实现法定管控目的的方案之间择优。**条文要求比较可供选择的措施。较温和措施能够有效控制风险时，应避免更严重的权利负担；不能把“最严格”本身作为优越性的证明。但也不能脱离处置效果，只因一种措施干预较少就认为必然应当采用。\u003c/p>\n\u003cp>**4. 评估的是措施对不同权益的整体影响。**保护生命健康与保护财产、正常生活、生产经营、通信及隐私等权益，往往需要同时考虑。对弱势群体或者急需医疗救助者的影响尤其不能遗漏；现行《突发事件应对法》第11条对此规定特殊、优先保护。\u003c/p>\n\u003cp>**5. 适当性须在实施过程中持续成立。**初始措施合理，不代表风险变化后仍合理。管控范围、强度、频率和期限均应随情势重新评估；已无必要时，则由第68条承接为解除义务。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>法理上，可以用比例原则的三个层次分析：措施是否有助于实现正当目的；是否存在同样有效而侵害较小的替代方案；安全收益与权利负担是否明显失衡。这是对条文的分析工具，不能误写为条文逐项列出的三个法定程序。\u003c/p>\n\u003cp>两书将本条置于合理性原则之下，其意义在于限制过度裁量。国家安全以人民安全为宗旨，危机治理的对象不是被动承受全部成本的抽象“人口”，而是享有具体权利的公民和组织。个别主体依法承担特殊负担时，还须结合相应法律处理生活保障、财产补偿及救济问题。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>假设危险仅集中于某座桥梁，经评估封闭该桥并引导绕行即可保障安全，扩大到所有无关联道路长期封闭，就需要额外的事实和法律理由。这个例子说明的是范围与危险之间的关联，并不预设任何真实事件中应采用何种方案。\u003c/p>\n\u003cp>复习本条可用一句话概括：**依法有权，还须具体适当；危险变化，措施也要变化。**与第65条合读关注特别措施边界，与第68条合读关注必要性何时消失。\u003c/p>\n"},{"num":67,"label":"第六十七条","title":"国家安全危机的信息报告与社会发布","lawText":"国家健全国家安全危机的信息报告和发布机制。\n\n国家安全危机事件发生后，履行国家安全危机管控职责的有关机关，应当按照规定准确、及时报告，并依法将有关国家安全危机事件发生、发展、管控处置及善后情况统一向社会发布。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第六十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全国家安全危机的信息报告和发布机制。\u003c/p>\n\u003cp>国家安全危机事件发生后，履行国家安全危机管控职责的有关机关，应当按照规定准确、及时报告，并依法将有关国家安全危机事件发生、发展、管控处置及善后情况统一向社会发布。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第六十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全国家安全危机的信息报告和发布机制。\u003c/p>\n\u003cp>国家安全危机事件发生后，履行国家安全危机管控职责的有关机关，应当按照规定准确、及时报告，并依法将有关国家安全危机事件发生、发展、管控处置及善后情况统一向社会发布。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全危机的信息报告与社会发布 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条同时规范机关体系内的信息报告与面向社会的信息发布。二者对象、权限及内容处理方式不同，但共同服务于有效处置危机、保障公众知情和维持社会协作。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2015年4月20日《修改情况汇报》第四项第三点，针对初稿第65条第2款提出修改，明确履行危机管控职责的机关应准确、及时报告，并依法统一发布危机的发生、发展、处置及善后信息；该修改对应最终第67条第2款。报告所载拟稿末尾为“统一发布”，最终文本明确“统一向社会发布”。注意初稿条号与正式条号不同。（甲书附录印刷第381页／PDF第394页。）\u003c/p>\n\u003cp>此后信息制度继续完善。2024年《突发事件应对法》第7—8条分别规定信息发布和新闻采访报道，第61条规定报告要求；2025年《国家突发事件总体应急预案》更新报告与发布安排。书中引用的旧《突发事件应对法》第39、53条及旧总体预案，应作历史资料阅读。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">《突发事件应对法》\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">2025年总体应急预案\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>**1. 报告是履行职责所需的信息传递。**向有权决策、指挥和协调的机关报告，能够支持风险研判及资源调度。具体报告层级、通报范围、时限与渠道应适用相关规定；本条没有为所有国家安全危机设定统一的小时数。\u003c/p>\n\u003cp>**2. 准确与及时须同时满足。**不能将未经核实的判断当作确定事实，也不能以“尚未掌握全部情况”为由压住已经确认的重要信息。初报可以说明事实核实程度及暂不能确定的事项，随后依进展续报、更正，避免迟报和失实报告。\u003c/p>\n\u003cp>**3. 社会发布贯穿整个危机过程。**发布内容包括事件发生、后续发展、管控措施和善后情况。公众既需知道发生了什么，也需知道如何避险、应遵守哪些措施、如何获得救助以及何时恢复正常活动。并非必须等所有内容齐备后一次发布。\u003c/p>\n\u003cp>**4. 统一发布是组织与责任要求。**应明确发布主体、协调机制及权威信息来源，减少相互矛盾的公告。不能因此推导出所有合法报道都被禁止；现行法同时要求支持新闻采访报道与舆论监督。涉及国家秘密、个人隐私或者可能妨害现场救援的信息，应按具体法律处理，不能将“涉及安全”一概等同于“不予公开”。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条把信息透明纳入危机治理：信息既是决策资源，也是公众采取安全行动的条件。准确公开能减少信息不对称，使社会配合具有可理解的事实基础，并为监督公权力提供条件。\u003c/p>\n\u003cp>公开与保密的协调应落到具体信息及具体危害，而非抽象二选一。例如《反恐怖主义法》第63条规定专门的统一发布机关，同时限制披露可被模仿的实施细节、残忍场景以及特定现场人员身份和处置行动信息。此类限制说明公开仍有法定边界，也说明边界应有明确依据。\u003ca href=\"https://www.npc.gov.cn/c2/c12435/c12488/201905/t20190521_222284.html\">《反恐怖主义法》第63条\u003c/a>\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>2025年总体应急预案第3.3.5节要求及时发布简要信息并持续更新；对发生特别重大、重大突发事件，造成重大人员伤亡或者社会影响较大的情形，规定相应的信息发布主体，一般情况下应在24小时内举行首场新闻发布会。\u003cstrong>新闻发布会时限不等于可以等待24小时才发布消息\u003c/strong>，也不等于内部报告时限；旧预案中的“最迟4小时”不能继续作为所有危机的通用规则。\u003c/p>\n\u003cp>《政府信息公开条例》第20条第（十二）项将突发公共事件的预案、预警及应对情况列入主动公开事项。两书所讨论的危机信息发布因此还应与政府信息公开制度衔接，而不宜仅视为新闻宣传工作。\u003ca href=\"https://www.caac.gov.cn/XXGK/XXGK/ZFXXGKZD/202006/t20200609_203007.html\">《政府信息公开条例》\u003c/a>\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条同时规范机关体系内的信息报告与面向社会的信息发布。二者对象、权限及内容处理方式不同，但共同服务于有效处置危机、保障公众知情和维持社会协作。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2015年4月20日《修改情况汇报》第四项第三点，针对初稿第65条第2款提出修改，明确履行危机管控职责的机关应准确、及时报告，并依法统一发布危机的发生、发展、处置及善后信息；该修改对应最终第67条第2款。报告所载拟稿末尾为“统一发布”，最终文本明确“统一向社会发布”。注意初稿条号与正式条号不同。（甲书附录印刷第381页／PDF第394页。）\u003c/p>\n\u003cp>此后信息制度继续完善。2024年《突发事件应对法》第7—8条分别规定信息发布和新闻采访报道，第61条规定报告要求；2025年《国家突发事件总体应急预案》更新报告与发布安排。书中引用的旧《突发事件应对法》第39、53条及旧总体预案，应作历史资料阅读。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">《突发事件应对法》\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">2025年总体应急预案\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>**1. 报告是履行职责所需的信息传递。**向有权决策、指挥和协调的机关报告，能够支持风险研判及资源调度。具体报告层级、通报范围、时限与渠道应适用相关规定；本条没有为所有国家安全危机设定统一的小时数。\u003c/p>\n\u003cp>**2. 准确与及时须同时满足。**不能将未经核实的判断当作确定事实，也不能以“尚未掌握全部情况”为由压住已经确认的重要信息。初报可以说明事实核实程度及暂不能确定的事项，随后依进展续报、更正，避免迟报和失实报告。\u003c/p>\n\u003cp>**3. 社会发布贯穿整个危机过程。**发布内容包括事件发生、后续发展、管控措施和善后情况。公众既需知道发生了什么，也需知道如何避险、应遵守哪些措施、如何获得救助以及何时恢复正常活动。并非必须等所有内容齐备后一次发布。\u003c/p>\n\u003cp>**4. 统一发布是组织与责任要求。**应明确发布主体、协调机制及权威信息来源，减少相互矛盾的公告。不能因此推导出所有合法报道都被禁止；现行法同时要求支持新闻采访报道与舆论监督。涉及国家秘密、个人隐私或者可能妨害现场救援的信息，应按具体法律处理，不能将“涉及安全”一概等同于“不予公开”。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条把信息透明纳入危机治理：信息既是决策资源，也是公众采取安全行动的条件。准确公开能减少信息不对称，使社会配合具有可理解的事实基础，并为监督公权力提供条件。\u003c/p>\n\u003cp>公开与保密的协调应落到具体信息及具体危害，而非抽象二选一。例如《反恐怖主义法》第63条规定专门的统一发布机关，同时限制披露可被模仿的实施细节、残忍场景以及特定现场人员身份和处置行动信息。此类限制说明公开仍有法定边界，也说明边界应有明确依据。\u003ca href=\"https://www.npc.gov.cn/c2/c12435/c12488/201905/t20190521_222284.html\">《反恐怖主义法》第63条\u003c/a>\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>2025年总体应急预案第3.3.5节要求及时发布简要信息并持续更新；对发生特别重大、重大突发事件，造成重大人员伤亡或者社会影响较大的情形，规定相应的信息发布主体，一般情况下应在24小时内举行首场新闻发布会。\u003cstrong>新闻发布会时限不等于可以等待24小时才发布消息\u003c/strong>，也不等于内部报告时限；旧预案中的“最迟4小时”不能继续作为所有危机的通用规则。\u003c/p>\n\u003cp>《政府信息公开条例》第20条第（十二）项将突发公共事件的预案、预警及应对情况列入主动公开事项。两书所讨论的危机信息发布因此还应与政府信息公开制度衔接，而不宜仅视为新闻宣传工作。\u003ca href=\"https://www.caac.gov.cn/XXGK/XXGK/ZFXXGKZD/202006/t20200609_203007.html\">《政府信息公开条例》\u003c/a>\u003c/p>\n"},{"num":68,"label":"第六十八条","title":"及时解除措施与危机善后","lawText":"国家安全威胁和危害得到控制或者消除后，应当及时解除管控处置措施，做好善后工作。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第六十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家安全威胁和危害得到控制或者消除后，应当及时解除管控处置措施，做好善后工作。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第六十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家安全威胁和危害得到控制或者消除后，应当及时解除管控处置措施，做好善后工作。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">及时解除措施与危机善后 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定危机管控的退出与后续恢复义务。解除措施与开展善后是两项相互衔接的任务：避免权利限制继续存在，同时处理危机及处置活动留下的损害。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条吸收应急管理法律中终止应急措施、恢复生产生活及重建秩序的制度经验，将其提升为国家安全危机管控的一般要求。两书所收审议材料未提供足以确认本条具体文字变动的直接记录，不宜将制度承接写成有明确日期的逐次改稿。\u003c/p>\n\u003cp>2024年《突发事件应对法》第86—94条进一步规定解除响应、恢复重建、救助补偿、评估审计及档案管理；2026年《国防动员法》第76条规定不再必要的特别措施应及时终止，第19条规定依决定实施国防动员的权限和程序解除实施措施。它们分别从一般应急和国防动员领域落实退出机制。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">《突发事件应对法》\u003c/a>、\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">《国防动员法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>**1. “得到控制或者消除”不以绝对零风险为条件。**条文使用“或者”，表明危害已被有效控制，也可能触发解除义务。不能把彻底消灭一切潜在风险作为恢复正常秩序的前提；但须根据实际研判，确认原有措施的必要性已消失或者其范围应当缩减。\u003c/p>\n\u003cp>**2. 解除义务涵盖一般措施和特别措施。**无论是否进入第65条所列非常状态，依据危机需要采取的限制，均须随其依据变化而退出。不同措施所应对的风险可能不同，可以依法分别评估、分别解除，避免因某一事项尚未完成，就维持全部原有管控。\u003c/p>\n\u003cp>**3. 解除须依法落实。**应由有权主体依相应程序作出决定，明确终止范围并告知相关执行单位和公众。2025年总体应急预案按“谁启动、谁终止”安排应急结束及现场指挥机构撤销；这一预案规则应在其适用范围内使用，不能替代宪法、法律对战争、紧急状态或国防动员的特别权限规定。\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">2025年总体应急预案第3.3.6节\u003c/a>\u003c/p>\n\u003cp>**4. 善后应同时处理物质、社会与心理损害。**主要包括受影响人员安置救助、伤者救治、家属抚慰、基础设施修复、生产生活恢复、财产返还和依法补偿，以及心理援助、矛盾化解。处置工作的结束不等于国家保护职责的结束。\u003c/p>\n\u003cp>**5. 善后还包括调查、评估和制度改进。**应查明原因、损失及责任，评估预案和处置过程，依法管理资金、物资及相关档案，将经验转化为风险防范和能力建设。善后不能只计算投入金额或者修复设施数量，而忽略受影响人的实际恢复状况。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现危机权力的\u003cstrong>临时性与目的拘束\u003c/strong>：以控制特定危险为目的的措施，不能在危险消退后转化为日常管理的无限授权。它与第66条共同形成动态约束——必要性降低时应减轻，不再必要时应解除。\u003c/p>\n\u003cp>同时，应区分合法征用等行为所引起的补偿、违法行使职权可能引起的赔偿，以及救助、抚恤、保险理赔等制度。它们的根据、条件和责任主体不同，“做好善后”并不意味着所有损失均按同一种制度或者同一标准由国家赔付。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>解除应急措施后，为防止次生、衍生事件仍可依法采取必要措施。现行《突发事件应对法》第86条对此明确规定，关键是继续措施应具有具体依据和现实必要性，不能只变更名称而实质保留已经失去必要性的限制。\u003c/p>\n\u003cp>退出义务还涉及信息处理：该法第85条要求，为依法应对突发事件获取的个人信息原则上在应对工作结束后销毁；确需依法作为证据或者供调查评估留存的，须经过规定的评估并采取保护措施。不能以“以后可能有用”为由无限保存、转作他用。\u003c/p>\n\u003cp>两书列举事故救援与灾后恢复，可用于理解善后的实际内容；但普通事故属于应急管理事项，并不能仅因存在善后工作就直接认定为国家安全危机，仍须结合事件性质及适用法律判断。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定危机管控的退出与后续恢复义务。解除措施与开展善后是两项相互衔接的任务：避免权利限制继续存在，同时处理危机及处置活动留下的损害。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条吸收应急管理法律中终止应急措施、恢复生产生活及重建秩序的制度经验，将其提升为国家安全危机管控的一般要求。两书所收审议材料未提供足以确认本条具体文字变动的直接记录，不宜将制度承接写成有明确日期的逐次改稿。\u003c/p>\n\u003cp>2024年《突发事件应对法》第86—94条进一步规定解除响应、恢复重建、救助补偿、评估审计及档案管理；2026年《国防动员法》第76条规定不再必要的特别措施应及时终止，第19条规定依决定实施国防动员的权限和程序解除实施措施。它们分别从一般应急和国防动员领域落实退出机制。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">《突发事件应对法》\u003c/a>、\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">《国防动员法》\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>**1. “得到控制或者消除”不以绝对零风险为条件。**条文使用“或者”，表明危害已被有效控制，也可能触发解除义务。不能把彻底消灭一切潜在风险作为恢复正常秩序的前提；但须根据实际研判，确认原有措施的必要性已消失或者其范围应当缩减。\u003c/p>\n\u003cp>**2. 解除义务涵盖一般措施和特别措施。**无论是否进入第65条所列非常状态，依据危机需要采取的限制，均须随其依据变化而退出。不同措施所应对的风险可能不同，可以依法分别评估、分别解除，避免因某一事项尚未完成，就维持全部原有管控。\u003c/p>\n\u003cp>**3. 解除须依法落实。**应由有权主体依相应程序作出决定，明确终止范围并告知相关执行单位和公众。2025年总体应急预案按“谁启动、谁终止”安排应急结束及现场指挥机构撤销；这一预案规则应在其适用范围内使用，不能替代宪法、法律对战争、紧急状态或国防动员的特别权限规定。\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">2025年总体应急预案第3.3.6节\u003c/a>\u003c/p>\n\u003cp>**4. 善后应同时处理物质、社会与心理损害。**主要包括受影响人员安置救助、伤者救治、家属抚慰、基础设施修复、生产生活恢复、财产返还和依法补偿，以及心理援助、矛盾化解。处置工作的结束不等于国家保护职责的结束。\u003c/p>\n\u003cp>**5. 善后还包括调查、评估和制度改进。**应查明原因、损失及责任，评估预案和处置过程，依法管理资金、物资及相关档案，将经验转化为风险防范和能力建设。善后不能只计算投入金额或者修复设施数量，而忽略受影响人的实际恢复状况。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现危机权力的\u003cstrong>临时性与目的拘束\u003c/strong>：以控制特定危险为目的的措施，不能在危险消退后转化为日常管理的无限授权。它与第66条共同形成动态约束——必要性降低时应减轻，不再必要时应解除。\u003c/p>\n\u003cp>同时，应区分合法征用等行为所引起的补偿、违法行使职权可能引起的赔偿，以及救助、抚恤、保险理赔等制度。它们的根据、条件和责任主体不同，“做好善后”并不意味着所有损失均按同一种制度或者同一标准由国家赔付。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>解除应急措施后，为防止次生、衍生事件仍可依法采取必要措施。现行《突发事件应对法》第86条对此明确规定，关键是继续措施应具有具体依据和现实必要性，不能只变更名称而实质保留已经失去必要性的限制。\u003c/p>\n\u003cp>退出义务还涉及信息处理：该法第85条要求，为依法应对突发事件获取的个人信息原则上在应对工作结束后销毁；确需依法作为证据或者供调查评估留存的，须经过规定的评估并采取保护措施。不能以“以后可能有用”为由无限保存、转作他用。\u003c/p>\n\u003cp>两书列举事故救援与灾后恢复，可用于理解善后的实际内容；但普通事故属于应急管理事项，并不能仅因存在善后工作就直接认定为国家安全危机，仍须结合事件性质及适用法律判断。\u003c/p>\n"},{"num":69,"label":"第六十九条","title":"国家安全保障体系与能力建设","lawText":"国家健全国家安全保障体系，增强维护国家安全的能力。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第六十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全国家安全保障体系，增强维护国家安全的能力。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第六十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全国家安全保障体系，增强维护国家安全的能力。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全保障体系与能力建设 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条是第五章“国家安全保障”的总括规定。前一章主要解决制度如何运行，本章进一步解决履行安全职责所需的法律、经费、物资、技术、人才等条件如何得到保障。“健全体系”是制度任务，“增强能力”是评价这些保障是否有效的目标。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已经提出建立健全与维护国家安全需要相适应、与经济社会发展相协调的保障措施，并介绍财政、物资、科技、专门人才、专门工作手段和宣传教育等安排。这说明保障制度从草案阶段即作为独立组成部分，与国家安全任务、工作制度相配套。见甲书附录二，印刷第377页（PDF第390页）。所核审议材料未逐句说明本条的修改经过。\u003c/p>\n\u003cp>本条并非从零创设一切保障手段。国防动员、突发事件应对等领域原已有物资和能力保障；2015年国家安全法将这些分领域安排置于综合体系之中。其后的粮食安全保障法、能源法等又将投入、储备、技术和应急能力具体化。例如粮食安全保障法第6—7条分别规定投入及科技保障。\u003ca href=\"https://fgs.moa.gov.cn/flfg/202401/t20240118_6446125.htm\">粮食安全保障法\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>保障的对象是依法履职的实际需要。\u003c/strong> 国家安全机关及其他负有安全职责的主体，要完成预防、研判、处置和恢复任务，需要稳定的制度条件及可调用资源。保障并不限于发生危机之后追加经费，日常训练、基础设施维护、技术更新和人才培养同样重要。\u003c/p>\n\u003cp>\u003cstrong>保障“体系”要求各要素相互配合。\u003c/strong> 第70条规定法律保障，第71条涉及经费和装备，第72条涉及战略物资，第73条涉及科技，第74条涉及人才，第75条涉及专门工作手段，第76条涉及宣传教育。设备、人员和制度之间存在依赖关系：有设备却无合格人员，有物资却无运输和调用安排，都可能使账面资源无法转化为行动能力。\u003c/p>\n\u003cp>\u003cstrong>能力建设覆盖预防、应对和恢复。\u003c/strong> 信息能否及时到达，风险能否被识别，跨部门协作能否落实，关键服务能否持续，危机之后能否恢复，均可用于观察保障成效。这些是理解“能力”的分析维度，并非本条列明的统一考核指标。\u003c/p>\n\u003cp>\u003cstrong>保障需要统筹配置与持续维护。\u003c/strong> 应结合风险调查评估确定重点、发现薄弱环节，推动适当共享和协同，减少重复建设。资源安排还须与经济社会发展、现实负担和其他公共需要相协调。两书关于保障与能力相互转化的论述，提示我们关注实际可用程度，而不只比较投入总量。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现从“配置资源”到“形成履职能力”的转换。资源是条件，组织、训练、维护和协调决定其能否发挥作用。例如，储备物资只有在质量合格、位置适当、能够调运并交付使用时，才形成相应的保障能力。\u003c/p>\n\u003cp>健全保障体系还须兼顾适应性和适度性。可预见风险需要常备准备，变化中的风险需要调整能力；但增强安全能力不等于追求不计成本的绝对安全。保障措施应依法律运行，涉及资金使用、财产征用和信息处理时，仍应适用各自的权限、程序与监督制度。安全保障与依法监督共同支持能力的稳定运行。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中泉州欣佳酒店坍塌案例可从两个方向理解：救援阶段体现队伍、装备、医疗和协同保障；事故发生前的违法建设、违规经营及监管失守，则说明事后救援能力不能替代日常预防。官方调查认定该事件为重大生产安全责任事故；71名被困人员中42人生还、29人遇难，不能将“搜救出全部被困人员”理解为全部生还。\u003ca href=\"https://www.mem.gov.cn/xw/bndt/202007/W020200714624868952617.pdf\">国务院事故调查组报告，印刷第1—4页\u003c/a>。\u003c/p>\n\u003cp>这一案例说明保障体系的组织功能，具体违法责任仍依据建设、安全生产等法律判断。复习时可用“任务需要什么—现有能力缺什么—由谁提供保障—如何验证可用”四个问题串联本条与后续条文。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条是第五章“国家安全保障”的总括规定。前一章主要解决制度如何运行，本章进一步解决履行安全职责所需的法律、经费、物资、技术、人才等条件如何得到保障。“健全体系”是制度任务，“增强能力”是评价这些保障是否有效的目标。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已经提出建立健全与维护国家安全需要相适应、与经济社会发展相协调的保障措施，并介绍财政、物资、科技、专门人才、专门工作手段和宣传教育等安排。这说明保障制度从草案阶段即作为独立组成部分，与国家安全任务、工作制度相配套。见甲书附录二，印刷第377页（PDF第390页）。所核审议材料未逐句说明本条的修改经过。\u003c/p>\n\u003cp>本条并非从零创设一切保障手段。国防动员、突发事件应对等领域原已有物资和能力保障；2015年国家安全法将这些分领域安排置于综合体系之中。其后的粮食安全保障法、能源法等又将投入、储备、技术和应急能力具体化。例如粮食安全保障法第6—7条分别规定投入及科技保障。\u003ca href=\"https://fgs.moa.gov.cn/flfg/202401/t20240118_6446125.htm\">粮食安全保障法\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>保障的对象是依法履职的实际需要。\u003c/strong> 国家安全机关及其他负有安全职责的主体，要完成预防、研判、处置和恢复任务，需要稳定的制度条件及可调用资源。保障并不限于发生危机之后追加经费，日常训练、基础设施维护、技术更新和人才培养同样重要。\u003c/p>\n\u003cp>\u003cstrong>保障“体系”要求各要素相互配合。\u003c/strong> 第70条规定法律保障，第71条涉及经费和装备，第72条涉及战略物资，第73条涉及科技，第74条涉及人才，第75条涉及专门工作手段，第76条涉及宣传教育。设备、人员和制度之间存在依赖关系：有设备却无合格人员，有物资却无运输和调用安排，都可能使账面资源无法转化为行动能力。\u003c/p>\n\u003cp>\u003cstrong>能力建设覆盖预防、应对和恢复。\u003c/strong> 信息能否及时到达，风险能否被识别，跨部门协作能否落实，关键服务能否持续，危机之后能否恢复，均可用于观察保障成效。这些是理解“能力”的分析维度，并非本条列明的统一考核指标。\u003c/p>\n\u003cp>\u003cstrong>保障需要统筹配置与持续维护。\u003c/strong> 应结合风险调查评估确定重点、发现薄弱环节，推动适当共享和协同，减少重复建设。资源安排还须与经济社会发展、现实负担和其他公共需要相协调。两书关于保障与能力相互转化的论述，提示我们关注实际可用程度，而不只比较投入总量。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现从“配置资源”到“形成履职能力”的转换。资源是条件，组织、训练、维护和协调决定其能否发挥作用。例如，储备物资只有在质量合格、位置适当、能够调运并交付使用时，才形成相应的保障能力。\u003c/p>\n\u003cp>健全保障体系还须兼顾适应性和适度性。可预见风险需要常备准备，变化中的风险需要调整能力；但增强安全能力不等于追求不计成本的绝对安全。保障措施应依法律运行，涉及资金使用、财产征用和信息处理时，仍应适用各自的权限、程序与监督制度。安全保障与依法监督共同支持能力的稳定运行。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>书中泉州欣佳酒店坍塌案例可从两个方向理解：救援阶段体现队伍、装备、医疗和协同保障；事故发生前的违法建设、违规经营及监管失守，则说明事后救援能力不能替代日常预防。官方调查认定该事件为重大生产安全责任事故；71名被困人员中42人生还、29人遇难，不能将“搜救出全部被困人员”理解为全部生还。\u003ca href=\"https://www.mem.gov.cn/xw/bndt/202007/W020200714624868952617.pdf\">国务院事故调查组报告，印刷第1—4页\u003c/a>。\u003c/p>\n\u003cp>这一案例说明保障体系的组织功能，具体违法责任仍依据建设、安全生产等法律判断。复习时可用“任务需要什么—现有能力缺什么—由谁提供保障—如何验证可用”四个问题串联本条与后续条文。\u003c/p>\n"},{"num":70,"label":"第七十条","title":"国家安全法律制度体系与法治建设","lawText":"国家健全国家安全法律制度体系，推动国家安全法治建设。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第七十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全国家安全法律制度体系，推动国家安全法治建设。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第七十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全国家安全法律制度体系，推动国家安全法治建设。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全法律制度体系与法治建设 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条确立国家安全工作的法律保障，包含两个相连的要求：形成协调、完备的规范体系，并使立法、执法、司法、守法和监督实际依照法治要求运行。有法律文本是基础，法律能否得到正确实施是进一步的问题。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年草案说明把加快国家安全法治建设、构建法律制度体系作为制定综合性国家安全法的背景。当时1993年国家安全法主要规范专门机关特别是反间谍工作；2014年反间谍法制定并废止旧国家安全法，2015年新法再承担综合性、全局性的制度任务。见甲书附录二，印刷第372—374页（PDF第385—387页）。这属于制度形成背景，所核审议材料未提供本条逐句修改记录。\u003c/p>\n\u003cp>书中“正在制定”“争取到2020年”等表述具有特定写作时间，阅读时应更新。例如，早期释义所列粮食和能源领域的立法任务，后来分别落实为2023年通过、2024年6月1日施行的粮食安全保障法，以及2024年通过、2025年1月1日施行的能源法。\u003ca href=\"https://fgs.moa.gov.cn/flfg/202401/t20240118_6446125.htm\">粮食安全保障法第74条\u003c/a>、\u003ca href=\"https://www.nea.gov.cn/2024-12/03/c_1212408329.htm\">国家能源局关于能源法的说明\u003c/a>。\u003c/p>\n\u003cp>本批还涉及刚生效的修法：国防动员法于2026年8月28日修订，自2026年10月1日起施行。前述第64—65条所引动员决定、特别措施等配套规定，须采用这次修订后的文本。这也是本条“健全法律制度体系”在持续修法层面的具体体现。\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202608/t20260831_4843629.html\">2026年国防动员法\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 法律制度体系既有层级，也有领域分工。\u003c/strong> 宪法居于根本地位；国家安全法规定总体原则、任务和制度；反间谍、情报、反恐怖、保密、网络、数据、生物等专门法律予以具体化；刑法、诉讼法及其他法律处理相关行为、程序和责任。行政法规、地方性法规、规章在各自法定权限内作出配套规定，须符合上位法。\u003c/p>\n\u003cp>\u003cstrong>2. 综合性规定与专门规则应协调适用。\u003c/strong> 判断一项措施时，应明确具体机关、行为、对象、触发条件和程序，结合适用的专门法解释国家安全法的原则要求。不能仅以“涉及国家安全”代替具体授权，也不能只读一般条文而忽略专门法已设定的条件。\u003c/p>\n\u003cp>\u003cstrong>3. 立法需要覆盖权力、责任与权利保障。\u003c/strong> 既要解决何种风险由谁防范、采取什么措施，也要规定权限边界、事实依据、程序、保密及信息使用要求、监督与责任。立法法第11条对犯罪和刑罚、限制人身自由的强制措施和处罚等设有法律保留要求；部门文件不能自行替代应由法律规定的事项。\u003ca href=\"https://fgw.sh.gov.cn/cmsres/17/178b6e73e5684d1db5662b7aa7efc161/a7bd995c7df73639a986a41bc08e5395.pdf\">立法法第10—12条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>4. 法治建设贯穿法律实施。\u003c/strong> 执法须依法调查、说明依据并遵守程序；司法须审查构成要件、证据及法律适用；机关和社会主体须理解并履行法定义务；监督则应发现和纠正违法、失职及规范冲突。上述环节共同决定制度的实际效果。\u003c/p>\n\u003cp>\u003cstrong>5. “健全”要求持续更新与清理。\u003c/strong> 新风险可能需要新增规范，现有制度也可能需要修改、解释或协调。法律数量增加本身不足以证明体系完备，还须考察规范是否明确、彼此衔接、能够实施。书中法律数量统计只能按其统计时点、范围理解。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>国家安全法治同时具有保障履职和规范权力的功能。明确授权能够帮助机关及时行动，明确程序与责任能够降低任意处置和误判风险；对权利的保护属于制度本身的组成部分。这也与本法第7条的法治原则、第66条的处置措施选择要求相衔接。\u003c/p>\n\u003cp>比较各国制度时，宜比较具体权限、触发条件、程序和监督，而不宜仅按是否有一部名为“国家安全法”的法律判断法治化程度。综合立法与多部专门法可以形成不同的制度结构，关键在于规范如何相互配合、如何适用于具体行动。\u003c/p>\n\u003cp>术语上，称本法具有“基础性”作用，是对其制度地位的描述；不应据此直接认定它就是立法法第10条所称由全国人民代表大会制定的“基本法律”，更不能据此主张它当然高于所有其他法律。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>案例应回到具体法律。\u003c/strong> 书中唐英杰案涉及香港国安法中的犯罪构成、证据及量刑，不能作为直接依据本条定罪的案例。律政司公布的判刑摘要还明确：该案恐怖活动罪量刑适用未造成严重身体伤害的“其他情形”档次。应区分控方指控、定罪事实和量刑认定，避免只依据新闻转述作结论。\u003ca href=\"https://www.doj.gov.hk/en/publications/national_security/pdf/HCCC_280_2020_HKCFI_2239_en.pdf\">香港律政司判刑摘要：HKSAR v Tong Ying Kit，2021 HKCFI 2239\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>更新法律名称和版本。\u003c/strong> 个人信息保护的正式法律名称为《中华人民共和国个人信息保护法》。保守国家秘密法已于2024年修订，网络安全法已于2025年修改；查找书中关联条文时，应同时核对现行版本、条号和生效日期。\u003ca href=\"https://gdca.miit.gov.cn/zwgk/zcwj/flfg/art/2024/art_4870c40a6f8249389684d03786d41639.html\">2024年保守国家秘密法\u003c/a>、\u003ca href=\"https://www.cac.gov.cn/2025-12/29/c_1768735112911946.htm\">2025年修改后的网络安全法\u003c/a>。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条确立国家安全工作的法律保障，包含两个相连的要求：形成协调、完备的规范体系，并使立法、执法、司法、守法和监督实际依照法治要求运行。有法律文本是基础，法律能否得到正确实施是进一步的问题。\u003
