u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何评价重大安全事故中的国家保护责任？\u003c/strong>\u003cbr>   是否应当建立“事前预防—事中处置—事后恢复—责任与救济”的全过程评价方法，而不能只以事故后的应急救援判断保护任务履行情况？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>人民安全的境外保护范围如何确定？\u003c/strong>\u003cbr>   第16条与第33条结合后，国家对境外中国公民和组织安全保护的法律基础、措施类型和权限边界应如何理解？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>人民安全与其他领域安全之间是什么关系？\u003c/strong>\u003cbr>   生态安全、经济安全、资源安全、公共安全等领域最终往往影响人的生存和发展，第16条是否具有贯穿其他领域安全任务的解释功能？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>人民安全如何落实到具体人的实际处境？\u003c/strong>\u003cbr>宏观安全指标良好并不意味着每一群体都具有相同的安全水平。国家安全制度应如何关注老年人、儿童、劳动者以及重大风险中的特定受影响群体，并把抽象的“人民安全”转化为可以观察的现实安全状态？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":17,"label":"第十七条","title":"国土安全任务","lawText":"国家加强边防、海防和空防建设，采取一切必要的防卫和管控措施，保卫领陆、内水、领海和领空安全，维护国家领土主权和海洋权益。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>能力建设：\u003c/strong> 国家首先负有加强边防、海防和空防建设的任务，包括相应的设施、装备、人员、技术以及组织协同能力。\u003c/li>\n\u003cli>\u003cstrong>两类措施：\u003c/strong> “防卫”主要面向对国家领土主权和安全的外来侵犯，“管控”则更多涉及边境、海上和空中活动的日常管理；二者可能衔接，但不能相互替代法定职权和程序。\u003c/li>\n\u003cli>\u003cstrong>四类空间：\u003c/strong> 本条直接列举领陆、内水、领海和领空，这些空间属于国家主权直接覆盖的基本范围。\u003c/li>\n\u003cli>\u003cstrong>两个保护目标：\u003c/strong> “国家领土主权”主要对应领土及其主权秩序；“海洋权益”范围更广，还可能包括在专属经济区、大陆架等海域依法享有的主权权利、管辖权及其他海洋权益。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家加强边防、海防和空防建设，采取一切必要的防卫和管控措施，保卫领陆、内水、领海和领空安全，维护国家领土主权和海洋权益。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>能力建设：\u003c/strong> 国家首先负有加强边防、海防和空防建设的任务，包括相应的设施、装备、人员、技术以及组织协同能力。\u003c/li>\n\u003cli>\u003cstrong>两类措施：\u003c/strong> “防卫”主要面向对国家领土主权和安全的外来侵犯，“管控”则更多涉及边境、海上和空中活动的日常管理；二者可能衔接，但不能相互替代法定职权和程序。\u003c/li>\n\u003cli>\u003cstrong>四类空间：\u003c/strong> 本条直接列举领陆、内水、领海和领空，这些空间属于国家主权直接覆盖的基本范围。\u003c/li>\n\u003cli>\u003cstrong>两个保护目标：\u003c/strong> “国家领土主权”主要对应领土及其主权秩序；“海洋权益”范围更广，还可能包括在专属经济区、大陆架等海域依法享有的主权权利、管辖权及其他海洋权益。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家加强边防、海防和空防建设，采取一切必要的防卫和管控措施，保卫领陆、内水、领海和领空安全，维护国家领土主权和海洋权益。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国土安全任务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定维护\u003cstrong>国土安全\u003c/strong>的基本任务，是第8条“统筹国土安全和国民安全”在第二章中的具体展开。条文依次规定了能力建设、措施类型、保护空间和保护目标，可以概括为：\u003c/p>\n\u003cp>\u003cstrong>边防、海防、空防建设 → 防卫和管控措施 → 领陆、内水、领海、领空安全 → 领土主权和海洋权益\u003c/strong>\u003c/p>\n\u003cp>理解本条尤其需要注意两个区分：一是“\u003cstrong>防卫\u003c/strong>”与“\u003cstrong>管控\u003c/strong>”具有不同功能和法律依据；二是“\u003cstrong>领土主权\u003c/strong>”与“\u003cstrong>海洋权益\u003c/strong>”并非同一范围、同一性质的权利。\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 本条建立在既有边防、海防和空防法律制度基础之上\u003c/h4>\n\u003cp>2015年《国家安全法》制定以前，我国已经通过不同法律分别规范领土和边海空安全问题。例如，1992年《领海及毗连区法》已经分别规定我国对领海行使主权、对毗连区行使特定管制权；1998年《专属经济区和大陆架法》则规定我国在专属经济区和大陆架享有相应主权权利和管辖权。\n因此，第17条的制度意义主要在于：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>将原本分布于国防、边境、海洋和航空等不同法律领域的制度，纳入“维护国土安全”这一综合性国家安全任务框架。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>2. 国土安全的维护方式不限于军事防卫\u003c/h4>\n\u003cp>甲书特别将国土安全活动区分为两个相互联系的方面：\u003c/p>\n\u003cp>\u003cstrong>防卫工作 + 管理工作\u003c/strong>\n传统意义上的边防、海防、空防首先具有防卫属性，需要防范和抵御对国家领土主权的武装侵犯以及其他严重安全威胁。\n但现代国土安全还大量表现为日常管理，例如：\u003c/p>\n\u003cul>\n\u003cli>陆地边境管理；\u003c/li>\n\u003cli>出入境和口岸管理；\u003c/li>\n\u003cli>海上执法和海洋资源管理；\u003c/li>\n\u003cli>海上航行秩序管理；\u003c/li>\n\u003cli>空域和航空活动管理等。\n因此，第17条在“防卫”之外专门使用“\u003cstrong>管控\u003c/strong>”，使国土安全任务不限于军事意义上的国土防御。\u003c/li>\n\u003c/ul>\n\u003cp>可以概括为：\u003c/p>\n\u003cp>\u003cstrong>军事和安全防卫\u003c/strong>\u003cbr>＋\u003cbr>\u003cstrong>常态化边海空管理\u003c/strong>\u003c/p>\n\u003cp>共同构成国土安全治理。\u003c/p>\n\u003chr>\n\u003ch4>3. 2015年以后专门立法进一步具体化第17条的制度内容〔后续制度发展〕\u003c/h4>\n\u003cp>第17条制定以后，边防、海防和空防领域的法律制度继续发展。\u003c/p>\n\u003cp>\u003cstrong>第一，2020年修订《国防法》。\u003c/strong>\u003c/p>\n\u003cp>现行《国防法》第四章专门规定“边防、海防、空防和其他重大安全领域防卫”。第30条规定国家建设强大稳固的现代边防、海防和空防，并采取有效的防卫和管理措施，保卫领陆、领水、领空安全，维护国家海洋权益。\u003c/p>\n\u003cp>\u003cstrong>第二，2021年制定《海警法》。\u003c/strong>\u003c/p>\n\u003cp>《海警法》明确海警机构统一履行海上维权执法职责，并分别规定海上安全保卫、海上行政执法、海上犯罪侦查、警械和武器使用等制度。\u003c/p>\n\u003cp>\u003cstrong>第三，2021年制定《陆地国界法》。\u003c/strong>\u003c/p>\n\u003cp>《陆地国界法》系统规定陆地国界的划定和勘定、边境防卫、边境管理、基础设施建设以及国际合作。其中还具体规定边防执勤、边境禁区、边防基础设施以及边境管理等制度。\u003c/p>\n\u003cp>因此，可以看到：\u003c/p>\n\u003cp>\u003cstrong>第17条：提出国土安全的一般国家任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>国防法、陆地国界法、海警法等：进一步具体配置职责、权限和程序\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，加强边防、海防和空防建设首先是一项安全能力建设任务\u003c/h4>\n\u003cp>第17条首先规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“国家加强边防、海防和空防建设。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>可以将其主要内容理解为：\u003c/p>\n\u003cul>\n\u003cli>边境、海岸和空防基础设施；\u003c/li>\n\u003cli>监测、预警和通信系统；\u003c/li>\n\u003cli>人员和专业队伍；\u003c/li>\n\u003cli>装备和技术能力；\u003c/li>\n\u003cli>交通、保障和应急能力；\u003c/li>\n\u003cli>不同机关之间的协同机制。\u003c/li>\n\u003c/ul>\n\u003cp>乙书尤其强调现代技术和基础设施在边海空安全中的作用，例如监控、通信、遥感和无人化技术等。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国土安全既表现为对具体威胁作出反应，也表现为平时持续建设发现、预警、防范和应对风险的能力。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这一点与第2条将“保障持续安全状态的能力”纳入国家安全定义相互呼应。\u003c/p>\n\u003chr>\n\u003ch4>第二，“防卫”和“管控”对应国土安全治理的不同功能\u003c/h4>\n\u003cp>本条要求国家采取必要的：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“防卫和管控措施”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>两者具有不同侧重。\u003c/p>\n\u003cp>\u003cstrong>防卫\u003c/strong>主要针对外来侵犯以及严重危害国家领土主权、安全的行为，其核心是防止国家领陆、领水和领空遭受侵犯。\u003c/p>\n\u003cp>\u003cstrong>管控\u003c/strong>则更多表现为日常行政管理、安全管理和秩序维护，例如：\u003c/p>\n\u003cul>\n\u003cli>边境人员和活动管理；\u003c/li>\n\u003cli>出入境管理；\u003c/li>\n\u003cli>海上执法；\u003c/li>\n\u003cli>船舶航行管理；\u003c/li>\n\u003cli>海洋资源和环境管理；\u003c/li>\n\u003cli>空域和航空活动管理等。\u003c/li>\n\u003c/ul>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>防卫解决严重安全威胁和外来侵犯\u003c/strong>\u003cbr>\u003cstrong>管控解决日常边海空秩序和风险治理\u003c/strong>\u003c/p>\n\u003cp>两者可能相互联系，但不能因此混淆各自的法律权限。\u003c/p>\n\u003cp>例如，军事防卫机关的职责不能当然替代海上行政执法权限，行政管理机关也不能仅依据第17条取得军事防卫职权。\u003c/p>\n\u003chr>\n\u003ch4>第三，领陆、内水、领海和领空属于本条直接列举的国土安全空间\u003c/h4>\n\u003cp>本条明确列举四类保护空间：\u003c/p>\n\u003cp>\u003cstrong>领陆 + 内水 + 领海 + 领空\u003c/strong>\u003c/p>\n\u003ch5>1. 领陆\u003c/h5>\n\u003cp>领陆是国家领土中的陆地部分，是国家行使领土主权的基本空间。\u003c/p>\n\u003cp>2021年《陆地国界法》第3条进一步规定，陆地国界是划分我国与陆地邻国接壤的领陆和内水的界限，并垂直划分相应领空和底土。\u003c/p>\n\u003ch5>2. 内水\u003c/h5>\n\u003cp>在海洋法意义上，领海基线向陆地一侧的水域属于内水。\u003c/p>\n\u003cp>内水属于国家主权范围，应与基线外侧的领海、毗连区和专属经济区等海域区分。\u003c/p>\n\u003ch5>3. 领海\u003c/h5>\n\u003cp>我国《领海及毗连区法》规定，领海为邻接陆地领土和内水的一带海域，宽度从领海基线量起为十二海里。\u003c/p>\n\u003cp>在国际海洋法上，沿海国的主权延伸至领海及其上空、海床和底土，但领海主权的行使同时受到《联合国海洋法公约》和其他国际法规则约束。\u003c/p>\n\u003ch5>4. 领空\u003c/h5>\n\u003cp>领空是国家领陆和领水上方的空域。\u003c/p>\n\u003cp>现行《民用航空法》仍明确规定，中华人民共和国的领陆和领水之上的空域为中华人民共和国领空，并规定国家对领空享有完全、排他的主权。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>领陆、内水、领海和领空共同构成本条中“保卫国土安全”的直接空间对象。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第四，“领土主权”与“海洋权益”必须区分\u003c/h4>\n\u003cp>这是理解第17条最重要的概念区分之一。\u003c/p>\n\u003cp>条文最后规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“维护国家领土主权和海洋权益。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>如果二者完全相同，就没有必要分别规定。\u003c/p>\n\u003cp>\u003cstrong>领土主权\u003c/strong>主要针对国家领土范围内的排他性国家权力，包括领陆、内水、领海以及相应领空等。\u003c/p>\n\u003cp>\u003cstrong>海洋权益\u003c/strong>的范围则可能超出国家领土本身。\u003c/p>\n\u003cp>例如，在专属经济区和大陆架，沿海国依法享有的主要并非对整个海域的“领土主权”，而是根据海域性质分别享有：\u003c/p>\n\u003cul>\n\u003cli>主权权利；\u003c/li>\n\u003cli>特定事项的管辖权；\u003c/li>\n\u003cli>其他国际法规定的权利。\u003c/li>\n\u003c/ul>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>海洋权益是一个比“领海主权”更广的概念，但不同海域中的具体权利性质并不相同。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这也是为什么不能笼统地把专属经济区、大陆架全部称为“我国领土”。\u003c/p>\n\u003chr>\n\u003ch4>第五，“一切必要的防卫和管控措施”需要同时把握“一切”与“必要”\u003c/h4>\n\u003cp>第17条使用：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“采取一切必要的防卫和管控措施。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>理解时不能只看到“一切”，还必须同时看到“必要”。\u003c/p>\n\u003cp>“一切”表明国土安全风险复杂，国家可以依法综合运用军事、行政、技术、外交以及其他必要手段。\u003c/p>\n\u003cp>“必要”则说明措施应当服务于维护领陆、内水、领海、领空安全以及领土主权、海洋权益这一法定目的。\u003c/p>\n\u003cp>因此，不能将该表述理解为：\u003c/p>\n\u003cblockquote>\n\u003cp>“只要为了国土安全，即可以不受其他法律限制采取任何措施。”\u003c/p>\n\u003c/blockquote>\n\u003cp>更准确的分析结构是：\u003c/p>\n\u003cp>\u003cstrong>是否存在相应国土安全风险\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>哪个机关依法负责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>具体法律授予什么权限\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>采取措施是否符合条件和程序\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>措施范围是否属于实现安全目的所需要的范围\u003c/strong>\u003c/p>\n\u003cp>这一点还应与第7条依法维护国家安全、第43条严格依法履职共同理解。\u003c/p>\n\u003chr>\n\u003ch4>第六，国土安全实行多机关依法分工和协同\u003c/h4>\n\u003cp>国土安全跨越陆地、海洋和空域，单一机关无法承担全部任务。\u003c/p>\n\u003cp>甲书已经指出，边防、海防和空防工作涉及国防、外交、公安、国家安全以及有关行政主管部门等不同主体，需要依法分工和协调。\u003c/p>\n\u003cp>2015年以后制定的专门法律进一步具体化这种分工。\u003c/p>\n\u003cp>例如，《陆地国界法》分别规定外交、公安、军事机关以及边境地方政府等主体的职责；《海警法》则明确海警机构统一履行海上维权执法职责。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第17条确定的是国家层面的国土安全任务，具体机关的职责和权限仍须到相应组织法和专门法律中寻找。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 国土空间与海洋权益具有不同的法律层次〔海洋法／体系解释〕\u003c/h4>\n\u003cp>结合《联合国海洋法公约》，可以进一步整理如下：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>空间或海域\u003c/th>\n\u003cth>沿海国的主要法律地位\u003c/th>\n\u003cth>研读提醒\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>内水\u003c/strong>\u003c/td>\n\u003ctd>原则上属于国家主权范围\u003c/td>\n\u003ctd>应与基线外的领海等海域区分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>领海\u003c/strong>\u003c/td>\n\u003ctd>沿海国主权延伸至领海及其上空、海床和底土\u003c/td>\n\u003ctd>主权的行使受《海洋法公约》及其他国际法规则约束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>毗连区\u003c/strong>\u003c/td>\n\u003ctd>就海关、财政、移民、卫生等特定事项行使必要管制\u003c/td>\n\u003ctd>并非国家领土，也不意味着领海边界向外延伸\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>专属经济区\u003c/strong>\u003c/td>\n\u003ctd>对自然资源等享有主权权利，并在人工岛、海洋科研、环境保护等事项上具有相应管辖权\u003c/td>\n\u003ctd>不等于对整个海域享有领土主权，其他国家依法享有航行、飞越等权利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>大陆架\u003c/strong>\u003c/td>\n\u003ctd>对海床和底土自然资源的勘探开发享有相应主权权利\u003c/td>\n\u003ctd>权利主要针对海床和底土，不当然改变上覆水域和上空的法律地位\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>**“我国依法享有海洋权益的海域”不等于“我国领土”。**不同海域中的主权、主权权利、管辖权和其他权利，需要按照相应法律制度分别判断。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>2. “主权”“主权权利”和“管辖权”不能混用〔海洋法〕\u003c/h4>\n\u003cp>三个概念的规范强度和适用对象不同。\u003c/p>\n\u003cp>\u003cstrong>主权（sovereignty）\u003c/strong>\u003c/p>\n\u003cp>典型适用于领陆、内水、领海及其相应领空等国家领土范围。\u003c/p>\n\u003cp>\u003cstrong>主权权利（sovereign rights）\u003c/strong>\u003c/p>\n\u003cp>例如《联合国海洋法公约》第56条规定，沿海国在专属经济区内为勘探、开发、养护和管理自然资源等目的享有主权权利。\u003c/p>\n\u003cp>这种“主权权利”具有特定功能和事项范围，不能与对领土享有的完整主权等同。\u003c/p>\n\u003cp>\u003cstrong>管辖权（jurisdiction）\u003c/strong>\u003c/p>\n\u003cp>则可能针对特定事项，例如专属经济区中的人工岛设施、海洋科学研究和海洋环境保护等。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家在某海域享有某种管辖权，并不意味着该海域因此成为国家领土。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这一区分是准确理解第17条“领土主权和海洋权益”的基础。\u003c/p>\n\u003chr>\n\u003ch4>3. “必要”具有措施控制意义，但不能直接等同于完整的比例原则公式〔笔记分析〕\u003c/h4>\n\u003cp>第17条明确使用“必要”一词，因此具体措施与维护国土安全目的之间需要具有相应联系。\u003c/p>\n\u003cp>可以合理追问：\u003c/p>\n\u003cul>\n\u003cli>风险是否真实存在；\u003c/li>\n\u003cli>为什么需要采取该措施；\u003c/li>\n\u003cli>措施是否有助于防范或者控制风险；\u003c/li>\n\u003cli>措施范围是否超过实际安全需要。\u003c/li>\n\u003c/ul>\n\u003cp>但需要保持解释限度。\u003c/p>\n\u003cp>第17条并没有像第66条危机管控规定那样，进一步明确写出：\u003c/p>\n\u003cblockquote>\n\u003cp>措施与危害的性质、程度和范围相适应，以及在多种措施中选择最大程度保护权益的措施。\u003c/p>\n\u003c/blockquote>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第17条的“必要”可以支持对措施适当性和范围进行法律论证，但不宜直接宣称第17条自身已经完整规定了一套比例原则审查公式。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>完整判断还需要结合第7条、第43条以及具体专门法律。\u003c/p>\n\u003chr>\n\u003ch4>4. 国土安全任务条款与具体职权授权必须区分〔笔记分析〕\u003c/h4>\n\u003cp>第17条的规范主语是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“国家”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>其核心内容是规定国家在国土安全领域承担什么任务。\u003c/p>\n\u003cp>它没有逐项规定：\u003c/p>\n\u003cul>\n\u003cli>哪个机关可以登临检查船舶；\u003c/li>\n\u003cli>谁可以划定边境禁区；\u003c/li>\n\u003cli>谁可以检查人员证件；\u003c/li>\n\u003cli>谁可以拦截航空器；\u003c/li>\n\u003cli>什么情况下可以使用武器；\u003c/li>\n\u003cli>可以采取何种行政强制措施。\u003c/li>\n\u003c/ul>\n\u003cp>这些问题分别需要《陆地国界法》《海警法》《出境入境管理法》《民用航空法》《国防法》等专门法律回答。\u003c/p>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第8条与第17条形成“一般原则—具体任务”的关系\u003c/h4>\n\u003cp>第8条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>统筹国土安全和国民安全。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第17条则进一步规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国土安全具体需要完成哪些任务。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第8条：国土安全在总体国家安全中的关系定位\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第17条：国土安全领域的具体国家任务\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（二）第17条与第18条必须区分\u003c/h4>\n\u003cp>两条存在联系，但不能混为一条军事安全规范。\u003c/p>\n\u003cp>\u003cstrong>第17条：国土安全\u003c/strong>\u003c/p>\n\u003cp>主要围绕：\u003c/p>\n\u003cul>\n\u003cli>边防；\u003c/li>\n\u003cli>海防；\u003c/li>\n\u003cli>空防；\u003c/li>\n\u003cli>防卫与管控；\u003c/li>\n\u003cli>领陆、内水、领海和领空；\u003c/li>\n\u003cli>领土主权和海洋权益。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>第18条：军事安全\u003c/strong>\u003c/p>\n\u003cp>主要围绕：\u003c/p>\n\u003cul>\n\u003cli>武装力量建设；\u003c/li>\n\u003cli>积极防御军事战略；\u003c/li>\n\u003cli>防备和抵御侵略；\u003c/li>\n\u003cli>制止武装颠覆和分裂；\u003c/li>\n\u003cli>国际军事安全合作等。\u003c/li>\n\u003c/ul>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>边海空防具有军事防卫面向，但国土安全还包含大量日常行政管理和执法活动，不能全部归入军事安全。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（三）2015年以后形成了更加具体的国土安全法律体系\u003c/h4>\n\u003cp>可以将第17条与后续专门法律进行对应：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>领域\u003c/th>\n\u003cth>主要后续法律\u003c/th>\n\u003cth>与第17条的关系\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>总体边海空防\u003c/strong>\u003c/td>\n\u003ctd>《国防法》\u003c/td>\n\u003ctd>规定边防、海防、空防以及其他重大安全领域防卫\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>陆地边境\u003c/strong>\u003c/td>\n\u003ctd>《陆地国界法》\u003c/td>\n\u003ctd>具体规定国界划定、边境防卫、管理、建设和国际合作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>海上维权执法\u003c/strong>\u003c/td>\n\u003ctd>《海警法》\u003c/td>\n\u003ctd>具体规定海警机构职责、行政执法、犯罪侦查及有关措施\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>海洋权利\u003c/strong>\u003c/td>\n\u003ctd>《领海及毗连区法》《专属经济区和大陆架法》\u003c/td>\n\u003ctd>确定不同海域中的主权、管制权、主权权利和管辖权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>空域与民航\u003c/strong>\u003c/td>\n\u003ctd>《民用航空法》等\u003c/td>\n\u003ctd>规定领空主权以及民用航空活动管理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>因此，第17条最适合被理解为：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国土安全领域的上位任务规范，专门法律负责将其转化为具体制度和职权。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（四）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：我国享有海洋权益的全部海域都属于我国领土。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 领海属于国家主权覆盖的范围；专属经济区、大陆架等海域中的权利主要表现为特定主权权利、管辖权和其他国际法权利，不能一律表述为领土主权。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：专属经济区等同于领海。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 二者法律性质不同。沿海国对领海享有主权，而在专属经济区主要享有资源方面的主权权利和特定事项管辖权，其他国家仍依法享有航行、飞越等权利。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：毗连区是领海向外延伸的另一段国家领土。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 毗连区不属于领海。沿海国主要在海关、财政、移民、卫生等特定事项上依法行使必要管制权。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：大陆架权利意味着国家对大陆架上方全部水域享有主权。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 大陆架制度主要涉及海床和底土及其自然资源。大陆架权利不当然改变上覆水域及其上空的法律地位。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：“采取一切必要措施”意味着国家机关可以采取任何认为有利于国土安全的措施。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第17条规定国家任务。具体机关能采取何种措施，仍须有专门法律授予职权，并符合相应实体条件和程序。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：边防、海防、空防完全属于军事事务。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 国土安全既包含军事防卫，也包含边境管理、海上行政执法、出入境、航空和其他日常管理。不同事项由不同机关依法承担。\u003c/p>\n\u003chr>\n\u003ch2>六、研究问题\u003c/h2>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>如何在国土安全分析中准确区分“空间”与“权利”？\u003c/strong>\u003cbr>对领海、毗连区、专属经济区和大陆架，应如何分别识别其空间性质、国家享有的权利类型以及相应执法权限？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“一切必要的防卫和管控措施”应受到何种法律控制？\u003c/strong>\u003cbr>第17条中的“必要”能否发展为更加具体的措施控制标准，其与第7条、第43条以及专门法律中的权限、程序规范如何衔接？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>防卫权与行政管控权如何区分？\u003c/strong>\u003cbr>当同一国土安全事件同时涉及军事、安全和行政管理问题时，如何确定不同机关的权限边界和协同机制？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国土安全任务条款如何转化为具体职权？\u003c/strong>\u003cbr>从第17条的一般国家任务到《陆地国界法》《海警法》等专门法律中的具体执法权，中间应当满足何种授权明确性要求？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>海洋权益的法律结构如何体系化？\u003c/strong>\u003cbr>能否按照“主权—主权权利—管辖权—其他权利”的层次建立统一分析框架，避免将不同海域中的国家权利混为一谈？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>技术化边海空管控对法律制度提出哪些新要求？\u003c/strong>\u003cbr>卫星遥感、无人机、自动识别系统和智能监控广泛应用后，如何处理监测能力提升与权限、数据使用、个人权益及责任机制之间的关系？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国土安全与正常跨境活动如何协调？\u003c/strong>\u003cbr>边境贸易、人员往来、航运、航空以及海洋科研同时具有发展价值和安全风险，应如何结合第8条“发展与安全相协调”确定适当的管控强度？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何评价国土安全能力建设的实际效果？\u003c/strong>\u003cbr>除设施、装备和人员数量之外，是否还应考察风险发现能力、响应速度、跨部门协同、依法履职以及对正常经济社会活动的影响？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定维护\u003cstrong>国土安全\u003c/strong>的基本任务，是第8条“统筹国土安全和国民安全”在第二章中的具体展开。条文依次规定了能力建设、措施类型、保护空间和保护目标，可以概括为：\u003c/p>\n\u003cp>\u003cstrong>边防、海防、空防建设 → 防卫和管控措施 → 领陆、内水、领海、领空安全 → 领土主权和海洋权益\u003c/strong>\u003c/p>\n\u003cp>理解本条尤其需要注意两个区分：一是“\u003cstrong>防卫\u003c/strong>”与“\u003cstrong>管控\u003c/strong>”具有不同功能和法律依据；二是“\u003cstrong>领土主权\u003c/strong>”与“\u003cstrong>海洋权益\u003c/strong>”并非同一范围、同一性质的权利。\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 本条建立在既有边防、海防和空防法律制度基础之上\u003c/h4>\n\u003cp>2015年《国家安全法》制定以前，我国已经通过不同法律分别规范领土和边海空安全问题。例如，1992年《领海及毗连区法》已经分别规定我国对领海行使主权、对毗连区行使特定管制权；1998年《专属经济区和大陆架法》则规定我国在专属经济区和大陆架享有相应主权权利和管辖权。\n因此，第17条的制度意义主要在于：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>将原本分布于国防、边境、海洋和航空等不同法律领域的制度，纳入“维护国土安全”这一综合性国家安全任务框架。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>2. 国土安全的维护方式不限于军事防卫\u003c/h4>\n\u003cp>甲书特别将国土安全活动区分为两个相互联系的方面：\u003c/p>\n\u003cp>\u003cstrong>防卫工作 + 管理工作\u003c/strong>\n传统意义上的边防、海防、空防首先具有防卫属性，需要防范和抵御对国家领土主权的武装侵犯以及其他严重安全威胁。\n但现代国土安全还大量表现为日常管理，例如：\u003c/p>\n\u003cul>\n\u003cli>陆地边境管理；\u003c/li>\n\u003cli>出入境和口岸管理；\u003c/li>\n\u003cli>海上执法和海洋资源管理；\u003c/li>\n\u003cli>海上航行秩序管理；\u003c/li>\n\u003cli>空域和航空活动管理等。\n因此，第17条在“防卫”之外专门使用“\u003cstrong>管控\u003c/strong>”，使国土安全任务不限于军事意义上的国土防御。\u003c/li>\n\u003c/ul>\n\u003cp>可以概括为：\u003c/p>\n\u003cp>\u003cstrong>军事和安全防卫\u003c/strong>\u003cbr>＋\u003cbr>\u003cstrong>常态化边海空管理\u003c/strong>\u003c/p>\n\u003cp>共同构成国土安全治理。\u003c/p>\n\u003chr>\n\u003ch4>3. 2015年以后专门立法进一步具体化第17条的制度内容〔后续制度发展〕\u003c/h4>\n\u003cp>第17条制定以后，边防、海防和空防领域的法律制度继续发展。\u003c/p>\n\u003cp>\u003cstrong>第一，2020年修订《国防法》。\u003c/strong>\u003c/p>\n\u003cp>现行《国防法》第四章专门规定“边防、海防、空防和其他重大安全领域防卫”。第30条规定国家建设强大稳固的现代边防、海防和空防，并采取有效的防卫和管理措施，保卫领陆、领水、领空安全，维护国家海洋权益。\u003c/p>\n\u003cp>\u003cstrong>第二，2021年制定《海警法》。\u003c/strong>\u003c/p>\n\u003cp>《海警法》明确海警机构统一履行海上维权执法职责，并分别规定海上安全保卫、海上行政执法、海上犯罪侦查、警械和武器使用等制度。\u003c/p>\n\u003cp>\u003cstrong>第三，2021年制定《陆地国界法》。\u003c/strong>\u003c/p>\n\u003cp>《陆地国界法》系统规定陆地国界的划定和勘定、边境防卫、边境管理、基础设施建设以及国际合作。其中还具体规定边防执勤、边境禁区、边防基础设施以及边境管理等制度。\u003c/p>\n\u003cp>因此，可以看到：\u003c/p>\n\u003cp>\u003cstrong>第17条：提出国土安全的一般国家任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>国防法、陆地国界法、海警法等：进一步具体配置职责、权限和程序\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，加强边防、海防和空防建设首先是一项安全能力建设任务\u003c/h4>\n\u003cp>第17条首先规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“国家加强边防、海防和空防建设。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>可以将其主要内容理解为：\u003c/p>\n\u003cul>\n\u003cli>边境、海岸和空防基础设施；\u003c/li>\n\u003cli>监测、预警和通信系统；\u003c/li>\n\u003cli>人员和专业队伍；\u003c/li>\n\u003cli>装备和技术能力；\u003c/li>\n\u003cli>交通、保障和应急能力；\u003c/li>\n\u003cli>不同机关之间的协同机制。\u003c/li>\n\u003c/ul>\n\u003cp>乙书尤其强调现代技术和基础设施在边海空安全中的作用，例如监控、通信、遥感和无人化技术等。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国土安全既表现为对具体威胁作出反应，也表现为平时持续建设发现、预警、防范和应对风险的能力。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这一点与第2条将“保障持续安全状态的能力”纳入国家安全定义相互呼应。\u003c/p>\n\u003chr>\n\u003ch4>第二，“防卫”和“管控”对应国土安全治理的不同功能\u003c/h4>\n\u003cp>本条要求国家采取必要的：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“防卫和管控措施”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>两者具有不同侧重。\u003c/p>\n\u003cp>\u003cstrong>防卫\u003c/strong>主要针对外来侵犯以及严重危害国家领土主权、安全的行为，其核心是防止国家领陆、领水和领空遭受侵犯。\u003c/p>\n\u003cp>\u003cstrong>管控\u003c/strong>则更多表现为日常行政管理、安全管理和秩序维护，例如：\u003c/p>\n\u003cul>\n\u003cli>边境人员和活动管理；\u003c/li>\n\u003cli>出入境管理；\u003c/li>\n\u003cli>海上执法；\u003c/li>\n\u003cli>船舶航行管理；\u003c/li>\n\u003cli>海洋资源和环境管理；\u003c/li>\n\u003cli>空域和航空活动管理等。\u003c/li>\n\u003c/ul>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>防卫解决严重安全威胁和外来侵犯\u003c/strong>\u003cbr>\u003cstrong>管控解决日常边海空秩序和风险治理\u003c/strong>\u003c/p>\n\u003cp>两者可能相互联系，但不能因此混淆各自的法律权限。\u003c/p>\n\u003cp>例如，军事防卫机关的职责不能当然替代海上行政执法权限，行政管理机关也不能仅依据第17条取得军事防卫职权。\u003c/p>\n\u003chr>\n\u003ch4>第三，领陆、内水、领海和领空属于本条直接列举的国土安全空间\u003c/h4>\n\u003cp>本条明确列举四类保护空间：\u003c/p>\n\u003cp>\u003cstrong>领陆 + 内水 + 领海 + 领空\u003c/strong>\u003c/p>\n\u003ch5>1. 领陆\u003c/h5>\n\u003cp>领陆是国家领土中的陆地部分，是国家行使领土主权的基本空间。\u003c/p>\n\u003cp>2021年《陆地国界法》第3条进一步规定，陆地国界是划分我国与陆地邻国接壤的领陆和内水的界限，并垂直划分相应领空和底土。\u003c/p>\n\u003ch5>2. 内水\u003c/h5>\n\u003cp>在海洋法意义上，领海基线向陆地一侧的水域属于内水。\u003c/p>\n\u003cp>内水属于国家主权范围，应与基线外侧的领海、毗连区和专属经济区等海域区分。\u003c/p>\n\u003ch5>3. 领海\u003c/h5>\n\u003cp>我国《领海及毗连区法》规定，领海为邻接陆地领土和内水的一带海域，宽度从领海基线量起为十二海里。\u003c/p>\n\u003cp>在国际海洋法上，沿海国的主权延伸至领海及其上空、海床和底土，但领海主权的行使同时受到《联合国海洋法公约》和其他国际法规则约束。\u003c/p>\n\u003ch5>4. 领空\u003c/h5>\n\u003cp>领空是国家领陆和领水上方的空域。\u003c/p>\n\u003cp>现行《民用航空法》仍明确规定，中华人民共和国的领陆和领水之上的空域为中华人民共和国领空，并规定国家对领空享有完全、排他的主权。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>领陆、内水、领海和领空共同构成本条中“保卫国土安全”的直接空间对象。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第四，“领土主权”与“海洋权益”必须区分\u003c/h4>\n\u003cp>这是理解第17条最重要的概念区分之一。\u003c/p>\n\u003cp>条文最后规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“维护国家领土主权和海洋权益。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>如果二者完全相同，就没有必要分别规定。\u003c/p>\n\u003cp>\u003cstrong>领土主权\u003c/strong>主要针对国家领土范围内的排他性国家权力，包括领陆、内水、领海以及相应领空等。\u003c/p>\n\u003cp>\u003cstrong>海洋权益\u003c/strong>的范围则可能超出国家领土本身。\u003c/p>\n\u003cp>例如，在专属经济区和大陆架，沿海国依法享有的主要并非对整个海域的“领土主权”，而是根据海域性质分别享有：\u003c/p>\n\u003cul>\n\u003cli>主权权利；\u003c/li>\n\u003cli>特定事项的管辖权；\u003c/li>\n\u003cli>其他国际法规定的权利。\u003c/li>\n\u003c/ul>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>海洋权益是一个比“领海主权”更广的概念，但不同海域中的具体权利性质并不相同。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这也是为什么不能笼统地把专属经济区、大陆架全部称为“我国领土”。\u003c/p>\n\u003chr>\n\u003ch4>第五，“一切必要的防卫和管控措施”需要同时把握“一切”与“必要”\u003c/h4>\n\u003cp>第17条使用：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“采取一切必要的防卫和管控措施。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>理解时不能只看到“一切”，还必须同时看到“必要”。\u003c/p>\n\u003cp>“一切”表明国土安全风险复杂，国家可以依法综合运用军事、行政、技术、外交以及其他必要手段。\u003c/p>\n\u003cp>“必要”则说明措施应当服务于维护领陆、内水、领海、领空安全以及领土主权、海洋权益这一法定目的。\u003c/p>\n\u003cp>因此，不能将该表述理解为：\u003c/p>\n\u003cblockquote>\n\u003cp>“只要为了国土安全，即可以不受其他法律限制采取任何措施。”\u003c/p>\n\u003c/blockquote>\n\u003cp>更准确的分析结构是：\u003c/p>\n\u003cp>\u003cstrong>是否存在相应国土安全风险\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>哪个机关依法负责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>具体法律授予什么权限\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>采取措施是否符合条件和程序\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>措施范围是否属于实现安全目的所需要的范围\u003c/strong>\u003c/p>\n\u003cp>这一点还应与第7条依法维护国家安全、第43条严格依法履职共同理解。\u003c/p>\n\u003chr>\n\u003ch4>第六，国土安全实行多机关依法分工和协同\u003c/h4>\n\u003cp>国土安全跨越陆地、海洋和空域，单一机关无法承担全部任务。\u003c/p>\n\u003cp>甲书已经指出，边防、海防和空防工作涉及国防、外交、公安、国家安全以及有关行政主管部门等不同主体，需要依法分工和协调。\u003c/p>\n\u003cp>2015年以后制定的专门法律进一步具体化这种分工。\u003c/p>\n\u003cp>例如，《陆地国界法》分别规定外交、公安、军事机关以及边境地方政府等主体的职责；《海警法》则明确海警机构统一履行海上维权执法职责。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第17条确定的是国家层面的国土安全任务，具体机关的职责和权限仍须到相应组织法和专门法律中寻找。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 国土空间与海洋权益具有不同的法律层次〔海洋法／体系解释〕\u003c/h4>\n\u003cp>结合《联合国海洋法公约》，可以进一步整理如下：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>空间或海域\u003c/th>\n\u003cth>沿海国的主要法律地位\u003c/th>\n\u003cth>研读提醒\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>内水\u003c/strong>\u003c/td>\n\u003ctd>原则上属于国家主权范围\u003c/td>\n\u003ctd>应与基线外的领海等海域区分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>领海\u003c/strong>\u003c/td>\n\u003ctd>沿海国主权延伸至领海及其上空、海床和底土\u003c/td>\n\u003ctd>主权的行使受《海洋法公约》及其他国际法规则约束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>毗连区\u003c/strong>\u003c/td>\n\u003ctd>就海关、财政、移民、卫生等特定事项行使必要管制\u003c/td>\n\u003ctd>并非国家领土，也不意味着领海边界向外延伸\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>专属经济区\u003c/strong>\u003c/td>\n\u003ctd>对自然资源等享有主权权利，并在人工岛、海洋科研、环境保护等事项上具有相应管辖权\u003c/td>\n\u003ctd>不等于对整个海域享有领土主权，其他国家依法享有航行、飞越等权利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>大陆架\u003c/strong>\u003c/td>\n\u003ctd>对海床和底土自然资源的勘探开发享有相应主权权利\u003c/td>\n\u003ctd>权利主要针对海床和底土，不当然改变上覆水域和上空的法律地位\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote>\n\u003cp>**“我国依法享有海洋权益的海域”不等于“我国领土”。**不同海域中的主权、主权权利、管辖权和其他权利，需要按照相应法律制度分别判断。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>2. “主权”“主权权利”和“管辖权”不能混用〔海洋法〕\u003c/h4>\n\u003cp>三个概念的规范强度和适用对象不同。\u003c/p>\n\u003cp>\u003cstrong>主权（sovereignty）\u003c/strong>\u003c/p>\n\u003cp>典型适用于领陆、内水、领海及其相应领空等国家领土范围。\u003c/p>\n\u003cp>\u003cstrong>主权权利（sovereign rights）\u003c/strong>\u003c/p>\n\u003cp>例如《联合国海洋法公约》第56条规定，沿海国在专属经济区内为勘探、开发、养护和管理自然资源等目的享有主权权利。\u003c/p>\n\u003cp>这种“主权权利”具有特定功能和事项范围，不能与对领土享有的完整主权等同。\u003c/p>\n\u003cp>\u003cstrong>管辖权（jurisdiction）\u003c/strong>\u003c/p>\n\u003cp>则可能针对特定事项，例如专属经济区中的人工岛设施、海洋科学研究和海洋环境保护等。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家在某海域享有某种管辖权，并不意味着该海域因此成为国家领土。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这一区分是准确理解第17条“领土主权和海洋权益”的基础。\u003c/p>\n\u003chr>\n\u003ch4>3. “必要”具有措施控制意义，但不能直接等同于完整的比例原则公式〔笔记分析〕\u003c/h4>\n\u003cp>第17条明确使用“必要”一词，因此具体措施与维护国土安全目的之间需要具有相应联系。\u003c/p>\n\u003cp>可以合理追问：\u003c/p>\n\u003cul>\n\u003cli>风险是否真实存在；\u003c/li>\n\u003cli>为什么需要采取该措施；\u003c/li>\n\u003cli>措施是否有助于防范或者控制风险；\u003c/li>\n\u003cli>措施范围是否超过实际安全需要。\u003c/li>\n\u003c/ul>\n\u003cp>但需要保持解释限度。\u003c/p>\n\u003cp>第17条并没有像第66条危机管控规定那样，进一步明确写出：\u003c/p>\n\u003cblockquote>\n\u003cp>措施与危害的性质、程度和范围相适应，以及在多种措施中选择最大程度保护权益的措施。\u003c/p>\n\u003c/blockquote>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第17条的“必要”可以支持对措施适当性和范围进行法律论证，但不宜直接宣称第17条自身已经完整规定了一套比例原则审查公式。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>完整判断还需要结合第7条、第43条以及具体专门法律。\u003c/p>\n\u003chr>\n\u003ch4>4. 国土安全任务条款与具体职权授权必须区分〔笔记分析〕\u003c/h4>\n\u003cp>第17条的规范主语是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“国家”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>其核心内容是规定国家在国土安全领域承担什么任务。\u003c/p>\n\u003cp>它没有逐项规定：\u003c/p>\n\u003cul>\n\u003cli>哪个机关可以登临检查船舶；\u003c/li>\n\u003cli>谁可以划定边境禁区；\u003c/li>\n\u003cli>谁可以检查人员证件；\u003c/li>\n\u003cli>谁可以拦截航空器；\u003c/li>\n\u003cli>什么情况下可以使用武器；\u003c/li>\n\u003cli>可以采取何种行政强制措施。\u003c/li>\n\u003c/ul>\n\u003cp>这些问题分别需要《陆地国界法》《海警法》《出境入境管理法》《民用航空法》《国防法》等专门法律回答。\u003c/p>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第8条与第17条形成“一般原则—具体任务”的关系\u003c/h4>\n\u003cp>第8条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>统筹国土安全和国民安全。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第17条则进一步规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国土安全具体需要完成哪些任务。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第8条：国土安全在总体国家安全中的关系定位\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第17条：国土安全领域的具体国家任务\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（二）第17条与第18条必须区分\u003c/h4>\n\u003cp>两条存在联系，但不能混为一条军事安全规范。\u003c/p>\n\u003cp>\u003cstrong>第17条：国土安全\u003c/strong>\u003c/p>\n\u003cp>主要围绕：\u003c/p>\n\u003cul>\n\u003cli>边防；\u003c/li>\n\u003cli>海防；\u003c/li>\n\u003cli>空防；\u003c/li>\n\u003cli>防卫与管控；\u003c/li>\n\u003cli>领陆、内水、领海和领空；\u003c/li>\n\u003cli>领土主权和海洋权益。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>第18条：军事安全\u003c/strong>\u003c/p>\n\u003cp>主要围绕：\u003c/p>\n\u003cul>\n\u003cli>武装力量建设；\u003c/li>\n\u003cli>积极防御军事战略；\u003c/li>\n\u003cli>防备和抵御侵略；\u003c/li>\n\u003cli>制止武装颠覆和分裂；\u003c/li>\n\u003cli>国际军事安全合作等。\u003c/li>\n\u003c/ul>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>边海空防具有军事防卫面向，但国土安全还包含大量日常行政管理和执法活动，不能全部归入军事安全。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（三）2015年以后形成了更加具体的国土安全法律体系\u003c/h4>\n\u003cp>可以将第17条与后续专门法律进行对应：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>领域\u003c/th>\n\u003cth>主要后续法律\u003c/th>\n\u003cth>与第17条的关系\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>总体边海空防\u003c/strong>\u003c/td>\n\u003ctd>《国防法》\u003c/td>\n\u003ctd>规定边防、海防、空防以及其他重大安全领域防卫\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>陆地边境\u003c/strong>\u003c/td>\n\u003ctd>《陆地国界法》\u003c/td>\n\u003ctd>具体规定国界划定、边境防卫、管理、建设和国际合作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>海上维权执法\u003c/strong>\u003c/td>\n\u003ctd>《海警法》\u003c/td>\n\u003ctd>具体规定海警机构职责、行政执法、犯罪侦查及有关措施\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>海洋权利\u003c/strong>\u003c/td>\n\u003ctd>《领海及毗连区法》《专属经济区和大陆架法》\u003c/td>\n\u003ctd>确定不同海域中的主权、管制权、主权权利和管辖权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>空域与民航\u003c/strong>\u003c/td>\n\u003ctd>《民用航空法》等\u003c/td>\n\u003ctd>规定领空主权以及民用航空活动管理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>因此，第17条最适合被理解为：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国土安全领域的上位任务规范，专门法律负责将其转化为具体制度和职权。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（四）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：我国享有海洋权益的全部海域都属于我国领土。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 领海属于国家主权覆盖的范围；专属经济区、大陆架等海域中的权利主要表现为特定主权权利、管辖权和其他国际法权利，不能一律表述为领土主权。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：专属经济区等同于领海。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 二者法律性质不同。沿海国对领海享有主权，而在专属经济区主要享有资源方面的主权权利和特定事项管辖权，其他国家仍依法享有航行、飞越等权利。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：毗连区是领海向外延伸的另一段国家领土。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 毗连区不属于领海。沿海国主要在海关、财政、移民、卫生等特定事项上依法行使必要管制权。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：大陆架权利意味着国家对大陆架上方全部水域享有主权。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 大陆架制度主要涉及海床和底土及其自然资源。大陆架权利不当然改变上覆水域及其上空的法律地位。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：“采取一切必要措施”意味着国家机关可以采取任何认为有利于国土安全的措施。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第17条规定国家任务。具体机关能采取何种措施，仍须有专门法律授予职权，并符合相应实体条件和程序。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：边防、海防、空防完全属于军事事务。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 国土安全既包含军事防卫，也包含边境管理、海上行政执法、出入境、航空和其他日常管理。不同事项由不同机关依法承担。\u003c/p>\n\u003chr>\n\u003ch2>六、研究问题\u003c/h2>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>如何在国土安全分析中准确区分“空间”与“权利”？\u003c/strong>\u003cbr>对领海、毗连区、专属经济区和大陆架，应如何分别识别其空间性质、国家享有的权利类型以及相应执法权限？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“一切必要的防卫和管控措施”应受到何种法律控制？\u003c/strong>\u003cbr>第17条中的“必要”能否发展为更加具体的措施控制标准，其与第7条、第43条以及专门法律中的权限、程序规范如何衔接？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>防卫权与行政管控权如何区分？\u003c/strong>\u003cbr>当同一国土安全事件同时涉及军事、安全和行政管理问题时，如何确定不同机关的权限边界和协同机制？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国土安全任务条款如何转化为具体职权？\u003c/strong>\u003cbr>从第17条的一般国家任务到《陆地国界法》《海警法》等专门法律中的具体执法权，中间应当满足何种授权明确性要求？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>海洋权益的法律结构如何体系化？\u003c/strong>\u003cbr>能否按照“主权—主权权利—管辖权—其他权利”的层次建立统一分析框架，避免将不同海域中的国家权利混为一谈？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>技术化边海空管控对法律制度提出哪些新要求？\u003c/strong>\u003cbr>卫星遥感、无人机、自动识别系统和智能监控广泛应用后，如何处理监测能力提升与权限、数据使用、个人权益及责任机制之间的关系？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国土安全与正常跨境活动如何协调？\u003c/strong>\u003cbr>边境贸易、人员往来、航运、航空以及海洋科研同时具有发展价值和安全风险，应如何结合第8条“发展与安全相协调”确定适当的管控强度？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何评价国土安全能力建设的实际效果？\u003c/strong>\u003cbr>除设施、装备和人员数量之外，是否还应考察风险发现能力、响应速度、跨部门协同、依法履职以及对正常经济社会活动的影响？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":18,"label":"第十八条","title":"军事安全任务","lawText":"国家加强武装力量革命化、现代化、正规化建设，建设与保卫国家安全和发展利益需要相适应的武装力量；实施积极防御军事战略方针，防备和抵御侵略，制止武装颠覆和分裂；开展国际军事安全合作，实施联合国维和、国际救援、海上护航和维护国家海外利益的军事行动，维护国家主权、安全、领土完整、发展利益和世界和平。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>能力建设：\u003c/strong> 国家加强武装力量革命化、现代化、正规化建设，并要求军事能力与维护国家安全和发展利益的现实需要相适应。\u003c/li>\n\u003cli>\u003cstrong>战略方针：\u003c/strong> 本条明确实施积极防御军事战略方针，其法定任务表现为防备和抵御侵略、制止武装颠覆和分裂。\u003c/li>\n\u003cli>\u003cstrong>国际合作：\u003c/strong> 国际军事安全合作属于军事安全任务的一部分，并非与国内军事安全相互割裂。\u003c/li>\n\u003cli>\u003cstrong>四类行动：\u003c/strong> 条文明文列举联合国维和、国际救援、海上护航以及维护国家海外利益的军事行动；不同任务具有不同目的和法律条件，不能视为同一种军事行动。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 第18条属于国家军事安全任务条款，并不单独解决每次军事行动的决策权限、具体实施程序和国际法合法性；这些问题仍须结合宪法、国防法、第38条以及适用国际法分别判断。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家加强武装力量革命化、现代化、正规化建设，建设与保卫国家安全和发展利益需要相适应的武装力量；实施积极防御军事战略方针，防备和抵御侵略，制止武装颠覆和分裂；开展国际军事安全合作，实施联合国维和、国际救援、海上护航和维护国家海外利益的军事行动，维护国家主权、安全、领土完整、发展利益和世界和平。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>能力建设：\u003c/strong> 国家加强武装力量革命化、现代化、正规化建设，并要求军事能力与维护国家安全和发展利益的现实需要相适应。\u003c/li>\n\u003cli>\u003cstrong>战略方针：\u003c/strong> 本条明确实施积极防御军事战略方针，其法定任务表现为防备和抵御侵略、制止武装颠覆和分裂。\u003c/li>\n\u003cli>\u003cstrong>国际合作：\u003c/strong> 国际军事安全合作属于军事安全任务的一部分，并非与国内军事安全相互割裂。\u003c/li>\n\u003cli>\u003cstrong>四类行动：\u003c/strong> 条文明文列举联合国维和、国际救援、海上护航以及维护国家海外利益的军事行动；不同任务具有不同目的和法律条件，不能视为同一种军事行动。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 第18条属于国家军事安全任务条款，并不单独解决每次军事行动的决策权限、具体实施程序和国际法合法性；这些问题仍须结合宪法、国防法、第38条以及适用国际法分别判断。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家加强武装力量革命化、现代化、正规化建设，建设与保卫国家安全和发展利益需要相适应的武装力量；实施积极防御军事战略方针，防备和抵御侵略，制止武装颠覆和分裂；开展国际军事安全合作，实施联合国维和、国际救援、海上护航和维护国家海外利益的军事行动，维护国家主权、安全、领土完整、发展利益和世界和平。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">军事安全任务 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定维护\u003cstrong>军事安全\u003c/strong>的基本国家任务，是第3条“以军事、文化、社会安全为保障”在第二章中的具体展开。\u003c/p>\n\u003cp>从句法结构看，本条以两个分号划分为三个层次：\u003c/p>\n\u003cp>\u003cstrong>武装力量建设 → 积极防御军事战略 → 国际军事安全合作与军事行动\u003c/strong>\u003c/p>\n\u003cp>三个层次又共同指保护目标：\u003c/p>\n\u003cp>\u003cstrong>国家主权、安全、领土完整、发展利益 + 世界和平\u003c/strong>\u003c/p>\n\u003cp>因此，本条既规定国内军事能力建设和防卫任务，也规定国际军事安全合作以及特定海外军事行动。\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 武装力量建设具有明确的宪法和国防法制度基础\u003c/h4>\n\u003cp>甲书第81—83页首先将本条与宪法和当时的国防法律制度相联系。\u003c/p>\n\u003cp>《宪法》第29条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>国家加强武装力量的革命化、现代化、正规化的建设，增强国防力量。\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，第18条关于“革命化、现代化、正规化建设”的表述具有明确的宪法制度基础。\u003c/p>\n\u003cp>2015年制定《国家安全法》时，相关内容也已经存在于当时的《国防法》中。《国家安全法》第18条将其进一步纳入总体国家安全观下的军事安全任务体系，并增加了“国家安全和发展利益”“国际军事安全合作”“海外利益”等内容。\u003c/p>\n\u003cp>可以概括为：\u003c/p>\n\u003cp>\u003cstrong>宪法国防规范\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>国防法律制度\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>总体国家安全框架中的军事安全任务\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>2. 本条将军事安全与“发展利益”明确联系起来\u003c/h4>\n\u003cp>本条并未只规定：\u003c/p>\n\u003cblockquote>\n\u003cp>建设与“保卫国家安全”需要相适应的武装力量，\u003c/p>\n\u003c/blockquote>\n\u003cp>而是规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“建设与保卫国家安全和发展利益需要相适应的武装力量。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>甲书第83—84页特别强调，军事安全环境和军事任务随着国家利益范围、国际联系以及安全风险的发展而变化，武装力量建设需要与实际安全任务相匹配。\u003c/p>\n\u003cp>因此，第18条所确立的不是抽象追求军事能力增加，而是强调：\u003c/p>\n\u003cp>\u003cstrong>安全与发展利益的实际需要\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>确定军事安全任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>形成与任务相适应的武装力量\u003c/strong>\u003c/p>\n\u003cp>这一表述也与第2条将经济社会可持续发展和国家重大利益纳入国家安全概念相互衔接。\u003c/p>\n\u003chr>\n\u003ch4>3. 最终审议阶段对海外军事行动进行了重要具体化\u003c/h4>\n\u003cp>第18条的立法过程中存在一项明确的最终审议修改。\u003c/p>\n\u003cp>甲书附录五第388页（PDF第401页）所载2015年6月30日关于国家安全法草案修改意见的报告记载，草案三次审议稿原规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“实施维护国家安全的海外军事行动。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>在审议过程中，有常委会组成人员提出，随着国际安全合作深化和国家利益拓展，我国已经开展包括联合国维和、国际灾难救援、海上护航等海外军事行动，建议将这些行动具体列举出来。\u003c/p>\n\u003cp>经研究并与有关部门沟通，最终建议修改为：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“实施联合国维和、国际救援、海上护航和维护国家海外利益的军事行动。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，最终文本将原来较为概括的：\u003c/p>\n\u003cp>\u003cstrong>“维护国家安全的海外军事行动”\u003c/strong>\u003c/p>\n\u003cp>具体化为：\u003c/p>\n\u003cp>\u003cstrong>联合国维和 + 国际救援 + 海上护航 + 维护国家海外利益的军事行动\u003c/strong>\u003c/p>\n\u003cp>这一修改提高了条文对军事安全海外任务类型的可识别性。\u003c/p>\n\u003chr>\n\u003ch4>4. 对海外军事行动的具体列举不等于建立无条件行动授权\u003c/h4>\n\u003cp>立法材料能够证明，最终审议阶段有意将海外军事行动类型写得更加具体。\u003c/p>\n\u003cp>但这一修改不能进一步解释为：\u003c/p>\n\u003cblockquote>\n\u003cp>只要涉及上述事项，第18条就已经自动赋予国家机关在任何地点、任何情况下实施军事行动的完整权限。\u003c/p>\n\u003c/blockquote>\n\u003cp>第18条首先是一项\u003cstrong>国家军事安全任务规范\u003c/strong>。\u003c/p>\n\u003cp>具体行动仍需继续判断：\u003c/p>\n\u003cul>\n\u003cli>国内由何机关决定和指挥；\u003c/li>\n\u003cli>是否符合宪法、国防法等国内法要求；\u003c/li>\n\u003cli>行动发生在何种空间；\u003c/li>\n\u003cli>是否涉及其他国家领土或者管辖区域；\u003c/li>\n\u003cli>国际法上具有何种依据；\u003c/li>\n\u003cli>任务范围和行动规则是什么。\u003c/li>\n\u003c/ul>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>行动类型的法律确认与具体行动合法性的判断属于两个不同层次。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>5. 2020年修订《国防法》进一步具体化军事安全和海外利益保护\u003c/h4>\n\u003cp>〔后续制度发展〕\u003c/p>\n\u003cp>甲书出版于2016年，其主要依据是当时的《国防法》。\u003c/p>\n\u003cp>2020年修订、2021年1月1日起施行的现行《国防法》已经进一步发展相关制度。\u003c/p>\n\u003cp>现行《国防法》明确：\u003c/p>\n\u003cul>\n\u003cli>国防活动包括为防备和抵抗侵略、制止武装颠覆和分裂、保卫国家主权、统一、领土完整、安全和发展利益进行的军事活动；\u003c/li>\n\u003cli>中国奉行防御性国防政策，实行积极防御；\u003c/li>\n\u003cli>武装力量的使命任务包括维护国家海外利益、促进世界和平与发展；\u003c/li>\n\u003cli>国家可以依照有关法律运用武装力量保护海外中国公民、组织、机构和设施安全，并参加联合国维和、国际救援、海上护航、联演联训、反恐怖主义等活动。\u003c/li>\n\u003c/ul>\n\u003cp>因此，可以形成：\u003c/p>\n\u003cp>\u003cstrong>2015年第18条：军事安全领域的一般国家任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>2020年修订《国防法》：进一步具体化武装力量任务和对外军事关系制度\u003c/strong>\u003c/p>\n\u003cp>这一后续立法可以用于理解第18条在现行制度中的展开，但不能反过来作为2015年原始立法文本形成过程的直接证据。\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，革命化、现代化、正规化共同构成武装力量建设任务\u003c/h4>\n\u003cp>本条首先规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“国家加强武装力量革命化、现代化、正规化建设。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>甲书第82—83页对三者分别进行了较详细解释。\u003c/p>\n\u003ch5>1. 革命化建设\u003c/h5>\n\u003cp>甲书主要从武装力量的政治属性、领导制度和使命任务角度解释革命化建设。\u003c/p>\n\u003cp>因此，其核心并非武器装备问题，而主要涉及：\u003c/p>\n\u003cul>\n\u003cli>武装力量的政治方向；\u003c/li>\n\u003cli>领导和组织建设；\u003c/li>\n\u003cli>军队使命和价值要求等。\u003c/li>\n\u003c/ul>\n\u003ch5>2. 现代化建设\u003c/h5>\n\u003cp>甲书将现代化重点联系于现代军事技术、信息化建设、武器装备、后勤保障、军事人才和现代条件下作战能力。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>现代化不能简单等同于增加装备数量。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>其重点是军事能力、技术体系、组织体系和作战方式与现代战争形态相适应。\u003c/p>\n\u003ch5>3. 正规化建设\u003c/h5>\n\u003cp>甲书特别将正规化与依法治军、组织制度、纪律机制以及规范化运行联系起来。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>正规化强调的是军队组织和运行的制度化、规范化和法治化。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>三者可以概括为：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>建设维度\u003c/th>\n\u003cth>主要关注点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>革命化\u003c/strong>\u003c/td>\n\u003ctd>政治属性、领导和使命\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>现代化\u003c/strong>\u003c/td>\n\u003ctd>技术装备、人才、组织和军事能力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>正规化\u003c/strong>\u003c/td>\n\u003ctd>制度、纪律、组织运行和依法治军\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>三个方面具有不同功能，不能将本条的军事能力建设缩减为单纯的武器装备现代化。\u003c/p>\n\u003chr>\n\u003ch4>第二，武装力量建设应当与国家安全和发展利益需要相适应\u003c/h4>\n\u003cp>本条并非简单规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“建设强大的武装力量”，\u003c/p>\n\u003c/blockquote>\n\u003cp>而是规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“建设与保卫国家安全和发展利益需要相适应的武装力量。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这一表述具有明显的任务导向。\u003c/p>\n\u003cp>其基本逻辑是：\u003c/p>\n\u003cp>\u003cstrong>安全环境和国家利益变化\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>军事安全任务发生变化\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>武装力量规模、结构和能力相应调整\u003c/strong>\u003c/p>\n\u003cp>因此，“相适应”强调的是\u003cstrong>任务—能力匹配\u003c/strong>。\u003c/p>\n\u003cp>从法律解释角度看，这一要求至少包含两个方向：\u003c/p>\n\u003cp>一方面，军事能力不能明显不足，以至于无法承担法律规定的军事安全任务；\u003c/p>\n\u003cp>另一方面，也不能仅根据“军事安全”这一抽象目的脱离现实安全和发展需要无限推导能力建设要求。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“相适应”比单纯强调能力增长更具有关系性和任务导向。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三，积极防御是本条明确规定的军事战略方针\u003c/h4>\n\u003cp>第二层规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“实施积极防御军事战略方针。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>甲书第84—85页将积极防御解释为我国长期实行的军事战略方针，并特别强调：\u003c/p>\n\u003cp>\u003cstrong>战略上的防御\u003c/strong>\u003cbr>与\u003cbr>\u003cstrong>战役、战斗层面的主动行动\u003c/strong>\u003c/p>\n\u003cp>可以同时存在。\u003c/p>\n\u003cp>因此，“积极防御”中的“积极”不能被理解为消极等待风险实际发生之后才采取任何军事准备或行动。\u003c/p>\n\u003cp>其重点在于：\u003c/p>\n\u003cul>\n\u003cli>做好军事斗争准备；\u003c/li>\n\u003cli>防备可能发生的侵略；\u003c/li>\n\u003cli>形成威慑和应对能力；\u003c/li>\n\u003cli>在战略防御原则下，根据具体军事需要采取主动行动。\u003c/li>\n\u003c/ul>\n\u003cp>但这种“主动性”必须与其战略属性区分。\u003c/p>\n\u003chr>\n\u003ch4>第四，“积极防御”不能概括为“先发制人”\u003c/h4>\n\u003cp>这是两书对读中需要特别校正的一点。\u003c/p>\n\u003cp>乙书第48页（PDF第57页）在解释积极防御时写道：\u003c/p>\n\u003cblockquote>\n\u003cp>积极防御在必要时需要采取主动措施，并进一步使用了具有“快速反应和先发制人的能力”的表述。\u003c/p>\n\u003c/blockquote>\n\u003cp>其中强调快速反应、战略主动具有一定解释意义，但以“\u003cstrong>先发制人\u003c/strong>”概括积极防御并不准确。\u003c/p>\n\u003cp>甲书第84页对此采用的是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>战略上防御与战役、战斗上进攻相统一，坚持防御、自卫、后发制人。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>2015年《中国的军事战略》白皮书同样明确表述：\u003c/p>\n\u003cul>\n\u003cli>战略上防御与战役战斗上进攻相统一；\u003c/li>\n\u003cli>坚持防御、自卫；\u003c/li>\n\u003cli>坚持后发制人的原则。\u003c/li>\n\u003c/ul>\n\u003cp>2019年《新时代的中国国防》仍延续这一正式表述。\u003c/p>\n\u003cp>因此，笔记中应当明确区分：\u003c/p>\n\u003cp>\u003cstrong>战略主动 ≠ 先发制人\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>战役战斗层面的主动进攻 ≠ 战略上的先发制人\u003c/strong>\u003c/p>\n\u003cp>更准确的理解是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>积极防御强调在防御性战略定位下争取战略主动、做好准备并具有有效反击能力，而正式政策文本仍以“防御、自卫、后发制人”表述其基本原则。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，乙书“先发制人的能力”这一说法不宜直接作为第18条中“积极防御”的定义使用。\u003c/p>\n\u003chr>\n\u003ch4>第五，“防备和抵御侵略”分别体现预防与应对两个阶段\u003c/h4>\n\u003cp>第18条紧接积极防御规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“防备和抵御侵略。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这里使用两个不同动词。\u003c/p>\n\u003cp>\u003cstrong>防备\u003c/strong>主要体现：\u003c/p>\n\u003cul>\n\u003cli>战备建设；\u003c/li>\n\u003cli>风险监测；\u003c/li>\n\u003cli>军事准备；\u003c/li>\n\u003cli>威慑和危机应对能力。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>抵御\u003c/strong>则更多对应侵略实际发生后，通过军事手段进行防卫和反击。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>防备：侵略发生前的能力和准备\u003c/strong>\u003cbr>\u003cstrong>抵御：侵略发生时的实际防卫\u003c/strong>\u003c/p>\n\u003cp>这与第9条“预防为主”的总体国家安全治理逻辑相互呼应，但军事领域具有其自身制度和行动规则。\u003c/p>\n\u003chr>\n\u003ch4>第六，“制止武装颠覆和分裂”体现军事安全与政治、国土安全的交叉\u003c/h4>\n\u003cp>本条还规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“制止武装颠覆和分裂。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这说明军事安全并非只处理外国军事侵略。\u003c/p>\n\u003cp>当颠覆、分裂活动具有武装性质并达到需要军事力量应对的程度时，也可能进入军事安全任务范围。\u003c/p>\n\u003cp>因此，第18条与：\u003c/p>\n\u003cul>\n\u003cli>第15条政治安全；\u003c/li>\n\u003cli>第17条国土安全；\u003c/li>\n\u003c/ul>\n\u003cp>存在明显交叉。\u003c/p>\n\u003cp>可以理解为：\u003c/p>\n\u003cp>\u003cstrong>第15条：从政治安全角度处理颠覆、分裂问题\u003c/strong>\u003cbr>\u003cstrong>第17条：从国土安全角度维护领土主权和完整\u003c/strong>\u003cbr>\u003cstrong>第18条：从军事安全角度应对侵略以及武装颠覆、分裂\u003c/strong>\u003c/p>\n\u003cp>同一风险可能同时涉及多个安全领域，但具体行动权限仍须依据相应法律制度判断。\u003c/p>\n\u003chr>\n\u003ch4>第七，国际军事安全合作属于军事安全任务本身\u003c/h4>\n\u003cp>第三层首先规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“开展国际军事安全合作。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这与第10条国际安全合作原则相互衔接。\u003c/p>\n\u003cp>第10条从整个国家安全体系规定：\u003c/p>\n\u003cblockquote>\n\u003cp>互信、互利、平等、协作以及国际安全交流合作。\u003c/p>\n\u003c/blockquote>\n\u003cp>第18条则在军事安全领域将其具体化为：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国际军事安全合作。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第10条：一般国际安全合作原则\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第18条：军事安全领域的具体合作任务\u003c/strong>\u003c/p>\n\u003cp>军事安全由此不仅包含国内国防和军事能力建设，也包含通过国际合作维护相关安全利益和世界和平。\u003c/p>\n\u003chr>\n\u003ch4>第八，四类国际军事行动需要分别理解\u003c/h4>\n\u003cp>第18条最终明确列举：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>联合国维和；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>国际救援；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>海上护航；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>维护国家海外利益的军事行动。\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cp>四者虽然共同出现在同一条文中，但法律目的和行动机制并不完全相同。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>行动类型\u003c/th>\n\u003cth>基本功能\u003c/th>\n\u003cth>研读重点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>联合国维和\u003c/strong>\u003c/td>\n\u003ctd>根据联合国有关授权参与维护和平与安全\u003c/td>\n\u003ctd>任务授权、维和原则、行动规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>国际救援\u003c/strong>\u003c/td>\n\u003ctd>应对灾难、人道危机等紧急情况\u003c/td>\n\u003ctd>受援国同意、救援性质、人员和行动权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>海上护航\u003c/strong>\u003c/td>\n\u003ctd>保障有关海上通道、船舶及人员安全\u003c/td>\n\u003ctd>行动海域、国际海洋法、具体任务授权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>海外利益军事行动\u003c/strong>\u003c/td>\n\u003ctd>在特定情况下保护国家海外利益\u003c/td>\n\u003ctd>国内决策权限、国际法依据、必要性和行动范围\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第18条列举的是不同军事安全任务类型，而不是建立一种统一的“海外军事行动模式”。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第九，本条保护目标同时包括国家利益与世界和平\u003c/h4>\n\u003cp>本条最后规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“维护国家主权、安全、领土完整、发展利益和世界和平。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>其中前四项主要指向国家自身安全和发展利益：\u003c/p>\n\u003cul>\n\u003cli>主权；\u003c/li>\n\u003cli>安全；\u003c/li>\n\u003cli>领土完整；\u003c/li>\n\u003cli>发展利益。\u003c/li>\n\u003c/ul>\n\u003cp>“世界和平”则进一步体现国际安全目标。\u003c/p>\n\u003cp>这一结构与第8条“统筹自身安全和共同安全”以及第10条“促进共同安全，维护世界和平”相互呼应。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第18条将军事安全同时置于自身安全和国际安全两个维度中理解。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 第18条属于国家军事安全任务条款，不是具体军事行动的一般授权条款\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>第18条的主语仍然是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“国家”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，它首先回答：\u003c/p>\n\u003cblockquote>\n\u003cp>国家在军事安全领域应当承担哪些任务？\u003c/p>\n\u003c/blockquote>\n\u003cp>而不能单独回答：\u003c/p>\n\u003cblockquote>\n\u003cp>哪个机关可以在什么时间、地点、条件下采取何种具体军事行动？\u003c/p>\n\u003c/blockquote>\n\u003cp>具体权限需要继续进入第三章。\u003c/p>\n\u003cp>第38条规定中央军事委员会：\u003c/p>\n\u003cul>\n\u003cli>领导全国武装力量；\u003c/li>\n\u003cli>决定军事战略和武装力量的作战方针；\u003c/li>\n\u003cli>统一指挥维护国家安全的军事行动；\u003c/li>\n\u003cli>制定涉及国家安全的军事法规；\u003c/li>\n\u003cli>发布有关决定和命令。\u003c/li>\n\u003c/ul>\n\u003cp>涉及战争状态、动员等事项时，还存在第35、36条所规定的全国人大、全国人大常委会和国家主席相应职权。\u003c/p>\n\u003cp>因此，可以形成：\u003c/p>\n\u003cp>\u003cstrong>第18条：规定军事安全任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第35—38条：配置有关国家机构职权\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>国防法及其他军事法律：具体化组织、行动和程序\u003c/strong>\u003c/p>\n\u003cp>这再次说明：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家任务不能直接替代机关职权。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>2. 国内法确认军事任务与国际法确认行动合法性属于不同问题\u003c/h4>\n\u003cp>〔国际法／笔记分析〕\u003c/p>\n\u003cp>第18条属于中国国内法，可以规定国家武装力量承担哪些安全任务。\u003c/p>\n\u003cp>但如果某项军事行动发生在国际空间、其他国家领土或者可能影响其他国家权利，则还必须独立判断国际法依据。\u003c/p>\n\u003cp>因此应区分：\u003c/p>\n\u003cp>\u003cstrong>国内法问题：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>中国国内法是否规定国家承担这一军事任务？\u003cbr>哪个机关有权决定、组织和指挥？\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>国际法问题：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>该具体军事行动在国际法上是否具有合法依据？\u003c/p>\n\u003c/blockquote>\n\u003cp>两者不能互相替代。\u003c/p>\n\u003cp>即使第18条明确规定“维护国家海外利益的军事行动”，也不能仅凭这一国内法条款排除《联合国宪章》以及其他适用国际法的要求。\u003c/p>\n\u003chr>\n\u003ch4>3. 《联合国宪章》构成海外使用武力问题的重要国际法框架\u003c/h4>\n\u003cp>〔国际法〕\u003c/p>\n\u003cp>《联合国宪章》第2条第4款确立禁止在国际关系中违反宪章宗旨以武力相威胁或者使用武力的原则。\u003c/p>\n\u003cp>与此同时，宪章还规定：\u003c/p>\n\u003cul>\n\u003cli>安理会依据第七章维护或者恢复国际和平与安全的职权；\u003c/li>\n\u003cli>第51条确认在发生武力攻击时的单独或集体自卫权。\u003c/li>\n\u003c/ul>\n\u003cp>因此，如果某项“维护海外利益的军事行动”涉及跨境使用武力，不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>第18条是否列举了这一任务？\u003c/p>\n\u003c/blockquote>\n\u003cp>还需要进一步问：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>具体行动在《联合国宪章》和其他适用国际法下具有何种法律依据？\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>不同情形可能涉及东道国同意、联合国安理会授权、自卫等不同法律问题，应根据具体事实分别分析。\u003c/p>\n\u003chr>\n\u003ch4>4. 联合国维和与和平强制不能混同\u003c/h4>\n\u003cp>〔国际法〕\u003c/p>\n\u003cp>第18条首先列举“联合国维和”。\u003c/p>\n\u003cp>联合国现行维和原则通常概括为：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>冲突主要当事方同意；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>公正性；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>除自卫和保卫任务授权外不使用武力。\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cp>因此，联合国维和一般不同于通过强制性军事行动恢复国际和平的“和平强制”。\u003c/p>\n\u003cp>某些具有强有力授权的维和行动可能在安理会授权范围内使用武力，但这并不意味着维和任务因此与战争或者一般军事强制行动具有相同的法律性质。\u003c/p>\n\u003cp>所以：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“参加联合国维和”不能简单理解为“参加战争”。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>分析具体维和任务时，应继续查看：\u003c/p>\n\u003cul>\n\u003cli>安理会任务授权；\u003c/li>\n\u003cli>维和行动规则；\u003c/li>\n\u003cli>东道国及有关方面的法律关系；\u003c/li>\n\u003cli>具体部队承担的任务。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>5. 国际救援与军事使用武力属于不同问题\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>军队参与国际救援并不意味着军事行动必然具有作战性质。\u003c/p>\n\u003cp>例如，国际灾害救援可能主要包括：\u003c/p>\n\u003cul>\n\u003cli>搜索和救援；\u003c/li>\n\u003cli>医疗救治；\u003c/li>\n\u003cli>物资运输；\u003c/li>\n\u003cli>工程抢修；\u003c/li>\n\u003cli>人道主义援助。\u003c/li>\n\u003c/ul>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“由武装力量实施”与“属于武力使用”不能简单画等号。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>具体国际救援需要根据任务性质、受援国同意、有关国际安排以及人员法律地位分别判断。\u003c/p>\n\u003chr>\n\u003ch4>6. 海上护航的法律依据取决于行动空间和具体任务\u003c/h4>\n\u003cp>〔海洋法／笔记分析〕\u003c/p>\n\u003cp>海上护航涉及军事力量，但其法律评价不能脱离行动海域。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cul>\n\u003cli>在公海或者其他国际法允许航行的海域；\u003c/li>\n\u003cli>在其他国家领海；\u003c/li>\n\u003cli>根据联合国安理会有关授权执行特定反海盗任务；\u003c/li>\n\u003c/ul>\n\u003cp>可能分别涉及不同法律依据。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“海上护航”这一任务名称本身不能回答所有行动权限问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>分析时仍应采用第17条已经形成的方法：\u003c/p>\n\u003cp>\u003cstrong>先判断空间法律性质 → 再判断国际法权利 → 再判断国内机关权限和具体任务授权。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>7. “维护海外利益的军事行动”与一般海外利益保护应当区分\u003c/h4>\n\u003cp>第33条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>国家依法采取必要措施，保护海外中国公民、组织和机构的安全和正当权益，保护国家的海外利益不受威胁和侵害。\u003c/p>\n\u003c/blockquote>\n\u003cp>第18条则进一步规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>维护国家海外利益的军事行动。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，二者不能理解为：\u003c/p>\n\u003cblockquote>\n\u003cp>所有海外利益保护都属于军事行动。\u003c/p>\n\u003c/blockquote>\n\u003cp>海外利益保护可以包括：\u003c/p>\n\u003cul>\n\u003cli>外交交涉；\u003c/li>\n\u003cli>领事保护；\u003c/li>\n\u003cli>风险预警；\u003c/li>\n\u003cli>国际执法合作；\u003c/li>\n\u003cli>撤离协助；\u003c/li>\n\u003cli>民事救援；\u003c/li>\n\u003cli>在特定条件下的军事行动等。\u003c/li>\n\u003c/ul>\n\u003cp>军事手段只是整个海外利益保护工具体系中的一种特定方式。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第33条：海外利益保护的一般国家任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第18条：其中军事安全领域的特定行动类型\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）第3条、第17条与第18条的关系\u003c/h4>\n\u003cp>第3条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>以军事安全为保障。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第17条规定国土安全：\u003c/p>\n\u003cblockquote>\n\u003cp>边防、海防、空防以及领土主权和海洋权益。\u003c/p>\n\u003c/blockquote>\n\u003cp>第18条规定军事安全：\u003c/p>\n\u003cblockquote>\n\u003cp>武装力量建设、积极防御和国际军事行动。\u003c/p>\n\u003c/blockquote>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>国土安全回答“保护什么空间和权益”\u003c/strong>\u003cbr>\u003cstrong>军事安全回答“如何建设和运用军事力量维护安全”\u003c/strong>\u003c/p>\n\u003cp>二者紧密联系，但不能混为一个概念。\u003c/p>\n\u003chr>\n\u003ch4>（二）第10条与第18条形成一般合作原则和军事领域合作任务的关系\u003c/h4>\n\u003cp>\u003cstrong>第10条：\u003c/strong>\u003c/p>\n\u003cp>互信、互利、平等、协作，开展国际安全交流合作。\u003c/p>\n\u003cp>\u003cstrong>第18条：\u003c/strong>\u003c/p>\n\u003cp>开展国际军事安全合作，并列举有关军事行动。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第10条：一般国际安全合作原则\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第18条：军事领域具体化\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（三）第18条与第33条共同构成海外利益保护体系\u003c/h4>\n\u003cp>可以形成：\u003c/p>\n\u003cp>\u003cstrong>第33条：\u003c/strong>\u003c/p>\n\u003cp>保护海外中国公民、组织、机构的安全和正当权益，保护国家海外利益。\u003c/p>\n\u003cp>↓  \u003c/p>\n\u003cp>\u003cstrong>第18条：\u003c/strong>\u003c/p>\n\u003cp>规定维护国家海外利益的军事行动。\u003c/p>\n\u003cp>↓  \u003c/p>\n\u003cp>\u003cstrong>现行《国防法》：\u003c/strong>\u003c/p>\n\u003cp>进一步规定依法运用武装力量保护海外中国公民、组织、机构和设施安全，并开展维和、救援、护航等活动。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>海外利益保护具有多种法律工具，军事行动只是其中一个层次。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（四）第18条与第38条形成“任务—权限”关系\u003c/h4>\n\u003cp>\u003cstrong>第18条解决：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>国家在军事安全领域承担哪些任务？\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>第38条解决：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>谁领导全国武装力量并统一指挥维护国家安全的军事行动？\u003c/p>\n\u003c/blockquote>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第18条：任务规范\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第38条：组织与指挥职权规范\u003c/strong>\u003c/p>\n\u003cp>这是第二章与第三章之间非常典型的体系关系。\u003c/p>\n\u003chr>\n\u003ch4>（五）两书对读\u003c/h4>\n\u003cp>\u003cstrong>甲书\u003c/strong>的优势主要在规范解释和制度背景：\u003c/p>\n\u003cul>\n\u003cli>联系宪法和国防法解释“三化”建设；\u003c/li>\n\u003cli>说明军事能力与国家安全和发展利益需要相适应；\u003c/li>\n\u003cli>较准确地解释积极防御的战略属性；\u003c/li>\n\u003cli>明确使用“防御、自卫、后发制人”表述；\u003c/li>\n\u003cli>结合当时海外军事行动实践解释维和、救援、护航等任务；\u003c/li>\n\u003cli>保存最终审议阶段关于海外军事行动文字修改的重要立法材料。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>乙书\u003c/strong>则更加重视现实军事能力、国际合作和维和实践，并通过维和待命部队、人员培训等数据说明军事能力建设和国际军事合作。\u003c/p>\n\u003cp>但乙书存在一个需要明确校正之处：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>其第48页关于积极防御具有“先发制人的能力”的表述，不宜作为本条的规范解释。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>正式政策文件强调的是：\u003c/p>\n\u003cp>\u003cstrong>战略上防御 + 战役战斗上的主动行动 + 防御、自卫、后发制人\u003c/strong>\u003c/p>\n\u003cp>因此，乙书这一表述宜作为作者解释保留出处，同时在笔记中注明与正式政策文本之间的差异。\u003c/p>\n\u003chr>\n\u003ch4>（六）乙书维和数据应保留时间标签\u003c/h4>\n\u003cp>乙书列举：\u003c/p>\n\u003cul>\n\u003cli>2015年以来派遣维和保障力量的人次；\u003c/li>\n\u003cli>维和待命部队建设；\u003c/li>\n\u003cli>维和人员培训；\u003c/li>\n\u003cli>在联合国维和体系中的参与情况等。\u003c/li>\n\u003c/ul>\n\u003cp>这些数据能够说明特定时期我国参与联合国维和以及能力建设的情况。\u003c/p>\n\u003cp>但应注意：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>这些数字均对应具体资料年份，不能直接作为2026年的实时统计。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，引用时最好写明：\u003c/p>\n\u003cblockquote>\n\u003cp>“据乙书所引截至××年的材料……”\u003c/p>\n\u003c/blockquote>\n\u003cp>而不写：\u003c/p>\n\u003cblockquote>\n\u003cp>“目前中国共有……”\u003c/p>\n\u003c/blockquote>\n\u003cp>这样可以避免将历史数据错误当作实时事实。\u003c/p>\n\u003chr>\n\u003ch4>（七）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：军事安全就是武器装备现代化。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第18条同时规定革命化、现代化和正规化建设，涉及政治、技术能力、组织制度和依法运行等多个维度。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：“积极防御”就是被攻击以后才可以做任何准备。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 积极防御强调战略上的防御，同时允许积极进行军事准备、塑造态势和在战役战斗层面采取主动行动。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：“积极防御”可以直接概括为“先发制人”。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 正式政策文件强调“防御、自卫、后发制人”，并强调战略上防御与战役战斗上进攻相统一。战略主动不等于先发制人。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：第18条列举维护海外利益的军事行动，因此海外利益受损时当然可以使用军事力量。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 第18条规定国家任务。具体军事行动还须满足国内法上的决策权限和程序要求，并符合适用国际法。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：联合国维和就是联合国授权参加战争。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 联合国维和具有自身的任务授权和基本原则，通常强调当事方同意、公正性以及除自卫和保卫任务授权外不使用武力，应与和平强制和一般战争区分。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点6：国际救援、海上护航和维护海外利益的军事行动适用完全相同的法律规则。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 三者任务目的、行动空间、权限基础和国际法条件可能明显不同，需要逐项分析。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点7：国内法规定某项海外军事任务，就已经同时解决了国际法合法性。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 国内法任务依据和国际法行动依据属于两个不同法律层次。跨境军事行动还须独立判断《联合国宪章》及其他适用国际法规则。\u003c/p>\n\u003chr>\n\u003ch3>六、深度研究\u003c/h3>\n\u003ch4>1. “积极防御”应建立“战略性质—军事主动—法律边界”的三层分析框架\u003c/h4>\n\u003cp>第18条中最容易概念混乱的部分是“积极防御”。\u003c/p>\n\u003cp>可以将其拆分为三个层次：\u003c/p>\n\u003cp>\u003cstrong>第一层：战略性质\u003c/strong>\u003c/p>\n\u003cp>正式政策文本将其定位为防御性军事战略，强调：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>防御、自卫、后发制人。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>第二层：行动方式\u003c/strong>\u003c/p>\n\u003cp>防御并不等于消极等待。\u003c/p>\n\u003cp>军事力量仍需要：\u003c/p>\n\u003cul>\n\u003cli>提前建设能力；\u003c/li>\n\u003cli>做好战争准备；\u003c/li>\n\u003cli>获取预警；\u003c/li>\n\u003cli>控制危机；\u003c/li>\n\u003cli>争取战略主动；\u003c/li>\n\u003cli>在战役和战斗层面根据军事需要采取主动行动。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>第三层：法律边界\u003c/strong>\u003c/p>\n\u003cp>军事上的“主动”并不能自行改变使用武力的国内法权限和国际法条件。\u003c/p>\n\u003cp>因此，可以用一句话概括：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>积极防御的“积极”解决如何有效防御，不能用来取消“防御”本身的战略和法律属性。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这也解释了为什么乙书“先发制人的能力”这一表述容易产生误导。\u003c/p>\n\u003chr>\n\u003ch4>2. 海外利益保护军事行动具有“国内法＋国际法”的双重合法性结构\u003c/h4>\n\u003cp>这是第18条最值得深入研究的法律问题之一。\u003c/p>\n\u003cp>一个具体海外军事行动至少存在两层不同的合法性判断。\u003c/p>\n\u003ch5>第一层：国内法合法性\u003c/h5>\n\u003cp>需要判断：\u003c/p>\n\u003cul>\n\u003cli>第18条是否将该事项纳入军事安全任务；\u003c/li>\n\u003cli>哪个国家机关拥有决策权；\u003c/li>\n\u003cli>中央军事委员会具有何种指挥权限；\u003c/li>\n\u003cli>是否涉及战争状态、动员等特殊制度；\u003c/li>\n\u003cli>是否符合国防法和其他军事法律。\u003c/li>\n\u003c/ul>\n\u003ch5>第二层：国际法合法性\u003c/h5>\n\u003cp>还需要判断：\u003c/p>\n\u003cul>\n\u003cli>行动发生在哪里；\u003c/li>\n\u003cli>是否进入外国领土、领海或者领空；\u003c/li>\n\u003cli>是否取得东道国同意；\u003c/li>\n\u003cli>是否具有联合国安理会授权；\u003c/li>\n\u003cli>是否涉及《联合国宪章》第51条意义上的自卫；\u003c/li>\n\u003cli>是否符合其他适用的国际条约和国际法规则。\u003c/li>\n\u003c/ul>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>国内任务依据成立\u003c/strong>\u003cbr>≠\u003cbr>\u003cstrong>国际法依据当然成立\u003c/strong>\u003c/p>\n\u003cp>反之亦然。\u003c/p>\n\u003cp>这一双层分析框架对于研究撤侨、海外设施保护、护航以及其他海外军事行动尤其重要。\u003c/p>\n\u003chr>\n\u003ch4>3. “海外利益”不能直接转化为无限制使用军事力量的法益\u003c/h4>\n\u003cp>第18条明确将“发展利益”和“海外利益”纳入军事安全任务，反映国家利益范围与军事任务之间的联系。\u003c/p>\n\u003cp>但从法律解释上仍需要保持门槛。\u003c/p>\n\u003cp>如果仅依据：\u003c/p>\n\u003cblockquote>\n\u003cp>“某项海外经济利益受到影响”\u003c/p>\n\u003c/blockquote>\n\u003cp>就直接推导：\u003c/p>\n\u003cblockquote>\n\u003cp>“可以使用军事力量”，\u003c/p>\n\u003c/blockquote>\n\u003cp>那么“海外利益”概念可能过度扩张。\u003c/p>\n\u003cp>因此，深入研究至少应进一步判断：\u003c/p>\n\u003cul>\n\u003cli>海外利益的重要程度；\u003c/li>\n\u003cli>威胁的性质和严重程度；\u003c/li>\n\u003cli>是否涉及人员生命安全；\u003c/li>\n\u003cli>外交、领事、警务、民事救援等非军事措施是否可用；\u003c/li>\n\u003cli>使用军事力量是否具有明确国内决策依据；\u003c/li>\n\u003cli>国际法是否允许有关行动。\u003c/li>\n\u003c/ul>\n\u003cp>由此可以形成：\u003c/p>\n\u003cp>\u003cstrong>海外利益受威胁\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>风险性质和严重程度判断\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>非军事保护手段评估\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>是否达到使用军事力量的条件\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>国内法与国际法双重审查\u003c/strong>\u003c/p>\n\u003cp>这比简单依据“维护海外利益”作判断更符合法律分析要求。\u003c/p>\n\u003chr>\n\u003ch4>4. 联合国维和应与和平强制、集体安全行动严格区分\u003c/h4>\n\u003cp>联合国维和并没有因为使用军队就自动成为战争。\u003c/p>\n\u003cp>分析时至少应区分：\u003c/p>\n\u003ch5>联合国维和\u003c/h5>\n\u003cp>通常依据具体联合国任务授权展开，并以：\u003c/p>\n\u003cul>\n\u003cli>当事方同意；\u003c/li>\n\u003cli>公正；\u003c/li>\n\u003cli>除自卫和保卫任务授权外不使用武力；\u003c/li>\n\u003c/ul>\n\u003cp>作为基本原则。\u003c/p>\n\u003ch5>强有力维和\u003c/h5>\n\u003cp>部分任务在安理会授权下，可以在战术层面使用必要武力保护平民或者执行任务，但仍不能简单等同于和平强制。\u003c/p>\n\u003ch5>和平强制\u003c/h5>\n\u003cp>通常涉及《联合国宪章》第七章框架下更具有强制性的措施，并不以有关冲突方同意为当然前提。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“维和—强有力维和—和平强制”应当作为不同制度层次分析。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第18条只写“实施联合国维和”，不能用这一表述概括联合国全部军事安全机制。\u003c/p>\n\u003chr>\n\u003ch4>5. “军事任务”与“使用武力”需要进一步区分\u003c/h4>\n\u003cp>第18条所列四类活动都可能由军事力量承担，但：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>军队参与某项活动 ≠ 该活动必然属于国际法意义上的使用武力。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>例如：\u003c/p>\n\u003cul>\n\u003cli>国际灾害救援主要可能是运输、搜救、医疗和工程保障；\u003c/li>\n\u003cli>海上护航可能以警戒、伴随航行为主；\u003c/li>\n\u003cli>联合国维和中大量任务具有观察、警戒、工程、医疗和后勤性质。\u003c/li>\n\u003c/ul>\n\u003cp>因此，可以建立：\u003c/p>\n\u003cp>\u003cstrong>主体是不是军队\u003c/strong>\u003c/p>\n\u003cp>与\u003c/p>\n\u003cp>\u003cstrong>行为是否构成使用武力\u003c/strong>\u003c/p>\n\u003cp>两个不同判断。\u003c/p>\n\u003cp>这一点对于国际法分析尤其重要，因为《联合国宪章》第2条第4款所控制的是国际关系中的武力威胁或者使用，而不是一切军队跨境活动。\u003c/p>\n\u003chr>\n\u003ch4>6. 军事能力“与需要相适应”可以形成军事安全领域的能力—任务分析框架\u003c/h4>\n\u003cp>本条中的“相适应”具有较强的研究价值。\u003c/p>\n\u003cp>它可以转化为：\u003c/p>\n\u003cp>\u003cstrong>保护利益\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>识别安全威胁\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>确定军事任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>判断所需能力\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>建设和配置武装力量\u003c/strong>\u003c/p>\n\u003cp>这一框架可以避免单纯以：\u003c/p>\n\u003cul>\n\u003cli>军费增长；\u003c/li>\n\u003cli>装备数量；\u003c/li>\n\u003cli>人员规模；\u003c/li>\n\u003c/ul>\n\u003cp>衡量军事安全能力。\u003c/p>\n\u003cp>更合理的评价应当关注：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>具体能力是否能够完成法律所规定的军事安全任务。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>例如，可以分别研究：\u003c/p>\n\u003cul>\n\u003cli>国土防卫能力；\u003c/li>\n\u003cli>海上护航能力；\u003c/li>\n\u003cli>国际救援能力；\u003c/li>\n\u003cli>维和保障能力；\u003c/li>\n\u003cli>海外人员撤离和保护能力。\u003c/li>\n\u003c/ul>\n\u003cp>这样能够将抽象“强军”目标转换为更具体的法律和政策评价问题。\u003c/p>\n\u003chr>\n\u003ch4>7. 军事安全、国土安全和海外利益安全形成三个不同空间层次\u003c/h4>\n\u003cp>可以进一步将第17、18、33条组合为一个空间结构：\u003c/p>\n\u003cp>\u003cstrong>第一层：本国领土范围\u003c/strong>\u003c/p>\n\u003cp>第17条重点保护：\u003c/p>\n\u003cul>\n\u003cli>领陆；\u003c/li>\n\u003cli>内水；\u003c/li>\n\u003cli>领海；\u003c/li>\n\u003cli>领空。\u003c/li>\n\u003c/ul>\n\u003cp>核心是国土主权和安全。\u003c/p>\n\u003cp>\u003cstrong>第二层：国际空间中的军事安全活动\u003c/strong>\u003c/p>\n\u003cp>第18条涉及：\u003c/p>\n\u003cul>\n\u003cli>国际军事合作；\u003c/li>\n\u003cli>联合国维和；\u003c/li>\n\u003cli>国际救援；\u003c/li>\n\u003cli>海上护航。\u003c/li>\n\u003c/ul>\n\u003cp>这些活动可能发生在本国领土之外。\u003c/p>\n\u003cp>\u003cstrong>第三层：海外中国公民、组织、机构和利益\u003c/strong>\u003c/p>\n\u003cp>第33条建立一般性的海外利益保护任务，第18条则承认军事行动可以成为特定条件下的保护手段。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全法已经从传统领土防卫延伸至跨境安全和海外利益保护，但不同空间中的国家权限性质并不相同。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>空间越向境外延伸，越需要同时处理国内法与国际法的衔接。\u003c/p>\n\u003chr>\n\u003ch4>8. 可进一步形成六个研究问题\u003c/h4>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>“积极防御”的法律含义能否与军事战略概念进行严格区分？\u003c/strong>\u003cbr>当战略层面坚持防御、自卫和后发制人，而战役战斗层面强调争取主动时，法律解释应如何准确表述二者关系？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“国家海外利益”达到何种重要程度时可以进入军事安全任务？\u003c/strong>\u003cbr>是否需要区分公民生命安全、重大国家战略利益、普通商业利益等不同层次？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>保护海外公民和海外利益时，军事手段与外交、领事、警务和民事救援手段之间应如何形成顺序和衔接机制？\u003c/strong>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>第18条与第38条之间是否形成充分明确的“任务—决策—指挥”法律结构？\u003c/strong>\u003cbr>不同类型海外军事行动是否还需要进一步细化国内决策和程序规则？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何在国内法上区分联合国维和、国际救援、海上护航和其他海外军事行动？\u003c/strong>\u003cbr>四类行动是否应分别建立不同的授权、指挥、人员地位和责任制度？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何评价军事安全能力建设的有效性？\u003c/strong>\u003cbr>相较于单纯统计装备、人员和投入，应否围绕第18条规定的具体任务，建立“任务完成能力—合法行动能力—国际合作能力—危机响应能力”的综合评价框架？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定维护\u003cstrong>军事安全\u003c/strong>的基本国家任务，是第3条“以军事、文化、社会安全为保障”在第二章中的具体展开。\u003c/p>\n\u003cp>从句法结构看，本条以两个分号划分为三个层次：\u003c/p>\n\u003cp>\u003cstrong>武装力量建设 → 积极防御军事战略 → 国际军事安全合作与军事行动\u003c/strong>\u003c/p>\n\u003cp>三个层次又共同指保护目标：\u003c/p>\n\u003cp>\u003cstrong>国家主权、安全、领土完整、发展利益 + 世界和平\u003c/strong>\u003c/p>\n\u003cp>因此，本条既规定国内军事能力建设和防卫任务，也规定国际军事安全合作以及特定海外军事行动。\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 武装力量建设具有明确的宪法和国防法制度基础\u003c/h4>\n\u003cp>甲书第81—83页首先将本条与宪法和当时的国防法律制度相联系。\u003c/p>\n\u003cp>《宪法》第29条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>国家加强武装力量的革命化、现代化、正规化的建设，增强国防力量。\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，第18条关于“革命化、现代化、正规化建设”的表述具有明确的宪法制度基础。\u003c/p>\n\u003cp>2015年制定《国家安全法》时，相关内容也已经存在于当时的《国防法》中。《国家安全法》第18条将其进一步纳入总体国家安全观下的军事安全任务体系，并增加了“国家安全和发展利益”“国际军事安全合作”“海外利益”等内容。\u003c/p>\n\u003cp>可以概括为：\u003c/p>\n\u003cp>\u003cstrong>宪法国防规范\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>国防法律制度\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>总体国家安全框架中的军事安全任务\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>2. 本条将军事安全与“发展利益”明确联系起来\u003c/h4>\n\u003cp>本条并未只规定：\u003c/p>\n\u003cblockquote>\n\u003cp>建设与“保卫国家安全”需要相适应的武装力量，\u003c/p>\n\u003c/blockquote>\n\u003cp>而是规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“建设与保卫国家安全和发展利益需要相适应的武装力量。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>甲书第83—84页特别强调，军事安全环境和军事任务随着国家利益范围、国际联系以及安全风险的发展而变化，武装力量建设需要与实际安全任务相匹配。\u003c/p>\n\u003cp>因此，第18条所确立的不是抽象追求军事能力增加，而是强调：\u003c/p>\n\u003cp>\u003cstrong>安全与发展利益的实际需要\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>确定军事安全任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>形成与任务相适应的武装力量\u003c/strong>\u003c/p>\n\u003cp>这一表述也与第2条将经济社会可持续发展和国家重大利益纳入国家安全概念相互衔接。\u003c/p>\n\u003chr>\n\u003ch4>3. 最终审议阶段对海外军事行动进行了重要具体化\u003c/h4>\n\u003cp>第18条的立法过程中存在一项明确的最终审议修改。\u003c/p>\n\u003cp>甲书附录五第388页（PDF第401页）所载2015年6月30日关于国家安全法草案修改意见的报告记载，草案三次审议稿原规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“实施维护国家安全的海外军事行动。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>在审议过程中，有常委会组成人员提出，随着国际安全合作深化和国家利益拓展，我国已经开展包括联合国维和、国际灾难救援、海上护航等海外军事行动，建议将这些行动具体列举出来。\u003c/p>\n\u003cp>经研究并与有关部门沟通，最终建议修改为：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“实施联合国维和、国际救援、海上护航和维护国家海外利益的军事行动。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，最终文本将原来较为概括的：\u003c/p>\n\u003cp>\u003cstrong>“维护国家安全的海外军事行动”\u003c/strong>\u003c/p>\n\u003cp>具体化为：\u003c/p>\n\u003cp>\u003cstrong>联合国维和 + 国际救援 + 海上护航 + 维护国家海外利益的军事行动\u003c/strong>\u003c/p>\n\u003cp>这一修改提高了条文对军事安全海外任务类型的可识别性。\u003c/p>\n\u003chr>\n\u003ch4>4. 对海外军事行动的具体列举不等于建立无条件行动授权\u003c/h4>\n\u003cp>立法材料能够证明，最终审议阶段有意将海外军事行动类型写得更加具体。\u003c/p>\n\u003cp>但这一修改不能进一步解释为：\u003c/p>\n\u003cblockquote>\n\u003cp>只要涉及上述事项，第18条就已经自动赋予国家机关在任何地点、任何情况下实施军事行动的完整权限。\u003c/p>\n\u003c/blockquote>\n\u003cp>第18条首先是一项\u003cstrong>国家军事安全任务规范\u003c/strong>。\u003c/p>\n\u003cp>具体行动仍需继续判断：\u003c/p>\n\u003cul>\n\u003cli>国内由何机关决定和指挥；\u003c/li>\n\u003cli>是否符合宪法、国防法等国内法要求；\u003c/li>\n\u003cli>行动发生在何种空间；\u003c/li>\n\u003cli>是否涉及其他国家领土或者管辖区域；\u003c/li>\n\u003cli>国际法上具有何种依据；\u003c/li>\n\u003cli>任务范围和行动规则是什么。\u003c/li>\n\u003c/ul>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>行动类型的法律确认与具体行动合法性的判断属于两个不同层次。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>5. 2020年修订《国防法》进一步具体化军事安全和海外利益保护\u003c/h4>\n\u003cp>〔后续制度发展〕\u003c/p>\n\u003cp>甲书出版于2016年，其主要依据是当时的《国防法》。\u003c/p>\n\u003cp>2020年修订、2021年1月1日起施行的现行《国防法》已经进一步发展相关制度。\u003c/p>\n\u003cp>现行《国防法》明确：\u003c/p>\n\u003cul>\n\u003cli>国防活动包括为防备和抵抗侵略、制止武装颠覆和分裂、保卫国家主权、统一、领土完整、安全和发展利益进行的军事活动；\u003c/li>\n\u003cli>中国奉行防御性国防政策，实行积极防御；\u003c/li>\n\u003cli>武装力量的使命任务包括维护国家海外利益、促进世界和平与发展；\u003c/li>\n\u003cli>国家可以依照有关法律运用武装力量保护海外中国公民、组织、机构和设施安全，并参加联合国维和、国际救援、海上护航、联演联训、反恐怖主义等活动。\u003c/li>\n\u003c/ul>\n\u003cp>因此，可以形成：\u003c/p>\n\u003cp>\u003cstrong>2015年第18条：军事安全领域的一般国家任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>2020年修订《国防法》：进一步具体化武装力量任务和对外军事关系制度\u003c/strong>\u003c/p>\n\u003cp>这一后续立法可以用于理解第18条在现行制度中的展开，但不能反过来作为2015年原始立法文本形成过程的直接证据。\u003c/p>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，革命化、现代化、正规化共同构成武装力量建设任务\u003c/h4>\n\u003cp>本条首先规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“国家加强武装力量革命化、现代化、正规化建设。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>甲书第82—83页对三者分别进行了较详细解释。\u003c/p>\n\u003ch5>1. 革命化建设\u003c/h5>\n\u003cp>甲书主要从武装力量的政治属性、领导制度和使命任务角度解释革命化建设。\u003c/p>\n\u003cp>因此，其核心并非武器装备问题，而主要涉及：\u003c/p>\n\u003cul>\n\u003cli>武装力量的政治方向；\u003c/li>\n\u003cli>领导和组织建设；\u003c/li>\n\u003cli>军队使命和价值要求等。\u003c/li>\n\u003c/ul>\n\u003ch5>2. 现代化建设\u003c/h5>\n\u003cp>甲书将现代化重点联系于现代军事技术、信息化建设、武器装备、后勤保障、军事人才和现代条件下作战能力。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>现代化不能简单等同于增加装备数量。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>其重点是军事能力、技术体系、组织体系和作战方式与现代战争形态相适应。\u003c/p>\n\u003ch5>3. 正规化建设\u003c/h5>\n\u003cp>甲书特别将正规化与依法治军、组织制度、纪律机制以及规范化运行联系起来。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>正规化强调的是军队组织和运行的制度化、规范化和法治化。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>三者可以概括为：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>建设维度\u003c/th>\n\u003cth>主要关注点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>革命化\u003c/strong>\u003c/td>\n\u003ctd>政治属性、领导和使命\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>现代化\u003c/strong>\u003c/td>\n\u003ctd>技术装备、人才、组织和军事能力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>正规化\u003c/strong>\u003c/td>\n\u003ctd>制度、纪律、组织运行和依法治军\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>三个方面具有不同功能，不能将本条的军事能力建设缩减为单纯的武器装备现代化。\u003c/p>\n\u003chr>\n\u003ch4>第二，武装力量建设应当与国家安全和发展利益需要相适应\u003c/h4>\n\u003cp>本条并非简单规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“建设强大的武装力量”，\u003c/p>\n\u003c/blockquote>\n\u003cp>而是规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“建设与保卫国家安全和发展利益需要相适应的武装力量。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这一表述具有明显的任务导向。\u003c/p>\n\u003cp>其基本逻辑是：\u003c/p>\n\u003cp>\u003cstrong>安全环境和国家利益变化\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>军事安全任务发生变化\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>武装力量规模、结构和能力相应调整\u003c/strong>\u003c/p>\n\u003cp>因此，“相适应”强调的是\u003cstrong>任务—能力匹配\u003c/strong>。\u003c/p>\n\u003cp>从法律解释角度看，这一要求至少包含两个方向：\u003c/p>\n\u003cp>一方面，军事能力不能明显不足，以至于无法承担法律规定的军事安全任务；\u003c/p>\n\u003cp>另一方面，也不能仅根据“军事安全”这一抽象目的脱离现实安全和发展需要无限推导能力建设要求。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“相适应”比单纯强调能力增长更具有关系性和任务导向。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三，积极防御是本条明确规定的军事战略方针\u003c/h4>\n\u003cp>第二层规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“实施积极防御军事战略方针。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>甲书第84—85页将积极防御解释为我国长期实行的军事战略方针，并特别强调：\u003c/p>\n\u003cp>\u003cstrong>战略上的防御\u003c/strong>\u003cbr>与\u003cbr>\u003cstrong>战役、战斗层面的主动行动\u003c/strong>\u003c/p>\n\u003cp>可以同时存在。\u003c/p>\n\u003cp>因此，“积极防御”中的“积极”不能被理解为消极等待风险实际发生之后才采取任何军事准备或行动。\u003c/p>\n\u003cp>其重点在于：\u003c/p>\n\u003cul>\n\u003cli>做好军事斗争准备；\u003c/li>\n\u003cli>防备可能发生的侵略；\u003c/li>\n\u003cli>形成威慑和应对能力；\u003c/li>\n\u003cli>在战略防御原则下，根据具体军事需要采取主动行动。\u003c/li>\n\u003c/ul>\n\u003cp>但这种“主动性”必须与其战略属性区分。\u003c/p>\n\u003chr>\n\u003ch4>第四，“积极防御”不能概括为“先发制人”\u003c/h4>\n\u003cp>这是两书对读中需要特别校正的一点。\u003c/p>\n\u003cp>乙书第48页（PDF第57页）在解释积极防御时写道：\u003c/p>\n\u003cblockquote>\n\u003cp>积极防御在必要时需要采取主动措施，并进一步使用了具有“快速反应和先发制人的能力”的表述。\u003c/p>\n\u003c/blockquote>\n\u003cp>其中强调快速反应、战略主动具有一定解释意义，但以“\u003cstrong>先发制人\u003c/strong>”概括积极防御并不准确。\u003c/p>\n\u003cp>甲书第84页对此采用的是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>战略上防御与战役、战斗上进攻相统一，坚持防御、自卫、后发制人。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>2015年《中国的军事战略》白皮书同样明确表述：\u003c/p>\n\u003cul>\n\u003cli>战略上防御与战役战斗上进攻相统一；\u003c/li>\n\u003cli>坚持防御、自卫；\u003c/li>\n\u003cli>坚持后发制人的原则。\u003c/li>\n\u003c/ul>\n\u003cp>2019年《新时代的中国国防》仍延续这一正式表述。\u003c/p>\n\u003cp>因此，笔记中应当明确区分：\u003c/p>\n\u003cp>\u003cstrong>战略主动 ≠ 先发制人\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>战役战斗层面的主动进攻 ≠ 战略上的先发制人\u003c/strong>\u003c/p>\n\u003cp>更准确的理解是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>积极防御强调在防御性战略定位下争取战略主动、做好准备并具有有效反击能力，而正式政策文本仍以“防御、自卫、后发制人”表述其基本原则。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，乙书“先发制人的能力”这一说法不宜直接作为第18条中“积极防御”的定义使用。\u003c/p>\n\u003chr>\n\u003ch4>第五，“防备和抵御侵略”分别体现预防与应对两个阶段\u003c/h4>\n\u003cp>第18条紧接积极防御规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“防备和抵御侵略。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这里使用两个不同动词。\u003c/p>\n\u003cp>\u003cstrong>防备\u003c/strong>主要体现：\u003c/p>\n\u003cul>\n\u003cli>战备建设；\u003c/li>\n\u003cli>风险监测；\u003c/li>\n\u003cli>军事准备；\u003c/li>\n\u003cli>威慑和危机应对能力。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>抵御\u003c/strong>则更多对应侵略实际发生后，通过军事手段进行防卫和反击。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>防备：侵略发生前的能力和准备\u003c/strong>\u003cbr>\u003cstrong>抵御：侵略发生时的实际防卫\u003c/strong>\u003c/p>\n\u003cp>这与第9条“预防为主”的总体国家安全治理逻辑相互呼应，但军事领域具有其自身制度和行动规则。\u003c/p>\n\u003chr>\n\u003ch4>第六，“制止武装颠覆和分裂”体现军事安全与政治、国土安全的交叉\u003c/h4>\n\u003cp>本条还规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“制止武装颠覆和分裂。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这说明军事安全并非只处理外国军事侵略。\u003c/p>\n\u003cp>当颠覆、分裂活动具有武装性质并达到需要军事力量应对的程度时，也可能进入军事安全任务范围。\u003c/p>\n\u003cp>因此，第18条与：\u003c/p>\n\u003cul>\n\u003cli>第15条政治安全；\u003c/li>\n\u003cli>第17条国土安全；\u003c/li>\n\u003c/ul>\n\u003cp>存在明显交叉。\u003c/p>\n\u003cp>可以理解为：\u003c/p>\n\u003cp>\u003cstrong>第15条：从政治安全角度处理颠覆、分裂问题\u003c/strong>\u003cbr>\u003cstrong>第17条：从国土安全角度维护领土主权和完整\u003c/strong>\u003cbr>\u003cstrong>第18条：从军事安全角度应对侵略以及武装颠覆、分裂\u003c/strong>\u003c/p>\n\u003cp>同一风险可能同时涉及多个安全领域，但具体行动权限仍须依据相应法律制度判断。\u003c/p>\n\u003chr>\n\u003ch4>第七，国际军事安全合作属于军事安全任务本身\u003c/h4>\n\u003cp>第三层首先规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“开展国际军事安全合作。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>这与第10条国际安全合作原则相互衔接。\u003c/p>\n\u003cp>第10条从整个国家安全体系规定：\u003c/p>\n\u003cblockquote>\n\u003cp>互信、互利、平等、协作以及国际安全交流合作。\u003c/p>\n\u003c/blockquote>\n\u003cp>第18条则在军事安全领域将其具体化为：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国际军事安全合作。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此：\u003c/p>\n\u003cp>\u003cstrong>第10条：一般国际安全合作原则\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第18条：军事安全领域的具体合作任务\u003c/strong>\u003c/p>\n\u003cp>军事安全由此不仅包含国内国防和军事能力建设，也包含通过国际合作维护相关安全利益和世界和平。\u003c/p>\n\u003chr>\n\u003ch4>第八，四类国际军事行动需要分别理解\u003c/h4>\n\u003cp>第18条最终明确列举：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>联合国维和；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>国际救援；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>海上护航；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>维护国家海外利益的军事行动。\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cp>四者虽然共同出现在同一条文中，但法律目的和行动机制并不完全相同。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>行动类型\u003c/th>\n\u003cth>基本功能\u003c/th>\n\u003cth>研读重点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>联合国维和\u003c/strong>\u003c/td>\n\u003ctd>根据联合国有关授权参与维护和平与安全\u003c/td>\n\u003ctd>任务授权、维和原则、行动规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>国际救援\u003c/strong>\u003c/td>\n\u003ctd>应对灾难、人道危机等紧急情况\u003c/td>\n\u003ctd>受援国同意、救援性质、人员和行动权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>海上护航\u003c/strong>\u003c/td>\n\u003ctd>保障有关海上通道、船舶及人员安全\u003c/td>\n\u003ctd>行动海域、国际海洋法、具体任务授权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>海外利益军事行动\u003c/strong>\u003c/td>\n\u003ctd>在特定情况下保护国家海外利益\u003c/td>\n\u003ctd>国内决策权限、国际法依据、必要性和行动范围\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第18条列举的是不同军事安全任务类型，而不是建立一种统一的“海外军事行动模式”。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第九，本条保护目标同时包括国家利益与世界和平\u003c/h4>\n\u003cp>本条最后规定：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“维护国家主权、安全、领土完整、发展利益和世界和平。”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>其中前四项主要指向国家自身安全和发展利益：\u003c/p>\n\u003cul>\n\u003cli>主权；\u003c/li>\n\u003cli>安全；\u003c/li>\n\u003cli>领土完整；\u003c/li>\n\u003cli>发展利益。\u003c/li>\n\u003c/ul>\n\u003cp>“世界和平”则进一步体现国际安全目标。\u003c/p>\n\u003cp>这一结构与第8条“统筹自身安全和共同安全”以及第10条“促进共同安全，维护世界和平”相互呼应。\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>第18条将军事安全同时置于自身安全和国际安全两个维度中理解。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 第18条属于国家军事安全任务条款，不是具体军事行动的一般授权条款\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>第18条的主语仍然是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“国家”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>因此，它首先回答：\u003c/p>\n\u003cblockquote>\n\u003cp>国家在军事安全领域应当承担哪些任务？\u003c/p>\n\u003c/blockquote>\n\u003cp>而不能单独回答：\u003c/p>\n\u003cblockquote>\n\u003cp>哪个机关可以在什么时间、地点、条件下采取何种具体军事行动？\u003c/p>\n\u003c/blockquote>\n\u003cp>具体权限需要继续进入第三章。\u003c/p>\n\u003cp>第38条规定中央军事委员会：\u003c/p>\n\u003cul>\n\u003cli>领导全国武装力量；\u003c/li>\n\u003cli>决定军事战略和武装力量的作战方针；\u003c/li>\n\u003cli>统一指挥维护国家安全的军事行动；\u003c/li>\n\u003cli>制定涉及国家安全的军事法规；\u003c/li>\n\u003cli>发布有关决定和命令。\u003c/li>\n\u003c/ul>\n\u003cp>涉及战争状态、动员等事项时，还存在第35、36条所规定的全国人大、全国人大常委会和国家主席相应职权。\u003c/p>\n\u003cp>因此，可以形成：\u003c/p>\n\u003cp>\u003cstrong>第18条：规定军事安全任务\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第35—38条：配置有关国家机构职权\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>国防法及其他军事法律：具体化组织、行动和程序\u003c/strong>\u003c/p>\n\u003cp>这再次说明：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家任务不能直接替代机关职权。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>2. 国内法确认军事任务与国际法确认行动合法性属于不同问题\u003c/h4>\n\u003cp>〔国际法／笔记分析〕\u003c/p>\n\u003cp>第18条属于中国国内法，可以规定国家武装力量承担哪些安全任务。\u003c/p>\n\u003cp>但如果某项军事行动发生在国际空间、其他国家领土或者可能影响其他国家权利，则还必须独立判断国际法依据。\u003c/p>\n\u003cp>因此应区分：\u003c/p>\n\u003cp>\u003cstrong>国内法问题：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>中国国内法是否规定国家承担这一军事任务？\u003cbr>哪个机关有权决定、组织和指挥？\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>国际法问题：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>该具体军事行动在国际法上是否具有合法依据？\u003c/p>\n\u003c/blockquote>\n\u003cp>两者不能互相替代。\u003c/p>\n\u003cp>即使第18条明确规定“维护国家海外利益的军事行动”，也不能仅凭这一国内法条款排除《联合国宪章》以及其他适用国际法的要求。\u003c/p>\n\u003chr>\n\u003ch4>3. 《联合国宪章》构成海外使用武力问题的重要国际法框架\u003c/h4>\n\u003cp>〔国际法〕\u003c/p>\n\u003cp>《联合国宪章》第2条第4款确立禁止在国际关系中违反宪章宗旨以武力相威胁或者使用武力的原则。\u003c/p>\n\u003cp>与此同时，宪章还规定：\u003c/p>\n\u003cul>\n\u003cli>安理会依据第七章维护或者恢复国际和平与安全的职权；\u003c/li>\n\u003cli>第51条确认在发生武力攻击时的单独或集体自卫权。\u003c/li>\n\u003c/ul>\n\u003cp>因此，如果某项“维护海外利益的军事行动”涉及跨境使用武力，不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>第18条是否列举了这一任务？\u003c/p>\n\u003c/blockquote>\n\u003cp>还需要进一步问：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>具体行动在《联合国宪章》和其他适用国际法下具有何种法律依据？\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>不同情形可能涉及东道国同意、联合国安理会授权、自卫等不同法律问题，应根据具体事实分别分析。\u003c/p>\n\u003chr>\n\u003ch4>4. 联合国维和与和平强制不能混同\u003c/h4>\n\u003cp>〔国际法〕\u003c/p>\n\u003cp>第18条首先列举“联合国维和”。\u003c/p>\n\u003cp>联合国现行维和原则通常概括为：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>冲突主要当事方同意；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>公正性；\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>除自卫和保卫任务授权外不使用武力。\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cp>因此，联合国维和一般不同于通过强制性军事行动恢复国际和平的“和平强制”。\u003c/p>\n\u003cp>某些具有强有力授权的维和行动可能在安理会授权范围内使用武力，但这并不意味着维和任务因此与战争或者一般军事强制行动具有相同的法律性质。\u003c/p>\n\u003cp>所以：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“参加联合国维和”不能简单理解为“参加战争”。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>分析具体维和任务时，应继续查看：\u003c/p>\n\u003cul>\n\u003cli>安理会任务授权；\u003c/li>\n\u003cli>维和行动规则；\u003c/li>\n\u003cli>东道国及有关方面的法律关系；\u003c/li>\n\u003cli>具体部队承担的任务。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>5. 国际救援与军事使用武力属于不同问题\u003c/h4>\n\u003cp>〔笔记分析〕\u003c/p>\n\u003cp>军队参与国际救援并不意味着军事行动必然具有作战性质。\u003c/p>\n\u003cp>例如，国际灾害救援可能主要包括：\u003c/p>\n\u003cul>\n\u003cli>搜索和救援；\u003c/li>\n\u003cli>医疗救治；\u003c/li>\n\u003cli>物资运输；\u003c/li>\n\u003cli>工程抢修；\u003c/li>\n\u003cli>人道主义援助。\u003c/li>\n\u003c/ul>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>“由武装力量实施”与“属于武力使用”不能简单画等号。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>具体国际救援需要根据任务性质、受援国同意、有关国际安排以及人员法律地位分别判断。\u003c/p>\n\u003chr>\n\u003ch4>6. 海上护航的法律依据取决于行动空间和具体任务\u003c/h4>\n\u003cp>〔海洋法／笔记分析〕\u003c/p>\n\u003cp>海上护航涉及军事力量，但其法律评价不能脱离行动海域。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cul>\n\u003cli>在公海或者其他国际法允许航行的海域；\u003c/li>\
