r />\n<strong>有关机关依法形成具体决定</strong><br />\n↓<br />\n<strong>实施、监督与责任追究</strong></p>\n<p>这一结构非常重要，因为它把第4条的“集中统一”与第43条的“严格依法履行职责”连接起来。换言之：</p>\n<blockquote>\n<p><strong>集中统一解决重大事项如何形成整体决策，法定职权解决具体决定由谁依法作出。</strong></p>\n</blockquote>\n<hr />\n<h4>5. 比较法的重点应当放在“功能链条”，而不只是机构名称</h4>\n<p>〔比较法〕《国家安全法释义》外国相关国家安全机构概括为咨询、协调、决策等不同功能类型，并指出不同功能之间可能存在交叉。这一比较思路具有启发意义。\n不同国家可能都设有名称类似“国家安全委员会”的机构，但机构名称相同并不意味着其法律地位、职权范围和运行方式相同。更有意义的比较是：\n<strong>谁提供信息和专业意见</strong><br />\n↓<br />\n<strong>谁提出政策建议</strong><br />\n↓<br />\n<strong>谁作出最终决定</strong><br />\n↓<br />\n<strong>谁负责组织协调</strong><br />\n↓<br />\n<strong>谁依法具体实施</strong><br />\n↓<br />\n<strong>谁承担相应责任</strong></p>\n<p>例如，美国国家安全委员会主要围绕总统形成国家安全政策咨询和跨部门协调机制。比较研究应进一步考察其宪制地位、与总统及行政部门之间的关系，而不宜仅因中美均存在“国家安全委员会”而进行制度等同。\n因此：&gt; <strong>比较国家安全组织制度，应当比较功能、权限和责任结构，而不应只比较机构名称。</strong></p>\n<hr />\n<h3>五、体系联系与学习提示</h3>\n<h4>（一）第4条、第5条和第6条的关系</h4>\n<p>这三条连续规定，但功能明显不同。</p>\n<h4>第4条：领导体制</h4>\n<p>回答：&gt; <strong>国家安全工作由谁领导，应建立什么样的领导体制？</strong>\n核心词：<strong>党的领导 + 集中统一、高效权威</strong></p>\n<h5>第5条：领导机构职责</h5>\n<p>回答：&gt; <strong>中央国家安全领导机构具体负责什么？</strong>\n核心词：<strong>决策协调 + 战略政策 + 重大事项统筹 + 法治建设</strong></p>\n<h5>第6条：国家安全战略</h5>\n<p>回答：&gt; <strong>国家安全战略本身应当如何制定和完善，主要包括什么内容？</strong>\n核心词：<strong>形势评估 + 指导方针 + 中长期目标 + 重点领域政策 + 工作任务和措施</strong></p>\n<p>因此可以记忆为：\n<strong>第4条：体制</strong><br />\n↓<br />\n<strong>第5条：主体与职责</strong><br />\n↓<br />\n<strong>第6条：战略</strong></p>\n<hr />\n<h4>（二）国家安全战略的制度闭环</h4>\n<p>第5条与第6条、第46条、第47条共同形成较为完整的战略机制：\n<strong>第5条：研究制定、指导实施战略</strong><br />\n↓<br />\n<strong>第6条：规定战略内容并不断完善</strong><br />\n↓<br />\n<strong>第47条：部门、地区采取有效措施贯彻实施</strong><br />\n↓<br />\n<strong>第46条：督促检查和责任追究</strong></p>\n<p>因此，在学习时不宜孤立理解第5条中的“指导实施”。</p>\n<p>其真正含义需要放在后续制度中理解：&gt; <strong>战略制定之后，还存在任务落实、贯彻实施、监督检查和责任机制。</strong></p>\n<hr />\n<h4>（三）国家安全法治建设的制度闭环</h4>\n<p>本条“推动国家安全法治建设”与第五章也形成体系联系：</p>\n<p><strong>第5条：中央国家安全领导机构推动法治建设</strong><br />\n↓<br />\n<strong>第70条：国家健全国家安全法律制度体系</strong><br />\n↓<br />\n<strong>具体立法：按照宪法和《立法法》等规定的权限和程序制定、修改</strong></p>\n<p>因此：</p>\n<blockquote>\n<p><strong>国家安全法治建设本身也必须通过法治方式推进。</strong></p>\n</blockquote>\n<hr />\n<h4>（四）区分四个容易混淆的概念</h4>\n<h5>1. 中央国家安全领导机构</h5>\n<p>本条中的职责主体。主要承担：<strong>决策、议事协调、战略、重大事项统筹、法治建设推动。</strong></p>\n<h5>2. 国家安全领导体制</h5>\n<p>第4条规定的国家安全工作整体组织结构。核心特征：<strong>集中统一、高效权威。</strong></p>\n<h5>3. 国家安全机关</h5>\n<p>依法承担特定国家安全专门职责的国家机关，具有有关法律明确规定的具体职权。</p>\n<h5>4. 国家安全工作协调机制</h5>\n<p>第45、48、49条等规定的重点领域协调、跨部门会商以及中央地方、部门、军地、地区之间的协同联动机制。\n因此：&gt; <strong>领导体制 ≠ 中央领导机构 ≠ 国家安全机关 ≠ 工作协调机制</strong></p>\n<hr />\n<h4>（五）易错点</h4>\n<p><strong>易错点1：中央国家安全领导机构就是一个具体国家安全执法机关。</strong>\n<strong>纠正：</strong> 第5条主要规定其决策、议事协调、战略、统筹和法治建设职责。具体执法职权需要依据有关机关的专门法律规定。</p>\n<hr />\n<p><strong>易错点2：“负责国家安全工作的决策”意味着所有国家安全事项都由中央国家安全领导机构直接作出决定。</strong>\n<strong>纠正：</strong> 本条应结合“重大事项”“重要工作”以及第三章国家机关职责规定理解。中央层面承担总体和重大事项决策协调，具体事项仍由有关机关依法处理。</p>\n<hr />\n<p><strong>易错点3：“研究制定国家安全战略”与“国家制定国家安全战略”相互矛盾。</strong>\n<strong>纠正：</strong> 第5条从中央国家安全领导机构职责角度规定“研究制定、指导实施”，第6条则从国家安全制度角度规定战略的制定、评估、内容和完善要求。二者属于不同规范层次。</p>\n<hr />\n<p><strong>易错点4：“推动国家安全法治建设”等于中央国家安全领导机构可以直接制定法律。</strong>\n<strong>纠正：</strong> “推动”属于研究、协调和制度建设职责。国家立法权以及法律的制定、修改和解释仍须按照宪法规定的主体、权限和程序进行。</p>\n<hr />\n<p><strong>易错点5：第5条已经规定了国家安全战略的全部实施机制。</strong>\n<strong>纠正：</strong> 第5条只规定“指导实施”。战略的具体落实还需要结合第46条的督促检查和责任追究机制、第47条的部门和地区贯彻实施义务以及其他工作机制理解。</p>\n<hr />\n<h3>六、研究问题</h3>\n<ol>\n<li><p><strong>议事协调结论如何转化为具有法律意义的具体决定？</strong><br />\n中央层面的重大国家安全决策和协调意见进入具体执行后，应如何通过各国家机关的法定职责和程序实现？</p>\n</li>\n<li><p><strong>“决策”和“议事协调”之间应如何区分？</strong><br />\n哪些事项属于中央层面的最终决策，哪些事项主要体现跨部门协调？二者在制度运行中如何衔接？</p>\n</li>\n<li><p><strong>国家安全战略的法律性质是什么？</strong><br />\n国家安全战略如何影响有关机关的行政决策和具体行为？其与法律、行政法规、部门规章以及政策文件之间是什么关系？</p>\n</li>\n<li><p><strong>如何评价国家安全战略的实施情况？</strong><br />\n第46条建立督促检查和责任追究机制后，应当以何种标准判断有关部门和地区是否充分履行贯彻实施国家安全战略的职责？</p>\n</li>\n<li><p><strong>“推动国家安全法治建设”应当包括哪些具体制度活动？</strong><br />\n除推动法律制定和修改外，是否还包括规范协调、执法机制建设、程序完善、权利保障以及法律实施评估等内容？</p>\n</li>\n<li><p><strong>跨部门国家安全事务如何实现责任可追溯？</strong><br />\n当一个重大事项经过多个部门共同研判和协调后，最终具体决定由谁作出、事实依据由谁审查、执行责任由谁承担，应如何形成清晰的责任链条？</p>\n</li>\n<li><p><strong>国家安全机构比较法研究应选择什么比较单位？</strong><br />\n是否应当从“机构名称比较”转向“信息—咨询—决策—协调—执行—监督—责任”的完整功能链条比较？</p>\n</li>\n</ol></div></div>","notesHtml":"<p>本条承接第4条关于国家安全领导体制的规定，以职责列举的方式明确中央国家安全领导机构的主要职能。第4条回答“<strong>按照什么领导体制开展国家安全工作</strong>”，第5条则进一步回答“<strong>中央国家安全领导机构具体负责什么</strong>”。现行《国家安全法》第5条仍保持上述规定。</p>\n<hr />\n<h3>二、立法沿革</h3>\n<h4>1. 2013年：设立国家安全委员会的制度部署</h4>\n<p>2013年党的十八届三中全会提出设立国家安全委员会，完善国家安全体制和国家安全战略。\n这一制度安排与国家安全事务日益呈现综合性、跨领域和跨部门特征密切相关。政治、军事、外交、经济、科技、社会等领域的安全问题可能相互影响，需要在中央层面形成能够统筹重大国家安全事务的决策和协调机制。\n因此，设立国家安全委员会，其制度重点在于建立<strong>国家安全重大事项的中央决策和统筹协调机制</strong>。</p>\n<h4>2. 2014年：中央国家安全委员会的机构定位进一步明确</h4>\n<p>2014年1月24日，中共中央政治局会议研究决定中央国家安全委员会设置，并明确中央国家安全委员会是<strong>中共中央关于国家安全工作的决策和议事协调机构</strong>，向中央政治局、中央政治局常务委员会负责，统筹协调涉及国家安全的重大事项和重要工作。\n这一机构定位已经体现出后来《国家安全法》第5条的两个核心概念：\n<strong>决策和议事协调 + 统筹重大事项和重要工作。</strong>\n2014年总体国家安全观提出以后，国家安全工作的领域进一步扩展，建立跨领域统筹机制的重要性也更加突出。</p>\n<h4>3. 2015年：中央国家安全领导机构职责进入法律文本</h4>\n<p>2015年《国家安全法》在第4条确立国家安全领导原则和领导体制后，第5条进一步以法律形式规定中央国家安全领导机构的主要职责，包括：</p>\n<ol>\n<li>国家安全工作的决策和议事协调；</li>\n<li>研究制定、指导实施国家安全战略和有关重大方针政策；</li>\n<li>统筹协调国家安全重大事项和重要工作；</li>\n<li>推动国家安全法治建设。\n由此形成：<strong>领导体制 → 中央领导机构 → 具体职责</strong>这一组织规范结构。</li>\n</ol>\n<h4>4. 制度意义：国家安全领导由原则要求进一步转化为具体职责</h4>\n<p>第4条所规定的“集中统一、高效权威”仍然属于领导体制层面的总体要求。第5条则进一步明确中央国家安全领导机构需要承担哪些工作，使领导体制具有较为具体的组织法内容。\n因此，第4条与第5条可以简化为：\n<strong>第4条：建立什么样的国家安全领导体制</strong><br />\n↓<br />\n<strong>第5条：中央国家安全领导机构具体负责什么</strong></p>\n<hr />\n<h3>三、主要内容</h3>\n<h4>第一，负责国家安全工作的“决策和议事协调”</h4>\n<p>“决策和议事协调”是本条首先规定的职责，也是理解中央国家安全领导机构性质的关键。\n其中，“决策”主要指向国家安全领域具有全局性、战略性和重大性的事项；“议事协调”则强调对涉及多个部门、领域或者地区的国家安全事务进行研究、协调和统筹。\n现代国家安全问题往往具有明显的跨领域特征。例如，一个重大科技安全问题可能同时涉及产业、经济、军事、网络和数据安全。如果完全由单一部门独立处理，可能难以形成整体判断。\n因此，中央国家安全领导机构的重要功能在于将分散于不同领域的信息、判断和政策需求纳入统一的决策协调框架。\n这里需要注意：&gt; <strong>决策和议事协调并不意味着中央国家安全领导机构直接办理所有国家安全事务。</strong>\n具体国家安全工作仍由有关国家机关和部门依照法律规定的职责实施。</p>\n<hr />\n<h4>第二，研究制定并指导实施国家安全战略和有关重大方针政策</h4>\n<p>第二项职责涉及国家安全工作的<strong>战略层面</strong>。\n条文使用了两个不同的动词：&gt; <strong>研究制定 + 指导实施</strong>\n这说明中央国家安全领导机构的职责不仅包括国家安全战略和重大方针政策的形成，也包括推动其进入实施阶段。\n这一职责与第6条具有直接联系。\n第6条规定：</p>\n<blockquote>\n<p>国家制定并不断完善国家安全战略，全面评估国际、国内安全形势，明确国家安全战略的指导方针、中长期目标、重点领域的国家安全政策、工作任务和措施。\n因此：</p>\n</blockquote>\n<ul>\n<li><strong>第5条主要解决“由谁负责国家安全战略工作”；</strong></li>\n<li><strong>第6条主要解决“国家安全战略应当包含什么以及如何完善”。</strong>\n战略形成后，还需要进一步进入执行阶段。\n第46条规定建立国家安全工作督促检查和责任追究机制，以确保国家安全战略和重大部署贯彻落实；第47条规定各部门、各地区应当采取有效措施贯彻实施国家安全战略。\n由此可以形成较完整的战略运行链条：\n<strong>研究制定战略</strong><br />\n↓<br />\n<strong>明确战略内容</strong><br />\n↓<br />\n<strong>指导实施战略</strong><br />\n↓<br />\n<strong>部门和地区具体贯彻</strong><br />\n↓<br />\n<strong>督促检查与责任落实</strong></li>\n</ul>\n<p>这一链条说明，《国家安全法》中的国家安全战略能够通过后续制度与具体国家机关的职责相连接。</p>\n<hr />\n<h4>第三，统筹协调国家安全重大事项和重要工作</h4>\n<p>“统筹协调”与第4条规定的“集中统一”直接衔接。国家安全事项并非都需要由中央国家安全领导机构协调。本条特别使用“<strong>重大事项和重要工作</strong>”作为限定，说明中央层面的统筹具有重点性。\n通常而言，越是具有以下特点的国家安全事务，越具有中央统筹的现实必要性：</p>\n<ul>\n<li>涉及多个安全领域；</li>\n<li>涉及多个中央部门；</li>\n<li>涉及中央和地方之间的协调；</li>\n<li>涉及军地关系；</li>\n<li>具有全局性或者战略性影响。</li>\n</ul>\n<p>这一职责在第四章得到进一步制度化。\n第45条规定国家建立国家安全重点领域工作协调机制；第48条规定跨部门会商工作机制；第49条规定中央与地方之间、部门之间、军地之间以及地区之间的协同联动机制。\n因此，可以将第5条的“统筹协调”理解为一种上位的组织要求，而第四章进一步建立不同类型的工作协调机制。</p>\n<p>可以简化为：</p>\n<p><strong>中央总体统筹</strong><br />\n↓<br />\n<strong>重点领域协调</strong><br />\n↓<br />\n<strong>跨部门会商</strong><br />\n↓<br />\n<strong>中央地方、部门、军地和地区协同联动</strong></p>\n<hr />\n<h4>第四，“推动国家安全法治建设”将制度建设纳入领导机构职责</h4>\n<p>本条最后规定“推动国家安全法治建设”。\n这一职责具有重要意义，因为它说明中央国家安全领导机构的工作并不局限于应对具体风险或者处理重大安全事件，还包括国家安全制度本身的建设和完善。\n第70条进一步规定：</p>\n<ul>\n<li><strong>第5条：</strong> 从中央国家安全领导机构的职责角度规定“推动国家安全法治建设”；</li>\n<li><strong>第70条：</strong> 从国家安全保障体系角度规定健全国家安全法律制度体系。\n两条共同说明，国家安全能力不仅表现为情报、资源、技术和应急处置能力，也包括建立和完善国家安全法律制度的能力。</li>\n</ul>\n<blockquote>\n<p>国家健全国家安全法律制度体系，推动国家安全法治建设。\n因此，第5条与第70条形成明显的体系联系：</p>\n</blockquote>\n<hr />\n<h3>四、法理与解释要点</h3>\n<h4>1. 本条首先属于组织职责规范，兼具授权与责任指向</h4>\n<p>第5条首先是一项<strong>组织法意义上的职责规范</strong>。它明确中央国家安全领导机构可以并应当在哪些事项上发挥作用，因此具有双重意义：\n一方面，它确定该机构开展国家安全决策、协调、战略和法治建设工作的职责依据；\n另一方面，它也明确这些重大国家安全事项在制度上应当有相应的决策、协调和推进主体。\n因此，在研究国家安全制度运行时，可以根据第5条进一步追问：</p>\n<ul>\n<li>重大国家安全事项是否进入相应的决策协调机制；</li>\n<li>国家安全战略是否形成相应实施安排；</li>\n<li>跨领域事务是否建立必要的统筹机制；</li>\n<li>国家安全法治建设是否形成制度性推进。\n但需要注意：</li>\n</ul>\n<blockquote>\n<p><strong>职责规范并不当然等于责任追究规范。</strong>\n第5条规定“负责什么”，并不能单独推导出违反职责以后承担何种具体法律责任。责任主体、构成条件和责任方式仍需要依据第46条等责任机制以及其他具体法律规范判断。</p>\n</blockquote>\n<hr />\n<h4>2. 领导机构的组织职责与具体国家机关的法定职权应当区分</h4>\n<p>第5条规定的是中央国家安全领导机构的决策、协调和统筹职责，并未规定完整的行政执法、刑事侦查或者强制措施权限。\n与之相比，《国家安全法》第42条明确规定国家安全机关、公安机关依法搜集涉及国家安全的情报信息，并依法行使侦查、拘留、预审、执行逮捕以及法律规定的其他职权；第43条又明确要求国家机关及其工作人员严格依法履行职责，不得超越、滥用职权。\n因此，应当区分：\n<strong>中央领导机构：决策、议事、战略、统筹协调</strong><br />\n↓<br />\n<strong>有关国家机关：依照法律承担具体国家安全职责</strong><br />\n↓<br />\n<strong>执法和强制措施：必须具有具体法律授权</strong>\n由此可以形成一个重要解释规则：</p>\n<blockquote>\n<p><strong>议事协调权限不能直接转化为行政执法或者强制措施权限。</strong></p>\n</blockquote>\n<hr />\n<h4>3. “推动国家安全法治建设”与行使国家立法权不是同一概念</h4>\n<p>第5条使用的是“<strong>推动</strong>国家安全法治建设”，而不是赋予中央国家安全领导机构制定国家法律的权力。\n现行宪法第58条明确规定，全国人民代表大会和全国人民代表大会常务委员会行使国家立法权；第62条、第67条进一步分别规定全国人大和全国人大常委会的有关立法权限。\n因此，“推动国家安全法治建设”可以包括：</p>\n<ul>\n<li>研究国家安全法治建设中的重大问题；</li>\n<li>推动国家安全法律制度不断健全；</li>\n<li>协调国家安全领域的制度建设；</li>\n<li>推动有关制度需求进入法定立法和规范制定程序。</li>\n</ul>\n<p>但这些研究、推动和协调活动不能替代宪法和法律规定的正式立法主体与立法程序。可以简化为：&gt; <strong>推动立法和法治建设 ≠ 直接行使国家立法权。</strong></p>\n<hr />\n<h4>4. “统筹协调”需要通过法定职责完成向具体行政行为的转化</h4>\n<p>第5条尤其值得研究的问题，是中央层面的决策协调如何进入具体执行阶段。\n国家安全领导机构可以进行重大事项决策、战略指导和跨部门协调，但最终涉及具体行政管理、执法、司法或者其他国家行为时，仍需要由具有相应法定职责的机关依法作出。\n这一过程可以概括为：</p>\n<p><strong>中央决策和协调</strong><br />\n↓<br />\n<strong>战略、政策和重大部署</strong><br />\n↓<br />\n<strong>按照法定职责分解任务</strong><br />\n↓<br />\n<strong>有关机关依法形成具体决定</strong><br />\n↓<br />\n<strong>实施、监督与责任追究</strong></p>\n<p>这一结构非常重要，因为它把第4条的“集中统一”与第43条的“严格依法履行职责”连接起来。换言之：</p>\n<blockquote>\n<p><strong>集中统一解决重大事项如何形成整体决策，法定职权解决具体决定由谁依法作出。</strong></p>\n</blockquote>\n<hr />\n<h4>5. 比较法的重点应当放在“功能链条”，而不只是机构名称</h4>\n<p>〔比较法〕《国家安全法释义》外国相关国家安全机构概括为咨询、协调、决策等不同功能类型，并指出不同功能之间可能存在交叉。这一比较思路具有启发意义。\n不同国家可能都设有名称类似“国家安全委员会”的机构，但机构名称相同并不意味着其法律地位、职权范围和运行方式相同。更有意义的比较是：\n<strong>谁提供信息和专业意见</strong><br />\n↓<br />\n<strong>谁提出政策建议</strong><br />\n↓<br />\n<strong>谁作出最终决定</strong><br />\n↓<br />\n<strong>谁负责组织协调</strong><br />\n↓<br />\n<strong>谁依法具体实施</strong><br />\n↓<br />\n<strong>谁承担相应责任</strong></p>\n<p>例如，美国国家安全委员会主要围绕总统形成国家安全政策咨询和跨部门协调机制。比较研究应进一步考察其宪制地位、与总统及行政部门之间的关系，而不宜仅因中美均存在“国家安全委员会”而进行制度等同。\n因此：&gt; <strong>比较国家安全组织制度，应当比较功能、权限和责任结构，而不应只比较机构名称。</strong></p>\n<hr />\n<h3>五、体系联系与学习提示</h3>\n<h4>（一）第4条、第5条和第6条的关系</h4>\n<p>这三条连续规定，但功能明显不同。</p>\n<h4>第4条：领导体制</h4>\n<p>回答：&gt; <strong>国家安全工作由谁领导，应建立什么样的领导体制？</strong>\n核心词：<strong>党的领导 + 集中统一、高效权威</strong></p>\n<h5>第5条：领导机构职责</h5>\n<p>回答：&gt; <strong>中央国家安全领导机构具体负责什么？</strong>\n核心词：<strong>决策协调 + 战略政策 + 重大事项统筹 + 法治建设</strong></p>\n<h5>第6条：国家安全战略</h5>\n<p>回答：&gt; <strong>国家安全战略本身应当如何制定和完善，主要包括什么内容？</strong>\n核心词：<strong>形势评估 + 指导方针 + 中长期目标 + 重点领域政策 + 工作任务和措施</strong></p>\n<p>因此可以记忆为：\n<strong>第4条：体制</strong><br />\n↓<br />\n<strong>第5条：主体与职责</strong><br />\n↓<br />\n<strong>第6条：战略</strong></p>\n<hr />\n<h4>（二）国家安全战略的制度闭环</h4>\n<p>第5条与第6条、第46条、第47条共同形成较为完整的战略机制：\n<strong>第5条：研究制定、指导实施战略</strong><br />\n↓<br />\n<strong>第6条：规定战略内容并不断完善</strong><br />\n↓<br />\n<strong>第47条：部门、地区采取有效措施贯彻实施</strong><br />\n↓<br />\n<strong>第46条：督促检查和责任追究</strong></p>\n<p>因此，在学习时不宜孤立理解第5条中的“指导实施”。</p>\n<p>其真正含义需要放在后续制度中理解：&gt; <strong>战略制定之后，还存在任务落实、贯彻实施、监督检查和责任机制。</strong></p>\n<hr />\n<h4>（三）国家安全法治建设的制度闭环</h4>\n<p>本条“推动国家安全法治建设”与第五章也形成体系联系：</p>\n<p><strong>第5条：中央国家安全领导机构推动法治建设</strong><br />\n↓<br />\n<strong>第70条：国家健全国家安全法律制度体系</strong><br />\n↓<br />\n<strong>具体立法：按照宪法和《立法法》等规定的权限和程序制定、修改</strong></p>\n<p>因此：</p>\n<blockquote>\n<p><strong>国家安全法治建设本身也必须通过法治方式推进。</strong></p>\n</blockquote>\n<hr />\n<h4>（四）区分四个容易混淆的概念</h4>\n<h5>1. 中央国家安全领导机构</h5>\n<p>本条中的职责主体。主要承担：<strong>决策、议事协调、战略、重大事项统筹、法治建设推动。</strong></p>\n<h5>2. 国家安全领导体制</h5>\n<p>第4条规定的国家安全工作整体组织结构。核心特征：<strong>集中统一、高效权威。</strong></p>\n<h5>3. 国家安全机关</h5>\n<p>依法承担特定国家安全专门职责的国家机关，具有有关法律明确规定的具体职权。</p>\n<h5>4. 国家安全工作协调机制</h5>\n<p>第45、48、49条等规定的重点领域协调、跨部门会商以及中央地方、部门、军地、地区之间的协同联动机制。\n因此：&gt; <strong>领导体制 ≠ 中央领导机构 ≠ 国家安全机关 ≠ 工作协调机制</strong></p>\n<hr />\n<h4>（五）易错点</h4>\n<p><strong>易错点1：中央国家安全领导机构就是一个具体国家安全执法机关。</strong>\n<strong>纠正：</strong> 第5条主要规定其决策、议事协调、战略、统筹和法治建设职责。具体执法职权需要依据有关机关的专门法律规定。</p>\n<hr />\n<p><strong>易错点2：“负责国家安全工作的决策”意味着所有国家安全事项都由中央国家安全领导机构直接作出决定。</strong>\n<strong>纠正：</strong> 本条应结合“重大事项”“重要工作”以及第三章国家机关职责规定理解。中央层面承担总体和重大事项决策协调，具体事项仍由有关机关依法处理。</p>\n<hr />\n<p><strong>易错点3：“研究制定国家安全战略”与“国家制定国家安全战略”相互矛盾。</strong>\n<strong>纠正：</strong> 第5条从中央国家安全领导机构职责角度规定“研究制定、指导实施”，第6条则从国家安全制度角度规定战略的制定、评估、内容和完善要求。二者属于不同规范层次。</p>\n<hr />\n<p><strong>易错点4：“推动国家安全法治建设”等于中央国家安全领导机构可以直接制定法律。</strong>\n<strong>纠正：</strong> “推动”属于研究、协调和制度建设职责。国家立法权以及法律的制定、修改和解释仍须按照宪法规定的主体、权限和程序进行。</p>\n<hr />\n<p><strong>易错点5：第5条已经规定了国家安全战略的全部实施机制。</strong>\n<strong>纠正：</strong> 第5条只规定“指导实施”。战略的具体落实还需要结合第46条的督促检查和责任追究机制、第47条的部门和地区贯彻实施义务以及其他工作机制理解。</p>\n<hr />\n<h3>六、研究问题</h3>\n<ol>\n<li><p><strong>议事协调结论如何转化为具有法律意义的具体决定？</strong><br />\n中央层面的重大国家安全决策和协调意见进入具体执行后，应如何通过各国家机关的法定职责和程序实现？</p>\n</li>\n<li><p><strong>“决策”和“议事协调”之间应如何区分？</strong><br />\n哪些事项属于中央层面的最终决策，哪些事项主要体现跨部门协调？二者在制度运行中如何衔接？</p>\n</li>\n<li><p><strong>国家安全战略的法律性质是什么？</strong><br />\n国家安全战略如何影响有关机关的行政决策和具体行为？其与法律、行政法规、部门规章以及政策文件之间是什么关系？</p>\n</li>\n<li><p><strong>如何评价国家安全战略的实施情况？</strong><br />\n第46条建立督促检查和责任追究机制后，应当以何种标准判断有关部门和地区是否充分履行贯彻实施国家安全战略的职责？</p>\n</li>\n<li><p><strong>“推动国家安全法治建设”应当包括哪些具体制度活动？</strong><br />\n除推动法律制定和修改外，是否还包括规范协调、执法机制建设、程序完善、权利保障以及法律实施评估等内容？</p>\n</li>\n<li><p><strong>跨部门国家安全事务如何实现责任可追溯？</strong><br />\n当一个重大事项经过多个部门共同研判和协调后，最终具体决定由谁作出、事实依据由谁审查、执行责任由谁承担，应如何形成清晰的责任链条？</p>\n</li>\n<li><p><strong>国家安全机构比较法研究应选择什么比较单位？</strong><br />\n是否应当从“机构名称比较”转向“信息—咨询—决策—协调—执行—监督—责任”的完整功能链条比较？</p>\n</li>\n</ol>"},{"num":6,"label":"第六条","title":"国家安全战略","lawText":"国家制定并不断完善国家安全战略，全面评估国际、国内安全形势，明确国家安全战略的指导方针、中长期目标、重点领域的国家安全政策、工作任务和措施。","calloutHtml":"<aside class=\"article-callout\"><div class=\"article-callout-title\">📌 条文速览</div><ul>\n<li><strong>持续义务：</strong> 国家不仅要制定国家安全战略，还应“不断完善”，说明战略具有持续调整和动态更新的特征。</li>\n<li><strong>认识基础：</strong> 战略制定以“全面评估国际、国内安全形势”为前提，要求同时观察外部环境和内部安全条件。</li>\n<li><strong>五项内容：</strong> 战略应明确<strong>指导方针、中长期目标、重点领域国家安全政策、工作任务和措施</strong>，形成从总体方向到具体行动的层次结构。</li>\n<li><strong>制度闭环：</strong> 第5条规定战略工作的领导职责，第6条规定战略形成与内容，第46—47条进一步建立督促落实和部门、地区贯彻实施机制。</li>\n<li><strong>规范边界：</strong> 国家安全战略能够确定优先方向并指导行动，但战略本身不能替代法律授权；涉及限制公民、组织权利的具体措施，仍须具有相应的法律依据。</li>\n</ul></aside>","frontHtml":"<div class=\"article-side article-front has-callout\"><div class=\"article-label\">第六条</div><p class=\"article-law-text\">国家制定并不断完善国家安全战略，全面评估国际、国内安全形势，明确国家安全战略的指导方针、中长期目标、重点领域的国家安全政策、工作任务和措施。</p><aside class=\"article-callout\"><div class=\"article-callout-title\">📌 条文速览</div><ul>\n<li><strong>持续义务：</strong> 国家不仅要制定国家安全战略，还应“不断完善”，说明战略具有持续调整和动态更新的特征。</li>\n<li><strong>认识基础：</strong> 战略制定以“全面评估国际、国内安全形势”为前提，要求同时观察外部环境和内部安全条件。</li>\n<li><strong>五项内容：</strong> 战略应明确<strong>指导方针、中长期目标、重点领域国家安全政策、工作任务和措施</strong>，形成从总体方向到具体行动的层次结构。</li>\n<li><strong>制度闭环：</strong> 第5条规定战略工作的领导职责，第6条规定战略形成与内容，第46—47条进一步建立督促落实和部门、地区贯彻实施机制。</li>\n<li><strong>规范边界：</strong> 国家安全战略能够确定优先方向并指导行动，但战略本身不能替代法律授权；涉及限制公民、组织权利的具体措施，仍须具有相应的法律依据。</li>\n</ul></aside></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第六条</div><p class=\"article-law-text\">国家制定并不断完善国家安全战略，全面评估国际、国内安全形势，明确国家安全战略的指导方针、中长期目标、重点领域的国家安全政策、工作任务和措施。</p><div class=\"article-note-divider\">国家安全战略 · MD 研读笔记</div><div class=\"article-notes\"><p>本条规定国家安全战略的<strong>制定与完善、形势评估以及基本内容</strong>。与第5条侧重中央国家安全领导机构“研究制定、指导实施”国家安全战略不同，第6条从国家安全制度本身出发，确立国家制定和持续完善国家安全战略的要求，并规定战略形成应当建立在国际、国内安全形势评估基础之上。现行《国家安全法》第6条仍保持这一规定。</p>\n<hr />\n<h3>二、立法沿革</h3>\n<h4>1. 2015年《国家安全战略纲要》先于本法通过</h4>\n<p>国家安全战略制度在《国家安全法》制定前已经进入实践层面。\n2015年1月23日，中共中央政治局会议审议通过《国家安全战略纲要》。会议指出，面对国际形势变化、国内改革发展以及各类安全风险，制定和实施国家安全战略纲要具有现实必要性。该战略纲要的形成早于2015年7月《国家安全法》的通过，说明国家安全战略实践与综合性国家安全立法是在相互衔接的过程中逐步形成的。</p>\n<h4>2. 草案原将国家安全战略置于具体制度章节</h4>\n<p>国家安全法草案原在<strong>第四章第二节</strong>规定“国家安全战略”。\n2015年4月20日关于草案修改情况的汇报提出，国家安全战略涉及一个时期维护国家安全的方针政策和目标任务，属于维护国家安全的<strong>顶层设计和管全局的安排</strong>，因此建议将制定国家安全战略的规定从第四章移至总则。这一调整具有明显的体系意义：</p>\n<blockquote>\n<p><strong>国家安全战略由一项具体国家安全制度，上升为统摄整部法律实施的总则性制度。</strong>\n换言之，战略并不只是第四章众多工作机制中的一种，而是国家安全任务、国家机关职责和具体国家安全制度运行的重要总体依据。</p>\n</blockquote>\n<h4>3. 前移总则的同时进一步明确战略内容</h4>\n<p>草案修改并非只是改变条文位置。根据立法释义书记载，在将国家安全战略前移至总则的同时，还进一步明确了战略的主要内容，包括：</p>\n<ul>\n<li>指导方针；</li>\n<li>中长期目标；</li>\n<li>重点领域的国家安全政策；</li>\n<li>工作任务；</li>\n<li>措施。\n同时增加“全面评估国际、国内安全形势”的要求，最终形成现行第6条的基本结构。\n因此，本条的形成过程可以概括为：</li>\n</ul>\n<p><strong>战略实践先行</strong><br />\n↓<br />\n<strong>草案设置专节</strong><br />\n↓<br />\n<strong>认识到其顶层设计性质</strong><br />\n↓<br />\n<strong>前移总则</strong><br />\n↓<br />\n<strong>细化形势评估和战略内容</strong></p>\n<h4>4. 后续实践进一步体现“不断完善”的动态要求</h4>\n<p>2021年11月18日，中共中央政治局会议审议《国家安全战略（2021—2025年）》。公开材料显示，该战略进一步对相应时期国家安全工作作出总体部署。\n这一材料可以作为理解第6条“不断完善国家安全战略”的后续实践例证。\n但需要注意时间限定：&gt; <strong>《国家安全战略（2021—2025年）》是具有明确期间范围的历史材料。</strong>\n因此，在2026年的学习和研究中，可以用它说明国家安全战略持续制定、调整和完善的实践，但不宜将其表述为仍然覆盖当前时期的现行五年战略。</p>\n<hr />\n<h3>三、主要内容</h3>\n<h4>第一，“制定并不断完善”表明国家安全战略具有动态性</h4>\n<p>第6条并非只规定国家“制定”国家安全战略，而是在其后特别增加“<strong>不断完善</strong>”。\n这意味着，国家安全战略不是制定完成后长期保持不变的静态文本。\n国家安全环境本身处于持续变化之中：</p>\n<ul>\n<li>国际安全格局可能变化；</li>\n<li>新技术可能产生新的风险和能力；</li>\n<li>国家利益和发展阶段可能发生变化；</li>\n<li>原有安全政策实施后可能产生新的经验和问题。\n因此，国家安全战略需要根据安全环境和国家实际情况不断调整。</li>\n</ul>\n<p>从规范结构看，可以将其理解为：<strong>战略制定 → 战略实施 → 环境和效果变化 → 重新评估 → 战略完善</strong></p>\n<p>但需要注意：&gt; <strong>“不断完善”不等于法律规定必须每隔固定期限重新制定一次国家安全战略。</strong>\n第6条本身并未规定年度、五年或者其他固定的战略更新周期。因此，应当区分“持续完善的法律要求”与“具体战略文件自行确定的时间范围”。</p>\n<hr />\n<h4>第二，“全面评估国际、国内安全形势”是战略形成的认识基础</h4>\n<p>国家安全战略首先建立在对安全形势的判断之上。第6条明确要求同时评估：\n<strong>国际安全形势 + 国内安全形势</strong>\n这一规定与第8条统筹内部安全和外部安全的要求具有体系上的联系。\n国际环境可能影响国家主权、经济运行、能源资源、产业链、科技发展以及海外利益；国内经济社会发展、技术能力、资源条件和社会运行状况同样构成国家安全战略形成的重要背景。\n因此，国家安全战略不能只根据外部威胁制定，也不能只从国内问题出发，而需要进行综合判断。\n〔笔记分析〕进一步而言，战略评估至少可以关注两个方向：</p>\n<ul>\n<li><strong>风险和威胁：</strong> 面临哪些现实或者潜在的安全风险；</li>\n<li><strong>自身条件：</strong> 国家具有何种应对能力、资源条件和发展需求。\n前者回答“面临什么问题”，后者回答“具备什么条件解决问题”。\n需要说明的是，“风险—能力”属于根据本条进行的分析性归纳，并非第6条逐字列明的两项法定评估程序。</li>\n</ul>\n<hr />\n<h4>第三，国家安全战略具有从总体方向到具体行动的层次结构</h4>\n<p>第6条列举了国家安全战略应当明确的基本内容。</p>\n<table>\n<thead>\n<tr>\n  <th>战略内容</th>\n  <th>基本功能</th>\n  <th>主要回答的问题</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td><strong>指导方针</strong></td>\n  <td>确定国家安全战略的总体方向和基本取向</td>\n  <td>按照什么原则行动</td>\n</tr>\n<tr>\n  <td><strong>中长期目标</strong></td>\n  <td>确定一定时期希望实现的国家安全状态</td>\n  <td>希望达到什么目标</td>\n</tr>\n<tr>\n  <td><strong>重点领域国家安全政策</strong></td>\n  <td>确定重点领域中的政策安排和优先事项</td>\n  <td>重点在哪里</td>\n</tr>\n<tr>\n  <td><strong>工作任务</strong></td>\n  <td>将战略目标转化为需要完成的工作</td>\n  <td>具体做什么</td>\n</tr>\n<tr>\n  <td><strong>措施</strong></td>\n  <td>为完成战略任务配置相应行动方式</td>\n  <td>如何实现</td>\n</tr>\n</tbody>\n</table>\n<p>因此，本条并非只要求战略提出抽象目标，而是要求战略形成从总体方向到实际行动的完整结构：</p>\n<p><strong>指导方针</strong><br />\n↓<br />\n<strong>中长期目标</strong><br />\n↓<br />\n<strong>重点领域政策</strong><br />\n↓<br />\n<strong>工作任务</strong><br />\n↓<br />\n<strong>具体措施</strong></p>\n<p>这一结构使国家安全战略具有连接总体国家安全观与具体国家安全工作的功能。</p>\n<hr />\n<h4>第四，“中长期目标”体现战略与日常安全工作的区别</h4>\n<p>“中长期目标”是国家安全战略区别于一般工作部署的重要特征。\n国家安全战略并不只是针对某一次风险或者某一项短期任务作出安排，而需要从较长时间尺度判断：</p>\n<ul>\n<li>国家面临什么样的战略安全环境；</li>\n<li>哪些国家安全能力需要持续建设；</li>\n<li>哪些重点领域需要提前布局；</li>\n<li>希望形成何种稳定、持续的国家安全状态。\n因此，国家安全战略具有较强的<strong>前瞻性和统筹性</strong>。\n而具体风险预案、应急处置或者阶段性工作方案，则更直接面对具体风险和现实任务。\n这也有助于理解第6条与第四章有关风险制度之间的区别。</li>\n</ul>\n<hr />\n<h4>第五，战略实施需要后续法律制度形成执行闭环</h4>\n<p>第6条主要规定战略本身，并没有穷尽战略如何实施。《国家安全法》通过其他条文建立相应的实施机制。\n第5条规定中央国家安全领导机构<strong>研究制定、指导实施国家安全战略</strong>；第46条规定建立国家安全工作督促检查和责任追究机制，以确保国家安全战略和重大部署贯彻落实；第47条进一步要求各部门、各地区采取有效措施贯彻实施国家安全战略。\n因此，可以形成一条较为清晰的战略运行链条：</p>\n<p><strong>第5条：研究制定、指导实施</strong><br />\n↓<br />\n<strong>第6条：评估形势、确定战略内容</strong><br />\n↓<br />\n<strong>第47条：各部门、各地区贯彻实施</strong><br />\n↓<br />\n<strong>第46条：督促检查与责任追究</strong><br />\n↓<br />\n<strong>重新评估并不断完善战略</strong></p>\n<p>这使国家安全战略从规划性文本进一步进入实际国家安全工作。</p>\n<hr />\n<h3>四、法理与解释要点</h3>\n<h4>1. 国家安全战略具有重要指导作用，但不是具体强制权力的独立来源〔笔记分析〕</h4>\n<p>国家安全战略能够：</p>\n<ul>\n<li>确定国家安全工作的优先方向；</li>\n<li>引导重点领域政策；</li>\n<li>协调不同部门行动；</li>\n<li>影响资源和能力建设；</li>\n<li>为具体国家安全制度的实施提供战略背景。\n但应当区分<strong>战略依据</strong>与<strong>法律依据</strong>。\n国家安全战略可以说明国家为什么优先处理某一风险，也可以指导有关国家机关确定工作重点，但如果国家机关进一步采取搜查、扣押、限制活动、行政处罚或者其他影响公民和组织权利的具体措施，仍须查明相应的法律授权、实体条件和程序要求。\n因此：&gt; <strong>战略可以指导权力行使，但不能自行创设法律未规定的公权力。</strong>\n这一解释也与第43条要求国家机关及其工作人员严格依法履行职责、不得超越和滥用职权相一致。</li>\n</ul>\n<hr />\n<h4>2. 国家安全战略与国家安全风险评估属于不同层次</h4>\n<p>第6条要求“全面评估国际、国内安全形势”，第四章第56条则另外规定国家建立国家安全风险评估机制，定期开展各领域国家安全风险调查评估，并要求有关部门定期向中央国家安全领导机构提交风险评估报告。\n二者存在联系，但不能简单等同。可以初步区分：\n<strong>第6条的形势评估：</strong></p>\n<ul>\n<li>服务于国家安全战略；</li>\n<li>具有总体性和宏观性；</li>\n<li>同时考察国际、国内安全形势。\n<strong>第56条的风险评估：</strong></li>\n<li>属于第四章具体国家安全制度；</li>\n<li>具有常态化、制度化特征；</li>\n<li>重点围绕各领域国家安全风险展开。\n二者可以形成互动：\n<strong>具体风险评估提供信息</strong><br />\n↓<br />\n<strong>综合形成国家安全形势判断</strong><br />\n↓<br />\n<strong>影响国家安全战略制定和调整</strong></li>\n</ul>\n<hr />\n<h4>3. “不断完善”可以形成一个动态战略分析框架〔笔记分析〕</h4>\n<p>结合第6条与第46、47、56条，可以将国家安全战略的运行归纳为：\n<strong>形势识别 → 目标选择 → 政策和任务安排 → 实施 → 反馈评估 → 战略调整</strong>\n这一框架能够帮助分析一个国家安全战略是否真正形成动态治理过程。\n其中：</p>\n<ul>\n<li><strong>形势识别</strong>对应国际、国内安全形势评估；</li>\n<li><strong>目标选择</strong>对应指导方针和中长期目标；</li>\n<li><strong>政策安排</strong>对应重点领域国家安全政策、任务和措施；</li>\n<li><strong>实施</strong>对应各部门、各地区贯彻战略；</li>\n<li><strong>反馈</strong>来自风险评估、督促检查以及现实安全形势变化；</li>\n<li><strong>调整</strong>则体现“不断完善”。\n需要注意：</li>\n</ul>\n<blockquote>\n<p>这是依据多个条文归纳形成的分析模型，不是法律规定</p>\n</blockquote>\n<hr />\n<h4>4. 战略调整与执行措施调整需要区分〔笔记分析〕</h4>\n<p>并非每一次安全环境变化都需要重新制定国家安全战略。国家安全战略通常确定较长时期的基本判断、总体方向和中长期目标，而具体政策和执行措施可以根据短期变化进行调整。\n因此，在判断国家安全战略是否需要改变时，可以区分两个层次：\n<strong>如果总体安全环境、重大国家利益或者中长期目标发生明显变化</strong><br />\n→ 可能需要调整战略本身。</p>\n<p><strong>如果总体目标基本稳定，只是具体风险、技术条件或者实施环境发生变化</strong><br />\n→ 可以主要调整政策、工作任务或者具体措施。</p>\n<p>这一分析有助于解释为什么第6条既规定相对稳定的“中长期目标”，又要求“不断完善”战略。</p>\n<hr />\n<h4>5. 比较法：美国国家安全战略报告强调制定主体、报告周期与国会说明</h4>\n<p>美国现行《美国法典》第50编第3043节源自《1947年国家安全法》第108节，规定总统向国会提交国家安全战略报告，并规定报告应当说明国家安全利益和目标、实现战略所需要的外交与国防能力、国家力量的短期和长期运用以及现有能力能否支撑战略等内容；该条同时规定有关报告具有机密和非机密形式。\n这一制度与我国第6条可以围绕以下问题进行功能比较：</p>\n<ul>\n<li>战略由谁制定；</li>\n<li>战略包含什么内容；</li>\n<li>是否具有明确的评估和更新周期；</li>\n<li>战略向谁进行说明或者报告；</li>\n<li>如何判断目标与国家能力是否匹配；</li>\n<li>如何处理战略信息的公开与保密。\n但两种制度的规范结构并不相同。</li>\n</ul>\n<p>尤其需要注意：</p>\n<blockquote>\n<p><strong>我国《国家安全法》第6条没有规定美国法意义上的年度向立法机关提交国家安全战略报告的义务。</strong>\n因此，美国有关年度报告、提交时间和报告形式的规定可以作为比较法材料，但不能作为解释我国第6条程序要求的直接依据。</p>\n</blockquote>\n<hr />\n<h3>五、体系联系与学习提示</h3>\n<h4>（一）第5条与第6条的区别</h4>\n<p>两条都出现“国家安全战略”，但规范重点不同。</p>\n<h5>第5条：谁负责战略工作</h5>\n<p>核心表述：</p>\n<blockquote>\n<p>“研究制定、指导实施国家安全战略”\n回答的是：<strong>谁在中央层面承担战略工作的领导和协调职责。</strong></p>\n</blockquote>\n<h5>第6条：战略如何形成、包括什么</h5>\n<p>核心表述：</p>\n<blockquote>\n<p>“制定并不断完善”“全面评估”“明确……”\n回答的是：<strong>国家安全战略应当建立在什么基础上，以及战略应包含哪些主要内容。</strong>\n因此：</p>\n</blockquote>\n<p><strong>第5条：主体和职责</strong><br />\n↓<br />\n<strong>第6条：战略形成和内容</strong></p>\n<hr />\n<h4>（二）区分四个相关概念</h4>\n<h5>1. 国家安全战略</h5>\n<p>第6条规定。主要解决国家安全工作的：<strong>总体方向 + 中长期目标 + 重点政策 + 工作任务和措施</strong></p>\n<h5>2. 国家安全重大方针政策</h5>\n<p>第5条与国家安全战略并列规定。政策通常比总体战略更加具体，是将战略要求转化为国家安全工作安排的重要方式。</p>\n<h5>3. 国家安全风险评估</h5>\n<p>第56条规定。主要通过定期调查评估具体国家安全风险，为国家安全决策和风险治理提供信息基础。</p>\n<h5>4. 国家安全风险预案</h5>\n<p>第55条规定国家制定完善应对各领域国家安全风险预案。预案更直接面向具体风险发生后的预防、应对和处置准备。\n因此，可以简单记忆为：</p>\n<p><strong>战略：确定总体方向</strong><br />\n↓<br />\n<strong>政策：落实战略安排</strong><br />\n↓<br />\n<strong>风险评估：识别和判断具体风险</strong><br />\n↓<br />\n<strong>预案：准备如何应对风险</strong></p>\n<hr />\n<h4>（三）国家安全战略的实施闭环</h4>\n<p>可以将相关条文串联起来：\n<strong>第5条：研究制定、指导实施战略</strong><br />\n↓<br />\n<strong>第6条：评估形势，明确战略内容</strong><br />\n↓<br />\n<strong>第56条：持续提供风险评估信息</strong><br />\n↓<br />\n<strong>第47条：部门和地区贯彻实施</strong><br />\n↓<br />\n<strong>第46条：督促检查和责任追究</strong><br />\n↓<br />\n<strong>第6条：根据形势不断完善</strong></p>\n<hr />\n<h4>（四）关于战略公开范围</h4>\n<p>第6条本身没有规定国家安全战略应当以何种形式公开，也没有规定国家安全战略全部属于保密信息。因此，不能从本条推出：</p>\n<blockquote>\n<p>“国家安全战略全文必须公开”</p>\n</blockquote>\n<p>也不能反向推出：</p>\n<blockquote>\n<p>“国家安全战略及其全部信息当然保密”。</p>\n</blockquote>\n<p>具体战略信息能否公开、公开至何种程度，应根据相关国家秘密、政府信息公开以及具体文件的性质分别判断。\n比较而言，美国第50编第3043节明确要求国家安全战略报告具有机密和非机密形式，这恰好说明战略公开程度本身可以由具体制度另外规定。</p>\n<hr />\n<h4>（五）历史比较材料</h4>\n<p>法工委版本《中华人民共和国国家安全法释义》对美国、俄罗斯、日本等国家安全战略进行了较多介绍。</p>\n<hr />\n<h4>（六）易错点</h4>\n<p><strong>易错点1：国家制定一次国家安全战略以后即可长期不变。</strong>\n<strong>纠正：</strong> 第6条明确规定“制定并不断完善”，说明战略具有动态调整要求。</p>\n<hr />\n<p><strong>易错点2：“不断完善”意味着国家必须每年重新制定国家安全战略。</strong>\n<strong>纠正：</strong> 第6条没有规定固定更新周期。“不断完善”是一项持续性要求，不等于法定年度更新义务。</p>\n<hr />\n<p><strong>易错点3：国家安全战略就是对国家安全风险的预测。</strong>\n<strong>纠正：</strong> 形势评估只是战略形成的基础。国家安全战略还必须明确指导方针、中长期目标、重点领域政策、工作任务和措施。</p>\n<hr />\n<p><strong>易错点4：战略规定某项工作重要，就当然可以采取必要的强制措施。</strong>\n<strong>纠正：</strong> 战略确定工作方向，并不能代替具体法律授权。国家机关采取影响公民、组织权利的措施仍须具有明确法律依据。</p>\n<hr />\n<p><strong>易错点5：第6条已经完整规定了国家安全战略的实施机制。</strong>\n<strong>纠正：</strong> 第6条主要规定战略形成和内容，实施还需要结合第5条、第46条、第47条以及其他国家安全工作机制理解。</p>\n<hr />\n<p><strong>易错点6：《国家安全战略（2021—2025年）》仍是2026年当前五年战略。</strong>\n<strong>纠正：</strong> 该文件标题本身限定为2021—2025年。在没有新的可靠材料支持时，应当将其作为此前战略实践材料，而不能延伸其时间效力。</p>\n<hr />\n<h3>六、研究问题</h3>\n<ol>\n<li><p><strong>国家安全战略的法律性质如何界定？</strong><br />\n它与法律法规、国家安全政策以及具体行政决定之间分别是什么关系？战略能够对具体国家机关产生何种规范性影响？</p>\n</li>\n<li><p><strong>“不断完善”应当以什么作为战略调整标准？</strong><br />\n国际环境变化、国家利益变化、风险程度变化以及国家能力变化达到何种程度时，需要调整国家安全战略本身？</p>\n</li>\n<li><p><strong>战略调整与执行措施调整如何区分？</strong><br />\n在中长期目标保持稳定而短期风险快速变化时，应当修改战略，还是主要通过调整重点政策、任务和具体措施予以应对？</p>\n</li>\n<li><p><strong>如何评价国家安全战略的实施效果？</strong><br />\n除是否完成既定工作任务之外，是否还应评价风险是否降低、安全能力是否提高以及战略目标与资源配置是否匹配？</p>\n</li>\n<li><p><strong>国家安全风险评估如何进入战略制定过程？</strong><br />\n第56条形成的各领域风险评估信息，如何汇总并转化为第6条意义上的国际、国内安全形势综合判断？</p>\n</li>\n<li><p><strong>国家安全战略的公开与保密边界如何确定？</strong><br />\n战略需要发挥政策引导和社会动员功能，同时又可能涉及敏感安全信息。哪些内容适合公开、哪些内容需要保护，应依据何种规范进行区分？</p>\n</li>\n<li><p><strong>如何建立国家安全战略的比较法分析框架？</strong><br />\n与其只比较各国战略文件内容，是否更适合围绕“<strong>制定主体—形势评估—目标设定—能力配置—实施机制—监督反馈—更新机制</strong>”进行制度比较？</p>\n</li>\n</ol></div></div>","notesHtml":"<p>本条规定国家安全战略的<strong>制定与完善、形势评估以及基本内容</strong>。与第5条侧重中央国家安全领导机构“研究制定、指导实施”国家安全战略不同，第6条从国家安全制度本身出发，确立国家制定和持续完善国家安全战略的要求，并规定战略形成应当建立在国际、国内安全形势评估基础之上。现行《国家安全法》第6条仍保持这一规定。</p>\n<hr />\n<h3>二、立法沿革</h3>\n<h4>1. 2015年《国家安全战略纲要》先于本法通过</h4>\n<p>国家安全战略制度在《国家安全法》制定前已经进入实践层面。\n2015年1月23日，中共中央政治局会议审议通过《国家安全战略纲要》。会议指出，面对国际形势变化、国内改革发展以及各类安全风险，制定和实施国家安全战略纲要具有现实必要性。该战略纲要的形成早于2015年7月《国家安全法》的通过，说明国家安全战略实践与综合性国家安全立法是在相互衔接的过程中逐步形成的。</p>\n<h4>2. 草案原将国家安全战略置于具体制度章节</h4>\n<p>国家安全法草案原在<strong>第四章第二节</strong>规定“国家安全战略”。\n2015年4月20日关于草案修改情况的汇报提出，国家安全战略涉及一个时期维护国家安全的方针政策和目标任务，属于维护国家安全的<strong>顶层设计和管全局的安排</strong>，因此建议将制定国家安全战略的规定从第四章移至总则。这一调整具有明显的体系意义：</p>\n<blockquote>\n<p><strong>国家安全战略由一项具体国家安全制度，上升为统摄整部法律实施的总则性制度。</strong>\n换言之，战略并不只是第四章众多工作机制中的一种，而是国家安全任务、国家机关职责和具体国家安全制度运行的重要总体依据。</p>\n</blockquote>\n<h4>3. 前移总则的同时进一步明确战略内容</h4>\n<p>草案修改并非只是改变条文位置。根据立法释义书记载，在将国家安全战略前移至总则的同时，还进一步明确了战略的主要内容，包括：</p>\n<ul>\n<li>指导方针；</li>\n<li>中长期目标；</li>\n<li>重点领域的国家安全政策；</li>\n<li>工作任务；</li>\n<li>措施。\n同时增加“全面评估国际、国内安全形势”的要求，最终形成现行第6条的基本结构。\n因此，本条的形成过程可以概括为：</li>\n</ul>\n<p><strong>战略实践先行</strong><br />\n↓<br />\n<strong>草案设置专节</strong><br />\n↓<br />\n<strong>认识到其顶层设计性质</strong><br />\n↓<br />\n<strong>前移总则</strong><br />\n↓<br />\n<strong>细化形势评估和战略内容</strong></p>\n<h4>4. 后续实践进一步体现“不断完善”的动态要求</h4>\n<p>2021年11月18日，中共中央政治局会议审议《国家安全战略（2021—2025年）》。公开材料显示，该战略进一步对相应时期国家安全工作作出总体部署。\n这一材料可以作为理解第6条“不断完善国家安全战略”的后续实践例证。\n但需要注意时间限定：&gt; <strong>《国家安全战略（2021—2025年）》是具有明确期间范围的历史材料。</strong>\n因此，在2026年的学习和研究中，可以用它说明国家安全战略持续制定、调整和完善的实践，但不宜将其表述为仍然覆盖当前时期的现行五年战略。</p>\n<hr />\n<h3>三、主要内容</h3>\n<h4>第一，“制定并不断完善”表明国家安全战略具有动态性</h4>\n<p>第6条并非只规定国家“制定”国家安全战略，而是在其后特别增加“<strong>不断完善</strong>”。\n这意味着，国家安全战略不是制定完成后长期保持不变的静态文本。\n国家安全环境本身处于持续变化之中：</p>\n<ul>\n<li>国际安全格局可能变化；</li>\n<li>新技术可能产生新的风险和能力；</li>\n<li>国家利益和发展阶段可能发生变化；</li>\n<li>原有安全政策实施后可能产生新的经验和问题。\n因此，国家安全战略需要根据安全环境和国家实际情况不断调整。</li>\n</ul>\n<p>从规范结构看，可以将其理解为：<strong>战略制定 → 战略实施 → 环境和效果变化 → 重新评估 → 战略完善</strong></p>\n<p>但需要注意：&gt; <strong>“不断完善”不等于法律规定必须每隔固定期限重新制定一次国家安全战略。</strong>\n第6条本身并未规定年度、五年或者其他固定的战略更新周期。因此，应当区分“持续完善的法律要求”与“具体战略文件自行确定的时间范围”。</p>\n<hr />\n<h4>第二，“全面评估国际、国内安全形势”是战略形成的认识基础</h4>\n<p>国家安全战略首先建立在对安全形势的判断之上。第6条明确要求同时评估：\n<strong>国际安全形势 + 国内安全形势</strong>\n这一规定与第8条统筹内部安全和外部安全的要求具有体系上的联系。\n国际环境可能影响国家主权、经济运行、能源资源、产业链、科技发展以及海外利益；国内经济社会发展、技术能力、资源条件和社会运行状况同样构成国家安全战略形成的重要背景。\n因此，国家安全战略不能只根据外部威胁制定，也不能只从国内问题出发，而需要进行综合判断。\n〔笔记分析〕进一步而言，战略评估至少可以关注两个方向：</p>\n<ul>\n<li><strong>风险和威胁：</strong> 面临哪些现实或者潜在的安全风险；</li>\n<li><strong>自身条件：</strong> 国家具有何种应对能力、资源条件和发展需求。\n前者回答“面临什么问题”，后者回答“具备什么条件解决问题”。\n需要说明的是，“风险—能力”属于根据本条进行的分析性归纳，并非第6条逐字列明的两项法定评估程序。</li>\n</ul>\n<hr />\n<h4>第三，国家安全战略具有从总体方向到具体行动的层次结构</h4>\n<p>第6条列举了国家安全战略应当明确的基本内容。</p>\n<table>\n<thead>\n<tr>\n  <th>战略内容</th>\n  <th>基本功能</th>\n  <th>主要回答的问题</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td><strong>指导方针</strong></td>\n  <td>确定国家安全战略的总体方向和基本取向</td>\n  <td>按照什么原则行动</td>\n</tr>\n<tr>\n  <td><strong>中长期目标</strong></td>\n  <td>确定一定时期希望实现的国家安全状态</td>\n  <td>希望达到什么目标</td>\n</tr>\n<tr>\n  <td><strong>重点领域国家安全政策</strong></td>\n  <td>确定重点领域中的政策安排和优先事项</td>\n  <td>重点在哪里</td>\n</tr>\n<tr>\n  <td><strong>工作任务</strong></td>\n  <td>将战略目标转化为需要完成的工作</td>\n  <td>具体做什么</td>\n</tr>\n<tr>\n  <td><strong>措施</strong></td>\n  <td>为完成战略任务配置相应行动方式</td>\n  <td>如何实现</td>\n</tr>\n</tbody>\n</table>\n<p>因此，本条并非只要求战略提出抽象目标，而是要求战略形成从总体方向到实际行动的完整结构：</p>\n<p><strong>指导方针</strong><br />\n↓<br />\n<strong>中长期目标</strong><br />\n↓<br />\n<strong>重点领域政策</strong><br />\n↓<br />\n<strong>工作任务</strong><br />\n↓<br />\n<strong>具体措施</strong></p>\n<p>这一结构使国家安全战略具有连接总体国家安全观与具体国家安全工作的功能。</p>\n<hr />\n<h4>第四，“中长期目标”体现战略与日常安全工作的区别</h4>\n<p>“中长期目标”是国家安全战略区别于一般工作部署的重要特征。\n国家安全战略并不只是针对某一次风险或者某一项短期任务作出安排，而需要从较长时间尺度判断：</p>\n<ul>\n<li>国家面临什么样的战略安全环境；</li>\n<li>哪些国家安全能力需要持续建设；</li>\n<li>哪些重点领域需要提前布局；</li>\n<li>希望形成何种稳定、持续的国家安全状态。\n因此，国家安全战略具有较强的<strong>前瞻性和统筹性</strong>。\n而具体风险预案、应急处置或者阶段性工作方案，则更直接面对具体风险和现实任务。\n这也有助于理解第6条与第四章有关风险制度之间的区别。</li>\n</ul>\n<hr />\n<h4>第五，战略实施需要后续法律制度形成执行闭环</h4>\n<p>第6条主要规定战略本身，并没有穷尽战略如何实施。《国家安全法》通过其他条文建立相应的实施机制。\n第5条规定中央国家安全领导机构<strong>研究制定、指导实施国家安全战略</strong>；第46条规定建立国家安全工作督促检查和责任追究机制，以确保国家安全战略和重大部署贯彻落实；第47条进一步要求各部门、各地区采取有效措施贯彻实施国家安全战略。\n因此，可以形成一条较为清晰的战略运行链条：</p>\n<p><strong>第5条：研究制定、指导实施</strong><br />\n↓<br />\n<strong>第6条：评估形势、确定战略内容</strong><br />\n↓<br />\n<strong>第47条：各部门、各地区贯彻实施</strong><br />\n↓<br />\n<strong>第46条：督促检查与责任追究</strong><br />\n↓<br />\n<strong>重新评估并不断完善战略</strong></p>\n<p>这使国家安全战略从规划性文本进一步进入实际国家安全工作。</p>\n<hr />\n<h3>四、法理与解释要点</h3>\n<h4>1. 国家安全战略具有重要指导作用，但不是具体强制权力的独立来源〔笔记分析〕</h4>\n<p>国家安全战略能够：</p>\n<ul>\n<li>确定国家安全工作的优先方向；</li>\n<li>引导重点领域政策；</li>\n<li>协调不同部门行动；</li>\n<li>影响资源和能力建设；</li>\n<li>为具体国家安全制度的实施提供战略背景。\n但应当区分<strong>战略依据</strong>与<strong>法律依据</strong>。\n国家安全战略可以说明国家为什么优先处理某一风险，也可以指导有关国家机关确定工作重点，但如果国家机关进一步采取搜查、扣押、限制活动、行政处罚或者其他影响公民和组织权利的具体措施，仍须查明相应的法律授权、实体条件和程序要求。\n因此：&gt; <strong>战略可以指导权力行使，但不能自行创设法律未规定的公权力。</strong>\n这一解释也与第43条要求国家机关及其工作人员严格依法履行职责、不得超越和滥用职权相一致。</li>\n</ul>\n<hr />\n<h4>2. 国家安全战略与国家安全风险评估属于不同层次</h4>\n<p>第6条要求“全面评估国际、国内安全形势”，第四章第56条则另外规定国家建立国家安全风险评估机制，定期开展各领域国家安全风险调查评估，并要求有关部门定期向中央国家安全领导机构提交风险评估报告。\n二者存在联系，但不能简单等同。可以初步区分：\n<strong>第6条的形势评估：</strong></p>\n<ul>\n<li>服务于国家安全战略；</li>\n<li>具有总体性和宏观性；</li>\n<li>同时考察国际、国内安全形势。\n<strong>第56条的风险评估：</strong></li>\n<li>属于第四章具体国家安全制度；</li>\n<li>具有常态化、制度化特征；</li>\n<li>重点围绕各领域国家安全风险展开。\n二者可以形成互动：\n<strong>具体风险评估提供信息</strong><br />\n↓<br />\n<strong>综合形成国家安全形势判断</strong><br />\n↓<br />\n<strong>影响国家安全战略制定和调整</strong></li>\n</ul>\n<hr />\n<h4>3. “不断完善”可以形成一个动态战略分析框架〔笔记分析〕</h4>\n<p>结合第6条与第46、47、56条，可以将国家安全战略的运行归纳为：\n<strong>形势识别 → 目标选择 → 政策和任务安排 → 实施 → 反馈评估 → 战略调整</strong>\n这一框架能够帮助分析一个国家安全战略是否真正形成动态治理过程。\n其中：</p>\n<ul>\n<li><strong>形势识别</strong>对应国际、国内安全形势评估；</li>\n<li><strong>目标选择</strong>对应指导方针和中长期目标；</li>\n<li><strong>政策安排</strong>对应重点领域国家安全政策、任务和措施；</li>\n<li><strong>实施</strong>对应各部门、各地区贯彻战略；</li>\n<li><strong>反馈</strong>来自风险评估、督促检查以及现实安全形势变化；</li>\n<li><strong>调整</strong>则体现“不断完善”。\n需要注意：</li>\n</ul>\n<blockquote>\n<p>这是依据多个条文归纳形成的分析模型，不是法律规定</p>\n</blockquote>\n<hr />\n<h4>4. 战略调整与执行措施调整需要区分〔笔记分析〕</h4>\n<p>并非每一次安全环境变化都需要重新制定国家安全战略。国家安全战略通常确定较长时期的基本判断、总体方向和中长期目标，而具体政策和执行措施可以根据短期变化进行调整。\n因此，在判断国家安全战略是否需要改变时，可以区分两个层次：\n<strong>如果总体安全环境、重大国家利益或者中长期目标发生明显变化</strong><br />\n→ 可能需要调整战略本身。</p>\n<p><strong>如果总体目标基本稳定，只是具体风险、技术条件或者实施环境发生变化</strong><br />\n→ 可以主要调整政策、工作任务或者具体措施。</p>\n<p>这一分析有助于解释为什么第6条既规定相对稳定的“中长期目标”，又要求“不断完善”战略。</p>\n<hr />\n<h4>5. 比较法：美国国家安全战略报告强调制定主体、报告周期与国会说明</h4>\n<p>美国现行《美国法典》第50编第3043节源自《1947年国家安全法》第108节，规定总统向国会提交国家安全战略报告，并规定报告应当说明国家安全利益和目标、实现战略所需要的外交与国防能力、国家力量的短期和长期运用以及现有能力能否支撑战略等内容；该条同时规定有关报告具有机密和非机密形式。\n这一制度与我国第6条可以围绕以下问题进行功能比较：</p>\n<ul>\n<li>战略由谁制定；</li>\n<li>战略包含什么内容；</li>\n<li>是否具有明确的评估和更新周期；</li>\n<li>战略向谁进行说明或者报告；</li>\n<li>如何判断目标与国家能力是否匹配；</li>\n<li>如何处理战略信息的公开与保密。\n但两种制度的规范结构并不相同。</li>\n</ul>\n<p>尤其需要注意：</p>\n<blockquote>\n<p><strong>我国《国家安全法》第6条没有规定美国法意义上的年度向立法机关提交国家安全战略报告的义务。</strong>\n因此，美国有关年度报告、提交时间和报告形式的规定可以作为比较法材料，但不能作为解释我国第6条程序要求的直接依据。</p>\n</blockquote>\n<hr />\n<h3>五、体系联系与学习提示</h3>\n<h4>（一）第5条与第6条的区别</h4>\n<p>两条都出现“国家安全战略”，但规范重点不同。</p>\n<h5>第5条：谁负责战略工作</h5>\n<p>核心表述：</p>\n<blockquote>\n<p>“研究制定、指导实施国家安全战略”\n回答的是：<strong>谁在中央层面承担战略工作的领导和协调职责。</strong></p>\n</blockquote>\n<h5>第6条：战略如何形成、包括什么</h5>\n<p>核心表述：</p>\n<blockquote>\n<p>“制定并不断完善”“全面评估”“明确……”\n回答的是：<strong>国家安全战略应当建立在什么基础上，以及战略应包含哪些主要内容。</strong>\n因此：</p>\n</blockquote>\n<p><strong>第5条：主体和职责</strong><br />\n↓<br />\n<strong>第6条：战略形成和内容</strong></p>\n<hr />\n<h4>（二）区分四个相关概念</h4>\n<h5>1. 国家安全战略</h5>\n<p>第6条规定。主要解决国家安全工作的：<strong>总体方向 + 中长期目标 + 重点政策 + 工作任务和措施</strong></p>\n<h5>2. 国家安全重大方针政策</h5>\n<p>第5条与国家安全战略并列规定。政策通常比总体战略更加具体，是将战略要求转化为国家安全工作安排的重要方式。</p>\n<h5>3. 国家安全风险评估</h5>\n<p>第56条规定。主要通过定期调查评估具体国家安全风险，为国家安全决策和风险治理提供信息基础。</p>\n<h5>4. 国家安全风险预案</h5>\n<p>第55条规定国家制定完善应对各领域国家安全风险预案。预案更直接面向具体风险发生后的预防、应对和处置准备。\n因此，可以简单记忆为：</p>\n<p><strong>战略：确定总体方向</strong><br />\n↓<br />\n<strong>政策：落实战略安排</strong><br />\n↓<br />\n<strong>风险评估：识别和判断具体风险</strong><br />\n↓<br />\n<strong>预案：准备如何应对风险</strong></p>\n<hr />\n<h4>（三）国家安全战略的实施闭环</h4>\n<p>可以将相关条文串联起来：\n<strong>第5条：研究制定、指导实施战略</strong><br />\n↓<br />\n<strong>第6条：评估形势，明确战略内容</strong><br />\n↓<br />\n<strong>第56条：持续提供风险评估信息</strong><br />\n↓<br />\n<strong>第47条：部门和地区贯彻实施</strong><br />\n↓<br />\n<strong>第46条：督促检查和责任追究</strong><br />\n↓<br />\n<strong>第6条：根据形势不断完善</strong></p>\n<hr />\n<h4>（四）关于战略公开范围</h4>\n<p>第6条本身没有规定国家安全战略应当以何种形式公开，也没有规定国家安全战略全部属于保密信息。因此，不能从本条推出：</p>\n<blockquote>\n<p>“国家安全战略全文必须公开”</p>\n</blockquote>\n<p>也不能反向推出：</p>\n<blockquote>\n<p>“国家安全战略及其全部信息当然保密”。</p>\n</blockquote>\n<p>具体战略信息能否公开、公开至何种程度，应根据相关国家秘密、政府信息公开以及具体文件的性质分别判断。\n比较而言，美国第50编第3043节明确要求国家安全战略报告具有机密和非机密形式，这恰好说明战略公开程度本身可以由具体制度另外规定。</p>\n<hr />\n<h4>（五）历史比较材料</h4>\n<p>法工委版本《中华人民共和国国家安全法释义》对美国、俄罗斯、日本等国家安全战略进行了较多介绍。</p>\n<hr />\n<h4>（六）易错点</h4>\n<p><strong>易错点1：国家制定一次国家安全战略以后即可长期不变。</strong>\n<strong>纠正：</strong> 第6条明确规定“制定并不断完善”，说明战略具有动态调整要求。</p>\n<hr />\n<p><strong>易错点2：“不断完善”意味着国家必须每年重新制定国家安全战略。</strong>\n<strong>纠正：</strong> 第6条没有规定固定更新周期。“不断完善”是一项持续性要求，不等于法定年度更新义务。</p>\n<hr />\n<p><strong>易错点3：国家安全战略就是对国家安全风险的预测。</strong>\n<strong>纠正：</strong> 形势评估只是战略形成的基础。国家安全战略还必须明确指导方针、中长期目标、重点领域政策、工作任务和措施。</p>\n<hr />\n<p><strong>易错点4：战略规定某项工作重要，就当然可以采取必要的强制措施。</strong>\n<strong>纠正：</strong> 战略确定工作方向，并不能代替具体法律授权。国家机关采取影响公民、组织权利的措施仍须具有明确法律依据。</p>\n<hr />\n<p><strong>易错点5：第6条已经完整规定了国家安全战略的实施机制。</strong>\n<strong>纠正：</strong> 第6条主要规定战略形成和内容，实施还需要结合第5条、第46条、第47条以及其他国家安全工作机制理解。</p>\n<hr />\n<p><strong>易错点6：《国家安全战略（2021—2025年）》仍是2026年当前五年战略。</strong>\n<strong>纠正：</strong> 该文件标题本身限定为2021—2025年。在没有新的可靠材料支持时，应当将其作为此前战略实践材料，而不能延伸其时间效力。</p>\n<hr />\n<h3>六、研究问题</h3>\n<ol>\n<li><p><strong>国家安全战略的法律性质如何界定？</strong><br />\n它与法律法规、国家安全政策以及具体行政决定之间分别是什么关系？战略能够对具体国家机关产生何种规范性影响？</p>\n</li>\n<li><p><strong>“不断完善”应当以什么作为战略调整标准？</strong><br />\n国际环境变化、国家利益变化、风险程度变化以及国家能力变化达到何种程度时，需要调整国家安全战略本身？</p>\n</li>\n<li><p><strong>战略调整与执行措施调整如何区分？</strong><br />\n在中长期目标保持稳定而短期风险快速变化时，应当修改战略，还是主要通过调整重点政策、任务和具体措施予以应对？</p>\n</li>\n<li><p><strong>如何评价国家安全战略的实施效果？</strong><br />\n除是否完成既定工作任务之外，是否还应评价风险是否降低、安全能力是否提高以及战略目标与资源配置是否匹配？</p>\n</li>\n<li><p><strong>国家安全风险评估如何进入战略制定过程？</strong><br />\n第56条形成的各领域风险评估信息，如何汇总并转化为第6条意义上的国际、国内安全形势综合判断？</p>\n</li>\n<li><p><strong>国家安全战略的公开与保密边界如何确定？</strong><br />\n战略需要发挥政策引导和社会动员功能，同时又可能涉及敏感安全信息。哪些内容适合公开、哪些内容需要保护，应依据何种规范进行区分？</p>\n</li>\n<li><p><strong>如何建立国家安全战略的比较法分析框架？</strong><br />\n与其只比较各国战略文件内容，是否更适合围绕“<strong>制定主体—形势评估—目标设定—能力配置—实施机制—监督反馈—更新机制</strong>”进行制度比较？</p>\n</li>\n</ol>"},{"num":7,"label":"第七条","title":"法治原则与人权保障","lawText":"维护国家安全，应当遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。","calloutHtml":"<aside class=\"article-callout\"><div class=\"article-callout-title\">📌 条文速览</div><ul>\n<li><strong>法治底线：</strong> 国家安全工作的特殊性不构成脱离宪法和法律运行的理由，国家机关采取具体措施必须具有相应的职权和法律依据。</li>\n<li><strong>人权原则：</strong> “尊重和保障人权”既包含防止公权力不当侵害，也要求通过制度安排积极保护公民合法权益。</li>\n<li><strong>目的与手段分开审查：</strong> 某项措施具有维护国家安全的目的，并不当然意味着该措施合法；仍需审查权限、条件、程序和限制程度。</li>\n<li><strong>体系展开：</strong> 第43条禁止越权、滥权和侵犯合法权益，第66条对危机管控措施规定适当性和权益保护要求，第82—83条进一步规定监督救济和限制权利特别措施的法律边界。</li>\n<li><strong>适用方法：</strong> 可以将本条作为解释具体国家安全权限和措施的重要原则性依据，但具体合法性结论仍须回到相应的授权规范和程序规范。</li>\n</ul></aside>","frontHtml":"<div class=\"article-side article-front has-callout\"><div class=\"article-label\">第七条</div><p class=\"article-law-text\">维护国家安全，应当遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。</p><aside class=\"article-callout\"><div class=\"article-callout-title\">📌 条文速览</div><ul>\n<li><strong>法治底线：</strong> 国家安全工作的特殊性不构成脱离宪法和法律运行的理由，国家机关采取具体措施必须具有相应的职权和法律依据。</li>\n<li><strong>人权原则：</strong> “尊重和保障人权”既包含防止公权力不当侵害，也要求通过制度安排积极保护公民合法权益。</li>\n<li><strong>目的与手段分开审查：</strong> 某项措施具有维护国家安全的目的，并不当然意味着该措施合法；仍需审查权限、条件、程序和限制程度。</li>\n<li><strong>体系展开：</strong> 第43条禁止越权、滥权和侵犯合法权益，第66条对危机管控措施规定适当性和权益保护要求，第82—83条进一步规定监督救济和限制权利特别措施的法律边界。</li>\n<li><strong>适用方法：</strong> 可以将本条作为解释具体国家安全权限和措施的重要原则性依据，但具体合法性结论仍须回到相应的授权规范和程序规范。</li>\n</ul></aside></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第七条</div><p class=\"article-law-text\">维护国家安全，应当遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。</p><div class=\"article-note-divider\">法治原则与人权保障 · MD 研读笔记</div><div class=\"article-notes\"><p>本条确立维护国家安全工作的<strong>法治原则和人权保障原则</strong>。它将“维护国家安全”与“遵守宪法和法律、尊重和保障人权、保护公民权利和自由”置于同一规范结构中，表明国家安全工作的目的正当性并不能替代具体措施的合法性要求。</p>\n<p>理解本条，可以抓住一条基本逻辑：<strong>维护国家安全 → 依法行使职权 → 尊重和保障人权 → 依法保护权利和自由。</strong></p>\n<hr />\n<h3>二、立法沿革</h3>\n<h4>1. 宪法基础：依法治国、人权保障与基本权利共同构成本条的规范基础</h4>\n<p>本条具有明确的宪法基础。《宪法》第5条规定中华人民共和国实行依法治国，建设社会主义法治国家，并进一步规定一切国家机关、武装力量、政党、社会团体、企业事业组织都必须遵守宪法和法律，任何组织或者个人都不得有超越宪法和法律的特权。</p>\n<p>《宪法》第33条第3款则明确规定：</p>\n<blockquote>\n<p><strong>“国家尊重和保障人权。”</strong>\n第33条同时规定，公民享有宪法和法律规定的权利，并履行相应义务。此后第35条以下进一步规定言论、出版、集会、结社、宗教信仰、人身自由等基本权利。\n因此，第7条可以理解为将宪法上的两个基本要求进一步落实到国家安全领域：<strong>国家权力依法运行 + 公民权利受到保障</strong></p>\n</blockquote>\n<hr />\n<h4>2. 2014年《反间谍法》已经确立类似的人权保障要求</h4>\n<p>2014年《反间谍法》第5条规定：</p>\n<blockquote>\n<p>“反间谍工作应当依法进行，尊重和保障人权，保障公民和组织的合法权益。”\n因此，2015年《国家安全法》第7条关于依法开展国家安全工作和尊重保障人权的规定，并非首次出现于国家安全相关专门立法，而是在综合性国家安全法中进一步上升为适用于国家安全工作的基本原则。2014年《反间谍法》共有40条，其中第40条为施行条款。\n2023年修订《反间谍法》继续保留这一原则，并将其前移至第3条，表述为“反间谍工作应当依法进行，尊重和保障人权，保障个人和组织的合法权益”。这说明依法开展国家安全专门工作并保护个人、组织合法权益的要求具有明显的制度延续性。</p>\n</blockquote>\n<hr />\n<h4>3. 2014年12月的国家安全法草案说明已经明确提出法治和保障人权原则</h4>\n<h2>2014年12月22日关于《中华人民共和国国家安全法（草案）》的说明，在介绍草案基本原则时，已经明确将“<strong>坚持法治和保障人权原则</strong>”列为维护国家安全工作的基本原则之一。\n该说明还进一步指出，草案在基本原则中强调“尊重和保障人权，保护公民的合法权利和自由”，并通过危机管控中的权益保护、公民和组织权利等制度予以展开。</h2>\n<h3>三、主要内容</h3>\n<h4>第一，“遵守宪法和法律”构成国家安全工作的基本合法性要求</h4>\n<p>国家安全事项可能具有高度敏感性、紧迫性和特殊性，但这些特点并不使国家安全活动脱离一般法治要求。\n《宪法》第5条已经明确要求一切国家机关和组织遵守宪法和法律，并禁止任何组织或者个人享有超越宪法和法律的特权。\n因此，第7条中的“遵守宪法和法律”首先意味着：</p>\n<ul>\n<li>国家机关必须在法定职责范围内维护国家安全；</li>\n<li>采取调查、审查、强制、处罚等措施必须具有相应法律依据；</li>\n<li>权力行使必须符合实体条件和法定程序；</li>\n<li>对公民权利的限制不得脱离法律规定。\n这与第43条形成直接呼应。第43条明确要求国家机关及其工作人员严格依法履行职责，不得超越职权、滥用职权，不得侵犯个人和组织的合法权益。</li>\n</ul>\n<hr />\n<h4>第二，“坚持社会主义法治原则”要求以法治方式维护国家安全</h4>\n<p>“遵守宪法和法律”侧重对具体权力运行的合法性要求，“坚持社会主义法治原则”则具有更为总体的制度意义。</p>\n<p>国家安全治理既需要形成维护安全的能力，也需要通过法律明确：</p>\n<ul>\n<li>国家安全权力由谁行使；</li>\n<li>在什么条件下行使；</li>\n<li>可以采取何种措施；</li>\n<li>应遵守什么程序；</li>\n<li>公民和组织享有哪些权利；</li>\n<li>权力违法运行时如何监督和救济。</li>\n</ul>\n<p>因此，法治原则贯穿的不只是具体执法阶段，而包括国家安全的<strong>立法、职责配置、制度运行、监督和责任追究</strong>。</p>\n<p>本法的体系也体现了这种结构。例如，第42条规定有关机关的法定职权，第43条限制越权和滥权，第66条控制危机处置措施，第82条规定申诉、控告、检举权，第83条要求限制公民权利和自由的特别措施依法实施。</p>\n<hr />\n<h4>第三，“尊重”和“保障”可以理解为人权义务的两个侧面</h4>\n<p>〔笔记分析〕</p>\n<p>本条并列使用“尊重”和“保障”人权。</p>\n<p>在学习中，可以作如下功能性区分：</p>\n<p><strong>尊重人权</strong>主要体现为公权力避免违法或者不必要地干预个人权利；</p>\n<p><strong>保障人权</strong>则进一步要求国家通过法律、制度和具体行动，为公民权利的实现提供保护条件。</p>\n<p>这种区分有助于理解国家安全领域的人权问题并不仅发生在“是否限制权利”这一环节。</p>\n<p>例如：</p>\n<ul>\n<li>国家机关不得超越职权侵犯合法权益，是“尊重”的典型要求；</li>\n<li>对协助国家安全工作而面临危险的人员提供保护，则具有积极保障色彩；</li>\n<li>为公民提供申诉、控告和检举渠道，也属于权利保障制度的一部分。</li>\n</ul>\n<p>但需要注意，“尊重—保障”的二分主要是一种分析工具。本条本身没有分别规定两组完整、封闭的法律义务。</p>\n<hr />\n<h4>第四，“依法保护公民的权利和自由”使权利保护成为国家安全工作的组成部分</h4>\n<p>本条最后明确规定“依法保护公民的权利和自由”。</p>\n<p>这一表述具有重要意义，因为它表明在《国家安全法》的规范结构中：</p>\n<blockquote>\n<p><strong>维护国家安全与保护公民权利并非简单的对立关系。</strong></p>\n</blockquote>\n<p>国家安全本身包含对人民安全和人民根本利益的保护；国家采取安全措施时，同时又必须尊重和保护公民权利。</p>\n<p>这种关系在本法多个条文中得到展开：</p>\n<ul>\n<li>第16条规定保障公民生命财产安全和其他合法权益；</li>\n<li>第43条禁止国家机关超越、滥用职权以及侵犯个人和组织合法权益；</li>\n<li>第66条要求国家安全危机管控措施与危害的性质、程度和范围相适应，并在存在多种措施时选择有利于最大程度保护公民、组织权益的措施；</li>\n<li>第82条赋予公民和组织提出批评建议以及申诉、控告、检举的权利；</li>\n<li>第83条规定限制公民权利和自由的特别措施必须依法进行，并以维护国家安全的实际需要为限度。</li>\n</ul>\n<p>因此，人权保障原则并非停留于总则中的抽象宣示，而是通过具体权限限制、措施控制和权利救济制度进一步展开。</p>\n<hr />\n<h3>四、法理与解释要点</h3>\n<h4>1. “目的合法”与“手段合法”必须分别判断</h4>\n<p>〔笔记分析〕</p>\n<p>国家安全措施通常具有维护国家安全这一公共目的。</p>\n<p>但在法律分析中，应当把两个问题分开：</p>\n<p><strong>第一，措施追求的目的是否属于法定国家安全目的；</strong></p>\n<p><strong>第二，为实现这一目的而采取的具体手段是否合法。</strong></p>\n<p>即使某项措施确实有助于国家安全，也仍然需要判断：</p>\n<ul>\n<li>采取措施的主体是否具有法定职权；</li>\n<li>是否满足相应的实体条件；</li>\n<li>是否履行法定批准或者其他程序；</li>\n<li>是否超过实现安全目的所必要的范围；</li>\n<li>是否对相关人员提供应有的程序保障和救济。</li>\n</ul>\n<p>因此：</p>\n<blockquote>\n<p><strong>安全目的的正当性不能自动转化为手段的合法性。</strong></p>\n</blockquote>\n<p>这一点是第7条作为原则条款参与具体法律解释时最重要的功能之一。</p>\n<hr />\n<h4>2. 第43条进一步具体化了依法履职和禁止滥权要求</h4>\n<p>第43条规定：</p>\n<blockquote>\n<p>国家机关及其工作人员在国家安全工作和涉及国家安全活动中，应当严格依法履行职责，不得超越职权、滥用职权，不得侵犯个人和组织的合法权益。</p>\n</blockquote>\n<p>第7条与第43条的关系可以理解为：</p>\n<p><strong>第7条：一般法治和人权原则</strong><br />\n↓<br />\n<strong>第43条：国家机关依法履职的具体要求</strong></p>\n<p>因此，在具体国家安全案件中，第7条可以提供原则性解释，第43条则更加直接地提出职权边界和合法权益保护要求。</p>\n<hr />\n<h4>3. 第66条体现危机管控场景下较为明确的适当性和权益保护要求</h4>\n<p>第66条规定，履行国家安全危机管控职责的有关机关依法采取管控措施时：</p>\n<ul>\n<li>措施应当与国家安全危机可能造成危害的<strong>性质、程度和范围相适应</strong>；</li>\n<li>存在多种措施可供选择时，应当选择有利于<strong>最大程度保护公民、组织权益</strong>的措施。</li>\n</ul>\n<p>这一规定具有较明显的比例控制特征，可以帮助理解第7条的人权保障原则如何落实到具体措施选择。</p>\n<p>但必须注意适用范围：</p>\n<blockquote>\n<p><strong>第66条位于第四章第五节“危机管控”，其直接规范对象是国家安全危机管控措施。</strong></p>\n</blockquote>\n<p>因此，可以将其作为理解国家安全法中比例、必要性和权益保护理念的重要体系材料，但不能不加说明地将第66条原文直接表述为“一切国家安全措施都适用的法定审查公式”。</p>\n<hr />\n<h4>4. 第83条对限制公民权利和自由的特别措施设置一般性的法律边界</h4>\n<p>第83条规定：</p>\n<blockquote>\n<p>“在国家安全工作中，需要采取限制公民权利和自由的特别措施时，应当依法进行，并以维护国家安全的实际需要为限度。”</p>\n</blockquote>\n<p>与第66条相比，第83条使用的是更一般的“在国家安全工作中”，并直接针对“限制公民权利和自由的特别措施”。</p>\n<p>因此，它可以与第7条共同形成较为明确的解释结构：</p>\n<p><strong>必须依法采取措施 + 限制程度以实际安全需要为限</strong></p>\n<p>这一规定对于理解国家安全措施的必要性边界尤其重要。</p>\n<hr />\n<h4>5. 可以形成一套国家安全措施的分析顺序</h4>\n<p>〔笔记分析〕</p>\n<p>结合第7、43、66、82、83条，可以形成如下研究工具：</p>\n<p><strong>第一步：审查职权。</strong><br />\n谁采取措施？是否具有明确的法律职责和权限？</p>\n<p><strong>第二步：审查事实基础。</strong><br />\n存在什么现实或者潜在的国家安全风险？涉及第2条中的何种国家重大利益？</p>\n<p><strong>第三步：审查目的。</strong><br />\n具体措施是否真正服务于相应的国家安全目的？</p>\n<p><strong>第四步：审查手段。</strong><br />\n该措施是否能够促进安全目的实现？是否存在同样有效而对权利影响较小的方式？</p>\n<p><strong>第五步：审查负担。</strong><br />\n措施对公民、组织权益造成的限制是否超过应对风险实际需要？</p>\n<p><strong>第六步：审查程序与救济。</strong><br />\n审批、告知、陈述申辩、监督、申诉、控告、检举或者其他救济机制是否依法落实？</p>\n<p>可以简化为：</p>\n<p><strong>职权依据 → 风险事实 → 目的 → 手段 → 限制程度 → 程序与救济</strong></p>\n<blockquote>\n<p>这一顺序是依据《国家安全法》多个条文归纳形成的<strong>分析框架</strong>，并不是第7条明文规定的一套统一六阶段审查程序。</p>\n</blockquote>\n<hr />\n<h4>6. 比较法：普通权利限制与紧急状态下的权利克减应当区分</h4>\n<p>《公民权利和政治权利国际公约》提供了一个有意义的比较视角。</p>\n<p>以表达自由为例，公约第19条第3款允许在法律规定且具有必要性的条件下，为保护国家安全、公共秩序等目的对表达自由作一定限制；第22条关于结社自由也设置了类似的“依法规定—合法目的—必要性”结构。</p>\n<p>与此不同，公约第4条处理的是威胁国家生存并经正式宣布的公共紧急状态。在这种情况下，缔约国可以在“情势严格需要”的范围内对部分公约义务采取克减措施，同时还受到不可克减权利等限制。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>普通情形下的权利限制（restriction）与紧急状态下的义务克减（derogation）是两种不同的法律制度。</strong></p>\n</blockquote>\n<p>比较研究中不能因两者都涉及“国家安全”而将其混同。</p>\n<hr />\n<h4>7. 《公民权利和政治权利国际公约》在本笔记中的使用应明确其比较法定位</h4>\n<p>中华人民共和国政府于1998年10月5日签署《公民权利和政治权利国际公约》。截至2026年9月联合国条约数据库所列状态，中国一栏记载签署日期，但没有批准日期，因此中国尚未成为该公约的缔约国。</p>\n<p>同时，该公约在香港特别行政区、澳门特别行政区具有不同的历史和法律适用安排，不能与中国内地的适用问题简单合并讨论。联合国条约数据库也分别记载了有关港澳适用的通知和说明。</p>\n<p>因此，本笔记引用该公约主要用于：</p>\n<ul>\n<li>比较国家安全理由下权利限制的法律结构；</li>\n<li>区分普通限制与紧急状态克减；</li>\n<li>观察“法律依据—合法目的—必要性”等国际人权法分析方法。</li>\n</ul>\n<p>不据此主张其可以作为中国内地一般国家安全执法案件中的直接国内法依据。</p>\n<hr />\n<h3>五、体系联系与学习提示</h3>\n<h4>（一）第7条在总则中的位置</h4>\n<p>前六条主要解决：</p>\n<p><strong>为什么立法 → 什么是国家安全 → 按照什么理念维护 → 谁来领导 → 中央领导机构做什么 → 如何制定国家安全战略</strong></p>\n<p>第7条开始进一步回答：</p>\n<blockquote>\n<p><strong>国家安全工作应当受到什么法律边界约束？</strong></p>\n</blockquote>\n<p>因此，前七条可以形成一条非常清晰的逻辑链：</p>\n<p><strong>第1条：立法目的</strong><br />\n↓<br />\n<strong>第2条：国家安全定义</strong><br />\n↓<br />\n<strong>第3条：总体国家安全观</strong><br />\n↓<br />\n<strong>第4—5条：领导体制与领导机构职责</strong><br />\n↓<br />\n<strong>第6条：国家安全战略</strong><br />\n↓<br />\n<strong>第7条：法治与人权边界</strong></p>\n<p>第7条由此具有明显的“限权”和“保障”功能。</p>\n<hr />\n<h4>（二）核心关联条文</h4>\n<ul>\n<li><strong>《宪法》第5条：</strong> 依法治国以及一切国家机关、组织遵守宪法和法律。</li>\n<li><strong>《宪法》第33条：</strong> 国家尊重和保障人权。</li>\n<li><strong>第13条：</strong> 国家机关工作人员滥用职权、玩忽职守、徇私舞弊的法律责任。</li>\n<li><strong>第43条：</strong> 严格依法履行职责，禁止越权、滥权和侵犯合法权益。</li>\n<li><strong>第66条：</strong> 国家安全危机管控措施的适当性与权益保护。</li>\n<li><strong>第82条：</strong> 批评建议以及申诉、控告、检举权。</li>\n<li><strong>第83条：</strong> 限制公民权利和自由的特别措施必须依法进行，并以实际需要为限。</li>\n</ul>\n<p>可以概括为：</p>\n<p><strong>第7条：原则性人权和法治保障</strong><br />\n↓<br />\n<strong>第43条：权力依法运行</strong><br />\n↓<br />\n<strong>第66、83条：具体措施限度</strong><br />\n↓<br />\n<strong>第82条：监督和救济</strong></p>\n<hr />\n<h4>（三）2014年《反间谍法》与现行《反间谍法》的对应关系</h4>\n<p>学习时可以特别注意条文位置的变化：</p>\n<p><strong>2014年《反间谍法》第5条：</strong></p>\n<blockquote>\n<p>反间谍工作依法进行 + 尊重和保障人权 + 保障公民和组织合法权益。</p>\n</blockquote>\n<p><strong>2023年修订《反间谍法》第3条：</strong></p>\n<blockquote>\n<p>反间谍工作依法进行 + 尊重和保障人权 + 保障个人和组织合法权益。</p>\n</blockquote>\n<p>基本原则得到延续，同时条文位置由第5条前移至第3条。</p>\n<hr />\n<h4>（四）两处重要材料勘误</h4>\n<p><strong>勘误一：乙书案例中的“2009年《反间谍法》第54条”明显有误。</strong></p>\n<p>乙书第19页（PDF第28页）在叙述一宗2021年案件时，援引“2009年《反间谍法》第54条”。</p>\n<p>这一表述至少存在两个无法并存的问题：</p>\n<ol>\n<li>我国《反间谍法》于<strong>2014年11月1日</strong>首次通过，不存在“2009年《反间谍法》”；</li>\n<li>2014年《反间谍法》全文仅有<strong>40条</strong>，不存在第54条。</li>\n</ol>\n<p>2023年修订后的《反间谍法》确有第54条，其中规定部分间谍行为尚不构成犯罪时的行政处罚，但修订法自<strong>2023年7月1日</strong>起施行，因此不能直接作为2021年处罚决定的法律依据。</p>\n<p>2014年法中另有涉及泄露反间谍工作国家秘密等行为的处罚条款，但在没有取得该案完整行政处罚决定书、事实认定和当时具体适用规范之前，<strong>不宜自行替书中案例补定具体处罚依据</strong>。</p>\n<p>因此，本笔记仅作错误校勘，不据该段材料确定案件的准确法律依据。</p>\n<hr />\n<p><strong>勘误二：乙书关联法规所列《宪法》第23条不能作为人权保障的一般依据。</strong></p>\n<p>《宪法》第23条规定国家培养各种专业人才、扩大知识分子队伍等事项，并非“国家尊重和保障人权”的条款。</p>\n<p>若用于说明本条的法治与人权保障原则，更直接的宪法依据是：</p>\n<ul>\n<li><strong>第5条：依法治国和宪法法律至上；</strong></li>\n<li><strong>第33条第3款：国家尊重和保障人权。</strong></li>\n</ul>\n<p>《宪法》第23条的实际内容与一般人权保障原则并不对应。</p>\n<hr />\n<h4>（五）案例材料的证据界限</h4>\n<p>乙书有关案例进一步评价国家安全机关在办案过程中保障了犯罪嫌疑人的知情权、提出抗辩理由等程序权利。</p>\n<p>这类表述可以帮助理解作者希望说明的“依法办案和人权保障”主题，但其证明力应当与材料基础相匹配。</p>\n<p>如果只有简短新闻报道或者二手案例介绍，而没有：</p>\n<ul>\n<li>完整处罚决定；</li>\n<li>调查和询问记录；</li>\n<li>告知、陈述申辩等程序材料；</li>\n<li>行政复议或者司法裁判材料，</li>\n</ul>\n<p>则不宜据此进一步得出“案件中的各项程序权利均得到完整保障”的事实结论。</p>\n<p>因此应区分：</p>\n<blockquote>\n<p><strong>案例报道所记载的事实 ≠ 释义作者的规范评价 ≠ 经完整案卷材料验证后的法律结论。</strong></p>\n</blockquote>\n<hr />\n<h4>（六）易错点</h4>\n<p><strong>易错点1：只要措施是为了维护国家安全，就可以推定合法。</strong></p>\n<p><strong>纠正：</strong> 国家安全目的与措施合法性属于两个层次。具体措施仍须符合职权、实体条件、程序和权利保障要求。</p>\n<hr />\n<p><strong>易错点2：国家安全属于特殊领域，因此可以不完全遵守一般法治原则。</strong></p>\n<p><strong>纠正：</strong> 第7条恰恰明确规定维护国家安全必须遵守宪法和法律，并尊重和保障人权。</p>\n<hr />\n<p><strong>易错点3：“尊重和保障人权”只是宣示性规定，没有具体制度意义。</strong></p>\n<p><strong>纠正：</strong> 第43、66、82、83条分别通过职权控制、措施控制、监督救济和权利限制边界对该原则进行具体展开。</p>\n<hr />\n<p><strong>易错点4：第66条的比例控制规则直接适用于所有国家安全措施。</strong></p>\n<p><strong>纠正：</strong> 第66条直接适用于国家安全危机管控措施。可以据此理解本法的权益保护理念，但向其他场景延伸时需要说明其体系解释性质。</p>\n<hr />\n<p><strong>易错点5：国家安全领域只需要讨论国家能否限制权利。</strong></p>\n<p><strong>纠正：</strong> 第7条同时规定“尊重和保障人权”“依法保护公民的权利和自由”。国家安全法还规定保护、补偿、监督和救济等积极保障制度。</p>\n<hr />\n<p><strong>易错点6：《公民权利和政治权利国际公约》的权利限制与紧急状态克减是一回事。</strong></p>\n<p><strong>纠正：</strong> 公约第19、22条等规定特定权利在通常情况下的限制条件，第4条则针对正式宣布的公共紧急状态规定义务克减，两种制度的条件和法律后果不同。</p>\n<hr />\n<h2>六、研究问题</h2>\n<ol>\n<li><p><strong>第7条能够在多大程度上成为具体国家安全措施的审查依据？</strong><br />\n在专门法律没有明确规定比例控制标准时，能否依据第7条结合第43、83条形成更具体的合法性审查要求？</p>\n</li>\n<li><p><strong>国家安全领域的比例原则应当如何构造？</strong><br />\n第66条已经明确规定危机管控中的适当性和较小权益损害要求，这种规范理念能否通过体系解释影响其他国家安全措施？</p>\n</li>\n<li><p><strong>“实际需要为限度”如何具体判断？</strong><br />\n第83条中的“实际需要”应当依据风险发生概率、危害程度、措施有效性还是其他因素进行评价？</p>\n</li>\n<li><p><strong>如何将“尊重和保障人权”转化为可操作的程序要求？</strong><br />\n除职权和实体条件之外，国家安全行政活动是否应更加明确告知、陈述申辩、理由说明、记录留存和救济等程序要求？</p>\n</li>\n<li><p><strong>国家安全信息保密与有效救济之间如何协调？</strong><br />\n当具体决定涉及国家秘密或者敏感安全信息时，如何既保护必要的国家安全信息，又使受影响主体能够有效了解决定依据并提出救济？</p>\n</li>\n<li><p><strong>国家安全措施的监督结构应当如何完善？</strong><br />\n第82条赋予公民和组织批评建议、申诉、控告和检举权后，这些监督方式如何与行政复议、行政诉讼、监察监督以及内部监督机制形成衔接？</p>\n</li>\n<li><p><strong>国家安全与人权保障应当如何理解其规范关系？</strong><br />\n是否应从简单的“安全与权利冲突”框架，进一步转向“安全目的—法定权限—措施必要性—权利保障—监督救济”的完整法治结构？</p>\n</li>\n</ol></div></div>","notesHtml":"<p>本条确立维护国家安全工作的<strong>法治原则和人权保障原则</strong>。它将“维护国家安全”与“遵守宪法和法律、尊重和保障人权、保护公民权利和自由”置于同一规范结构中，表明国家安全工作的目的正当性并不能替代具体措施的合法性要求。</p>\n<p>理解本条，可以抓住一条基本逻辑：<strong>维护国家安全 → 依法行使职权 → 尊重和保障人权 → 依法保护权利和自由。</strong></p>\n<hr />\n<h3>二、立法沿革</h3>\n<h4>1. 宪法基础：依法治国、人权保障与基本权利共同构成本条的规范基础</h4>\n<p>本条具有明确的宪法基础。《宪法》第5条规定中华人民共和国实行依法治国，建设社会主义法治国家，并进一步规定一切国家机关、武装力量、政党、社会团体、企业事业组织都必须遵守宪法和法律，任何组织或者个人都不得有超越宪法和法律的特权。</p>\n<p>《宪法》第33条第3款则明确规定：</p>\n<blockquote>\n<p><strong>“国家尊重和保障人权。”</strong>\n第33条同时规定，公民享有宪法和法律规定的权利，并履行相应义务。此后第35条以下进一步规定言论、出版、集会、结社、宗教信仰、人身自由等基本权利。\n因此，第7条可以理解为将宪法上的两个基本要求进一步落实到国家安全领域：<strong>国家权力依法运行 + 公民权利受到保障</strong></p>\n</blockquote>\n<hr />\n<h4>2. 2014年《反间谍法》已经确立类似的人权保障要求</h4>\n<p>2014年《反间谍法》第5条规定：</p>\n<blockquote>\n<p>“反间谍工作应当依法进行，尊重和保障人权，保障公民和组织的合法权益。”\n因此，2015年《国家安全法》第7条关于依法开展国家安全工作和尊重保障人权的规定，并非首次出现于国家安全相关专门立法，而是在综合性国家安全法中进一步上升为适用于国家安全工作的基本原则。2014年《反间谍法》共有40条，其中第40条为施行条款。\n2023年修订《反间谍法》继续保留这一原则，并将其前移至第3条，表述为“反间谍工作应当依法进行，尊重和保障人权，保障个人和组织的合法权益”。这说明依法开展国家安全专门工作并保护个人、组织合法权益的要求具有明显的制度延续性。</p>\n</blockquote>\n<hr />\n<h4>3. 2014年12月的国家安全法草案说明已经明确提出法治和保障人权原则</h4>\n<h2>2014年12月22日关于《中华人民共和国国家安全法（草案）》的说明，在介绍草案基本原则时，已经明确将“<strong>坚持法治和保障人权原则</strong>”列为维护国家安全工作的基本原则之一。\n该说明还进一步指出，草案在基本原则中强调“尊重和保障人权，保护公民的合法权利和自由”，并通过危机管控中的权益保护、公民和组织权利等制度予以展开。</h2>\n<h3>三、主要内容</h3>\n<h4>第一，“遵守宪法和法律”构成国家安全工作的基本合法性要求</h4>\n<p>国家安全事项可能具有高度敏感性、紧迫性和特殊性，但这些特点并不使国家安全活动脱离一般法治要求。\n《宪法》第5条已经明确要求一切国家机关和组织遵守宪法和法律，并禁止任何组织或者个人享有超越宪法和法律的特权。\n因此，第7条中的“遵守宪法和法律”首先意味着：</p>\n<ul>\n<li>国家机关必须在法定职责范围内维护国家安全；</li>\n<li>采取调查、审查、强制、处罚等措施必须具有相应法律依据；</li>\n<li>权力行使必须符合实体条件和法定程序；</li>\n<li>对公民权利的限制不得脱离法律规定。\n这与第43条形成直接呼应。第43条明确要求国家机关及其工作人员严格依法履行职责，不得超越职权、滥用职权，不得侵犯个人和组织的合法权益。</li>\n</ul>\n<hr />\n<h4>第二，“坚持社会主义法治原则”要求以法治方式维护国家安全</h4>\n<p>“遵守宪法和法律”侧重对具体权力运行的合法性要求，“坚持社会主义法治原则”则具有更为总体的制度意义。</p>\n<p>国家安全治理既需要形成维护安全的能力，也需要通过法律明确：</p>\n<ul>\n<li>国家安全权力由谁行使；</li>\n<li>在什么条件下行使；</li>\n<li>可以采取何种措施；</li>\n<li>应遵守什么程序；</li>\n<li>公民和组织享有哪些权利；</li>\n<li>权力违法运行时如何监督和救济。</li>\n</ul>\n<p>因此，法治原则贯穿的不只是具体执法阶段，而包括国家安全的<strong>立法、职责配置、制度运行、监督和责任追究</strong>。</p>\n<p>本法的体系也体现了这种结构。例如，第42条规定有关机关的法定职权，第43条限制越权和滥权，第66条控制危机处置措施，第82条规定申诉、控告、检举权，第83条要求限制公民权利和自由的特别措施依法实施。</p>\n<hr />\n<h4>第三，“尊重”和“保障”可以理解为人权义务的两个侧面</h4>\n<p>〔笔记分析〕</p>\n<p>本条并列使用“尊重”和“保障”人权。</p>\n<p>在学习中，可以作如下功能性区分：</p>\n<p><strong>尊重人权</strong>主要体现为公权力避免违法或者不必要地干预个人权利；</p>\n<p><strong>保障人权</strong>则进一步要求国家通过法律、制度和具体行动，为公民权利的实现提供保护条件。</p>\n<p>这种区分有助于理解国家安全领域的人权问题并不仅发生在“是否限制权利”这一环节。</p>\n<p>例如：</p>\n<ul>\n<li>国家机关不得超越职权侵犯合法权益，是“尊重”的典型要求；</li>\n<li>对协助国家安全工作而面临危险的人员提供保护，则具有积极保障色彩；</li>\n<li>为公民提供申诉、控告和检举渠道，也属于权利保障制度的一部分。</li>\n</ul>\n<p>但需要注意，“尊重—保障”的二分主要是一种分析工具。本条本身没有分别规定两组完整、封闭的法律义务。</p>\n<hr />\n<h4>第四，“依法保护公民的权利和自由”使权利保护成为国家安全工作的组成部分</h4>\n<p>本条最后明确规定“依法保护公民的权利和自由”。</p>\n<p>这一表述具有重要意义，因为它表明在《国家安全法》的规范结构中：</p>\n<blockquote>\n<p><strong>维护国家安全与保护公民权利并非简单的对立关系。</strong></p>\n</blockquote>\n<p>国家安全本身包含对人民安全和人民根本利益的保护；国家采取安全措施时，同时又必须尊重和保护公民权利。</p>\n<p>这种关系在本法多个条文中得到展开：</p>\n<ul>\n<li>第16条规定保障公民生命财产安全和其他合法权益；</li>\n<li>第43条禁止国家机关超越、滥用职权以及侵犯个人和组织合法权益；</li>\n<li>第66条要求国家安全危机管控措施与危害的性质、程度和范围相适应，并在存在多种措施时选择有利于最大程度保护公民、组织权益的措施；</li>\n<li>第82条赋予公民和组织提出批评建议以及申诉、控告、检举的权利；</li>\n<li>第83条规定限制公民权利和自由的特别措施必须依法进行，并以维护国家安全的实际需要为限度。</li>\n</ul>\n<p>因此，人权保障原则并非停留于总则中的抽象宣示，而是通过具体权限限制、措施控制和权利救济制度进一步展开。</p>\n<hr />\n<h3>四、法理与解释要点</h3>\n<h4>1. “目的合法”与“手段合法”必须分别判断</h4>\n<p>〔笔记分析〕</p>\n<p>国家安全措施通常具有维护国家安全这一公共目的。</p>\n<p>但在法律分析中，应当把两个问题分开：</p>\n<p><strong>第一，措施追求的目的是否属于法定国家安全目的；</strong></p>\n<p><strong>第二，为实现这一目的而采取的具体手段是否合法。</strong></p>\n<p>即使某项措施确实有助于国家安全，也仍然需要判断：</p>\n<ul>\n<li>采取措施的主体是否具有法定职权；</li>\n<li>是否满足相应的实体条件；</li>\n<li>是否履行法定批准或者其他程序；</li>\n<li>是否超过实现安全目的所必要的范围；</li>\n<li>是否对相关人员提供应有的程序保障和救济。</li>\n</ul>\n<p>因此：</p>\n<blockquote>\n<p><strong>安全目的的正当性不能自动转化为手段的合法性。</strong></p>\n</blockquote>\n<p>这一点是第7条作为原则条款参与具体法律解释时最重要的功能之一。</p>\n<hr />\n<h4>2. 第43条进一步具体化了依法履职和禁止滥权要求</h4>\n<p>第43条规定：</p>\n<blockquote>\n<p>国家机关及其工作人员在国家安全工作和涉及国家安全活动中，应当严格依法履行职责，不得超越职权、滥用职权，不得侵犯个人和组织的合法权益。</p>\n</blockquote>\n<p>第7条与第43条的关系可以理解为：</p>\n<p><strong>第7条：一般法治和人权原则</strong><br />\n↓<br />\n<strong>第43条：国家机关依法履职的具体要求</strong></p>\n<p>因此，在具体国家安全案件中，第7条可以提供原则性解释，第43条则更加直接地提出职权边界和合法权益保护要求。</p>\n<hr />\n<h4>3. 第66条体现危机管控场景下较为明确的适当性和权益保护要求</h4>\n<p>第66条规定，履行国家安全危机管控职责的有关机关依法采取管控措施时：</p>\n<ul>\n<li>措施应当与国家安全危机可能造成危害的<strong>性质、程度和范围相适应</strong>；</li>\n<li>存在多种措施可供选择时，应当选择有利于<strong>最大程度保护公民、组织权益</strong>的措施。</li>\n</ul>\n<p>这一规定具有较明显的比例控制特征，可以帮助理解第7条的人权保障原则如何落实到具体措施选择。</p>\n<p>但必须注意适用范围：</p>\n<blockquote>\n<p><strong>第66条位于第四章第五节“危机管控”，其直接规范对象是国家安全危机管控措施。</strong></p>\n</blockquote>\n<p>因此，可以将其作为理解国家安全法中比例、必要性和权益保护理念的重要体系材料，但不能不加说明地将第66条原文直接表述为“一切国家安全措施都适用的法定审查公式”。</p>\n<hr />\n<h4>4. 第83条对限制公民权利和自由的特别措施设置一般性的法律边界</h4>\n<p>第83条规定：</p>\n<blockquote>\n<p>“在国家安全工作中，需要采取限制公民权利和自由的特别措施时，应当依法进行，并以维护国家安全的实际需要为限度。”</p>\n</blockquote>\n<p>与第66条相比，第83条使用的是更一般的“在国家安全工作中”，并直接针对“限制公民权利和自由的特别措施”。</p>\n<p>因此，它可以与第7条共同形成较为明确的解释结构：</p>\n<p><strong>必须依法采取措施 + 限制程度以实际安全需要为限</strong></p>\n<p>这一规定对于理解国家安全措施的必要性边界尤其重要。</p>\n<hr />\n<h4>5. 可以形成一套国家安全措施的分析顺序</h4>\n<p>〔笔记分析〕</p>\n<p>结合第7、43、66、82、83条，可以形成如下研究工具：</p>\n<p><strong>第一步：审查职权。</strong><br />\n谁采取措施？是否具有明确的法律职责和权限？</p>\n<p><strong>第二步：审查事实基础。</strong><br />\n存在什么现实或者潜在的国家安全风险？涉及第2条中的何种国家重大利益？</p>\n<p><strong>第三步：审查目的。</strong><br />\n具体措施是否真正服务于相应的国家安全目的？</p>\n<p><strong>第四步：审查手段。</strong><br />\n该措施是否能够促进安全目的实现？是否存在同样有效而对权利影响较小的方式？</p>\n<p><strong>第五步：审查负担。</strong><br />\n措施对公民、组织权益造成的限制是否超过应对风险实际需要？</p>\n<p><strong>第六步：审查程序与救济。</strong><br />\n审批、告知、陈述申辩、监督、申诉、控告、检举或者其他救济机制是否依法落实？</p>\n<p>可以简化为：</p>\n<p><strong>职权依据 → 风险事实 → 目的 → 手段 → 限制程度 → 程序与救济</strong></p>\n<blockquote>\n<p>这一顺序是依据《国家安全法》多个条文归纳形成的<strong>分析框架</strong>，并不是第7条明文规定的一套统一六阶段审查程序。</p>\n</blockquote>\n<hr />\n<h4>6. 比较法：普通权利限制与紧急状态下的权利克减应当区分</h4>\n<p>《公民权利和政治权利国际公约》提供了一个有意义的比较视角。</p>\n<p>以表达自由为例，公约第19条第3款允许在法律规定且具有必要性的条件下，为保护国家安全、公共秩序等目的对表达自由作一定限制；第22条关于结社自由也设置了类似的“依法规定—合法目的—必要性”结构。</p>\n<p>与此不同，公约第4条处理的是威胁国家生存并经正式宣布的公共紧急状态。在这种情况下，缔约国可以在“情势严格需要”的范围内对部分公约义务采取克减措施，同时还受到不可克减权利等限制。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>普通情形下的权利限制（restriction）与紧急状态下的义务克减（derogation）是两种不同的法律制度。</strong></p>\n</blockquote>\n<p>比较研究中不能因两者都涉及“国家安全”而将其混同。</p>\n<hr />\n<h4>7. 《公民权利和政治权利国际公约》在本笔记中的使用应明确其比较法定位</h4>\n<p>中华人民共和国政府于1998年10月5日签署《公民权利和政治权利国际公约》。截至2026年9月联合国条约数据库所列状态，中国一栏记载签署日期，但没有批准日期，因此中国尚未成为该公约的缔约国。</p>\n<p>同时，该公约在香港特别行政区、澳门特别行政区具有不同的历史和法律适用安排，不能与中国内地的适用问题简单合并讨论。联合国条约数据库也分别记载了有关港澳适用的通知和说明。</p>\n<p>因此，本笔记引用该公约主要用于：</p>\n<ul>\n<li>比较国家安全理由下权利限制的法律结构；</li>\n<li>区分普通限制与紧急状态克减；</li>\n<li>观察“法律依据—合法目的—必要性”等国际人权法分析方法。</li>\n</ul>\n<p>不据此主张其可以作为中国内地一般国家安全执法案件中的直接国内法依据。</p>\n<hr />\n<h3>五、体系联系与学习提示</h3>\n<h4>（一）第7条在总则中的位置</h4>\n<p>前六条主要解决：</p>\n<p><strong>为什么立法 → 什么是国家安全 → 按照什么理念维护 → 谁来领导 → 中央领导机构做什么 → 如何制定国家安全战略</strong></p>\n<p>第7条开始进一步回答：</p>\n<blockquote>\n<p><strong>国家安全工作应当受到什么法律边界约束？</strong></p>\n</blockquote>\n<p>因此，前七条可以形成一条非常清晰的逻辑链：</p>\n<p><strong>第1条：立法目的</strong><br />\n↓<br />\n<strong>第2条：国家安全定义</strong><br />\n↓<br />\n<strong>第3条：总体国家安全观</strong><br />\n↓<br />\n<strong>第4—5条：领导体制与领导机构职责</strong><br />\n↓<br />\n<strong>第6条：国家安全战略</strong><br />\n↓<br />\n<strong>第7条：法治与人权边界</strong></p>\n<p>第7条由此具有明显的“限权”和“保障”功能。</p>\n<hr />\n<h4>（二）核心关联条文</h4>\n<ul>\n<li><strong>《宪法》第5条：</strong> 依法治国以及一切国家机关、组织遵守宪法和法律。</li>\n<li><strong>《宪法》第33条：</strong> 国家尊重和保障人权。</li>\n<li><strong>第13条：</strong> 国家机关工作人员滥用职权、玩忽职守、徇私舞弊的法律责任。</li>\n<li><strong>第43条：</strong> 严格依法履行职责，禁止越权、滥权和侵犯合法权益。</li>\n<li><strong>第66条：</strong> 国家安全危机管控措施的适当性与权益保护。</li>\n<li><strong>第82条：</strong> 批评建议以及申诉、控告、检举权。</li>\n<li><strong>第83条：</strong> 限制公民权利和自由的特别措施必须依法进行，并以实际需要为限。</li>\n</ul>\n<p>可以概括为：</p>\n<p><strong>第7条：原则性人权和法治保障</strong><br />\n↓<br />\n<strong>第43条：权力依法运行</strong><br />\n↓<br />\n<strong>第66、83条：具体措施限度</strong><br />\n↓<br />\n<strong>第82条：监督和救济</strong></p>\n<hr />\n<h4>（三）2014年《反间谍法》与现行《反间谍法》的对应关系</h4>\n<p>学习时可以特别注意条文位置的变化：</p>\n<p><strong>2014年《反间谍法》第5条：</strong></p>\n<blockquote>\n<p>反间谍工作依法进行 + 尊重和保障人权 + 保障公民和组织合法权益。</p>\n</blockquote>\n<p><strong>2023年修订《反间谍法》第3条：</strong></p>\n<blockquote>\n<p>反间谍工作依法进行 + 尊重和保障人权 + 保障个人和组织合法权益。</p>\n</blockquote>\n<p>基本原则得到延续，同时条文位置由第5条前移至第3条。</p>\n<hr />\n<h4>（四）两处重要材料勘误</h4>\n<p><strong>勘误一：乙书案例中的“2009年《反间谍法》第54条”明显有误。</strong></p>\n<p>乙书第19页（PDF第28页）在叙述一宗2021年案件时，援引“2009年《反间谍法》第54条”。</p>\n<p>这一表述至少存在两个无法并存的问题：</p>\n<ol>\n<li>我国《反间谍法》于<strong>2014年11月1日</strong>首次通过，不存在“2009年《反间谍法》”；</li>\n<li>2014年《反间谍法》全文仅有<strong>40条</strong>，不存在第54条。</li>\n</ol>\n<p>2023年修订后的《反间谍法》确有第54条，其中规定部分间谍行为尚不构成犯罪时的行政处罚，但修订法自<strong>2023年7月1日</strong>起施行，因此不能直接作为2021年处罚决定的法律依据。</p>\n<p>2014年法中另有涉及泄露反间谍工作国家秘密等行为的处罚条款，但在没有取得该案完整行政处罚决定书、事实认定和当时具体适用规范之前，<strong>不宜自行替书中案例补定具体处罚依据</strong>。</p>\n<p>因此，本笔记仅作错误校勘，不据该段材料确定案件的准确法律依据。</p>\n<hr />\n<p><strong>勘误二：乙书关联法规所列《宪法》第23条不能作为人权保障的一般依据。</strong></p>\n<p>《宪法》第23条规定国家培养各种专业人才、扩大知识分子队伍等事项，并非“国家尊重和保障人权”的条款。</p>\n<p>若用于说明本条的法治与人权保障原则，更直接的宪法依据是：</p>\n<ul>\n<li><strong>第5条：依法治国和宪法法律至上；</strong></li>\n<li><strong>第33条第3款：国家尊重和保障人权。</strong></li>\n</ul>\n<p>《宪法》第23条的实际内容与一般人权保障原则并不对应。</p>\n<hr />\n<h4>（五）案例材料的证据界限</h4>\n<p>乙书有关案例进一步评价国家安全机关在办案过程中保障了犯罪嫌疑人的知情权、提出抗辩理由等程序权利。</p>\n<p>这类表述可以帮助理解作者希望说明的“依法办案和人权保障”主题，但其证明力应当与材料基础相匹配。</p>\n<p>如果只有简短新闻报道或者二手案例介绍，而没有：</p>\n<ul>\n<li>完整处罚决定；</li>\n<li>调查和询问记录；</li>\n<li>告知、陈述申辩等程序材料；</li>\n<li>行政复议或者司法裁判材料，</li>\n</ul>\n<p>则不宜据此进一步得出“案件中的各项程序权利均得到完整保障”的事实结论。</p>\n<p>因此应区分：</p>\n<blockquote>\n<p><strong>案例报道所记载的事实 ≠ 释义作者的规范评价 ≠ 经完整案卷材料验证后的法律结论。</strong></p>\n</blockquote>\n<hr />\n<h4>（六）易错点</h4>\n<p><strong>易错点1：只要措施是为了维护国家安全，就可以推定合法。</strong></p>\n<p><strong>纠正：</strong> 国家安全目的与措施合法性属于两个层次。具体措施仍须符合职权、实体条件、程序和权利保障要求。</p>\n<hr />\n<p><strong>易错点2：国家安全属于特殊领域，因此可以不完全遵守一般法治原则。</strong></p>\n<p><strong>纠正：</strong> 第7条恰恰明确规定维护国家安全必须遵守宪法和法律，并尊重和保障人权。</p>\n<hr />\n<p><strong>易错点3：“尊重和保障人权”只是宣示性规定，没有具体制度意义。</strong></p>\n<p><strong>纠正：</strong> 第43、66、82、83条分别通过职权控制、措施控制、监督救济和权利限制边界对该原则进行具体展开。</p>\n<hr />\n<p><strong>易错点4：第66条的比例控制规则直接适用于所有国家安全措施。</strong></p>\n<p><strong>纠正：</strong> 第66条直接适用于国家安全危机管控措施。可以据此理解本法的权益保护理念，但向其他场景延伸时需要说明其体系解释性质。</p>\n<hr />\n<p><strong>易错点5：国家安全领域只需要讨论国家能否限制权利。</strong></p>\n<p><strong>纠正：</strong> 第7条同时规定“尊重和保障人权”“依法保护公民的权利和自由”。国家安全法还规定保护、补偿、监督和救济等积极保障制度。</p>\n<hr />\n<p><strong>易错点6：《公民权利和政治权利国际公约》的权利限制与紧急状态克减是一回事。</strong></p>\n<p><strong>纠正：</strong> 公约第19、22条等规定特定权利在通常情况下的限制条件，第4条则针对正式宣布的公共紧急状态规定义务克减，两种制度的条件和法律后果不同。</p>\n<hr />\n<h2>六、研究问题</h2>\n<ol>\n<li><p><strong>第7条能够在多大程度上成为具体国家安全措施的审查依据？</strong><br />\n在专门法律没有明确规定比例控制标准时，能否依据第7条结合第43、83条形成更具体的合法性审查要求？</p>\n</li>\n<li><p><strong>国家安全领域的比例原则应当如何构造？</strong><br />\n第66条已经明确规定危机管控中的适当性和较小权益损害要求，这种规范理念能否通过体系解释影响其他国家安全措施？</p>\n</li>\n<li><p><strong>“实际需要为限度”如何具体判断？</strong><br />\n第83条中的“实际需要”应当依据风险发生概率、危害程度、措施有效性还是其他因素进行评价？</p>\n</li>\n<li><p><strong>如何将“尊重和保障人权”转化为可操作的程序要求？</strong><br />\n除职权和实体条件之外，国家安全行政活动是否应更加明确告知、陈述申辩、理由说明、记录留存和救济等程序要求？</p>\n</li>\n<li><p><strong>国家安全信息保密与有效救济之间如何协调？</strong><br />\n当具体决定涉及国家秘密或者敏感安全信息时，如何既保护必要的国家安全信息，又使受影响主体能够有效了解决定依据并提出救济？</p>\n</li>\n<li><p><strong>国家安全措施的监督结构应当如何完善？</strong><br />\n第82条赋予公民和组织批评建议、申诉、控告和检举权后，这些监督方式如何与行政复议、行政诉讼、监察监督以及内部监督机制形成衔接？</p>\n</li>\n<li><p><strong>国家安全与人权保障应当如何理解其规范关系？</strong><br />\n是否应从简单的“安全与权利冲突”框架，进一步转向“安全目的—法定权限—措施必要性—权利保障—监督救济”的完整法治结构？</p>\n</li>\n</ol>"},{"num":8,"label":"第八条","title":"发展与安全、统筹兼顾","lawText":"维护国家安全，应当与经济社会发展相协调。 国家安全工作应当统筹内部安全和外部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全。","calloutHtml":"","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第八条</div><p class=\"article-law-text\">维护国家安全，应当与经济社会发展相协调。 国家安全工作应当统筹内部安全和外部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第八条</div><p class=\"article-law-text\">维护国家安全，应当与经济社会发展相协调。 国家安全工作应当统筹内部安全和外部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全。</p><div class=\"article-note-divider\">发展与安全、统筹兼顾 · MD 研读笔记</div><div class=\"article-notes\"><p>本条有两款：第一款规定发展与安全的协调；第二款列出四组需要统筹的关系。合起来可以把握为五组关系。</p>\n<h3>二、立法沿革</h3>\n<p><strong>思想来源。</strong> 甲书第34页将本条与2014年4月15日提出的总体国家安全观及五组关系相联系，强调全面理解安全、发展及不同领域间的联系。</p>\n<p><strong>初稿已有基本原则。</strong> 2014年12月草案说明已经明确维护国家安全与经济社会发展相协调、统筹各领域安全的原则，见甲书附录二第375页（PDF388页）。因此，基本思路并非最后审议阶段才形成。</p>\n<p><strong>证据界限。</strong> 对第二款四组关系在每一轮审议中是否调整、如何调整，本批未掌握足够的逐稿资料；不作无据的变动叙述。2015年后的“统筹发展和安全”政策发展，可补充理解，不能当作2015年文本后来被修正的证据。</p>\n<h3>三、主要内容</h3>\n<p><strong>发展与安全相协调。</strong> 两书均强调，发展为安全提供物质和社会条件，安全又为发展提供必要环境。不能长期忽视安全积累风险，也不能只计算安全收益而完全忽略发展成本。</p>\n<table>\n<thead>\n<tr>\n  <th>统筹关系</th>\n  <th>理解重点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>内部安全与外部安全</td>\n  <td>既识别各自风险，也关注内外风险相互传导、叠加</td>\n</tr>\n<tr>\n  <td>国土安全与国民安全</td>\n  <td>既维护主权、统一和领土完整，也保护人的安全和利益</td>\n</tr>\n<tr>\n  <td>传统安全与非传统安全</td>\n  <td>既关注军事、政治等传统问题，也关注经济、科技、生态等领域，注意二者交织</td>\n</tr>\n<tr>\n  <td>自身安全与共同安全</td>\n  <td>在维护本国正当安全利益时，兼顾其他国家与国际社会的安全联系</td>\n</tr>\n</tbody>\n</table>\n<p><strong>统筹不是机械平均。</strong> 不同时间、地区和领域可以有不同重点；关键是以整体联系判断重点，避免单一部门目标与整体安全、发展利益脱节。此项属于对两书论述的综合归纳。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>风险的相互影响〔笔记分析〕。</strong> 一项措施可能降低某类短期风险，却增加创新受阻、供给减少、信息不畅等长期风险。依据本条，研究应同时考察直接效果、间接影响和时间尺度，而不是只用某一领域的单个指标评价整体安全。</p>\n<p><strong>国民安全具有跨境面向〔体系解释〕。</strong> 乙书第21页把国民安全表述为“领土内国民的安全”，范围过窄。本法第33条明确保护海外中国公民、组织和机构的安全及正当权益，说明不能把国民安全一律限于境内。相关保护如何实施，仍需结合具体法律、国际法和实际条件。</p>\n<p><strong>“相协调”提供法律论证方向。</strong> 将国家安全与经济社会发展协调起来，是法条明确要求；但本条没有给出统一的成本收益公式。可据此要求说明安全措施与发展目标怎样衔接，不宜凭本条自行设定法无明文的审批、豁免或处罚规则。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书实例</strong>：第21—22页以CPTPP相关数据流动议题及2022年《数据出境安全评估办法》，说明数据利用和安全保护的协调问题。这是制度场景，不能概括为全部数据跨境流动均应适用同一限制。</li>\n<li><strong>补充材料</strong>：2024年《促进和规范数据跨境流动规定》调整数据出境制度，规定符合条件的活动可以免予特定出境程序，同时保留数据保护义务。这可以作为本条协调思路的研究例子；该规章有其专门法律依据，并非仅凭本条作出的授权。<a href=\"https://www.cac.gov.cn/2024-03/22/c_1712776611775634.htm\">国家网信办规定第1、3—5、10—13条</a>。</li>\n<li><strong>关联条文</strong>：第2、3、10、33条及第二章各领域任务。</li>\n<li><strong>研究问题</strong>：如何判断一种措施实现了较高水平的整体安全，而不是把某一类风险转移到其他领域、其他人群或未来？</li>\n</ul></div></div>","notesHtml":"<p>本条有两款：第一款规定发展与安全的协调；第二款列出四组需要统筹的关系。合起来可以把握为五组关系。</p>\n<h3>二、立法沿革</h3>\n<p><strong>思想来源。</strong> 甲书第34页将本条与2014年4月15日提出的总体国家安全观及五组关系相联系，强调全面理解安全、发展及不同领域间的联系。</p>\n<p><strong>初稿已有基本原则。</strong> 2014年12月草案说明已经明确维护国家安全与经济社会发展相协调、统筹各领域安全的原则，见甲书附录二第375页（PDF388页）。因此，基本思路并非最后审议阶段才形成。</p>\n<p><strong>证据界限。</strong> 对第二款四组关系在每一轮审议中是否调整、如何调整，本批未掌握足够的逐稿资料；不作无据的变动叙述。2015年后的“统筹发展和安全”政策发展，可补充理解，不能当作2015年文本后来被修正的证据。</p>\n<h3>三、主要内容</h3>\n<p><strong>发展与安全相协调。</strong> 两书均强调，发展为安全提供物质和社会条件，安全又为发展提供必要环境。不能长期忽视安全积累风险，也不能只计算安全收益而完全忽略发展成本。</p>\n<table>\n<thead>\n<tr>\n  <th>统筹关系</th>\n  <th>理解重点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>内部安全与外部安全</td>\n  <td>既识别各自风险，也关注内外风险相互传导、叠加</td>\n</tr>\n<tr>\n  <td>国土安全与国民安全</td>\n  <td>既维护主权、统一和领土完整，也保护人的安全和利益</td>\n</tr>\n<tr>\n  <td>传统安全与非传统安全</td>\n  <td>既关注军事、政治等传统问题，也关注经济、科技、生态等领域，注意二者交织</td>\n</tr>\n<tr>\n  <td>自身安全与共同安全</td>\n  <td>在维护本国正当安全利益时，兼顾其他国家与国际社会的安全联系</td>\n</tr>\n</tbody>\n</table>\n<p><strong>统筹不是机械平均。</strong> 不同时间、地区和领域可以有不同重点；关键是以整体联系判断重点，避免单一部门目标与整体安全、发展利益脱节。此项属于对两书论述的综合归纳。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>风险的相互影响〔笔记分析〕。</strong> 一项措施可能降低某类短期风险，却增加创新受阻、供给减少、信息不畅等长期风险。依据本条，研究应同时考察直接效果、间接影响和时间尺度，而不是只用某一领域的单个指标评价整体安全。</p>\n<p><strong>国民安全具有跨境面向〔体系解释〕。</strong> 乙书第21页把国民安全表述为“领土内国民的安全”，范围过窄。本法第33条明确保护海外中国公民、组织和机构的安全及正当权益，说明不能把国民安全一律限于境内。相关保护如何实施，仍需结合具体法律、国际法和实际条件。</p>\n<p><strong>“相协调”提供法律论证方向。</strong> 将国家安全与经济社会发展协调起来，是法条明确要求；但本条没有给出统一的成本收益公式。可据此要求说明安全措施与发展目标怎样衔接，不宜凭本条自行设定法无明文的审批、豁免或处罚规则。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书实例</strong>：第21—22页以CPTPP相关数据流动议题及2022年《数据出境安全评估办法》，说明数据利用和安全保护的协调问题。这是制度场景，不能概括为全部数据跨境流动均应适用同一限制。</li>\n<li><strong>补充材料</strong>：2024年《促进和规范数据跨境流动规定》调整数据出境制度，规定符合条件的活动可以免予特定出境程序，同时保留数据保护义务。这可以作为本条协调思路的研究例子；该规章有其专门法律依据，并非仅凭本条作出的授权。<a href=\"https://www.cac.gov.cn/2024-03/22/c_1712776611775634.htm\">国家网信办规定第1、3—5、10—13条</a>。</li>\n<li><strong>关联条文</strong>：第2、3、10、33条及第二章各领域任务。</li>\n<li><strong>研究问题</strong>：如何判断一种措施实现了较高水平的整体安全，而不是把某一类风险转移到其他领域、其他人群或未来？</li>\n</ul>"},{"num":9,"label":"第九条","title":"预防为主、标本兼治、专群结合","lawText":"维护国家安全，应当坚持预防为主、标本兼治，专门工作与群众路线相结合，充分发挥专门机关和其他有关机关维护国家安全的职能作用，广泛动员公民和组织，防范、制止和依法惩治危害国家安全的行为。","calloutHtml":"","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第九条</div><p class=\"article-law-text\">维护国家安全，应当坚持预防为主、标本兼治，专门工作与群众路线相结合，充分发挥专门机关和其他有关机关维护国家安全的职能作用，广泛动员公民和组织，防范、制止和依法惩治危害国家安全的行为。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第九条</div><p class=\"article-law-text\">维护国家安全，应当坚持预防为主、标本兼治，专门工作与群众路线相结合，充分发挥专门机关和其他有关机关维护国家安全的职能作用，广泛动员公民和组织，防范、制止和依法惩治危害国家安全的行为。</p><div class=\"article-note-divider\">预防为主、标本兼治、专群结合 · MD 研读笔记</div><div class=\"article-notes\"><p>本条包含两个主要层次：以何种方式应对风险，以及组织哪些力量共同维护安全。</p>\n<h3>二、立法沿革</h3>\n<p><strong>专群结合具有制度延续。</strong> 1993年国家安全立法已有国家安全工作与群众支持相联系的内容；2014年《反间谍法》第2条明确专门工作与群众路线相结合，第3条第2款规定有关机关、部门之间的配合，第4条强调依靠人民支持、动员和组织人民防范制止间谍行为。这一工作方式在2015年法中被放到更广泛的国家安全框架内理解。<a href=\"https://www.xiongan.gov.cn/2020-11/01/c_1210867136.htm\">2014年法律文本</a>。</p>\n<p><strong>初稿阶段已经确立基本思路。</strong> 2014年12月草案说明已列预防为主、标本兼治以及专门工作与群众路线相结合原则，见甲书附录二第375页（PDF388页）。现有材料足以说明原则的早期存在，不能据此还原未核实的每一版文字。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>预防为主。</strong> 将工作前移到风险识别、防范和能力建设，减少重大危害发生的可能性。它与风险评估、监测预警、预案等制度具有联系。</li>\n<li><strong>标本兼治。</strong> 既处理已经表现出来的危害和问题，也研究其产生的深层原因、条件和制度薄弱环节。不能把“治本”简单等同于加重惩罚。</li>\n<li><strong>专门工作与群众路线相结合。</strong> 专门机关承担依法开展的专业工作，公民和组织通过依法报告、配合、提供支持等方式参与。</li>\n<li><strong>专门机关与其他机关相配合。</strong> 甲、乙两书都强调，专群结合不能只理解为机关与个人之间的关系，还应关注有关部门依法履行职责、互相支持。</li>\n<li><strong>防范、制止、惩治相衔接。</strong> 分别面向风险形成、危害发生和责任追究等环节。条文对惩治明确要求“依法”，整条工作也受第7条约束。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>预防与惩罚的证明要求不能混同〔笔记分析〕。</strong> 预警信息可以触发依法评估或核查，但不当然证明某人已经违法犯罪。追究行政或刑事责任仍需满足相应实体和程序条件。“风险存在”与“个人应受处罚”是不同法律判断。</p>\n<p><strong>公众参与不等于执法权转移〔笔记分析〕。</strong> 公民和组织参与维护安全，不能由此自行取得搜查、扣押、拘禁或调查他人隐私的权力。应将线索提供、专业核查、依法处理区分开来，避免群众动员替代法定程序。</p>\n<p><strong>支持义务与权益保障相衔接。</strong> 维护安全的参与者也需要保护。第六章有关公民、组织的权利义务，可用于研究协助范围、人身保护、补偿抚恤和救济。参与机制越广泛，越需要明确合法边界和保障措施。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书实例</strong>：举报渠道及基层参与事例说明公众线索能够辅助专业工作；但举报数量、社会动员规模不直接等于国家安全工作的实际效果。</li>\n<li><strong>甲书补充</strong>：本条的预防与标本兼治不限于反间谍活动，还可从其他安全领域的风险源、制度漏洞和防范措施理解。具体措施仍须分别适用有关法律。</li>\n<li><strong>关联条文</strong>：第11—14条、第四章风险预防评估预警制度、第75条专门工作支持配合、第六章权利义务。</li>\n<li><strong>研究问题</strong>：怎样建立能够鼓励真实报告、保护参与者并减少误报、诬告和权利侵害的公众参与机制？</li>\n</ul></div></div>","notesHtml":"<p>本条包含两个主要层次：以何种方式应对风险，以及组织哪些力量共同维护安全。</p>\n<h3>二、立法沿革</h3>\n<p><strong>专群结合具有制度延续。</strong> 1993年国家安全立法已有国家安全工作与群众支持相联系的内容；2014年《反间谍法》第2条明确专门工作与群众路线相结合，第3条第2款规定有关机关、部门之间的配合，第4条强调依靠人民支持、动员和组织人民防范制止间谍行为。这一工作方式在2015年法中被放到更广泛的国家安全框架内理解。<a href=\"https://www.xiongan.gov.cn/2020-11/01/c_1210867136.htm\">2014年法律文本</a>。</p>\n<p><strong>初稿阶段已经确立基本思路。</strong> 2014年12月草案说明已列预防为主、标本兼治以及专门工作与群众路线相结合原则，见甲书附录二第375页（PDF388页）。现有材料足以说明原则的早期存在，不能据此还原未核实的每一版文字。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>预防为主。</strong> 将工作前移到风险识别、防范和能力建设，减少重大危害发生的可能性。它与风险评估、监测预警、预案等制度具有联系。</li>\n<li><strong>标本兼治。</strong> 既处理已经表现出来的危害和问题，也研究其产生的深层原因、条件和制度薄弱环节。不能把“治本”简单等同于加重惩罚。</li>\n<li><strong>专门工作与群众路线相结合。</strong> 专门机关承担依法开展的专业工作，公民和组织通过依法报告、配合、提供支持等方式参与。</li>\n<li><strong>专门机关与其他机关相配合。</strong> 甲、乙两书都强调，专群结合不能只理解为机关与个人之间的关系，还应关注有关部门依法履行职责、互相支持。</li>\n<li><strong>防范、制止、惩治相衔接。</strong> 分别面向风险形成、危害发生和责任追究等环节。条文对惩治明确要求“依法”，整条工作也受第7条约束。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>预防与惩罚的证明要求不能混同〔笔记分析〕。</strong> 预警信息可以触发依法评估或核查，但不当然证明某人已经违法犯罪。追究行政或刑事责任仍需满足相应实体和程序条件。“风险存在”与“个人应受处罚”是不同法律判断。</p>\n<p><strong>公众参与不等于执法权转移〔笔记分析〕。</strong> 公民和组织参与维护安全，不能由此自行取得搜查、扣押、拘禁或调查他人隐私的权力。应将线索提供、专业核查、依法处理区分开来，避免群众动员替代法定程序。</p>\n<p><strong>支持义务与权益保障相衔接。</strong> 维护安全的参与者也需要保护。第六章有关公民、组织的权利义务，可用于研究协助范围、人身保护、补偿抚恤和救济。参与机制越广泛，越需要明确合法边界和保障措施。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>乙书实例</strong>：举报渠道及基层参与事例说明公众线索能够辅助专业工作；但举报数量、社会动员规模不直接等于国家安全工作的实际效果。</li>\n<li><strong>甲书补充</strong>：本条的预防与标本兼治不限于反间谍活动，还可从其他安全领域的风险源、制度漏洞和防范措施理解。具体措施仍须分别适用有关法律。</li>\n<li><strong>关联条文</strong>：第11—14条、第四章风险预防评估预警制度、第75条专门工作支持配合、第六章权利义务。</li>\n<li><strong>研究问题</strong>：怎样建立能够鼓励真实报告、保护参与者并减少误报、诬告和权利侵害的公众参与机制？</li>\n</ul>"},{"num":10,"label":"第十条","title":"国际安全合作与共同安全","lawText":"维护国家安全，应当坚持互信、互利、平等、协作，积极同外国政府和国际组织开展安全交流合作，履行国际安全义务，促进共同安全，维护世界和平。","calloutHtml":"","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第十条</div><p class=\"article-law-text\">维护国家安全，应当坚持互信、互利、平等、协作，积极同外国政府和国际组织开展安全交流合作，履行国际安全义务，促进共同安全，维护世界和平。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第十条</div><p class=\"article-law-text\">维护国家安全，应当坚持互信、互利、平等、协作，积极同外国政府和国际组织开展安全交流合作，履行国际安全义务，促进共同安全，维护世界和平。</p><div class=\"article-note-divider\">国际安全合作与共同安全 · MD 研读笔记</div><div class=\"article-notes\"><p>本条规定维护国家安全的对外合作原则，与第3条“以促进国际安全为依托”、第8条自身安全和共同安全的统筹相衔接。</p>\n<h3>二、立法沿革</h3>\n<p><strong>理念发展。</strong> 两书均联系我国关于互信、互利、平等、协作的新安全观和共同安全的论述，说明安全合作在国家安全体系中的位置。甲书偏重这一原则的制度意义；乙书还介绍共同安全概念的思想背景及后续实践。</p>\n<p><strong>初稿已经规定。</strong> 甲书附录二第376页（PDF389页）引述的草案条款已经包括四项合作原则、外国政府和国际组织、安全交流合作、国际义务、共同安全和世界和平。其表述含“有效履行国际安全义务”，最终文本为“履行国际安全义务”。能够确认的是两份材料的文字差异；修改时点和专门理由未核，不据此推导义务强度的实质变化。</p>\n<p><strong>后续发展另行标注。</strong> 乙书以2022年全球安全倡议等材料说明本条理念在实践中的展开。这些是通过后的发展，不是本条文字于2022年发生修改。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>互信。</strong> 增进沟通和理解，减少误判，形成可预期的合作条件。</li>\n<li><strong>互利。</strong> 合作应考虑相关各方的正当利益和安全关切，寻求共同收益。</li>\n<li><strong>平等。</strong> 以平等交往和相互尊重为基础开展合作，而非仅按力量强弱决定对方的安全地位。</li>\n<li><strong>协作。</strong> 通过交流、协调和具体行动，应对单一国家难以独立处理的安全问题。</li>\n<li><strong>国际义务与共同安全。</strong> 合作不仅是政策选择，还涉及已承担国际义务的履行。具体义务的主体、范围和内容，应查相应国际法和国内实施依据。</li>\n</ol>\n<p>上述四项原则的简要解释，是对两书相关论述的归纳；本条没有逐项规定独立的程序或责任形式。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>国际法框架。</strong> 《联合国宪章》第1条关于维护国际和平与安全及国际合作，第2条关于主权平等、善意履行义务、和平解决争端和禁止非法武力威胁或使用武力的原则，为理解安全合作提供规范背景。<a href=\"https://www.un.org/zh/about-us/un-charter/full-text\">《联合国宪章》中文全文</a>。</p>\n<p><strong>共同安全与集体安全须区分〔笔记分析〕。</strong> “共同安全”重视各方安全相互联系、通过合作减少威胁；宪章框架下的“集体安全”还涉及特定机构、职权和程序。不能把一般共同安全倡议等同于安理会决定，也不能把一般政治倡议直接认定为条约义务。</p>\n<p><strong>国内法与国际合作的衔接〔笔记分析〕。</strong> 本条为安全合作提供原则方向，但情报或数据交流、司法协助等具体合作，仍须分别符合适用的国内权限和程序、国际协议等条件。本条本身没有给予无条件的跨境资料提供权。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>两书对读</strong>：甲书强调国家安全不能脱离地区和世界安全环境；乙书以全球安全倡议、参与国际合作等事例说明这一联系。引用事例时保留其时间范围，不把作者评价当作对合作效果的独立证明。</li>\n<li><strong>常见误解</strong>：促进共同安全不等于放弃本国正当权益；维护本国安全也不能单凭本条推导超越国际法的行动权力。</li>\n<li><strong>关联条文</strong>：第3条、第8条、第18条有关国际军事安全合作及参与国际安全事务的规定。</li>\n<li><strong>研究问题</strong>：国际安全承诺如何区分政治倡议、条约义务、国际组织决定和国内法上的执行权限？</li>\n</ul></div></div>","notesHtml":"<p>本条规定维护国家安全的对外合作原则，与第3条“以促进国际安全为依托”、第8条自身安全和共同安全的统筹相衔接。</p>\n<h3>二、立法沿革</h3>\n<p><strong>理念发展。</strong> 两书均联系我国关于互信、互利、平等、协作的新安全观和共同安全的论述，说明安全合作在国家安全体系中的位置。甲书偏重这一原则的制度意义；乙书还介绍共同安全概念的思想背景及后续实践。</p>\n<p><strong>初稿已经规定。</strong> 甲书附录二第376页（PDF389页）引述的草案条款已经包括四项合作原则、外国政府和国际组织、安全交流合作、国际义务、共同安全和世界和平。其表述含“有效履行国际安全义务”，最终文本为“履行国际安全义务”。能够确认的是两份材料的文字差异；修改时点和专门理由未核，不据此推导义务强度的实质变化。</p>\n<p><strong>后续发展另行标注。</strong> 乙书以2022年全球安全倡议等材料说明本条理念在实践中的展开。这些是通过后的发展，不是本条文字于2022年发生修改。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>互信。</strong> 增进沟通和理解，减少误判，形成可预期的合作条件。</li>\n<li><strong>互利。</strong> 合作应考虑相关各方的正当利益和安全关切，寻求共同收益。</li>\n<li><strong>平等。</strong> 以平等交往和相互尊重为基础开展合作，而非仅按力量强弱决定对方的安全地位。</li>\n<li><strong>协作。</strong> 通过交流、协调和具体行动，应对单一国家难以独立处理的安全问题。</li>\n<li><strong>国际义务与共同安全。</strong> 合作不仅是政策选择，还涉及已承担国际义务的履行。具体义务的主体、范围和内容，应查相应国际法和国内实施依据。</li>\n</ol>\n<p>上述四项原则的简要解释，是对两书相关论述的归纳；本条没有逐项规定独立的程序或责任形式。</p>\n<h3>四、比较法/法理</h3>\n<p><strong>国际法框架。</strong> 《联合国宪章》第1条关于维护国际和平与安全及国际合作，第2条关于主权平等、善意履行义务、和平解决争端和禁止非法武力威胁或使用武力的原则，为理解安全合作提供规范背景。<a href=\"https://www.un.org/zh/about-us/un-charter/full-text\">《联合国宪章》中文全文</a>。</p>\n<p><strong>共同安全与集体安全须区分〔笔记分析〕。</strong> “共同安全”重视各方安全相互联系、通过合作减少威胁；宪章框架下的“集体安全”还涉及特定机构、职权和程序。不能把一般共同安全倡议等同于安理会决定，也不能把一般政治倡议直接认定为条约义务。</p>\n<p><strong>国内法与国际合作的衔接〔笔记分析〕。</strong> 本条为安全合作提供原则方向，但情报或数据交流、司法协助等具体合作，仍须分别符合适用的国内权限和程序、国际协议等条件。本条本身没有给予无条件的跨境资料提供权。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>两书对读</strong>：甲书强调国家安全不能脱离地区和世界安全环境；乙书以全球安全倡议、参与国际合作等事例说明这一联系。引用事例时保留其时间范围，不把作者评价当作对合作效果的独立证明。</li>\n<li><strong>常见误解</strong>：促进共同安全不等于放弃本国正当权益；维护本国安全也不能单凭本条推导超越国际法的行动权力。</li>\n<li><strong>关联条文</strong>：第3条、第8条、第18条有关国际军事安全合作及参与国际安全事务的规定。</li>\n<li><strong>研究问题</strong>：国际安全承诺如何区分政治倡议、条约义务、国际组织决定和国内法上的执行权限？</li>\n</ul>"},{"num":11,"label":"第十一条","title":"维护国家安全的责任与义务","lawText":"中华人民共和国公民、一切国家机关和武装力量、各政党和各人民团体、企业事业组织和其他社会组织，都有维护国家安全的责任和义务。 中国的主权和领土完整不容侵犯和分割。维护国家主权、统一和领土完整是包括港澳同胞和台湾同胞在内的全中国人民的共同义务。","calloutHtml":"","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第十一条</div><p class=\"article-law-text\">中华人民共和国公民、一切国家机关和武装力量、各政党和各人民团体、企业事业组织和其他社会组织，都有维护国家安全的责任和义务。 中国的主权和领土完整不容侵犯和分割。维护国家主权、统一和领土完整是包括港澳同胞和台湾同胞在内的全中国人民的共同义务。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第十一条</div><p class=\"article-law-text\">中华人民共和国公民、一切国家机关和武装力量、各政党和各人民团体、企业事业组织和其他社会组织，都有维护国家安全的责任和义务。 中国的主权和领土完整不容侵犯和分割。维护国家主权、统一和领土完整是包括港澳同胞和台湾同胞在内的全中国人民的共同义务。</p><div class=\"article-note-divider\">维护国家安全的责任与义务 · MD 研读笔记</div><div class=\"article-notes\"><p>第一款规定维护国家安全的广泛主体范围；第二款专门规定维护国家主权、统一和领土完整的共同义务。</p>\n<h3>二、立法沿革</h3>\n<p><strong>宪法上的义务基础。</strong> 两书主要联系《宪法》第52条维护国家统一和民族团结义务、第54条维护祖国安全荣誉利益义务、第55条保卫祖国和抵抗侵略职责。本条将相关义务放入综合性国家安全法律框架，并明确机关、组织等主体。</p>\n<p><strong>初稿已有港澳台相关表述。</strong> 2014年12月22日草案说明已强调国家安全人人有责，并说明包括港澳同胞和台湾同胞在内的共同义务，见甲书附录二第377页（PDF390页）。不能误记为三审时才增加。</p>\n<p><strong>注意说明与完整草案的差别。</strong> 草案说明中相关表述与定稿有少量文字差异，但说明可能包含概述；仅据它不能还原每一处字词的修改过程。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>义务主体广泛。</strong> 本条既包括公民，也包括国家机关、武装力量、政党、人民团体和各类组织。维护国家安全并非只由国家安全机关承担。</li>\n<li><strong>共同责任不等于相同责任。</strong> 国家机关的职权与职责、企业的配合和内部管理义务、公民的报告和协助义务，应分别查明，不能把所有主体的义务内容简单等同。</li>\n<li><strong>第二款突出特定保护利益。</strong> 主权、统一和领土完整在本条中被专门强调。这是本法关于共同义务的规范表达；具体法律适用与执行仍应分别依据有关制度。</li>\n<li><strong>后续条文将原则具体化。</strong> 第77条规定报告线索、提供证据、支持协助、保守秘密等义务，第78条规定单位教育动员职责，第79条涉及企业事业组织配合采取安全措施，第13条连接法律责任。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>一般义务与具体行为义务〔笔记分析〕。</strong> 本条确定总体责任方向；判断某人是否违反一项具体义务，还要确定其法定内容、触发条件、履行能力及有关程序。抽象的共同义务不当然意味着可以要求任意个人无限提供财产、信息或劳动。</p>\n<p><strong>义务与权利相互联系。</strong> 本条应同第7条以及第六章保护、补偿和救济规定合读。承担维护安全的义务，不等于放弃自身的法定权利。</p>\n<p><strong>共同义务与地域适用〔体系解释〕。</strong> 甲书第56页特别讨论港澳基本法第18、23条。第二款的共同义务表述，不能直接推出内地所有国家安全法律、职权和程序自动在港澳以相同方式实施。应区分全国性法律适用机制、特别行政区自行立法义务及有关具体制度。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>版本更新</strong>：甲书第56页“香港尚未就基本法第二十三条立法”是2016年的历史描述。香港《维护国家安全条例》已于2024年3月23日刊宪生效；应将此作为后续发展另记。<a href=\"https://www.news.gov.hk/chi/2024/03/20240323/20240323_170428_609.html\">香港特区政府公布的生效信息</a>。</li>\n<li><strong>两书对读</strong>：甲书重在宪法、基本法和具体义务的联系；乙书补充后续政治与实践背景。乙书有关南海仲裁的评价是其叙述立场，若作国际法专题研究，应另行对照裁决、管辖权规则和各方正式立场，不以读书概述替代争议分析。</li>\n<li><strong>研究问题</strong>：在普遍义务的前提下，怎样使不同主体明确知道何时应当做什么、由谁提出要求、可以获得何种保障？</li>\n</ul></div></div>","notesHtml":"<p>第一款规定维护国家安全的广泛主体范围；第二款专门规定维护国家主权、统一和领土完整的共同义务。</p>\n<h3>二、立法沿革</h3>\n<p><strong>宪法上的义务基础。</strong> 两书主要联系《宪法》第52条维护国家统一和民族团结义务、第54条维护祖国安全荣誉利益义务、第55条保卫祖国和抵抗侵略职责。本条将相关义务放入综合性国家安全法律框架，并明确机关、组织等主体。</p>\n<p><strong>初稿已有港澳台相关表述。</strong> 2014年12月22日草案说明已强调国家安全人人有责，并说明包括港澳同胞和台湾同胞在内的共同义务，见甲书附录二第377页（PDF390页）。不能误记为三审时才增加。</p>\n<p><strong>注意说明与完整草案的差别。</strong> 草案说明中相关表述与定稿有少量文字差异，但说明可能包含概述；仅据它不能还原每一处字词的修改过程。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>义务主体广泛。</strong> 本条既包括公民，也包括国家机关、武装力量、政党、人民团体和各类组织。维护国家安全并非只由国家安全机关承担。</li>\n<li><strong>共同责任不等于相同责任。</strong> 国家机关的职权与职责、企业的配合和内部管理义务、公民的报告和协助义务，应分别查明，不能把所有主体的义务内容简单等同。</li>\n<li><strong>第二款突出特定保护利益。</strong> 主权、统一和领土完整在本条中被专门强调。这是本法关于共同义务的规范表达；具体法律适用与执行仍应分别依据有关制度。</li>\n<li><strong>后续条文将原则具体化。</strong> 第77条规定报告线索、提供证据、支持协助、保守秘密等义务，第78条规定单位教育动员职责，第79条涉及企业事业组织配合采取安全措施，第13条连接法律责任。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>一般义务与具体行为义务〔笔记分析〕。</strong> 本条确定总体责任方向；判断某人是否违反一项具体义务，还要确定其法定内容、触发条件、履行能力及有关程序。抽象的共同义务不当然意味着可以要求任意个人无限提供财产、信息或劳动。</p>\n<p><strong>义务与权利相互联系。</strong> 本条应同第7条以及第六章保护、补偿和救济规定合读。承担维护安全的义务，不等于放弃自身的法定权利。</p>\n<p><strong>共同义务与地域适用〔体系解释〕。</strong> 甲书第56页特别讨论港澳基本法第18、23条。第二款的共同义务表述，不能直接推出内地所有国家安全法律、职权和程序自动在港澳以相同方式实施。应区分全国性法律适用机制、特别行政区自行立法义务及有关具体制度。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>版本更新</strong>：甲书第56页“香港尚未就基本法第二十三条立法”是2016年的历史描述。香港《维护国家安全条例》已于2024年3月23日刊宪生效；应将此作为后续发展另记。<a href=\"https://www.news.gov.hk/chi/2024/03/20240323/20240323_170428_609.html\">香港特区政府公布的生效信息</a>。</li>\n<li><strong>两书对读</strong>：甲书重在宪法、基本法和具体义务的联系；乙书补充后续政治与实践背景。乙书有关南海仲裁的评价是其叙述立场，若作国际法专题研究，应另行对照裁决、管辖权规则和各方正式立场，不以读书概述替代争议分析。</li>\n<li><strong>研究问题</strong>：在普遍义务的前提下，怎样使不同主体明确知道何时应当做什么、由谁提出要求、可以获得何种保障？</li>\n</ul>"},{"num":12,"label":"第十二条","title":"表彰和奖励","lawText":"国家对在维护国家安全工作中作出突出贡献的个人和组织给予表彰和奖励。","calloutHtml":"","frontHtml":"<div class=\"article-side article-front\"><div class=\"article-label\">第十二条</div><p class=\"article-law-text\">国家对在维护国家安全工作中作出突出贡献的个人和组织给予表彰和奖励。</p></div>","backHtml":"<div class=\"article-side article-back\"><div class=\"article-label\">第十二条</div><p class=\"article-law-text\">国家对在维护国家安全工作中作出突出贡献的个人和组织给予表彰和奖励。</p><div class=\"article-note-divider\">表彰和奖励 · MD 研读笔记</div><div class=\"article-notes\"><p>本条是激励性规范，基本结构为“实施主体—受奖对象—贡献条件—激励方式”。</p>\n<h3>二、立法沿革</h3>\n<p><strong>制度背景。</strong> 甲书将奖励置于法律的激励功能中解释：国家安全维护除职责、义务与责任追究外，还需要通过荣誉和物质激励，鼓励个人、组织作出积极贡献。本条与第9条公众参与、第11条共同责任相衔接。</p>\n<p><strong>与既有奖励制度的衔接。</strong> 甲书联系公务员奖励制度说明，本条作原则规定，具体奖励权限、形式和程序仍要依有关制度实施。不能因本条文字简短，就认为奖励可以脱离程序任意作出。</p>\n<p>本批所读立法附录未提供本条具体的逐稿修改记录；这里记载的是制度背景，不推断它在某轮审议被新增或改写。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>主体是国家。</strong> 甲书强调，本条规定的是国家实施的表彰奖励，与社会组织自行开展的民间表扬有区别。具体由哪个机关实施，要看相应权限规定。</li>\n<li><strong>对象包括个人与组织。</strong> 既可能是国家机关工作人员或集体，也可能是普通公民、企业事业组织等，不能限于国家安全机关及其人员。</li>\n<li><strong>条件是突出贡献。</strong> 法条使用“突出”，意味着应当根据贡献的实质作出评价，而不是凡参与或凡举报必然得到同等程度的奖励。</li>\n<li><strong>方式包括表彰和奖励。</strong> 两书均从精神激励与物质激励理解，但本条没有规定每一种贡献对应何种荣誉、金额或待遇，也未要求所有受奖者都必须同时获得两种形式。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>法律的激励功能。</strong> 甲书将本条与制裁性规范对比，说明法律不仅通过不利后果约束行为，也能通过正向激励引导参与。两者共同服务于制度的实施。</p>\n<p><strong>突出贡献的认定〔笔记分析〕。</strong> 评价宜关注帮助发现、防范、制止或处置危害的实际作用。两书都提到贡献的示范和社会影响，但国家安全工作可能需要保密，不能据此把“事迹必须公开并获得广泛关注”另加为法定受奖条件。</p>\n<p><strong>奖励与保护、补偿不同。</strong> 奖励着眼于积极贡献；保护着眼于避免参与者遭受危险；补偿、抚恤着眼于依法处理履行相关义务所受损失。不能因为给了奖金，就认为保护和补偿义务已经履行。</p>\n<h3>五、其他补充</h3>\n<ul>\n<li><strong>行政裁量问题</strong>：本条并未规定统一数额，也不宜从本条直接推导某个具体金额的请求权。研究具体争议，要查有关奖励办法和认定程序。</li>\n<li><strong>参与边界</strong>：贡献评价不应鼓励虚构事实、侵害他人或违法取证。公众参与仍受第7条法治原则和有关法律约束。</li>\n<li><strong>两书对读</strong>：甲书对激励原理、精神与物质奖励、程序衔接论述更详细；乙书适合归纳国家、个人组织、突出贡献、激励方式四个要素。</li>\n<li><strong>研究问题</strong>：怎样兼顾真实贡献、保密需要、程序公正与公众对奖励制度的可预期性？</li>\n</ul></div></div>","notesHtml":"<p>本条是激励性规范，基本结构为“实施主体—受奖对象—贡献条件—激励方式”。</p>\n<h3>二、立法沿革</h3>\n<p><strong>制度背景。</strong> 甲书将奖励置于法律的激励功能中解释：国家安全维护除职责、义务与责任追究外，还需要通过荣誉和物质激励，鼓励个人、组织作出积极贡献。本条与第9条公众参与、第11条共同责任相衔接。</p>\n<p><strong>与既有奖励制度的衔接。</strong> 甲书联系公务员奖励制度说明，本条作原则规定，具体奖励权限、形式和程序仍要依有关制度实施。不能因本条文字简短，就认为奖励可以脱离程序任意作出。</p>\n<p>本批所读立法附录未提供本条具体的逐稿修改记录；这里记载的是制度背景，不推断它在某轮审议被新增或改写。</p>\n<h3>三、主要内容</h3>\n<ol>\n<li><strong>主体是国家。</strong> 甲书强调，本条规定的是国家实施的表彰奖励，与社会组织自行开展的民间表扬有区别。具体由哪个机关实施，要看相应权限规定。</li>\n<li><strong>对象包括个人与组织。</strong> 既可能是国家机关工作人员或集体，也可能是普通公民、企业事业组织等，不能限于国家安全机关及其人员。</li>\n<li><strong>条件是突出贡献。</strong> 法条使用“突出”，意味着应当根据贡献的实质作出评价，而不是凡参与或凡举报必然得到同等程度的奖励。</li>\n<li><strong>方式包括表彰和奖励。</strong> 两书均从精神激励与物质激励理解，但本条没有规定每一种贡献对应何种荣誉、金额或待遇，也未要求所有受奖者都必须同时获得两种形式。</li>\n</ol>\n<h3>四、比较法/法理</h3>\n<p><strong>法律的激励功能。</strong> 甲书将本条与制裁性规范对比，说明法律不仅通过不利后果约束行为，也能通过正向激励引导参与。两者共同服务于制度的实施。</p>\n<p><strong>突出贡献的认定〔笔记分析〕。</strong> 评价宜关注帮助发现、
