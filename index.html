cp>〔笔记分析〕理解本条宜从“控诉与裁判分离”“权力相互制约”“权利保障”三个方面展开。侦查机关形成的判断需要经过检察审查；起诉意见需要经过法院依法审理。各环节的独立判断，是降低误判风险、保证刑法正确实施的制度条件。\u003c/p>\n\u003cp>“互相配合”与“互相制约”应当同时理解，不能只保留配合。案件专业化和跨机关沟通可以提高办案能力，但不能预先决定裁判结果，也不能替代辩护、证据审查和法定救济。此处的“依法独立行使”应按我国宪法规定的机关制度理解，不宜直接套入其他国家的检察机关组织模式。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>旧术语需要更新。\u003c/strong> 《释义》印刷211页仍摘录“免予起诉”。该制度已在1996年刑事诉讼法修改时取消，不能继续列为现行检察职权；现应依法律区分不同的不起诉情形。“免予起诉”与法院依法认定有罪后免予刑事处罚，也不是同一事项。\u003ca href=\"https://www.spp.gov.cn/spp/zhuanlan/201807/t20180710_384346.shtml\">最高检关于制度沿革的说明\u003c/a>。\u003c/p>\n\u003cp>书中北京检察机关设置专业办案机构的事例，可用于理解专业化分工。仅凭办案数量和机构设置，尚不足以证明某类犯罪发生率因此下降；应把制度介绍与需要独立证据支持的效果评价分开。\u003c/p>\n"},{"num":42,"label":"第四十二条","title":"国家安全、公安及有关军事机关的职责","lawText":"国家安全机关、公安机关依法搜集涉及国家安全的情报信息，在国家安全工作中依法行使侦查、拘留、预审和执行逮捕以及法律规定的其他职权。\n\n有关军事机关在国家安全工作中依法行使相关职权。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第四十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家安全机关、公安机关依法搜集涉及国家安全的情报信息，在国家安全工作中依法行使侦查、拘留、预审和执行逮捕以及法律规定的其他职权。\u003c/p>\n\u003cp>有关军事机关在国家安全工作中依法行使相关职权。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第四十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家安全机关、公安机关依法搜集涉及国家安全的情报信息，在国家安全工作中依法行使侦查、拘留、预审和执行逮捕以及法律规定的其他职权。\u003c/p>\n\u003cp>有关军事机关在国家安全工作中依法行使相关职权。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全、公安及有关军事机关的职责 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条确认专门机关的情报、刑事及其他法定职责，同时以“依法”限制其行使。它与第三十九条一般部门职责相衔接，但一般部门负有安全责任，并不因此取得本条所列专门权力。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>既有职权的集中表达。\u003c/strong> 2014年草案说明介绍，1993年国家安全法主要规定国家安全机关特别是反间谍职责，2014年制定反间谍法并相应废止旧法，再推进综合性国家安全立法。最终本条将相关专门职能纳入整体职责体系，同时衔接刑事诉讼法的既有分工。这是制度背景，不能据此认定本条逐字承继旧法或保留相同权限范围。〔《释义》附录二，印刷373页／PDF386页〕\u003c/p>\n\u003cp>\u003cstrong>后续具体化。\u003c/strong> 2017年制定、2018年修正的《国家情报法》第5条明确国家安全机关和公安机关情报机构、军队情报机构的分工协作。2023年修订的《反间谍法》进一步规定安全防范、调查处置、保障监督和法律责任；现行具体措施应依修订后的法律判断。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_281475.html\">《国家情报法》\u003c/a>；\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/202304/t20230426_429064.html\">《反间谍法》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 情报搜集着眼于风险识别与决策支持。\u003c/strong> 它不仅服务于已经发生的犯罪，也服务于发现威胁、评估风险和防范危害。但情报活动的对象、方式、审批和信息保护仍须有法律依据；公民、组织的协助义务不能替代机关自身的权限与程序要求。\u003c/p>\n\u003cp>\u003cstrong>2. 四项刑事职权各有意义。\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>职权\u003c/th>\n\u003cth>本条中的含义\u003c/th>\n\u003cth>需要区分的概念\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>侦查\u003c/td>\n\u003ctd>依法查明案件事实、收集核实证据并采取相关措施\u003c/td>\n\u003ctd>不同于一般风险摸排或行政调查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>拘留\u003c/td>\n\u003ctd>依刑事诉讼法，在法定条件下采取的刑事强制措施\u003c/td>\n\u003ctd>不等于作为行政处罚的行政拘留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>预审\u003c/td>\n\u003ctd>在侦查过程中进一步审查、核实事实与证据\u003c/td>\n\u003ctd>不是法院作出有罪认定前的“提前审判”\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行逮捕\u003c/td>\n\u003ctd>执行依法作出的逮捕决定\u003c/td>\n\u003ctd>不等于享有批准逮捕权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>国家安全机关依刑事诉讼法第4条办理危害国家安全刑事案件，行使与公安机关相同的职权。通常的审查批捕由检察机关负责；法院以及检察机关在法律规定的程序中亦可决定逮捕。公安、国家安全机关的执行职能，不能代替有权机关的批准或决定。\u003ca href=\"https://www.spp.gov.cn/spp/zdgz/201810/t20181027_396818.shtml\">《刑事诉讼法》第3—4、80、94条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>3. “法律规定的其他职权”是衔接条款。\u003c/strong> 反间谍、反恐怖主义等法律可能规定查验、调查、行政处罚、行政强制和协助要求。每一项措施仍须对应具体法律依据，不能将本句理解为任何有助于安全工作的手段都已获得概括授权。\u003c/p>\n\u003cp>\u003cstrong>4. 军事机关职权须按机关与事项区分。\u003c/strong> 军队情报机构的情报工作、军队保卫部门的刑事侦查以及军事法院、军事检察院的司法职能并不相同。刑事诉讼法第308条规定军队保卫部门对军队内部发生的刑事案件行使侦查权，并适用该法有关规定。本条第二款不使一切军事机关普遍取得对普通社会事务的警察权。\u003ca href=\"https://www.npc.gov.cn/c2/c12435/201905/t20190521_276591.html\">《刑事诉讼法》第308条\u003c/a>。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>〔笔记分析〕本条应从“职权法定”和“程序分流”理解。同一个机关可能承担情报、行政和刑事职能，但具体行动必须说明自己正在行使哪一种权力；不同权力对应不同的启动条件、文书、期限和监督救济。\u003c/p>\n\u003cp>例如，反间谍调查中发现涉嫌犯罪，应依法转入刑事立案侦查，不能一直借行政调查规避刑事程序。2023年反间谍法第39条对此作出衔接规定。安全信息能够成为侦查线索，也不意味着其自动成为可用于定罪的证据。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/202304/t20230426_429064.html\">《反间谍法》第39条\u003c/a>。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>案例中的措施性质须分别判断。\u003c/strong> 《释义与适用》印刷120—121页所举彼得案件，将刑事强制措施与行政强制表述混用。外交部2016年1月26日说明明确称，北京市国家安全局依据刑事诉讼法采取指定居所监视居住；其性质属于刑事程序。后续出境处理需要另按相应依据判断，不能把整段经过统称“行政强制”，也不能以新闻说明替代法院的有罪判决。\u003ca href=\"https://www.fmprc.gov.cn/nanhai/chn/fyrbt/201601/t20160126_8521407.htm\">外交部当日记者会记录\u003c/a>。\u003c/p>\n\u003cp>本条须与第四十一条、第四十三条合读：专门机关依法调查和侦查，两院依法审查与裁判，所有机关共同受禁止越权、滥权和侵权的约束。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条确认专门机关的情报、刑事及其他法定职责，同时以“依法”限制其行使。它与第三十九条一般部门职责相衔接，但一般部门负有安全责任，并不因此取得本条所列专门权力。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>既有职权的集中表达。\u003c/strong> 2014年草案说明介绍，1993年国家安全法主要规定国家安全机关特别是反间谍职责，2014年制定反间谍法并相应废止旧法，再推进综合性国家安全立法。最终本条将相关专门职能纳入整体职责体系，同时衔接刑事诉讼法的既有分工。这是制度背景，不能据此认定本条逐字承继旧法或保留相同权限范围。〔《释义》附录二，印刷373页／PDF386页〕\u003c/p>\n\u003cp>\u003cstrong>后续具体化。\u003c/strong> 2017年制定、2018年修正的《国家情报法》第5条明确国家安全机关和公安机关情报机构、军队情报机构的分工协作。2023年修订的《反间谍法》进一步规定安全防范、调查处置、保障监督和法律责任；现行具体措施应依修订后的法律判断。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_281475.html\">《国家情报法》\u003c/a>；\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/202304/t20230426_429064.html\">《反间谍法》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 情报搜集着眼于风险识别与决策支持。\u003c/strong> 它不仅服务于已经发生的犯罪，也服务于发现威胁、评估风险和防范危害。但情报活动的对象、方式、审批和信息保护仍须有法律依据；公民、组织的协助义务不能替代机关自身的权限与程序要求。\u003c/p>\n\u003cp>\u003cstrong>2. 四项刑事职权各有意义。\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>职权\u003c/th>\n\u003cth>本条中的含义\u003c/th>\n\u003cth>需要区分的概念\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>侦查\u003c/td>\n\u003ctd>依法查明案件事实、收集核实证据并采取相关措施\u003c/td>\n\u003ctd>不同于一般风险摸排或行政调查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>拘留\u003c/td>\n\u003ctd>依刑事诉讼法，在法定条件下采取的刑事强制措施\u003c/td>\n\u003ctd>不等于作为行政处罚的行政拘留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>预审\u003c/td>\n\u003ctd>在侦查过程中进一步审查、核实事实与证据\u003c/td>\n\u003ctd>不是法院作出有罪认定前的“提前审判”\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行逮捕\u003c/td>\n\u003ctd>执行依法作出的逮捕决定\u003c/td>\n\u003ctd>不等于享有批准逮捕权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>国家安全机关依刑事诉讼法第4条办理危害国家安全刑事案件，行使与公安机关相同的职权。通常的审查批捕由检察机关负责；法院以及检察机关在法律规定的程序中亦可决定逮捕。公安、国家安全机关的执行职能，不能代替有权机关的批准或决定。\u003ca href=\"https://www.spp.gov.cn/spp/zdgz/201810/t20181027_396818.shtml\">《刑事诉讼法》第3—4、80、94条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>3. “法律规定的其他职权”是衔接条款。\u003c/strong> 反间谍、反恐怖主义等法律可能规定查验、调查、行政处罚、行政强制和协助要求。每一项措施仍须对应具体法律依据，不能将本句理解为任何有助于安全工作的手段都已获得概括授权。\u003c/p>\n\u003cp>\u003cstrong>4. 军事机关职权须按机关与事项区分。\u003c/strong> 军队情报机构的情报工作、军队保卫部门的刑事侦查以及军事法院、军事检察院的司法职能并不相同。刑事诉讼法第308条规定军队保卫部门对军队内部发生的刑事案件行使侦查权，并适用该法有关规定。本条第二款不使一切军事机关普遍取得对普通社会事务的警察权。\u003ca href=\"https://www.npc.gov.cn/c2/c12435/201905/t20190521_276591.html\">《刑事诉讼法》第308条\u003c/a>。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>〔笔记分析〕本条应从“职权法定”和“程序分流”理解。同一个机关可能承担情报、行政和刑事职能，但具体行动必须说明自己正在行使哪一种权力；不同权力对应不同的启动条件、文书、期限和监督救济。\u003c/p>\n\u003cp>例如，反间谍调查中发现涉嫌犯罪，应依法转入刑事立案侦查，不能一直借行政调查规避刑事程序。2023年反间谍法第39条对此作出衔接规定。安全信息能够成为侦查线索，也不意味着其自动成为可用于定罪的证据。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/202304/t20230426_429064.html\">《反间谍法》第39条\u003c/a>。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>案例中的措施性质须分别判断。\u003c/strong> 《释义与适用》印刷120—121页所举彼得案件，将刑事强制措施与行政强制表述混用。外交部2016年1月26日说明明确称，北京市国家安全局依据刑事诉讼法采取指定居所监视居住；其性质属于刑事程序。后续出境处理需要另按相应依据判断，不能把整段经过统称“行政强制”，也不能以新闻说明替代法院的有罪判决。\u003ca href=\"https://www.fmprc.gov.cn/nanhai/chn/fyrbt/201601/t20160126_8521407.htm\">外交部当日记者会记录\u003c/a>。\u003c/p>\n\u003cp>本条须与第四十一条、第四十三条合读：专门机关依法调查和侦查，两院依法审查与裁判，所有机关共同受禁止越权、滥权和侵权的约束。\u003c/p>\n"},{"num":43,"label":"第四十三条","title":"国家机关依法履职及权利保障","lawText":"国家机关及其工作人员在履行职责时，应当贯彻维护国家安全的原则。\n\n国家机关及其工作人员在国家安全工作和涉及国家安全活动中，应当严格依法履行职责，不得超越职权、滥用职权，不得侵犯个人和组织的合法权益。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第四十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家机关及其工作人员在履行职责时，应当贯彻维护国家安全的原则。\u003c/p>\n\u003cp>国家机关及其工作人员在国家安全工作和涉及国家安全活动中，应当严格依法履行职责，不得超越职权、滥用职权，不得侵犯个人和组织的合法权益。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第四十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家机关及其工作人员在履行职责时，应当贯彻维护国家安全的原则。\u003c/p>\n\u003cp>国家机关及其工作人员在国家安全工作和涉及国家安全活动中，应当严格依法履行职责，不得超越职权、滥用职权，不得侵犯个人和组织的合法权益。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家机关依法履职及权利保障 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>第一款要求在履职中贯彻国家安全原则，第二款约束实现这一目的的手段。两款共同适用：承担维护安全的责任，并不产生超越法定权限的资格。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>初稿已有明确主题。\u003c/strong> 2014年12月22日草案说明指出，第三章对各级国家机关及其工作人员履职应贯彻维护国家安全的原则作了专门规定，对应最终第一款的规范主题。不过，说明未列出完整条文及逐次改稿，不能据此补造第二款的新增时间。〔《释义》附录二，印刷375页／PDF388页〕\u003c/p>\n\u003cp>\u003cstrong>与法律责任原则形成衔接。\u003c/strong> 2015年6月24日审议结果报告提出在总则规定国家机关工作人员等主体的法律责任，最终落实为第十三条；它与本条依法履职的要求互相配合，不能误写成“第三次审议新增第四十三条第二款”。〔《释义》附录四，印刷385页／PDF398页〕\u003c/p>\n\u003cp>\u003cstrong>后续专门法进一步落实。\u003c/strong> 国家情报法第8条明确依法开展情报工作、尊重和保障人权及维护合法权益；2023年反间谍法第3、51—52、69条分别规定基本原则、内部监督、检举控告及工作人员违法责任。这些属于后续具体化。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_281475.html\">《国家情报法》\u003c/a>；\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/202304/t20230426_429064.html\">《反间谍法》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 第一款适用于所有国家机关及其工作人员的履职活动。\u003c/strong> 无论专门机关还是一般部门，都应在自身职责中考虑国家安全因素。例如，审批、规划、资金管理和信息管理可能产生安全影响，需要依法识别、处理或者移交有关风险。一般责任不能反向推导一般部门可以自行行使侦查、拘留等专门权力。\u003c/p>\n\u003cp>\u003cstrong>2. 第二款覆盖专门工作与涉及安全的其他活动。\u003c/strong> 适用范围不限于已经立案的国家安全案件，也不限于明确冠以“国家安全”名称的工作。机关只要在有关活动中行使公权力，就应受法定职责、权限和程序约束。\u003c/p>\n\u003cp>\u003cstrong>3. 超越职权与滥用职权并不相同。\u003c/strong> 超越职权通常涉及没有相应权限，或者超出事项、地域、对象等权限范围；滥用职权则可能表现为虽有权限，却为不正当目的、以不当方式行使，或者背离权力授予目的。具体案件须按适用法律判断，不能仅靠抽象标签定性。〔笔记分析〕\u003c/p>\n\u003cp>\u003cstrong>4. 合法权益保护是履职要求。\u003c/strong> 本条保护“个人和组织”，未将保护对象限于协助机关工作的主体。受到调查的人、承担协助义务的企业以及被措施影响的第三人，其依法享有的人身、财产、程序和信息等权益均须获得相应保障。执法效果不能自行补正缺失的授权或程序。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>〔笔记分析〕本条体现安全保护与依法行政、依法司法的内在联系：安全目标决定工作方向，具体权限和程序决定可以采用什么手段。通过比例原则的法理视角，可以进一步审查措施能否实现目的、有无侵害较小的同样有效方案，以及对权益的影响是否与保护需要相称；这些是研读分析，不能替代具体法律的授权条件。\u003c/p>\n\u003cp>公开与保密也应分别判断。依法保密可能限制某些信息的公开范围，但不当然排除内部审查、检察监督、依法受理申诉控告等机制。是否公开、向谁公开及采取何种保密方式，均须寻找具体依据。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>救济与责任须按行为性质区分。\u003c/strong> 第八十二条保障批评建议、申诉、控告和检举；涉及行政行为或刑事程序的争议，应依各自法律选择监督、复议、诉讼等渠道。反间谍法第68条规定复议与诉讼的衔接，同时也须注意该法有关最终决定的特别规定，不能概括为所有措施均可直接起诉。符合国家赔偿法规定的侵权情形并造成损害的，可依法请求赔偿；追究工作人员责任与赔偿受害人也不是同一程序。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/202304/t20230426_429064.html\">《反间谍法》第66、68条\u003c/a>；\u003ca href=\"https://www.spp.gov.cn/sscx/201404/t20140424_71280.shtml\">《国家赔偿法》第2条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>书中测绘案例的使用限制。\u003c/strong> 《释义与适用》印刷123页将2009年8月的行为与2009年3月的处罚连写，时间记载前后不一致，不据此复述完整案情。作为本条的研读问题，可保留的重点是：测绘部门与国家安全机关分别依据何种权限行动，调查、处罚与刑事追究是否满足各自条件；不能仅凭“涉及军事秘密”便推定任何处理手段均属合法。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>第一款要求在履职中贯彻国家安全原则，第二款约束实现这一目的的手段。两款共同适用：承担维护安全的责任，并不产生超越法定权限的资格。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>初稿已有明确主题。\u003c/strong> 2014年12月22日草案说明指出，第三章对各级国家机关及其工作人员履职应贯彻维护国家安全的原则作了专门规定，对应最终第一款的规范主题。不过，说明未列出完整条文及逐次改稿，不能据此补造第二款的新增时间。〔《释义》附录二，印刷375页／PDF388页〕\u003c/p>\n\u003cp>\u003cstrong>与法律责任原则形成衔接。\u003c/strong> 2015年6月24日审议结果报告提出在总则规定国家机关工作人员等主体的法律责任，最终落实为第十三条；它与本条依法履职的要求互相配合，不能误写成“第三次审议新增第四十三条第二款”。〔《释义》附录四，印刷385页／PDF398页〕\u003c/p>\n\u003cp>\u003cstrong>后续专门法进一步落实。\u003c/strong> 国家情报法第8条明确依法开展情报工作、尊重和保障人权及维护合法权益；2023年反间谍法第3、51—52、69条分别规定基本原则、内部监督、检举控告及工作人员违法责任。这些属于后续具体化。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_281475.html\">《国家情报法》\u003c/a>；\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/202304/t20230426_429064.html\">《反间谍法》\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. 第一款适用于所有国家机关及其工作人员的履职活动。\u003c/strong> 无论专门机关还是一般部门，都应在自身职责中考虑国家安全因素。例如，审批、规划、资金管理和信息管理可能产生安全影响，需要依法识别、处理或者移交有关风险。一般责任不能反向推导一般部门可以自行行使侦查、拘留等专门权力。\u003c/p>\n\u003cp>\u003cstrong>2. 第二款覆盖专门工作与涉及安全的其他活动。\u003c/strong> 适用范围不限于已经立案的国家安全案件，也不限于明确冠以“国家安全”名称的工作。机关只要在有关活动中行使公权力，就应受法定职责、权限和程序约束。\u003c/p>\n\u003cp>\u003cstrong>3. 超越职权与滥用职权并不相同。\u003c/strong> 超越职权通常涉及没有相应权限，或者超出事项、地域、对象等权限范围；滥用职权则可能表现为虽有权限，却为不正当目的、以不当方式行使，或者背离权力授予目的。具体案件须按适用法律判断，不能仅靠抽象标签定性。〔笔记分析〕\u003c/p>\n\u003cp>\u003cstrong>4. 合法权益保护是履职要求。\u003c/strong> 本条保护“个人和组织”，未将保护对象限于协助机关工作的主体。受到调查的人、承担协助义务的企业以及被措施影响的第三人，其依法享有的人身、财产、程序和信息等权益均须获得相应保障。执法效果不能自行补正缺失的授权或程序。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>〔笔记分析〕本条体现安全保护与依法行政、依法司法的内在联系：安全目标决定工作方向，具体权限和程序决定可以采用什么手段。通过比例原则的法理视角，可以进一步审查措施能否实现目的、有无侵害较小的同样有效方案，以及对权益的影响是否与保护需要相称；这些是研读分析，不能替代具体法律的授权条件。\u003c/p>\n\u003cp>公开与保密也应分别判断。依法保密可能限制某些信息的公开范围，但不当然排除内部审查、检察监督、依法受理申诉控告等机制。是否公开、向谁公开及采取何种保密方式，均须寻找具体依据。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>救济与责任须按行为性质区分。\u003c/strong> 第八十二条保障批评建议、申诉、控告和检举；涉及行政行为或刑事程序的争议，应依各自法律选择监督、复议、诉讼等渠道。反间谍法第68条规定复议与诉讼的衔接，同时也须注意该法有关最终决定的特别规定，不能概括为所有措施均可直接起诉。符合国家赔偿法规定的侵权情形并造成损害的，可依法请求赔偿；追究工作人员责任与赔偿受害人也不是同一程序。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/202304/t20230426_429064.html\">《反间谍法》第66、68条\u003c/a>；\u003ca href=\"https://www.spp.gov.cn/sscx/201404/t20140424_71280.shtml\">《国家赔偿法》第2条\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>书中测绘案例的使用限制。\u003c/strong> 《释义与适用》印刷123页将2009年8月的行为与2009年3月的处罚连写，时间记载前后不一致，不据此复述完整案情。作为本条的研读问题，可保留的重点是：测绘部门与国家安全机关分别依据何种权限行动，调查、处罚与刑事追究是否满足各自条件；不能仅凭“涉及军事秘密”便推定任何处理手段均属合法。\u003c/p>\n"},{"num":44,"label":"第四十四条","title":"统分结合、协调高效的制度与工作机制","lawText":"中央国家安全领导机构实行统分结合、协调高效的国家安全制度与工作机制。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第四十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中央国家安全领导机构实行统分结合、协调高效的国家安全制度与工作机制。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第四十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>中央国家安全领导机构实行统分结合、协调高效的国家安全制度与工作机制。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">统分结合、协调高效的制度与工作机制 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条是第四章第一节“一般规定”的起点，规定国家安全制度如何组织和运行。它与第4—5条的领导体制、中央国家安全领导机构职责相衔接，并为第45—49条的具体机制提供共同原则。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2013年党的十八届三中全会提出设立国家安全委员会，2014年1月中央政治局研究决定中央国家安全委员会设置。2014年4月首次会议进一步提出集中统一、科学谋划、统分结合、协调行动、精干高效的工作原则。2015年国家安全法将其中关于工作机制的要求集中规定于本条。参见\u003ca href=\"https://www.xinhuanet.com/politics/2014-01/24/c_119122483.htm\">2014年1月会议报道\u003c/a>、\u003ca href=\"https://www.hunan.gov.cn/topic/zgmhnm/zyjs49752/zyjc/201404/t20140416_1068997.html\">中央国家安全委员会第一次会议报道\u003c/a>。\u003c/p>\n\u003cp>2014年12月22日草案说明介绍第四章时，已经明确提出建立统分结合、协调高效的国家安全制度，表明这一要求在初稿制度设计中即有位置。见《中华人民共和国国家安全法释义》附录，印刷第376页／PDF第389页。其重点是以持续运行的制度支持集中统一领导，不能把特定年份的机构成员名单当成条文的永久内容。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>“统”指统一领导和统筹谋划。\u003c/strong> 国家安全重大事项不能仅由单一部门根据自身业务利益判断，需要从国家整体利益出发确定方向、协调重大工作、配置相关资源。中央国家安全领导机构承担决策和议事协调职责，其作用应结合第5条理解。\u003c/p>\n\u003cp>\u003cstrong>“分”指按法定职责落实。\u003c/strong> 各部门管理本系统、本领域，各地区负责本行政区域的有关工作，行政、监察、审判、检察、军事机关仍按各自法定权限履职。第三章的分工不会因本条而消失。统筹协调本身不能替代依法应由特定国家机关作出的决定，也不能使任何机关仅凭协调安排取得法律未授予的强制、处罚或者审判权。\u003c/p>\n\u003cp>\u003cstrong>“协调”指处理职责交叉与相互依赖。\u003c/strong> 需要衔接信息、人员、物资、行动和决策程序，避免一方掌握信息而另一方无法及时处置，也避免多部门重复采取措施。第45条的重点领域协调、第48条的会商、第49条的协同联动，分别把这一要求具体化。\u003c/p>\n\u003cp>\u003cstrong>“高效”指及时、有效地实现安全目标。\u003c/strong> 应减少不必要的传递环节、推诿等待和重复建设，同时保证判断质量和执行准确性。高效不能只按会议数量、处置速度衡量，更不能以紧迫为由省略法律要求的批准、审查或者权利保障程序。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>美国《美国法典》第50编第3021条将国家安全委员会的职能之一规定为，就国家安全相关的国内、外交和军事政策整合向总统提供建议，以促进有关部门有效合作。可以借此比较“最高层协调＋部门履职”如何回应安全事务的跨部门特征，但两国机构的性质、权力来源和责任关系并不相同。\u003ca href=\"https://uscode.house.gov/view.xhtml?req=%28title%3A50+section%3A3021+edition%3Aprelim%29\">50 U.S.C. §3021\u003c/a>。\u003c/p>\n\u003cp>从组织法角度，“统”与“分”相互依赖：没有统筹，专业分工可能形成信息割裂；没有分工，集中决策也缺少明确的执行主体和责任承担者。协调机制的任务，是使分工能够共同服务于整体目标。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>评价一项机制是否符合本条，可以具体检查：谁负责统筹，谁承担主责，谁提供协助，信息何时共享，分歧如何提交处理，落实情况由谁反馈。这些是分析维度，不是本条已经逐项规定的固定程序。\u003c/p>\n\u003cp>本条也没有公开列明中央国家安全领导机构全部内部议事规则、办事机构设置及运行细节。研读应以公开法律和正式信息为限，不能从原则性规定推演出未经证实的内部审批层级。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条是第四章第一节“一般规定”的起点，规定国家安全制度如何组织和运行。它与第4—5条的领导体制、中央国家安全领导机构职责相衔接，并为第45—49条的具体机制提供共同原则。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2013年党的十八届三中全会提出设立国家安全委员会，2014年1月中央政治局研究决定中央国家安全委员会设置。2014年4月首次会议进一步提出集中统一、科学谋划、统分结合、协调行动、精干高效的工作原则。2015年国家安全法将其中关于工作机制的要求集中规定于本条。参见\u003ca href=\"https://www.xinhuanet.com/politics/2014-01/24/c_119122483.htm\">2014年1月会议报道\u003c/a>、\u003ca href=\"https://www.hunan.gov.cn/topic/zgmhnm/zyjs49752/zyjc/201404/t20140416_1068997.html\">中央国家安全委员会第一次会议报道\u003c/a>。\u003c/p>\n\u003cp>2014年12月22日草案说明介绍第四章时，已经明确提出建立统分结合、协调高效的国家安全制度，表明这一要求在初稿制度设计中即有位置。见《中华人民共和国国家安全法释义》附录，印刷第376页／PDF第389页。其重点是以持续运行的制度支持集中统一领导，不能把特定年份的机构成员名单当成条文的永久内容。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>“统”指统一领导和统筹谋划。\u003c/strong> 国家安全重大事项不能仅由单一部门根据自身业务利益判断，需要从国家整体利益出发确定方向、协调重大工作、配置相关资源。中央国家安全领导机构承担决策和议事协调职责，其作用应结合第5条理解。\u003c/p>\n\u003cp>\u003cstrong>“分”指按法定职责落实。\u003c/strong> 各部门管理本系统、本领域，各地区负责本行政区域的有关工作，行政、监察、审判、检察、军事机关仍按各自法定权限履职。第三章的分工不会因本条而消失。统筹协调本身不能替代依法应由特定国家机关作出的决定，也不能使任何机关仅凭协调安排取得法律未授予的强制、处罚或者审判权。\u003c/p>\n\u003cp>\u003cstrong>“协调”指处理职责交叉与相互依赖。\u003c/strong> 需要衔接信息、人员、物资、行动和决策程序，避免一方掌握信息而另一方无法及时处置，也避免多部门重复采取措施。第45条的重点领域协调、第48条的会商、第49条的协同联动，分别把这一要求具体化。\u003c/p>\n\u003cp>\u003cstrong>“高效”指及时、有效地实现安全目标。\u003c/strong> 应减少不必要的传递环节、推诿等待和重复建设，同时保证判断质量和执行准确性。高效不能只按会议数量、处置速度衡量，更不能以紧迫为由省略法律要求的批准、审查或者权利保障程序。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>美国《美国法典》第50编第3021条将国家安全委员会的职能之一规定为，就国家安全相关的国内、外交和军事政策整合向总统提供建议，以促进有关部门有效合作。可以借此比较“最高层协调＋部门履职”如何回应安全事务的跨部门特征，但两国机构的性质、权力来源和责任关系并不相同。\u003ca href=\"https://uscode.house.gov/view.xhtml?req=%28title%3A50+section%3A3021+edition%3Aprelim%29\">50 U.S.C. §3021\u003c/a>。\u003c/p>\n\u003cp>从组织法角度，“统”与“分”相互依赖：没有统筹，专业分工可能形成信息割裂；没有分工，集中决策也缺少明确的执行主体和责任承担者。协调机制的任务，是使分工能够共同服务于整体目标。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>评价一项机制是否符合本条，可以具体检查：谁负责统筹，谁承担主责，谁提供协助，信息何时共享，分歧如何提交处理，落实情况由谁反馈。这些是分析维度，不是本条已经逐项规定的固定程序。\u003c/p>\n\u003cp>本条也没有公开列明中央国家安全领导机构全部内部议事规则、办事机构设置及运行细节。研读应以公开法律和正式信息为限，不能从原则性规定推演出未经证实的内部审批层级。\u003c/p>\n"},{"num":45,"label":"第四十五条","title":"重点领域工作协调机制","lawText":"国家建立国家安全重点领域工作协调机制，统筹协调中央有关职能部门推进相关工作。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第四十五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立国家安全重点领域工作协调机制，统筹协调中央有关职能部门推进相关工作。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第四十五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立国家安全重点领域工作协调机制，统筹协调中央有关职能部门推进相关工作。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">重点领域工作协调机制 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条把第44条的协调原则落实到重点领域，直接协调对象是中央有关职能部门，目的在于使专业分工形成有效合作。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>在2015年国家安全法出台前，金融监管、公共卫生、重大活动安保等领域已经存在跨部门协调安排。2014年12月22日草案说明已经将“工作协调”列入拟建立的机制，本条进一步将重点领域协调规定为国家安全制度要求。见《中华人民共和国国家安全法释义》附录，印刷第376页／PDF第389页。协调由此需要稳定的工作安排，而不只依赖临时联系或个别人员推动。\u003c/p>\n\u003cp>后续发展应理解为各领域对这一要求的具体落实，而不是本条已经设定所有协调机构的名称和组成。例如，2022年中国气象局、国家安全部、国家保密局联合公布新的《涉外气象探测和资料管理办法》，取代2006年办法，并细化主管、配合和征求意见程序。\u003ca href=\"https://www.cma.gov.cn/zfxxgk/zc/gz/202207/W020220829492166795012.pdf\">办法第4、6、27条\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>重点领域具有重要性和动态性。\u003c/strong> 应结合第二章的安全任务，识别对国家整体安全有重大影响、风险容易扩散传导的领域。条文没有给出封闭清单，也没有把“重点”固定为书中列举的某一数量；国家安全形势变化时，任务和协调重点可依第34条调整。\u003c/p>\n\u003cp>\u003cstrong>中央部门之间是本条的直接协调层面。\u003c/strong> 各部门拥有不同的专业知识、法定职责和资源，跨领域问题往往无法由一方独立解决。中央层面的制度衔接，还可以影响各自系统的工作安排；但本条并不因此消灭地方管理职责，中央与地方、地区之间的协作另见第49条。\u003c/p>\n\u003cp>\u003cstrong>协调是一套稳定的工作关系。\u003c/strong> 它可以围绕牵头与配合、风险研判、信息通报、意见征求、资源保障、行动衔接和争议处理展开。关键不是建立多少会议，而是遇到共同问题时，有明确主体、处理程序和反馈安排。具体内容须以有关领域公开的法律法规和制度规定为依据。\u003c/p>\n\u003cp>\u003cstrong>协调与履职同时存在。\u003c/strong> 牵头部门不因此获得其他部门全部权力，配合部门也不因此免除自己的职责。共同参与不意味着对每项行政行为负完全相同的责任，仍须辨明谁作出决定、谁提供意见、谁实施检查，以及各环节的权限依据。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条针对的是专业分工带来的合作难题：一个部门采取措施的效果，可能取决于其他部门的信息和行动。单独优化各自工作，不必然形成整体上有效的风险应对，因而需要持续的协调安排。\u003c/p>\n\u003cp>与第48条相比，本条强调重点领域工作的统筹推进；会商机制侧重就重大事项交换、分析信息和提出意见。与第49条相比，本条突出中央有关职能部门，后者覆盖中央地方、军地和地区等多种关系。三者可以共同运行，不是互相替代的制度。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>涉外气象管理提供了具体例子：气象主管机构负责业务管理，国家安全、保密等部门按职责配合；设立涉外气象探测站点涉及国家安全或者国家秘密的，审批及技术审查环节应分别征求有关部门意见。这里能够直接观察到“专业主管＋相关部门参与”的制度安排。\u003ca href=\"https://www.cma.gov.cn/zfxxgk/zc/gz/202207/W020220829492166795012.pdf\">涉外气象探测和资料管理办法第4、6条\u003c/a>。\u003c/p>\n\u003cp>这一例子也提示两点：开展国际合作与依法维护安全可以同时成为制度目标；对具体违法行为采取许可管理、行政处罚或者追究刑事责任，必须分别找到相应规范依据。第45条本身只规定协调机制，不能直接据此处罚涉外活动，也不能把任何气象数据传输概括成危害国家安全的犯罪。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条把第44条的协调原则落实到重点领域，直接协调对象是中央有关职能部门，目的在于使专业分工形成有效合作。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>在2015年国家安全法出台前，金融监管、公共卫生、重大活动安保等领域已经存在跨部门协调安排。2014年12月22日草案说明已经将“工作协调”列入拟建立的机制，本条进一步将重点领域协调规定为国家安全制度要求。见《中华人民共和国国家安全法释义》附录，印刷第376页／PDF第389页。协调由此需要稳定的工作安排，而不只依赖临时联系或个别人员推动。\u003c/p>\n\u003cp>后续发展应理解为各领域对这一要求的具体落实，而不是本条已经设定所有协调机构的名称和组成。例如，2022年中国气象局、国家安全部、国家保密局联合公布新的《涉外气象探测和资料管理办法》，取代2006年办法，并细化主管、配合和征求意见程序。\u003ca href=\"https://www.cma.gov.cn/zfxxgk/zc/gz/202207/W020220829492166795012.pdf\">办法第4、6、27条\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>重点领域具有重要性和动态性。\u003c/strong> 应结合第二章的安全任务，识别对国家整体安全有重大影响、风险容易扩散传导的领域。条文没有给出封闭清单，也没有把“重点”固定为书中列举的某一数量；国家安全形势变化时，任务和协调重点可依第34条调整。\u003c/p>\n\u003cp>\u003cstrong>中央部门之间是本条的直接协调层面。\u003c/strong> 各部门拥有不同的专业知识、法定职责和资源，跨领域问题往往无法由一方独立解决。中央层面的制度衔接，还可以影响各自系统的工作安排；但本条并不因此消灭地方管理职责，中央与地方、地区之间的协作另见第49条。\u003c/p>\n\u003cp>\u003cstrong>协调是一套稳定的工作关系。\u003c/strong> 它可以围绕牵头与配合、风险研判、信息通报、意见征求、资源保障、行动衔接和争议处理展开。关键不是建立多少会议，而是遇到共同问题时，有明确主体、处理程序和反馈安排。具体内容须以有关领域公开的法律法规和制度规定为依据。\u003c/p>\n\u003cp>\u003cstrong>协调与履职同时存在。\u003c/strong> 牵头部门不因此获得其他部门全部权力，配合部门也不因此免除自己的职责。共同参与不意味着对每项行政行为负完全相同的责任，仍须辨明谁作出决定、谁提供意见、谁实施检查，以及各环节的权限依据。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条针对的是专业分工带来的合作难题：一个部门采取措施的效果，可能取决于其他部门的信息和行动。单独优化各自工作，不必然形成整体上有效的风险应对，因而需要持续的协调安排。\u003c/p>\n\u003cp>与第48条相比，本条强调重点领域工作的统筹推进；会商机制侧重就重大事项交换、分析信息和提出意见。与第49条相比，本条突出中央有关职能部门，后者覆盖中央地方、军地和地区等多种关系。三者可以共同运行，不是互相替代的制度。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>涉外气象管理提供了具体例子：气象主管机构负责业务管理，国家安全、保密等部门按职责配合；设立涉外气象探测站点涉及国家安全或者国家秘密的，审批及技术审查环节应分别征求有关部门意见。这里能够直接观察到“专业主管＋相关部门参与”的制度安排。\u003ca href=\"https://www.cma.gov.cn/zfxxgk/zc/gz/202207/W020220829492166795012.pdf\">涉外气象探测和资料管理办法第4、6条\u003c/a>。\u003c/p>\n\u003cp>这一例子也提示两点：开展国际合作与依法维护安全可以同时成为制度目标；对具体违法行为采取许可管理、行政处罚或者追究刑事责任，必须分别找到相应规范依据。第45条本身只规定协调机制，不能直接据此处罚涉外活动，也不能把任何气象数据传输概括成危害国家安全的犯罪。\u003c/p>\n"},{"num":46,"label":"第四十六条","title":"督促检查和责任追究机制","lawText":"国家建立国家安全工作督促检查和责任追究机制，确保国家安全战略和重大部署贯彻落实。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第四十六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立国家安全工作督促检查和责任追究机制，确保国家安全战略和重大部署贯彻落实。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第四十六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立国家安全工作督促检查和责任追究机制，确保国家安全战略和重大部署贯彻落实。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">督促检查和责任追究机制 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条同时规定发现落实问题的机制与依法追究责任的机制，落脚点是国家安全战略和重大部署的实际执行。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2015年4月20日修改情况汇报第四项有明确记载：将草案第40条第2款关于工作督促检查的规定，与草案第46条关于国家安全战略实施执行情况监督检查和评估的规定合并，并增加责任追究机制。报告建议表述为“国家安全工作督促和责任追究机制”，最后通过的第46条使用“督促检查和责任追究机制”。这说明责任追究是在整合相关制度时明确加入的内容，不能把最终条文原样当成该报告建议稿。见《中华人民共和国国家安全法释义》附录，印刷第380页／PDF第393页。\u003c/p>\n\u003cp>后续公开制度包括2018年审议通过的《党委（党组）国家安全责任制规定》，以及自2021年2月1日起施行的《政府督查工作条例》。前者涉及党委、党组的主体责任，后者规范政府督查；二者的主体、依据和适用范围不能混同。\u003ca href=\"https://exportcontrol.mofcom.gov.cn/article/zjsj/202205/652.html\">国家安全责任制相关公开说明\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202012/29/466468/article.html\">政府督查工作条例\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>督促检查既检查进度，也检查质量。\u003c/strong> 要了解战略任务是否具体分解，重大部署是否形成行动，资源和责任是否落实，发现的问题是否整改。仅开会、发文、提交报表，不足以证明战略已经有效实施。\u003c/p>\n\u003cp>\u003cstrong>检查对象和范围应有根据。\u003c/strong> 国家安全战略、重大部署是本条明确的督查内容，但具体由谁组织、检查谁、采用何种方式，仍须适用相应制度。政府督查条例只规范其适用范围内的政府督查，不能直接当作所有国家安全督促检查的通用授权。\u003c/p>\n\u003cp>\u003cstrong>发现问题与认定责任是不同环节。\u003c/strong> 某项任务未完成，可能涉及履职不力，也可能与客观条件、职责交叉、资源不足或原定方案不合理有关。应查明事实、职责、行为和相关责任条件，不能从结果不佳直接推导处分，更不能认为检查发现任何问题都必然构成违纪违法。\u003c/p>\n\u003cp>\u003cstrong>责任追究必须区分种类和机关。\u003c/strong> 党内问责、组织处理、党纪处分、政务处分以及刑事责任，各有适用对象、成立条件和程序。第46条确立建立机制的要求，并未独立设置罪名、罚则或者统一处分种类；追究具体责任须连接相应法律法规和党内法规。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>督促检查的功能是纠正执行偏差、推动整改并形成反馈；追责的功能是对符合责任条件的失职违法行为作出相应处理。二者相互衔接，但不能用追责取代问题分析，也不能以完成整改当然排除既有违法责任。\u003c/p>\n\u003cp>政府督查条例提供了清晰区分：对整改事项可以核查；需要追责时提出建议并交有权机关调查处理；发现涉嫌职务违法犯罪等线索时按规定移送。督查结论还须事实清楚、证据充分，并有申请复核的程序。可据此理解监督有效性与程序保障为何必须同时存在。\u003ca href=\"https://app.www.gov.cn/govdata/gov/202012/29/466468/article.html\">条例第16—23条\u003c/a>。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>整理案例时，应先问被违反的职责是什么、何种证据证明履职存在问题、最终由哪个机关依何规范处理。一个官员受到贪污受贿处罚，并不当然就是本条督查机制的适用案例；还需证明它与国家安全战略或重大部署落实的联系。\u003c/p>\n\u003cp>应形成“检查—反馈—整改—核查—依法处理—完善制度”的工作衔接。其中只有符合责任条件的事项进入相应追责程序。本条并不允许以抓落实为名重复、多头、越权检查，或者把督查权限扩大为侦查和处罚权限。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条同时规定发现落实问题的机制与依法追究责任的机制，落脚点是国家安全战略和重大部署的实际执行。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2015年4月20日修改情况汇报第四项有明确记载：将草案第40条第2款关于工作督促检查的规定，与草案第46条关于国家安全战略实施执行情况监督检查和评估的规定合并，并增加责任追究机制。报告建议表述为“国家安全工作督促和责任追究机制”，最后通过的第46条使用“督促检查和责任追究机制”。这说明责任追究是在整合相关制度时明确加入的内容，不能把最终条文原样当成该报告建议稿。见《中华人民共和国国家安全法释义》附录，印刷第380页／PDF第393页。\u003c/p>\n\u003cp>后续公开制度包括2018年审议通过的《党委（党组）国家安全责任制规定》，以及自2021年2月1日起施行的《政府督查工作条例》。前者涉及党委、党组的主体责任，后者规范政府督查；二者的主体、依据和适用范围不能混同。\u003ca href=\"https://exportcontrol.mofcom.gov.cn/article/zjsj/202205/652.html\">国家安全责任制相关公开说明\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202012/29/466468/article.html\">政府督查工作条例\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>督促检查既检查进度，也检查质量。\u003c/strong> 要了解战略任务是否具体分解，重大部署是否形成行动，资源和责任是否落实，发现的问题是否整改。仅开会、发文、提交报表，不足以证明战略已经有效实施。\u003c/p>\n\u003cp>\u003cstrong>检查对象和范围应有根据。\u003c/strong> 国家安全战略、重大部署是本条明确的督查内容，但具体由谁组织、检查谁、采用何种方式，仍须适用相应制度。政府督查条例只规范其适用范围内的政府督查，不能直接当作所有国家安全督促检查的通用授权。\u003c/p>\n\u003cp>\u003cstrong>发现问题与认定责任是不同环节。\u003c/strong> 某项任务未完成，可能涉及履职不力，也可能与客观条件、职责交叉、资源不足或原定方案不合理有关。应查明事实、职责、行为和相关责任条件，不能从结果不佳直接推导处分，更不能认为检查发现任何问题都必然构成违纪违法。\u003c/p>\n\u003cp>\u003cstrong>责任追究必须区分种类和机关。\u003c/strong> 党内问责、组织处理、党纪处分、政务处分以及刑事责任，各有适用对象、成立条件和程序。第46条确立建立机制的要求，并未独立设置罪名、罚则或者统一处分种类；追究具体责任须连接相应法律法规和党内法规。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>督促检查的功能是纠正执行偏差、推动整改并形成反馈；追责的功能是对符合责任条件的失职违法行为作出相应处理。二者相互衔接，但不能用追责取代问题分析，也不能以完成整改当然排除既有违法责任。\u003c/p>\n\u003cp>政府督查条例提供了清晰区分：对整改事项可以核查；需要追责时提出建议并交有权机关调查处理；发现涉嫌职务违法犯罪等线索时按规定移送。督查结论还须事实清楚、证据充分，并有申请复核的程序。可据此理解监督有效性与程序保障为何必须同时存在。\u003ca href=\"https://app.www.gov.cn/govdata/gov/202012/29/466468/article.html\">条例第16—23条\u003c/a>。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>整理案例时，应先问被违反的职责是什么、何种证据证明履职存在问题、最终由哪个机关依何规范处理。一个官员受到贪污受贿处罚，并不当然就是本条督查机制的适用案例；还需证明它与国家安全战略或重大部署落实的联系。\u003c/p>\n\u003cp>应形成“检查—反馈—整改—核查—依法处理—完善制度”的工作衔接。其中只有符合责任条件的事项进入相应追责程序。本条并不允许以抓落实为名重复、多头、越权检查，或者把督查权限扩大为侦查和处罚权限。\u003c/p>\n"},{"num":47,"label":"第四十七条","title":"国家安全战略的贯彻实施","lawText":"各部门、各地区应当采取有效措施，贯彻实施国家安全战略。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第四十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>各部门、各地区应当采取有效措施，贯彻实施国家安全战略。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第四十七条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>各部门、各地区应当采取有效措施，贯彻实施国家安全战略。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全战略的贯彻实施 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条将落实战略确立为部门和地区的义务。第6条回答战略制定及主要内容的问题，本条回答战略由谁落实、如何从总体部署转化为实际行动的问题。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年草案说明将国家安全战略的制定、实施和监督列入第四章制度设计。2015年4月20日修改情况汇报第二项认为战略具有顶层设计、统领全局的性质，建议把制定战略的规定从第四章移入总则，并细化其内容；同次汇报又整合战略实施监督评估机制。最终形成第6条规定战略制定、第47条规定实施、第46条规定督促检查与责任追究的结构。见《中华人民共和国国家安全法释义》附录，印刷第376、379—380页／PDF第389、392—393页。\u003c/p>\n\u003cp>在实践发展上，2015年中央政治局审议通过《国家安全战略纲要》；2021年11月18日的公开报道记载，中央政治局审议《国家安全战略（2021—2025年）》。后者在本笔记中作为阶段性实践例证，不据此推定2026年战略的具体安排。\u003ca href=\"https://www.cac.gov.cn/2017-10/16/c_1121806474.htm\">2015年公开大事记\u003c/a>、\u003ca href=\"https://politics.people.com.cn/n1/2021/1118/c1024-32286174.html\">2021年会议报道\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>责任主体覆盖部门与地区。\u003c/strong> 国家安全战略不只是专门安全机关的内部业务。各部门应结合本领域职责，各地区应结合本地风险和治理条件落实任务；不能因战略宏观抽象，或者部分工作需要其他部门配合，就认为自己没有执行义务。\u003c/p>\n\u003cp>\u003cstrong>有效措施需要把目标转化为可执行任务。\u003c/strong> 应识别本部门、本地区需要解决的风险，细化工作目标、责任主体、配合关系、资源需求、进度与反馈方式。落实不能停留在重复战略表述，也不能把会议、文件数量当作成效的替代指标。\u003c/p>\n\u003cp>\u003cstrong>实施方式应与职责相适应。\u003c/strong> 有立法权限的机关可以在权限内完善法规、规章；有关部门可以制定领域规划、工作方案，组织人员、技术和经费保障。需要新增或调整法定制度时，应履行相应立法程序。本条没有普遍赋予各部门、各地区制定“法律”的权力。\u003c/p>\n\u003cp>\u003cstrong>依法实施是有效实施的组成部分。\u003c/strong> 战略能够统领工作方向，具体措施仍须遵守第7条和第43条的依法履职、权利保障要求。限制公民权利、设定行政许可、实施处罚或者采取强制措施，不能只引用战略目标或本条作为完整依据。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>战略规范通常着重目标、优先事项和资源配置，法律规范则进一步确定行为边界、权限及责任。把战略落实为制度，需要在两者之间形成具体、合法的实施安排，不能跳过这一过程，直接把战略要求等同于对个人或组织的制裁规则。\u003c/p>\n\u003cp>实施还应向决策反馈信息：如果多个地区反复遇到同类问题，应分析是落实偏差、能力不足，还是目标和措施需要调整。这与第6条的“不断完善”以及第46条的监督相衔接，使战略实施包含执行、检验和改进。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>2016年12月27日发布的《国家网络空间安全战略》，通过领域目标和具体任务，把总体国家安全要求与网络空间治理衔接起来，可作为理解领域实施的例子；其政策指导功能与具体法律的执法依据功能仍须区分。\u003ca href=\"https://www.cac.gov.cn/2016-12/27/c_1120195926.htm\">国家网信办公布的战略全文\u003c/a>。\u003c/p>\n\u003cp>2025年5月12日发布的《新时代的中国国家安全》白皮书，在第六部分进一步说明国家安全战略的动态完善、宏观引领和政策落实。这是后续公开政策背景，不是2015年条文的立法材料，也不等于公布了全部战略文本和内部实施细则。\u003ca href=\"https://www.zytzb.gov.cn/zytzb/2025-05/14/article_2025051411070690694.shtml\">白皮书全文\u003c/a>。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条将落实战略确立为部门和地区的义务。第6条回答战略制定及主要内容的问题，本条回答战略由谁落实、如何从总体部署转化为实际行动的问题。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年草案说明将国家安全战略的制定、实施和监督列入第四章制度设计。2015年4月20日修改情况汇报第二项认为战略具有顶层设计、统领全局的性质，建议把制定战略的规定从第四章移入总则，并细化其内容；同次汇报又整合战略实施监督评估机制。最终形成第6条规定战略制定、第47条规定实施、第46条规定督促检查与责任追究的结构。见《中华人民共和国国家安全法释义》附录，印刷第376、379—380页／PDF第389、392—393页。\u003c/p>\n\u003cp>在实践发展上，2015年中央政治局审议通过《国家安全战略纲要》；2021年11月18日的公开报道记载，中央政治局审议《国家安全战略（2021—2025年）》。后者在本笔记中作为阶段性实践例证，不据此推定2026年战略的具体安排。\u003ca href=\"https://www.cac.gov.cn/2017-10/16/c_1121806474.htm\">2015年公开大事记\u003c/a>、\u003ca href=\"https://politics.people.com.cn/n1/2021/1118/c1024-32286174.html\">2021年会议报道\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>责任主体覆盖部门与地区。\u003c/strong> 国家安全战略不只是专门安全机关的内部业务。各部门应结合本领域职责，各地区应结合本地风险和治理条件落实任务；不能因战略宏观抽象，或者部分工作需要其他部门配合，就认为自己没有执行义务。\u003c/p>\n\u003cp>\u003cstrong>有效措施需要把目标转化为可执行任务。\u003c/strong> 应识别本部门、本地区需要解决的风险，细化工作目标、责任主体、配合关系、资源需求、进度与反馈方式。落实不能停留在重复战略表述，也不能把会议、文件数量当作成效的替代指标。\u003c/p>\n\u003cp>\u003cstrong>实施方式应与职责相适应。\u003c/strong> 有立法权限的机关可以在权限内完善法规、规章；有关部门可以制定领域规划、工作方案，组织人员、技术和经费保障。需要新增或调整法定制度时，应履行相应立法程序。本条没有普遍赋予各部门、各地区制定“法律”的权力。\u003c/p>\n\u003cp>\u003cstrong>依法实施是有效实施的组成部分。\u003c/strong> 战略能够统领工作方向，具体措施仍须遵守第7条和第43条的依法履职、权利保障要求。限制公民权利、设定行政许可、实施处罚或者采取强制措施，不能只引用战略目标或本条作为完整依据。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>战略规范通常着重目标、优先事项和资源配置，法律规范则进一步确定行为边界、权限及责任。把战略落实为制度，需要在两者之间形成具体、合法的实施安排，不能跳过这一过程，直接把战略要求等同于对个人或组织的制裁规则。\u003c/p>\n\u003cp>实施还应向决策反馈信息：如果多个地区反复遇到同类问题，应分析是落实偏差、能力不足，还是目标和措施需要调整。这与第6条的“不断完善”以及第46条的监督相衔接，使战略实施包含执行、检验和改进。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>2016年12月27日发布的《国家网络空间安全战略》，通过领域目标和具体任务，把总体国家安全要求与网络空间治理衔接起来，可作为理解领域实施的例子；其政策指导功能与具体法律的执法依据功能仍须区分。\u003ca href=\"https://www.cac.gov.cn/2016-12/27/c_1120195926.htm\">国家网信办公布的战略全文\u003c/a>。\u003c/p>\n\u003cp>2025年5月12日发布的《新时代的中国国家安全》白皮书，在第六部分进一步说明国家安全战略的动态完善、宏观引领和政策落实。这是后续公开政策背景，不是2015年条文的立法材料，也不等于公布了全部战略文本和内部实施细则。\u003ca href=\"https://www.zytzb.gov.cn/zytzb/2025-05/14/article_2025051411070690694.shtml\">白皮书全文\u003c/a>。\u003c/p>\n"},{"num":48,"label":"第四十八条","title":"跨部门会商工作机制","lawText":"国家根据维护国家安全工作需要，建立跨部门会商工作机制，就维护国家安全工作的重大事项进行会商研判，提出意见和建议。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第四十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家根据维护国家安全工作需要，建立跨部门会商工作机制，就维护国家安全工作的重大事项进行会商研判，提出意见和建议。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第四十八条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家根据维护国家安全工作需要，建立跨部门会商工作机制，就维护国家安全工作的重大事项进行会商研判，提出意见和建议。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">跨部门会商工作机制 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定以重大事项为对象、以跨部门交流分析为方法、以提出意见和建议为直接成果的工作机制。其重点是汇集各部门掌握的信息和专业判断，为后续决策提供依据。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>已有工作方式的制度化。\u003c/strong> 会商并非2015年才出现的工作方法。两书将其概括为有关部门对共同问题进行商议的常见方式；国家安全法将这种实践提升为重大安全事项的制度要求，使工作不完全依赖临时联系和个别人员协调。\u003c/p>\n\u003cp>\u003cstrong>在本法中的位置。\u003c/strong> 第45条规定重点领域工作协调，第47条要求贯彻实施战略，本条进一步解决重大事项如何汇集意见、分析判断的问题。它与第49条协同行动、第50条专家咨询相衔接，属于第四章第一节的一般制度。\u003c/p>\n\u003cp>\u003cstrong>草案说明中的依据。\u003c/strong> 2014年12月22日的草案说明在介绍第四章时，已明确列出“会商研判”机制，表明其属于初稿制度构想。见甲书附录二第376页（PDF389页）。后续修改报告未交代本条逐句改稿过程，也不能由一般机制说明推定此前实践已有统一的详细程序。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>“重大事项”以对国家安全的影响为中心。\u003c/strong> 既包括当前事件，也包括阶段性形势、潜在风险、危机应对、能力建设、重大工作部署和资源配置。并非只有已经发生损害的事项才可会商，预防性研判同样是本条的重要内容。\u003c/li>\n\u003cli>\u003cstrong>“跨部门”重在横向汇集。\u003c/strong> 按两书的体系解释，本条主要指中央有关职能部门之间或地方有关职能部门之间的横向会商；中央与地方的纵向联系主要放在第49条理解。这个分类有助于区分机制功能，但法条本身并未禁止中央与地方有关人员共同参与具体研判，不能把解释上的分类写成禁止协作的规则。\u003c/li>\n\u003cli>\u003cstrong>“会商”与“研判”各有侧重。\u003c/strong> 会商是交换情况、讨论分歧和寻求可行意见；研判是对事实、趋势、风险概率和可能后果进行分析。信息一致未必意味着判断一致，判断一致也未必意味着各部门对行动方案没有不同意见。\u003c/li>\n\u003cli>\u003cstrong>机制应具有持续性和适应性。\u003c/strong> 议题提出、参加部门、材料准备、意见形成及后续反馈，可以作相对稳定的安排；具体会商可以定期或临时举行，也可以采用会议、书面征求意见等方式。本条没有规定统一的月度、季度周期，重大紧急事项不应机械等待例会。\u003c/li>\n\u003cli>\u003cstrong>意见和建议需要进入有权机关的决策程序。\u003c/strong> 会商可以提高方案成熟度、明确分歧和执行条件；涉及正式决定、处罚或强制措施时，仍须由有权机关依具体法律程序处理。参与会商并不使各部门获得彼此的全部职权。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>信息分散与共同判断〔笔记分析〕。\u003c/strong> 不同部门分别掌握行业运行、技术风险、人员活动或国际环境等信息。会商的价值在于将局部认识相互校验，发现单个部门看不到的关联，而非仅把各部门报告装订在一起。\u003c/p>\n\u003cp>\u003cstrong>研判不能由多数意见替代事实检验。\u003c/strong> 书中强调，少数意见可能代表尚未发生但不能忽视的一种情景。可以记录各判断的证据、假设和不确定性，说明不同方案各自在何种条件下成立。形成工作意见与判断某个事实是否真实、某种风险是否存在，是不同的问题。\u003c/p>\n\u003cp>\u003cstrong>区分共同研究与责任归属。\u003c/strong> 会商有利于减少信息偏差，也可能使责任在多人参与中变得模糊。较好的制度安排应明确谁组织、谁提供材料、谁作出决定、谁负责反馈；这些是机制设计的分析方向，不是本条已经规定的完整程序清单。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>案例材料的使用。\u003c/strong> 书中有关间谍活动和能源企业遭网络攻击的示例未列足以核实的具体地点、案件名称或原始来源。本笔记将其用于理解跨部门研判的情境，不据此确认具体事件及机关指挥关系。\u003c/li>\n\u003cli>\u003cstrong>与第50条的区别。\u003c/strong> 本条侧重有关部门之间的职能协同与共同研判，第50条侧重专家及有关方面提供的专业知识。专家可以受邀参加会商，但参与者和主要功能仍应分别识别。\u003c/li>\n\u003cli>\u003cstrong>研究问题。\u003c/strong> 当部门意见分歧来自事实判断而非职责冲突时，应如何补充信息、检验假设并保留必要的不同意见？\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定以重大事项为对象、以跨部门交流分析为方法、以提出意见和建议为直接成果的工作机制。其重点是汇集各部门掌握的信息和专业判断，为后续决策提供依据。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>已有工作方式的制度化。\u003c/strong> 会商并非2015年才出现的工作方法。两书将其概括为有关部门对共同问题进行商议的常见方式；国家安全法将这种实践提升为重大安全事项的制度要求，使工作不完全依赖临时联系和个别人员协调。\u003c/p>\n\u003cp>\u003cstrong>在本法中的位置。\u003c/strong> 第45条规定重点领域工作协调，第47条要求贯彻实施战略，本条进一步解决重大事项如何汇集意见、分析判断的问题。它与第49条协同行动、第50条专家咨询相衔接，属于第四章第一节的一般制度。\u003c/p>\n\u003cp>\u003cstrong>草案说明中的依据。\u003c/strong> 2014年12月22日的草案说明在介绍第四章时，已明确列出“会商研判”机制，表明其属于初稿制度构想。见甲书附录二第376页（PDF389页）。后续修改报告未交代本条逐句改稿过程，也不能由一般机制说明推定此前实践已有统一的详细程序。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>“重大事项”以对国家安全的影响为中心。\u003c/strong> 既包括当前事件，也包括阶段性形势、潜在风险、危机应对、能力建设、重大工作部署和资源配置。并非只有已经发生损害的事项才可会商，预防性研判同样是本条的重要内容。\u003c/li>\n\u003cli>\u003cstrong>“跨部门”重在横向汇集。\u003c/strong> 按两书的体系解释，本条主要指中央有关职能部门之间或地方有关职能部门之间的横向会商；中央与地方的纵向联系主要放在第49条理解。这个分类有助于区分机制功能，但法条本身并未禁止中央与地方有关人员共同参与具体研判，不能把解释上的分类写成禁止协作的规则。\u003c/li>\n\u003cli>\u003cstrong>“会商”与“研判”各有侧重。\u003c/strong> 会商是交换情况、讨论分歧和寻求可行意见；研判是对事实、趋势、风险概率和可能后果进行分析。信息一致未必意味着判断一致，判断一致也未必意味着各部门对行动方案没有不同意见。\u003c/li>\n\u003cli>\u003cstrong>机制应具有持续性和适应性。\u003c/strong> 议题提出、参加部门、材料准备、意见形成及后续反馈，可以作相对稳定的安排；具体会商可以定期或临时举行，也可以采用会议、书面征求意见等方式。本条没有规定统一的月度、季度周期，重大紧急事项不应机械等待例会。\u003c/li>\n\u003cli>\u003cstrong>意见和建议需要进入有权机关的决策程序。\u003c/strong> 会商可以提高方案成熟度、明确分歧和执行条件；涉及正式决定、处罚或强制措施时，仍须由有权机关依具体法律程序处理。参与会商并不使各部门获得彼此的全部职权。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>信息分散与共同判断〔笔记分析〕。\u003c/strong> 不同部门分别掌握行业运行、技术风险、人员活动或国际环境等信息。会商的价值在于将局部认识相互校验，发现单个部门看不到的关联，而非仅把各部门报告装订在一起。\u003c/p>\n\u003cp>\u003cstrong>研判不能由多数意见替代事实检验。\u003c/strong> 书中强调，少数意见可能代表尚未发生但不能忽视的一种情景。可以记录各判断的证据、假设和不确定性，说明不同方案各自在何种条件下成立。形成工作意见与判断某个事实是否真实、某种风险是否存在，是不同的问题。\u003c/p>\n\u003cp>\u003cstrong>区分共同研究与责任归属。\u003c/strong> 会商有利于减少信息偏差，也可能使责任在多人参与中变得模糊。较好的制度安排应明确谁组织、谁提供材料、谁作出决定、谁负责反馈；这些是机制设计的分析方向，不是本条已经规定的完整程序清单。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>案例材料的使用。\u003c/strong> 书中有关间谍活动和能源企业遭网络攻击的示例未列足以核实的具体地点、案件名称或原始来源。本笔记将其用于理解跨部门研判的情境，不据此确认具体事件及机关指挥关系。\u003c/li>\n\u003cli>\u003cstrong>与第50条的区别。\u003c/strong> 本条侧重有关部门之间的职能协同与共同研判，第50条侧重专家及有关方面提供的专业知识。专家可以受邀参加会商，但参与者和主要功能仍应分别识别。\u003c/li>\n\u003cli>\u003cstrong>研究问题。\u003c/strong> 当部门意见分歧来自事实判断而非职责冲突时，应如何补充信息、检验假设并保留必要的不同意见？\u003c/li>\n\u003c/ul>\n"},{"num":49,"label":"第四十九条","title":"国家安全协同联动机制","lawText":"国家建立中央与地方之间、部门之间、军地之间以及地区之间关于国家安全的协同联动机制。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第四十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立中央与地方之间、部门之间、军地之间以及地区之间关于国家安全的协同联动机制。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第四十九条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立中央与地方之间、部门之间、军地之间以及地区之间关于国家安全的协同联动机制。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全协同联动机制 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条列出四类需要衔接的关系，将国家安全工作从分别履职推进到相互配合。“协同”侧重分工、沟通和安排，“联动”侧重各方依安排采取彼此衔接的行动。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>2015年前已有分领域基础。\u003c/strong> 国防动员、突发事件应对、安全生产等制度已分别规定不同机关和区域之间的配合。本条的作用，是在国家安全的综合框架内明确协同联动要求，回应资源分散、条块衔接不畅和行动配合不足等问题。\u003c/p>\n\u003cp>\u003cstrong>本法之后的具体发展。\u003c/strong> 2020年修订的国防法第17、19条分别规定国务院与中央军委的协调机制及地方军地联席会议；2024年修订、同年11月1日起施行的突发事件应对法，进一步规定跨行政区域应对和地方政府之间的协同应对机制。这些具体规定有助于理解协同如何落实，但各有适用领域与程序。\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202405/t20240529_3698466.html\">现行国防法\u003c/a>、\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">2024年修订的突发事件应对法\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>直接立法材料。\u003c/strong> 2014年12月22日草案说明已列出“协同联动”机制，并将统筹协调不足、力量分散等列为立法需要回应的问题。见甲书附录二第372—373、376页（PDF385—386、389页）。材料未具体交代本条四类关系的逐次改稿过程；书中列举的联席会议名称，也不宜未经核验就当作现行完整机构名录。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>中央与地方之间：衔接统一部署与区域实施。\u003c/strong> 中央层面统筹重大事项，地方依法承担本行政区域的任务；地方发现的风险需要及时上报，部署也需要结合实际组织执行。信息向上汇集与任务向下落实应形成联系。\u003c/li>\n\u003cli>\u003cstrong>部门之间：衔接专业分工。\u003c/strong> 同一风险可能涉及金融、网络、交通、公共卫生等多个领域。部门合作需要明确主责与配合关系、事项移交及信息使用规则，减少无人负责与重复处置。\u003c/li>\n\u003cli>\u003cstrong>军地之间：衔接不同体系的能力。\u003c/strong> 国防动员、设施保护、应急救援等可能需要地方与军事机关合作。协同须在各自法定职责及指挥关系内开展，不因建立联动机制就改变第37、38条规定的行政管理与军事指挥分工。\u003c/li>\n\u003cli>\u003cstrong>地区之间：处理风险跨界传播。\u003c/strong> 风险和资源并不总与行政边界一致。相邻地区及其他相关地区可以依法律和具体机制共享情况、互相支援、协调处置；超出本级处理能力或需要统一组织的，依法由相应上级机关统筹。\u003c/li>\n\u003cli>\u003cstrong>联动不限于危机后的集中行动。\u003c/strong> 平时的信息接口、联合预案、资源保障、演练和任务反馈，都影响事件发生时能否有效合作。条文未将本机制限于战时或紧急状态。\u003c/li>\n\u003cli>\u003cstrong>协同不等于合并权限。\u003c/strong> 建立联席会议或者共同工作安排，不会自动创设新的侦查、处罚或军事指挥权。谁可以调取信息、采取措施、作出决定，仍须依具体法律确定。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>对跨界风险作整体应对〔笔记分析〕。\u003c/strong> 行政分工通常按部门和区域划分，而风险可能沿供应链、网络、流域或人员流动传播。本条要求把这些相互影响的环节联系起来，避免各单位都完成了本部门动作，整体风险却仍无人处理。\u003c/p>\n\u003cp>\u003cstrong>协同既有资源问题，也有规则问题。\u003c/strong> 即使人员、设备充足，信息不能及时传递、主责机关不明、措施无法衔接，仍可能影响处置。机制建设因此不仅是“增加力量”，还包括明确启动条件、联系程序、执行顺序和责任承担。\u003c/p>\n\u003cp>\u003cstrong>与会商的功能区别。\u003c/strong> 第48条直接形成意见和建议，本条强调更广范围的组织配合和行动衔接。两者可能先后使用，也可能贯穿同一过程，不宜理解为彼此排斥的两种模式。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>可直接对照的具体规范。\u003c/strong> 反恐怖主义法第8条规定分工履职及联动配合，安全生产法第85条规定事故抢救中的统一指挥和协同联动。前者还要求依法区分普通国家机关与武装力量的职责，后者说明现场救援的配合要求。\u003ca href=\"https://www.miit.gov.cn/jgsj/zfs/fl/art/2022/art_2c79fa5f17834377afffd4cc359392bf.html\">反恐怖主义法（2018年修正）\u003c/a>、\u003ca href=\"https://www.samr.gov.cn/tzsbj/zcfg/flfg/art/2021/art_d8ec5ba871464b49bfd0a0275bb57756.html\">安全生产法（2021年修正）\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>引注与案例校核。\u003c/strong> 乙书第141页将反恐怖主义法第21条列为关联规定，但该条内容是有关经营者、服务提供者的客户身份查验，直接说明联动机制应优先参照第7—8条等规定。同页两个匿名案例缺少可核实出处，不能据其叙述推导国家安全部具有普遍的军队调动、指挥权限。\u003c/p>\n\u003cp>\u003cstrong>研究问题。\u003c/strong> 一项跨部门、跨地区任务如何明确牵头、配合和指挥关系，并使每个主体的责任在联合行动中仍可识别？\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条列出四类需要衔接的关系，将国家安全工作从分别履职推进到相互配合。“协同”侧重分工、沟通和安排，“联动”侧重各方依安排采取彼此衔接的行动。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>2015年前已有分领域基础。\u003c/strong> 国防动员、突发事件应对、安全生产等制度已分别规定不同机关和区域之间的配合。本条的作用，是在国家安全的综合框架内明确协同联动要求，回应资源分散、条块衔接不畅和行动配合不足等问题。\u003c/p>\n\u003cp>\u003cstrong>本法之后的具体发展。\u003c/strong> 2020年修订的国防法第17、19条分别规定国务院与中央军委的协调机制及地方军地联席会议；2024年修订、同年11月1日起施行的突发事件应对法，进一步规定跨行政区域应对和地方政府之间的协同应对机制。这些具体规定有助于理解协同如何落实，但各有适用领域与程序。\u003ca href=\"https://gdb.beijing.gov.cn/rf_zwgk/2024zcwj/2024_flfg/202405/t20240529_3698466.html\">现行国防法\u003c/a>、\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">2024年修订的突发事件应对法\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>直接立法材料。\u003c/strong> 2014年12月22日草案说明已列出“协同联动”机制，并将统筹协调不足、力量分散等列为立法需要回应的问题。见甲书附录二第372—373、376页（PDF385—386、389页）。材料未具体交代本条四类关系的逐次改稿过程；书中列举的联席会议名称，也不宜未经核验就当作现行完整机构名录。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>中央与地方之间：衔接统一部署与区域实施。\u003c/strong> 中央层面统筹重大事项，地方依法承担本行政区域的任务；地方发现的风险需要及时上报，部署也需要结合实际组织执行。信息向上汇集与任务向下落实应形成联系。\u003c/li>\n\u003cli>\u003cstrong>部门之间：衔接专业分工。\u003c/strong> 同一风险可能涉及金融、网络、交通、公共卫生等多个领域。部门合作需要明确主责与配合关系、事项移交及信息使用规则，减少无人负责与重复处置。\u003c/li>\n\u003cli>\u003cstrong>军地之间：衔接不同体系的能力。\u003c/strong> 国防动员、设施保护、应急救援等可能需要地方与军事机关合作。协同须在各自法定职责及指挥关系内开展，不因建立联动机制就改变第37、38条规定的行政管理与军事指挥分工。\u003c/li>\n\u003cli>\u003cstrong>地区之间：处理风险跨界传播。\u003c/strong> 风险和资源并不总与行政边界一致。相邻地区及其他相关地区可以依法律和具体机制共享情况、互相支援、协调处置；超出本级处理能力或需要统一组织的，依法由相应上级机关统筹。\u003c/li>\n\u003cli>\u003cstrong>联动不限于危机后的集中行动。\u003c/strong> 平时的信息接口、联合预案、资源保障、演练和任务反馈，都影响事件发生时能否有效合作。条文未将本机制限于战时或紧急状态。\u003c/li>\n\u003cli>\u003cstrong>协同不等于合并权限。\u003c/strong> 建立联席会议或者共同工作安排，不会自动创设新的侦查、处罚或军事指挥权。谁可以调取信息、采取措施、作出决定，仍须依具体法律确定。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>对跨界风险作整体应对〔笔记分析〕。\u003c/strong> 行政分工通常按部门和区域划分，而风险可能沿供应链、网络、流域或人员流动传播。本条要求把这些相互影响的环节联系起来，避免各单位都完成了本部门动作，整体风险却仍无人处理。\u003c/p>\n\u003cp>\u003cstrong>协同既有资源问题，也有规则问题。\u003c/strong> 即使人员、设备充足，信息不能及时传递、主责机关不明、措施无法衔接，仍可能影响处置。机制建设因此不仅是“增加力量”，还包括明确启动条件、联系程序、执行顺序和责任承担。\u003c/p>\n\u003cp>\u003cstrong>与会商的功能区别。\u003c/strong> 第48条直接形成意见和建议，本条强调更广范围的组织配合和行动衔接。两者可能先后使用，也可能贯穿同一过程，不宜理解为彼此排斥的两种模式。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>\u003cstrong>可直接对照的具体规范。\u003c/strong> 反恐怖主义法第8条规定分工履职及联动配合，安全生产法第85条规定事故抢救中的统一指挥和协同联动。前者还要求依法区分普通国家机关与武装力量的职责，后者说明现场救援的配合要求。\u003ca href=\"https://www.miit.gov.cn/jgsj/zfs/fl/art/2022/art_2c79fa5f17834377afffd4cc359392bf.html\">反恐怖主义法（2018年修正）\u003c/a>、\u003ca href=\"https://www.samr.gov.cn/tzsbj/zcfg/flfg/art/2021/art_d8ec5ba871464b49bfd0a0275bb57756.html\">安全生产法（2021年修正）\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>引注与案例校核。\u003c/strong> 乙书第141页将反恐怖主义法第21条列为关联规定，但该条内容是有关经营者、服务提供者的客户身份查验，直接说明联动机制应优先参照第7—8条等规定。同页两个匿名案例缺少可核实出处，不能据其叙述推导国家安全部具有普遍的军队调动、指挥权限。\u003c/p>\n\u003cp>\u003cstrong>研究问题。\u003c/strong> 一项跨部门、跨地区任务如何明确牵头、配合和指挥关系，并使每个主体的责任在联合行动中仍可识别？\u003c/p>\n"},{"num":50,"label":"第五十条","title":"国家安全决策咨询机制","lawText":"国家建立国家安全决策咨询机制，组织专家和有关方面开展对国家安全形势的分析研判，推进国家安全的科学决策。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第五十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立国家安全决策咨询机制，组织专家和有关方面开展对国家安全形势的分析研判，推进国家安全的科学决策。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第五十条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立国家安全决策咨询机制，组织专家和有关方面开展对国家安全形势的分析研判，推进国家安全的科学决策。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全决策咨询机制 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条把专业知识和有关方面的经验纳入决策准备，以分析研判支持科学决策。咨询是为决策提供依据的制度环节，法定决策权和相应责任仍须依有关规定确定。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>咨询制度的既有基础。\u003c/strong> 两书将本条联系到2004年有关完善决策机制的政策要求，以及文物保护、科技管理等领域的专家咨询规定。这说明2015年立法已有其他领域的制度经验可资借鉴。\u003c/p>\n\u003cp>\u003cstrong>立法前后的政策背景。\u003c/strong> 2015年1月公开发布的《关于加强中国特色新型智库建设的意见》，提出健全决策咨询、意见征集和政策评估制度，为理解本条的形成背景提供材料。它属于政策和制度建设背景，不能替代法律上的职权依据。\u003ca href=\"https://www.moe.gov.cn/jyb_xwfb/s5147/201501/t20150121_183227.html\">该《意见》公开文本\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>初稿已有制度安排。\u003c/strong> 2014年12月22日草案说明介绍第四章时，明确列出“决策咨询”机制。见甲书附录二第376页（PDF389页）。起草过程曾征求专家意见，可以说明咨询论证的方法已有运用，但不等同于本法施行后决策咨询机制的实施案例。\u003c/p>\n\u003cp>\u003cstrong>后续关联立法。\u003c/strong> 生物安全法第12条明确设立专家委员会，为生物安全战略、政策及实施提供咨询；2021年修订、2022年1月1日起施行的科学技术进步法第99条规定重大科技决策咨询、听取科技人员意见和科学评估。旧版释义引用2007年科技进步法第13条时，应与现行条号及内容区别。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_072313e1142c4ca193b8dc80d9c0e904.html\">生物安全法（2024年修正）\u003c/a>、\u003ca href=\"https://www.most.gov.cn/xxgk/xinxifenlei/fdzdgknr/fgzc/flfg/202201/t20220118_179043.html\">科学技术进步法（2021年修订）\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>咨询应成为稳定机制。\u003c/strong> 本条要求建立机制，意味着专家知识与决策需求之间应有持续联系。研究议题的提出、专业人员组织、成果提交和意见反馈，均可作为机制建设内容；不只是决策前临时邀请专家开一次会。\u003c/li>\n\u003cli>\u003cstrong>参与主体包括专家和有关方面。\u003c/strong> 专家能够提供技术、法律、经济、国际关系等知识；有关方面能够补充实际运行情况、执行条件与受影响主体的经验。“专家”不只限于某一学科，也不应仅以职务或头衔判断其对具体问题的专业能力。\u003c/li>\n\u003cli>\u003cstrong>分析研判兼顾当前与未来。\u003c/strong> 可以研究现有威胁、潜在风险、事件之间的联系、不同情景的发展趋势，以及备选方案的效果与代价。对信息来源、判断依据和不确定性的说明，会直接影响咨询成果的可用性。\u003c/li>\n\u003cli>\u003cstrong>科学决策需要多种知识相互检验。\u003c/strong> 技术可行不必然等于法律允许，短期有效也不必然意味着长期代价可接受。跨学科分析有助于把专业意见转化为可比较、可执行的方案。\u003c/li>\n\u003cli>\u003cstrong>咨询与正式决策相衔接。\u003c/strong> 专家提出意见，决策机关依法综合判断并承担相应责任。本条没有规定咨询意见一律具有约束力，也没有授权专家代行侦查、行政处罚等国家职权。\u003c/li>\n\u003cli>\u003cstrong>专业讨论与保密要求并行。\u003c/strong> 有效咨询需要与研究问题相关的信息，也须遵守国家秘密、数据和其他受保护信息的适用规则。聘请外部专家本身不意味着全部决策材料应向社会公开；信息公开范围仍需依据相应规范判断。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>知识支持与权力行使〔笔记分析〕。\u003c/strong> 专业人员擅长解释技术事实、评估概率和推演后果，决策还涉及法律权限、公共利益和资源分配。制度设计应使专业意见被充分理解，同时保留决策机关对合法性及利益权衡的责任。\u003c/p>\n\u003cp>\u003cstrong>科学性不等于对预测结果作绝对保证。\u003c/strong> 可以从信息质量、分析方法、备选方案、不同意见及事后检验等方面评价咨询过程。风险预测未完全实现，不当然说明咨询失当；也不能仅因最终结果有利，就忽略过程中的证据不足或违法决策。\u003c/p>\n\u003cp>\u003cstrong>有条件的开放讨论。\u003c/strong> 两书强调求真务实、允许不同观点交流。对于高度不确定的问题，明确分歧及其依据，往往比形成没有条件说明的一致结论更有助于决策。专家利益冲突披露、适当回避和意见留存，可以作为进一步研究机制设计的方向；本条未直接规定这些制度的全部细节。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>比较具体领域。\u003c/strong> 2024年修订的突发事件应对法第57条要求建立健全专家咨询论证制度，可以与本条对照，观察综合性任务如何在应急领域得到具体规定。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">突发事件应对法第57条\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>情境材料的限度。\u003c/strong> 书中“某国家公共卫生事件”和“某地区生态风险”的示例未明确国家、地点和原始出处，宜用于说明咨询的可能作用，不能据此证明某国制度优劣或把结果完全归因于是否设有咨询机制。\u003c/li>\n\u003cli>\u003cstrong>章节衔接。\u003c/strong> 第50条结束一般规定，第51条起转入情报信息制度。可靠信息是咨询研判的重要基础，但咨询机制与专门机关依法开展情报工作的职权并不相同。\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条把专业知识和有关方面的经验纳入决策准备，以分析研判支持科学决策。咨询是为决策提供依据的制度环节，法定决策权和相应责任仍须依有关规定确定。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>\u003cstrong>咨询制度的既有基础。\u003c/strong> 两书将本条联系到2004年有关完善决策机制的政策要求，以及文物保护、科技管理等领域的专家咨询规定。这说明2015年立法已有其他领域的制度经验可资借鉴。\u003c/p>\n\u003cp>\u003cstrong>立法前后的政策背景。\u003c/strong> 2015年1月公开发布的《关于加强中国特色新型智库建设的意见》，提出健全决策咨询、意见征集和政策评估制度，为理解本条的形成背景提供材料。它属于政策和制度建设背景，不能替代法律上的职权依据。\u003ca href=\"https://www.moe.gov.cn/jyb_xwfb/s5147/201501/t20150121_183227.html\">该《意见》公开文本\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>初稿已有制度安排。\u003c/strong> 2014年12月22日草案说明介绍第四章时，明确列出“决策咨询”机制。见甲书附录二第376页（PDF389页）。起草过程曾征求专家意见，可以说明咨询论证的方法已有运用，但不等同于本法施行后决策咨询机制的实施案例。\u003c/p>\n\u003cp>\u003cstrong>后续关联立法。\u003c/strong> 生物安全法第12条明确设立专家委员会，为生物安全战略、政策及实施提供咨询；2021年修订、2022年1月1日起施行的科学技术进步法第99条规定重大科技决策咨询、听取科技人员意见和科学评估。旧版释义引用2007年科技进步法第13条时，应与现行条号及内容区别。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_072313e1142c4ca193b8dc80d9c0e904.html\">生物安全法（2024年修正）\u003c/a>、\u003ca href=\"https://www.most.gov.cn/xxgk/xinxifenlei/fdzdgknr/fgzc/flfg/202201/t20220118_179043.html\">科学技术进步法（2021年修订）\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>咨询应成为稳定机制。\u003c/strong> 本条要求建立机制，意味着专家知识与决策需求之间应有持续联系。研究议题的提出、专业人员组织、成果提交和意见反馈，均可作为机制建设内容；不只是决策前临时邀请专家开一次会。\u003c/li>\n\u003cli>\u003cstrong>参与主体包括专家和有关方面。\u003c/strong> 专家能够提供技术、法律、经济、国际关系等知识；有关方面能够补充实际运行情况、执行条件与受影响主体的经验。“专家”不只限于某一学科，也不应仅以职务或头衔判断其对具体问题的专业能力。\u003c/li>\n\u003cli>\u003cstrong>分析研判兼顾当前与未来。\u003c/strong> 可以研究现有威胁、潜在风险、事件之间的联系、不同情景的发展趋势，以及备选方案的效果与代价。对信息来源、判断依据和不确定性的说明，会直接影响咨询成果的可用性。\u003c/li>\n\u003cli>\u003cstrong>科学决策需要多种知识相互检验。\u003c/strong> 技术可行不必然等于法律允许，短期有效也不必然意味着长期代价可接受。跨学科分析有助于把专业意见转化为可比较、可执行的方案。\u003c/li>\n\u003cli>\u003cstrong>咨询与正式决策相衔接。\u003c/strong> 专家提出意见，决策机关依法综合判断并承担相应责任。本条没有规定咨询意见一律具有约束力，也没有授权专家代行侦查、行政处罚等国家职权。\u003c/li>\n\u003cli>\u003cstrong>专业讨论与保密要求并行。\u003c/strong> 有效咨询需要与研究问题相关的信息，也须遵守国家秘密、数据和其他受保护信息的适用规则。聘请外部专家本身不意味着全部决策材料应向社会公开；信息公开范围仍需依据相应规范判断。\u003c/li>\n\u003c/ol>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>知识支持与权力行使〔笔记分析〕。\u003c/strong> 专业人员擅长解释技术事实、评估概率和推演后果，决策还涉及法律权限、公共利益和资源分配。制度设计应使专业意见被充分理解，同时保留决策机关对合法性及利益权衡的责任。\u003c/p>\n\u003cp>\u003cstrong>科学性不等于对预测结果作绝对保证。\u003c/strong> 可以从信息质量、分析方法、备选方案、不同意见及事后检验等方面评价咨询过程。风险预测未完全实现，不当然说明咨询失当；也不能仅因最终结果有利，就忽略过程中的证据不足或违法决策。\u003c/p>\n\u003cp>\u003cstrong>有条件的开放讨论。\u003c/strong> 两书强调求真务实、允许不同观点交流。对于高度不确定的问题，明确分歧及其依据，往往比形成没有条件说明的一致结论更有助于决策。专家利益冲突披露、适当回避和意见留存，可以作为进一步研究机制设计的方向；本条未直接规定这些制度的全部细节。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>比较具体领域。\u003c/strong> 2024年修订的突发事件应对法第57条要求建立健全专家咨询论证制度，可以与本条对照，观察综合性任务如何在应急领域得到具体规定。\u003ca href=\"https://yjglj.sh.gov.cn/xxgk/xxgkml/zcfg/gjfl/20240805/b50983fa4be44583b190d50de11fb7fe.html\">突发事件应对法第57条\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>情境材料的限度。\u003c/strong> 书中“某国家公共卫生事件”和“某地区生态风险”的示例未明确国家、地点和原始出处，宜用于说明咨询的可能作用，不能据此证明某国制度优劣或把结果完全归因于是否设有咨询机制。\u003c/li>\n\u003cli>\u003cstrong>章节衔接。\u003c/strong> 第50条结束一般规定，第51条起转入情报信息制度。可靠信息是咨询研判的重要基础，但咨询机制与专门机关依法开展情报工作的职权并不相同。\u003c/li>\n\u003c/ul>\n"},{"num":51,"label":"第五十一条","title":"情报信息制度与协调机制","lawText":"国家健全统一归口、反应灵敏、准确高效、运转顺畅的情报信息收集、研判和使用制度，建立情报信息工作协调机制，实现情报信息的及时收集、准确研判、有效使用和共享。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第五十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全统一归口、反应灵敏、准确高效、运转顺畅的情报信息收集、研判和使用制度，建立情报信息工作协调机制，实现情报信息的及时收集、准确研判、有效使用和共享。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第五十一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家健全统一归口、反应灵敏、准确高效、运转顺畅的情报信息收集、研判和使用制度，建立情报信息工作协调机制，实现情报信息的及时收集、准确研判、有效使用和共享。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">情报信息制度与协调机制 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条是第四章第二节的总括规定：把情报工作作为从收集、分析到使用的完整过程加以组织，解决各部门掌握信息而国家整体不能有效利用的问题。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2015年4月20日草案修改情况汇报第四项第二点明确提出，将初稿第47条关于情报信息收集研判制度与初稿第52条关于情报信息使用制度合并，建议表述已经包含现行条文的全部内容。这一修改的意义，在于把“获取信息”和“使用信息”接起来，并突出工作协调与共享。这里的初稿第52条不能混同于现行第52条。（《释义》附录三，印刷第380—381页／PDF第393—394页。）\u003c/p>\n\u003cp>后续《国家情报法》于2017年6月27日通过、6月28日施行，2018年4月27日修正。其第3条进一步规定情报体制、中央国家安全领导机构的统一领导与协调职责，以及中央军委统一领导、组织军队情报工作，属于本条制度方向的专门化落实。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_281475.html\">国家情报法\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>情报信息服务于特定安全判断。\u003c/strong> 它既可能来自公开资料，也可能来自依法开展的专门工作；既包括原始情况，也包括经过分析形成的产品。因此，不能把“情报”一概等同于秘密材料，亦不能把本节的广义情报信息概念直接套入某一犯罪构成中的“情报”。\u003c/p>\n\u003cp>四项制度要求各有侧重：“统一归口”着重统一领导和渠道管理；“反应灵敏”着重及时发现变化并回应任务；“准确高效”兼顾内容可靠与流转效率；“运转顺畅”要求收集、研判、使用等环节有效衔接。归口并不意味着所有机关只能由一个机构搜集信息，第52条仍保留专业分工和一般部门履职上报两种路径。\u003c/p>\n\u003cp>协调机制的作用，是把不同部门的信息接入共同判断过程，减少重复收集、信息滞留及片面决策。共享也须有接收主体、任务需要和使用范围；“有效共享”不能解释成取消保密要求、使所有人员无差别访问全部资料。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现情报工作中专业分工与整体协调的结合。分工有利于专业积累，却可能形成各自掌握局部信息的状态；协调应帮助发现信息之间的联系，而不能以统一之名消除事实上的不确定性和不同分析意见。\u003c/p>\n\u003cp>“收集—研判—使用—反馈”可作为理解本条的工作模型，其中前三项来自条文，“反馈”是由有效使用目标推导出的管理建议：使用部门说明信息是否适用、尚缺什么，有助于调整下一轮搜集和分析。不能把这一建议误写为本条逐项规定的法定程序。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>与后续条文连读：第52条确定信息来源与职责，第53条要求技术运用及分析加工，第54条约束报送质量，第55—58条将信息转化为风险预防和应对。阅读案例时，应分别查明“未收集到”“已有信息未共享”“研判错误”“使用处置不当”，不能仅凭事件最终发生，就断言某一部门违反了本条。\u003c/p>\n\u003cp>现行《国家情报法》第8条同时要求依法开展情报工作并保护个人、组织合法权益；第19条禁止越权、滥权及泄露国家秘密、商业秘密和个人信息。效率与共享始终在法定职责和程序之内运行。\u003ca href=\"https://qhca.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_a97c92189dea4940bf0ec7739d89026c.html\">国家情报法现行文本\u003c/a>\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条是第四章第二节的总括规定：把情报工作作为从收集、分析到使用的完整过程加以组织，解决各部门掌握信息而国家整体不能有效利用的问题。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2015年4月20日草案修改情况汇报第四项第二点明确提出，将初稿第47条关于情报信息收集研判制度与初稿第52条关于情报信息使用制度合并，建议表述已经包含现行条文的全部内容。这一修改的意义，在于把“获取信息”和“使用信息”接起来，并突出工作协调与共享。这里的初稿第52条不能混同于现行第52条。（《释义》附录三，印刷第380—381页／PDF第393—394页。）\u003c/p>\n\u003cp>后续《国家情报法》于2017年6月27日通过、6月28日施行，2018年4月27日修正。其第3条进一步规定情报体制、中央国家安全领导机构的统一领导与协调职责，以及中央军委统一领导、组织军队情报工作，属于本条制度方向的专门化落实。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_281475.html\">国家情报法\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>情报信息服务于特定安全判断。\u003c/strong> 它既可能来自公开资料，也可能来自依法开展的专门工作；既包括原始情况，也包括经过分析形成的产品。因此，不能把“情报”一概等同于秘密材料，亦不能把本节的广义情报信息概念直接套入某一犯罪构成中的“情报”。\u003c/p>\n\u003cp>四项制度要求各有侧重：“统一归口”着重统一领导和渠道管理；“反应灵敏”着重及时发现变化并回应任务；“准确高效”兼顾内容可靠与流转效率；“运转顺畅”要求收集、研判、使用等环节有效衔接。归口并不意味着所有机关只能由一个机构搜集信息，第52条仍保留专业分工和一般部门履职上报两种路径。\u003c/p>\n\u003cp>协调机制的作用，是把不同部门的信息接入共同判断过程，减少重复收集、信息滞留及片面决策。共享也须有接收主体、任务需要和使用范围；“有效共享”不能解释成取消保密要求、使所有人员无差别访问全部资料。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现情报工作中专业分工与整体协调的结合。分工有利于专业积累，却可能形成各自掌握局部信息的状态；协调应帮助发现信息之间的联系，而不能以统一之名消除事实上的不确定性和不同分析意见。\u003c/p>\n\u003cp>“收集—研判—使用—反馈”可作为理解本条的工作模型，其中前三项来自条文，“反馈”是由有效使用目标推导出的管理建议：使用部门说明信息是否适用、尚缺什么，有助于调整下一轮搜集和分析。不能把这一建议误写为本条逐项规定的法定程序。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>与后续条文连读：第52条确定信息来源与职责，第53条要求技术运用及分析加工，第54条约束报送质量，第55—58条将信息转化为风险预防和应对。阅读案例时，应分别查明“未收集到”“已有信息未共享”“研判错误”“使用处置不当”，不能仅凭事件最终发生，就断言某一部门违反了本条。\u003c/p>\n\u003cp>现行《国家情报法》第8条同时要求依法开展情报工作并保护个人、组织合法权益；第19条禁止越权、滥权及泄露国家秘密、商业秘密和个人信息。效率与共享始终在法定职责和程序之内运行。\u003ca href=\"https://qhca.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_a97c92189dea4940bf0ec7739d89026c.html\">国家情报法现行文本\u003c/a>\u003c/p>\n"},{"num":52,"label":"第五十二条","title":"专门机关搜集与各部门履职上报","lawText":"国家安全机关、公安机关、有关军事机关根据职责分工，依法搜集涉及国家安全的情报信息。\n\n国家机关各部门在履行职责过程中，对于获取的涉及国家安全的有关信息应当及时上报。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第五十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家安全机关、公安机关、有关军事机关根据职责分工，依法搜集涉及国家安全的情报信息。\u003c/p>\n\u003cp>国家机关各部门在履行职责过程中，对于获取的涉及国家安全的有关信息应当及时上报。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第五十二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家安全机关、公安机关、有关军事机关根据职责分工，依法搜集涉及国家安全的情报信息。\u003c/p>\n\u003cp>国家机关各部门在履行职责过程中，对于获取的涉及国家安全的有关信息应当及时上报。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">专门机关搜集与各部门履职上报 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>两款分别规定专门搜集职责和履职上报职责，核心是使专门工作与各部门日常管理中的信息获取相衔接。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已经把统一的情报信息收集研判制度列为国家安全制度的重要内容；所核审议材料没有逐句交代本条改稿过程。（《释义》附录二，印刷第376—377页／PDF第389—390页。）\u003c/p>\n\u003cp>2017年《国家情报法》第5条进一步使用“国家情报工作机构”这一法定称谓，包括国家安全机关和公安机关情报机构、军队情报机构，并规定其他有关国家机关依各自职能和任务分工密切配合。阅读本条时应结合这一后续专门规范，把机关的广义职责与具体情报机构的职权区分开。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_281475.html\">国家情报法第5条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>第一款的三个限定须同时满足。**“根据职责分工”\u003cstrong>说明不同机关各有任务边界，不能因信息“涉及国家安全”就抹平管辖分工。\u003c/strong>“依法搜集”\u003cstrong>要求目的、范围、手段、程序均有规范依据，不能只重结果是否有用。\u003c/strong>“涉及国家安全”**涵盖本法所保护的不同领域，但领域广泛不等于任何资料都可无条件获取。\u003c/p>\n\u003cp>专门机关的搜集具有主动性、计划性和专业性；第二款则以其他部门依法履职为前提。例如，卫生健康部门在履职中发现可能影响人民安全、社会安全的异常，经济管理部门掌握可能影响经济安全的重要情况，均应依规定及时上报。这些部门仍按自身职权获取和处理信息，并不因此普遍取得秘密侦察、强制调取等专门权限。\u003c/p>\n\u003cp>“及时上报”既不是等到损害已经发生再报告，也不是把未经判断的全部业务数据无差别上交。需要识别与国家安全有关的内容，按照相应渠道、时限和保密要求报送，并受第54条质量要求约束。本条没有统一规定全部信息必须向同一个具体机关报送，不能自行补出全国通用的单一收件机关或固定小时数。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现职权法定与协作义务并行：发现、掌握信息的职责，不当然包含实施任何调查手段的权力；协助义务也不能替代主办机关必须履行的批准程序。国家安全意识应进入普通履职过程，但不会自动改变机关性质。\u003c/p>\n\u003cp>从制度解释看，第51条处理信息如何归口协调，本条处理谁来搜集、何种情况下应报告。统一归口与分工搜集不是冲突关系，前者解决整体整合，后者维持专业能力和责任边界。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>截至本次整理，《反间谍法》应使用2023年修订文本，其第11条规定依法获取的个人、组织信息只能用于反间谍工作并负保密义务；第26条限制查阅、调取不得超出执行任务所需范围和限度。这些规定说明“依法搜集”具有实质的目的与范围约束。\u003ca href=\"https://www.12339.gov.cn/article/h5_law_con/3\">2023年反间谍法\u003c/a>\u003c/p>\n\u003cp>本条第二款的直接主体是国家机关各部门。公民和组织支持、协助国家安全工作的义务另有本法第77条及专门法律依据；不能把所有公民都解释为本款规定的专门情报搜集主体。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>两款分别规定专门搜集职责和履职上报职责，核心是使专门工作与各部门日常管理中的信息获取相衔接。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已经把统一的情报信息收集研判制度列为国家安全制度的重要内容；所核审议材料没有逐句交代本条改稿过程。（《释义》附录二，印刷第376—377页／PDF第389—390页。）\u003c/p>\n\u003cp>2017年《国家情报法》第5条进一步使用“国家情报工作机构”这一法定称谓，包括国家安全机关和公安机关情报机构、军队情报机构，并规定其他有关国家机关依各自职能和任务分工密切配合。阅读本条时应结合这一后续专门规范，把机关的广义职责与具体情报机构的职权区分开。\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_281475.html\">国家情报法第5条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>第一款的三个限定须同时满足。**“根据职责分工”\u003cstrong>说明不同机关各有任务边界，不能因信息“涉及国家安全”就抹平管辖分工。\u003c/strong>“依法搜集”\u003cstrong>要求目的、范围、手段、程序均有规范依据，不能只重结果是否有用。\u003c/strong>“涉及国家安全”**涵盖本法所保护的不同领域，但领域广泛不等于任何资料都可无条件获取。\u003c/p>\n\u003cp>专门机关的搜集具有主动性、计划性和专业性；第二款则以其他部门依法履职为前提。例如，卫生健康部门在履职中发现可能影响人民安全、社会安全的异常，经济管理部门掌握可能影响经济安全的重要情况，均应依规定及时上报。这些部门仍按自身职权获取和处理信息，并不因此普遍取得秘密侦察、强制调取等专门权限。\u003c/p>\n\u003cp>“及时上报”既不是等到损害已经发生再报告，也不是把未经判断的全部业务数据无差别上交。需要识别与国家安全有关的内容，按照相应渠道、时限和保密要求报送，并受第54条质量要求约束。本条没有统一规定全部信息必须向同一个具体机关报送，不能自行补出全国通用的单一收件机关或固定小时数。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条体现职权法定与协作义务并行：发现、掌握信息的职责，不当然包含实施任何调查手段的权力；协助义务也不能替代主办机关必须履行的批准程序。国家安全意识应进入普通履职过程，但不会自动改变机关性质。\u003c/p>\n\u003cp>从制度解释看，第51条处理信息如何归口协调，本条处理谁来搜集、何种情况下应报告。统一归口与分工搜集不是冲突关系，前者解决整体整合，后者维持专业能力和责任边界。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>截至本次整理，《反间谍法》应使用2023年修订文本，其第11条规定依法获取的个人、组织信息只能用于反间谍工作并负保密义务；第26条限制查阅、调取不得超出执行任务所需范围和限度。这些规定说明“依法搜集”具有实质的目的与范围约束。\u003ca href=\"https://www.12339.gov.cn/article/h5_law_con/3\">2023年反间谍法\u003c/a>\u003c/p>\n\u003cp>本条第二款的直接主体是国家机关各部门。公民和组织支持、协助国家安全工作的义务另有本法第77条及专门法律依据；不能把所有公民都解释为本款规定的专门情报搜集主体。\u003c/p>\n"},{"num":53,"label":"第五十三条","title":"科技运用与情报分析","lawText":"开展情报信息工作，应当充分运用现代科学技术手段，加强对情报信息的鉴别、筛选、综合和研判分析。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第五十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>开展情报信息工作，应当充分运用现代科学技术手段，加强对情报信息的鉴别、筛选、综合和研判分析。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第五十三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>开展情报信息工作，应当充分运用现代科学技术手段，加强对情报信息的鉴别、筛选、综合和研判分析。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">科技运用与情报分析 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条同时强调技术能力和分析能力。获取更多数据只是起点，关键还在于把零散材料转化为能够支持安全判断的可靠信息。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条处于2015年国家安全法确立的情报制度框架内。已核立法材料提供了情报制度的整体背景，未提供本条各词句增删的直接记录，不能将释义书关于技术发展的介绍当成某次审议修改的事实。\u003c/p>\n\u003cp>后续《国家情报法》第22条第2款专门要求国家情报工作机构运用科学技术，提高情报信息的鉴别、筛选、综合和研判分析水平，使本条的一般要求落实到专门工作机构。其第15条另行规定技术侦察措施的批准条件，说明促进技术运用与授予具体侦察权限是两个不同层次。\u003ca href=\"https://qhca.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_a97c92189dea4940bf0ec7739d89026c.html\">国家情报法第15、22条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>技术运用贯穿信息获取和信息处理。依法使用的数据检索、信息比对、统计分析等工具可以扩大处理能力、缩短分析时间，但不同技术侵及权利的程度不同，应分别判断其法律依据。公开信息检索、一般分析软件与技术侦察措施，不能仅因都依赖技术便适用相同权限规则。\u003c/p>\n\u003cp>四项分析活动可以依次理解。\u003cstrong>鉴别\u003c/strong>审查来源及内容是否真实可信；\u003cstrong>筛选\u003c/strong>围绕任务选出相关、重要的材料，而不是排除不符合预设结论的材料；\u003cstrong>综合\u003c/strong>把不同来源、时间和角度的信息相互关联、补充印证；\u003cstrong>研判分析\u003c/strong>在此基础上判断性质、趋势、风险及其可能影响。各环节可以往返进行，并非只能一次完成的机械流水线。\u003c/p>\n\u003cp>信息数量多、来源重复出现，不必然意味着结论可靠。同一初始消息被多个渠道转发，仍可能只有一个未经核实的来源；算法发现相关性，也不当然证明因果关系、行为人的意图或者违法事实。因此，需要保留来源、时间、核实状态以及支撑推断的理由。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条的法理重点是技术辅助与责任判断相结合。技术可以帮助发现模式，却不能替代机关对事实和权限作出可负责的判断。以人工智能辅助处理为例，输出中的推测、误识别及资料时效问题仍须复核；不能因结论由系统生成，就免除工作人员依法核查、客观报送的责任。这是由第53条与第54条结合得出的解释。\u003c/p>\n\u003cp>情报判断还应与法律上的证明结论区分：预测性信息可以成为继续核查、开展风险评估的参考；据此采取限制权利的措施，则须满足该措施自身的法定条件。信息具有预警价值，并不自动证明某人已经违法犯罪。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>技术手段的合法性应具体查法。《国家情报法》第10条要求依法使用必要方式、手段和渠道，第15条要求技术侦察经过严格批准；现行《反间谍法》第37条亦规定反间谍技术侦察的工作需要和批准要求。本条中的“充分运用”不能单独作为绕过这些条件的授权。\u003ca href=\"https://qhca.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_a97c92189dea4940bf0ec7739d89026c.html\">国家情报法\u003c/a>、\u003ca href=\"https://www.12339.gov.cn/article/h5_law_con/3\">反间谍法\u003c/a>\u003c/p>\n\u003cp>可将分析记录概括为“原始信息—核实结果—分析推断—不确定事项—建议行动”，作为研读和实践观察的辅助框架；它不是本条规定的统一法定表格。书中警务信息化事例有助于理解技术价值，但普通刑事案件的侦破成效，不能直接证明本条授予了相应侦查权。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条同时强调技术能力和分析能力。获取更多数据只是起点，关键还在于把零散材料转化为能够支持安全判断的可靠信息。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条处于2015年国家安全法确立的情报制度框架内。已核立法材料提供了情报制度的整体背景，未提供本条各词句增删的直接记录，不能将释义书关于技术发展的介绍当成某次审议修改的事实。\u003c/p>\n\u003cp>后续《国家情报法》第22条第2款专门要求国家情报工作机构运用科学技术，提高情报信息的鉴别、筛选、综合和研判分析水平，使本条的一般要求落实到专门工作机构。其第15条另行规定技术侦察措施的批准条件，说明促进技术运用与授予具体侦察权限是两个不同层次。\u003ca href=\"https://qhca.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_a97c92189dea4940bf0ec7739d89026c.html\">国家情报法第15、22条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>技术运用贯穿信息获取和信息处理。依法使用的数据检索、信息比对、统计分析等工具可以扩大处理能力、缩短分析时间，但不同技术侵及权利的程度不同，应分别判断其法律依据。公开信息检索、一般分析软件与技术侦察措施，不能仅因都依赖技术便适用相同权限规则。\u003c/p>\n\u003cp>四项分析活动可以依次理解。\u003cstrong>鉴别\u003c/strong>审查来源及内容是否真实可信；\u003cstrong>筛选\u003c/strong>围绕任务选出相关、重要的材料，而不是排除不符合预设结论的材料；\u003cstrong>综合\u003c/strong>把不同来源、时间和角度的信息相互关联、补充印证；\u003cstrong>研判分析\u003c/strong>在此基础上判断性质、趋势、风险及其可能影响。各环节可以往返进行，并非只能一次完成的机械流水线。\u003c/p>\n\u003cp>信息数量多、来源重复出现，不必然意味着结论可靠。同一初始消息被多个渠道转发，仍可能只有一个未经核实的来源；算法发现相关性，也不当然证明因果关系、行为人的意图或者违法事实。因此，需要保留来源、时间、核实状态以及支撑推断的理由。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>本条的法理重点是技术辅助与责任判断相结合。技术可以帮助发现模式，却不能替代机关对事实和权限作出可负责的判断。以人工智能辅助处理为例，输出中的推测、误识别及资料时效问题仍须复核；不能因结论由系统生成，就免除工作人员依法核查、客观报送的责任。这是由第53条与第54条结合得出的解释。\u003c/p>\n\u003cp>情报判断还应与法律上的证明结论区分：预测性信息可以成为继续核查、开展风险评估的参考；据此采取限制权利的措施，则须满足该措施自身的法定条件。信息具有预警价值，并不自动证明某人已经违法犯罪。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>技术手段的合法性应具体查法。《国家情报法》第10条要求依法使用必要方式、手段和渠道，第15条要求技术侦察经过严格批准；现行《反间谍法》第37条亦规定反间谍技术侦察的工作需要和批准要求。本条中的“充分运用”不能单独作为绕过这些条件的授权。\u003ca href=\"https://qhca.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_a97c92189dea4940bf0ec7739d89026c.html\">国家情报法\u003c/a>、\u003ca href=\"https://www.12339.gov.cn/article/h5_law_con/3\">反间谍法\u003c/a>\u003c/p>\n\u003cp>可将分析记录概括为“原始信息—核实结果—分析推断—不确定事项—建议行动”，作为研读和实践观察的辅助框架；它不是本条规定的统一法定表格。书中警务信息化事例有助于理解技术价值，但普通刑事案件的侦破成效，不能直接证明本条授予了相应侦查权。\u003c/p>\n"},{"num":54,"label":"第五十四条","title":"情报报送的质量要求","lawText":"情报信息的报送应当及时、准确、客观，不得迟报、漏报、瞒报和谎报。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第五十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>情报信息的报送应当及时、准确、客观，不得迟报、漏报、瞒报和谎报。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第五十四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>情报信息的报送应当及时、准确、客观，不得迟报、漏报、瞒报和谎报。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">情报报送的质量要求 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条以三个正面要求和四类禁止行为约束报送环节，既适用于专门情报工作，也适用于有关部门依第52条上报所获信息。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条将情报工作中对报送时效和真实性的要求确立为一般法律义务，与当时突发事件应对等法律中的信息报告制度相衔接。已核立法材料未交代本条逐句改稿过程，不宜将制度长期存在与条文本身何时定稿混为一谈。\u003c/p>\n\u003cp>原有释义引用的是2007年《突发事件应对法》第39条。该法2024年修订后，相关报送规则见第61条，除及时、客观、真实和禁止四类不当报告行为外，还明确禁止授意他人迟报、谎报、瞒报以及阻碍他人报告。关联条号应随修法更新。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">突发事件应对法（2024年修订）第61条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>及时\u003c/strong>要求信息在仍有决策、预防和处置价值时送达，并遵守相应报告时限；本条本身没有给出适用于全部情报的统一小时数。第58条针对可能即将发生或已经发生的危害国家安全事件，进一步明确“立即”报告和必要时越级上报，属于更具体的情境规则。\u003c/p>\n\u003cp>\u003cstrong>准确\u003c/strong>强调内容符合已经掌握和核实的事实，必要要素不缺漏，数据、时间和来源不张冠李戴。\u003cstrong>客观\u003c/strong>强调如实反映事实及不确定性，不为迎合预期、减轻责任或追求工作成绩而改变内容。客观不等于禁止分析判断；应把事实、推断及置信程度区分呈现，使接收者知道何者已证实、何者仍待查明。\u003c/p>\n\u003cp>四类禁止行为可分别把握：迟报是应及时报告而未及时报告；漏报是应报内容未按规定报全；瞒报是故意隐瞒已掌握的有关信息；谎报是故意编造或者报送不真实的信息。它们可能同时损害时效、准确和客观，不能机械地与三个正面要求作一一对应。\u003c/p>\n\u003cp>审查是否违反义务，应结合职责、获取时间、应报范围、报告渠道、核实能力、主观过错及具体制度判断。后来事实与当时预测不一致，不当然等于谎报；反之，以“尚待核实”为由长期压住具有紧迫性的已知线索，也不能当然免除报告义务。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>信息报告面对时间与确定性之间的张力：等待所有细节查清可能错过处置窗口，草率把线索写成确定事实又可能误导决策。结合第53条研判要求，可采用依具体制度先报已知事实并标注待核事项、随后补充核实结果的方式，兼顾及时与准确；这不意味着允许先编造结论再更正。\u003c/p>\n\u003cp>本条还体现报告链条中的忠实义务。下级掌握的信息可能影响上级对风险的整体判断，故选择性遗漏和包装数据也可能破坏制度功能。减少无关信息、压缩报告篇幅是提高效率；隐去与风险判断有关的重要事实，则是另一性质的问题。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>责任须回到具体依据。本条未单独设定处罚种类和幅度；发生迟报等行为，应依适用的组织管理、处分、行政或刑事规范判断，不能仅凭本条直接判处刑罚，也不能不考察相关要件就一概认定渎职犯罪。\u003c/p>\n\u003cp>本条的“报送”主要处理工作系统内的信息传递，不等同于向社会发布。是否、何时、由谁公开信息，还须依信息发布、保密及相应领域法律处理。把内部及时报告误解为立即公开全部情报，或因信息涉密而不向有权接收机关报告，均不符合两种制度的各自功能。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条以三个正面要求和四类禁止行为约束报送环节，既适用于专门情报工作，也适用于有关部门依第52条上报所获信息。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>本条将情报工作中对报送时效和真实性的要求确立为一般法律义务，与当时突发事件应对等法律中的信息报告制度相衔接。已核立法材料未交代本条逐句改稿过程，不宜将制度长期存在与条文本身何时定稿混为一谈。\u003c/p>\n\u003cp>原有释义引用的是2007年《突发事件应对法》第39条。该法2024年修订后，相关报送规则见第61条，除及时、客观、真实和禁止四类不当报告行为外，还明确禁止授意他人迟报、谎报、瞒报以及阻碍他人报告。关联条号应随修法更新。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">突发事件应对法（2024年修订）第61条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>及时\u003c/strong>要求信息在仍有决策、预防和处置价值时送达，并遵守相应报告时限；本条本身没有给出适用于全部情报的统一小时数。第58条针对可能即将发生或已经发生的危害国家安全事件，进一步明确“立即”报告和必要时越级上报，属于更具体的情境规则。\u003c/p>\n\u003cp>\u003cstrong>准确\u003c/strong>强调内容符合已经掌握和核实的事实，必要要素不缺漏，数据、时间和来源不张冠李戴。\u003cstrong>客观\u003c/strong>强调如实反映事实及不确定性，不为迎合预期、减轻责任或追求工作成绩而改变内容。客观不等于禁止分析判断；应把事实、推断及置信程度区分呈现，使接收者知道何者已证实、何者仍待查明。\u003c/p>\n\u003cp>四类禁止行为可分别把握：迟报是应及时报告而未及时报告；漏报是应报内容未按规定报全；瞒报是故意隐瞒已掌握的有关信息；谎报是故意编造或者报送不真实的信息。它们可能同时损害时效、准确和客观，不能机械地与三个正面要求作一一对应。\u003c/p>\n\u003cp>审查是否违反义务，应结合职责、获取时间、应报范围、报告渠道、核实能力、主观过错及具体制度判断。后来事实与当时预测不一致，不当然等于谎报；反之，以“尚待核实”为由长期压住具有紧迫性的已知线索，也不能当然免除报告义务。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>信息报告面对时间与确定性之间的张力：等待所有细节查清可能错过处置窗口，草率把线索写成确定事实又可能误导决策。结合第53条研判要求，可采用依具体制度先报已知事实并标注待核事项、随后补充核实结果的方式，兼顾及时与准确；这不意味着允许先编造结论再更正。\u003c/p>\n\u003cp>本条还体现报告链条中的忠实义务。下级掌握的信息可能影响上级对风险的整体判断，故选择性遗漏和包装数据也可能破坏制度功能。减少无关信息、压缩报告篇幅是提高效率；隐去与风险判断有关的重要事实，则是另一性质的问题。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>责任须回到具体依据。本条未单独设定处罚种类和幅度；发生迟报等行为，应依适用的组织管理、处分、行政或刑事规范判断，不能仅凭本条直接判处刑罚，也不能不考察相关要件就一概认定渎职犯罪。\u003c/p>\n\u003cp>本条的“报送”主要处理工作系统内的信息传递，不等同于向社会发布。是否、何时、由谁公开信息，还须依信息发布、保密及相应领域法律处理。把内部及时报告误解为立即公开全部情报，或因信息涉密而不向有权接收机关报告，均不符合两种制度的各自功能。\u003c/p>\n"},{"num":55,"label":"第五十五条","title":"各领域国家安全风险预案","lawText":"国家制定完善应对各领域国家安全风险预案。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第五十五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家制定完善应对各领域国家安全风险预案。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第五十五条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家制定完善应对各领域国家安全风险预案。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">各领域国家安全风险预案 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定事先准备应对方案的制度。“制定”解决有没有预案，“完善”要求预案随风险、职责和能力变化而调整；它不是把文件编制完成即视为履行完毕的一次性任务。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已经将制定风险预案列入风险预防、评估和预警的制度安排。2015年定稿将其规定为面向各领域国家安全风险的预案要求，并与既有突发事件及专业领域的预防、应急制度衔接。见《中华人民共和国国家安全法释义》附录，印刷第376—377页／PDF第389—390页。\u003c/p>\n\u003cp>关联规范已经更新：2024年修订的突发事件应对法自同年11月1日起施行，在第26—28条规定预案体系、衔接、内容和修订；2025年2月25日公布的《国家突发事件总体应急预案》进一步规定预案编制、衔接、演练、评估与修订。这些是后续制度发展，不能反写成2015年条文形成时已经存在的规定。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">突发事件应对法\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">2025年总体应急预案\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>预案应对应具体风险。\u003c/strong> 要根据本领域可能遭受的威胁、薄弱环节和风险传导路径，设想需要应对的情形，明确防范与处置办法。国家安全风险预案不能简单复制自然灾害预案，也不能将所有日常安全问题未经判断都认定为国家安全危机。\u003c/p>\n\u003cp>\u003cstrong>预案应能转化为行动。\u003c/strong> 基本问题包括：何种情形触发响应，谁研判、谁决定，哪些部门实施，信息如何报告和共享，人员及物资如何保障，何时调整或终止措施。上级预案说明总体分工，具体地区和单位还须结合自身风险、资源和场景细化，避免各层级内容完全相同。\u003c/p>\n\u003cp>\u003cstrong>预案应衔接其他制度。\u003c/strong> 第56条评估提供风险依据，第57条监测预警提供启动和调整的信息，第58条报告使上级及时掌握情况。预案把这些环节与处置行动连接起来，并应与相邻地区、相关部门和上下级预案相互协调。\u003c/p>\n\u003cp>\u003cstrong>完善应依靠演练和复盘。\u003c/strong> 应检验信息能否送达、职责能否交接、救援或保障力量能否到位。实际处置和演练暴露的问题，要转化为职责、流程、装备或资源配置的改进，不能只修改文字。2025年总体预案第5部分明确了这种持续管理要求。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>预案把可能发生的风险提前转化为组织分工和行动安排，有助于减少情况紧急时临时协商的时间成本。其价值不在于准确预言每一个事件，而在于使不确定情形下仍有可靠的报告、判断、协同和调整机制。\u003c/p>\n\u003cp>预案同时受法律约束。对人员、财产采取强制或限制措施，需要相应法律依据，不能仅因写入预案就取得权限。措施还应与危险的性质、程度和范围相适应，并根据变化调整；这与现行突发事件应对法第10条的要求一致。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">该法第10条\u003c/a>。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>河南郑州“7·20”特大暴雨灾害调查指出，预警与应急响应联动机制不健全，并提出全面开展应急预案评估修订、强化预警和响应一体化管理。这一事例说明：有预案、有预警，并不等于已经及时采取了行动。\u003ca href=\"https://www.mem.gov.cn/xw/bndt/202201/t20220121_407106.shtml\">应急管理部公布的调查情况\u003c/a>。\u003c/p>\n\u003cp>该事件可用于理解预案落实的重要性，具体责任仍以当时适用的法律和调查认定为依据。读本条时可把握“风险有依据、职责能落实、触发有标准、行动有资源、事后能改进”五个检查点。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定事先准备应对方案的制度。“制定”解决有没有预案，“完善”要求预案随风险、职责和能力变化而调整；它不是把文件编制完成即视为履行完毕的一次性任务。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已经将制定风险预案列入风险预防、评估和预警的制度安排。2015年定稿将其规定为面向各领域国家安全风险的预案要求，并与既有突发事件及专业领域的预防、应急制度衔接。见《中华人民共和国国家安全法释义》附录，印刷第376—377页／PDF第389—390页。\u003c/p>\n\u003cp>关联规范已经更新：2024年修订的突发事件应对法自同年11月1日起施行，在第26—28条规定预案体系、衔接、内容和修订；2025年2月25日公布的《国家突发事件总体应急预案》进一步规定预案编制、衔接、演练、评估与修订。这些是后续制度发展，不能反写成2015年条文形成时已经存在的规定。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">突发事件应对法\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">2025年总体应急预案\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>预案应对应具体风险。\u003c/strong> 要根据本领域可能遭受的威胁、薄弱环节和风险传导路径，设想需要应对的情形，明确防范与处置办法。国家安全风险预案不能简单复制自然灾害预案，也不能将所有日常安全问题未经判断都认定为国家安全危机。\u003c/p>\n\u003cp>\u003cstrong>预案应能转化为行动。\u003c/strong> 基本问题包括：何种情形触发响应，谁研判、谁决定，哪些部门实施，信息如何报告和共享，人员及物资如何保障，何时调整或终止措施。上级预案说明总体分工，具体地区和单位还须结合自身风险、资源和场景细化，避免各层级内容完全相同。\u003c/p>\n\u003cp>\u003cstrong>预案应衔接其他制度。\u003c/strong> 第56条评估提供风险依据，第57条监测预警提供启动和调整的信息，第58条报告使上级及时掌握情况。预案把这些环节与处置行动连接起来，并应与相邻地区、相关部门和上下级预案相互协调。\u003c/p>\n\u003cp>\u003cstrong>完善应依靠演练和复盘。\u003c/strong> 应检验信息能否送达、职责能否交接、救援或保障力量能否到位。实际处置和演练暴露的问题，要转化为职责、流程、装备或资源配置的改进，不能只修改文字。2025年总体预案第5部分明确了这种持续管理要求。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>预案把可能发生的风险提前转化为组织分工和行动安排，有助于减少情况紧急时临时协商的时间成本。其价值不在于准确预言每一个事件，而在于使不确定情形下仍有可靠的报告、判断、协同和调整机制。\u003c/p>\n\u003cp>预案同时受法律约束。对人员、财产采取强制或限制措施，需要相应法律依据，不能仅因写入预案就取得权限。措施还应与危险的性质、程度和范围相适应，并根据变化调整；这与现行突发事件应对法第10条的要求一致。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">该法第10条\u003c/a>。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>河南郑州“7·20”特大暴雨灾害调查指出，预警与应急响应联动机制不健全，并提出全面开展应急预案评估修订、强化预警和响应一体化管理。这一事例说明：有预案、有预警，并不等于已经及时采取了行动。\u003ca href=\"https://www.mem.gov.cn/xw/bndt/202201/t20220121_407106.shtml\">应急管理部公布的调查情况\u003c/a>。\u003c/p>\n\u003cp>该事件可用于理解预案落实的重要性，具体责任仍以当时适用的法律和调查认定为依据。读本条时可把握“风险有依据、职责能落实、触发有标准、行动有资源、事后能改进”五个检查点。\u003c/p>\n"},{"num":56,"label":"第五十六条","title":"国家安全风险调查评估及报告","lawText":"国家建立国家安全风险评估机制，定期开展各领域国家安全风险调查评估。\n\n有关部门应当定期向中央国家安全领导机构提交国家安全风险评估报告。","calloutHtml":"","frontHtml":"\u003cdiv class=\"article-side article-front\">\u003cdiv class=\"article-label\">第五十六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立国家安全风险评估机制，定期开展各领域国家安全风险调查评估。\u003c/p>\n\u003cp>有关部门应当定期向中央国家安全领导机构提交国家安全风险评估报告。\u003c/p>\n\u003c/div>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第五十六条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家建立国家安全风险评估机制，定期开展各领域国家安全风险调查评估。\u003c/p>\n\u003cp>有关部门应当定期向中央国家安全领导机构提交国家安全风险评估报告。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全风险调查评估及报告 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条包括两个相连的制度：对风险进行调查评估，以及将评估结果报送中央国家安全领导机构。评估形成判断，报告使判断进入综合研判和决策过程。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已列入定期开展国家安全风险调查评估的制度安排。2015年定稿将调查评估和向中央国家安全领导机构提交报告共同规定于本条，与第6条全面评估国内外安全形势、制定完善战略的要求相衔接。见《中华人民共和国国家安全法释义》附录，印刷第376—377页／PDF第389—390页。\u003c/p>\n\u003cp>作为后续关联制度，2024年修订的突发事件应对法第32条明确建立突发事件风险评估体系，第33条规定危险源、危险区域调查、登记和评估。2025年总体应急预案第3.1部分又规定风险调查评估和定期公共安全形势分析。上述规定有各自适用范围，不等于已经穷尽本条的各领域国家安全风险评估。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">突发事件应对法第32—33条\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">总体应急预案第3.1部分\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>调查是评估的事实基础。\u003c/strong> 需要收集、核对本领域面临的威胁、关键环节的薄弱点、受影响对象和应对能力等信息。只汇总已经发生的事故数量，无法完整反映尚未显现、正在累积或者可能跨领域扩散的风险。\u003c/p>\n\u003cp>\u003cstrong>评估是对风险的系统判断。\u003c/strong> 可分析风险发生的可能性、潜在危害、发展速度、影响范围、次生后果及现有防范能力，提出需要优先处理的问题。方法应适合领域特点，结合专业调查、专家论证和必要的数据分析，避免仅凭单一指标给出确定结论。\u003c/p>\n\u003cp>\u003cstrong>定期开展不等于统一频次。\u003c/strong> 本条没有规定所有领域一律每年、每季度或每月评估一次，也没有规定统一报表和评分方法。具体安排须结合职责、有关制度和统一部署；风险出现重大变化时，常规评估周期不能成为延后研判或迟报紧急情况的理由。\u003c/p>\n\u003cp>\u003cstrong>评估报告应服务于统筹决策。\u003c/strong> 报告对象是中央国家安全领导机构，报送主体是有关部门。报告应使决策者了解风险依据、关键判断、已有措施和需要协调的事项，而不只是笼统表示“总体可控”。有关部门还应说明资料缺口、判断条件及需要进一步核实的内容。\u003c/p>\n\u003cp>\u003cstrong>报告应与其他信息制度区分。\u003c/strong> 本条是定期提交风险评估报告，第58条是就可能即将发生或者已经发生的事件立即报告，第57条则涉及风险预警。三者在时间、内容和接收对象上各有侧重，不能相互替代。\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>风险评估面对的是不确定性，并不要求事先证明损害必然发生。科学评估的价值，在于区分已知事实、合理推断与尚待核实的信息，使决策能够比较不同情形和应对方案。承认不确定性并说明依据，比把预测包装成确定事实更有利于形成可靠决策。\u003c/p>\n\u003cp>评估也不等于批准或者处罚。识别出某项活动存在风险，可以支持采取进一步调查、防范或审查措施，但措施由谁实施、适用何种程序，仍须依据有关法律；不能直接把风险判断等同于违法犯罪认定。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>一份可供研读的评估报告，可按“评估对象和期间—资料及方法—主要风险—现有能力—优先建议—不确定性”理解。这是分析报告质量的参考框架，不是本条规定的统一法定格式。\u003c/p>\n\u003cp>向中央国家安全领导机构报送的评估报告，与面向公众发布的风险提示属于不同信息产品。涉及公众的防范信息可以依法通过适当渠道发布，但不能据本条推定全部内部评估报告都应公开，也不能以报告内部报送为由免除其他法律规定的公开预警义务。\u003c/p>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条包括两个相连的制度：对风险进行调查评估，以及将评估结果报送中央国家安全领导机构。评估形成判断，报告使判断进入综合研判和决策过程。\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2014年12月22日草案说明已列入定期开展国家安全风险调查评估的制度安排。2015年定稿将调查评估和向中央国家安全领导机构提交报告共同规定于本条，与第6条全面评估国内外安全形势、制定完善战略的要求相衔接。见《中华人民共和国国家安全法释义》附录，印刷第376—377页／PDF第389—390页。\u003c/p>\n\u003cp>作为后续关联制度，2024年修订的突发事件应对法第32条明确建立突发事件风险评估体系，第33条规定危险源、危险区域调查、登记和评估。2025年总体应急预案第3.1部分又规定风险调查评估和定期公共安全形势分析。上述规定有各自适用范围，不等于已经穷尽本条的各领域国家安全风险评估。\u003ca href=\"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202609/t20260904_4850732.html\">突发事件应对法第32—33条\u003c/a>、\u003ca href=\"https://app.www.gov.cn/govdata/gov/202502/25/524896/article.html\">总体应急预案第3.1部分\u003c/a>。\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>调查是评估的事实基础。\u003c/strong> 需要收集、核对本领域面临的威胁、关键环节的薄弱点、受影响对象和应对能力等信息。只汇总已经发生的事故数量，无法完整反映尚未显现、正在累积或者可能跨领域扩散的风险。\u003c/p>\n\u003cp>\u003cstrong>评估是对风险的系统判断。\u003c/strong> 可分析风险发生的可能性、潜在危害、发展速度、影响范围、次生后果及现有防范能力，提出需要优先处理的问题。方法应适合领域特点，结合专业调查、专家论证和必要的数据分析，避免仅凭单一指标给出确定结论。\u003c/p>\n\u003cp>\u003cstrong>定期开展不等于统一频次。\u003c/strong> 本条没有规定所有领域一律每年、每季度或每月评估一次，也没有规定统一报表和评分方法。具体安排须结合职责、有关制度和统一部署；风险出现重大变化时，常规评估周期不能成为延后研判或迟报紧急情况的理由。\u003c/p>\n\u003cp>\u003cstrong>评估报告应服务于统筹决策。\u003c/strong> 报告对象是中央国家安全领导机构，报送主体是有关部门。报告应使决策者了解风险依据、关键判断、已有措施和需要协调的事项，而不只是笼统表示“总体可控”。有关部门还应说明资料缺口、判断条件及需要进一步核实的内容。\u003c/p>\n\u003cp>\u003cstrong>报告应与其他信息制度区分。\u003c/strong> 本条是定期提交风险评估报告，第58条是就可能即将发生或者已经发生的事件立即报告，第57条则涉及风险预警。三者在时间、内容和接收对象上各有侧重，不能相互替代。\u003c/p>\n\u003ch3>四、比较法/法理\u00
