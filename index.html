const sources={national:'https://www.stats.gov.cn/gk/tjfg/xgfxfg/202503/t20250310_1958929.html',espionage:'https://www.spp.gov.cn/spp/zdgz/202304/t20230426_612647.shtml',outlook:'https://www.osns.gov.cn/gjaq/rsztgjaqg.htm'};
const laws={
intro:{title:'国家安全法学概说',label:'学科入门',desc:'从法学角度出发，理解国家安全法治的整体结构。',overview:[['研究什么','国家安全法学关注维护国家安全过程中形成的法律关系。学习时，可以围绕保护利益、国家机关职责、公民与组织的义务和权利、风险预防制度及法律责任展开。'],['如何阅读法律体系','以宪法为根本依据，以《国家安全法》把握总体框架，再进入反间谍等专门领域。理解一般规定与特别规定的关系，是阅读相关法律的起点。'],['如何分析具体问题','先识别涉及的国家安全利益，再确定适用规范和实施主体，进而审查措施的条件、程序及限度，最后分析救济和责任。此处为学习方法归纳。']],map:[['规范基础','宪法依据 → 国家安全法 → 相关专门法律'],['基本问题','保护何种利益 · 谁承担职责 · 如何履行义务'],['制度运行','风险预防 · 调查处置 · 监督与救济'],['法治要求','依法履职 · 保障权利 · 遵守措施限度']],cards:[['国家安全法学可以围绕哪些问题展开？','保护利益、机关职责、公民与组织的义务和权利、风险预防制度及法律责任。','学习框架归纳'],['《国家安全法》与反间谍法如何衔接？','前者提供国家安全的一般制度框架，后者具体规范反间谍工作。分析问题时应结合一般规定与专门规定。','学习框架归纳'],['维护国家安全与保障权利如何联系？','维护国家安全应遵守宪法和法律，尊重和保障人权，依法保护公民权利和自由。','国家安全法第7条'],['分析国家安全措施时应注意哪些环节？','法律依据、实施主体、适用条件、实施程序、措施限度与救济途径。','学习方法归纳']],ref:'national',reading:'参考阅读：《国家安全法释义》《国家安全法释义与适用》。'},
national:{title:'国家安全法',label:'专门法律 · 2015年',desc:'围绕基本原则、维护任务、制度安排与义务权利建立知识体系。',overview:[['法律定位','《中华人民共和国国家安全法》于2015年7月1日通过并施行，共七章、八十四条。它对国家安全的基本原则、维护任务、职责、制度和保障作出系统规定。'],['国家安全的含义','第2条从安全状态与保障能力两个方面界定国家安全。学习时应同时关注国家重大利益所处的状态，以及保障这种状态持续存在的能力。'],['从义务进入权利保障','第77—79条规定公民、组织的义务以及单位的教育、配合责任；第80—82条涉及支持协助行为的保护、补偿抚恤和监督权利。第83条要求限制权利和自由的特别措施依法实施，并以实际需要为限。']],map:[['总则｜第1—14条','概念 · 总体国家安全观 · 依法维护国家安全'],['任务与职责｜第15—45条','各领域维护任务 · 国家机关职责 · 地方责任'],['制度与保障｜第46—76条','情报信息 · 风险预防 · 审查监管 · 危机管控 · 保障'],['义务与权利｜第77—83条','报告与协助 · 保密 · 教育 · 保护补偿 · 监督 · 措施限度']],cards:[['国家安全的法定概念包含哪两个维度？','安全状态与保障持续安全状态的能力。','第2条'],['国家安全工作以什么为宗旨、根本和基础？','以人民安全为宗旨，以政治安全为根本，以经济安全为基础。','第3条'],['全民国家安全教育日是哪一天？','每年4月15日。','第14条'],['第77条列举的维护国家安全义务有哪些？','遵守相关规定；及时报告线索；如实提供证据；提供便利或协助；提供必要支持协助；保守国家秘密；履行其他法定义务。','第77条'],['一般单位对本单位人员承担什么教育责任？','进行维护国家安全的教育，并动员、组织本单位人员防范、制止危害国家安全的行为。','第78条'],['支持、协助国家安全工作导致财产损失，如何处理？','按照国家有关规定给予补偿；造成人身伤害或者死亡的，按照国家有关规定给予抚恤优待。','第81条'],['限制公民权利和自由的特别措施有什么界限？','应当依法进行，并以维护国家安全的实际需要为限度。','第83条']],ref:'national',reading:'延伸阅读：《国家安全法释义》《国家安全法释义与适用》。'},
espionage:{title:'反间谍法',label:'专门法律 · 2023年修订',desc:'理解安全防范、调查处置及依法履职的制度要求。',overview:[['法律定位','《中华人民共和国反间谍法》于2023年4月26日修订通过，自2023年7月1日起施行。全法分为总则、安全防范、调查处置、保障与监督、法律责任、附则六章。'],['安全防范的责任层次','第12条确立单位的反间谍安全防范主体责任。第17—20条进一步规定重点单位的组织、人员、物理和技术防范要求。阅读时应区分一般单位与重点单位。'],['调查处置与监督','国家安全机关是反间谍工作的主管机关。机关及其工作人员应依法办事，遵守职权和信息使用的限制。学习具体措施时，应逐项核对审批、证件、告知和范围限度等条件。']],map:[['总则｜第1—11条','基本原则 · 间谍行为 · 主管机关 · 信息使用限制'],['安全防范｜第12—22条','单位主体责任 · 举报 · 重点单位 · 防范措施'],['调查处置｜第23—45条','法定职权 · 批准程序 · 调查措施 · 处置'],['保障、监督与责任｜第46—71条','履职保障 · 监督制度 · 违法责任 · 附则']],cards:[['反间谍工作的主管机关是什么？','国家安全机关。公安、保密等有关部门和军队有关部门按照职责分工依法做好有关工作。','第6条'],['公民和组织应保守哪些与反间谍工作相关的秘密？','依法支持、协助反间谍工作，并保守所知悉的国家秘密和反间谍工作秘密。','第8条'],['单位承担什么反间谍安全防范责任？','承担本单位反间谍安全防范工作的主体责任，落实防范措施，开展教育并组织防范、制止间谍行为。','第12条'],['发现间谍行为应向哪个机关举报？','应及时向国家安全机关举报；向公安机关等其他国家机关、组织举报的，由其立即移送国家安全机关处理。','第16条'],['重点单位应如何明确防范职责？','建立反间谍安全防范工作制度，履行相关要求，明确内设职能部门和人员承担防范职责。','第17条'],['履职获取的信息能否任意用于其他用途？','只能用于反间谍工作；属于国家秘密、工作秘密、商业秘密和个人隐私、个人信息的，应当保密。','第11条'],['查阅、调取文件和数据等有哪些范围要求？','不得超出执行反间谍工作任务所需的范围和限度；还须遵守法定批准条件。','第26条']],ref:'espionage',reading:'参考阅读：王爱立主编《中华人民共和国反间谍法释义》（2023年）。'}
};
const nationalArticles=[{"num":1,"label":"第一条","title":"立法目的与宪法依据","lawText":"为了维护国家安全，保卫人民民主专政的政权和中国特色社会主义制度，保护人民的根本利益，保障改革开放和社会主义现代化建设的顺利进行，实现中华民族伟大复兴，根据宪法，制定本法。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>总目标：\u003c/strong> 维护国家安全，是整部《国家安全法》的总括性立法目的。\u003c/li>\n\u003cli>\u003cstrong>保护对象：\u003c/strong> 政权和中国特色社会主义制度、人民根本利益、改革开放和社会主义现代化建设以及国家长远发展目标，共同构成立法目的体系。\u003c/li>\n\u003cli>\u003cstrong>宪法依据：\u003c/strong> “根据宪法”既说明本法的立法依据，也意味着国家安全工作必须在宪法和法律框架内运行。\u003c/li>\n\u003cli>\u003cstrong>规范性质：\u003c/strong> 本条主要是立法目的条款，可以作为体系解释和目的解释的依据，但不能单独作为采取强制、处罚等具体国家安全措施的授权依据。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>为了维护国家安全，保卫人民民主专政的政权和中国特色社会主义制度，保护人民的根本利益，保障改革开放和社会主义现代化建设的顺利进行，实现中华民族伟大复兴，根据宪法，制定本法。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>总目标：\u003c/strong> 维护国家安全，是整部《国家安全法》的总括性立法目的。\u003c/li>\n\u003cli>\u003cstrong>保护对象：\u003c/strong> 政权和中国特色社会主义制度、人民根本利益、改革开放和社会主义现代化建设以及国家长远发展目标，共同构成立法目的体系。\u003c/li>\n\u003cli>\u003cstrong>宪法依据：\u003c/strong> “根据宪法”既说明本法的立法依据，也意味着国家安全工作必须在宪法和法律框架内运行。\u003c/li>\n\u003cli>\u003cstrong>规范性质：\u003c/strong> 本条主要是立法目的条款，可以作为体系解释和目的解释的依据，但不能单独作为采取强制、处罚等具体国家安全措施的授权依据。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第一条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>为了维护国家安全，保卫人民民主专政的政权和中国特色社会主义制度，保护人民的根本利益，保障改革开放和社会主义现代化建设的顺利进行，实现中华民族伟大复兴，根据宪法，制定本法。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">立法目的与宪法依据 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定了《国家安全法》的\u003cstrong>立法目的和立法依据\u003c/strong>，是理解整部法律价值取向和制度功能的起点。条文在结构上可以概括为：\u003cstrong>总目标 → 具体保护目的 → 宪法依据。\u003c/strong>\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 1993年《国家安全法》：以反间谍等专门国家安全工作为核心\u003c/h4>\n\u003cp>1993年2月22日，第七届全国人大常委会第三十次会议通过《中华人民共和国国家安全法》。该法虽然名为“国家安全法”，但其规范内容主要围绕国家安全机关履行职责展开，尤其以防范、制止和惩治间谍等危害国家安全行为为重点，并规定国家安全机关的职权、公民和组织的义务以及相应法律责任。因此，1993年《国家安全法》与2015年《国家安全法》虽然名称相同，\u003cstrong>规范对象和体系定位并不相同\u003c/strong>。\u003c/p>\n\u003ch4>2. 2014年《反间谍法》：原国家安全法转为专门反间谍立法\u003c/h4>\n\u003cp>2014年国家安全立法发生重要调整。根据当时的立法说明，立法机关以1993年《国家安全法》为基础，将其修订为《反间谍法》。2014年11月1日，第十二届全国人大常委会第十一次会议通过《反间谍法》，并明确规定1993年《国家安全法》同时废止。因此，1993年《国家安全法》所承担的反间谍等专门职能转由《反间谍法》承接，在此基础上另行制定一部具有综合性和基础性定位的国家安全法。\u003c/p>\n\u003ch4>3. 2015年《国家安全法》：总体国家安全观下的综合立法\u003c/h4>\n\u003cp>总体国家安全观提出以后，国家安全的法律调整范围由传统政治、军事安全进一步扩展至经济、文化、社会、科技、网络、生态、资源等多个领域，需要一部综合性法律对国家安全工作的基本原则、领导体制、主要任务、制度机制和保障措施作出统一规定。\u003c/p>\n\u003cp>2015年7月1日，第十二届全国人大常委会第十五次会议通过现行《国家安全法》，国家主席签署主席令予以公布，并自公布之日起施行。\u003c/p>\n\u003ch4>4. 立法沿革的核心变化\u003c/h4>\n\u003cp>从制度发展来看，国家安全立法的重心经历了从\u003cstrong>以反间谍工作为核心的专门安全立法\u003c/strong>，向\u003cstrong>总体国家安全观下综合性、基础性国家安全立法\u003c/strong>的转变。意味着，“国家安全”不再主要作为某一国家机关或者某一类危害行为的调整对象，而是被置于国家治理整体框架中，由不同领域的国家安全任务、国家机关职责、国家安全制度以及公民和组织的权利义务共同构成。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>提示：\u003c/strong>\u003cbr>1993年《国家安全法》 → 2014年《反间谍法》\u003cbr>2015年《国家安全法》 → 重新建立综合性国家安全法律框架\u003cbr>因此，不宜将1993年法与2015年法理解为同一部法律的连续修订版本。\u003c/p>\n\u003c/blockquote>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>第一，维护国家安全是总目标。\u003c/strong> 这里的国家安全须结合第2条理解，既涉及国家政权、主权和领土完整，也包括人民福祉、可持续发展及其他重大利益。\n\u003cstrong>第二，保护对象具有多个层次。\u003c/strong> 政权和制度是国家政治秩序的基础；人民根本利益体现立法的人民立场；改革开放和社会主义现代化建设体现发展导向；中华民族伟大复兴体现长远目标。\n\u003cstrong>第三，“根据宪法”具有实质意义。\u003c/strong> 本法承接宪法有关国家性质、人民主权、维护国家安全和公民义务的规定，同时受宪法约束。\n\u003cstrong>第四，本法具有综合性、全局性和基础性。\u003c/strong> 本法的体系功能：统领多个领域，安排长期任务，为专门立法留下口子。\u003c/p>\n\u003ch4>第一，维护国家安全是本法的总目标\u003c/h4>\n\u003cp>第一条首先以“维护国家安全”概括整部法律的总目标。这里的“国家安全”不能仅按照传统的政治安全、军事安全理解，而应当结合第2条的法定定义加以把握。第2条将国家安全界定为国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展以及国家其他重大利益处于相对没有危险、不受内外威胁的状态，同时包括保障持续安全状态的能力。\n因此，第一条中的“维护国家安全”具有高度概括性，其具体内容需要通过第2条的概念规定以及第二章关于各领域国家安全任务的规定进一步展开。\u003c/p>\n\u003ch4>第二，立法目的形成了多层次的保护结构\u003c/h4>\n\u003cp>第一条在“维护国家安全”的总目标之下进一步列举四项具体目的，分别对应不同层次的国家安全利益：\n\u003cstrong>其一，保卫人民民主专政的政权和中国特色社会主义制度。\u003c/strong>\u003cbr>这一目的体现国家安全的政治基础，与第3条所规定的“以政治安全为根本”以及第15条关于政治安全任务的规定形成体系联系。\u003c/p>\n\u003cp>\u003cstrong>其二，保护人民的根本利益。\u003c/strong>\u003cbr>人民利益不仅是国家安全的保护对象，也是国家安全工作的价值指向。第3条明确规定国家安全工作“以人民安全为宗旨”，第16条进一步要求国家维护和发展最广大人民的根本利益，保障公民生命财产安全和其他合法权益。\u003c/p>\n\u003cp>\u003cstrong>其三，保障改革开放和社会主义现代化建设顺利进行。\u003c/strong>\u003cbr>国家安全与国家发展并非彼此独立。第8条明确要求维护国家安全与经济社会发展相协调。因此，国家安全制度既具有风险防范功能，也承担保障国家正常发展秩序和发展条件的功能。\u003c/p>\n\u003cp>\u003cstrong>其四，实现中华民族伟大复兴。\u003c/strong>\u003cbr>这一表述将国家安全置于国家长期发展目标中，表明国家安全既关注现实风险，也关注国家长远发展的安全条件。\u003c/p>\n\u003cp>由此，本条所形成的保护结构可以概括为：\u003cstrong>政治秩序 → 人民利益 → 发展条件 → 国家长远发展目标。\u003c/strong>\u003c/p>\n\u003ch4>第三，“根据宪法”不仅说明立法形式依据，也确立了国家安全法治的宪法边界\u003c/h4>\n\u003cp>第一条明确规定“根据宪法，制定本法”。这一规定首先表明《国家安全法》的制定具有宪法依据。\n宪法中与国家安全直接相关的规范包括：公民维护国家统一的义务、遵守宪法和法律并保守国家秘密的义务，以及维护祖国安全、荣誉和利益的义务；同时，宪法也规定和保障公民的基本权利和自由。\n因此，“根据宪法”同时具有两方面意义：一方面，宪法为国家履行维护国家安全职责以及公民承担相应国家安全义务提供规范基础；另一方面，国家安全权力本身也必须在宪法和法律框架内运行。国家安全并不构成脱离法定权限和程序采取措施的独立理由。\n这一点在第7条中得到进一步确认。第7条要求维护国家安全必须遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。\u003c/p>\n\u003ch4>第四，本法具有综合性和基础性的体系功能\u003c/h4>\n\u003cp>2015年《国家安全法》并不试图以一部法律穷尽所有国家安全事项，而是从总体层面规定国家安全工作的基本原则、主要任务、职责体系、制度机制、保障措施以及公民和组织的权利义务。\n因此，本法与《反间谍法》《反恐怖主义法》《网络安全法》《数据安全法》《生物安全法》等专门领域立法之间形成“\u003cstrong>综合性基本规范＋专门领域规范\u003c/strong>”的制度结构。\n从这一意义上说，第一条不仅是目的条款，也提示了本法的体系定位：\u003cstrong>通过综合性国家安全立法确立共同的价值目标和基本制度框架，再由不同领域的专门法律具体化。\u003c/strong>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003ch4>1. 目的解释：第一条是解释依据，但不是独立的权力授予规范\u003c/h4>\n\u003cp>第一条具有重要的目的解释功能。当其他条文存在不同可能解释时，可以结合第一条判断某项制度所保护的国家安全利益，以及有关规范应当实现的制度目标。\n但应当区分\u003cstrong>立法目的规范\u003c/strong>与\u003cstrong>具体授权规范\u003c/strong>。第一条说明“为什么维护国家安全”，并不直接回答国家机关“可以采取什么措施”“在什么条件下可以采取措施”以及“应当遵循什么程序”。因此，查封、扣押、搜查、限制人身自由、行政处罚或者其他限制权利的措施，均应当具有相应的具体法律依据，并符合权限、条件和程序要求。不能仅以第一条所规定的“维护国家安全”为由推导出具体公权力。\u003c/p>\n\u003ch4>2. 国家保护义务与国家安全权力的法治约束\u003c/h4>\n\u003cp>从法理上看，国家安全规范同时包含两个方向：一方面，国家负有维护国家安全、保护人民生命财产和其他重大利益的积极职责；另一方面，国家在履行安全保护职责时仍须遵守法治原则，并保护公民和组织的合法权益。\n这一结构在本法内部具有明确的体系依据。第一条规定“保护人民的根本利益”，第7条规定尊重和保障人权，第16条要求保障公民生命财产安全和其他合法权益，第66条进一步规定，国家安全危机管控措施应当与危害的性质、程度和范围相适应；存在多种措施时，应选择有利于最大程度保护公民、组织权益的措施。\n因此，维护国家安全与保护公民权利并非两个相互隔离的规范目标。\u003cstrong>国家安全措施的合法性判断，本身就应当包含对权限依据、必要程度和权益保护的审查。\u003c/strong>\u003c/p>\n\u003ch4>3. 比例原则在国家安全领域具有特殊意义\u003c/h4>\n\u003cp>第66条体现了较为明确的比例控制思路：国家安全危机处置措施首先应当与风险的性质、程度和范围相适应；当存在多种可以实现目的的手段时，还应当优先选择对公民和组织权益保护程度更高的措施。\n据此，可以将国家安全措施的审查思路概括为：\u003cstrong>目的正当 → 具有法定依据 → 手段与风险程度相适应 → 多种有效手段中选择权益损害较小者。\u003c/strong>\n第一条所规定的国家安全目的因此不能单独完成合法性论证。即使某项措施确实有助于维护国家安全，也仍然需要进一步判断其权限依据、适用条件、程序要求以及对权利限制的程度。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003ch4>（一）核心关联条文\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>第2条：国家安全的概念。\u003c/strong> 回答“什么是国家安全”。\u003c/li>\n\u003cli>\u003cstrong>第3条：总体国家安全观。\u003c/strong> 回答国家安全工作的基本指导思想和总体结构。\u003c/li>\n\u003cli>\u003cstrong>第7条：法治与人权保障。\u003c/strong> 确立国家安全措施的基本法治边界。\u003c/li>\n\u003cli>\u003cstrong>第8条：安全与发展的协调。\u003c/strong> 说明维护国家安全同时需要考虑经济社会发展。\u003c/li>\n\u003cli>\u003cstrong>第15条：政治安全。\u003c/strong> 具体展开第一条关于政权和制度安全的要求。\u003c/li>\n\u003cli>\u003cstrong>第16条：人民安全。\u003c/strong> 具体展开第一条关于保护人民根本利益的要求。\u003c/li>\n\u003cli>\u003cstrong>第66条：危机管控中的比例控制。\u003c/strong> 对限制公民、组织权益的国家安全危机措施提出适度性和权益保护要求。\u003c/li>\n\u003c/ul>\n\u003ch4>（二）案例使用\u003c/h4>\n\u003cp>第一条属于\u003cstrong>立法目的条款\u003c/strong>，本身通常不是具体案件中认定违法、定罪或者处罚的直接规范依据。\n学习本条时，可以结合危害国家安全犯罪、反间谍执法、国家安全审查或者国家安全危机管控等公开案例，观察第一条所列举的国家安全利益如何在具体制度中展开。\n但在分析具体案件时，应继续分析：**具体行为规范 → 权限依据 → 构成要件 → 程序规范 → 法律责任。**不能仅依赖“维护国家安全”这一抽象目的进行法律评价。\u003c/p>\n\u003ch4>（三）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：\u003c/strong> 2015年《国家安全法》是1993年《国家安全法》的修订版。\u003cbr>\u003cstrong>纠正：\u003c/strong> 1993年《国家安全法》在2014年制定《反间谍法》时已经废止；2015年另行制定现行《国家安全法》。\u003c/p>\n\u003cp>\u003cstrong>易错点2：\u003c/strong> 第一条可以直接作为国家机关采取国家安全措施的授权依据。\u003cbr>\u003cstrong>纠正：\u003c/strong> 第一条主要规定立法目的和立法依据。具体限制权利或者实施强制措施仍须具有具体法律授权。\u003c/p>\n\u003cp>\u003cstrong>易错点3：\u003c/strong> 国家安全与公民权利属于简单的对立关系。\u003cbr>\u003cstrong>纠正：\u003c/strong> 本法同时规定维护国家安全、保护人民利益、尊重保障人权以及危机处置中的权益保护要求，应当进行体系解释。\u003c/p>\n\u003ch3>六、深度研究\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>目的条款的规范效力边界。\u003c/strong> 第一条能够在多大程度上参与具体国家安全规范的解释？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>多重立法目的之间的协调。\u003c/strong> 当某项国家安全措施能够促进特定安全利益，却同时对经济社会发展或者个人权利产生限制时，应如何协调第一条中的安全、人民利益和发展目标？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>安全目的与比例原则的关系。\u003c/strong> 第66条关于危机管控措施的规定能否反映国家安全法领域的一般比例控制要求？其适用范围是否能够通过体系解释扩展至危机管控以外的国家安全措施？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>综合性国家安全法与专门立法的关系。\u003c/strong> 当《国家安全法》与《反间谍法》《数据安全法》《生物安全法》等专门法律同时涉及某一事项时，应如何处理一般规范与专门规范之间的解释和适用关系？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定了《国家安全法》的\u003cstrong>立法目的和立法依据\u003c/strong>，是理解整部法律价值取向和制度功能的起点。条文在结构上可以概括为：\u003cstrong>总目标 → 具体保护目的 → 宪法依据。\u003c/strong>\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 1993年《国家安全法》：以反间谍等专门国家安全工作为核心\u003c/h4>\n\u003cp>1993年2月22日，第七届全国人大常委会第三十次会议通过《中华人民共和国国家安全法》。该法虽然名为“国家安全法”，但其规范内容主要围绕国家安全机关履行职责展开，尤其以防范、制止和惩治间谍等危害国家安全行为为重点，并规定国家安全机关的职权、公民和组织的义务以及相应法律责任。因此，1993年《国家安全法》与2015年《国家安全法》虽然名称相同，\u003cstrong>规范对象和体系定位并不相同\u003c/strong>。\u003c/p>\n\u003ch4>2. 2014年《反间谍法》：原国家安全法转为专门反间谍立法\u003c/h4>\n\u003cp>2014年国家安全立法发生重要调整。根据当时的立法说明，立法机关以1993年《国家安全法》为基础，将其修订为《反间谍法》。2014年11月1日，第十二届全国人大常委会第十一次会议通过《反间谍法》，并明确规定1993年《国家安全法》同时废止。因此，1993年《国家安全法》所承担的反间谍等专门职能转由《反间谍法》承接，在此基础上另行制定一部具有综合性和基础性定位的国家安全法。\u003c/p>\n\u003ch4>3. 2015年《国家安全法》：总体国家安全观下的综合立法\u003c/h4>\n\u003cp>总体国家安全观提出以后，国家安全的法律调整范围由传统政治、军事安全进一步扩展至经济、文化、社会、科技、网络、生态、资源等多个领域，需要一部综合性法律对国家安全工作的基本原则、领导体制、主要任务、制度机制和保障措施作出统一规定。\u003c/p>\n\u003cp>2015年7月1日，第十二届全国人大常委会第十五次会议通过现行《国家安全法》，国家主席签署主席令予以公布，并自公布之日起施行。\u003c/p>\n\u003ch4>4. 立法沿革的核心变化\u003c/h4>\n\u003cp>从制度发展来看，国家安全立法的重心经历了从\u003cstrong>以反间谍工作为核心的专门安全立法\u003c/strong>，向\u003cstrong>总体国家安全观下综合性、基础性国家安全立法\u003c/strong>的转变。意味着，“国家安全”不再主要作为某一国家机关或者某一类危害行为的调整对象，而是被置于国家治理整体框架中，由不同领域的国家安全任务、国家机关职责、国家安全制度以及公民和组织的权利义务共同构成。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>提示：\u003c/strong>\u003cbr>1993年《国家安全法》 → 2014年《反间谍法》\u003cbr>2015年《国家安全法》 → 重新建立综合性国家安全法律框架\u003cbr>因此，不宜将1993年法与2015年法理解为同一部法律的连续修订版本。\u003c/p>\n\u003c/blockquote>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>第一，维护国家安全是总目标。\u003c/strong> 这里的国家安全须结合第2条理解，既涉及国家政权、主权和领土完整，也包括人民福祉、可持续发展及其他重大利益。\n\u003cstrong>第二，保护对象具有多个层次。\u003c/strong> 政权和制度是国家政治秩序的基础；人民根本利益体现立法的人民立场；改革开放和社会主义现代化建设体现发展导向；中华民族伟大复兴体现长远目标。\n\u003cstrong>第三，“根据宪法”具有实质意义。\u003c/strong> 本法承接宪法有关国家性质、人民主权、维护国家安全和公民义务的规定，同时受宪法约束。\n\u003cstrong>第四，本法具有综合性、全局性和基础性。\u003c/strong> 本法的体系功能：统领多个领域，安排长期任务，为专门立法留下口子。\u003c/p>\n\u003ch4>第一，维护国家安全是本法的总目标\u003c/h4>\n\u003cp>第一条首先以“维护国家安全”概括整部法律的总目标。这里的“国家安全”不能仅按照传统的政治安全、军事安全理解，而应当结合第2条的法定定义加以把握。第2条将国家安全界定为国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展以及国家其他重大利益处于相对没有危险、不受内外威胁的状态，同时包括保障持续安全状态的能力。\n因此，第一条中的“维护国家安全”具有高度概括性，其具体内容需要通过第2条的概念规定以及第二章关于各领域国家安全任务的规定进一步展开。\u003c/p>\n\u003ch4>第二，立法目的形成了多层次的保护结构\u003c/h4>\n\u003cp>第一条在“维护国家安全”的总目标之下进一步列举四项具体目的，分别对应不同层次的国家安全利益：\n\u003cstrong>其一，保卫人民民主专政的政权和中国特色社会主义制度。\u003c/strong>\u003cbr>这一目的体现国家安全的政治基础，与第3条所规定的“以政治安全为根本”以及第15条关于政治安全任务的规定形成体系联系。\u003c/p>\n\u003cp>\u003cstrong>其二，保护人民的根本利益。\u003c/strong>\u003cbr>人民利益不仅是国家安全的保护对象，也是国家安全工作的价值指向。第3条明确规定国家安全工作“以人民安全为宗旨”，第16条进一步要求国家维护和发展最广大人民的根本利益，保障公民生命财产安全和其他合法权益。\u003c/p>\n\u003cp>\u003cstrong>其三，保障改革开放和社会主义现代化建设顺利进行。\u003c/strong>\u003cbr>国家安全与国家发展并非彼此独立。第8条明确要求维护国家安全与经济社会发展相协调。因此，国家安全制度既具有风险防范功能，也承担保障国家正常发展秩序和发展条件的功能。\u003c/p>\n\u003cp>\u003cstrong>其四，实现中华民族伟大复兴。\u003c/strong>\u003cbr>这一表述将国家安全置于国家长期发展目标中，表明国家安全既关注现实风险，也关注国家长远发展的安全条件。\u003c/p>\n\u003cp>由此，本条所形成的保护结构可以概括为：\u003cstrong>政治秩序 → 人民利益 → 发展条件 → 国家长远发展目标。\u003c/strong>\u003c/p>\n\u003ch4>第三，“根据宪法”不仅说明立法形式依据，也确立了国家安全法治的宪法边界\u003c/h4>\n\u003cp>第一条明确规定“根据宪法，制定本法”。这一规定首先表明《国家安全法》的制定具有宪法依据。\n宪法中与国家安全直接相关的规范包括：公民维护国家统一的义务、遵守宪法和法律并保守国家秘密的义务，以及维护祖国安全、荣誉和利益的义务；同时，宪法也规定和保障公民的基本权利和自由。\n因此，“根据宪法”同时具有两方面意义：一方面，宪法为国家履行维护国家安全职责以及公民承担相应国家安全义务提供规范基础；另一方面，国家安全权力本身也必须在宪法和法律框架内运行。国家安全并不构成脱离法定权限和程序采取措施的独立理由。\n这一点在第7条中得到进一步确认。第7条要求维护国家安全必须遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。\u003c/p>\n\u003ch4>第四，本法具有综合性和基础性的体系功能\u003c/h4>\n\u003cp>2015年《国家安全法》并不试图以一部法律穷尽所有国家安全事项，而是从总体层面规定国家安全工作的基本原则、主要任务、职责体系、制度机制、保障措施以及公民和组织的权利义务。\n因此，本法与《反间谍法》《反恐怖主义法》《网络安全法》《数据安全法》《生物安全法》等专门领域立法之间形成“\u003cstrong>综合性基本规范＋专门领域规范\u003c/strong>”的制度结构。\n从这一意义上说，第一条不仅是目的条款，也提示了本法的体系定位：\u003cstrong>通过综合性国家安全立法确立共同的价值目标和基本制度框架，再由不同领域的专门法律具体化。\u003c/strong>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003ch4>1. 目的解释：第一条是解释依据，但不是独立的权力授予规范\u003c/h4>\n\u003cp>第一条具有重要的目的解释功能。当其他条文存在不同可能解释时，可以结合第一条判断某项制度所保护的国家安全利益，以及有关规范应当实现的制度目标。\n但应当区分\u003cstrong>立法目的规范\u003c/strong>与\u003cstrong>具体授权规范\u003c/strong>。第一条说明“为什么维护国家安全”，并不直接回答国家机关“可以采取什么措施”“在什么条件下可以采取措施”以及“应当遵循什么程序”。因此，查封、扣押、搜查、限制人身自由、行政处罚或者其他限制权利的措施，均应当具有相应的具体法律依据，并符合权限、条件和程序要求。不能仅以第一条所规定的“维护国家安全”为由推导出具体公权力。\u003c/p>\n\u003ch4>2. 国家保护义务与国家安全权力的法治约束\u003c/h4>\n\u003cp>从法理上看，国家安全规范同时包含两个方向：一方面，国家负有维护国家安全、保护人民生命财产和其他重大利益的积极职责；另一方面，国家在履行安全保护职责时仍须遵守法治原则，并保护公民和组织的合法权益。\n这一结构在本法内部具有明确的体系依据。第一条规定“保护人民的根本利益”，第7条规定尊重和保障人权，第16条要求保障公民生命财产安全和其他合法权益，第66条进一步规定，国家安全危机管控措施应当与危害的性质、程度和范围相适应；存在多种措施时，应选择有利于最大程度保护公民、组织权益的措施。\n因此，维护国家安全与保护公民权利并非两个相互隔离的规范目标。\u003cstrong>国家安全措施的合法性判断，本身就应当包含对权限依据、必要程度和权益保护的审查。\u003c/strong>\u003c/p>\n\u003ch4>3. 比例原则在国家安全领域具有特殊意义\u003c/h4>\n\u003cp>第66条体现了较为明确的比例控制思路：国家安全危机处置措施首先应当与风险的性质、程度和范围相适应；当存在多种可以实现目的的手段时，还应当优先选择对公民和组织权益保护程度更高的措施。\n据此，可以将国家安全措施的审查思路概括为：\u003cstrong>目的正当 → 具有法定依据 → 手段与风险程度相适应 → 多种有效手段中选择权益损害较小者。\u003c/strong>\n第一条所规定的国家安全目的因此不能单独完成合法性论证。即使某项措施确实有助于维护国家安全，也仍然需要进一步判断其权限依据、适用条件、程序要求以及对权利限制的程度。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003ch4>（一）核心关联条文\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>第2条：国家安全的概念。\u003c/strong> 回答“什么是国家安全”。\u003c/li>\n\u003cli>\u003cstrong>第3条：总体国家安全观。\u003c/strong> 回答国家安全工作的基本指导思想和总体结构。\u003c/li>\n\u003cli>\u003cstrong>第7条：法治与人权保障。\u003c/strong> 确立国家安全措施的基本法治边界。\u003c/li>\n\u003cli>\u003cstrong>第8条：安全与发展的协调。\u003c/strong> 说明维护国家安全同时需要考虑经济社会发展。\u003c/li>\n\u003cli>\u003cstrong>第15条：政治安全。\u003c/strong> 具体展开第一条关于政权和制度安全的要求。\u003c/li>\n\u003cli>\u003cstrong>第16条：人民安全。\u003c/strong> 具体展开第一条关于保护人民根本利益的要求。\u003c/li>\n\u003cli>\u003cstrong>第66条：危机管控中的比例控制。\u003c/strong> 对限制公民、组织权益的国家安全危机措施提出适度性和权益保护要求。\u003c/li>\n\u003c/ul>\n\u003ch4>（二）案例使用\u003c/h4>\n\u003cp>第一条属于\u003cstrong>立法目的条款\u003c/strong>，本身通常不是具体案件中认定违法、定罪或者处罚的直接规范依据。\n学习本条时，可以结合危害国家安全犯罪、反间谍执法、国家安全审查或者国家安全危机管控等公开案例，观察第一条所列举的国家安全利益如何在具体制度中展开。\n但在分析具体案件时，应继续分析：**具体行为规范 → 权限依据 → 构成要件 → 程序规范 → 法律责任。**不能仅依赖“维护国家安全”这一抽象目的进行法律评价。\u003c/p>\n\u003ch4>（三）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：\u003c/strong> 2015年《国家安全法》是1993年《国家安全法》的修订版。\u003cbr>\u003cstrong>纠正：\u003c/strong> 1993年《国家安全法》在2014年制定《反间谍法》时已经废止；2015年另行制定现行《国家安全法》。\u003c/p>\n\u003cp>\u003cstrong>易错点2：\u003c/strong> 第一条可以直接作为国家机关采取国家安全措施的授权依据。\u003cbr>\u003cstrong>纠正：\u003c/strong> 第一条主要规定立法目的和立法依据。具体限制权利或者实施强制措施仍须具有具体法律授权。\u003c/p>\n\u003cp>\u003cstrong>易错点3：\u003c/strong> 国家安全与公民权利属于简单的对立关系。\u003cbr>\u003cstrong>纠正：\u003c/strong> 本法同时规定维护国家安全、保护人民利益、尊重保障人权以及危机处置中的权益保护要求，应当进行体系解释。\u003c/p>\n\u003ch3>六、深度研究\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>目的条款的规范效力边界。\u003c/strong> 第一条能够在多大程度上参与具体国家安全规范的解释？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>多重立法目的之间的协调。\u003c/strong> 当某项国家安全措施能够促进特定安全利益，却同时对经济社会发展或者个人权利产生限制时，应如何协调第一条中的安全、人民利益和发展目标？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>安全目的与比例原则的关系。\u003c/strong> 第66条关于危机管控措施的规定能否反映国家安全法领域的一般比例控制要求？其适用范围是否能够通过体系解释扩展至危机管控以外的国家安全措施？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>综合性国家安全法与专门立法的关系。\u003c/strong> 当《国家安全法》与《反间谍法》《数据安全法》《生物安全法》等专门法律同时涉及某一事项时，应如何处理一般规范与专门规范之间的解释和适用关系？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":2,"label":"第二条","title":"国家安全的定义","lawText":"国家安全是指国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展和国家其他重大利益相对处于没有危险和不受内外威胁的状态，以及保障持续安全状态的能力。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>保护什么：\u003c/strong> 国家安全保护的是国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展以及其他国家重大利益。\u003c/li>\n\u003cli>\u003cstrong>防范什么：\u003c/strong> 国家安全面对的是来自内部和外部的危险与威胁，判断重点在于风险是否实质影响国家重大利益。\u003c/li>\n\u003cli>\u003cstrong>何谓安全：\u003c/strong> 法律追求的是“相对安全”，并非消除一切风险和不确定性；国家安全概念因此既具有预防性，也存在重大性门槛。\u003c/li>\n\u003cli>\u003cstrong>不仅是状态，也是能力：\u003c/strong> 国家安全既包括重大利益处于相对安全的状态，也包括预警、防范、应对和恢复等保障持续安全状态的能力。\u003c/li>\n\u003cli>\u003cstrong>适用边界：\u003c/strong> “国家其他重大利益”具有开放性，但不是无限兜底条款；具体事项仍需证明其国家性、重大性以及风险与该利益之间的实质关联。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家安全是指国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展和国家其他重大利益相对处于没有危险和不受内外威胁的状态，以及保障持续安全状态的能力。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>保护什么：\u003c/strong> 国家安全保护的是国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展以及其他国家重大利益。\u003c/li>\n\u003cli>\u003cstrong>防范什么：\u003c/strong> 国家安全面对的是来自内部和外部的危险与威胁，判断重点在于风险是否实质影响国家重大利益。\u003c/li>\n\u003cli>\u003cstrong>何谓安全：\u003c/strong> 法律追求的是“相对安全”，并非消除一切风险和不确定性；国家安全概念因此既具有预防性，也存在重大性门槛。\u003c/li>\n\u003cli>\u003cstrong>不仅是状态，也是能力：\u003c/strong> 国家安全既包括重大利益处于相对安全的状态，也包括预警、防范、应对和恢复等保障持续安全状态的能力。\u003c/li>\n\u003cli>\u003cstrong>适用边界：\u003c/strong> “国家其他重大利益”具有开放性，但不是无限兜底条款；具体事项仍需证明其国家性、重大性以及风险与该利益之间的实质关联。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第二条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家安全是指国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展和国家其他重大利益相对处于没有危险和不受内外威胁的状态，以及保障持续安全状态的能力。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全的定义 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条是《国家安全法》的\u003cstrong>定义条款\u003c/strong>，从法律上回答“什么是国家安全”。它既是理解总体国家安全观的概念起点，也是解释第二章各领域国家安全任务以及后续国家安全制度、保障措施的重要基础。\u003c/p>\n\u003cp>理解本条，可以抓住四个基本要素：\u003cstrong>受保护的国家重大利益 → 危险和内外威胁 → 相对安全状态 → 持续保障安全的能力。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 从专门国家安全工作转向总体国家安全概念\u003c/h4>\n\u003cp>1993年《国家安全法》主要围绕国家安全机关履行职责和防范、制止危害国家安全行为展开，当时国家安全立法与反间谍等专门安全工作联系较为紧密。\n2014年《反间谍法》承接原《国家安全法》中的反间谍制度后，2015年重新制定的《国家安全法》采取了不同的立法定位。本法不再主要围绕某一种危害行为或者某一个国家机关展开，而是在总体国家安全观之下，从国家整体利益和国家治理的角度建立综合性的国家安全制度。\n第二条对“国家安全”作出统一定义，正是这种立法转型的集中体现。\u003c/p>\n\u003ch4>2. 国家安全概念由单一安全领域扩展至国家整体安全\u003c/h4>\n\u003cp>本条列举的安全利益已经超出传统政治安全的范围。“国家政权、主权、统一和领土完整”体现国家生存和政治秩序的基本安全；“人民福祉”和“经济社会可持续发展”则将人民生活、发展条件纳入国家安全概念；“国家其他重大利益”进一步为科技、网络、生态、资源、生物等新型安全领域留下制度空间。因此，2015年国家安全立法所采取的是一个能够统摄传统安全与非传统安全的\u003cstrong>总体性国家安全概念\u003c/strong>。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>学习提示：\u003c/strong>\u003c/p>\n\u003cp>国家安全概念的变化可以概括为：\n\u003cstrong>专门安全工作 → 综合国家安全治理\u003c/strong>\n\u003cstrong>传统安全领域 → 传统安全与非传统安全并重\u003c/strong>\n\u003cstrong>消除现实危害 → 安全状态与安全能力并重\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，国家安全保护的对象是国家核心利益和其他重大利益\u003c/h4>\n\u003cp>第二条首先回答国家安全究竟保护什么。条文明确列举：\u003c/p>\n\u003cul>\n\u003cli>国家政权；\u003c/li>\n\u003cli>国家主权；\u003c/li>\n\u003cli>国家统一；\u003c/li>\n\u003cli>领土完整；\u003c/li>\n\u003cli>人民福祉；\u003c/li>\n\u003cli>经济社会可持续发展；\u003c/li>\n\u003cli>国家其他重大利益。\u003c/li>\n\u003c/ul>\n\u003cp>这些利益可以进一步区分为三个层次。\n\u003cstrong>其一，国家存续和政治秩序的基本利益。\u003c/strong>\u003cbr>国家政权、主权、统一和领土完整关系国家作为一个政治共同体存在和正常运行的基本条件，是国家安全最基础的保护对象。\n\u003cstrong>其二，人民生活和国家发展的重要利益。\u003c/strong>\u003cbr>人民福祉和经济社会可持续发展进入国家安全的法定定义，说明国家安全不仅关注国家是否受到直接攻击或者政权是否稳定，也关注人民生活和国家长期发展的基本条件。这与第3条“以人民安全为宗旨”、第8条统筹发展和安全的要求形成体系上的联系。\n\u003cstrong>其三，其他国家重大利益。\u003c/strong>\u003cbr>“国家其他重大利益”使国家安全概念具有一定开放性，从而能够回应社会发展和技术变迁中新出现的安全问题。例如，网络、数据、生物、人工智能等领域出现的新型风险，并不一定能够完全归入传统安全类型，但在达到国家重大利益层面时，可以进入国家安全法的评价范围。\n这里需要特别注意两个限定词：\u003cstrong>“国家”与“重大”\u003c/strong>。\n“其他重大利益”并不意味着任何公共利益、部门利益或者一般社会利益都属于国家安全利益。相关利益只有达到国家整体层面，并具有足够的重要性，才可能纳入第二条的调整范围。\n因此，本条虽然采取开放式规定，但其开放性本身受到“国家重大利益”这一门槛的约束。\u003c/p>\n\u003chr>\n\u003ch4>第二，国家安全关注现实危险，也关注来自国内外的安全威胁\u003c/h4>\n\u003cp>第二条将安全状态表述为“相对处于没有危险和不受内外威胁的状态”。\n这一规定首先表明，国家安全风险的来源具有复杂性。国家安全威胁既可能来自境外，也可能产生于国内；既可能来自国家行为体，也可能来自非国家行为体；既可能表现为传统的军事、政治冲突，也可能通过经济、金融、科技、网络、生物、资源等渠道形成。\n因此，判断一个事项是否涉及国家安全，不能简单以\u003cstrong>行为发生地点、行为主体国籍或者风险最初来源\u003c/strong>作为决定性标准。\n国内形成的风险可能经过经济、技术或者社会联系产生跨境影响，境外发生的变化也可能通过供应链、网络系统、资本流动或者技术依赖传导至国内。关键仍在于这种风险是否对第二条规定的国家重大利益形成具有实质意义的危险或者威胁。\n这也意味着，在具体国家安全判断中，需要判断：**具体风险 → 受到影响的国家重大利益 → 风险与该利益之间的关联 → 可能造成影响的范围和程度。**不能仅以“存在风险”为由直接得出“涉及国家安全”的结论。\u003c/p>\n\u003chr>\n\u003ch4>第三，国家安全是一种“相对安全”，并不意味着消除全部风险\u003c/h4>\n\u003cp>第二条使用“\u003cstrong>相对处于\u003c/strong>没有危险和不受内外威胁的状态”，其中“相对”是理解国家安全概念的重要限定。\n现实社会始终存在各种不确定性和风险，任何国家都不可能达到完全不存在危险、完全不受任何威胁的绝对安全状态。如果把国家安全理解为消灭所有危险和不确定性，国家安全概念就可能无限扩张。因此，本条所追求的是一种\u003cstrong>相对安全状态\u003c/strong>。\n所谓相对安全，并不意味着只有实际损害已经发生时才产生国家安全问题。对于可能严重影响国家重大利益的风险，国家仍然需要进行识别、预警和防范；但风险的存在程度以及其与国家重大利益之间的联系，应当经过具体判断。\n据此，可以把本条中的“相对安全”理解为两个方面：\n一方面，国家安全具有\u003cstrong>风险预防性\u003c/strong>，无需等到重大损害实际发生以后才采取应对措施；\n另一方面，国家安全具有\u003cstrong>程度要求\u003c/strong>，不能将任何一般风险、不确定性或者社会问题都提升为国家安全问题。\u003c/p>\n\u003chr>\n\u003ch4>第四，国家安全同时包括“安全状态”和“保障安全状态的能力”\u003c/h4>\n\u003cp>第二条最值得注意的制度设计，是将“状态”与“能力”同时纳入国家安全的定义。\n前半句规定的是一种\u003cstrong>安全状态\u003c/strong>：\u003c/p>\n\u003cblockquote>\n\u003cp>国家重大利益相对处于没有危险和不受内外威胁的状态。\u003c/p>\n\u003c/blockquote>\n\u003cp>后半句规定的则是维持这种状态的\u003cstrong>安全能力\u003c/strong>：\u003c/p>\n\u003cblockquote>\n\u003cp>保障持续安全状态的能力。\u003c/p>\n\u003c/blockquote>\n\u003cp>二者具有不同含义。当前没有发生重大安全事件，只能说明在特定时间点上处于某种相对安全状态。如果国家缺乏风险监测、预警、防范、处置以及恢复能力，这种状态本身就可能十分脆弱。\n因此，国家安全不仅具有静态意义，也具有动态意义。\n可以将两者概括为：\u003cstrong>安全状态解决“现在是否安全”的问题；安全能力解决“能否持续安全”的问题。\u003c/strong>\n这也说明，维护国家安全并不仅是对已经发生的危害作出反应，还包括建立能够持续识别风险、预防风险、应对风险和恢复正常状态的制度能力。\n从本法体系来看，第四章关于\u003cstrong>国家安全制度\u003c/strong>以及第五章关于\u003cstrong>国家安全保障\u003c/strong>的规定，均可以理解为第二条“保障持续安全状态的能力”的制度展开。\u003c/p>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. “其他重大利益”属于开放性规定，但存在重大性门槛\u003c/h4>\n\u003cp>“国家其他重大利益”使国家安全概念能够适应安全环境和社会发展的变化，这是综合性国家安全立法所需要的开放结构。但开放条款并不意味着无限解释。\n研究某一新型风险是否属于国家安全问题时，至少需要依次回答：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>涉及什么具体利益？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>该利益为什么具有国家层面的性质？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>该利益为什么达到“重大”的程度？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>具体风险如何对该利益形成危险或者威胁？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>风险可能造成的影响范围、程度和持续时间如何？\u003c/strong>\n只有完成这一论证过程，才能较为充分地说明某一事项为什么进入国家安全领域。\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch4>2. “涉及国家安全”与“可以采取国家安全措施”应当区分\u003c/h4>\n\u003cp>第二条规定的是国家安全的概念，并不是具体公权力的授权条款。即使某一事项经过分析确实涉及国家安全，也只能说明其进入了国家安全法的规范评价范围。国家机关能否采取审查、调查、检查、限制或者其他具体措施，仍然需要继续查找相应法律中的\u003cstrong>具体权限依据、适用条件和程序规范\u003c/strong>。\u003c/p>\n\u003cp>因此，应当区分两个不同层次的问题：\n\u003cstrong>第一层：该风险是否属于第二条意义上的国家安全问题？\u003c/strong>\n\u003cstrong>第二层：对于该风险，特定国家机关依法可以采取什么措施？\u003c/strong>\n前者是国家安全概念的认定，后者是公权力合法性的判断。二者不能相互替代。\n这一点与第一条的解释规则一致：国家安全的目的和概念可以帮助确定法律的适用范围，但不能自行创设具体公权力。\u003c/p>\n\u003chr>\n\u003ch4>3. 现实威胁、风险感知和安全能力应当区分\u003c/h4>\n\u003cp>研究国家安全问题时，还可以进一步区分三个层次：\n\u003cstrong>第一，客观风险或者威胁。\u003c/strong>\u003cbr>某种危险是否客观存在，其发生概率、作用路径和可能损害程度如何。\u003c/p>\n\u003cp>\u003cstrong>第二，对风险的社会认知和主观感受。\u003c/strong>\u003cbr>社会公众或者决策者对某种风险的感知程度可能受到信息结构、重大事件以及传播环境影响，这种感知未必与客观风险完全一致。\u003c/p>\n\u003cp>\u003cstrong>第三，国家的风险应对能力。\u003c/strong>\u003cbr>即使客观风险客观存在，如果国家具有较强的预警、应对、替代和恢复能力，其造成重大损害的可能性和程度也可能降低。\n第二条最终把第三个层面明确纳入国家安全定义，说明判断安全状况时不能仅观察“有没有威胁”，还需要考察国家面对威胁时的\u003cstrong>脆弱性与应对能力\u003c/strong>。\n从这一角度看，国家安全可以表达为一种关系：\u003cstrong>风险和威胁 × 国家脆弱性 × 应对能力 → 实际安全状态。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>4. 国家安全概念具有时代性，但其扩展仍需要法律控制\u003c/h4>\n\u003cp>〔延伸分析〕从国家安全理论的发展看，各国对“国家安全”的理解都会随着国际环境、国家任务和技术条件变化而调整。传统国家安全主要集中于军事防御、领土和政权安全；经济全球化和信息技术发展以后，经济、能源、网络、公共卫生、关键技术等问题越来越多地进入国家安全议程。这种变化说明，国家安全本身具有一定的\u003cstrong>历史性和动态性\u003c/strong>。\n但概念随时代变化，并不意味着可以任意扩大。越是采取综合性的国家安全概念，越需要通过“重大利益”“具体风险”“法定权限”和“权利保障”等要素控制其适用范围。\n因此，国家安全概念发展的基本张力在于：\u003cstrong>一方面保持足够的开放性，以应对新型风险；另一方面保持法律上的可确定性，防止国家安全概念泛化。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>五、实例、关联条文与学习提示\u003c/h3>\n\u003ch4>（一）北斗卫星导航系统：从“安全状态”理解到“安全能力”理解\u003c/h4>\n\u003cp>北斗卫星导航系统的建设可以帮助理解第二条中的“保障持续安全状态的能力”。\n卫星导航系统广泛关联交通运输、通信、应急救援、基础设施等领域。如果重要基础功能对外部系统形成高度依赖，一旦受到外部限制或者系统中断，相关重大利益就可能面临风险。\n自主建设关键技术和基础设施，可以增强国家在相关领域的稳定运行、替代和恢复能力，从而降低国家重大利益受到外部冲击时的脆弱性。\n这个例子说明：\u003cstrong>国家安全能力的重要作用，并不只是消灭威胁，而是提高国家在威胁存在时维持正常运行和恢复安全状态的能力。\u003c/strong>\n但应当避免进一步得出“实现技术自主即可消除相关领域全部安全风险”的结论。安全能力只能降低特定风险和脆弱性，不能形成绝对安全。\u003c/p>\n\u003chr>\n\u003ch4>（二）核心关联条文\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>第1条：立法目的。\u003c/strong> 说明为什么维护国家安全。\u003c/li>\n\u003cli>\u003cstrong>第3条：总体国家安全观。\u003c/strong> 将第二条的国家安全概念置于总体国家安全观框架中。\u003c/li>\n\u003cli>\u003cstrong>第8条：统筹发展和安全。\u003c/strong> 与第二条中的经济社会可持续发展形成体系联系。\u003c/li>\n\u003cli>\u003cstrong>第二章：维护国家安全的任务。\u003c/strong> 将第二条抽象的“国家重大利益”具体展开到不同安全领域。\u003c/li>\n\u003cli>\u003cstrong>第四章：国家安全制度。\u003c/strong> 建立风险预防、审查、危机管控等维护安全状态的制度机制。\u003c/li>\n\u003cli>\u003cstrong>第五章：国家安全保障。\u003c/strong> 从资源、能力、科技等方面保障国家持续安全能力。\u003c/li>\n\u003c/ul>\n\u003cp>简化为：\n\u003cstrong>第2条：什么是安全\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第3条：按照什么理念维护安全\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第二章：哪些领域需要维护安全\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第四、五章：通过什么制度和能力实现安全\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（三）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：国家安全就是国家不存在任何风险。\u003c/strong>\u003cbr>\u003cstrong>纠正：\u003c/strong> 第二条明确使用“相对处于”这一表述。国家安全是一种相对安全状态，并不以消除全部危险和不确定性为标准。\u003c/p>\n\u003cp>\u003cstrong>易错点2：只有境外势力造成的风险才属于国家安全问题。\u003c/strong>\u003cbr>\u003cstrong>纠正：\u003c/strong> 第二条明确规定“不受内外威胁”，国家安全风险既可能来源于外部，也可能形成于内部。\u003c/p>\n\u003cp>\u003cstrong>易错点3：只要某一事项比较重要，就属于“国家其他重大利益”。\u003c/strong>\u003cbr>\u003cstrong>纠正：\u003c/strong> “其他重大利益”同时受到“国家”和“重大”两个条件限制，需要具体论证其国家层面的重要性。\u003c/p>\n\u003cp>\u003cstrong>易错点4：当前没有发生危害，就说明国家是安全的。\u003c/strong>\u003cbr>\u003cstrong>纠正：\u003c/strong> 第二条同时强调“保障持续安全状态的能力”。缺少预警、应对、替代和恢复能力时，表面的平稳状态可能仍然具有较高脆弱性。\u003c/p>\n\u003cp>\u003cstrong>易错点5：只要认定某事项涉及国家安全，国家机关就可以采取必要措施。\u003c/strong>\u003cbr>\u003cstrong>纠正：\u003c/strong> 第二条只是定义条款。采取具体国家安全措施仍须具有相应法律依据，并符合权限、条件和程序要求。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>“国家其他重大利益”的解释边界。\u003c/strong>\u003cbr>面对数据、人工智能、生物技术等新型风险，应以何种标准认定有关利益已经达到“国家重大利益”的程度？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全与一般公共风险如何区分。\u003c/strong>\u003cbr>普通公共安全、社会治理或者经济风险在什么条件下会上升为国家安全问题？风险的影响规模、系统性和不可替代性在其中分别发挥什么作用？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“相对安全”是否包含风险容忍。\u003c/strong>\u003cbr>第二条承认安全具有相对性后，国家安全法是否意味着法律本身需要接受一定程度的合理风险，而非追求风险归零？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“安全能力”如何进行法律评价。\u003c/strong>\u003cbr>国家拥有更强的监测、预警和处置能力可以提升国家安全，但能力建设本身也可能伴随新的公权力和权利限制。安全能力的建设应如何与权限明确、比例原则和权利保障相协调？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>开放性与法治确定性的关系。\u003c/strong>\u003cbr>国家安全概念需要保持足够开放，以回应不断变化的新型威胁；与此同时，公民和组织又需要能够合理预见哪些行为可能进入国家安全法的调整范围。二者之间应如何建立适当的解释界限？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条是《国家安全法》的\u003cstrong>定义条款\u003c/strong>，从法律上回答“什么是国家安全”。它既是理解总体国家安全观的概念起点，也是解释第二章各领域国家安全任务以及后续国家安全制度、保障措施的重要基础。\u003c/p>\n\u003cp>理解本条，可以抓住四个基本要素：\u003cstrong>受保护的国家重大利益 → 危险和内外威胁 → 相对安全状态 → 持续保障安全的能力。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 从专门国家安全工作转向总体国家安全概念\u003c/h4>\n\u003cp>1993年《国家安全法》主要围绕国家安全机关履行职责和防范、制止危害国家安全行为展开，当时国家安全立法与反间谍等专门安全工作联系较为紧密。\n2014年《反间谍法》承接原《国家安全法》中的反间谍制度后，2015年重新制定的《国家安全法》采取了不同的立法定位。本法不再主要围绕某一种危害行为或者某一个国家机关展开，而是在总体国家安全观之下，从国家整体利益和国家治理的角度建立综合性的国家安全制度。\n第二条对“国家安全”作出统一定义，正是这种立法转型的集中体现。\u003c/p>\n\u003ch4>2. 国家安全概念由单一安全领域扩展至国家整体安全\u003c/h4>\n\u003cp>本条列举的安全利益已经超出传统政治安全的范围。“国家政权、主权、统一和领土完整”体现国家生存和政治秩序的基本安全；“人民福祉”和“经济社会可持续发展”则将人民生活、发展条件纳入国家安全概念；“国家其他重大利益”进一步为科技、网络、生态、资源、生物等新型安全领域留下制度空间。因此，2015年国家安全立法所采取的是一个能够统摄传统安全与非传统安全的\u003cstrong>总体性国家安全概念\u003c/strong>。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>学习提示：\u003c/strong>\u003c/p>\n\u003cp>国家安全概念的变化可以概括为：\n\u003cstrong>专门安全工作 → 综合国家安全治理\u003c/strong>\n\u003cstrong>传统安全领域 → 传统安全与非传统安全并重\u003c/strong>\n\u003cstrong>消除现实危害 → 安全状态与安全能力并重\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，国家安全保护的对象是国家核心利益和其他重大利益\u003c/h4>\n\u003cp>第二条首先回答国家安全究竟保护什么。条文明确列举：\u003c/p>\n\u003cul>\n\u003cli>国家政权；\u003c/li>\n\u003cli>国家主权；\u003c/li>\n\u003cli>国家统一；\u003c/li>\n\u003cli>领土完整；\u003c/li>\n\u003cli>人民福祉；\u003c/li>\n\u003cli>经济社会可持续发展；\u003c/li>\n\u003cli>国家其他重大利益。\u003c/li>\n\u003c/ul>\n\u003cp>这些利益可以进一步区分为三个层次。\n\u003cstrong>其一，国家存续和政治秩序的基本利益。\u003c/strong>\u003cbr>国家政权、主权、统一和领土完整关系国家作为一个政治共同体存在和正常运行的基本条件，是国家安全最基础的保护对象。\n\u003cstrong>其二，人民生活和国家发展的重要利益。\u003c/strong>\u003cbr>人民福祉和经济社会可持续发展进入国家安全的法定定义，说明国家安全不仅关注国家是否受到直接攻击或者政权是否稳定，也关注人民生活和国家长期发展的基本条件。这与第3条“以人民安全为宗旨”、第8条统筹发展和安全的要求形成体系上的联系。\n\u003cstrong>其三，其他国家重大利益。\u003c/strong>\u003cbr>“国家其他重大利益”使国家安全概念具有一定开放性，从而能够回应社会发展和技术变迁中新出现的安全问题。例如，网络、数据、生物、人工智能等领域出现的新型风险，并不一定能够完全归入传统安全类型，但在达到国家重大利益层面时，可以进入国家安全法的评价范围。\n这里需要特别注意两个限定词：\u003cstrong>“国家”与“重大”\u003c/strong>。\n“其他重大利益”并不意味着任何公共利益、部门利益或者一般社会利益都属于国家安全利益。相关利益只有达到国家整体层面，并具有足够的重要性，才可能纳入第二条的调整范围。\n因此，本条虽然采取开放式规定，但其开放性本身受到“国家重大利益”这一门槛的约束。\u003c/p>\n\u003chr>\n\u003ch4>第二，国家安全关注现实危险，也关注来自国内外的安全威胁\u003c/h4>\n\u003cp>第二条将安全状态表述为“相对处于没有危险和不受内外威胁的状态”。\n这一规定首先表明，国家安全风险的来源具有复杂性。国家安全威胁既可能来自境外，也可能产生于国内；既可能来自国家行为体，也可能来自非国家行为体；既可能表现为传统的军事、政治冲突，也可能通过经济、金融、科技、网络、生物、资源等渠道形成。\n因此，判断一个事项是否涉及国家安全，不能简单以\u003cstrong>行为发生地点、行为主体国籍或者风险最初来源\u003c/strong>作为决定性标准。\n国内形成的风险可能经过经济、技术或者社会联系产生跨境影响，境外发生的变化也可能通过供应链、网络系统、资本流动或者技术依赖传导至国内。关键仍在于这种风险是否对第二条规定的国家重大利益形成具有实质意义的危险或者威胁。\n这也意味着，在具体国家安全判断中，需要判断：**具体风险 → 受到影响的国家重大利益 → 风险与该利益之间的关联 → 可能造成影响的范围和程度。**不能仅以“存在风险”为由直接得出“涉及国家安全”的结论。\u003c/p>\n\u003chr>\n\u003ch4>第三，国家安全是一种“相对安全”，并不意味着消除全部风险\u003c/h4>\n\u003cp>第二条使用“\u003cstrong>相对处于\u003c/strong>没有危险和不受内外威胁的状态”，其中“相对”是理解国家安全概念的重要限定。\n现实社会始终存在各种不确定性和风险，任何国家都不可能达到完全不存在危险、完全不受任何威胁的绝对安全状态。如果把国家安全理解为消灭所有危险和不确定性，国家安全概念就可能无限扩张。因此，本条所追求的是一种\u003cstrong>相对安全状态\u003c/strong>。\n所谓相对安全，并不意味着只有实际损害已经发生时才产生国家安全问题。对于可能严重影响国家重大利益的风险，国家仍然需要进行识别、预警和防范；但风险的存在程度以及其与国家重大利益之间的联系，应当经过具体判断。\n据此，可以把本条中的“相对安全”理解为两个方面：\n一方面，国家安全具有\u003cstrong>风险预防性\u003c/strong>，无需等到重大损害实际发生以后才采取应对措施；\n另一方面，国家安全具有\u003cstrong>程度要求\u003c/strong>，不能将任何一般风险、不确定性或者社会问题都提升为国家安全问题。\u003c/p>\n\u003chr>\n\u003ch4>第四，国家安全同时包括“安全状态”和“保障安全状态的能力”\u003c/h4>\n\u003cp>第二条最值得注意的制度设计，是将“状态”与“能力”同时纳入国家安全的定义。\n前半句规定的是一种\u003cstrong>安全状态\u003c/strong>：\u003c/p>\n\u003cblockquote>\n\u003cp>国家重大利益相对处于没有危险和不受内外威胁的状态。\u003c/p>\n\u003c/blockquote>\n\u003cp>后半句规定的则是维持这种状态的\u003cstrong>安全能力\u003c/strong>：\u003c/p>\n\u003cblockquote>\n\u003cp>保障持续安全状态的能力。\u003c/p>\n\u003c/blockquote>\n\u003cp>二者具有不同含义。当前没有发生重大安全事件，只能说明在特定时间点上处于某种相对安全状态。如果国家缺乏风险监测、预警、防范、处置以及恢复能力，这种状态本身就可能十分脆弱。\n因此，国家安全不仅具有静态意义，也具有动态意义。\n可以将两者概括为：\u003cstrong>安全状态解决“现在是否安全”的问题；安全能力解决“能否持续安全”的问题。\u003c/strong>\n这也说明，维护国家安全并不仅是对已经发生的危害作出反应，还包括建立能够持续识别风险、预防风险、应对风险和恢复正常状态的制度能力。\n从本法体系来看，第四章关于\u003cstrong>国家安全制度\u003c/strong>以及第五章关于\u003cstrong>国家安全保障\u003c/strong>的规定，均可以理解为第二条“保障持续安全状态的能力”的制度展开。\u003c/p>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. “其他重大利益”属于开放性规定，但存在重大性门槛\u003c/h4>\n\u003cp>“国家其他重大利益”使国家安全概念能够适应安全环境和社会发展的变化，这是综合性国家安全立法所需要的开放结构。但开放条款并不意味着无限解释。\n研究某一新型风险是否属于国家安全问题时，至少需要依次回答：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>涉及什么具体利益？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>该利益为什么具有国家层面的性质？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>该利益为什么达到“重大”的程度？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>具体风险如何对该利益形成危险或者威胁？\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>风险可能造成的影响范围、程度和持续时间如何？\u003c/strong>\n只有完成这一论证过程，才能较为充分地说明某一事项为什么进入国家安全领域。\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch4>2. “涉及国家安全”与“可以采取国家安全措施”应当区分\u003c/h4>\n\u003cp>第二条规定的是国家安全的概念，并不是具体公权力的授权条款。即使某一事项经过分析确实涉及国家安全，也只能说明其进入了国家安全法的规范评价范围。国家机关能否采取审查、调查、检查、限制或者其他具体措施，仍然需要继续查找相应法律中的\u003cstrong>具体权限依据、适用条件和程序规范\u003c/strong>。\u003c/p>\n\u003cp>因此，应当区分两个不同层次的问题：\n\u003cstrong>第一层：该风险是否属于第二条意义上的国家安全问题？\u003c/strong>\n\u003cstrong>第二层：对于该风险，特定国家机关依法可以采取什么措施？\u003c/strong>\n前者是国家安全概念的认定，后者是公权力合法性的判断。二者不能相互替代。\n这一点与第一条的解释规则一致：国家安全的目的和概念可以帮助确定法律的适用范围，但不能自行创设具体公权力。\u003c/p>\n\u003chr>\n\u003ch4>3. 现实威胁、风险感知和安全能力应当区分\u003c/h4>\n\u003cp>研究国家安全问题时，还可以进一步区分三个层次：\n\u003cstrong>第一，客观风险或者威胁。\u003c/strong>\u003cbr>某种危险是否客观存在，其发生概率、作用路径和可能损害程度如何。\u003c/p>\n\u003cp>\u003cstrong>第二，对风险的社会认知和主观感受。\u003c/strong>\u003cbr>社会公众或者决策者对某种风险的感知程度可能受到信息结构、重大事件以及传播环境影响，这种感知未必与客观风险完全一致。\u003c/p>\n\u003cp>\u003cstrong>第三，国家的风险应对能力。\u003c/strong>\u003cbr>即使客观风险客观存在，如果国家具有较强的预警、应对、替代和恢复能力，其造成重大损害的可能性和程度也可能降低。\n第二条最终把第三个层面明确纳入国家安全定义，说明判断安全状况时不能仅观察“有没有威胁”，还需要考察国家面对威胁时的\u003cstrong>脆弱性与应对能力\u003c/strong>。\n从这一角度看，国家安全可以表达为一种关系：\u003cstrong>风险和威胁 × 国家脆弱性 × 应对能力 → 实际安全状态。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>4. 国家安全概念具有时代性，但其扩展仍需要法律控制\u003c/h4>\n\u003cp>〔延伸分析〕从国家安全理论的发展看，各国对“国家安全”的理解都会随着国际环境、国家任务和技术条件变化而调整。传统国家安全主要集中于军事防御、领土和政权安全；经济全球化和信息技术发展以后，经济、能源、网络、公共卫生、关键技术等问题越来越多地进入国家安全议程。这种变化说明，国家安全本身具有一定的\u003cstrong>历史性和动态性\u003c/strong>。\n但概念随时代变化，并不意味着可以任意扩大。越是采取综合性的国家安全概念，越需要通过“重大利益”“具体风险”“法定权限”和“权利保障”等要素控制其适用范围。\n因此，国家安全概念发展的基本张力在于：\u003cstrong>一方面保持足够的开放性，以应对新型风险；另一方面保持法律上的可确定性，防止国家安全概念泛化。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>五、实例、关联条文与学习提示\u003c/h3>\n\u003ch4>（一）北斗卫星导航系统：从“安全状态”理解到“安全能力”理解\u003c/h4>\n\u003cp>北斗卫星导航系统的建设可以帮助理解第二条中的“保障持续安全状态的能力”。\n卫星导航系统广泛关联交通运输、通信、应急救援、基础设施等领域。如果重要基础功能对外部系统形成高度依赖，一旦受到外部限制或者系统中断，相关重大利益就可能面临风险。\n自主建设关键技术和基础设施，可以增强国家在相关领域的稳定运行、替代和恢复能力，从而降低国家重大利益受到外部冲击时的脆弱性。\n这个例子说明：\u003cstrong>国家安全能力的重要作用，并不只是消灭威胁，而是提高国家在威胁存在时维持正常运行和恢复安全状态的能力。\u003c/strong>\n但应当避免进一步得出“实现技术自主即可消除相关领域全部安全风险”的结论。安全能力只能降低特定风险和脆弱性，不能形成绝对安全。\u003c/p>\n\u003chr>\n\u003ch4>（二）核心关联条文\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>第1条：立法目的。\u003c/strong> 说明为什么维护国家安全。\u003c/li>\n\u003cli>\u003cstrong>第3条：总体国家安全观。\u003c/strong> 将第二条的国家安全概念置于总体国家安全观框架中。\u003c/li>\n\u003cli>\u003cstrong>第8条：统筹发展和安全。\u003c/strong> 与第二条中的经济社会可持续发展形成体系联系。\u003c/li>\n\u003cli>\u003cstrong>第二章：维护国家安全的任务。\u003c/strong> 将第二条抽象的“国家重大利益”具体展开到不同安全领域。\u003c/li>\n\u003cli>\u003cstrong>第四章：国家安全制度。\u003c/strong> 建立风险预防、审查、危机管控等维护安全状态的制度机制。\u003c/li>\n\u003cli>\u003cstrong>第五章：国家安全保障。\u003c/strong> 从资源、能力、科技等方面保障国家持续安全能力。\u003c/li>\n\u003c/ul>\n\u003cp>简化为：\n\u003cstrong>第2条：什么是安全\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第3条：按照什么理念维护安全\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第二章：哪些领域需要维护安全\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第四、五章：通过什么制度和能力实现安全\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（三）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：国家安全就是国家不存在任何风险。\u003c/strong>\u003cbr>\u003cstrong>纠正：\u003c/strong> 第二条明确使用“相对处于”这一表述。国家安全是一种相对安全状态，并不以消除全部危险和不确定性为标准。\u003c/p>\n\u003cp>\u003cstrong>易错点2：只有境外势力造成的风险才属于国家安全问题。\u003c/strong>\u003cbr>\u003cstrong>纠正：\u003c/strong> 第二条明确规定“不受内外威胁”，国家安全风险既可能来源于外部，也可能形成于内部。\u003c/p>\n\u003cp>\u003cstrong>易错点3：只要某一事项比较重要，就属于“国家其他重大利益”。\u003c/strong>\u003cbr>\u003cstrong>纠正：\u003c/strong> “其他重大利益”同时受到“国家”和“重大”两个条件限制，需要具体论证其国家层面的重要性。\u003c/p>\n\u003cp>\u003cstrong>易错点4：当前没有发生危害，就说明国家是安全的。\u003c/strong>\u003cbr>\u003cstrong>纠正：\u003c/strong> 第二条同时强调“保障持续安全状态的能力”。缺少预警、应对、替代和恢复能力时，表面的平稳状态可能仍然具有较高脆弱性。\u003c/p>\n\u003cp>\u003cstrong>易错点5：只要认定某事项涉及国家安全，国家机关就可以采取必要措施。\u003c/strong>\u003cbr>\u003cstrong>纠正：\u003c/strong> 第二条只是定义条款。采取具体国家安全措施仍须具有相应法律依据，并符合权限、条件和程序要求。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>“国家其他重大利益”的解释边界。\u003c/strong>\u003cbr>面对数据、人工智能、生物技术等新型风险，应以何种标准认定有关利益已经达到“国家重大利益”的程度？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全与一般公共风险如何区分。\u003c/strong>\u003cbr>普通公共安全、社会治理或者经济风险在什么条件下会上升为国家安全问题？风险的影响规模、系统性和不可替代性在其中分别发挥什么作用？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“相对安全”是否包含风险容忍。\u003c/strong>\u003cbr>第二条承认安全具有相对性后，国家安全法是否意味着法律本身需要接受一定程度的合理风险，而非追求风险归零？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“安全能力”如何进行法律评价。\u003c/strong>\u003cbr>国家拥有更强的监测、预警和处置能力可以提升国家安全，但能力建设本身也可能伴随新的公权力和权利限制。安全能力的建设应如何与权限明确、比例原则和权利保障相协调？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>开放性与法治确定性的关系。\u003c/strong>\u003cbr>国家安全概念需要保持足够开放，以回应不断变化的新型威胁；与此同时，公民和组织又需要能够合理预见哪些行为可能进入国家安全法的调整范围。二者之间应如何建立适当的解释界限？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":3,"label":"第三条","title":"总体国家安全观","lawText":"国家安全工作应当坚持总体国家安全观，以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、文化、社会安全为保障，以促进国际安全为依托，维护各领域国家安全，构建国家安全体系，走中国特色国家安全道路。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>指导思想：\u003c/strong> 本条将总体国家安全观写入法律，是理解和实施整部《国家安全法》的总体指导条款。\u003c/li>\n\u003cli>\u003cstrong>五大要素：\u003c/strong> 以人民安全为宗旨、政治安全为根本、经济安全为基础、军事文化社会安全为保障、促进国际安全为依托；五者具有不同功能，并非简单并列的安全类型。\u003c/li>\n\u003cli>\u003cstrong>“总体”的核心：\u003c/strong> 强调各领域安全之间的系统联系、风险传导和统筹协调，而不是把所有经济社会问题都上升为国家安全问题。\u003c/li>\n\u003cli>\u003cstrong>体系展开：\u003c/strong> 第3条确立总体框架，第8条进一步规定不同安全关系的统筹，第二章则将“维护各领域国家安全”具体化。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 总体国家安全观可以作为体系解释和制度评价的重要依据，但不能直接替代具体国家安全措施所需的职权、实体和程序依据。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家安全工作应当坚持总体国家安全观，以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、文化、社会安全为保障，以促进国际安全为依托，维护各领域国家安全，构建国家安全体系，走中国特色国家安全道路。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>指导思想：\u003c/strong> 本条将总体国家安全观写入法律，是理解和实施整部《国家安全法》的总体指导条款。\u003c/li>\n\u003cli>\u003cstrong>五大要素：\u003c/strong> 以人民安全为宗旨、政治安全为根本、经济安全为基础、军事文化社会安全为保障、促进国际安全为依托；五者具有不同功能，并非简单并列的安全类型。\u003c/li>\n\u003cli>\u003cstrong>“总体”的核心：\u003c/strong> 强调各领域安全之间的系统联系、风险传导和统筹协调，而不是把所有经济社会问题都上升为国家安全问题。\u003c/li>\n\u003cli>\u003cstrong>体系展开：\u003c/strong> 第3条确立总体框架，第8条进一步规定不同安全关系的统筹，第二章则将“维护各领域国家安全”具体化。\u003c/li>\n\u003cli>\u003cstrong>规范边界：\u003c/strong> 总体国家安全观可以作为体系解释和制度评价的重要依据，但不能直接替代具体国家安全措施所需的职权、实体和程序依据。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第三条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>国家安全工作应当坚持总体国家安全观，以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、文化、社会安全为保障，以促进国际安全为依托，维护各领域国家安全，构建国家安全体系，走中国特色国家安全道路。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">总体国家安全观 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定国家安全工作的\u003cstrong>指导思想和总体框架\u003c/strong>。与第2条回答“什么是国家安全”不同，第3条主要回答“\u003cstrong>按照什么理念维护国家安全\u003c/strong>”。\u003c/p>\n\u003cp>理解本条，可以将其分为三个层次：\u003cstrong>五大要素 → 总体性要求 → 实现路径\u003c/strong>\n其中，“以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事、文化、社会安全为保障、以促进国际安全为依托”构成国家安全工作的基本结构；“维护各领域国家安全、构建国家安全体系”体现“总体”的系统要求；“走中国特色国家安全道路”则概括国家安全工作的总体路径。\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 2014年4月15日：总体国家安全观的提出\u003c/h4>\n\u003cp>2014年4月15日，中央国家安全委员会第一次会议提出总体国家安全观。当时已经明确提出：\u003c/p>\n\u003cul>\n\u003cli>以人民安全为宗旨；\u003c/li>\n\u003cli>以政治安全为根本；\u003c/li>\n\u003cli>以经济安全为基础；\u003c/li>\n\u003cli>以军事、文化、社会安全为保障；\u003c/li>\n\u003cli>以促进国际安全为依托。\n同时提出，应当统筹处理外部安全与内部安全、国土安全与国民安全、传统安全与非传统安全、发展与安全、自身安全与共同安全等关系。\n因此，2015年《国家安全法》第3条并非临时形成一套新的安全分类，而是将总体国家安全观的基本内容进一步转化为法律规范。\u003c/li>\n\u003c/ul>\n\u003ch4>2. 草案初稿：原则性规定较为概括\u003c/h4>\n\u003cp>国家安全法草案原第三条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“国家安全工作应当坚持总体国家安全观，走中国特色国家安全道路。”\n这一版本已经确立总体国家安全观的指导地位，但尚未进一步展开其具体内容。\u003c/p>\n\u003c/blockquote>\n\u003ch4>3. 二审修改：将总体国家安全观的基本结构写入法律\u003c/h4>\n\u003cp>2015年4月20日关于国家安全法草案修改情况的汇报指出，有常委会组成人员、代表、部门和地方提出，总体国家安全观作为国家安全工作的指导思想十分重要，草案原来的规定较为概括，应当进一步明确其具体内容。\n据此，草案二审稿补充了：\u003c/p>\n\u003cul>\n\u003cli>以人民安全为宗旨；\u003c/li>\n\u003cli>以政治安全为根本；\u003c/li>\n\u003cli>以经济安全为基础；\u003c/li>\n\u003cli>以军事、文化、社会安全为保障；\u003c/li>\n\u003cli>以促进国际安全为依托；\n并增加“维护各领域国家安全、构建国家安全体系”等内容。\n因此，本条的形成过程可以概括为：\u003cstrong>确立指导思想 → 细化基本内涵 → 明确总体性要求 → 形成最终法律文本。\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003ch4>4. 立法意义：使总体国家安全观取得明确的法律文本依据\u003c/h4>\n\u003cp>总体国家安全观写入第3条以后，不仅构成国家安全立法的思想背景，也成为解释和实施《国家安全法》的明确法律依据。\n第3条确立总体框架，第二章进一步规定各领域国家安全任务，第8条则对不同安全关系的统筹作出具体规定。三者共同构成总体国家安全观在本法中的主要规范展开。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>学习提示：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第2条：什么是国家安全\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第3条：按照什么总体理念维护国家安全\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第8条：不同安全关系如何统筹\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第二章：具体维护哪些领域的国家安全\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，“五大要素”具有不同的功能定位\u003c/h4>\n\u003cp>第三条最核心的结构，是“宗旨—根本—基础—保障—依托”五个层次。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>法律表述\u003c/th>\n\u003cth>基本含义\u003c/th>\n\u003cth>主要回答的问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>以人民安全为宗旨\u003c/strong>\u003c/td>\n\u003ctd>国家安全工作最终服务于人民安全和人民根本利益\u003c/td>\n\u003ctd>为了谁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>以政治安全为根本\u003c/strong>\u003c/td>\n\u003ctd>国家政权、制度和政治秩序在总体国家安全体系中具有根本性地位\u003c/td>\n\u003ctd>根本所在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>以经济安全为基础\u003c/strong>\u003c/td>\n\u003ctd>经济运行和持续发展为国家安全提供物质和发展条件\u003c/td>\n\u003ctd>基础是什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>以军事、文化、社会安全为保障\u003c/strong>\u003c/td>\n\u003ctd>从国家防卫、文化和社会运行等方面支撑总体国家安全\u003c/td>\n\u003ctd>如何形成保障\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>以促进国际安全为依托\u003c/strong>\u003c/td>\n\u003ctd>本国安全与国际安全环境密切相关，需要通过国际合作和共同安全创造外部条件\u003c/td>\n\u003ctd>外部依托是什么\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch4>第二，“以人民安全为宗旨”确立国家安全工作的价值指向\u003c/h4>\n\u003cp>“宗旨”首先回答国家安全工作“为了谁”。这一规定与第1条“保护人民的根本利益”、第2条将“人民福祉”纳入国家安全定义，以及第16条维护和发展最广大人民根本利益等规定形成体系上的联系。\n因此，人民安全并非国家安全体系之外的附加价值，而是《国家安全法》明确规定的价值目标。\n“以人民安全为宗旨”至少具有两方面含义：\n一方面，国家安全制度应当服务于人民生命、财产和其他合法权益的保护；\n另一方面，对具体国家安全措施的解释和实施，不能脱离第7条关于尊重和保障人权以及其他权利保障条款。\n由此可以形成基本的价值链条：\u003cstrong>维护国家安全 → 保护国家重大利益 → 服务于人民安全和人民根本利益。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>第三，“以政治安全为根本”确立政治安全的根本性地位\u003c/h4>\n\u003cp>政治安全主要涉及国家政权、政治制度和政治秩序等基本事项，与第1条关于保卫人民民主专政政权和中国特色社会主义制度以及第15条政治安全任务直接衔接。\n“根本”的表述说明，政治安全在总体国家安全体系中具有根本性地位。\n但这一规定属于国家安全体系中的结构性定位，并不意味着只要援引“政治安全”，即可直接认定某一行为违法或者某一限制措施合法。具体法律适用仍然需要结合第15条以及其他法律中的行为规范、权限规范和责任规范。\u003c/p>\n\u003chr>\n\u003ch4>第四，“以经济安全为基础”体现发展与安全之间的相互支撑\u003c/h4>\n\u003cp>经济活动为国家运行、国防建设、公共服务以及其他国家安全能力提供物质条件，因此本条将经济安全定位为国家安全的“基础”。\n这种关系在第8条中进一步转化为明确的统筹要求：\u003c/p>\n\u003cblockquote>\n\u003cp>维护国家安全，应当与经济社会发展相协调。\n国家安全与经济发展并非简单的此消彼长关系。国家安全为持续发展提供基本条件，稳定和可持续的发展则为维护国家安全提供物质基础和能力支撑。\n因此，“经济安全为基础”与第8条“发展与安全相协调”共同体现了总体国家安全观中发展与安全相互支撑的关系。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第五，“军事、文化、社会安全为保障”体现安全保障的多维结构\u003c/h4>\n\u003cp>本条将军事安全、文化安全和社会安全共同规定为“保障”。\n军事安全主要体现国家防卫能力等传统安全因素；文化安全涉及文化领域、价值体系和文化发展中的安全问题；社会安全则涉及社会秩序和社会正常运行。\n这些领域分别从国家防卫、文化和社会运行等方面对总体国家安全提供支撑。\n需要特别注意的是：&gt; \u003cstrong>现行《国家安全法》第3条的原文是“以军事、文化、社会安全为保障”，其中没有“科技”二字。\u003c/strong>\n在总体国家安全观后续的政策性和理论性表述中，可以看到“军事科技文化社会安全”等新的概括。这反映总体国家安全观本身仍在发展，法律具有一定的落后性，但学习和解释现行《国家安全法》第3条时，应当准确区分：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>法律文本：\u003c/strong>“军事、文化、社会安全”；\u003c/li>\n\u003cli>**后续政策理论表述：**可能包含“科技安全”等新的概括。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第六，“以促进国际安全为依托”说明国家安全具有国际环境维度\u003c/h4>\n\u003cp>现代国家安全并非完全封闭于一国疆域之内。（海内外两个中国）战争、恐怖主义、金融风险、传染病、网络攻击、供应链风险以及生态环境问题等，都可能具有明显的跨境传播特征。本国国家安全状态因而与国际和地区安全环境密切相关。\n“以促进国际安全为依托”表明，通过国际合作、共同安全等方式改善外部安全环境，也是维护本国国家安全的重要条件。\n这一要求与第8条关于统筹“自身安全和共同安全”的规定形成直接联系。\u003c/p>\n\u003chr>\n\u003ch4>第七，“总体”的核心在于系统性，而非将所有问题安全化\u003c/h4>\n\u003cp>理解总体国家安全观，关键在“总体”。\n“总体”首先体现一种系统思维，要求认识不同安全领域之间的联系、相互影响以及风险传导，而不能把不同领域安全完全割裂开来。例如：\n\u003cstrong>关键技术依赖 → 产业链运行风险 → 经济安全风险 → 就业和社会运行风险\u003c/strong>\n一个风险可能首先发生在科技领域，却进一步影响经济安全和社会安全；某些经济风险也可能继续向政治、社会或者其他安全领域传导。\n因此，总体国家安全观要求关注的不仅是单一风险本身，还包括风险之间的\u003cstrong>关联、传导和叠加\u003c/strong>。\n但“总体”并不意味着将所有经济社会问题都纳入国家安全。\n这一点应当与第2条结合理解：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>总体性要求扩大观察视野，第2条的“国家重大利益”则控制法律边界。\u003c/strong>\n系统思维要求发现不同风险之间的联系，但某一事项最终是否属于国家安全问题，仍须判断其是否影响第2条所规定的国家重大利益以及风险程度是否达到相应门槛。因此：\n\u003cstrong>总体国家安全观强调“大安全”，不等于“安全泛化”。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第八，“维护各领域国家安全、构建国家安全体系”将总体理念转化为制度要求\u003c/h4>\n\u003cp>第三条在五大要素之后进一步规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“维护各领域国家安全，构建国家安全体系。”\n二者分别体现\u003cstrong>领域覆盖\u003c/strong>与\u003cstrong>体系建设\u003c/strong>。\n“维护各领域国家安全”意味着国家安全已经超越传统政治、军事领域。第二章随后从政治、国土、军事、经济、金融、资源、粮食、文化、科技、网络与信息、生态、核以及海外利益等方面规定国家安全任务，是这一要求的具体展开。\n“构建国家安全体系”则意味着，各领域国家安全制度不能彼此孤立，而需要形成相互协调、相互衔接的整体制度结构。\n因此可以区分：\n\u003cstrong>维护各领域国家安全——解决国家安全“覆盖哪些领域”；\u003c/strong>\n\u003cstrong>构建国家安全体系——解决各领域安全“如何形成整体”。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 第3条属于指导性、原则性规范，不是具体公权力的授权依据\u003c/h4>\n\u003cp>第三条对理解整部《国家安全法》具有重要的体系解释作用。在判断某项国家安全制度的目的、不同安全利益之间的关系以及第二章各项国家安全任务时，都可以将总体国家安全观作为解释依据。\n但是，第3条本身并没有规定具体机关可以采取何种调查、审查、检查、强制或者处罚措施。\n因此，应当继续坚持前两条形成的分析方法：&gt; \u003cstrong>指导思想可以帮助解释权力，但不能代替权力依据。\u003c/strong>\n具体国家安全措施仍然需要具备：\u003cstrong>法定职权 → 实体条件 → 程序依据 → 权利保障。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>2. “宗旨—根本—基础—保障—依托”是功能结构，不是利益排序\u003c/h4>\n\u003cp>   第三条使用五种不同概念，说明不同安全要素在总体国家安全体系中具有不同功能。\n   但这种结构不宜机械转化为个案中的固定利益排序。例如，不能仅根据“政治安全为根本、经济安全为基础”的文字关系，就直接得出“在任何个案中政治安全当然优先于经济安全”的结论。\n   具体案件中，不同国家安全利益受到影响的范围、风险程度和法律依据均可能不同，仍然需要结合具体规范进行判断。\u003c/p>\n\u003ch4>3. 总体安全要求关注风险传导，但不能取消领域边界\u003c/h4>\n\u003cp>总体国家安全观的重要分析价值，在于要求从系统视角观察风险。\n一种风险可能最初发生在科技领域，却最终影响经济、军事或者社会安全；某种经济冲击也可能进一步产生社会安全影响。\n但跨领域风险的存在，并不意味着各领域之间的法律边界可以被取消。\n分析具体事项时，可以依次判断：\n\u003cstrong>风险首先发生在哪一领域\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>涉及何种国家重大利益\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>风险如何向其他领域传导\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>是否达到第2条意义上的国家安全程度\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>应适用何种具体法律规范\u003c/strong>\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>系统性要求建立联系，法治要求保持边界。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>4. 第8条是“总体”方法在法律文本中的进一步展开\u003c/h4>\n\u003cp>总体国家安全观提出时，特别强调统筹处理若干重要关系，包括：\u003c/p>\n\u003cul>\n\u003cli>外部安全与内部安全；\u003c/li>\n\u003cli>国土安全与国民安全；\u003c/li>\n\u003cli>传统安全与非传统安全；\u003c/li>\n\u003cli>发展与安全；\u003c/li>\n\u003cli>自身安全与共同安全。\u003c/li>\n\u003c/ul>\n\u003cp>这些统筹关系随后在《国家安全法》第8条中得到进一步法律化。\u003c/p>\n\u003cp>因此，第3条与第8条之间存在明确的体系分工：\n\u003cstrong>第3条：确立国家安全工作的总体价值和基本结构。\u003c/strong>\n\u003cstrong>第8条：进一步规定处理不同安全关系的方法。\u003c/strong>\n可以说，第8条是第3条“总体”要求在工作方法层面的具体展开。\u003c/p>\n\u003chr>\n\u003ch4>5. 与国际“人的安全”理论可以比较，但不能直接等同〔比较法／安全理论〕\u003c/h4>\n\u003cp>国际安全研究中存在“human security（人的安全）”理论。\n1994年联合国开发计划署《人类发展报告》提出，应当突破单纯以领土和军事安全理解安全的传统方式，更加关注人的生存和生活。此后，联合国关于人的安全的讨论进一步强调以人为中心，关注人的生存、生活和尊严，并采取综合性、预防性的方法应对风险。从这一角度看，人的安全理论与第3条“以人民安全为宗旨”存在可以比较的问题：\u003c/p>\n\u003cul>\n\u003cli>安全最终保护谁；\u003c/li>\n\u003cli>国家安全与人的生活状态之间是什么关系；\u003c/li>\n\u003cli>传统军事安全能否穷尽现代安全问题；\u003c/li>\n\u003cli>是否需要采取跨领域、综合性和预防性的安全治理方式。\n但两者不能直接等同。“人的安全”主要以个人的生存、生活和尊严作为安全分析的中心对象；我国《国家安全法》则是在总体国家安全体系之内，将人民安全规定为国家安全工作的“宗旨”，同时还规定政治安全、经济安全以及其他国家重大利益。\n因此，更适宜将二者作为\u003cstrong>比较研究对象\u003c/strong>，而不宜直接进行概念同一化。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）本条在总则中的位置\u003c/h4>\n\u003cp>第3条位于第2条国家安全定义之后，同时处于国家安全领导体制、战略和工作原则之前，具有承上启下的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>第1条：为什么制定国家安全法\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第2条：什么是国家安全\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第3条：按照什么总体理念维护国家安全\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第4—5条：由什么领导和决策机制负责\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第6条：通过什么国家安全战略进行统筹\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第7—10条：维护国家安全遵循什么基本原则\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第二章：具体维护哪些领域的国家安全\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第三至五章：由谁负责、采取什么制度、如何提供保障\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>因此，第3条可以视为连接\u003cstrong>国家安全概念\u003c/strong>与\u003cstrong>具体国家安全制度\u003c/strong>的枢纽条款。\u003c/p>\n\u003chr>\n\u003ch4>（二）核心关联条文\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>第1条：立法目的。\u003c/strong> 与人民安全、政治安全和发展等价值目标相互衔接。\u003c/li>\n\u003cli>\u003cstrong>第2条：国家安全定义。\u003c/strong> 为总体国家安全观划定国家重大利益这一基本门槛。\u003c/li>\n\u003cli>\u003cstrong>第4—6条：领导体制与国家安全战略。\u003c/strong> 将总体国家安全观转化为组织和战略机制。\u003c/li>\n\u003cli>\u003cstrong>第7条：法治和人权保障。\u003c/strong> 对总体国家安全工作的实施手段形成法治约束。\u003c/li>\n\u003cli>\u003cstrong>第8条：安全关系的统筹。\u003c/strong> 是“总体”方法的重要法律展开。\u003c/li>\n\u003cli>\u003cstrong>第二章：各领域国家安全任务。\u003c/strong> 将“维护各领域国家安全”具体化。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>（三）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：总体国家安全观就是尽可能扩大国家安全范围。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> “总体”强调系统性、整体性和协调性，并不意味着所有风险都属于国家安全风险。具体事项仍须符合第2条关于国家重大利益的要求。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：五大要素就是五种并列的国家安全类型。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> “宗旨、根本、基础、保障、依托”分别具有不同功能，不能作为简单的并列分类理解。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：“政治安全为根本”意味着任何案件中政治安全都自动优先。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 这是政治安全在国家安全体系中的结构性定位，并不是个案法律适用中的自动优先规则。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：现行第3条规定“以军事、科技、文化、社会安全为保障”。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 现行法律原文是“以军事、文化、社会安全为保障”。后续总体国家安全观的理论和政策表述中可能加入科技安全，但不能因此改变现行法条文本。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：第3条可以直接作为采取国家安全措施的法律依据。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第3条属于指导性、原则性规范。具体公权力仍须依据专门的职权、实体和程序规定。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>“以人民安全为宗旨”如何取得更具体的规范意义？\u003c/strong>\u003cbr>在国家安全审查、风险管控或者危机处置中，能否将其转化为对人民生命、财产、基本权利和长期福祉的评价标准？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“政治安全为根本”在法律解释中具有何种效力？\u003c/strong>\u003cbr>它主要属于国家安全体系的结构性定位，还是能够进一步影响具体法律解释中的利益衡量？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“总体”与“安全泛化”的边界在哪里？\u003c/strong>\u003cbr>系统性风险往往存在跨领域传导，但如果关联链条不断延伸，几乎所有经济社会活动都可能与国家安全建立联系。法律应当通过何种重大性、因果关系和风险程度标准控制这种扩张？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>不同国家安全领域之间应如何进行规范协调？\u003c/strong>\u003cbr>当同一事项同时涉及科技、经济、数据、网络和社会安全时，应适用何种法律规范？不同领域国家安全制度之间发生竞合时，应如何处理？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>总体国家安全观的发展与现行法律文本如何衔接？\u003c/strong>\u003cbr>后续政策文件和理论表述不断丰富总体国家安全观的领域和内容。在法律文本尚未修改的情况下，这些发展能够在多大程度上参与对第3条及其他条文的法律解释？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>人民安全与“人的安全”理论可以在哪些层面开展比较？\u003c/strong>\u003cbr>二者都关注人的安全以及跨领域风险，但具有不同的理论来源和制度结构。如何进行功能比较，同时避免简单的概念移植和概念等同？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定国家安全工作的\u003cstrong>指导思想和总体框架\u003c/strong>。与第2条回答“什么是国家安全”不同，第3条主要回答“\u003cstrong>按照什么理念维护国家安全\u003c/strong>”。\u003c/p>\n\u003cp>理解本条，可以将其分为三个层次：\u003cstrong>五大要素 → 总体性要求 → 实现路径\u003c/strong>\n其中，“以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事、文化、社会安全为保障、以促进国际安全为依托”构成国家安全工作的基本结构；“维护各领域国家安全、构建国家安全体系”体现“总体”的系统要求；“走中国特色国家安全道路”则概括国家安全工作的总体路径。\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 2014年4月15日：总体国家安全观的提出\u003c/h4>\n\u003cp>2014年4月15日，中央国家安全委员会第一次会议提出总体国家安全观。当时已经明确提出：\u003c/p>\n\u003cul>\n\u003cli>以人民安全为宗旨；\u003c/li>\n\u003cli>以政治安全为根本；\u003c/li>\n\u003cli>以经济安全为基础；\u003c/li>\n\u003cli>以军事、文化、社会安全为保障；\u003c/li>\n\u003cli>以促进国际安全为依托。\n同时提出，应当统筹处理外部安全与内部安全、国土安全与国民安全、传统安全与非传统安全、发展与安全、自身安全与共同安全等关系。\n因此，2015年《国家安全法》第3条并非临时形成一套新的安全分类，而是将总体国家安全观的基本内容进一步转化为法律规范。\u003c/li>\n\u003c/ul>\n\u003ch4>2. 草案初稿：原则性规定较为概括\u003c/h4>\n\u003cp>国家安全法草案原第三条规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“国家安全工作应当坚持总体国家安全观，走中国特色国家安全道路。”\n这一版本已经确立总体国家安全观的指导地位，但尚未进一步展开其具体内容。\u003c/p>\n\u003c/blockquote>\n\u003ch4>3. 二审修改：将总体国家安全观的基本结构写入法律\u003c/h4>\n\u003cp>2015年4月20日关于国家安全法草案修改情况的汇报指出，有常委会组成人员、代表、部门和地方提出，总体国家安全观作为国家安全工作的指导思想十分重要，草案原来的规定较为概括，应当进一步明确其具体内容。\n据此，草案二审稿补充了：\u003c/p>\n\u003cul>\n\u003cli>以人民安全为宗旨；\u003c/li>\n\u003cli>以政治安全为根本；\u003c/li>\n\u003cli>以经济安全为基础；\u003c/li>\n\u003cli>以军事、文化、社会安全为保障；\u003c/li>\n\u003cli>以促进国际安全为依托；\n并增加“维护各领域国家安全、构建国家安全体系”等内容。\n因此，本条的形成过程可以概括为：\u003cstrong>确立指导思想 → 细化基本内涵 → 明确总体性要求 → 形成最终法律文本。\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003ch4>4. 立法意义：使总体国家安全观取得明确的法律文本依据\u003c/h4>\n\u003cp>总体国家安全观写入第3条以后，不仅构成国家安全立法的思想背景，也成为解释和实施《国家安全法》的明确法律依据。\n第3条确立总体框架，第二章进一步规定各领域国家安全任务，第8条则对不同安全关系的统筹作出具体规定。三者共同构成总体国家安全观在本法中的主要规范展开。\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>学习提示：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第2条：什么是国家安全\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第3条：按照什么总体理念维护国家安全\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第8条：不同安全关系如何统筹\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第二章：具体维护哪些领域的国家安全\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，“五大要素”具有不同的功能定位\u003c/h4>\n\u003cp>第三条最核心的结构，是“宗旨—根本—基础—保障—依托”五个层次。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>法律表述\u003c/th>\n\u003cth>基本含义\u003c/th>\n\u003cth>主要回答的问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>以人民安全为宗旨\u003c/strong>\u003c/td>\n\u003ctd>国家安全工作最终服务于人民安全和人民根本利益\u003c/td>\n\u003ctd>为了谁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>以政治安全为根本\u003c/strong>\u003c/td>\n\u003ctd>国家政权、制度和政治秩序在总体国家安全体系中具有根本性地位\u003c/td>\n\u003ctd>根本所在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>以经济安全为基础\u003c/strong>\u003c/td>\n\u003ctd>经济运行和持续发展为国家安全提供物质和发展条件\u003c/td>\n\u003ctd>基础是什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>以军事、文化、社会安全为保障\u003c/strong>\u003c/td>\n\u003ctd>从国家防卫、文化和社会运行等方面支撑总体国家安全\u003c/td>\n\u003ctd>如何形成保障\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>以促进国际安全为依托\u003c/strong>\u003c/td>\n\u003ctd>本国安全与国际安全环境密切相关，需要通过国际合作和共同安全创造外部条件\u003c/td>\n\u003ctd>外部依托是什么\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch4>第二，“以人民安全为宗旨”确立国家安全工作的价值指向\u003c/h4>\n\u003cp>“宗旨”首先回答国家安全工作“为了谁”。这一规定与第1条“保护人民的根本利益”、第2条将“人民福祉”纳入国家安全定义，以及第16条维护和发展最广大人民根本利益等规定形成体系上的联系。\n因此，人民安全并非国家安全体系之外的附加价值，而是《国家安全法》明确规定的价值目标。\n“以人民安全为宗旨”至少具有两方面含义：\n一方面，国家安全制度应当服务于人民生命、财产和其他合法权益的保护；\n另一方面，对具体国家安全措施的解释和实施，不能脱离第7条关于尊重和保障人权以及其他权利保障条款。\n由此可以形成基本的价值链条：\u003cstrong>维护国家安全 → 保护国家重大利益 → 服务于人民安全和人民根本利益。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>第三，“以政治安全为根本”确立政治安全的根本性地位\u003c/h4>\n\u003cp>政治安全主要涉及国家政权、政治制度和政治秩序等基本事项，与第1条关于保卫人民民主专政政权和中国特色社会主义制度以及第15条政治安全任务直接衔接。\n“根本”的表述说明，政治安全在总体国家安全体系中具有根本性地位。\n但这一规定属于国家安全体系中的结构性定位，并不意味着只要援引“政治安全”，即可直接认定某一行为违法或者某一限制措施合法。具体法律适用仍然需要结合第15条以及其他法律中的行为规范、权限规范和责任规范。\u003c/p>\n\u003chr>\n\u003ch4>第四，“以经济安全为基础”体现发展与安全之间的相互支撑\u003c/h4>\n\u003cp>经济活动为国家运行、国防建设、公共服务以及其他国家安全能力提供物质条件，因此本条将经济安全定位为国家安全的“基础”。\n这种关系在第8条中进一步转化为明确的统筹要求：\u003c/p>\n\u003cblockquote>\n\u003cp>维护国家安全，应当与经济社会发展相协调。\n国家安全与经济发展并非简单的此消彼长关系。国家安全为持续发展提供基本条件，稳定和可持续的发展则为维护国家安全提供物质基础和能力支撑。\n因此，“经济安全为基础”与第8条“发展与安全相协调”共同体现了总体国家安全观中发展与安全相互支撑的关系。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第五，“军事、文化、社会安全为保障”体现安全保障的多维结构\u003c/h4>\n\u003cp>本条将军事安全、文化安全和社会安全共同规定为“保障”。\n军事安全主要体现国家防卫能力等传统安全因素；文化安全涉及文化领域、价值体系和文化发展中的安全问题；社会安全则涉及社会秩序和社会正常运行。\n这些领域分别从国家防卫、文化和社会运行等方面对总体国家安全提供支撑。\n需要特别注意的是：&gt; \u003cstrong>现行《国家安全法》第3条的原文是“以军事、文化、社会安全为保障”，其中没有“科技”二字。\u003c/strong>\n在总体国家安全观后续的政策性和理论性表述中，可以看到“军事科技文化社会安全”等新的概括。这反映总体国家安全观本身仍在发展，法律具有一定的落后性，但学习和解释现行《国家安全法》第3条时，应当准确区分：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>法律文本：\u003c/strong>“军事、文化、社会安全”；\u003c/li>\n\u003cli>**后续政策理论表述：**可能包含“科技安全”等新的概括。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>第六，“以促进国际安全为依托”说明国家安全具有国际环境维度\u003c/h4>\n\u003cp>现代国家安全并非完全封闭于一国疆域之内。（海内外两个中国）战争、恐怖主义、金融风险、传染病、网络攻击、供应链风险以及生态环境问题等，都可能具有明显的跨境传播特征。本国国家安全状态因而与国际和地区安全环境密切相关。\n“以促进国际安全为依托”表明，通过国际合作、共同安全等方式改善外部安全环境，也是维护本国国家安全的重要条件。\n这一要求与第8条关于统筹“自身安全和共同安全”的规定形成直接联系。\u003c/p>\n\u003chr>\n\u003ch4>第七，“总体”的核心在于系统性，而非将所有问题安全化\u003c/h4>\n\u003cp>理解总体国家安全观，关键在“总体”。\n“总体”首先体现一种系统思维，要求认识不同安全领域之间的联系、相互影响以及风险传导，而不能把不同领域安全完全割裂开来。例如：\n\u003cstrong>关键技术依赖 → 产业链运行风险 → 经济安全风险 → 就业和社会运行风险\u003c/strong>\n一个风险可能首先发生在科技领域，却进一步影响经济安全和社会安全；某些经济风险也可能继续向政治、社会或者其他安全领域传导。\n因此，总体国家安全观要求关注的不仅是单一风险本身，还包括风险之间的\u003cstrong>关联、传导和叠加\u003c/strong>。\n但“总体”并不意味着将所有经济社会问题都纳入国家安全。\n这一点应当与第2条结合理解：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>总体性要求扩大观察视野，第2条的“国家重大利益”则控制法律边界。\u003c/strong>\n系统思维要求发现不同风险之间的联系，但某一事项最终是否属于国家安全问题，仍须判断其是否影响第2条所规定的国家重大利益以及风险程度是否达到相应门槛。因此：\n\u003cstrong>总体国家安全观强调“大安全”，不等于“安全泛化”。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第八，“维护各领域国家安全、构建国家安全体系”将总体理念转化为制度要求\u003c/h4>\n\u003cp>第三条在五大要素之后进一步规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“维护各领域国家安全，构建国家安全体系。”\n二者分别体现\u003cstrong>领域覆盖\u003c/strong>与\u003cstrong>体系建设\u003c/strong>。\n“维护各领域国家安全”意味着国家安全已经超越传统政治、军事领域。第二章随后从政治、国土、军事、经济、金融、资源、粮食、文化、科技、网络与信息、生态、核以及海外利益等方面规定国家安全任务，是这一要求的具体展开。\n“构建国家安全体系”则意味着，各领域国家安全制度不能彼此孤立，而需要形成相互协调、相互衔接的整体制度结构。\n因此可以区分：\n\u003cstrong>维护各领域国家安全——解决国家安全“覆盖哪些领域”；\u003c/strong>\n\u003cstrong>构建国家安全体系——解决各领域安全“如何形成整体”。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 第3条属于指导性、原则性规范，不是具体公权力的授权依据\u003c/h4>\n\u003cp>第三条对理解整部《国家安全法》具有重要的体系解释作用。在判断某项国家安全制度的目的、不同安全利益之间的关系以及第二章各项国家安全任务时，都可以将总体国家安全观作为解释依据。\n但是，第3条本身并没有规定具体机关可以采取何种调查、审查、检查、强制或者处罚措施。\n因此，应当继续坚持前两条形成的分析方法：&gt; \u003cstrong>指导思想可以帮助解释权力，但不能代替权力依据。\u003c/strong>\n具体国家安全措施仍然需要具备：\u003cstrong>法定职权 → 实体条件 → 程序依据 → 权利保障。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>2. “宗旨—根本—基础—保障—依托”是功能结构，不是利益排序\u003c/h4>\n\u003cp>   第三条使用五种不同概念，说明不同安全要素在总体国家安全体系中具有不同功能。\n   但这种结构不宜机械转化为个案中的固定利益排序。例如，不能仅根据“政治安全为根本、经济安全为基础”的文字关系，就直接得出“在任何个案中政治安全当然优先于经济安全”的结论。\n   具体案件中，不同国家安全利益受到影响的范围、风险程度和法律依据均可能不同，仍然需要结合具体规范进行判断。\u003c/p>\n\u003ch4>3. 总体安全要求关注风险传导，但不能取消领域边界\u003c/h4>\n\u003cp>总体国家安全观的重要分析价值，在于要求从系统视角观察风险。\n一种风险可能最初发生在科技领域，却最终影响经济、军事或者社会安全；某种经济冲击也可能进一步产生社会安全影响。\n但跨领域风险的存在，并不意味着各领域之间的法律边界可以被取消。\n分析具体事项时，可以依次判断：\n\u003cstrong>风险首先发生在哪一领域\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>涉及何种国家重大利益\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>风险如何向其他领域传导\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>是否达到第2条意义上的国家安全程度\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>应适用何种具体法律规范\u003c/strong>\u003c/p>\n\u003cp>因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>系统性要求建立联系，法治要求保持边界。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>4. 第8条是“总体”方法在法律文本中的进一步展开\u003c/h4>\n\u003cp>总体国家安全观提出时，特别强调统筹处理若干重要关系，包括：\u003c/p>\n\u003cul>\n\u003cli>外部安全与内部安全；\u003c/li>\n\u003cli>国土安全与国民安全；\u003c/li>\n\u003cli>传统安全与非传统安全；\u003c/li>\n\u003cli>发展与安全；\u003c/li>\n\u003cli>自身安全与共同安全。\u003c/li>\n\u003c/ul>\n\u003cp>这些统筹关系随后在《国家安全法》第8条中得到进一步法律化。\u003c/p>\n\u003cp>因此，第3条与第8条之间存在明确的体系分工：\n\u003cstrong>第3条：确立国家安全工作的总体价值和基本结构。\u003c/strong>\n\u003cstrong>第8条：进一步规定处理不同安全关系的方法。\u003c/strong>\n可以说，第8条是第3条“总体”要求在工作方法层面的具体展开。\u003c/p>\n\u003chr>\n\u003ch4>5. 与国际“人的安全”理论可以比较，但不能直接等同〔比较法／安全理论〕\u003c/h4>\n\u003cp>国际安全研究中存在“human security（人的安全）”理论。\n1994年联合国开发计划署《人类发展报告》提出，应当突破单纯以领土和军事安全理解安全的传统方式，更加关注人的生存和生活。此后，联合国关于人的安全的讨论进一步强调以人为中心，关注人的生存、生活和尊严，并采取综合性、预防性的方法应对风险。从这一角度看，人的安全理论与第3条“以人民安全为宗旨”存在可以比较的问题：\u003c/p>\n\u003cul>\n\u003cli>安全最终保护谁；\u003c/li>\n\u003cli>国家安全与人的生活状态之间是什么关系；\u003c/li>\n\u003cli>传统军事安全能否穷尽现代安全问题；\u003c/li>\n\u003cli>是否需要采取跨领域、综合性和预防性的安全治理方式。\n但两者不能直接等同。“人的安全”主要以个人的生存、生活和尊严作为安全分析的中心对象；我国《国家安全法》则是在总体国家安全体系之内，将人民安全规定为国家安全工作的“宗旨”，同时还规定政治安全、经济安全以及其他国家重大利益。\n因此，更适宜将二者作为\u003cstrong>比较研究对象\u003c/strong>，而不宜直接进行概念同一化。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）本条在总则中的位置\u003c/h4>\n\u003cp>第3条位于第2条国家安全定义之后，同时处于国家安全领导体制、战略和工作原则之前，具有承上启下的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>第1条：为什么制定国家安全法\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第2条：什么是国家安全\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第3条：按照什么总体理念维护国家安全\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第4—5条：由什么领导和决策机制负责\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第6条：通过什么国家安全战略进行统筹\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第7—10条：维护国家安全遵循什么基本原则\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第二章：具体维护哪些领域的国家安全\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第三至五章：由谁负责、采取什么制度、如何提供保障\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>因此，第3条可以视为连接\u003cstrong>国家安全概念\u003c/strong>与\u003cstrong>具体国家安全制度\u003c/strong>的枢纽条款。\u003c/p>\n\u003chr>\n\u003ch4>（二）核心关联条文\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>第1条：立法目的。\u003c/strong> 与人民安全、政治安全和发展等价值目标相互衔接。\u003c/li>\n\u003cli>\u003cstrong>第2条：国家安全定义。\u003c/strong> 为总体国家安全观划定国家重大利益这一基本门槛。\u003c/li>\n\u003cli>\u003cstrong>第4—6条：领导体制与国家安全战略。\u003c/strong> 将总体国家安全观转化为组织和战略机制。\u003c/li>\n\u003cli>\u003cstrong>第7条：法治和人权保障。\u003c/strong> 对总体国家安全工作的实施手段形成法治约束。\u003c/li>\n\u003cli>\u003cstrong>第8条：安全关系的统筹。\u003c/strong> 是“总体”方法的重要法律展开。\u003c/li>\n\u003cli>\u003cstrong>第二章：各领域国家安全任务。\u003c/strong> 将“维护各领域国家安全”具体化。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>（三）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：总体国家安全观就是尽可能扩大国家安全范围。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> “总体”强调系统性、整体性和协调性，并不意味着所有风险都属于国家安全风险。具体事项仍须符合第2条关于国家重大利益的要求。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：五大要素就是五种并列的国家安全类型。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> “宗旨、根本、基础、保障、依托”分别具有不同功能，不能作为简单的并列分类理解。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：“政治安全为根本”意味着任何案件中政治安全都自动优先。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 这是政治安全在国家安全体系中的结构性定位，并不是个案法律适用中的自动优先规则。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：现行第3条规定“以军事、科技、文化、社会安全为保障”。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 现行法律原文是“以军事、文化、社会安全为保障”。后续总体国家安全观的理论和政策表述中可能加入科技安全，但不能因此改变现行法条文本。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：第3条可以直接作为采取国家安全措施的法律依据。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第3条属于指导性、原则性规范。具体公权力仍须依据专门的职权、实体和程序规定。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>“以人民安全为宗旨”如何取得更具体的规范意义？\u003c/strong>\u003cbr>在国家安全审查、风险管控或者危机处置中，能否将其转化为对人民生命、财产、基本权利和长期福祉的评价标准？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“政治安全为根本”在法律解释中具有何种效力？\u003c/strong>\u003cbr>它主要属于国家安全体系的结构性定位，还是能够进一步影响具体法律解释中的利益衡量？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>“总体”与“安全泛化”的边界在哪里？\u003c/strong>\u003cbr>系统性风险往往存在跨领域传导，但如果关联链条不断延伸，几乎所有经济社会活动都可能与国家安全建立联系。法律应当通过何种重大性、因果关系和风险程度标准控制这种扩张？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>不同国家安全领域之间应如何进行规范协调？\u003c/strong>\u003cbr>当同一事项同时涉及科技、经济、数据、网络和社会安全时，应适用何种法律规范？不同领域国家安全制度之间发生竞合时，应如何处理？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>总体国家安全观的发展与现行法律文本如何衔接？\u003c/strong>\u003cbr>后续政策文件和理论表述不断丰富总体国家安全观的领域和内容。在法律文本尚未修改的情况下，这些发展能够在多大程度上参与对第3条及其他条文的法律解释？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>人民安全与“人的安全”理论可以在哪些层面开展比较？\u003c/strong>\u003cbr>二者都关注人的安全以及跨领域风险，但具有不同的理论来源和制度结构。如何进行功能比较，同时避免简单的概念移植和概念等同？\u003c/p>\n\u003c/li>\n\u003c/ol>\n"},{"num":4,"label":"第四条","title":"国家安全领导体制","lawText":"坚持中国共产党对国家安全工作的领导，建立集中统一、高效权威的国家安全领导体制。","calloutHtml":"\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>领导原则：\u003c/strong> 坚持中国共产党对国家安全工作的领导。\u003c/li>\n\u003cli>\u003cstrong>体制目标：\u003c/strong> 建立“集中统一、高效权威”的国家安全领导体制。\u003c/li>\n\u003cli>\u003cstrong>体系分工：\u003c/strong> 第4条规定领导原则，第5条进一步规定中央国家安全领导机构的具体职责。\u003c/li>\n\u003cli>\u003cstrong>法治边界：\u003c/strong> 领导体制解决国家安全工作的统筹和决策问题；具体国家机关采取措施，仍须按照法定职权和程序进行。\u003c/li>\n\u003c/ul>\n\u003c/aside>","frontHtml":"\u003cdiv class=\"article-side article-front has-callout\">\u003cdiv class=\"article-label\">第四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>坚持中国共产党对国家安全工作的领导，建立集中统一、高效权威的国家安全领导体制。\u003c/p>\n\u003c/div>\u003caside class=\"article-callout\">\u003cp>\u003cstrong>📌 条文速览\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>领导原则：\u003c/strong> 坚持中国共产党对国家安全工作的领导。\u003c/li>\n\u003cli>\u003cstrong>体制目标：\u003c/strong> 建立“集中统一、高效权威”的国家安全领导体制。\u003c/li>\n\u003cli>\u003cstrong>体系分工：\u003c/strong> 第4条规定领导原则，第5条进一步规定中央国家安全领导机构的具体职责。\u003c/li>\n\u003cli>\u003cstrong>法治边界：\u003c/strong> 领导体制解决国家安全工作的统筹和决策问题；具体国家机关采取措施，仍须按照法定职权和程序进行。\u003c/li>\n\u003c/ul>\n\u003c/aside>\u003c/div>","backHtml":"\u003cdiv class=\"article-side article-back\">\u003cdiv class=\"article-label\">第四条\u003c/div>\u003cdiv class=\"article-law-text\">\u003cp>坚持中国共产党对国家安全工作的领导，建立集中统一、高效权威的国家安全领导体制。\u003c/p>\n\u003c/div>\u003cdiv class=\"article-note-divider\">国家安全领导体制 · MD 研读笔记\u003c/div>\u003cdiv class=\"article-notes\">\u003cp>本条规定国家安全工作的\u003cstrong>领导原则和领导体制\u003c/strong>，主要回答两个问题：\u003cstrong>国家安全工作由谁领导，以及国家安全领导体制应当具有何种基本特征。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 2013年：提出设立国家安全委员会\u003c/h4>\n\u003cp>2013年11月，党的十八届三中全会提出：\u003c/p>\n\u003cblockquote>\n\u003cp>“设立国家安全委员会，完善国家安全体制和国家安全战略，确保国家安全。”\u003c/p>\n\u003c/blockquote>\n\u003cp>这一制度安排与当时国家安全事务日益复杂、跨领域风险增加的背景密切相关。关于全面深化改革决定的说明进一步指出，当时我国面临对外维护国家主权、安全、发展利益和对内维护政治安全、社会稳定的双重压力，各类风险因素增多，既有安全工作体制机制需要进一步适应国家安全工作的需要，因此需要建立能够统筹国家安全工作的领导协调平台。\u003c/p>\n\u003ch4>2. 2014年：中央国家安全委员会的机构安排形成\u003c/h4>\n\u003cp>2014年1月24日，中共中央政治局召开会议，研究决定中央国家安全委员会设置。\n会议明确，中央国家安全委员会是\u003cstrong>中共中央关于国家安全工作的决策和议事协调机构\u003c/strong>，向中央政治局、中央政治局常务委员会负责，主要承担统筹协调涉及国家安全重大事项和重要工作的职责。\n这一制度安排使国家安全工作的集中统一领导具有相应的组织载体。\u003c/p>\n\u003cp>2014年4月15日，中央国家安全委员会第一次会议进一步提出总体国家安全观。国家安全工作的领导体制与总体国家安全观由此形成紧密联系：总体国家安全观要求统筹不同领域和不同类型的安全问题，相应也需要具有跨领域统筹能力的领导体制。\u003c/p>\n\u003ch4>3. 2015年：国家安全领导原则进入法律文本\u003c/h4>\n\u003cp>2015年《国家安全法》第4条明确规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“坚持中国共产党对国家安全工作的领导，建立集中统一、高效权威的国家安全领导体制。”\u003c/p>\n\u003c/blockquote>\n\u003cp>第5条紧接着规定中央国家安全领导机构负责国家安全工作的决策和议事协调，研究制定、指导实施国家安全战略和有关重大方针政策，统筹协调国家安全重大事项和重要工作，并推动国家安全法治建设。\n因此，第4条与第5条在体系上具有明显的递进关系：\n\u003cstrong>第4条：确立领导原则和体制要求\u003c/strong>\u003cbr>↓ \n\u003cstrong>第5条：规定中央国家安全领导机构的职责\u003c/strong>\u003c/p>\n\u003ch4>4. 2018年以后：党的领导取得更加明确的宪法文本依据\u003c/h4>\n\u003cp>这里需要作一个时间上的区分。\n《国家安全法》第4条制定于\u003cstrong>2015年\u003c/strong>。2018年宪法修改后，宪法第1条第2款进一步明确规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“中国共产党领导是中国特色社会主义最本质的特征。”\n因此，在理解现行第4条时，可以将其与现行宪法第1条结合进行体系解释。\n\u003cstrong>2015年《国家安全法》第4条在先，2018年相关内容明确写入宪法总纲在后。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，坚持中国共产党对国家安全工作的领导是本条首先确立的领导原则\u003c/h4>\n\u003cp>第4条首先规定“坚持中国共产党对国家安全工作的领导”，由此确定国家安全工作的总体领导原则。\n这一规定与第3条总体国家安全观之间具有内在联系。国家安全已经涉及政治、经济、军事、文化、社会、科技、网络等多个领域，单一部门难以独立处理涉及国家整体安全的重大问题，需要在总体层面形成统一的战略判断和重大决策。\n从本法结构看，第4条规定的是\u003cstrong>领导原则\u003c/strong>，第5条进一步规定中央国家安全领导机构的决策和议事协调职责，第三章则规定全国人大常委会、国务院、中央军事委员会、中央国家机关以及地方国家机关等主体维护国家安全的具体职责。\n因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>党的领导解决国家安全工作的总体方向和统筹问题，各国家机关则依照宪法和法律承担相应的国家安全职责。\u003c/strong>\n两者属于不同层次的规范安排。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二，“集中统一”强调重大国家安全事项的整体统筹\u003c/h4>\n\u003cp>“集中统一”主要针对国家安全事务的整体性和跨领域特征。\n现代国家安全问题往往同时涉及多个部门、地区和专业领域。例如，一项重大网络安全风险可能同时影响通信基础设施、金融运行、公共服务乃至军事安全。如果不同部门分别判断、分别行动而缺乏整体协调，就可能出现信息分散、政策目标不一致或者措施衔接不足的问题。\n因此，“集中统一”的核心功能在于：\u003c/p>\n\u003cul>\n\u003cli>统一国家安全工作的重大方向；\u003c/li>\n\u003cli>统筹重大国家安全战略和政策；\u003c/li>\n\u003cli>协调跨部门、跨地区、跨领域的重大事项；\u003c/li>\n\u003cli>形成不同国家安全力量之间的整体配合。\n第5条所规定的“统筹协调国家安全重大事项和重要工作”，正是“集中统一”要求在具体职责层面的体现。\u003c/li>\n\u003c/ul>\n\u003cp>需要注意：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>集中统一主要解决国家安全工作的总体决策和协调问题，并不意味着取消不同国家机关之间依法形成的职责分工。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三，“高效”强调国家安全决策和执行之间的有效衔接\u003c/h4>\n\u003cp>国家安全风险往往具有突发性、扩散性和高度不确定性。\n如果风险信息需要经过过长的传递链条，或者不同部门之间缺乏必要的协调机制，就可能影响风险识别、判断和应对的及时性。\n因此，“高效”要求国家安全领导体制能够使：\n\u003cstrong>信息及时汇集 → 风险综合研判 → 重大事项决策 → 任务分工 → 协同实施\u003c/strong>\n形成较为顺畅的工作链条。\u003c/p>\n\u003cp>从法律制度上看，“高效”并不是简单追求决策速度，而是要求减少不必要的协调成本，使不同主体能够按照既定职责及时形成行动。\n这一点尤其需要与第7条结合理解。第7条明确规定，维护国家安全应当遵守宪法和法律，坚持社会主义法治原则，尊重和保障人权，依法保护公民的权利和自由。\n因此：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>高效是国家安全工作的组织要求，并不意味着可以通过省略法定程序换取效率。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第四，“权威”强调重大国家安全决策具有统一贯彻和组织执行的保障\u003c/h4>\n\u003cp>国家安全事项通常跨越多个部门和领域，因此，仅有协调机制还不足以保证重大决策真正实施。\n“权威”主要体现为，国家安全重大决策和总体部署应当能够在相关领域得到贯彻落实，不因部门、地区或者事项分割而失去执行力。\n从这一角度看：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>集中统一\u003c/strong>解决“能否形成统一决策”；\u003c/li>\n\u003cli>\u003cstrong>高效\u003c/strong>解决“能否及时形成并实施决策”；\u003c/li>\n\u003cli>\u003cstrong>权威\u003c/strong>解决“重大决策能否得到有效贯彻”。\n三者共同构成国家安全领导体制的基本要求。\n但“权威”同样不能理解为具体机关可以超越法律行使权力。\n在法治结构中，重大决策形成之后，具体国家机关仍然需要按照法定职责和法定程序实施。第4条与第7条、第三章职责规定应当结合理解。\n因此：\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>领导体制的权威性体现为决策和协调的组织效力，不等于对具体国家机关法定权限边界的取消。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>四、法理与解释要点\u003c/h3>\n\u003ch4>1. 领导规范、组织规范与行为规范应当区分\u003c/h4>\n\u003cp>从规范性质来看，第4条主要属于\u003cstrong>领导原则和组织体制规范\u003c/strong>。\n它解决的是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全工作如何形成统一领导和整体协调。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>第5条进一步规定中央国家安全领导机构的职责，第三章规定有关国家机关承担的国家安全职责，而涉及检查、调查、审查、管控或者其他具体措施时，还需要依据相应的实体法和程序法规范。\n由此可以形成三个层次：\n\u003cstrong>领导规范：谁进行总体领导和统筹\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>职责规范：哪些机关承担哪些国家安全职责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>行为规范：具体机关在何种条件下可以采取什么措施\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>2. “集中统一”与“依法分工”具有不同功能\u003c/h4>\n\u003cp>国家安全事务具有整体性，因此需要集中统一的领导体制；国家治理又具有高度专业化特征，因此不同机关仍然需要依据法律进行专业分工。\n二者解决的是不同问题：\n\u003cstrong>集中统一解决国家安全工作的整体方向和重大事项协调；\u003c/strong>\n\u003cstrong>依法分工解决具体事务由谁负责以及如何承担责任。\u003c/strong>\n例如，第5条规定中央国家安全领导机构负责决策和议事协调，而第三章继续规定有关国家机关各自承担维护国家安全的职责。\n因此，国家安全领导体制可以概括为：&gt; \u003cstrong>集中统一领导 + 专业职责分工 + 跨部门协同。\u003c/strong>\n三者并不矛盾，而是现代综合性国家安全治理中不同层面的组织要求。\u003c/p>\n\u003chr>\n\u003ch4>3. “高效”与“依法运行”应当同时成立\u003c/h4>\n\u003cp>国家安全领域尤其容易出现“效率与程序”之间的张力。\n安全风险可能要求迅速反应，但现代法治同样要求公权力受到权限和程序约束。\n第4条强调“高效”，第7条紧接着强调依法维护国家安全以及人权保障。这种条文安排本身提示：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全工作的效率要求必须通过法治化的组织和程序机制实现。\u003c/strong>\n因此，提高效率的主要方向应当是：\u003c/p>\n\u003c/blockquote>\n\u003cul>\n\u003cli>完善信息共享；\u003c/li>\n\u003cli>明确职责界限；\u003c/li>\n\u003cli>优化协调程序；\u003c/li>\n\u003cli>建立紧急情况下的法定处置机制；\u003c/li>\n\u003cli>减少不同机关之间不必要的重复工作。\n而不能简单将“高效”理解为降低程序要求。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch4>4. 2018年宪法第1条与本条形成现行法上的体系联系\u003c/h4>\n\u003cp>现行宪法第1条规定“中国共产党领导是中国特色社会主义最本质的特征”。《国家安全法》第4条则在国家安全这一具体领域明确规定党的领导。\n从现行法律体系看，可以将二者理解为：\n\u003cstrong>宪法第1条：一般性的宪法原则\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>《国家安全法》第4条：在国家安全领域的具体化\u003c/strong>\n但需要继续区分国家安全工作的总体领导与具体国家机关依法行使职权两个层次。宪法同时规定国家机关的组织体系和职权结构，《国家安全法》第7条亦明确要求国家安全工作遵守宪法和法律。\n因此，对第4条进行体系解释时，应同时看到：\n\u003cstrong>党的领导原则 + 国家机关法定职责 + 公权力依法运行\u003c/strong>\n共同构成现行国家安全法治的组织结构。\u003c/p>\n\u003chr>\n\u003ch4>5. 比较法：跨部门协调是共同问题，但组织结构不可简单类比\u003c/h4>\n\u003cp>跨部门协调并非我国国家安全制度所独有的问题。\n美国现行《美国法典》第50编第3021节规定国家安全委员会（National Security Council）。其职能包括在总统领导下，就涉及国家安全的国内、外交和军事政策整合向总统提供建议，以促进武装力量及其他政府部门和机构更加有效地协作；同时还承担评估风险以及就共同安全事项提出政策建议等职能。\n这一制度可以说明一个具有比较意义的共同问题：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>现代国家安全事务具有跨部门特征，因此不同国家都需要建立某种高层级的安全政策协调机制。\u003c/strong>\n但比较时必须注意制度差异。美国国家安全委员会设置于总统行政体系，其法定职能以向总统提供建议、政策协调等为核心；我国第4、5条所形成的国家安全领导体制具有不同的宪制基础、政治结构和职责安排。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>五、体系联系与学习提示\u003c/h3>\n\u003ch4>（一）区分三个容易混淆的概念\u003c/h4>\n\u003ch5>1. 国家安全领导体制\u003c/h5>\n\u003cp>这是第4条规定的\u003cstrong>整体制度安排\u003c/strong>。\n关键词是：\u003cstrong>集中统一、高效权威。\u003c/strong>\n它描述的是国家安全工作总体如何领导和组织。\u003c/p>\n\u003ch5>2. 中央国家安全领导机构\u003c/h5>\n\u003cp>这是第5条规定的\u003cstrong>具体职责主体\u003c/strong>。\n第5条明确其主要职责包括：\u003c/p>\n\u003cul>\n\u003cli>国家安全工作的决策和议事协调；\u003c/li>\n\u003cli>研究制定、指导实施国家安全战略；\u003c/li>\n\u003cli>研究有关重大方针政策；\u003c/li>\n\u003cli>统筹协调国家安全重大事项和重要工作；\u003c/li>\n\u003cli>推动国家安全法治建设。\u003c/li>\n\u003c/ul>\n\u003ch5>3. 国家安全机关\u003c/h5>\n\u003cp>“国家安全机关”是有关法律中承担特定国家安全职责的\u003cstrong>专门国家机关\u003c/strong>，例如《反间谍法》所规定的国家安全机关。\u003c/p>\n\u003cp>因此三者不能混用：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>国家安全领导体制 ≠ 中央国家安全领导机构 ≠ 国家安全机关\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>（二）核心关联条文\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>第3条：总体国家安全观。\u003c/strong> 说明国家安全工作的总体指导思想。\u003c/li>\n\u003cli>\u003cstrong>第4条：国家安全领导体制。\u003c/strong> 规定谁领导以及领导体制的基本要求。\u003c/li>\n\u003cli>\u003cstrong>第5条：中央国家安全领导机构。\u003c/strong> 规定中央层面的决策和议事协调职责。\u003c/li>\n\u003cli>\u003cstrong>第6条：国家安全战略。\u003c/strong> 将国家安全总体领导转化为战略安排。\u003c/li>\n\u003cli>\u003cstrong>第7条：法治与人权保障。\u003c/strong> 明确国家安全工作运行的法律边界。\u003c/li>\n\u003cli>\u003cstrong>第三章：维护国家安全的职责。\u003c/strong> 对不同国家机关的具体职责进行分工。\u003c/li>\n\u003cli>\u003cstrong>第44—47条等：国家安全制度的实施机制。\u003c/strong> 进一步体现不同机关和地区之间的协调配合。\u003c/li>\n\u003c/ul>\n\u003cp>可以概括为：\u003c/p>\n\u003cp>\u003cstrong>第3条：指导思想\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第4条：领导体制\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第5条：中央领导机构职责\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第6条：国家安全战略\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第三章：国家机关职责分工\u003c/strong>\u003cbr>↓\u003cbr>\u003cstrong>第四章：具体制度运行\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch4>（三）易错点\u003c/h4>\n\u003cp>\u003cstrong>易错点1：第4条和第5条规定的是同一个问题。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第4条规定党的领导原则以及国家安全领导体制的总体要求，第5条进一步规定中央国家安全领导机构的具体职责。二者是“原则—职责”的关系。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点2：“集中统一”意味着所有国家安全事务都由中央国家安全领导机构直接办理。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 集中统一主要体现重大事项的决策和统筹协调。具体事务仍由有关国家机关按照法定职责办理。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点3：“高效”意味着紧急情况下可以不遵守法定程序。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 第7条明确要求维护国家安全遵守宪法和法律。“高效”主要要求通过完善组织、信息和协调机制提升效率，不能作为排除法定程序的依据。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点4：“权威”意味着国家安全领导体制可以取代具体法律授权。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> “权威”主要体现重大国家安全决策和部署的组织执行保障。涉及公民、组织权利义务的具体措施，仍须具有相应法律依据。\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>易错点5：“国家安全领导机构”和“国家安全机关”是同一个概念。\u003c/strong>\n\u003cstrong>纠正：\u003c/strong> 中央国家安全领导机构主要承担决策和议事协调职责；“国家安全机关”则是在有关法律框架下履行专门国家安全职责的国家机关，两者的性质和职能不同。\u003c/p>\n\u003chr>\n\u003ch3>六、研究问题\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>集中统一领导与专业分工如何协调？\u003c/strong>\u003cbr>国家安全问题日益专业化，既需要总体统筹，也需要外交、军事、经济、科技、网络等不同领域的专业判断。如何形成既统一又具有专业性的决策结构？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全领导机构的决策如何转化为具体国家机关的法律行为？\u003c/strong>\u003cbr>从国家安全重大决策到行政机关、司法机关或者其他主体具体实施，中间需要经过怎样的法定职责和程序机制？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何理解国家安全工作中的“高效”？\u003c/strong>\u003cbr>应当主要通过信息共享、联合研判、职责明确和程序优化提高效率，还是需要针对紧急国家安全风险建立特殊程序？特殊程序的法律边界如何确定？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>如何实现国家安全责任的可追溯性？\u003c/strong>\u003cbr>跨部门协同容易形成多个主体共同参与的决策结构。如何在集中统一和协同工作条件下明确不同主体的职责范围，并形成相应的责任机制？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>国家安全决策协调机构的比较法研究应选择何种比较单位？\u003c/strong>\u003cbr>与其单纯比较各国是否设有“国家安全委员会”，是否更应比较其组织地位、成员构成、决策权限、咨询功能、执行关系和法律责任？\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>第4条与第7条应如何进行体系解释？\u003c/strong>\u003cbr>“集中统一、高效权威”的领导体制要求，与“遵守宪法和法律、尊重和保障人权”的法治要求，应如何共同构成对国家安全治理的制度评价标准？\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"source\">\u003cp>\u003cstrong>参考书籍\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1.\u003c/strong>全国人大常委会法制工作委员会，乔晓阳主编：《中华人民共和国国家安全法释义》，法律出版社2016年3月第1版。\u003c/p>\n\u003cp>2.周尚君主编：《国家安全法释义与适用》，中国人民大学出版社2024年9月第1版。\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条规定国家安全工作的\u003cstrong>领导原则和领导体制\u003c/strong>，主要回答两个问题：\u003cstrong>国家安全工作由谁领导，以及国家安全领导体制应当具有何种基本特征。\u003c/strong>\u003c/p>\n\u003chr>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003ch4>1. 2013年：提出设立国家安全委员会\u003c/h4>\n\u003cp>2013年11月，党的十八届三中全会提出：\u003c/p>\n\u003cblockquote>\n\u003cp>“设立国家安全委员会，完善国家安全体制和国家安全战略，确保国家安全。”\u003c/p>\n\u003c/blockquote>\n\u003cp>这一制度安排与当时国家安全事务日益复杂、跨领域风险增加的背景密切相关。关于全面深化改革决定的说明进一步指出，当时我国面临对外维护国家主权、安全、发展利益和对内维护政治安全、社会稳定的双重压力，各类风险因素增多，既有安全工作体制机制需要进一步适应国家安全工作的需要，因此需要建立能够统筹国家安全工作的领导协调平台。\u003c/p>\n\u003ch4>2. 2014年：中央国家安全委员会的机构安排形成\u003c/h4>\n\u003cp>2014年1月24日，中共中央政治局召开会议，研究决定中央国家安全委员会设置。\n会议明确，中央国家安全委员会是\u003cstrong>中共中央关于国家安全工作的决策和议事协调机构\u003c/strong>，向中央政治局、中央政治局常务委员会负责，主要承担统筹协调涉及国家安全重大事项和重要工作的职责。\n这一制度安排使国家安全工作的集中统一领导具有相应的组织载体。\u003c/p>\n\u003cp>2014年4月15日，中央国家安全委员会第一次会议进一步提出总体国家安全观。国家安全工作的领导体制与总体国家安全观由此形成紧密联系：总体国家安全观要求统筹不同领域和不同类型的安全问题，相应也需要具有跨领域统筹能力的领导体制。\u003c/p>\n\u003ch4>3. 2015年：国家安全领导原则进入法律文本\u003c/h4>\n\u003cp>2015年《国家安全法》第4条明确规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“坚持中国共产党对国家安全工作的领导，建立集中统一、高效权威的国家安全领导体制。”\u003c/p>\n\u003c/blockquote>\n\u003cp>第5条紧接着规定中央国家安全领导机构负责国家安全工作的决策和议事协调，研究制定、指导实施国家安全战略和有关重大方针政策，统筹协调国家安全重大事项和重要工作，并推动国家安全法治建设。\n因此，第4条与第5条在体系上具有明显的递进关系：\n\u003cstrong>第4条：确立领导原则和体制要求\u003c/strong>\u003cbr>↓ \n\u003cstrong>第5条：规定中央国家安全领导机构的职责\u003c/strong>\u003c/p>\n\u003ch4>4. 2018年以后：党的领导取得更加明确的宪法文本依据\u003c/h4>\n\u003cp>这里需要作一个时间上的区分。\n《国家安全法》第4条制定于\u003cstrong>2015年\u003c/strong>。2018年宪法修改后，宪法第1条第2款进一步明确规定：\u003c/p>\n\u003cblockquote>\n\u003cp>“中国共产党领导是中国特色社会主义最本质的特征。”\n因此，在理解现行第4条时，可以将其与现行宪法第1条结合进行体系解释。\n\u003cstrong>2015年《国家安全法》第4条在先，2018年相关内容明确写入宪法总纲在后。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch3>三、主要内容\u003c/h3>\n\u003ch4>第一，坚持中国共产党对国家安全工作的领导是本条首先确立的领导原则\u003c/h4>\n
