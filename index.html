\u003c/p>\n\u003c/div>\u003c/div>\u003c/div>","notesHtml":"\u003cp>本条是第七章“附则”的唯一条文，也是全法最后一条。它确定本法的生效起点：\u003cstrong>2015年7月1日\u003c/strong>。\u003ca href=\"https://www.gjbmj.gov.cn/n1/2018/0601/c409088-30029401.html\">国家安全法及主席令第二十九号\u003c/a>\u003c/p>\n\u003ch3>二、立法沿革\u003c/h3>\n\u003cp>2015年7月1日，第十二届全国人民代表大会常务委员会第十五次会议通过本法；同日，国家主席签署第二十九号主席令予以公布，并自公布之日起施行。因此，本法的通过日、公布日和施行日在事实上为同一天，但三个概念分别对应立法表决、正式公布和开始发生法律效力。\u003c/p>\n\u003cp>书中援引当时《立法法》第57条说明法律应明确规定施行日期。2023年修改后，这一要求对应现行第61条，第62条另规定主席令载明制定机关、通过和施行日期等事项。条号更新不改变本法已经确定的施行日期。\u003ca href=\"https://commerce.suzhou.gov.cn/szsswj/fgyjd/202311/3ed461f6adc740b8a8dcf0d18a9d7b6a.shtml\">现行《立法法》第61、62条\u003c/a>\u003c/p>\n\u003ch3>三、主要内容\u003c/h3>\n\u003cp>\u003cstrong>1. “公布之日”指法定公布日期。\u003c/strong> 应结合主席令识别，而非根据读者看到法律的时间、某个网站转载的日期、教材出版时间或地方宣传活动日期确定。官方网站后来转载本法，不会使其重新生效。\u003c/p>\n\u003cp>\u003cstrong>2. 本法没有另外设置施行准备期。\u003c/strong> 法律可以规定公布即施行，也可以另定一个将来的施行日期；本法采用前者。各机关后续完善工作机制、制定配套规定、开展教育培训，属于法律实施过程，不构成全法须待配套齐备才生效的条件。\u003c/p>\n\u003cp>\u003cstrong>3. 附则具有法律效力。\u003c/strong> 附则是法律的组成部分，本条虽短，仍直接影响适用的时间界限。不能因为它位于正文最后，就把它当成不具规范效力的说明文字。\u003c/p>\n\u003cp>\u003cstrong>4. 施行日期与溯及力分别判断。\u003c/strong> 本条确定从何时开始施行，没有单独规定对先前行为一律追溯适用。现行《立法法》第104条规定不溯及既往的一般原则及保护权利利益的特别例外。具体案件涉及过去行为、持续行为或者之后新生的法律事实，应结合相应实体法、程序法和过渡规定分别判断。\u003ca href=\"https://commerce.suzhou.gov.cn/szsswj/fgyjd/202311/3ed461f6adc740b8a8dcf0d18a9d7b6a.shtml\">《立法法》第104条\u003c/a>\u003c/p>\n\u003ch3>四、比较法/法理\u003c/h3>\n\u003cp>\u003cstrong>施行日期服务于法律确定性。\u003c/strong> 公民和组织需要知道从何时起受新规范约束，国家机关也需要明确履职和判断行为的时间依据。公布即施行能够使法律立即进入实施状态；另设施行日期则可为制度衔接和行为调整提供准备时间。两种方式应依法律内容与实施需要选择，不能把其中一种理解为所有法律的固定规则。\u003c/p>\n\u003ch3>五、其他补充\u003c/h3>\n\u003cp>本条没有规定废止1993年《国家安全法》，原因是该法已由2014年《反间谍法》第40条明确同时废止。2015年本法建立总体国家安全的综合法律框架，与专门反间谍立法并行，不能仅凭名称相同把它理解为1993年法一直连续适用的版本。\u003ca href=\"https://qspfw.moe.gov.cn/html/aqjyr19/chapters_fjd_secrets.html\">2014年《反间谍法》第40条\u003c/a>\u003c/p>\n"}];

function stripHTML(s){const d=document.createElement('div');d.innerHTML=String(s||'');return (d.textContent||'').replace(/\s+/g,' ').trim()}
function normalizeSearch(s){return String(s||'').toLowerCase().replace(/[《》〈〉\s·，,。.;；:：()（）【】\[\]“”"']/g,'')}
function buildSearchIndex(){
  const rows=[];
  Object.entries(laws).forEach(([id,l])=>{
    rows.push({kind:'法律专题',title:l.title,snippet:l.desc,keywords:l.title+' '+l.label+' '+l.desc,href:'#/law/'+id});
    (l.cards||[]).forEach((c,i)=>rows.push({kind:l.title+' · 学习卡',title:c[2]||('知识卡 '+(i+1)),snippet:c[0]+' ｜ '+c[1],keywords:l.title+' '+c.join(' '),href:'#/law/'+id+'?card='+i}));
  });
  nationalArticles.forEach((a,i)=>rows.push({kind:'国家安全法 · 条文',title:a.label+' '+a.title,snippet:stripHTML(a.lawText).slice(0,150),keywords:'国家安全法 '+a.label+' 第'+a.num+'条 '+a.title+' '+stripHTML(a.lawText)+' '+stripHTML(a.notesHtml||''),href:'#/law/national?article='+i}));
  toolLawGroups.forEach(g=>g.items.forEach(x=>rows.push({kind:'工具法律 · '+g.group,title:x[0],snippet:x[2],keywords:g.group+' '+x.join(' '),href:'#/tools'})));
  comparativeGroups.forEach(g=>g.items.forEach(x=>rows.push({kind:'区域国别 · '+g.group,title:x[0],snippet:x[2],keywords:g.group+' '+x.join(' '),href:'#/comparative'})));
  fields.forEach((f,i)=>rows.push({kind:'总体国家安全观 · 重点领域',title:f[0],snippet:f[1]+' ｜ '+f[2],keywords:f.join(' '),href:'#/field/'+i}));
  Object.entries(theories).forEach(([id,t])=>rows.push({kind:'总体国家安全观 · 理论',title:t.title,snippet:t.subtitle,keywords:t.title+' '+t.subtitle+' '+t.items.flat().join(' '),href:'#/theory/'+id}));
  return rows;
}
let searchIndex=[],searchActive=0;
function getSearchIndex(){if(!searchIndex.length)searchIndex=buildSearchIndex();return searchIndex}
function scoreSearch(row,q){
  const nq=normalizeSearch(q), hay=normalizeSearch(row.keywords+' '+row.title);
  if(!nq)return 1;
  let score=hay.includes(nq)?100:0;
  const tokens=String(q).toLowerCase().split(/[\s，,。;；]+/).map(normalizeSearch).filter(Boolean);
  tokens.forEach(t=>{if(normalizeSearch(row.title).includes(t))score+=35;if(hay.includes(t))score+=12});
  const art=(q.match(/第?\s*(\d+)\s*条/)||[])[1];
  if(art && hay.includes('第'+art+'条'))score+=120;
  return score;
}
function renderSearch(q=''){
  const box=document.querySelector('#search-results'); if(!box)return;
  const rows=getSearchIndex().map(r=>({...r,_s:scoreSearch(r,q)})).filter(r=>r._s>0).sort((a,b)=>b._s-a._s).slice(0,40);
  searchActive=0;
  if(!rows.length){box.innerHTML='<div class="search-empty">没有找到匹配内容。可以换一个法律名称、条文号或主题关键词。</div>';return}
  box.innerHTML=rows.map((r,i)=>`<button class="search-result ${i===0?'active':''}" type="button" data-search-href="${r.href}"><span class="search-result-kind">${esc(r.kind)}</span><span class="search-result-title">${esc(r.title)}</span><span class="search-result-snippet">${esc(r.snippet)}</span></button>`).join('');
}
function openGlobalSearch(){
  const bg=document.querySelector('#search-backdrop'),input=document.querySelector('#global-search');
  bg.hidden=false; renderSearch(input.value); requestAnimationFrame(()=>input.focus());
}
function closeGlobalSearch(){document.querySelector('#search-backdrop').hidden=true;document.querySelector('#search-open')?.focus()}
function updateSearchActive(delta){
  const items=[...document.querySelectorAll('.search-result')];if(!items.length)return;
  items[searchActive]?.classList.remove('active');searchActive=(searchActive+delta+items.length)%items.length;items[searchActive].classList.add('active');items[searchActive].scrollIntoView({block:'nearest'});
}
function openSearchResult(el){
  const href=el?.dataset?.searchHref;if(!href)return;document.querySelector('#search-backdrop').hidden=true;
  if(location.hash===href){route()}else location.hash=href;
}
document.querySelector('#search-open').onclick=openGlobalSearch;
document.querySelector('#search-close').onclick=closeGlobalSearch;
document.querySelector('#search-backdrop').addEventListener('click',e=>{if(e.target.id==='search-backdrop')closeGlobalSearch()});
document.querySelector('#search-results').addEventListener('click',e=>{const b=e.target.closest('[data-search-href]');if(b)openSearchResult(b)});
document.querySelector('#global-search').addEventListener('input',e=>renderSearch(e.target.value));
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openGlobalSearch();return}
  if(document.querySelector('#search-backdrop').hidden)return;
  if(e.key==='Escape'){e.preventDefault();closeGlobalSearch()}
  else if(e.key==='ArrowDown'){e.preventDefault();updateSearchActive(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();updateSearchActive(-1)}
  else if(e.key==='Enter'){e.preventDefault();openSearchResult(document.querySelector('.search-result.active'))}
});

function route(){
  const raw=location.hash.slice(1)||'/', splitAt=raw.indexOf('?'), path=splitAt>=0?raw.slice(0,splitAt):raw, query=splitAt>=0?raw.slice(splitAt+1):'';
  const params=new URLSearchParams(query),parts=path.split('/');
  tab='overview';cardIndex=0;flipped=false;let label='首页';
  if(path==='/')home();
  else if(path==='/laws'){label='国家安全法律';app.innerHTML=head('国家安全法律','以概说把握全貌，以导图建立联系，以逐条 Anki 卡片进入规范细节。')+`<div class="content">${lawCards()}</div>`}
  else if(path==='/tools'){label='其他工具法律';directoryPage('tools')}
  else if(path==='/comparative'){label='他山之石';directoryPage('comparative')}
  else if(parts[1]==='law'&&laws[parts[2]]){
    activeLaw=parts[2];label='国家安全法律 / '+laws[activeLaw].title;
    if(params.has('article')&&activeLaw==='national'){const i=Number(params.get('article'));if(Number.isInteger(i)&&nationalArticles[i]){tab='cards';cardIndex=i}}
    else if(params.has('card')){const i=Number(params.get('card'));if(Number.isInteger(i)&&laws[activeLaw].cards[i]){tab='cards';cardIndex=i}}
    lawPage(activeLaw)
  }
  else if(parts[1]==='outlook'){label='总体国家安全观';app.innerHTML=head('总体国家安全观','从基本构成、统筹方法与重点领域理解整体框架。')+`<div class="content">${theoryCards()}${fieldGrid()}<div class="source"><a href="${sources.outlook}" target="_blank" rel="noopener">官方学习材料 ↗</a><p>重点领域按所引官方学习材料列示，国家安全的内涵与外延持续发展。</p></div></div>`}
  else if(parts[1]==='theory'&&theories[parts[2]]){label='总体国家安全观 / '+theories[parts[2]].title;theoryPage(parts[2])}
  else if(parts[1]==='field'&&/^\d+$/.test(parts[2])&&fields[+parts[2]]){label='总体国家安全观 / '+fields[+parts[2]][0];fieldPage(parts[2])}
  else{app.innerHTML=head('页面未找到','请返回首页选择学习专题。')}
  document.querySelector('#breadcrumb').textContent='学习空间 / '+label;
  document.title=label==='首页'?'国家安全法学 · 学习空间':label.split(' / ').pop()+' · 国家安全法学';
  document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active',a.hash===`#${path}`||(a.hash==='#/laws'&&parts[1]==='law')||(a.hash==='#/outlook'&&['theory','field'].includes(parts[1]))));
  window.scrollTo(0,0);if(path==='/outlook/fields')document.querySelector('#fields')?.scrollIntoView()
}

let siteScale=Number(localStorage.getItem('nsl-site-scale')||1);if(!Number.isFinite(siteScale))siteScale=1;siteScale=Math.min(1.3,Math.max(.8,siteScale));
function applySiteScale(){document.documentElement.style.setProperty('--site-scale',siteScale.toFixed(2));const el=document.querySelector('#font-scale-value');if(el)el.textContent=Math.round(siteScale*100)+'%';localStorage.setItem('nsl-site-scale',String(siteScale))}
document.querySelector('#font-dec').onclick=()=>{siteScale=Math.max(.8,Math.round((siteScale-.1)*10)/10);applySiteScale()};
document.querySelector('#font-inc').onclick=()=>{siteScale=Math.min(1.3,Math.round((siteScale+.1)*10)/10);applySiteScale()};
document.querySelector('#font-reset').onclick=()=>{siteScale=1;applySiteScale()};applySiteScale();
window.addEventListener('hashchange',route);route();
